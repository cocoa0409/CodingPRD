# =============================================================================
# Task 0567 — Extended-Stay & Corporate Housing (Sonder/Oakwood style)
# Seed tables (§1.0–§1.7). Expert difficulty.
# =============================================================================

scenario: |
  567. Extended-Stay & Corporate Housing (Sonder/Oakwood style): furnished-unit
  inventory & lease term (30+ day), monthly rate + utilities/cleaning, corporate
  master-lease & employee roster, mid-stay housekeeping, security deposit & damage,
  early-departure proration, 30-day tax exemption, turnover

domain_name: extended-stay
api_prefix: ""

# =============================================================================
# Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on MasterLease.version for renegotiation supersede
    - cascading_side_effects        # depart -> unit turnover; damage charge -> stay deposit -> invoice
    - dual_variant_calculation      # provisional vs final invoice; estimated vs final deposit refund
    - rate_threshold_triggers       # 30-day tax exemption boundary; 30-day minimum term boundary

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested URL ownership chains.
  # Every collection is a top-level path; children are discovered via filtered lists.

  state_machine_shape: cyclic
  # Unit: AVAILABLE -> OCCUPIED -> TURNOVER -> AVAILABLE (cycle).
  # MasterLease: ACTIVE <-> SUSPENDED (revision loop).
  # Stay branches ACTIVE -> {COMPLETED, COMPLETED_EARLY}.

  relationship_patterns:
    - one_to_many          # CorporateAccount -> Employee; CorporateAccount -> MasterLease; Unit -> Stay
    - cross_aggregate      # Stay references Unit, RatePlan, MasterLease, Employee across aggregates

  role_model: peer_roles
  # PropertyManager (operator) owns unit/housekeeping/damage/invoice/turnover surface;
  # CorporateAdmin owns its own account roster + corporate stays;
  # Employee is the resident acting on its own stay.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CorporateAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal name of the corporate tenant" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }

  - name: RatePlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rate plan label" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Furnished-unit monthly rent in cents", constraints: ">= 0" }
      - { name: utility_monthly_cents, type: integer, source: input, description: "Flat monthly utilities in cents", constraints: ">= 0" }
      - { name: cleaning_fee_cents, type: integer, source: input, description: "One-time turnover cleaning fee in cents, charged once per stay", constraints: ">= 0" }
      - { name: occupancy_tax_rate_bps, type: integer, source: input, description: "Occupancy/transient tax rate in basis points (1200 = 12%)", constraints: "0..10000" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unit label (e.g., 'Apt 4B')" }
      - { name: property_name, type: string, source: input, description: "Building / property name" }
      - { name: bedrooms, type: integer, source: input, description: "Bedroom count", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | TURNOVER", default: "AVAILABLE", constraints: "enum {AVAILABLE, OCCUPIED, TURNOVER}" }

  - name: MasterLease
    parent: null
    common_fields: true
    fields:
      - { name: corporate_account_id, type: string, source: input, description: "FK -> CorporateAccount.id; the corporate tenant holding this master lease" }
      - { name: committed_units, type: integer, source: input, description: "Number of simultaneous units the corporate account committed to (capacity cap)", constraints: ">= 1" }
      - { name: negotiated_monthly_rate_cents, type: integer, source: input, description: "Negotiated master-lease monthly rate in cents (supersedable via renegotiate)", constraints: ">= 0" }
      - { name: start_date, type: datetime, source: input, description: "Master-lease start (ISO 8601 UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Master-lease end (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED", default: "DRAFT", constraints: "enum {DRAFT, ACTIVE, SUSPENDED}" }
      - { name: units_consumed, type: integer, source: computed, description: "Count of Stays on this lease in status RESERVED or ACTIVE" }
      - { name: units_free, type: integer, source: computed, description: "committed_units - units_consumed; never negative" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: corporate_account_id, type: string, source: input, description: "FK -> CorporateAccount.id; roster owner" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: email, type: string, source: input, description: "Employee contact email" }

  - name: Stay
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the furnished unit occupied by this stay" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; pricing snapshot source for this stay" }
      - { name: master_lease_id, type: string, source: input, description: "FK -> MasterLease.id; null for retail (non-corporate) stays" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the resident; null for retail stays" }
      - { name: move_in, type: datetime, source: input, description: "Scheduled move-in date (ISO 8601 UTC), inclusive interval start" }
      - { name: planned_move_out, type: datetime, source: input, description: "Scheduled move-out date (ISO 8601 UTC), exclusive interval end" }
      - { name: actual_move_out, type: datetime, source: system, description: "Recorded departure date; null until departed" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | COMPLETED | COMPLETED_EARLY | CANCELLED", default: "RESERVED", constraints: "enum {RESERVED, ACTIVE, COMPLETED, COMPLETED_EARLY, CANCELLED}" }
      - { name: planned_nights, type: integer, source: computed, description: "Whole days between move_in and planned_move_out" }
      - { name: billable_nights, type: integer, source: computed, description: "Whole days between move_in and actual_move_out; null until departed" }
      - { name: deposit_held_cents, type: integer, source: input, description: "Security deposit collected at booking, in cents", constraints: ">= 0" }
      - { name: deposit_charged_cents, type: integer, source: computed, description: "Sum of amount_cents over this stay's DamageCharge rows in status CHARGED" }
      - { name: deposit_refundable_cents, type: integer, source: computed, description: "deposit_held_cents - deposit_charged_cents; never negative" }

  - name: HousekeepingVisit
    parent: null
    common_fields: true
    fields:
      - { name: stay_id, type: string, source: input, description: "FK -> Stay.id; the mid-stay this visit services" }
      - { name: scheduled_date, type: datetime, source: input, description: "Calendar date of the housekeeping visit (ISO 8601 UTC)" }
      - { name: visit_type, type: enum, source: input, description: "STANDARD | DEEP", default: "STANDARD", constraints: "enum {STANDARD, DEEP}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "enum {SCHEDULED, COMPLETED, CANCELLED}" }

  - name: DamageCharge
    parent: null
    common_fields: true
    fields:
      - { name: stay_id, type: string, source: input, description: "FK -> Stay.id; the stay whose deposit this charge draws against" }
      - { name: amount_cents, type: integer, source: input, description: "Assessed damage amount in cents", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Free-text damage description" }
      - { name: status, type: enum, source: system, description: "ASSESSED | DISPUTED | CHARGED | WAIVED", default: "ASSESSED", constraints: "enum {ASSESSED, DISPUTED, CHARGED, WAIVED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: stay_id, type: string, source: input, description: "FK -> Stay.id; the stay this invoice bills" }
      - { name: invoice_kind, type: enum, source: computed, description: "PROVISIONAL (at check-in) | FINAL (at departure)", constraints: "enum {PROVISIONAL, FINAL}" }
      - { name: nights_billed, type: integer, source: computed, description: "planned_nights while PROVISIONAL; billable_nights once FINAL" }
      - { name: rate_subtotal_cents, type: integer, source: computed, description: "Prorated rent + utilities, per-line rounded then summed" }
      - { name: cleaning_fee_cents, type: integer, source: computed, description: "One-time cleaning fee copied from the RatePlan" }
      - { name: occupancy_tax_cents, type: integer, source: computed, description: "Occupancy tax; 0 when nights_billed >= tax-exempt threshold" }
      - { name: amount_due_cents, type: integer, source: computed, description: "rate_subtotal_cents + cleaning_fee_cents + occupancy_tax_cents (rent obligation, excludes deposit)" }
      - { name: damage_total_cents, type: integer, source: computed, description: "Mirror of Stay.deposit_charged_cents at settlement" }
      - { name: total_settlement_cents, type: integer, source: computed, description: "amount_due_cents + damage_total_cents (everything the guest owes)" }
      - { name: deposit_refund_cents, type: integer, source: computed, description: "Stay.deposit_held_cents - damage_total_cents; never negative" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID", default: "DRAFT", constraints: "enum {DRAFT, ISSUED, PAID}" }

  - name: Turnover
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; the unit being turned over" }
      - { name: stay_id, type: string, source: system, description: "FK -> Stay.id; the outgoing stay that triggered turnover" }
      - { name: scheduled_date, type: datetime, source: system, description: "Turnover date = outgoing stay's actual_move_out" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED", default: "SCHEDULED", constraints: "enum {SCHEDULED, COMPLETED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Unit
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "POST /stays/{id}/check-in (system side effect on the stay's unit)"
        actor: PropertyManager
        preconditions:
          - "Unit.status == AVAILABLE"
        side_effects:
          - "Unit.status -> OCCUPIED"
      - from: OCCUPIED
        to: TURNOVER
        trigger: "POST /stays/{id}/depart (system side effect when the occupying stay completes)"
        actor: system
        preconditions:
          - "Unit.status == OCCUPIED"
        side_effects:
          - "Unit.status -> TURNOVER"
          - "A Turnover row (status SCHEDULED) is created for this Unit and the outgoing Stay (cascade hop 3)"
      - from: TURNOVER
        to: AVAILABLE
        trigger: "POST /turnovers/{id}/complete"
        actor: PropertyManager
        preconditions:
          - "Unit.status == TURNOVER"
          - "The Turnover row for this Unit is in status SCHEDULED"
        side_effects:
          - "Unit.status -> AVAILABLE"
          - "Turnover.status -> COMPLETED"

  - entity: MasterLease
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /master-leases/{id}/activate"
        actor: PropertyManager
        preconditions:
          - "MasterLease.status == DRAFT"
        side_effects:
          - "MasterLease.status -> ACTIVE"
          - "increments MasterLease.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /master-leases/{id}/suspend"
        actor: PropertyManager
        preconditions:
          - "MasterLease.status == ACTIVE"
        side_effects:
          - "MasterLease.status -> SUSPENDED"
          - "increments MasterLease.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /master-leases/{id}/resume"
        actor: PropertyManager
        preconditions:
          - "MasterLease.status == SUSPENDED"
        side_effects:
          - "MasterLease.status -> ACTIVE"
          - "increments MasterLease.version by 1"

  - entity: Stay
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, COMPLETED_EARLY, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /stays/{id}/check-in"
        actor: PropertyManager
        preconditions:
          - "Stay.status == RESERVED"
          - "Unit.status == AVAILABLE  (cross-entity: Stay depends on its Unit)"
          - "If master_lease_id is set: MasterLease.status == ACTIVE  (cross-entity)"
        side_effects:
          - "Stay.status -> ACTIVE"
          - "Unit.status -> OCCUPIED"
          - "A PROVISIONAL Invoice (status DRAFT) is created for the stay using planned_nights"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /stays/{id}/depart with actual_move_out >= planned_move_out"
        actor: "PropertyManager or Employee"
        preconditions:
          - "Stay.status == ACTIVE"
          - "actual_move_out >= move_in"
        side_effects:
          - "Stay.actual_move_out set; billable_nights computed"
          - "The stay's Invoice becomes FINAL and is recomputed with billable_nights, status -> ISSUED"
          - "Unit.status -> TURNOVER (cascade hop 2); a SCHEDULED Turnover row is created (cascade hop 3)"
      - from: ACTIVE
        to: COMPLETED_EARLY
        trigger: "POST /stays/{id}/depart with actual_move_out < planned_move_out"
        actor: "PropertyManager or Employee"
        preconditions:
          - "Stay.status == ACTIVE"
          - "actual_move_out >= move_in"
        side_effects:
          - "Stay.actual_move_out set; billable_nights computed (early-departure proration)"
          - "The stay's Invoice becomes FINAL and is recomputed with the prorated billable_nights, status -> ISSUED"
          - "Unit.status -> TURNOVER (cascade hop 2); a SCHEDULED Turnover row is created (cascade hop 3)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /stays/{id}/cancel"
        actor: "PropertyManager or CorporateAdmin"
        preconditions:
          - "Stay.status == RESERVED"
        side_effects:
          - "Stay.status -> CANCELLED"
          - "The PROVISIONAL Invoice, if any, is left DRAFT and no longer billable"
          - "MasterLease.units_consumed re-derived downward (releases the committed unit)"

  - entity: HousekeepingVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /housekeeping-visits/{id}/complete"
        actor: PropertyManager
        preconditions:
          - "HousekeepingVisit.status == SCHEDULED"
        side_effects:
          - "HousekeepingVisit.status -> COMPLETED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /housekeeping-visits/{id}/cancel"
        actor: "PropertyManager or Employee"
        preconditions:
          - "HousekeepingVisit.status == SCHEDULED"
        side_effects:
          - "HousekeepingVisit.status -> CANCELLED"

  - entity: DamageCharge
    field: status
    initial_state: ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: ASSESSED
        to: CHARGED
        trigger: "POST /damage-charges/{id}/charge"
        actor: PropertyManager
        preconditions:
          - "DamageCharge.status == ASSESSED"
          - "amount_cents <= Stay.deposit_refundable_cents  (would not overdraw the deposit)"
        side_effects:
          - "DamageCharge.status -> CHARGED"
          - "Stay.deposit_charged_cents += amount_cents; Stay.deposit_refundable_cents recomputed (cascade hop 2)"
          - "If the stay's Invoice is FINAL: damage_total_cents, total_settlement_cents, deposit_refund_cents recomputed (cascade hop 3)"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /damage-charges/{id}/dispute"
        actor: Employee
        preconditions:
          - "DamageCharge.status == ASSESSED"
        side_effects:
          - "DamageCharge.status -> DISPUTED"
      - from: DISPUTED
        to: CHARGED
        trigger: "POST /damage-charges/{id}/charge (dispute upheld against the guest)"
        actor: PropertyManager
        preconditions:
          - "DamageCharge.status == DISPUTED"
          - "amount_cents <= Stay.deposit_refundable_cents"
        side_effects:
          - "DamageCharge.status -> CHARGED"
          - "Stay.deposit_charged_cents += amount_cents; Stay.deposit_refundable_cents recomputed (cascade hop 2)"
          - "If the stay's Invoice is FINAL: damage_total_cents, total_settlement_cents, deposit_refund_cents recomputed (cascade hop 3)"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /damage-charges/{id}/waive (dispute resolved in guest's favor)"
        actor: PropertyManager
        preconditions:
          - "DamageCharge.status == DISPUTED"
        side_effects:
          - "DamageCharge.status -> WAIVED"
      - from: CHARGED
        to: WAIVED
        trigger: "POST /damage-charges/{id}/waive (reversal / compensation of a prior charge)"
        actor: PropertyManager
        preconditions:
          - "DamageCharge.status == CHARGED"
        side_effects:
          - "DamageCharge.status -> WAIVED"
          - "Stay.deposit_charged_cents -= amount_cents; Stay.deposit_refundable_cents recomputed (restores conserved deposit)"
          - "If the stay's Invoice is FINAL: damage_total_cents, total_settlement_cents, deposit_refund_cents recomputed"

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /stays/{id}/depart (system finalizes the stay's invoice)"
        actor: system
        preconditions:
          - "Invoice.status == DRAFT"
          - "The parent Stay transitions to COMPLETED or COMPLETED_EARLY"
        side_effects:
          - "invoice_kind -> FINAL; totals recomputed from billable_nights; status -> ISSUED"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: "PropertyManager or CorporateAdmin"
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "Invoice.status -> PAID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lease-renegotiate-stale-version
    parent_entity: MasterLease
    write_endpoint: "POST /master-leases/{id}/renegotiate"
    occ_field: "expected_master_lease_version"
    description: |
      Renegotiating a MasterLease whose version has advanced since the client
      last observed it is rejected. A renegotiation legitimately supersedes the
      prior negotiated_monthly_rate_cents; a second renegotiation carrying a
      version that predates an intervening activate/suspend/resume/renegotiate
      is operating on a stale view of the lease and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stay_nights
    trigger: "Stay create (planned_nights); Stay depart (billable_nights)"
    algorithm: aggregation
    formula: |
      planned_nights  = whole_days(planned_move_out - move_in)
      billable_nights = whole_days(actual_move_out - move_in)   # only after depart
      whole_days(a) = integer number of 24h days in the interval (calendar-date difference)
    input_set: "single Stay; dates are UTC midnights"
    precision: "integer days"

  - name: invoice_rate_proration
    trigger: "Invoice creation at check-in (PROVISIONAL) and finalization at depart (FINAL)"
    algorithm: tiered_pricing
    formula: |
      N = nights_billed                # planned_nights for PROVISIONAL, billable_nights for FINAL
      full_months = N // 30
      remainder   = N % 30
      # LINE ITEMS — each rounded independently (round_half_up) to the cent, THEN summed:
      line_rent_full    = round_half_up(monthly_rate_cents   * full_months)      # exact integer, listed for order clarity
      line_util_full    = round_half_up(utility_monthly_cents * full_months)
      line_rent_partial = round_half_up(monthly_rate_cents   * remainder / 30)
      line_util_partial = round_half_up(utility_monthly_cents * remainder / 30)
      rate_subtotal_cents = line_rent_full + line_util_full + line_rent_partial + line_util_partial
      # PINNED ORDER: round every line first, then add. NOT sum-then-round.
    input_set: "single Stay + its RatePlan (monthly_rate_cents, utility_monthly_cents)"
    constants:
      DAYS_PER_MONTH: 30
    precision: "per-line round_half_up to the cent, then integer summation"

  - name: occupancy_tax
    trigger: "Invoice creation and finalization"
    algorithm: threshold
    formula: |
      taxable_base = rate_subtotal_cents          # rent + utilities only; cleaning fee is NOT taxed
      if nights_billed >= TAX_EXEMPT_THRESHOLD_DAYS:
          occupancy_tax_cents = 0                  # 30-day (and longer) stays are tax-exempt
      else:
          occupancy_tax_cents = round_half_up(taxable_base * occupancy_tax_rate_bps / 10000)
    input_set: "single Invoice; nights_billed and rate_subtotal_cents from the same invoice"
    constants:
      TAX_EXEMPT_THRESHOLD_DAYS: 30
    precision: "round_half_up to the cent"
    variants:
      - name: taxed_short_stay
        when: "nights_billed < 30 (e.g., 29-night early departure)"
        difference: "tax charged at occupancy_tax_rate_bps on rate_subtotal_cents"
      - name: exempt_long_stay
        when: "nights_billed >= 30"
        difference: "occupancy_tax_cents forced to 0"

  - name: invoice_settlement
    trigger: "Invoice creation at check-in (provisional variant) and finalization at depart (final variant); recomputed on DamageCharge charge/waive"
    algorithm: aggregation
    formula: |
      amount_due_cents      = rate_subtotal_cents + cleaning_fee_cents + occupancy_tax_cents
      damage_total_cents    = Stay.deposit_charged_cents
      total_settlement_cents= amount_due_cents + damage_total_cents
      deposit_refund_cents  = max(0, Stay.deposit_held_cents - damage_total_cents)
    input_set: "single Invoice + its Stay + RatePlan"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at check-in; nights_billed = planned_nights, damage_total_cents = 0"
        difference: "projects the full committed term; no damages yet applied"
      - name: final
        when: "at depart; nights_billed = billable_nights (possibly prorated early)"
        difference: "re-bills on actual nights and folds in charged damages"

  - name: deposit_ledger
    trigger: "DamageCharge charge (ASSESSED/DISPUTED -> CHARGED) and waive (CHARGED -> WAIVED)"
    algorithm: aggregation
    formula: |
      deposit_charged_cents    = sum(dc.amount_cents for dc in DamageCharge where dc.stay_id == Stay.id and dc.status == CHARGED)
      deposit_refundable_cents = deposit_held_cents - deposit_charged_cents      # never negative
      # CONSERVATION INVARIANT (always holds):
      #   deposit_held_cents == deposit_refundable_cents + deposit_charged_cents
    input_set: "all DamageCharge rows of a Stay filtered to status == CHARGED"
    precision: "integer cents"
    variants:
      - name: estimated_refund
        when: "before any damage is charged (settlement projection)"
        difference: "equals deposit_held_cents in full"
      - name: final_refund
        when: "after damages resolved to CHARGED/WAIVED"
        difference: "equals deposit_held_cents - deposit_charged_cents"

  - name: master_lease_capacity
    trigger: "Stay create/cancel/check-in; read on GET /master-leases/{id}"
    algorithm: aggregation
    formula: |
      units_consumed = count(Stay where Stay.master_lease_id == MasterLease.id and Stay.status in {RESERVED, ACTIVE})
      units_free     = committed_units - units_consumed        # never negative
      # CONSERVATION INVARIANT: committed_units == units_consumed + units_free
    input_set: "all Stays on the lease filtered to status in {RESERVED, ACTIVE}"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and referenced FK resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Ownership: entity_backed actor owns the target (CorporateAdmin.X-User-ID == account of the resource; Employee.X-User-ID == stay.employee_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "CorporateAdmin/Employee scoped writes"

  - priority: 5
    category: business_constraint
    check: "Request body shape valid: required fields present, enums in range, dates parseable, pagination within [1,100]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all writes

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: business_referential
    check: "On check-in: referenced Unit is AVAILABLE (future bookings on an occupied unit are allowed; the unit must be free only at check-in time)"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /stays/{id}/check-in"

  - priority: 8
    category: business_referential
    check: "On corporate stay booking/check-in: referenced MasterLease is ACTIVE"
    error_id: ERR_MASTER_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /stays, POST /stays/{id}/check-in (when master_lease_id set)"

  - priority: 9
    category: business_referential
    check: "On housekeeping scheduling: referenced Stay is ACTIVE"
    error_id: ERR_STAY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /housekeeping-visits"

  - priority: 10
    category: business_temporal
    check: "Unit occupancy overlap: new [move_in, planned_move_out) must be separated from every non-cancelled stay on the same unit by >= TURNOVER_BUFFER_DAYS (adjacency forbidden)"
    error_id: ERR_UNIT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /stays"

  - priority: 11
    category: business_temporal
    check: "Employee double-booking: new [move_in, planned_move_out) must not half-open-overlap any non-cancelled stay of the same employee (adjacency allowed, no buffer)"
    error_id: ERR_EMPLOYEE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /stays (when employee_id set)"

  - priority: 12
    category: business_constraint
    check: "Date sanity: planned_move_out > move_in; on depart actual_move_out >= move_in"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /stays, POST /stays/{id}/depart"

  - priority: 13
    category: business_constraint
    check: "Minimum lease term: planned_nights >= MIN_LEASE_TERM_DAYS (30)"
    error_id: ERR_MIN_TERM_NOT_MET
    http_status: 422
    applies_to: "POST /stays"

  - priority: 14
    category: business_fiscal
    check: "Master-lease capacity: booking would not push units_consumed above committed_units"
    error_id: ERR_MASTER_LEASE_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /stays (when master_lease_id set)"

  - priority: 15
    category: business_fiscal
    check: "Damage charge would not overdraw the deposit: amount_cents <= Stay.deposit_refundable_cents"
    error_id: ERR_DAMAGE_EXCEEDS_DEPOSIT
    http_status: 402
    applies_to: "POST /damage-charges/{id}/charge"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_master_lease_version matches current MasterLease.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /master-leases/{id}/renegotiate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- CorporateAccount ---
  - method: POST
    path: "/corporate-accounts"
    description: "Onboard a corporate account"
    roles: [PropertyManager]
    code: 201
    input: [company_name, billing_email]
    output: CorporateAccount
    side_effects: []
  - method: GET
    path: "/corporate-accounts/{id}"
    description: "Get a corporate account"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: []

  # --- RatePlan ---
  - method: POST
    path: "/rate-plans"
    description: "Create a rate plan"
    roles: [PropertyManager]
    code: 201
    input: [name, monthly_rate_cents, utility_monthly_cents, cleaning_fee_cents, occupancy_tax_rate_bps]
    output: RatePlan
    side_effects: []
  - method: GET
    path: "/rate-plans/{id}"
    description: "Get a rate plan"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: RatePlan
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/units"
    description: "Add a furnished unit to inventory (status AVAILABLE)"
    roles: [PropertyManager]
    code: 201
    input: [name, property_name, bedrooms]
    output: Unit
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/units/{id}"
    description: "Get a unit"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: Unit
    side_effects: []

  # --- MasterLease ---
  - method: POST
    path: "/master-leases"
    description: "Create a master lease (status DRAFT)"
    roles: [PropertyManager]
    code: 201
    input: [corporate_account_id, committed_units, negotiated_monthly_rate_cents, start_date, end_date]
    output: MasterLease
    side_effects: ["status=DRAFT, version=1, units_consumed=0, units_free=committed_units"]
  - method: GET
    path: "/master-leases/{id}"
    description: "Get a master lease"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: MasterLease
    side_effects: []
  - method: GET
    path: "/master-leases"
    description: "List master leases (reverse-reachability for CorporateAccount)"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: ["corporate_account_id?", "status?", "limit?", "offset?"]
    output: MasterLease[]
    side_effects: []
  - method: POST
    path: "/master-leases/{id}/activate"
    description: "Activate a DRAFT master lease"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MasterLease
    side_effects: ["status DRAFT->ACTIVE", "increments MasterLease.version by 1"]
  - method: POST
    path: "/master-leases/{id}/suspend"
    description: "Suspend an ACTIVE master lease"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MasterLease
    side_effects: ["status ACTIVE->SUSPENDED", "increments MasterLease.version by 1"]
  - method: POST
    path: "/master-leases/{id}/resume"
    description: "Resume a SUSPENDED master lease"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MasterLease
    side_effects: ["status SUSPENDED->ACTIVE", "increments MasterLease.version by 1"]
  - method: POST
    path: "/master-leases/{id}/renegotiate"
    description: "Renegotiate the monthly rate (supersede). OCC-guarded on MasterLease.version."
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: [expected_master_lease_version, negotiated_monthly_rate_cents]
    output: MasterLease
    side_effects: ["negotiated_monthly_rate_cents replaced (supersede)", "increments MasterLease.version by 1"]

  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Add an employee to a corporate account roster (CorporateAdmin must own the account)"
    roles: [CorporateAdmin]
    code: 201
    input: [corporate_account_id, full_name, email]
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees/{id}"
    description: "Get an employee"
    roles: [CorporateAdmin, PropertyManager]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List employees (reverse-reachability for CorporateAccount)"
    roles: [CorporateAdmin, PropertyManager]
    code: 200
    input: ["corporate_account_id?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # --- Stay ---
  - method: POST
    path: "/stays"
    description: "Book a stay (RESERVED). Corporate stays supply master_lease_id + employee_id; retail stays omit both."
    roles: [PropertyManager, CorporateAdmin]
    code: 201
    input: [unit_id, rate_plan_id, move_in, planned_move_out, deposit_held_cents, "master_lease_id?", "employee_id?"]
    output: Stay
    side_effects: ["status=RESERVED", "planned_nights computed", "deposit_charged_cents=0, deposit_refundable_cents=deposit_held_cents", "MasterLease.units_consumed/units_free re-derived when master_lease_id set"]
  - method: GET
    path: "/stays/{id}"
    description: "Get a stay"
    roles: [PropertyManager, CorporateAdmin, Employee]
    code: 200
    input: []
    output: Stay
    side_effects: []
  - method: GET
    path: "/stays"
    description: "List stays (reverse-reachability for Unit, RatePlan, Employee, MasterLease)"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: ["unit_id?", "rate_plan_id?", "employee_id?", "master_lease_id?", "status?", "limit?", "offset?"]
    output: Stay[]
    side_effects: []
  - method: POST
    path: "/stays/{id}/check-in"
    description: "Check in a RESERVED stay (activates it, occupies the unit, creates a provisional invoice)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Stay
    side_effects: ["Stay RESERVED->ACTIVE", "Unit AVAILABLE->OCCUPIED", "PROVISIONAL Invoice (DRAFT) created"]
  - method: POST
    path: "/stays/{id}/depart"
    description: "Record departure. actual_move_out < planned_move_out triggers early-departure proration."
    roles: [PropertyManager, Employee]
    code: 200
    input: [actual_move_out]
    output: Stay
    side_effects: ["Stay ACTIVE->COMPLETED or COMPLETED_EARLY", "Invoice finalized (FINAL, ISSUED)", "Unit OCCUPIED->TURNOVER", "SCHEDULED Turnover row created"]
  - method: POST
    path: "/stays/{id}/cancel"
    description: "Cancel a RESERVED stay"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: Stay
    side_effects: ["Stay RESERVED->CANCELLED", "MasterLease.units_consumed re-derived downward"]

  # --- HousekeepingVisit ---
  - method: POST
    path: "/housekeeping-visits"
    description: "Schedule a mid-stay housekeeping visit (stay must be ACTIVE)"
    roles: [PropertyManager, Employee]
    code: 201
    input: [stay_id, scheduled_date, "visit_type?"]
    output: HousekeepingVisit
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/housekeeping-visits/{id}"
    description: "Get a housekeeping visit"
    roles: [PropertyManager, Employee]
    code: 200
    input: []
    output: HousekeepingVisit
    side_effects: []
  - method: GET
    path: "/housekeeping-visits"
    description: "List housekeeping visits (reverse-reachability for Stay)"
    roles: [PropertyManager, Employee]
    code: 200
    input: ["stay_id?", "status?", "limit?", "offset?"]
    output: HousekeepingVisit[]
    side_effects: []
  - method: POST
    path: "/housekeeping-visits/{id}/complete"
    description: "Mark a housekeeping visit completed"
    roles: [PropertyManager]
    code: 200
    input: []
    output: HousekeepingVisit
    side_effects: ["status SCHEDULED->COMPLETED"]
  - method: POST
    path: "/housekeeping-visits/{id}/cancel"
    description: "Cancel a scheduled housekeeping visit"
    roles: [PropertyManager, Employee]
    code: 200
    input: []
    output: HousekeepingVisit
    side_effects: ["status SCHEDULED->CANCELLED"]

  # --- DamageCharge ---
  - method: POST
    path: "/damage-charges"
    description: "Assess a damage against a stay's deposit (status ASSESSED)"
    roles: [PropertyManager]
    code: 201
    input: [stay_id, amount_cents, description]
    output: DamageCharge
    side_effects: ["status=ASSESSED"]
  - method: GET
    path: "/damage-charges/{id}"
    description: "Get a damage charge"
    roles: [PropertyManager, Employee]
    code: 200
    input: []
    output: DamageCharge
    side_effects: []
  - method: GET
    path: "/damage-charges"
    description: "List damage charges (reverse-reachability for Stay)"
    roles: [PropertyManager, Employee]
    code: 200
    input: ["stay_id?", "status?", "limit?", "offset?"]
    output: DamageCharge[]
    side_effects: []
  - method: POST
    path: "/damage-charges/{id}/charge"
    description: "Charge an assessed/disputed damage against the deposit"
    roles: [PropertyManager]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status ASSESSED|DISPUTED->CHARGED", "Stay deposit ledger recomputed", "FINAL invoice settlement recomputed"]
  - method: POST
    path: "/damage-charges/{id}/dispute"
    description: "Guest disputes an assessed damage"
    roles: [Employee]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status ASSESSED->DISPUTED"]
  - method: POST
    path: "/damage-charges/{id}/waive"
    description: "Waive a disputed or already-charged damage (reversal restores deposit)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status DISPUTED|CHARGED->WAIVED", "if reversing a CHARGED: Stay deposit ledger restored, FINAL invoice recomputed"]

  # --- Invoice ---
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices (reverse-reachability for Stay)"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: ["stay_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an issued invoice"
    roles: [PropertyManager, CorporateAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED->PAID"]

  # --- Turnover ---
  - method: GET
    path: "/turnovers/{id}"
    description: "Get a turnover record"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Turnover
    side_effects: []
  - method: GET
    path: "/turnovers"
    description: "List turnovers (reverse-reachability for Unit and Stay)"
    roles: [PropertyManager]
    code: 200
    input: ["unit_id?", "stay_id?", "status?", "limit?", "offset?"]
    output: Turnover[]
    side_effects: []
  - method: POST
    path: "/turnovers/{id}/complete"
    description: "Complete a turnover, returning the unit to AVAILABLE"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Turnover
    side_effects: ["Turnover SCHEDULED->COMPLETED", "Unit TURNOVER->AVAILABLE"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed actor does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced FK resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, unparseable date, out-of-range value" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set (e.g., visit_type)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit or offset outside [1,100] / [0,inf)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Referenced unit is not AVAILABLE at booking or check-in" }
  - { id: ERR_MASTER_LEASE_NOT_ACTIVE, http: 409, condition: "Referenced master lease is not ACTIVE for a corporate stay" }
  - { id: ERR_STAY_NOT_ACTIVE, http: 409, condition: "Housekeeping scheduled against a stay that is not ACTIVE" }
  - { id: ERR_UNIT_TIME_CONFLICT, http: 409, condition: "New stay collides with another stay on the same unit within the turnover buffer" }
  - { id: ERR_EMPLOYEE_DOUBLE_BOOKED, http: 409, condition: "New stay overlaps another stay of the same employee" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "planned_move_out <= move_in, or actual_move_out < move_in" }
  - { id: ERR_MIN_TERM_NOT_MET, http: 422, condition: "planned_nights < 30 (minimum lease term)" }
  - { id: ERR_MASTER_LEASE_CAP_EXCEEDED, http: 402, condition: "Booking would push units_consumed above committed_units" }
  - { id: ERR_DAMAGE_EXCEEDS_DEPOSIT, http: 402, condition: "Damage charge amount exceeds the stay's refundable deposit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_master_lease_version does not match current MasterLease.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Property operator. Manages inventory, rate plans, corporate accounts, master leases, stays lifecycle (check-in/turnover), housekeeping completion, damage assessment/charge, invoicing."
    identity: "opaque"
    exclusive_operations:
      - "POST /corporate-accounts"
      - "POST /rate-plans"
      - "POST /units"
      - "POST /master-leases and activate/suspend/resume"
      - "POST /stays/{id}/check-in"
      - "POST /damage-charges and /charge and /waive"
      - "POST /housekeeping-visits/{id}/complete"
      - "POST /turnovers/{id}/complete"
    shared_operations:
      - "POST /master-leases/{id}/renegotiate (with CorporateAdmin)"
      - "POST /stays (with CorporateAdmin)"
      - "POST /stays/{id}/depart (with Employee)"
      - "POST /stays/{id}/cancel (with CorporateAdmin)"
      - "POST /housekeeping-visits and /cancel (with Employee)"
      - "POST /invoices/{id}/pay (with CorporateAdmin)"
      - "GET reads across all collections"

  - name: CorporateAdmin
    description: "Administrator of one corporate account. Manages its employee roster, books/cancels corporate stays, renegotiates and pays its master lease."
    identity: "entity_backed:CorporateAccount"
    exclusive_operations:
      - "POST /employees (on own corporate_account_id)"
    shared_operations:
      - "POST /master-leases/{id}/renegotiate (own lease; with PropertyManager)"
      - "POST /stays (own master lease/employees; with PropertyManager)"
      - "POST /stays/{id}/cancel (own; with PropertyManager)"
      - "POST /invoices/{id}/pay (own; with PropertyManager)"
      - "GET reads scoped to own account resources"

  - name: Employee
    description: "Corporate resident. Acts on their own stay: records early departure, schedules/cancels mid-stay housekeeping, disputes damage charges."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /damage-charges/{id}/dispute (own stay)"
    shared_operations:
      - "POST /stays/{id}/depart (own stay; with PropertyManager)"
      - "POST /housekeeping-visits and /cancel (own stay; with PropertyManager)"
      - "GET own stay / housekeeping / damage reads"
