  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: family_review_cycle
        grounds:
          - state_machines.Family.UNDER_REVIEW_to_REFERRED
          - state_machines.Family.REFERRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Family machine is cyclic: UNDER_REVIEW -> REFERRED -> UNDER_REVIEW
          loops arbitrarily many times. Each loop writes a FamilyAuditEvent but
          does NOT advance verified_at. Termination is via VERIFIED or REJECTED.
        test_recipe:
          setup:
            - "campaign in INTAKE_OPEN; one family referred"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0, privacy_mode: "STRICT" }
