              payload: { decision: "REQUEST_REVISION", decision_note: "Net price too aggressive for Q3" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
            - call: "POST /nac/deviation-agreements/${dev_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev_id}/manufacturer-decision"
              payload: { decision: "REQUEST_REVISION", decision_note: "Still short of program funding" }
              as: ManufacturerRep
              as_user_id: "${mfg_id}"
            - call: "POST /nac/deviation-agreements/${dev_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nac/deviation-agreements/${dev_id}/manufacturer-decision"
              payload: { decision: "REQUEST_REVISION", decision_note: "Third pass requested" }
