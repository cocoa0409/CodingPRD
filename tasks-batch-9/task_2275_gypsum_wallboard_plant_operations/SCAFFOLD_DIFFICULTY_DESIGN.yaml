              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b1_id}/stucco-tests"
              payload: { sample_seq: 1, combined_water_pct: 5.60, free_water_pct: 0.18, set_time_minutes: 7.50, normal_consistency_cc: 78.0 }
              as: QualityInspector
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T15:00:00Z", feed_window_end: "2026-08-02T19:00:00Z" }
              as: MaterialsController
              captures: { b2_id: $.data.id }
            - call: "GET /plant-ops/gypsum-lots/${lot_a_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_a_v3: $.data.version }
            - call: "POST /plant-ops/calciner-batches/${b2_id}/feeds"
              payload: { lot_id: "${lot_a_id}", tons_fed: 120.000, measured_free_moisture_pct: 9.40, expected_lot_version: "${lot_a_v3}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches/${b2_id}/close-feed"
