# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Private Disability Income Insurance — Expert
# 9 rule_ids x >= 2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: residual_factor_proportionate_vs_presumptive_total
        grounds:
          - calculations.residual_benefit_factor
          - entities.BenefitPeriod.fields.benefit_fraction
          - entities.IncomeReport.fields.income_loss_ratio
          - entities.Policy.fields.occupation_definition
        distinguishing_aspect: |
          Same R=0.50 income-loss ratio on the IncomeReport income domain yields benefit_fraction
          0.5 under the proportionate variant (ANY_OCC) but 1.0 under the presumptive_total variant
          (OWN_OCC inside the own-occ window) — divergence on the Claim/IncomeReport entity domain.
        test_recipe:
          setup:
            - "Insurer at month 5 (>= elimination_satisfied_month 3)."
            - "Policyholder pre_disability_monthly_income_cents = 1000000."
            - "Two ACTIVE policies under one MEDIUM occupation class: P_any (ANY_OCC) and P_own (OWN_OCC, own_occ_window_months 24), both monthly_benefit_cents 500000, no COLA, elimination_period_days 90, benefit_period_months 12."
            - "Two RESIDUAL claims (one per policy) approved, each with one IncomeReport effective_month 3, current_monthly_income_cents 500000 (R=0.50)."
            - "One BenefitPeriod accrued at coverage_month 3 on each claim."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "DV1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH One", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_any_id: $.data.id }
            - call: "POST /disability/policies/${p_any_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "OWN_OCC", own_occ_window_months: 24, cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_own_id: $.data.id }
            - call: "POST /disability/policies/${p_own_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_any_id}", disability_onset_month: 0, claimed_disability_type: "RESIDUAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_any_id: $.data.id, c_any_v: $.data.version }
            - call: "POST /disability/claims/${c_any_id}/income-reports"
              payload: { effective_month: 3, current_monthly_income_cents: 500000, expected_claim_version: "${c_any_v}" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_any_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_any_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_any_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_own_id}", disability_onset_month: 0, claimed_disability_type: "RESIDUAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_own_id: $.data.id, c_own_v: $.data.version }
            - call: "POST /disability/claims/${c_own_id}/income-reports"
              payload: { effective_month: 3, current_monthly_income_cents: 500000, expected_claim_version: "${c_own_v}" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_own_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_own_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_own_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_any_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { bp_any_id: $.data.id }
            - call: "POST /disability/claims/${c_own_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { bp_own_id: $.data.id }
          assert:
            - "BenefitPeriod.${bp_any_id}.benefit_fraction == 0.5"
            - "BenefitPeriod.${bp_any_id}.gross_benefit_cents == 250000"
            - "BenefitPeriod.${bp_own_id}.benefit_fraction == 1.0"
            - "BenefitPeriod.${bp_own_id}.gross_benefit_cents == 500000"

      - name: net_benefit_provisional_vs_final_offset
        grounds:
          - calculations.net_benefit_cents
          - entities.OffsetAward.fields.status
          - entities.ClaimLedger.fields.overpayment_balance_cents
          - state_machines.OffsetAward.transitions.ESTIMATED_to_FINALIZED
        distinguishing_aspect: |
          The same BenefitPeriod's net_benefit_cents is 380000 against an ESTIMATED 120000 SSDI offset
          (provisional variant) but 300000 once the offset is FINALIZED at final_monthly_offset_cents 200000
          (final variant), with the 80000 delta booked to overpayment_balance_cents — divergence on the
          BenefitPeriod/OffsetAward ledger domain, distinct from the residual income-loss domain above.
        test_recipe:
          setup:
            - "Insurer at month 5; ACTIVE ANY_OCC TOTAL policy, monthly_benefit_cents 500000, no COLA, elimination 90d, benefit_period_months 12."
            - "Approved TOTAL claim; one BenefitPeriod accrued at coverage_month 3 (gross 500000)."
            - "One SSDI OffsetAward ESTIMATED monthly_offset_cents 120000 over [3,5]."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "DV2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH Two", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { bp_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 120000, start_month: 3, end_month: 5 }
              as: ClaimsAdjudicator
              captures: { oa_id: $.data.id }
          trigger:
            - call: "POST /disability/offset-awards/${oa_id}/finalize"
              payload: { final_monthly_offset_cents: 200000 }
              as: ClaimsAdjudicator
            - call: "GET /disability/benefit-periods/${bp_id}"
              payload: {}
              as: ClaimsAdjudicator
              captures: { net_after: $.data.net_benefit_cents }
            - call: "GET /disability/claims/${c_id}/ledger"
              payload: {}
              as: ClaimsAdjudicator
              captures: { overpay_after: "$.data[0].overpayment_balance_cents" }
          assert:
            - "Before finalize, BenefitPeriod.${bp_id}.net_benefit_cents == 380000 (provisional, gross 500000 - estimated 120000)"
            - "After finalize, OffsetAward.${oa_id}.status == FINALIZED"
            - "After finalize, BenefitPeriod.${bp_id}.net_benefit_cents == 300000 (final, gross 500000 - 200000)"
            - "After finalize, ClaimLedger for ${c_id} overpayment_balance_cents == 80000 (final 200000 - estimated 120000 over one covered accrued month)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cola_compound_capped_gross_benefit
        grounds:
          - calculations.gross_benefit_cents
          - entities.Policy.fields.cola_annual_rate
          - entities.Policy.fields.cola_rider
          - entities.BenefitPeriod.fields.gross_benefit_cents
        distinguishing_aspect: |
          Mode (a): gross_benefit_cents combines >=3 inputs (monthly_benefit_cents, cola_annual_rate,
          years_elapsed) with a nested min() against MAX_COLA_MULTIPLIER and a branch on cola_rider —
          1.03^2 compounding gives cola_adjusted 530450 at year 2, but 1.10^8 is capped at 2.0x = 1000000.
        test_recipe:
          setup:
            - "Insurer; clock advanced so coverage months 27 (year 2) and 99 (year 8) are reachable and proof-current."
            - "ACTIVE ANY_OCC TOTAL policy, monthly_benefit_cents 500000, cola_rider true, cola_annual_rate 0.03, elimination 90d (elim_sat=3), benefit_period_months 120."
            - "Approved TOTAL claim; disability proofs kept current up to month 27."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "CF1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 30 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 240, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CF1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 120, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: true, cola_annual_rate: 0.03 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 6, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 9, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 12, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 15, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 18, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 21, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 24, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/disability-proofs"
              payload: { attestation_month: 27, still_disabled: true }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 27 }
              as: ClaimsAdjudicator
              captures: { bp_y2_id: $.data.id }
          assert:
            - "BenefitPeriod.${bp_y2_id}.gross_benefit_cents == 530450 (500000 * round_half_up(1.03^2=1.0609) -> cola_adjusted 530450, fraction 1.0)"
            - "years_elapsed for coverage_month 27 == floor((27-3)/12) == 2"

      - name: net_benefit_pinned_evaluation_order_waterfall
        grounds:
          - calculations.net_benefit_cents
          - calculations.gross_benefit_cents
          - calculations.residual_benefit_factor
          - entities.BenefitPeriod.fields.net_benefit_cents
        distinguishing_aspect: |
          Mode (c): net depends on gross, gross depends on benefit_fraction, and offset_applied depends on
          gross indirectly via the floor — the scaffold pins evaluation order (fraction -> gross -> offset
          -> max(0,gross-offset)). With gross 250000 (residual 0.5) and a 300000 offset, the pinned order
          floors net at 0 rather than producing a negative number.
        test_recipe:
          setup:
            - "Insurer at month 5; ACTIVE ANY_OCC RESIDUAL policy, monthly_benefit_cents 500000, no COLA, elimination 90d, benefit_period_months 12."
            - "Approved RESIDUAL claim with IncomeReport effective_month 3 current 500000 (R=0.50 -> fraction 0.5, gross 250000)."
            - "SSDI OffsetAward ESTIMATED 300000 over [3,5]."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "CF2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CF2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "RESIDUAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /disability/claims/${c_id}/income-reports"
              payload: { effective_month: 3, current_monthly_income_cents: 500000, expected_claim_version: "${c_v}" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 300000, start_month: 3, end_month: 5 }
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { bp_id: $.data.id }
          assert:
            - "BenefitPeriod.${bp_id}.benefit_fraction == 0.5"
            - "BenefitPeriod.${bp_id}.gross_benefit_cents == 250000"
            - "BenefitPeriod.${bp_id}.offset_applied_cents == 300000"
            - "BenefitPeriod.${bp_id}.net_benefit_cents == 0 (floored, not -50000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_revision_loop_under_review_pending_info_cycle
        grounds:
          - state_machines.Claim.transitions.UNDER_REVIEW_to_PENDING_INFO
          - state_machines.Claim.transitions.PENDING_INFO_to_UNDER_REVIEW
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Claim is cyclic: UNDER_REVIEW -> PENDING_INFO -> UNDER_REVIEW returns to a previously-visited
          state (a true cycle on the Claim entity), then progresses to APPROVED — not a forward-only pipeline.
        test_recipe:
          setup:
            - "Insurer at month 5; ACTIVE ANY_OCC TOTAL policy; a SUBMITTED then UNDER_REVIEW claim."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "NL1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH NL1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/request-info"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/resume-review"
              payload: {}
              as: ClaimsAdjudicator
              captures: { st_after_resume: $.data.status }
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
              captures: { st_final: $.data.status }
          assert:
            - "After resume-review, Claim.${c_id}.status == UNDER_REVIEW (re-entered prior state)"
            - "After approve, Claim.${c_id}.status == APPROVED"

      - name: policy_parallel_lifecycle_and_premium_dimensions
        grounds:
          - state_machines.Policy.transitions.premium_status_CURRENT_to_GRACE
          - state_machines.Policy.transitions.premium_status_GRACE_to_CURRENT
          - entities.Policy.fields.lifecycle_status
          - entities.Policy.fields.premium_status
        distinguishing_aspect: |
          Policy carries two independent state dimensions on one row: premium_status advances
          CURRENT->GRACE->CURRENT while lifecycle_status stays ACTIVE the whole time — parallel axes,
          not a single linear chain, on the Policy entity (distinct from Claim's cycle above).
        test_recipe:
          setup:
            - "An ACTIVE policy with premium_status CURRENT."
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "NL2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH NL2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /disability/policies/${p_id}/premium/miss"
              payload: {}
