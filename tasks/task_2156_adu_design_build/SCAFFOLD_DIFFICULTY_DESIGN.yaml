              as: DesignLead
              captures: { prop_p2_id: $.data.id, prop_p2_v: $.data.version }
            - call: "POST /adu-projects"
              payload: { property_id: "${prop_p2_id}", expected_property_version: "${prop_p2_v}", unit_type: "DETACHED_NEW", proposed_sqft: 767, proposed_height_ft: 16.0, rear_setback_ft: 5.0, side_setback_ft: 5.0, bedrooms: 2, contract_base_price_cents: 24000000 }
              as: DesignLead
              captures: { proj_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/feasibility-screenings"
              payload: { pathway: "LOCAL_ORDINANCE" }
              as: DesignLead
              captures: { scr_b_id: $.data.id }
            - call: "POST /adu-projects/${proj_b_id}/select-pathway"
              payload: { screening_id: "${scr_b_id}" }
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/utility-connections"
              payload: { service_type: "ELECTRIC" }
              as: DesignLead
              captures: { uc_b_elec_id: $.data.id }
            - call: "POST /utility-connections/${uc_b_elec_id}/decide"
              payload: {}
              as: DesignLead
            - call: "POST /adu-projects/${proj_b_id}/permit-submittals"
              payload: { design_sheet_count: 14, title24_compliant: true }
              as: DesignLead
              captures: { sub_b_id: $.data.id }
            - call: "POST /permit-submittals/${sub_b_id}/submit"
              payload: {}
              as: DesignLead
          trigger:
            - call: "POST /permit-submittals/${sub_b_id}/plan-check-result"
              payload: { outcome: "CORRECTIONS_REQUIRED", correction_items: [] }
              as: PlanChecker
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and the captured err_id == 'ERR_NO_CORRECTIONS_ON_RECORD'"
            - "PermitSubmittal.${sub_b_id}.status == 'UNDER_PLAN_CHECK'"
            - "PermitSubmittal.${sub_b_id}.cycle_number == 1"
            - "PermitSubmittal.${sub_b_id}.correction_deadline_date is null"
            - "AduProject.${proj_b_id}.status == 'PERMITTING'"
            - "GET /permit-submittals/${sub_b_id}/correction-items returns total_count == 0"

  # =====================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: phase_start_requires_approved_permit
        grounds:
          - state_machines.ConstructionPhase.SCHEDULED_to_IN_PROGRESS
          - validations[priority=43]
          - errors[ERR_PERMIT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair ConstructionPhase -> PermitSubmittal: a phase that is itself perfectly
          SCHEDULED cannot start because the project's MOST RECENTLY CREATED PermitSubmittal
          (a revision package) sits in UNDER_PLAN_CHECK rather than APPROVED, even though an
          older submittal on the same project is APPROVED.
