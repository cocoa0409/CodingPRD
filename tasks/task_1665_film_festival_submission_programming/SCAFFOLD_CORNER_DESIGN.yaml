          - "entities.FeePayment.fields.refunded_amount_cents"
        distinguishing_aspect: "Withdrawal before any slot occupation refunds round_half_up(6075 * 0.5) = 3038 (half-cent rounds UP), payment PARTIALLY_REFUNDED, edition totals updated."
        test_recipe:
          setup: ["Edition NOTIFICATION; NARRATIVE_FEATURE film INVITED (no slots); submitter student+member paid 6075 (9000 - 2250 - 675) in EARLY tier"]
