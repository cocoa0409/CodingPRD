              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "WD-1-001", hardware_cost_cents: 9000, sale_price_cents: 9000 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { unit: $.data.id }
            - call: "POST /device-units/${unit}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "wd@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /device-units/${unit}/activate"
              payload: {}
              as: Viewer
