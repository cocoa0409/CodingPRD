            - call: "POST /api/v1/formulas/${f_sod_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "POST /api/v1/formulas/${f_sod_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
              captures: { err_sod: $.data.error_id }
          assert:
