              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "IN_TITLE" }
              as: TitleOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Order.${o_id}.status == OPENED"

      - name: claim_pay_without_resolved_curative_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_RESOLVED_CURATIVE]", state_machines.Claim.CURATIVE_to_PAID]
        distinguishing_aspect: "Claim CURATIVE->PAID with no RESOLVED CurativeAction(subject=CLAIM) returns ERR_NO_RESOLVED_CURATIVE."
        test_recipe:
          setup: ["An ISSUED OWNER policy with a claim advanced to CURATIVE and no curative action."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C37", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/claims"
              payload: { claim_type: "UNDISCLOSED_LIEN", estimated_loss_cents: 50000 }
              as: Underwriter
              captures: { cl_id: $.data.id }
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "INVESTIGATING" }
              as: Underwriter
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "CURATIVE" }
              as: Underwriter
          trigger:
            - call: "POST /title/claims/${cl_id}/transitions"
              payload: { to_status: "PAID", settled_loss_cents: 40000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_RESOLVED_CURATIVE"
            - "Claim.${cl_id}.status == CURATIVE"

      - name: disbursement_insufficient_escrow_over_balance
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_ESCROW]", state_machines.Disbursement.APPROVED_to_WIRED]
        excluded_because:
          difficulty_instance: boundary_precision_check / disbursement_amount_exactly_equals_balance
          rationale: "The over-balance rejection is the negative side of the inclusive <= boundary asserted by the named §1.8 boundary instance (amount == balance allowed; amount == balance+1 rejected)."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_order_version_on_commitment_reissue
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commitment-reissue-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one commitment re-issue bumps Order.version, a second re-issue create carrying the pre-bump expected_order_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An order with one ISSUED commitment; the client holds the order version observed BEFORE the first re-issue."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C38", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v0}" }
              as: TitleOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /title/commitments/${c1_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "GET /title/orders/${o_id}"
              as: TitleOfficer
              captures: { o_v1: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-02-05T00:00:00Z", expiry_date: "2026-08-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v1}" }
              as: TitleOfficer
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-03-05T00:00:00Z", expiry_date: "2026-09-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v1}" }
              as: TitleOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412 (o_v1 is stale after the first re-issue bumped Order.version)"

      - name: occ_stale_order_version_on_disbursement_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disbursement-create-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one disbursement create bumps Order.version, a second disbursement create carrying the pre-bump expected_order_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An order with a POSTED deposit; the client holds the order version observed before the first disbursement create."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C39", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 500000, source_ref: "WIRE-IN-10" }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { d_id: $.data.id }
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "POSTED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { o_v_pre: $.data.version }
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Seller", amount_cents: 100000, purpose: "SELLER_PROCEEDS", wire_window_start: "2026-01-20T09:00:00Z", wire_window_end: "2026-01-20T10:00:00Z", expected_order_version: "${o_v_pre}" }
              as: Underwriter
              captures: { disb1_id: $.data.id }
          trigger:
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Payoff", amount_cents: 100000, purpose: "PAYOFF", wire_window_start: "2026-01-20T11:00:00Z", wire_window_end: "2026-01-20T12:00:00Z", expected_order_version: "${o_v_pre}" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION, http 412 (o_v_pre is stale after the first disbursement create bumped Order.version)"

      - name: cascade_endorsement_removed_on_policy_void
        claim_type: cascading_side_effects
        grounds: [state_machines.Policy.ISSUED_to_VOID, state_machines.Endorsement.ATTACHED_to_REMOVED]
        distinguishing_aspect: "Voiding an ISSUED policy cascades its ATTACHED endorsement to REMOVED (part of CASCADE A link 3) in addition to reversing the remittance."
        test_recipe:
          setup: ["An ISSUED OWNER policy with one ATTACHED endorsement and no open claims."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C40", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/policies/${p_id}/endorsements"
              payload: { form_code: "SURVEY", charge_pct: 0.05 }
              as: Underwriter
              captures: { en_id: $.data.id }
            - call: "POST /title/endorsements/${en_id}/transitions"
              payload: { to_status: "ATTACHED" }
              as: Underwriter
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "VOID" }
              as: Underwriter
            - call: "GET /title/endorsements/${en_id}"
              as: Underwriter
              captures: { en_status: $.data.status }
          assert:
            - "Policy.${p_id}.status == VOID"
            - "Endorsement.${en_id}.status == REMOVED"

      - name: agency_multi_tenant_order_list_isolation
        claim_type: multi_tenancy
        grounds: [entities.Order.fields.agency_id, endpoints]
        distinguishing_aspect: "Filtering GET /title/orders?agency_id={A} returns only agency A's orders, not agency B's (tenant-scoped listing)."
        test_recipe:
          setup: ["Agency A with one order and agency B with one order."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Agency A", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_a: $.data.id }
            - call: "POST /title/agencies"
              payload: { name: "Agency B", remit_split_pct: 0.80 }
              as: Underwriter
              captures: { ag_b: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_a}", parcel_id: "APN-A1", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_a}"
              captures: { oa_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_b}", parcel_id: "APN-B1", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_b}"
              captures: { ob_id: $.data.id }
          trigger:
            - call: "GET /title/orders"
              payload: { agency_id: "${ag_a}" }
              as: Underwriter
          assert:
            - "the result contains order ${oa_id} and does NOT contain order ${ob_id}"

