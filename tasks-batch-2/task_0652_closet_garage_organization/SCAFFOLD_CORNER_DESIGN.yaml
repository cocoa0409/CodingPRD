              payload: { expected_quote_version: "${qv} - 1" }
              as: PlatformAdmin
          assert:
            - "response.error_id == ERR_STALE_QUOTE_VERSION"
            - "http status 412"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Project, state_machines.Project.LEAD_to_DESIGNING]
        distinguishing_aspect: "Project.version increments by exactly 1 per mutation: create (1), first consult auto-advance (2)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ver@x.com", full_name: "Ver", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", room_type: "WALK_IN_CLOSET" }
              as: Designer
              captures: { proj: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /projects/${proj}/design-consults"
              payload: { designer_user_id: "des-1", scheduled_start: "2026-04-02T17:00:00Z", scheduled_end: "2026-04-02T18:00:00Z" }
              as: Designer
          assert:
            - "v0 == 1"
            - "Project.${proj}.version == 2"

      - name: change_order_reject_then_resubmit_cycle
        claim_type: cascading_side_effects
        grounds: [state_machines.ChangeOrder.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "A REJECTED change order can be followed by a fresh SUBMITTED change order on the same base quote (cyclic resubmission); the new one is independent and SUBMITTED."
        test_recipe:
          setup: ["Project DEPOSIT_PAID with ACCEPTED quote; first ChangeOrder SCHEDULE_CHANGE rejected"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cyc@x.com", full_name: "Cyc", zip_code: "90001" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /projects"
