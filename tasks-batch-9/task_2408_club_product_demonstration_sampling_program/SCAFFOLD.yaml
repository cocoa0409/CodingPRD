scenario: |
  2408. In-Club Product Demonstration & Sampling Program (Club Demonstration Services): manufacturer demo booking with date, club and product allocation, demonstrator scheduling, food-safety certification and staffing coverage, product delivery to the club and sample inventory reconciliation, sales lift measurement against baseline with attribution window, event setup standards, equipment assignment and health code compliance, demonstrator no-show recovery and event cancellation credits, per-event billing to manufacturers with add-on services, club capacity limits and calendar competition among categories

domain_name: club-demo-sampling
api_prefix: "/"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_level: beyond_expert   # deliberately above the §0.4 Expert band per generation instruction
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Graph: DemoEvent is a 3-way join across Manufacturer x Club x Product; EventAssignment
  # joins DemoEvent x Demonstrator and self-references via replaces_assignment_id;
  # EquipmentReservation joins EquipmentUnit x DemoEvent; ClubProductBaseline joins Club x Product.
  # No nesting-only ownership tree: every association is an explicit FK edge.

  state_machine_shape: parallel
  # DemoEvent carries TWO independent state dimensions on one row (booking_status and
  # staffing_status) that advance under different triggers and gate each other at
  # exactly two points (assignment creation requires booking_status == CONFIRMED;
  # CLOSE_OUT requires staffing_status == EXECUTED). staffing_status additionally
  # contains a revision cycle (FULLY_STAFFED -> PARTIALLY_STAFFED -> FULLY_STAFFED)
  # and booking_status contains two revert cycles (SUBMITTED -> DRAFT -> SUBMITTED,
  # CONFIRMED -> SUBMITTED -> CONFIRMED). EventInvoice adds a second cycle
  # (DRAFT -> ISSUED -> VOID -> DRAFT). EventAssignment and SampleShipment are
  # branching fork machines with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential      # EventAssignment.replaces_assignment_id -> EventAssignment.id
    - cross_aggregate       # CancellationCredit reaches EventInvoice and Manufacturer

  role_model: segregation_of_duties
  # ProgramAdmin issues invoices and approves cancellation credits, but the SAME
  # X-User-ID may not do both for one event (priority 46). Beyond that, roles are
  # peer-owned: Manufacturer owns bookings/products/shipments, ClubOperations owns
  # approvals/equipment/receiving/reconciliation, StaffingCoordinator owns the
  # demonstrator roster and assignments, Demonstrator owns only its own assignment.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered vendor name that appears on the per-event invoice.
        constraints: non-empty, max 160 chars
      - name: billing_email
        type: string
        source: input
        description: Billing contact address for issued invoices.
        constraints: must contain '@'
      - name: program_tier
        type: enum
        source: input
        description: Contract tier that seeds the invoice volume discount and gates emergency sample reserve access.
        constraints: one of {PLATINUM, GOLD, STANDARD}
      - name: credit_limit_cents
        type: integer
        source: input
        description: Ceiling on outstanding_balance_cents before the account is auto-moved to HOLD.
        constraints: ">= 0"
      - name: credit_terms_days
        type: integer
        source: input
        description: Net payment terms in days, recorded on every invoice issued to this manufacturer.
        constraints: one of {15, 30, 45, 60}
      - name: account_status
        type: enum
        source: input
        description: Booking eligibility gate. ACTIVE permits SUBMIT and APPROVE; HOLD permits DRAFT edits only; SUSPENDED blocks event creation.
        default: ACTIVE
        constraints: one of {ACTIVE, HOLD, SUSPENDED}; also written by the credit-limit auto-transition and by the credit-application cascade
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Receivable ledger: sum of EventInvoice.total_due_cents over invoices of this manufacturer whose invoice_status == ISSUED. See calculations.manufacturer_receivable_rollup."
        default: 0
      - name: credit_note_balance_cents
        type: integer
        source: computed
        description: Sum of CancellationCredit.credit_amount_cents whose credit_status == APPLIED and which found no attachable invoice at application time.
        default: 0

  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: club_number
        type: string
        source: input
        description: Warehouse club identifier, unique across all clubs.
        constraints: unique; pattern C\d{4}
      - name: name
        type: string
        source: input
        description: Club display name.
      - name: region_code
        type: string
        source: input
        description: Operating region used for reporting only; never used in any selector or ranking.
      - name: club_tier
        type: enum
        source: input
        description: Site tier supplying CLUB_TIER_MULTIPLIER in the invoice base-fee line.
        constraints: one of {FLAGSHIP, STANDARD, SATELLITE}
      - name: daily_event_capacity
        type: integer
        source: input
        description: Maximum number of DemoEvents with booking_status IN {CONFIRMED, COMPLETED} allowed on one event_date at this club.
        constraints: ">= 1, <= 12"
      - name: food_station_count
        type: integer
        source: input
        description: Number of health-code-approved food sampling stations; caps FOOD_SAMPLING events per event_date.
        constraints: ">= 0, <= 8"
      - name: health_permit_expires_on
        type: string
        source: input
        description: Local health department permit expiry date (YYYY-MM-DD). A FOOD_SAMPLING event may only be APPROVEd when this date is >= the event_date.
      - name: club_status
        type: enum
        source: input
        description: OPEN permits every approval; RESTRICTED blocks APPROVE of FOOD_SAMPLING events only; CLOSED blocks all APPROVE and cascades cancellation of CONFIRMED events dated on/after the logical clock date.
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, CLOSED}

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the vendor that owns this SKU and is billed for its demos.
      - name: sku
        type: string
        source: input
        description: Vendor SKU, unique within one manufacturer_id.
        constraints: unique per (manufacturer_id, sku)
      - name: name
        type: string
        source: input
        description: Product display name.
      - name: category
        type: enum
        source: input
        description: Merchandising category used by the club-day category calendar cap (MAX_EVENTS_PER_CATEGORY_PER_DAY).
        constraints: one of {BAKERY, DAIRY, FROZEN, BEVERAGE, SNACK, HOUSEHOLD, ELECTRONICS, APPAREL}
      - name: requires_food_handling
        type: boolean
        source: input
        description: True when samples are consumed on site; drives DemoEvent.event_type == FOOD_SAMPLING and the FOOD_HANDLER certification gate.
      - name: requires_heat_equipment
        type: boolean
        source: input
        description: True when the demo needs a powered cooking unit; requires a HEAT_EQUIPMENT certification on every assigned demonstrator.
        constraints: may only be true when requires_food_handling is true
      - name: allergen_flag
        type: boolean
        source: input
        description: True when the product carries a top-9 allergen; requires an ALLERGEN_AWARENESS certification on every assigned demonstrator.
        default: false
      - name: unit_cost_cents
        type: integer
        source: input
        description: Landed cost of one sample unit, used to price reconciliation write-offs.
        constraints: ">= 0"
      - name: samples_per_case
        type: integer
        source: input
        description: Sample units contained in one shipped case; converts cases to units in reconciliation.
        constraints: ">= 1"
      - name: weekly_sample_case_pool
        type: integer
        source: input
        description: Cases this SKU may consume per (club, ISO week) bucket in the allocation waterfall.
        constraints: ">= 0"
      - name: emergency_reserve_cases
        type: integer
        source: input
        description: Second waterfall bucket, drawable only when Manufacturer.program_tier == PLATINUM.
        default: 0
        constraints: ">= 0"

  - name: ClubProductBaseline
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club whose pre-demo run rate this row records.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the SKU whose pre-demo run rate this row records.
      - name: baseline_weekly_units
        type: integer
        source: input
        description: Units sold in a normal (no-demo) week; prorated across the attribution window in sales-lift measurement.
        constraints: ">= 0"
      - name: baseline_unit_price_cents
        type: integer
        source: input
        description: Shelf price per unit used to convert lift_units into incremental_revenue_cents.
        constraints: ">= 0"
      - name: baseline_week_start_date
        type: string
        source: input
        description: Monday (YYYY-MM-DD) of the week the baseline was observed; reporting attribute only, never a selector input.
      - name: restatement_count
        type: integer
        source: computed
        description: Number of times PATCH /club-product-baselines/{id} has changed baseline_weekly_units or baseline_unit_price_cents.
        default: 0

  - name: DemoEvent
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: FK -> Manufacturer.id; the billed party.
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club hosting the demo.
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the demonstrated SKU. Must satisfy Product.manufacturer_id == DemoEvent.manufacturer_id.
      - name: event_date
        type: string
        source: input
        description: Calendar date of the demo (YYYY-MM-DD).
      - name: day_part
        type: enum
        source: input
        description: Shift block; selects the UTC event window and the invoice DAY_PART_MULTIPLIER.
        constraints: one of {MORNING, MIDDAY, AFTERNOON}
      - name: event_type
        type: enum
        source: computed
        description: FOOD_SAMPLING when Product.requires_food_handling is true, otherwise NON_FOOD_DEMO. Client input for this field is ignored.
        constraints: one of {FOOD_SAMPLING, NON_FOOD_DEMO}
      - name: requested_sample_cases
        type: integer
        source: input
        description: Cases the manufacturer asks the club to stage for the demo.
        constraints: ">= 1, <= 40"
      - name: allocated_sample_cases
        type: integer
        source: computed
        description: pool_cases_used + reserve_cases_used at APPROVE time; later overwritten to the received case count when a shipment lands SHORT.
        default: 0
      - name: pool_cases_used
        type: integer
        source: computed
        description: Cases drawn from the first waterfall bucket (Product.weekly_sample_case_pool for this club and ISO week).
        default: 0
      - name: reserve_cases_used
        type: integer
        source: computed
        description: Cases drawn from the second waterfall bucket (Product.emergency_reserve_cases), always 0 unless Manufacturer.program_tier == PLATINUM.
        default: 0
      - name: addon_services
        type: array
        source: input
        description: Billable add-ons attached to this event; each member becomes one rounded invoice line.
        default: []
        constraints: members drawn from {EXTRA_TABLE, VIDEO_LOOP, ALLERGEN_SIGNAGE, PREMIUM_PLACEMENT, BILINGUAL_DEMONSTRATOR}; no duplicates; max 5 members
      - name: attribution_window_days
        type: integer
        source: input
        description: Length of the FINAL sales-lift attribution window in calendar days.
        default: 14
        constraints: ">= 3, <= 28"
      - name: booking_status
        type: enum
        source: computed
        description: Commercial booking dimension, advanced only by POST /demo-events/{id}/transitions.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, CONFIRMED, COMPLETED, CANCELLED}
      - name: staffing_status
        type: enum
        source: computed
        description: Coverage dimension, advanced independently by assignment creation, assignment transitions, and CLOSE_OUT.
        default: UNSTAFFED
        constraints: one of {UNSTAFFED, PARTIALLY_STAFFED, FULLY_STAFFED, EXECUTED, CLOSED_OUT}
      - name: settlement_status
        type: enum
        source: computed
        description: "Denormalised money mirror recomputed on every invoice/credit mutation touching this event: PAID when an EventInvoice with invoice_status == PAID exists; INVOICED when one with invoice_status == ISSUED exists; CREDITED when no such invoice exists but a CancellationCredit with credit_status == APPLIED exists; otherwise UNBILLED."
        default: UNBILLED
        constraints: one of {UNBILLED, INVOICED, PAID, CREDITED}
      - name: event_window_start_utc
        type: datetime
        source: computed
        description: event_date at the DAY_PART_WINDOWS start hour (MORNING 09:00Z, MIDDAY 12:00Z, AFTERNOON 15:00Z).
      - name: event_window_end_utc
        type: datetime
        source: computed
        description: event_window_start_utc + 4 hours (MORNING 13:00Z, MIDDAY 16:00Z, AFTERNOON 19:00Z).
      - name: required_support_count
        type: integer
        source: computed
        description: 1 when event_type == FOOD_SAMPLING AND allocated_sample_cases >= SUPPORT_REQUIRED_CASE_THRESHOLD (6), otherwise 0. Recomputed whenever allocated_sample_cases changes.
        default: 0
      - name: no_show_recovery_open
        type: boolean
        source: computed
        description: True from the moment an EventAssignment on this event reaches NO_SHOW until staffing_status returns to FULLY_STAFFED or booking_status becomes terminal.
        default: false
      - name: cancellation_reason
        type: enum
        source: computed
        description: Written when booking_status becomes CANCELLED; also copied into the cascade-created CancellationCredit.credit_reason.
        default: null
        constraints: null or one of {CLUB_CANCELLED, MANUFACTURER_CANCELLED_EARLY, MANUFACTURER_CANCELLED_LATE, PRODUCT_SHORT, DEMONSTRATOR_NO_SHOW}
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent DRAFT -> SUBMITTED transition.
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent SUBMITTED -> CONFIRMED transition.
        default: null

  - name: Demonstrator
    parent: null
    common_fields: true
    fields:
      - name: home_club_id
        type: string
        source: input
        description: FK -> Club.id; the club this demonstrator is rostered to. Assignments outside it require travel_authorized.
      - name: full_name
        type: string
        source: input
        description: Demonstrator display name.
      - name: employment_status
        type: enum
        source: input
        description: ACTIVE permits assignment; ON_LEAVE and TERMINATED block it. Also written by the 3-strike auto-transition.
        default: ACTIVE
        constraints: one of {ACTIVE, ON_LEAVE, TERMINATED}
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Billing rate used in the invoice staffing line for this demonstrator.
        constraints: ">= 1"
      - name: max_weekly_events
        type: integer
        source: input
        description: Cap on assignments with assignment_status IN {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED} whose event_date falls in one ISO week.
        default: 5
        constraints: ">= 1, <= 14"
      - name: reliability_score_rolling_90
        type: number
        source: computed
        description: ROLLING_90 variant of calculations.demonstrator_reliability_score.
        default: 100.00
      - name: reliability_score_program_to_date
        type: number
        source: computed
        description: PROGRAM_TO_DATE variant of calculations.demonstrator_reliability_score.
        default: 100.00
      - name: no_show_strike_count
        type: integer
        source: computed
        description: Count of EventAssignment rows for this demonstrator with assignment_status == NO_SHOW whose scheduled_start_utc >= (logical clock now - STRIKE_LOOKBACK_DAYS 180 days).
        default: 0
      - name: completed_event_count
        type: integer
        source: computed
        description: Count of EventAssignment rows for this demonstrator with assignment_status == COMPLETED (no time filter).
        default: 0

  - name: FoodSafetyCertification
    parent: null
    common_fields: true
    fields:
      - name: demonstrator_id
        type: string
        source: input
        description: FK -> Demonstrator.id; the certified worker.
      - name: cert_type
        type: enum
        source: input
        description: Certification family checked at assignment creation.
        constraints: one of {FOOD_HANDLER, ALLERGEN_AWARENESS, HEAT_EQUIPMENT}
      - name: certificate_number
        type: string
        source: input
        description: Issuing authority's certificate number.
      - name: issued_on
        type: string
        source: input
        description: Issue date (YYYY-MM-DD).
      - name: expires_on
        type: string
        source: input
        description: Expiry date (YYYY-MM-DD). Valid for an event when expires_on >= DemoEvent.event_date (inclusive).
        constraints: must be > issued_on
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant the certificate was revoked; null while never revoked.
        default: null
      - name: cert_status
        type: enum
        source: computed
        description: REVOKED when revoked_at is not null; else EXPIRED when expires_on < the logical clock's UTC date; else VALID.
        constraints: one of {VALID, EXPIRED, REVOKED}

  - name: EventAssignment
    parent: null
    common_fields: true
    fields:
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the event being staffed.
      - name: demonstrator_id
        type: string
        source: input
        description: FK -> Demonstrator.id; the assigned worker.
      - name: replaces_assignment_id
        type: string
        source: input
        description: FK -> EventAssignment.id; the NO_SHOW or RELEASED assignment this row recovers. Null for an original assignment.
        default: null
      - name: role
        type: enum
        source: input
        description: LEAD carries the ROLE_MULTIPLIER 1.20 staffing rate and is the assignment whose CHECK_IN drives staffing_status to EXECUTED.
        constraints: one of {LEAD, SUPPORT}
      - name: travel_authorized
        type: boolean
        source: input
        description: Permits assigning a demonstrator whose home_club_id differs from the event's club_id.
        default: false
      - name: assignment_status
        type: enum
        source: computed
        description: Assignment lifecycle.
        default: ASSIGNED
        constraints: one of {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, RELEASED}
      - name: scheduled_start_utc
        type: datetime
        source: computed
        description: DemoEvent.event_window_start_utc - SETUP_LEAD_MINUTES (45).
      - name: scheduled_end_utc
        type: datetime
        source: computed
        description: DemoEvent.event_window_end_utc + TEARDOWN_MINUTES (75). The teardown pad is deliberately longer than the setup pad, so a MORNING shift's scheduled_end_utc (13:00Z + 75min = 14:15Z) equals an AFTERNOON shift's scheduled_start_utc (15:00Z - 45min = 14:15Z) on the same date.
      - name: check_in_at
        type: datetime
        source: system
        description: Instant recorded by the CHECK_IN action (occurred_at_utc when supplied, otherwise the logical clock).
        default: null
      - name: check_out_at
        type: datetime
        source: system
        description: Instant recorded by the CHECK_OUT action (occurred_at_utc when supplied, otherwise the logical clock).
        default: null
      - name: hours_worked
        type: number
        source: computed
        description: (check_out_at - check_in_at) in hours, ROUND_HALF_UP to 2 decimals; 0.00 while either stamp is null.
        default: 0.00
      - name: billable_hours
        type: number
        source: computed
        description: max(hours_worked, MIN_BILLABLE_HOURS 4.00) once assignment_status == COMPLETED, otherwise 0.00.
        default: 0.00
      - name: late_check_in
        type: boolean
        source: computed
        description: True when check_in_at > scheduled_start_utc + LATE_GRACE_MINUTES (10).
        default: false

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club that physically holds this unit.
      - name: asset_tag
        type: string
        source: input
        description: Asset tag, unique within one club_id.
        constraints: unique per (club_id, asset_tag)
      - name: equipment_type
        type: enum
        source: input
        description: Physical unit type.
        constraints: one of {CONVECTION_OVEN, INDUCTION_COOKTOP, REFRIGERATED_CART, DISPLAY_TABLE, TV_CART}
      - name: requires_food_cert
        type: boolean
        source: computed
        description: True when equipment_type IN {CONVECTION_OVEN, INDUCTION_COOKTOP, REFRIGERATED_CART}. Client input ignored.
      - name: sanitation_status
        type: enum
        source: input
        description: Health-code state. Only SANITIZED units may be ACTIVATEd onto an event.
        default: SANITIZED
        constraints: one of {SANITIZED, IN_USE, SOILED, OUT_OF_SERVICE}
      - name: last_sanitized_at
        type: datetime
        source: system
        description: Logical-clock instant sanitation_status was last set to SANITIZED.
        default: null

  - name: EquipmentReservation
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: FK -> EquipmentUnit.id; the reserved unit.
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the event the unit is held for.
      - name: window_start_utc
        type: datetime
        source: input
        description: Start of the occupation interval; must be <= DemoEvent.event_window_start_utc - SETUP_LEAD_MINUTES.
      - name: window_end_utc
        type: datetime
        source: input
        description: End of the occupation interval (exclusive); must be >= DemoEvent.event_window_end_utc.
        constraints: must be > window_start_utc
      - name: buffer_minutes
        type: integer
        source: computed
        description: Always SANITATION_BUFFER_MINUTES (30); the symmetric pad applied on both sides of this interval during conflict detection.
        default: 30
      - name: reservation_status
        type: enum
        source: computed
        description: HELD on creation; ACTIVATE moves it to ACTIVE and sets the unit IN_USE; RELEASE moves it to RELEASED.
        default: HELD
        constraints: one of {HELD, ACTIVE, RELEASED}

  - name: SampleShipment
    parent: null
    common_fields: true
    fields:
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the event the cases are staged for.
      - name: cases_shipped
        type: integer
        source: input
        description: Cases dispatched by the manufacturer.
        constraints: ">= 1, <= 40"
      - name: carrier_reference
        type: string
        source: input
        description: Carrier tracking reference.
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant of creation.
      - name: cases_received
        type: integer
        source: system
        description: Cases counted in at the club dock; null until receipt.
        default: null
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of receipt.
        default: null
      - name: short_cases
        type: integer
        source: computed
        description: max(0, cases_shipped - cases_received) once received, otherwise 0.
        default: 0
      - name: shipment_status
        type: enum
        source: computed
        description: IN_TRANSIT on creation; receipt forks to DELIVERED, SHORT, or REJECTED.
        default: IN_TRANSIT
        constraints: one of {IN_TRANSIT, DELIVERED, SHORT, REJECTED}

  - name: SampleReconciliation
    parent: null
    common_fields: true
    fields:
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the closed-out event being reconciled.
      - name: cases_delivered
        type: integer
        source: computed
        description: Sum of SampleShipment.cases_received over this event's shipments whose shipment_status IN {DELIVERED, SHORT}.
      - name: units_per_case
        type: integer
        source: computed
        description: Snapshot of Product.samples_per_case taken at reconciliation creation.
      - name: units_delivered
        type: integer
        source: computed
        description: cases_delivered * units_per_case.
      - name: units_sampled
        type: integer
        source: input
        description: Units handed to members during the demo.
        constraints: ">= 0"
      - name: units_wasted
        type: integer
        source: input
        description: Units spoiled, dropped, or discarded.
        constraints: ">= 0"
      - name: units_returned
        type: integer
        source: input
        description: Units returned to club stock intact.
        constraints: ">= 0"
      - name: variance_units
        type: integer
        source: computed
        description: units_delivered - (units_sampled + units_wasted + units_returned). Positive means unaccounted units.
      - name: variance_pct
        type: number
        source: computed
        description: 0.00 when units_delivered == 0; otherwise ROUND_HALF_UP(abs(variance_units) / units_delivered * 100, 2).
      - name: write_off_cost_cents
        type: integer
        source: computed
        description: ROUND_HALF_UP(abs(variance_units) * Product.unit_cost_cents) once recon_status == WRITTEN_OFF, otherwise 0.
        default: 0
      - name: recon_status
        type: enum
        source: computed
        description: OPEN for the instant of creation, then auto-forked to BALANCED or VARIANCE_FLAGGED in the same request; WRITTEN_OFF only via the write-off action.
        default: OPEN
        constraints: one of {OPEN, BALANCED, VARIANCE_FLAGGED, WRITTEN_OFF}

  - name: SalesLiftMeasurement
    parent: null
    common_fields: false
    immutability_note: "Append-only ledger of measurements. common_fields is false: this entity declares id and created_at explicitly, carries NO updated_at and NO version, and §1.5 exposes no PATCH for it. A correction is expressed by posting a new row, which supersedes the old one."
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted identifier. Declared explicitly because common_fields is false.
      - name: created_at
        type: datetime
        source: system
        description: Logical-clock instant the measurement was posted; the ordering key for GET /demo-events/{id}/lift-measurements. Declared explicitly because common_fields is false.
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the measured event.
      - name: measurement_variant
        type: enum
        source: input
        description: PROVISIONAL uses a 3-day CLOSED window with no cannibalization deduction; FINAL uses the event's attribution_window_days as a HALF_OPEN window and deducts cannibalization.
        constraints: one of {PROVISIONAL, FINAL}
      - name: units_sold_in_window
        type: integer
        source: input
        description: POS units for the SKU at the club inside the measurement window, supplied by the caller.
        constraints: ">= 0"
      - name: attribution_days
        type: integer
        source: computed
        description: PROVISIONAL_WINDOW_DAYS (3) for PROVISIONAL; DemoEvent.attribution_window_days for FINAL.
      - name: window_start_date
        type: string
        source: computed
        description: Always DemoEvent.event_date.
      - name: window_end_date
        type: string
        source: computed
        description: For PROVISIONAL, event_date + (attribution_days - 1) days and the boundary is inclusive; for FINAL, event_date + attribution_days days and the boundary is exclusive.
      - name: window_boundary
        type: enum
        source: computed
        description: CLOSED for PROVISIONAL, HALF_OPEN for FINAL.
        constraints: one of {CLOSED, HALF_OPEN}
      - name: baseline_weekly_units
        type: integer
        source: computed
        description: Snapshot of ClubProductBaseline.baseline_weekly_units for (DemoEvent.club_id, DemoEvent.product_id) at posting time.
      - name: baseline_unit_price_cents
        type: integer
        source: computed
        description: Snapshot of ClubProductBaseline.baseline_unit_price_cents at posting time.
      - name: baseline_units_expected
        type: number
        source: computed
        description: ROUND_HALF_UP(baseline_weekly_units * attribution_days / 7, 2).
      - name: cannibalization_units
        type: number
        source: computed
        description: 0.00 for PROVISIONAL; for FINAL, ROUND_HALF_UP(SampleReconciliation.units_sampled * SAMPLE_CANNIBALIZATION_RATE, 2).
      - name: lift_units
        type: number
        source: computed
        description: ROUND_HALF_UP(units_sold_in_window - baseline_units_expected - cannibalization_units, 2).
      - name: lift_pct
        type: number
        source: computed
        description: 0.00 when baseline_units_expected == 0; otherwise ROUND_HALF_UP(lift_units / baseline_units_expected * 100, 2).
      - name: incremental_revenue_cents
        type: integer
        source: computed
        description: ROUND_HALF_UP(lift_units * baseline_unit_price_cents) as whole cents.
      - name: measurement_status
        type: enum
        source: computed
        description: POSTED on creation; STALE when the underlying ClubProductBaseline is restated; SUPERSEDED when a newer measurement of the same measurement_variant is posted for the same event.
        default: POSTED
        constraints: one of {POSTED, STALE, SUPERSEDED}

  - name: EventInvoice
    parent: null
    common_fields: true
    fields:
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the billed event.
      - name: manufacturer_id
        type: string
        source: computed
        description: FK -> Manufacturer.id; copied from DemoEvent.manufacturer_id at creation.
      - name: base_fee_cents
        type: integer
        source: computed
        description: The single rounded base-fee line (see calculations.event_invoice_total, line_type BASE).
      - name: addon_fee_cents
        type: integer
        source: computed
        description: Sum of the individually rounded ADDON lines.
        default: 0
      - name: staffing_fee_cents
        type: integer
        source: computed
        description: Sum of the individually rounded STAFFING lines (one per COMPLETED assignment).
        default: 0
      - name: sample_handling_fee_cents
        type: integer
        source: computed
        description: Sum of the individually rounded HANDLING lines (per-case handling, plus a cold-chain line for FOOD_SAMPLING events).
        default: 0
      - name: line_items
        type: array
        source: computed
        description: "Ordered rounded lines: objects { line_type, label, amount_cents } with line_type IN {BASE, ADDON, STAFFING, HANDLING}, emitted in that line_type order and within a line_type ordered by created_at ASC of the source row."
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of every line_items[].amount_cents. Each line is rounded before this sum; the sum is never re-rounded.
      - name: monthly_completed_event_count
        type: integer
        source: computed
        description: Count of DemoEvent rows for this manufacturer with booking_status == COMPLETED whose event_date falls in the same calendar month as this invoice's event_date, evaluated at invoice creation.
      - name: volume_discount_pct
        type: number
        source: computed
        description: min(0.10, TIER_BASE_DISCOUNT[Manufacturer.program_tier] + VOLUME_STEP(monthly_completed_event_count)).
      - name: discount_cents
        type: integer
        source: computed
        description: ROUND_HALF_UP(subtotal_cents * volume_discount_pct).
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: Sum of CancellationCredit.credit_amount_cents applied against this invoice.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: max(0, subtotal_cents - discount_cents - credit_applied_cents).
      - name: credit_terms_days
        type: integer
        source: computed
        description: Snapshot of Manufacturer.credit_terms_days at creation.
      - name: invoice_status
        type: enum
        source: computed
        description: Invoice lifecycle; VOID is re-openable to DRAFT.
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, VOID, PAID}
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that performed the ISSUE action; cleared to null on VOID.
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent ISSUE.
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of RECORD_PAYMENT.
        default: null

  - name: CancellationCredit
    parent: null
    common_fields: true
    fields:
      - name: demo_event_id
        type: string
        source: input
        description: FK -> DemoEvent.id; the disrupted event.
      - name: manufacturer_id
        type: string
        source: computed
        description: FK -> Manufacturer.id; copied from DemoEvent.manufacturer_id at creation.
      - name: credit_reason
        type: enum
        source: computed
        description: Cause of the credit, set by the creating cascade.
        constraints: one of {CLUB_CANCELLED, MANUFACTURER_CANCELLED_EARLY, MANUFACTURER_CANCELLED_LATE, PRODUCT_SHORT, DEMONSTRATOR_NO_SHOW}
      - name: gross_base_cents
        type: integer
        source: computed
        description: EventInvoice.subtotal_cents when an invoice with invoice_status IN {DRAFT, ISSUED, PAID} exists for the event, otherwise the projected base fee (step 2 of calculations.cancellation_credit_amount).
      - name: prior_applied_cents
        type: integer
        source: computed
        description: Sum of credit_amount_cents over other CancellationCredit rows on the same demo_event_id whose credit_status == APPLIED.
        default: 0
      - name: billable_base_cents
        type: integer
        source: computed
        description: max(0, gross_base_cents - prior_applied_cents).
      - name: notice_hours
        type: integer
        source: computed
        description: floor((DemoEvent.event_window_start_utc - logical clock now) / 3600 seconds); negative values are clamped to 0.
      - name: notice_tier_pct
        type: number
        source: computed
        description: Selected from the NOTICE_TIER table using the billable_base_cents bracket and the notice_hours bracket.
      - name: reason_multiplier
        type: number
        source: computed
        description: REASON_MULTIPLIER[credit_reason].
      - name: credit_amount_cents
        type: integer
        source: computed
        description: min(billable_base_cents, ROUND_HALF_UP(billable_base_cents * notice_tier_pct * reason_multiplier)).
      - name: credit_status
        type: enum
        source: computed
        description: PENDING_APPROVAL on cascade creation; APPROVED is transient inside the approve request and immediately auto-advances to APPLIED.
        default: PENDING_APPROVAL
        constraints: one of {PENDING_APPROVAL, APPROVED, APPLIED, REJECTED}
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that decided this credit.
        default: null
      - name: applied_to_invoice_id
        type: string
        source: computed
        description: FK -> EventInvoice.id; the invoice this credit reduced, or null when it landed on Manufacturer.credit_note_balance_cents instead.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- DemoEvent dimension 1 of 2: commercial booking ------------------------
  - entity: DemoEvent
    dimension: booking_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /demo-events/{id}/transitions action=SUBMIT"
        actor: Manufacturer
        preconditions:
          - "booking_status == DRAFT"
          - "Manufacturer.account_status == ACTIVE"
          - "event_date >= (logical clock UTC date + MIN_BOOKING_LEAD_DAYS 7 days)"
          - "event_date <= (logical clock UTC date + MAX_BOOKING_HORIZON_DAYS 120 days)"
          - "Product.manufacturer_id == DemoEvent.manufacturer_id"
        side_effects:
          - "sets submitted_at to the logical clock now"
          - "increments DemoEvent.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /demo-events/{id}/transitions action=REJECT"
        actor: ClubOperations
        preconditions:
          - "booking_status == SUBMITTED"
          - "X-User-ID == DemoEvent.club_id"
        side_effects:
          - "clears submitted_at to null"
          - "increments DemoEvent.version by 1"
        note: "Revision cycle: the manufacturer may PATCH the DRAFT and SUBMIT again, so DRAFT is re-enterable."
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /demo-events/{id}/transitions action=APPROVE"
        actor: ClubOperations
        preconditions:
          - "booking_status == SUBMITTED"
          - "X-User-ID == DemoEvent.club_id"
          - "Manufacturer.account_status == ACTIVE"
          - "Club.club_status == OPEN, or Club.club_status == RESTRICTED and event_type == NON_FOOD_DEMO"
          - "event_type == NON_FOOD_DEMO, or Club.health_permit_expires_on >= event_date"
          - "count of DemoEvent with same club_id and event_date and booking_status IN {CONFIRMED, COMPLETED} < Club.daily_event_capacity"
          - "event_type == NON_FOOD_DEMO, or count of those same-day events with event_type == FOOD_SAMPLING < Club.food_station_count"
          - "count of those same-day events whose Product.category == this Product.category < MAX_EVENTS_PER_CATEGORY_PER_DAY (2)"
          - "calculations.sample_allocation_waterfall yields allocated_sample_cases >= 1"
          - "event_type == NON_FOOD_DEMO, or allocated_sample_cases >= MIN_CASES_FOR_FOOD_SAMPLING (2)"
        side_effects:
          - "runs calculations.sample_allocation_waterfall and writes pool_cases_used, reserve_cases_used, allocated_sample_cases"
          - "recomputes required_support_count from allocated_sample_cases"
          - "sets approved_at to the logical clock now"
          - "increments DemoEvent.version by 1"
      - from: CONFIRMED
        to: SUBMITTED
        trigger: "POST /demo-events/{id}/transitions action=REVOKE_APPROVAL"
        actor: ClubOperations
        preconditions:
          - "booking_status == CONFIRMED"
          - "X-User-ID == DemoEvent.club_id"
          - "staffing_status IN {UNSTAFFED, PARTIALLY_STAFFED, FULLY_STAFFED}"
          - "no SampleShipment on this event has shipment_status IN {DELIVERED, SHORT}"
        side_effects:
          - "resets pool_cases_used, reserve_cases_used and allocated_sample_cases to 0, which restores the club-week pool remaining to its pre-APPROVE value (compensating invariant sample_case_pool_conservation)"
          - "recomputes required_support_count to 0"
          - "sets every EventAssignment on this event whose assignment_status IN {ASSIGNED, CONFIRMED} to RELEASED"
          - "each such RELEASED assignment recomputes its Demonstrator.reliability_score_rolling_90, reliability_score_program_to_date and completed_event_count"
          - "sets every EquipmentReservation on this event whose reservation_status IN {HELD, ACTIVE} to RELEASED; any that was ACTIVE sets its EquipmentUnit.sanitation_status to SOILED"
          - "recomputes staffing_status (becomes UNSTAFFED once no ASSIGNED/CONFIRMED/CHECKED_IN assignment remains)"
          - "clears approved_at to null"
          - "increments DemoEvent.version by 1"
        note: "Second booking cycle: CONFIRMED is re-enterable through a further APPROVE."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /demo-events/{id}/transitions action=CLOSE_OUT"
        actor: ClubOperations
        preconditions:
          - "booking_status == CONFIRMED"
          - "X-User-ID == DemoEvent.club_id"
          - "staffing_status == EXECUTED"
          - "every EventAssignment on this event has assignment_status IN {COMPLETED, NO_SHOW, RELEASED}"
          - "event_type == NON_FOOD_DEMO, or the sum of SampleShipment.cases_received over shipments with shipment_status IN {DELIVERED, SHORT} is >= 1"
        side_effects:
          - "sets staffing_status to CLOSED_OUT"
          - "sets every EquipmentReservation on this event whose reservation_status IN {HELD, ACTIVE} to RELEASED; any that was ACTIVE sets its EquipmentUnit.sanitation_status to SOILED"
          - "sets no_show_recovery_open to false"
          - "increments DemoEvent.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /demo-events/{id}/transitions action=CANCEL"
        actor: Manufacturer
        preconditions:
          - "booking_status == DRAFT"
        side_effects:
          - "sets cancellation_reason to MANUFACTURER_CANCELLED_EARLY"
          - "increments DemoEvent.version by 1"
        note: "No CancellationCredit is created for a DRAFT cancellation because nothing was ever allocated or billable."
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /demo-events/{id}/transitions action=CANCEL"
        actor: Manufacturer
        preconditions:
          - "booking_status == SUBMITTED"
        side_effects:
          - "sets cancellation_reason to MANUFACTURER_CANCELLED_EARLY"
          - "increments DemoEvent.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /demo-events/{id}/transitions action=CANCEL"
        actor: Manufacturer | ClubOperations | ProgramAdmin
        preconditions:
          - "booking_status == CONFIRMED"
          - "when the actor role is Manufacturer, X-User-ID == DemoEvent.manufacturer_id; when it is ClubOperations, X-User-ID == DemoEvent.club_id"
        side_effects:
          - "sets cancellation_reason to CLUB_CANCELLED when the actor role is ClubOperations, otherwise to MANUFACTURER_CANCELLED_LATE"
          - "resets pool_cases_used, reserve_cases_used and allocated_sample_cases to 0, restoring the club-week pool remaining"
          - "sets every EventAssignment on this event whose assignment_status IN {ASSIGNED, CONFIRMED} to RELEASED (cascade hop 1)"
          - "each such RELEASED assignment recomputes its Demonstrator.reliability_score_rolling_90 and reliability_score_program_to_date (cascade hop 2, caused by hop 1)"
          - "sets every EquipmentReservation on this event whose reservation_status IN {HELD, ACTIVE} to RELEASED; any that was ACTIVE sets its EquipmentUnit.sanitation_status to SOILED"
          - "creates one CancellationCredit with credit_reason == cancellation_reason and credit_status == PENDING_APPROVAL, valued by calculations.cancellation_credit_amount"
          - "recomputes staffing_status to UNSTAFFED"
          - "recomputes settlement_status"
          - "increments DemoEvent.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system: PATCH /clubs/{id} sets club_status to CLOSED"
        actor: system
        preconditions:
          - "booking_status == CONFIRMED"
          - "event_date >= the logical clock UTC date"
        side_effects:
          - "sets cancellation_reason to CLUB_CANCELLED"
          - "applies the same side-effect set as the ClubOperations CANCEL transition above, including the PENDING_APPROVAL CancellationCredit"
          - "increments DemoEvent.version by 1"

  # --- DemoEvent dimension 2 of 2: staffing coverage -------------------------
  - entity: DemoEvent
    dimension: staffing_status
    initial_state: UNSTAFFED
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: UNSTAFFED
        to: PARTIALLY_STAFFED
        trigger: "POST /demo-events/{id}/assignments"
        actor: StaffingCoordinator
        preconditions:
          - "booking_status == CONFIRMED"
          - "after this insert, calculations.staffing_coverage reports filled_lead < 1 or filled_support < required_support_count"
        side_effects:
          - "increments DemoEvent.version by 1"
      - from: UNSTAFFED
        to: FULLY_STAFFED
        trigger: "POST /demo-events/{id}/assignments"
        actor: StaffingCoordinator
        preconditions:
          - "booking_status == CONFIRMED"
          - "after this insert, filled_lead >= 1 and filled_support >= required_support_count"
        side_effects:
          - "sets no_show_recovery_open to false"
          - "increments DemoEvent.version by 1"
      - from: PARTIALLY_STAFFED
        to: FULLY_STAFFED
        trigger: "POST /demo-events/{id}/assignments"
        actor: StaffingCoordinator
        preconditions:
          - "booking_status == CONFIRMED"
          - "after this insert, filled_lead >= 1 and filled_support >= required_support_count"
        side_effects:
          - "sets no_show_recovery_open to false"
          - "increments DemoEvent.version by 1"
        note: "Closes the staffing revision cycle opened by a NO_SHOW or RELEASE downgrade."
      - from: FULLY_STAFFED
        to: PARTIALLY_STAFFED
        trigger: "system: an EventAssignment on this event reaches NO_SHOW or RELEASED"
        actor: system
        preconditions:
          - "after the assignment leaves {ASSIGNED, CONFIRMED, CHECKED_IN}, calculations.staffing_coverage re-evaluated over the remaining rows reports PARTIALLY_STAFFED"
        side_effects:
          - "sets no_show_recovery_open to true when the triggering assignment reached NO_SHOW"
          - "increments DemoEvent.version by 1"
        note: "When required_support_count is 0 and the LEAD assignment is still live, staffing_coverage still reports FULLY_STAFFED, so losing a SUPPORT assignment on such an event does NOT fire this transition."
      - from: FULLY_STAFFED
        to: UNSTAFFED
        trigger: "system: an EventAssignment on this event reaches NO_SHOW or RELEASED"
        actor: system
        preconditions:
          - "after the assignment leaves {ASSIGNED, CONFIRMED, CHECKED_IN}, calculations.staffing_coverage reports UNSTAFFED (no assignment on this event has assignment_status IN {ASSIGNED, CONFIRMED, CHECKED_IN})"
        side_effects:
          - "sets no_show_recovery_open to true when the triggering assignment reached NO_SHOW"
          - "increments DemoEvent.version by 1"
      - from: PARTIALLY_STAFFED
        to: UNSTAFFED
        trigger: "system: an EventAssignment on this event reaches NO_SHOW or RELEASED"
        actor: system
        preconditions:
          - "after the assignment leaves {ASSIGNED, CONFIRMED, CHECKED_IN}, calculations.staffing_coverage reports UNSTAFFED"
        side_effects:
          - "sets no_show_recovery_open to true when the triggering assignment reached NO_SHOW"
          - "increments DemoEvent.version by 1"
      - from: FULLY_STAFFED
        to: EXECUTED
        trigger: "system: the LEAD EventAssignment on this event reaches CHECKED_IN"
        actor: system
        preconditions:
          - "booking_status == CONFIRMED"
          - "the transitioning assignment has role == LEAD"
        side_effects:
          - "increments DemoEvent.version by 1"
      - from: EXECUTED
        to: CLOSED_OUT
        trigger: "POST /demo-events/{id}/transitions action=CLOSE_OUT"
        actor: ClubOperations
        preconditions:
          - "booking_status transitions CONFIRMED -> COMPLETED in the same request"
        side_effects:
          - "increments DemoEvent.version by 1"
      - from: FULLY_STAFFED
        to: CLOSED_OUT
        trigger: "system: booking_status becomes CANCELLED"
        actor: system
        preconditions:
          - "booking_status == CANCELLED"
        side_effects:
          - "increments DemoEvent.version by 1"
        note: "Cancelling a booking freezes the staffing dimension; UNSTAFFED and PARTIALLY_STAFFED are recomputed to UNSTAFFED first, then locked."

  # --- EventAssignment: branching fork with divergent side-effect sets -------
  - entity: EventAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, RELEASED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /event-assignments/{id}/transitions action=CONFIRM"
        actor: Demonstrator
        preconditions:
          - "assignment_status == ASSIGNED"
          - "X-User-ID == EventAssignment.demonstrator_id"
          - "DemoEvent.booking_status == CONFIRMED"
        side_effects:
          - "increments EventAssignment.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /event-assignments/{id}/transitions action=CHECK_IN"
        actor: Demonstrator
        preconditions:
          - "assignment_status == CONFIRMED"
          - "X-User-ID == EventAssignment.demonstrator_id"
          - "DemoEvent.booking_status == CONFIRMED"
          - "an EquipmentReservation on this DemoEvent has reservation_status == ACTIVE, or DemoEvent.event_type == NON_FOOD_DEMO"
          - "when such a reservation exists, its EquipmentUnit.sanitation_status == IN_USE"
          - "the recorded instant is within [scheduled_start_utc - CHECK_IN_EARLY_MINUTES 60, scheduled_end_utc] and is <= the logical clock now"
        side_effects:
          - "sets check_in_at to the recorded instant"
          - "sets late_check_in to (check_in_at > scheduled_start_utc + LATE_GRACE_MINUTES 10)"
          - "when role == LEAD, drives DemoEvent.staffing_status FULLY_STAFFED -> EXECUTED"
          - "increments EventAssignment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /event-assignments/{id}/transitions action=CHECK_OUT"
        actor: Demonstrator
        preconditions:
          - "assignment_status == CHECKED_IN"
          - "X-User-ID == EventAssignment.demonstrator_id"
          - "the recorded instant is > check_in_at and <= the logical clock now"
        side_effects:
          - "sets check_out_at, then hours_worked, then billable_hours in that order"
          - "increments Demonstrator.completed_event_count by 1"
          - "recomputes Demonstrator.reliability_score_rolling_90 and Demonstrator.reliability_score_program_to_date"
          - "increments EventAssignment.version by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /event-assignments/{id}/transitions action=NO_SHOW"
        actor: StaffingCoordinator
        preconditions:
          - "assignment_status == ASSIGNED"
          - "the logical clock now >= scheduled_start_utc + NO_SHOW_GRACE_MINUTES (15)"
        side_effects:
          - "applies the identical side-effect set as the CONFIRMED -> NO_SHOW transition below"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /event-assignments/{id}/transitions action=NO_SHOW"
        actor: StaffingCoordinator
        preconditions:
          - "assignment_status == CONFIRMED"
          - "the logical clock now >= scheduled_start_utc + NO_SHOW_GRACE_MINUTES (15)"
        side_effects:
          - "cascade hop 1: recomputes Demonstrator.no_show_strike_count, reliability_score_rolling_90 and reliability_score_program_to_date"
          - "cascade hop 2 (caused by hop 1): when Demonstrator.no_show_strike_count >= NO_SHOW_STRIKE_LIMIT (3) and employment_status == ACTIVE, sets Demonstrator.employment_status to ON_LEAVE"
          - "cascade hop 3 (caused by hop 2): every other EventAssignment of that demonstrator whose assignment_status IN {ASSIGNED, CONFIRMED} and whose DemoEvent.event_date >= the logical clock UTC date is set to RELEASED"
          - "cascade hop 4 (caused by hop 3): each of those other DemoEvents recomputes staffing_status downward (FULLY_STAFFED -> PARTIALLY_STAFFED or UNSTAFFED) and increments its version"
          - "downgrades this DemoEvent.staffing_status and sets no_show_recovery_open to true"
          - "creates one CancellationCredit on this DemoEvent with credit_reason == DEMONSTRATOR_NO_SHOW and credit_status == PENDING_APPROVAL, valued by calculations.cancellation_credit_amount"
          - "increments EventAssignment.version by 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /event-assignments/{id}/transitions action=RELEASE"
        actor: StaffingCoordinator
        preconditions:
          - "assignment_status == ASSIGNED"
        side_effects:
          - "recomputes Demonstrator.reliability_score_rolling_90 and reliability_score_program_to_date"
          - "downgrades DemoEvent.staffing_status without setting no_show_recovery_open"
          - "increments EventAssignment.version by 1"
        note: "Branch divergence: RELEASE creates no CancellationCredit and adds no strike, unlike NO_SHOW from the same from-state."
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /event-assignments/{id}/transitions action=RELEASE"
        actor: StaffingCoordinator
        preconditions:
          - "assignment_status == CONFIRMED"
        side_effects:
          - "recomputes Demonstrator.reliability_score_rolling_90 and reliability_score_program_to_date"
          - "downgrades DemoEvent.staffing_status without setting no_show_recovery_open"
          - "increments EventAssignment.version by 1"

  # --- EquipmentReservation --------------------------------------------------
  - entity: EquipmentReservation
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: ACTIVE
        trigger: "POST /equipment-reservations/{id}/transitions action=ACTIVATE"
        actor: ClubOperations
        preconditions:
          - "reservation_status == HELD"
          - "DemoEvent.booking_status == CONFIRMED"
          - "EquipmentUnit.sanitation_status == SANITIZED"
          - "the logical clock now is within [window_start_utc - 60 minutes, window_end_utc]"
        side_effects:
          - "sets EquipmentUnit.sanitation_status to IN_USE"
          - "increments EquipmentReservation.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /equipment-reservations/{id}/transitions action=RELEASE, or a system release from DemoEvent CANCEL / REVOKE_APPROVAL / CLOSE_OUT"
        actor: ClubOperations | system
        preconditions:
          - "reservation_status == HELD"
        side_effects:
          - "leaves EquipmentUnit.sanitation_status unchanged"
          - "increments EquipmentReservation.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /equipment-reservations/{id}/transitions action=RELEASE, or a system release from DemoEvent CANCEL / REVOKE_APPROVAL / CLOSE_OUT"
        actor: ClubOperations | system
        preconditions:
          - "reservation_status == ACTIVE"
        side_effects:
          - "sets EquipmentUnit.sanitation_status to SOILED"
          - "increments EquipmentReservation.version by 1"

  # --- SampleShipment: three-way receipt fork -------------------------------
  - entity: SampleShipment
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED, SHORT, REJECTED]
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /sample-shipments/{id}/receive"
        actor: ClubOperations
        preconditions:
          - "shipment_status == IN_TRANSIT"
          - "DemoEvent.booking_status IN {CONFIRMED, COMPLETED}"
          - "cases_received == cases_shipped"
        side_effects:
          - "sets cases_received, received_at and short_cases (0)"
          - "increments SampleShipment.version by 1"
      - from: IN_TRANSIT
        to: SHORT
        trigger: "POST /sample-shipments/{id}/receive"
        actor: ClubOperations
        preconditions:
          - "shipment_status == IN_TRANSIT"
          - "DemoEvent.booking_status IN {CONFIRMED, COMPLETED}"
          - "0 < cases_received < cases_shipped"
        side_effects:
          - "sets cases_received, received_at and short_cases"
          - "cascade hop 1: sets DemoEvent.allocated_sample_cases to the sum of cases_received over this event's shipments with shipment_status IN {DELIVERED, SHORT}"
          - "cascade hop 2 (caused by hop 1): recomputes DemoEvent.required_support_count from the new allocated_sample_cases"
          - "cascade hop 3 (caused by hop 2): recomputes DemoEvent.staffing_status against the new required_support_count, which can move PARTIALLY_STAFFED -> FULLY_STAFFED"
          - "creates one CancellationCredit with credit_reason == PRODUCT_SHORT and credit_status == PENDING_APPROVAL only when DemoEvent.event_type == FOOD_SAMPLING"
          - "increments DemoEvent.version by 1 and SampleShipment.version by 1"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /sample-shipments/{id}/receive"
        actor: ClubOperations
        preconditions:
          - "shipment_status == IN_TRANSIT"
          - "DemoEvent.booking_status IN {CONFIRMED, COMPLETED}"
          - "cases_received == 0"
        side_effects:
          - "sets cases_received (0), received_at and short_cases (== cases_shipped)"
          - "does NOT change DemoEvent.allocated_sample_cases and creates no CancellationCredit"
          - "increments SampleShipment.version by 1"
        note: "Branch divergence from SHORT: a fully rejected load leaves the allocation and the credit ledger untouched, so the club can re-ship."

  # --- SampleReconciliation: fork on creation, join on write-off -------------
  - entity: SampleReconciliation
    initial_state: OPEN
    terminal_states: [BALANCED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: BALANCED
        trigger: "system: auto-fork inside POST /demo-events/{id}/sample-reconciliation"
        actor: system
        preconditions:
          - "variance_units == 0, or variance_pct <= VARIANCE_TOLERANCE_PCT (2.00)"
        side_effects:
          - "leaves write_off_cost_cents at 0"
      - from: OPEN
        to: VARIANCE_FLAGGED
        trigger: "system: auto-fork inside POST /demo-events/{id}/sample-reconciliation"
        actor: system
        preconditions:
          - "variance_units != 0 and variance_pct > VARIANCE_TOLERANCE_PCT (2.00)"
        side_effects:
          - "leaves write_off_cost_cents at 0 and blocks EventInvoice ISSUE until resolved"
      - from: VARIANCE_FLAGGED
        to: WRITTEN_OFF
        trigger: "POST /sample-reconciliations/{id}/write-off"
        actor: ProgramAdmin
        preconditions:
          - "recon_status == VARIANCE_FLAGGED"
        side_effects:
          - "sets write_off_cost_cents to ROUND_HALF_UP(abs(variance_units) * Product.unit_cost_cents)"
          - "increments SampleReconciliation.version by 1"

  # --- SalesLiftMeasurement -------------------------------------------------
  - entity: SalesLiftMeasurement
    initial_state: POSTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: POSTED
        to: STALE
        trigger: "system: PATCH /club-product-baselines/{id} changes baseline_weekly_units or baseline_unit_price_cents"
        actor: system
        preconditions:
          - "measurement_status == POSTED"
          - "the measurement's DemoEvent has club_id == baseline.club_id and product_id == baseline.product_id"
        side_effects:
          - "increments ClubProductBaseline.restatement_count by 1"
      - from: POSTED
        to: SUPERSEDED
        trigger: "system: POST /demo-events/{id}/lift-measurements posts a newer row with the same measurement_variant"
        actor: system
        preconditions:
          - "measurement_status == POSTED"
          - "the new row has the same demo_event_id and the same measurement_variant"
        side_effects: []
      - from: STALE
        to: SUPERSEDED
        trigger: "system: POST /demo-events/{id}/lift-measurements posts a newer row with the same measurement_variant"
        actor: system
        preconditions:
          - "measurement_status == STALE"
          - "the new row has the same demo_event_id and the same measurement_variant"
        side_effects: []

  # --- EventInvoice: DRAFT -> ISSUED -> VOID -> DRAFT cycle -----------------
  - entity: EventInvoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /event-invoices/{id}/transitions action=ISSUE"
        actor: ProgramAdmin
        preconditions:
          - "invoice_status == DRAFT"
          - "DemoEvent.booking_status == COMPLETED"
          - "the SampleReconciliation for this DemoEvent has recon_status IN {BALANCED, WRITTEN_OFF}"
          - "Manufacturer.account_status != SUSPENDED"
        side_effects:
          - "sets issued_by_user_id to the acting X-User-ID and issued_at to the logical clock now"
          - "cascade: recomputes Manufacturer.outstanding_balance_cents via calculations.manufacturer_receivable_rollup"
          - "cascade: when the new outstanding_balance_cents > Manufacturer.credit_limit_cents and account_status == ACTIVE, sets account_status to HOLD"
          - "recomputes DemoEvent.settlement_status to INVOICED and increments DemoEvent.version by 1"
          - "increments EventInvoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /event-invoices/{id}/transitions action=VOID"
        actor: ProgramAdmin
        preconditions:
          - "invoice_status == ISSUED"
        side_effects:
          - "clears issued_by_user_id and issued_at to null"
          - "cascade: recomputes Manufacturer.outstanding_balance_cents, which returns to its exact pre-ISSUE value (compensating invariant manufacturer_receivable_conservation)"
          - "cascade: when the new outstanding_balance_cents <= Manufacturer.credit_limit_cents and account_status == HOLD, sets account_status to ACTIVE"
          - "recomputes DemoEvent.settlement_status and increments DemoEvent.version by 1"
          - "increments EventInvoice.version by 1"
      - from: VOID
        to: DRAFT
        trigger: "POST /event-invoices/{id}/transitions action=REDRAFT"
        actor: ProgramAdmin
        preconditions:
          - "invoice_status == VOID"
        side_effects:
          - "re-runs calculations.event_invoice_total against current data and overwrites every line_items entry, base_fee_cents, addon_fee_cents, staffing_fee_cents, sample_handling_fee_cents, subtotal_cents, monthly_completed_event_count, volume_discount_pct, discount_cents and total_due_cents"
          - "preserves credit_applied_cents"
          - "increments EventInvoice.version by 1"
        note: "Closes the invoice cycle: DRAFT -> ISSUED -> VOID -> DRAFT -> ISSUED is legal without limit."
      - from: ISSUED
        to: PAID
        trigger: "POST /event-invoices/{id}/transitions action=RECORD_PAYMENT"
        actor: ProgramAdmin
        preconditions:
          - "invoice_status == ISSUED"
          - "amount_cents == total_due_cents"
        side_effects:
          - "sets paid_at to the logical clock now"
          - "cascade: recomputes Manufacturer.outstanding_balance_cents (a PAID invoice leaves the ISSUED rollup)"
          - "cascade: when the new outstanding_balance_cents <= Manufacturer.credit_limit_cents and account_status == HOLD, sets account_status to ACTIVE"
          - "recomputes DemoEvent.settlement_status to PAID and increments DemoEvent.version by 1"
          - "increments EventInvoice.version by 1"

  # --- CancellationCredit ---------------------------------------------------
  - entity: CancellationCredit
    initial_state: PENDING_APPROVAL
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /cancellation-credits/{id}/decisions decision=APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "credit_status == PENDING_APPROVAL"
          - "when an EventInvoice for this demo_event_id has invoice_status IN {ISSUED, PAID}, the acting X-User-ID != that invoice's issued_by_user_id"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "immediately auto-advances to APPLIED in the same request"
          - "increments CancellationCredit.version by 1"
      - from: APPROVED
        to: APPLIED
        trigger: "system: auto-advance inside POST /cancellation-credits/{id}/decisions decision=APPROVE"
        actor: system
        preconditions:
          - "credit_status == APPROVED"
        side_effects:
          - "cascade hop 1: when an EventInvoice for this demo_event_id has invoice_status IN {DRAFT, ISSUED}, sets applied_to_invoice_id to it and increases that invoice's credit_applied_cents by credit_amount_cents; otherwise leaves applied_to_invoice_id null and increases Manufacturer.credit_note_balance_cents by credit_amount_cents"
          - "cascade hop 2 (caused by hop 1): the touched invoice recomputes total_due_cents = max(0, subtotal_cents - discount_cents - credit_applied_cents) and increments its version"
          - "cascade hop 3 (caused by hop 2): Manufacturer.outstanding_balance_cents is recomputed from the ISSUED-invoice rollup"
          - "cascade hop 4 (caused by hop 3): when the new outstanding_balance_cents <= Manufacturer.credit_limit_cents and account_status == HOLD, sets account_status to ACTIVE"
          - "recomputes DemoEvent.settlement_status and increments DemoEvent.version by 1"
          - "increments CancellationCredit.version by 1"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /cancellation-credits/{id}/decisions decision=REJECT"
        actor: ProgramAdmin
        preconditions:
          - "credit_status == PENDING_APPROVAL"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "leaves every invoice, Manufacturer.outstanding_balance_cents and Manufacturer.credit_note_balance_cents unchanged"
          - "increments CancellationCredit.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent DemoEvent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: lift-measurement-create-stale-event
    parent_entity: DemoEvent
    write_endpoint: "POST /demo-events/{id}/lift-measurements"
    occ_field: "expected_demo_event_version"
    description: |
      Posting a SalesLiftMeasurement against a DemoEvent whose version has advanced
      since the client last read it is rejected. A newly posted measurement of the
      same measurement_variant legitimately supersedes the previous one, so a client
      working from a stale view of the event would silently retire a measurement it
      never saw; the stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-event
    parent_entity: DemoEvent
    write_endpoint: "POST /demo-events/{id}/invoice"
    occ_field: "expected_demo_event_version"
    description: |
      Creating an EventInvoice against a DemoEvent whose version has advanced since
      the client last read it is rejected. A new DRAFT invoice legitimately supersedes
      a previously VOIDed one, and the invoice snapshots credit_terms_days plus the
      whole line-item set from the event's current state, so a stale view would bill
      from retired figures. The stale-version check reduces this to a 412.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: event_window_and_shift_derivation
    trigger: "POST /demo-events and PATCH /demo-events/{id} (event window); POST /demo-events/{id}/assignments (shift window); every booking-lead, check-in and no-show time gate reads these constants"
    algorithm: chronological
    formula: |
      event_window_start_utc = event_date at DAY_PART_WINDOWS[day_part].start
      event_window_end_utc   = event_date at DAY_PART_WINDOWS[day_part].end
                             = event_window_start_utc + 4 hours (every day_part)

      scheduled_start_utc = event_window_start_utc - SETUP_LEAD_MINUTES
      scheduled_end_utc   = event_window_end_utc   + TEARDOWN_MINUTES

      # Pinned consequences of the asymmetric pads (45 vs 75 minutes):
      #   MORNING   shift = [08:15Z, 14:15Z]
      #   MIDDAY    shift = [11:15Z, 17:15Z]
      #   AFTERNOON shift = [14:15Z, 20:15Z]
      # so a MORNING shift's scheduled_end_utc EQUALS an AFTERNOON shift's
      # scheduled_start_utc on the same date (14:15Z). Under the demonstrator's
      # CLOSED zero-buffer geometry that pair conflicts; under the equipment
      # unit's buffered half-open geometry an equivalent 30-minute separation
      # does not. See calculations.demonstrator_schedule_conflict and
      # calculations.equipment_window_conflict.

      # booking time gates, evaluated against the logical clock's UTC date
      earliest_bookable_date = clock_date + MIN_BOOKING_LEAD_DAYS
      latest_bookable_date   = clock_date + MAX_BOOKING_HORIZON_DAYS
      check_in_window        = [scheduled_start_utc - CHECK_IN_EARLY_MINUTES,
                                scheduled_end_utc]                     # CLOSED
      no_show_declarable_at  = scheduled_start_utc + NO_SHOW_GRACE_MINUTES
    input_set: "Only day_part and event_date feed the window; the club's timezone is irrelevant because every window is expressed directly in UTC."
    constants:
      DAY_PART_WINDOWS:
        MORNING: { start: "09:00:00Z", end: "13:00:00Z" }
        MIDDAY: { start: "12:00:00Z", end: "16:00:00Z" }
        AFTERNOON: { start: "15:00:00Z", end: "19:00:00Z" }
      SETUP_LEAD_MINUTES: 45
      TEARDOWN_MINUTES: 75
      CHECK_IN_EARLY_MINUTES: 60
      NO_SHOW_GRACE_MINUTES: 15
      MIN_BOOKING_LEAD_DAYS: 7
      MAX_BOOKING_HORIZON_DAYS: 120
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "whole minutes on UTC instants; whole days on dates"
    variants: []

  - name: sample_allocation_waterfall
    trigger: "POST /demo-events/{id}/transitions action=APPROVE (SUBMITTED -> CONFIRMED), writing pool_cases_used, reserve_cases_used and allocated_sample_cases"
    algorithm: waterfall_allocation
    formula: |
      week_start   = the Monday of the ISO week containing DemoEvent.event_date
      scope        = DemoEvent rows with product_id == this.product_id
                     AND club_id == this.club_id
                     AND event_date IN [week_start, week_start + 7 days)   # half-open
                     AND booking_status IN {CONFIRMED, COMPLETED}
                     AND id != this.id
      pool_used    = sum of scope[].pool_cases_used
      reserve_used = sum of scope[].reserve_cases_used

      # bucket 1 - the ordinary club-week pool
      bucket1_capacity = max(0, Product.weekly_sample_case_pool - pool_used)
      from_pool        = min(requested_sample_cases, bucket1_capacity)

      # bucket 2 - emergency reserve, PLATINUM manufacturers only
      need_after_pool  = requested_sample_cases - from_pool
      bucket2_capacity = (Manufacturer.program_tier == "PLATINUM")
                         ? max(0, Product.emergency_reserve_cases - reserve_used)
                         : 0
      from_reserve     = min(need_after_pool, bucket2_capacity)

      pool_cases_used       = from_pool
      reserve_cases_used    = from_reserve
      allocated_sample_cases = from_pool + from_reserve

      if allocated_sample_cases == 0                     -> ERR_SAMPLE_POOL_EXHAUSTED (409)
      if event_type == "FOOD_SAMPLING"
         and allocated_sample_cases < MIN_CASES_FOR_FOOD_SAMPLING
                                                          -> ERR_SAMPLE_ALLOCATION_BELOW_MINIMUM (422)
      # Partial allocation (0 < allocated < requested) is accepted for NON_FOOD_DEMO
      # events and for FOOD_SAMPLING events that still reach the 2-case minimum.
    input_set: "Only DemoEvent rows whose booking_status is CONFIRMED or COMPLETED consume the pool. DRAFT, SUBMITTED and CANCELLED rows consume nothing, which is what makes REVOKE_APPROVAL and CANCEL exact compensations."
    constants:
      MIN_CASES_FOR_FOOD_SAMPLING: 2
    precision: "integer cases, no rounding"
    variants: []

  - name: staffing_coverage
    trigger: "every mutation that inserts an EventAssignment or moves one out of {ASSIGNED, CONFIRMED, CHECKED_IN}, and every recompute of DemoEvent.required_support_count"
    algorithm: aggregation
    formula: |
      held          = EventAssignment rows on this DemoEvent
                      with assignment_status IN {ASSIGNED, CONFIRMED, CHECKED_IN}
      filled_lead    = count of held with role == "LEAD"
      filled_support = count of held with role == "SUPPORT"

      required_support_count = (event_type == "FOOD_SAMPLING"
                                and allocated_sample_cases >= SUPPORT_REQUIRED_CASE_THRESHOLD)
                               ? 1 : 0

      if filled_lead == 0 and filled_support == 0                       -> UNSTAFFED
      elif filled_lead >= 1 and filled_support >= required_support_count -> FULLY_STAFFED
      else                                                               -> PARTIALLY_STAFFED
      # EXECUTED and CLOSED_OUT are never produced here; they come from the
      # LEAD CHECK_IN and CLOSE_OUT transitions in 1.2.
    input_set: "Assignments with assignment_status IN {COMPLETED, NO_SHOW, RELEASED} never count toward coverage."
    constants:
      SUPPORT_REQUIRED_CASE_THRESHOLD: 6
    precision: "integer counts"
    variants: []

  - name: club_day_calendar_utilization
    trigger: "POST /demo-events/{id}/transitions action=APPROVE, and GET /clubs/{id}/capacity"
    algorithm: threshold
    formula: |
      scope = DemoEvent rows with club_id == C
              AND event_date == D
              AND booking_status IN {CONFIRMED, COMPLETED}
      confirmed_count      = count(scope)
      food_confirmed_count = count(scope where event_type == "FOOD_SAMPLING")
      category_count[k]    = count(scope where Product.category == k)

      remaining_slots = max(0, Club.daily_event_capacity - confirmed_count)

      # evaluated in exactly this order at APPROVE time
      if confirmed_count >= Club.daily_event_capacity          -> ERR_CLUB_DAY_CAPACITY_FULL (409)
      if event_type == "FOOD_SAMPLING"
         and food_confirmed_count >= Club.food_station_count   -> ERR_FOOD_STATION_UNAVAILABLE (409)
      if category_count[Product.category]
         >= MAX_EVENTS_PER_CATEGORY_PER_DAY                   -> ERR_CATEGORY_CALENDAR_CONFLICT (409)
    input_set: "The event being approved is NOT part of scope (its booking_status is still SUBMITTED when the checks run), so a club with daily_event_capacity 2 accepts exactly 2 approvals."
    constants:
      MAX_EVENTS_PER_CATEGORY_PER_DAY: 2
    precision: "integer counts; all three comparisons use >= (at-capacity rejects)"
    variants: []

  - name: demonstrator_reliability_score
    trigger: "every EventAssignment transition into COMPLETED, NO_SHOW or RELEASED, and POST /_inject/assignment-history; writes Demonstrator.reliability_score_rolling_90 and reliability_score_program_to_date"
    algorithm: weighted_scoring
    formula: |
      now = logical clock now
      all_scoped = EventAssignment rows with demonstrator_id == D
                   AND scheduled_start_utc < now

      # variant scope filter
      in_scope(ROLLING_90)      = all_scoped where scheduled_start_utc >= now - 90 days   # half-open [now-90d, now)
      in_scope(PROGRAM_TO_DATE) = all_scoped                                              # every past assignment

      completed_n = count(in_scope where assignment_status == "COMPLETED")
      no_show_n   = count(in_scope where assignment_status == "NO_SHOW")
      late_n      = count(in_scope where assignment_status == "COMPLETED" and late_check_in == true)

      raw   = 100
              - (no_show_n * NO_SHOW_PENALTY)
              - (late_n    * LATE_PENALTY)
              + (completed_n * COMPLETION_BONUS)
      score = ROUND_HALF_UP(min(100, max(0, raw)), 2)

      # separate counter, NOT part of the score
      no_show_strike_count = count(all_scoped where assignment_status == "NO_SHOW"
                                   and scheduled_start_utc >= now - STRIKE_LOOKBACK_DAYS days)
    input_set: "RELEASED assignments contribute nothing to either variant; they are recomputed only because releasing changes the row set. Assignments with scheduled_start_utc >= now are excluded from both variants."
    constants:
      NO_SHOW_PENALTY: 12
      LATE_PENALTY: 4
      COMPLETION_BONUS: 0.5
      LATE_GRACE_MINUTES: 10
      NO_SHOW_STRIKE_LIMIT: 3
      STRIKE_LOOKBACK_DAYS: 180
    precision: "2 decimal places, round_half_up; clamped to [0.00, 100.00]"
    variants:
      - name: ROLLING_90
        when: "written to Demonstrator.reliability_score_rolling_90; used by staffing dashboards"
        difference: "counts only assignments whose scheduled_start_utc falls in the half-open window [now - 90 days, now), so older completions and no-shows drop out of both the penalty and the bonus terms"
      - name: PROGRAM_TO_DATE
        when: "written to Demonstrator.reliability_score_program_to_date; used by annual review"
        difference: "counts every assignment with scheduled_start_utc < now with no lower bound, so the COMPLETION_BONUS term keeps accumulating and the same worker scores differently from the ROLLING_90 variant"

  - name: sales_lift_measurement
    trigger: "POST /demo-events/{id}/lift-measurements"
    algorithm: interval_merge
    formula: |
      baseline = the ClubProductBaseline row with club_id == DemoEvent.club_id
                 AND product_id == DemoEvent.product_id
      if baseline is absent                                   -> ERR_BASELINE_MISSING (422)

      if measurement_variant == "PROVISIONAL":
          attribution_days = PROVISIONAL_WINDOW_DAYS
          window_boundary  = "CLOSED"
          window_start_date = DemoEvent.event_date
          window_end_date   = DemoEvent.event_date + (attribution_days - 1) days   # inclusive
          cannibalization_units = 0.00
      else:   # FINAL
          attribution_days = DemoEvent.attribution_window_days
          window_boundary  = "HALF_OPEN"
          window_start_date = DemoEvent.event_date
          window_end_date   = DemoEvent.event_date + attribution_days days         # exclusive
          recon = the SampleReconciliation row for this DemoEvent
          if recon is absent                                  -> ERR_RECONCILIATION_UNRESOLVED (409)
          cannibalization_units = ROUND_HALF_UP(recon.units_sampled * SAMPLE_CANNIBALIZATION_RATE, 2)

      baseline_units_expected = ROUND_HALF_UP(baseline.baseline_weekly_units
                                              * attribution_days / 7, 2)
      lift_units = ROUND_HALF_UP(units_sold_in_window
                                 - baseline_units_expected
                                 - cannibalization_units, 2)
      lift_pct   = (baseline_units_expected == 0)
                   ? 0.00
                   : ROUND_HALF_UP(lift_units / baseline_units_expected * 100, 2)
      incremental_revenue_cents = ROUND_HALF_UP(lift_units
                                                * baseline.baseline_unit_price_cents)
    input_set: "baseline_weekly_units and baseline_unit_price_cents are snapshotted onto the measurement row at posting time; a later PATCH of the baseline marks the row STALE but never rewrites the snapshot."
    constants:
      PROVISIONAL_WINDOW_DAYS: 3
      SAMPLE_CANNIBALIZATION_RATE: 0.15
    precision: "baseline_units_expected, cannibalization_units, lift_units and lift_pct to 2 decimal places round_half_up; incremental_revenue_cents to whole cents round_half_up"
    variants:
      - name: PROVISIONAL
        when: "measurement_variant == PROVISIONAL, typically posted within days of the event"
        difference: "prorates the baseline over a fixed 3-day CLOSED window (window_end_date is inclusive) and applies no cannibalization deduction, so lift_units is systematically larger than the FINAL variant for the same units_sold_in_window"
      - name: FINAL
        when: "measurement_variant == FINAL, posted after the event's attribution_window_days have elapsed and after reconciliation"
        difference: "prorates the baseline over attribution_window_days as a HALF_OPEN window (window_end_date is exclusive) and subtracts ROUND_HALF_UP(units_sampled * 0.15, 2) cannibalization units, producing a different lift_units, lift_pct and incremental_revenue_cents from identical POS input"

  - name: sample_reconciliation_variance
    trigger: "POST /demo-events/{id}/sample-reconciliation, and POST /sample-reconciliations/{id}/write-off"
    algorithm: aggregation
    formula: |
      cases_delivered = sum of SampleShipment.cases_received over shipments of this
                        DemoEvent with shipment_status IN {DELIVERED, SHORT}
                        (shipments with shipment_status IN {IN_TRANSIT, REJECTED} contribute 0)
      units_per_case  = Product.samples_per_case            # snapshotted at creation
      units_delivered = cases_delivered * units_per_case

      variance_units  = units_delivered
                        - (units_sampled + units_wasted + units_returned)

      # zero-denominator guard is part of the contract, not an implementation detail
      variance_pct    = (units_delivered == 0)
                        ? 0.00
                        : ROUND_HALF_UP(abs(variance_units) / units_delivered * 100, 2)

      recon_status    = (variance_units == 0 or variance_pct <= VARIANCE_TOLERANCE_PCT)
                        ? "BALANCED" : "VARIANCE_FLAGGED"

      # only on write-off
      write_off_cost_cents = ROUND_HALF_UP(abs(variance_units) * Product.unit_cost_cents)

      # conservation identity that must hold for every reconciliation row:
      #   units_delivered == units_sampled + units_wasted + units_returned + variance_units
    input_set: "Exactly one SampleReconciliation may exist per DemoEvent; a second POST is rejected by ERR_DUPLICATE_RESOURCE."
    constants:
      VARIANCE_TOLERANCE_PCT: 2.00
    precision: "variance_pct to 2 decimal places round_half_up; costs to whole cents round_half_up"
    variants: []

  - name: event_invoice_total
    trigger: "POST /demo-events/{id}/invoice, and POST /event-invoices/{id}/transitions action=REDRAFT"
    algorithm: tiered_pricing
    formula: |
      # ---- STEP 1: build line_items. EVERY line is rounded to whole cents
      #      individually with ROUND_HALF_UP *before* it enters the sum.
      #      The sum itself is NEVER re-rounded. This order is normative:
      #      "round per line, then add" - not "add, then round".

      base_raw   = BASE_FEE_BY_EVENT_TYPE[event_type]
                   * CLUB_TIER_MULTIPLIER[Club.club_tier]
                   * DAY_PART_MULTIPLIER[DemoEvent.day_part]
      line(BASE) = ROUND_HALF_UP(base_raw)                 # single BASE line

      for each service in DemoEvent.addon_services, in the order the array declares:
          if ADDON_FLAT_CENTS has service:
              line(ADDON, service) = ADDON_FLAT_CENTS[service]
          else:
              line(ADDON, service) = ROUND_HALF_UP(line(BASE) * ADDON_PCT_OF_BASE[service])

      for each EventAssignment a on this event with assignment_status == "COMPLETED",
      ordered by a.created_at ASC:
          line(STAFFING, a) = ROUND_HALF_UP(a.billable_hours
                                            * Demonstrator.hourly_rate_cents
                                            * ROLE_MULTIPLIER[a.role])

      cases = SampleReconciliation.cases_delivered for this event (0 when no row exists)
      line(HANDLING, "per_case")  = cases * HANDLING_FEE_PER_CASE_CENTS
      if event_type == "FOOD_SAMPLING":
          line(HANDLING, "cold_chain") = cases * COLD_CHAIN_SURCHARGE_PER_CASE_CENTS

      line_items = [BASE line] ++ [ADDON lines] ++ [STAFFING lines] ++ [HANDLING lines]

      # ---- STEP 2: roll the rounded lines up
      base_fee_cents           = line(BASE)
      addon_fee_cents          = sum of ADDON lines
      staffing_fee_cents       = sum of STAFFING lines
      sample_handling_fee_cents = sum of HANDLING lines
      subtotal_cents           = sum of every line_items[].amount_cents

      # ---- STEP 3: discount is keyed on the manufacturer tier AND the month's
      #      completed-event count; it is applied to the rounded subtotal and
      #      rounded once more.
      monthly_completed_event_count =
          count of DemoEvent rows with manufacturer_id == this.manufacturer_id
          AND booking_status == "COMPLETED"
          AND event_date in the same calendar month as this event's event_date
      volume_step = (monthly_completed_event_count >= 12) ? 0.05
                  : (monthly_completed_event_count >= 5)  ? 0.02
                  :                                         0.00
      volume_discount_pct = min(0.10,
                                TIER_BASE_DISCOUNT[Manufacturer.program_tier] + volume_step)
      discount_cents      = ROUND_HALF_UP(subtotal_cents * volume_discount_pct)

      # ---- STEP 4
      total_due_cents = max(0, subtotal_cents - discount_cents - credit_applied_cents)
    input_set: "Only assignments with assignment_status == COMPLETED produce a STAFFING line; NO_SHOW and RELEASED assignments produce none. Only shipments with shipment_status IN {DELIVERED, SHORT} feed cases_delivered, so a REJECTED load bills no handling."
    constants:
      BASE_FEE_BY_EVENT_TYPE: { FOOD_SAMPLING: 42000, NON_FOOD_DEMO: 28000 }
      CLUB_TIER_MULTIPLIER: { FLAGSHIP: 1.25, STANDARD: 1.00, SATELLITE: 0.85 }
      DAY_PART_MULTIPLIER: { MORNING: 1.00, MIDDAY: 1.15, AFTERNOON: 1.05 }
      ADDON_FLAT_CENTS: { EXTRA_TABLE: 5000, VIDEO_LOOP: 7500, ALLERGEN_SIGNAGE: 2200 }
      ADDON_PCT_OF_BASE: { PREMIUM_PLACEMENT: 0.18, BILINGUAL_DEMONSTRATOR: 0.12 }
      ROLE_MULTIPLIER: { LEAD: 1.20, SUPPORT: 1.00 }
      MIN_BILLABLE_HOURS: 4.00
      HANDLING_FEE_PER_CASE_CENTS: 900
      COLD_CHAIN_SURCHARGE_PER_CASE_CENTS: 350
      TIER_BASE_DISCOUNT: { PLATINUM: 0.06, GOLD: 0.03, STANDARD: 0.00 }
    precision: "every line to whole cents round_half_up before summation; discount_cents to whole cents round_half_up; the subtotal and the total are pure integer arithmetic over already-rounded values"
    variants: []

  - name: cancellation_credit_amount
    trigger: "every cascade that creates a CancellationCredit: DemoEvent CONFIRMED -> CANCELLED, EventAssignment -> NO_SHOW, SampleShipment IN_TRANSIT -> SHORT on a FOOD_SAMPLING event, and the club-CLOSED system cancellation"
    algorithm: constraint_propagation
    formula: |
      # The tier that scales the credit is keyed on a base that is itself net of
      # previously applied credits, so the evaluation order below is normative.
      # Executing steps 5 and 3 in the other order changes the answer.

      # step 1
      prior_applied_cents = sum of CancellationCredit.credit_amount_cents over OTHER
                            rows with the same demo_event_id and credit_status == "APPLIED"

      # step 2
      inv = the EventInvoice for this demo_event_id with
            invoice_status IN {DRAFT, ISSUED, PAID}      # at most one can exist
      if inv exists:
          gross_base_cents = inv.subtotal_cents
      else:
          gross_base_cents = ROUND_HALF_UP(BASE_FEE_BY_EVENT_TYPE[event_type]
                                           * CLUB_TIER_MULTIPLIER[Club.club_tier]
                                           * DAY_PART_MULTIPLIER[day_part])

      # step 3  (depends on step 1 and step 2)
      billable_base_cents = max(0, gross_base_cents - prior_applied_cents)

      # step 4
      notice_hours = max(0, floor((DemoEvent.event_window_start_utc
                                   - logical clock now) / 3600 seconds))

      # step 5  (depends on step 3 - this is the circular-looking edge)
      bracket = (billable_base_cents >= NOTICE_BRACKET_SPLIT_CENTS) ? "HIGH" : "LOW"
      notice_tier_pct = NOTICE_TIER[bracket][
                            notice_hours >= 72 ? "GTE_72"
                          : notice_hours >= 24 ? "GTE_24_LT_72"
                          :                      "LT_24" ]

      # step 6
      reason_multiplier = REASON_MULTIPLIER[credit_reason]

      # step 7
      credit_amount_cents = min(billable_base_cents,
                                ROUND_HALF_UP(billable_base_cents
                                              * notice_tier_pct
                                              * reason_multiplier))
    input_set: "Only CancellationCredit rows with credit_status == APPLIED enter prior_applied_cents; PENDING_APPROVAL and REJECTED rows contribute 0. VOID invoices are excluded from the step-2 lookup, so voiding an invoice pushes the credit back onto the projected base."
    constants:
      NOTICE_BRACKET_SPLIT_CENTS: 50000
      NOTICE_TIER:
        HIGH: { GTE_72: 0.25, GTE_24_LT_72: 0.50, LT_24: 0.85 }
        LOW: { GTE_72: 0.15, GTE_24_LT_72: 0.35, LT_24: 0.70 }
      REASON_MULTIPLIER:
        CLUB_CANCELLED: 1.00
        DEMONSTRATOR_NO_SHOW: 1.00
        PRODUCT_SHORT: 0.60
        MANUFACTURER_CANCELLED_LATE: 0.00
        MANUFACTURER_CANCELLED_EARLY: 0.00
      BASE_FEE_BY_EVENT_TYPE: { FOOD_SAMPLING: 42000, NON_FOOD_DEMO: 28000 }
      CLUB_TIER_MULTIPLIER: { FLAGSHIP: 1.25, STANDARD: 1.00, SATELLITE: 0.85 }
      DAY_PART_MULTIPLIER: { MORNING: 1.00, MIDDAY: 1.15, AFTERNOON: 1.05 }
    precision: "whole cents, round_half_up, applied once at step 7 after the two multiplications"
    variants: []

  - name: manufacturer_receivable_rollup
    trigger: "every EventInvoice transition (ISSUE, VOID, REDRAFT, RECORD_PAYMENT) and every CancellationCredit APPROVED -> APPLIED"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents =
          sum of EventInvoice.total_due_cents over invoices with
          manufacturer_id == M AND invoice_status == "ISSUED"
      # DRAFT, VOID and PAID invoices contribute exactly 0.

      credit_note_balance_cents =
          sum of CancellationCredit.credit_amount_cents over credits with
          manufacturer_id == M AND credit_status == "APPLIED"
          AND applied_to_invoice_id IS NULL

      # Auto account_status transitions, evaluated after both sums:
      if outstanding_balance_cents > Manufacturer.credit_limit_cents
         and account_status == "ACTIVE"                     -> account_status = "HOLD"
      if outstanding_balance_cents <= Manufacturer.credit_limit_cents
         and account_status == "HOLD"                       -> account_status = "ACTIVE"
      # SUSPENDED is only ever set or cleared by PATCH /manufacturers/{id}.

      # Conservation invariant: for any manufacturer M at any instant,
      #   M.outstanding_balance_cents ==
      #       sum over EventInvoice(M, invoice_status == ISSUED) of total_due_cents
      # so ISSUE followed by VOID on the same invoice returns the field to its
      # exact pre-ISSUE integer value with zero drift.
    input_set: "Invoices of other manufacturers never contribute. Credits with credit_status IN {PENDING_APPROVAL, APPROVED, REJECTED} contribute 0 to credit_note_balance_cents."
    constants: {}
    precision: "integer cents; no rounding anywhere in this rollup"
    variants: []

  - name: equipment_window_conflict
    trigger: "POST /equipment-reservations"
    algorithm: interval_merge
    formula: |
      # Buffered half-open geometry, pairwise-exclusive resource (capacity 1).
      # Each stored interval is [window_start_utc, window_end_utc) and is padded
      # by SANITATION_BUFFER_MINUTES on BOTH sides before comparison.
      existing = EquipmentReservation rows with equipment_unit_id == this.equipment_unit_id
                 AND reservation_status IN {HELD, ACTIVE}
                 (RELEASED rows are ignored entirely)

      conflict(new, old) =
          new.window_start_utc < old.window_end_utc   + SANITATION_BUFFER_MINUTES
      AND old.window_start_utc < new.window_end_utc   + SANITATION_BUFFER_MINUTES

      if any old in existing has conflict(new, old)  -> ERR_EQUIPMENT_WINDOW_CONFLICT (409)

      # Consequence pinned for tests: a reservation starting exactly
      # 30 minutes after another one ends is ACCEPTED (strict <);
      # 29 minutes after is REJECTED.
    input_set: "Only HELD and ACTIVE reservations on the same equipment_unit_id are candidates; reservations on other units and RELEASED reservations never conflict."
    constants:
      SANITATION_BUFFER_MINUTES: 30
    precision: "whole minutes on UTC instants"
    variants: []

  - name: demonstrator_schedule_conflict
    trigger: "POST /demo-events/{id}/assignments"
    algorithm: interval_merge
    formula: |
      # CLOSED geometry with zero buffer, plus two aggregate capacity caps.
      # Deliberately different arithmetic from equipment_window_conflict: here a
      # touching endpoint IS a conflict and no buffer is added.
      held = EventAssignment rows with demonstrator_id == D
             AND assignment_status IN {ASSIGNED, CONFIRMED, CHECKED_IN}

      overlap(new, old) =
          new.scheduled_start_utc <= old.scheduled_end_utc
      AND old.scheduled_start_utc <= new.scheduled_end_utc

      if any old in held has overlap(new, old)   -> ERR_DEMONSTRATOR_DOUBLE_BOOKED (409)

      # aggregate cap 1: per calendar day
      same_day = count of (held plus rows with assignment_status == "COMPLETED")
                 whose DemoEvent.event_date == new DemoEvent.event_date
      if same_day >= MAX_ASSIGNMENTS_PER_DEMONSTRATOR_PER_DAY
                                                 -> ERR_DEMONSTRATOR_DAILY_CAP_EXCEEDED (409)

      # aggregate cap 2: per ISO week
      week_start = the Monday of the ISO week containing new DemoEvent.event_date
      same_week  = count of (held plus rows with assignment_status == "COMPLETED")
                   whose DemoEvent.event_date IN [week_start, week_start + 7 days)
      if same_week >= Demonstrator.max_weekly_events
                                                 -> ERR_DEMONSTRATOR_WEEKLY_CAP_EXCEEDED (409)

      # Consequences pinned for tests, using the shift windows derived in
      # calculations.event_window_and_shift_derivation
      # (MORNING [08:15Z, 14:15Z], MIDDAY [11:15Z, 17:15Z], AFTERNOON [14:15Z, 20:15Z]):
      #   - MORNING and MIDDAY on the same date overlap on [11:15Z, 14:15Z] -> conflict
      #   - MORNING and AFTERNOON on the same date merely TOUCH at 14:15Z
      #     (MORNING.scheduled_end_utc == AFTERNOON.scheduled_start_utc) and,
      #     because this geometry is CLOSED, that still counts as a conflict.
      #     The equipment unit's buffered half-open geometry accepts an
      #     equivalent 30-minute separation, so the two resources disagree.
    input_set: "COMPLETED assignments count toward the daily and weekly caps but never toward the overlap test; NO_SHOW and RELEASED assignments count toward neither."
    constants:
      MAX_ASSIGNMENTS_PER_DEMONSTRATOR_PER_DAY: 2
    precision: "whole minutes on UTC instants; caps are integer counts compared with >="
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of {ProgramAdmin, ClubOperations, Manufacturer, StaffingCoordinator, Demonstrator}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the request's X-User-Role appears in the endpoint's declared roles list in 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for multi-action endpoints, the role may perform the specific action: SUBMIT and CANCEL-from-DRAFT/SUBMITTED require Manufacturer or ProgramAdmin; APPROVE, REJECT, REVOKE_APPROVAL and CLOSE_OUT require ClubOperations or ProgramAdmin; CONFIRM, CHECK_IN and CHECK_OUT require Demonstrator or ProgramAdmin; NO_SHOW and RELEASE require StaffingCoordinator or ProgramAdmin"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /demo-events/{id}/transitions, POST /event-assignments/{id}/transitions"

  - priority: 4
    category: business_constraint
    check: "request body schema: every required field present, every enum member legal, every numeric range respected (requested_sample_cases 1..40, attribution_window_days 3..28, daily_event_capacity 1..12, food_station_count 0..8, max_weekly_events 1..14, addon_services members legal and duplicate-free, window_end_utc > window_start_utc, expires_on > issued_on, dates as YYYY-MM-DD, instants as ISO-8601 UTC)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "pagination: limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every GET endpoint whose input declares limit? and offset?"

  - priority: 6
    category: existence
    check: "each id in the URL path resolves, left to right; the family of 404 error_ids is enumerated in 1.6 (ERR_MANUFACTURER_NOT_FOUND, ERR_CLUB_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_DEMO_EVENT_NOT_FOUND, ERR_DEMONSTRATOR_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_RESOURCE_NOT_FOUND for every other type)"
    error_id: ERR_DEMO_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path id"

  - priority: 7
    category: existence
    check: "each foreign-key id in the request body resolves, in the order the endpoint's input list declares them (for example POST /demo-events checks manufacturer_id, then club_id, then product_id)"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /demo-events, POST /products, POST /club-product-baselines, POST /demonstrators, POST /equipment-units, POST /equipment-reservations, POST /demo-events/{id}/assignments, POST /_inject/assignment-history"

  - priority: 8
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target: Manufacturer must equal the resource's manufacturer_id; ClubOperations must equal the resource's club_id (or the DemoEvent's club_id); Demonstrator must equal the EventAssignment's demonstrator_id"
    error_id: ERR_RESOURCE_OWNERSHIP
    http_status: 403
    applies_to: "all write endpoints whose roles include Manufacturer, ClubOperations or Demonstrator"

  - priority: 9
    category: state
    check: "the target resource's current state appears as a `from:` state of the requested transition in 1.2 (covers a second CANCEL on a CANCELLED event, CONFIRM on an already CONFIRMED assignment, ISSUE on an ISSUED invoice, a decision on a decided credit, ACTIVATE on a RELEASED reservation, receive on a received shipment, write-off on a BALANCED reconciliation)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition, receive, write-off and decision endpoint"

  - priority: 10
    category: state
    check: "PATCH /demo-events/{id} is only accepted while booking_status == DRAFT"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /demo-events/{id}"

  - priority: 11
    category: state
    check: "CLOSE_OUT requires staffing_status == EXECUTED and every EventAssignment on the event in {COMPLETED, NO_SHOW, RELEASED}"
    error_id: ERR_EVENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 12
    category: state
    check: "invoice creation and reconciliation creation require DemoEvent.booking_status == COMPLETED"
    error_id: ERR_EVENT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /demo-events/{id}/invoice, POST /demo-events/{id}/sample-reconciliation"

  - priority: 13
    category: state
    check: "at most one EventInvoice per DemoEvent may have invoice_status IN {DRAFT, ISSUED, PAID}"
    error_id: ERR_INVOICE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /demo-events/{id}/invoice"

  - priority: 14
    category: state
    check: "expected_demo_event_version equals the current DemoEvent.version (concurrency_rules lift-measurement-create-stale-event and invoice-create-stale-event)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /demo-events/{id}/lift-measurements, POST /demo-events/{id}/invoice"

  - priority: 15
    category: business_safety
    check: "APPROVE of a FOOD_SAMPLING event requires Club.health_permit_expires_on >= DemoEvent.event_date"
    error_id: ERR_CLUB_HEALTH_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 16
    category: business_safety
    check: "the demonstrator's employment_status == ACTIVE"
    error_id: ERR_DEMONSTRATOR_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 17
    category: business_safety
    check: "for a FOOD_SAMPLING event the demonstrator holds a FoodSafetyCertification with cert_type == FOOD_HANDLER, revoked_at IS NULL and expires_on >= DemoEvent.event_date"
    error_id: ERR_FOOD_CERT_INVALID
    http_status: 422
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 18
    category: business_safety
    check: "when Product.requires_heat_equipment the demonstrator also holds a valid HEAT_EQUIPMENT certification, and when Product.allergen_flag the demonstrator also holds a valid ALLERGEN_AWARENESS certification (same validity test as priority 17)"
    error_id: ERR_SPECIALTY_CERT_MISSING
    http_status: 422
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 19
    category: business_safety
    check: "ACTIVATE requires EquipmentUnit.sanitation_status == SANITIZED; CHECK_IN on a FOOD_SAMPLING event requires the event's ACTIVE reservation's EquipmentUnit.sanitation_status == IN_USE"
    error_id: ERR_EQUIPMENT_NOT_SANITIZED
    http_status: 422
    applies_to: "POST /equipment-reservations/{id}/transitions, POST /event-assignments/{id}/transitions"

  - priority: 20
    category: business_referential
    check: "Product.manufacturer_id == DemoEvent.manufacturer_id"
    error_id: ERR_PRODUCT_MANUFACTURER_MISMATCH
    http_status: 422
    applies_to: "POST /demo-events, POST /demo-events/{id}/transitions"

  - priority: 21
    category: business_referential
    check: "Demonstrator.home_club_id == DemoEvent.club_id, unless the request sets travel_authorized to true"
    error_id: ERR_DEMONSTRATOR_CLUB_MISMATCH
    http_status: 422
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 22
    category: business_referential
    check: "EquipmentUnit.club_id == DemoEvent.club_id"
    error_id: ERR_EQUIPMENT_CLUB_MISMATCH
    http_status: 422
    applies_to: "POST /equipment-reservations"

  - priority: 23
    category: business_referential
    check: "a ClubProductBaseline row exists for (DemoEvent.club_id, DemoEvent.product_id)"
    error_id: ERR_BASELINE_MISSING
    http_status: 422
    applies_to: "POST /demo-events/{id}/lift-measurements"

  - priority: 24
    category: business_temporal
    check: "SUBMIT requires event_date >= logical clock UTC date + MIN_BOOKING_LEAD_DAYS (7)"
    error_id: ERR_BOOKING_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 25
    category: business_temporal
    check: "SUBMIT requires event_date <= logical clock UTC date + MAX_BOOKING_HORIZON_DAYS (120)"
    error_id: ERR_BOOKING_HORIZON_EXCEEDED
    http_status: 422
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 26
    category: business_temporal
    check: "window_start_utc <= DemoEvent.event_window_start_utc - SETUP_LEAD_MINUTES (45) AND window_end_utc >= DemoEvent.event_window_end_utc"
    error_id: ERR_RESERVATION_WINDOW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /equipment-reservations"

  - priority: 27
    category: business_temporal
    check: "calculations.equipment_window_conflict finds no HELD or ACTIVE reservation on the same equipment_unit_id within the 30-minute buffered half-open geometry"
    error_id: ERR_EQUIPMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /equipment-reservations"

  - priority: 28
    category: business_temporal
    check: "calculations.demonstrator_schedule_conflict finds no ASSIGNED, CONFIRMED or CHECKED_IN assignment of the same demonstrator whose closed interval touches or overlaps the new one"
    error_id: ERR_DEMONSTRATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 29
    category: business_temporal
    check: "the CHECK_IN or CHECK_OUT instant (occurred_at_utc when supplied, otherwise the logical clock) is <= the logical clock now, and for CHECK_IN lies within [scheduled_start_utc - 60 minutes, scheduled_end_utc], and for CHECK_OUT is > check_in_at"
    error_id: ERR_CHECK_IN_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /event-assignments/{id}/transitions"

  - priority: 30
    category: business_temporal
    check: "NO_SHOW requires the logical clock now >= scheduled_start_utc + NO_SHOW_GRACE_MINUTES (15)"
    error_id: ERR_NO_SHOW_TOO_EARLY
    http_status: 422
    applies_to: "POST /event-assignments/{id}/transitions"

  - priority: 31
    category: business_constraint
    check: "APPROVE requires the host club to be operating: Club.club_status == OPEN, or Club.club_status == RESTRICTED together with event_type == NON_FOOD_DEMO. A CLOSED club blocks every approval; a RESTRICTED club blocks FOOD_SAMPLING approvals only."
    error_id: ERR_CLUB_NOT_OPEN
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 32
    category: business_constraint
    check: "count of DemoEvent with the same club_id and event_date and booking_status IN {CONFIRMED, COMPLETED} < Club.daily_event_capacity"
    error_id: ERR_CLUB_DAY_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 33
    category: business_constraint
    check: "for a FOOD_SAMPLING event, count of same-club same-date FOOD_SAMPLING events with booking_status IN {CONFIRMED, COMPLETED} < Club.food_station_count"
    error_id: ERR_FOOD_STATION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 34
    category: business_constraint
    check: "count of same-club same-date events with booking_status IN {CONFIRMED, COMPLETED} whose Product.category equals this Product.category < MAX_EVENTS_PER_CATEGORY_PER_DAY (2)"
    error_id: ERR_CATEGORY_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 35
    category: business_constraint
    check: "the demonstrator's same-date assignment count (statuses {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED}) < MAX_ASSIGNMENTS_PER_DEMONSTRATOR_PER_DAY (2)"
    error_id: ERR_DEMONSTRATOR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 36
    category: business_constraint
    check: "the demonstrator's same-ISO-week assignment count (statuses {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED}) < Demonstrator.max_weekly_events"
    error_id: ERR_DEMONSTRATOR_WEEKLY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 37
    category: business_constraint
    check: "an event may hold at most one assignment with role == LEAD whose assignment_status IN {ASSIGNED, CONFIRMED, CHECKED_IN, COMPLETED}"
    error_id: ERR_LEAD_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /demo-events/{id}/assignments"

  - priority: 38
    category: business_constraint
    check: "uniqueness: Club.club_number globally; (Product.manufacturer_id, Product.sku); (EquipmentUnit.club_id, EquipmentUnit.asset_tag); (ClubProductBaseline.club_id, ClubProductBaseline.product_id); one SampleReconciliation per demo_event_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /clubs, POST /products, POST /equipment-units, POST /club-product-baselines, POST /demo-events/{id}/sample-reconciliation"

  - priority: 39
    category: business_constraint
    check: "Product.requires_heat_equipment may only be true when requires_food_handling is also true"
    error_id: ERR_PRODUCT_FLAG_INCONSISTENT
    http_status: 422
    applies_to: "POST /products"

  - priority: 40
    category: business_fiscal
    check: "Manufacturer.account_status != SUSPENDED"
    error_id: ERR_MANUFACTURER_SUSPENDED
    http_status: 402
    applies_to: "POST /demo-events, POST /demo-events/{id}/transitions, POST /event-invoices/{id}/transitions"

  - priority: 41
    category: business_fiscal
    check: "SUBMIT and APPROVE require Manufacturer.account_status == ACTIVE (a HOLD account keeps DRAFT editing but cannot advance a booking)"
    error_id: ERR_MANUFACTURER_ON_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 42
    category: business_fiscal
    check: "calculations.sample_allocation_waterfall yields allocated_sample_cases >= 1"
    error_id: ERR_SAMPLE_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 43
    category: business_fiscal
    check: "for a FOOD_SAMPLING event, allocated_sample_cases >= MIN_CASES_FOR_FOOD_SAMPLING (2)"
    error_id: ERR_SAMPLE_ALLOCATION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 44
    category: business_fiscal
    check: "cases_received <= SampleShipment.cases_shipped"
    error_id: ERR_RECEIVED_EXCEEDS_SHIPPED
    http_status: 422
    applies_to: "POST /sample-shipments/{id}/receive"

  - priority: 45
    category: business_fiscal
    check: "CLOSE_OUT of a FOOD_SAMPLING event requires the sum of cases_received over shipments with shipment_status IN {DELIVERED, SHORT} to be >= 1"
    error_id: ERR_SAMPLES_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /demo-events/{id}/transitions"

  - priority: 46
    category: business_fiscal
    check: "ISSUE requires the event's SampleReconciliation to have recon_status IN {BALANCED, WRITTEN_OFF}; a FINAL lift measurement requires a SampleReconciliation row to exist"
    error_id: ERR_RECONCILIATION_UNRESOLVED
    http_status: 409
    applies_to: "POST /event-invoices/{id}/transitions, POST /demo-events/{id}/lift-measurements"

  - priority: 47
    category: business_fiscal
    check: "RECORD_PAYMENT requires amount_cents == EventInvoice.total_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /event-invoices/{id}/transitions"

  - priority: 48
    category: auth
    check: "segregation of duties: when an EventInvoice for the credit's demo_event_id has invoice_status IN {ISSUED, PAID}, the acting X-User-ID on the credit decision must differ from that invoice's issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cancellation-credits/{id}/decisions"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Manufacturer --------------------------------------------------------
  - method: POST
    path: "/manufacturers"
    description: "Register a vendor that books demos."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, billing_email, program_tier, credit_limit_cents, credit_terms_days]
    output: Manufacturer
    side_effects: ["initialises account_status to ACTIVE, outstanding_balance_cents to 0 and credit_note_balance_cents to 0"]

  - method: GET
    path: "/manufacturers/{id}"
    description: "Read one manufacturer, including the receivable rollup fields."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  - method: PATCH
    path: "/manufacturers/{id}"
    description: "Operator maintenance of credit terms and account standing."
    roles: [ProgramAdmin]
    code: 200
    input: ["account_status?", "credit_limit_cents?", "credit_terms_days?", "billing_email?"]
    output: Manufacturer
    side_effects:
      - "re-evaluates the credit-limit auto-transition after a credit_limit_cents change"
      - "increments Manufacturer.version by 1"

  # ---- Club ----------------------------------------------------------------
  - method: POST
    path: "/clubs"
    description: "Register a warehouse club with its day capacity and health permit."
    roles: [ProgramAdmin]
    code: 201
    input: [club_number, name, region_code, club_tier, daily_event_capacity, food_station_count, health_permit_expires_on]
    output: Club
    side_effects: ["initialises club_status to OPEN"]

  - method: GET
    path: "/clubs/{id}"
    description: "Read one club."
    roles: [ProgramAdmin, ClubOperations, Manufacturer, StaffingCoordinator]
    code: 200
    input: []
    output: Club
    side_effects: []

  - method: PATCH
    path: "/clubs/{id}"
    description: "Update club status, capacity or health permit."
    roles: [ProgramAdmin, ClubOperations]
    code: 200
    input: ["club_status?", "daily_event_capacity?", "food_station_count?", "health_permit_expires_on?"]
    output: Club
    side_effects:
      - "setting club_status to CLOSED cancels every DemoEvent at this club with booking_status == CONFIRMED and event_date >= the logical clock UTC date, with cancellation_reason CLUB_CANCELLED and one PENDING_APPROVAL CancellationCredit each"
      - "increments Club.version by 1"

  - method: GET
    path: "/clubs/{id}/capacity"
    description: "Computed read of one club-day's calendar utilisation and, when product_id is supplied, the club-week sample pool remaining for that SKU."
    roles: [ProgramAdmin, ClubOperations, Manufacturer]
    code: 200
    input: [event_date, "product_id?"]
    output: "{ club_id: string, event_date: string, daily_event_capacity: integer, confirmed_count: integer, remaining_slots: integer, food_station_count: integer, food_confirmed_count: integer, category_counts: object, week_start_date: string, weekly_sample_case_pool: integer, pool_cases_used: integer, pool_remaining: integer, emergency_reserve_cases: integer, reserve_cases_used: integer, reserve_remaining: integer }"
    side_effects: []

  # ---- Product -------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Register a demonstrable SKU with its sampling pool."
    roles: [ProgramAdmin, Manufacturer]
    code: 201
    input: [manufacturer_id, sku, name, category, requires_food_handling, requires_heat_equipment, allergen_flag, unit_cost_cents, samples_per_case, weekly_sample_case_pool, "emergency_reserve_cases?"]
    output: Product
    side_effects: ["computes nothing beyond defaults; emergency_reserve_cases defaults to 0"]

  - method: GET
    path: "/products/{id}"
    description: "Read one product."
    roles: [ProgramAdmin, Manufacturer, ClubOperations]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products, filterable by owning manufacturer and category."
    roles: [ProgramAdmin, Manufacturer, ClubOperations]
    code: 200
    input: ["manufacturer_id?", "category?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- ClubProductBaseline -------------------------------------------------
  - method: POST
    path: "/club-product-baselines"
    description: "Record the pre-demo run rate for one club and SKU."
    roles: [ProgramAdmin]
    code: 201
    input: [club_id, product_id, baseline_weekly_units, baseline_unit_price_cents, baseline_week_start_date]
    output: ClubProductBaseline
    side_effects: ["initialises restatement_count to 0"]

  - method: GET
    path: "/club-product-baselines/{id}"
    description: "Read one baseline row."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: []
    output: ClubProductBaseline
    side_effects: []

  - method: GET
    path: "/club-product-baselines"
    description: "List baselines, filterable by club and product."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: ["club_id?", "product_id?", "limit?", "offset?"]
    output: ClubProductBaseline[]
    side_effects: []

  - method: PATCH
    path: "/club-product-baselines/{id}"
    description: "Restate a baseline after a POS correction."
    roles: [ProgramAdmin]
    code: 200
    input: ["baseline_weekly_units?", "baseline_unit_price_cents?"]
    output: ClubProductBaseline
    side_effects:
      - "when either value actually changes, increments restatement_count by 1 and sets every SalesLiftMeasurement with measurement_status == POSTED on events of this (club_id, product_id) to STALE"
      - "increments ClubProductBaseline.version by 1"

  # ---- Demonstrator + certifications ---------------------------------------
  - method: POST
    path: "/demonstrators"
    description: "Add a demonstrator to a club's roster."
    roles: [ProgramAdmin, StaffingCoordinator]
    code: 201
    input: [home_club_id, full_name, hourly_rate_cents, "max_weekly_events?"]
    output: Demonstrator
    side_effects: ["initialises employment_status ACTIVE, both reliability scores to 100.00, no_show_strike_count 0 and completed_event_count 0"]

  - method: GET
    path: "/demonstrators/{id}"
    description: "Read one demonstrator, including both reliability score variants."
    roles: [ProgramAdmin, StaffingCoordinator, Demonstrator, ClubOperations]
    code: 200
    input: []
    output: Demonstrator
    side_effects: []

  - method: GET
    path: "/demonstrators"
    description: "List demonstrators, filterable by home club and employment status."
    roles: [ProgramAdmin, StaffingCoordinator, ClubOperations]
    code: 200
    input: ["home_club_id?", "employment_status?", "limit?", "offset?"]
    output: Demonstrator[]
    side_effects: []

  - method: PATCH
    path: "/demonstrators/{id}"
    description: "Update employment status, rate or weekly cap."
    roles: [ProgramAdmin, StaffingCoordinator]
    code: 200
    input: ["employment_status?", "hourly_rate_cents?", "max_weekly_events?"]
    output: Demonstrator
    side_effects:
      - "setting employment_status to ON_LEAVE or TERMINATED releases every assignment of this demonstrator with assignment_status IN {ASSIGNED, CONFIRMED} whose DemoEvent.event_date >= the logical clock UTC date, and downgrades each of those events' staffing_status"
      - "increments Demonstrator.version by 1"

  - method: POST
    path: "/demonstrators/{id}/certifications"
    description: "File a food-safety certificate for a demonstrator."
    roles: [ProgramAdmin, StaffingCoordinator]
    code: 201
    input: [cert_type, certificate_number, issued_on, expires_on]
    output: FoodSafetyCertification
    side_effects: ["computes cert_status from revoked_at and expires_on against the logical clock date"]

  - method: GET
    path: "/demonstrators/{id}/certifications"
    description: "List a demonstrator's certificates with their derived cert_status."
    roles: [ProgramAdmin, StaffingCoordinator, Demonstrator]
    code: 200
    input: ["cert_type?", "limit?", "offset?"]
    output: FoodSafetyCertification[]
    side_effects: []

  - method: POST
    path: "/demonstrators/{id}/certifications/{certification_id}/revoke"
    description: "Revoke a certificate; the demonstrator immediately fails the certification gate."
    roles: [ProgramAdmin, StaffingCoordinator]
    code: 200
    input: ["reason?"]
    output: FoodSafetyCertification
    side_effects:
      - "sets revoked_at to the logical clock now and cert_status to REVOKED"
      - "increments FoodSafetyCertification.version by 1"

  # ---- EquipmentUnit -------------------------------------------------------
  - method: POST
    path: "/equipment-units"
    description: "Register a demo equipment unit at a club."
    roles: [ProgramAdmin, ClubOperations]
    code: 201
    input: [club_id, asset_tag, equipment_type]
    output: EquipmentUnit
    side_effects: ["computes requires_food_cert from equipment_type; initialises sanitation_status to SANITIZED"]

  - method: GET
    path: "/equipment-units/{id}"
    description: "Read one equipment unit."
    roles: [ProgramAdmin, ClubOperations, StaffingCoordinator]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/equipment-units"
    description: "List equipment units, filterable by club, type and sanitation state."
    roles: [ProgramAdmin, ClubOperations, StaffingCoordinator]
    code: 200
    input: ["club_id?", "equipment_type?", "sanitation_status?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []

  - method: PATCH
    path: "/equipment-units/{id}"
    description: "Record a sanitation state change (health code log)."
    roles: [ProgramAdmin, ClubOperations]
    code: 200
    input: ["sanitation_status?"]
    output: EquipmentUnit
    side_effects:
      - "setting sanitation_status to SANITIZED stamps last_sanitized_at with the logical clock now"
      - "increments EquipmentUnit.version by 1"

  # ---- DemoEvent -----------------------------------------------------------
  - method: POST
    path: "/demo-events"
    description: "Book a demo in DRAFT. event_type, the UTC event window and required_support_count are derived server-side."
    roles: [ProgramAdmin, Manufacturer]
    code: 201
    input: [manufacturer_id, club_id, product_id, event_date, day_part, requested_sample_cases, "attribution_window_days?", "addon_services?"]
    output: DemoEvent
    side_effects:
      - "computes event_type from Product.requires_food_handling"
      - "computes event_window_start_utc and event_window_end_utc from event_date and day_part"
      - "initialises booking_status DRAFT, staffing_status UNSTAFFED, settlement_status UNBILLED, allocated_sample_cases 0"

  - method: GET
    path: "/demo-events/{id}"
    description: "Read one demo event, including both state dimensions and the version needed for OCC calls."
    roles: [ProgramAdmin, ClubOperations, Manufacturer, StaffingCoordinator, Demonstrator]
    code: 200
    input: []
    output: DemoEvent
    side_effects: []

  - method: GET
    path: "/demo-events"
    description: "List demo events with filtering and pagination."
    roles: [ProgramAdmin, ClubOperations, Manufacturer, StaffingCoordinator, Demonstrator]
    code: 200
    input: ["manufacturer_id?", "club_id?", "product_id?", "event_date?", "booking_status?", "staffing_status?", "limit?", "offset?"]
    output: DemoEvent[]
    side_effects: []

  - method: PATCH
    path: "/demo-events/{id}"
    description: "Revise a DRAFT booking (the other half of the REJECT revision cycle)."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: ["event_date?", "day_part?", "requested_sample_cases?", "attribution_window_days?", "addon_services?"]
    output: DemoEvent
    side_effects:
      - "recomputes event_window_start_utc and event_window_end_utc when event_date or day_part changes"
      - "increments DemoEvent.version by 1"

  - method: POST
    path: "/demo-events/{id}/transitions"
    description: "Advance the booking dimension. action is one of SUBMIT, REJECT, APPROVE, REVOKE_APPROVAL, CLOSE_OUT, CANCEL."
    roles: [ProgramAdmin, ClubOperations, Manufacturer]
    code: 200
    input: [action, "reason?"]
    output: DemoEvent
    side_effects:
      - "APPROVE runs calculations.sample_allocation_waterfall and calculations.club_day_calendar_utilization"
      - "REVOKE_APPROVAL and CANCEL restore the club-week sample pool and release assignments and reservations"
      - "CANCEL from CONFIRMED creates one PENDING_APPROVAL CancellationCredit via calculations.cancellation_credit_amount"
      - "CLOSE_OUT sets staffing_status to CLOSED_OUT and releases reservations"
      - "increments DemoEvent.version by 1"

  # ---- EventAssignment ----------------------------------------------------
  - method: POST
    path: "/demo-events/{id}/assignments"
    description: "Assign a demonstrator to a CONFIRMED event; runs the certification, overlap and cap gates and advances the staffing dimension."
    roles: [ProgramAdmin, StaffingCoordinator]
    code: 201
    input: [demonstrator_id, role, "travel_authorized?", "replaces_assignment_id?"]
    output: EventAssignment
    side_effects:
      - "computes scheduled_start_utc and scheduled_end_utc from the event window"
      - "runs calculations.demonstrator_schedule_conflict and calculations.staffing_coverage"
      - "advances DemoEvent.staffing_status and increments DemoEvent.version by 1"

  - method: GET
    path: "/event-assignments/{id}"
    description: "Read one assignment."
    roles: [ProgramAdmin, StaffingCoordinator, Demonstrator, ClubOperations]
    code: 200
    input: []
    output: EventAssignment
    side_effects: []

  - method: GET
    path: "/event-assignments"
    description: "List assignments, filterable by event, demonstrator, replaced assignment and status."
    roles: [ProgramAdmin, StaffingCoordinator, Demonstrator, ClubOperations]
    code: 200
    input: ["demo_event_id?", "demonstrator_id?", "replaces_assignment_id?", "assignment_status?", "limit?", "offset?"]
    output: EventAssignment[]
    side_effects: []

  - method: POST
    path: "/event-assignments/{id}/transitions"
    description: "Advance one assignment. action is one of CONFIRM, CHECK_IN, CHECK_OUT, NO_SHOW, RELEASE. occurred_at_utc backdates the CHECK_IN/CHECK_OUT stamp inside the legal window and must be <= the logical clock now."
    roles: [ProgramAdmin, StaffingCoordinator, Demonstrator]
    code: 200
    input: [action, "occurred_at_utc?", "note?"]
    output: EventAssignment
    side_effects:
      - "CHECK_IN on a LEAD drives DemoEvent.staffing_status FULLY_STAFFED -> EXECUTED"
      - "CHECK_OUT computes hours_worked then billable_hours and recomputes both Demonstrator reliability variants"
      - "NO_SHOW runs the four-hop strike cascade and creates one PENDING_APPROVAL CancellationCredit"
      - "RELEASE downgrades staffing_status without a strike or a credit"
      - "increments EventAssignment.version by 1"

  # ---- EquipmentReservation -----------------------------------------------
  - method: POST
    path: "/equipment-reservations"
    description: "Hold an equipment unit for an event's occupation window."
    roles: [ProgramAdmin, ClubOperations, StaffingCoordinator]
    code: 201
    input: [equipment_unit_id, demo_event_id, window_start_utc, window_end_utc]
    output: EquipmentReservation
    side_effects:
      - "runs calculations.equipment_window_conflict against HELD and ACTIVE reservations on the same unit"
      - "initialises reservation_status HELD and buffer_minutes 30"

  - method: GET
    path: "/equipment-reservations/{id}"
    description: "Read one reservation."
    roles: [ProgramAdmin, ClubOperations, StaffingCoordinator]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: []

  - method: GET
    path: "/equipment-reservations"
    description: "List reservations, filterable by unit, event and status."
    roles: [ProgramAdmin, ClubOperations, StaffingCoordinator]
    code: 200
    input: ["equipment_unit_id?", "demo_event_id?", "reservation_status?", "limit?", "offset?"]
    output: EquipmentReservation[]
    side_effects: []

  - method: POST
    path: "/equipment-reservations/{id}/transitions"
    description: "Advance a reservation. action is ACTIVATE or RELEASE."
    roles: [ProgramAdmin, ClubOperations]
    code: 200
    input: [action]
    output: EquipmentReservation
    side_effects:
      - "ACTIVATE sets the EquipmentUnit to IN_USE; RELEASE from ACTIVE sets it to SOILED"
      - "increments EquipmentReservation.version by 1"

  # ---- SampleShipment ----------------------------------------------------
  - method: POST
    path: "/demo-events/{id}/sample-shipments"
    description: "Dispatch sample cases to the club for a CONFIRMED event."
    roles: [ProgramAdmin, Manufacturer]
    code: 201
    input: [cases_shipped, carrier_reference]
    output: SampleShipment
    side_effects: ["initialises shipment_status IN_TRANSIT and stamps shipped_at with the logical clock now"]

  - method: GET
    path: "/demo-events/{id}/sample-shipments"
    description: "List the shipments staged for one event."
    roles: [ProgramAdmin, ClubOperations, Manufacturer]
    code: 200
    input: ["shipment_status?", "limit?", "offset?"]
    output: SampleShipment[]
    side_effects: []

  - method: POST
    path: "/sample-shipments/{id}/receive"
    description: "Count a load in at the club dock; forks to DELIVERED, SHORT or REJECTED."
    roles: [ProgramAdmin, ClubOperations]
    code: 200
    input: [cases_received]
    output: SampleShipment
    side_effects:
      - "SHORT re-writes DemoEvent.allocated_sample_cases, then required_support_count, then staffing_status, and creates a PRODUCT_SHORT PENDING_APPROVAL CancellationCredit for FOOD_SAMPLING events"
      - "REJECTED changes neither the allocation nor the credit ledger"
      - "increments SampleShipment.version by 1"

  # ---- SampleReconciliation ----------------------------------------------
  - method: POST
    path: "/demo-events/{id}/sample-reconciliation"
    description: "File the post-event sample count for a COMPLETED event; auto-forks to BALANCED or VARIANCE_FLAGGED."
    roles: [ProgramAdmin, ClubOperations]
    code: 201
    input: [units_sampled, units_wasted, units_returned]
    output: SampleReconciliation
    side_effects:
      - "snapshots units_per_case, derives cases_delivered and units_delivered, then variance_units, variance_pct and recon_status"

  - method: GET
    path: "/demo-events/{id}/sample-reconciliation"
    description: "Read the event's reconciliation as an array of length 0 or 1."
    roles: [ProgramAdmin, ClubOperations, Manufacturer]
    code: 200
    input: []
    output: SampleReconciliation[]
    side_effects: []

  - method: POST
    path: "/sample-reconciliations/{id}/write-off"
    description: "Accept a flagged variance as a loss so the invoice can be issued."
    roles: [ProgramAdmin]
    code: 200
    input: ["note?"]
    output: SampleReconciliation
    side_effects:
      - "sets recon_status WRITTEN_OFF and write_off_cost_cents"
      - "increments SampleReconciliation.version by 1"

  # ---- SalesLiftMeasurement ----------------------------------------------
  - method: POST
    path: "/demo-events/{id}/lift-measurements"
    description: "Post a PROVISIONAL or FINAL sales-lift measurement. Guarded by OCC on the parent DemoEvent.version."
    roles: [ProgramAdmin, Manufacturer]
    code: 201
    input: [measurement_variant, units_sold_in_window, expected_demo_event_version]
    output: SalesLiftMeasurement
    side_effects:
      - "runs calculations.sales_lift_measurement and snapshots the baseline figures"
      - "sets any earlier POSTED or STALE measurement of the same measurement_variant on this event to SUPERSEDED"
      - "increments DemoEvent.version by 1"

  - method: GET
    path: "/demo-events/{id}/lift-measurements"
    description: "List an event's measurements, newest first by created_at DESC."
    roles: [ProgramAdmin, Manufacturer, ClubOperations]
    code: 200
    input: ["measurement_variant?", "limit?", "offset?"]
    output: SalesLiftMeasurement[]
    side_effects: []

  # ---- EventInvoice ------------------------------------------------------
  - method: POST
    path: "/demo-events/{id}/invoice"
    description: "Create the DRAFT per-event invoice for a COMPLETED event. Guarded by OCC on the parent DemoEvent.version."
    roles: [ProgramAdmin]
    code: 201
    input: [expected_demo_event_version]
    output: EventInvoice
    side_effects:
      - "runs calculations.event_invoice_total, writing line_items and every rolled-up money field"
      - "snapshots credit_terms_days and manufacturer_id"
      - "increments DemoEvent.version by 1"

  - method: GET
    path: "/event-invoices/{id}"
    description: "Read one invoice with its rounded line items."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: []
    output: EventInvoice
    side_effects: []

  - method: GET
    path: "/event-invoices"
    description: "List invoices, filterable by event, manufacturer and status."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: ["demo_event_id?", "manufacturer_id?", "invoice_status?", "limit?", "offset?"]
    output: EventInvoice[]
    side_effects: []

  - method: POST
    path: "/event-invoices/{id}/transitions"
    description: "Advance an invoice. action is ISSUE, VOID, REDRAFT or RECORD_PAYMENT; amount_cents is required for RECORD_PAYMENT."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "amount_cents?"]
    output: EventInvoice
    side_effects:
      - "ISSUE stamps issued_by_user_id, recomputes Manufacturer.outstanding_balance_cents and may auto-HOLD the account"
      - "VOID reverses the receivable exactly and may auto-release a HOLD"
      - "REDRAFT re-runs calculations.event_invoice_total while preserving credit_applied_cents"
      - "recomputes DemoEvent.settlement_status and increments DemoEvent.version by 1"
      - "increments EventInvoice.version by 1"

  # ---- CancellationCredit ------------------------------------------------
  - method: GET
    path: "/cancellation-credits/{id}"
    description: "Read one cancellation credit with its full valuation trace."
    roles: [ProgramAdmin, Manufacturer]
    code: 200
    input: []
    output: CancellationCredit
    side_effects: []

  - method: GET
    path: "/cancellation-credits"
    description: "List cancellation credits, filterable by event, manufacturer and status. Credits are only ever created by cascade, so this is their discovery channel."
    roles: [ProgramAdmin, Manufacturer, ClubOperations]
    code: 200
    input: ["demo_event_id?", "manufacturer_id?", "applied_to_invoice_id?", "credit_status?", "limit?", "offset?"]
    output: CancellationCredit[]
    side_effects: []

  - method: POST
    path: "/cancellation-credits/{id}/decisions"
    description: "Approve or reject a pending credit. decision is APPROVE or REJECT. APPROVE auto-applies in the same request and is subject to the segregation-of-duties check."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "note?"]
    output: CancellationCredit
    side_effects:
      - "APPROVE runs the four-hop application cascade onto the invoice, the manufacturer receivable and the account status"
      - "REJECT leaves every money field untouched"
      - "increments CancellationCredit.version by 1"

  # ---- Test-driving endpoints (declared contract, /_ namespace) -----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, expiry, attribution window and lookback in this scaffold is evaluated against this logical clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "recomputes every FoodSafetyCertification.cert_status against the new date"
      - "does NOT retroactively fire any state transition"

  - method: POST
    path: "/_inject/assignment-history"
    description: "Seed historical EventAssignment rows for one demonstrator without replaying the booking workflow, then recompute that demonstrator's reliability variants and strike count. Bypasses the certification, overlap and cap gates by design; entries is an array of objects { scheduled_start_utc, scheduled_end_utc, assignment_status, role, check_in_at?, check_out_at? }."
    roles: [ProgramAdmin]
    code: 201
    input: [demonstrator_id, demo_event_id, entries]
    output: EventAssignment[]
    side_effects:
      - "inserts one EventAssignment per entry with the supplied assignment_status, computing hours_worked, billable_hours and late_check_in from the supplied stamps"
      - "recomputes Demonstrator.reliability_score_rolling_90, reliability_score_program_to_date, no_show_strike_count and completed_event_count"
      - "does NOT touch DemoEvent.staffing_status and creates no CancellationCredit"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / schema ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "role is absent from the endpoint's roles list, or the role may not perform the requested action on a multi-action endpoint"
  - id: ERR_RESOURCE_OWNERSHIP
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (Manufacturer on another vendor's event, ClubOperations on another club's event, Demonstrator on another worker's assignment)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ProgramAdmin deciding a CancellationCredit is the same X-User-ID that issued the event's ISSUED or PAID invoice"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required body field, illegal enum member, out-of-range number, malformed date or instant, duplicate addon_services member, or pagination limit/offset out of bounds"

  # --- existence ---
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "manufacturer id in the path or body does not resolve"
  - id: ERR_CLUB_NOT_FOUND
    http: 404
    condition: "club id in the path or body does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id in the path or body does not resolve"
  - id: ERR_DEMO_EVENT_NOT_FOUND
    http: 404
    condition: "demo event id in the path or body does not resolve"
  - id: ERR_DEMONSTRATOR_NOT_FOUND
    http: 404
    condition: "demonstrator id in the path or body does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "event assignment id in the path or in replaces_assignment_id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "event invoice id in the path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an equipment unit, equipment reservation, sample shipment, sample reconciliation, cancellation credit, club-product baseline or certification id does not resolve"

  # --- state / OCC ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current state is not a declared `from:` state of the requested transition, or PATCH /demo-events/{id} is attempted outside DRAFT"
  - id: ERR_EVENT_NOT_EXECUTED
    http: 409
    condition: "CLOSE_OUT attempted while staffing_status != EXECUTED or while some assignment is still ASSIGNED, CONFIRMED or CHECKED_IN"
  - id: ERR_EVENT_NOT_COMPLETED
    http: 409
    condition: "invoice creation or reconciliation filing attempted while booking_status != COMPLETED"
  - id: ERR_INVOICE_ALREADY_EXISTS
    http: 409
    condition: "an EventInvoice with invoice_status IN {DRAFT, ISSUED, PAID} already exists for the event"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_demo_event_version does not equal the current DemoEvent.version"

  # --- business_safety ---
  - id: ERR_CLUB_HEALTH_PERMIT_EXPIRED
    http: 422
    condition: "APPROVE of a FOOD_SAMPLING event where Club.health_permit_expires_on < event_date"
  - id: ERR_DEMONSTRATOR_NOT_ACTIVE
    http: 422
    condition: "assignment attempted for a demonstrator whose employment_status is ON_LEAVE or TERMINATED"
  - id: ERR_FOOD_CERT_INVALID
    http: 422
    condition: "assignment to a FOOD_SAMPLING event where the demonstrator has no FOOD_HANDLER certificate with revoked_at null and expires_on >= event_date"
  - id: ERR_SPECIALTY_CERT_MISSING
    http: 422
    condition: "the product requires heat equipment or carries an allergen flag and the demonstrator lacks the matching valid HEAT_EQUIPMENT or ALLERGEN_AWARENESS certificate"
  - id: ERR_EQUIPMENT_NOT_SANITIZED
    http: 422
    condition: "ACTIVATE on a unit whose sanitation_status is not SANITIZED, or CHECK_IN whose event reservation's unit is not IN_USE"

  # --- business_referential ---
  - id: ERR_PRODUCT_MANUFACTURER_MISMATCH
    http: 422
    condition: "the product's manufacturer_id differs from the event's manufacturer_id"
  - id: ERR_DEMONSTRATOR_CLUB_MISMATCH
    http: 422
    condition: "the demonstrator's home_club_id differs from the event's club_id and travel_authorized was not set"
  - id: ERR_EQUIPMENT_CLUB_MISMATCH
    http: 422
    condition: "the equipment unit's club_id differs from the event's club_id"
  - id: ERR_BASELINE_MISSING
    http: 422
    condition: "no ClubProductBaseline exists for the event's (club_id, product_id) when a lift measurement is posted"

  # --- business_temporal ---
  - id: ERR_BOOKING_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "SUBMIT where event_date is less than 7 days after the logical clock UTC date"
  - id: ERR_BOOKING_HORIZON_EXCEEDED
    http: 422
    condition: "SUBMIT where event_date is more than 120 days after the logical clock UTC date"
  - id: ERR_RESERVATION_WINDOW_INSUFFICIENT
    http: 422
    condition: "the requested reservation window does not cover [event_window_start_utc - 45 minutes, event_window_end_utc]"
  - id: ERR_EQUIPMENT_WINDOW_CONFLICT
    http: 409
    condition: "the requested window collides with a HELD or ACTIVE reservation on the same unit under the 30-minute buffered half-open geometry"
  - id: ERR_DEMONSTRATOR_DOUBLE_BOOKED
    http: 409
    condition: "the new assignment's closed interval touches or overlaps an ASSIGNED, CONFIRMED or CHECKED_IN assignment of the same demonstrator"
  - id: ERR_CHECK_IN_WINDOW_INVALID
    http: 422
    condition: "the CHECK_IN instant falls outside [scheduled_start_utc - 60 minutes, scheduled_end_utc], the CHECK_OUT instant is not after check_in_at, or the instant is after the logical clock now"
  - id: ERR_NO_SHOW_TOO_EARLY
    http: 422
    condition: "NO_SHOW declared before scheduled_start_utc + 15 minutes"

  # --- business_constraint ---
  - id: ERR_CLUB_NOT_OPEN
    http: 409
    condition: "APPROVE while Club.club_status == CLOSED, or APPROVE of a FOOD_SAMPLING event while Club.club_status == RESTRICTED"
  - id: ERR_CLUB_DAY_CAPACITY_FULL
    http: 409
    condition: "the club already holds daily_event_capacity events with booking_status IN {CONFIRMED, COMPLETED} on that event_date"
  - id: ERR_FOOD_STATION_UNAVAILABLE
    http: 409
    condition: "the club already holds food_station_count FOOD_SAMPLING events with booking_status IN {CONFIRMED, COMPLETED} on that date"
  - id: ERR_CATEGORY_CALENDAR_CONFLICT
    http: 409
    condition: "two events of the same Product.category are already CONFIRMED or COMPLETED at that club on that date"
  - id: ERR_DEMONSTRATOR_DAILY_CAP_EXCEEDED
    http: 409
    condition: "the demonstrator already holds 2 assignments on that event_date"
  - id: ERR_DEMONSTRATOR_WEEKLY_CAP_EXCEEDED
    http: 409
    condition: "the demonstrator already holds max_weekly_events assignments in that ISO week"
  - id: ERR_LEAD_ALREADY_ASSIGNED
    http: 409
    condition: "the event already holds a live LEAD assignment"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "duplicate club_number, duplicate (manufacturer_id, sku), duplicate (club_id, asset_tag), duplicate (club_id, product_id) baseline, or a second reconciliation for one event"
  - id: ERR_PRODUCT_FLAG_INCONSISTENT
    http: 422
    condition: "requires_heat_equipment is true while requires_food_handling is false"

  # --- business_fiscal ---
  - id: ERR_MANUFACTURER_SUSPENDED
    http: 402
    condition: "the manufacturer's account_status is SUSPENDED"
  - id: ERR_MANUFACTURER_ON_CREDIT_HOLD
    http: 402
    condition: "SUBMIT or APPROVE attempted while the manufacturer's account_status is HOLD"
  - id: ERR_SAMPLE_POOL_EXHAUSTED
    http: 409
    condition: "the allocation waterfall yields 0 cases for the club-week"
  - id: ERR_SAMPLE_ALLOCATION_BELOW_MINIMUM
    http: 422
    condition: "a FOOD_SAMPLING approval would allocate fewer than 2 cases"
  - id: ERR_RECEIVED_EXCEEDS_SHIPPED
    http: 422
    condition: "cases_received exceeds cases_shipped"
  - id: ERR_SAMPLES_NOT_RECEIVED
    http: 409
    condition: "CLOSE_OUT of a FOOD_SAMPLING event where no shipment has been received"
  - id: ERR_RECONCILIATION_UNRESOLVED
    http: 409
    condition: "ISSUE while recon_status is OPEN or VARIANCE_FLAGGED or absent, or a FINAL lift measurement with no reconciliation row"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents differs from total_due_cents on RECORD_PAYMENT"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Club Demonstration Services head office. Owns reference data, billing, credit decisions, write-offs and the logical clock. May act on any resource, but is bound by the segregation-of-duties rule between issuing an invoice and approving that event's credit."
    identity: opaque
    exclusive_operations:
      - "POST /manufacturers"
      - "PATCH /manufacturers/{id}"
      - "POST /clubs"
      - "POST /club-product-baselines"
      - "PATCH /club-product-baselines/{id}"
      - "POST /sample-reconciliations/{id}/write-off"
      - "POST /demo-events/{id}/invoice"
      - "POST /event-invoices/{id}/transitions"
      - "POST /cancellation-credits/{id}/decisions"
      - "POST /_clock/set_current_utc"
      - "POST /_inject/assignment-history"
    shared_operations:
      - "PATCH /clubs/{id} (with ClubOperations)"
      - "POST /products (with Manufacturer)"
      - "POST /demo-events, PATCH /demo-events/{id} (with Manufacturer)"
      - "POST /demo-events/{id}/transitions (with Manufacturer and ClubOperations)"
      - "POST /demonstrators, PATCH /demonstrators/{id}, POST /demonstrators/{id}/certifications and its revoke (with StaffingCoordinator)"
      - "POST /equipment-units, PATCH /equipment-units/{id} (with ClubOperations)"
      - "POST /equipment-reservations and its transitions (with ClubOperations, StaffingCoordinator)"
      - "POST /demo-events/{id}/assignments, POST /event-assignments/{id}/transitions (with StaffingCoordinator and Demonstrator)"
      - "POST /demo-events/{id}/sample-shipments (with Manufacturer)"
      - "POST /sample-shipments/{id}/receive, POST /demo-events/{id}/sample-reconciliation (with ClubOperations)"
      - "POST /demo-events/{id}/lift-measurements (with Manufacturer)"
      - "every GET endpoint"

  - name: Manufacturer
    description: "Vendor that books demos, owns SKUs and ships samples. X-User-ID is the Manufacturer row's id, so ownership checks compare it to the resource's manufacturer_id."
    identity: entity_backed:Manufacturer
    exclusive_operations:
      - "POST /demo-events/{id}/transitions with action SUBMIT"
      - "POST /demo-events/{id}/transitions with action CANCEL from DRAFT or SUBMITTED"
    shared_operations:
      - "POST /products (with ProgramAdmin)"
      - "POST /demo-events, PATCH /demo-events/{id} (with ProgramAdmin)"
      - "POST /demo-events/{id}/sample-shipments (with ProgramAdmin)"
      - "POST /demo-events/{id}/lift-measurements (with ProgramAdmin)"
      - "GET on its own manufacturer, products, baselines, events, shipments, reconciliation, measurements, invoices and credits"

  - name: ClubOperations
    description: "Warehouse club floor management. Approves and rejects bookings, receives loads, runs equipment and files reconciliation. X-User-ID is the Club row's id, so ownership checks compare it to the resource's club_id or the event's club_id."
    identity: entity_backed:Club
    exclusive_operations:
      - "POST /demo-events/{id}/transitions with action APPROVE, REJECT, REVOKE_APPROVAL or CLOSE_OUT"
      - "POST /sample-shipments/{id}/receive"
      - "POST /demo-events/{id}/sample-reconciliation"
    shared_operations:
      - "PATCH /clubs/{id} (with ProgramAdmin)"
      - "POST /equipment-units, PATCH /equipment-units/{id} (with ProgramAdmin)"
      - "POST /equipment-reservations and its transitions (with ProgramAdmin, StaffingCoordinator)"
      - "POST /demo-events/{id}/transitions with action CANCEL from CONFIRMED (with Manufacturer, ProgramAdmin)"
      - "GET on clubs, demonstrators, events, assignments, equipment, credits and its own capacity read"

  - name: StaffingCoordinator
    description: "Field staffing office. Owns the demonstrator roster, certificates, assignments, no-show declarations and recovery. Operational identity, not a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /event-assignments/{id}/transitions with action NO_SHOW or RELEASE"
    shared_operations:
      - "POST /demonstrators, PATCH /demonstrators/{id}, POST /demonstrators/{id}/certifications and its revoke (with ProgramAdmin)"
      - "POST /demo-events/{id}/assignments (with ProgramAdmin)"
      - "POST /equipment-reservations (with ProgramAdmin, ClubOperations)"
      - "GET on clubs, demonstrators, certifications, events, assignments and equipment"

  - name: Demonstrator
    description: "In-club sampling worker. Acts only on its own assignments. X-User-ID is the Demonstrator row's id, so ownership checks compare it to the assignment's demonstrator_id."
    identity: entity_backed:Demonstrator
    exclusive_operations:
      - "POST /event-assignments/{id}/transitions with action CONFIRM, CHECK_IN or CHECK_OUT"
    shared_operations:
      - "GET on its own demonstrator row, its certifications, its assignments and the events those assignments belong to"
