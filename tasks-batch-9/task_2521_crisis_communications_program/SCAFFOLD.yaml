scenario: |
  Generate task harder than expert level!

  2521. Crisis Communications Program (corporate communications department): issue monitoring across media,
  social and regulatory channels with escalation triggers by severity, crisis team activation with roles,
  decision authority and legal privilege considerations, holding statement and message development with
  approval routing under time pressure, stakeholder-specific communication sequencing across employees,
  customers, investors, regulators and media, spokesperson designation, media training and interview
  preparation with question anticipation, dark site and prepared material readiness for likely scenarios,
  social listening and misinformation correction with platform escalation paths, post-crisis assessment
  with reputation tracking and playbook updates

domain_name: crisis-communications-program
api_prefix: /crisis

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity is nested inside another's URL path.
  # Every collection sits directly under /crisis/<collection>, and every parent-child relationship is
  # discovered through filtered list endpoints (`GET /crisis/statements?incident_id=...`).

  state_machine_shape: parallel
  # Incident carries two independent state dimensions (response_state x privilege_state) that advance
  # without ordering constraints between them. Statement is cyclic (IN_REVIEW -> REVISION_REQUESTED ->
  # DRAFT -> IN_REVIEW, bounded by revision_round), StakeholderNotice is cyclic (QUEUED -> BLOCKED ->
  # QUEUED), and MisinformationClaim is branching fork-join (TRIAGED -> {PLATFORM_ESCALATED,
  # CORRECTION_ISSUED} -> CLOSED) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Incident -> IssueSignal / Statement / StakeholderNotice / MisinformationClaim
    - self_referential     # Statement.supersedes_statement_id -> Statement.id
    - cross_aggregate      # ApprovalTask -> TeamMember (approver pool lives outside the Statement aggregate)
    - polymorphic: false   # not used

  role_model: segregation_of_duties
  # The TeamMember who drafted a Statement may never decide any ApprovalTask on it; legal privilege
  # decisions are reserved to privilege-cleared LegalCounsel members; SEV1 quorum additionally requires
  # an ExecSponsor who cannot draft.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TeamMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Person who can hold a crisis-team role.
        constraints: non-empty, max 120 chars
      - name: org_title
        type: string
        source: input
        description: Job title shown in the crisis roster.
        constraints: non-empty, max 120 chars
      - name: privilege_cleared
        type: boolean
        source: input
        description: True when the member is inside the attorney-client privilege circle.
        default: false
      - name: media_training_status
        type: enum
        source: input
        description: Media-training currency used to gate interview confirmation.
        default: NONE
        constraints: one of {NONE, CURRENT}
      - name: media_training_expires_at
        type: datetime
        source: input
        description: Instant at which CURRENT media training lapses; null when status is NONE.
        default: null
        constraints: ISO 8601 UTC with three fractional digits when present
      - name: scheduled_interview_minutes
        type: integer
        source: computed
        description: >-
          Conserved ledger of confirmed spokesperson load. Equals
          sum(MediaInterview.duration_minutes) over MediaInterview rows whose
          spokesperson_member_id == this.id AND state == CONFIRMED.
        default: 0
        constraints: ">= 0"
      - name: active_assignment_count
        type: integer
        source: computed
        description: >-
          count(TeamAssignment) where member_id == this.id AND state IN {ASSIGNED, ACKNOWLEDGED}.
        default: 0

  - name: MonitoredChannel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the monitored outlet, platform or regulator docket.
        constraints: non-empty, max 120 chars
      - name: channel_type
        type: enum
        source: input
        description: Monitoring surface; drives the escalation bump in signal_escalation_score.
        constraints: one of {MEDIA, SOCIAL, REGULATORY}
      - name: platform_escalation_contact
        type: string
        source: input
        description: Trust-and-safety escalation contact reference for misinformation takedowns.
        default: null
      - name: escalation_path_state
        type: enum
        source: computed
        description: >-
          UNVERIFIED at creation; VERIFIED only after
          POST /crisis/monitored-channels/{channel_id}/verify-escalation-path succeeds.
        default: UNVERIFIED
        constraints: one of {UNVERIFIED, VERIFIED}
      - name: verified_contact_reference
        type: string
        source: computed
        description: Contact reference recorded by the verify-escalation-path call; null while UNVERIFIED.
        default: null
      - name: max_concurrent_corrections
        type: integer
        source: input
        description: Aggregate capacity of overlapping correction windows this channel tolerates.
        default: 1
        constraints: ">= 1, <= 5"
      - name: reserved_correction_minutes
        type: integer
        source: computed
        description: >-
          Conserved ledger of channel airtime. Equals sum over MisinformationClaim rows whose
          channel_id == this.id AND state == CORRECTION_ISSUED of
          (correction_window_end - correction_window_start) in whole minutes.
        default: 0
        constraints: ">= 0"
      - name: open_escalation_count
        type: integer
        source: computed
        description: >-
          count(MisinformationClaim) where channel_id == this.id AND state == PLATFORM_ESCALATED.
        default: 0

  - name: IssueSignal
    parent: null
    common_fields: true
    fields:
      - name: channel_id
        type: string
        source: input
        description: FK -> MonitoredChannel.id; the surface on which the issue was observed.
      - name: incident_id
        type: string
        source: input
        description: >-
          FK -> Incident.id; null until the signal is linked. Supplying it at creation links immediately.
        default: null
      - name: headline
        type: string
        source: input
        description: One-line description of the observed issue.
        constraints: non-empty, max 240 chars
      - name: reach_score
        type: integer
        source: input
        description: Observed audience reach on a 0-100 scale.
        constraints: 0 <= reach_score <= 100
      - name: sentiment_score
        type: number
        source: input
        description: Sentiment from -1.0 (hostile) to 1.0 (supportive); only negative values add risk.
        constraints: -1.0 <= sentiment_score <= 1.0
      - name: source_credibility_tier
        type: enum
        source: input
        description: Credibility of the source; selects the credibility multiplier.
        constraints: one of {A, B, C}
      - name: regulatory_flag
        type: boolean
        source: input
        description: True when a regulator has publicly referenced the issue.
        default: false
      - name: escalation_score
        type: number
        source: computed
        description: Output of calculations.signal_escalation_score; frozen at creation, never recomputed.
        constraints: 0.00 <= escalation_score <= 100.00, 2 decimals
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant at creation; chronological order key for final severity.
      - name: state
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.IssueSignal.
        default: OPEN
        constraints: one of {OPEN, LINKED, ESCALATED}
      - name: escalated_at
        type: datetime
        source: computed
        description: Logical-clock instant of the escalate transition; null while not ESCALATED.
        default: null

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Short incident label used in the war-room log.
        constraints: non-empty, max 160 chars
      - name: scenario_code
        type: enum
        source: input
        description: Playbook scenario this incident maps to; joins PreparedMaterial by equal value.
        constraints: one of {PRODUCT_RECALL, DATA_BREACH, EXEC_MISCONDUCT, PLANT_INCIDENT, REGULATORY_PROBE}
      - name: created_by_member_id
        type: string
        source: system
        description: FK -> TeamMember.id; the X-User-ID of the IncidentLead that opened the incident.
      - name: reputation_index_before
        type: number
        source: input
        description: Baseline reputation index captured when the incident is opened.
        default: 50.00
        constraints: 0.00 <= value <= 100.00, 2 decimals
      - name: reputation_index_after
        type: number
        source: computed
        description: Post-incident reputation index supplied to the resolve call; null before resolution.
        default: null
      - name: response_state
        type: enum
        source: computed
        description: Response dimension; see state_machines.Incident (dimension response_state).
        default: MONITORING
        constraints: one of {MONITORING, ACTIVATED, RESOLVED}
      - name: privilege_state
        type: enum
        source: computed
        description: Privilege dimension; see state_machines.Incident (dimension privilege_state).
        default: NON_PRIVILEGED
        constraints: one of {NON_PRIVILEGED, PRIVILEGED_ASSERTED, PRIVILEGE_WAIVED}
      - name: legal_hold_active
        type: boolean
        source: computed
        description: True exactly while privilege_state == PRIVILEGED_ASSERTED.
        default: false
      - name: privilege_basis
        type: string
        source: computed
        description: Basis text recorded by assert-privilege; null while never asserted.
        default: null
      - name: comms_posture
        type: enum
        source: computed
        description: >-
          Derived gate over all child operations, recomputed after every mutation of this incident or of
          any of its children. Precedence (first match wins):
          (1) FROZEN when legal_hold_active == true OR response_state == RESOLVED;
          (2) RESTRICTED when sla_breached == true OR blocked_notice_count >= 1;
          (3) OPEN otherwise.
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: activated_at
        type: datetime
        source: computed
        description: Logical-clock instant of the activate transition; null while MONITORING.
        default: null
      - name: resolved_at
        type: datetime
        source: computed
        description: Logical-clock instant of the resolve transition; null until RESOLVED.
        default: null
      - name: severity_tier
        type: enum
        source: computed
        description: >-
          Output of calculations.incident_severity_tier variant provisional_at_activation; set at
          activation and recomputed whenever a linked signal is escalated while ACTIVATED.
        default: null
        constraints: one of {SEV1, SEV2, SEV3, SEV4} once ACTIVATED
      - name: severity_basis
        type: enum
        source: computed
        description: Which variant produced the currently stored severity_tier.
        default: null
        constraints: one of {PROVISIONAL, FINAL}
      - name: severity_score
        type: number
        source: computed
        description: The numeric score (2 decimals) the stored severity_tier was derived from.
        default: null
      - name: final_severity_tier
        type: enum
        source: computed
        description: >-
          Output of calculations.incident_severity_tier variant final_at_resolution; written only by the
          resolve transition. May differ from severity_tier for identical signal data.
        default: null
        constraints: one of {SEV1, SEV2, SEV3, SEV4}
      - name: final_severity_score
        type: number
        source: computed
        description: Blended score (2 decimals) behind final_severity_tier; null before resolution.
        default: null
      - name: holding_statement_due_at
        type: datetime
        source: computed
        description: >-
          Output of calculations.holding_statement_due_at; always activated_at + SLA of the CURRENT
          severity_tier, never re-based on the escalation instant.
        default: null
      - name: holding_statement_published_at
        type: datetime
        source: computed
        description: Publish instant of the first HOLDING statement on this incident; null until then.
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: >-
          True once current_utc >= holding_statement_due_at while holding_statement_published_at is null.
          Latched by the escalate cascade and by the sla-sweep checkpoint; cleared only by publishing a
          HOLDING statement.
        default: false
      - name: base_containment_score
        type: number
        source: computed
        description: Pre-fee base of calculations.containment_priority_score; the value the fee tier keys on.
        default: null
      - name: amplification_rate_applied
        type: number
        source: computed
        description: AMP_RATE selected from base_containment_score's band (0.20 | 0.10 | 0.05).
        default: null
      - name: containment_priority_score
        type: number
        source: computed
        description: Output of calculations.containment_priority_score (base + amplification fee, capped).
        default: null
      - name: stakeholder_reach_index
        type: number
        source: computed
        description: Output of calculations.stakeholder_reach_index over RELEASED notices; 2 decimals.
        default: 0.00
      - name: linked_signal_count
        type: integer
        source: computed
        description: count(IssueSignal) where incident_id == this.id AND state IN {LINKED, ESCALATED}.
        default: 0
      - name: escalated_signal_count
        type: integer
        source: computed
        description: count(IssueSignal) where incident_id == this.id AND state == ESCALATED.
        default: 0
      - name: open_approval_task_count
        type: integer
        source: computed
        description: >-
          Conserved ledger of in-flight approvals. Equals count(ApprovalTask t) where
          t.statement_id IN (Statement where incident_id == this.id) AND t.state == PENDING.
        default: 0
        constraints: ">= 0"
      - name: blocked_notice_count
        type: integer
        source: computed
        description: count(StakeholderNotice) where incident_id == this.id AND state == BLOCKED.
        default: 0
      - name: released_notice_count
        type: integer
        source: computed
        description: count(StakeholderNotice) where incident_id == this.id AND state == RELEASED.
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: >-
          count(MisinformationClaim) where incident_id == this.id AND
          state IN {DETECTED, TRIAGED, PLATFORM_ESCALATED, CORRECTION_ISSUED}.
        default: 0
      - name: confirmed_interview_count
        type: integer
        source: computed
        description: count(MediaInterview) where incident_id == this.id AND state == CONFIRMED.
        default: 0
      - name: reputation_delta_reported
        type: number
        source: computed
        description: >-
          Mirror of PostCrisisReview.reported_delta written by the score transition (ledger sync);
          null until the review is scored.
        default: null

  - name: TeamAssignment
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; the incident this seat belongs to.
      - name: member_id
        type: string
        source: input
        description: FK -> TeamMember.id; the person filling the seat.
      - name: team_role
        type: enum
        source: input
        description: Crisis-team seat.
        constraints: one of {INCIDENT_LEAD, LEGAL_COUNSEL, COMMS_LEAD, SPOKESPERSON, SOCIAL_LISTENER, EXEC_SPONSOR}
      - name: decision_authority
        type: enum
        source: input
        description: >-
          Authority rank used by calculations.approval_task_routing (FULL ranks above LIMITED).
        constraints: one of {FULL, LIMITED}
      - name: state
        type: enum
        source: computed
        description: Seat lifecycle; see state_machines.TeamAssignment.
        default: ASSIGNED
        constraints: one of {ASSIGNED, ACKNOWLEDGED, STOOD_DOWN}
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant of acknowledgement; null while ASSIGNED.
        default: null
      - name: stood_down_at
        type: datetime
        source: computed
        description: Logical-clock instant of stand-down; null unless STOOD_DOWN.
        default: null

  - name: Statement
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; the incident this message belongs to.
      - name: drafted_by_member_id
        type: string
        source: system
        description: >-
          FK -> TeamMember.id; X-User-ID of the CommsLead that created the draft. Pinned at creation and
          never rewritten by revise, so segregation of duties survives the revision cycle.
      - name: supersedes_statement_id
        type: string
        source: input
        description: >-
          FK -> Statement.id; self-reference to the message this one replaces. Null for the first message.
        default: null
      - name: statement_type
        type: enum
        source: input
        description: Message class; HOLDING satisfies the incident SLA, CORRECTION unlocks misinformation corrections.
        constraints: one of {HOLDING, UPDATE, CORRECTION, FINAL}
      - name: body
        type: string
        source: input
        description: Message text; replaced wholesale by revise.
        constraints: non-empty, max 4000 chars
      - name: privilege_marked
        type: boolean
        source: input
        description: >-
          True when the draft carries privileged legal analysis; forces a LEGAL_COUNSEL approval task and
          restricts decisions to privilege-cleared members.
        default: false
      - name: state
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.Statement (cyclic through REVISION_REQUESTED).
        default: DRAFT
        constraints: one of {DRAFT, IN_REVIEW, REVISION_REQUESTED, APPROVED, PUBLISHED, SUPERSEDED, WITHDRAWN}
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed revision loops; incremented by the revise transition.
        default: 0
        constraints: 0 <= revision_round <= 3
      - name: revision_locked
        type: boolean
        source: computed
        description: Latched true once revision_round reaches 3; further revise calls are rejected.
        default: false
      - name: quorum_required
        type: integer
        source: computed
        description: >-
          Output of calculations.approval_quorum_requirement; number of ApprovalTask rows created by the
          most recent submit-review. Zero before the first submission.
        default: 0
      - name: approvals_recorded
        type: integer
        source: computed
        description: count(ApprovalTask) where statement_id == this.id AND state == APPROVED for the current round.
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent submit-review; null before first submission.
        default: null
      - name: review_deadline_at
        type: datetime
        source: computed
        description: submitted_at + REVIEW_SLA_MINUTES[incident.severity_tier]; recomputed on every submit-review.
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: Instant the last outstanding ApprovalTask was approved; null while unapproved.
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: Instant of the publish transition; null while unpublished.
        default: null
      - name: approval_latency_minutes
        type: integer
        source: computed
        description: >-
          floor((approved_at - submitted_at) / 60 seconds) using the current round's submitted_at;
          null while unapproved.
        default: null
      - name: withdraw_reason
        type: string
        source: computed
        description: Reason recorded by the withdraw transition; null unless WITHDRAWN.
        default: null

  - name: ApprovalTask
    parent: null
    common_fields: true
    fields:
      - name: statement_id
        type: string
        source: system
        description: FK -> Statement.id; the message awaiting this decision.
      - name: assignee_member_id
        type: string
        source: system
        description: >-
          FK -> TeamMember.id; the routed approver chosen by calculations.approval_task_routing.
      - name: required_team_role
        type: enum
        source: system
        description: Seat the decision must come from.
        constraints: one of {INCIDENT_LEAD, LEGAL_COUNSEL, EXEC_SPONSOR}
      - name: is_veto_seat
        type: boolean
        source: system
        description: True only for the LEGAL_COUNSEL task; a rejection from a veto seat halts the whole round.
        default: false
      - name: revision_round
        type: integer
        source: system
        description: Statement.revision_round at the moment this task was created.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Decision lifecycle; see state_machines.ApprovalTask.
        default: PENDING
        constraints: one of {PENDING, APPROVED, REJECTED, VOIDED, EXPIRED}
      - name: decision_comment
        type: string
        source: computed
        description: Comment supplied with the decision; null while PENDING.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the decision, void or expiry; null while PENDING.
        default: null

  - name: StakeholderNotice
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; the incident being communicated.
      - name: statement_id
        type: string
        source: input
        description: FK -> Statement.id; the approved message this notice carries.
      - name: audience
        type: enum
        source: input
        description: Stakeholder group; drives both sequencing rank and reach weight.
        constraints: one of {EMPLOYEE, CUSTOMER, REGULATOR, INVESTOR, MEDIA}
      - name: sequence_rank
        type: integer
        source: computed
        description: >-
          AUDIENCE_SEQUENCE_RANK[audience] = {EMPLOYEE:1, CUSTOMER:2, REGULATOR:3, INVESTOR:4, MEDIA:5};
          release requires every strictly lower rank on the incident to be settled.
        constraints: 1 <= sequence_rank <= 5
      - name: estimated_reach
        type: integer
        source: input
        description: Expected audience size in persons; feeds calculations.stakeholder_reach_index.
        constraints: ">= 0"
      - name: embargo_until
        type: datetime
        source: input
        description: >-
          Earliest instant this notice may be released; null means no embargo.
        default: null
      - name: reach_contribution
        type: number
        source: computed
        description: >-
          Per-notice rounded contribution round(AUDIENCE_WEIGHT[audience] * estimated_reach / 1000, 2);
          written when the notice becomes RELEASED, 0.00 otherwise.
        default: 0.00
      - name: state
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.StakeholderNotice (cyclic through BLOCKED).
        default: QUEUED
        constraints: one of {QUEUED, RELEASED, BLOCKED, CANCELLED}
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant of release; null unless RELEASED.
        default: null
      - name: priority_override_used
        type: boolean
        source: computed
        description: >-
          True when a REGULATOR notice jumped the sequence under the statutory-deadline override.
        default: false
      - name: cancel_reason
        type: string
        source: computed
        description: Reason recorded by cancel; null unless CANCELLED.
        default: null

  - name: PreparedMaterial
    parent: null
    common_fields: true
    fields:
      - name: scenario_code
        type: enum
        source: input
        description: Playbook scenario this material serves; matched against Incident.scenario_code by equality.
        constraints: one of {PRODUCT_RECALL, DATA_BREACH, EXEC_MISCONDUCT, PLANT_INCIDENT, REGULATORY_PROBE}
      - name: material_type
        type: enum
        source: input
        description: Artifact class held in the dark site.
        constraints: one of {DARK_SITE_PAGE, FAQ, HOLDING_TEMPLATE, EXEC_BRIEF}
      - name: title
        type: string
        source: input
        description: Material title.
        constraints: non-empty, max 160 chars
      - name: dark_site_url
        type: string
        source: input
        description: Staging URL of the unpublished dark-site asset.
        default: null
      - name: last_reviewed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent review; null while DRAFT.
        default: null
      - name: readiness_score
        type: number
        source: computed
        description: Output of calculations.material_readiness_score; 0.00 while DRAFT.
        default: 0.00
        constraints: 0.00 <= readiness_score <= 100.00, 2 decimals
      - name: readiness_state
        type: enum
        source: computed
        description: >-
          DRAFT until first review; READY while readiness_score >= 60.00; STALE once it drops below.
        default: DRAFT
        constraints: one of {DRAFT, READY, STALE}
      - name: reviewer_notes
        type: string
        source: computed
        description: Notes recorded by the most recent review; null while DRAFT.
        default: null

  - name: MediaInterview
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; the incident the interview addresses.
      - name: spokesperson_member_id
        type: string
        source: input
        description: FK -> TeamMember.id; the designated spokesperson whose calendar is the contended resource.
      - name: channel_id
        type: string
        source: input
        description: FK -> MonitoredChannel.id; the outlet conducting the interview.
      - name: outlet_name
        type: string
        source: input
        description: Free-text outlet/programme name.
        constraints: non-empty, max 160 chars
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Interview start instant (inclusive endpoint of a closed interval).
      - name: scheduled_end_at
        type: datetime
        source: input
        description: Interview end instant (inclusive endpoint of a closed interval); must be > start.
      - name: duration_minutes
        type: integer
        source: computed
        description: floor((scheduled_end_at - scheduled_start_at) / 60 seconds).
        constraints: ">= 1"
      - name: anticipated_question_count
        type: integer
        source: input
        description: Number of anticipated questions prepared in the question pack.
        default: 0
        constraints: ">= 0"
      - name: high_risk_answers_approved_count
        type: integer
        source: input
        description: Number of high-risk answers signed off by legal.
        default: 0
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: Lifecycle state; see state_machines.MediaInterview.
        default: SCHEDULED
        constraints: one of {SCHEDULED, CONFIRMED, CANCELLED}
      - name: confirmed_at
        type: datetime
        source: computed
        description: Logical-clock instant of confirmation; null unless CONFIRMED.
        default: null
      - name: cancel_reason
        type: string
        source: computed
        description: Reason recorded by cancel, or "AUTO_CASCADE_INCIDENT_RESOLVED" when cancelled by cascade.
        default: null

  - name: MisinformationClaim
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: FK -> Incident.id; the incident the false claim attaches to.
      - name: channel_id
        type: string
        source: input
        description: FK -> MonitoredChannel.id; the platform hosting the claim and holding correction capacity.
      - name: correction_statement_id
        type: string
        source: computed
        description: >-
          FK -> Statement.id; the PUBLISHED CORRECTION statement cited by the issue-correction branch;
          null on the platform-escalation branch.
        default: null
      - name: claim_text
        type: string
        source: input
        description: The false or misleading assertion being tracked.
        constraints: non-empty, max 500 chars
      - name: virality_score
        type: number
        source: input
        description: Spread intensity 0.00-100.00; feeds the exposure component of containment_priority_score.
        constraints: 0.00 <= virality_score <= 100.00, 2 decimals
      - name: correction_window_start
        type: datetime
        source: input
        description: Half-open window start [start, end) reserved on the channel; null off that branch.
        default: null
      - name: correction_window_end
        type: datetime
        source: input
        description: Half-open window end [start, end), exclusive; null off that branch.
        default: null
      - name: correction_window_minutes
        type: integer
        source: computed
        description: floor((correction_window_end - correction_window_start) / 60 seconds); 0 off that branch.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Branching lifecycle; see state_machines.MisinformationClaim.
        default: DETECTED
        constraints: one of {DETECTED, TRIAGED, PLATFORM_ESCALATED, CORRECTION_ISSUED, CLOSED}
      - name: resolution_branch
        type: enum
        source: computed
        description: Which fork produced the CLOSED state; null until closed.
        default: null
        constraints: one of {PLATFORM, CORRECTION}
      - name: takedown_confirmed
        type: boolean
        source: computed
        description: Set true only when a PLATFORM_ESCALATED claim is closed.
        default: false
      - name: corrected
        type: boolean
        source: computed
        description: Set true only when a CORRECTION_ISSUED claim is closed; counts toward correction efficacy.
        default: false
      - name: outcome_note
        type: string
        source: computed
        description: Note recorded by close; null while open.
        default: null

  - name: PostCrisisReview
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: system
        description: FK -> Incident.id; created by the incident resolve cascade, one per incident.
      - name: reputation_index_before
        type: number
        source: system
        description: Snapshot of Incident.reputation_index_before at resolution.
      - name: reputation_index_after
        type: number
        source: system
        description: Snapshot of Incident.reputation_index_after at resolution.
      - name: exposure_factor
        type: number
        source: computed
        description: >-
          round(min(0.50, incident.stakeholder_reach_index / 100), 4), snapshotted at resolution.
        constraints: 4 decimals
      - name: total_claim_count
        type: integer
        source: system
        description: count(MisinformationClaim) where incident_id == this.incident_id, snapshotted at resolution.
        default: 0
      - name: corrected_claim_count
        type: integer
        source: system
        description: >-
          count(MisinformationClaim) where incident_id == this.incident_id AND corrected == true,
          snapshotted at resolution.
        default: 0
      - name: reputation_delta_raw
        type: number
        source: computed
        description: Output of calculations.reputation_delta variant raw; null until scored.
        default: null
      - name: reputation_delta_adjusted
        type: number
        source: computed
        description: Output of calculations.reputation_delta variant exposure_adjusted; null until scored.
        default: null
      - name: scoring_method
        type: enum
        source: computed
        description: Method selected by the score call; decides which variant becomes reported_delta.
        default: null
        constraints: one of {RAW, ADJUSTED}
      - name: reported_delta
        type: number
        source: computed
        description: The variant selected by scoring_method; mirrored to Incident.reputation_delta_reported.
        default: null
      - name: playbook_update_count
        type: integer
        source: computed
        description: Number of playbook updates logged by the score call.
        default: 0
      - name: state
        type: enum
        source: computed
        description: Review lifecycle; see state_machines.PostCrisisReview.
        default: OPEN
        constraints: one of {OPEN, SCORED}
      - name: scored_at
        type: datetime
        source: computed
        description: Logical-clock instant of scoring; null while OPEN.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IssueSignal
    initial_state: OPEN
    terminal_states: [ESCALATED]
    note: >-
      A signal created with incident_id in the body starts LINKED instead of OPEN; a signal created
      without one starts OPEN and must be linked before it can be escalated.
    transitions:
      - from: OPEN
        to: LINKED
        trigger: "POST /crisis/issue-signals/{signal_id}/link"
        actor: SocialListener | IncidentLead
        preconditions:
          - "signal.state == OPEN"
          - "target Incident exists"
          - "incident.response_state IN {MONITORING, ACTIVATED}"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "signal.incident_id = body.incident_id"
          - "incident.linked_signal_count recomputed"
          - "incident.version incremented by 1"
      - from: LINKED
        to: ESCALATED
        trigger: "POST /crisis/issue-signals/{signal_id}/escalate"
        actor: SocialListener | IncidentLead
        preconditions:
          - "signal.state == LINKED"
          - "signal.escalation_score >= 70.00 (else ERR_ESCALATION_THRESHOLD_NOT_MET)"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "signal.escalated_at = current_utc; incident.escalated_signal_count recomputed"
          - "HOP 1: incident.severity_tier / severity_score recomputed via calculations.incident_severity_tier variant provisional_at_activation (only when incident.response_state == ACTIVATED); severity_basis stays PROVISIONAL"
          - "HOP 2: because severity_tier changed, incident.holding_statement_due_at recomputed as activated_at + HOLDING_SLA_MINUTES[new tier] (never re-based on the escalation instant)"
          - "HOP 3: because holding_statement_due_at moved, if current_utc >= holding_statement_due_at AND incident.holding_statement_published_at IS NULL then incident.sla_breached = true"
          - "HOP 4: because sla_breached latched true, incident.comms_posture recomputed to RESTRICTED (unless legal_hold_active already forces FROZEN)"
          - "incident.base_containment_score / amplification_rate_applied / containment_priority_score recomputed"
          - "incident.version incremented by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /crisis/issue-signals/{signal_id}/escalate"
        actor: SocialListener | IncidentLead
        preconditions: ["REJECTED: an unlinked signal cannot be escalated"]
        side_effects: ["none — ERR_INVALID_SIGNAL_STATE (409)"]
        note: Declared to pin the invalid-from rejection; no state change occurs.

  - entity: Incident
    dimension: response_state
    initial_state: MONITORING
    terminal_states: [RESOLVED]
    transitions:
      - from: MONITORING
        to: ACTIVATED
        trigger: "POST /crisis/incidents/{incident_id}/activate"
        actor: IncidentLead
        preconditions:
          - "incident.escalated_signal_count >= 1 (else ERR_NO_ESCALATED_SIGNAL)"
          - "a TeamAssignment exists with incident_id == incident.id AND team_role == INCIDENT_LEAD AND state == ACKNOWLEDGED (else ERR_ASSIGNMENT_NOT_ACKNOWLEDGED)"
          - "when the provisional severity tier computes to SEV1, a TeamAssignment with team_role == LEGAL_COUNSEL AND state == ACKNOWLEDGED must also exist (else ERR_ASSIGNMENT_NOT_ACKNOWLEDGED)"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "incident.activated_at = current_utc"
          - "incident.severity_tier / severity_score = calculations.incident_severity_tier variant provisional_at_activation; severity_basis = PROVISIONAL"
          - "incident.holding_statement_due_at = calculations.holding_statement_due_at"
          - "incident.base_containment_score / amplification_rate_applied / containment_priority_score = calculations.containment_priority_score"
          - "incident.comms_posture recomputed"
          - "incident.version incremented by 1"
      - from: ACTIVATED
        to: RESOLVED
        trigger: "POST /crisis/incidents/{incident_id}/resolve"
        actor: IncidentLead
        preconditions:
          - "incident.response_state == ACTIVATED"
          - "count(StakeholderNotice where incident_id == incident.id AND state IN {QUEUED, BLOCKED}) == 0 (else ERR_OPEN_NOTICES_BLOCK_RESOLUTION)"
          - "incident.open_claim_count == 0 (else ERR_OPEN_CLAIMS_BLOCK_RESOLUTION)"
        side_effects:
          - "incident.reputation_index_after = body.reputation_index_after; incident.resolved_at = current_utc"
          - "incident.final_severity_tier / final_severity_score = calculations.incident_severity_tier variant final_at_resolution; severity_basis = FINAL"
          - "one PostCrisisReview created in state OPEN with incident_id == incident.id and the resolution snapshots (reputation indices, exposure_factor, total_claim_count, corrected_claim_count)"
          - "HOP 1: every TeamAssignment on this incident in state ACKNOWLEDGED transitions to STOOD_DOWN (stood_down_at = current_utc)"
          - "HOP 2: because the SPOKESPERSON seat stood down, every MediaInterview whose spokesperson_member_id == that seat's member_id AND incident_id == incident.id AND state IN {SCHEDULED, CONFIRMED} transitions to CANCELLED with cancel_reason = \"AUTO_CASCADE_INCIDENT_RESOLVED\""
          - "HOP 3: because those interviews left CONFIRMED, TeamMember.scheduled_interview_minutes for that spokesperson is decremented by each cancelled interview's duration_minutes, and incident.confirmed_interview_count is recomputed"
          - "incident.comms_posture recomputed to FROZEN (RESOLVED forces FROZEN)"
          - "incident.version incremented by 1"
      - from: MONITORING
        to: RESOLVED
        trigger: "POST /crisis/incidents/{incident_id}/resolve"
        actor: IncidentLead
        preconditions: ["REJECTED: a never-activated incident cannot be resolved"]
        side_effects: ["none — ERR_INCIDENT_NOT_ACTIVATED (409)"]
        note: Declared to pin the invalid-from rejection.

  - entity: Incident
    dimension: privilege_state
    initial_state: NON_PRIVILEGED
    terminal_states: [PRIVILEGE_WAIVED]
    note: >-
      This dimension advances independently of response_state: privilege can be asserted while the
      incident is still MONITORING and waived while it is ACTIVATED, and neither transition changes
      response_state.
    transitions:
      - from: NON_PRIVILEGED
        to: PRIVILEGED_ASSERTED
        trigger: "POST /crisis/incidents/{incident_id}/assert-privilege"
        actor: LegalCounsel
        preconditions:
          - "incident.privilege_state == NON_PRIVILEGED"
          - "incident.response_state != RESOLVED"
          - "acting TeamMember (X-User-ID) has privilege_cleared == true (else ERR_PRIVILEGE_NOT_CLEARED)"
          - "a TeamAssignment exists with incident_id == incident.id AND member_id == X-User-ID AND team_role == LEGAL_COUNSEL AND state == ACKNOWLEDGED (else ERR_ASSIGNMENT_NOT_ACKNOWLEDGED)"
        side_effects:
          - "incident.legal_hold_active = true; incident.privilege_basis = body.privilege_basis"
          - "incident.comms_posture recomputed to FROZEN"
          - "HOP 1: every ApprovalTask in state PENDING whose statement_id belongs to this incident AND whose assignee TeamMember.privilege_cleared == false transitions to VOIDED (decided_at = current_utc)"
          - "HOP 2: because those tasks were voided, incident.open_approval_task_count is recomputed"
          - "HOP 3: because a Statement in state IN_REVIEW can lose every outstanding task this way, any such statement with zero remaining PENDING tasks and fewer APPROVED tasks than quorum_required transitions to REVISION_REQUESTED"
          - "incident.version incremented by 1"
      - from: PRIVILEGED_ASSERTED
        to: PRIVILEGE_WAIVED
        trigger: "POST /crisis/incidents/{incident_id}/waive-privilege"
        actor: LegalCounsel
        preconditions:
          - "incident.privilege_state == PRIVILEGED_ASSERTED"
          - "acting TeamMember has privilege_cleared == true (else ERR_PRIVILEGE_NOT_CLEARED)"
        side_effects:
          - "incident.legal_hold_active = false"
          - "incident.comms_posture recomputed (RESTRICTED when sla_breached or blocked_notice_count >= 1, else OPEN; FROZEN if already RESOLVED)"
          - "incident.version incremented by 1"

  - entity: TeamAssignment
    initial_state: ASSIGNED
    terminal_states: [STOOD_DOWN]
    transitions:
      - from: ASSIGNED
        to: ACKNOWLEDGED
        trigger: "POST /crisis/team-assignments/{assignment_id}/acknowledge"
        actor: IncidentLead | LegalCounsel | CommsLead | Spokesperson | SocialListener | ExecSponsor
        preconditions:
          - "assignment.state == ASSIGNED"
          - "X-User-ID == assignment.member_id (else ERR_ROLE_NOT_PERMITTED)"
          - "incident.response_state != RESOLVED"
        side_effects:
          - "assignment.acknowledged_at = current_utc"
          - "member.active_assignment_count recomputed"
      - from: ACKNOWLEDGED
        to: STOOD_DOWN
        trigger: "system event: incident resolve cascade HOP 1"
        actor: system
        preconditions: ["incident.response_state transitions to RESOLVED"]
        side_effects:
          - "assignment.stood_down_at = current_utc"
          - "member.active_assignment_count recomputed"
          - "triggers HOP 2 of the resolve cascade for the SPOKESPERSON seat"

  - entity: Statement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    note: >-
      Cyclic: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT -> IN_REVIEW ... bounded by
      revision_round <= 3. Each new round re-derives quorum and a fresh set of ApprovalTask rows.
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /crisis/statements/{statement_id}/submit-review"
        actor: CommsLead
        preconditions:
          - "statement.state == DRAFT"
          - "incident.response_state == ACTIVATED (else ERR_INCIDENT_NOT_ACTIVATED)"
          - "incident.comms_posture != FROZEN (else ERR_COMMS_POSTURE_FROZEN)"
          - "for every required_team_role from calculations.approval_quorum_requirement the eligible approver pool is non-empty (else ERR_APPROVER_UNAVAILABLE, atomic: no task is created)"
        side_effects:
          - "statement.quorum_required = calculations.approval_quorum_requirement"
          - "one ApprovalTask per required role created in PENDING with assignee_member_id from calculations.approval_task_routing, revision_round = statement.revision_round, is_veto_seat = (required_team_role == LEGAL_COUNSEL)"
          - "statement.submitted_at = current_utc; statement.review_deadline_at = current_utc + REVIEW_SLA_MINUTES[incident.severity_tier]"
          - "incident.open_approval_task_count recomputed (increases by quorum_required)"
          - "incident.version incremented by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system event: last PENDING ApprovalTask of the current round decided APPROVED"
        actor: system
        preconditions:
          - "count(ApprovalTask where statement_id == statement.id AND revision_round == statement.revision_round AND state == PENDING) == 0"
          - "count(... AND state == APPROVED) == statement.quorum_required"
        side_effects:
          - "statement.approved_at = current_utc; statement.approval_latency_minutes = floor((approved_at - submitted_at)/60)"
          - "every StakeholderNotice on this incident with statement_id == statement.id AND state == BLOCKED returns to QUEUED; incident.blocked_notice_count recomputed"
          - "incident.open_approval_task_count recomputed; incident.comms_posture recomputed"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "system event: any ApprovalTask of the current round decided REJECTED, or expired by the sla-sweep checkpoint"
        actor: system
        preconditions: ["statement.state == IN_REVIEW"]
        side_effects:
          - "HOP 1: every sibling ApprovalTask of the same revision_round still PENDING transitions to VOIDED (decided_at = current_utc)"
          - "HOP 2: because the round collapsed, incident.open_approval_task_count is recomputed down to its pre-submission value"
          - "HOP 3: because the statement is no longer approvable, every StakeholderNotice with statement_id == statement.id AND state == QUEUED transitions to BLOCKED and incident.blocked_notice_count is recomputed"
          - "HOP 4: because blocked_notice_count became >= 1, incident.comms_posture recomputes to RESTRICTED (unless legal_hold_active forces FROZEN)"
          - "incident.version incremented by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /crisis/statements/{statement_id}/revise"
        actor: CommsLead
        preconditions:
          - "statement.state == REVISION_REQUESTED"
          - "statement.revision_locked == false AND statement.revision_round < 3 (else ERR_REVISION_LIMIT_REACHED)"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "statement.body = body.body; statement.revision_round incremented by 1"
          - "statement.revision_locked = true when revision_round reaches 3"
          - "statement.quorum_required reset to 0; approvals_recorded recomputed for the new round"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /crisis/statements/{statement_id}/publish"
        actor: CommsLead
        preconditions:
          - "statement.state == APPROVED"
          - "incident.response_state == ACTIVATED (else ERR_INCIDENT_NOT_ACTIVATED)"
          - "incident.comms_posture != FROZEN (else ERR_COMMS_POSTURE_FROZEN)"
          - "when statement.privilege_marked == true the acting TeamMember must have privilege_cleared == true (else ERR_PRIVILEGE_NOT_CLEARED)"
        side_effects:
          - "statement.published_at = current_utc"
          - "when statement_type == HOLDING and incident.holding_statement_published_at IS NULL: incident.holding_statement_published_at = current_utc and incident.sla_breached = false"
          - "when supersedes_statement_id is set and that Statement.state == PUBLISHED: that statement transitions to SUPERSEDED"
          - "incident.comms_posture recomputed; incident.version incremented by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /crisis/statements/{statement_id}/withdraw"
        actor: CommsLead
        preconditions:
          - "statement.state == PUBLISHED"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "statement.withdraw_reason = body.withdraw_reason"
          - "every StakeholderNotice with statement_id == statement.id AND state IN {QUEUED, BLOCKED} transitions to CANCELLED with cancel_reason = \"AUTO_STATEMENT_WITHDRAWN\"; incident.blocked_notice_count recomputed"
          - "when statement_type == HOLDING and incident.holding_statement_published_at == statement.published_at: incident.holding_statement_published_at = null and sla_breached re-evaluated against current_utc"
          - "incident.comms_posture recomputed; incident.version incremented by 1"
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /crisis/statements/{statement_id}/withdraw"
        actor: CommsLead
        preconditions:
          - "statement.state == IN_REVIEW"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "COMPENSATION: every ApprovalTask of the current round in state PENDING transitions to VOIDED"
          - "incident.open_approval_task_count recomputed back to its pre-submission value (conserved-quantity invariant)"
          - "statement.withdraw_reason = body.withdraw_reason; incident.version incremented by 1"

  - entity: ApprovalTask
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, VOIDED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /crisis/approval-tasks/{task_id}/decide with decision = APPROVE"
        actor: IncidentLead | LegalCounsel | ExecSponsor
        preconditions:
          - "task.state == PENDING (else ERR_APPROVAL_TASK_NOT_PENDING)"
          - "X-User-ID == task.assignee_member_id (else ERR_ROLE_NOT_PERMITTED)"
          - "statement.state == IN_REVIEW (else ERR_STATEMENT_NOT_IN_REVIEW)"
          - "current_utc <= statement.review_deadline_at (else ERR_REVIEW_DEADLINE_PASSED)"
          - "X-User-ID != statement.drafted_by_member_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "when statement.privilege_marked == true the acting TeamMember must have privilege_cleared == true (else ERR_PRIVILEGE_NOT_CLEARED)"
        side_effects:
          - "task.decided_at = current_utc; task.decision_comment = body.comment"
          - "statement.approvals_recorded recomputed; incident.open_approval_task_count recomputed"
          - "when no PENDING task of this round remains, the Statement IN_REVIEW -> APPROVED transition fires"
      - from: PENDING
        to: REJECTED
        trigger: "POST /crisis/approval-tasks/{task_id}/decide with decision = REJECT"
        actor: IncidentLead | LegalCounsel | ExecSponsor
        preconditions:
          - "same preconditions as the APPROVE decision"
        side_effects:
          - "task.decided_at = current_utc; task.decision_comment = body.comment"
          - "the Statement IN_REVIEW -> REVISION_REQUESTED transition fires immediately, regardless of how many sibling tasks are already APPROVED (veto semantics apply to every seat; is_veto_seat only records that the rejection came from legal)"
      - from: PENDING
        to: EXPIRED
        trigger: "system event: POST /crisis/incidents/{incident_id}/sla-sweep with current_utc > statement.review_deadline_at"
        actor: system
        preconditions: ["task.state == PENDING", "statement.state == IN_REVIEW", "current_utc > statement.review_deadline_at"]
        side_effects:
          - "task.decided_at = current_utc"
          - "the Statement IN_REVIEW -> REVISION_REQUESTED transition fires (time-pressure escalation), which voids the remaining PENDING siblings"
      - from: PENDING
        to: VOIDED
        trigger: "system event: statement withdraw, statement REVISION_REQUESTED, or privilege assertion voiding non-cleared assignees"
        actor: system
        preconditions: ["task.state == PENDING"]
        side_effects:
          - "task.decided_at = current_utc"
          - "incident.open_approval_task_count recomputed"

  - entity: StakeholderNotice
    initial_state: QUEUED
    terminal_states: [RELEASED, CANCELLED]
    note: >-
      Cyclic: QUEUED -> BLOCKED -> QUEUED. A notice blocked by a rejected statement returns to QUEUED
      when the same statement is approved again in a later revision round.
    transitions:
      - from: QUEUED
        to: RELEASED
        trigger: "POST /crisis/stakeholder-notices/{notice_id}/release"
        actor: CommsLead | LegalCounsel
        preconditions:
          - "notice.state == QUEUED (else ERR_NOTICE_STATE_INVALID)"
          - "incident.comms_posture != FROZEN (else ERR_COMMS_POSTURE_FROZEN)"
          - "linked Statement.state == PUBLISHED (else ERR_STATEMENT_NOT_PUBLISHED)"
          - "embargo_until IS NULL OR current_utc >= embargo_until (else ERR_EMBARGO_NOT_REACHED)"
          - "every StakeholderNotice on the same incident with sequence_rank < this.sequence_rank is in state {RELEASED, CANCELLED} (else ERR_NOTICE_SEQUENCE_VIOLATION), UNLESS the statutory override applies: body.priority_override == true AND audience == REGULATOR AND actor role is LegalCounsel AND current_utc >= incident.activated_at + REGULATORY_OVERRIDE_WINDOW_MINUTES (= 120, declared in calculations.stakeholder_reach_index.constants)"
        side_effects:
          - "notice.released_at = current_utc; notice.reach_contribution = round(AUDIENCE_WEIGHT[audience] * estimated_reach / 1000, 2)"
          - "notice.priority_override_used = true when the statutory override was applied"
          - "incident.released_notice_count recomputed; incident.stakeholder_reach_index = calculations.stakeholder_reach_index"
          - "incident.version incremented by 1"
      - from: QUEUED
        to: BLOCKED
        trigger: "system event: linked Statement transitions IN_REVIEW -> REVISION_REQUESTED (HOP 3 of that cascade)"
        actor: system
        preconditions: ["notice.state == QUEUED"]
        side_effects:
          - "incident.blocked_notice_count recomputed; incident.comms_posture recomputed to RESTRICTED"
      - from: BLOCKED
        to: QUEUED
        trigger: "system event: linked Statement transitions IN_REVIEW -> APPROVED in a later revision round"
        actor: system
        preconditions: ["notice.state == BLOCKED"]
        side_effects:
          - "incident.blocked_notice_count recomputed; incident.comms_posture recomputed"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /crisis/stakeholder-notices/{notice_id}/cancel"
        actor: CommsLead
        preconditions: ["notice.state IN {QUEUED, BLOCKED}", "incident.comms_posture != FROZEN"]
        side_effects:
          - "notice.cancel_reason = body.cancel_reason"
          - "incident.blocked_notice_count recomputed; incident.comms_posture recomputed"
          - "incident.version incremented by 1"
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /crisis/stakeholder-notices/{notice_id}/cancel"
        actor: CommsLead
        preconditions: ["notice.state == BLOCKED", "incident.comms_posture != FROZEN"]
        side_effects:
          - "notice.cancel_reason = body.cancel_reason"
          - "incident.blocked_notice_count decremented; when it reaches 0 and sla_breached == false, incident.comms_posture returns to OPEN"
          - "incident.version incremented by 1"

  - entity: MisinformationClaim
    initial_state: DETECTED
    terminal_states: [CLOSED]
    note: >-
      Branching fork-join: TRIAGED forks into PLATFORM_ESCALATED or CORRECTION_ISSUED and both branches
      join at CLOSED, but the close side-effect set differs per branch (takedown accounting vs. channel
      airtime release plus correction-efficacy accounting).
    transitions:
      - from: DETECTED
        to: TRIAGED
        trigger: "POST /crisis/misinformation-claims/{claim_id}/triage"
        actor: SocialListener | CommsLead
        preconditions:
          - "claim.state == DETECTED (else ERR_CLAIM_STATE_INVALID)"
          - "incident.response_state == ACTIVATED (else ERR_INCIDENT_NOT_ACTIVATED)"
          - "incident.comms_posture != FROZEN"
        side_effects:
          - "incident.open_claim_count recomputed"
          - "incident.base_containment_score / amplification_rate_applied / containment_priority_score recomputed via calculations.containment_priority_score (the exposure component now includes this claim's virality_score)"
          - "incident.version incremented by 1"
      - from: TRIAGED
        to: PLATFORM_ESCALATED
        trigger: "POST /crisis/misinformation-claims/{claim_id}/escalate-platform"
        actor: SocialListener | CommsLead
        preconditions:
          - "claim.state == TRIAGED"
          - "channel.escalation_path_state == VERIFIED (else ERR_ESCALATION_PATH_UNVERIFIED)"
          - "claim.virality_score >= 60.00 (else ERR_VIRALITY_THRESHOLD_NOT_MET)"
        side_effects:
          - "channel.open_escalation_count recomputed; channel.version incremented by 1"
      - from: TRIAGED
        to: CORRECTION_ISSUED
        trigger: "POST /crisis/misinformation-claims/{claim_id}/issue-correction"
        actor: CommsLead
        preconditions:
          - "claim.state == TRIAGED"
          - "body.expected_channel_version == channel.version (else ERR_STALE_CHANNEL_VERSION, 412)"
          - "referenced Statement exists with statement_type == CORRECTION AND state == PUBLISHED AND incident_id == claim.incident_id (else ERR_CORRECTION_STATEMENT_REQUIRED)"
          - "body.correction_window_end > body.correction_window_start (else ERR_INVALID_REQUEST, 400)"
          - "count(MisinformationClaim c where c.channel_id == claim.channel_id AND c.state == CORRECTION_ISSUED AND c.correction_window_start < body.correction_window_end AND c.correction_window_end > body.correction_window_start) < channel.max_concurrent_corrections (else ERR_CHANNEL_CORRECTION_CAPACITY) — half-open [start, end) arithmetic, so a window starting exactly when another ends does not overlap"
          - "when the referenced statement has privilege_marked == true the acting TeamMember must have privilege_cleared == true (else ERR_PRIVILEGE_NOT_CLEARED)"
        side_effects:
          - "claim.correction_statement_id / correction_window_start / correction_window_end set from the body; correction_window_minutes = floor((end - start)/60)"
          - "channel.reserved_correction_minutes increased by claim.correction_window_minutes"
          - "channel.version incremented by 1"
      - from: PLATFORM_ESCALATED
        to: CLOSED
        trigger: "POST /crisis/misinformation-claims/{claim_id}/close"
        actor: SocialListener | CommsLead
        preconditions: ["claim.state == PLATFORM_ESCALATED"]
        side_effects:
          - "claim.resolution_branch = PLATFORM; claim.takedown_confirmed = true; claim.corrected stays false"
          - "channel.open_escalation_count recomputed; channel.version incremented by 1"
          - "incident.open_claim_count recomputed; incident.containment_priority_score recomputed; incident.version incremented by 1"
      - from: CORRECTION_ISSUED
        to: CLOSED
        trigger: "POST /crisis/misinformation-claims/{claim_id}/close"
        actor: SocialListener | CommsLead
        preconditions: ["claim.state == CORRECTION_ISSUED"]
        side_effects:
          - "claim.resolution_branch = CORRECTION; claim.corrected = true; claim.takedown_confirmed stays false"
          - "COMPENSATION: channel.reserved_correction_minutes decreased by claim.correction_window_minutes, restoring the conserved airtime ledger to its pre-correction value; channel.version incremented by 1"
          - "incident.open_claim_count recomputed; incident.containment_priority_score recomputed; incident.version incremented by 1"

  - entity: MediaInterview
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /crisis/media-interviews/{interview_id}/confirm"
        actor: CommsLead
        preconditions:
          - "interview.state == SCHEDULED (else ERR_INTERVIEW_STATE_INVALID)"
          - "spokesperson TeamMember.media_training_status == CURRENT AND media_training_expires_at > current_utc (else ERR_TRAINING_NOT_CURRENT)"
          - "interview.anticipated_question_count >= 8 AND interview.high_risk_answers_approved_count >= 3 (else ERR_QUESTION_PACK_INCOMPLETE)"
          - "incident.comms_posture == OPEN (else ERR_COMMS_POSTURE_FROZEN — a RESTRICTED posture also blocks new confirmations)"
        side_effects:
          - "interview.confirmed_at = current_utc"
          - "TeamMember.scheduled_interview_minutes for the spokesperson increased by interview.duration_minutes"
          - "incident.confirmed_interview_count recomputed; incident.version incremented by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /crisis/media-interviews/{interview_id}/cancel"
        actor: CommsLead | Spokesperson
        preconditions: ["interview.state == CONFIRMED"]
        side_effects:
          - "interview.cancel_reason = body.cancel_reason"
          - "COMPENSATION: TeamMember.scheduled_interview_minutes decreased by interview.duration_minutes, restoring the spokesperson-load ledger"
          - "incident.confirmed_interview_count recomputed; incident.version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /crisis/media-interviews/{interview_id}/cancel"
        actor: CommsLead | Spokesperson
        preconditions: ["interview.state == SCHEDULED"]
        side_effects:
          - "interview.cancel_reason = body.cancel_reason; the spokesperson's calendar interval is freed for later overlap checks (scheduled_interview_minutes unchanged because it only tracks CONFIRMED load)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system event: incident resolve cascade HOP 2"
        actor: system
        preconditions: ["the spokesperson's TeamAssignment transitioned ACKNOWLEDGED -> STOOD_DOWN"]
        side_effects:
          - "interview.cancel_reason = \"AUTO_CASCADE_INCIDENT_RESOLVED\""
          - "triggers HOP 3: TeamMember.scheduled_interview_minutes decreased by duration_minutes"

  - entity: PreparedMaterial
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic through STALE -> READY: a stale asset re-enters READY every time it is reviewed again."
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /crisis/prepared-materials/{material_id}/review"
        actor: CommsLead
        preconditions: ["material.readiness_state IN {DRAFT, STALE}"]
        side_effects:
          - "material.last_reviewed_at = current_utc; material.readiness_score = 100.00; material.reviewer_notes = body.reviewer_notes"
      - from: READY
        to: STALE
        trigger: "system event: POST /crisis/incidents/{incident_id}/sla-sweep re-evaluates materials whose scenario_code == incident.scenario_code"
        actor: system
        preconditions:
          - "material.readiness_state == READY"
          - "calculations.material_readiness_score < 60.00 at current_utc"
        side_effects:
          - "material.readiness_score rewritten to the decayed value"
      - from: STALE
        to: READY
        trigger: "POST /crisis/prepared-materials/{material_id}/review"
        actor: CommsLead
        preconditions: ["material.readiness_state == STALE"]
        side_effects:
          - "material.last_reviewed_at = current_utc; material.readiness_score = 100.00"

  - entity: PostCrisisReview
    initial_state: OPEN
    terminal_states: [SCORED]
    transitions:
      - from: OPEN
        to: SCORED
        trigger: "POST /crisis/post-crisis-reviews/{review_id}/score"
        actor: ExecSponsor
        preconditions:
          - "review.state == OPEN (else ERR_REVIEW_STATE_INVALID)"
          - "incident.response_state == RESOLVED"
          - "body.scoring_method IN {RAW, ADJUSTED}"
        side_effects:
          - "review.reputation_delta_raw and review.reputation_delta_adjusted both computed via calculations.reputation_delta (both variants are always stored)"
          - "review.scoring_method = body.scoring_method; review.reported_delta = the selected variant"
          - "review.playbook_update_count = body.playbook_update_count; review.scored_at = current_utc"
          - "LEDGER SYNC: incident.reputation_delta_reported = review.reported_delta; incident.version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: statement-create-stale-incident
    parent_entity: Incident
    write_endpoint: "POST /crisis/statements"
    occ_field: "expected_incident_version"
    description: |
      Creating a Statement against an Incident whose version has advanced since the client last read it
      is rejected with a stale-version error. A new HOLDING draft legitimately supersedes an earlier one
      (supersedes_statement_id), so the second create is not blocked by any state precondition: the
      writer's stale view of the incident is the only defect, and OCC on Incident.version is what
      detects it.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412
  - rule_id: correction-issue-stale-channel
    parent_entity: MonitoredChannel
    write_endpoint: "POST /crisis/misinformation-claims/{claim_id}/issue-correction"
    occ_field: "expected_channel_version"
    description: |
      Reserving a correction window on a MonitoredChannel whose version has advanced since the client
      last read it is rejected with a stale-version error. Two different claims on the same channel may
      each legitimately hold a correction window while capacity remains, so no state precondition covers
      the writer whose view of the channel's reserved airtime is out of date; OCC on
      MonitoredChannel.version does.
    error_id: ERR_STALE_CHANNEL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: signal_escalation_score
    trigger: "POST /crisis/issue-signals (creation only; the value is frozen and never recomputed)"
    algorithm: weighted_scoring
    formula: |
      credibility_multiplier = CREDIBILITY_MULTIPLIER[signal.source_credibility_tier]
      channel_bump           = CHANNEL_BUMP[channel.channel_type]
      base                   = round(signal.reach_score * credibility_multiplier, 2)
      sentiment_penalty      = round(max(0.0, -signal.sentiment_score) * SENTIMENT_SCALE, 2)
      regulatory_bump        = REGULATORY_FLAG_BUMP if signal.regulatory_flag else 0
      raw                    = base + sentiment_penalty + channel_bump + regulatory_bump
      escalation_score       = min(100.00, round(raw, 2))
      # Evaluation order is pinned: `base` and `sentiment_penalty` are each rounded to 2 decimals
      # BEFORE being summed, then the sum is rounded again and finally clamped at 100.00.
      # Positive sentiment contributes exactly 0 (it never reduces the score).
    input_set: "the signal's own input fields plus channel_type of the MonitoredChannel named by channel_id"
    constants:
      CREDIBILITY_MULTIPLIER: { A: 1.00, B: 0.85, C: 0.60 }
      CHANNEL_BUMP: { MEDIA: 8, SOCIAL: 4, REGULATORY: 15 }
      SENTIMENT_SCALE: 30
      REGULATORY_FLAG_BUMP: 12
      ESCALATION_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up"
    variants: []
    note: >-
      Mode (a) combinatorial formula: four inputs interacting non-linearly through an enum-keyed
      multiplier, an enum-keyed additive bump, a one-sided max() on sentiment and a min() clamp.
      POST /crisis/issue-signals/{signal_id}/escalate requires escalation_score >= ESCALATION_THRESHOLD
      (70.00 passes, 69.99 does not).

  - name: incident_severity_tier
    trigger: >-
      "POST /crisis/incidents/{incident_id}/activate (provisional_at_activation),
      POST /crisis/issue-signals/{signal_id}/escalate while the incident is ACTIVATED
      (provisional_at_activation, recompute), POST /crisis/incidents/{incident_id}/resolve
      (final_at_resolution)"
    algorithm: threshold
    formula: |
      # Tier banding is shared by both variants; the score they band differs.
      tier_of(score) = SEV1 if score >= 90.00
                  else SEV2 if score >= 70.00
                  else SEV3 if score >= 50.00
                  else SEV4
    input_set: "IssueSignal rows whose incident_id == incident.id, filtered per variant"
    constants:
      TIER_BOUNDARIES: { SEV1: 90.00, SEV2: 70.00, SEV3: 50.00 }
      PEAK_WEIGHT: 0.6
      AVERAGE_WEIGHT: 0.4
    precision: "2 decimal places, round_half_up; empty candidate set is impossible because activation requires escalated_signal_count >= 1"
    variants:
      - name: provisional_at_activation
        when: "activation, and every later escalate cascade while response_state == ACTIVATED"
        difference: |
          Candidate set = signals with state IN {LINKED, ESCALATED} (forward-looking: a merely linked
          signal still counts as exposure). Score = max(escalation_score) over the candidate set.
          Writes severity_tier / severity_score with severity_basis = PROVISIONAL.
      - name: final_at_resolution
        when: "resolution"
        difference: |
          Candidate set = signals with state == ESCALATED only, ordered by detected_at ASC (ties broken
          by created_at ASC). Score = round(peak * PEAK_WEIGHT + average * AVERAGE_WEIGHT, 2) where
          peak = max(escalation_score) and average = round(sum(escalation_score)/count, 2) over that set.
          Writes final_severity_tier / final_severity_score with severity_basis = FINAL.
          Identical signal data therefore yields a different tier than the provisional variant whenever a
          LINKED-but-never-escalated signal holds the peak or the escalated set is not uniform.

  - name: holding_statement_due_at
    trigger: "incident activate; recomputed by the escalate cascade whenever severity_tier changes"
    algorithm: interval_merge
    formula: |
      holding_statement_due_at = incident.activated_at + HOLDING_SLA_MINUTES[incident.severity_tier]
      # activated_at is the ONLY base instant. A tier change late in the response shortens the window
      # retroactively; it never re-bases the deadline on the escalation instant.
      sla_breached = true  when current_utc >= holding_statement_due_at
                                 AND incident.holding_statement_published_at IS NULL
    input_set: "incident.activated_at and the current severity_tier"
    constants:
      HOLDING_SLA_MINUTES: { SEV1: 30, SEV2: 60, SEV3: 180, SEV4: 480 }
    precision: "whole minutes; the breach comparison is >= (equality at the deadline is a breach)"
    variants: []

  - name: containment_priority_score
    trigger: "incident activate; escalate cascade; misinformation triage; misinformation close"
    algorithm: tiered_pricing
    formula: |
      exposure_component        = min(100.00, round(sum(virality_score) over MisinformationClaim rows
                                     where incident_id == incident.id AND state IN
                                     {DETECTED, TRIAGED, PLATFORM_ESCALATED, CORRECTION_ISSUED}, 2))
      base_containment_score    = round(0.70 * TIER_POINTS[incident.severity_tier]
                                        + 0.30 * exposure_component, 2)
      band                      = HIGH   if base_containment_score >= 80.00
                                  else MEDIUM if base_containment_score >= 55.00
                                  else LOW
      amplification_rate_applied = AMP_RATE[band]
      amplification_fee          = round(base_containment_score * amplification_rate_applied, 2)
      containment_priority_score = min(150.00, round(base_containment_score + amplification_fee, 2))
      # PINNED EVALUATION ORDER (circular-looking dependency): the band is keyed on
      # base_containment_score, i.e. the value BEFORE the fee is added. The total is never re-banded,
      # even when base + fee crosses 55.00 or 80.00. Example: base 52.50 stays in LOW (rate 0.05) and
      # yields 55.13 — a total that sits inside the MEDIUM band but keeps the LOW rate.
    input_set: "incident.severity_tier plus every non-closed MisinformationClaim on the incident"
    constants:
      TIER_POINTS: { SEV1: 100, SEV2: 75, SEV3: 50, SEV4: 25 }
      SEVERITY_WEIGHT: 0.70
      EXPOSURE_WEIGHT: 0.30
      AMP_RATE: { HIGH: 0.20, MEDIUM: 0.10, LOW: 0.05 }
      SCORE_CAP: 150.00
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "Mode (c) combinatorial formula: the fee depends on a band of the pre-fee subtotal, so evaluation order must be explicit for the value to be well defined."

  - name: stakeholder_reach_index
    trigger: "POST /crisis/stakeholder-notices/{notice_id}/release (recomputed from scratch on every release)"
    algorithm: aggregation
    formula: |
      for each StakeholderNotice n where n.incident_id == incident.id AND n.state == RELEASED,
          ordered by n.released_at ASC (ties broken by n.created_at ASC):
        contribution(n) = round(AUDIENCE_WEIGHT[n.audience] * n.estimated_reach / 1000, 2)
      stakeholder_reach_index = round(sum(contribution(n)), 2)
      # PINNED ROUNDING ORDER: round PER NOTICE first, then sum, then round the sum.
      # Summing the unrounded contributions and rounding once gives a different value: three notices
      # contributing 1.006, 1.00625 and 1.0065 yield 3.03 under the pinned order and 3.02 under
      # sum-then-round. The pinned answer is 3.03.
    input_set: "StakeholderNotice rows with state == RELEASED only; QUEUED, BLOCKED and CANCELLED notices are excluded"
    constants:
      AUDIENCE_WEIGHT: { EMPLOYEE: 1.00, CUSTOMER: 1.25, REGULATOR: 1.50, INVESTOR: 1.75, MEDIA: 2.00 }
      AUDIENCE_SEQUENCE_RANK: { EMPLOYEE: 1, CUSTOMER: 2, REGULATOR: 3, INVESTOR: 4, MEDIA: 5 }
      REACH_DIVISOR: 1000
      REGULATORY_OVERRIDE_WINDOW_MINUTES: 120
    precision: "2 decimal places, round_half_up, applied per notice and again to the sum"
    variants: []
    note: "Mode (b) combinatorial formula: nested rounding whose order changes the cents."

  - name: reputation_delta
    trigger: "POST /crisis/post-crisis-reviews/{review_id}/score (both variants always computed)"
    algorithm: weighted_scoring
    formula: |
      raw_delta        = round(review.reputation_index_after - review.reputation_index_before, 2)
      exposure_factor  = review.exposure_factor            # snapshotted at resolution, 4 decimals
      correction_ratio = 0.0000 if review.total_claim_count == 0
                         else round(review.corrected_claim_count / review.total_claim_count, 4)
      efficacy_bonus   = round(EFFICACY_MAX * correction_ratio, 2)
      adjusted_delta   = round(raw_delta * (1 - exposure_factor) + efficacy_bonus, 2)
      reported_delta   = raw_delta if review.scoring_method == RAW else adjusted_delta
    input_set: "the review's own resolution snapshots; no live child rows are re-read at scoring time"
    constants:
      EFFICACY_MAX: 2.50
      EXPOSURE_FACTOR_CAP: 0.50
    precision: "2 decimal places, round_half_up for deltas; exposure_factor and correction_ratio carry 4 decimals"
    variants:
      - name: raw
        when: "scoring_method == RAW"
        difference: "Pure index difference; media exposure and correction efficacy are ignored."
      - name: exposure_adjusted
        when: "scoring_method == ADJUSTED"
        difference: >-
          Damps the raw delta by (1 - exposure_factor) and then adds the correction-efficacy bonus, so
          identical reputation indices report a materially different delta (e.g. -7.30 raw vs -5.83
          adjusted at exposure_factor 0.0303 with 1 of 2 claims corrected).

  - name: material_readiness_score
    trigger: >-
      "POST /crisis/prepared-materials/{material_id}/review (resets to 100.00) and
      POST /crisis/incidents/{incident_id}/sla-sweep (decays every material whose scenario_code equals
      the incident's scenario_code)"
    algorithm: decay_function
    formula: |
      days_since_review = floor((current_utc - material.last_reviewed_at) / 86400 seconds)
      readiness_score   = max(0.00, round(100.00 - DECAY_PER_DAY * days_since_review, 2))
      readiness_state   = READY if readiness_score >= READY_THRESHOLD else STALE
      # Step decay on whole elapsed days, not continuous. 16 days -> 60.00 -> READY (>= is inclusive);
      # 17 days -> 57.50 -> STALE.
    input_set: "materials with readiness_state IN {READY, STALE} and scenario_code == incident.scenario_code; DRAFT materials are untouched by the sweep"
    constants:
      DECAY_PER_DAY: 2.50
      READY_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: approval_quorum_requirement
    trigger: "POST /crisis/statements/{statement_id}/submit-review"
    algorithm: threshold
    formula: |
      required_roles = [INCIDENT_LEAD]
      if incident.severity_tier IN {SEV1, SEV2} OR statement.privilege_marked == true:
          required_roles = required_roles + [LEGAL_COUNSEL]
      if incident.severity_tier == SEV1:
          required_roles = required_roles + [EXEC_SPONSOR]
      quorum_required   = count(required_roles)
      review_deadline_at = statement.submitted_at + REVIEW_SLA_MINUTES[incident.severity_tier]
      # Role order is fixed as listed, so ApprovalTask rows are created in that order.
    input_set: "incident.severity_tier at submission time plus statement.privilege_marked"
    constants:
      REVIEW_SLA_MINUTES: { SEV1: 15, SEV2: 30, SEV3: 90, SEV4: 240 }
    precision: "whole counts and whole minutes"
    variants: []

  - name: approval_task_routing
    trigger: "POST /crisis/statements/{statement_id}/submit-review, once per required role"
    algorithm: constraint_propagation
    formula: |
      # Server-side selector. For each required_team_role R:
      # (a) eligibility filter — candidate TeamAssignment rows a where
      #       a.incident_id == statement.incident_id
      #       AND a.team_role == R
      #       AND a.state == ACKNOWLEDGED
      #       AND (statement.privilege_marked == false
      #            OR TeamMember(a.member_id).privilege_cleared == true) (privilege circle)
      # (b) ranking expression — AUTHORITY_RANK[a.decision_authority] DESC
      # (c) tie-break — a.created_at ASC (never a.id)
      # (d) empty candidate set — the whole submit-review call fails with ERR_APPROVER_UNAVAILABLE (409)
      #     and no ApprovalTask row is created for any role (atomic)
      # (e) the drafter is deliberately NOT filtered out here: if the only ACKNOWLEDGED holder of a
      #     required seat is statement.drafted_by_member_id the task is still created and assigned to
      #     that member, and the segregation-of-duties refusal surfaces on the decide call
      #     (validations priority 14, ERR_SEGREGATION_OF_DUTIES 403). Such a round can only end by
      #     sla-sweep expiry or statement withdrawal, which is the intended pressure on team seating.
      assignee_member_id = first candidate after ranking and tie-break
    input_set: "TeamAssignment rows on the statement's incident, filtered as above"
    constants:
      AUTHORITY_RANK: { FULL: 2, LIMITED: 1 }
    precision: "n/a"
    variants: []

  - name: conserved_ledger_recomputation
    trigger: >-
      "every transition whose side_effects say 'recomputed' for one of the three conserved ledgers:
      Incident.open_approval_task_count, MonitoredChannel.reserved_correction_minutes,
      TeamMember.scheduled_interview_minutes"
    algorithm: aggregation
    formula: |
      Incident.open_approval_task_count =
          count(ApprovalTask t where t.statement_id IN (Statement s where s.incident_id == incident.id)
                AND t.state == PENDING)
      MonitoredChannel.reserved_correction_minutes =
          sum(MisinformationClaim c.correction_window_minutes where c.channel_id == channel.id
              AND c.state == CORRECTION_ISSUED)
      TeamMember.scheduled_interview_minutes =
          sum(MediaInterview i.duration_minutes where i.spokesperson_member_id == member.id
              AND i.state == CONFIRMED)
    input_set: "as written above; every filter is an explicit state enum set, never an adjective"
    constants: {}
    precision: "whole counts / whole minutes; each ledger is recomputed from scratch (never incrementally patched) so a forward action plus its compensating action leaves it exactly where it started"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the request's X-User-Role appears in the endpoint's roles list in 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "for entity_backed roles, X-User-ID resolves to an existing TeamMember"
    error_id: ERR_TEAM_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints whose roles include an entity_backed role"
  - priority: 4
    category: business_constraint
    check: "request body carries every required field with the declared type, enum member and numeric range; datetime intervals satisfy end > start (scheduled_end_at, correction_window_end); unknown fields are rejected; limit/offset within pagination bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 6
    category: existence
    check: "every foreign key in the body resolves (incident_id, channel_id, member_id, statement_id, spokesperson_member_id, supersedes_statement_id, correction_statement_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creation endpoints and POST /crisis/issue-signals/{signal_id}/link, POST /crisis/misinformation-claims/{claim_id}/issue-correction"
  - priority: 7
    category: auth
    check: "ownership: X-User-ID equals assignment.member_id for acknowledge, and task.assignee_member_id for decide"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /crisis/team-assignments/{assignment_id}/acknowledge, POST /crisis/approval-tasks/{task_id}/decide"
  - priority: 8
    category: state
    check: "expected_incident_version equals Incident.version"
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412
    applies_to: "POST /crisis/statements"
  - priority: 9
    category: state
    check: "expected_channel_version equals MonitoredChannel.version"
    error_id: ERR_STALE_CHANNEL_VERSION
    http_status: 412
    applies_to: "POST /crisis/misinformation-claims/{claim_id}/issue-correction"
  - priority: 10
    category: state
    check: "the target resource is in a from-state the requested transition declares in 1.2"
    error_id: "ERR_INVALID_SIGNAL_STATE | ERR_STATEMENT_STATE_INVALID | ERR_STATEMENT_NOT_IN_REVIEW | ERR_APPROVAL_TASK_NOT_PENDING | ERR_NOTICE_STATE_INVALID | ERR_CLAIM_STATE_INVALID | ERR_INTERVIEW_STATE_INVALID | ERR_MATERIAL_STATE_INVALID | ERR_REVIEW_STATE_INVALID | ERR_ASSIGNMENT_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 11
    category: state
    check: "the owning incident is in the response_state the operation requires (ACTIVATED for statement submit/publish, claim triage, notice release; not RESOLVED for links, assignments and privilege changes)"
    error_id: "ERR_INCIDENT_NOT_ACTIVATED | ERR_INCIDENT_ALREADY_RESOLVED"
    http_status: 409
    applies_to: "all child-mutating endpoints"
  - priority: 12
    category: state
    check: "incident.comms_posture does not gate this operation (FROZEN blocks every child mutation except waive-privilege, sla-sweep and post-crisis scoring; RESTRICTED additionally blocks media-interview confirmation)"
    error_id: ERR_COMMS_POSTURE_FROZEN
    http_status: 409
    applies_to: "all child-mutating endpoints"
  - priority: 13
    category: business_safety
    check: "when the operation touches privileged material (statement.privilege_marked, or assert/waive privilege) the acting TeamMember has privilege_cleared == true"
    error_id: ERR_PRIVILEGE_NOT_CLEARED
    http_status: 403
    applies_to: "POST /crisis/incidents/{incident_id}/assert-privilege, POST /crisis/incidents/{incident_id}/waive-privilege, POST /crisis/approval-tasks/{task_id}/decide, POST /crisis/statements/{statement_id}/publish, POST /crisis/misinformation-claims/{claim_id}/issue-correction"
  - priority: 14
    category: business_safety
    check: "segregation of duties: X-User-ID != statement.drafted_by_member_id when deciding an ApprovalTask on that statement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /crisis/approval-tasks/{task_id}/decide"
  - priority: 15
    category: business_referential
    check: "the crisis-team seat the operation depends on exists and is ACKNOWLEDGED (INCIDENT_LEAD for activation, plus LEGAL_COUNSEL when the provisional tier is SEV1; LEGAL_COUNSEL seat of the acting member for privilege assertion)"
    error_id: ERR_ASSIGNMENT_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /crisis/incidents/{incident_id}/activate, POST /crisis/incidents/{incident_id}/assert-privilege"
  - priority: 16
    category: business_referential
    check: "the notice's linked Statement is in state PUBLISHED"
    error_id: ERR_STATEMENT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /crisis/stakeholder-notices/{notice_id}/release"
  - priority: 17
    category: business_referential
    check: "correction_statement_id references a Statement with statement_type == CORRECTION, state == PUBLISHED and the same incident_id as the claim"
    error_id: ERR_CORRECTION_STATEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /crisis/misinformation-claims/{claim_id}/issue-correction"
  - priority: 18
    category: business_referential
    check: "every required approver role from approval_quorum_requirement has a non-empty eligible pool per approval_task_routing"
    error_id: ERR_APPROVER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /crisis/statements/{statement_id}/submit-review"
  - priority: 19
    category: business_referential
    check: "no other TeamAssignment on this incident already holds the same team_role in state {ASSIGNED, ACKNOWLEDGED}"
    error_id: ERR_DUPLICATE_ASSIGNMENT_ROLE
    http_status: 409
    applies_to: "POST /crisis/team-assignments"
  - priority: 20
    category: business_temporal
    check: "current_utc <= statement.review_deadline_at"
    error_id: ERR_REVIEW_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /crisis/approval-tasks/{task_id}/decide"
  - priority: 21
    category: business_temporal
    check: "notice.embargo_until IS NULL OR current_utc >= notice.embargo_until"
    error_id: ERR_EMBARGO_NOT_REACHED
    http_status: 409
    applies_to: "POST /crisis/stakeholder-notices/{notice_id}/release"
  - priority: 22
    category: business_temporal
    check: >-
      spokesperson calendar overlap with buffer: reject when any MediaInterview i with
      i.spokesperson_member_id == body.spokesperson_member_id AND i.state IN {SCHEDULED, CONFIRMED}
      satisfies body.scheduled_start_at < i.scheduled_end_at + INTERVIEW_BUFFER_MINUTES(30)
      AND body.scheduled_end_at + INTERVIEW_BUFFER_MINUTES(30) > i.scheduled_start_at
      (closed intervals padded by 30 minutes on both sides; a gap of exactly 30 minutes is allowed)
    error_id: ERR_SPOKESPERSON_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crisis/media-interviews"
  - priority: 23
    category: business_constraint
    check: "signal.escalation_score >= 70.00"
    error_id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /crisis/issue-signals/{signal_id}/escalate"
  - priority: 24
    category: business_constraint
    check: "incident.escalated_signal_count >= 1"
    error_id: ERR_NO_ESCALATED_SIGNAL
    http_status: 422
    applies_to: "POST /crisis/incidents/{incident_id}/activate"
  - priority: 25
    category: business_constraint
    check: "statement.revision_locked == false AND statement.revision_round < 3"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /crisis/statements/{statement_id}/revise"
  - priority: 26
    category: business_constraint
    check: "every StakeholderNotice on the incident with a strictly lower sequence_rank is in state {RELEASED, CANCELLED}, unless the REGULATOR statutory override applies"
    error_id: ERR_NOTICE_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /crisis/stakeholder-notices/{notice_id}/release"
  - priority: 27
    category: business_constraint
    check: "spokesperson media_training_status == CURRENT AND media_training_expires_at > current_utc"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /crisis/media-interviews/{interview_id}/confirm"
  - priority: 28
    category: business_constraint
    check: "interview.anticipated_question_count >= 8 AND interview.high_risk_answers_approved_count >= 3"
    error_id: ERR_QUESTION_PACK_INCOMPLETE
    http_status: 422
    applies_to: "POST /crisis/media-interviews/{interview_id}/confirm"
  - priority: 29
    category: business_constraint
    check: "channel.escalation_path_state == VERIFIED"
    error_id: ERR_ESCALATION_PATH_UNVERIFIED
    http_status: 422
    applies_to: "POST /crisis/misinformation-claims/{claim_id}/escalate-platform"
  - priority: 30
    category: business_constraint
    check: "claim.virality_score >= 60.00"
    error_id: ERR_VIRALITY_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /crisis/misinformation-claims/{claim_id}/escalate-platform"
  - priority: 31
    category: business_constraint
    check: "count(StakeholderNotice where incident_id == incident.id AND state IN {QUEUED, BLOCKED}) == 0"
    error_id: ERR_OPEN_NOTICES_BLOCK_RESOLUTION
    http_status: 409
    applies_to: "POST /crisis/incidents/{incident_id}/resolve"
  - priority: 32
    category: business_constraint
    check: "incident.open_claim_count == 0"
    error_id: ERR_OPEN_CLAIMS_BLOCK_RESOLUTION
    http_status: 409
    applies_to: "POST /crisis/incidents/{incident_id}/resolve"
  - priority: 33
    category: business_fiscal
    check: >-
      channel correction capacity: count of CORRECTION_ISSUED claims on the same channel whose half-open
      window [correction_window_start, correction_window_end) overlaps the requested window must be
      strictly less than channel.max_concurrent_corrections
    error_id: ERR_CHANNEL_CORRECTION_CAPACITY
    http_status: 409
    applies_to: "POST /crisis/misinformation-claims/{claim_id}/issue-correction"

# =============================================================================
# 1.5 API Endpoint Table   (all business paths under /crisis; flat topology)
# =============================================================================
endpoints:
  # ---- logical clock (test-driving endpoint) ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock, which every `current_utc` reference in 1.2/1.3/1.4 reads. The
      server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the
      logical clock reads that default and never falls back to real wall-clock time.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no entity is mutated and no sweep is triggered"]

  # ---- TeamMember ------------------------------------------------------------
  - method: POST
    path: "/crisis/team-members"
    description: "Register a person who can hold crisis-team seats."
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "org_title", "privilege_cleared?", "media_training_status?", "media_training_expires_at?"]
    output: TeamMember
    side_effects: ["scheduled_interview_minutes = 0; active_assignment_count = 0"]
  - method: GET
    path: "/crisis/team-members/{member_id}"
    description: "Read one roster member."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: TeamMember
    side_effects: []
  - method: GET
    path: "/crisis/team-members"
    description: "List roster members with filters and pagination."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["privilege_cleared?", "media_training_status?", "limit?", "offset?"]
    output: TeamMember[]
    side_effects: []

  # ---- MonitoredChannel ------------------------------------------------------
  - method: POST
    path: "/crisis/monitored-channels"
    description: "Register a monitored media, social or regulatory channel."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "channel_type", "platform_escalation_contact?", "max_concurrent_corrections?"]
    output: MonitoredChannel
    side_effects: ["escalation_path_state = UNVERIFIED; reserved_correction_minutes = 0; open_escalation_count = 0"]
  - method: GET
    path: "/crisis/monitored-channels/{channel_id}"
    description: "Read one monitored channel."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: MonitoredChannel
    side_effects: []
  - method: GET
    path: "/crisis/monitored-channels"
    description: "List monitored channels with filters and pagination."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["channel_type?", "escalation_path_state?", "limit?", "offset?"]
    output: MonitoredChannel[]
    side_effects: []
  - method: POST
    path: "/crisis/monitored-channels/{channel_id}/verify-escalation-path"
    description: "Record a verified trust-and-safety escalation contact, unlocking platform escalation."
    roles: [ProgramAdmin]
    code: 200
    input: [verified_contact_reference]
    output: MonitoredChannel
    side_effects: ["escalation_path_state = VERIFIED", "increments MonitoredChannel.version by 1"]

  # ---- Incident --------------------------------------------------------------
  - method: POST
    path: "/crisis/incidents"
    description: "Open an incident file in MONITORING / NON_PRIVILEGED."
    roles: [IncidentLead]
    code: 201
    input: ["title", "scenario_code", "reputation_index_before?"]
    output: Incident
    side_effects: ["created_by_member_id = X-User-ID; comms_posture = OPEN; all counters 0"]
  - method: GET
    path: "/crisis/incidents/{incident_id}"
    description: "Read one incident with every derived field (posture, tiers, ledgers, scores)."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/crisis/incidents"
    description: "List incidents with filters and pagination."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["response_state?", "privilege_state?", "comms_posture?", "severity_tier?", "created_by_member_id?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/crisis/incidents/{incident_id}/activate"
    description: "Activate the crisis response; freezes the provisional severity tier and the holding-statement SLA."
    roles: [IncidentLead]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "response_state MONITORING -> ACTIVATED; activated_at = current_utc"
      - "severity_tier / severity_score via incident_severity_tier variant provisional_at_activation"
      - "holding_statement_due_at via holding_statement_due_at"
      - "base_containment_score / amplification_rate_applied / containment_priority_score via containment_priority_score"
      - "increments Incident.version by 1"
  - method: POST
    path: "/crisis/incidents/{incident_id}/assert-privilege"
    description: "Assert attorney-client privilege over the incident record; freezes the comms posture."
    roles: [LegalCounsel]
    code: 200
    input: [privilege_basis]
    output: Incident
    side_effects:
      - "privilege_state NON_PRIVILEGED -> PRIVILEGED_ASSERTED; legal_hold_active = true; comms_posture = FROZEN"
      - "voids PENDING ApprovalTasks assigned to members with privilege_cleared == false, recomputes open_approval_task_count and may push an IN_REVIEW statement to REVISION_REQUESTED"
      - "increments Incident.version by 1"
  - method: POST
    path: "/crisis/incidents/{incident_id}/waive-privilege"
    description: "Waive privilege and release the legal hold."
    roles: [LegalCounsel]
    code: 200
    input: [waiver_reason]
    output: Incident
    side_effects: ["privilege_state -> PRIVILEGE_WAIVED; legal_hold_active = false; comms_posture recomputed", "increments Incident.version by 1"]
  - method: POST
    path: "/crisis/incidents/{incident_id}/resolve"
    description: "Close the response, compute the final severity tier and open the post-crisis review."
    roles: [IncidentLead]
    code: 200
    input: [reputation_index_after]
    output: Incident
    side_effects:
      - "response_state ACTIVATED -> RESOLVED; resolved_at = current_utc; comms_posture = FROZEN"
      - "final_severity_tier / final_severity_score via incident_severity_tier variant final_at_resolution"
      - "creates one PostCrisisReview in OPEN with the resolution snapshots"
      - "cascade: ACKNOWLEDGED TeamAssignments -> STOOD_DOWN -> spokesperson MediaInterviews -> CANCELLED -> TeamMember.scheduled_interview_minutes released"
      - "increments Incident.version by 1"
  - method: POST
    path: "/crisis/incidents/{incident_id}/sla-sweep"
    description: >-
      Operator checkpoint that advances time-driven state at the current logical clock: latches
      sla_breached, expires overdue ApprovalTasks (pushing their statements to REVISION_REQUESTED),
      decays PreparedMaterial readiness for the incident's scenario_code and recomputes the posture.
    roles: [ProgramAdmin, IncidentLead, CommsLead]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "sla_breached latched when current_utc >= holding_statement_due_at and no HOLDING statement is published"
      - "PENDING ApprovalTasks past statement.review_deadline_at -> EXPIRED, their statements IN_REVIEW -> REVISION_REQUESTED (which blocks queued notices)"
      - "PreparedMaterial rows with matching scenario_code re-scored via material_readiness_score; READY -> STALE below 60.00"
      - "comms_posture recomputed; increments Incident.version by 1"

  # ---- TeamAssignment --------------------------------------------------------
  - method: POST
    path: "/crisis/team-assignments"
    description: "Seat a roster member in a crisis-team role with a decision-authority rank."
    roles: [IncidentLead]
    code: 201
    input: [incident_id, member_id, team_role, decision_authority]
    output: TeamAssignment
    side_effects: ["state = ASSIGNED", "TeamMember.active_assignment_count recomputed"]
  - method: GET
    path: "/crisis/team-assignments/{assignment_id}"
    description: "Read one crisis-team seat."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: TeamAssignment
    side_effects: []
  - method: GET
    path: "/crisis/team-assignments"
    description: "List crisis-team seats filtered by incident, member, role or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "member_id?", "team_role?", "state?", "limit?", "offset?"]
    output: TeamAssignment[]
    side_effects: []
  - method: POST
    path: "/crisis/team-assignments/{assignment_id}/acknowledge"
    description: "Seat holder accepts the seat; only the seated member may call this."
    roles: [IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: TeamAssignment
    side_effects: ["state ASSIGNED -> ACKNOWLEDGED; acknowledged_at = current_utc"]

  # ---- IssueSignal -----------------------------------------------------------
  - method: POST
    path: "/crisis/issue-signals"
    description: >-
      Record an observed issue on a monitored channel. Computes escalation_score at creation and starts
      LINKED when incident_id is supplied, otherwise OPEN.
    roles: [SocialListener, ProgramAdmin]
    code: 201
    input: ["channel_id", "headline", "reach_score", "sentiment_score", "source_credibility_tier", "regulatory_flag?", "incident_id?"]
    output: IssueSignal
    side_effects:
      - "escalation_score via signal_escalation_score; detected_at = current_utc"
      - "when incident_id is supplied: state = LINKED and Incident.linked_signal_count recomputed"
  - method: GET
    path: "/crisis/issue-signals/{signal_id}"
    description: "Read one issue signal."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: IssueSignal
    side_effects: []
  - method: GET
    path: "/crisis/issue-signals"
    description: "List issue signals filtered by incident, channel or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "channel_id?", "state?", "limit?", "offset?"]
    output: IssueSignal[]
    side_effects: []
  - method: POST
    path: "/crisis/issue-signals/{signal_id}/link"
    description: "Attach an OPEN signal to an incident."
    roles: [SocialListener, IncidentLead]
    code: 200
    input: [incident_id]
    output: IssueSignal
    side_effects: ["state OPEN -> LINKED", "Incident.linked_signal_count recomputed", "increments Incident.version by 1"]
  - method: POST
    path: "/crisis/issue-signals/{signal_id}/escalate"
    description: "Escalate a linked signal above the 70.00 threshold, re-deriving incident severity and SLA."
    roles: [SocialListener, IncidentLead]
    code: 200
    input: []
    output: IssueSignal
    side_effects:
      - "state LINKED -> ESCALATED; escalated_at = current_utc"
      - "cascade: incident.severity_tier -> holding_statement_due_at -> sla_breached -> comms_posture"
      - "incident.containment_priority_score recomputed; increments Incident.version by 1"

  # ---- Statement -------------------------------------------------------------
  - method: POST
    path: "/crisis/statements"
    description: >-
      Draft a statement against an activated incident. Optimistic concurrency: the caller must pass the
      Incident.version it last read; a stale value is rejected with ERR_STALE_INCIDENT_VERSION (412).
    roles: [CommsLead]
    code: 201
    input: ["incident_id", "statement_type", "body", "expected_incident_version", "privilege_marked?", "supersedes_statement_id?"]
    output: Statement
    side_effects:
      - "state = DRAFT; revision_round = 0; drafted_by_member_id = X-User-ID; quorum_required / approvals_recorded = 0"
      - "increments Incident.version by 1"
  - method: GET
    path: "/crisis/statements/{statement_id}"
    description: "Read one statement with its review ledger."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: Statement
    side_effects: []
  - method: GET
    path: "/crisis/statements"
    description: "List statements filtered by incident, author, superseded predecessor, type or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "drafted_by_member_id?", "supersedes_statement_id?", "statement_type?", "state?", "limit?", "offset?"]
    output: Statement[]
    side_effects: []
  - method: POST
    path: "/crisis/statements/{statement_id}/submit-review"
    description: >-
      Route a DRAFT or REVISION_REQUESTED statement for approval: derives the quorum, fans out
      ApprovalTasks to the pinned seat order and starts the review clock.
    roles: [CommsLead]
    code: 200
    input: []
    output: Statement
    side_effects:
      - "state -> IN_REVIEW; submitted_at = current_utc; review_deadline_at = submitted_at + REVIEW_SLA_MINUTES[incident.severity_tier]"
      - "quorum_required via approval_quorum_requirement; approvals_recorded reset to 0"
      - "creates one PENDING ApprovalTask per seat selected by approval_task_routing, in pinned order"
      - "Incident.open_approval_task_count increased by the number of tasks created"
  - method: POST
    path: "/crisis/statements/{statement_id}/revise"
    description: "Rewrite the body of a REVISION_REQUESTED statement, consuming one revision round."
    roles: [CommsLead]
    code: 200
    input: [body]
    output: Statement
    side_effects: ["state REVISION_REQUESTED -> DRAFT; revision_round += 1; revision_locked = true when revision_round reaches 3"]
  - method: POST
    path: "/crisis/statements/{statement_id}/publish"
    description: "Publish an APPROVED statement, unblocking the audience sequence and clearing the SLA."
    roles: [CommsLead]
    code: 200
    input: []
    output: Statement
    side_effects:
      - "state APPROVED -> PUBLISHED; published_at = current_utc; approval_latency_minutes latched"
      - "a HOLDING statement sets Incident.holding_statement_published_at and clears the pending SLA"
      - "supersedes_statement_id target (if any) PUBLISHED -> SUPERSEDED"
      - "increments Incident.version by 1"
  - method: POST
    path: "/crisis/statements/{statement_id}/withdraw"
    description: "Withdraw a statement that is still under review, voiding its outstanding approval tasks."
    roles: [CommsLead, LegalCounsel]
    code: 200
    input: [withdraw_reason]
    output: Statement
    side_effects:
      - "state -> WITHDRAWN"
      - "all PENDING ApprovalTasks -> VOIDED and Incident.open_approval_task_count decreased by exactly that count"
      - "QUEUED StakeholderNotices bound to this statement -> CANCELLED"

  # ---- ApprovalTask ----------------------------------------------------------
  - method: GET
    path: "/crisis/approval-tasks/{task_id}"
    description: "Read one approval task."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: ApprovalTask
    side_effects: []
  - method: GET
    path: "/crisis/approval-tasks"
    description: "List approval tasks filtered by statement, assignee, round or state (pinned creation order)."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["statement_id?", "assignee_member_id?", "revision_round?", "state?", "limit?", "offset?"]
    output: ApprovalTask[]
    side_effects: []
  - method: POST
    path: "/crisis/approval-tasks/{task_id}/decide"
    description: >-
      Record an approve or reject decision. Only the assigned member may decide; approving to quorum
      moves the statement to APPROVED, rejecting (or any veto-seat rejection) starts the revision loop.
    roles: [IncidentLead, LegalCounsel, CommsLead, ExecSponsor]
    code: 200
    input: ["decision", "decision_comment?"]
    output: ApprovalTask
    side_effects:
      - "state PENDING -> APPROVED or REJECTED; decided_at = current_utc"
      - "approve: Statement.approvals_recorded += 1; reaching quorum sets Statement APPROVED and approved_at"
      - "reject cascade: Statement -> REVISION_REQUESTED, sibling PENDING tasks -> VOIDED, QUEUED notices -> BLOCKED, Incident.comms_posture -> RESTRICTED"
      - "Incident.open_approval_task_count recomputed"

  # ---- StakeholderNotice -----------------------------------------------------
  - method: POST
    path: "/crisis/stakeholder-notices"
    description: "Queue an audience-specific notice carrying a statement, at a sequence rank."
    roles: [CommsLead]
    code: 201
    input: ["incident_id", "statement_id", "audience", "estimated_reach", "embargo_until?"]
    output: StakeholderNotice
    side_effects: ["state = QUEUED; reach_contribution = 0.00"]
  - method: GET
    path: "/crisis/stakeholder-notices/{notice_id}"
    description: "Read one stakeholder notice."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: StakeholderNotice
    side_effects: []
  - method: GET
    path: "/crisis/stakeholder-notices"
    description: "List notices filtered by incident, statement, audience or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "statement_id?", "audience?", "state?", "limit?", "offset?"]
    output: StakeholderNotice[]
    side_effects: []
  - method: POST
    path: "/crisis/stakeholder-notices/{notice_id}/release"
    description: >-
      Release a queued notice. Requires the carried statement PUBLISHED, the embargo reached and every
      lower sequence_rank notice for the incident already RELEASED or CANCELLED. Only LegalCounsel may
      invoke the REGULATOR statutory override.
    roles: [CommsLead, LegalCounsel]
    code: 200
    input: ["priority_override?"]
    output: StakeholderNotice
    side_effects:
      - "state QUEUED -> RELEASED; released_at = current_utc"
      - "reach_contribution computed and Incident.stakeholder_reach_index recomputed via stakeholder_reach_index"
      - "Incident.released_notice_count recomputed; increments Incident.version by 1"
  - method: POST
    path: "/crisis/stakeholder-notices/{notice_id}/cancel"
    description: "Cancel a queued or blocked notice."
    roles: [CommsLead]
    code: 200
    input: [cancel_reason]
    output: StakeholderNotice
    side_effects: ["state -> CANCELLED; Incident.blocked_notice_count recomputed"]

  # ---- PreparedMaterial ------------------------------------------------------
  - method: POST
    path: "/crisis/prepared-materials"
    description: "Register a dark-site page, FAQ, holding template or exec brief for a likely scenario."
    roles: [ProgramAdmin, CommsLead]
    code: 201
    input: ["scenario_code", "material_type", "title", "dark_site_url?"]
    output: PreparedMaterial
    side_effects: ["readiness_state = DRAFT; readiness_score = 0.00"]
  - method: GET
    path: "/crisis/prepared-materials/{material_id}"
    description: "Read one prepared material with its decayed readiness score."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: PreparedMaterial
    side_effects: []
  - method: GET
    path: "/crisis/prepared-materials"
    description: "List prepared materials filtered by scenario, type or readiness state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["scenario_code?", "material_type?", "readiness_state?", "limit?", "offset?"]
    output: PreparedMaterial[]
    side_effects: []
  - method: POST
    path: "/crisis/prepared-materials/{material_id}/review"
    description: "Record a content review, restarting the readiness decay curve."
    roles: [CommsLead]
    code: 200
    input: [reviewer_notes]
    output: PreparedMaterial
    side_effects:
      - "last_reviewed_at = current_utc; readiness_score recomputed via material_readiness_score"
      - "readiness_state -> READY when readiness_score >= 60.00, otherwise STALE"

  # ---- MediaInterview --------------------------------------------------------
  - method: POST
    path: "/crisis/media-interviews"
    description: >-
      Book a media interview for a designated spokesperson on a monitored channel. Enforces the
      closed-interval booking window plus the 30-minute preparation buffer against that member's
      other SCHEDULED or CONFIRMED interviews.
    roles: [CommsLead]
    code: 201
    input: ["incident_id", "spokesperson_member_id", "channel_id", "outlet_name", "scheduled_start_at", "scheduled_end_at", "anticipated_question_count?"]
    output: MediaInterview
    side_effects:
      - "state = SCHEDULED; duration_minutes derived from the interval"
      - "TeamMember.scheduled_interview_minutes unchanged — that ledger tracks CONFIRMED load only; a SCHEDULED interval still occupies the spokesperson calendar for overlap checks"
  - method: GET
    path: "/crisis/media-interviews/{interview_id}"
    description: "Read one media interview with its preparation counters."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: MediaInterview
    side_effects: []
  - method: GET
    path: "/crisis/media-interviews"
    description: "List media interviews filtered by incident, spokesperson, channel or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "spokesperson_member_id?", "channel_id?", "state?", "limit?", "offset?"]
    output: MediaInterview[]
    side_effects: []
  - method: POST
    path: "/crisis/media-interviews/{interview_id}/confirm"
    description: >-
      Confirm the booking once the question pack is prepared. Requires the spokesperson's media
      training current at the confirmation instant and the anticipated-question pack complete.
    roles: [CommsLead]
    code: 200
    input: [high_risk_answers_approved_count]
    output: MediaInterview
    side_effects: ["state SCHEDULED -> CONFIRMED; confirmed_at = current_utc", "Incident.confirmed_interview_count recomputed"]
  - method: POST
    path: "/crisis/media-interviews/{interview_id}/cancel"
    description: "Cancel an interview and release the spokesperson's reserved minutes."
    roles: [CommsLead, Spokesperson]
    code: 200
    input: [cancel_reason]
    output: MediaInterview
    side_effects:
      - "state -> CANCELLED; cancel_reason = body.cancel_reason"
      - "TeamMember.scheduled_interview_minutes recomputed — it decreases by exactly duration_minutes when cancelling from CONFIRMED and is unchanged when cancelling from SCHEDULED"
      - "Incident.confirmed_interview_count recomputed"

  # ---- MisinformationClaim ---------------------------------------------------
  - method: POST
    path: "/crisis/misinformation-claims"
    description: "Log a misinformation claim spotted by social listening on a monitored channel."
    roles: [SocialListener]
    code: 201
    input: [incident_id, channel_id, claim_text, virality_score]
    output: MisinformationClaim
    side_effects: ["state = DETECTED", "Incident.open_claim_count recomputed"]
  - method: GET
    path: "/crisis/misinformation-claims/{claim_id}"
    description: "Read one misinformation claim with its correction window and branch."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: MisinformationClaim
    side_effects: []
  - method: GET
    path: "/crisis/misinformation-claims"
    description: "List misinformation claims filtered by incident, channel, correction statement or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "channel_id?", "correction_statement_id?", "state?", "limit?", "offset?"]
    output: MisinformationClaim[]
    side_effects: []
  - method: POST
    path: "/crisis/misinformation-claims/{claim_id}/triage"
    description: >-
      Triage a detected claim so it can fork to either the platform-escalation or the correction branch.
      Re-scores the incident's containment priority because the claim's virality now counts as exposure.
    roles: [SocialListener]
    code: 200
    input: []
    output: MisinformationClaim
    side_effects:
      - "state DETECTED -> TRIAGED"
      - "Incident.open_claim_count recomputed"
      - "Incident.base_containment_score / amplification_rate_applied / containment_priority_score recomputed"
      - "increments Incident.version by 1"
  - method: POST
    path: "/crisis/misinformation-claims/{claim_id}/escalate-platform"
    description: >-
      Take the platform branch: escalate to the channel's verified trust-and-safety path. Requires
      escalation_path_state VERIFIED and virality_score at or above the escalation threshold.
    roles: [SocialListener, CommsLead]
    code: 200
    input: []
    output: MisinformationClaim
    side_effects: ["state TRIAGED -> PLATFORM_ESCALATED; resolution_branch = PLATFORM", "MonitoredChannel.open_escalation_count += 1"]
  - method: POST
    path: "/crisis/misinformation-claims/{claim_id}/issue-correction"
    description: >-
      Take the correction branch by binding a PUBLISHED CORRECTION statement. Optimistic concurrency:
      the caller must pass the MonitoredChannel.version it last read; a stale value is rejected with
      ERR_STALE_CHANNEL_VERSION (412).
    roles: [CommsLead]
    code: 200
    input: [correction_statement_id, correction_window_start, correction_window_end, expected_channel_version]
    output: MisinformationClaim
    side_effects:
      - "state TRIAGED -> CORRECTION_ISSUED; correction_window_minutes = floor((end - start) / 60 seconds)"
      - "MonitoredChannel.reserved_correction_minutes increased by correction_window_minutes"
      - "increments MonitoredChannel.version by 1"
  - method: POST
    path: "/crisis/misinformation-claims/{claim_id}/close"
    description: >-
      Join both branches into CLOSED. The recorded side effects diverge by resolution_branch: the
      platform branch requires takedown confirmation and releases the escalation slot, the correction
      branch releases the channel's reserved window minutes.
    roles: [SocialListener, CommsLead]
    code: 200
    input: [outcome_note]
    output: MisinformationClaim
    side_effects:
      - "state PLATFORM_ESCALATED or CORRECTION_ISSUED -> CLOSED"
      - "PLATFORM branch: takedown_confirmed = true, corrected stays false, and MonitoredChannel.open_escalation_count recomputed"
      - "CORRECTION branch: corrected = true, takedown_confirmed stays false, and MonitoredChannel.reserved_correction_minutes decreased by exactly correction_window_minutes"
      - "Incident.open_claim_count recomputed"

  # ---- PostCrisisReview ------------------------------------------------------
  - method: GET
    path: "/crisis/post-crisis-reviews/{review_id}"
    description: "Read one post-crisis review with both reputation-delta variants."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: []
    output: PostCrisisReview
    side_effects: []
  - method: GET
    path: "/crisis/post-crisis-reviews"
    description: "List post-crisis reviews filtered by incident or state."
    roles: [ProgramAdmin, IncidentLead, LegalCounsel, CommsLead, Spokesperson, SocialListener, ExecSponsor]
    code: 200
    input: ["incident_id?", "state?", "limit?", "offset?"]
    output: PostCrisisReview[]
    side_effects: []
  - method: POST
    path: "/crisis/post-crisis-reviews/{review_id}/score"
    description: >-
      Score the review, selecting the reputation-delta variant. Both variants are always stored;
      scoring_method decides which one is reported.
    roles: [ExecSponsor]
    code: 200
    input: [scoring_method, playbook_update_count]
    output: PostCrisisReview
    side_effects:
      - "state OPEN -> SCORED; scored_at = current_utc"
      - "reputation_delta_raw and reputation_delta_adjusted both computed via reputation_delta"
      - "reported_delta = the variant named by scoring_method; Incident.reputation_delta_reported mirrored"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / schema ---------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header missing or empty"
    applies_to: ["all endpoints"]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "caller's role is not listed in the endpoint's roles, or the caller is not the specific member the operation is bound to (assignment holder, task assignee)"
    applies_to: ["all endpoints"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required body field, unknown enum value, wrong scalar type, out-of-range number, or malformed datetime"
    applies_to: ["all endpoints with a request body or query parameters"]
  # ---- existence -------------------------------------------------------------
  - id: ERR_TEAM_MEMBER_NOT_FOUND
    http_status: 404
    condition: "member_id / spokesperson_member_id / assignee_member_id does not resolve to a TeamMember"
    applies_to: ["GET /crisis/team-members/{member_id}", "POST /crisis/team-assignments", "POST /crisis/media-interviews"]
  - id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    condition: "channel_id does not resolve to a MonitoredChannel"
    applies_to: ["GET /crisis/monitored-channels/{channel_id}", "POST /crisis/monitored-channels/{channel_id}/verify-escalation-path", "POST /crisis/issue-signals", "POST /crisis/media-interviews", "POST /crisis/misinformation-claims"]
  - id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    condition: "incident_id does not resolve to an Incident"
    applies_to: ["GET /crisis/incidents/{incident_id}", "POST /crisis/incidents/{incident_id}/activate", "POST /crisis/incidents/{incident_id}/assert-privilege", "POST /crisis/incidents/{incident_id}/waive-privilege", "POST /crisis/incidents/{incident_id}/resolve", "POST /crisis/incidents/{incident_id}/sla-sweep", "POST /crisis/team-assignments", "POST /crisis/statements", "POST /crisis/stakeholder-notices", "POST /crisis/media-interviews", "POST /crisis/misinformation-claims", "POST /crisis/issue-signals/{signal_id}/link"]
  - id: ERR_SIGNAL_NOT_FOUND
    http_status: 404
    condition: "signal_id does not resolve to an IssueSignal"
    applies_to: ["GET /crisis/issue-signals/{signal_id}", "POST /crisis/issue-signals/{signal_id}/link", "POST /crisis/issue-signals/{signal_id}/escalate"]
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "assignment_id does not resolve to a TeamAssignment"
    applies_to: ["GET /crisis/team-assignments/{assignment_id}", "POST /crisis/team-assignments/{assignment_id}/acknowledge"]
  - id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    condition: "statement_id / supersedes_statement_id / correction_statement_id does not resolve to a Statement"
    applies_to: ["GET /crisis/statements/{statement_id}", "POST /crisis/statements", "POST /crisis/statements/{statement_id}/submit-review", "POST /crisis/statements/{statement_id}/revise", "POST /crisis/statements/{statement_id}/publish", "POST /crisis/statements/{statement_id}/withdraw", "POST /crisis/stakeholder-notices", "POST /crisis/misinformation-claims/{claim_id}/issue-correction"]
  - id: ERR_APPROVAL_TASK_NOT_FOUND
    http_status: 404
    condition: "task_id does not resolve to an ApprovalTask"
    applies_to: ["GET /crisis/approval-tasks/{task_id}", "POST /crisis/approval-tasks/{task_id}/decide"]
  - id: ERR_NOTICE_NOT_FOUND
    http_status: 404
    condition: "notice_id does not resolve to a StakeholderNotice"
    applies_to: ["GET /crisis/stakeholder-notices/{notice_id}", "POST /crisis/stakeholder-notices/{notice_id}/release", "POST /crisis/stakeholder-notices/{notice_id}/cancel"]
  - id: ERR_MATERIAL_NOT_FOUND
    http_status: 404
    condition: "material_id does not resolve to a PreparedMaterial"
    applies_to: ["GET /crisis/prepared-materials/{material_id}", "POST /crisis/prepared-materials/{material_id}/review"]
  - id: ERR_INTERVIEW_NOT_FOUND
    http_status: 404
    condition: "interview_id does not resolve to a MediaInterview"
    applies_to: ["GET /crisis/media-interviews/{interview_id}", "POST /crisis/media-interviews/{interview_id}/confirm", "POST /crisis/media-interviews/{interview_id}/cancel"]
  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "claim_id does not resolve to a MisinformationClaim"
    applies_to: ["GET /crisis/misinformation-claims/{claim_id}", "POST /crisis/misinformation-claims/{claim_id}/triage", "POST /crisis/misinformation-claims/{claim_id}/escalate-platform", "POST /crisis/misinformation-claims/{claim_id}/issue-correction", "POST /crisis/misinformation-claims/{claim_id}/close"]
  - id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    condition: "review_id does not resolve to a PostCrisisReview"
    applies_to: ["GET /crisis/post-crisis-reviews/{review_id}", "POST /crisis/post-crisis-reviews/{review_id}/score"]
  # ---- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_INCIDENT_VERSION
    http_status: 412
    condition: "expected_incident_version does not equal the Incident's current version"
    applies_to: ["POST /crisis/statements"]
  - id: ERR_STALE_CHANNEL_VERSION
    http_status: 412
    condition: "expected_channel_version does not equal the MonitoredChannel's current version"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/issue-correction"]
  # ---- state -----------------------------------------------------------------
  - id: ERR_INVALID_SIGNAL_STATE
    http_status: 409
    condition: "IssueSignal is not in the state the trigger requires (link needs OPEN, escalate needs LINKED)"
    applies_to: ["POST /crisis/issue-signals/{signal_id}/link", "POST /crisis/issue-signals/{signal_id}/escalate"]
  - id: ERR_INCIDENT_NOT_ACTIVATED
    http_status: 409
    condition: "Incident.response_state is MONITORING but the operation requires ACTIVATED"
    applies_to: ["POST /crisis/statements", "POST /crisis/stakeholder-notices", "POST /crisis/media-interviews", "POST /crisis/misinformation-claims", "POST /crisis/incidents/{incident_id}/resolve"]
  - id: ERR_INCIDENT_ALREADY_RESOLVED
    http_status: 409
    condition: "Incident.response_state is RESOLVED and no further response work may be recorded"
    applies_to: ["POST /crisis/incidents/{incident_id}/activate", "POST /crisis/incidents/{incident_id}/resolve", "POST /crisis/statements", "POST /crisis/stakeholder-notices", "POST /crisis/media-interviews", "POST /crisis/misinformation-claims", "POST /crisis/issue-signals/{signal_id}/link", "POST /crisis/issue-signals/{signal_id}/escalate"]
  - id: ERR_COMMS_POSTURE_FROZEN
    http_status: 409
    condition: "Incident.comms_posture is FROZEN, which blocks every outbound communication write"
    applies_to: ["POST /crisis/statements", "POST /crisis/statements/{statement_id}/submit-review", "POST /crisis/statements/{statement_id}/publish", "POST /crisis/stakeholder-notices/{notice_id}/release", "POST /crisis/media-interviews/{interview_id}/confirm"]
  - id: ERR_STATEMENT_NOT_IN_REVIEW
    http_status: 409
    condition: "the statement carrying the approval task is not IN_REVIEW"
    applies_to: ["POST /crisis/approval-tasks/{task_id}/decide"]
  - id: ERR_STATEMENT_STATE_INVALID
    http_status: 409
    condition: "Statement is not in a state the trigger allows (submit-review needs DRAFT or REVISION_REQUESTED, revise needs REVISION_REQUESTED, publish needs APPROVED, withdraw needs DRAFT, IN_REVIEW, REVISION_REQUESTED or APPROVED)"
    applies_to: ["POST /crisis/statements/{statement_id}/submit-review", "POST /crisis/statements/{statement_id}/revise", "POST /crisis/statements/{statement_id}/publish", "POST /crisis/statements/{statement_id}/withdraw"]
  - id: ERR_APPROVAL_TASK_NOT_PENDING
    http_status: 409
    condition: "ApprovalTask is already APPROVED, REJECTED, VOIDED or EXPIRED"
    applies_to: ["POST /crisis/approval-tasks/{task_id}/decide"]
  - id: ERR_ASSIGNMENT_NOT_ACKNOWLEDGED
    http_status: 409
    condition: "the crisis-team seat the operation depends on does not exist in state ACKNOWLEDGED (INCIDENT_LEAD for activation, LEGAL_COUNSEL for SEV1 activation and for privilege assertion by the acting member)"
    applies_to: ["POST /crisis/incidents/{incident_id}/activate", "POST /crisis/incidents/{incident_id}/assert-privilege"]
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    condition: "TeamAssignment is not ASSIGNED when acknowledge is triggered"
    applies_to: ["POST /crisis/team-assignments/{assignment_id}/acknowledge"]
  - id: ERR_NOTICE_STATE_INVALID
    http_status: 409
    condition: "StakeholderNotice is not in a state the trigger allows (release needs QUEUED, cancel needs QUEUED or BLOCKED)"
    applies_to: ["POST /crisis/stakeholder-notices/{notice_id}/release", "POST /crisis/stakeholder-notices/{notice_id}/cancel"]
  - id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    condition: "MisinformationClaim is not in a state the trigger allows (triage needs DETECTED, escalate-platform and issue-correction need TRIAGED, close needs PLATFORM_ESCALATED or CORRECTION_ISSUED)"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/triage", "POST /crisis/misinformation-claims/{claim_id}/escalate-platform", "POST /crisis/misinformation-claims/{claim_id}/issue-correction", "POST /crisis/misinformation-claims/{claim_id}/close"]
  - id: ERR_INTERVIEW_STATE_INVALID
    http_status: 409
    condition: "MediaInterview is not SCHEDULED when confirm or cancel is triggered on a terminal booking"
    applies_to: ["POST /crisis/media-interviews/{interview_id}/confirm", "POST /crisis/media-interviews/{interview_id}/cancel"]
  - id: ERR_MATERIAL_STATE_INVALID
    http_status: 409
    condition: "PreparedMaterial cannot be reviewed in its current readiness_state"
    applies_to: ["POST /crisis/prepared-materials/{material_id}/review"]
  - id: ERR_REVIEW_STATE_INVALID
    http_status: 409
    condition: "PostCrisisReview is already SCORED"
    applies_to: ["POST /crisis/post-crisis-reviews/{review_id}/score"]
  # ---- business safety / authority / privilege -------------------------------
  - id: ERR_PRIVILEGE_NOT_CLEARED
    http_status: 403
    condition: "the operation touches privileged material (assert/waive privilege, or a privilege_marked statement) and the acting TeamMember has privilege_cleared false"
    applies_to: ["POST /crisis/incidents/{incident_id}/assert-privilege", "POST /crisis/incidents/{incident_id}/waive-privilege", "POST /crisis/approval-tasks/{task_id}/decide", "POST /crisis/statements/{statement_id}/publish", "POST /crisis/misinformation-claims/{claim_id}/issue-correction"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the acting member drafted the statement and is also the assignee of the approval task being decided"
    applies_to: ["POST /crisis/approval-tasks/{task_id}/decide"]
  - id: ERR_APPROVER_UNAVAILABLE
    http_status: 409
    condition: "the statement's quorum cannot be filled because fewer ACKNOWLEDGED seats with the required decision_authority exist than quorum_required"
    applies_to: ["POST /crisis/statements/{statement_id}/submit-review"]
  - id: ERR_DUPLICATE_ASSIGNMENT_ROLE
    http_status: 409
    condition: "an ASSIGNED or ACKNOWLEDGED TeamAssignment for the same incident and team_role already exists"
    applies_to: ["POST /crisis/team-assignments"]
  # ---- business referential --------------------------------------------------
  - id: ERR_STATEMENT_NOT_PUBLISHED
    http_status: 409
    condition: "the statement carried by the notice is not PUBLISHED"
    applies_to: ["POST /crisis/stakeholder-notices/{notice_id}/release"]
  - id: ERR_CORRECTION_STATEMENT_REQUIRED
    http_status: 409
    condition: "correction_statement_id does not point to a PUBLISHED statement of statement_type CORRECTION belonging to the claim's incident"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/issue-correction"]
  - id: ERR_NO_ESCALATED_SIGNAL
    http_status: 422
    condition: "the incident has no ESCALATED IssueSignal, so no provisional severity tier can be derived at activation"
    applies_to: ["POST /crisis/incidents/{incident_id}/activate"]
  - id: ERR_ESCALATION_PATH_UNVERIFIED
    http_status: 422
    condition: "MonitoredChannel.escalation_path_state is UNVERIFIED"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/escalate-platform"]
  - id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    condition: "spokesperson's media_training_status is not CURRENT, or media_training_expires_at is at or before current_utc"
    applies_to: ["POST /crisis/media-interviews/{interview_id}/confirm"]
  # ---- business temporal -----------------------------------------------------
  - id: ERR_REVIEW_DEADLINE_PASSED
    http_status: 409
    condition: "current_utc is at or after Statement.review_deadline_at"
    applies_to: ["POST /crisis/approval-tasks/{task_id}/decide"]
  - id: ERR_EMBARGO_NOT_REACHED
    http_status: 409
    condition: "StakeholderNotice.embargo_until is strictly after current_utc"
    applies_to: ["POST /crisis/stakeholder-notices/{notice_id}/release"]
  # ---- business constraint ---------------------------------------------------
  - id: ERR_SPOKESPERSON_DOUBLE_BOOKED
    http_status: 409
    condition: "the requested closed interval, widened by the 30-minute preparation buffer, overlaps another SCHEDULED or CONFIRMED interview of the same spokesperson"
    applies_to: ["POST /crisis/media-interviews"]
  - id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http_status: 422
    condition: "IssueSignal.escalation_score is strictly below 70.00"
    applies_to: ["POST /crisis/issue-signals/{signal_id}/escalate"]
  - id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    condition: "Statement.revision_locked is true (revision_round has reached 3)"
    applies_to: ["POST /crisis/statements/{statement_id}/revise", "POST /crisis/statements/{statement_id}/submit-review"]
  - id: ERR_NOTICE_SEQUENCE_VIOLATION
    http_status: 409
    condition: "a StakeholderNotice with a strictly lower sequence_rank for the same incident is still QUEUED or BLOCKED and no priority override was requested"
    applies_to: ["POST /crisis/stakeholder-notices/{notice_id}/release"]
  - id: ERR_QUESTION_PACK_INCOMPLETE
    http_status: 422
    condition: "high_risk_answers_approved_count is strictly below the anticipated_question_count required coverage floor"
    applies_to: ["POST /crisis/media-interviews/{interview_id}/confirm"]
  - id: ERR_VIRALITY_THRESHOLD_NOT_MET
    http_status: 422
    condition: "MisinformationClaim.virality_score is strictly below the platform-escalation threshold"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/escalate-platform"]
  - id: ERR_OPEN_NOTICES_BLOCK_RESOLUTION
    http_status: 409
    condition: "the incident still has QUEUED or BLOCKED StakeholderNotices"
    applies_to: ["POST /crisis/incidents/{incident_id}/resolve"]
  - id: ERR_OPEN_CLAIMS_BLOCK_RESOLUTION
    http_status: 409
    condition: "the incident still has MisinformationClaims outside CLOSED"
    applies_to: ["POST /crisis/incidents/{incident_id}/resolve"]
  # ---- business fiscal / capacity --------------------------------------------
  - id: ERR_CHANNEL_CORRECTION_CAPACITY
    http_status: 409
    condition: "the count of CORRECTION_ISSUED claims on the same channel whose half-open window overlaps the requested window is not strictly less than channel.max_concurrent_corrections"
    applies_to: ["POST /crisis/misinformation-claims/{claim_id}/issue-correction"]

# =============================================================================
# 1.7 RBAC Permission Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: >-
      Communications program administrator. Owns the static registries (roster, monitored channels,
      prepared-material library) and the logical clock; never drafts, approves or publishes content.
    identity: opaque
    exclusive_operations:
      - "POST /crisis/team-members"
      - "POST /crisis/monitored-channels"
      - "POST /crisis/monitored-channels/{channel_id}/verify-escalation-path"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /crisis/prepared-materials"
      - "POST /crisis/issue-signals"
      - "POST /crisis/incidents/{incident_id}/sla-sweep"
      - "all GET endpoints under /crisis"
  - name: IncidentLead
    description: >-
      Crisis team incident lead. Opens incidents, seats the team, activates and resolves the response.
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /crisis/incidents"
      - "POST /crisis/incidents/{incident_id}/activate"
      - "POST /crisis/incidents/{incident_id}/resolve"
      - "POST /crisis/team-assignments"
    shared_operations:
      - "POST /crisis/issue-signals/{signal_id}/link"
      - "POST /crisis/issue-signals/{signal_id}/escalate"
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "POST /crisis/approval-tasks/{task_id}/decide"
      - "POST /crisis/incidents/{incident_id}/sla-sweep"
      - "all GET endpoints under /crisis"
  - name: LegalCounsel
    description: >-
      In-house counsel. Sole holder of privilege authority; may withdraw content on legal grounds and
      may sit as a veto seat in approval routing, but may never draft or publish.
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /crisis/incidents/{incident_id}/assert-privilege"
      - "POST /crisis/incidents/{incident_id}/waive-privilege"
    shared_operations:
      - "POST /crisis/statements/{statement_id}/withdraw"
      - "POST /crisis/stakeholder-notices/{notice_id}/release"
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "POST /crisis/approval-tasks/{task_id}/decide"
      - "all GET endpoints under /crisis"
  - name: CommsLead
    description: >-
      Communications lead. Owns message development, approval routing, audience sequencing, interview
      booking and correction publication.
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /crisis/statements"
      - "POST /crisis/statements/{statement_id}/submit-review"
      - "POST /crisis/statements/{statement_id}/revise"
      - "POST /crisis/statements/{statement_id}/publish"
      - "POST /crisis/stakeholder-notices"
      - "POST /crisis/stakeholder-notices/{notice_id}/cancel"
      - "POST /crisis/prepared-materials/{material_id}/review"
      - "POST /crisis/media-interviews"
      - "POST /crisis/media-interviews/{interview_id}/confirm"
      - "POST /crisis/misinformation-claims/{claim_id}/issue-correction"
    shared_operations:
      - "POST /crisis/statements/{statement_id}/withdraw"
      - "POST /crisis/stakeholder-notices/{notice_id}/release"
      - "POST /crisis/prepared-materials"
      - "POST /crisis/media-interviews/{interview_id}/cancel"
      - "POST /crisis/misinformation-claims/{claim_id}/escalate-platform"
      - "POST /crisis/misinformation-claims/{claim_id}/close"
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "POST /crisis/approval-tasks/{task_id}/decide"
      - "POST /crisis/incidents/{incident_id}/sla-sweep"
      - "all GET endpoints under /crisis"
  - name: Spokesperson
    description: >-
      Designated spokesperson. Fronts interviews and may stand down a booking, but holds no drafting,
      approval or release authority.
    identity: "entity_backed:TeamMember"
    exclusive_operations: []
    shared_operations:
      - "POST /crisis/media-interviews/{interview_id}/cancel"
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "all GET endpoints under /crisis"
  - name: SocialListener
    description: >-
      Social listening analyst. Records signals and misinformation claims, triages correction windows
      and drives platform escalation; cannot author or publish statements.
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /crisis/misinformation-claims"
      - "POST /crisis/misinformation-claims/{claim_id}/triage"
    shared_operations:
      - "POST /crisis/issue-signals"
      - "POST /crisis/issue-signals/{signal_id}/link"
      - "POST /crisis/issue-signals/{signal_id}/escalate"
      - "POST /crisis/misinformation-claims/{claim_id}/escalate-platform"
      - "POST /crisis/misinformation-claims/{claim_id}/close"
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "all GET endpoints under /crisis"
  - name: ExecSponsor
    description: >-
      Executive sponsor. Provides the highest decision authority in approval routing and is the only
      role that may close out the post-crisis assessment.
    identity: "entity_backed:TeamMember"
    exclusive_operations:
      - "POST /crisis/post-crisis-reviews/{review_id}/score"
    shared_operations:
      - "POST /crisis/team-assignments/{assignment_id}/acknowledge"
      - "POST /crisis/approval-tasks/{task_id}/decide"
      - "all GET endpoints under /crisis"
