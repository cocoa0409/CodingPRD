            - "the SECLUSION bed 522-A is HTTP 409 with ${seclusion_bed_err} == \"ERR_BED_NOT_ELIGIBLE\" (bed_type outside SELECTABLE_BED_TYPES)"
            - "the OUT_OF_SERVICE bed 523-A is HTTP 409 with ${oos_bed_err} == \"ERR_BED_NOT_ELIGIBLE\" (status is not AVAILABLE)"
            - "the bed belonging to Ward 31 is HTTP 409 with ${foreign_bed_err} == \"ERR_BED_NOT_ELIGIBLE\" (the bed does not belong to the requested unit)"
            - "the bed_id-omitted attempt with a valid RESTRICTED-posture override from a psychiatrist clears priority 48 and then fails at priority 49: HTTP 409 with ${no_bed_err} == \"ERR_NO_ELIGIBLE_BED\", because the only AVAILABLE placement bed is STANDARD and the admission is HIGH acuity"
            - "after bed 524-A LIGATURE_RESISTANT_OBSERVATION is added, licensed_placement_bed_count == 2 and raw_available_bed_count == 2, so posture == \"OPEN\" and effective_available_bed_count == 2, and the selector picks ${b_e4}: HTTP 200 with Admission.${a_be}.bed_id == ${b_e4} and placement_status == \"PLACED\""
