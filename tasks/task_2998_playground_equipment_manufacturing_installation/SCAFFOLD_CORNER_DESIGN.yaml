      - name: standard_activate_blocked_while_another_edition_is_active
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=45]
          - errors.ERR_ACTIVE_STANDARD_EXISTS
          - state_machines.PlaygroundStandard.transitions[DRAFT->ACTIVE]
        distinguishing_aspect: "With ASTM_F1487/2024 already ACTIVE, activating the DRAFT 2027 edition is refused with ERR_ACTIVE_STANDARD_EXISTS (409) and the 2027 edition stays DRAFT, so 'the ACTIVE standard' remains a singleton selector."
        test_recipe:
          setup:
            - "PlaygroundStandard ASTM_F1487/2024 ACTIVE and PlaygroundStandard ASTM_F1487/2027 still DRAFT."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
