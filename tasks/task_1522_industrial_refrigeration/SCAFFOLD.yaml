# =============================================================================
# SCAFFOLD.yaml — Industrial Refrigeration (Ammonia) Service & PSM
# §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Industrial Refrigeration (Ammonia) Service & PSM: process safety information
  & P&ID currency, mechanical integrity inspection schedule, refrigerant charge
  inventory & threshold reporting, operator training & emergency response drill,
  incident/near-miss & compliance audit cycle, contractor qualification & hot
  work, energy optimization & floating head pressure, leak detection &
  regulatory notification

domain_name: industrial-refrigeration-psm
api_prefix: /psm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK links, no URL nesting)
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: threshold_lbs, type: number, source: input, default: 10000.0, description: "PSM/RMP ammonia threshold quantity in lbs; applicability trips at >= this value" }
      - { name: total_charge_lbs, type: number, source: computed, default: 0.0, description: "Book-inventory rollup of POSTED ChargeAdjustment ledger entries (calculations.facility_charge_rollup, book variant)" }
      - { name: charge_posture, type: enum, source: computed, description: "BELOW_THRESHOLD | AT_OR_ABOVE_THRESHOLD — AT_OR_ABOVE iff total_charge_lbs >= threshold_lbs" }
      - { name: psm_program_status, type: enum, source: system, description: "NOT_REQUIRED | REQUIRED — flips to REQUIRED on first threshold crossing; sticky (never auto-reverts)" }
      - { name: overdue_inspection_count, type: integer, source: computed, default: 0, description: "Count of Inspections with status == OVERDUE whose equipment belongs to systems of this facility" }
      - { name: open_incident_count, type: integer, source: computed, default: 0, description: "Count of Incidents of this facility with status IN {REPORTED, UNDER_INVESTIGATION, ACTIONS_ASSIGNED, REOPENED}" }
      - { name: expired_training_count, type: integer, source: computed, default: 0, description: "Count of TrainingRecords of ACTIVE employees of this facility whose currency is EXPIRED (now >= expires_at)" }
      - { name: posture_score, type: integer, source: computed, default: 0, description: "5*overdue_inspection_count + 3*open_incident_count + 2*expired_training_count (calculations.compliance_posture_score)" }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT (score == 0) | DEGRADED (1..9) | NONCOMPLIANT (score >= 10)" }

  - name: RefrigerationSystem
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "System name (e.g. 'Engine Room 1')" }
      - { name: design_charge_lbs, type: number, source: input, description: "Nameplate design charge in lbs; ungauged IN_SERVICE systems contribute this to the gauge variant" }
      - { name: condenser_approach_f, type: number, source: input, default: 15.0, description: "Design condenser approach temperature (F) used by floating head pressure calc" }
      - { name: min_head_psig, type: number, source: input, default: 150.0, description: "Minimum safe condensing (head) pressure, psig" }
      - { name: max_head_psig, type: number, source: input, default: 185.0, description: "Maximum allowable head pressure target, psig" }
      - { name: float_head_enabled, type: boolean, source: input, default: true, description: "Whether floating head pressure control is enabled; false yields fixed design target" }
      - { name: last_gauge_reading_lbs, type: number, source: system, description: "Latest physical gauge reading in lbs; null until first gauge reading posted" }
      - { name: last_gauge_reading_at, type: datetime, source: system, description: "Timestamp of latest gauge reading; null until first reading" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE | DECOMMISSIONED" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerationSystem.id" }
      - { name: tag_number, type: string, source: input, description: "Asset tag (e.g. 'V-101'); unique per system" }
      - { name: equipment_type, type: enum, source: input, description: "VESSEL | COMPRESSOR | PIPING_CIRCUIT | PRV" }
      - { name: inspection_interval_days, type: integer, source: input, description: "Base mechanical-integrity interval in days (> 0)" }
      - { name: inspection_method, type: enum, source: input, description: "FIXED | CONDITION_BASED — selects calculations.inspection_due_date variant" }
      - { name: last_completed_at, type: datetime, source: system, description: "Completion timestamp of most recent COMPLETED inspection; null if none" }
      - { name: last_result, type: enum, source: system, description: "PASS | FAIL; result of most recent COMPLETED inspection; null if none" }
      - { name: next_due_at, type: datetime, source: system, description: "Computed per calculations.inspection_due_date variant; null until first inspection completes" }
      - { name: integrity_status, type: enum, source: computed, description: "CURRENT | DUE_SOON | OVERDUE | FAILED — FAILED if last_result == FAIL; else OVERDUE if a linked Inspection is OVERDUE or (next_due_at != null and now > next_due_at); else DUE_SOON if next_due_at - now <= 30 days; else CURRENT" }

  - name: PsidDocument
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerationSystem.id" }
      - { name: doc_type, type: enum, source: input, description: "PID | PSV_CALC | RELIEF_DESIGN" }
      - { name: revision_label, type: string, source: input, description: "Human revision tag (e.g. 'Rev C')" }
      - { name: content_uri, type: string, source: input, description: "Locator for the controlled document content" }
      - { name: status, type: enum, source: system, description: "CURRENT | UNDER_REVIEW | SUPERSEDED — creation issues directly as CURRENT and supersedes the prior CURRENT doc for (system_id, doc_type)" }
      - { name: last_reaffirmed_at, type: datetime, source: system, description: "Stamped by reaffirm transition; null until first reaffirm" }

  - name: ChargeAdjustment
    parent: null
    common_fields: false  # append-only ledger event: id + created_at only; corrections are compensating entries, never edits
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerationSystem.id; optional attribution of the charge change to one system; must belong to facility_id when present", constraints: "optional" }
      - { name: adjustment_type, type: enum, source: input, description: "ADD | REMOVE" }
      - { name: quantity_lbs, type: number, source: input, description: "Requested quantity in lbs; must be > 0" }
      - { name: rounded_lbs, type: number, source: computed, description: "quantity_lbs rounded to 0.1 lb, round_half_up, stamped at posting; the ledger stores and sums rounded_lbs (per-line rounding order pinned)" }
      - { name: reason, type: string, source: input, description: "Free-text justification (e.g. 'charging after pump-out', 'level correction')" }
      - { name: posted_by_employee_id, type: string, source: system, description: "FK -> Employee.id; set from X-User-ID of the acting Operator" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id" }
      - { name: due_at, type: datetime, source: input, description: "Scheduled due timestamp for this inspection" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OVERDUE | COMPLETED — OVERDUE set by checkpoint when due_at < now" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL; recorded at completion; null until completed" }
      - { name: findings, type: string, source: input, description: "Inspector notes recorded at completion", constraints: "optional" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock timestamp at completion; null until completed" }
      - { name: completed_late, type: boolean, source: computed, default: false, description: "True iff the inspection was in OVERDUE status when completed" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: employment_status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | INACTIVE" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: topic, type: enum, source: input, description: "PSM_OVERVIEW | AMMONIA_OPERATOR | EMERGENCY_RESPONSE" }
      - { name: completed_at, type: datetime, source: input, description: "When the training was completed" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + 1095 days (3-year refresher cycle)" }
      - { name: currency, type: enum, source: computed, description: "EXPIRED if now >= expires_at; EXPIRING_SOON if expires_at - now <= 90 days; else CURRENT" }

  - name: DrillEvent
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: drill_type, type: enum, source: input, description: "TABLETOP | FIELD | EVACUATION" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned start (inclusive)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned end (inclusive); must be > scheduled_start_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | CONDUCTED" }
      - { name: attendee_employee_ids, type: array, source: system, description: "Employee ids recorded at conduct; null until conducted" }
      - { name: conducted_at, type: datetime, source: system, description: "Logical clock timestamp at conduct; null until conducted" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; optional involved equipment; equipment's system must belong to facility_id", constraints: "optional" }
      - { name: severity, type: enum, source: input, description: "NEAR_MISS | RECORDABLE | REPORTABLE; auto-created leak incidents derive severity from final_release_lbs (>= 100 -> REPORTABLE, else RECORDABLE)" }
      - { name: description, type: string, source: input, description: "What happened" }
      - { name: reported_by_employee_id, type: string, source: input, description: "FK -> Employee.id; ACTIVE employee of the facility; when actor role is Operator it MUST equal X-User-ID; null only for system-created leak incidents", constraints: "nullable for system-created" }
      - { name: investigator_employee_id, type: string, source: system, description: "FK -> Employee.id; assigned investigator; MUST differ from reported_by_employee_id (segregation of duties); null until assigned" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | ACTIONS_ASSIGNED | CLOSED | REOPENED" }
      - { name: pending_action_count, type: integer, source: computed, default: 0, description: "Count of CorrectiveActions of this incident with status != VERIFIED" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of CLOSED -> REOPENED cycles" }
      - { name: source_leak_event_id, type: string, source: system, description: "FK -> LeakEvent.id; set only on auto-created leak incidents; null otherwise", constraints: "nullable" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: description, type: string, source: input, description: "Action to perform" }
      - { name: assignee_employee_id, type: string, source: input, description: "FK -> Employee.id; ACTIVE employee of the incident's facility" }
      - { name: due_at, type: datetime, source: input, description: "Action due timestamp" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | VERIFIED — COMPLETED may be rejected back to OPEN" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned audit start" }
      - { name: due_at, type: datetime, source: input, description: "Regulatory due timestamp; auto-created threshold audits set due_at = crossing_at + 1095 days" }
      - { name: lead_auditor, type: string, source: input, description: "Name of lead auditor" }
      - { name: origin, type: enum, source: system, default: "MANUAL", description: "MANUAL | AUTO_THRESHOLD — AUTO_THRESHOLD when created by the charge-threshold cascade" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | CLOSED" }
      - { name: findings_count, type: integer, source: input, description: "Findings recorded at close; required on close", constraints: "set on close" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor company name" }
      - { name: safety_score, type: integer, source: input, description: "Qualification safety score 0..100" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING | QUALIFIED | SUSPENDED | EXPIRED" }
      - { name: qualified_until, type: datetime, source: system, description: "Qualification expiry timestamp set by qualify; null until first qualification" }

  - name: HotWorkPermit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerationSystem.id; must belong to facility_id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; when actor role is ContractorRep it MUST equal X-User-ID" }
      - { name: work_description, type: string, source: input, description: "Scope of hot work" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive); must be < valid_until" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (exclusive); half-open interval [valid_from, valid_until)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | IN_PROGRESS | SUSPENDED | CLOSED | VOIDED | EXPIRED" }

  - name: LeakEvent
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerationSystem.id" }
      - { name: estimated_release_lbs, type: number, source: input, description: "Initial estimate in lbs (> 0)" }
      - { name: source_description, type: string, source: input, description: "Where the leak was detected" }
      - { name: status, type: enum, source: system, description: "SUSPECTED | CONFIRMED | FALSE_ALARM" }
      - { name: final_release_lbs, type: number, source: system, description: "Confirmed quantity in lbs recorded at confirm; null until confirmed" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock timestamp of confirmation; null until confirmed" }
      - { name: notification_required, type: boolean, source: computed, default: false, description: "True iff final_release_lbs >= 100 (CERCLA reportable quantity for ammonia)" }
      - { name: notification_deadline_at, type: datetime, source: computed, description: "confirmed_at + 15 minutes when notification_required; null otherwise" }
      - { name: notification_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING | OVERDUE | NOTIFIED" }
      - { name: notified_at, type: datetime, source: system, description: "Timestamp of regulatory notification; null until notified" }
      - { name: late_notification, type: boolean, source: computed, default: false, description: "True iff notified_at > notification_deadline_at" }
      - { name: auto_incident_id, type: string, source: system, description: "FK -> Incident.id; incident auto-created at confirm; null until confirmed", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RefrigerationSystem
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /psm/refrigeration-systems/{id}/status {to_status: OUT_OF_SERVICE}"
        actor: FacilityAdmin
        preconditions: []
        side_effects:
          - "System excluded from gauge-variant charge rollup while OUT_OF_SERVICE"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /psm/refrigeration-systems/{id}/status {to_status: IN_SERVICE}"
        actor: FacilityAdmin
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /psm/refrigeration-systems/{id}/status {to_status: DECOMMISSIONED}"
        actor: FacilityAdmin
        preconditions:
          - "Net book charge attributed to this system (sum of signed ChargeAdjustment.rounded_lbs where system_id == id) MUST equal 0 (ERR_SYSTEM_NOT_EMPTY)"
        side_effects:
          - "System permanently excluded from all rollups and gating"

  - entity: PsidDocument
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: UNDER_REVIEW
        trigger: "POST /psm/psid-documents/{id}/start-review"
        actor: PsCoordinator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CURRENT
        trigger: "POST /psm/psid-documents/{id}/reaffirm"
        actor: PsCoordinator
        preconditions: []
        side_effects:
          - "last_reaffirmed_at = logical clock now"
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (automatic when POST /psm/psid-documents creates a new document for the same (system_id, doc_type))"
        actor: system
        preconditions: []
        side_effects: []
        note: "The new document is created directly in CURRENT; exactly one CURRENT per (system_id, doc_type) is preserved"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (same supersede rule as CURRENT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Incident
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /psm/incidents/{id}/assign-investigator"
        actor: ComplianceOfficer
        preconditions:
          - "investigator_employee_id references an ACTIVE Employee of the same facility (ERR_NOT_FOUND / ERR_CROSS_FACILITY_REFERENCE)"
          - "investigator_employee_id != reported_by_employee_id (ERR_INVESTIGATOR_IS_REPORTER)"
        side_effects:
          - "investigator_employee_id set"
      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /psm/incidents/{id}/assign-investigator"
        actor: ComplianceOfficer
        preconditions:
          - "investigator_employee_id references an ACTIVE Employee of the same facility"
          - "investigator_employee_id != reported_by_employee_id (ERR_INVESTIGATOR_IS_REPORTER)"
        side_effects:
          - "investigator_employee_id replaced"
      - from: UNDER_INVESTIGATION
        to: ACTIONS_ASSIGNED
        trigger: "system (automatic when the first CorrectiveAction is created for this incident)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: CLOSED
        trigger: "POST /psm/incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "pending_action_count == 0 (no corrective actions exist)"
        side_effects:
          - "Facility.open_incident_count recomputed (decrements by 1); Facility.compliance_posture recomputed via calculations.compliance_posture_score"
      - from: ACTIONS_ASSIGNED
        to: CLOSED
        trigger: "POST /psm/incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "pending_action_count == 0 — every CorrectiveAction VERIFIED (ERR_ACTIONS_OPEN)"
        side_effects:
          - "Facility.open_incident_count recomputed (decrements by 1); Facility.compliance_posture recomputed"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /psm/incidents/{id}/reopen"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "reopen_count += 1"
          - "Facility.open_incident_count recomputed (increments by 1); Facility.compliance_posture recomputed"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /psm/corrective-actions/{id}/complete"
        actor: Operator
        preconditions:
          - "X-User-ID == assignee_employee_id (ERR_FORBIDDEN)"
        side_effects:
          - "Incident.pending_action_count recomputed (decrements by 1)"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /psm/corrective-actions/{id}/verify"
        actor: Operator
        preconditions:
          - "X-User-ID == incident.investigator_employee_id (ERR_FORBIDDEN)"
          - "incident.investigator_employee_id != assignee_employee_id (ERR_VERIFIER_IS_COMPLETER)"
        side_effects: []
      - from: COMPLETED
        to: OPEN
        trigger: "POST /psm/corrective-actions/{id}/reject"
        actor: Operator
        preconditions:
          - "X-User-ID == incident.investigator_employee_id (ERR_FORBIDDEN)"
        side_effects:
          - "Incident.pending_action_count recomputed (increments by 1)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (POST /psm/checkpoints/run marks every SCHEDULED inspection with due_at < now OVERDUE)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment.integrity_status recomputed (may become OVERDUE)"
          - "Facility.overdue_inspection_count recomputed; Facility.compliance_posture recomputed"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /psm/inspections/{id}/complete"
        actor: MaintenanceLead
        preconditions: []
        side_effects:
          - "result, findings, completed_at = logical clock now recorded; completed_late = false"
          - "Equipment.last_completed_at / last_result set; Equipment.next_due_at recomputed per calculations.inspection_due_date variant; Equipment.integrity_status recomputed"
          - "If result == FAIL: every HotWorkPermit on the equipment's system with status IN {ISSUED, IN_PROGRESS} -> SUSPENDED"
          - "If completing an OVERDUE-flagged cycle is not applicable from SCHEDULED; Facility counts recomputed when an OVERDUE inspection completes (see OVERDUE -> COMPLETED)"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /psm/inspections/{id}/complete"
        actor: MaintenanceLead
        preconditions: []
        side_effects:
          - "completed_late = true; completed_at = logical clock now"
          - "Equipment fields recomputed as on SCHEDULED -> COMPLETED"
          - "Facility.overdue_inspection_count recomputed (decrements by 1); Facility.compliance_posture recomputed"
          - "If result == FAIL: permits on the system SUSPENDED as above"

  - entity: Contractor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /psm/contractors/{id}/qualify"
        actor: MaintenanceLead
        preconditions:
          - "qualified_until must be a future timestamp vs logical clock (ERR_INVALID_WINDOW)"
        side_effects:
          - "qualified_until set"
      - from: EXPIRED
        to: QUALIFIED
        trigger: "POST /psm/contractors/{id}/qualify"
        actor: MaintenanceLead
        preconditions:
          - "qualified_until must be a future timestamp vs logical clock (ERR_INVALID_WINDOW)"
        side_effects:
          - "qualified_until set"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /psm/contractors/{id}/suspend"
        actor: MaintenanceLead
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /psm/contractors/{id}/reinstate"
        actor: MaintenanceLead
        preconditions:
          - "qualified_until must still be a future timestamp vs logical clock (ERR_INVALID_WINDOW)"
        side_effects: []
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system (POST /psm/checkpoints/run marks every QUALIFIED contractor with qualified_until < now EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HotWorkPermit
    initial_state: REQUESTED
    terminal_states: [CLOSED, VOIDED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /psm/hot-work-permits/{id}/issue"
        actor: MaintenanceLead
        preconditions:
          - "Contractor.qualification_status == QUALIFIED (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "RefrigerationSystem.status == IN_SERVICE (ERR_SYSTEM_OUT_OF_SERVICE)"
          - "No Equipment on the system with integrity_status == FAILED (ERR_EQUIPMENT_INTEGRITY_FAILED)"
          - "Facility.compliance_posture != NONCOMPLIANT (ERR_FACILITY_NONCOMPLIANT)"
          - "No window conflict: no other HotWorkPermit on the same system with status IN {REQUESTED, ISSUED, IN_PROGRESS} whose [valid_from, valid_until) overlaps this permit's window — overlap iff valid_from < other.valid_until AND valid_until > other.valid_from; touching endpoints (valid_from == other.valid_until) do NOT overlap (ERR_PERMIT_WINDOW_CONFLICT)"
        side_effects: []
      - from: ISSUED
        to: IN_PROGRESS
        trigger: "POST /psm/hot-work-permits/{id}/start"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == contractor_id (ERR_FORBIDDEN)"
          - "valid_from <= now < valid_until (ERR_PERMIT_OUTSIDE_WINDOW)"
          - "Contractor.qualification_status == QUALIFIED (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "No Equipment on the system with integrity_status == FAILED (ERR_EQUIPMENT_INTEGRITY_FAILED)"
        side_effects: []
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /psm/hot-work-permits/{id}/start"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == contractor_id (ERR_FORBIDDEN)"
          - "valid_from <= now < valid_until (ERR_PERMIT_OUTSIDE_WINDOW)"
          - "Contractor.qualification_status == QUALIFIED (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "No Equipment on the system with integrity_status == FAILED (ERR_EQUIPMENT_INTEGRITY_FAILED)"
        side_effects: []
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /psm/hot-work-permits/{id}/close"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == contractor_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /psm/hot-work-permits/{id}/void"
        actor: MaintenanceLead
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /psm/hot-work-permits/{id}/void"
        actor: MaintenanceLead
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SUSPENDED
        trigger: "system (automatic when an Inspection on the permit's system completes with result FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (automatic when an Inspection on the permit's system completes with result FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /psm/checkpoints/run marks every ISSUED permit with valid_until <= now EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LeakEvent
    initial_state: SUSPECTED
    terminal_states: [FALSE_ALARM]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "POST /psm/leak-events/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "final_release_lbs > 0 (ERR_QUANTITY_NOT_POSITIVE)"
        side_effects:
          - "final_release_lbs set; confirmed_at = logical clock now"
          - "notification_required = (final_release_lbs >= 100); if true: notification_deadline_at = confirmed_at + 15 minutes, notification_status = PENDING; else notification_status = NOT_REQUIRED"
          - "Auto-create Incident for the system's facility: severity = REPORTABLE if final_release_lbs >= 100 else RECORDABLE, reported_by_employee_id = null, source_leak_event_id = this leak; auto_incident_id set"
          - "Facility.open_incident_count recomputed (increments by 1); Facility.compliance_posture recomputed"
      - from: SUSPECTED
        to: FALSE_ALARM
        trigger: "POST /psm/leak-events/{id}/false-alarm"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /psm/leak-events/{id}/notify-regulator"
        actor: ComplianceOfficer
        preconditions:
          - "notification_status IN {PENDING, OVERDUE} (ERR_NOTIFICATION_NOT_REQUIRED)"
        side_effects:
          - "notified_at = logical clock now; notification_status = NOTIFIED; late_notification = (notified_at > notification_deadline_at)"
        note: "Self-transition: LeakEvent.status stays CONFIRMED; only notification fields evolve"

  - entity: DrillEvent
    initial_state: PLANNED
    terminal_states: [CONDUCTED]
    transitions:
      - from: PLANNED
        to: CONDUCTED
        trigger: "POST /psm/drill-events/{id}/conduct"
        actor: PsCoordinator
        preconditions:
          - "Every attendee_employee_ids entry references an ACTIVE Employee of the drill's facility (ERR_CROSS_FACILITY_REFERENCE)"
          - "At least 2 attendees each hold a TrainingRecord with topic == AMMONIA_OPERATOR and currency != EXPIRED at conduct time (ERR_DRILL_TRAINING_SHORTFALL)"
        side_effects:
          - "attendee_employee_ids recorded; conducted_at = logical clock now"

  - entity: ComplianceAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /psm/compliance-audits/{id}/start"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /psm/compliance-audits/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "findings_count >= 0 supplied (ERR_VALIDATION)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; both pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: charge-adjust-stale-facility
    parent_entity: Facility
    write_endpoint: "POST /psm/charge-adjustments"
    occ_field: "expected_facility_version"
    description: |
      Posting a ChargeAdjustment against a Facility whose version has advanced
      since the client last observed it is rejected. Ledger postings always
      remain semantically valid (each adjustment is independent), so the stale
      writer cannot be rejected by any state precondition; the OCC check on
      Facility.version is what forces the client to re-read the charge posture
      before posting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: psid-issue-stale-system
    parent_entity: RefrigerationSystem
    write_endpoint: "POST /psm/psid-documents"
    occ_field: "expected_system_version"
    description: |
      Issuing a new CURRENT PsidDocument against a RefrigerationSystem whose
      version has advanced since the client last observed it is rejected. A
      later document legitimately supersedes an earlier CURRENT document for
      the same (system_id, doc_type), so a second sequential create is not
      rejectable by state; OCC on RefrigerationSystem.version is what prevents
      a client from unknowingly superseding a document it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: facility_charge_rollup
    trigger: "on every successful POST /psm/charge-adjustments; also recomputed on read of GET /psm/facilities/{id}/charge-summary"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per adjustment line first, then sum.
      # Each adjustment stores rounded_lbs = round_half_up(quantity_lbs, 1 decimal) at posting time.
      book_total  = sum(rounded_lbs where adjustment_type == ADD)
                  - sum(rounded_lbs where adjustment_type == REMOVE)      # over ALL ChargeAdjustments with facility_id == F
      gauge_total = sum over RefrigerationSystems s with s.facility_id == F AND s.status == IN_SERVICE:
                      (s.last_gauge_reading_lbs if s.last_gauge_reading_lbs != null else s.design_charge_lbs)
      # Facility.total_charge_lbs (the posture-driving field) is ALWAYS the book variant.
      charge_posture = AT_OR_ABOVE_THRESHOLD iff book_total >= threshold_lbs else BELOW_THRESHOLD
    input_set: "All ChargeAdjustments of the facility (no time window; ledger is unbounded); all RefrigerationSystems of the facility with status == IN_SERVICE for the gauge variant"
    constants:
      ROUNDING: "0.1 lb, round_half_up, applied per line at posting"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: book
        when: "authoritative for Facility.total_charge_lbs, charge_posture, and threshold reporting"
        difference: "sums the append-only adjustment ledger; ignores physical gauge readings"
      - name: gauge
        when: "reported alongside book on the charge-summary read for reconciliation"
        difference: "sums latest physical gauge readings per IN_SERVICE system (ungauged systems contribute design_charge_lbs); diverges from book whenever physical inventory drifts from ledger"

  - name: inspection_due_date
    trigger: "on POST /psm/inspections/{id}/complete (recomputes Equipment.next_due_at)"
    algorithm: threshold
    formula: |
      if equipment.inspection_method == FIXED:
        next_due_at = completed_at + inspection_interval_days days
      else:  # CONDITION_BASED
        if result == PASS: next_due_at = completed_at + floor(inspection_interval_days * 1.5) days, capped at completed_at + 1095 days
        if result == FAIL: next_due_at = completed_at + 30 days
      Equipment.integrity_status = FAILED iff last_result == FAIL
    input_set: "The single Equipment row and the Inspection being completed"
    constants:
      CONDITION_EXTENSION_FACTOR: 1.5
      MAX_INTERVAL_DAYS: 1095
      FAIL_RECHECK_DAYS: 30
    precision: "whole days; timestamps at second precision"
    variants:
      - name: fixed_calendar
        when: "equipment.inspection_method == FIXED"
        difference: "interval is always the base inspection_interval_days regardless of result"
      - name: condition_based
        when: "equipment.inspection_method == CONDITION_BASED"
        difference: "PASS extends to 1.5x base (capped 1095 days); FAIL forces a 30-day recheck — identical completion data yields different next_due_at than fixed_calendar"

  - name: floating_head_pressure_target
    trigger: "on POST /psm/refrigeration-systems/{id}/head-pressure-target"
    algorithm: constraint_propagation
    formula: |
      # Load-band derate (conditional branch on input):
      effective_approach_f = system.condenser_approach_f
                           + (5.0 if condenser_load_pct >= 90 else 2.5 if condenser_load_pct >= 75 else 0.0)
      condensing_temp_f    = wet_bulb_f + effective_approach_f
      raw_psig             = linear interpolation of AMMONIA_SAT_PSIG_TABLE at condensing_temp_f,
                             rounded to 0.1 psig round_half_up
      if system.float_head_enabled == false: target_psig = system.max_head_psig
      else: target_psig = min(max(raw_psig, system.min_head_psig), system.max_head_psig)   # nested clamp
    input_set: "The target RefrigerationSystem (approach, clamps, float flag) plus request inputs wet_bulb_f and condenser_load_pct"
    constants:
      AMMONIA_SAT_PSIG_TABLE: { 50: 74.5, 60: 92.9, 70: 114.1, 80: 138.8, 90: 166.4, 100: 196.6 }
      LOAD_DERATE_BANDS: "load >= 90 -> +5.0F; 75 <= load < 90 -> +2.5F; load < 75 -> +0.0F"
    precision: "0.1 psig, round_half_up, applied once after interpolation"
    variants:
      - name: floating
        when: "system.float_head_enabled == true"
        difference: "target tracks wet-bulb-driven saturation pressure, clamped to [min_head_psig, max_head_psig]"
      - name: fixed_design
        when: "system.float_head_enabled == false"
        difference: "target is always max_head_psig regardless of weather or load"

  - name: compliance_posture_score
    trigger: "on any mutation of its inputs: incident open/close/reopen (incl. leak auto-create), inspection overdue mark or late completion, checkpoint recompute, training expiry observed at checkpoint"
    algorithm: weighted_scoring
    formula: |
      overdue_inspection_count = count(Inspection i where i.status == OVERDUE
                                 and i.equipment.system.facility_id == F)
      open_incident_count      = count(Incident n where n.facility_id == F
                                 and n.status IN {REPORTED, UNDER_INVESTIGATION, ACTIONS_ASSIGNED, REOPENED})
      expired_training_count   = count(TrainingRecord t where t.employee.facility_id == F
                                 and t.employee.employment_status == ACTIVE
                                 and now >= t.expires_at)
      posture_score = 5 * overdue_inspection_count + 3 * open_incident_count + 2 * expired_training_count
      compliance_posture = COMPLIANT if posture_score == 0
                           else DEGRADED if posture_score <= 9
                           else NONCOMPLIANT          # posture_score >= 10
    input_set: "Per facility: OVERDUE inspections, non-terminal incidents, expired trainings of ACTIVE employees — status sets pinned as above"
    constants:
      W_OVERDUE_INSPECTION: 5
      W_OPEN_INCIDENT: 3
      W_EXPIRED_TRAINING: 2
      NONCOMPLIANT_FLOOR: 10
    precision: "integer arithmetic, no rounding"

  - name: notification_deadline
    trigger: "on POST /psm/leak-events/{id}/confirm"
    algorithm: threshold
    formula: |
      notification_required = (final_release_lbs >= RQ_LBS)     # exactly 100.0 qualifies (>=, not >)
      if notification_required:
        notification_deadline_at = confirmed_at + 15 minutes
        notification_status = PENDING
      else:
        notification_status = NOT_REQUIRED
      late_notification (at notify time) = notified_at > notification_deadline_at   # exactly at deadline is ON TIME (<=)
    input_set: "The single LeakEvent being confirmed"
    constants:
      RQ_LBS: 100.0
      NOTIFY_WINDOW_MINUTES: 15

  - name: drill_gap_check
    trigger: "on POST /psm/drill-events (create)"
    algorithm: interval_merge
    formula: |
      # Buffer semantics (NOT half-open overlap): drills on the same facility must
      # keep a 24h quiet gap in BOTH directions.
      for each existing DrillEvent d with d.facility_id == F and d.status IN {PLANNED, CONDUCTED}:
        conflict iff NOT ( new.scheduled_start_at >= d.scheduled_end_at + 24h
                        or new.scheduled_end_at   <= d.scheduled_start_at - 24h )
      # exactly 24h of separation is ALLOWED (>= / <=)
    input_set: "All DrillEvents of the facility with status IN {PLANNED, CONDUCTED}"
    constants:
      DRILL_QUIET_GAP_HOURS: 24

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; entity-backed ownership: Operator X-User-ID must be an existing Employee.id (and equal reported_by_employee_id / assignee_employee_id / investigator_employee_id where the endpoint pins it); ContractorRep X-User-ID must equal HotWorkPermit.contractor_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body references exist (facility, system, equipment, document, inspection, employee, incident, corrective action, audit, contractor, permit, leak)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "OCC: expected_facility_version == Facility.version (POST /psm/charge-adjustments); expected_system_version == RefrigerationSystem.version (POST /psm/psid-documents)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /psm/charge-adjustments, POST /psm/psid-documents"

  - priority: 5
    category: state
    check: "Target resource is in a valid source state for the requested transition per §1.2 (e.g. issue only from REQUESTED; close only from IN_PROGRESS; assign-investigator only from REPORTED/REOPENED; confirm only from SUSPECTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Safety/compliance gates: contractor QUALIFIED for permit issue/start (ERR_CONTRACTOR_NOT_QUALIFIED); system IN_SERVICE for permit issue (ERR_SYSTEM_OUT_OF_SERVICE); no FAILED equipment on system for permit issue/start (ERR_EQUIPMENT_INTEGRITY_FAILED); facility not NONCOMPLIANT for permit issue (ERR_FACILITY_NONCOMPLIANT); investigator != reporter (ERR_INVESTIGATOR_IS_REPORTER); verifier != completer (ERR_VERIFIER_IS_COMPLETER); drill training quorum >= 2 non-expired AMMONIA_OPERATOR attendees (ERR_DRILL_TRAINING_SHORTFALL)"
    error_id: "ERR_CONTRACTOR_NOT_QUALIFIED | ERR_SYSTEM_OUT_OF_SERVICE | ERR_EQUIPMENT_INTEGRITY_FAILED | ERR_FACILITY_NONCOMPLIANT | ERR_INVESTIGATOR_IS_REPORTER | ERR_VERIFIER_IS_COMPLETER | ERR_DRILL_TRAINING_SHORTFALL"
    http_status: 422
    applies_to: "permit issue/start, incident assign-investigator, corrective-action verify, drill conduct"

  - priority: 7
    category: business_temporal
    check: "Window sanity: valid_from < valid_until (permit create); scheduled_start_at < scheduled_end_at (drill create); qualified_until in the future (contractor qualify/reinstate); permit start within [valid_from, valid_until) (ERR_PERMIT_OUTSIDE_WINDOW, 409)"
    error_id: "ERR_INVALID_WINDOW | ERR_PERMIT_OUTSIDE_WINDOW"
    http_status: 422
    applies_to: "permit create, drill create, contractor qualify/reinstate, permit start"

  - priority: 8
    category: business_constraint
    check: "Resource temporal conflicts: permit window overlap on same system vs permits with status IN {REQUESTED, ISSUED, IN_PROGRESS} (half-open, touching allowed — ERR_PERMIT_WINDOW_CONFLICT); drill 24h quiet gap on same facility (ERR_DRILL_GAP_VIOLATION)"
    error_id: "ERR_PERMIT_WINDOW_CONFLICT | ERR_DRILL_GAP_VIOLATION"
    http_status: 409
    applies_to: "permit create, permit issue, drill create"

  - priority: 9
    category: business_referential
    check: "Cross-aggregate integrity: system_id belongs to facility_id (permit create, charge adjust); equipment_id belongs to facility_id (incident create); reported/assignee/investigator/attendee employees belong to the same facility as the acted resource"
    error_id: ERR_CROSS_FACILITY_REFERENCE
    http_status: 422
    applies_to: "permit create, charge adjust, incident create, corrective-action create, drill conduct, incident assign-investigator"

  - priority: 10
    category: business_fiscal
    check: "Charge ledger solvency: REMOVE must not drive Facility.total_charge_lbs negative (ERR_CHARGE_NEGATIVE); quantity_lbs and final_release_lbs must be > 0 (ERR_QUANTITY_NOT_POSITIVE); incident close with pending actions (ERR_ACTIONS_OPEN, 409); notify when not required or already notified (ERR_NOTIFICATION_NOT_REQUIRED, 409); decommission with non-zero system charge (ERR_SYSTEM_NOT_EMPTY, 409)"
    error_id: "ERR_CHARGE_NEGATIVE | ERR_QUANTITY_NOT_POSITIVE | ERR_ACTIONS_OPEN | ERR_NOTIFICATION_NOT_REQUIRED | ERR_SYSTEM_NOT_EMPTY"
    http_status: 422
    applies_to: "charge adjust, leak confirm, incident close, leak notify-regulator, system status"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default logical time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/psm/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [FacilityAdmin, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Recomputed currency/overdue derived fields observe the new clock on next read or checkpoint"]

  # --- Facility ---
  - method: POST
    path: "/psm/facilities"
    description: "Create a facility"
    roles: [FacilityAdmin]
    code: 201
    input: [name, "threshold_lbs?"]
    output: Facility
    side_effects: ["total_charge_lbs=0.0, charge_posture=BELOW_THRESHOLD, psm_program_status=NOT_REQUIRED, compliance_posture=COMPLIANT, posture_score=0"]

  - method: GET
    path: "/psm/facilities/{id}"
    description: "Get a facility (includes computed charge and posture fields)"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/psm/facilities/{id}/charge-summary"
    description: "Computed read: book vs gauge inventory reconciliation for the facility"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: []
    output: "{ facility_id: string, threshold_lbs: number, book_charge_lbs: number, gauge_charge_lbs: number, delta_lbs: number, charge_posture: string }"
    side_effects: []

  # --- RefrigerationSystem ---
  - method: POST
    path: "/psm/refrigeration-systems"
    description: "Create a refrigeration system"
    roles: [FacilityAdmin]
    code: 201
    input: [facility_id, name, design_charge_lbs, "condenser_approach_f?", "min_head_psig?", "max_head_psig?", "float_head_enabled?"]
    output: RefrigerationSystem
    side_effects: ["status=IN_SERVICE; increments Facility.version? no — system creation does not mutate Facility fields"]

  - method: GET
    path: "/psm/refrigeration-systems/{id}"
    description: "Get a refrigeration system"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: []
    output: RefrigerationSystem
    side_effects: []

  - method: GET
    path: "/psm/refrigeration-systems"
    description: "List refrigeration systems"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "RefrigerationSystem[]"
    side_effects: []

  - method: POST
    path: "/psm/refrigeration-systems/{id}/status"
    description: "Transition system status (IN_SERVICE <-> OUT_OF_SERVICE, OUT_OF_SERVICE -> DECOMMISSIONED)"
    roles: [FacilityAdmin]
    code: 200
    input: [to_status]
    output: RefrigerationSystem
    side_effects: ["Decommission requires zero net system charge (ERR_SYSTEM_NOT_EMPTY)"]

  - method: POST
    path: "/psm/refrigeration-systems/{id}/gauge-readings"
    description: "Record a physical gauge reading (lbs) for the system"
    roles: [Operator]
    code: 200
    input: [reading_lbs]
    output: RefrigerationSystem
    side_effects: ["last_gauge_reading_lbs = reading_lbs; last_gauge_reading_at = logical clock now"]

  - method: POST
    path: "/psm/refrigeration-systems/{id}/head-pressure-target"
    description: "Compute the floating head pressure target (calculations.floating_head_pressure_target)"
    roles: [Operator, MaintenanceLead]
    code: 200
    input: [wet_bulb_f, condenser_load_pct]
    output: "{ system_id: string, effective_approach_f: number, condensing_temp_f: number, raw_psig: number, target_psig: number, variant: string }"
    side_effects: []

  # --- Equipment ---
  - method: POST
    path: "/psm/equipment"
    description: "Create equipment under a system"
    roles: [MaintenanceLead]
    code: 201
    input: [system_id, tag_number, equipment_type, inspection_interval_days, inspection_method]
    output: Equipment
    side_effects: ["integrity_status=CURRENT (no inspections yet, next_due_at null)"]

  - method: GET
    path: "/psm/equipment/{id}"
    description: "Get equipment"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: GET
    path: "/psm/equipment"
    description: "List equipment"
    roles: [FacilityAdmin, PsCoordinator, MaintenanceLead, ComplianceOfficer, Operator, ContractorRep]
    code: 200
    input: ["system_id?", "integrity_status?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  # --- PsidDocument ---
  - method: POST
    path: "/psm/psid-documents"
    description: "Issue a new CURRENT PSI/P&ID document for (system_id, doc_type); supersedes any existing CURRENT/UNDER_REVIEW document for that pair. OCC-guarded by expected_system_version."
    roles: [PsCoordinator]
    code: 201
    input: [system_id, doc_type, revision_label, content_uri, expected_system_version]
    output: PsidDocument
    side_effects:
      - "increments RefrigerationSystem.version by 1"
      - "prior document for (system_id, doc_type) with status IN {CURRENT, UNDER_REVIEW} -> SUPERSEDED"
      - "new document status=CURRENT"

  - method: GET
