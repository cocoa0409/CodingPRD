      - name: unverified_recipient_cap_boundary_at_5000_settles
        claim_type: Correct Result
        grounds: [calculations.transfer_risk_gate, state_machines.Transfer.SENT_to_SETTLED]
        distinguishing_aspect: "Send of exactly 5000c to an UNVERIFIED recipient uses > UNVERIFIED_RECIPIENT_CAP_CENTS, so 5000 (== cap) SETTLES while 5001 would HOLD."
        test_recipe:
          setup: ["Sender S (LOW tier) with balance; recipient R never verified."]
          setup_api_calls:
