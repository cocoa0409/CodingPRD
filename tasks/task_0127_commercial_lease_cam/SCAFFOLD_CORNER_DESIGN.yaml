scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_property_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with name + total_rentable_sqft returns 201 and a Property whose occupied_sqft initializes to 0 and version to 1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Riverside", total_rentable_sqft: 50000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.occupied_sqft == 0"
            - "Property.${prop_id}.version == 1"
            - "Property.${prop_id}.gross_up_occupancy_pct == 0.95"

      - name: get_lease_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Lease, endpoints]
        distinguishing_aspect: "GET /leases/{id} returns the stored lease with computed ti_drawn_cents==0 and outstanding_balance_cents==0 right after creation."
        test_recipe:
          setup:
            - "A DRAFT lease just created."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 5000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "Lease.${lease_id}.ti_drawn_cents == 0"
            - "Lease.${lease_id}.outstanding_balance_cents == 0"
            - "Lease.${lease_id}.status == DRAFT"

      - name: list_properties_paginated_envelope
        claim_type: Listing
        grounds: [entities.Property, endpoints, response_envelope]
        distinguishing_aspect: "GET /properties returns a paginated array with total_count and has_more in meta; default limit 10."
        test_recipe:
          setup:
            - "Two properties created."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "A", total_rentable_sqft: 1000 }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "B", total_rentable_sqft: 2000 }
              as: PropertyManager
          trigger:
            - call: "GET /properties"
              payload: { limit: 10, offset: 0 }
              as: PropertyManager
          assert:
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"
            - "response.data length == 2"

      - name: get_property_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Property", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_lease_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Lease", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /leases omitting required leased_sqft returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A property and tenant exist."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", base_rent_cents_annual: 5000000 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: pool_admin_fee_default_applied
        claim_type: Defaults
        grounds: [entities.ExpensePool.fields.admin_fee_pct, entities.ExpensePool.fields.pro_rata_denominator]
        distinguishing_aspect: "POST /expense-pools omitting admin_fee_pct and pro_rata_denominator applies defaults 0.0 and TOTAL_RENTABLE."
        test_recipe:
          setup:
            - "A property exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025 }
              as: Accountant
              captures: { pool_id: $.data.id }
          assert:
            - "ExpensePool.${pool_id}.admin_fee_pct == 0.0"
            - "ExpensePool.${pool_id}.pro_rata_denominator == TOTAL_RENTABLE"
            - "ExpensePool.${pool_id}.status == OPEN"

      - name: computed_occupied_sqft_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Property.fields.occupied_sqft]
        distinguishing_aspect: "occupied_sqft is source:computed; a client-supplied occupied_sqft in the create body is ignored and the field initializes to 0."
        test_recipe:
          setup:
            - "Empty DB; create a property with an extra occupied_sqft field."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.occupied_sqft == 0"

      - name: invalid_enum_recoverability_rejected
        claim_type: Type Constraints
        grounds: ["entities.ExpenseLineItem.fields.recoverability", "validations[priority=7]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST line-item with recoverability outside {RECOVERABLE,NON_RECOVERABLE,CAPPED_CONTROLLABLE} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "An OPEN pool exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025 }
              as: Accountant
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 1000, recoverability: "MAYBE" }
              as: Accountant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: salesreport_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SalesReport]
        distinguishing_aspect: "SalesReport has common_fields:false — it exposes id and created_at only, no version field, and has no update endpoint."
        test_recipe:
          setup:
            - "An active lease exists; file one sales report."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /sales-reports"
              payload: { lease_id: "${lease_id}", period_year: 2025, gross_sales_cents: 100000 }
              as: Tenant
              as_user_id: "${ten_id}"
              captures: { sr_id: $.data.id }
          assert:
            - "SalesReport.${sr_id}.gross_sales_cents == 100000"

      - name: create_lease_unknown_property_fk_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Lease.fields.property_id", "validations[priority=6]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /leases with a non-existent property_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A tenant exists but no property."
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { property_id: "00000000-0000-4000-8000-000000000000", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FK_NOT_FOUND"

      - name: flat_fk_reverse_reachability_leases_by_tenant
        claim_type: Foreign key references validated
        grounds: [entities.Lease.fields.tenant_id, endpoints]
        distinguishing_aspect: "Flat topology: GET /tenants/{id}/leases returns the array of leases whose tenant_id matches, proving cross-reference reverse-reachability."
        test_recipe:
          setup:
            - "One tenant with two leases."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 2000, base_rent_cents_annual: 0 }
              as: PropertyManager
          trigger:
            - call: "GET /tenants/${ten_id}/leases"
              payload: {}
              as: PropertyManager
          assert:
            - "response.data length == 2"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: lease_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Lease, entities.Lease.fields.status]
        distinguishing_aspect: "A newly created Lease starts in DRAFT (the declared initial_state)."
        test_recipe:
          setup:
            - "Property and tenant exist."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
          assert:
            - "Lease.${lease_id}.status == DRAFT"

      - name: activate_already_active_lease_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Lease.DRAFT_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE lease (no DRAFT->ACTIVE available) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "An ACTIVE lease."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Lease.${lease_id}.status == ACTIVE"

      - name: terminate_terminal_lease_locked_down
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Lease.ACTIVE_to_TERMINATED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From the terminal TERMINATED state a second terminate returns ERR_INVALID_STATE (409); occupancy not double-decremented."
        test_recipe:
          setup:
            - "A TERMINATED lease (activated then terminated)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 2500, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases/${lease_id}/terminate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/terminate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Property.${prop_id}.occupied_sqft == 0"

      - name: ti_draw_approve_precondition_lease_active
        claim_type: Precondition Enforcement
        grounds: ["state_machines.TiDraw.REQUESTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a TI draw whose lease is still DRAFT (not ACTIVE/HOLDOVER) violates the precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFT lease with a REQUESTED TI draw (draw can be requested before activation)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, ti_allowance_cents: 1000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 500000 }
              as: PropertyManager
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /ti-draws/${draw_id}/approve"
              payload: {}
              as: Accountant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TiDraw.${draw_id}.status == REQUESTED"

      - name: ti_draw_approve_side_effect_drawn_and_ledger
        claim_type: Side Effect Execution
        grounds: [state_machines.TiDraw.REQUESTED_to_APPROVED, entities.Lease.fields.ti_drawn_cents, entities.Lease.fields.outstanding_balance_cents]
        distinguishing_aspect: "Approving a TI draw of 500000 sets ti_drawn_cents to 500000 and posts a TI_DRAW credit of -500000, dropping outstanding_balance_cents from 0 to -500000."
        test_recipe:
          setup:
            - "An ACTIVE lease with base_rent 0 (post-activate balance 0), ti_allowance 1000000, a REQUESTED draw of 500000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, ti_allowance_cents: 1000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 500000 }
              as: PropertyManager
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /ti-draws/${draw_id}/approve"
              payload: {}
              as: Accountant
          assert:
            - "TiDraw.${draw_id}.status == APPROVED"
            - "Lease.${lease_id}.ti_drawn_cents == 500000"
            - "Lease.${lease_id}.outstanding_balance_cents == -500000"

      - name: estoppel_respond_twice_idempotency_guard
        claim_type: Idempotency
        grounds: ["state_machines.EstoppelCertificate.ISSUED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Responding to an already-CONFIRMED estoppel a second time returns ERR_INVALID_STATE (409) — terminal state, no re-response."
        test_recipe:
          setup:
            - "A CONFIRMED estoppel (issued with asserted_balance matching the lease's 0 balance, tenant confirmed)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /estoppels"
              payload: { lease_id: "${lease_id}", asserted_balance_cents: 0, asserted_base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { est_id: $.data.id }
            - call: "POST /estoppels/${est_id}/respond"
              payload: { tenant_response: "CONFIRMED" }
              as: Tenant
              as_user_id: "${ten_id}"
          trigger:
            - call: "POST /estoppels/${est_id}/respond"
              payload: { tenant_response: "CONFIRMED" }
              as: Tenant
              as_user_id: "${ten_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "EstoppelCertificate.${est_id}.status == CONFIRMED"

      - name: recon_return_revision_loop_bumps_version
        claim_type: Valid Transition
        grounds: [state_machines.Reconciliation.IN_REVIEW_to_DRAFT, entities.Reconciliation.fields.version]
        distinguishing_aspect: "IN_REVIEW->DRAFT (return) moves status to DRAFT and increments Reconciliation.version by 1 (the revision-loop bump that later goes stale for OCC)."
        test_recipe:
          setup:
            - "An IN_REVIEW reconciliation (version 1 at create, still 1 after submit)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 1000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 1000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /reconciliations/${recon_id}/return"
              payload: {}
              as: Accountant
              as_user_id: "acct-001"
          assert:
            - "Reconciliation.${recon_id}.status == DRAFT"
            - "Reconciliation.${recon_id}.version == 2"

      - name: pool_compound_lock_on_post_bubble
        claim_type: compound
        grounds: [state_machines.ExpensePool.OPEN_to_LOCKED, entities.ExpensePool.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / post_cascade_recon_to_ledger_to_balance_depth3
          rationale: "The OPEN->LOCKED pool transition is asserted (ExpensePool.status == LOCKED) as a side-effect of the same post in the named §1.8 cascade instance."

      - name: estoppel_confirmed_branch_balance_match
        claim_type: cyclic
        grounds: [state_machines.EstoppelCertificate.ISSUED_to_CONFIRMED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / estoppel_branching_issued_to_confirmed_or_disputed
          rationale: "The estoppel fork (the DISPUTED branch) is exercised by the named §1.8 instance; the CONFIRMED branch's balance-match precondition is covered by validations corner estoppel_confirm_balance_mismatch."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: percentage_rent_above_breakpoint_charge
        claim_type: Correct Result
        grounds: [calculations.percentage_rent, entities.Lease.fields.outstanding_balance_cents]
        distinguishing_aspect: "gross_sales 5000000, breakpoint 3000000, rate 0.06 -> excess 2000000 -> pct_rent 120000 posted; outstanding_balance_cents == 120000."
        test_recipe:
          setup:
            - "Active lease, base_rent 0, pct_rent_rate 0.06, breakpoint 3000000; SalesReport 2025 gross 5000000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, pct_rent_rate: 0.06, pct_rent_breakpoint_cents: 3000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /sales-reports"
              payload: { lease_id: "${lease_id}", period_year: 2025, gross_sales_cents: 5000000 }
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/percentage-rent-run"
              payload: { period_year: 2025 }
              as: PropertyManager
          assert:
            - "Lease.${lease_id}.outstanding_balance_cents == 120000"

      - name: cpi_floor_no_decrease_on_index_drop
        claim_type: Constants Applied
        grounds: [calculations.base_rent_escalation, entities.Lease.fields.base_rent_cents_annual]
        distinguishing_aspect: "CPI escalation with current index 240 below base index 250 floors raw_increase at 0; base_rent_cents_annual stays unchanged at 10000000."
        test_recipe:
          setup:
            - "Active CPI lease base_rent 10000000, escalation_rate 0.04, cpi_base_index 250.0."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 10000000, escalation_type: "CPI", escalation_rate: 0.04, cpi_base_index: 250.0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/escalate"
              payload: { current_cpi_index: 240.0 }
              as: PropertyManager
          assert:
            - "Lease.${lease_id}.base_rent_cents_annual == 10000000"

      - name: gross_up_excludes_non_recoverable
        claim_type: Input Set Filtering
        grounds: [calculations.gross_up_pool, entities.ExpenseLineItem.fields.recoverability]
        distinguishing_aspect: "A NON_RECOVERABLE line item is excluded from total_recoverable_cents; pool with one RECOVERABLE fixed 200000 + one NON_RECOVERABLE 999999 (admin 0) yields 200000."
        test_recipe:
          setup:
            - "Property fully occupied (factor 1.0 not needed for fixed items); pool admin 0."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "MANAGEMENT", amount_cents: 999999, recoverability: "NON_RECOVERABLE", is_variable: false }
              as: Accountant
          trigger:
            - call: "GET /expense-pools/${pool_id}"
              payload: {}
              as: Accountant
          assert:
            - "ExpensePool.${pool_id}.total_recoverable_cents == 200000"

      - name: admin_fee_applied_after_sum
        claim_type: Precision
        grounds: [calculations.gross_up_pool, entities.ExpensePool.fields.admin_fee_pct]
        distinguishing_aspect: "admin_fee_pct 0.15 on a recoverable sum of 200000 (fixed, no gross-up) adds round_half_up(200000*0.15)=30000 -> total_recoverable 230000."
        test_recipe:
          setup:
            - "Pool admin_fee_pct 0.15, single RECOVERABLE fixed 200000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, admin_fee_pct: 0.15 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
          trigger:
            - call: "GET /expense-pools/${pool_id}"
              payload: {}
              as: Accountant
          assert:
            - "ExpensePool.${pool_id}.total_recoverable_cents == 230000"

      - name: line_item_delete_recomputes_pool_total
        claim_type: Correct Result
        grounds: [calculations.gross_up_pool, endpoints, entities.ExpensePool.fields.total_recoverable_cents]
        distinguishing_aspect: "DELETE of one RECOVERABLE item from an OPEN pool re-runs gross_up_pool: after removing the 200000 item from a 200000+300000 pool, total_recoverable_cents drops to 300000."
        test_recipe:
          setup:
            - "Pool admin 0 with two RECOVERABLE fixed items 200000 and 300000 (total 500000)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "INSURANCE", amount_cents: 200000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
              captures: { item_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "TAXES", amount_cents: 300000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
          trigger:
            - call: "DELETE /expense-pools/${pool_id}/line-items/${item_id}"
              payload: {}
              as: Accountant
          assert:
            - "ExpensePool.${pool_id}.total_recoverable_cents == 300000"

      - name: reconciled_cam_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.reconciled_cam_true_up]
        excluded_because:
          difficulty_instance: dual_variant_calc / cam_estimated_vs_reconciled_true_up
          rationale: "Estimated vs reconciled divergence (180000 vs 250000) is the core assertion of the named §1.8 instance."

      - name: pro_rata_occupied_basis_variant
        claim_type: Variant Selection
        grounds: [calculations.pro_rata_share, entities.ExpensePool.fields.pro_rata_denominator]
        distinguishing_aspect: "With pro_rata_denominator=OCCUPIED and occupied 5000 of 10000 total, a 2500-sqft lease's share is 0.5 (vs 0.25 under TOTAL_RENTABLE), changing reconciled CAM accordingly."
        test_recipe:
          setup:
            - "Property total 10000; two active leases 2500 each so occupied 5000; pool OCCUPIED basis, admin 0, one RECOVERABLE fixed 1000000."
            - "Subject lease estimated_cam_cents_monthly 0 so estimated billed is 0 and true_up == reconciled."
          setup_api_calls:
