  - method: POST
    path: "/fluid-power/quotes/{id}/request-revision"
    description: "Customer requests quote revision"
    roles: [Customer]
    code: 200
    input: ["notes?"]
    output: Quote
    side_effects: ["SENT -> REVISION_REQUESTED; WorkOrder -> REVISION_REQUESTED"]

  # --- Inventory ---
  - method: POST
