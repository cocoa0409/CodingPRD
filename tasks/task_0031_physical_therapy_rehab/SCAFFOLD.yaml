scenario: |
  Physical Therapy Rehabilitation Plan: evaluation/plan/reevaluation, unit-hour
  authorization, home exercise program, Medicare MIPS quality, discharge
  assessment, veteran referral, Capped Plan of Care.

domain_name: pt-rehab
api_prefix: /rehab

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────────────────────
# §1.1  Entity-Relationship Table
# ─────────────────────────────────────────────────────────────────────────────
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Patient legal name (1-120 chars).
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD).
      - name: insurance_type
        type: enum
        source: input
        description: Insurance payer category.
        constraints: One of [MEDICARE, COMMERCIAL, MEDICAID, VA_TRICARE, SELF_PAY].
      - name: is_veteran
        type: boolean
        source: input
        description: Veteran status flag. Required true when insurance_type=VA_TRICARE.
        default: false
      - name: status
        type: enum
        source: system
        description: Patient lifecycle status.
        constraints: One of [ACTIVE, DISCHARGED, INACTIVE]. Initial=ACTIVE.

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Licensed therapist legal name.
      - name: npi_number
        type: string
        source: input
        description: 10-digit National Provider Identifier; unique across Therapist.
      - name: license_state
        type: string
        source: input
        description: Two-letter US state code where therapist is licensed.
      - name: medicare_provider_enrolled
        type: boolean
        source: input
        description: When true, may be assigned to MEDICARE Patients and reports MIPS.
        default: false

  - name: VeteranReferral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the referred veteran patient.
      - name: referring_va_facility_code
        type: string
        source: input
        description: VA facility identifier issuing the referral (uppercase 4-6 chars).
      - name: referral_authorization_number
        type: string
        source: input
        description: VA-issued authorization number; unique across VeteranReferral.
      - name: max_authorized_visits
        type: integer
        source: input
        description: Visit-count ceiling that any AuthorizationGrant derived from this referral may bind.
        constraints: Integer >= 1 and <= 60.
      - name: expires_on
        type: string
        source: input
        description: Inclusive ISO 8601 expiry date for the VA referral (YYYY-MM-DD).
      - name: status
        type: enum
        source: system
        description: Referral lifecycle.
        constraints: One of [ISSUED, CONSUMED, EXPIRED, CANCELLED]. Initial=ISSUED.

  - name: PlanOfCare
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient receiving care under this POC.
      - name: primary_therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the therapist of record for this POC.
      - name: initial_evaluation_id
        type: string
        source: system
        description: FK -> Evaluation.id; populated when the POC's initiating Evaluation is recorded.
      - name: veteran_referral_id
        type: string
        source: input
        description: FK -> VeteranReferral.id; required when Patient.insurance_type=VA_TRICARE; otherwise must be omitted.
      - name: diagnosis_icd10
        type: string
        source: input
        description: ICD-10 diagnosis code (uppercase, format like M54.5).
      - name: certified_start_date
        type: string
        source: input
        description: Inclusive ISO 8601 start date (YYYY-MM-DD) of the certification period.
      - name: certified_end_date
        type: string
        source: input
        description: Inclusive ISO 8601 end date; must be >= certified_start_date and within 90 days of it.
      - name: status
        type: enum
        source: system
        description: POC lifecycle status.
        constraints: One of [DRAFT, ACTIVE, RECERT_DUE, DISCHARGED, EXPIRED]. Initial=DRAFT.
      - name: capped_dollar_limit_cents
        type: integer
        source: computed
        description: Capped Plan of Care annual dollar limit in cents for the patient's insurance_type; pinned at activation from §1.3 calc capped_poc_limit.
      - name: cumulative_billed_cents
        type: integer
        source: computed
        description: Cumulative billed amount across all FINALIZED Visits under this POC; refreshed by §1.3 calc cumulative_billed.
        default: 0
      - name: capped_status
        type: enum
        source: computed
        description: Cap posture derived from cumulative_billed_cents vs capped_dollar_limit_cents per §1.3 capped_poc_posture.
        constraints: One of [UNDER_CAP, AT_CAP_WARNING, EXCEEDED]. Initial=UNDER_CAP.

  - name: Evaluation
    parent: PlanOfCare
    common_fields: true
    fields:
      - name: plan_of_care_id
        type: string
        source: input
        description: FK -> PlanOfCare.id; the POC this evaluation pertains to.
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the therapist performing the evaluation.
      - name: evaluation_kind
        type: enum
        source: input
        description: Type of evaluation event.
        constraints: One of [INITIAL, RE_EVALUATION, DISCHARGE].
      - name: performed_on
        type: string
        source: input
        description: ISO 8601 date the evaluation was performed (YYYY-MM-DD).
      - name: functional_score
        type: integer
        source: input
        description: Standardized functional assessment score 0-100; higher is better.
        constraints: Integer 0..100.
      - name: minutes_spent
        type: integer
        source: input
        description: Therapist-reported minutes for this evaluation session (used to populate billable_units via §1.3 evaluation_units).
        constraints: Integer >= 8 and <= 240.
      - name: billable_units
        type: integer
        source: computed
        description: 8-minute-rule billable units derived from minutes_spent per §1.3 evaluation_units.

  - name: AuthorizationGrant
    parent: PlanOfCare
    common_fields: true
    fields:
      - name: plan_of_care_id
        type: string
        source: input
        description: FK -> PlanOfCare.id; the POC this authorization funds.
      - name: veteran_referral_id
        type: string
        source: input
        description: FK -> VeteranReferral.id; populated only when the POC is veteran-referral-backed; otherwise null.
      - name: total_units_granted
        type: integer
        source: input
        description: Total 15-minute billable units pre-authorized.
        constraints: Integer >= 1 and <= 600.
      - name: units_consumed
        type: integer
        source: computed
        description: Running total of consumed units across linked Visits per §1.3 units_consumed_running; sum of Visit.billable_units where Visit.status IN {SCHEDULED, COMPLETED, FINALIZED}.
        default: 0
      - name: units_finalized
        type: integer
        source: computed
        description: Cumulative billable_units across linked Visits whose status=FINALIZED per §1.3 units_finalized_running.
        default: 0
      - name: effective_from
        type: string
        source: input
        description: Inclusive ISO 8601 start of authorization (YYYY-MM-DD).
      - name: effective_to
        type: string
        source: input
        description: Inclusive ISO 8601 end of authorization; must be <= PlanOfCare.certified_end_date.
      - name: status
        type: enum
        source: system
        description: Authorization lifecycle.
        constraints: One of [ACTIVE, EXHAUSTED, EXPIRED, CANCELLED]. Initial=ACTIVE.

  - name: Visit
    parent: AuthorizationGrant
    common_fields: true
    fields:
      - name: authorization_grant_id
        type: string
        source: input
        description: FK -> AuthorizationGrant.id; the grant whose units this Visit consumes.
      - name: therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the therapist delivering the visit.
      - name: scheduled_start_utc
        type: string
        source: input
        description: ISO 8601 UTC start of the visit interval.
      - name: scheduled_end_utc
        type: string
        source: input
        description: ISO 8601 UTC end; must be > scheduled_start_utc.
      - name: planned_minutes
        type: integer
        source: input
        description: Planned therapy minutes; used to pre-allocate planned units via §1.3 visit_planned_units.
        constraints: Integer >= 8 and <= 240.
      - name: actual_minutes
        type: integer
        source: input
        description: Actual minutes delivered, supplied on COMPLETE; null on SCHEDULED.
      - name: planned_units
        type: integer
        source: computed
        description: Provisional 15-minute units reserved at SCHEDULED per §1.3 visit_planned_units (forward-looking variant).
      - name: billable_units
        type: integer
        source: computed
        description: Finalized 8-minute-rule billable units derived from actual_minutes at COMPLETE per §1.3 visit_billable_units (chronological variant); zero while SCHEDULED.
        default: 0
      - name: billed_cents
        type: integer
        source: computed
        description: Dollar amount billed on FINALIZE per §1.3 visit_billed_amount; zero before FINALIZED.
        default: 0
      - name: cpt_code
        type: enum
        source: input
        description: CPT procedure code for the visit.
        constraints: One of [CPT_97110_THER_EX, CPT_97112_NEURO_REED, CPT_97140_MANUAL, CPT_97530_THER_ACT].
      - name: status
        type: enum
        source: system
        description: Visit lifecycle.
        constraints: One of [SCHEDULED, COMPLETED, FINALIZED, CANCELLED, NO_SHOW]. Initial=SCHEDULED.

  - name: HomeExerciseProgram
    parent: PlanOfCare
    common_fields: true
    fields:
      - name: plan_of_care_id
        type: string
        source: input
        description: FK -> PlanOfCare.id; the POC this HEP is prescribed under.
      - name: prescribed_by_therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the prescribing therapist.
      - name: exercise_count
        type: integer
        source: input
        description: Number of distinct exercises in the program.
        constraints: Integer >= 1 and <= 20.
      - name: weekly_frequency
        type: integer
        source: input
        description: Prescribed sessions per week (1..14).
        constraints: Integer >= 1 and <= 14.
      - name: prescribed_on
        type: string
        source: input
        description: ISO 8601 date prescribed (YYYY-MM-DD); must be on or after PlanOfCare.certified_start_date.
      - name: status
        type: enum
        source: system
        description: HEP lifecycle.
        constraints: One of [ACTIVE, SUPERSEDED, DISCONTINUED]. Initial=ACTIVE.

  - name: MIPSQualityMeasure
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient being measured. Required Patient.insurance_type=MEDICARE.
      - name: plan_of_care_id
        type: string
        source: input
        description: FK -> PlanOfCare.id; the POC under which the measurement applies.
      - name: reporting_therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; required Therapist.medicare_provider_enrolled=true.
      - name: measure_code
        type: enum
        source: input
        description: MIPS measure identifier.
        constraints: One of [MIPS128_FALL_RISK, MIPS131_PAIN_ASSESSMENT, MIPS182_FUNCTIONAL_OUTCOME].
      - name: performance_period_start
        type: string
        source: input
        description: ISO 8601 inclusive start date of the measurement period.
      - name: performance_period_end
        type: string
        source: input
        description: ISO 8601 inclusive end date; must be > performance_period_start.
      - name: numerator_met
        type: boolean
        source: input
        description: True when the patient met the quality numerator criteria during the period.
      - name: composite_score
        type: number
        source: computed
        description: Weighted MIPS composite score 0..100 per §1.3 mips_composite_score (risk-scoring variant).
      - name: status
        type: enum
        source: system
        description: Reporting lifecycle.
        constraints: One of [DRAFT, SUBMITTED, ACCEPTED, REJECTED]. Initial=DRAFT.

  - name: DischargeAssessment
    parent: PlanOfCare
    common_fields: true
    fields:
      - name: plan_of_care_id
        type: string
        source: input
        description: FK -> PlanOfCare.id; the POC being discharged. Must be ACTIVE or RECERT_DUE.
      - name: assessing_therapist_id
        type: string
        source: input
        description: FK -> Therapist.id; the therapist performing discharge assessment.
      - name: final_functional_score
        type: integer
        source: input
        description: Standardized score 0..100 at discharge.
        constraints: Integer 0..100.
      - name: goals_met_count
        type: integer
        source: input
        description: Number of original POC goals achieved at discharge.
        constraints: Integer 0..20.
      - name: total_goals_count
        type: integer
        source: input
        description: Total POC goals on file; must be >= goals_met_count.
        constraints: Integer 1..20.
      - name: discharge_outcome
        type: enum
        source: computed
        description: Outcome bucket derived from goals_met ratio per §1.3 discharge_outcome.
        constraints: One of [SUCCESSFUL, PARTIAL, UNSUCCESSFUL].
      - name: assessed_on
        type: string
        source: input
        description: ISO 8601 date discharge assessment performed.

# ─────────────────────────────────────────────────────────────────────────────
# §1.2  State Machine Table
# ─────────────────────────────────────────────────────────────────────────────
state_machines:
  - entity: PlanOfCare
    initial_state: DRAFT
    terminal_states: [DISCHARGED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rehab/plans-of-care/{id}/activate"
        actor: Therapist
        preconditions:
          - "An INITIAL Evaluation exists with plan_of_care_id == this.id"
          - "When Patient.insurance_type=VA_TRICARE: veteran_referral_id is set AND VeteranReferral.status == ISSUED"
          - "When Patient.insurance_type=VA_TRICARE: PlanOfCare.certified_end_date <= VeteranReferral.expires_on"
        side_effects:
          - "Pins PlanOfCare.capped_dollar_limit_cents via §1.3 capped_poc_limit"
          - "Sets PlanOfCare.capped_status = UNDER_CAP"
          - "When Patient.insurance_type=VA_TRICARE: transitions linked VeteranReferral.status ISSUED -> CONSUMED (depth-2 cascade hop 1)"
          - "When VeteranReferral becomes CONSUMED, every other PlanOfCare row referencing the same VeteranReferral and still in DRAFT cascades to EXPIRED (depth-2 cascade hop 2; trigger originates_in: plan-of-care-activate)"
        note: "Cascade chain — POC activate -> referral CONSUMED -> sibling drafts EXPIRED."

      - from: ACTIVE
        to: RECERT_DUE
        trigger: "POST /_clock/set_current_utc (system event when today > certified_end_date - 7 days)"
        actor: system
        preconditions:
          - "Today (UTC) > certified_end_date - 7 days AND today (UTC) <= certified_end_date"
        side_effects:
          - "No state change to children; flag posture only."

      - from: RECERT_DUE
        to: ACTIVE
        trigger: "POST /rehab/plans-of-care/{id}/recertify"
        actor: Therapist
        preconditions:
          - "A RE_EVALUATION Evaluation exists with performed_on >= certified_start_date AND performed_on <= certified_end_date"
          - "expected_plan_of_care_version matches PlanOfCare.version (§1.2.1 OCC)"
          - "Posted certified_end_date <= old certified_end_date + 90 days"
        side_effects:
          - "Refreshes certified_start_date and certified_end_date from payload"
          - "Increments PlanOfCare.version by 1"

      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /rehab/plans-of-care/{id}/discharge"
        actor: Therapist
        preconditions:
          - "A DischargeAssessment exists with plan_of_care_id == this.id"
        side_effects:
          - "Cancels every SCHEDULED Visit under any AuthorizationGrant of this POC (Visit.SCHEDULED -> CANCELLED; depth-3 cascade hop 1)"
          - "Each cancelled Visit's grant.units_consumed is recomputed via §1.3 units_consumed_running (depth-3 cascade hop 2)"
          - "Each AuthorizationGrant whose effective window is still open transitions ACTIVE -> CANCELLED (depth-3 cascade hop 3; trigger originates_in: poc-discharge)"
          - "Discontinues every ACTIVE HomeExerciseProgram (HEP.ACTIVE -> DISCONTINUED) under this POC"
          - "Patient.status flips ACTIVE -> DISCHARGED if no other ACTIVE PlanOfCare references the same Patient.id"

      - from: RECERT_DUE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system event when today > certified_end_date)"
        actor: system
        preconditions:
          - "Today (UTC) > certified_end_date"
          - "PlanOfCare.status == RECERT_DUE"
        side_effects:
          - "Cancels every SCHEDULED Visit under any AuthorizationGrant of this POC"
          - "Each AuthorizationGrant ACTIVE -> EXPIRED if its effective_to < today"
          - "Discontinues every ACTIVE HomeExerciseProgram under this POC"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rehab/visits/{id}/complete"
        actor: Therapist
        preconditions:
          - "PlanOfCare.status == ACTIVE OR RECERT_DUE (cross-entity guard via AuthorizationGrant.plan_of_care_id)"
          - "AuthorizationGrant.status == ACTIVE"
          - "Today (UTC) >= scheduled_start_utc date"
          - "actual_minutes provided in payload, 8..240"
        side_effects:
          - "Recomputes Visit.billable_units via §1.3 visit_billable_units (chronological variant) from actual_minutes"
          - "Recomputes AuthorizationGrant.units_consumed via §1.3 units_consumed_running"

      - from: COMPLETED
        to: FINALIZED
        trigger: "POST /rehab/visits/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "Visit.status == COMPLETED"
          - "expected_plan_of_care_version matches PlanOfCare.version (§1.2.1 OCC on the parent POC)"
          - "PlanOfCare.capped_status != EXCEEDED at the moment of finalize"
        side_effects:
          - "Computes Visit.billed_cents via §1.3 visit_billed_amount"
          - "Recomputes AuthorizationGrant.units_finalized via §1.3 units_finalized_running"
          - "Recomputes PlanOfCare.cumulative_billed_cents via §1.3 cumulative_billed (depth-2 cascade hop 1 from finalize)"
          - "Re-evaluates PlanOfCare.capped_status via §1.3 capped_poc_posture (depth-2 cascade hop 2; trigger originates_in: visit-finalize)"
          - "Increments PlanOfCare.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rehab/visits/{id}/cancel"
        actor: Therapist
        preconditions:
          - "Today (UTC) <= scheduled_start_utc date - 1 day OR caller role == PlatformAdmin"
        side_effects:
          - "Recomputes AuthorizationGrant.units_consumed via §1.3 units_consumed_running"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /rehab/visits/{id}/no-show"
        actor: Therapist
        preconditions:
          - "Today (UTC) > scheduled_start_utc date"
        side_effects:
          - "Recomputes AuthorizationGrant.units_consumed via §1.3 units_consumed_running"

  - entity: AuthorizationGrant
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "System event: triggered on every visit-finalize side-effect recomputation"
        actor: system
        preconditions:
          - "AuthorizationGrant.units_consumed >= AuthorizationGrant.total_units_granted (boundary >=)"
        side_effects:
          - "Blocks further SCHEDULED->COMPLETED transitions on linked Visits (rejected by §1.4 cross-entity guard)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system event when today > effective_to)"
        actor: system
        preconditions:
          - "Today (UTC) > AuthorizationGrant.effective_to"
        side_effects: []

  - entity: VeteranReferral
    initial_state: ISSUED
    terminal_states: [CONSUMED, EXPIRED, CANCELLED]
    transitions:
      - from: ISSUED
        to: CONSUMED
        trigger: "Side-effect of PlanOfCare DRAFT->ACTIVE when POC.veteran_referral_id == this.id"
        actor: system
        preconditions:
          - "PlanOfCare being activated has veteran_referral_id == this.id"
          - "Today (UTC) <= VeteranReferral.expires_on"
        side_effects:
          - "Sibling DRAFT PlanOfCare rows referencing same referral cascade to EXPIRED (per POC.activate hop 2)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system event when today > expires_on)"
        actor: system
        preconditions:
          - "Today (UTC) > VeteranReferral.expires_on"
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /rehab/veteran-referrals/{id}/cancel"
        actor: VAReferralCoordinator
        preconditions:
          - "VeteranReferral.status == ISSUED"
        side_effects: []

  - entity: MIPSQualityMeasure
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rehab/mips-measures/{id}/submit"
        actor: Therapist
        preconditions:
          - "Patient.insurance_type == MEDICARE"
          - "Therapist.medicare_provider_enrolled == true (the reporting_therapist_id)"
          - "PlanOfCare.status IN {ACTIVE, RECERT_DUE, DISCHARGED}"
        side_effects:
          - "Computes composite_score via §1.3 mips_composite_score (weighted_scoring variant)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /rehab/mips-measures/{id}/adjudicate"
        actor: PlatformAdmin
        preconditions:
          - "composite_score >= 30.0 (Medicare CMS acceptance threshold)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rehab/mips-measures/{id}/adjudicate"
        actor: PlatformAdmin
        preconditions:
          - "composite_score < 30.0"
        side_effects: []
      - from: DRAFT
        to: DRAFT
        trigger: "POST /rehab/mips-measures/{id}/revise"
        actor: Therapist
        preconditions:
          - "MIPSQualityMeasure.status == DRAFT"
          - "Revisions to numerator_met or measure_code allowed; performance_period* immutable"
        side_effects:
          - "Recomputes composite_score via §1.3 mips_composite_score"
          - "Increments MIPSQualityMeasure.version by 1"
        note: "Cyclic self-loop on DRAFT — supports iterative quality reporting."

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1  Concurrency Rules (OCC on PlanOfCare.version)
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - rule_id: poc-recert-stale
    parent_entity: PlanOfCare
    write_endpoint: "POST /rehab/plans-of-care/{id}/recertify"
    occ_field: "expected_plan_of_care_version"
    description: |
      Recertifying a PlanOfCare against a version that has advanced since the
      client last observed it is rejected. The canonical race: a visit-finalize
      on the same POC silently bumps PlanOfCare.version via the cumulative_billed
      cascade between the client's read and this recert call; the recert is
      rejected as stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: visit-finalize-stale-poc
    parent_entity: PlanOfCare
    write_endpoint: "POST /rehab/visits/{id}/finalize"
    occ_field: "expected_plan_of_care_version"
    description: |
      Finalizing a Visit requires the client to pin the POC version it expects.
      When another finalize (or a recert) has already advanced PlanOfCare.version
      since the client read it, this finalize is rejected — preventing two
      billing clerks from racing to push a POC past its Capped Plan of Care
      threshold based on a stale cumulative_billed view.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# ─────────────────────────────────────────────────────────────────────────────
# §1.3  Calculation Rules Table
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: evaluation_units
    trigger: "On Evaluation create (any kind)"
    algorithm: threshold
    formula: |
      # CMS 8-minute rule applied to a single timed evaluation session.
      m = Evaluation.minutes_spent
      if   m <  8: units = 0
      elif m <= 22: units = 1
      elif m <= 37: units = 2
      elif m <= 52: units = 3
      elif m <= 67: units = 4
      else:        units = ceil((m - 7) / 15)
      Evaluation.billable_units = units
    input_set: "Single Evaluation row; no cross-row state."
    constants:
      UNIT_MINUTES: 15
      MIN_BILLABLE_MINUTES: 8
    precision: "Integer units."

  - name: visit_planned_units
    trigger: "On Visit create (status SCHEDULED, forward-looking variant)"
    algorithm: forward_looking
    formula: |
      # Forward-looking: reserve units from planned_minutes BEFORE the visit happens.
      # This is the OPTIMISTIC variant — uses the SAME 8-minute rule but on planned_minutes.
      m = Visit.planned_minutes
      if   m <  8: planned = 0
      elif m <= 22: planned = 1
      elif m <= 37: planned = 2
      elif m <= 52: planned = 3
      elif m <= 67: planned = 4
      else:        planned = ceil((m - 7) / 15)
      Visit.planned_units = planned
    input_set: "Single Visit row at SCHEDULED."
    constants: {}
    precision: "Integer units."
    variants:
      - name: forward_looking_reservation
        when: "Visit.status == SCHEDULED — units are RESERVED but not yet finalized."
        difference: "Inputs are planned_minutes (a forecast)."

  - name: visit_billable_units
    trigger: "On Visit SCHEDULED -> COMPLETED transition (chronological variant)"
    algorithm: chronological
    formula: |
      # Chronological / final variant — operates on actually-delivered minutes.
      m = Visit.actual_minutes
      if   m <  8: units = 0
      elif m <= 22: units = 1
      elif m <= 37: units = 2
      elif m <= 52: units = 3
      elif m <= 67: units = 4
      else:        units = ceil((m - 7) / 15)
      Visit.billable_units = units
    input_set: "Single Visit row at COMPLETED."
    constants: {}
    precision: "Integer units."
    variants:
      - name: actual_delivery
        when: "Visit.status >= COMPLETED — units are CONSUMED based on what really happened."
        difference: "Inputs are actual_minutes; planned_minutes is ignored entirely. May differ from planned_units when actual_minutes != planned_minutes (e.g., planned 60 → planned_units=4, actual 30 → billable_units=2). Dual-variant divergence is observable in this gap."

  - name: units_consumed_running
    trigger: "On any Visit status mutation, or visit cancellation"
    algorithm: aggregation
    formula: |
      # Order-deterministic aggregation: sort children by created_at ASC, then by visit id ASC.
      eligible_visits = [v for v in Visits
                         if v.authorization_grant_id == grant.id
                         and v.status IN {SCHEDULED, COMPLETED, FINALIZED}]
      eligible_visits.sort(key=lambda v: (v.created_at, v.id))
      # SCHEDULED visits contribute planned_units; COMPLETED/FINALIZED contribute billable_units.
      consumed = 0
      for v in eligible_visits:
          consumed += v.planned_units if v.status == SCHEDULED else v.billable_units
      AuthorizationGrant.units_consumed = consumed
    input_set: "Visits with status IN {SCHEDULED, COMPLETED, FINALIZED}; excludes CANCELLED, NO_SHOW."
    constants: {}
    precision: "Integer."

  - name: units_finalized_running
    trigger: "On Visit COMPLETED -> FINALIZED transition"
    algorithm: aggregation
    formula: |
      eligible = [v for v in Visits
                  if v.authorization_grant_id == grant.id and v.status == FINALIZED]
      eligible.sort(key=lambda v: (v.created_at, v.id))
      AuthorizationGrant.units_finalized = sum(v.billable_units for v in eligible)
    input_set: "Visits with status == FINALIZED only."
    constants: {}
    precision: "Integer."

  - name: visit_billed_amount
    trigger: "On Visit COMPLETED -> FINALIZED transition"
    algorithm: tiered_pricing
    formula: |
      # Per-CPT-code per-unit price in cents. CMS-style fee schedule (illustrative).
      rate_cents = {
        "CPT_97110_THER_EX":    3200,
        "CPT_97112_NEURO_REED": 3900,
        "CPT_97140_MANUAL":     3500,
        "CPT_97530_THER_ACT":   3700,
      }[Visit.cpt_code]
      gross_cents = rate_cents * Visit.billable_units
      # Multiple-procedure payment reduction (MPPR): 50% off the unit price for
      # units BEYOND the first within a single visit. Round-per-line FIRST, then sum.
      if Visit.billable_units <= 1:
          billed = gross_cents
      else:
          first_unit  = rate_cents
          extra_units = Visit.billable_units - 1
          reduced     = round_half_up(rate_cents * 0.5)   # round PER-UNIT, then multiply
          billed      = first_unit + reduced * extra_units
      Visit.billed_cents = billed
    input_set: "Single Visit row at FINALIZED."
    constants:
      MPPR_FACTOR: 0.5
    precision: |
      Integer cents; round_half_up applied PER-UNIT before summing.
      Order-of-rounding pinned: round_per_unit_then_sum (NOT sum_then_round).

  - name: cumulative_billed
    trigger: "On Visit COMPLETED -> FINALIZED transition (depth-2 cascade hop 1 from visit-finalize)"
    algorithm: aggregation
    formula: |
      finalized_visits = [v for v in Visits
                          if v.plan_of_care_id_via_grant == poc.id
                          and v.status == FINALIZED]
      finalized_visits.sort(key=lambda v: (v.created_at, v.id))
      PlanOfCare.cumulative_billed_cents = sum(v.billed_cents for v in finalized_visits)
    input_set: "All FINALIZED Visits under any AuthorizationGrant of this POC."
    constants: {}
    precision: "Integer cents."

  - name: capped_poc_limit
    trigger: "On PlanOfCare DRAFT -> ACTIVE transition (pinned once at activation)"
    algorithm: threshold
    formula: |
      # Capped Plan of Care annual dollar limit by insurance_type (in cents).
      # Pinned ONCE at activate; later insurance_type changes do not retro-update.
      caps_cents = {
        "MEDICARE":    20000,    # $200.00 — illustrative low cap for benchmark testing
        "COMMERCIAL":  50000,    # $500.00
        "MEDICAID":    10000,    # $100.00
        "VA_TRICARE":  30000,    # $300.00
        "SELF_PAY":    100000,   # $1,000.00
      }
      PlanOfCare.capped_dollar_limit_cents = caps_cents[Patient.insurance_type]
    input_set: "PlanOfCare and its Patient at activation time."
    constants:
      MEDICARE_CAP_CENTS: 20000
      WARNING_RATIO: 0.90
    precision: "Integer cents."

  - name: capped_poc_posture
    trigger: "On PlanOfCare.cumulative_billed_cents change (depth-2 cascade hop 2 from visit-finalize)"
    algorithm: threshold
    formula: |
      c = PlanOfCare.cumulative_billed_cents
      L = PlanOfCare.capped_dollar_limit_cents
      if   c >  L:           posture = "EXCEEDED"
      elif c >= 0.90 * L:    posture = "AT_CAP_WARNING"   # boundary >= at 90%
      else:                  posture = "UNDER_CAP"
      PlanOfCare.capped_status = posture
    input_set: "Single PlanOfCare row."
    constants:
      WARNING_RATIO: 0.90
    precision: "Integer cents comparison; ratio uses float arithmetic, posture is enum."

  - name: mips_composite_score
    trigger: "On MIPSQualityMeasure DRAFT -> SUBMITTED, or DRAFT -> DRAFT (revise)"
    algorithm: weighted_scoring
    formula: |
      # Multi-input non-linear risk-scoring: combines measure base, numerator, AND
      # patient engagement (recent HEP activity) AND functional improvement.
      # All three weighted inputs are required — non-linear interaction.
      base = {
        "MIPS128_FALL_RISK":         60.0,
        "MIPS131_PAIN_ASSESSMENT":   18.0,
        "MIPS182_FUNCTIONAL_OUTCOME":70.0,
      }[MIPSQualityMeasure.measure_code]
      numerator_bonus = 25.0 if MIPSQualityMeasure.numerator_met else 0.0

      # Engagement = count of ACTIVE HEP under this POC during the performance period
      hep_count = count(HomeExerciseProgram
                        where plan_of_care_id == this.plan_of_care_id
                        and status == ACTIVE
                        and prescribed_on >= this.performance_period_start
                        and prescribed_on <= this.performance_period_end)
      engagement = min(10.0, hep_count * 3.5)

      # Functional improvement = INITIAL evaluation score MINUS latest functional
      # score on the POC (LATEST Evaluation by performed_on ASC, then created_at ASC).
      initial_eval  = Evaluations where plan_of_care_id == this.plan_of_care_id and evaluation_kind == INITIAL
      latest_eval   = Evaluations where plan_of_care_id == this.plan_of_care_id
                                   order by (performed_on ASC, created_at ASC) — last row
      improvement   = max(0, latest_eval.functional_score - initial_eval.functional_score)
      improvement_bonus = min(15.0, improvement * 0.5)

      raw = base + numerator_bonus + engagement + improvement_bonus
      MIPSQualityMeasure.composite_score = round_half_up(min(100.0, raw), 2)
    input_set: |
      The single MIPSQualityMeasure row, plus all HomeExerciseProgram and
      Evaluation rows sharing its plan_of_care_id.
    constants:
      ENGAGEMENT_CAP: 10.0
      IMPROVEMENT_CAP: 15.0
      NUMERATOR_BONUS: 25.0
      ACCEPTANCE_THRESHOLD: 30.0
    precision: "Two decimal places, round_half_up."
    variants:
      - name: forward_provisional
        when: "MIPSQualityMeasure.status == DRAFT — score is RECOMPUTED on every revise (cyclic state)."
        difference: "Inputs may change between revisions; engagement and improvement reflect latest HEPs/Evals at compute time."

  - name: discharge_outcome
    trigger: "On DischargeAssessment create"
    algorithm: threshold
    formula: |
      ratio = DischargeAssessment.goals_met_count / DischargeAssessment.total_goals_count
      if   ratio >= 0.80: outcome = "SUCCESSFUL"
      elif ratio >= 0.40: outcome = "PARTIAL"
      else:                outcome = "UNSUCCESSFUL"
      DischargeAssessment.discharge_outcome = outcome
    input_set: "Single DischargeAssessment row."
    constants:
      SUCCESS_THRESHOLD: 0.80
      PARTIAL_THRESHOLD: 0.40
    precision: "Float ratio, enum outcome."

# ─────────────────────────────────────────────────────────────────────────────
# §1.4  Validation Rules Table (ordered by priority)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  # 1xx Authentication / Authorization
  - priority: 100
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 110
    category: auth
    check: "Caller's role permits this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 115
    category: auth
    check: "When caller is entity_backed (Therapist), X-User-ID equals an existing Therapist.id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints with as: Therapist"

  # 2xx Existence (left-to-right)
  - priority: 200
    category: existence
    check: "Resources referenced in URL path exist (left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints"

  - priority: 210
    category: existence
    check: "Foreign-key ids in request body exist"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/update endpoints with FK inputs"

  # 3xx State preconditions
  - priority: 300
    category: state
    check: "Target entity is in a state permitting this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 305
    category: state
    check: "OCC: expected_plan_of_care_version matches PlanOfCare.version when supplied"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /rehab/plans-of-care/{id}/recertify, POST /rehab/visits/{id}/finalize"

  # 4xx Business — Safety/Compliance (HIGHEST business priority)
  - priority: 400
    category: business_safety
    check: "When Patient.insurance_type=VA_TRICARE, PlanOfCare.veteran_referral_id MUST be set AND VeteranReferral.status=ISSUED at activate"
    error_id: ERR_VA_REFERRAL_REQUIRED
    http_status: 422
    applies_to: "POST /rehab/plans-of-care/{id}/activate"

  - priority: 405
    category: business_safety
    check: "MIPS reporting requires Patient.insurance_type=MEDICARE AND Therapist.medicare_provider_enrolled=true"
    error_id: ERR_MIPS_ELIGIBILITY
    http_status: 422
    applies_to: "POST /rehab/mips-measures, POST /rehab/mips-measures/{id}/submit"

  - priority: 410
    category: business_safety
    check: "PlanOfCare.capped_status != EXCEEDED at the moment of Visit finalize (Capped POC gate)"
    error_id: ERR_CAPPED_POC_EXCEEDED
    http_status: 409
    applies_to: "POST /rehab/visits/{id}/finalize"

  # 4xx Business — Constraint
  - priority: 420
    category: business_constraint
    check: "Therapist.license_state matches Patient's de-facto state of care (Patient.insurance_type proxies — VA_TRICARE accepts any state; others require license_state == 'CA' demo policy)"
    error_id: ERR_THERAPIST_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /rehab/visits, POST /rehab/evaluations, POST /rehab/plans-of-care"

  - priority: 425
    category: business_constraint
    check: "VeteranReferral max_authorized_visits >= count of Visit rows already linked (via grant) to the same referral"
    error_id: ERR_VA_VISIT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /rehab/visits"

  # 4xx Business — Temporal
  - priority: 430
    category: business_temporal
    check: "Visit.scheduled_start_utc/scheduled_end_utc fall within AuthorizationGrant.effective_from..effective_to (inclusive dates) AND within PlanOfCare.certified_start_date..certified_end_date"
    error_id: ERR_VISIT_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /rehab/visits"

  - priority: 435
    category: business_temporal
    check: "New Visit's [scheduled_start_utc, scheduled_end_utc) must not overlap with any other SCHEDULED or COMPLETED Visit on the same Therapist (half-open semantics — adjacent visits at exactly the same UTC instant are PERMITTED)"
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /rehab/visits"

  - priority: 437
    category: business_temporal
    check: "AuthorizationGrant.effective_from..effective_to range must not overlap any other AuthorizationGrant for the same PlanOfCare (CLOSED-CLOSED semantics — adjacent grants sharing a single day are REJECTED) and aggregate total_units_granted across overlapping windows would breach the closed-interval rule"
    error_id: ERR_GRANT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rehab/authorization-grants"

  # 4xx Business — Fiscal (LAST among business rules — money checks after safety)
  - priority: 440
    category: business_fiscal
    check: "AuthorizationGrant.units_consumed must remain <= total_units_granted after Visit complete"
    error_id: ERR_AUTHORIZATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /rehab/visits/{id}/complete, POST /rehab/visits"

  # 4xx Business — Referential
  - priority: 450
    category: business_referential
    check: "DischargeAssessment.total_goals_count >= goals_met_count"
    error_id: ERR_GOALS_INCONSISTENT
    http_status: 422
    applies_to: "POST /rehab/discharge-assessments"

  - priority: 455
    category: business_referential
    check: "Recertify payload's certified_end_date <= old certified_end_date + 90 days"
    error_id: ERR_RECERT_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /rehab/plans-of-care/{id}/recertify"

  - priority: 460
    category: business_referential
    check: "Patient.insurance_type=VA_TRICARE requires Patient.is_veteran=true"
    error_id: ERR_VETERAN_FLAG_REQUIRED
    http_status: 422
    applies_to: "POST /rehab/patients"

  # 9xx Generic input validation
  - priority: 900
    category: business_constraint
    check: "All required fields present and of declared type/range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# ─────────────────────────────────────────────────────────────────────────────
# §1.5  API Endpoint Table
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # ── Patients ──
  - method: POST
    path: "/rehab/patients"
    description: "Create a Patient."
    roles: [PlatformAdmin, CaseManager]
    code: 201
    input: [full_name, date_of_birth, insurance_type, "is_veteran?"]
    output: Patient
    side_effects: [Patient row created with status=ACTIVE]

  - method: GET
    path: "/rehab/patients/{id}"
    description: "Retrieve a Patient by id."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk, VAReferralCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/rehab/patients"
    description: "List Patients with optional filters."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["status?", "insurance_type?", "is_veteran?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ── Therapists ──
  - method: POST
    path: "/rehab/therapists"
    description: "Create a Therapist."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, npi_number, license_state, "medicare_provider_enrolled?"]
    output: Therapist
    side_effects: []

  - method: GET
    path: "/rehab/therapists/{id}"
    description: "Retrieve a Therapist."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  - method: GET
    path: "/rehab/therapists"
    description: "List Therapists."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["medicare_provider_enrolled?", "license_state?", "limit?", "offset?"]
    output: Therapist[]
    side_effects: []

  # ── Veteran Referrals ──
  - method: POST
    path: "/rehab/veteran-referrals"
    description: "Issue a VeteranReferral from VA facility."
    roles: [VAReferralCoordinator, PlatformAdmin]
    code: 201
    input: [patient_id, referring_va_facility_code, referral_authorization_number, max_authorized_visits, expires_on]
    output: VeteranReferral
    side_effects: [VeteranReferral.status=ISSUED]

  - method: GET
    path: "/rehab/veteran-referrals/{id}"
    description: "Retrieve a VeteranReferral."
    roles: [PlatformAdmin, CaseManager, VAReferralCoordinator, Therapist]
    code: 200
    input: []
    output: VeteranReferral
    side_effects: []

  - method: GET
    path: "/rehab/veteran-referrals"
    description: "List VeteranReferrals, filterable by patient_id."
    roles: [PlatformAdmin, CaseManager, VAReferralCoordinator]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: VeteranReferral[]
    side_effects: []

  - method: POST
    path: "/rehab/veteran-referrals/{id}/cancel"
    description: "Cancel an ISSUED VeteranReferral (state ISSUED -> CANCELLED)."
    roles: [VAReferralCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: VeteranReferral
    side_effects: [VeteranReferral.status -> CANCELLED]

  # ── Plans of Care ──
  - method: POST
    path: "/rehab/plans-of-care"
    description: "Create a PlanOfCare in DRAFT."
    roles: [Therapist, CaseManager]
    code: 201
    input: [patient_id, primary_therapist_id, "veteran_referral_id?", diagnosis_icd10, certified_start_date, certified_end_date]
    output: PlanOfCare
    side_effects: [PlanOfCare.status=DRAFT, capped_status=UNDER_CAP]

  - method: GET
    path: "/rehab/plans-of-care/{id}"
    description: "Retrieve a PlanOfCare."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk, VAReferralCoordinator]
    code: 200
    input: []
    output: PlanOfCare
    side_effects: []

  - method: GET
    path: "/rehab/plans-of-care"
    description: "List PlansOfCare, filterable by patient_id, primary_therapist_id, veteran_referral_id."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk, VAReferralCoordinator]
    code: 200
    input: ["patient_id?", "primary_therapist_id?", "veteran_referral_id?", "initial_evaluation_id?", "status?", "limit?", "offset?"]
    output: PlanOfCare[]
    side_effects: []

  - method: POST
    path: "/rehab/plans-of-care/{id}/activate"
    description: "Activate a DRAFT PlanOfCare (DRAFT -> ACTIVE). Pins capped_dollar_limit_cents. Cascades VeteranReferral->CONSUMED and sibling DRAFT POCs->EXPIRED."
    roles: [Therapist]
    code: 200
    input: []
    output: PlanOfCare
    side_effects:
      - "PlanOfCare.status DRAFT -> ACTIVE"
      - "PlanOfCare.capped_dollar_limit_cents pinned via §1.3 capped_poc_limit"
      - "VeteranReferral.status ISSUED -> CONSUMED (when veteran-referred)"
      - "Sibling DRAFT PlansOfCare referencing same VeteranReferral cascade to EXPIRED"
      - "Increments PlanOfCare.version by 1"

  - method: POST
    path: "/rehab/plans-of-care/{id}/recertify"
    description: "Recertify a RECERT_DUE PlanOfCare back to ACTIVE with a new end date."
    roles: [Therapist]
    code: 200
    input: [expected_plan_of_care_version, certified_start_date, certified_end_date]
    output: PlanOfCare
    side_effects:
      - "PlanOfCare.status RECERT_DUE -> ACTIVE"
      - "Refreshes certified_start_date, certified_end_date"
      - "Increments PlanOfCare.version by 1"

  - method: POST
    path: "/rehab/plans-of-care/{id}/discharge"
    description: "Discharge an ACTIVE PlanOfCare. Triggers depth-3 cascade: cancel SCHEDULED Visits -> recompute grant.units_consumed -> grant.ACTIVE->CANCELLED. Discontinues HEPs. Patient.status -> DISCHARGED if no other ACTIVE POC."
    roles: [Therapist]
    code: 200
    input: []
    output: PlanOfCare
    side_effects:
      - "PlanOfCare.status ACTIVE -> DISCHARGED"
      - "Depth-3 cascade: Visit.SCHEDULED -> CANCELLED -> grant.units_consumed recomputed -> grant.ACTIVE -> CANCELLED"
      - "HomeExerciseProgram.ACTIVE -> DISCONTINUED"
      - "Patient.status ACTIVE -> DISCHARGED when last POC discharges"
      - "Increments PlanOfCare.version by 1"

  # ── Evaluations ──
  - method: POST
    path: "/rehab/evaluations"
    description: "Create an Evaluation under a PlanOfCare. INITIAL kind also sets PlanOfCare.initial_evaluation_id."
    roles: [Therapist]
    code: 201
    input: [plan_of_care_id, therapist_id, evaluation_kind, performed_on, functional_score, minutes_spent]
    output: Evaluation
    side_effects:
      - "Evaluation.billable_units computed via §1.3 evaluation_units"
      - "When evaluation_kind=INITIAL and PlanOfCare.initial_evaluation_id is null: sets it to this Evaluation.id and bumps PlanOfCare.version"

  - method: GET
    path: "/rehab/evaluations/{id}"
    description: "Retrieve an Evaluation."
    roles: [PlatformAdmin, Therapist, BillingClerk]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: GET
    path: "/rehab/evaluations"
    description: "List Evaluations, filterable by plan_of_care_id, therapist_id."
    roles: [PlatformAdmin, Therapist, BillingClerk]
    code: 200
    input: ["plan_of_care_id?", "therapist_id?", "evaluation_kind?", "limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

  # ── Authorization Grants ──
  - method: POST
    path: "/rehab/authorization-grants"
    description: "Create an AuthorizationGrant under a PlanOfCare."
    roles: [CaseManager, PlatformAdmin]
    code: 201
    input: [plan_of_care_id, "veteran_referral_id?", total_units_granted, effective_from, effective_to]
    output: AuthorizationGrant
    side_effects: [AuthorizationGrant.status=ACTIVE, units_consumed=0, units_finalized=0]

  - method: GET
    path: "/rehab/authorization-grants/{id}"
    description: "Retrieve an AuthorizationGrant."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk]
    code: 200
    input: []
    output: AuthorizationGrant
    side_effects: []

  - method: GET
    path: "/rehab/authorization-grants"
    description: "List AuthorizationGrants, filterable by plan_of_care_id, veteran_referral_id."
    roles: [PlatformAdmin, CaseManager, Therapist, BillingClerk]
    code: 200
    input: ["plan_of_care_id?", "veteran_referral_id?", "status?", "limit?", "offset?"]
    output: AuthorizationGrant[]
    side_effects: []

  # ── Visits ──
  - method: POST
    path: "/rehab/visits"
    description: "Schedule a Visit (status SCHEDULED). Reserves planned_units via §1.3 visit_planned_units."
    roles: [Therapist, CaseManager]
    code: 201
    input: [authorization_grant_id, therapist_id, scheduled_start_utc, scheduled_end_utc, planned_minutes, cpt_code]
    output: Visit
    side_effects:
      - "Visit.planned_units computed via §1.3 visit_planned_units (forward-looking)"
      - "AuthorizationGrant.units_consumed recomputed via §1.3 units_consumed_running"

  - method: GET
    path: "/rehab/visits/{id}"
    description: "Retrieve a Visit."
    roles: [PlatformAdmin, Therapist, BillingClerk, CaseManager]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/rehab/visits"
    description: "List Visits, filterable by authorization_grant_id, therapist_id."
    roles: [PlatformAdmin, Therapist, BillingClerk, CaseManager]
    code: 200
    input: ["authorization_grant_id?", "therapist_id?", "status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: POST
    path: "/rehab/visits/{id}/complete"
    description: "Mark a SCHEDULED Visit COMPLETED with delivered minutes (chronological variant)."
    roles: [Therapist]
    code: 200
    input: [actual_minutes]
    output: Visit
    side_effects:
      - "Visit.status SCHEDULED -> COMPLETED"
      - "Visit.billable_units recomputed via §1.3 visit_billable_units (chronological)"
      - "AuthorizationGrant.units_consumed recomputed via §1.3 units_consumed_running"
      - "AuthorizationGrant.status auto-transitions to EXHAUSTED when units_consumed >= total_units_granted"

  - method: POST
    path: "/rehab/visits/{id}/finalize"
    description: "Bill a COMPLETED Visit (depth-2 cascade: bills the visit, refreshes POC cumulative_billed_cents, re-evaluates capped_status, bumps POC.version)."
    roles: [BillingClerk]
    code: 200
    input: [expected_plan_of_care_version]
    output: Visit
    side_effects:
      - "Visit.status COMPLETED -> FINALIZED"
      - "Visit.billed_cents computed via §1.3 visit_billed_amount"
      - "PlanOfCare.cumulative_billed_cents recomputed via §1.3 cumulative_billed (depth-2 hop 1)"
      - "PlanOfCare.capped_status re-evaluated via §1.3 capped_poc_posture (depth-2 hop 2)"
      - "AuthorizationGrant.units_finalized recomputed via §1.3 units_finalized_running"
      - "Increments PlanOfCare.version by 1"

  - method: POST
    path: "/rehab/visits/{id}/cancel"
    description: "Cancel a SCHEDULED Visit (SCHEDULED -> CANCELLED)."
    roles: [Therapist, PlatformAdmin]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "Visit.status SCHEDULED -> CANCELLED"
      - "AuthorizationGrant.units_consumed recomputed via §1.3 units_consumed_running"

  - method: POST
    path: "/rehab/visits/{id}/no-show"
    description: "Mark a missed SCHEDULED Visit NO_SHOW."
    roles: [Therapist]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "Visit.status SCHEDULED -> NO_SHOW"
      - "AuthorizationGrant.units_consumed recomputed via §1.3 units_consumed_running"

  # ── Home Exercise Programs ──
  - method: POST
    path: "/rehab/home-exercise-programs"
    description: "Prescribe a HomeExerciseProgram. Supersedes any prior ACTIVE HEP on the same POC (SUPERSEDED)."
    roles: [Therapist]
    code: 201
    input: [plan_of_care_id, prescribed_by_therapist_id, exercise_count, weekly_frequency, prescribed_on]
    output: HomeExerciseProgram
    side_effects:
      - "Prior ACTIVE HomeExerciseProgram(s) under this POC transition to SUPERSEDED"
      - "New HomeExerciseProgram.status=ACTIVE"

  - method: GET
    path: "/rehab/home-exercise-programs/{id}"
    description: "Retrieve a HomeExerciseProgram."
    roles: [PlatformAdmin, Therapist, CaseManager]
    code: 200
    input: []
    output: HomeExerciseProgram
    side_effects: []

  - method: GET
    path: "/rehab/home-exercise-programs"
    description: "List HomeExercisePrograms, filterable by plan_of_care_id, prescribed_by_therapist_id."
    roles: [PlatformAdmin, Therapist, CaseManager]
    code: 200
    input: ["plan_of_care_id?", "prescribed_by_therapist_id?", "status?", "limit?", "offset?"]
    output: HomeExerciseProgram[]
    side_effects: []

  # ── MIPS Quality Measures ──
  - method: POST
    path: "/rehab/mips-measures"
    description: "Create a DRAFT MIPSQualityMeasure."
    roles: [Therapist]
    code: 201
    input: [patient_id, plan_of_care_id, reporting_therapist_id, measure_code, performance_period_start, performance_period_end, numerator_met]
    output: MIPSQualityMeasure
    side_effects: [MIPSQualityMeasure.status=DRAFT]

  - method: GET
    path: "/rehab/mips-measures/{id}"
    description: "Retrieve a MIPSQualityMeasure."
    roles: [PlatformAdmin, Therapist]
    code: 200
    input: []
    output: MIPSQualityMeasure
    side_effects: []

  - method: GET
    path: "/rehab/mips-measures"
    description: "List MIPSQualityMeasures, filterable by patient_id, plan_of_care_id, reporting_therapist_id."
    roles: [PlatformAdmin, Therapist]
    code: 200
    input: ["patient_id?", "plan_of_care_id?", "reporting_therapist_id?", "status?", "limit?", "offset?"]
    output: MIPSQualityMeasure[]
    side_effects: []

  - method: POST
    path: "/rehab/mips-measures/{id}/revise"
    description: "Revise a DRAFT measure (cyclic self-loop). Recomputes composite_score."
    roles: [Therapist]
    code: 200
    input: ["numerator_met?", "measure_code?"]
    output: MIPSQualityMeasure
    side_effects:
      - "Recomputes composite_score via §1.3 mips_composite_score"
      - "Increments MIPSQualityMeasure.version by 1"

  - method: POST
    path: "/rehab/mips-measures/{id}/submit"
    description: "Submit a DRAFT MIPSQualityMeasure (DRAFT -> SUBMITTED). Computes composite_score."
    roles: [Therapist]
    code: 200
    input: []
    output: MIPSQualityMeasure
    side_effects:
      - "MIPSQualityMeasure.status DRAFT -> SUBMITTED"
      - "Computes composite_score via §1.3 mips_composite_score"

  - method: POST
    path: "/rehab/mips-measures/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED measure (composite_score >= 30.0 -> ACCEPTED; else REJECTED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MIPSQualityMeasure
    side_effects:
      - "MIPSQualityMeasure.status SUBMITTED -> ACCEPTED or REJECTED based on composite_score vs 30.0"

  # ── Discharge Assessments ──
  - method: POST
    path: "/rehab/discharge-assessments"
    description: "Record a DischargeAssessment under a PlanOfCare. Computes discharge_outcome."
    roles: [Therapist]
    code: 201
    input: [plan_of_care_id, assessing_therapist_id, final_functional_score, goals_met_count, total_goals_count, assessed_on]
    output: DischargeAssessment
    side_effects: [DischargeAssessment.discharge_outcome computed via §1.3 discharge_outcome]

  - method: GET
    path: "/rehab/discharge-assessments/{id}"
    description: "Retrieve a DischargeAssessment."
    roles: [PlatformAdmin, Therapist, CaseManager]
    code: 200
    input: []
    output: DischargeAssessment
    side_effects: []

  - method: GET
    path: "/rehab/discharge-assessments"
    description: "List DischargeAssessments, filterable by plan_of_care_id, assessing_therapist_id."
    roles: [PlatformAdmin, Therapist, CaseManager]
    code: 200
    input: ["plan_of_care_id?", "assessing_therapist_id?", "limit?", "offset?"]
    output: DischargeAssessment[]
    side_effects: []

  # ── Test-driving endpoint ──
  - method: POST
    path: "/_clock/set_current_utc"
    description: "TEST-DRIVING: set the server's current UTC clock; triggers any time-gated auto-transitions in §1.2."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Server clock advances to to_iso8601"
      - "Re-evaluates all time-gated state-machine auto-transitions (PlanOfCare ACTIVE->RECERT_DUE, RECERT_DUE->EXPIRED, AuthorizationGrant ACTIVE->EXPIRED, VeteranReferral ISSUED->EXPIRED)"

# ─────────────────────────────────────────────────────────────────────────────
# §1.6  Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller's role not permitted for this endpoint, or Therapist X-User-ID does not match an existing Therapist"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Resource referenced by path id or body FK does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing or value out of declared type/range"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity's status does not permit the requested transition"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_of_care_version does not match current PlanOfCare.version"
  - id: ERR_VA_REFERRAL_REQUIRED
    http: 422
    condition: "Activating a VA_TRICARE PlanOfCare without a valid VeteranReferral linked"
  - id: ERR_VETERAN_FLAG_REQUIRED
    http: 422
    condition: "Creating a Patient with insurance_type=VA_TRICARE but is_veteran=false"
  - id: ERR_MIPS_ELIGIBILITY
    http: 422
    condition: "Creating/submitting a MIPS measure when Patient is non-MEDICARE or reporting therapist is not medicare_provider_enrolled"
  - id: ERR_CAPPED_POC_EXCEEDED
    http: 409
    condition: "Visit finalize attempted while PlanOfCare.capped_status == EXCEEDED"
  - id: ERR_THERAPIST_LICENSE_INVALID
    http: 422
    condition: "Therapist.license_state does not match required license state for the patient (per §1.4 priority 420 demo policy)"
  - id: ERR_VA_VISIT_CAP_EXCEEDED
    http: 409
    condition: "Creating a Visit that would exceed VeteranReferral.max_authorized_visits across linked Visits"
  - id: ERR_VISIT_OUT_OF_WINDOW
    http: 422
    condition: "Visit schedule outside AuthorizationGrant or PlanOfCare effective window"
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "Visit overlaps an existing Visit on the same Therapist under half-open interval semantics"
  - id: ERR_GRANT_WINDOW_OVERLAP
    http: 409
    condition: "AuthorizationGrant date range overlaps another grant for the same PlanOfCare under closed-closed semantics"
  - id: ERR_AUTHORIZATION_EXHAUSTED
    http: 409
    condition: "Visit complete/create would push grant.units_consumed past total_units_granted"
  - id: ERR_GOALS_INCONSISTENT
    http: 422
    condition: "DischargeAssessment.goals_met_count > total_goals_count"
  - id: ERR_RECERT_WINDOW_EXCEEDED
    http: 422
    condition: "Recertify payload's certified_end_date exceeds old certified_end_date + 90 days"

# ─────────────────────────────────────────────────────────────────────────────
# §1.7  RBAC Matrix
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: PlatformAdmin
    description: "System operator with override authority for adjudication and admin maintenance."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/mips-measures/{id}/adjudicate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /rehab/patients (with CaseManager)"
      - "POST /rehab/therapists (sole writer; but admin-only)"
      - "POST /rehab/veteran-referrals (with VAReferralCoordinator)"
      - "POST /rehab/veteran-referrals/{id}/cancel"
      - "POST /rehab/authorization-grants (with CaseManager)"
      - "POST /rehab/visits/{id}/cancel (with Therapist)"

  - name: CaseManager
    description: "Manages patient onboarding, scheduling support, and authorization paperwork."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/authorization-grants (shared with PlatformAdmin)"
    shared_operations:
      - "POST /rehab/patients"
      - "POST /rehab/plans-of-care"
      - "POST /rehab/visits"
      - "GET endpoints for patients/POCs/grants/visits/HEPs/discharge-assessments"

  - name: Therapist
    description: "Licensed physical therapist. Performs evaluations, prescribes HEPs, drives visit completion. Entity-backed identity: X-User-ID equals Therapist.id."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /rehab/evaluations"
      - "POST /rehab/plans-of-care/{id}/activate"
      - "POST /rehab/plans-of-care/{id}/recertify"
      - "POST /rehab/plans-of-care/{id}/discharge"
      - "POST /rehab/visits/{id}/complete"
      - "POST /rehab/visits/{id}/no-show"
      - "POST /rehab/home-exercise-programs"
      - "POST /rehab/mips-measures"
      - "POST /rehab/mips-measures/{id}/revise"
      - "POST /rehab/mips-measures/{id}/submit"
      - "POST /rehab/discharge-assessments"
    shared_operations:
      - "POST /rehab/plans-of-care"
      - "POST /rehab/visits"
      - "POST /rehab/visits/{id}/cancel"
      - "GET endpoints for patients/POCs/visits/HEPs"

  - name: BillingClerk
    description: "Finalizes completed visits for billing; sole writer of Visit COMPLETED -> FINALIZED."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/visits/{id}/finalize"
    shared_operations:
      - "GET endpoints for visits, plans-of-care, grants"

  - name: VAReferralCoordinator
    description: "VA-side coordinator issuing and cancelling veteran referrals."
    identity: opaque
    exclusive_operations:
      - "POST /rehab/veteran-referrals/{id}/cancel (shared with PlatformAdmin)"
    shared_operations:
      - "POST /rehab/veteran-referrals"
      - "GET endpoints for veteran-referrals, patients, POCs"
