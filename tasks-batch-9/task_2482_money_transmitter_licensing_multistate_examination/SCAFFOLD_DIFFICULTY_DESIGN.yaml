          assert:
            - "trigger call 1: HTTP 409 with error_id == ERR_EXPANSION_GATE_BLOCKED; DelegateAuthorization.${auth_id}.status stays PENDING_OVERSIGHT and StateLicense.${lic_ca_id}.active_delegate_count stays 0"
            - "after trigger call 2: StateLicense.${lic_ca_id}.reporting_status == CURRENT and expansion_gate == OPEN"
            - "trigger call 3: HTTP 200; DelegateAuthorization.${auth_id}.status == ACTIVE and oversight_score_at_activation == 85"
            - "Delegate.${del_id}.status == ACTIVE and authorized_state_count == 1"
