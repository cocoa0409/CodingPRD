            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu2}", element_type: "LAND_USE", title: "Riverside Land Use Element", draft_body: "Different jurisdiction.", policy_count: 4 }
              as: PlanningStaff
