            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S2", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot2: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot2}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTA_EXCEEDED"
            - "Dealer.${dlr1}.allocation_used == 1 (== quota boundary rejects)"
            - "First order remains ALLOCATED; second order is NOT persisted"

  # ========================================================================= rule 7
  # cross_entity_state_dependency: two dependencies on DIFFERENT entity pairs.
  - rule_id: cross_entity_state_dependency
    instances:
      - name: hull_delivery_gated_on_hull_certification_state
        grounds:
          - state_machines.Hull_delivery.AT_PLANT_to_DELIVERED
          - state_machines.Hull_certification
          - entities.Hull.fields.certification_status
        distinguishing_aspect: |
          Hull.delivery_status transition AT_PLANT -> DELIVERED depends on the SAME
          Hull's certification_status dimension (must be CERTIFIED, must not be
          RECALL_HOLD). Two parallel state dimensions on one entity — the deliver
          precondition reads the certification dimension. Entity pair: Hull.delivery
          x Hull.certification (parallel-dimensions variant of cross-entity state dep).
        test_recipe:
          setup:
            - "Order confirmed, hull H1 created (UNCERTIFIED, AT_PLANT)"
            - "Deliver attempt on UNCERTIFIED hull"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
          trigger:
            - call: "POST /hulls/${hull1}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HULL_NOT_CERTIFIED"
            - "Hull.${hull1}.delivery_status remains AT_PLANT"
            - "Hull.${hull1}.certification_status remains UNCERTIFIED"

      - name: hull_creation_gated_on_dealer_order_state
        grounds:
          - state_machines.DealerOrder.COMMITTED_to_IN_PRODUCTION
          - entities.DealerOrder.fields.status
        distinguishing_aspect: |
          Hull creation is gated on DealerOrder.status == COMMITTED — a cross-entity
          dependency on a DIFFERENT entity pair than instance 1 (Hull x DealerOrder
          rather than Hull.delivery x Hull.certification). Attempting POST /hulls for
          an ALLOCATED (unconfirmed) order must fail with ERR_INVALID_ORDER_STATE.
        test_recipe:
          setup:
            - "Order O1 booked but NOT confirmed (still ALLOCATED)"
            - "Attempt to create hull for O1"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
          trigger:
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE"
            - "Hull for order ${ord1} is NOT created"
            - "DealerOrder.${ord1}.status remains ALLOCATED"

  # ========================================================================= rule 8
  # resource_temporal_overlap: two overlap rules with DIFFERENT interval semantics
  # on DIFFERENT resource entities.
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_run_half_open_overlap
        grounds:
          - entities.ProductionRun.fields.build_week_start
          - entities.ProductionRun.fields.build_week_end
          - validations[priority=10]
        distinguishing_aspect: |
          ProductionRun uses HALF-OPEN interval [build_week_start, build_week_end):
          adjacent runs where one ends exactly when another starts (end == start) are
          ALLOWED; overlapping interiors are REJECTED. Different interval semantics
          from BoatShowEvent's closed interval.
        test_recipe:
          setup:
            - "Run R1 on line L1 [2026-08-03, 2026-08-10) created"
            - "Run R2 on line L1 [2026-08-10, 2026-08-17) — adjacent at boundary, half-open allows"
            - "Run R3 on line L1 [2026-08-09, 2026-08-16) — overlaps R1 interior, must reject"
          setup_api_calls:
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-10", build_week_end: "2026-08-17", option_change_cutoff_at: "2026-08-12T12:00:00Z" }
              as: ProductionPlanner
              captures: { run2: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-09", build_week_end: "2026-08-16", option_change_cutoff_at: "2026-08-11T12:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent run R2 (start == R1.end) is ACCEPTED (half-open boundary allows end==start)"
            - "Overlapping run R3 is rejected with error_id == ERR_LINE_WINDOW_OVERLAP"
            - "ProductionRun.${run1} and ProductionRun.${run2} both exist with status OPEN"

      - name: boat_show_closed_interval_overlap
        grounds:
          - entities.BoatShowEvent.fields.start_date
          - entities.BoatShowEvent.fields.end_date
          - validations[priority=10]
        distinguishing_aspect: |
          BoatShowEvent uses CLOSED interval [start_date, end_date] inclusive BOTH
          ends: two shows sharing even ONE day in the same region conflict. Different
          semantics from ProductionRun's half-open: end==start is a conflict here,
          not allowed. Resource entity differs (BoatShowEvent vs ProductionRun).
        test_recipe:
          setup:
            - "Show E1 in region SE [2026-08-10, 2026-08-15] created"
            - "Show E2 in region SE [2026-08-15, 2026-08-20] — shares single day 2026-08-15, must conflict under closed semantics"
            - "Show E3 in region SE [2026-08-16, 2026-08-20] — disjoint, accepted"
          setup_api_calls:
            - call: "POST /boat-show-events"
              payload: { event_name: "Miami Show", region: "SE", start_date: "2026-08-10", end_date: "2026-08-15", surge_deposit_rate: 0.05, allocation_boost: 1 }
              as: AllocationManager
              captures: { evt1: $.data.id }
          trigger:
            - call: "POST /boat-show-events"
              payload: { event_name: "Tampa Show", region: "SE", start_date: "2026-08-15", end_date: "2026-08-20", surge_deposit_rate: 0.05, allocation_boost: 1 }
              as: AllocationManager
              captures: { err: $.data.error_id }
            - call: "POST /boat-show-events"
              payload: { event_name: "Jacksonville Show", region: "SE", start_date: "2026-08-16", end_date: "2026-08-20", surge_deposit_rate: 0.05, allocation_boost: 1 }
              as: AllocationManager
              captures: { evt3: $.data.id }
          assert:
            - "Show E2 sharing day 2026-08-15 with E1 is rejected: error_id == ERR_SHOW_WINDOW_OVERLAP"
            - "Show E3 (starts 2026-08-16, after E1's end 2026-08-15) is ACCEPTED"
            - "BoatShowEvent.${evt1} and BoatShowEvent.${evt3} both exist"

  # ========================================================================= rule 9
  # compensating_invariant: two invariants on DIFFERENT conserved quantities.
  - rule_id: compensating_invariant
    instances:
      - name: slot_reserved_hours_conservation_across_amend_and_cancel
        grounds:
          - entities.BuildSlot.fields.reserved_hours
          - state_machines.DealerOrder.ALLOCATED_to_ALLOCATED
          - state_machines.DealerOrder.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: BuildSlot.reserved_hours. Forward action: book order with
          hours H -> reserved += H. Compensating: amend to change hours (delta adjusts
          reserved), then cancel -> reserved -= current_hours. Net change MUST be zero
          from initial state. Pinned formula: reserved_hours_after_cancel ==
          reserved_hours_initial.
        test_recipe:
          setup:
            - "Slot S1 cap 200, initial reserved_hours = 0"
            - "Order with TOWER (46h) -> reserved 46; amend adding BALLAST (50h) -> reserved 50"
            - "Cancel order -> reserved returns to 0"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_tower}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id, ord_v1: $.data.version }
            - call: "GET /build-slots/${slot1}"
              payload: {}
              as: Any
              captures: { reserved_after_book: $.data.reserved_hours }
            - call: "PATCH /dealer-orders/${ord1}"
              payload: { expected_order_version: "${ord_v1}", option_package_ids: ["${opt_tower}", "${opt_ballast}"], deposit_paid_cents: 309361 }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "GET /build-slots/${slot1}"
              payload: {}
              as: Any
              captures: { reserved_after_amend: $.data.reserved_hours }
          trigger:
            - call: "POST /dealer-orders/${ord1}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "GET /build-slots/${slot1}"
              payload: {}
              as: Any
              captures: { reserved_after_cancel: $.data.reserved_hours }
          assert:
            - "After book: BuildSlot.${slot1}.reserved_hours == 46"
            - "After amend (add BALLAST): reserved_hours == 50 (delta +4)"
            - "After cancel: reserved_hours == 0 (initial state restored; conservation invariant held)"
            - "DealerOrder.${ord1}.status == CANCELLED"

      - name: dealer_floor_plan_utilization_conservation_across_deliver_and_curtail
        grounds:
          - entities.Dealer.fields.floor_plan_utilized_cents
          - entities.FloorPlanAdvance.fields.outstanding_principal_cents
          - state_machines.FloorPlanAdvance.OPEN_to_PAID
        distinguishing_aspect: |
          Conserved quantity: Dealer.floor_plan_utilized_cents. Forward: deliver opens
          advance with principal P -> utilized += P. Compensating: full curtailment
          covering principal + interest -> utilized -= P. Net change MUST be zero from
          initial state. Different conserved quantity than slot hours (money vs hours)
          and different forward/compensating pair.
        test_recipe:
          setup:
            - "Dealer D1 limit 10000000; hull delivered at clock 2026-08-02 -> advance principal 2575000 (base-only order), utilized 2575000"
            - "Clock advanced 10 days to 2026-08-12; interest accrued"
            - "Curtailment paying principal + accrued interest -> utilized returns to 0; advance PAID"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 257500, option_package_ids: [], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
            - call: "POST /hulls/${hull1}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /hulls/${hull1}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
            - call: "GET /dealers/${dlr1}"
              payload: {}
              as: Any
              captures: { dlr_util_after_deliver: $.data.floor_plan_utilized_cents, dlr_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /dealers/${dlr1}/curtailments"
              payload: { expected_dealer_version: "${dlr_v}", amount_cents: 2579233 }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "GET /dealers/${dlr1}"
              payload: {}
              as: Any
              captures: { dlr_util_after_curtail: $.data.floor_plan_utilized_cents }
          assert:
            - "After deliver: Dealer.${dlr1}.floor_plan_utilized_cents == 2575000"
            - "After full-principal curtailment: floor_plan_utilized_cents == 0 (conservation invariant held)"
            - "FloorPlanAdvance for Hull.${hull1}.status == PAID (outstanding_principal_cents == 0)"
