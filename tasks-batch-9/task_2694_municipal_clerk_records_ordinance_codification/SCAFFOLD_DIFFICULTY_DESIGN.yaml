      - name: meeting_returns_from_noticed_to_scheduled_and_is_re_noticed_by_revision_two
        grounds:
          - state_machines.Meeting.NOTICED_to_SCHEDULED
          - state_machines.AgendaPacket.POSTED_to_WITHDRAWN
          - state_machines.PublicationNotice.DRAFT_to_VOID
          - entities.AgendaPacket.fields.revision_number
          - entities.Meeting.fields.notice_compliant
        distinguishing_aspect: |
          Meeting walks the backward edge NOTICED -> SCHEDULED, which no forward
          reading of the machine allows: withdrawing the POSTED packet strips
          notice_posted_at, sets notice_compliant back to false and VOIDs the
          MEETING_AGENDA notice, after which a second packet revision re-notices
          the same meeting. The end state is NOTICED again but the object graph
          is different — two packets (one WITHDRAWN, one POSTED at
          revision_number 2) and two notices (one VOID, one DRAFT).
