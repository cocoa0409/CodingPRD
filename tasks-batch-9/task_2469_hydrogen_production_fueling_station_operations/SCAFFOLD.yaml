    path: "/incentive-claims/{id}"
    description: "Read one incentive claim including credit netting"
    roles: [PlatformAdmin, ComplianceAdmin, ProgramAuditor]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects: []
  - method: GET
    path: "/uptime-reports/{id}"
    description: "Read one uptime report including both uptime variants and the penalty"
    roles: [PlatformAdmin, ComplianceAdmin, ProgramAuditor]
    code: 200
    input: []
    output: UptimeReport
    side_effects: []
  - method: GET
    path: "/uptime-reports"
    description: "List uptime reports; FK reverse-reachability for UptimeReport.station_id, UptimeReport.funding_agreement_id and UptimeReport.amended_from_report_id"
    roles: [PlatformAdmin, ComplianceAdmin, ProgramAuditor]
    code: 200
    input: ["station_id?", "funding_agreement_id?", "amended_from_report_id?", "status?", "limit?", "offset?"]
    output: UptimeReport[]
    side_effects: []

  # ---------- writes: configuration ----------
  - method: POST
    path: "/funding-agreements"
    description: "Create a funding agreement with its uptime floor, penalty rate and holdback pool"
    roles: [PlatformAdmin]
    code: 201
    input: [agreement_code, funder_name, min_uptime_pct, penalty_per_point_cents, initial_holdback_cents, uptime_method]
    output: FundingAgreement
    side_effects: ["holdback_balance_cents initialised to initial_holdback_cents"]
  - method: POST
    path: "/stations"
    description: "Create a station under a funding agreement"
    roles: [PlatformAdmin]
    code: 201
    input: [funding_agreement_id, code, name, nozzle_count, offload_bay_count, storage_capacity_kg, reserve_floor_kg, max_pressure_class, "setback_compliant?"]
    output: Station
    side_effects:
      - "ventilation_status = NORMAL, leak_detection_status = NORMAL, compressor_status = ONLINE"
      - "safety_posture computed — RESTRICTED at birth because high_bank_deliverable_kg is 0.000, which is below MIN_HIGH_BANK_DELIVERABLE_KG"
      - "all inventory and metering aggregates initialised to 0.000; supply_alert computed"
  - method: POST
    path: "/stations/{id}/pressure-vessels"
    description: "Commission a pressure vessel on a station and seed its opening inventory"
    roles: [PlatformAdmin, SafetyOfficer]
    code: 201
    input: [bank_tier, water_volume_l, mawp_bar, min_residual_bar, initial_pressure_bar, next_inspection_due_date]
    output: PressureVessel
    side_effects:
      - "current_pressure_bar = initial_pressure_bar; stored_mass_kg computed; inspection_count = 0; inspection_status computed"
      - "appends an InventoryLedgerEntry with reason OPENING_BALANCE, source_ref_type PRESSURE_VESSEL, source_ref_id = the new vessel id, delta_kg = stored_mass_kg"
      - "recomputes Station.onsite_inventory_kg / available_kg / total_deliverable_kg / high_bank_deliverable_kg / projected_available_kg / supply_alert / safety_posture"
      - "increments Station.version by 1"
  - method: POST
    path: "/pressure-vessels/{id}/inspections"
    description: "Record a periodic pressure-vessel inspection; PASS resets the clock, CONDEMN retires the vessel and vents its contents"
    roles: [SafetyOfficer]
    code: 200
    input: [outcome, "next_due_date?"]
    output: PressureVessel
    side_effects:
      - "outcome == PASS: last_inspection_date = clock date, next_inspection_due_date = next_due_date, inspection_count += 1, inspection_status = CURRENT"
      - "outcome == CONDEMN: inspection_status = CONDEMNED, current_pressure_bar = 0.00, appends an InventoryLedgerEntry with reason INSPECTION_VENT and delta_kg = -stored_mass_kg"
      - "recomputes Station.onsite_inventory_kg / total_deliverable_kg / high_bank_deliverable_kg / projected_available_kg / supply_alert / safety_posture"
      - "increments Station.version by 1"
  - method: POST
    path: "/stations/{id}/responder-certifications"
    description: "Record an emergency-response certification for a station responder"
    roles: [SafetyOfficer, PlatformAdmin]
    code: 201
    input: [responder_ref, cert_type, valid_from, expires_on]
    output: ResponderCertification
    side_effects: ["is_current computed against the logical clock date"]
  - method: POST
    path: "/production-assets"
    description: "Register a hydrogen production asset and its pathway"
    roles: [PlatformAdmin, ProductionEngineer]
    code: 201
    input: [asset_code, pathway, nameplate_kg_per_day, "ccs_capture_rate?", operator_org]
    output: ProductionAsset
    side_effects: []
  - method: POST
    path: "/production-assets/{id}/power-supply-contracts"
    description: "Attach a power supply contract to a production asset"
    roles: [ProductionEngineer, PlatformAdmin]
    code: 201
    input: [contract_code, grid_ci_gco2e_per_mwh, annual_renewable_pct, hourly_matched_renewable_pct, "hourly_matching_enabled?", effective_from, effective_to]
    output: PowerSupplyContract
    side_effects: ["validated against validations[priority=170] exclusive-with-buffer overlap on the asset"]

  # ---------- writes: production and quality ----------
  - method: POST
    path: "/production-lots"
    description: "Record a production lot; the server selects the governing power contract and stamps the provisional carbon intensity"
    roles: [ProductionEngineer]
    code: 201
    input: [production_asset_id, lot_code, mass_kg, energy_consumed_kwh, "feedstock_consumed_mmbtu?", "predecessor_lot_id?", "carryover_kg?", production_start_at, production_end_at]
    output: ProductionLot
    side_effects:
      - "runs calculations.production_lot_carbon_intensity STEP 1 to set selected_power_contract_id"
      - "stamps ci_provisional_gco2e_per_mj using the ANNUAL_AVERAGE variant"
      - "qa_status = PENDING, ci_status = PENDING, status = PRODUCED, accepted_delivered_kg = 0.000"
  - method: POST
    path: "/production-lots/{id}/purity-tests"
    description: "Record a fuel-cell-grade purity test against a lot (qa branch)"
    roles: [QualityAnalyst]
    code: 201
    input: [sampled_at, total_hydrocarbons_ppm, water_ppm, oxygen_ppm, nitrogen_ppm, carbon_monoxide_ppm, carbon_dioxide_ppm, total_sulfur_ppm, "ammonia_ppm?", "helium_ppm?"]
    output: PurityTest
    side_effects:
      - "computes verdict, failing_analytes, purity_margin_pct per calculations.purity_verdict"
      - "records performed_by_user_id = X-User-ID"
      - "verdict PASS: ProductionLot.qa_status = PASSED; verdict INDETERMINATE: qa_status stays PENDING; verdict FAIL: qa_status = FAILED and ProductionLot.status = REJECTED"
      - "increments ProductionLot.version by 1"
  - method: POST
    path: "/production-lots/{id}/certify-ci"
    description: "Certify the lot's carbon intensity using the variant its power contract selects (ci branch)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects:
      - "sets ci_variant_applied and ci_certified_gco2e_per_mj per calculations.production_lot_carbon_intensity"
      - "ci_status = CERTIFIED"
      - "increments ProductionLot.version by 1"
  - method: POST
    path: "/production-lots/{id}/release"
    description: "Release the lot for delivery once both the qa and ci branches are complete (join)"
    roles: [QualityAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects:
      - "status = RELEASED, released_by_user_id = X-User-ID"
      - "increments ProductionLot.version by 1"

  # ---------- writes: delivery logistics ----------
  - method: POST
    path: "/deliveries"
    description: "Book a delivery of a lot into a station's receiving vessel within an offload-bay window"
    roles: [LogisticsDispatcher]
    code: 201
    input: [station_id, production_lot_id, receiving_vessel_id, mode, planned_kg, window_start, window_end, departed_at, "trailer_water_volume_l?", "trailer_final_pressure_bar?"]
    output: Delivery
    side_effects:
      - "status = SCHEDULED, reschedule_count = 0"
      - "recomputes Station.inbound_planned_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"
  - method: POST
    path: "/deliveries/{id}/arrive"
    description: "Record arrival inside the booked window and compute the transit loss terms"
    roles: [LogisticsDispatcher]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "arrived_at = logical clock; transit_hours, heel_kg, boiloff_kg, net_receipt_kg computed per calculations.delivery_net_receipt"
      - "status = ARRIVED"
  - method: POST
    path: "/deliveries/{id}/offload"
    description: "Offload an arrived delivery into the receiving vessel and credit station inventory"
    roles: [StationOperator]
    code: 200
    input: []
    output: Delivery
    side_effects:
      - "status = ACCEPTED, accepted_at = logical clock"
      - "receiving PressureVessel.current_pressure_bar and stored_mass_kg increased by net_receipt_kg"
      - "appends an InventoryLedgerEntry with reason DELIVERY_RECEIPT (delta_kg = +net_receipt_kg) and a second entry with reason HEEL_RETURNED or BOILOFF_LOSS (delta_kg = 0.000) recording the loss term"
      - "recomputes Station.onsite_inventory_kg / available_kg / total_deliverable_kg / high_bank_deliverable_kg / inbound_planned_kg / projected_available_kg / supply_alert / safety_posture"
      - "recomputes ProductionLot.accepted_delivered_kg and may transition the lot RELEASED -> CONSUMED"
      - "increments Station.version by 1"
  - method: POST
    path: "/deliveries/{id}/reject"
    description: "Refuse an arrived load; PURITY_FAIL quarantines it permanently, other reasons leave it reschedulable"
    roles: [StationOperator]
    code: 200
    input: [reject_reason]
    output: Delivery
    side_effects:
      - "status = QUARANTINED when reject_reason == PURITY_FAIL, else REJECTED"
      - "recomputes Station.inbound_planned_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"
  - method: POST
    path: "/deliveries/{id}/reschedule"
    description: "Rebook a rejected delivery into a new offload-bay window"
    roles: [LogisticsDispatcher]
    code: 200
    input: [window_start, window_end]
    output: Delivery
    side_effects:
      - "window_start / window_end replaced; reschedule_count += 1; arrived_at, transit_hours, heel_kg, boiloff_kg, net_receipt_kg, reject_reason reset to null; status = SCHEDULED"
      - "recomputes Station.inbound_planned_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"

  # ---------- writes: dispensing ----------
  - method: POST
    path: "/dispense-sessions"
    description: "Open a dispensing session, reserving mass against station inventory (OCC-guarded on Station.version)"
    roles: [StationOperator]
    code: 201
    input: [station_id, vehicle_class, target_pressure_class, fill_protocol, planned_kg, ambient_temp_c, expected_station_version]
    output: DispenseSession
    side_effects:
      - "required_precool_c computed per calculations.required_precool_temperature"
      - "fill_status = PRECOOLING, billing_status = PENDING, started_at = logical clock"
      - "recomputes Station.reserved_kg / available_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"
  - method: POST
    path: "/dispense-sessions/{id}/fuel"
    description: "Start fuelling once the precool target is met"
    roles: [StationOperator]
    code: 200
    input: [precool_temp_achieved_c]
    output: DispenseSession
    side_effects: ["precool_temp_achieved_c stored; fill_status = FUELING; billing_status unchanged"]
  - method: POST
    path: "/dispense-sessions/{id}/complete"
    description: "Close the fill: allocate the cascade, correct the meter reading and draw down inventory"
    roles: [StationOperator]
    code: 200
    input: [metered_kg, avg_dispense_pressure_bar, final_pressure_bar]
    output: DispenseSession
    side_effects:
      - "runs calculations.cascade_fill_allocation to set cascade_plan, direct_cascade_kg, compressor_makeup_kg and decrement every vessel in the plan"
      - "runs calculations.dispense_metered_mass_correction to set density_correction_factor, corrected_kg, metering_error_pct, metering_within_tolerance"
      - "appends an InventoryLedgerEntry with reason DISPENSE_DRAW and delta_kg = -metered_kg"
      - "fill_status = COMPLETED; billing_status stays PENDING"
      - "recomputes Station.onsite_inventory_kg / reserved_kg / available_kg / total_deliverable_kg / high_bank_deliverable_kg / projected_available_kg / supply_alert / safety_posture"
      - "increments Station.version by 1"
  - method: POST
    path: "/dispense-sessions/{id}/abort"
    description: "Abandon a session before completion and release its reservation"
    roles: [StationOperator]
    code: 200
    input: []
    output: DispenseSession
    side_effects:
      - "fill_status = ABORTED, abort_reason = OPERATOR_ABORT; billing_status PENDING -> VOIDED"
      - "recomputes Station.reserved_kg / available_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"
  - method: POST
    path: "/dispense-sessions/{id}/meter-settlement"
    description: "Settle a completed fill at its corrected mass, booking the meter correction to the ledger"
    roles: [StationOperator, ComplianceAdmin]
    code: 200
    input: []
    output: DispenseSession
    side_effects:
      - "billing_status PENDING -> METERED"
      - "appends an InventoryLedgerEntry with reason METER_CORRECTION and delta_kg = metered_kg - corrected_kg"
      - "recomputes Station.onsite_inventory_kg / available_kg / projected_available_kg / supply_alert; also recomputes metered_kg_mtd, corrected_kg_mtd and metering_error_pct_mtd per calculations.metering_accuracy_rollup"
      - "increments Station.version by 1"
  - method: POST
    path: "/dispense-sessions/{id}/void-meter"
    description: "Reverse a metered settlement, restoring the exact mass the correction moved"
    roles: [ComplianceAdmin]
    code: 200
    input: [void_reason]
    output: DispenseSession
    side_effects:
      - "billing_status METERED -> VOIDED"
      - "appends an InventoryLedgerEntry with reason METER_VOID_REVERSAL and delta_kg = corrected_kg - metered_kg, the exact additive inverse of the METER_CORRECTION entry"
      - "recomputes Station.onsite_inventory_kg / available_kg / projected_available_kg / supply_alert and the metering rollup, which now excludes this session"
      - "increments Station.version by 1"

  # ---------- writes: safety ----------
  - method: POST
    path: "/safety-events"
    description: "Open a safety event; a CRITICAL leak freezes the station and aborts every in-flight fill"
    roles: [SafetyOfficer, StationOperator]
    code: 201
    input: [station_id, kind, severity, affected_nozzle_count, detected_by]
    output: SafetyEvent
    side_effects:
      - "status = OPEN, opened_by_user_id = X-User-ID, opened_at = logical clock (inclusive start of the downtime interval)"
      - "kind == LEAK_DETECTED: Station.leak_detection_status = ALARM; kind == VENTILATION_FAULT: Station.ventilation_status = FAULT; kind == COMPRESSOR_FAULT: Station.compressor_status = OFFLINE; kind == SETBACK_BREACH: Station.setback_compliant = false"
      - "recomputes Station.safety_posture per calculations.station_safety_posture"
      - "if the recomputed posture is FROZEN, every DispenseSession on the station whose fill_status is PRECOOLING or FUELING moves to fill_status ABORTED with abort_reason STATION_FROZEN, and each of those sessions whose billing_status is PENDING moves to VOIDED"
      - "recomputes Station.reserved_kg / available_kg / projected_available_kg / supply_alert"
      - "increments Station.version by 1"
  - method: POST
    path: "/safety-events/{id}/acknowledge"
    description: "Acknowledge an open safety event"
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: SafetyEvent
    side_effects: ["status = ACKNOWLEDGED; acknowledged_at = logical clock"]
  - method: POST
    path: "/safety-events/{id}/clear"
    description: "Clear an acknowledged safety event and let the station's posture recover"
    roles: [SafetyOfficer]
    code: 200
    input: [corrective_action]
    output: SafetyEvent
    side_effects:
      - "status = CLEARED; cleared_at = logical clock (exclusive end of the downtime interval, so the accrued outage length is cleared_at - opened_at); cleared_by_user_id = X-User-ID; corrective_action stored"
      - "when no OPEN or ACKNOWLEDGED event of the same kind remains on the station, the matching Station field returns to NORMAL / ONLINE / setback_compliant = true"
      - "recomputes Station.safety_posture; aborted sessions are not resumed"
      - "increments Station.version by 1"

  # ---------- writes: incentive program ----------
  - method: POST
    path: "/incentive-claims"
    description: "Submit a low-carbon fuel credit claim for a station period against certified lots"
    roles: [ComplianceAdmin]
    code: 201
    input: [station_id, program, period_start, period_end, production_lot_ids]
    output: IncentiveClaim
    side_effects:
      - "status = SUBMITTED, revision_round = 0, submitted_by_user_id = X-User-ID"
      - "computes dispensed_kg, pathway_ci_gco2e_per_mj, energy_mj, gross_credits_mt, admin_fee_rate, admin_fee_mt and net_credits_mt per calculations.incentive_credit_netting"
  - method: POST
    path: "/incentive-claims/{id}/request-revision"
    description: "Send a submitted claim back for revision"
    roles: [ProgramAuditor]
    code: 200
    input: [revision_note]
    output: IncentiveClaim
    side_effects:
      - "revision_note stored; revision_round += 1"
      - "status = REVISION_REQUESTED when revision_round was < MAX_REVISION_ROUNDS before the increment"
      - "status = DENIED (terminal auto-denial, no error) when revision_round was == MAX_REVISION_ROUNDS before the increment"
  - method: POST
    path: "/incentive-claims/{id}/resubmit"
    description: "Resubmit a claim after revision, recomputing every credit term"
    roles: [ComplianceAdmin]
    code: 200
    input: [production_lot_ids]
    output: IncentiveClaim
    side_effects:
      - "status = SUBMITTED; production_lot_ids replaced"
      - "recomputes dispensed_kg, pathway_ci_gco2e_per_mj, energy_mj, gross_credits_mt, admin_fee_rate, admin_fee_mt, net_credits_mt"
  - method: POST
    path: "/incentive-claims/{id}/certify"
    description: "Certify a submitted claim's carbon-intensity basis"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects:
      - "status = CERTIFIED; certified_by_user_id = X-User-ID"
      - "the DispenseSession rows covered by the claim period become ineligible for void-meter"
  - method: POST
    path: "/incentive-claims/{id}/issue-credits"
    description: "Issue the net credits of a certified claim"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: IncentiveClaim
    side_effects:
      - "status = CREDITS_ISSUED (terminal)"
      - "Station.credits_issued_total_mt recomputed to include net_credits_mt"
      - "increments Station.version by 1"

  # ---------- writes: uptime reporting ----------
  - method: POST
    path: "/uptime-reports"
    description: "Draft a station uptime report for a period (OCC-guarded on FundingAgreement.version)"
    roles: [ComplianceAdmin, StationOperator]
    code: 201
    input: [station_id, funding_agreement_id, period_start, period_end, expected_funding_agreement_version]
    output: UptimeReport
    side_effects:
      - "status = DRAFT"
      - "snapshots nozzle_count_snapshot = Station.nozzle_count and computes downtime_nozzle_minutes, full_outage_minutes, uptime_pct_nozzle_weighted, uptime_pct_station_level, uptime_pct and shortfall_points per calculations.station_uptime_pct"
      - "penalty_cents stays 0 while status == DRAFT; nothing is charged against the holdback until finalize"
      - "increments FundingAgreement.version by 1"
  - method: POST
    path: "/uptime-reports/{id}/finalize"
    description: "Finalize a draft uptime report and charge its penalty against the agreement holdback"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: UptimeReport
    side_effects:
      - "status = FINAL"
      - "stamps penalty_cents per calculations.funding_penalty, clamped to the holdback remaining before this report"
      - "recomputes FundingAgreement.holdback_balance_cents as MAX(0, initial_holdback_cents - SUM(penalty_cents of reports whose status is FINAL))"
      - "increments FundingAgreement.version by 1"
  - method: POST
    path: "/uptime-reports/{id}/amend"
    description: "Supersede a final report with an amendment, reversing the superseded report's penalty"
    roles: [ComplianceAdmin]
    code: 201
    input: [period_start, period_end, amend_reason]
    output: UptimeReport
    side_effects:
      - "the cited report moves FINAL -> AMENDED and stops counting toward the holdback charge"
      - "creates a new DRAFT UptimeReport whose amended_from_report_id is the cited report and whose metrics are recomputed from current SafetyEvent data"
      - "recomputes FundingAgreement.holdback_balance_cents, which restores the superseded penalty because AMENDED reports are excluded from the charge"
      - "increments FundingAgreement.version by 1"

  # ---------- logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The logical clock defaults to 2026-08-01T00:00:00Z until this endpoint is called, and every date-sensitive computation (vessel inspection status, responder certification currency, delivery window checks, arrival transit hours, certification expiry) reads it rather than wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, vessels_recomputed: integer, stations_recomputed: integer }"
    side_effects:
      - "recomputes PressureVessel.inspection_status for every non-CONDEMNED vessel against the new date"
      - "recomputes ResponderCertification.is_current for every certification"
      - "recomputes Station.safety_posture for every station, and with it the trained-responder count that validations[priority=110] reads from ResponderCertification.is_current"

# =============================================================================
# 1.7 RBAC Permission Matrix
# Header: X-User-Role (required on every call), X-User-ID (required on every call;
# identifies the acting person for the three segregation-of-duties triples).
# role_model: segregation_of_duties — no role is a superset of another, and three
# operation pairs additionally forbid the SAME X-User-ID from performing both halves.
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Configures the estate: funding agreements, stations, production assets and the logical clock. Cannot dispense, test, release or adjudicate."
    identity: opaque
    exclusive_operations:
      - "POST /funding-agreements"
      - "POST /stations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /stations/{id}/pressure-vessels (with SafetyOfficer)"
      - "POST /stations/{id}/responder-certifications (with SafetyOfficer)"
      - "POST /production-assets (with ProductionEngineer)"
      - "POST /production-assets/{id}/power-supply-contracts (with ProductionEngineer)"
      - "all GET endpoints"
  - name: StationOperator
    description: "Station-side operator. Runs fills, offloads and refusals, and may open safety events. Identity is bound to a Station, so an operator may only act on that station's resources."
    identity: "entity_backed:Station"
    exclusive_operations:
      - "POST /dispense-sessions"
      - "POST /dispense-sessions/{id}/fuel"
      - "POST /dispense-sessions/{id}/complete"
      - "POST /dispense-sessions/{id}/abort"
      - "POST /deliveries/{id}/offload"
      - "POST /deliveries/{id}/reject"
    shared_operations:
      - "POST /dispense-sessions/{id}/meter-settlement (with ComplianceAdmin)"
      - "POST /safety-events (with SafetyOfficer)"
      - "POST /uptime-reports (with ComplianceAdmin)"
      - "all GET endpoints scoped to the bound station"
  - name: ProductionEngineer
    description: "Owns production assets, power supply contracts and lot creation. Cannot test purity, certify carbon intensity or dispense."
    identity: opaque
    exclusive_operations:
      - "POST /production-lots"
    shared_operations:
      - "POST /production-assets (with PlatformAdmin)"
      - "POST /production-assets/{id}/power-supply-contracts (with PlatformAdmin)"
      - "all GET endpoints"
  - name: QualityAnalyst
    description: "Performs fuel-cell-grade purity testing. May release a lot, but never the lot whose purity test they themselves performed."
    identity: opaque
    exclusive_operations:
      - "POST /production-lots/{id}/purity-tests"
    shared_operations:
      - "POST /production-lots/{id}/release (with ComplianceAdmin; blocked when X-User-ID equals PurityTest.performed_by_user_id of any test on the lot)"
      - "all GET endpoints"
  - name: SafetyOfficer
    description: "Owns pressure-vessel inspections, responder certifications and the safety-event lifecycle. May not clear an event they opened."
    identity: opaque
    exclusive_operations:
      - "POST /pressure-vessels/{id}/inspections"
      - "POST /safety-events/{id}/acknowledge"
      - "POST /safety-events/{id}/clear"
    shared_operations:
      - "POST /stations/{id}/pressure-vessels (with PlatformAdmin)"
      - "POST /stations/{id}/responder-certifications (with PlatformAdmin)"
      - "POST /safety-events (with StationOperator)"
      - "all GET endpoints"
  - name: ComplianceAdmin
    description: "Owns carbon-intensity certification of lots, incentive claim submission, meter voids and uptime reporting. Cannot certify or issue the claims they submit."
    identity: opaque
    exclusive_operations:
      - "POST /production-lots/{id}/certify-ci"
      - "POST /incentive-claims"
      - "POST /incentive-claims/{id}/resubmit"
      - "POST /dispense-sessions/{id}/void-meter"
      - "POST /uptime-reports/{id}/finalize"
      - "POST /uptime-reports/{id}/amend"
    shared_operations:
      - "POST /production-lots/{id}/release (with QualityAnalyst)"
      - "POST /dispense-sessions/{id}/meter-settlement (with StationOperator)"
      - "POST /uptime-reports (with StationOperator)"
      - "all GET endpoints"
  - name: LogisticsDispatcher
    description: "Books, dispatches and rebooks deliveries. Cannot offload or refuse a load at the station."
    identity: opaque
    exclusive_operations:
      - "POST /deliveries"
      - "POST /deliveries/{id}/arrive"
      - "POST /deliveries/{id}/reschedule"
    shared_operations:
      - "all GET endpoints"
  - name: ProgramAuditor
    description: "Independent adjudicator of incentive claims. Read-only everywhere else; never submits a claim. May not certify a claim they submitted, which the segregation rule enforces by X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /incentive-claims/{id}/request-revision"
      - "POST /incentive-claims/{id}/certify"
      - "POST /incentive-claims/{id}/issue-credits"
    shared_operations:
      - "all GET endpoints"
