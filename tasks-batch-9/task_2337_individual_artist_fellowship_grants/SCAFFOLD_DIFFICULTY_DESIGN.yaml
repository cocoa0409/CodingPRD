            - { call: "POST /grants/work-samples", payload: { application_id: "${appB}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 10, contains_identifying_metadata: false }, as: Artist, as_user_id: "${artB}" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${appB}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 10, contains_identifying_metadata: false }, as: Artist, as_user_id: "${artB}" }
            - { call: "POST /grants/applications/${appB}/submit", payload: {}, as: Artist, as_user_id: "${artB}" }
            - { call: "POST /grants/artists", payload: { legal_name: "Cyril Adeyemi", email: "cyril.adeyemi@example.org", residency_start_date: "2024-10-16", residency_county: "Rivermouth", region: SOUTH, is_enrolled_student: false, tin_status: ON_FILE }, as: ProgramOfficer, as_user_id: "officer-1", captures: { artC: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${artC}", artist_statement: "A verse sequence about ferry timetables.", career_narrative: "Recent arrival to the state, previously published abroad." }, as: Artist, as_user_id: "${artC}", captures: { appC: "$.data.id" } }
            - { call: "POST /grants/work-samples", payload: { application_id: "${appC}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 9, contains_identifying_metadata: false }, as: Artist, as_user_id: "${artC}" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${appC}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 9, contains_identifying_metadata: false }, as: Artist, as_user_id: "${artC}" }
            - { call: "POST /grants/applications/${appC}/submit", payload: {}, as: Artist, as_user_id: "${artC}" }
            - *k_clock_oct16
            - *k_close_cycle
          trigger:
            - { call: "GET /grants/applications/${appB}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${appC}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/applications/${appB}/eligibility", payload: { determination: ELIGIBLE }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/applications/${appC}/eligibility", payload: { determination: ELIGIBLE }, as: ProgramOfficer, as_user_id: "officer-1", captures: { err_crit: "$.data.error_id" } }
            - { call: "POST /grants/applications/${appC}/eligibility", payload: { determination: INELIGIBLE, ineligibility_reason_code: ENROLLED_STUDENT }, as: ProgramOfficer, as_user_id: "officer-1", captures: { err_reason: "$.data.error_id" } }
            - { call: "POST /grants/applications/${appC}/eligibility", payload: { determination: INELIGIBLE, ineligibility_reason_code: RESIDENCY_DURATION }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "appB.residency_months_at_deadline == 24 and appC.residency_months_at_deadline == 23"
            - "appB becomes ELIGIBLE with eligibility_determined_by officer-1"
            - "Requesting ELIGIBLE for appC returns 422 ERR_ELIGIBILITY_CRITERIA_NOT_MET and leaves it SUBMITTED"
            - "Requesting INELIGIBLE with reason ENROLLED_STUDENT returns 422 ERR_INELIGIBILITY_REASON_UNSUPPORTED — artC.is_enrolled_student is false, so that criterion does not actually fail"
            - "Requesting INELIGIBLE with reason RESIDENCY_DURATION succeeds; appC.status == INELIGIBLE and ineligibility_reason_code == RESIDENCY_DURATION"
            - "DisciplineCategory.eligible_application_count == 1 — only appB counted"

      - name: diversity_evaluation_on_an_empty_pool_returns_nulls_not_zeros
        grounds:
          - calculations.cycle_diversity_evaluation
          - endpoints[GET /grants/cycles/{cycle_id}/evaluation]
        distinguishing_aspect: |
          With no application outside DRAFT/WITHDRAWN/INELIGIBLE the pool is empty, so the HHI
          and both derived rates are undefined rather than zero. The contract requires nulls and
          empty breakdown arrays; a naive implementation divides by zero or reports
          region_hhi 0 with geographic_distribution_score 125.00, which would read as perfect
          geographic diversity for a cycle with no applicants at all.
        test_recipe:
          setup:
            - "CycleMain and its LITERARY_ARTS discipline exist; no application has been created"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
          trigger:
            - { call: "GET /grants/cycles/${cyc}/evaluation", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "200 with eligible_pool_size == 0"
            - "region_hhi is null, geographic_distribution_score is null and funded_rate is null — not 0, not 125.00"
            - "region_breakdown == [] and discipline_breakdown == [] even though one DisciplineCategory is registered"

      - name: hhi_score_consumes_the_rounded_hhi_not_the_raw_share_sum
        grounds:
          - calculations.cycle_diversity_evaluation
          - endpoints[GET /grants/cycles/{cycle_id}/evaluation]
        distinguishing_aspect: |
          A 2-NORTH / 1-SOUTH pool gives a raw share sum of 0.5555555…, which rounds to 0.5556.
          The score must be computed from that rounded value: 125 * (1 - 0.5556) = 55.55.
          Feeding the unrounded sum yields 55.5556 → 55.56, so the single trailing cent
          distinguishes the normative two-step rounding from one-step evaluation.
        test_recipe:
          setup:
            - "CycleMain OPEN with three SUBMITTED applications from artists in regions NORTH, SOUTH and NORTH"
            - "No award has been made, so funded_rate must be exactly 0.0"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *m_art2
            - *m_app2
            - *m_ws2a
            - *m_ws2b
            - *m_sub2
            - { call: "POST /grants/artists", payload: { legal_name: "Dov Halloran", email: "dov.halloran@example.org", residency_start_date: "2021-03-04", residency_county: "Lakeshore", region: NORTH, is_enrolled_student: false, tin_status: ON_FILE }, as: ProgramOfficer, as_user_id: "officer-1", captures: { art3: "$.data.id" } }
            - { call: "POST /grants/applications", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art3}", artist_statement: "Essays on grain elevators and the language of weighbridges.", career_narrative: "Long-running regional column, one collection, two teaching residencies." }, as: Artist, as_user_id: "${art3}", captures: { app3: "$.data.id" } }
            - { call: "POST /grants/work-samples", payload: { application_id: "${app3}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 13, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art3}" }
            - { call: "POST /grants/work-samples", payload: { application_id: "${app3}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 6, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art3}" }
            - { call: "POST /grants/applications/${app3}/submit", payload: {}, as: Artist, as_user_id: "${art3}" }
          trigger:
            - { call: "GET /grants/cycles/${cyc}/evaluation", payload: {}, as: CouncilBoardMember, as_user_id: "board-1" }
          assert:
            - "eligible_pool_size == 3 — SUBMITTED applications count toward the pool"
            - "region_hhi == 0.5556 (raw 0.5555555… rounded to four places)"
            - "geographic_distribution_score == 55.55, NOT 55.56"
            - "funded_rate == 0.0"
            - "region_breakdown is sorted by region code ASC: NORTH with applicant_count 2 then SOUTH with applicant_count 1"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: review_submission_gated_on_panel_scoring_and_matching_round
        grounds:
          - state_machines.Review.DRAFT_to_SUBMITTED
          - state_machines.Panel.CHARTERED_to_SCORING
          - validations[error_id=ERR_PANEL_STATE_INVALID]
          - validations[error_id=ERR_REVIEW_STATE_INVALID]
        distinguishing_aspect: |
          A Review's own status is not sufficient to submit it: the parent Panel must be SCORING
          and the review's frozen round_number must equal the panel's current round_number. A
          review drafted while the panel was merely CHARTERED (round 0) is rejected twice for
          two different reasons — first because the panel is in the wrong state, then, after the
          round opens, because the review belongs to round 0 while the panel is on round 1 — so
          the correct fix is to draft a new review, not to retry the old one.
        test_recipe:
          setup:
            - "CycleMain panel CHARTERED with app1 assigned and round_number still 0; no round has been opened"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
          trigger:
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl1}", artistic_excellence: 9, work_sample_quality: 8, career_impact: 7, public_value: 6, comments: "Drafted before the round opened." }, as: Panelist, as_user_id: "${pl1}", captures: { rv0: "$.data.id" } }
            - { call: "POST /grants/reviews/${rv0}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}", captures: { err_panel: "$.data.error_id" } }
            - *k_round1
            - { call: "POST /grants/reviews/${rv0}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}", captures: { err_round: "$.data.error_id" } }
            - { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl1}", artistic_excellence: 9, work_sample_quality: 8, career_impact: 7, public_value: 6, comments: "Redrafted inside round 1." }, as: Panelist, as_user_id: "${pl1}", captures: { rvA: "$.data.id" } }
            - { call: "POST /grants/reviews/${rvA}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
            - { call: "GET /grants/reviews/${rv0}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/${pl1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "Creating the round-0 review succeeds with 201 and round_number 0 copied from the panel"
            - "The first submit returns 409 ERR_PANEL_STATE_INVALID while the panel is CHARTERED"
            - "After open-round the identical submit returns 409 ERR_REVIEW_STATE_INVALID because 0 != 1"
            - "rv0 is still DRAFT with submitted_at null and weighted_score null"
            - "The round-1 review is accepted — the P85 duplicate check keys on (application, round), so the same panelist may draft one review per round"
            - "Application.valid_review_count == 1 and provisional_composite_score == 8.00"
            - "Panelist pl1.review_submitted_count == 1 — the two rejected submits did not increment it"

      - name: installment_release_gated_on_the_cycle_reaching_awarded
        grounds:
          - state_machines.PaymentInstallment.SCHEDULED_to_RELEASED
          - state_machines.FellowshipCycle.BOARD_REVIEW_to_AWARDED
          - validations[error_id=ERR_CYCLE_STATE_INVALID]
        distinguishing_aspect: |
          Every local precondition for release is satisfied — the award is ACCEPTED, the
          installment is SCHEDULED, the segregation-of-duties actor differs, and the clock has
          reached the scheduled date — yet the grandparent cycle is still BOARD_REVIEW, so the
          money must not move. The gate lives two levels up the FK chain (installment → award →
          cycle), which an implementation that only inspects the award will miss.
        test_recipe:
          setup:
