# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Label & Flexible-Packaging Converter
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_invoice_final_pricing
        grounds:
          - calculations.job_quote_calc
          - calculations.job_invoice_calc
          - entities.LabelJob.fields.quoted_price_cents
          - entities.LabelJob.fields.invoiced_price_cents
        distinguishing_aspect: |
          Same job priced by two variants on the LabelJob domain: the provisional
          quote keys on quantity_ordered (4000 → rate_a, base 18000) and includes
          setup waste unconditionally; the final invoice keys on
          good_quantity_produced (6000 → rate_b, base 22800) — quoted 163637
          cents vs invoiced 168437 cents for identical job inputs.
        test_recipe:
          setup:
            - "Customer C exists, not on credit hold"
            - "Artwork AV (2 colors, plates 120000c) APPROVED under C"
            - "Substrate SUB 1000mm @40c/MSI; InkRecipe INK @300c/lb; shelf Die D (no charge); Press P (4 stations, setup 300ft, run waste 5%)"
            - "Job J: qty_ordered 4000, repeat 76mm → release freezes material_ft=1348 (running 998 + setup 300 + waste 50)"
            - "J completed with good_quantity_produced 6000, one roll (6000 labels, 1 splice) accepted → REWOUND"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Acme Foods" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-1", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "BOPP-30", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-1", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-1", shape_description: "rect 76x50", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-1", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 4000, repeat_length_mm: 76, rewind_max_rolls: 3, max_splices_per_roll: 2 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/start-press"
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements"
              payload: { station_no: 1, delta_e: 1.0 }
              as: PressOperator
              captures: { m_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements/${m_id}/judge"
              payload: { verdict: "PASS" }
              as: QualityManager
            - call: "POST /label-jobs/jobs/${j_id}/complete-press"
              payload: { good_quantity_produced: 6000 }
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls"
              payload: { roll_seq: 1, label_count: 6000, splice_count: 1 }
              as: PressOperator
              captures: { r_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls/${r_id}/accept"
              as: QualityManager
          trigger:
            - call: "GET /label-jobs/jobs/${j_id}"
              as: QualityManager
              captures: { j_v_pre_ship: $.data.version }
            - call: "POST /label-jobs/jobs/${j_id}/ship"
              payload: { expected_job_version: "${j_v_pre_ship}" }
              as: QualityManager
          assert:
            - "LabelJob.${j_id}.quoted_price_cents == 163637"
            - "LabelJob.${j_id}.material_ft == 1348"
            - "LabelJob.${j_id}.invoiced_price_cents == 168437"
            - "LabelJob.${j_id}.status == SHIPPED"
      - name: die_charge_purchase_vs_shelf_variants
        grounds:
          - calculations.die_new_charge_rule
          - entities.Die.fields.new_die_charge_cents
          - entities.LabelJob.fields.die_charge_applied_cents
        distinguishing_aspect: |
          Same job inputs, two die variants on the Die billing domain: a die
          created via POST /dies/purchase carries new_die_charge_cents=750000 and
          its first released job is billed die_charge_applied_cents=750000, while
          an identical die created via POST /dies carries 0 and its job is
          billed 0 — 750000 vs 0 divergence from one creation-mode flag.
        test_recipe:
          setup:
            - "Customer C; approved artwork AV (2 colors, 120000c plates); substrate SUB; ink INK; press P"
            - "Die DP via purchase endpoint; Die DS via shelf endpoint"
            - "Two identical jobs JP (die DP) and JS (die DS), qty 1000, both approved and released"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Beta Pack" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-2", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "PET-12", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-2", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-2", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/dies/purchase"
              payload: { die_code: "D-P", shape_description: "oval", cavities_across: 2 }
              as: Estimator
              captures: { die_p_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-S", shape_description: "oval", cavities_across: 2 }
              as: Estimator
              captures: { die_s_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_p_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_p_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_s_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_s_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_p_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_p_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_s_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_s_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
          trigger:
            - call: "GET /label-jobs/jobs/${j_p_id}"
              as: Estimator
              captures: { jp_charge: $.data.die_charge_applied_cents }
            - call: "GET /label-jobs/jobs/${j_s_id}"
              as: Estimator
              captures: { js_charge: $.data.die_charge_applied_cents }
            - call: "GET /label-jobs/dies/${die_p_id}"
              as: Estimator
              captures: { dp_collected: $.data.charge_collected }
          assert:
            - "Die.${die_p_id}.new_die_charge_cents == 750000"
            - "Die.${die_s_id}.new_die_charge_cents == 0"
            - "LabelJob.${j_p_id}.die_charge_applied_cents == 750000"
            - "LabelJob.${j_s_id}.die_charge_applied_cents == 0"
            - "Die.${die_p_id}.charge_collected == true"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: material_calc_short_vs_long_run_branching
        grounds:
          - calculations.job_material_calc
          - entities.LabelJob.fields.material_ft
        distinguishing_aspect: |
          Mode (a): >=3 inputs (quantity, repeat_length, press.setup_waste_ft,
          press.run_waste_pct_numerator) with a conditional branch on the
          5000-ft short-run threshold — two jobs on the same press (running_ft
          1497 vs 14961) diverge only in whether setup waste is billed:
          1872 ft vs 15710 ft.
        test_recipe:
          setup:
            - "Customer C; approved 2-color artwork AV (120000c plates); substrate 1000mm @40c; ink @300c; shelf die D"
            - "Press P: setup_waste_ft 300, run waste 5%"
            - "Job SHORT: qty 6000, repeat 76mm (running 1497 < 5000)"
            - "Job LONG: qty 60000, repeat 76mm (running 14961 >= 5000)"
            - "Both approved and released"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Combo Corp" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-3", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "PE-90", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-3", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-3", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-3", station_count: 6, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 6000, repeat_length_mm: 76, rewind_max_rolls: 3, max_splices_per_roll: 2 }
              as: Estimator
              captures: { j_short: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 60000, repeat_length_mm: 76, rewind_max_rolls: 9, max_splices_per_roll: 2 }
              as: Estimator
              captures: { j_long: $.data.id }
            - call: "POST /label-jobs/jobs/${j_short}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_short}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_long}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_long}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
          trigger:
            - call: "GET /label-jobs/jobs/${j_short}"
              as: Estimator
              captures: { short_mf: $.data.material_ft }
            - call: "GET /label-jobs/jobs/${j_long}"
              as: Estimator
              captures: { long_mf: $.data.material_ft }
          assert:
            - "LabelJob.${j_short}.material_ft == 1872  # 1497 + 300 + ceil(1497*0.05)=75"
            - "LabelJob.${j_long}.material_ft == 15710  # 14961 + 0 + ceil(14961*0.05)=749"
      - name: quote_nested_ceil_component_rounding_order
        grounds:
          - calculations.job_quote_calc
        distinguishing_aspect: |
          Mode (b): nested ceil rounding whose order is pinned per-component —
          base, material (MSI conversion), and ink are each ceiled independently
          then summed; summing raw values then ceiling once yields 163636
          instead of the pinned 163637 for the reference job.
        test_recipe:
          setup:
            - "Customer C; approved 2-color artwork (120000c plates); substrate 1000mm @40c/MSI; ink @300c/lb; shelf die; press setup 300 / waste 5%"
            - "Job qty 4000 repeat 76mm created (QUOTED) — provisional quote observed"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Rounding Inc" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-4", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "BOPP-31", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-4", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-4", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-4", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 4000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
          trigger:
            - call: "GET /label-jobs/jobs/${j_id}"
              as: Estimator
              captures: { q_cents: $.data.quoted_price_cents }
          assert:
            - "LabelJob.${j_id}.quoted_price_cents == 163637  # base ceil(4*4500)=18000; material ceil(636.8503...MSI*40)=25475; ink ceil(0.5392lb*300)=162; plates 120000"
            - "LabelJob.${j_id}.quoted_price_cents != 163636  # sum-then-round order would under-count by one cent"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: artwork_revision_submit_return_cycle
        grounds:
          - state_machines.ArtworkVersion.DRAFT_to_SUBMITTED
          - state_machines.ArtworkVersion.SUBMITTED_to_DRAFT
          - state_machines.ArtworkVersion.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          ArtworkVersion is cyclic: DRAFT → SUBMITTED → DRAFT (return for
          rework) → SUBMITTED → APPROVED; a revision can loop any number of
          times before approval, unlike the forward-only LabelJob pipeline.
        test_recipe:
          setup:
            - "Customer C exists; artwork revision AW created (DRAFT)"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Cycle Co" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-5", revision_no: 1, color_count: 3, plate_set_cost_cents: 90000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/return"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
          assert:
            - "ArtworkVersion.${av_id}.status == APPROVED after the DRAFT→SUBMITTED→DRAFT→SUBMITTED→APPROVED loop"
            - "ArtworkVersion.${av_id}.version == 5 (create=1 plus four transitions)"
      - name: labeljob_branching_cancel_vs_forward_paths
        grounds:
          - state_machines.LabelJob.RELEASED_to_CANCELLED
          - state_machines.LabelJob.REWOUND_to_SHIPPED
          - calculations.die_new_charge_rule
        distinguishing_aspect: |
          LabelJob branches at RELEASED: one job forks to CANCELLED (compensating
          die-charge release fires), the next proceeds forward and re-collects
          the same die's charge — the fork choice determines which side-effect
          set runs on the shared Die entity.
        test_recipe:
          setup:
            - "Customer C; approved 2-color artwork AV (120000c plates); substrate 1000mm @40c; ink @300c; purchased die DP (charge 750000); press P"
            - "Job A approved+released against DP (charge collected), then cancelled from RELEASED"
            - "Job B created, approved, released against DP after A's cancel freed the charge"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Fork Ltd" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-6", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "BOPP-32", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-6", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies/purchase"
              payload: { die_code: "D-F", shape_description: "star", cavities_across: 3 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-6", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_a: $.data.id }
            - call: "POST /label-jobs/jobs/${j_a}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_a}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_a}/cancel"
              as: Estimator
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_b: $.data.id }
            - call: "POST /label-jobs/jobs/${j_b}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_b}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
          trigger:
            - call: "GET /label-jobs/jobs/${j_a}"
              as: Estimator
              captures: { ja_status: $.data.status }
            - call: "GET /label-jobs/jobs/${j_b}"
              as: Estimator
              captures: { jb_charge: $.data.die_charge_applied_cents }
          assert:
            - "LabelJob.${j_a}.status == CANCELLED"
            - "LabelJob.${j_b}.status == RELEASED"
            - "LabelJob.${j_b}.die_charge_applied_cents == 750000  # re-billed after JA's cancel released the die"
            - "Die.${die_id}.charge_collected == true  # exactly one billing job per die at any time"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: artwork_approval_supersede_cancels_job_releases_die
        grounds:
          - state_machines.ArtworkVersion.SUBMITTED_to_APPROVED
          - state_machines.ArtworkVersion.APPROVED_to_OBSOLETE
          - state_machines.LabelJob.QUOTED_to_CANCELLED
          - calculations.die_new_charge_rule
        distinguishing_aspect: |
          Depth-3 cascade from the artwork-approve trigger: approving rev2 flips
          rev1 APPROVED→OBSOLETE; rev1's flip auto-cancels a RELEASED job
          referencing it; the job's cascaded cancel releases the die's
          charge_collected back to false — each link caused by the previous one.
        test_recipe:
          setup:
            - "Customer C; artwork code AW-7: rev1 APPROVED, rev2 SUBMITTED"
            - "Purchased die DP (750000 charge); substrate/ink/press ready"
            - "Job J against rev1, qty 1000, approved and RELEASED (DP.charge_collected == true, J.die_charge_applied_cents == 750000)"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Cascade SA" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-7", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av1_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av1_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av1_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av1_id}"
              as: Estimator
              captures: { av1_v: $.data.version }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-7", revision_no: 2, color_count: 2, plate_set_cost_cents: 130000 }
              as: PrepressOperator
              captures: { av2_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av2_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "BOPP-33", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-7", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies/purchase"
              payload: { die_code: "D-C", shape_description: "hex", cavities_across: 2 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-7", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av1_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av1_v}" }
              as: Estimator
          trigger:
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av2_id}/approve"
              as: PrepressOperator
          assert:
            - "ArtworkVersion.${av1_id}.status == OBSOLETE (superseded by rev2 approval)"
            - "LabelJob.${j_id}.status == CANCELLED (cascade: referenced artwork went OBSOLETE)"
            - "Die.${die_id}.charge_collected == false (die charge released by the cascaded cancel)"
            - "ArtworkVersion.${av2_id}.status == APPROVED"
      - name: roll_accept_bubbles_job_rewound_enables_ship_invoice
        grounds:
          - state_machines.RewindRoll.WOUND_to_ACCEPTED
          - state_machines.LabelJob.PRINTED_to_REWOUND
          - state_machines.LabelJob.REWOUND_to_SHIPPED
          - calculations.job_invoice_calc
        distinguishing_aspect: |
          Depth-2-plus cascade from the roll-accept trigger: accepting the last
          WOUND roll bubbles the job PRINTED→REWOUND; the derived REWOUND state
          then enables ship, whose side effect freezes invoiced_price_cents —
          the invoice exists only because the roll judgment propagated upward.
        test_recipe:
          setup:
            - "Full chain: customer, approved 2-color artwork, substrate, ink, shelf die, press"
            - "Job qty 1000 released, on press, measurement judged PASS, completed with good qty 1000"
            - "Two rolls recorded: roll1 (400 labels, 0 splices), roll2 (600 labels, 1 splice) — both WOUND"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Bubble BV" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-8", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "BOPP-34", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-8", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-8", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-8", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 1000, repeat_length_mm: 76, rewind_max_rolls: 3, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
            - call: "POST /label-jobs/jobs/${j_id}/start-press"
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements"
              payload: { station_no: 1, delta_e: 1.5 }
              as: PressOperator
              captures: { m_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/color-measurements/${m_id}/judge"
              payload: { verdict: "PASS" }
              as: QualityManager
            - call: "POST /label-jobs/jobs/${j_id}/complete-press"
              payload: { good_quantity_produced: 1000 }
              as: PressOperator
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls"
              payload: { roll_seq: 1, label_count: 400, splice_count: 0 }
              as: PressOperator
              captures: { r1_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls"
              payload: { roll_seq: 2, label_count: 600, splice_count: 1 }
              as: PressOperator
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls/${r1_id}/accept"
              as: QualityManager
            - call: "GET /label-jobs/jobs/${j_id}"
              as: QualityManager
              captures: { mid_status: $.data.status }
            - call: "POST /label-jobs/jobs/${j_id}/rewind-rolls/${r2_id}/accept"
              as: QualityManager
            - call: "GET /label-jobs/jobs/${j_id}"
              as: QualityManager
              captures: { j_v_rewound: $.data.version, rewound_status: $.data.status }
            - call: "POST /label-jobs/jobs/${j_id}/ship"
              payload: { expected_job_version: "${j_v_rewound}" }
              as: QualityManager
          assert:
            - "after first accept: LabelJob.${j_id}.status == PRINTED (roll2 still WOUND)"
            - "after second accept: LabelJob.${j_id}.status == REWOUND (auto-transition)"
            - "ship succeeds and LabelJob.${j_id}.invoiced_price_cents == 135208"
            - "LabelJob.${j_id}.status == SHIPPED"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_business_safety_on_release
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_JOB_NOT_APPROVED]
          - errors[ERR_FOOD_CONTACT_COMPONENT]
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_safety (priority 6). Releasing a
          QUOTED job that would also fail the food-contact component check
          returns ERR_JOB_NOT_APPROVED (409), not ERR_FOOD_CONTACT_COMPONENT (422).
        test_recipe:
          setup:
            - "Customer C; APPROVED artwork; substrate NOT food_contact_certified; ink NOT food_contact_compliant"
            - "Job requires_food_contact_letter=true, still QUOTED (never approved)"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Prio One" }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-9", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/approve"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "PLAIN-1", width_mm: 1000, cost_per_msq_cents: 40, food_contact_certified: false }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-9", cost_per_lb_cents: 300, food_contact_compliant: false }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-9", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-9", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, requires_food_contact_letter: true, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns http 409 with error_id == ERR_JOB_NOT_APPROVED"
            - "error_id != ERR_FOOD_CONTACT_COMPONENT (state check outranks food-contact safety)"
      - name: referential_artwork_error_beats_fiscal_credit_hold
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_ARTWORK_NOT_APPROVED]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Pair: business_referential (priority 10) vs business_fiscal (priority
          11). Releasing an APPROVED job whose artwork is only SUBMITTED, while
          the customer is on credit hold, returns ERR_ARTWORK_NOT_APPROVED (422),
          not ERR_CUSTOMER_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Customer C created without credit hold"
            - "Artwork AV in SUBMITTED (never approved)"
            - "Job J referencing AV, quote APPROVED, then customer placed on credit hold"
          setup_api_calls:
            - call: "POST /label-jobs/customers"
              payload: { account_name: "Prio Two", credit_hold: false }
              as: Estimator
              captures: { c_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions"
              payload: { artwork_code: "AW-10", revision_no: 1, color_count: 2, plate_set_cost_cents: 120000 }
              as: PrepressOperator
              captures: { av_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/artwork-versions/${av_id}/submit"
              as: PrepressOperator
            - call: "GET /label-jobs/customers/${c_id}/artwork-versions/${av_id}"
              as: Estimator
              captures: { av_v: $.data.version }
            - call: "POST /label-jobs/substrates"
              payload: { substrate_code: "PLAIN-2", width_mm: 1000, cost_per_msq_cents: 40 }
              as: Estimator
              captures: { sub_id: $.data.id }
            - call: "POST /label-jobs/ink-recipes"
              payload: { recipe_code: "INK-10", cost_per_lb_cents: 300 }
              as: Estimator
              captures: { ink_id: $.data.id }
            - call: "POST /label-jobs/dies"
              payload: { die_code: "D-10", shape_description: "rect", cavities_across: 4 }
              as: Estimator
              captures: { die_id: $.data.id }
            - call: "POST /label-jobs/presses"
              payload: { press_code: "P-10", station_count: 4, setup_waste_ft: 300, run_waste_pct_numerator: 5 }
              as: Estimator
              captures: { press_id: $.data.id }
            - call: "POST /label-jobs/customers/${c_id}/jobs"
              payload: { artwork_version_id: "${av_id}", substrate_id: "${sub_id}", ink_recipe_id: "${ink_id}", die_id: "${die_id}", press_id: "${press_id}", quantity_ordered: 2000, repeat_length_mm: 76, rewind_max_rolls: 2, max_splices_per_roll: 1 }
              as: Estimator
              captures: { j_id: $.data.id }
            - call: "POST /label-jobs/jobs/${j_id}/approve"
              as: Estimator
            - call: "PATCH /label-jobs/customers/${c_id}"
              payload: { credit_hold: true }
              as: Estimator
          trigger:
            - call: "POST /label-jobs/jobs/${j_id}/release"
              payload: { expected_artwork_version: "${av_v}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns http 422 with error_id == ERR_ARTWORK_NOT_APPROVED"
            - "error_id != ERR_CUSTOMER_CREDIT_HOLD (referential check outranks fiscal credit check)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
