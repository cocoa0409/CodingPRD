    roles: [EnergyEngineer]
    code: 201
    input: [facility_id, baseline_pressure_psi, target_pressure_psi, sequence_compressor_ids, project_cost_cents]
    output: RetrofitProject
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/retrofit-projects"
    description: "List retrofit projects (FK reverse for RetrofitProject.facility_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "RetrofitProject[]"
    side_effects: []

  - method: GET
    path: "/retrofit-projects/{retrofitProjectId}"
    description: "Get a RetrofitProject"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: []

  - method: POST
    path: "/retrofit-projects/{retrofitProjectId}/approve"
    description: "PROPOSED -> APPROVED; revalidates sequence compressors are IN_SERVICE"
    roles: [FacilityManager]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/retrofit-projects/{retrofitProjectId}/mark-installed"
    description: "APPROVED -> INSTALLED"
    roles: [ServiceTech]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status -> INSTALLED"]

  - method: POST
    path: "/retrofit-projects/{retrofitProjectId}/commission"
    description: "INSTALLED -> COMMISSIONED"
    roles: [ServiceTech]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status -> COMMISSIONED"]

  - method: POST
    path: "/retrofit-projects/{retrofitProjectId}/accept"
    description: "COMMISSIONED -> ACCEPTED; stamps accepted_date from logical clock"
    roles: [FacilityManager]
    code: 200
    input: []
    output: RetrofitProject
    side_effects: ["status -> ACCEPTED; accepted_date = logical clock date"]

  # --- SavingsCase ---
  - method: POST
    path: "/savings-cases"
    description: "Create a SavingsCase (savings DRAFT / rebate NONE); pins baseline profile id+version"
    roles: [EnergyEngineer]
    code: 201
    input: [facility_id, baseline_profile_id, retrofit_project_id]
    output: SavingsCase
    side_effects: ["savings_status=DRAFT, rebate_status=NONE; baseline_profile_version pinned; deemed=0, measured=null"]

  - method: GET
    path: "/savings-cases"
    description: "List savings cases (FK reverse for facility_id, baseline_profile_id, post_profile_id, retrofit_project_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "baseline_profile_id?", "post_profile_id?", "retrofit_project_id?", "savings_status?", "rebate_status?", "limit?", "offset?"]
    output: "SavingsCase[]"
    side_effects: []

  - method: GET
    path: "/savings-cases/{savingsCaseId}"
    description: "Get a SavingsCase"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: SavingsCase
    side_effects: []

  - method: POST
    path: "/savings-cases/{savingsCaseId}/model"
    description: "savings DRAFT -> MODELED; computes deemed_annual_savings_kwh"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: SavingsCase
    side_effects: ["deemed_annual_savings_kwh computed (leak rollup + sequencing)"]

  - method: POST
    path: "/savings-cases/{savingsCaseId}/rebase"
    description: "Clear staleness: re-pin current LOCKED baseline (and optionally re-point retrofit project); resets savings to DRAFT"
    roles: [EnergyEngineer]
    code: 200
    input: ["retrofit_project_id?"]
    output: SavingsCase
    side_effects: ["baseline re-pinned, baseline_stale=false; optional project re-point clears retrofit_stale; savings_status -> DRAFT; deemed reset to 0"]

  - method: POST
    path: "/savings-cases/{savingsCaseId}/open-measurement"
    description: "savings MODELED -> MEASUREMENT_OPEN; requires retrofit ACCEPTED"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: SavingsCase
    side_effects: ["savings_status -> MEASUREMENT_OPEN"]

  - method: POST
    path: "/savings-cases/{savingsCaseId}/close-measurement"
    description: "savings MEASUREMENT_OPEN -> MEASURED; computes measured savings; segregation of duties vs baseline locker"
    roles: [EnergyEngineer]
    code: 200
    input: [post_profile_id]
    output: SavingsCase
    side_effects: ["post_profile_id stored; measured_annual_savings_kwh computed; savings_status -> MEASURED"]

  - method: POST
    path: "/savings-cases/{savingsCaseId}/file-rebate"
    description: "rebate NONE -> FILED; provisional rebate always computed from deemed savings"
    roles: [EnergyEngineer]
    code: 200
    input: []
    output: SavingsCase
    side_effects: ["rebate_status -> FILED; provisional_rebate_cents = utility_rebate(deemed)"]

  - method: POST
    path: "/savings-cases/{savingsCaseId}/record-rebate-decision"
    description: "rebate FILED -> APPROVED|REJECTED; APPROVED computes final rebate from measured (if MEASURED) else deemed"
    roles: [DealerAdmin, ContractManager]
    code: 200
    input: [outcome]
    output: SavingsCase
    side_effects: ["rebate_status -> APPROVED|REJECTED; final_rebate_cents computed on APPROVED"]

  # --- ServiceContract ---
  - method: POST
    path: "/service-contracts"
    description: "Create a ServiceContract (DRAFT); sla_base_hours and end_date computed"
    roles: [ContractManager]
    code: 201
    input: [facility_id, tier, start_date, term_months, monthly_fee_cents]
    output: ServiceContract
    side_effects: ["status=DRAFT; sla_base_hours per tier; end_date = start_date + term_months"]

  - method: GET
    path: "/service-contracts"
    description: "List service contracts (FK reverse for ServiceContract.facility_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "tier?", "status?", "limit?", "offset?"]
    output: "ServiceContract[]"
    side_effects: []

  - method: GET
    path: "/service-contracts/{serviceContractId}"
    description: "Get a ServiceContract"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []

  - method: POST
    path: "/service-contracts/{serviceContractId}/activate"
    description: "DRAFT -> ACTIVE with OCC on Facility.version; supersedes the facility's currently ACTIVE contract"
    roles: [ContractManager]
    code: 200
    input: [expected_facility_version]
    output: ServiceContract
    side_effects:
      - "increments Facility.version by 1"
      - "prior ACTIVE contract of facility -> SUPERSEDED"
      - "status -> ACTIVE"

  - method: POST
    path: "/service-contracts/{serviceContractId}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/service-contracts/{serviceContractId}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/service-contracts/{serviceContractId}/terminate"
    description: "ACTIVE|SUSPENDED -> TERMINATED; fee waived when termination_penalty_waived"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> TERMINATED; termination_fee_cents = 0 if termination_penalty_waived else 2 * monthly_fee_cents"]

  - method: POST
    path: "/service-contracts/{serviceContractId}/expire"
    description: "ACTIVE -> EXPIRED; only when logical clock date > end_date"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status -> EXPIRED"]

  # --- ServiceTicket ---
  - method: POST
    path: "/service-tickets"
    description: "Open a ServiceTicket (OPEN); resolves ACTIVE contract, stamps reported_at and sla_deadline from logical clock"
    roles: [FacilityManager]
    code: 201
    input: [facility_id, compressor_id, severity]
    output: ServiceTicket
    side_effects: ["status=OPEN; contract_id resolved; reported_at, sla_tier_snapshot, sla_deadline set"]

  - method: GET
    path: "/service-tickets"
    description: "List service tickets (FK reverse for facility_id, contract_id, compressor_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "contract_id?", "compressor_id?", "status?", "limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []

  - method: GET
    path: "/service-tickets/{serviceTicketId}"
    description: "Get a ServiceTicket"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: POST
    path: "/service-tickets/{serviceTicketId}/dispatch"
    description: "OPEN -> DISPATCHED"
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/service-tickets/{serviceTicketId}/record-response"
    description: "DISPATCHED -> ON_SITE; stamps first_response_at, computes sla_met, fires breach cascade"
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects:
      - "first_response_at = logical clock; sla_met computed (<= deadline is MET)"
      - "if breach: ServiceCredit ACCRUED created; contract counters and sla_breach_count += 1"
      - "if sla_breach_count reaches 3: contract -> SUSPENDED and termination_penalty_waived = true"

  - method: POST
    path: "/service-tickets/{serviceTicketId}/resolve"
    description: "ON_SITE -> RESOLVED"
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> RESOLVED"]

  - method: POST
    path: "/service-tickets/{serviceTicketId}/cancel"
    description: "OPEN|DISPATCHED -> CANCELLED"
    roles: [FacilityManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status -> CANCELLED"]

  # --- RentalAsset (dealer fleet) ---
  - method: POST
    path: "/rental-assets"
    description: "Add a RentalAsset to the dealer fleet (AVAILABLE)"
    roles: [DealerAdmin]
    code: 201
    input: [fleet_tag, rated_cfm, daily_rate_cents, deposit_cents]
    output: RentalAsset
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/rental-assets"
    description: "List rental fleet"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["status?", "min_rated_cfm?", "limit?", "offset?"]
    output: "RentalAsset[]"
    side_effects: []

  - method: GET
    path: "/rental-assets/{rentalAssetId}"
    description: "Get a RentalAsset"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: RentalAsset
    side_effects: []

  - method: POST
    path: "/rental-assets/{rentalAssetId}/set-maintenance"
    description: "AVAILABLE <-> IN_MAINTENANCE; entering maintenance blocked by reservations in {RESERVED, ON_RENT}"
    roles: [ServiceTech, DealerAdmin]
    code: 200
    input: [in_maintenance]
    output: RentalAsset
    side_effects: ["status -> IN_MAINTENANCE or AVAILABLE"]

  # --- RentalReservation ---
  - method: POST
    path: "/rental-reservations"
    description: "Reserve a rental compressor for a DOWN unit; gates: facility ACTIVE, ACTIVE contract tier STANDARD+, compressor DOWN; auto-selects smallest sufficient available asset when rental_asset_id omitted; overlap with turnaround buffer rejected"
    roles: [FacilityManager]
    code: 201
    input: [facility_id, down_compressor_id, start_date, end_date, "rental_asset_id?"]
    output: RentalReservation
    side_effects:
      - "status=RESERVED; rental_asset_id assigned (explicit or selector auto-pick); deposit_cents snapshotted; planned_days and quoted_cents computed"
      - "Facility.rental_escrow_cents += deposit_cents"

  - method: GET
    path: "/rental-reservations"
    description: "List rental reservations (FK reverse for facility_id, rental_asset_id, down_compressor_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "rental_asset_id?", "down_compressor_id?", "status?", "limit?", "offset?"]
    output: "RentalReservation[]"
    side_effects: []

  - method: GET
    path: "/rental-reservations/{rentalReservationId}"
    description: "Get a RentalReservation"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: RentalReservation
    side_effects: []

  - method: POST
    path: "/rental-reservations/{rentalReservationId}/deliver"
    description: "RESERVED -> ON_RENT; asset -> ON_RENT"
    roles: [ServiceTech]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> ON_RENT; RentalAsset -> ON_RENT"]

  - method: POST
    path: "/rental-reservations/{rentalReservationId}/return"
    description: "ON_RENT -> RETURNED; computes actual bill; asset freed after turnaround buffer; deposit released"
    roles: [ServiceTech]
    code: 200
    input: [actual_return_date]
    output: RentalReservation
    side_effects:
      - "actual_bill_cents computed (min-days floor + long-term discount)"
      - "RentalAsset -> AVAILABLE with next_available_date = actual_return_date + 1"
      - "Facility.rental_escrow_cents -= deposit_cents"

  - method: POST
    path: "/rental-reservations/{rentalReservationId}/cancel"
    description: "RESERVED -> CANCELLED; deposit released (compensating action)"
    roles: [FacilityManager]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> CANCELLED; Facility.rental_escrow_cents -= deposit_cents"]

  - method: POST
    path: "/rental-reservations/{rentalReservationId}/invoice"
    description: "RETURNED -> INVOICED; locks final_bill_cents"
    roles: [ContractManager]
    code: 200
    input: []
    output: RentalReservation
    side_effects: ["status -> INVOICED; final_bill_cents = actual_bill_cents"]

  # --- GuaranteeCertificate ---
  - method: POST
    path: "/guarantee-certificates"
    description: "Create a GuaranteeCertificate (AWAITING_MEASUREMENT / dispute NONE); requires ACTIVE PREMIUM contract and MODELED-or-MEASURED savings case of the same facility; snapshots guaranteed_kwh and deadband_kwh from deemed"
    roles: [ContractManager]
    code: 201
    input: [facility_id, contract_id, savings_case_id, guaranteed_pct]
    output: GuaranteeCertificate
    side_effects: ["guaranteed_kwh and deadband_kwh snapshotted from case deemed; settlement_blocked computed from posture"]

  - method: GET
    path: "/guarantee-certificates"
    description: "List guarantee certificates (FK reverse for facility_id, contract_id, savings_case_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["facility_id?", "contract_id?", "savings_case_id?", "settlement_status?", "limit?", "offset?"]
    output: "GuaranteeCertificate[]"
    side_effects: []

  - method: GET
    path: "/guarantee-certificates/{guaranteeCertificateId}"
    description: "Get a GuaranteeCertificate"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: GuaranteeCertificate
    side_effects: []

  - method: POST
    path: "/guarantee-certificates/{guaranteeCertificateId}/settle"
    description: "AWAITING_MEASUREMENT -> SETTLED_NO_SHORTFALL | SETTLED_PAYOUT_DUE; gates: case MEASURED, posture NORMAL, dispute NONE"
    roles: [ContractManager]
    code: 200
    input: []
    output: GuaranteeCertificate
    side_effects: ["measured_kwh_at_settlement pulled from savings case; shortfall_kwh and payout_cents computed"]

  - method: POST
    path: "/guarantee-certificates/{guaranteeCertificateId}/pay"
    description: "SETTLED_PAYOUT_DUE -> PAID; blocked while dispute OPEN"
    roles: [ContractManager]
    code: 200
    input: []
    output: GuaranteeCertificate
    side_effects: ["settlement_status -> PAID"]

  - method: POST
    path: "/guarantee-certificates/{guaranteeCertificateId}/dispute"
    description: "Open a measurement dispute (dispute NONE -> OPEN) on a settled-but-unpaid certificate; freezes payout"
    roles: [FacilityManager]
    code: 200
    input: [reason]
    output: GuaranteeCertificate
    side_effects: ["dispute_status -> OPEN; dispute_reason stored"]

  - method: POST
    path: "/guarantee-certificates/{guaranteeCertificateId}/resolve-dispute"
    description: "Resolve dispute: UPHELD recomputes shortfall/payout with corrected_measured_kwh and re-derives settlement; OVERRULED releases payout unchanged"
    roles: [ContractManager]
    code: 200
    input: [outcome, "corrected_measured_kwh?"]
    output: GuaranteeCertificate
    side_effects: ["dispute_status -> RESOLVED_UPHELD | RESOLVED_OVERRULED; on UPHELD: measured/shortfall/payout recomputed, settlement re-derived"]

  # --- ServiceCredit ---
  - method: GET
    path: "/service-credits"
    description: "List service credits (FK reverse for contract_id, ticket_id)"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: ["contract_id?", "ticket_id?", "status?", "limit?", "offset?"]
    output: "ServiceCredit[]"
    side_effects: []

  - method: GET
    path: "/service-credits/{serviceCreditId}"
    description: "Get a ServiceCredit"
    roles: [DealerAdmin, EnergyEngineer, ServiceTech, ContractManager, FacilityManager]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

  - method: POST
    path: "/service-credits/{serviceCreditId}/apply"
    description: "ACCRUED -> APPLIED; contract outstanding -= amount, applied += amount"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["Contract counters updated preserving accrued == applied + expired + outstanding"]

  - method: POST
    path: "/service-credits/{serviceCreditId}/expire"
    description: "ACCRUED -> EXPIRED; requires logical clock >= expires_at"
    roles: [ContractManager]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: ["Contract counters updated preserving identity"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / generic ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FACILITY_OWNERSHIP_MISMATCH, http: 403, condition: "FacilityManager X-User-ID does not equal the owning Facility id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/type/enum/semantic input failure (incl. target_pressure_psi >= baseline_pressure_psi, window_end_date < window_start_date, corrected_measured_kwh missing on UPHELD)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not declared for the entity's current state/dimension" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_facility_version != Facility.version on an OCC-guarded write" }

  # --- facility / contract / ticket ---
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Operation requires Facility.status == ACTIVE" }
  - { id: ERR_FACILITY_HAS_OPEN_OBLIGATIONS, http: 409, condition: "Offboard blocked by non-terminal contracts, active reservations, or unsettled certificates" }
  - { id: ERR_NO_ACTIVE_CONTRACT, http: 409, condition: "Facility has no ServiceContract in ACTIVE (and none SUSPENDED) at ticket/reservation/certificate time" }
  - { id: ERR_CONTRACT_SUSPENDED, http: 409, condition: "Facility's latest non-terminal contract is SUSPENDED; new tickets/reservations blocked" }
  - { id: ERR_CONTRACT_NOT_EXPIRED, http: 409, condition: "expire called while logical clock date <= end_date" }
  - { id: ERR_CONTRACT_TIER_INELIGIBLE, http: 409, condition: "Rental requires ACTIVE tier STANDARD or PREMIUM; guarantee certificate requires tier PREMIUM" }

  # --- compressor / maintenance ---
  - { id: ERR_COMPRESSOR_NOT_DOWN, http: 409, condition: "Rental reservation references a compressor whose status != DOWN" }
  - { id: ERR_DUPLICATE_ASSET_TAG, http: 409, condition: "asset_tag already used by a non-DECOMMISSIONED compressor of the same facility" }
  - { id: ERR_RUN_HOURS_REGRESSION, http: 422, condition: "run_hours_total below current value, or record-service reading below schedule anchor" }
  - { id: ERR_READING_EXCEEDS_LOGGED, http: 422, condition: "record-service run_hours_reading exceeds facility max compressor run_hours_total" }
  - { id: ERR_DUPLICATE_SCHEDULE_COMPONENT, http: 409, condition: "ACTIVE schedule for the same (facility, component) already exists" }

  # --- demand profile / savings ---
  - { id: ERR_MEASUREMENT_WINDOW_OVERLAP, http: 409, condition: "Closed-closed measurement window intersects another COLLECTING/LOCKED profile of the same facility" }
  - { id: ERR_PROFILE_NOT_LOCKED, http: 409, condition: "Referenced profile is not LOCKED (savings-case create, close-measurement, rebase with no LOCKED profile)" }
  - { id: ERR_BASELINE_SUPERSEDED, http: 409, condition: "model called while baseline_stale == true" }
  - { id: ERR_RETROFIT_STALE, http: 409, condition: "model called while retrofit_stale == true" }
  - { id: ERR_RETROFIT_NOT_APPROVED, http: 409, condition: "Referenced retrofit project not yet APPROVED" }
  - { id: ERR_RETROFIT_NOT_ACCEPTED, http: 409, condition: "open-measurement requires retrofit project ACCEPTED" }
  - { id: ERR_POST_WINDOW_BEFORE_ACCEPTANCE, http: 409, condition: "Post-measurement window_start_date <= retrofit accepted_date" }
  - { id: ERR_SEQUENCE_COMPRESSOR_INVALID, http: 422, condition: "sequence_compressor_ids entry missing, foreign to facility, or not IN_SERVICE at approve" }
  - { id: ERR_FACILITY_MISMATCH, http: 409, condition: "Referenced entity (profile, project, contract, case, compressor) belongs to a different facility than the acted-on resource" }

  # --- leak survey / repair ---
  - { id: ERR_EMPTY_SURVEY, http: 422, condition: "submit with zero LeakTags (empty set rejected)" }
  - { id: ERR_SURVEY_NOT_VERIFIED, http: 409, condition: "authorize-repair requires parent survey VERIFIED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "verify by survey submitter, or close-measurement by baseline locker" }
  - { id: ERR_REPAIR_BUDGET_EXCEEDED, http: 409, condition: "repair_committed_cents + quote would exceed facility repair_budget_cents" }

  # --- rental ---
  - { id: ERR_NO_RENTAL_ASSET_AVAILABLE, http: 409, condition: "Auto-select found no AVAILABLE asset with sufficient CFM and no buffered overlap" }
  - { id: ERR_RENTAL_ASSET_UNAVAILABLE, http: 409, condition: "Explicit asset not AVAILABLE / undersized / buffered-overlap conflict; or set-maintenance blocked by active reservation" }
  - { id: ERR_RENTAL_DATE_RANGE_INVALID, http: 422, condition: "end_date < start_date or actual_return_date < start_date" }
  - { id: ERR_DUPLICATE_FLEET_TAG, http: 409, condition: "fleet_tag already in use" }

  # --- guarantee / credit ---
  - { id: ERR_MEASUREMENT_INCOMPLETE, http: 409, condition: "settle requires linked SavingsCase.savings_status == MEASURED" }
  - { id: ERR_POSTURE_NOT_NORMAL, http: 409, condition: "settle requires facility.posture == NORMAL" }
  - { id: ERR_DISPUTE_OPEN_PAYOUT_FROZEN, http: 409, condition: "pay called while dispute_status == OPEN" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "A GuaranteeCertificate already exists for this savings_case_id" }
  - { id: ERR_CREDIT_NOT_EXPIRED, http: 409, condition: "expire called before logical clock reaches expires_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DealerAdmin
    description: "Dealer platform administrator; owns facility onboarding/lifecycle, rental fleet, rebate decisions, logical clock"
    identity: opaque
    exclusive_operations: [POST /facilities, "POST /facilities/{id}/activate", "POST /facilities/{id}/suspend", "POST /facilities/{id}/reinstate", "POST /facilities/{id}/offboard", POST /rental-assets, POST /_clock/set_current_utc]
    shared_operations: [POST /compressors, "POST /compressors/{id}/decommission", POST /maintenance-schedules, "POST /savings-cases/{id}/record-rebate-decision", "POST /rental-assets/{id}/set-maintenance", all GET endpoints]

  - name: EnergyEngineer
    description: "Dealer energy engineer; owns demand profiles, leak surveys/tags, savings cases, retrofit proposals"
    identity: opaque
    exclusive_operations: [POST /demand-profiles, "POST /demand-profiles/{id}/lock", POST /leak-surveys, "POST /leak-surveys/{id}/leak-tags", "POST /leak-surveys/{id}/submit", "POST /leak-surveys/{id}/verify", "POST /leak-tags/{id}/verify-closure", POST /retrofit-projects, POST /savings-cases, "POST /savings-cases/{id}/model", "POST /savings-cases/{id}/rebase", "POST /savings-cases/{id}/open-measurement", "POST /savings-cases/{id}/close-measurement", "POST /savings-cases/{id}/file-rebate"]
    shared_operations: [all GET endpoints]

  - name: ServiceTech
    description: "Dealer field service technician; logs run-hours, works tickets, delivers/returns rentals, services dryers/filters, installs retrofits"
    identity: opaque
    exclusive_operations: ["POST /compressors/{id}/log-run-hours", "POST /compressors/{id}/mark-down", "POST /compressors/{id}/return-to-service", "POST /leak-tags/{id}/mark-repaired", "POST /maintenance-schedules/{id}/record-service", "POST /retrofit-projects/{id}/mark-installed", "POST /retrofit-projects/{id}/commission", "POST /service-tickets/{id}/dispatch", "POST /service-tickets/{id}/record-response", "POST /service-tickets/{id}/resolve", "POST /rental-reservations/{id}/deliver", "POST /rental-reservations/{id}/return"]
    shared_operations: [POST /compressors, "POST /rental-assets/{id}/set-maintenance", all GET endpoints]

  - name: ContractManager
    description: "Dealer contract/commercial manager; owns service contracts, SLA credits, guarantee certificates, rental invoicing"
    identity: opaque
    exclusive_operations: [POST /service-contracts, "POST /service-contracts/{id}/activate", "POST /service-contracts/{id}/suspend", "POST /service-contracts/{id}/reinstate", "POST /service-contracts/{id}/terminate", "POST /service-contracts/{id}/expire", "POST /maintenance-schedules/{id}/retire", "POST /rental-reservations/{id}/invoice", POST /guarantee-certificates, "POST /guarantee-certificates/{id}/settle", "POST /guarantee-certificates/{id}/pay", "POST /guarantee-certificates/{id}/resolve-dispute", "POST /service-credits/{id}/apply", "POST /service-credits/{id}/expire"]
    shared_operations: ["POST /compressors/{id}/decommission", POST /maintenance-schedules, "POST /savings-cases/{id}/record-rebate-decision", all GET endpoints]

  - name: FacilityManager
    description: "Customer-side facility manager; authorizes repairs, approves/accepts retrofits, opens tickets and rentals, disputes measurements. X-User-ID equals the Facility id (ownership-checked)"
    identity: "entity_backed:Facility"
    exclusive_operations: ["POST /leak-tags/{id}/authorize-repair", "POST /leak-tags/{id}/mark-wont-fix", "POST /retrofit-projects/{id}/approve", "POST /retrofit-projects/{id}/accept", POST /service-tickets, "POST /service-tickets/{id}/cancel", POST /rental-reservations, "POST /rental-reservations/{id}/cancel", "POST /guarantee-certificates/{id}/dispute"]
    shared_operations: [all GET endpoints]
