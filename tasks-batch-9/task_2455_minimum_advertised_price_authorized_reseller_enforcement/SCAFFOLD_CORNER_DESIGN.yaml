            - &PRODF
              call: "POST /products"
              payload: { sku: "SKU-LADDER-2", name: "Ladder Probe Two", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${polf}" }
              as: BrandChannelManager
              captures: { prodf: $.data.id }
            - &RESLAD2
