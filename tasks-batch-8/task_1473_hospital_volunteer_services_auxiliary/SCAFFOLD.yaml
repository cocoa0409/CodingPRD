# =============================================================================
# SCAFFOLD.yaml — Hospital Volunteer Services & Auxiliary
# §1.0–§1.7 seed tables (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Hospital Volunteer Services & Auxiliary (hospital auxiliary): volunteer application, screening & health clearance, role placement & department request matching, orientation/training & annual requirements, shift scheduling & hour tracking, junior volunteer age rules & supervision, recognition & retention program, auxiliary fundraising & gift shop operations, badge issuance & separation

domain_name: hospital-volunteer-services
api_prefix: /auxiliary

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # clearance adjudication, segregation of duties, cooling-off periods, badge audit trail
  secondary_archetype: posture_driven_gating # Volunteer.compliance_posture (derived) gates placement/shift/badge operations
  complexity_layers:
    - optimistic_concurrency                 # OCC on Volunteer.version and Shift.version (only sanctioned write-write mechanism)
    - cascading_side_effects                 # clearance revoke -> posture FROZEN -> assignment cancel -> waitlist promote; separate -> rescind -> request reopen
    - rate_threshold_triggers                # recognition tiers (>=), junior weekly cap (<= 16.0), posture grace windows
    - ops_run_checkpoint                     # POST /auxiliary/compliance/annual-review advances the compliance epoch
  entity_topology: flat                      # peer entities with FK references; filtered-list GETs for reverse reachability
  state_machine_shape: cyclic                # clearance renewal cycle, placement counter/reoffer cycle, volunteer suspension + reactivation cycles
  relationship_patterns:
    - one_to_many
    - many_to_many                           # Volunteer x Shift via ShiftAssignment; Volunteer x DepartmentRequest via Placement
    - self_referential                       # ShiftAssignment.supervisor_assignment_id (junior supervision chain)
    - cross_aggregate                        # GiftShopSale lines -> GiftShopItem stock; campaign proceeds
  role_model: segregation_of_duties          # adjudicator != submitter; disburser != campaign creator; staff vs volunteer boundary
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs canonical "FK -> X.id")
# =============================================================================
entities:
  - name: VolunteerApplication
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); drives is-junior evaluation" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text application notes" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | IN_REVIEW | NEEDS_INFO | APPROVED | REJECTED | WITHDRAWN", constraints: "enum: SUBMITTED, IN_REVIEW, NEEDS_INFO, APPROVED, REJECTED, WITHDRAWN" }
      - { name: volunteer_id, type: string, source: system, required: false, description: "FK -> Volunteer.id; null on fresh applications until approval (then set to the created volunteer); set at creation for reapply-linked applications" }
      - { name: decided_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the deciding VolunteerServicesDirector" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of decide" }
      - { name: rejection_reason, type: string, source: input, required: false, description: "Required iff decision == REJECT" }
      - { name: info_request_note, type: string, source: input, required: false, description: "Note recorded when review requests more information" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date; junior iff age < 18 at the relevant service date" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: notes, type: string, source: input, required: false, description: "Coordinator notes" }
      - { name: service_status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | SEPARATED", constraints: "enum: ONBOARDING, ACTIVE, SUSPENDED, SEPARATED" }
      - { name: compliance_posture, type: enum, source: computed, description: "Derived live from clearance expiry fields + logical clock: CLEAR | RESTRICTED | FROZEN (see calculations.compliance_posture)", constraints: "enum: CLEAR, RESTRICTED, FROZEN" }
      - { name: total_service_hours, type: number, source: computed, default: 0, description: "Lifetime sum of minutes over HourEntry in status APPROVED, divided by 60, 2 decimal places" }
      - { name: recognition_points, type: number, source: computed, default: 0, description: "Lifetime category-weighted points: per HourEntry in APPROVED, round_half_up(hours x category_multiplier, 2), then summed" }
      - { name: recognition_tier, type: enum, source: computed, default: NONE, description: "NONE | BRONZE | SILVER | GOLD | PRESIDENT from recognition_points thresholds (>=)", constraints: "enum: NONE, BRONZE, SILVER, GOLD, PRESIDENT" }
      - { name: joined_at, type: datetime, source: system, description: "Logical-clock timestamp of (re)activation-path approval; anchors service-year anniversaries" }
      - { name: current_service_year_start, type: string, source: computed, description: "ISO date: most recent anniversary of joined_at that is <= today (joined_at date if first year not complete)" }
      - { name: separated_at, type: datetime, source: system, required: false, description: "Set on separation; cleared on reactivation" }
      - { name: separation_reason, type: string, source: system, required: false, description: "VOLUNTARY | INVOLUNTARY | DECEASED | MOVED | OTHER; cleared on reactivation" }
      - { name: suspension_reason, type: string, source: system, required: false, description: "MANUAL | COMPLIANCE_LAPSE | HOURS_SHORTFALL; cleared on reinstate" }
      - { name: is_junior_today, type: boolean, source: computed, description: "True iff age at today's logical-clock date < 18" }

  - name: Clearance
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; owning volunteer" }
      - { name: clearance_type, type: enum, source: input, description: "BACKGROUND (24mo validity) | HEALTH_TB (12mo) | HEALTH_FLU (12mo)", constraints: "enum: BACKGROUND, HEALTH_TB, HEALTH_FLU" }
      - { name: document_ref, type: string, source: input, description: "Reference to the submitted evidence document" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CLEARED | REJECTED | EXPIRED | REVOKED", constraints: "enum: SUBMITTED, CLEARED, REJECTED, EXPIRED, REVOKED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitter; segregation-of-duties anchor" }
      - { name: adjudicated_by_user_id, type: string, source: system, required: false, description: "X-User-ID of adjudicator; MUST differ from submitted_by_user_id" }
      - { name: adjudicated_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of adjudication" }
      - { name: expires_at, type: datetime, source: system, required: false, description: "adjudicated_at + validity months for the type (calendar months); null until CLEARED" }
      - { name: adjudication_notes, type: string, source: input, required: false, description: "Adjudicator notes" }

  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department name; unique" }
      - { name: head_user_id, type: string, source: input, description: "X-User-ID of the DepartmentHead who owns this department's requests" }
      - { name: junior_allowed, type: boolean, source: input, default: true, description: "If false, junior volunteers cannot be placed or assigned here" }

  - name: VolunteerRole
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Role name; unique" }
      - { name: category, type: enum, source: input, description: "PATIENT_FACING | GIFT_SHOP | CLERICAL | FUNDRAISING | COMMUNITY; drives hour weighting", constraints: "enum: PATIENT_FACING, GIFT_SHOP, CLERICAL, FUNDRAISING, COMMUNITY" }
      - { name: minimum_age, type: integer, source: input, default: 16, description: "Minimum age in years evaluated at the relevant service/offer date" }
      - { name: can_supervise_juniors, type: boolean, source: input, default: false, description: "Holders may supervise junior assignments (adult >= 21 also required)" }
      - { name: required_training_codes, type: array, source: input, default: [], description: "ANNUAL training codes that must be VALID to confirm a shift of this role" }

  - name: DepartmentRequest
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; requesting department" }
      - { name: role_id, type: string, source: input, description: "FK -> VolunteerRole.id; role requested" }
      - { name: slots_needed, type: integer, source: input, description: "Total slots to fill; >= 1" }
      - { name: slots_filled, type: integer, source: computed, default: 0, description: "Count of Placement rows for this request in status ACCEPTED; maintained incrementally (see calculations.slot_fill_evaluation)" }
      - { name: notes, type: string, source: input, required: false, description: "Request notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | FILLED | CLOSED | CANCELLED", constraints: "enum: DRAFT, OPEN, FILLED, CLOSED, CANCELLED" }
      - { name: filled_at, type: datetime, source: system, required: false, description: "When the last slot was accepted; cleared if reopened" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: input, description: "FK -> DepartmentRequest.id; the request this offer matches against" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the volunteer being placed" }
      - { name: offer_note, type: string, source: input, required: false, description: "Latest offer note from the department" }
      - { name: counter_note, type: string, source: input, required: false, description: "Latest counter note from the volunteer" }
      - { name: counter_rounds, type: integer, source: system, default: 0, description: "Number of volunteer counters used; max 2 (third counter attempt rejected)" }
      - { name: status, type: enum, source: system, description: "OFFERED | COUNTERED | ACCEPTED | DECLINED | RESCINDED", constraints: "enum: OFFERED, COUNTERED, ACCEPTED, DECLINED, RESCINDED" }
      - { name: accepted_at, type: datetime, source: system, required: false, description: "When accepted" }
      - { name: rescinded_at, type: datetime, source: system, required: false, description: "When rescinded" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; owning volunteer" }
      - { name: training_code, type: string, source: input, description: "Training code, e.g. ORIENTATION, HIPAA_ANNUAL, SAFETY_ANNUAL" }
      - { name: recurrence, type: enum, source: input, description: "ONE_TIME (never expires) | ANNUAL (expires completed_at + 12 calendar months)", constraints: "enum: ONE_TIME, ANNUAL" }
      - { name: status, type: enum, source: system, description: "PENDING | VALID | EXPIRED", constraints: "enum: PENDING, VALID, EXPIRED" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp set by complete" }
      - { name: expires_at, type: datetime, source: system, required: false, description: "completed_at + 12 months iff ANNUAL; null for ONE_TIME" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; hosting department" }
      - { name: role_id, type: string, source: input, description: "FK -> VolunteerRole.id; role worked" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (ISO 8601 UTC); must be < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Shift end (ISO 8601 UTC)" }
      - { name: capacity, type: integer, source: input, description: "Max assignments in {SIGNED_UP, CONFIRMED}; >= 1" }
      - { name: allow_waitlist, type: boolean, source: input, default: false, description: "If true, signups beyond capacity become WAITLISTED; else rejected" }
      - { name: filled_count, type: integer, source: computed, default: 0, description: "Count of assignments in {SIGNED_UP, CONFIRMED} for this shift; maintained incrementally" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PUBLISHED | COMPLETED | CANCELLED", constraints: "enum: SCHEDULED, PUBLISHED, COMPLETED, CANCELLED" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; the shift" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the assignee" }
      - { name: status, type: enum, source: system, description: "WAITLISTED | SIGNED_UP | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED", constraints: "enum: WAITLISTED, SIGNED_UP, CONFIRMED, COMPLETED, NO_SHOW, CANCELLED" }
      - { name: supervisor_assignment_id, type: string, source: input, required: false, description: "FK -> ShiftAssignment.id; supervising adult assignment on the SAME shift (required at confirm when assignee is junior at shift date)" }
      - { name: signed_up_at, type: datetime, source: system, description: "Logical-clock timestamp of signup/promotion" }
      - { name: confirmed_at, type: datetime, source: system, required: false, description: "When confirmed" }

  - name: HourEntry
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; whose hours" }
      - { name: shift_assignment_id, type: string, source: input, required: false, description: "FK -> ShiftAssignment.id; when present, minutes <= shift duration and service_date must equal the shift's calendar date" }
      - { name: service_date, type: string, source: input, description: "ISO date of service; must be <= today and >= joined_at date" }
      - { name: minutes, type: integer, source: input, description: "Minutes worked; 1..960" }
      - { name: service_category, type: enum, source: input, description: "PATIENT_FACING | GIFT_SHOP | CLERICAL | FUNDRAISING | COMMUNITY; IGNORED when shift_assignment_id present (server copies the shift role's category)", constraints: "enum: PATIENT_FACING, GIFT_SHOP, CLERICAL, FUNDRAISING, COMMUNITY" }
      - { name: notes, type: string, source: input, required: false, description: "Entry notes" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | REVERSED", constraints: "enum: PENDING, APPROVED, REJECTED, REVERSED" }
      - { name: approved_at, type: datetime, source: system, required: false, description: "When approved" }
      - { name: decision_reason, type: string, source: input, required: false, description: "Required on reject and on reverse" }

  - name: Badge
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; badge holder" }
      - { name: badge_number, type: string, source: system, description: "Server-minted 'BDG-' + 6-digit zero-padded sequence in badge creation order; globally unique, never reused" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | SUSPENDED | REVOKED", constraints: "enum: PENDING, ISSUED, SUSPENDED, REVOKED" }
      - { name: issued_at, type: datetime, source: system, required: false, description: "When first issued" }
      - { name: revoked_at, type: datetime, source: system, required: false, description: "When revoked" }
      - { name: revoke_reason, type: string, source: system, required: false, description: "SEPARATION | LOST_REPLACED | MANUAL" }

  - name: FundraisingCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents; >= 0" }
      - { name: start_at, type: datetime, source: input, description: "Campaign window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Campaign window end (exclusive); must be > start_at" }
      - { name: promo_discount_pct, type: integer, source: input, default: 0, description: "Promotional discount percent 0..50 applied to attributed sales" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | RECONCILED", constraints: "enum: DRAFT, ACTIVE, CLOSED, RECONCILED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating AuxiliaryTreasurer; disbursement SoD anchor" }
      - { name: closed_at, type: datetime, source: system, required: false, description: "When closed; disbursement cooling-off runs 7 days from this" }
      - { name: gross_receipts_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over ALL attributed sales regardless of void (everything ever rung)" }
      - { name: raised_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over attributed sales in status COMPLETED (voids excluded)" }
      - { name: net_proceeds_cents, type: integer, source: computed, default: 0, description: "raised_cents - COGS of non-voided attributed lines (sum qty x unit_cost_cents)" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of completed disbursements" }

  - name: GiftShopItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit; unique" }
      - { name: name, type: string, source: input, description: "Item name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Sell price per unit; >= 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "COGS per unit; >= 0 and <= unit_price_cents" }
      - { name: stock_on_hand, type: integer, source: input, default: 0, description: "Current stock; decremented on sale, restored on void; >= 0" }
      - { name: reorder_level, type: integer, source: input, default: 0, description: "Restock hint threshold; informational" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive items cannot be sold (soft disable; still queryable)" }

  - name: GiftShopSale
    parent: null
    common_fields: true
    fields:
      - { name: cashier_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must be ACTIVE with an ACCEPTED placement whose role category is GIFT_SHOP" }
      - { name: buyer_volunteer_id, type: string, source: input, required: false, description: "FK -> Volunteer.id; buyer for discount purposes (null = public sale, no tier/junior discount)" }
      - { name: campaign_id, type: string, source: input, required: false, description: "FK -> FundraisingCampaign.id; attribution; campaign must be ACTIVE and now inside [start_at, end_at)" }
      - { name: lines, type: array, source: input, description: "Array of {item_id, qty}; qty integer >= 1; at least one line" }
      - { name: total_cents, type: integer, source: computed, description: "Per-line round_half_up(qty x unit_price_cents x (1 - discount_pct)), then summed (see calculations.sale_total_cents)" }
      - { name: discount_pct_applied, type: integer, source: computed, description: "The single winning discount percent (max of eligible candidates; non-stacking)" }
      - { name: tendered_cents, type: integer, source: input, description: "Cash tendered; must be >= total_cents" }
      - { name: change_cents, type: integer, source: computed, description: "tendered_cents - total_cents" }
      - { name: status, type: enum, source: system, description: "COMPLETED | VOIDED", constraints: "enum: COMPLETED, VOIDED" }
      - { name: voided_at, type: datetime, source: system, required: false, description: "When voided (must be within 24h of sale creation)" }
      - { name: void_reason, type: string, source: input, required: false, description: "Required on void" }
      - { name: voided_by_user_id, type: string, source: system, required: false, description: "X-User-ID of voiding staffer" }

  - name: RecognitionEvent
    parent: null
    common_fields: false   # append-only event log: id + created_at only; no update endpoint, no version
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; recognized volunteer" }
      - { name: event_type, type: enum, source: system, description: "TIER_INCREASED | TIER_DECREASED", constraints: "enum: TIER_INCREASED, TIER_DECREASED" }
      - { name: tier, type: enum, source: system, description: "The tier moved INTO: NONE | BRONZE | SILVER | GOLD | PRESIDENT", constraints: "enum: NONE, BRONZE, SILVER, GOLD, PRESIDENT" }
      - { name: points_snapshot, type: number, source: system, description: "recognition_points at the moment of the event, 2 decimal places" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VolunteerApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /auxiliary/volunteer-applications/{id}/start-review"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is SUBMITTED (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects: []
      - from: IN_REVIEW
        to: NEEDS_INFO
        trigger: "POST /auxiliary/volunteer-applications/{id}/request-info"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is IN_REVIEW (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects:
          - "Records info_request_note"
      - from: NEEDS_INFO
        to: IN_REVIEW
        trigger: "POST /auxiliary/volunteer-applications/{id}/resubmit"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is NEEDS_INFO (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects: []
        note: "Information-request loop: IN_REVIEW -> NEEDS_INFO -> IN_REVIEW may repeat without bound"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /auxiliary/volunteer-applications/{id}/decide with decision=APPROVE"
        actor: VolunteerServicesDirector
        preconditions:
          - "Application is IN_REVIEW (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects:
          - "FRESH application (volunteer_id null): create Volunteer with service_status=ONBOARDING, joined_at=now; set application.volunteer_id to the new volunteer"
          - "REAPPLY application (volunteer_id set): linked Volunteer transitions SEPARATED -> ONBOARDING; joined_at reset to now; separated_at/separation_reason/suspension_reason cleared"
          - "Create Badge for the volunteer in PENDING (exactly one non-REVOKED badge per volunteer invariant)"
          - "Create TrainingRecord(volunteer, 'ORIENTATION', ONE_TIME) in PENDING"
          - "Sets decided_by_user_id, decided_at"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /auxiliary/volunteer-applications/{id}/decide with decision=REJECT"
        actor: VolunteerServicesDirector
        preconditions:
          - "Application is IN_REVIEW (ERR_APPLICATION_NOT_ACTIONABLE)"
          - "rejection_reason provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "Sets decided_by_user_id, decided_at"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /auxiliary/volunteer-applications/{id}/withdraw"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is SUBMITTED, IN_REVIEW, or NEEDS_INFO (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects: []
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /auxiliary/volunteer-applications/{id}/withdraw"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is SUBMITTED, IN_REVIEW, or NEEDS_INFO (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects: []
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /auxiliary/volunteer-applications/{id}/withdraw"
        actor: VolunteerCoordinator
        preconditions:
          - "Application is SUBMITTED, IN_REVIEW, or NEEDS_INFO (ERR_APPLICATION_NOT_ACTIONABLE)"
        side_effects: []

  - entity: Volunteer
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /auxiliary/volunteers/{id}/activate"
        actor: VolunteerCoordinator
        preconditions:
          - "Volunteer is ONBOARDING (ERR_VOLUNTEER_INVALID_STATE)"
          - "TrainingRecord(volunteer, 'ORIENTATION') exists and is VALID (ERR_ORIENTATION_INCOMPLETE)"
          - "For each clearance_type in {BACKGROUND, HEALTH_TB, HEALTH_FLU}: the latest-created Clearance of that type for the volunteer is CLEARED with expires_at > now (ERR_CLEARANCE_REQUIREMENTS_UNMET)"
          - "At least one Placement for the volunteer is ACCEPTED (ERR_NO_ACCEPTED_PLACEMENT)"
          - "A Badge in PENDING exists for the volunteer (ERR_BADGE_INVALID_STATE)"
        side_effects:
          - "Badge PENDING -> ISSUED, issued_at = now"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /auxiliary/volunteers/{id}/suspend  OR  system annual-review sweep (posture FROZEN or completed-service-year hour shortfall)"
        actor: "VolunteerCoordinator | VolunteerServicesDirector | system"
        preconditions:
          - "Volunteer is ACTIVE (ERR_VOLUNTEER_INVALID_STATE)"
        side_effects:
          - "Badge in ISSUED -> SUSPENDED"
          - "Sets suspension_reason (MANUAL | COMPLIANCE_LAPSE | HOURS_SHORTFALL)"
          - "Existing shift assignments are NOT cancelled by suspension (contrast with posture-FROZEN revocation cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /auxiliary/volunteers/{id}/reinstate"
        actor: "VolunteerCoordinator | VolunteerServicesDirector"
        preconditions:
          - "Volunteer is SUSPENDED (ERR_VOLUNTEER_INVALID_STATE)"
          - "compliance_posture != FROZEN (ERR_POSTURE_FROZEN) — the clearance lapse that caused the suspension must be cured first"
        side_effects:
          - "Badge in SUSPENDED -> ISSUED"
          - "Clears suspension_reason"
      - from: ONBOARDING
        to: SEPARATED
        trigger: "POST /auxiliary/volunteers/{id}/separate"
        actor: VolunteerServicesDirector
        preconditions:
          - "Volunteer is ONBOARDING, ACTIVE, or SUSPENDED (ERR_VOLUNTEER_INVALID_STATE)"
        side_effects:
          - "Badge in {PENDING, ISSUED, SUSPENDED} -> REVOKED (revoke_reason=SEPARATION)"
          - "Every ShiftAssignment of this volunteer in {SIGNED_UP, CONFIRMED, WAITLISTED} whose Shift.start_at > now -> CANCELLED; for each such cancellation on a PUBLISHED shift, run calculations.waitlist_promotion for that shift"
          - "Every Placement of this volunteer in {OFFERED, COUNTERED} -> RESCINDED"
          - "Every Placement of this volunteer in ACCEPTED -> RESCINDED: its DepartmentRequest.slots_filled -= 1, and if that request was FILLED it reverts to OPEN with filled_at cleared (compensating chain, see calculations.slot_fill_evaluation)"
          - "Sets separated_at=now, separation_reason"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /auxiliary/volunteers/{id}/separate"
        actor: VolunteerServicesDirector
        preconditions:
          - "Volunteer is ONBOARDING, ACTIVE, or SUSPENDED (ERR_VOLUNTEER_INVALID_STATE)"
        side_effects:
          - "Badge in {PENDING, ISSUED, SUSPENDED} -> REVOKED (revoke_reason=SEPARATION)"
          - "Every ShiftAssignment of this volunteer in {SIGNED_UP, CONFIRMED, WAITLISTED} whose Shift.start_at > now -> CANCELLED; for each such cancellation on a PUBLISHED shift, run calculations.waitlist_promotion for that shift"
          - "Every Placement of this volunteer in {OFFERED, COUNTERED} -> RESCINDED"
          - "Every Placement of this volunteer in ACCEPTED -> RESCINDED: its DepartmentRequest.slots_filled -= 1, and if that request was FILLED it reverts to OPEN with filled_at cleared"
          - "Sets separated_at=now, separation_reason"
      - from: SUSPENDED
        to: SEPARATED
        trigger: "POST /auxiliary/volunteers/{id}/separate"
        actor: VolunteerServicesDirector
        preconditions:
          - "Volunteer is ONBOARDING, ACTIVE, or SUSPENDED (ERR_VOLUNTEER_INVALID_STATE)"
        side_effects:
          - "Badge in {PENDING, ISSUED, SUSPENDED} -> REVOKED (revoke_reason=SEPARATION)"
          - "Every ShiftAssignment of this volunteer in {SIGNED_UP, CONFIRMED, WAITLISTED} whose Shift.start_at > now -> CANCELLED; for each such cancellation on a PUBLISHED shift, run calculations.waitlist_promotion for that shift"
          - "Every Placement of this volunteer in {OFFERED, COUNTERED} -> RESCINDED"
          - "Every Placement of this volunteer in ACCEPTED -> RESCINDED: its DepartmentRequest.slots_filled -= 1, and if that request was FILLED it reverts to OPEN with filled_at cleared"
          - "Sets separated_at=now, separation_reason"
      - from: SEPARATED
        to: ONBOARDING
        trigger: "POST /auxiliary/volunteer-applications/{id}/decide with decision=APPROVE on a reapply-linked application"
        actor: VolunteerServicesDirector
        preconditions:
          - "Application is IN_REVIEW and application.volunteer_id references this SEPARATED volunteer"
        side_effects:
          - "See VolunteerApplication IN_REVIEW->APPROVED side effects (badge PENDING created, ORIENTATION TrainingRecord PENDING created, joined_at reset)"
        note: "Reactivation loop: SEPARATED is semi-terminal — exit only via the reapply -> approve path"

  - entity: Clearance
    initial_state: SUBMITTED
    terminal_states: [REVOKED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /auxiliary/clearances/{id}/adjudicate with decision=CLEARED"
        actor: Screener
        preconditions:
          - "Clearance is SUBMITTED (ERR_CLEARANCE_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SOD_CLEARANCE_ADJUDICATION)"
        side_effects:
          - "Sets adjudicated_by_user_id, adjudicated_at=now, expires_at = now + validity months (BACKGROUND: 24, HEALTH_TB: 12, HEALTH_FLU: 12)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /auxiliary/clearances/{id}/adjudicate with decision=REJECTED"
        actor: Screener
        preconditions:
          - "Clearance is SUBMITTED (ERR_CLEARANCE_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SOD_CLEARANCE_ADJUDICATION)"
        side_effects:
          - "Sets adjudicated_by_user_id, adjudicated_at=now"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /auxiliary/clearances/{id}/resubmit"
        actor: "Screener | VolunteerCoordinator"
        preconditions:
          - "Clearance is REJECTED or EXPIRED (ERR_CLEARANCE_INVALID_STATE)"
        side_effects:
          - "Sets document_ref to new value, submitted_by_user_id to the resubmitting X-User-ID; clears adjudicated_by_user_id/adjudicated_at/expires_at"
        note: "Resubmission cycle: REJECTED -> SUBMITTED and EXPIRED -> SUBMITTED reuse the same record, preserving the at-most-one-non-terminal-per-(volunteer,type) invariant"
      - from: CLEARED
        to: EXPIRED
        trigger: "system: POST /auxiliary/compliance/annual-review sweep when expires_at <= now"
        actor: system
        preconditions:
          - "Clearance is CLEARED and expires_at <= now"
        side_effects: []
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /auxiliary/clearances/{id}/resubmit"
        actor: "Screener | VolunteerCoordinator"
        preconditions:
          - "Clearance is REJECTED or EXPIRED (ERR_CLEARANCE_INVALID_STATE)"
        side_effects:
          - "Sets document_ref to new value, submitted_by_user_id to the resubmitting X-User-ID; clears adjudicated_* fields and expires_at"
      - from: CLEARED
        to: REVOKED
        trigger: "POST /auxiliary/clearances/{id}/revoke"
        actor: "Screener | VolunteerServicesDirector"
        preconditions:
          - "Clearance is CLEARED (ERR_CLEARANCE_INVALID_STATE)"
        side_effects:
          - "Recompute the volunteer's compliance_posture; a REVOKED type leaves no CLEARED record, so posture becomes FROZEN"
          - "CASCADE (depth 3): if posture flipped to FROZEN, every ShiftAssignment of the volunteer in {SIGNED_UP, CONFIRMED, WAITLISTED} whose Shift.start_at > now -> CANCELLED; each such cancellation on a PUBLISHED shift runs calculations.waitlist_promotion for that shift"

  - entity: DepartmentRequest
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /auxiliary/department-requests/{id}/open"
        actor: DepartmentHead
        preconditions:
          - "Request is DRAFT (ERR_REQUEST_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: FILLED
        trigger: "system: automatic when a Placement accept raises slots_filled to equal slots_needed"
        actor: system
        preconditions:
          - "Request is OPEN and slots_filled == slots_needed after the increment"
        side_effects:
          - "Sets filled_at = now"
      - from: FILLED
        to: OPEN
        trigger: "system: automatic when a rescind/separation drops slots_filled below slots_needed"
        actor: system
        preconditions:
          - "Request is FILLED and slots_filled < slots_needed after the decrement"
        side_effects:
          - "Clears filled_at"
      - from: OPEN
        to: CLOSED
        trigger: "POST /auxiliary/department-requests/{id}/close"
        actor: DepartmentHead
        preconditions:
          - "Request is OPEN or FILLED (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "Placements in {OFFERED, COUNTERED} for this request -> RESCINDED (ACCEPTED placements are unaffected)"
      - from: FILLED
        to: CLOSED
        trigger: "POST /auxiliary/department-requests/{id}/close"
        actor: DepartmentHead
        preconditions:
          - "Request is OPEN or FILLED (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "Placements in {OFFERED, COUNTERED} for this request -> RESCINDED (ACCEPTED placements are unaffected)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /auxiliary/department-requests/{id}/cancel"
        actor: "DepartmentHead | VolunteerServicesDirector"
        preconditions:
          - "Request is OPEN or FILLED (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "Placements in {OFFERED, COUNTERED} -> RESCINDED"
          - "Placements in ACCEPTED -> RESCINDED with slots_filled decremented per rescission (request lands CANCELLED regardless of the transient FILLED/OPEN flips)"
      - from: FILLED
        to: CANCELLED
        trigger: "POST /auxiliary/department-requests/{id}/cancel"
        actor: "DepartmentHead | VolunteerServicesDirector"
        preconditions:
          - "Request is OPEN or FILLED (ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "Placements in {OFFERED, COUNTERED} -> RESCINDED"
          - "Placements in ACCEPTED -> RESCINDED with slots_filled decremented per rescission"

  - entity: Placement
    initial_state: OFFERED
    terminal_states: [DECLINED, RESCINDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /auxiliary/placements/{id}/accept"
        actor: "Volunteer | VolunteerCoordinator"
        preconditions:
          - "Placement is OFFERED (ERR_PLACEMENT_INVALID_STATE)"
          - "Volunteer.service_status in {ONBOARDING, ACTIVE} (ERR_VOLUNTEER_INVALID_STATE)"
          - "Volunteer.compliance_posture != FROZEN (ERR_POSTURE_FROZEN)"
          - "DepartmentRequest.status == OPEN (ERR_REQUEST_NOT_OPEN) — evaluated against the PRE-INCREMENT slots_filled (see calculations.slot_fill_evaluation)"
          - "Volunteer holds fewer than 2 ACCEPTED placements (ERR_PLACEMENT_LIMIT_EXCEEDED)"
        side_effects:
          - "DepartmentRequest.slots_filled += 1; if slots_filled == slots_needed the request auto-transitions OPEN -> FILLED (filled_at=now)"
          - "Sets accepted_at=now"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /auxiliary/placements/{id}/decline"
        actor: "Volunteer | VolunteerCoordinator"
        preconditions:
          - "Placement is OFFERED or COUNTERED (ERR_PLACEMENT_INVALID_STATE)"
        side_effects: []
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /auxiliary/placements/{id}/decline"
        actor: "Volunteer | VolunteerCoordinator"
        preconditions:
          - "Placement is OFFERED or COUNTERED (ERR_PLACEMENT_INVALID_STATE)"
        side_effects: []
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /auxiliary/placements/{id}/counter"
        actor: Volunteer
        preconditions:
          - "Placement is OFFERED (ERR_PLACEMENT_INVALID_STATE)"
          - "counter_rounds < 2 (ERR_COUNTER_ROUND_EXHAUSTED)"
        side_effects:
          - "counter_rounds += 1; records counter_note"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /auxiliary/placements/{id}/reoffer"
        actor: DepartmentHead
        preconditions:
          - "Placement is COUNTERED (ERR_PLACEMENT_INVALID_STATE)"
          - "DepartmentRequest.status == OPEN (ERR_REQUEST_NOT_OPEN)"
        side_effects:
          - "Records offer_note"
        note: "Negotiation cycle OFFERED -> COUNTERED -> OFFERED bounded by counter_rounds <= 2"
      - from: OFFERED
        to: RESCINDED
        trigger: "POST /auxiliary/placements/{id}/rescind  OR  cascade from request close/cancel or volunteer separation"
        actor: "VolunteerCoordinator | DepartmentHead | system"
        preconditions:
          - "Placement is OFFERED, COUNTERED, or ACCEPTED (ERR_PLACEMENT_INVALID_STATE)"
        side_effects:
          - "Sets rescinded_at=now"
      - from: COUNTERED
        to: RESCINDED
        trigger: "POST /auxiliary/placements/{id}/rescind  OR  cascade"
        actor: "VolunteerCoordinator | DepartmentHead | system"
        preconditions:
          - "Placement is OFFERED, COUNTERED, or ACCEPTED (ERR_PLACEMENT_INVALID_STATE)"
        side_effects:
          - "Sets rescinded_at=now"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /auxiliary/placements/{id}/rescind  OR  cascade from request cancel or volunteer separation"
        actor: "VolunteerCoordinator | DepartmentHead | system"
        preconditions:
          - "Placement is OFFERED, COUNTERED, or ACCEPTED (ERR_PLACEMENT_INVALID_STATE)"
        side_effects:
          - "DepartmentRequest.slots_filled -= 1; if the request was FILLED it auto-reverts to OPEN (filled_at cleared) — unless the rescind was caused by the request's own cancel transition, which lands CANCELLED"
          - "Sets rescinded_at=now"

  - entity: TrainingRecord
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VALID
        trigger: "POST /auxiliary/training-records/{id}/complete"
        actor: VolunteerCoordinator
        preconditions:
          - "Record is PENDING or EXPIRED (ERR_TRAINING_RECORD_INVALID_STATE)"
        side_effects:
          - "completed_at=now; if recurrence==ANNUAL, expires_at = completed_at + 12 calendar months (ONE_TIME: expires_at stays null)"
      - from: EXPIRED
        to: VALID
        trigger: "POST /auxiliary/training-records/{id}/complete (recertification cycle)"
        actor: VolunteerCoordinator
        preconditions:
          - "Record is PENDING or EXPIRED (ERR_TRAINING_RECORD_INVALID_STATE)"
        side_effects:
          - "completed_at=now; if recurrence==ANNUAL, expires_at = completed_at + 12 calendar months"
      - from: VALID
        to: EXPIRED
        trigger: "system: POST /auxiliary/compliance/annual-review sweep when recurrence==ANNUAL and expires_at <= now"
        actor: system
        preconditions:
          - "Record is VALID, ANNUAL, expires_at <= now"
        side_effects: []

  - entity: Shift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /auxiliary/shifts/{id}/publish"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift is SCHEDULED (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /auxiliary/shifts/{id}/cancel"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift is SCHEDULED or PUBLISHED (ERR_SHIFT_INVALID_STATE)"
        side_effects:
          - "Assignments in {WAITLISTED, SIGNED_UP, CONFIRMED} -> CANCELLED (no waitlist promotion: the shift itself is gone)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /auxiliary/shifts/{id}/cancel"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift is SCHEDULED or PUBLISHED (ERR_SHIFT_INVALID_STATE)"
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /auxiliary/shifts/{id}/complete"
        actor: VolunteerCoordinator
        preconditions:
          - "Shift is PUBLISHED (ERR_SHIFT_INVALID_STATE)"
          - "now >= end_at (ERR_SHIFT_NOT_ENDED)"
        side_effects:
          - "Each CONFIRMED assignment with no APPROVED HourEntry referencing it -> NO_SHOW (feeds the service-year no-show penalty)"
          - "Each SIGNED_UP or WAITLISTED assignment -> CANCELLED (auto; no promotion, shift is over)"

  - entity: ShiftAssignment
    initial_state: SIGNED_UP   # or WAITLISTED when created against a full waitlist-enabled shift
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: SIGNED_UP
        trigger: "system: waitlist promotion when a {SIGNED_UP, CONFIRMED} assignment on the same PUBLISHED shift is cancelled"
        actor: system
        preconditions:
          - "Assignment is WAITLISTED, is the earliest-created eligible WAITLISTED row for the shift (see calculations.waitlist_promotion), volunteer ACTIVE, posture != FROZEN, no half-open overlap with the volunteer's other {SIGNED_UP, CONFIRMED} assignments"
        side_effects:
          - "Shift.filled_count += 1; signed_up_at = promotion time"
      - from: SIGNED_UP
        to: CONFIRMED
        trigger: "POST /auxiliary/shift-assignments/{id}/confirm"
        actor: VolunteerCoordinator
        preconditions:
          - "Assignment is SIGNED_UP (ERR_ASSIGNMENT_INVALID_STATE)"
          - "Volunteer.service_status == ACTIVE (ERR_VOLUNTEER_INVALID_STATE)"
          - "Volunteer.compliance_posture == CLEAR (ERR_POSTURE_NOT_CLEAR)"
          - "Volunteer has a Badge in ISSUED (ERR_BADGE_INVALID_STATE)"
          - "Every code in the shift role's required_training_codes has a VALID TrainingRecord for the volunteer (ERR_TRAINING_REQUIREMENT_UNMET)"
          - "If assignee is junior at shift date: supervisor_assignment_id provided (ERR_SUPERVISION_REQUIRED); it references a CONFIRMED assignment on the SAME shift whose volunteer is >= 21 at shift date and whose role has can_supervise_juniors=true (ERR_SUPERVISOR_INELIGIBLE); counting this confirm, the supervisor has <= 3 junior supervisees on that shift (ERR_SUPERVISOR_RATIO_EXCEEDED)"
        side_effects:
          - "Sets confirmed_at=now; stores supervisor_assignment_id when provided"
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /auxiliary/shift-assignments/{id}/cancel  OR  cascade (shift cancel/complete, separation, posture freeze, shift complete)"
        actor: "Volunteer | VolunteerCoordinator | VolunteerServicesDirector | system"
        preconditions:
          - "Assignment is SIGNED_UP, CONFIRMED, or WAITLISTED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "If actor is Volunteer: now < shift.start_at - 24h (ERR_CANCEL_WINDOW_CLOSED); staff roles bypass the window"
        side_effects:
          - "If the cancelled assignment was in {SIGNED_UP, CONFIRMED}: Shift.filled_count -= 1"
          - "If the shift is PUBLISHED: run calculations.waitlist_promotion for the shift"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /auxiliary/shift-assignments/{id}/cancel  OR  cascade"
        actor: "Volunteer | VolunteerCoordinator | VolunteerServicesDirector | system"
        preconditions:
          - "Assignment is SIGNED_UP, CONFIRMED, or WAITLISTED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "If actor is Volunteer: now < shift.start_at - 24h (ERR_CANCEL_WINDOW_CLOSED)"
        side_effects:
          - "Shift.filled_count -= 1"
          - "If the shift is PUBLISHED: run calculations.waitlist_promotion for the shift"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /auxiliary/shift-assignments/{id}/cancel  OR  cascade"
        actor: "Volunteer | VolunteerCoordinator | VolunteerServicesDirector | system"
        preconditions:
          - "Assignment is SIGNED_UP, CONFIRMED, or WAITLISTED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "Waitlisted cancellations do not change filled_count and do not trigger promotion"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: when an HourEntry referencing this assignment is approved"
        actor: system
        preconditions:
          - "Assignment is CONFIRMED and the approved entry's shift_assignment_id == this assignment"
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: shift complete reconciliation (CONFIRMED with no APPROVED entry)"
        actor: system
        preconditions:
          - "Shift completion finds this assignment CONFIRMED with no APPROVED HourEntry referencing it"
        side_effects:
          - "Contributes a 2.0h penalty to calculations.service_year_hours for the service year containing shift.end_at"

  - entity: HourEntry
    initial_state: PENDING
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /auxiliary/hour-entries/{id}/approve"
        actor: VolunteerCoordinator
        preconditions:
          - "OCC: expected_volunteer_version matches the volunteer's current version (ERR_STALE_VERSION)"
          - "Entry is PENDING (ERR_HOUR_ENTRY_INVALID_STATE)"
        side_effects:
          - "Volunteer.total_service_hours += minutes/60 (2dp); Volunteer.version += 1"
          - "Volunteer.recognition_points += round_half_up(minutes/60 x category_multiplier, 2); recognition_tier recomputed"
          - "If tier increased: create RecognitionEvent(TIER_INCREASED, new tier, points snapshot)"
          - "If entry references a CONFIRMED ShiftAssignment: that assignment -> COMPLETED"
          - "Sets approved_at=now"
      - from: PENDING
        to: REJECTED
        trigger: "POST /auxiliary/hour-entries/{id}/reject"
        actor: VolunteerCoordinator
        preconditions:
          - "Entry is PENDING (ERR_HOUR_ENTRY_INVALID_STATE)"
          - "decision_reason provided (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: APPROVED
        to: REVERSED
        trigger: "POST /auxiliary/hour-entries/{id}/reverse"
        actor: VolunteerCoordinator
        preconditions:
          - "Entry is APPROVED (ERR_HOUR_ENTRY_INVALID_STATE)"
          - "decision_reason provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "Volunteer.total_service_hours -= minutes/60 (compensation; compensating invariant with approve)"
          - "Volunteer.recognition_points -= the same per-entry rounded points that approve added; recognition_tier recomputed"
          - "If tier decreased: create RecognitionEvent(TIER_DECREASED, new tier, points snapshot)"
          - "The linked ShiftAssignment is NOT reverted out of COMPLETED (documented asymmetry)"

  - entity: Badge
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "system: volunteer activation"
        actor: system
        preconditions:
          - "Volunteer activation succeeds"
        side_effects:
          - "issued_at=now"
      - from: ISSUED
        to: SUSPENDED
        trigger: "system: volunteer suspension (manual or annual-review)"
        actor: system
        preconditions:
          - "Volunteer ACTIVE -> SUSPENDED"
        side_effects: []
      - from: SUSPENDED
        to: ISSUED
        trigger: "system: volunteer reinstatement"
        actor: system
        preconditions:
          - "Volunteer SUSPENDED -> ACTIVE"
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "system: volunteer separation  OR  POST /auxiliary/badges/{id}/revoke  OR  POST /auxiliary/badges/{id}/replace"
        actor: "VolunteerCoordinator | system"
        preconditions:
          - "Badge is PENDING, ISSUED, or SUSPENDED (ERR_BADGE_INVALID_STATE)"
        side_effects:
          - "revoked_at=now; revoke_reason set"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: volunteer separation  OR  POST /auxiliary/badges/{id}/revoke  OR  POST /auxiliary/badges/{id}/replace"
        actor: "VolunteerCoordinator | system"
        preconditions:
          - "Badge is PENDING, ISSUED, or SUSPENDED (ERR_BADGE_INVALID_STATE)"
        side_effects:
          - "revoked_at=now; revoke_reason set"
      - from: PENDING
        to: REVOKED
        trigger: "system: volunteer separation before activation"
        actor: system
        preconditions:
          - "Badge is PENDING, ISSUED, or SUSPENDED (ERR_BADGE_INVALID_STATE)"
        side_effects:
          - "revoked_at=now; revoke_reason set"
    note: "POST /auxiliary/badges/{id}/replace targets a live (ISSUED/SUSPENDED) badge: it drives that badge ISSUED/SUSPENDED -> REVOKED (revoke_reason=LOST_REPLACED) AND creates a NEW Badge row directly in ISSUED with the next sequential badge_number, returning the new badge. The REVOKED row stays REVOKED (terminal). Invariant: exactly one badge per volunteer in {PENDING, ISSUED, SUSPENDED} at all times."

  - entity: FundraisingCampaign
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /auxiliary/fundraising-campaigns/{id}/activate"
        actor: AuxiliaryTreasurer
        preconditions:
          - "Campaign is DRAFT (ERR_CAMPAIGN_INVALID_STATE)"
          - "start_at <= now < end_at (ERR_CAMPAIGN_WINDOW_MISMATCH)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /auxiliary/fundraising-campaigns/{id}/close"
        actor: AuxiliaryTreasurer
        preconditions:
          - "Campaign is ACTIVE (ERR_CAMPAIGN_INVALID_STATE)"
          - "now >= end_at (ERR_CAMPAIGN_WINDOW_MISMATCH)"
        side_effects:
          - "closed_at=now"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /auxiliary/fundraising-campaigns/{id}/reconcile"
        actor: AuxiliaryTreasurer
        preconditions:
          - "Campaign is CLOSED (ERR_CAMPAIGN_INVALID_STATE)"
        side_effects: []

  - entity: GiftShopSale
    initial_state: COMPLETED
    terminal_states: [VOIDED]
    transitions:
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /auxiliary/gift-shop-sales/{id}/void"
        actor: "AuxiliaryTreasurer | VolunteerCoordinator"
        preconditions:
          - "Sale is COMPLETED (ERR_SALE_ALREADY_VOIDED)"
          - "now <= created_at + 24h (ERR_VOID_WINDOW_ELAPSED)"
          - "void_reason provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "Each line's GiftShopItem.stock_on_hand += qty (compensating invariant with sale creation)"
          - "If attributed: campaign raised_cents -= total_cents and net_proceeds_cents -= (total_cents - line COGS); gross_receipts_cents unchanged"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: volunteer-profile-update-occ
    parent_entity: Volunteer
    write_endpoint: "PUT /auxiliary/volunteers/{id}"
    occ_field: expected_volunteer_version
    description: |
      Updating a Volunteer profile with an expected_volunteer_version that no
      longer matches the volunteer's current version is rejected. The check
      captures the case where another writer has mutated the volunteer (profile
      edit, hour approval, suspension cascade, ...) since the client last read
      the record, making the client's submitted version stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shift-reschedule-occ
    parent_entity: Shift
    write_endpoint: "PUT /auxiliary/shifts/{id}"
    occ_field: expected_shift_version
    description: |
      Rescheduling a Shift with an expected_shift_version that no longer matches
      the shift's current version is rejected. A second reschedule request sent
      after a first reschedule completed observes an unchanged business state
      (the shift is still SCHEDULED or PUBLISHED and still has no live
      assignments) and would legitimately succeed; only the stale version pin
      rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: hour-approval-occ
    parent_entity: Volunteer
    write_endpoint: "POST /auxiliary/hour-entries/{id}/approve"
    occ_field: expected_volunteer_version
    description: |
      Approving an HourEntry carries expected_volunteer_version because approval
      mutates the volunteer's derived totals (total_service_hours,
      recognition_points, recognition_tier) and bumps Volunteer.version. A
      second approval of a different PENDING entry that still carries the
      pre-approval version is rejected: the entry itself is legitimately
      approvable, only the client-pinned volunteer version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compliance_posture
    trigger: "on every read of Volunteer; after any Clearance mutation or annual-review expiry; gates signup/accept (FROZEN blocked) and confirm (CLEAR required)"
    algorithm: threshold
    formula: |
      For each clearance_type T in {BACKGROUND, HEALTH_TB, HEALTH_FLU}:
        let C = the Clearance of type T for the volunteer with the latest created_at
        verdict(T):
          - no such C, or C.status in {SUBMITTED, REJECTED, REVOKED}   -> HARD_FAIL
          - C.status in {CLEARED, EXPIRED} — evaluate C.expires_at against now:
              * now > expires_at + 30 days                            -> HARD_FAIL
              * expires_at < now <= expires_at + 30 days              -> GRACE (past expiry, inside grace)
              * expires_at - 30 days <= now <= expires_at             -> GRACE (expiring soon)
              * now < expires_at - 30 days                            -> OK
      posture = FROZEN     if any verdict is HARD_FAIL
              = RESTRICTED if no HARD verdict and at least one GRACE
              = CLEAR      otherwise (all three OK)
    constants:
      GRACE_DAYS: 30
      EXPIRING_SOON_DAYS: 30
      REQUIRED_TYPES: [BACKGROUND, HEALTH_TB, HEALTH_FLU]
    input_set: "Clearances of the volunteer, selected latest-created per clearance_type; evaluated against the logical clock"
    precision: "datetime comparisons at second precision; all boundaries inclusive as written (<= / <) above"

  - name: recognition_points_weighted
    trigger: "HourEntry approve / reverse"
    algorithm: weighted_scoring
    formula: |
      multiplier(category): PATIENT_FACING=1.5, FUNDRAISING=1.2, GIFT_SHOP=1.0,
                            COMMUNITY=1.0, CLERICAL=0.8
      Per HourEntry: points(entry) = round_half_up((entry.minutes / 60) * multiplier(category), 2)
      recognition_points = SUM(points(entry)) over entries in status APPROVED
      REVERSED and REJECTED and PENDING entries are excluded.
      ROUNDING ORDER IS PINNED: round each entry to 2 decimals FIRST, then sum.
      (Sum-then-round is a different, non-conforming algorithm and yields
      different cents-level results — e.g. three 25-minute CLERICAL entries give
      0.33+0.33+0.33 = 0.99 here vs 1.00 under sum-then-round.)
      Reverse subtracts exactly the per-entry points value that approve added.
    input_set: "HourEntry rows of the volunteer in status APPROVED only"
    constants:
      MULT_PATIENT_FACING: 1.5
      MULT_FUNDRAISING: 1.2
      MULT_GIFT_SHOP: 1.0
      MULT_COMMUNITY: 1.0
      MULT_CLERICAL: 0.8
    precision: "2 decimal places per entry, round_half_up, then exact decimal sum"
    variants:
      - name: raw_lifetime_hours
        when: "reported alongside as Volunteer.total_service_hours"
        difference: "unweighted: sum(minutes)/60 over APPROVED entries, 2dp — the same input set produces a DIFFERENT number whenever any non-1.0-multiplier entry exists"
      - name: weighted_points
        when: "canonical for recognition tiering"
        difference: "per-entry weighted and rounded as above"

  - name: recognition_tier_assignment
    trigger: "after every recognition_points recompute (approve, reverse, annual-review sweep)"
    algorithm: threshold
    formula: |
      tier = PRESIDENT if points >= 1000.00
             GOLD      if points >= 600.00
             SILVER    if points >= 300.00
             BRONZE    if points >= 100.00
             NONE      otherwise
      Boundaries are INCLUSIVE (>=): exactly 100.00 -> BRONZE.
      A tier change creates a RecognitionEvent (TIER_INCREASED / TIER_DECREASED).
    input_set: "Volunteer.recognition_points"
    constants:
      BRONZE_MIN: 100.00
      SILVER_MIN: 300.00
      GOLD_MIN: 600.00
      PRESIDENT_MIN: 1000.00
    precision: "2 decimal places, comparisons exact"

  - name: service_year_hours
    trigger: "annual-review sweep (shortfall evaluation over the most recently COMPLETED service year); also exposed on GET /volunteers/{id}/summary for the CURRENT service year"
    algorithm: chronological
    formula: |
      Service year N for the volunteer covers [joined_at + (N-1) years, joined_at + N years).
      EVALUATION ORDER IS PINNED:
        (1) approved_hours = SUM(minutes)/60 over HourEntry in status APPROVED
            whose service_date falls inside the window [start inclusive, end exclusive)
        (2) penalty = 2.0 * (count of the volunteer's ShiftAssignments in status NO_SHOW
            whose Shift.end_at falls inside the same window)
        (3) service_year_hours = max(0.0, approved_hours - penalty)
      Minimums evaluated at annual review for the most recently completed year:
        adult (age >= 18 at the year-end date): >= 100.0 hours
        junior (age < 18 at the year-end date): >= 40.0 hours
      Shortfall on an ACTIVE volunteer -> SUSPENDED with suspension_reason=HOURS_SHORTFALL.
    input_set: "APPROVED HourEntry by service_date window; NO_SHOW ShiftAssignment by Shift.end_at window"
    constants:
      NO_SHOW_PENALTY_HOURS: 2.0
      ADULT_ANNUAL_MIN_HOURS: 100.0
      JUNIOR_ANNUAL_MIN_HOURS: 40.0
    precision: "2 decimal places"

  - name: is_junior_at_date
    trigger: "placement create (at now), shift signup (at shift start date), confirm (at shift start date), annual review (at service-year-end date)"
    algorithm: threshold
    formula: |
      age(d) = floor years between date_of_birth and d (birthday ON date d counts as reached)
      is_junior(d) = age(d) < 18
      A volunteer whose 18th birthday equals the shift's start date is ADULT for that shift.
    input_set: "Volunteer.date_of_birth and the evaluation date"
    precision: "calendar-date granularity; 18th birthday itself is adult"

  - name: junior_weekly_projected_hours
    trigger: "shift signup when is_junior(shift.start_at date) is true"
    algorithm: aggregation
    formula: |
      week = ISO week (Monday 00:00:00Z inclusive .. next Monday 00:00:00Z exclusive)
             containing shift.start_at
      projected = SUM(duration_hours of shifts of the volunteer's assignments in
                  status in {SIGNED_UP, CONFIRMED} whose shift.start_at is in week)
                  + duration_hours(new shift)
      WAITLISTED assignments are NOT counted (documented: waitlist is not an occupation).
      duration_hours = (end_at - start_at) in minutes / 60, exact 2dp.
      Reject iff projected > 16.0; exactly 16.0 is ALLOWED (<= boundary).
    input_set: "Volunteer's assignments in {SIGNED_UP, CONFIRMED} joined to their shifts, windowed by ISO week of the new shift's start"
    constants:
      JUNIOR_WEEKLY_CAP_HOURS: 16.0
    precision: "2 decimal places; cap inclusive (<= 16.0 passes)"

  - name: slot_fill_evaluation
    trigger: "placement accept / rescind / request cancel cascade / separation cascade"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
        (1) ACCEPT path: first check DepartmentRequest.status == OPEN using the
            PRE-INCREMENT slots_filled — i.e. the request that is one acceptance
            away from full is still OPEN for this acceptance;
        (2) then slots_filled += 1 (invariant: slots_filled == count of ACCEPTED
            placements for the request);
        (3) then recompute status: if slots_filled == slots_needed -> FILLED.
        (4) RESCIND path: slots_filled -= 1 first, then if request was FILLED and
            slots_filled < slots_needed -> back to OPEN (unless the rescind is part
            of the request's own cancel transition, which lands CANCELLED).
      Invariant: at all times slots_filled == count(Placement with this request_id
      and status == ACCEPTED).
    input_set: "Placements of the request in status ACCEPTED"
    precision: "integer"

  - name: waitlist_promotion
    trigger: "a {SIGNED_UP, CONFIRMED} assignment is cancelled on a PUBLISHED shift (manual cancel, separation cascade, or posture-freeze cascade)"
    algorithm: selector_policy
    formula: |
      eligibility: assignments of this shift in status WAITLISTED whose volunteer
        has service_status == ACTIVE, compliance_posture != FROZEN, and whose other
        assignments in {SIGNED_UP, CONFIRMED} do not half-open-overlap this shift
      ranking: created_at ASC (earliest waitlisted first)
      tie-break: none required — server-stamped created_at is monotonic per row
      fallback: if the top candidate is ineligible, SKIP to the next eligible
        candidate; if none is eligible, the slot stays open (no error)
      promotion: chosen row -> SIGNED_UP, filled_count += 1
    input_set: "WAITLISTED ShiftAssignments of the shift"
    precision: "selection is deterministic; Volunteer.id is never used for ordering"

  - name: sale_total_cents
    trigger: "POST /auxiliary/gift-shop-sales"
    algorithm: tiered_pricing
    formula: |
      Candidate discount percents (NON-STACKING — the maximum single candidate wins):
        tier_pct:    buyer is a Volunteer -> by buyer.recognition_tier:
                     BRONZE=5, SILVER=10, GOLD=15, PRESIDENT=20, else 0
        junior_pct:  buyer is a Volunteer AND is_junior(today) -> 5, else 0
        promo_pct:   campaign_id present -> that campaign's promo_discount_pct
                     (campaign must be ACTIVE and now in [start_at, end_at)), else 0
      discount_pct = max(tier_pct, junior_pct, promo_pct)   [>=3 interacting inputs]
      Per line: line_cents = round_half_up(qty * unit_price_cents * (100 - discount_pct) / 100)
      total_cents = SUM(line_cents)        [rounding order pinned: per-line first, then sum]
      change_cents = tendered_cents - total_cents (must be >= 0)
    input_set: "Sale lines joined to GiftShopItem.unit_price_cents; buyer Volunteer tier/junior flags; campaign promo"
    precision: "integer cents; round_half_up per line before summation"

  - name: campaign_proceeds
    trigger: "gift shop sale create/void attributed to the campaign; exposed on campaign reads"
    algorithm: aggregation
    formula: |
      gross_receipts_cents = SUM(total_cents) over attributed sales in {COMPLETED, VOIDED}
      raised_cents         = SUM(total_cents) over attributed sales in {COMPLETED}
      net_proceeds_cents   = raised_cents - SUM(qty * unit_cost_cents) over lines
                             of attributed sales in {COMPLETED}
      disbursable          = net_proceeds_cents - disbursed_cents
    input_set: "GiftShopSale rows with campaign_id == this campaign"
    precision: "integer cents"
    variants:
      - name: gross_receipts
        when: "audit view of everything ever rung for the campaign"
        difference: "includes VOIDED sales — for identical data gross >= raised >= net, and all three differ whenever a void or nonzero COGS exists"
      - name: net_proceeds
        when: "canonical for disbursement capacity"
        difference: "excludes voids and subtracts line-level COGS"

  - name: clearance_expiry
    trigger: "adjudicate(CLEARED) sets expires_at; annual-review sweep flips CLEARED -> EXPIRED"
    algorithm: chronological
    formula: |
      expires_at = adjudicated_at + validity_months(clearance_type) calendar months
      validity: BACKGROUND=24, HEALTH_TB=12, HEALTH_FLU=12
      sweep rule: CLEARED and expires_at <= now -> EXPIRED
      Note: compliance_posture derives from expires_at directly (live), so posture
      can show RESTRICTED/FROZEN before the sweep flips the stored status.
    input_set: "Clearances of the volunteer"
    constants:
      VALIDITY_MONTHS_BACKGROUND: 24
      VALIDITY_MONTHS_HEALTH_TB: 12
      VALIDITY_MONTHS_HEALTH_FLU: 12
    precision: "calendar-month arithmetic on UTC datetimes"

  - name: badge_number_minting
    trigger: "badge creation (application approval cascade, badge replace)"
    algorithm: chronological
    formula: |
      badge_number = "BDG-" + zero-padded 6-digit sequence: 1 + count of Badge rows
      ever created. Deterministic by creation order; never reused even after revoke.
      Server-minted; never derived from id.
    input_set: "Badge table"
    precision: "integer sequence"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Request body well-formed: required fields present, types valid, enum members valid, qty >= 1, amounts >= 0, start_at < end_at, end_at > start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist, validated left-to-right (path ids first, then body FKs in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: auth
    check: "Ownership: role Volunteer may only act on rows whose volunteer FK equals X-User-ID (self-read, self-signup, own hours, own placements, own sales); role DepartmentHead may only manage requests of a Department whose head_user_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "endpoints carrying a volunteer/department scope when called by Volunteer or DepartmentHead"

  - priority: 6
    category: auth
    check: "Segregation of duties: clearance adjudicator X-User-ID != Clearance.submitted_by_user_id (ERR_SOD_CLEARANCE_ADJUDICATION); campaign disburse caller X-User-ID != FundraisingCampaign.created_by_user_id (ERR_SOD_CAMPAIGN_DISBURSEMENT)"
    error_id: "ERR_SOD_CLEARANCE_ADJUDICATION | ERR_SOD_CAMPAIGN_DISBURSEMENT"
    http_status: 403
    applies_to: "POST /auxiliary/clearances/{id}/adjudicate; POST /auxiliary/fundraising-campaigns/{id}/disburse"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version (the three §1.2.1 endpoints)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /auxiliary/volunteers/{id}; PUT /auxiliary/shifts/{id}; POST /auxiliary/hour-entries/{id}/approve"

  - priority: 8
    category: state
    check: "Target-resource state preconditions per §1.2 machines (application actionable, volunteer status, clearance SUBMITTED/renewable, request OPEN, placement OFFERED/COUNTERED, shift PUBLISHED, assignment SIGNED_UP, hour entry PENDING/APPROVED, badge live, campaign DRAFT/ACTIVE/CLOSED, sale COMPLETED). Hour-entry create additionally requires the volunteer in {ACTIVE, SUSPENDED} (ERR_VOLUNTEER_INVALID_STATE); placement create requires the volunteer in {ONBOARDING, ACTIVE} with posture != FROZEN (ERR_VOLUNTEER_INVALID_STATE / ERR_POSTURE_FROZEN)"
    error_id: "ERR_APPLICATION_NOT_ACTIONABLE | ERR_VOLUNTEER_INVALID_STATE | ERR_CLEARANCE_INVALID_STATE | ERR_REQUEST_INVALID_STATE | ERR_REQUEST_NOT_OPEN | ERR_PLACEMENT_INVALID_STATE | ERR_SHIFT_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_HOUR_ENTRY_INVALID_STATE | ERR_BADGE_INVALID_STATE | ERR_CAMPAIGN_INVALID_STATE | ERR_SALE_ALREADY_VOIDED | ERR_POSTURE_FROZEN | ERR_POSTURE_NOT_CLEAR"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "Minor-protection and training gates: age(shift date) >= role.minimum_age (ERR_ROLE_MIN_AGE_NOT_MET); junior forbidden when department.junior_allowed=false (ERR_DEPARTMENT_JUNIOR_RESTRICTED); junior weekly projected hours <= 16.0 (ERR_JUNIOR_WEEKLY_HOUR_CAP_EXCEEDED); junior confirm requires supervisor_assignment_id (ERR_SUPERVISION_REQUIRED) that is eligible (ERR_SUPERVISOR_INELIGIBLE) within 1:3 ratio (ERR_SUPERVISOR_RATIO_EXCEEDED); confirm requires VALID annual trainings of the shift role (ERR_TRAINING_REQUIREMENT_UNMET); activate requires ORIENTATION VALID (ERR_ORIENTATION_INCOMPLETE) and all three clearances CLEARED (ERR_CLEARANCE_REQUIREMENTS_UNMET)"
    error_id: "ERR_ROLE_MIN_AGE_NOT_MET | ERR_DEPARTMENT_JUNIOR_RESTRICTED | ERR_JUNIOR_WEEKLY_HOUR_CAP_EXCEEDED | ERR_SUPERVISION_REQUIRED | ERR_SUPERVISOR_INELIGIBLE | ERR_SUPERVISOR_RATIO_EXCEEDED | ERR_TRAINING_REQUIREMENT_UNMET | ERR_ORIENTATION_INCOMPLETE | ERR_CLEARANCE_REQUIREMENTS_UNMET"
    http_status: 422
    applies_to: "placement create/accept, shift signup/confirm, volunteer activate"

  - priority: 10
    category: business_constraint
    check: "Uniqueness/capacity/graph constraints: at most one non-terminal Clearance per (volunteer, type) on create (ERR_DUPLICATE_ACTIVE_CLEARANCE); at most one live Badge per volunteer on activate (ERR_BADGE_INVALID_STATE); no duplicate placement per (volunteer, request) in {OFFERED, COUNTERED, ACCEPTED} (ERR_DUPLICATE_PLACEMENT); at placement ACCEPT, volunteer must hold < 2 ACCEPTED placements (ERR_PLACEMENT_LIMIT_EXCEEDED); no duplicate assignment per (volunteer, shift) in {WAITLISTED, SIGNED_UP, CONFIRMED} (ERR_DUPLICATE_SHIFT_ASSIGNMENT); half-open shift overlap per volunteer (ERR_SHIFT_TIME_OVERLAP); shift full without waitlist (ERR_SHIFT_AT_CAPACITY); counter_rounds < 2 (ERR_COUNTER_ROUND_EXHAUSTED); reschedule only with zero live assignments (ERR_SHIFT_HAS_ASSIGNMENTS); item is_active (ERR_ITEM_INACTIVE); minutes <= shift duration when linked (ERR_HOURS_EXCEED_SHIFT); activate requires >= 1 ACCEPTED placement (ERR_NO_ACCEPTED_PLACEMENT)"
    error_id: "ERR_DUPLICATE_ACTIVE_CLEARANCE | ERR_DUPLICATE_PLACEMENT | ERR_PLACEMENT_LIMIT_EXCEEDED | ERR_DUPLICATE_SHIFT_ASSIGNMENT | ERR_SHIFT_TIME_OVERLAP | ERR_SHIFT_AT_CAPACITY | ERR_COUNTER_ROUND_EXHAUSTED | ERR_SHIFT_HAS_ASSIGNMENTS | ERR_ITEM_INACTIVE | ERR_HOURS_EXCEED_SHIFT | ERR_NO_ACCEPTED_PLACEMENT"
    http_status: 409
    applies_to: "clearance create, placement create/counter/accept, shift update, assignment create, hour entry create, sale create, volunteer activate"

  - priority: 11
    category: business_temporal
    check: "Window/deadline rules: signup requires now < start_at - 24h (ERR_SIGNUP_WINDOW_CLOSED); volunteer self-cancel requires now < start_at - 24h (ERR_CANCEL_WINDOW_CLOSED); shift complete requires now >= end_at (ERR_SHIFT_NOT_ENDED); sale void within 24h of creation (ERR_VOID_WINDOW_ELAPSED); campaign activate requires start_at <= now < end_at and close requires now >= end_at (ERR_CAMPAIGN_WINDOW_MISMATCH); disbursement requires now >= closed_at + 7 days (ERR_DISBURSEMENT_COOLING_OFF); hour service_date <= today and >= joined_at date (ERR_SERVICE_DATE_OUT_OF_RANGE)"
    error_id: "ERR_SIGNUP_WINDOW_CLOSED | ERR_CANCEL_WINDOW_CLOSED | ERR_SHIFT_NOT_ENDED | ERR_VOID_WINDOW_ELAPSED | ERR_CAMPAIGN_WINDOW_MISMATCH | ERR_DISBURSEMENT_COOLING_OFF | ERR_SERVICE_DATE_OUT_OF_RANGE"
    http_status: 409
    applies_to: "assignment create/cancel, shift complete, sale void, campaign activate/close/disburse, hour entry create"

  - priority: 12
    category: business_referential
    check: "Cross-entity reference consistency: hour entry's shift_assignment_id must belong to the same volunteer (ERR_ASSIGNMENT_OWNERSHIP_MISMATCH); sale cashier_volunteer_id must be ACTIVE with an ACCEPTED placement whose role category == GIFT_SHOP (ERR_CASHIER_NOT_GIFT_SHOP_PLACED); attributed campaign must be ACTIVE (ERR_CAMPAIGN_INVALID_STATE)"
    error_id: "ERR_ASSIGNMENT_OWNERSHIP_MISMATCH | ERR_CASHIER_NOT_GIFT_SHOP_PLACED | ERR_CAMPAIGN_INVALID_STATE"
    http_status: 422
    applies_to: "hour entry create, gift shop sale create"
    note: "ERR_CAMPAIGN_INVALID_STATE keeps its catalog http 409 (cross-entity state check); the 422 codes apply to the pure referential failures"

  - priority: 13
    category: business_fiscal
    check: "Money/stock last: per-line qty <= stock_on_hand (ERR_INSUFFICIENT_STOCK); tendered_cents >= total_cents (ERR_INSUFFICIENT_TENDER); disburse amount_cents <= net_proceeds_cents - disbursed_cents (ERR_DISBURSEMENT_EXCEEDS_BALANCE)"
    error_id: "ERR_INSUFFICIENT_STOCK | ERR_INSUFFICIENT_TENDER | ERR_DISBURSEMENT_EXCEEDS_BALANCE"
    http_status: 402
    applies_to: "sale create, campaign disburse"
    note: "ERR_INSUFFICIENT_STOCK returns http 409 (inventory conflict); ERR_INSUFFICIENT_TENDER and ERR_DISBURSEMENT_EXCEEDS_BALANCE return 402"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint; deterministic time) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All expiry/window/grace rules read this clock."
    roles: [VolunteerServicesDirector, VolunteerCoordinator, Screener, DepartmentHead, AuxiliaryTreasurer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Volunteer Applications ---
  - method: POST
    path: "/auxiliary/volunteer-applications"
    description: "Intake a volunteer application (paper-form entry by the office)"
    roles: [VolunteerCoordinator, VolunteerServicesDirector]
    code: 201
    input: [full_name, date_of_birth, email, phone, "notes?"]
    output: VolunteerApplication
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/auxiliary/volunteer-applications"
    description: "List applications; FK reverse-lookup for Application.volunteer_id"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, Screener]
    code: 200
    input: ["status?", "volunteer_id?", "limit?", "offset?"]
    output: "VolunteerApplication[]"
    side_effects: []
  - method: GET
    path: "/auxiliary/volunteer-applications/{id}"
    description: "Get one application"
    roles: [VolunteerServicesDirector, VolunteerCoordinator, Screener]
    code: 200
    input: []
    output: VolunteerApplication
    side_effects: []
  - method: POST
    path: "/auxiliary/volunteer-applications/{id}/start-review"
    description: "SUBMITTED -> IN_REVIEW"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerApplication
    side_effects: []
  - method: POST
    path: "/auxiliary/volunteer-applications/{id}/request-info"
    description: "IN_REVIEW -> NEEDS_INFO"
    roles: [VolunteerCoordinator]
    code: 200
    input: [info_request_note]
    output: VolunteerApplication
