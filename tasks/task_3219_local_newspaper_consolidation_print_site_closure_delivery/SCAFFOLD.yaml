    side_effects: []

  - method: GET
    path: "/regional-news-ops/print-markets/{id}"
    description: "Get one print market"
    roles: [PrintOperationsDirector, DeliveryNetworkManager, CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: PrintMarket
    side_effects: []

  - method: GET
    path: "/regional-news-ops/print-markets"
    description: "List print markets, optionally filtered by region"
