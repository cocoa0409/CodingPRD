            - "Reconciliation.${recon_id}.true_up_cents == 500000"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: ti_allowance_exceeded_on_approve
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_TI_ALLOWANCE_EXCEEDED]"]
        distinguishing_aspect: "Approving a TI draw of 600000 against a lease with allowance 1000000 and already-drawn 500000 would push drawn to 1100000 > 1000000 -> ERR_TI_ALLOWANCE_EXCEEDED (422)."
        test_recipe:
          setup:
            - "Active lease, ti_allowance 1000000, one APPROVED draw of 500000 (drawn=500000), a second REQUESTED draw of 600000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, ti_allowance_cents: 1000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 500000 }
              as: PropertyManager
              captures: { draw1_id: $.data.id }
            - call: "POST /ti-draws/${draw1_id}/approve"
              payload: {}
              as: Accountant
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 600000 }
              as: PropertyManager
              captures: { draw2_id: $.data.id }
          trigger:
            - call: "POST /ti-draws/${draw2_id}/approve"
              payload: {}
              as: Accountant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TI_ALLOWANCE_EXCEEDED"
            - "Lease.${lease_id}.ti_drawn_cents == 500000"

      - name: ti_allowance_exact_fit_passes
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=16]", "state_machines.TiDraw.REQUESTED_to_APPROVED"]
        distinguishing_aspect: "A TI draw of exactly the remaining allowance (drawn 500000 + 500000 == allowance 1000000) is allowed (<= boundary), draw APPROVED, ti_drawn_cents == 1000000."
        test_recipe:
          setup:
            - "Active lease, ti_allowance 1000000, one APPROVED draw of 500000, a second REQUESTED draw of exactly 500000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, ti_allowance_cents: 1000000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 500000 }
              as: PropertyManager
              captures: { draw1_id: $.data.id }
            - call: "POST /ti-draws/${draw1_id}/approve"
              payload: {}
              as: Accountant
            - call: "POST /ti-draws"
              payload: { lease_id: "${lease_id}", amount_cents: 500000 }
              as: PropertyManager
              captures: { draw2_id: $.data.id }
          trigger:
            - call: "POST /ti-draws/${draw2_id}/approve"
              payload: {}
              as: Accountant
          assert:
            - "TiDraw.${draw2_id}.status == APPROVED"
            - "Lease.${lease_id}.ti_drawn_cents == 1000000"

      - name: capacity_exceeded_on_activate
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_CAPACITY_EXCEEDED]", "state_machines.Lease.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "Activating a 6000-sqft lease on a property with total 10000 and 5000 already occupied (remaining 5000) exceeds capacity -> ERR_CAPACITY_EXCEEDED (422); lease stays DRAFT."
        test_recipe:
          setup:
            - "Property total 10000 with one active lease of 5000 (occupied 5000); a DRAFT lease of 6000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T1", contact_email: "t1@x.com" }
              as: PropertyManager
              captures: { ten1_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T2", contact_email: "t2@x.com" }
              as: PropertyManager
              captures: { ten2_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten1_id}", leased_sqft: 5000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease1_id: $.data.id }
            - call: "POST /leases/${lease1_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten2_id}", leased_sqft: 6000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease2_id: $.data.id }
          trigger:
            - call: "POST /leases/${lease2_id}/activate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CAPACITY_EXCEEDED"
            - "Lease.${lease2_id}.status == DRAFT"

      - name: year_mismatch_on_recon_create
        claim_type: Cross-entity validation
        grounds: ["validations[priority=10]", "errors[ERR_YEAR_MISMATCH]", "entities.Reconciliation.fields.recon_year"]
        distinguishing_aspect: "Creating a reconciliation with recon_year 2024 against a pool whose pool_year is 2025 returns ERR_YEAR_MISMATCH (422)."
        test_recipe:
          setup:
            - "An active lease and a 2025 pool."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025 }
              as: Accountant
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_id}", pool_id: "${pool_id}", recon_year: 2024 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_YEAR_MISMATCH"

      - name: estoppel_confirm_balance_mismatch
        claim_type: Cross-entity validation
        grounds: ["validations[priority=17]", "errors[ERR_ESTOPPEL_BALANCE_MISMATCH]", "state_machines.EstoppelCertificate.ISSUED_to_CONFIRMED"]
        distinguishing_aspect: "A CONFIRMED response whose asserted_balance_cents (999) differs from the lease's actual outstanding_balance_cents (0) returns ERR_ESTOPPEL_BALANCE_MISMATCH (422); estoppel stays ISSUED."
        test_recipe:
          setup:
            - "Active lease balance 0; estoppel ISSUED asserting balance 999."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /estoppels"
              payload: { lease_id: "${lease_id}", asserted_balance_cents: 999, asserted_base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estoppels/${est_id}/respond"
              payload: { tenant_response: "CONFIRMED" }
              as: Tenant
              as_user_id: "${ten_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ESTOPPEL_BALANCE_MISMATCH"
            - "EstoppelCertificate.${est_id}.status == ISSUED"

      - name: estoppel_dispute_without_note_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=18]", "errors[ERR_DISPUTE_NOTE_REQUIRED]", "state_machines.EstoppelCertificate.ISSUED_to_DISPUTED"]
        distinguishing_aspect: "A DISPUTED estoppel response with no dispute_note returns ERR_DISPUTE_NOTE_REQUIRED (422); estoppel stays ISSUED (note required only on the DISPUTED branch)."
        test_recipe:
          setup:
            - "Active lease; estoppel ISSUED."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_id}", leased_sqft: 1000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /estoppels"
              payload: { lease_id: "${lease_id}", asserted_balance_cents: 0, asserted_base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estoppels/${est_id}/respond"
              payload: { tenant_response: "DISPUTED" }
              as: Tenant
              as_user_id: "${ten_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DISPUTE_NOTE_REQUIRED"
            - "EstoppelCertificate.${est_id}.status == ISSUED"

      - name: priority_state_beats_pool_locked
        claim_type: Priority conflict
        grounds: ["validations[priority=8]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_pool_locked_on_post
          rationale: "The state(8) vs business_referential(11) priority conflict is the named §1.8 instance's assertion."

