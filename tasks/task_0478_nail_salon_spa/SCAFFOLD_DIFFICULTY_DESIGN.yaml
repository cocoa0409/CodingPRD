            - call: "POST /menu-items"
              payload: { name: "Gel Mani CI2", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech CI2", license_number: "LIC-CI2", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client CI2", email: "cci2@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /_inject/client_state"
              payload: { client_id: "${c}", loyalty_points_balance: 60 }
              as: SalonManager
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-21T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { a_v: $.data.version }
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${a_v}", loyalty_points_redeemed: 50 }
              as: FrontDesk
              captures: { post_redeem: $.data.total_charged_cents }
          trigger:
            - call: "POST /appointments/${a}/refund-settled"
              payload: {}
              as: SalonManager
            - call: "GET /clients/${c}"
              payload: {}
              as: FrontDesk
              captures: { pts: $.data.loyalty_points_balance }
          assert:
            - "after checkout Client.${c}.loyalty_points_balance == 10 (60 - 50 redeemed + 0 award)"
            - "after refund-settled Client.${c}.loyalty_points_balance == 60 (redeem + award fully reversed)"
            - "after checkout Appointment.${a}.total_charged_cents == 4000"
