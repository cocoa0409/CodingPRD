scenario: |
  419. Student Loan Refinancing (SoFi/Earnest style): application & soft-credit prequal, rate (fixed/variable)
  & term grid, cosigner & release milestone, payoff/disbursement to prior servicers, autopay discount,
  hardship/forbearance, member-benefit perks, ABS loan-pool tagging

domain_name: student-loan-refi
api_prefix: /applications

# =============================================================================
# Complexity Profile (Expert band per §0.4)
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation   # borrower + cosigner must both consent; lender approves
  secondary_archetype: compliance_audit        # disbursement/payoff regulated; cosigner-release milestone audited
  complexity_layers:
    - dual_variant_calculation                 # prequal estimate APR vs final locked APR; daily-simple vs amortized interest
    - cascading_side_effects                    # offer accept -> loan create -> disbursements -> pool tag -> autopay enroll
    - rate_threshold_triggers                   # on-time payment streak crosses cosigner-release threshold
    - optimistic_concurrency                    # CREATE-with-supersede on offer-lock against a stale Application version

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Application, Offer, Loan, Cosigner,
  # Disbursement, Payment, ForbearancePlan, AbsPool are peers wired by FK.

  state_machine_shape: parallel
  # Loan carries two independent state dimensions: repayment_status (CURRENT/FORBEARANCE/...) and
  # cosigner_release_status (PENDING/ELIGIBLE/RELEASED). Application is branching (approve/decline/expire).

  relationship_patterns:
    - one_to_many        # Application -> Offer[]; Loan -> Disbursement[]; Loan -> Payment[]
    - cross_aggregate    # Loan references AbsPool; Offer references RateGridEntry
    - polymorphic        # AuditEvent.subject_type references Application | Loan | Cosigner

  role_model: segregation_of_duties
  # The Underwriter who approves an Application MUST NOT be the DisbursementOfficer who funds the loan
  # built from it. Borrower and Cosigner are entity-backed self-acting roles.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Login/contact email; unique across borrowers.
        constraints: unique; non-empty
      - name: full_name
        type: string
        source: input
        description: Legal name of the applicant.
      - name: annual_income_cents
        type: integer
        source: input
        description: Self-reported gross annual income in cents.
        constraints: ">= 0"
      - name: fico_band
        type: enum
        source: input
        description: Self-reported credit band used only until soft pull replaces it.
        constraints: "one of {SUBPRIME, NEAR_PRIME, PRIME, SUPER_PRIME}"
      - name: member_tier
        type: enum
        source: system
        description: Loyalty tier governing member-benefit perks; upgraded on loan funding.
        default: NONE
        constraints: "one of {NONE, SILVER, GOLD, PLATINUM}"

  - name: AbsPool
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: input
        description: Securitization pool identifier (e.g., SLRF-2026-A).
        constraints: unique; non-empty
      - name: max_principal_cents
        type: integer
        source: input
        description: Aggregate principal capacity of the pool in cents.
        constraints: "> 0"
      - name: min_fico_band
        type: enum
        source: input
        description: Lowest borrower credit band eligible for inclusion in this pool.
        constraints: "one of {SUBPRIME, NEAR_PRIME, PRIME, SUPER_PRIME}"
      - name: allowed_rate_type
        type: enum
        source: input
        description: Which rate type loans in this pool may carry.
        constraints: "one of {FIXED, VARIABLE, ANY}"
      - name: committed_principal_cents
        type: integer
        source: computed
        description: Sum of original_principal_cents of all Loans tagged to this pool. Derived field.
        default: 0
      - name: status
        type: enum
        source: system
        description: Pool lifecycle for accepting new loans.
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: RateGridEntry
    parent: null
    common_fields: false
    fields:
      - name: rate_type
        type: enum
        source: input
        description: Whether this grid row prices a fixed or variable product.
        constraints: "one of {FIXED, VARIABLE}"
      - name: term_months
        type: integer
        source: input
        description: Loan term in months priced by this row.
        constraints: "one of {60, 84, 120, 180, 240}"
      - name: min_fico_band
        type: enum
        source: input
        description: Lowest credit band this row prices.
        constraints: "one of {SUBPRIME, NEAR_PRIME, PRIME, SUPER_PRIME}"
      - name: base_apr_bps
        type: integer
        source: input
        description: Annual percentage rate for this cell, in basis points (100 bps = 1.00%).
        constraints: "> 0"
      - name: index_apr_bps
        type: integer
        source: input
        description: For VARIABLE rows, the current floating index in bps added on top of margin; 0 for FIXED.
        default: 0
        constraints: ">= 0"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: requested_principal_cents
        type: integer
        source: input
        description: Total payoff amount the borrower wants to refinance, in cents.
        constraints: "> 0"
      - name: requested_term_months
        type: integer
        source: input
        description: Desired term; must match an available RateGridEntry term.
        constraints: "one of {60, 84, 120, 180, 240}"
      - name: requested_rate_type
        type: enum
        source: input
        description: Borrower's preferred product.
        constraints: "one of {FIXED, VARIABLE}"
      - name: soft_pull_fico_band
        type: enum
        source: system
        description: Credit band returned by the soft-credit pull; set on prequal, supersedes self-reported band.
        default: null
        constraints: "one of {SUBPRIME, NEAR_PRIME, PRIME, SUPER_PRIME}"
      - name: dti_ratio
        type: number
        source: computed
        description: Debt-to-income ratio computed at prequal from requested principal and income. See §1.3.
        default: null
      - name: status
        type: enum
        source: system
        description: Application lifecycle state. See §1.2.
        default: DRAFT
        constraints: "one of {DRAFT, PREQUALIFIED, UNDER_REVIEW, APPROVED, DECLINED, EXPIRED, WITHDRAWN}"
      - name: approved_underwriter_id
        type: string
        source: system
        description: Opaque X-User-ID of the Underwriter who approved; null until APPROVED. Used for segregation-of-duties.
        default: null

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id"
      - name: rate_grid_entry_index
        type: integer
        source: input
        description: "FK -> RateGridEntry.id; the grid cell this offer was priced from."
      - name: term_months
        type: integer
        source: input
        description: Term presented in this offer; copied from the grid cell.
        constraints: "one of {60, 84, 120, 180, 240}"
      - name: rate_type
        type: enum
        source: input
        description: Product type of this offer.
        constraints: "one of {FIXED, VARIABLE}"
      - name: estimated_apr_bps
        type: integer
        source: computed
        description: Prequal APR estimate before autopay/member adjustments. See §1.3 estimated_apr.
      - name: locked_apr_bps
        type: integer
        source: computed
        description: Final APR after autopay + member-tier discounts; set only on lock. See §1.3 locked_apr.
        default: null
      - name: autopay_elected
        type: boolean
        source: input
        description: Whether the borrower elected autopay at lock time (affects discount).
        default: false
      - name: status
        type: enum
        source: system
        description: Offer lifecycle. See §1.2.
        default: PRESENTED
        constraints: "one of {PRESENTED, LOCKED, EXPIRED, SUPERSEDED}"
      - name: expires_at
        type: datetime
        source: system
        description: Offer expiry timestamp (presented_at + OFFER_TTL_HOURS). Compared against the system clock.

  - name: Cosigner
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this cosigner is attached to."
      - name: cosigner_email
        type: string
        source: input
        description: Cosigner's contact email; the cosigner acts under this identity.
        constraints: non-empty
      - name: cosigner_annual_income_cents
        type: integer
        source: input
        description: Cosigner's gross annual income in cents, used to recompute DTI.
        constraints: ">= 0"
      - name: consent_status
        type: enum
        source: system
        description: Whether the cosigner has consented. See §1.2.
        default: INVITED
        constraints: "one of {INVITED, CONSENTED, DECLINED, RELEASED}"
      - name: on_time_streak
        type: integer
        source: computed
        description: Count of consecutive on-time payments on the funded loan; drives release eligibility. See §1.3.
        default: 0

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application this loan was funded from."
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the locked offer that priced this loan."
      - name: abs_pool_id
        type: string
        source: system
        description: "FK -> AbsPool.id; the securitization pool this loan is tagged to at funding."
        default: null
      - name: original_principal_cents
        type: integer
        source: system
        description: Principal disbursed, copied from the application's requested principal at funding.
      - name: principal_balance_cents
        type: integer
        source: computed
        description: Outstanding principal; reduced by the principal portion of each posted payment. See §1.3.
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: Unpaid interest accrued since last payment; recomputed by daily-simple accrual. See §1.3.
        default: 0
      - name: last_accrual_at
        type: datetime
        source: system
        description: Clock timestamp at which interest was last accrued; set to funding time at creation, advanced to paid_at on each payment. Window start for daily-simple accrual.
      - name: locked_apr_bps
        type: integer
        source: system
        description: Effective APR copied from the locked offer; the rate interest accrues at.
      - name: term_months
        type: integer
        source: system
        description: Loan term copied from the offer.
      - name: repayment_status
        type: enum
        source: system
        description: Repayment dimension of the loan state machine. See §1.2.
        default: CURRENT
        constraints: "one of {CURRENT, FORBEARANCE, DELINQUENT, PAID_OFF, CHARGED_OFF}"
      - name: cosigner_release_status
        type: enum
        source: system
        description: Independent cosigner-release dimension of the loan state machine. See §1.2.
        default: PENDING
        constraints: "one of {PENDING, ELIGIBLE, RELEASED, NOT_APPLICABLE}"

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan funding this payoff."
      - name: prior_servicer_name
        type: string
        source: input
        description: Name of the prior loan servicer being paid off.
        constraints: non-empty
      - name: payoff_amount_cents
        type: integer
        source: input
        description: Amount to remit to this prior servicer, in cents.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Disbursement lifecycle. See §1.2.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, SENT, CONFIRMED, RETURNED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan this payment is applied to."
      - name: amount_cents
        type: integer
        source: input
        description: Gross payment amount in cents.
        constraints: "> 0"
      - name: due_date
        type: datetime
        source: input
        description: Scheduled due date for this installment (ISO 8601).
      - name: paid_at
        type: datetime
        source: system
        description: System clock at the moment the payment was posted; compared against due_date for on-time test.
      - name: on_time
        type: boolean
        source: computed
        description: True iff paid_at <= due_date + GRACE_DAYS. See §1.3 on_time_determination.
      - name: interest_portion_cents
        type: integer
        source: computed
        description: Portion of amount applied to accrued interest under the waterfall. See §1.3 payment_waterfall.
      - name: principal_portion_cents
        type: integer
        source: computed
        description: Portion of amount applied to principal under the waterfall (interest-first). See §1.3.

  - name: ForbearancePlan
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan placed into hardship forbearance."
      - name: reason_code
        type: enum
        source: input
        description: Hardship reason.
        constraints: "one of {JOB_LOSS, MEDICAL, NATURAL_DISASTER, OTHER}"
      - name: months_requested
        type: integer
        source: input
        description: Number of forbearance months requested.
        constraints: "between 1 and 12 inclusive"
      - name: interest_capitalized_cents
        type: integer
        source: computed
        description: Accrued interest folded into principal when forbearance ends. See §1.3 capitalization.
        default: 0
      - name: status
        type: enum
        source: system
        description: Forbearance plan lifecycle. See §1.2.
        default: ACTIVE
        constraints: "one of {ACTIVE, ENDED}"

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: Polymorphic subject of this audit record.
        constraints: "one of {APPLICATION, LOAN, COSIGNER, DISBURSEMENT}"
      - name: subject_id
        type: string
        source: system
        description: "FK -> Application.id | Loan.id | Cosigner.id | Disbursement.id (polymorphic via subject_type)."
      - name: action
        type: string
        source: system
        description: Action recorded (e.g., APPLICATION_APPROVED, LOAN_FUNDED, COSIGNER_RELEASED).
      - name: actor_role
        type: string
        source: system
        description: Role that performed the action.
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor at the time of the action.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PREQUALIFIED
        trigger: "POST /applications/{id}/prequalify"
        actor: Borrower
        preconditions:
          - "application.status == DRAFT"
          - "borrower exists"
        side_effects:
          - "set soft_pull_fico_band from the soft-credit pull (system computes from borrower.fico_band; see §1.3 soft_pull)"
          - "compute dti_ratio per §1.3 dti_computation"
          - "create one Offer per matching RateGridEntry (rate_type == requested_rate_type, term_months == requested_term_months, min_fico_band <= soft_pull_fico_band); each Offer.estimated_apr_bps set per §1.3 estimated_apr"
          - "set each Offer.expires_at = clock_now + OFFER_TTL_HOURS"
          - "append AuditEvent(APPLICATION, id, APPLICATION_PREQUALIFIED)"
      - from: PREQUALIFIED
        to: UNDER_REVIEW
        trigger: "POST /offers/{id}/lock"
        actor: Borrower
        preconditions:
          - "application.status == PREQUALIFIED"
          - "target offer.status == PRESENTED and not expired (offer.expires_at > clock_now)"
          - "expected_application_version matches application.version (OCC)"
          - "if a Cosigner is attached, its consent_status == CONSENTED"
        side_effects:
          - "compute locked_apr_bps for the offer per §1.3 locked_apr (applies autopay + member-tier discount)"
          - "set offer.status = LOCKED; set all sibling PRESENTED offers on this application to SUPERSEDED"
          - "increments Application.version by 1"
          - "append AuditEvent(APPLICATION, id, OFFER_LOCKED)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "exactly one Offer on this application is LOCKED"
          - "application.dti_ratio <= MAX_DTI_RATIO"
        side_effects:
          - "set approved_underwriter_id = acting Underwriter X-User-ID"
          - "append AuditEvent(APPLICATION, id, APPLICATION_APPROVED)"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Underwriter
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "set the LOCKED offer (if any) to SUPERSEDED"
          - "append AuditEvent(APPLICATION, id, APPLICATION_DECLINED)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "application.status in {DRAFT, PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "expire all non-terminal Offers on this application (set to SUPERSEDED)"
          - "append AuditEvent(APPLICATION, id, APPLICATION_WITHDRAWN)"
      - from: PREQUALIFIED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Borrower
        preconditions:
          - "application.status in {DRAFT, PREQUALIFIED, UNDER_REVIEW}"
        side_effects:
          - "expire all non-terminal Offers on this application (set to SUPERSEDED)"
          - "append AuditEvent(APPLICATION, id, APPLICATION_WITHDRAWN)"
      - from: PREQUALIFIED
        to: EXPIRED
        trigger: "POST /applications/{id}/expire-offers (system sweep when all offers past expires_at)"
        actor: system
        preconditions:
          - "application.status == PREQUALIFIED"
          - "every Offer on this application has expires_at <= clock_now"
        side_effects:
          - "set every PRESENTED offer to EXPIRED"
          - "append AuditEvent(APPLICATION, id, APPLICATION_EXPIRED)"

  - entity: Cosigner
    initial_state: INVITED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: INVITED
        to: CONSENTED
        trigger: "POST /cosigners/{id}/consent"
        actor: Cosigner
        preconditions:
          - "cosigner.consent_status == INVITED"
          - "parent application.status in {DRAFT, PREQUALIFIED}"
        side_effects:
          - "recompute parent application.dti_ratio including cosigner income per §1.3 dti_computation"
          - "append AuditEvent(COSIGNER, id, COSIGNER_CONSENTED)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /cosigners/{id}/decline"
        actor: Cosigner
        preconditions:
          - "cosigner.consent_status == INVITED"
        side_effects:
          - "append AuditEvent(COSIGNER, id, COSIGNER_DECLINED)"
      - from: CONSENTED
        to: RELEASED
        trigger: "POST /cosigners/{id}/release"
        actor: Borrower
        preconditions:
          - "cosigner.consent_status == CONSENTED"
          - "the funded Loan's cosigner_release_status == ELIGIBLE"
        side_effects:
          - "set the Loan.cosigner_release_status = RELEASED"
          - "append AuditEvent(COSIGNER, id, COSIGNER_RELEASED)"

  - entity: Loan
    initial_state: CURRENT
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      # ---- repayment_status dimension ----
      - from: CURRENT
        to: FORBEARANCE
        trigger: "POST /loans/{id}/forbearance"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == CURRENT"
          - "no ForbearancePlan with status ACTIVE exists for this loan"
        side_effects:
          - "create ForbearancePlan(status=ACTIVE)"
          - "append AuditEvent(LOAN, id, LOAN_FORBEARANCE_STARTED)"
        note: "Affects repayment_status only; cosigner_release_status is untouched (parallel dimension)."
      - from: FORBEARANCE
        to: CURRENT
        trigger: "POST /forbearance-plans/{id}/end"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == FORBEARANCE"
          - "the loan's ACTIVE ForbearancePlan exists"
        side_effects:
          - "compute interest_capitalized_cents per §1.3 capitalization; fold accrued_interest into principal_balance_cents; reset accrued_interest_cents to 0"
          - "set ForbearancePlan.status = ENDED"
          - "append AuditEvent(LOAN, id, LOAN_FORBEARANCE_ENDED)"
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /loans/{id}/mark-delinquent"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == CURRENT"
        side_effects:
          - "reset the loan's Cosigner.on_time_streak to 0 (if a CONSENTED cosigner exists)"
          - "if cosigner_release_status == ELIGIBLE, revert it to PENDING"
          - "append AuditEvent(LOAN, id, LOAN_DELINQUENT)"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments (a posted payment cures delinquency)"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == DELINQUENT"
        side_effects:
          - "apply payment waterfall per §1.3 payment_waterfall"
          - "append AuditEvent(LOAN, id, LOAN_CURED)"
      - from: DELINQUENT
        to: CHARGED_OFF
        trigger: "POST /loans/{id}/charge-off"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == DELINQUENT"
        side_effects:
          - "set cosigner_release_status = NOT_APPLICABLE"
          - "append AuditEvent(LOAN, id, LOAN_CHARGED_OFF)"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /loans/{id}/payments (waterfall drives principal_balance_cents to 0)"
        actor: ServicingAgent
        preconditions:
          - "loan.repayment_status == CURRENT"
          - "after applying the waterfall, principal_balance_cents == 0 and accrued_interest_cents == 0"
        side_effects:
          - "set cosigner_release_status = NOT_APPLICABLE if still PENDING"
          - "append AuditEvent(LOAN, id, LOAN_PAID_OFF)"
      # ---- cosigner_release_status dimension (independent) ----
      - from: PENDING
        to: ELIGIBLE
        trigger: "system, on payment post when on_time_streak crosses threshold"
        actor: system
        preconditions:
          - "loan.cosigner_release_status == PENDING"
          - "a CONSENTED Cosigner exists for the loan's application"
          - "Cosigner.on_time_streak >= COSIGNER_RELEASE_STREAK after the posted payment"
          - "loan.repayment_status == CURRENT"
        side_effects:
          - "append AuditEvent(LOAN, id, COSIGNER_RELEASE_ELIGIBLE)"
        note: "Evaluated inside the payment-post side-effect chain; independent of repayment_status transitions."

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, RETURNED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /disbursements/{id}/send"
        actor: DisbursementOfficer
        preconditions:
          - "disbursement.status == SCHEDULED"
          - "parent Loan.repayment_status == CURRENT"
          - "acting DisbursementOfficer X-User-ID != parent application.approved_underwriter_id (segregation of duties)"
        side_effects:
          - "append AuditEvent(DISBURSEMENT, id, DISBURSEMENT_SENT)"
      - from: SENT
        to: CONFIRMED
        trigger: "POST /disbursements/{id}/confirm"
        actor: DisbursementOfficer
        preconditions:
          - "disbursement.status == SENT"
        side_effects:
          - "append AuditEvent(DISBURSEMENT, id, DISBURSEMENT_CONFIRMED)"
      - from: SENT
        to: RETURNED
        trigger: "POST /disbursements/{id}/return"
        actor: DisbursementOfficer
        preconditions:
          - "disbursement.status == SENT"
        side_effects:
          - "append AuditEvent(DISBURSEMENT, id, DISBURSEMENT_RETURNED)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-lock-stale-application
    parent_entity: Application
    write_endpoint: "POST /offers/{id}/lock"
    occ_field: "expected_application_version"
    description: |
      Locking an Offer against an Application whose version has advanced since the client last
      observed it is rejected as a stale-version write. This captures the case where another writer
      has already locked a sibling offer on the same application (which legitimately supersedes the
      remaining PRESENTED offers and advances the application into UNDER_REVIEW), so the current
      writer's view of the application is stale.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: soft_pull
    trigger: "Application DRAFT -> PREQUALIFIED (POST /applications/{id}/prequalify)"
    algorithm: projection
    formula: |
      # The soft-credit pull deterministically maps the borrower's self-reported band one notch
      # toward the center to model a hard-data correction. No randomness.
      band_order = [SUBPRIME, NEAR_PRIME, PRIME, SUPER_PRIME]   # indices 0..3
      i = index_of(borrower.fico_band)
      if i <= 1: soft_pull_fico_band = band_order[i + 1]   # SUBPRIME->NEAR_PRIME, NEAR_PRIME->PRIME
      else:      soft_pull_fico_band = band_order[i - 1]   # PRIME->NEAR_PRIME, SUPER_PRIME->PRIME
    input_set: "Single borrower record referenced by the application."
    precision: "exact enum; no rounding"

  - name: dti_computation
    trigger: "Application prequalify AND Cosigner consent (recompute)"
    algorithm: aggregation
    formula: |
      # Annualized debt service estimate vs combined income.
      # Estimated monthly payment uses a flat amortization factor keyed on term.
      AMORT_FACTOR = AMORT_FACTORS[application.requested_term_months]   # see constants
      est_monthly_payment_cents = round_half_up(application.requested_principal_cents * AMORT_FACTOR)
      annual_debt_service_cents = est_monthly_payment_cents * 12
      combined_income_cents = borrower.annual_income_cents
                              + (CONSENTED cosigner.cosigner_annual_income_cents if exists else 0)
      dti_ratio = round_half_up(annual_debt_service_cents / combined_income_cents, 4)   # 4 decimals
    input_set: "Borrower income always; cosigner income added ONLY when cosigner.consent_status == CONSENTED."
    constants:
      AMORT_FACTORS: { 60: 0.0188, 84: 0.0142, 120: 0.0110, 180: 0.0080, 240: 0.0065 }
      MAX_DTI_RATIO: 0.4300
    precision: "dti_ratio: 4 decimal places, round_half_up; cents intermediate: round_half_up to integer"
    variants:
      - name: borrower_only
        when: "no Cosigner is CONSENTED at the time of computation"
        difference: "combined_income excludes cosigner income, yielding a higher dti_ratio"
      - name: with_cosigner
        when: "a Cosigner is CONSENTED"
        difference: "cosigner income added to denominator, lowering dti_ratio; can flip approval at MAX_DTI_RATIO boundary"

  - name: estimated_apr
    trigger: "Offer creation during prequalify"
    algorithm: tiered_pricing
    formula: |
      # Prequal estimate: base grid APR with a band surcharge, NO autopay/member discount yet.
      base = rate_grid_entry.base_apr_bps
      index = rate_grid_entry.index_apr_bps if offer.rate_type == VARIABLE else 0
      band_surcharge = BAND_SURCHARGE_BPS[application.soft_pull_fico_band]
      estimated_apr_bps = base + index + band_surcharge
    input_set: "The single matched RateGridEntry and the application's soft_pull_fico_band."
    constants:
      BAND_SURCHARGE_BPS: { SUBPRIME: 300, NEAR_PRIME: 150, PRIME: 50, SUPER_PRIME: 0 }
    precision: "integer basis points; no rounding"

  - name: locked_apr
    trigger: "Offer PRESENTED -> LOCKED (POST /offers/{id}/lock)"
    algorithm: tiered_pricing
    formula: |
      # Final APR: start from estimated_apr, apply autopay discount, then member-tier discount.
      # ORDER IS PINNED: autopay first (on the estimated base), then member-tier on the running value.
      apr = offer.estimated_apr_bps
      after_autopay = apr - (AUTOPAY_DISCOUNT_BPS if offer.autopay_elected else 0)
      after_member  = after_autopay - MEMBER_DISCOUNT_BPS[borrower.member_tier]
      locked_apr_bps = max(after_member, APR_FLOOR_BPS)   # never below the floor
    input_set: "The offer's estimated_apr_bps, autopay_elected flag, and borrower.member_tier."
    constants:
      AUTOPAY_DISCOUNT_BPS: 25
      MEMBER_DISCOUNT_BPS: { NONE: 0, SILVER: 10, GOLD: 25, PLATINUM: 50 }
      APR_FLOOR_BPS: 200
    precision: "integer basis points; floor clamp applied last"
    variants:
      - name: autopay_on
        when: "offer.autopay_elected == true"
        difference: "subtracts AUTOPAY_DISCOUNT_BPS before member discount; vs autopay_off which skips it"
      - name: autopay_off
        when: "offer.autopay_elected == false"
        difference: "no autopay subtraction; locked_apr higher by AUTOPAY_DISCOUNT_BPS unless floor clamps"

  - name: interest_accrual
    trigger: "Payment post (POST /loans/{id}/payments) and forbearance end"
    algorithm: chronological
    formula: |
      # Daily-simple accrual from the loan's last activity to the payment's paid_at.
      # days elapsed counted as whole UTC days between last_accrual_at and paid_at (floor).
      days = floor_days_between(loan.last_accrual_at, payment.paid_at)
      daily_rate = loan.locked_apr_bps / 10000 / 365
      new_interest_cents = round_half_up(loan.principal_balance_cents * daily_rate * days)
      accrued_interest_cents = loan.accrued_interest_cents + new_interest_cents
    input_set: "Single loan; principal_balance_cents at start of the accrual window."
    constants:
      DAYS_PER_YEAR: 365
    precision: "round_half_up to integer cents AFTER multiplying by days (sum-then-round, NOT round-per-day)"
    variants:
      - name: daily_simple_accrual
        when: "loan.repayment_status in {CURRENT, DELINQUENT}"
        difference: "interest accrues on outstanding principal and is paid down by the waterfall"
      - name: forbearance_capitalized
        when: "loan.repayment_status == FORBEARANCE, evaluated at forbearance end"
        difference: "accrued interest is NOT paid; it is capitalized (folded into principal) per §1.3 capitalization"

  - name: payment_waterfall
    trigger: "POST /loans/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # PINNED ORDER: accrue interest first, then allocate the payment interest-first, principal-second.
      # Step 1: run interest_accrual to refresh accrued_interest_cents.
      # Step 2: interest_portion = min(payment.amount_cents, accrued_interest_cents)
      # Step 3: remainder = payment.amount_cents - interest_portion
      # Step 4: principal_portion = min(remainder, loan.principal_balance_cents)
      # Step 5: accrued_interest_cents -= interest_portion
      #         principal_balance_cents -= principal_portion
      # Overpayment beyond interest + full principal is dropped (no negative balance, no escrow).
      interest_portion_cents = min(amount_cents, accrued_interest_cents_after_accrual)
      remainder = amount_cents - interest_portion_cents
      principal_portion_cents = min(remainder, principal_balance_cents)
    input_set: "One payment against one loan; accrued_interest refreshed first by interest_accrual."
    constants: {}
    precision: "integer cents; allocation is exact (no rounding needed after accrual)"

  - name: capitalization
    trigger: "ForbearancePlan ACTIVE -> ENDED (POST /forbearance-plans/{id}/end)"
    algorithm: aggregation
    formula: |
      # At forbearance end, fold all accrued interest into principal.
      interest_capitalized_cents = loan.accrued_interest_cents
      loan.principal_balance_cents += interest_capitalized_cents
      loan.accrued_interest_cents = 0
    input_set: "Single loan with an ACTIVE ForbearancePlan."
    constants: {}
    precision: "integer cents; exact"

  - name: on_time_determination
    trigger: "POST /loans/{id}/payments"
    algorithm: threshold
    formula: |
      # On-time iff posted within the grace window.
      on_time = (payment.paid_at <= payment.due_date + GRACE_DAYS days)
      if on_time and loan.repayment_status == CURRENT:
        cosigner.on_time_streak = cosigner.on_time_streak + 1   # only when a CONSENTED cosigner exists
      else:
        cosigner.on_time_streak = 0                              # late payment OR non-CURRENT resets streak
    input_set: "Single payment vs its due_date; the loan's CONSENTED cosigner (if any)."
    constants:
      GRACE_DAYS: 5
      COSIGNER_RELEASE_STREAK: 3
    precision: "boundary: paid_at exactly due_date + 5 days is on_time (<=); +5 days + 1 second is late"

  - name: pool_capacity_check
    trigger: "Loan funding (POST /applications/{id}/fund)"
    algorithm: aggregation
    formula: |
      # Selection of the ABS pool the loan is tagged to at funding.
      # Eligibility filter (candidate set):
      #   pool.status == OPEN
      #   AND pool.min_fico_band <= application.soft_pull_fico_band   (band_order index compare)
      #   AND (pool.allowed_rate_type == ANY OR pool.allowed_rate_type == offer.rate_type)
      #   AND pool.committed_principal_cents + application.requested_principal_cents <= pool.max_principal_cents
      # Ranking: ascending remaining_capacity = (max_principal_cents - committed_principal_cents),
      #          i.e. tightest-fit first (best-fit packing).
      # Tie-break: created_at ASC (earliest-created pool wins). NEVER id.
      # Fallback: candidate set empty -> ERR_NO_ELIGIBLE_POOL (422); loan funding rejected.
      chosen_pool = argmin_by(candidates, key=remaining_capacity, tiebreak=created_at ASC)
      chosen_pool.committed_principal_cents += loan.original_principal_cents
    input_set: "All AbsPool rows; the application's soft_pull_fico_band, offer.rate_type, requested principal."
    constants: {}
    precision: "integer cents; best-fit selection deterministic via created_at tie-break"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /borrowers, POST /abs-pools, POST /rate-grid-entries when bootstrapping"
  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (Application, Offer, Loan, Cosigner, etc.)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (see §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_application_version matches Application.version on offer lock."
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /offers/{id}/lock"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the DisbursementOfficer sending a disbursement must differ from the Underwriter who approved the parent application (approved_underwriter_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disbursements/{id}/send"
  - priority: 7
    category: business_referential
    check: "On offer lock, if a Cosigner is attached to the application, its consent_status must be CONSENTED (not INVITED/DECLINED)."
    error_id: ERR_COSIGNER_NOT_CONSENTED
    http_status: 409
    applies_to: "POST /offers/{id}/lock"
  - priority: 8
    category: business_referential
    check: "Cosigner release requires the funded Loan.cosigner_release_status == ELIGIBLE."
    error_id: ERR_RELEASE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /cosigners/{id}/release"
  - priority: 9
    category: business_temporal
    check: "Offer lock requires offer.expires_at > clock_now (offer not expired)."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{id}/lock"
  - priority: 10
    category: business_constraint
    check: "On prequalify, at least one RateGridEntry must match (rate_type, term, soft_pull_fico_band); otherwise no offers can be created."
    error_id: ERR_NO_MATCHING_RATE
    http_status: 422
    applies_to: "POST /applications/{id}/prequalify"
  - priority: 11
    category: business_constraint
    check: "Exactly one Offer must be LOCKED before approval; zero or multiple LOCKED offers reject."
    error_id: ERR_NO_LOCKED_OFFER
    http_status: 409
    applies_to: "POST /applications/{id}/approve"
  - priority: 12
    category: business_fiscal
    check: "Approval requires application.dti_ratio <= MAX_DTI_RATIO."
    error_id: ERR_DTI_EXCEEDED
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 13
    category: business_fiscal
    check: "Loan funding requires an eligible AbsPool (pool_capacity_check candidate set non-empty)."
    error_id: ERR_NO_ELIGIBLE_POOL
    http_status: 422
    applies_to: "POST /applications/{id}/fund"
  - priority: 14
    category: business_fiscal
    check: "Sum of Disbursement.payoff_amount_cents scheduled against a loan must not exceed loan.original_principal_cents."
    error_id: ERR_PAYOFF_EXCEEDS_PRINCIPAL
    http_status: 422
    applies_to: "POST /disbursements"
  - priority: 15
    category: business_constraint
    check: "months_requested for a ForbearancePlan must be between 1 and 12 inclusive."
    error_id: ERR_FORBEARANCE_TERM_INVALID
    http_status: 422
    applies_to: "POST /loans/{id}/forbearance"
  - priority: 16
    category: business_constraint
    check: "Request body field types/enums valid and required fields present (e.g., requested_principal_cents > 0)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 17
    category: business_referential
    check: "An Application may have at most one Cosigner; a second cosigner invite rejects."
    error_id: ERR_COSIGNER_ALREADY_ATTACHED
    http_status: 409
    applies_to: "POST /cosigners"
  - priority: 18
    category: business_constraint
    check: "Borrower.email and AbsPool.pool_code uniqueness must hold."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /borrowers, POST /abs-pools"
  - priority: 19
    category: state
    check: "Forbearance requested while an ACTIVE ForbearancePlan already exists for the loan."
    error_id: ERR_FORBEARANCE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /loans/{id}/forbearance"
  - priority: 20
    category: business_constraint
    check: "Pagination limit within 1..100 and offset >= 0."
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Bootstrap / configuration ----
  - method: POST
    path: "/borrowers"
    description: "Register a borrower."
    roles: [Borrower, PlatformAdmin]
    code: 201
    input: [email, full_name, annual_income_cents, fico_band]
    output: Borrower
    side_effects: ["member_tier defaults to NONE"]
  - method: GET
    path: "/borrowers/{id}"
    description: "Fetch a borrower."
    roles: [Borrower, PlatformAdmin, Underwriter, ServicingAgent]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: POST
    path: "/abs-pools"
    description: "Create an ABS securitization pool."
    roles: [PlatformAdmin]
    code: 201
    input: [pool_code, max_principal_cents, min_fico_band, allowed_rate_type]
    output: AbsPool
    side_effects: ["committed_principal_cents initialized to 0; status OPEN"]
  - method: GET
    path: "/abs-pools/{id}"
    description: "Fetch an ABS pool with its committed_principal_cents."
    roles: [PlatformAdmin, Underwriter, DisbursementOfficer]
    code: 200
    input: []
    output: AbsPool
    side_effects: []
  - method: POST
    path: "/abs-pools/{id}/close"
    description: "Close a pool to new loans."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AbsPool
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/rate-grid-entries"
    description: "Create a rate/term grid cell."
    roles: [PlatformAdmin]
    code: 201
    input: ["rate_type", "term_months", "min_fico_band", "base_apr_bps", "index_apr_bps?"]
    output: RateGridEntry
    side_effects: []
  - method: GET
    path: "/rate-grid-entries"
    description: "List rate grid cells (filterable)."
    roles: [PlatformAdmin, Borrower, Underwriter]
    code: 200
    input: ["rate_type?", "term_months?", "min_fico_band?", "limit?", "offset?"]
    output: RateGridEntry[]
    side_effects: []

  # ---- Applications ----
  - method: POST
    path: "/applications"
    description: "Create a draft refinance application."
    roles: [Borrower]
    code: 201
    input: [borrower_id, requested_principal_cents, requested_term_months, requested_rate_type]
    output: Application
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/applications/{id}"
    description: "Fetch an application."
    roles: [Borrower, Underwriter, ServicingAgent, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications, filterable by borrower_id."
    roles: [Underwriter, PlatformAdmin]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/prequalify"
    description: "Run soft-credit pull, compute DTI, generate offers."
    roles: [Borrower]
    code: 200
    input: []
    output: Application
    side_effects:
      - "soft_pull (§1.3); dti_computation (§1.3 borrower_only variant)"
      - "create one Offer per matching RateGridEntry with estimated_apr_bps and expires_at set"
      - "status DRAFT -> PREQUALIFIED; append AuditEvent"
  - method: POST
    path: "/applications/{id}/approve"
    description: "Underwriter approves the application (one LOCKED offer, DTI within limit)."
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects: ["set approved_underwriter_id; status UNDER_REVIEW -> APPROVED; append AuditEvent"]
  - method: POST
    path: "/applications/{id}/decline"
    description: "Underwriter declines the application."
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects: ["status UNDER_REVIEW -> DECLINED; LOCKED offer -> SUPERSEDED; append AuditEvent"]
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Borrower withdraws the application."
    roles: [Borrower]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN; non-terminal offers -> SUPERSEDED; append AuditEvent"]
  - method: POST
    path: "/applications/{id}/expire-offers"
    description: "System sweep: expire all offers and the application when every offer is past expires_at."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["PRESENTED offers -> EXPIRED; status PREQUALIFIED -> EXPIRED; append AuditEvent"]
  - method: POST
    path: "/applications/{id}/fund"
    description: "Fund an approved application: select ABS pool, create Loan, schedule autopay, upgrade member tier."
    roles: [DisbursementOfficer]
    code: 201
    input: []
    output: Loan
    side_effects:
      - "pool_capacity_check (§1.3) selects AbsPool; tag loan.abs_pool_id; pool.committed_principal_cents += principal"
      - "create Loan (repayment_status CURRENT, cosigner_release_status PENDING if CONSENTED cosigner else NOT_APPLICABLE)"
      - "copy original_principal_cents, principal_balance_cents, locked_apr_bps, term_months from offer/application"
      - "upgrade borrower.member_tier to SILVER if currently NONE"
      - "append AuditEvent(LOAN, LOAN_FUNDED)"

  # ---- Offers ----
  - method: GET
    path: "/offers/{id}"
    description: "Fetch an offer."
    roles: [Borrower, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/offers"
    description: "List offers, filterable by application_id (FK reverse-reachability for Application->Offer)."
    roles: [Borrower, Underwriter, PlatformAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/offers/{id}/lock"
    description: "Lock an offer (final APR), supersede siblings, advance application to UNDER_REVIEW. OCC-guarded."
    roles: [Borrower]
    code: 200
    input: ["expected_application_version", "autopay_elected?"]
    output: Offer
    side_effects:
      - "locked_apr (§1.3) computes locked_apr_bps"
      - "offer -> LOCKED; sibling PRESENTED offers -> SUPERSEDED; application PREQUALIFIED -> UNDER_REVIEW"
      - "increments Application.version by 1"
      - "append AuditEvent(APPLICATION, OFFER_LOCKED)"

  # ---- Cosigners ----
  - method: POST
    path: "/cosigners"
    description: "Invite a cosigner to an application (at most one per application)."
    roles: [Borrower]
    code: 201
    input: [application_id, cosigner_email, cosigner_annual_income_cents]
    output: Cosigner
    side_effects: ["consent_status INVITED"]
  - method: GET
    path: "/cosigners/{id}"
    description: "Fetch a cosigner."
    roles: [Borrower, Cosigner, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: Cosigner
    side_effects: []
  - method: GET
    path: "/cosigners"
    description: "List cosigners, filterable by application_id (FK reverse-reachability for Application->Cosigner)."
    roles: [Borrower, Underwriter, PlatformAdmin]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Cosigner[]
    side_effects: []
  - method: POST
    path: "/cosigners/{id}/consent"
    description: "Cosigner consents; recompute parent DTI including cosigner income."
    roles: [Cosigner]
    code: 200
    input: []
    output: Cosigner
    side_effects: ["consent_status -> CONSENTED; dti_computation (§1.3 with_cosigner variant); append AuditEvent"]
  - method: POST
    path: "/cosigners/{id}/decline"
    description: "Cosigner declines."
    roles: [Cosigner]
    code: 200
    input: []
    output: Cosigner
    side_effects: ["consent_status -> DECLINED; append AuditEvent"]
  - method: POST
    path: "/cosigners/{id}/release"
    description: "Borrower releases a cosigner once the loan is release-eligible."
    roles: [Borrower]
    code: 200
    input: []
    output: Cosigner
    side_effects: ["consent_status -> RELEASED; Loan.cosigner_release_status -> RELEASED; append AuditEvent"]

  # ---- Loans ----
  - method: GET
    path: "/loans/{id}"
    description: "Fetch a loan with balances and both status dimensions."
    roles: [Borrower, ServicingAgent, DisbursementOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/loans"
    description: "List loans, filterable by application_id and abs_pool_id (FK reverse-reachability)."
    roles: [ServicingAgent, DisbursementOfficer, PlatformAdmin]
    code: 200
    input: ["application_id?", "abs_pool_id?", "repayment_status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/payments"
    description: "Post a payment: accrue interest, run waterfall, update streak, evaluate release eligibility."
    roles: [ServicingAgent, Borrower]
    code: 201
    input: ["amount_cents", "due_date", "paid_at?"]
    output: Payment
    side_effects:
      - "interest_accrual (§1.3); payment_waterfall (§1.3) sets interest_portion/principal_portion"
      - "on_time_determination (§1.3) updates Cosigner.on_time_streak"
      - "if streak >= COSIGNER_RELEASE_STREAK and status CURRENT, cosigner_release_status PENDING -> ELIGIBLE"
      - "if principal_balance_cents hits 0 and accrued_interest 0, repayment_status -> PAID_OFF; if DELINQUENT, -> CURRENT"
  - method: GET
    path: "/loans/{id}/payments"
    description: "List payments for a loan (FK reverse-reachability for Loan->Payment)."
    roles: [Borrower, ServicingAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/forbearance"
    description: "Place loan into hardship forbearance; creates an ACTIVE ForbearancePlan."
    roles: [ServicingAgent]
    code: 201
    input: [reason_code, months_requested]
    output: ForbearancePlan
    side_effects: ["repayment_status CURRENT -> FORBEARANCE; append AuditEvent"]
  - method: POST
    path: "/loans/{id}/mark-delinquent"
    description: "Mark a current loan delinquent; reset streak, revert release eligibility."
    roles: [ServicingAgent]
    code: 200
    input: []
    output: Loan
    side_effects: ["repayment_status CURRENT -> DELINQUENT; reset cosigner.on_time_streak to 0; ELIGIBLE -> PENDING"]
  - method: POST
    path: "/loans/{id}/charge-off"
    description: "Charge off a delinquent loan."
    roles: [ServicingAgent]
    code: 200
    input: []
    output: Loan
    side_effects: ["repayment_status DELINQUENT -> CHARGED_OFF; cosigner_release_status -> NOT_APPLICABLE"]

  # ---- Forbearance ----
  - method: GET
    path: "/forbearance-plans/{id}"
    description: "Fetch a forbearance plan."
    roles: [ServicingAgent, Borrower, PlatformAdmin]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects: []
  - method: GET
    path: "/forbearance-plans"
    description: "List forbearance plans, filterable by loan_id (FK reverse-reachability for Loan->ForbearancePlan)."
    roles: [ServicingAgent, Borrower, PlatformAdmin]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: ForbearancePlan[]
    side_effects: []
  - method: POST
    path: "/forbearance-plans/{id}/end"
    description: "End forbearance; capitalize accrued interest into principal."
    roles: [ServicingAgent]
    code: 200
    input: []
    output: ForbearancePlan
    side_effects: ["capitalization (§1.3); loan repayment_status FORBEARANCE -> CURRENT; status ENDED"]

  # ---- Disbursements ----
  - method: POST
    path: "/disbursements"
    description: "Schedule a payoff disbursement to a prior servicer."
    roles: [DisbursementOfficer]
    code: 201
    input: [loan_id, prior_servicer_name, payoff_amount_cents]
    output: Disbursement
    side_effects: ["status SCHEDULED; validated against ERR_PAYOFF_EXCEEDS_PRINCIPAL"]
  - method: GET
    path: "/disbursements/{id}"
    description: "Fetch a disbursement."
    roles: [DisbursementOfficer, ServicingAgent, PlatformAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: GET
    path: "/disbursements"
    description: "List disbursements, filterable by loan_id (FK reverse-reachability for Loan->Disbursement)."
    roles: [DisbursementOfficer, ServicingAgent, PlatformAdmin]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/disbursements/{id}/send"
    description: "Send a payoff (segregation of duties: officer != approving underwriter)."
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status SCHEDULED -> SENT; append AuditEvent"]
  - method: POST
    path: "/disbursements/{id}/confirm"
    description: "Confirm a sent payoff."
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status SENT -> CONFIRMED; append AuditEvent"]
  - method: POST
    path: "/disbursements/{id}/return"
    description: "Mark a sent payoff returned by the servicer."
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status SENT -> RETURNED; append AuditEvent"]

  # ---- Audit ----
  - method: GET
    path: "/audit-events"
    description: "List audit events, filterable by subject_type and subject_id (FK reverse-reachability for polymorphic subject)."
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["subject_type?", "subject_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; governs offer expiry, on-time, accrual day counts)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock_now set to to_iso8601 for all subsequent time comparisons"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for this operation per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or FK body reference does not resolve to an existing resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the target resource's current state."
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version on offer lock does not match Application.version (OCC)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "DisbursementOfficer sending a payoff equals the Underwriter who approved the application."
  - id: ERR_COSIGNER_NOT_CONSENTED
    http: 409
    condition: "Offer lock attempted while an attached Cosigner has consent_status != CONSENTED."
  - id: ERR_RELEASE_NOT_ELIGIBLE
    http: 409
    condition: "Cosigner release attempted while Loan.cosigner_release_status != ELIGIBLE."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Offer lock attempted after offer.expires_at <= clock_now."
  - id: ERR_NO_MATCHING_RATE
    http: 422
    condition: "Prequalify produced zero matching RateGridEntry rows for (rate_type, term, band)."
  - id: ERR_NO_LOCKED_OFFER
    http: 409
    condition: "Approval attempted with zero or more than one LOCKED offer on the application."
  - id: ERR_DTI_EXCEEDED
    http: 422
    condition: "Approval attempted while application.dti_ratio > MAX_DTI_RATIO."
  - id: ERR_NO_ELIGIBLE_POOL
    http: 422
    condition: "Funding attempted with an empty AbsPool candidate set (pool_capacity_check)."
  - id: ERR_PAYOFF_EXCEEDS_PRINCIPAL
    http: 422
    condition: "Sum of scheduled Disbursement.payoff_amount_cents would exceed loan.original_principal_cents."
  - id: ERR_FORBEARANCE_TERM_INVALID
    http: 422
    condition: "ForbearancePlan months_requested outside 1..12."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad type, bad enum, or non-positive amount."
  - id: ERR_COSIGNER_ALREADY_ATTACHED
    http: 409
    condition: "A second Cosigner invited to an application that already has one."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Borrower.email or AbsPool.pool_code already exists."
  - id: ERR_FORBEARANCE_ALREADY_ACTIVE
    http: 409
    condition: "Forbearance requested while an ACTIVE ForbearancePlan already exists for the loan."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset outside permitted range (limit 1..100, offset >= 0)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Borrower
    description: "The refinance applicant; creates applications, prequalifies, locks offers, posts own payments, releases cosigner."
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /applications"
      - "POST /applications/{id}/prequalify"
      - "POST /applications/{id}/withdraw"
      - "POST /offers/{id}/lock"
      - "POST /cosigners"
      - "POST /cosigners/{id}/release"
    shared_operations:
      - "POST /borrowers"
      - "POST /loans/{id}/payments"
      - "GET /applications/{id}"
      - "GET /offers"
      - "GET /loans/{id}"
  - name: Cosigner
    description: "Invited cosigner who consents or declines; acts under cosigner_email identity."
    identity: "entity_backed:Cosigner"
    exclusive_operations:
      - "POST /cosigners/{id}/consent"
      - "POST /cosigners/{id}/decline"
    shared_operations:
      - "GET /cosigners/{id}"
  - name: Underwriter
    description: "Credit decision-maker; approves or declines applications. Subject to segregation of duties vs disbursement."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/decline"
    shared_operations:
      - "GET /applications"
      - "GET /applications/{id}"
      - "GET /audit-events"
  - name: DisbursementOfficer
    description: "Funds approved loans and remits payoffs to prior servicers; must not be the approving underwriter."
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/fund"
      - "POST /disbursements"
      - "POST /disbursements/{id}/send"
      - "POST /disbursements/{id}/confirm"
      - "POST /disbursements/{id}/return"
    shared_operations:
      - "GET /loans/{id}"
      - "GET /disbursements"
  - name: ServicingAgent
    description: "Manages funded loans: forbearance, delinquency, charge-off, payment posting on behalf of borrowers."
    identity: "opaque"
    exclusive_operations:
      - "POST /loans/{id}/forbearance"
      - "POST /loans/{id}/mark-delinquent"
      - "POST /loans/{id}/charge-off"
      - "POST /forbearance-plans/{id}/end"
    shared_operations:
      - "POST /loans/{id}/payments"
      - "GET /loans/{id}"
      - "GET /loans"
  - name: PlatformAdmin
    description: "Operator: bootstraps pools and rate grid, runs offer-expiry sweeps, reads audit."
    identity: "opaque"
    exclusive_operations:
      - "POST /abs-pools"
      - "POST /abs-pools/{id}/close"
      - "POST /rate-grid-entries"
      - "POST /applications/{id}/expire-offers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /audit-events"
      - "GET /abs-pools/{id}"
      - "GET /applications"
