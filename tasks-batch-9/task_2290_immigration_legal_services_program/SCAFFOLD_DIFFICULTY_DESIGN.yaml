              as_user_id: "${rep_a_id}"
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "LSC-IMM-2027", period_start_date: "2026-09-01", period_end_date: "2026-09-30", disclosure_level: "DEIDENTIFIED_CASE_LEVEL" }
              as: GrantAnalyst
              captures: { report_id: "$.data.id" }
          trigger:
            - call: "POST /grant-reports/${report_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
            - call: "POST /grant-reports/${report_id}/transition"
              payload: { action: "SUBMIT" }
              as: GrantAnalyst
            - call: "POST /grant-reports/${report_id}/transition"
              payload: { action: "AMEND", amendment_reason_code: "FUNDER_QUERY" }
              as: GrantAnalyst
            - call: "POST /grant-reports/${report_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
          assert:
            - "Pre-trigger baseline: CaseAssignment ${asg_id}.direct_hours_logged == 3.33 and CaseMatter ${matter_id}.direct_hours_logged == 3.33; GrantReport ${report_id}.status == 'DRAFT' with amendment_round 0 and every count and money field 0."
            - "trigger step 1 returns HTTP 200 with status 'GENERATED', generated_at_utc == '2026-09-01T00:00:00.000Z', cases_served_count == 1, consent_verified_count == 0 and suppressed_case_count == 1 (1 - 0), and outcomes_summary == {'GRANTED': 0, 'DENIED': 0, 'ADMINISTRATIVELY_CLOSED': 0, 'WITHDRAWN': 0, 'TERMINATED': 0, 'REFERRED_TO_COURT': 0, 'NOT_YET_DECIDED': 1} whose values sum to 1."
            - "trigger step 1 money: base_reimbursable_cents == 41625 (round_half_up(12500 * 3.33)), supervision_surcharge_cents == 0 (41625 < 500000 selects tier_rate 0.00), total_reimbursable_cents == 41625, allocated_line_total_cents == 41625 and rounding_remainder_cents == 0; the suppressed case still contributed its full hours."
            - "All three identities hold after step 1: allocated_line_total_cents == total_reimbursable_cents; total_reimbursable_cents == base_reimbursable_cents + supervision_surcharge_cents; suppressed_case_count == cases_served_count - consent_verified_count."
            - "trigger step 2 returns HTTP 200 with status 'SUBMITTED' and submitted_at_utc == '2026-09-01T00:00:00.000Z' (the allocation identity precondition is satisfied, and the suppressed-count gate does not apply outside IDENTIFIED_WITH_CONSENT)."
            - "trigger step 3 returns HTTP 200 with status 'AMENDED', amendment_round == 1 and submitted_at_utc == null; no money field changed."
            - "trigger step 4 returns HTTP 200 with status 'GENERATED' and reproduces the money fields byte-identically: base_reimbursable_cents 41625, supervision_surcharge_cents 0, total_reimbursable_cents 41625, allocated_line_total_cents 41625, rounding_remainder_cents 0; cases_served_count is still 1 and amendment_round remains 1."
            - "GrantReport ${report_id}.version advanced by exactly 4 across the four transitions, and no step raised ERR_INVARIANT_VIOLATION."
