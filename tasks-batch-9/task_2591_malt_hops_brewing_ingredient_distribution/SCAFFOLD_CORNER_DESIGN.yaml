              captures: { uc_reef_id: $.data.id }
            - call: "POST /sales-orders/${uc_reef_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${uc_citra_id}" }
              as: Brewer
