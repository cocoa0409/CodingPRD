# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization ------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, or the role is not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The caller's role is not listed on the endpoint" }
  - { id: ERR_GROWER_SCOPE_VIOLATION, http: 403, condition: "A Grower caller's X-User-ID is not the grower_id of the contract owning the target resource" }
  - { id: ERR_SOD_ROGUEING_SELF_VERIFICATION, http: 403, condition: "The field officer verifying rogueing is the same user who recorded the inspection" }
  - { id: ERR_SOD_SETTLEMENT_SELF_APPROVAL, http: 403, condition: "The accountant approving a settlement is the same user who computed it" }
  # --- request shape --------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong JSON type, invalid enum member, single-field numeric range violation, or pagination limit outside 1..100 / negative offset" }
  # --- existence ------------------------------------------------------------
  - { id: ERR_VARIETY_NOT_FOUND, http: 404, condition: "variety_id does not resolve" }
  - { id: ERR_TREATMENT_PRODUCT_NOT_FOUND, http: 404, condition: "treatment_product_id does not resolve" }
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "grower_id does not resolve" }
  - { id: ERR_PRODUCTION_FIELD_NOT_FOUND, http: 404, condition: "production_field_id does not resolve" }
  - { id: ERR_FIELD_HISTORY_RECORD_NOT_FOUND, http: 404, condition: "field_history_record_id does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "production_contract_id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "field_inspection_id does not resolve" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "harvest_equipment_id does not resolve" }
  - { id: ERR_HARVEST_EVENT_NOT_FOUND, http: 404, condition: "harvest_event_id does not resolve" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "conditioning_line_id does not resolve" }
  - { id: ERR_SEED_LOT_NOT_FOUND, http: 404, condition: "seed_lot_id does not resolve" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "conditioning_run_id does not resolve" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "lot_sample_id does not resolve" }
  - { id: ERR_TAG_NOT_FOUND, http: 404, condition: "certification_tag_id does not resolve" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement_id does not resolve" }
  # --- state ----------------------------------------------------------------
  - { id: ERR_INVALID_CONTRACT_STATE, http: 409, condition: "The contract's status does not permit the requested transition or child creation" }
  - { id: ERR_INVALID_INSPECTION_STATE, http: 409, condition: "The inspection's status or outcome does not permit the requested rogueing step" }
  - { id: ERR_INVALID_LOT_STATE, http: 409, condition: "The seed lot's conditioning_status or certification_status does not permit sampling, run planning or carryover" }
  - { id: ERR_INVALID_RUN_STATE, http: 409, condition: "The conditioning run's status does not permit completion or reversal" }
  - { id: ERR_INVALID_SETTLEMENT_STATE, http: 409, condition: "The settlement's status does not permit approval, dispute or payment" }
  - { id: ERR_SAMPLE_ALREADY_RESULTED, http: 409, condition: "Laboratory results were already posted for this sample" }
  - { id: ERR_TAG_ALREADY_VOIDED, http: 409, condition: "The certification tag is already VOIDED" }
  # --- optimistic concurrency ----------------------------------------------
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match the contract's current version" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_seed_lot_version does not match the seed lot's current version" }
  # --- regulatory and safety -----------------------------------------------
  - { id: ERR_TREATMENT_FIELDS_NOT_ALLOWED, http: 422, condition: "Treatment fields supplied on a non-TREATING stage, or omitted on a TREATING stage" }
  - { id: ERR_TREATMENT_CROP_NOT_LABELED, http: 422, condition: "The lot's crop kind is not on the treatment product's label" }
  - { id: ERR_TREATMENT_RATE_EXCEEDS_LABEL, http: 422, condition: "Requested application rate exceeds the label maximum" }
  - { id: ERR_TREATMENT_LABEL_INCOMPLETE, http: 422, condition: "label_text omits the EPA registration number, the DYED disclosure or the restricted-use signal word" }
  - { id: ERR_EQUIPMENT_CLEANOUT_REQUIRED, http: 409, condition: "The harvest machine is not certified clean for this contract's variety" }
  - { id: ERR_FIELD_HISTORY_RESTRICTED, http: 422, condition: "The field carries a restricted prior crop inside the variety's look-back window under the applied eligibility variant" }
  - { id: ERR_ISOLATION_DISTANCE_INSUFFICIENT, http: 422, condition: "The field's isolation distance is below the variety's minimum under the applied eligibility variant" }
  - { id: ERR_GROWER_SUSPENDED, http: 409, condition: "The grower's compliance standing is SUSPENDED" }
  # --- referential business rules ------------------------------------------
  - { id: ERR_ROGUEING_NOT_DECLARED, http: 409, condition: "Rogueing verification attempted before the grower declared the work" }
  - { id: ERR_SAMPLE_LOT_MISMATCH, http: 422, condition: "The referenced sample belongs to another lot or did not PASS" }
  - { id: ERR_LOT_NOT_TAG_ELIGIBLE, http: 409, condition: "The lot is not both BAGGED and PASSED" }
  - { id: ERR_NO_SETTLEABLE_LOTS, http: 422, condition: "The contract has no tagged lot with a final clean-unit figure" }
  # --- quantitative constraints --------------------------------------------
  - { id: ERR_STAGE_OUT_OF_ORDER, http: 409, condition: "The requested conditioning stage is not the immediate successor of the lot's conditioning_status" }
  - { id: ERR_INPUT_MASS_MISMATCH, http: 422, condition: "input_kg does not equal the lot's current mass" }
  - { id: ERR_OUTPUT_EXCEEDS_INPUT, http: 422, condition: "output_kg is negative or exceeds the run's input_kg" }
  - { id: ERR_COMPONENT_PCT_SUM_INVALID, http: 422, condition: "purity_pct plus inert_pct exceeds 100" }
  - { id: ERR_TAG_BAG_COUNT_EXCEEDS_LOT, http: 422, condition: "Requested tag bag_count exceeds the lot's untagged bags" }
  - { id: ERR_TAG_CLASS_EXCEEDS_VARIETY, http: 422, condition: "The requested tag class outranks the variety's maximum certifiable class" }
  - { id: ERR_CARRYOVER_LIMIT_EXCEEDED, http: 422, condition: "The successor lot's carryover generation would exceed the variety's maximum" }
  - { id: ERR_RUN_NOT_LATEST, http: 409, condition: "The completed run being reversed is not the latest completed run on its lot" }
  - { id: ERR_LOT_TAGGED_IMMUTABLE, http: 409, condition: "The lot carries a certification tag, so its conditioning history may not be altered" }
  - { id: ERR_CONTRACTED_ACRES_EXCEED_FIELD, http: 422, condition: "contracted_acres exceeds the field's acreage" }
  # --- temporal -------------------------------------------------------------
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_start is not strictly before window_end" }
  - { id: ERR_DATE_IN_FUTURE, http: 422, condition: "A backward-looking date or timestamp is after the current logical clock instant" }
  - { id: ERR_EQUIPMENT_WINDOW_CONFLICT, http: 409, condition: "The harvest window intersects another window on the same machine under closed-interval semantics" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "The run window intersects a live run on the same line under half-open-interval semantics" }
  - { id: ERR_LINE_CLEANOUT_BUFFER_VIOLATION, http: 409, condition: "The run starts before the line's required inter-variety cleanout buffer has elapsed" }
  - { id: ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED, http: 409, condition: "The inspector already has two inspections on that calendar date" }
  - { id: ERR_FIELD_SEASON_ALREADY_CONTRACTED, http: 409, condition: "Another live contract already occupies that field for that season year" }
  - { id: ERR_HARVEST_WINDOW_NOT_ELAPSED, http: 422, condition: "The harvest window ends after the current logical clock instant" }
  - { id: ERR_RUN_WINDOW_NOT_ELAPSED, http: 422, condition: "The run window ends after the current logical clock instant" }
  - { id: ERR_GERMINATION_VALIDITY_EXPIRED, http: 409, condition: "Tag issuance attempted after the lot's germination result lapsed" }
  - { id: ERR_RETEST_NOT_DUE, http: 409, condition: "Carryover attempted while the lot's germination result is still valid" }
  # --- fiscal ---------------------------------------------------------------
  - { id: ERR_NET_PAYABLE_NEGATIVE, http: 422, condition: "The settlement's provisional net before advance recovery is negative" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    identity: opaque
    description: "Seed program administrator: owns reference data (varieties, treatment products, growers, fields, machines, lines), drafts/offers/cancels contracts, and drives the logical clock. Reads everything, but may not inspect fields, condition lots, issue tags or touch settlements."
    exclusive_operations:
      - "POST /seed-ops/varieties"
      - "POST /seed-ops/treatment-products"
      - "POST /seed-ops/growers"
      - "POST /seed-ops/production-contracts"
      - "POST /seed-ops/production-contracts/{production_contract_id}/offer"
      - "POST /seed-ops/production-contracts/{production_contract_id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /seed-ops/production-fields (with FieldOfficer)"
      - "POST /seed-ops/production-fields/{production_field_id}/history (with FieldOfficer)"
      - "POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments (with FieldOfficer)"
      - "POST /seed-ops/harvest-equipment (with ConditioningManager)"
      - "POST /seed-ops/conditioning-lines (with ConditioningManager)"
      - "all GET reads"
  - name: FieldOfficer
    identity: opaque
    description: "Certification field officer: registers fields and their crop history, records inspection count sheets and verifies grower rogueing. Segregation of duties forbids verifying an inspection the same user recorded."
    exclusive_operations:
      - "POST /seed-ops/field-inspections"
      - "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-verification"
    shared_operations:
      - "POST /seed-ops/production-fields (with ProgramAdmin)"
      - "POST /seed-ops/production-fields/{production_field_id}/history (with ProgramAdmin)"
      - "POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments (with ProgramAdmin)"
      - "POST /seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification (with ConditioningManager)"
      - "POST /seed-ops/harvest-events (with ConditioningManager)"
      - "GET reads on varieties, growers, fields, history, contracts, inspections, equipment, harvest events"
  - name: Grower
    identity: "entity_backed:Grower"
    description: "Contract grower, identified by X-User-ID equal to the Grower.id. Signs offered contracts, declares rogueing work and disputes settlements; every write and read is scoped to their own contracts."
    exclusive_operations:
      - "POST /seed-ops/production-contracts/{production_contract_id}/sign"
      - "POST /seed-ops/field-inspections/{field_inspection_id}/rogueing-declaration"
      - "POST /seed-ops/settlements/{settlement_id}/dispute"
    shared_operations:
      - "GET reads on their own fields, history, contracts, inspections, harvest events, lots, samples, tags and settlements"
  - name: ConditioningManager
    identity: opaque
    description: "Conditioning plant manager: registers machines and lines, certifies equipment cleanout, records harvest intake, plans/completes/reverses conditioning runs and mints carryover lots."
    exclusive_operations:
      - "POST /seed-ops/conditioning-runs"
      - "POST /seed-ops/conditioning-runs/{conditioning_run_id}/complete"
      - "POST /seed-ops/conditioning-runs/{conditioning_run_id}/reversal"
      - "POST /seed-ops/seed-lots/{seed_lot_id}/carryover"
    shared_operations:
      - "POST /seed-ops/harvest-equipment (with ProgramAdmin)"
      - "POST /seed-ops/conditioning-lines (with ProgramAdmin)"
      - "POST /seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification (with FieldOfficer)"
      - "POST /seed-ops/harvest-events (with FieldOfficer)"
      - "GET reads on varieties, treatment products, contracts, equipment, harvest events, lines, runs, lots, samples, tags"
  - name: CertificationAgency
    identity: opaque
    description: "Official seed certification agency: draws samples, posts laboratory results and issues or voids certification tags. Cannot condition seed, contract acreage or settle money."
    exclusive_operations:
      - "POST /seed-ops/lot-samples"
      - "POST /seed-ops/lot-samples/{lot_sample_id}/results"
      - "POST /seed-ops/certification-tags"
      - "POST /seed-ops/certification-tags/{certification_tag_id}/void"
    shared_operations:
      - "GET reads on varieties, treatment products, runs, lots, samples, tags"
  - name: SettlementAccountant
    identity: opaque
    description: "Grower-payment accountant: computes, approves and pays settlements. Segregation of duties forbids approving a settlement the same user computed."
    exclusive_operations:
      - "POST /seed-ops/settlements"
      - "POST /seed-ops/settlements/{settlement_id}/approve"
      - "POST /seed-ops/settlements/{settlement_id}/pay"
    shared_operations:
      - "GET reads on varieties, growers, contracts, harvest events, lots, settlements"
