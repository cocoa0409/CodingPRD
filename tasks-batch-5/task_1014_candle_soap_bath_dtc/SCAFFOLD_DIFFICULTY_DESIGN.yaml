# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 1014 — Candle, Soap & Bath DTC. 9 rules x 2 instances = 18.
# All literals pre-computed against SCAFFOLD.yaml §1.3 formulas & constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_total_provisional_vs_final
        grounds:
          - calculations.order_provisional_total
          - calculations.order_final_pricing
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          On the SAME Order, provisional_total_cents (3000, raw line sum, no discount/shipping)
          diverges from final_total_cents (3800 = 3000 discounted subtotal + 800 flat shipping) —
          dual-variant logic on the Order pricing domain.
        test_recipe:
          setup:
            - "Clock at default 2026-07-01. BRONZE customer (0 points). Candle sku list_price 3000, batch labeled+released, one RESERVED line qty 1 (subtotal 3000)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "CANDLE", collection_name: "Autumn Hearth", scent_family: "WOODY", title: "Amber Candle" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Amber", list_price_cents: 3000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_A", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/label", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "a@x.com", full_name: "Ada" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          assert:
            - "Order.${o1}.provisional_total_cents == 3000"
            - "Order.${o1}.discount_cents == 0"
            - "Order.${o1}.shipping_fee_cents == 800"
            - "Order.${o1}.final_total_cents == 3800"

      - name: loyalty_provisional_vs_final_on_recall
        grounds:
          - calculations.loyalty_points_earned
          - entities.Order.fields.provisional_points
          - entities.Order.fields.awarded_points
          - entities.Customer.fields.loyalty_points_balance
          - state_machines.Batch.RELEASED_to_RECALLED
        distinguishing_aspect: |
          On the Customer loyalty domain, provisional_points (80 = floor(5000/100)+floor(3000/100),
          over ALL lines at checkout) diverges from awarded_points (30, over the single non-voided
          line at delivery after the other line is recall-voided) — a different entity domain from
          the Order-total dual variant.
        test_recipe:
          setup:
            - "BRONZE customer. Two soap skus (list 500 and 300) each with a released batch. RETAIL order with two RESERVED lines: L1 qty 10 (subtotal 5000, batch B1), L2 qty 10 (subtotal 3000, batch B2). Order checked out (provisional 80, balance 80, PAID/ALLOCATED)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Citrus", scent_family: "CITRUS", title: "Lemon Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Lemon", list_price_cents: 500 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Lime", list_price_cents: 300 }, as: MerchOps, captures: { s2: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_A", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /skus/${s2}/batches", payload: { quantity_produced: 100, line_code: "LINE_B", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b2: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b2}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "b@x.com", full_name: "Bea" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 10 }, as: Customer, as_user_id: "${c1}", captures: { l1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s2}", batch_id: "${b2}", quantity: 10 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /batches/${b1}/recall", payload: {}, as: MerchOps }
            - { call: "POST /orders/${o1}/fulfill", payload: {}, as: MerchOps }
          assert:
            - "Order.${o1}.provisional_points == 80"
            - "Order.${o1}.awarded_points == 30"
            - "Customer.${c1}.loyalty_points_balance == 30"
            - "OrderLine.${l1}.status == VOIDED_RECALL"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_pricing_bulk_loyalty_cap
        grounds:
          - calculations.order_final_pricing
          - entities.Order.fields.discount_cents
          - entities.Order.fields.total_quantity
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction. combined_pct =
          min(bulk_pct 0.20 [qty>=100] + loyalty_pct 0.10 [GOLD, RETAIL branch], MAX 0.25) = 0.25,
          so discount_cents = round_half_up(10000*0.25) = 2500 (NOT 3000) — nested-min cap +
          tiered bulk selection + order_type branch.
        test_recipe:
          setup:
            - "GOLD customer (granted 2000 points). Soap sku list 100, released batch qty 200. RETAIL order, one RESERVED line qty 100 (subtotal 10000, total_quantity 100)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Basics", scent_family: "CITRUS", title: "Plain Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Plain", list_price_cents: 100 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 200, line_code: "LINE_C", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "g@x.com", full_name: "Gus" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/loyalty-grant", payload: { points: 2000 }, as: PlatformAdmin }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 100 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          assert:
            - "Customer.${c1}.loyalty_tier == GOLD"
            - "Order.${o1}.total_quantity == 100"
            - "Order.${o1}.discount_cents == 2500"
            - "Order.${o1}.shipping_fee_cents == 0"
            - "Order.${o1}.final_total_cents == 7500"

      - name: loyalty_floor_per_line_then_sum
        grounds:
          - calculations.loyalty_points_earned
          - entities.Order.fields.provisional_points
          - entities.Order.fields.awarded_points
          - entities.OrderLine.fields.line_subtotal_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned. Two lines each with line_subtotal 250 yield
          floor(250/100)=2 PER LINE summed to 4, NOT floor((250+250)/100)=5 — floor-per-line-then-sum.
          Different mode from the mode-(a) pricing instance.
        test_recipe:
          setup:
            - "BRONZE customer. Two soap skus each list 250, each with a released batch. RETAIL order with two lines qty 1 (line_subtotal 250 each)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Duo", scent_family: "FLORAL", title: "Rose Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Rose", list_price_cents: 250 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Peony", list_price_cents: 250 }, as: MerchOps, captures: { s2: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "LINE_D", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /skus/${s2}/batches", payload: { quantity_produced: 50, line_code: "LINE_E", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b2: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /batches/${b2}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "f@x.com", full_name: "Flo" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s2}", batch_id: "${b2}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/fulfill", payload: {}, as: MerchOps }
          assert:
            - "Order.${o1}.provisional_points == 4"
            - "Order.${o1}.awarded_points == 4"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order.PENDING_to_ALLOCATED
          - state_machines.Order.ALLOCATED_to_DELIVERED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state axes: after checkout payment_status==PAID while
          fulfillment_status==ALLOCATED; after fulfill fulfillment_status advances to DELIVERED
          with payment_status still PAID — parallel dimensions on one entity, not a single linear chain.
        test_recipe:
          setup:
            - "BRONZE customer, soap sku list 3000, released batch, RETAIL order with one line qty 1."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Para", scent_family: "WOODY", title: "Cedar Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Cedar", list_price_cents: 3000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 20, line_code: "LINE_F", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "p@x.com", full_name: "Pat" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /orders/${o1}/fulfill", payload: {}, as: MerchOps }
          assert:
            - "After trigger[0] (checkout): Order.${o1}.payment_status == PAID and Order.${o1}.fulfillment_status == ALLOCATED"
            - "After trigger[1] (fulfill): Order.${o1}.fulfillment_status == DELIVERED and Order.${o1}.payment_status == PAID (unchanged)"

      - name: subscription_renew_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.renewal_count
          - entities.Subscription.fields.next_renewal_at
          - calculations.renewal_batch_selector
        distinguishing_aspect: |
          renew is a self-loop ACTIVE->ACTIVE: across two due renewals status stays ACTIVE while
          renewal_count increments 0->1->2 and next_renewal_at advances by cadence each time — a cyclic
          machine (on Subscription), distinct from the parallel machine (on Order).
        test_recipe:
          setup:
            - "Clock 2026-07-01. ACTIVE customer, soap sku list 1000, released batch qty 100. Subscription qty 5 cadence 30 (next_renewal 2026-07-31)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Sub", scent_family: "CITRUS", title: "Sub Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Orange", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_G", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "s@x.com", full_name: "Sam" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/subscriptions", payload: { sku_id: "${s1}", quantity: 5, cadence_days: 30 }, as: Customer, as_user_id: "${c1}", captures: { sub: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /subscriptions/${sub}/renew", payload: {}, as: MerchOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /subscriptions/${sub}/renew", payload: {}, as: MerchOps }
          assert:
            - "Subscription.${sub}.status == ACTIVE"
            - "Subscription.${sub}.renewal_count == 2"
            - "Batch.${b1}.quantity_reserved == 10"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: batch_recall_depth4_cascade
        grounds:
          - state_machines.Batch.RELEASED_to_RECALLED
          - state_machines.OrderLine.RESERVED_to_VOIDED_RECALL
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Depth-4 chain triggered by recall: batch->RECALLED (A) causes line->VOIDED_RECALL (B),
          which causes the fully-voided order->CANCELLED+REFUNDED (C), which causes the customer's
          provisional loyalty reversal balance 50->0 (D). Each link caused by the previous.
        test_recipe:
          setup:
            - "BRONZE customer. Soap sku list 500, released batch B qty 100. RETAIL order, one line qty 10 (subtotal 5000). Checked out: provisional 50, balance 50, PAID/ALLOCATED."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Rec", scent_family: "WOODY", title: "Recall Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Pine", list_price_cents: 500 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_H", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "r@x.com", full_name: "Ren" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 10 }, as: Customer, as_user_id: "${c1}", captures: { l1: "$.data.id" } }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /batches/${b1}/recall", payload: {}, as: MerchOps }
          assert:
            - "Batch.${b1}.status == RECALLED"
            - "OrderLine.${l1}.status == VOIDED_RECALL"
            - "Order.${o1}.fulfillment_status == CANCELLED"
            - "Order.${o1}.payment_status == REFUNDED"
            - "Customer.${c1}.loyalty_points_balance == 0"

      - name: order_cancel_depth3_cascade
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - state_machines.OrderLine.RESERVED_to_RELEASED
          - state_machines.Batch.DEPLETED_to_RELEASED
          - entities.Batch.fields.quantity_available
        distinguishing_aspect: |
          Depth-3 chain from a distinct trigger (order cancel): order->CANCELLED (A) causes line->RELEASED (B),
          which raises batch.quantity_available 0->100 (C), which auto-transitions the batch DEPLETED->RELEASED (C').
          Different originating transition than the recall cascade.
        test_recipe:
          setup:
            - "BRONZE customer. Soap sku list 100, released batch B qty 100. RETAIL order, one line qty 100 -> reserves all 100 so batch is DEPLETED. Checked out (PAID/ALLOCATED)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Can", scent_family: "CITRUS", title: "Cancel Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Mint", list_price_cents: 100 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_I", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "d@x.com", full_name: "Dex" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 100 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/cancel", payload: {}, as: Customer, as_user_id: "${c1}" }
          assert:
            - "Order.${o1}.fulfillment_status == CANCELLED"
            - "Order.${o1}.payment_status == REFUNDED"
            - "Batch.${b1}.quantity_reserved == 0"
            - "Batch.${b1}.quantity_available == 100"
            - "Batch.${b1}.status == RELEASED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_add_line
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_BATCH_NOT_RELEASED]
          - errors[ERR_SAFETY_LABEL_REQUIRED]
        distinguishing_aspect: |
          A candle (safety-required) sku's batch is CREATED-and-unlabeled, so BOTH ERR_BATCH_NOT_RELEASED
          (state, priority 5) and ERR_SAFETY_LABEL_REQUIRED (business_safety, priority 7) apply; the state
          error wins. Pair: state vs business_safety.
        test_recipe:
          setup:
            - "Candle sku (requires_safety_label true) with a batch left in CREATED (never labeled, never released). BRONZE customer with a PENDING order."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "CANDLE", collection_name: "Safe", scent_family: "WOODY", title: "Wax Candle" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "LARGE", scent: "Smoke", list_price_cents: 4000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 10, line_code: "LINE_J", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "k@x.com", full_name: "Kim" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_BATCH_NOT_RELEASED (state, priority 5), NOT ERR_SAFETY_LABEL_REQUIRED"

      - name: temporal_beats_fiscal_on_add_line
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_DROP_NOT_LIVE]
          - errors[ERR_INSUFFICIENT_INVENTORY]
          - entities.Drop.fields.listings
        distinguishing_aspect: |
          A drop-exclusive sku whose drop window is ENDED AND a requested quantity 10 exceeding
          available 5 both fail; ERR_DROP_NOT_LIVE (business_temporal, priority 8) wins over
          ERR_INSUFFICIENT_INVENTORY (business_fiscal, priority 11). Pair: business_temporal vs business_fiscal.
        test_recipe:
          setup:
            - "Soap sku exclusive to a drop with window [2026-07-05,2026-07-10) (ENDED once clock is 2026-07-20). Released batch with only 5 available. PENDING order. Clock advanced to 2026-07-20."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Drop", scent_family: "FLORAL", title: "Drop Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Jasmine", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 5, line_code: "LINE_K", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /drops", payload: { season: "SUMMER_2026", title: "Flash", starts_at: "2026-07-05T00:00:00Z", ends_at: "2026-07-10T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 900, is_exclusive: true }] }, as: MerchOps, captures: { d1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "t@x.com", full_name: "Tom" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 10 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_DROP_NOT_LIVE (business_temporal, priority 8), NOT ERR_INSUFFICIENT_INVENTORY"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bulk_min_quantity_at_checkout
        grounds:
          - validations[priority=11]
          - errors[ERR_BULK_MIN_NOT_MET]
          - calculations.order_final_pricing
          - entities.Order.fields.total_quantity
        distinguishing_aspect: |
          A BULK order with total_quantity 49 is rejected at checkout because the rule is
          total_quantity >= BULK_MIN_QUANTITY (50); 50 would pass. Numeric boundary on the bulk-min
          metric, reached through the checkout endpoint.
        test_recipe:
          setup:
            - "Soap sku list 100, released batch qty 100. BULK order with one line qty 49 (total_quantity 49, one short of the 50 minimum)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Bulk", scent_family: "CITRUS", title: "Bulk Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Grapefruit", list_price_cents: 100 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_L", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "u@x.com", full_name: "Uma" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "BULK" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 49 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 422"
            - "error_id == ERR_BULK_MIN_NOT_MET"
            - "Order.${o1}.payment_status == UNPAID (checkout rejected)"

      - name: empty_bundle_activate_zero_items
        grounds:
          - validations[priority=10]
          - errors[ERR_EMPTY_BUNDLE]
          - state_machines.Bundle.DRAFT_to_ACTIVE
          - entities.Bundle.fields.items
        distinguishing_aspect: |
          Activating a bundle whose items collection has length 0 is rejected with ERR_EMPTY_BUNDLE —
          an empty-collection boundary (a different metric) reached through the bundle-activate endpoint
          (a different endpoint than the numeric bulk-min threshold).
        test_recipe:
          setup:
            - "A DRAFT bundle created with an empty items array."
          setup_api_calls:
            - { call: "POST /bundles", payload: { title: "Empty Gift", items: [], bundle_price_cents: 5000 }, as: MerchOps, captures: { bnd: "$.data.id" } }
          trigger:
            - { call: "POST /bundles/${bnd}/activate", payload: {}, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 422"
            - "error_id == ERR_EMPTY_BUNDLE"
            - "Bundle.${bnd}.status == DRAFT (activation rejected)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: add_line_requires_batch_released
        grounds:
          - validations[priority=5]
          - errors[ERR_BATCH_NOT_RELEASED]
          - entities.Batch.fields.status
          - state_machines.OrderLine.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Adding a line for a soap (non-safety) sku whose batch is CREATED (not RELEASED) is rejected
          with ERR_BATCH_NOT_RELEASED — the OrderLine add depends on the Batch's state. Pair: Order->Batch.
        test_recipe:
          setup:
            - "Soap sku with a batch left CREATED (released never called). BRONZE customer with a PENDING order."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Xdep", scent_family: "CITRUS", title: "Xdep Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Yuzu", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 50, line_code: "LINE_M", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /customers", payload: { email: "v@x.com", full_name: "Val" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_BATCH_NOT_RELEASED"

      - name: renew_requires_customer_active
        grounds:
          - validations[priority=9]
          - errors[ERR_CUSTOMER_SUSPENDED]
          - entities.Customer.fields.status
          - state_machines.Subscription.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          A due subscription renewal is blocked with ERR_CUSTOMER_SUSPENDED because the owning
          Customer is SUSPENDED — the Subscription renewal transition depends on the Customer's state.
          Pair: Subscription->Customer (different pair than Order->Batch).
        test_recipe:
          setup:
            - "Clock 2026-07-01. Customer with a released-batch soap subscription qty 5 cadence 30 (next_renewal 2026-07-31). Customer then SUSPENDED. Clock advanced to 2026-08-01 so the renewal is due."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Susp", scent_family: "WOODY", title: "Susp Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Oak", list_price_cents: 1000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_N", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "w@x.com", full_name: "Wes" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/subscriptions", payload: { sku_id: "${s1}", quantity: 5, cadence_days: 30 }, as: Customer, as_user_id: "${c1}", captures: { sub: "$.data.id" } }
            - { call: "POST /customers/${c1}/suspend", payload: {}, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /subscriptions/${sub}/renew", payload: {}, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_CUSTOMER_SUSPENDED"
            - "Subscription.${sub}.renewal_count == 0 (renewal not advanced)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: drop_exclusive_window_overlap_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_DROP_WINDOW_OVERLAP]
          - entities.Drop.fields.starts_at
          - entities.Drop.fields.ends_at
          - entities.Drop.fields.listings
        distinguishing_aspect: |
          Half-open [start,end) semantics on the Drop resource: exclusive windows [2026-08-01,2026-08-10)
          and [2026-08-05,2026-08-15) for the same sku overlap and are rejected, while an adjacent
          [2026-08-10,2026-08-20) (shared endpoint) is accepted in setup.
        test_recipe:
          setup:
            - "Soap sku listed exclusively in drop D1 [2026-08-01,2026-08-10) and in an adjacent (accepted) drop D3 [2026-08-10,2026-08-20)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Ovl", scent_family: "CITRUS", title: "Ovl Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "SMALL", scent: "Bergamot", list_price_cents: 1200 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /drops", payload: { season: "FALL_2026", title: "D1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 1100, is_exclusive: true }] }, as: MerchOps, captures: { d1: "$.data.id" } }
            - { call: "POST /drops", payload: { season: "FALL_2026", title: "D3-adjacent", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 1100, is_exclusive: true }] }, as: MerchOps, captures: { d3: "$.data.id" } }
          trigger:
            - { call: "POST /drops", payload: { season: "FALL_2026", title: "D2-overlap", starts_at: "2026-08-05T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", listings: [{ sku_id: "${s1}", drop_price_cents: 1100, is_exclusive: true }] }, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_DROP_WINDOW_OVERLAP"

      - name: batch_cure_window_conflict_closed
        grounds:
          - validations[priority=10]
          - errors[ERR_BATCH_LINE_CONFLICT]
          - entities.Batch.fields.cure_starts_at
          - entities.Batch.fields.cure_ends_at
          - entities.Batch.fields.line_code
        distinguishing_aspect: |
          Closed [start,end] semantics on the Batch resource: two cure windows on line_code LINE_Z,
          [2026-06-01,2026-06-05] and [2026-06-05,2026-06-10], share endpoint 2026-06-05 and are rejected —
          adjacency conflicts, unlike Drop's half-open windows. A gap window [2026-06-06,2026-06-08] is accepted in setup.
        test_recipe:
          setup:
            - "Soap sku with a batch B1 cured on LINE_Z [2026-06-01,2026-06-05] and a non-overlapping batch B3 on LINE_Z [2026-06-06,2026-06-08] (accepted)."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Cure", scent_family: "WOODY", title: "Cure Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Birch", list_price_cents: 1500 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 40, line_code: "LINE_Z", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 40, line_code: "LINE_Z", cure_starts_at: "2026-06-06T00:00:00Z", cure_ends_at: "2026-06-08T00:00:00Z" }, as: MerchOps, captures: { b3: "$.data.id" } }
          trigger:
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 40, line_code: "LINE_Z", cure_starts_at: "2026-06-05T00:00:00Z", cure_ends_at: "2026-06-10T00:00:00Z" }, as: MerchOps, captures: { err: "$.data.error_id" } }
          assert:
            - "response HTTP status == 409"
            - "error_id == ERR_BATCH_LINE_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_unit_conservation_reserve_cancel
        grounds:
          - calculations.batch_availability
          - entities.Batch.fields.quantity_available
          - entities.Batch.fields.quantity_reserved
          - state_machines.Order.ALLOCATED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = physical batch units. Reserving 30 (available 100->70, reserved 0->30)
          then cancelling (available 70->100, reserved 30->0) leaves the identity
          quantity_produced(100) == available + reserved + shipped + recalled intact.
        test_recipe:
          setup:
            - "Soap sku list 200, released batch qty 100 (available 100). RETAIL order with one line qty 30 (reserved 30, available 70), checked out."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Cons", scent_family: "CITRUS", title: "Cons Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "MEDIUM", scent: "Neroli", list_price_cents: 200 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 100, line_code: "LINE_P", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "y@x.com", full_name: "Yan" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 30 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /orders/${o1}/cancel", payload: {}, as: Customer, as_user_id: "${c1}" }
          assert:
            - "Batch.${b1}.quantity_produced == 100"
            - "Batch.${b1}.quantity_reserved == 0"
            - "Batch.${b1}.quantity_shipped == 0"
            - "Batch.${b1}.quantity_recalled == 0"
            - "Batch.${b1}.quantity_available == 100"

      - name: loyalty_points_conservation_deliver_return
        grounds:
          - calculations.loyalty_points_earned
          - entities.Customer.fields.loyalty_points_balance
          - state_machines.Return.APPROVED_to_REFUNDED
          - state_machines.Order.DELIVERED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = loyalty points (distinct from physical units). Granting 2000, then an
          order that earns 30 at delivery (balance 2030) fully returned revokes exactly 30, restoring
          loyalty_points_balance to the pre-order 2000.
        test_recipe:
          setup:
            - "GOLD customer (granted 2000). Soap sku list 3000, released batch. RETAIL order one line qty 1 (subtotal 3000). Checked out (provisional 30, balance 2030) and delivered (awarded 30). Return requested and approved."
          setup_api_calls:
            - { call: "POST /products", payload: { product_type: "SOAP", collection_name: "Loy", scent_family: "FLORAL", title: "Loy Soap" }, as: MerchOps, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/skus", payload: { size: "LARGE", scent: "Lavender", list_price_cents: 3000 }, as: MerchOps, captures: { s1: "$.data.id" } }
            - { call: "POST /skus/${s1}/batches", payload: { quantity_produced: 20, line_code: "LINE_Q", cure_starts_at: "2026-06-01T00:00:00Z", cure_ends_at: "2026-06-05T00:00:00Z" }, as: MerchOps, captures: { b1: "$.data.id" } }
            - { call: "POST /batches/${b1}/release", payload: {}, as: MerchOps }
            - { call: "POST /customers", payload: { email: "z@x.com", full_name: "Zoe" }, as: PlatformAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /customers/${c1}/loyalty-grant", payload: { points: 2000 }, as: PlatformAdmin }
            - { call: "POST /customers/${c1}/orders", payload: { order_type: "RETAIL" }, as: Customer, as_user_id: "${c1}", captures: { o1: "$.data.id" } }
            - { call: "POST /orders/${o1}/lines", payload: { sku_id: "${s1}", batch_id: "${b1}", quantity: 1 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /orders/${o1}", payload: {}, as: Customer, as_user_id: "${c1}", captures: { ov: "$.data.version" } }
            - { call: "POST /orders/${o1}/checkout", payload: { expected_order_version: "${ov}" }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /orders/${o1}/fulfill", payload: {}, as: MerchOps }
            - { call: "POST /orders/${o1}/returns", payload: { reason: "changed mind" }, as: Customer, as_user_id: "${c1}", captures: { ret: "$.data.id" } }
            - { call: "POST /returns/${ret}/approve", payload: {}, as: MerchOps }
          trigger:
            - { call: "POST /returns/${ret}/settle", payload: {}, as: MerchOps }
          assert:
            - "Return.${ret}.status == REFUNDED"
            - "Return.${ret}.revoked_points == 30"
            - "Order.${o1}.payment_status == REFUNDED"
            - "Order.${o1}.fulfillment_status == RETURNED"
            - "Customer.${c1}.loyalty_points_balance == 2000"
