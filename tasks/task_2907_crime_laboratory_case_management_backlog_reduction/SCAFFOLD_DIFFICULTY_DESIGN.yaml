  - rule_id: non_linear_state_machine
    instances:

      - name: exam_request_administrative_return_reopens_same_assignment_row
        grounds:
          - state_machines.ExaminationRequest.ADMIN_REVIEW_to_IN_ANALYSIS
          - state_machines.ExaminationRequest.IN_ANALYSIS_to_TECH_REVIEW
          - state_machines.ExaminationRequest.ADMIN_REVIEW_to_RELEASED
          - state_machines.Assignment.COMPLETED_to_ACTIVE
          - state_machines.EvidenceItem.IN_VAULT_to_IN_ANALYSIS
          - entities.ExaminationRequest.fields.revision_round
          - entities.EvidenceItem.fields.checkout_count
        distinguishing_aspect: |
          The cycle ADMIN_REVIEW -> IN_ANALYSIS -> TECH_REVIEW -> ADMIN_REVIEW -> RELEASED
          re-encumbers the SAME Assignment row (COMPLETED -> ACTIVE, superseded_by_assignment_id
          stays null, exactly one Assignment exists for the request) and checks the same evidence
          item out of the vault a second time, so revision_round 1 with checkout_count 2 and
          exactly four ReviewRecord rows is only reachable through the backward edge.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1 (CHEMISTRY, competency 4, capacity 40.00, training 8.00) is the examiner; Analyst A2 (same profile) is the technical reviewer."
            - "Method M1 VALIDATED, standard_hours_per_item 2.00, is_consumptive false."
            - "Case C1 (DRUG_OFFENSE, no deadline) -> P3_ROUTINE, ACCEPTED with one vault item."
            - "Request R1 (item_count 3, estimated_hours 6.00) has been assigned to A1, analysed with actual_hours 5.00, technically agreed by A2, and now sits in ADMIN_REVIEW at revision_round 0 with checkout_count 1 and the Assignment COMPLETED."
