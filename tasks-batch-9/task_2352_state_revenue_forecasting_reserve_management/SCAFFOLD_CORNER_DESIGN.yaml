            - { call: "POST /one-time-items", payload: { cycle_id: "${cyc}", source_id: "${src_cgt}", item_type: "SETTLEMENT", amount_cents: 12000000, description: "Multistate corporate tax settlement, single payment" }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_cgt}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}", judgmental_adjustment_cents: -8000000 }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_cgt}", judgmental_adjustment_cents: -3000000 }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
          trigger:
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1", captures: { var_bps: $.data.variance_bps, exec_total: $.data.exec_total_cents, leg_total: $.data.leg_total_cents } }
          assert:
            - "HTTP 200; ${exec_total} == 1606416273 (PIT 1258956684 recurring + CGT 347459589) and ${leg_total} == 1595416273"
            - "${var_bps} == 69 — round_half_up(11000000 * 10000 / 1600916273), i.e. measured against the midpoint 1600916273"
            - "ConsensusRound.${rnd}.status == COMPARED (69 <= variance_tolerance_bps 150) and open_disagreement_count == 0"
            - "ConsensusRound.${rnd}.reconciled_total_cents == 1600916273 and GET /disagreement-records with round_id ${rnd} returns total_count == 0 (per-source variances 64 and 87 are both within 150)"

  # ===========================================================================
  # SECTION 4 — Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority 1 ERR_MISSING_ROLE_HEADER]
          - errors[ERR_MISSING_ROLE_HEADER]
        distinguishing_aspect: |
          Priority 1 sits above everything: a create call with no X-Role-Name header returns
          ERR_MISSING_ROLE_HEADER 401 even though the payload is otherwise perfect, and nothing is
          persisted.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z. The trigger call omits the X-Role-Name header entirely (as: null)."
          setup_api_calls: []
          trigger:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: null, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and ${err} == ERR_MISSING_ROLE_HEADER"
            - "GET /revenue-sources returns total_count == 0"

      - name: missing_user_header_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority 2 ERR_MISSING_USER_HEADER]
          - errors[ERR_MISSING_USER_HEADER]
          - complexity_profile.role_model
        distinguishing_aspect: |
          X-User-ID is mandatory on every call because segregation of duties is enforced by user
          identity, not only by role: a call carrying a valid X-Role-Name but no X-User-ID returns
          ERR_MISSING_USER_HEADER 401 — priority 2, so it is reported after the role header is
          accepted and before any authorization check.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z. The trigger carries X-Role-Name ForecastDirector but no X-User-ID."
          setup_api_calls: []
          trigger:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and ${err} == ERR_MISSING_USER_HEADER"
            - "GET /revenue-sources returns total_count == 0"

      - name: stale_fund_version_at_priority_8_beats_uncertified_cycle_at_priority_42
        claim_type: priority_ordering
        grounds:
          - validations[priority 8 ERR_STALE_FUND_VERSION]
          - validations[priority 42 ERR_CYCLE_NOT_CERTIFIED]
          - concurrency_rules[withdrawal_request_on_reserve_fund]
        distinguishing_aspect: |
          One call violates two rules at once — a stale expected_fund_version AND a cycle that is
          still DRAFT. Priority 8 wins, so the response is ERR_STALE_FUND_VERSION 412, not
          ERR_CYCLE_NOT_CERTIFIED 422; repairing only the version then exposes the referential error
          underneath it.
        test_recipe:
          setup:
            - "One DRAFT FY2027 cycle (never certified) and one fund created at version 1, whose version is then bumped to 2 by a manual deposit. No cycle is CERTIFIED, so cap_cents is null and the deposit faces no cap."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id, fnd_v_stale: $.data.version } }
            - { call: "POST /reserve-funds/${fnd}/deposits", payload: { amount_cents: 1000000, memo: "Opening true-up transfer" }, as: ReserveTreasurer, as_user_id: "tr-1" }
            - { call: "GET /reserve-funds/${fnd}", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1", captures: { fnd_v_current: $.data.version } }
          trigger:
            - { call: "POST /withdrawal-requests", payload: { fund_id: "${fnd}", cycle_id: "${cyc}", requested_amount_cents: 5000000, justification_type: "SUPERMAJORITY_VOTE", deadline_date: "2026-12-31", expected_fund_version: "${fnd_v_stale}" }, as: ReserveTreasurer, as_user_id: "tr-req-1", captures: { err_occ: $.data.error_id } }
            - { call: "POST /withdrawal-requests", payload: { fund_id: "${fnd}", cycle_id: "${cyc}", requested_amount_cents: 5000000, justification_type: "SUPERMAJORITY_VOTE", deadline_date: "2026-12-31", expected_fund_version: "${fnd_v_current}" }, as: ReserveTreasurer, as_user_id: "tr-req-1", captures: { err_cycle: $.data.error_id } }
          assert:
            - "first trigger: HTTP 412 and ${err_occ} == ERR_STALE_FUND_VERSION (priority 8 masks priority 42)"
            - "second trigger: HTTP 422 and ${err_cycle} == ERR_CYCLE_NOT_CERTIFIED"
            - "GET /withdrawal-requests with fund_id ${fnd} returns total_count == 0"
            - "ReserveFund.${fnd}.balance_cents == 51000000 and version == ${fnd_v_current}"

      - name: duplicate_scenario_label_within_cycle_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 47 ERR_DUPLICATE_SCENARIO_LABEL]
          - entities.EconomicScenario.fields.label
        distinguishing_aspect: |
          The label uniqueness scope is the cycle, not the table: a second BASELINE scenario in the
          same cycle returns ERR_DUPLICATE_SCENARIO_LABEL 409 and leaves
          scenario_weight_total_bps at 6000, while the same label in a different cycle is accepted.
        test_recipe:
          setup:
            - "Two DRAFT FY2027 cycles; the first already carries a BASELINE scenario weighted 6000."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_a: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2028, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1700000000, prior_recurring_baseline_cents: 1600000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_b: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc_a}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /forecast-cycles/${cyc_a}/scenarios", payload: { label: "BASELINE", weight_bps: 4000, employment_growth_bps: 200, wage_income_bps: 450, retail_sales_bps: 350, asset_market_return_bps: 700 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err: $.data.error_id } }
            - { call: "POST /forecast-cycles/${cyc_b}/scenarios", payload: { label: "BASELINE", weight_bps: 10000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { sc_b: $.data.id } }
          assert:
            - "first trigger: HTTP 409 and ${err} == ERR_DUPLICATE_SCENARIO_LABEL"
            - "ForecastCycle.${cyc_a}.scenario_weight_total_bps == 6000 and GET /forecast-cycles/${cyc_a}/scenarios returns total_count == 1"
            - "second trigger: HTTP 201; EconomicScenario.${sc_b}.label == \"BASELINE\" (uniqueness is per cycle)"
            - "ForecastCycle.${cyc_b}.scenario_weight_total_bps == 10000"

      - name: duplicate_estimate_per_body_and_source_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 48 ERR_DUPLICATE_ESTIMATE]
          - entities.SourceEstimate.fields.body
        distinguishing_aspect: |
          Uniqueness is on the triple (round_id, source_id, body): the executive economist's second
          PIT estimate on the same round returns ERR_DUPLICATE_ESTIMATE 409, yet the legislative
          economist's first PIT estimate on that same round is accepted — the two bodies are not in
          each other's uniqueness scope.
        test_recipe:
          setup:
            - "SHORT chain up to an OPEN round; the executive economist has already filed one PIT estimate."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
          trigger:
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}", judgmental_adjustment_cents: -5000000 }, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err: $.data.error_id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}", judgmental_adjustment_cents: -5000000 }, as: LegislativeEconomist, as_user_id: "leg-eco-1", captures: { est_leg: $.data.id } }
          assert:
            - "first trigger: HTTP 409 and ${err} == ERR_DUPLICATE_ESTIMATE"
            - "second trigger: HTTP 201; SourceEstimate.${est_leg}.body == LEGISLATIVE and estimate_amount_cents == 1291456684"
            - "GET /source-estimates with round_id ${rnd} returns total_count == 2"

      - name: incomplete_submission_missing_source_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority 49 ERR_INCOMPLETE_SUBMISSION]
          - endpoints[POST /consensus-rounds/{id}/submit]
          - entities.ConsensusRound.fields.exec_submission_status
        distinguishing_aspect: |
          Completeness is checked against the ACTIVE source set, not against whatever the body
          happened to file: with two ACTIVE sources and only a PIT estimate, submit returns
          ERR_INCOMPLETE_SUBMISSION 422 and exec_submission_status stays PENDING — filing the
          missing CGT estimate then lets the very same call through.
        test_recipe:
          setup:
            - "Two ACTIVE sources (PIT and CGT) and an OPEN round on a locked FY2027 cycle; the executive economist has filed only the PIT estimate."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /revenue-sources", payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_cgt: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
          trigger:
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1", captures: { err: $.data.error_id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_cgt}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
          assert:
            - "first trigger: HTTP 422 and ${err} == ERR_INCOMPLETE_SUBMISSION"
            - "after the first trigger: ConsensusRound.${rnd}.exec_submission_status == PENDING and exec_total_cents == null"
            - "third trigger: HTTP 200; ConsensusRound.${rnd}.exec_submission_status == SUBMITTED and exec_total_cents == 1627916273 (PIT 1296456684 + CGT 331459589; this fixture carries no policy adjustment and no one-time item)"
            - "ConsensusRound.${rnd}.status == OPEN (the legislative body has not submitted)"

      - name: actual_collection_before_fiscal_year_close_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 32 ERR_FISCAL_YEAR_NOT_CLOSED]
          - errors[ERR_FISCAL_YEAR_NOT_CLOSED]
          - endpoints[POST /actual-collections]
        distinguishing_aspect: |
          The gate is date(clock) > (fiscal_year)-06-30, so at the default clock of 2026-08-01 an
          FY2027 actual is refused with ERR_FISCAL_YEAR_NOT_CLOSED 409 — even though FY2027 is
          already under way — and the temporal rule at priority 32 is reported before the
          referential rule at priority 44 that the same call also violates (no FY2027 forecast is
          certified yet).
        test_recipe:
          setup:
            - "One ACTIVE PIT source; no cycle of any kind. Clock at 2026-08-01T00:00:00Z, i.e. inside FY2027."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
          trigger:
            - { call: "POST /actual-collections", payload: { source_id: "${src_pit}", fiscal_year: 2027, actual_amount_cents: 1200000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 and ${err} == ERR_FISCAL_YEAR_NOT_CLOSED (not ERR_NO_CERTIFIED_FORECAST)"
            - "GET /actual-collections with source_id ${src_pit} returns total_count == 0"
            - "RevenueSource.${src_pit}.posted_actual_count == 0 and mape_bps == 0"

      - name: director_override_outside_band_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 51 ERR_OVERRIDE_OUT_OF_RANGE]
          - entities.DisagreementRecord.fields.exec_amount_cents
          - endpoints[POST /disagreement-records/{id}/resolve]
        distinguishing_aspect: |
          DIRECTOR_OVERRIDE is bounded by the two filed estimates, inclusive: on the DISPUTE fixture
          the band is [1238956684, 1258956684], so a resolved_amount_cents of 1300000000 — a figure
          neither body ever proposed — returns ERR_OVERRIDE_OUT_OF_RANGE 422 and the record stays
          OPEN.
        test_recipe:
          setup:
            - "DISPUTE chain: FULL chain payloads but with the legislative PIT estimate carrying judgmental_adjustment_cents -20000000, so PIT exec 1258956684 vs leg 1238956684 is a per-source variance of 160 bps (> 150) while CGT is only 87 bps — exactly one PIT DisagreementRecord is opened. The aggregate variance is only 144 bps, so the round is driven to DISPUTED by the per-source breach alone."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /revenue-sources", payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_cgt: $.data.id } }
            - { call: "POST /revenue-sources/${src_pit}/policy-adjustments", payload: { statute_code: "HB-2027-014", policy_category: "RATE_CHANGE", adjustment_kind: "DECREASE", annualized_amount_cents: 50000000, effective_start_date: "2026-10-01", effective_end_date: "2027-07-01", phase_in_type: "PRORATED", first_effective_fiscal_year: 2027 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /revenue-sources/${src_cgt}/policy-adjustments", payload: { statute_code: "SB-2027-003", policy_category: "RATE_CHANGE", adjustment_kind: "INCREASE", annualized_amount_cents: 20000000, effective_start_date: "2026-07-01", phase_in_type: "TIERED", first_effective_fiscal_year: 2027, cap_amount_cents: 4000000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
