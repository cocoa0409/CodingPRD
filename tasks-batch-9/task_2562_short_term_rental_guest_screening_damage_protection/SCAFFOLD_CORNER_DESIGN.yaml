          - endpoints.GET_rentals_jurisdiction_rules_id
          - endpoints.GET_rentals_jurisdiction_rules
        distinguishing_aspect: "Create-then-read-then-list on JurisdictionRule round-trips all nine policy inputs unchanged, and because the entity declares common_fields false the read carries no version field at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no jurisdiction rules stored."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j1: $.data.id }
            - call: "GET /rentals/jurisdiction-rules/${j1}"
              payload: {}
              as: Host
              as_user_id: "reader-host"
          assert:
            - "The create returns 201 and the read returns 200 with the same id ${j1}"
            - "jurisdiction_code == US-CA-SFO, min_stay_nights == 2, max_occupancy_cap == 8, noise_threshold_db == 70"
            - "events_prohibited == false, registration_required == false, indoor_camera_allowed == true, indoor_audio_allowed == false, sensor_notice_required == true"
            - "The read payload carries no version field — JurisdictionRule declares common_fields false"
            - "GET /rentals/jurisdiction-rules filtered by jurisdiction_code US-CA-SFO reports total_count 1"

