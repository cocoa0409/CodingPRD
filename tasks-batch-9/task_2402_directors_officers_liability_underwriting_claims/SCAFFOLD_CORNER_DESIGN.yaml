      - name: policy_expiry_releases_only_non_exhausted_parts_and_layers
        claim_type: conditional_cascade
        grounds:
          - state_machines.CoveragePart.transitions.ACTIVE_to_RELEASED
          - state_machines.Layer.transitions.ATTACHED_to_RELEASED
          - calculations.tower_placement_posture
          - calculations.entity_side_c_capacity
        distinguishing_aspect: |
          The release cascade is conditional on the child's own state: only ACTIVE parts and ATTACHED
          layers become RELEASED, while a part and a layer already EXHAUSTED by defense advancement keep
          their terminal status — an implementation that blanket-writes RELEASED over every child fails.
          The insured's Side C capacity is nonetheless fully returned, because the released SIDE_C part
          leaves the capacity input set.
        test_recipe:
          setup:
            - "One bound Vantiq Bio Inc policy (10,000,000 shared limit, 250,000 retention, 5,000,000 Side C, program target 20,000,000) with a primary 0 / 10,000,000 layer and an excess 10,000,000 / 10,000,000 layer, both at participation 1.00."
            - "Clock at 2026-09-02T00:00:00Z; premium_status still INVOICED (never swept), so advancement is permitted."
            - "A SECURITIES_CLASS_ACTION claim accepted under RELATIVE_EXPOSURE has had one 10,250,000 fully covered invoice allocated: 250,000 retention plus 10,000,000 advanced, which exhausts SIDE_B and the primary layer."
