              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { n0: $.data.id }
          trigger:
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "PROCESSOR", traceability_mode: "PHYSICAL", upstream_node_id: "${n0}", conversion_ratio: 0.8 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { n1: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${n1}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { n2: $.data.id }
            - call: "GET /fairtrade/supply-chain-nodes"
              payload: { upstream_node_id: "${n0}" }
              as: CertificationOfficer
          assert:
            - "both creates return 201; SupplyChainNode.${n1}.upstream_node_id == ${n0} and SupplyChainNode.${n2}.upstream_node_id == ${n1}"
            - "chain_depth is 0 on ${n0}, 1 on ${n1} and 2 on ${n2}"
            - "SupplyChainNode.${n1}.conversion_ratio == 0.8 while ${n2}.conversion_ratio == 1.0 by default"
            - "the filtered list returns total_count == 1 and exactly the row ${n1}, so the grandchild ${n2} is not reachable through the direct-link filter"
            - "both new nodes have status ACTIVE because their brand holder is CERTIFIED"

      - name: transition_action_opens_the_sell_down_window_and_reactivates_the_nodes
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fairtrade/certificate-holders/{id}/transition]
          - state_machines.CertificateHolder.SUSPENDED_to_TRANSITIONING
          - global_constants.TRANSITION_WINDOW_DAYS
        distinguishing_aspect: "The transition action is only reachable from SUSPENDED: it is refused on a CERTIFIED holder, and once the holder is suspended the same call sets transition_deadline_at to 2026-10-30T00:00:00Z (clock plus 90 days) and lifts the node cascade back to ACTIVE."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with one ACTIVE COOPERATIVE node"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { n0: $.data.id }
          trigger:
            - call: "POST /fairtrade/certificate-holders/${prod_id}/transition"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/suspend"
              payload: { reason: "AUDIT_FAILURE" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders/${prod_id}/transition"
              payload: {}
              as: CertificationOfficer
          assert:
            - "the first transition returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION and CertificateHolder.${prod_id}.certificate_status stays CERTIFIED with transition_deadline_at == null"
            - "after the suspend, CertificateHolder.${prod_id}.certificate_status == SUSPENDED, suspension_reason == AUDIT_FAILURE and SupplyChainNode.${n0}.status == SUSPENDED"
            - "the second transition returns 200 with certificate_status == TRANSITIONING and transition_deadline_at == 2026-10-30T00:00:00Z"
            - "SupplyChainNode.${n0}.status == ACTIVE again after the transition, so remaining certified stock is sellable"

