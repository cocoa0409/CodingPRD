scaffold_corner_design:
- section: entities
  instances:
  - name: contract_create_returns_defaults_and_envelope
    claim_type: Creation
    grounds:
    - entities.Contract
    - endpoints.POST_/contracts
    - response_envelope
    distinguishing_aspect: Creating a contract with the three required inputs returns 201 with status DRAFT, withheld_cents_cum 0, cure_periods_used
      0, version 1, and a full success envelope with meta.api_request_id and api_request_timestamp.
    test_recipe:
      setup:
      - Empty database; logical clock at its startup default 2026-09-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - &id001
        call: POST /contracts
        payload:
          agency_name: State Benefits Agency
          measurement_tz: UTC
          cap_absolutes: false
        as: PlatformAdmin
        captures:
          kc_id: $.data.id
          kc_id_v0: $.data.version
      assert:
      - status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present
      - Contract.${kc_id}.status == DRAFT, withheld_cents_cum == 0, cure_periods_used == 0, version == 1
      - id is a UUID with no type prefix; created_at == 2026-09-01T00:00:00Z from the logical clock default
  - name: service_level_list_paginates_and_filters
    claim_type: Listing
    grounds:
    - endpoints.GET_/service-levels
    - response_envelope.pagination_fields
    distinguishing_aspect: With three service levels on one contract (ASA, ABANDON, QA_AVG), limit=2 returns 2 rows with total_count 3 and has_more
      true; offset=2 returns 1 row with has_more false; metric=ASA filter returns exactly the ASA row.
    test_recipe:
      setup:
      - One DRAFT contract with three DRAFT service levels.
      setup_api_calls:
      - *id001
      - &id002
        call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: ASA
          target: 30
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          ksl_asa: $.data.id
      - call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: ABANDON
          target: 0.05
          cap_pct_of_gross: 0.5
          remedy_fee_cents: 800
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
      - call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: QA_AVG
          target: 80
          cap_pct_of_gross: 0.5
          remedy_fee_cents: 1200
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
      trigger:
      - call: GET /service-levels
        payload:
          contract_id: ${kc_id}
          limit: 2
          offset: 0
        as: BillingAnalyst
      assert:
      - status 200, response_type array, exactly 2 rows, total_count == 3, has_more == true
      - GET /service-levels?contract_id=${kc_id}&limit=2&offset=2 returns 1 row with has_more == false
      - GET /service-levels?contract_id=${kc_id}&metric=ASA returns exactly 1 row (${ksl_asa})
      - GET /service-levels with no params uses limit 10 offset 0 defaults
  - name: queue_get_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/queues
    - errors.ERR_QUEUE_NOT_FOUND
    distinguishing_aspect: A well-formed but unallocated queue id yields the entity-specific 404 ERR_QUEUE_NOT_FOUND, not a generic 404 and not
      a 400.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /queues
        payload:
          contract_id: 00000000-0000-4000-8000-000000000000
          program_code: MEDICAID
          language_code: en
          queue_type: GENERAL
        as: OpsManager
        captures:
          nf_err: $.data.error_id
      assert:
      - status 404 and nf_err == ERR_CONTRACT_NOT_FOUND (body FK checked at priority 3)
      - GET /queues returns 0 rows
  - name: call_create_missing_enqueued_at_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - entities.Call.fields.enqueued_at
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: 'enqueued_at is a required input with no default: omitting it is a 400 ERR_INVALID_REQUEST; language_code and program_code
      omitted in the same request still resolve to the single ERR_INVALID_REQUEST.'
    test_recipe:
      setup:
      - One DRAFT contract.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
        as: Supervisor
        captures:
          req_err: $.data.error_id
      assert:
      - status 400 and req_err == ERR_INVALID_REQUEST
      - GET /calls?contract_id=${kc_id} returns 0 rows
  - name: certification_and_completion_carry_no_version
    claim_type: Immutability
    grounds:
    - entities.Certification
    - entities.CourseCompletion
    distinguishing_aspect: 'common_fields false entities: Certification and CourseCompletion carry id and created_at but no updated_at and no
      version; the completion response exposes neither.'
    test_recipe:
      setup:
      - One DRAFT contract, one agent, one course.
      setup_api_calls:
      - *id001
      - &id003
        call: POST /agents
        payload:
          full_name: Agent One
          languages:
          - en
        as: OpsManager
        captures:
          ka_id: $.data.id
      - &id004
        call: POST /training-courses
        payload:
          program_code: MEDICAID
          required: true
        as: KnowledgeManager
        captures:
          kcourse_id: $.data.id
      trigger:
      - call: POST /training-courses/${kcourse_id}/complete
        payload:
          agent_id: ${ka_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
        captures:
          kcomp_id: $.data.id
      assert:
      - status 200; the CourseCompletion response carries id, created_at, completed_at, agent_id, training_course_id — and no version or updated_at
        field
      - GET /certifications?agent_id=${ka_id} returns 1 row whose representation has no version or updated_at
      - the certification row's invalidated_at is null and valid_until == 2027-01-01T00:00:00Z
  - name: call_create_computed_fields_are_ignored_input
    claim_type: Computed Fields
    grounds:
    - entities.Call.fields.route_depth
    - entities.Call.fields.status
    distinguishing_aspect: 'Call status, queue_id, agent_id, assigned_via, route_depth are system/computed: a create payload smuggling status
      COMPLETED and route_depth 9 is ignored; the call is created WAITING with route_depth 0 and null routing fields.'
    test_recipe:
      setup:
      - One DRAFT contract.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
          status: COMPLETED
          route_depth: 9
          assigned_via: OVERFLOW
        as: Supervisor
        captures:
          icall: $.data.id
      assert:
      - status 201; Call.${icall}.status == WAITING, route_depth == 0, queue_id null, agent_id null, assigned_via null
      - Call.${icall}.version == 1
  - name: invoice_create_duplicate_period_rejected
    claim_type: Parent Relationships
    grounds:
    - entities.Invoice.fields.period
    - errors.ERR_INVOICE_PERIOD_DUPLICATE
    distinguishing_aspect: 'The (contract_id, period) pair is unique per contract: a second 2026-09 invoice on the same contract is 409 ERR_INVOICE_PERIOD_DUPLICATE,
      while the same period on a different contract succeeds — the constraint is scoped, not global.'
    test_recipe:
      setup:
      - Two DRAFT contracts; one 2026-09 invoice on the first.
      setup_api_calls:
      - *id001
      - call: POST /contracts
        payload:
          agency_name: Second Agency
          measurement_tz: UTC
          cap_absolutes: true
        as: PlatformAdmin
        captures:
          kc2_id: $.data.id
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
      trigger:
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          dup_err: $.data.error_id
      - call: POST /invoices
        payload:
          contract_id: ${kc2_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          ok_inv: $.data.id
      assert:
      - 'first trigger call: 409 and dup_err == ERR_INVOICE_PERIOD_DUPLICATE'
      - 'second trigger call: 201 (period is per-contract scoped)'
      - GET /invoices?contract_id=${kc_id} returns exactly 1 row
- section: state_machines
  instances:
  - name: contract_activate_without_effective_sl_fails
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Contract.DRAFT_to_ACTIVE
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: 'DRAFT -> ACTIVE requires at least one EFFECTIVE service level: with only a DRAFT service level the transition is 409
      ERR_INVALID_STATE and the contract stays DRAFT.'
    test_recipe:
      setup:
      - One DRAFT contract with one DRAFT service level.
      setup_api_calls:
      - *id001
      - *id002
      trigger:
      - call: POST /contracts/${kc_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
        captures:
          act_err: $.data.error_id
      assert:
      - status 409 and act_err == ERR_INVALID_STATE
      - GET /contracts/${kc_id} shows status DRAFT and version 1
  - name: invalid_from_transition_on_terminal_call
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Call
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: 'Terminal lockdown: a COMPLETED call rejects every further transition (ANSWERED, COMPLETED, ABANDONED, ASSIGNED) with
      409 ERR_INVALID_STATE and no side effects.'
    test_recipe:
      setup:
      - ACTIVE contract, queue, certified agent, one COMPLETED call.
      setup_api_calls:
      - *id001
      - *id002
      - &id005
        call: POST /service-levels/${ksl_asa}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${kc_id_v0}
        as: OpsManager
      - &id006
        call: POST /contracts/${kc_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - *id003
      - *id004
      - &id007
        call: POST /training-courses/${kcourse_id}/complete
        payload:
          agent_id: ${ka_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - &id008
        call: POST /queues
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          queue_type: GENERAL
        as: OpsManager
        captures:
          kq_id: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          tcall: $.data.id
      - call: POST /calls/${tcall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${tcall}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /calls/${tcall}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${ka_id}
      trigger:
      - call: POST /calls/${tcall}/transition
        payload:
          to_status: ABANDONED
        as: Supervisor
        captures:
          term_err: $.data.error_id
      assert:
      - status 409 and term_err == ERR_INVALID_STATE
      - Call.${tcall}.status remains COMPLETED and version is unchanged by the rejected attempt
  - name: queue_pause_resume_cycle_restores_routing
    claim_type: Valid Transition
    grounds:
    - state_machines.Queue.OPEN_to_PAUSED
    - state_machines.Queue.PAUSED_to_OPEN
    distinguishing_aspect: 'The OPEN <-> PAUSED cycle: a PAUSED queue is skipped by the selector (route of a waiting call fails ERR_NO_ELIGIBLE_QUEUE),
      and resuming restores PRIMARY routing — the loop is observable through routing behavior, not just the status field.'
    test_recipe:
      setup:
      - ACTIVE contract, queue, certified agent; queue paused with a call waiting; then resumed.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          pcall: $.data.id
      - call: POST /queues/${kq_id}/transition
        payload:
          to_status: PAUSED
        as: OpsManager
      trigger:
      - call: POST /calls/${pcall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        captures:
          pause_err: $.data.error_id
      - call: POST /queues/${kq_id}/transition
        payload:
          to_status: OPEN
        as: OpsManager
      - call: POST /calls/${pcall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      assert:
      - 'while paused: 409 and pause_err == ERR_NO_ELIGIBLE_QUEUE'
      - 'after resume: route succeeds, Call.${pcall}.assigned_via == PRIMARY, queue_id == ${kq_id}, agent_id == ${ka_id}, route_depth == 1'
  - name: surge_auto_activation_and_cancel_after_activation
    claim_type: Invalid Transitions
    grounds:
    - state_machines.SurgeWindow.DECLARED_to_ACTIVE
    - state_machines.SurgeWindow.DECLARED_to_CANCELLED
    distinguishing_aspect: 'The auto-transition fires from the clock: at clock == starts_on the window reads ACTIVE without any write; cancelling
      after activation is rejected (CANCELLED is reachable from DECLARED only) with 409 ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - ACTIVE contract; DECLARED surge window starts_on 2026-09-15 ends_on 2026-09-30; clock advanced to 2026-09-15 exactly.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /surge-windows
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          surge_type: ENROLLMENT_PERIOD
          starts_on: '2026-09-15T00:00:00Z'
          ends_on: '2026-09-30T00:00:00Z'
          expected_volume_factor: 1.5
        as: OpsManager
        captures:
          sw_id: $.data.id
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: PlatformAdmin
      - call: GET /surge-windows
        payload:
          contract_id: ${kc_id}
        as: OpsManager
      - call: POST /surge-windows/${sw_id}/transition
        payload:
          to_status: CANCELLED
        as: OpsManager
        captures:
          sw_err: $.data.error_id
      assert:
      - the GET lists SurgeWindow.${sw_id} with status == ACTIVE (auto-fired at clock == starts_on, inclusive)
      - the cancel returns 409 and sw_err == ERR_INVALID_STATE
      - a second GET still shows status ACTIVE
  - name: incident_reopen_loop_preserves_reported_at
    claim_type: Valid Transition
    grounds:
    - state_machines.Incident.RESOLVED_to_OPEN
    - entities.Incident.fields.reported_at
    distinguishing_aspect: 'The RESOLVED -> OPEN regression loop: reopening returns the incident to OPEN but reported_at is immutable — the reporting
      SLA clock never resets across the cycle.'
    test_recipe:
      setup:
      - ACTIVE contract; incident reported at clock 2026-09-05T12:00:00Z with occurred_at 2026-09-04T12:00:00Z; contained then resolved.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T12:00:00Z'
        as: PlatformAdmin
      - call: POST /incidents
        payload:
          contract_id: ${kc_id}
          severity: HIGH
          category: PRIVACY_BREACH
          occurred_at: '2026-09-04T12:00:00Z'
          description: agent exposed PII on a call
        as: SecurityOfficer
        captures:
          inc_id: $.data.id
      - call: POST /incidents/${inc_id}/transition
        payload:
          to_status: CONTAINED
        as: SecurityOfficer
      - call: POST /incidents/${inc_id}/transition
        payload:
          to_status: RESOLVED
        as: SecurityOfficer
      trigger:
      - call: POST /incidents/${inc_id}/transition
        payload:
          to_status: OPEN
        as: SecurityOfficer
      assert:
      - Incident.${inc_id}.status == OPEN after reopen
      - Incident.${inc_id}.reported_at == 2026-09-05T12:00:00Z unchanged
      - Incident.${inc_id}.version advanced on each transition
  - name: cure_period_auto_forfeit_at_deadline
    claim_type: Valid Transition
    grounds:
    - state_machines.CurePeriod
    - entities.CurePeriod.fields.deadline
    distinguishing_aspect: 'Time-driven transition: a PENDING cure period whose deadline passes with the logical clock flips to FORFEIT on the
      clock-set, increments Contract.cure_periods_used, and a later pay-remedy is rejected ERR_CURE_WINDOW_CLOSED.'
    test_recipe:
      setup:
      - ACTIVE contract; one call answered in 40s (ASA miss); invoice prepared at 2026-09-05T09:01:00Z creating a PENDING cure period with deadline
        2026-09-08T09:01:00Z; clock advanced past the deadline.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          ccall: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:00Z'
        as: PlatformAdmin
      - call: POST /calls/${ccall}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:00:40Z'
        as: PlatformAdmin
      - call: POST /calls/${ccall}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          cinv: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-05T09:01:00Z'
        as: PlatformAdmin
      - call: POST /invoices/${cinv}/prepare
        payload: {}
        as: BillingAnalyst
      - call: GET /invoices/${cinv}/lines
        payload: {}
        as: BillingAnalyst
        captures:
          cline_id: $.data[0].id
      - call: GET /invoice-lines/${cline_id}/cure-periods
        payload: {}
        as: BillingAnalyst
        captures:
          ccp: $.data[0].id
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-08T09:01:01Z'
        as: PlatformAdmin
      - call: POST /cure-periods/${ccp}/pay-remedy
        payload: {}
        as: BillingAnalyst
        captures:
          cure_err: $.data.error_id
      assert:
      - GET /cure-periods shows CurePeriod.${ccp}.status == FORFEIT (auto at clock pass)
      - the pay-remedy returns 409 and cure_err == ERR_CURE_WINDOW_CLOSED
      - Contract.${kc_id}.cure_periods_used == 1 and withheld_cents_cum == 21600 (forfeiture keeps the withholding)
  - name: coaching_plan_auto_triggered_on_low_final_score
    claim_type: Side Effect Execution
    grounds:
    - state_machines.QualityReview.SUBMITTED_to_ACCEPTED
    - entities.CoachingPlan.fields.trigger
    distinguishing_aspect: 'The conditional cascade fires only below threshold: an ACCEPTED review with total 69 creates exactly one AUTO_QUALITY
      plan with due_date == now + 14 days; an ACCEPTED review at total 70 for another agent creates none — the < 70 boundary is strict.'
    test_recipe:
      setup:
      - ACTIVE contract, queue, two certified agents each with a COMPLETED call; reviews scoring 69 and 70 respectively.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - call: POST /agents
        payload:
          full_name: Agent Two
          languages:
          - en
        as: OpsManager
        captures:
          ka2_id: $.data.id
      - *id004
      - *id007
      - call: POST /training-courses/${kcourse_id}/complete
        payload:
          agent_id: ${ka2_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          ac1: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:01:00Z'
        as: Supervisor
        captures:
          ac2: $.data.id
      - call: POST /calls/${ac1}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${ac1}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /calls/${ac1}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /calls/${ac2}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${ac2}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka2_id}
      - call: POST /calls/${ac2}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${ka2_id}
      - call: POST /quality-reviews
        payload:
          call_id: ${ac1}
          accuracy_score: 69
          compliance_score: 69
        as: QualityAnalyst
        captures:
          arv1: $.data.id
      - call: POST /quality-reviews
        payload:
          call_id: ${ac2}
          accuracy_score: 70
          compliance_score: 70
        as: QualityAnalyst
        captures:
          arv2: $.data.id
      trigger:
      - call: POST /quality-reviews/${arv1}/transition
        payload:
          to_status: ACCEPTED
        as: QualityAnalyst
      - call: POST /quality-reviews/${arv2}/transition
        payload:
          to_status: ACCEPTED
        as: QualityAnalyst
      assert:
      - 'GET /coaching-plans?agent_id=${ka_id} returns 1 row: trigger AUTO_QUALITY, status OPEN, due_date == accept-time + 14 days'
      - GET /coaching-plans?agent_id=${ka2_id} returns 0 rows (70 is not < 70)
  - name: duplicate_open_plan_rejected
    claim_type: Precondition Enforcement
    grounds:
    - entities.CoachingPlan.fields.agent_id
    - errors.ERR_DUPLICATE_PLAN
    distinguishing_aspect: 'Aggregate constraint: a second OPEN plan for the same agent is 409 ERR_DUPLICATE_PLAN even though each plan is individually
      well-formed; after escalating the first plan the second create is still rejected (ESCALATED also counts as live).'
    test_recipe:
