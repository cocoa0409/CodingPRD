# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index (non-Difficulty claims)
# Sheet-Metal Fabrication & Laser Cutting Shop
# Claim types per references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_and_required_fields
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /fab/customers with all required fields returns 201 with system fields id/created_at/version=1, status ACTIVE, scrap_credit_balance_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fab/customers"
              payload: { company_name: "Acme", email: "a@x.com", credit_limit_cents: 500000 }
              as: ShopManager
              captures: { cid: $.data.id, status: $.data.status, bal: $.data.scrap_credit_balance_cents, ver: $.data.version }
          assert:
            - "http 201; status == ACTIVE; scrap_credit_balance_cents == 0; version == 1; id is a UUID without type prefix"

      - name: customer_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Customer, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting credit_limit_cents (source input, no default) fails request validation before any state write."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fab/customers"
              payload: { company_name: "NoCredit" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "http 400 with a request-validation error_id; no Customer row created"

      - name: quote_line_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.QuoteLine]
        distinguishing_aspect: "Client-supplied line_total_cents / cut_seconds_est in the create payload are ignored; server computes them at price time."
        test_recipe:
          setup: ["grade + customer exist"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-C1", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "U1", email: "u1@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD" }
              as: Estimator
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /fab/quotes/${quote_id}/lines"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }
              as: Estimator
              captures: { line_id: $.data.id, line_status: $.data.status }
          assert:
            - "line created with status ESTIMATED and computed fields (cut_seconds_est etc.) unset/zero until price"
            - "http 201"

      - name: sheet_stock_kind_system_assigned
        claim_type: system_fields
        grounds: [entities.SheetStock]
        distinguishing_aspect: "kind is system-computed from dimensions: 1200x2400 -> FULL_SHEET; any other rectangle -> REMNANT."
        test_recipe:
          setup: ["grade exists"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-C2", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { full_kind: $.data.kind }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 600, height_mm: 900 }
              as: InventoryClerk
              captures: { rem_kind: $.data.kind }
          assert:
            - "1200x2400 row kind == FULL_SHEET; 600x900 row kind == REMNANT"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fab/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "http 404; error_id == ERR_NOT_FOUND"

      - name: audit_event_immutable_no_version
        claim_type: immutability
        grounds: [entities.AuditEvent]
        distinguishing_aspect: "AuditEvent has common_fields false: no update endpoint exists and rows carry no version field."
        test_recipe:
          setup: ["one mutation has occurred so at least one audit row exists"]
          setup_api_calls:
            - call: "POST /fab/customers"
              payload: { company_name: "Aud", email: "aud@x.com", credit_limit_cents: 1000 }
              as: ShopManager
          trigger:
            - call: "GET /fab/audit-events"
              payload: {}
              as: ShopManager
              captures: { first_keys: "$.data" }
          assert:
            - "audit rows expose id + created_at only (no version, no updated_at)"
            - "no PUT/PATCH/DELETE endpoint exists for /fab/audit-events"

      - name: pagination_envelope_on_list
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more; default limit 10."
        test_recipe:
          setup: ["12 customers created"]
          setup_api_calls:
            - call: "POST /fab/customers"
              payload: { company_name: "P01", email: "p01@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P02", email: "p02@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P03", email: "p03@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P04", email: "p04@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P05", email: "p05@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P06", email: "p06@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P07", email: "p07@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P08", email: "p08@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P09", email: "p09@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P10", email: "p10@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P11", email: "p11@x.com", credit_limit_cents: 1000 }
              as: ShopManager
            - call: "POST /fab/customers"
              payload: { company_name: "P12", email: "p12@x.com", credit_limit_cents: 1000 }
              as: ShopManager
          trigger:
            - call: "GET /fab/customers"
              payload: { limit: 10, offset: 0 }
              as: ShopManager
              captures: { page1: $.data }
            - call: "GET /fab/customers"
              payload: { limit: 10, offset: 10 }
              as: ShopManager
              captures: { page2: $.data }
          assert:
            - "page1 meta carries total_count 12 and has_more true; page2 has_more false"
            - "default limit (no params) returns exactly 10 rows"

      - name: fk_reverse_reachability_quote_lines
        claim_type: parent_relationships
        grounds: [entities.QuoteLine]
        distinguishing_aspect: "QuoteLine.quote_id is reachable in both directions: GET /fab/quotes/{id}/lines (sub-resource) and GET /fab/quote-lines/{id} (direct)."
        test_recipe:
          setup: ["quote with one line"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-C3", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "FK", email: "fk@x.com", credit_limit_cents: 1000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id }
          trigger:
            - call: "GET /fab/quotes/${quote_id}/lines"
              payload: {}
              as: Estimator
              captures: { line_id: "$.data[0].id" }
            - call: "GET /fab/quote-lines/${line_id}"
              payload: {}
              as: Estimator
              captures: { line_back: $.data.id }
          assert:
            - "both reads resolve the same QuoteLine row"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_price_on_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Quote]
        distinguishing_aspect: "POST /price is only valid from DRAFT; calling it on a SUBMITTED quote fails ERR_QUOTE_NOT_OPEN regardless of OCC version."
        test_recipe:
          setup: ["quote priced and submitted"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-S1", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "SM1", email: "sm1@x.com", credit_limit_cents: 1000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, qv: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv}" }
              as: Estimator
              captures: { qv2: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv2}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "http 409 ERR_QUOTE_NOT_OPEN (state check precedes OCC check)"

      - name: terminal_state_lockdown_accepted_quote
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Quote]
        distinguishing_aspect: "ACCEPTED is terminal: revise/reject/submit/price all fail on an ACCEPTED quote."
        test_recipe:
          setup: ["quote accepted (full accept chain)"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-S2", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "SM2", email: "sm2@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "LS2", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, qv: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /fab/quotes/${quote_id}/revise"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "http 409 ERR_QUOTE_NOT_OPEN; quote remains ACCEPTED"

      - name: quote_expiry_system_transition
        claim_type: valid_transition
        grounds: [state_machines.Quote.SUBMITTED_to_EXPIRED, calculations.quote_expiry_sweep]
        distinguishing_aspect: "Advancing the logical clock past expires_at flips a SUBMITTED quote to EXPIRED on the next read (lazy sweep) and supersedes its lines."
        test_recipe:
          setup: ["quote submitted at default clock 2026-08-01 (expires 2026-08-15)"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-S3", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "SM3", email: "sm3@x.com", credit_limit_cents: 1000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, qv: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /fab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ShopManager
            - call: "GET /fab/quotes/${quote_id}"
              payload: {}
              as: Estimator
              captures: { status: $.data.status }
          assert:
            - "Quote.status == EXPIRED after sweep; lines SUPERSEDED"

      - name: hold_resume_roundtrip_restores_status
        claim_type: valid_transition
        grounds: [state_machines.FabricationOrder.ON_HOLD_to_IN_PRODUCTION]
        distinguishing_aspect: "hold from IN_PRODUCTION then resume returns the order to IN_PRODUCTION (pre-hold status resolved from audit trail)."
        test_recipe:
          setup: ["order released to IN_PRODUCTION"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-S4", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "SM4", email: "sm4@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "LS4", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, qv: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fab/orders/${order_id}/release"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /fab/orders/${order_id}/hold"
              payload: { hold_reason: "CAPACITY" }
              as: ProductionPlanner
              captures: { held: $.data.status }
            - call: "POST /fab/orders/${order_id}/resume"
              payload: {}
              as: ProductionPlanner
              captures: { resumed: $.data.status }
          assert:
            - "held == ON_HOLD with hold_reason CAPACITY; resumed == IN_PRODUCTION"

      - name: routing_serial_advance_laser_then_brake
        claim_type: side_effect_execution
        grounds: [state_machines.RoutingStep.IN_PROGRESS_to_COMPLETED, calculations.routing_generation]
        distinguishing_aspect: "Completing step seq=1 flips step seq=2 to IN_PROGRESS; completing the last step moves the order to INSPECTION (or AWAITING_OUTSIDE when an outside step exists)."
        test_recipe:
          setup: ["order with bends (LASER + BRAKE routing) released"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-S5", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "SM5", email: "sm5@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "LS5", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/machines"
              payload: { name: "BS5", station: "BRAKE", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 50, bbox_height_mm: 50, hole_count: 0, corner_fillet_count: 0, bend_count: 1, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, qv: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${qv}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fab/orders/${order_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { s1: "$.data[0].id", s2: "$.data[1].id" }
          trigger:
            - call: "POST /fab/routing-steps/${s1}/complete"
              payload: {}
              as: MachineOperator
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { s1_status: "$.data[0].status", s2_status: "$.data[1].status" }
          assert:
            - "step1 COMPLETED, step2 IN_PROGRESS after advance"
            - "completing step2 moves FabricationOrder to INSPECTION"

      - name: laser_step_never_skippable
        claim_type: precondition_enforcement
        grounds: [state_machines.RoutingStep.IN_PROGRESS_to_SKIPPED, "errors[ERR_STEP_NOT_SKIPPABLE]"]
        distinguishing_aspect: "skip on the LASER step of an order fails ERR_STEP_NOT_SKIPPABLE even though the step is IN_PROGRESS."
        test_recipe:
          setup: ["order released; LASER step IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
