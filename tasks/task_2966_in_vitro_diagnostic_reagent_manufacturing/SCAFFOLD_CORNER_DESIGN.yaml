      - name: bridging_equivalence_is_inclusive_at_both_limits_and_recomputes_on_the_latest_paired_result
        claim_type: Constants Applied
        grounds:
          - calculations.bridging_equivalence
          - errors.ERR_NOT_EQUIVALENT
        distinguishing_aspect: "One fixture sits EXACTLY on both declared limits at once — mean 3.00 against MEAN_BIAS_MAX_PCT 3.0 and max 5.00 against MAX_BIAS_MAX_PCT 5.0 — so a strict comparison on either constant flips the verdict. Recording a newer ACTIVITY result then moves the mean to 3.05 while the max stays at 5.00, isolating the mean limit and proving the verdict is recomputed from the LATEST result per code rather than frozen at study creation."
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z. ProductSpecification IVD-CA-6 with release_test_codes [ACTIVITY, SENSITIVITY] and a deliberately loose max_reference_bias_pct of 10.0, so every result below still passes lot-release bias and only the bridging limits bite."
