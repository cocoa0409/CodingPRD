  # ---------------- AccessGrant ----------------
  - method: POST
    path: "/property-care/key-assets/{id}/access-grants"
    description: "Issues a time-windowed access grant. On a LOCKBOX key the creation rotates the code first, so the new grant carries the post-rotation snapshot and every earlier grant is invalidated. Optimistic-concurrency guarded."
    roles: [Dispatcher, PlatformAdmin]
    code: 201
    input: [vendor_id, window_start_at, window_end_at, expected_key_asset_version, "key_issuance_id?"]
    output: AccessGrant
    side_effects: ["on a LOCKBOX key: increments KeyAsset.code_rotation_count by 1 and rewrites current_code to the previous code's integer value plus 1 as a four-character zero-padded decimal string ('1111' becomes '1112'), or to '0001' when the previous code is null or non-numeric", "stamps rotation_index_at_grant and code_snapshot from the post-rotation values", "every other grant with rotation_index_at_grant strictly less than the new count is INVALIDATED with reason CODE_ROTATION", "increments KeyAsset.version by 1"]
    gates: [G1, G2, G3, G4, G8, G10]
  - method: GET
    path: "/property-care/access-grants"
    description: "Lists access grants, filterable by key, vendor or issuance."
    roles: [Dispatcher, PlatformAdmin, Vendor, Auditor, FieldTech]
    code: 200
    input: ["key_asset_id?", "vendor_id?", "key_issuance_id?", "status?", "limit?", "offset?"]
    output: AccessGrant[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/access-grants/{id}"
    description: "Reads one access grant."
    roles: [Dispatcher, PlatformAdmin, Vendor, Auditor, FieldTech]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []
    gates: [G1, G2, G3]
  - method: POST
    path: "/property-care/access-grants/{id}/activate"
    description: "Activates a pending grant inside its window and under the key's aggregate concurrency capacity."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["increments KeyAsset.active_grant_count by 1"]
    gates: [G1, G2, G3, G5, G8]
  - method: POST
    path: "/property-care/access-grants/{id}/revoke"
    description: "Revokes an active grant, or expires it once the window has elapsed."
    roles: [Dispatcher, PlatformAdmin]
    code: 200
    input: [revoke_reason]
    output: AccessGrant
    side_effects: ["status REVOKED for reason OPERATOR, EXPIRED for reason WINDOW_ELAPSED", "decrements KeyAsset.active_grant_count by 1"]
    gates: [G1, G2, G3, G5, G10]

