            - "GET /releases/${rel_id}/evidence-packets returns total_count == 0 immediately after the refusal"
            - "${rel_v_now} is strictly greater than ${rel_v0}"
            - "The retry returns HTTP 201 with ComplianceEvidencePacket.${pkt_id}.state == DRAFT"
            - "ComplianceEvidencePacket.${pkt_id}.base_index == 75 and completeness_index == 75"
            - "ComplianceEvidencePacket.${pkt_id}.waiver_count == 0"

      - name: feature_flag_version_increments_on_every_mutating_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.FeatureFlag
          - state_machines.FeatureFlag.ACTIVE_ROLLING_OUT_to_PAUSED
          - state_machines.FeatureFlag.PAUSED_to_ACTIVE_ROLLING_OUT
        distinguishing_aspect: "version starts at 1 on creation and advances by exactly one on each subsequent mutating write, so the versions observed after start-soak, pause and resume are V, V+1 and V+2 with no gaps and no bump from the read-only GET in between."
