            - "The sum of amount_cents over GET /lending/reserve-entries?contract_id=${k_inv} equals 0"
            - "RetailContract.${k_inv}.reserve_status == 'CHARGED_BACK' and funding_status == 'PAID_OFF'"

      - name: fund_then_buyback_settlement_conserves_portfolio_exposure
        grounds:
          - calculations.buyback_settlement_amount
          - entities.Dealer.fields.outstanding_principal_cents
          - entities.Dealer.fields.funded_contract_count
          - entities.RetailContract.fields.unpaid_principal_cents
          - state_machines.BuybackDemand.ACKNOWLEDGED_to_SETTLED
          - state_machines.RetailContract.FUNDED_to_REPURCHASED
        distinguishing_aspect: |
          Conserved quantity 2 is portfolio exposure - a principal-and-count pair, not a
          cash ledger: with two contracts funded (outstanding 3801000, count 2), settling
          the repurchase of the 2801000 contract at months_seasoned 0 must return
          outstanding_principal_cents to 1000000 and funded_contract_count to 1, exactly
          the values that held before that contract was funded.
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01."
            - "Contract C2 funded first: amount_financed_cents 1000000, so outstanding_principal_cents is 1000000 and funded_contract_count is 1."
            - "Contract C1 funded second: amount_financed_cents 2801000, taking outstanding_principal_cents to 3801000 and funded_contract_count to 2; reserve_balance_cents is 218558."
          setup_api_calls:
