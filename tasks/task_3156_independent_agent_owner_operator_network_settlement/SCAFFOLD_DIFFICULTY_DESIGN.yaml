          trigger:
            - call: "POST /network/trips/${trip_id}/verify-pod"
              payload: { pod_verified: true }
              as: SettlementOperator
            - call: "POST /network/loads/${load_id}/settlement"
              payload: { settlement_method: "FINAL" }
              as: SettlementOperator
          assert:
            - "agent_share_cents == 23040 and owner_operator_share_cents == 144432"
            - "company_share_cents == 56928, computed as 224400 - 23040 - 144432 rather than by its own rounding expression"
            - "settled_total_cents == 224400"
            - "settled_total_cents == linehaul_revenue_allocated_cents + fuel_surcharge_allocated_cents + accessorial_allocated_cents"
            - "commissionable_base_cents == 192000, i.e. linehaul + accessorial only — the 32400 fuel surcharge is excluded"
            - "settled_total_cents != 224399 and != 224401"

      - name: per_load_fee_interval_boundary_and_empty_month
        grounds:
          - calculations.per_load_settlement_fee_tier
          - calculations.per_load_settlement_fee_tier.variants.marginal
          - calculations.per_load_settlement_fee_tier.variants.cumulative_bracket
          - endpoints.POST_/network/agents/{id}/per-load-settlement-tier
          - endpoints.POST_/_events/run_period_close
        distinguishing_aspect: "This is mode (b): the half-open calendar month window [month_start, month_start+1month) is evaluated at its exact lower and upper instants in one run, so the 61st load's arrival in October must move the count while a load stamped exactly at the October boundary must not."
        test_recipe:
          setup:
            - "Logical clock set to just after midnight on 2026-10-01T00:00:00Z. One ACTIVE agent with a TX/OK territory; 61 loads created inside the September window plus 1 load stamped at exactly the October boundary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-TX-31", legal_name: "Pecos Linehaul Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {}
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-PECOS-31", shipper_name: "Pecos Pipe and Supply", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /network/agents/${agent_id}/per-load-settlement-tier"
              payload: { settlement_method: "marginal" }
              as: SettlementOperator
            - call: "POST /_events/run_period_close"
              payload: { agent_id: "${agent_id}", period_month: "2026-09" }
              as: NetworkAdministrator
          assert:
            - "with zero eligible loads in September the tier_load_count is 0 and per_load_fee_cents == 5000 — an empty month still bills the base fee rather than 0"
            - "after 50 loads land in September the band is still tier 1, so per_load_fee_cents == 5000"
            - "after the 51st September load lands the band moves to tier 2, so per_load_fee_cents == 4500"
            - "at exactly 50 eligible loads the count still reads tier 1 — the boundary is inclusive at the band maximum"
            - "at 60 eligible loads marginal_fee_cents == 270000 while cumulative_fee_cents == 295000, the distinct aggregate-vs-marginal boundary"
            - "a load whose created_at is exactly 2026-10-01T00:00:00Z is excluded from the September window because the interval is half-open at the upper end"
