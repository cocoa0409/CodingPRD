              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Hyacinth Oyelaran RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { facilitator_rn: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-SABL-6601", parity: 2, gestational_age_weeks: 41 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
