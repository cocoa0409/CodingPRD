            - "the first three approvals froze 1000 bps each (capped from 1050): consumed == 3000"
            - "the fourth approval returns 422 with error_id == ERR_CORE_IDENTITY_DILUTION (identity would drop to 6000 < 7000)"
            - "error_id != ERR_EQUITY_BUDGET_EXCEEDED (4000 <= 10000 budget)"
            - "ProductLine.${e4}.status remains FORMULATION"

      - name: grant_action_after_expiry_returns_grant_expired
        claim_type: violation_to_error
        grounds:
          - errors.ERR_GRANT_EXPIRED
          - state_machines.ConfidentialityGrant
        distinguishing_aspect: "A REQUESTED grant is not swept at expiry, but the grant action itself checks the clock: at or past expires_on it fails 409 ERR_GRANT_EXPIRED."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand, line, SEALED formulation; mfr1 QUALIFIED; grant created with expires_on 2026-10-01T00:00:00Z (still REQUESTED)."
          setup_api_calls:
            - *k_brand
            - *k_mfr1
            - *k_mfr1q
            - *k_line_core
            - *k_form
            - *k_seal
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C1"], expires_on: "2026-10-01T00:00:00Z", grant_reason: "PILOT_SUPPLY" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brand-ops/confidentiality-grants/${g_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the grant survived the sweep as REQUESTED (only GRANTED or ACTIVE grants expire)"
            - "the grant action at 2026-10-02 returns 409 with error_id == ERR_GRANT_EXPIRED"

      - name: renew_on_expired_registration_returns_registration_expired
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REGISTRATION_EXPIRED
          - state_machines.MarketRegistration
        distinguishing_aspect: "Once the clock sweeps a registration past its expires_on it is EXPIRED and renew fails 409 ERR_REGISTRATION_EXPIRED — distinct from renewing too early."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand with PILOT core line; market DE; registration ACTIVE with expires_on 2027-01-01T00:00:00Z."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/markets"
              payload: { country_code: "DE", name: "Germany", registration_required: true, voc_regime: "STANDARD", allowed_channels: ["HARDWARE"] }
              as: RegulatoryAffairs
              captures: { market_de_id: $.data.id }
            - call: "POST /brand-ops/market-registrations"
              payload: { market_id: "${market_de_id}", product_line_id: "${line_id}", formulation_id: "${form_id}", expires_on: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { reg_id: $.data.id }
            - call: "POST /brand-ops/market-registrations/${reg_id}/submit"
              payload: {}
              as: RegulatoryAffairs
            - call: "POST /brand-ops/market-registrations/${reg_id}/approve"
              payload: { registration_number: "REG-DE-1001" }
              as: RegulatoryAffairs
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brand-ops/market-registrations/${reg_id}/renew"
              payload: { new_expires_on: "2028-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { error_id: $.data.error_id }
          assert:
            - "the clock jump swept the registration straight to EXPIRED"
            - "renew returns 409 with error_id == ERR_REGISTRATION_EXPIRED (not ERR_RENEWAL_WINDOW_NOT_OPEN)"

      - name: renew_requires_strictly_later_expiry
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WINDOW_INVALID
          - state_machines.MarketRegistration.RENEWAL_DUE_to_ACTIVE
        distinguishing_aspect: "Renewal must move expiry forward: inside the renewal window, a new_expires_on not after the current one fails 422 ERR_WINDOW_INVALID."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand with PILOT core line; market DE; registration ACTIVE with expires_on 2027-01-01T00:00:00Z; clock advanced into the renewal window (2026-10-03T00:00:00Z) so the registration is RENEWAL_DUE."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/markets"
              payload: { country_code: "DE", name: "Germany", registration_required: true, voc_regime: "STANDARD", allowed_channels: ["HARDWARE"] }
              as: RegulatoryAffairs
              captures: { market_de_id: $.data.id }
            - call: "POST /brand-ops/market-registrations"
              payload: { market_id: "${market_de_id}", product_line_id: "${line_id}", formulation_id: "${form_id}", expires_on: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { reg_id: $.data.id }
            - call: "POST /brand-ops/market-registrations/${reg_id}/submit"
              payload: {}
              as: RegulatoryAffairs
            - call: "POST /brand-ops/market-registrations/${reg_id}/approve"
              payload: { registration_number: "REG-DE-1001" }
              as: RegulatoryAffairs
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brand-ops/market-registrations/${reg_id}/renew"
              payload: { new_expires_on: "2026-12-01T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { error_id: $.data.error_id }
          assert:
            - "renew with new_expires_on 2026-12-01 (before the current 2027-01-01): 422 ERR_WINDOW_INVALID"
            - "the registration remains RENEWAL_DUE with expires_on unchanged"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_proposal_supersedes_proposed_assignment_on_same_cell
        claim_type: valid_transition
        grounds:
