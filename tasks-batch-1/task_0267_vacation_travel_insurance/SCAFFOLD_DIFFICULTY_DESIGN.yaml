# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# vacation-travel-insurance (Expert)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# (§0.5). 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_provisional_vs_final_diverges_on_supplier_refund
        grounds:
          - calculations.cancellation_reimbursement
          - entities.Claim.fields.provisional_amount_cents
          - entities.Claim.fields.approved_amount_cents
          - state_machines.Claim.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          On the Claim domain, the provisional figure (documented/prepaid basis at
          submission) is 350000 while the final figure (net of supplier_refund_received_cents
          at approval) is 300000 — same expense lines, two algorithms, a 50000 delta.
        test_recipe:
          setup:
            - "STANDARD plan: base_rate_bps=600, cancellation_limit_pct=100, medical_limit_cents=500000, delay_limit_cents=100000, baggage_limit_cents=100000, free_look_days=10, claim_filing_window_days=90, waiver_window_days=14."
            - "Traveler owns a policy, trip_cost_cents=500000, one COVERED insured (covered_trip_cost_cents=500000), premium paid, policy ISSUED/ACTIVE at clock 2026-06-01."
            - "CANCELLATION claim (reason COVERED_REASON) with two PREPAID_TRIP expenses: (documented 210000, prepaid 200000, refund 0) and (documented 160000, prepaid 150000, refund 50000); one document uploaded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "STD-1", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t1@x.com", full_name: "T One", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v_after_insured: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "CANCELLATION", cancellation_reason: "COVERED_REASON", incident_at: "2026-06-01T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id, provisional_at_submit: $.data.provisional_amount_cents }
            - call: "POST /claims/${claim_id}/expenses"
              payload: { category: "PREPAID_TRIP", description: "flights", documented_amount_cents: 210000, prepaid_nonrefundable_cents: 200000, supplier_refund_received_cents: 0 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/expenses"
              payload: { category: "PREPAID_TRIP", description: "hotel", documented_amount_cents: 160000, prepaid_nonrefundable_cents: 150000, supplier_refund_received_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { provisional_after_lines: $.data.id }
            - call: "POST /claims/${claim_id}/documents"
              payload: { doc_type: "RECEIPT", file_ref: "r1" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { final_amt: $.data.approved_amount_cents }
          assert:
            - "Claim.${claim_id}.provisional_amount_cents == 350000"
            - "Claim.${claim_id}.approved_amount_cents == 300000"
            - "Claim.${claim_id}.provisional_amount_cents - Claim.${claim_id}.approved_amount_cents == 50000"

      - name: premium_refund_free_look_full_vs_short_rate_prorated
        grounds:
          - calculations.premium_refund
          - entities.Refund.fields.amount_cents
          - entities.Refund.fields.refund_type
          - state_machines.Policy.coverage:ACTIVE_to_coverage:CANCELLED
        distinguishing_aspect: |
          On the Policy/Refund domain, the free-look variant returns the full premium
          57000, while the short-rate variant on an identically-priced policy returns
          31700 (pro-rated 18/30 days minus 2500 admin fee) — same premium, two refund
          algorithms, divergent amounts.
        test_recipe:
          setup:
            - "Same STANDARD plan; ISSUED policy on premium 57000 (senior age 76 + CFAR loadings)."
            - "Issued 2026-06-01; coverage_period_days = ceil((trip_end 2026-07-01 - issued)/1day) = 30; cancelled after free-look (ends 2026-06-11) at clock 2026-06-13 -> elapsed 12 days; short-rate = max(0, floor(57000*(30-12)/30) - 2500) = 31700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "STD-2", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t2@x.com", full_name: "T Two", date_of_birth: "1950-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-06-25T00:00:00Z", trip_end_at: "2026-07-01T00:00:00Z", cfar_opted: true }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { polB_id: $.data.id }
            - call: "POST /policies/${polB_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 76, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { polB_v: $.data.version }
            - call: "GET /policies/${polB_id}"
              as: Any
              captures: { polB_id_polver: $.data.version }
            - call: "POST /policies/${polB_id}/record-payment"
              payload: { expected_policy_version: "${polB_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${polB_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "POST /policies/${polB_id}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { polB_after: $.data.id }
          assert:
            - "After cancel, exactly one Refund exists for policy ${polB_id} with refund_type == SHORT_RATE"
            - "That Refund.amount_cents == 31700"
            - "Policy.${polB_id}.premium_cents == 57000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: premium_quote_tiered_rate_plus_senior_plus_cfar_loadings
        grounds:
          - calculations.premium_quote
          - entities.Policy.fields.premium_cents
          - entities.Policy.fields.base_premium_cents
          - entities.InsuredTraveler.fields.age_at_departure
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — tiered base rate selection
          (600 bps STANDARD), conditional senior loading (any insured age>=70 -> +50%
          of base), and conditional CFAR loading (+40% of base) — yields premium 57000
          from base 30000 + 15000 + 12000.
        test_recipe:
          setup:
            - "STANDARD plan with senior_loading_bps=5000, cfar_loading_bps=4000."
            - "QUOTED policy trip_cost_cents=500000, cfar_opted=true, one insured age_at_departure=72."
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "STD-3", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t3@x.com", full_name: "T Three", date_of_birth: "1953-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z", cfar_opted: true }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id, base_at_quote: $.data.base_premium_cents }
          trigger:
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 72, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id }
          assert:
            - "Policy.${pol_id}.base_premium_cents == 30000"
            - "Policy.${pol_id}.premium_cents == 57000"

      - name: baggage_reimbursement_round_per_item_before_sum
        grounds:
          - calculations.baggage_reimbursement
          - entities.ClaimExpense.fields.item_value_cents
          - entities.Plan.fields.baggage_depreciation_bps
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With baggage_depreciation_bps=2500
          and two BAGGAGE_ITEM lines each item_value_cents=1250, per-item round_half_up
          (938 each) then sum = 1876, whereas sum-then-round = 1875. The scaffold pins
          round-per-item-then-sum, so approved_amount_cents == 1876.
        test_recipe:
          setup:
            - "Plan with baggage_depreciation_bps=2500, baggage_item_sublimit_cents=30000, baggage_limit_cents=100000."
            - "ISSUED/ACTIVE policy; BAGGAGE claim with two BAGGAGE_ITEM expenses item_value_cents=1250 each; one document; under review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "BAG-1", tier: "PREMIER", base_rate_bps: 800, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2500, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t4@x.com", full_name: "T Four", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "BAGGAGE", incident_at: "2026-06-05T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/expenses"
              payload: { category: "BAGGAGE_ITEM", description: "camera", documented_amount_cents: 1250, item_value_cents: 1250 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/expenses"
              payload: { category: "BAGGAGE_ITEM", description: "watch", documented_amount_cents: 1250, item_value_cents: 1250 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/documents"
              payload: { doc_type: "POLICE_REPORT", file_ref: "pr1" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { amt: $.data.approved_amount_cents }
          assert:
            - "Claim.${claim_id}.approved_amount_cents == 1876"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_cycle_under_review_info_requested_under_review
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Claim.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Claim entity: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW,
          and the loop can repeat — the same start-review/request-info/resubmit cycle
          returns the claim to UNDER_REVIEW twice with no terminal lock-in.
        test_recipe:
          setup:
            - "ISSUED/ACTIVE policy; MEDICAL claim with one document; claim under review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /plans"
              payload: { code: "CYC-1", tier: "STANDARD", base_rate_bps: 600, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t5@x.com", full_name: "T Five", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { ins_id: $.data.id, pol_v: $.data.version }
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", insured_traveler_id: "${ins_id}", peril: "MEDICAL", incident_at: "2026-06-05T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/documents"
              payload: { doc_type: "MEDICAL_REPORT", file_ref: "m1" }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/request-info"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/resubmit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /claims/${claim_id}/request-info"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/resubmit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW after the second resubmit"
            - "Claim.${claim_id}.version increased by 4 across the two request-info / resubmit pairs"

      - name: policy_parallel_payment_and_coverage_axes_evolve_independently
        grounds:
          - state_machines.Policy.payment:PENDING_to_payment:PAID
          - state_machines.Policy.coverage:QUOTED_to_coverage:ACTIVE
          - entities.Policy.fields.payment_status
          - entities.Policy.fields.coverage_status
        distinguishing_aspect: |
          Parallel dimensions on the Policy entity: record-payment advances payment_status
          PENDING->PAID while coverage_status stays QUOTED; a later issue advances
          coverage_status QUOTED->ACTIVE while payment_status stays PAID — the two axes
          move on separate calls.
        test_recipe:
          setup:
            - "QUOTED/PENDING policy with one COVERED insured covering full trip cost."
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "PAR-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t6@x.com", full_name: "T Six", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { pol_v: $.data.version }
          trigger:
            - call: "GET /policies/${pol_id}"
              as: Any
              captures: { pol_id_polver: $.data.version }
            - call: "POST /policies/${pol_id}/record-payment"
              payload: { expected_policy_version: "${pol_id_polver}" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { cov_after_pay: $.data.coverage_status, pay_after_pay: $.data.payment_status }
            - call: "POST /policies/${pol_id}/issue"
              payload: {}
              as: Underwriter
              captures: { cov_after_issue: $.data.coverage_status, pay_after_issue: $.data.payment_status }
          assert:
            - "After record-payment: Policy.${pol_id}.payment_status == PAID AND coverage_status == QUOTED"
            - "After issue: Policy.${pol_id}.coverage_status == ACTIVE AND payment_status == PAID"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payout_disburse_cascades_ledger_then_exhausted_then_sibling_denial
        grounds:
          - state_machines.Payout.PENDING_to_DISBURSED
          - state_machines.Policy.coverage:ACTIVE_to_coverage:EXHAUSTED
          - state_machines.Claim.SUBMITTED_to_DENIED
          - entities.Policy.fields.amount_reimbursed_cents
          - entities.Policy.fields.coverage_status
        distinguishing_aspect: |
          Depth-4 chain from one disburse action: (L1) Payout->DISBURSED -> (L2)
          Policy.amount_reimbursed_cents rises so remaining_aggregate_cents reaches 0 ->
          (L3) Policy.coverage_status->EXHAUSTED -> (L4) every open sibling Claim is
          auto-DENIED with denial_reason=AGGREGATE_EXHAUSTED. Each link is caused by the
