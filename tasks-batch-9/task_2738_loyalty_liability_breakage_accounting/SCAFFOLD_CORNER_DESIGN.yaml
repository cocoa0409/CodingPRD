            - "The 30000 request SUCCEEDS: PointLot.${lot_ok_id}.tier_points == 100 (BASE 10000) and points_issued == 300 (round_half_up(100 * 30000 / 10000))"
            - "PointLot.${lot_ok_id}.points_issued 300 is still under per_issuance_point_cap 5000, so the cap gate at priority 90 does not fire"
