      - name: service_fee_waiver_threshold_evaluated_pre_fee_not_on_total
        grounds:
          - calculations.out_of_market_service_fee
          - calculations.contract_line_price
          - entities.OrderLine.fields.service_fee_cents
          - entities.OrderLine.fields.invoice_total_cents
          - entities.DcCoverage.fields.coverage_type
          - entities.DistributionCenter.fields.out_of_market_fee_per_case_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency where the evaluation order is what
          makes the value well-defined. invoice_total = extended + fee, yet the fee
          waiver threshold is nominally about what the operator pays; the scaffold
          pins the test to the pre-fee extended value, so a 99-case line at extended
          495000 pays a 27225 fee and totals 522225 — whereas testing the threshold
          against the resulting 522225 total would have waived the fee and totalled
          495000. Different mode from the rounding-order instance above.
        test_recipe:
          setup:
            - "One operator, one manufacturer, one DC DC-PHX with out_of_market_fee_per_case_cents 275."
            - "Product P-BOUND (PROTEIN) with avg_cost_cents 4850 so an AVG_COST DOLLARS_PER_CASE 150 tier prices it at exactly 5000 per case."
