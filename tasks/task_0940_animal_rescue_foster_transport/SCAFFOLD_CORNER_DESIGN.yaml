      - name: medical_funding_insufficient_pool_rejects_completion
        claim_type: Violation to Error
        grounds:
          - validations[priority=45]
          - errors[ERR_INSUFFICIENT_RESTRICTED_FUNDS]
          - calculations.medical_cost_funding_allocation
        distinguishing_aspect: "A funded 10000-cent medical record against a 5000-cent eligible pool returns ERR_INSUFFICIENT_RESTRICTED_FUNDS with HTTP 409, the record stays ORDERED and the contribution's applied_cents stays 0 — the draw is all-or-nothing."
        test_recipe:
          setup: ["One MEDICAL contribution of 5000 cents and one ORDERED 10000-cent MEDICAL record with funding_required true."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
