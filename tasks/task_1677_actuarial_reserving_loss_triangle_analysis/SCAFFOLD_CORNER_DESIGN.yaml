        claim_type: conditional_action
        grounds:
          - errors[ERR_NO_APPROVED_PRIOR_STUDY]
          - calculations.rollforward_actual_vs_expected
        distinguishing_aspect: "The roll-forward is anchored on the prior quarter's APPROVED study; with no approved study for 2025-Q1, rolling into 2025-Q2 fails before any emergence math."
        test_recipe:
          setup: ["Segment with claims and transactions but no study at all"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "RF Book", line_of_business: "WORKERS_COMP", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "E-1", accident_date: "2025-01-15", report_date: "2025-01-18" }
              as: ClaimsExaminer
              captures: { cl_e: $.data.id }
            - call: "POST /actuarial/claims/${cl_e}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /actuarial/roll-forwards"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q2" }
              as: ActuarialAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_APPROVED_PRIOR_STUDY and HTTP status 409"
      - name: studies_filtered_list_by_opinion_id
        claim_type: fk_reverse_reachability
        grounds:
          - entities.ReservingStudy.fields.opinion_id
          - endpoints GET /actuarial/studies
        distinguishing_aspect: "The study -> opinion FK is traversable backwards: after attach, GET /actuarial/studies?opinion_id=... returns exactly the attached study, which is the only discovery channel from opinion to studies."
        test_recipe:
          setup: ["Minimal Book through APPROVED study; DRAFT opinion; study attached"]
          setup_api_calls:
            - call: "POST /actuarial/segments"
              payload: { name: "Minimal Book", line_of_business: "WORKERS_COMP", large_loss_threshold_cents: 400000, max_range_width_pct: 0.5, benchmark_open_severity_cents: 50000 }
              as: AppointedActuary
              captures: { seg: $.data.id }
            - call: "POST /actuarial/claims"
              payload: { segment_id: "${seg}", claim_number: "E-1", accident_date: "2025-01-15", report_date: "2025-01-18" }
              as: ClaimsExaminer
              captures: { cl_e: $.data.id }
            - call: "POST /actuarial/claims/${cl_e}/transactions"
              payload: { type: "PAYMENT", transaction_date: "2025-02-01T00:00:00Z", amount_cents: 100000 }
              as: ClaimsExaminer
            - call: "POST /actuarial/triangles"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q1" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/development-patterns"
              payload: { segment_id: "${seg}", basis: "PAID", valuation_quarter: "2025-Q1", effective_from_quarter: "2025-Q1", effective_to_quarter: "2025-Q3" }
              as: ActuarialAnalyst
              captures: { pat: $.data.id }
            - call: "POST /actuarial/development-patterns/${pat}/select"
              as: ActuarialAnalyst
            - call: "POST /actuarial/reserve-runs"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", method: "CHAIN_LADDER", basis: "PAID" }
              as: ActuarialAnalyst
            - call: "POST /actuarial/studies"
              payload: { segment_id: "${seg}", valuation_quarter: "2025-Q1", selected_method: "CHAIN_LADDER", selected_basis: "PAID" }
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.id }
            - call: "POST /actuarial/studies/${st}/submit"
              as: ActuarialAnalyst
              as_user_id: "analyst-1"
            - call: "POST /actuarial/studies/${st}/review"
              payload: { decision: "APPROVE" }
              as: PeerReviewer
              as_user_id: "reviewer-1"
            - call: "POST /actuarial/opinions"
              payload: { statement_date: "2025-03-31", opinion_scope: "REASONABLE" }
              as: AppointedActuary
              as_user_id: "aa-1"
              captures: { op: $.data.id }
            - call: "POST /actuarial/opinions/${op}/attach-study"
              payload: { study_id: "${st}" }
              as: AppointedActuary
              as_user_id: "aa-1"
          trigger:
            - call: "GET /actuarial/studies"
              payload: { opinion_id: "${op}" }
              as: AppointedActuary
              captures: { found_id: "$.data[0].id" }
          assert:
            - "Exactly one study returned and found_id == ${st}"
  # ===========================================================================
  # From Table 6 (Errors) — every catalog error is triggered somewhere:
  # validations/entities/rbac instances above cover all but the five errors
  # already triggered inside §1.8 instances, which are stubbed here.
