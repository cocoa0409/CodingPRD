            - "SiteAccessBooking.${b2_id}.status == BOOKED and crew_count == 1 and purpose == TITLE_SURVEY"
            - "GET /land-origination/site-access-bookings with parcel_id ${p_id} returns meta.total_count == 2"
            - "Either role can cancel either booking: cancelling ${b1_id} as TitleCounsel returns 200 with status CANCELLED"

      - name: same_title_counsel_user_cannot_clear_the_item_they_raised
        claim_type: segregation_of_duties
        grounds:
          - roles.TitleCounsel.description
          - validations[priority 25]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.TitleCurativeItem.fields.created_by_user_id
        distinguishing_aspect: "Both users carry the same TitleCounsel role, so role-based authorisation passes and the refusal has to come from comparing X-User-ID against created_by_user_id — and the same item must then clear cleanly for tc-user-02, proving the check is on identity rather than on the item."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451."
            - "One MATERIAL curative item raised by tc-user-01 (no predecessor, so it starts OPEN)."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
            - call: "POST /land-origination/title-curative-items"
              payload: { parcel_id: "${p_id}", item_type: "TAX_LIEN", severity: "MATERIAL", curative_cost_cents: 90000 }
