    instances:
      - name: permit_approval_gated_by_completed_fair_wide_inspection
        grounds:
          - state_machines.Permit.PENDING_to_APPROVED
          - errors[ERR_INSPECTION_REQUIRED]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Permit -> InspectionAppointment: a permit cannot be approved
          while the fair's FAIR_WIDE appointment is still SCHEDULED — approval is
          gated on a DIFFERENT entity reaching COMPLETED_PASS with completed_at >=
          permit.created_at, not on any field of the permit itself.
        test_recipe:
          setup:
            - "Fair with one SETUP_VERIFIED ride; permit PENDING; FAIR_WIDE appointment on 2026-08-02 exists but is still SCHEDULED (clock at 2026-08-02, not yet completed)"
