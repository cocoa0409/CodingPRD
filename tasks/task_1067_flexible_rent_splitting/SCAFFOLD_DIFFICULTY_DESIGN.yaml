              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_SOD_VIOLATION (priority 8, not ERR_RECOVERY_PERIOD_NOT_ELAPSED priority 14)"

  # =================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_grace_days_ge_boundary
        grounds:
          - calculations.late_fee_accrual
          - entities.DelinquencyCase.fields.accrued_late_fee_cents
          - state_machines.BillingCycle.REMITTED_to_DELINQUENT
        distinguishing_aspect: |
          Metric = days_overdue on the assess-delinquency endpoint. Installment1 due 2026-07-01;
          clock at 2026-07-06 is exactly 5 days overdue, so days_overdue >= GRACE_DAYS(5) holds and
          the flat late fee 2500 IS applied. At 2026-07-05 (4 days) it would be 0 — the '>=' vs '>'
          boundary. Distinct metric/endpoint from the settle zero-outstanding boundary.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle remitted; nothing paid; installment1 due 2026-07-01."
            - "Clock advanced to 2026-07-06 (exactly 5 days after due)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #11", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_11", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r11@x.com", full_name: "Rey Eleven", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/assess-delinquency"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /api/delinquency-cases?cycle_id=${cyc_id} returns one case with accrued_late_fee_cents == 2500"
            - "BillingCycle.${cyc_id}.status == DELINQUENT"

      - name: settle_zero_outstanding_boundary
        grounds:
          - state_machines.BillingCycle.REMITTED_to_SETTLED
          - validations[priority=19]
          - entities.BillingCycle.fields.outstanding_cents
        distinguishing_aspect: |
          Metric = outstanding_cents on the settle endpoint. Paying both installments brings
          outstanding to exactly 0, so the '<= 0' gate is satisfied and settle succeeds. With one
          installment unpaid (outstanding 50000 > 0) settle returns ERR_INSUFFICIENT_REPAYMENT.
          Distinct metric (money remaining) and endpoint from the days-overdue boundary.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle remitted; BOTH installments paid; outstanding_cents == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #12", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_12", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r12@x.com", full_name: "Rey Twelve", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id", inst2: "$.data[1].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
            - call: "POST /api/installments/${inst2}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BillingCycle.${cyc_id}.status == SETTLED"
            - "BillingCycle.${cyc_id}.outstanding_cents == 0"
            - "BillingCycle.${cyc_id}.repaid_amount_cents == 100000"

  # =================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_create_requires_renter_enrolled
        grounds:
          - validations[priority=9]
          - entities.Renter.fields.status
          - errors[ERR_RENTER_NOT_ENROLLED]
        distinguishing_aspect: |
          BillingCycle creation is gated on the OTHER entity's state: a PROSPECT renter (no approved
          application) cannot have a cycle created -> ERR_RENTER_NOT_ENROLLED. Entity pair
          BillingCycle -> Renter, distinct from the Remittance -> Property pair.
        test_recipe:
          setup:
            - "Property ACTIVE; Renter created as PROSPECT (no application submitted/approved)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #13", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_13", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r13@x.com", full_name: "Rey Thirteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_RENTER_NOT_ENROLLED"

      - name: remit_requires_property_active
        grounds:
          - validations[priority=10]
          - entities.Property.fields.integration_status
          - errors[ERR_PROPERTY_NOT_ACTIVE]
          - state_machines.BillingCycle.SCHEDULED_to_REMITTED
        distinguishing_aspect: |
          Remit is gated on the OTHER entity's state: with Property.integration_status == PENDING the
          remit transition is rejected -> ERR_PROPERTY_NOT_ACTIVE, even though the cycle itself is a
          valid SCHEDULED cycle. Entity pair Remittance -> Property, distinct from BillingCycle -> Renter.
        test_recipe:
          setup:
            - "Property with integration_status PENDING; Renter ENROLLED on it (approval is independent of property status); SPLIT n=2 cycle created (SCHEDULED)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #14", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_14", integration_status: "PENDING" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r14@x.com", full_name: "Rey Fourteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PROPERTY_NOT_ACTIVE"

  # =================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_cycle_month_bucket
        grounds:
          - validations[priority=17]
          - entities.BillingCycle.fields.cycle_month
          - errors[ERR_DUPLICATE_CYCLE]
        distinguishing_aspect: |
          Interval semantics = calendar-month bucket EQUALITY: a second non-CANCELLED BillingCycle for
          the same (renter, 2026-07) bucket collides -> ERR_DUPLICATE_CYCLE. Resource BillingCycle;
          distinct arithmetic from the installment point-date buffer overlap.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; one SPLIT n=2 cycle already created for 2026-07."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #15", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_15", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r15@x.com", full_name: "Rey Fifteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 3 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DUPLICATE_CYCLE"

      - name: installment_gap_buffer_reschedule
        grounds:
          - validations[priority=16]
          - entities.Installment.fields.due_date
          - errors[ERR_INSTALLMENT_GAP_TOO_SHORT]
          - concurrency_rules[reschedule-stale-cycle]
        distinguishing_aspect: |
          Interval semantics = point-date ADJACENCY with a minimum buffer: reschedule due offsets
          [0,3] put two installment due dates only 3 days apart, below MIN_INSTALLMENT_GAP_DAYS(5) ->
          ERR_INSTALLMENT_GAP_TOO_SHORT. Resource Installment; distinct from month-bucket equality.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle created (version 1)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #16", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_16", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r16@x.com", full_name: "Rey Sixteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/reschedule"
              payload: { expected_cycle_version: "${cyc_v}", mode: "SPLIT", split_count: 2, due_offsets_days: [0, 3] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INSTALLMENT_GAP_TOO_SHORT"

  # =================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: remit_reverse_net_remitted_zero
        grounds:
          - state_machines.BillingCycle.SCHEDULED_to_REMITTED
          - state_machines.BillingCycle.REMITTED_to_SCHEDULED
          - entities.BillingCycle.fields.net_remitted_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity = net_remitted_cents (money advanced to the landlord). remit adds
          REMITTANCE_ADVANCE +120000 (net 120000); the compensating reverse adds REVERSAL -120000,
          restoring net_remitted_cents to exactly 0. Distinct conserved quantity from the scheduled
          repayment obligation.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle remitted (net_remitted 120000, no repayments)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #17", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_17", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r17@x.com", full_name: "Rey Seventeen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /api/remittances/${rem_id}/reverse"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BillingCycle.${cyc_id}.net_remitted_cents == 0"
            - "BillingCycle.${cyc_id}.status == SCHEDULED"
            - "Remittance.${rem_id}.status == REVERSED"

      - name: reschedule_pair_scheduled_obligation_conserved
        grounds:
          - state_machines.BillingCycle.SCHEDULED_to_REMITTED
          - entities.Installment.fields.amount_cents
          - entities.BillingCycle.fields.portion_cents
          - concurrency_rules[reschedule-stale-cycle]
        distinguishing_aspect: |
          Conserved quantity = total scheduled repayment obligation = sum(non-CANCELLED
          Installment.amount_cents) = portion_cents (100000). Reschedule 2->4 (forward) then 4->2
          (compensating) each keep the sum at exactly 100000. Distinct conserved quantity from
          net_remitted money.
        test_recipe:
          setup:
            - "Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle (version 1, installments sum 100000)."
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Maple #18", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_18", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "r18@x.com", full_name: "Rey Eighteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/reschedule"
              payload: { expected_cycle_version: "${cyc_v}", mode: "SPLIT", split_count: 4 }
              as: PlatformAdmin
              captures: { cyc_v2: $.data.version }
            - call: "POST /api/billing-cycles/${cyc_id}/reschedule"
              payload: { expected_cycle_version: "${cyc_v2}", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_v3: $.data.version }
          assert:
            - "sum over GET /api/billing-cycles/${cyc_id}/installments of amount_cents where status != CANCELLED == 100000"
            - "BillingCycle.${cyc_id}.portion_cents == 100000"
            - "BillingCycle.${cyc_id}.version == 3"
