scenario: |
  2839. Medical Device Vendor Credentialing & OR Access (hospital vendor credentialing program):
  vendor representative registration with immunization, training and background attestations,
  credential expiration monitoring with automatic access suspension, check-in kiosk badging tied
  to a scheduled case and department escort rules, product introduction request and value analysis
  approval before a rep may bring an implant, loaner instrument delivery deadlines relative to
  sterile processing turnaround, conflict-of-interest and gift policy attestation, incident
  reporting for unapproved product use, vendor scorecard and access revocation appeals

domain_name: medical-device-vendor-credentialing-or-access
api_prefix: "/vendor-access"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: SurgicalCase <-> VendorRep is a true many-to-many resolved by the
  # CaseRepAuthorization junction; ProductIntroductionRequest carries a
  # self-referential supersession edge; LoanerSet and Incident both fan across
  # aggregate boundaries (SurgicalCase x ApprovedProduct, VendorRep x
  # ApprovedProduct). There is no single ownership tree.

  state_machine_shape: cyclic
  # VendorRep.access_status cycles CREDENTIALED -> SUSPENDED -> CREDENTIALED and
  # REVOKED -> CREDENTIALED (appeal overturned). ProductIntroductionRequest
  # cycles CLINICAL_REVIEW -> CHANGES_REQUESTED -> CLINICAL_REVIEW with a pinned
  # revision-round termination condition. KioskCheckIn carries two independent
  # state dimensions (badge_status x escort_status). LoanerSet is a fork-join
  # diamond with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Vendor -> VendorRep, VendorRep -> Credential
    - many_to_many         # SurgicalCase <-> VendorRep via CaseRepAuthorization
    - self_referential     # ProductIntroductionRequest.supersedes_request_id
    - cross_aggregate      # LoanerSet spans SurgicalCase and ApprovedProduct

  role_model: segregation_of_duties
  # The value-analysis approver may not be the clinical sponsor of the same
  # request; the incident adjudicator may not be its reporter; the appeal
  # decider may not be the officer who revoked the rep. All three are enforced
  # on X-User-ID equality, not on role names.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00Z"
  REQUIRED_CREDENTIAL_TYPES:
    - IMMUNIZATION_INFLUENZA
    - TRAINING_BLOODBORNE_PATHOGENS
    - BACKGROUND_CHECK
    - COI_GIFT_ATTESTATION
  EXPIRY_WARNING_DAYS: 14
  COMPLEXITY_HOURS: { SIMPLE: 2, COMPLEX: 6, IMPLANT_SPECIALTY: 10 }
  TRAY_SURCHARGE_HOURS: "tray_count <= 4 -> 0; 5 <= tray_count <= 12 -> 1; tray_count >= 13 -> 2"
  IMPLANT_MIN_LEAD_HOURS: 24
  HARD_REJECT_GRACE_MINUTES: 120
  PER_TRAY_BASE_RATE_CENTS_PER_MINUTE: 2.5
  COMPLEXITY_FEE_MULTIPLIER: { SIMPLE: 1.0, COMPLEX: 1.35, IMPLANT_SPECIALTY: 1.75 }
  LATE_FEE_CAP_CENTS: 250000
  FEE_HOLD_THRESHOLD_CENTS: 100000
  SPD_BAY_BUFFER_MINUTES: 30
  BASE_SCORE: 100
  SCORE_FLOOR: 0
  SCORE_CEILING: 100
  W_INCIDENT_MINOR: 3
  W_INCIDENT_MAJOR: 8
  W_INCIDENT_CRITICAL: 20
  W_LATE_DELIVERY: 5
  W_LAPSED_REP: 6
  W_UTILIZATION_OVERAGE: 12
  BASE_QUOTA: 4
  QUOTA_HARD_MULTIPLIER: 1.5
  TIER_STEP: { TIER_PLATINUM: 1.5, TIER_STANDARD: 1.0, TIER_PROBATION: 0.4 }
  TIER_PLATINUM_MIN_SCORE: 90
  TIER_STANDARD_MIN_SCORE: 70
  COMPLIANCE_STATUS_BANDS: "score < 40 -> BARRED; 40 <= score < 70 -> PROBATION; 70 <= score < 85 -> WATCH; score >= 85 -> IN_GOOD_STANDING"
  APPROVAL_VALIDITY_DAYS: 365
  APPEAL_WINDOW_DAYS: 14
  MAX_REVISION_ROUNDS: 2
  INCIDENT_CLOSE_DAYS: 30

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Hospital facility display name."
      - name: code
        type: string
        source: input
        description: "Short facility code; unique across all Facility rows. Also the badge_serial prefix."
        constraints: "1-16 chars, uppercase letters/digits/hyphen; unique"
      - name: spd_turnaround_hours
        type: integer
        source: input
        description: "Sterile Processing Department base reprocessing turnaround, in hours; a term of the loaner delivery lead formula."
        constraints: ">= 0"
      - name: spd_bay_count
        type: integer
        source: input
        description: "Number of reprocessing bays; the aggregate capacity ceiling for overlapping LoanerSet SPD occupations at this facility."
        constraints: ">= 1"
      - name: badge_lead_minutes
        type: integer
        source: input
        default: 60
        description: "Minutes before SurgicalCase.scheduled_start_utc at which a kiosk badge becomes valid."
        constraints: ">= 0"
      - name: badge_grace_minutes
        type: integer
        source: input
        default: 30
        description: "Minutes after SurgicalCase.scheduled_end_utc at which a kiosk badge stops being valid."
        constraints: ">= 0"
      - name: restricted_escort_required
        type: boolean
        source: input
        default: true
        description: "When true, an approved authorization for a RESTRICTED case must name an escort."

  - name: Vendor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Vendor company legal name."
      - name: vendor_code
        type: string
        source: input
        description: "Short vendor code; unique across all Vendor rows."
        constraints: "unique"
      - name: provisional_compliance_score
        type: integer
        source: computed
        default: 100
        description: "Pessimistic scorecard variant: unadjudicated incidents counted at full weight. See calculations.vendor_compliance_score."
        constraints: "0..100"
      - name: adjudicated_compliance_score
        type: integer
        source: computed
        default: 100
        description: "Conservative scorecard variant: only incidents with adjudicated_outcome == SUBSTANTIATED counted. Drives scorecard_tier."
        constraints: "0..100"
      - name: scorecard_tier
        type: enum
        source: computed
        default: TIER_PLATINUM
        description: "Tier derived from adjudicated_compliance_score at each ComplianceSweep."
        constraints: "TIER_PLATINUM | TIER_STANDARD | TIER_PROBATION"
      - name: compliance_status
        type: enum
        source: computed
        default: IN_GOOD_STANDING
        description: "Banded standing derived from adjudicated_compliance_score at each ComplianceSweep."
        constraints: "IN_GOOD_STANDING | WATCH | PROBATION | BARRED"
      - name: access_quota_in_effect
        type: integer
        source: system
        default: 4
        description: "Approved-authorization soft quota for the current epoch. Startup value = BASE_QUOTA (4); rewritten by every ComplianceSweep from the PRE-sweep value."
        constraints: ">= 1"
      - name: authorizations_used_epoch
        type: integer
        source: computed
        default: 0
        description: "Count of CaseRepAuthorization rows of this vendor with status == APPROVED and epoch_number == Vendor.last_sweep_epoch. Reset to 0 by each sweep."
        constraints: ">= 0"
      - name: late_fee_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Money ledger: sum of LoanerSet.assessed_late_fee_cents over this vendor's sets whose fee_status == ASSESSED."
        constraints: ">= 0"
      - name: open_pir_count
        type: integer
        source: computed
        default: 0
        description: "Count of ProductIntroductionRequest rows of this vendor with status IN {DRAFT, CLINICAL_REVIEW, VALUE_ANALYSIS_REVIEW, CHANGES_REQUESTED}."
        constraints: ">= 0"
      - name: last_sweep_epoch
        type: integer
        source: system
        default: 0
        description: "epoch_number of the most recent ComplianceSweep that rescored this vendor; 0 before any sweep."
        constraints: ">= 0"

  - name: VendorRep
    parent: Vendor
    common_fields: true
    kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the employing vendor. Immutable after creation."
      - name: full_name
        type: string
        source: input
        description: "Representative legal name."
      - name: email
        type: string
        source: input
        description: "Representative contact email; unique across all VendorRep rows."
        constraints: "unique"
      - name: access_status
        type: enum
        source: computed
        default: PENDING_CREDENTIALING
        description: "Site-access lifecycle state. See state_machines.VendorRep."
        constraints: "PENDING_CREDENTIALING | CREDENTIALED | SUSPENDED | REVOKED"
      - name: credential_posture
        type: enum
        source: computed
        default: INCOMPLETE
        description: "Aggregate over this rep's Credential children. See calculations.rep_credential_posture."
        constraints: "INCOMPLETE | COMPLIANT | EXPIRING_SOON | LAPSED"
      - name: suspension_reason
        type: enum
        source: computed
        default: NONE
        description: "Why access_status == SUSPENDED; reset to NONE on reinstatement."
        constraints: "NONE | CREDENTIAL_LAPSED | INCIDENT_SUBSTANTIATED"
      - name: ever_credentialed
        type: boolean
        source: system
        default: false
        description: "Set true the first time credential_posture reaches COMPLIANT or EXPIRING_SOON; distinguishes LAPSED from INCOMPLETE forever after."
      - name: open_authorization_count
        type: integer
        source: computed
        default: 0
        description: "Count of this rep's CaseRepAuthorization rows with status == APPROVED."
        constraints: ">= 0"
      - name: revoked_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CredentialingOfficer who last revoked access; the segregation-of-duties key for appeal decisions."
      - name: revoked_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the last revocation; the appeal-window anchor. ISO 8601 UTC, three fractional digits."
      - name: reinstated_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the last return to CREDENTIALED from SUSPENDED or REVOKED."

  - name: Credential
    parent: VendorRep
    common_fields: true
    kind: resource
    fields:
      - name: vendor_rep_id
        type: string
        source: input
        description: "FK -> VendorRep.id; the rep this credential attests for."
      - name: credential_type
        type: enum
        source: input
        description: "Credential kind. The four types in REQUIRED_CREDENTIAL_TYPES gate posture; IMMUNIZATION_MMR and TRAINING_OR_PROTOCOL are optional extras that never gate posture."
        constraints: "IMMUNIZATION_INFLUENZA | IMMUNIZATION_MMR | TRAINING_BLOODBORNE_PATHOGENS | TRAINING_OR_PROTOCOL | BACKGROUND_CHECK | COI_GIFT_ATTESTATION"
      - name: issued_at_utc
        type: datetime
        source: input
        description: "Attestation/issue instant. ISO 8601 UTC."
      - name: expires_at_utc
        type: datetime
        source: input
        description: "Expiry instant; must be strictly after issued_at_utc. ISO 8601 UTC."
      - name: document_reference
        type: string
        source: input
        description: "Opaque document locator supplied by the vendor."
      - name: status
        type: enum
        source: computed
        default: PENDING_VERIFICATION
        description: "Verification/expiry state. See state_machines.Credential."
        constraints: "PENDING_VERIFICATION | VERIFIED | EXPIRING_SOON | EXPIRED | REJECTED"
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the CredentialingOfficer who verified this credential."
      - name: verified_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of verification."
      - name: rejection_reason
        type: string
        source: system
        default: null
        description: "Free text recorded when the verification decision was REJECT."

  - name: SurgicalCase
    parent: Facility
    common_fields: true
    kind: resource
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the facility hosting the case. Immutable after creation."
      - name: case_number
        type: string
        source: input
        description: "Human case identifier; unique within facility_id."
        constraints: "unique per (facility_id, case_number)"
      - name: procedure_name
        type: string
        source: input
        description: "Procedure description."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Current scheduled start; rewritten by reschedule. Basis of the current_basis deadline variant and of the badge window."
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Current scheduled end; must be strictly after scheduled_start_utc."
      - name: original_scheduled_start_utc
        type: datetime
        source: system
        description: "The scheduled_start_utc supplied at creation. NEVER rewritten, including by reschedule. Basis of the pinned_basis deadline variant."
      - name: restriction_level
        type: enum
        source: input
        default: STANDARD
        description: "RESTRICTED cases require a named escort on every approved authorization when the facility sets restricted_escort_required."
        constraints: "STANDARD | RESTRICTED"
      - name: implant_required
        type: boolean
        source: input
        default: false
        description: "When true the case needs implant support: adds the IMPLANT_MIN_LEAD_HOURS floor to loaner lead time and enables UNCOVERED / implant-readiness gating."
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Case lifecycle. See state_machines.SurgicalCase."
        constraints: "SCHEDULED | RESCHEDULED | CANCELLED"
      - name: vendor_coverage_status
        type: enum
        source: computed
        default: NOT_REQUIRED
        description: "Derived coverage posture over this case's CaseRepAuthorization children. See calculations.case_vendor_coverage_status."
        constraints: "NOT_REQUIRED | COVERED | AT_RISK | UNCOVERED"
      - name: implant_readiness_status
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: "Derived readiness posture over this case's LoanerSet children. See calculations.case_implant_readiness_status."
        constraints: "NOT_APPLICABLE | PENDING | READY | BLOCKED"
      - name: approved_rep_count
        type: integer
        source: computed
        default: 0
        description: "Count of this case's CaseRepAuthorization rows with status == APPROVED."
        constraints: ">= 0"
      - name: revoked_authorization_count
        type: integer
        source: computed
        default: 0
        description: "Count of this case's CaseRepAuthorization rows with status == REVOKED; a non-zero value forces AT_RISK while coverage remains."
        constraints: ">= 0"
      - name: reschedule_count
        type: integer
        source: computed
        default: 0
        description: "Number of successful reschedule operations applied to this case."
        constraints: ">= 0"

  - name: CaseRepAuthorization
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: surgical_case_id
        type: string
        source: input
        description: "FK -> SurgicalCase.id; the case this authorization admits the rep to."
      - name: vendor_rep_id
        type: string
        source: input
        description: "FK -> VendorRep.id; the representative being authorized."
      - name: requested_role
        type: enum
        source: input
        description: "Scope of presence requested. IMPLANT_SUPPORT additionally demands an ACTIVE ApprovedProduct for (vendor, facility)."
        constraints: "IMPLANT_SUPPORT | TECHNICAL_SUPPORT | OBSERVATION"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID that opened the request (a VendorAdmin or an ORCoordinator). The decider must differ from it (segregation of duties)."
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: "Authorization lifecycle. See state_machines.CaseRepAuthorization."
        constraints: "REQUESTED | APPROVED | DENIED | REVOKED"
      - name: escort_required
        type: boolean
        source: computed
        default: false
        description: "true iff facility.restricted_escort_required AND case.restriction_level == RESTRICTED, evaluated at approval."
      - name: escort_user_id
        type: string
        source: system
        default: null
        description: "Escort named by the ORCoordinator at approval; required when escort_required is true."
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ORCoordinator who approved or denied; must differ from requested_by_user_id."
      - name: decided_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the approve/deny decision."
      - name: revoked_reason
        type: enum
        source: computed
        default: NONE
        description: "Why the authorization moved to REVOKED."
        constraints: "NONE | REP_SUSPENDED | REP_REVOKED | CASE_CANCELLED | COORDINATOR_WITHDRAWN"
      - name: badge_window_start_utc
        type: datetime
        source: computed
        default: null
        description: "case.scheduled_start_utc - facility.badge_lead_minutes; recomputed on reschedule. See calculations.badge_validity_window."
      - name: badge_window_end_utc
        type: datetime
        source: computed
        default: null
        description: "case.scheduled_end_utc + facility.badge_grace_minutes; recomputed on reschedule."
      - name: epoch_number
        type: integer
        source: system
        default: null
        description: "Vendor.last_sweep_epoch captured at approval; scopes this row to the quota epoch it consumed."

  - name: ProductIntroductionRequest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the requesting vendor."
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the facility the product is being introduced into."
      - name: supersedes_request_id
        type: string
        source: input
        default: null
        description: "FK -> ProductIntroductionRequest.id; self-referential supersession edge set when this request replaces a REJECTED or APPROVED predecessor. Nullable."
      - name: product_name
        type: string
        source: input
        description: "Product display name."
      - name: product_catalog_number
        type: string
        source: input
        description: "Manufacturer catalog number."
      - name: manufacturer
        type: string
        source: input
        description: "Manufacturer name."
      - name: is_implant
        type: boolean
        source: input
        description: "true when the product is an implantable device."
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Quoted unit cost in cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Review lifecycle with a revision cycle. See state_machines.ProductIntroductionRequest."
        constraints: "DRAFT | CLINICAL_REVIEW | VALUE_ANALYSIS_REVIEW | CHANGES_REQUESTED | APPROVED | REJECTED"
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: "Incremented on every CHANGES_REQUESTED -> CLINICAL_REVIEW resubmission; capped by MAX_REVISION_ROUNDS."
        constraints: "0..2"
      - name: clinical_sponsor_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClinicalSponsor who endorsed; the segregation-of-duties key for the value-analysis decision."
      - name: clinical_reviewed_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the clinical endorsement."
      - name: value_analysis_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ValueAnalysisApprover who decided."
      - name: decided_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the value-analysis decision."

  - name: ApprovedProduct
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: product_introduction_request_id
        type: string
        source: system
        description: "FK -> ProductIntroductionRequest.id; the approved request that minted this row. The vendor and facility of this product are pir.vendor_id and pir.facility_id."
      - name: product_name
        type: string
        source: system
        description: "Copied from the request at approval; never re-read from the request afterwards."
      - name: product_catalog_number
        type: string
        source: system
        description: "Copied from the request at approval."
      - name: manufacturer
        type: string
        source: system
        description: "Copied from the request at approval."
      - name: is_implant
        type: boolean
        source: system
        description: "Copied from the request at approval."
      - name: unit_cost_cents
        type: integer
        source: system
        description: "Copied from the request at approval."
      - name: pinned_pir_version
        type: integer
        source: system
        description: "ProductIntroductionRequest.version observed at the moment of approval; version-pinning-on-approval anchor."
      - name: approved_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of approval."
      - name: approval_expires_at_utc
        type: datetime
        source: computed
        description: "approved_at_utc + APPROVAL_VALIDITY_DAYS (365 days)."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Catalog availability. See state_machines.ApprovedProduct."
        constraints: "ACTIVE | SUSPENDED | EXPIRED"
      - name: suspended_reason
        type: enum
        source: computed
        default: NONE
        description: "Why the product left ACTIVE."
        constraints: "NONE | INCIDENT_SUBSTANTIATED | APPROVAL_EXPIRED"

  - name: LoanerSet
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: surgical_case_id
        type: string
        source: input
        description: "FK -> SurgicalCase.id; the case this instrument set is staged for."
      - name: approved_product_id
        type: string
        source: input
        description: "FK -> ApprovedProduct.id; the value-analysis-approved product the set carries."
      - name: tray_count
        type: integer
        source: input
        description: "Number of instrument trays in the set. Zero is legal and waives every late fee."
        constraints: ">= 0"
      - name: reprocessing_complexity
        type: enum
        source: input
        description: "Drives COMPLEXITY_HOURS in the deadline formula and COMPLEXITY_FEE_MULTIPLIER in the late-fee formula."
        constraints: "SIMPLE | COMPLEX | IMPLANT_SPECIALTY"
      - name: pinned_deadline_utc
        type: datetime
        source: system
        description: "Delivery deadline computed once at registration from case.original_scheduled_start_utc. NEVER recomputed."
      - name: required_delivery_deadline_utc
        type: datetime
        source: computed
        description: "Delivery deadline computed from case.scheduled_start_utc; recomputed on every reschedule. See calculations.loaner_delivery_deadline."
      - name: delivered_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which SPD receipt was recorded."
      - name: late_minutes_pinned_basis
        type: integer
        source: computed
        default: 0
        description: "max(0, whole minutes from pinned_deadline_utc to delivered_at_utc). Frozen against reschedules."
        constraints: ">= 0"
      - name: late_minutes_current_basis
        type: integer
        source: computed
        default: 0
        description: "max(0, whole minutes from required_delivery_deadline_utc to delivered_at_utc). Re-derived on every reschedule; the fee and branch driver."
        constraints: ">= 0"
      - name: assessed_late_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Late fee from calculations.loaner_late_fee. Retained verbatim when fee_status flips to REVERSED (historical amount)."
        constraints: ">= 0"
      - name: fee_status
        type: enum
        source: computed
        default: NONE
        description: "Ledger participation flag: only ASSESSED rows contribute to Vendor.late_fee_balance_cents. NONE means no fee is owed (never delivered late, or delivered on time)."
        constraints: "NONE | WAIVED | ASSESSED | REVERSED"
      - name: status
        type: enum
        source: computed
        default: EXPECTED
        description: "Delivery/release lifecycle; a fork-join diamond. See state_machines.LoanerSet."
        constraints: "EXPECTED | DELIVERED_ON_TIME | DELIVERED_LATE | REJECTED_LATE | HELD | RELEASED_TO_OR"
      - name: spd_occupation_start_utc
        type: datetime
        source: computed
        description: "= required_delivery_deadline_utc. Start of this set's SPD bay occupation interval."
      - name: spd_occupation_end_utc
        type: datetime
        source: computed
        description: "= case.scheduled_start_utc. End of this set's SPD bay occupation interval."

  - name: KioskCheckIn
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: case_rep_authorization_id
        type: string
        source: input
        description: "FK -> CaseRepAuthorization.id; the approved authorization this badge realizes."
      - name: badge_serial
        type: string
        source: system
        description: "facility.code + '-' + a 4-digit zero-padded per-facility counter starting at 0001, assigned in check-in order. Deterministic, never random."
      - name: badge_status
        type: enum
        source: computed
        default: ISSUED
        description: "First of two independent state dimensions. See state_machines.KioskCheckIn."
        constraints: "ISSUED | CHECKED_OUT | EXPIRED | VOIDED"
      - name: escort_status
        type: enum
        source: computed
        description: "Second, independent state dimension; initialised from authorization.escort_required at check-in."
        constraints: "ESCORT_NOT_REQUIRED | ESCORT_PENDING | ESCORT_ATTACHED | ESCORT_RELEASED"
      - name: issued_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of check-in."
      - name: valid_from_utc
        type: datetime
        source: computed
        description: "Copied from authorization.badge_window_start_utc at check-in; refreshed when the case is rescheduled while badge_status == ISSUED."
      - name: valid_until_utc
        type: datetime
        source: computed
        description: "Copied from authorization.badge_window_end_utc at check-in; refreshed when the case is rescheduled while badge_status == ISSUED."
      - name: escort_user_id
        type: string
        source: system
        default: null
        description: "Escort actually attached at the kiosk; may differ from authorization.escort_user_id."
      - name: escort_attached_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the escort was attached."
      - name: checked_out_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of check-out."

  - name: Incident
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: surgical_case_id
        type: string
        source: input
        description: "FK -> SurgicalCase.id; the case during which the incident occurred."
      - name: vendor_rep_id
        type: string
        source: input
        description: "FK -> VendorRep.id; the representative implicated."
      - name: approved_product_id
        type: string
        source: input
        default: null
        description: "FK -> ApprovedProduct.id; the product implicated. Nullable — omitted when the incident is not product-specific."
      - name: incident_type
        type: enum
        source: input
        description: "Incident classification. Only UNAPPROVED_PRODUCT_USE can suspend a product or a rep on substantiation."
        constraints: "UNAPPROVED_PRODUCT_USE | UNBADGED_ACCESS | LOANER_LATE_DELIVERY | GIFT_POLICY_VIOLATION"
      - name: severity
        type: enum
        source: input
        description: "Drives score_weight and the CRITICAL-only rep-suspension hop."
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: narrative
        type: string
        source: input
        description: "Reporter's account."
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter; the segregation-of-duties key for adjudication."
      - name: reported_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the report."
      - name: status
        type: enum
        source: computed
        default: REPORTED
        description: "Investigation lifecycle. See state_machines.Incident."
        constraints: "REPORTED | UNDER_INVESTIGATION | SUBSTANTIATED | UNSUBSTANTIATED | CLOSED"
      - name: adjudicated_outcome
        type: enum
        source: computed
        default: NONE
        description: "Retains the adjudication result after the sweep moves status to CLOSED; the scorecard inclusion key."
        constraints: "NONE | SUBSTANTIATED | UNSUBSTANTIATED"
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ComplianceAdmin who adjudicated."
      - name: adjudicated_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of adjudication; the INCIDENT_CLOSE_DAYS anchor."
      - name: score_weight
        type: integer
        source: computed
        description: "W_INCIDENT_MINOR (3) | W_INCIDENT_MAJOR (8) | W_INCIDENT_CRITICAL (20), from severity at creation."

  - name: AccessAppeal
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_rep_id
        type: string
        source: input
        description: "FK -> VendorRep.id; the revoked representative appealing."
      - name: grounds
        type: string
        source: input
        description: "Vendor's written grounds for appeal."
      - name: filed_for_revoked_at_utc
        type: datetime
        source: system
        description: "Copy of VendorRep.revoked_at_utc at filing; the one-appeal-per-revocation uniqueness key."
      - name: filed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of filing."
      - name: appeal_deadline_utc
        type: datetime
        source: computed
        description: "VendorRep.revoked_at_utc + APPEAL_WINDOW_DAYS (14 days); filing at exactly this instant is still accepted."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Appeal lifecycle. See state_machines.AccessAppeal."
        constraints: "SUBMITTED | UPHELD | OVERTURNED"
      - name: decided_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the decider; must differ from VendorRep.revoked_by_user_id."
      - name: decided_at_utc
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the decision."
      - name: decision_rationale
        type: string
        source: system
        default: null
        description: "Written rationale recorded with the decision."

  - name: ComplianceSweep
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: epoch_number
        type: integer
        source: system
        description: "1-based sweep epoch; previous maximum + 1."
      - name: previous_epoch_number
        type: integer
        source: system
        description: "epoch_number of the preceding sweep, or 0 for the first."
      - name: swept_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the sweep observed; every <= comparison in the sweep uses exactly this value."
      - name: credentials_expired_count
        type: integer
        source: computed
        description: "Credential rows moved to EXPIRED in phase 2."
      - name: credentials_warned_count
        type: integer
        source: computed
        description: "Credential rows moved VERIFIED -> EXPIRING_SOON in phase 2."
      - name: reps_suspended_count
        type: integer
        source: computed
        description: "VendorRep rows moved CREDENTIALED -> SUSPENDED in phase 3."
      - name: reps_reinstated_count
        type: integer
        source: computed
        description: "VendorRep rows moved SUSPENDED -> CREDENTIALED in phase 3."
      - name: authorizations_revoked_count
        type: integer
        source: computed
        description: "CaseRepAuthorization rows revoked in phase 4."
      - name: badges_voided_count
        type: integer
        source: computed
        description: "KioskCheckIn rows voided as a consequence of phase-4 revocations."
      - name: badges_expired_count
        type: integer
        source: computed
        description: "KioskCheckIn rows moved ISSUED -> EXPIRED in phase 5."
      - name: approvals_expired_count
        type: integer
        source: computed
        description: "ApprovedProduct rows moved ACTIVE -> EXPIRED in phase 6."
      - name: incidents_closed_count
        type: integer
        source: computed
        description: "Incident rows moved to CLOSED in phase 7."
      - name: vendors_rescored_count
        type: integer
        source: computed
        description: "Vendor rows rescored in phase 8 (always every Vendor row)."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- CYCLIC: SUSPENDED -> CREDENTIALED and REVOKED -> CREDENTIALED both
  #     return the entity to a previously occupied state. --------------------
  - entity: VendorRep
    initial_state: PENDING_CREDENTIALING
    terminal_states: []
    state_field: access_status
    transitions:
      - from: PENDING_CREDENTIALING
        to: CREDENTIALED
        trigger: "POST /vendor-access/credentials/{id}/decide (decision=VERIFY), or ComplianceSweep phase 3"
        actor: CredentialingOfficer
        preconditions:
          - "recomputed credential_posture IN {COMPLIANT, EXPIRING_SOON}"
        side_effects:
          - "set VendorRep.ever_credentialed = true"
          - "set VendorRep.suspension_reason = NONE"
          - "recompute VendorRep.credential_posture (calculations.rep_credential_posture)"
      - from: CREDENTIALED
        to: SUSPENDED
        trigger: "ComplianceSweep phase 3 (credential_posture became LAPSED), or POST /vendor-access/incidents/{id}/adjudicate with outcome=SUBSTANTIATED, incident_type=UNAPPROVED_PRODUCT_USE, severity=CRITICAL"
        actor: system
        preconditions:
          - "credential_posture == LAPSED (sweep path) OR the adjudicated incident is CRITICAL UNAPPROVED_PRODUCT_USE (incident path)"
        side_effects:
          - "set VendorRep.suspension_reason = CREDENTIAL_LAPSED (sweep path) or INCIDENT_SUBSTANTIATED (incident path)"
          - "CASCADE HOP: because this rep is now SUSPENDED, every CaseRepAuthorization of this rep with status == APPROVED whose SurgicalCase.scheduled_start_utc >= now moves REQUESTED-free straight to REVOKED with revoked_reason = REP_SUSPENDED, processed in authorization created_at ASC order"
          - "each such revocation decrements Vendor.authorizations_used_epoch, decrements VendorRep.open_authorization_count, decrements SurgicalCase.approved_rep_count and increments SurgicalCase.revoked_authorization_count"
          - "CASCADE HOP: because those authorizations are now REVOKED, each of their KioskCheckIn rows with badge_status == ISSUED moves to VOIDED"
          - "CASCADE HOP: because approved_rep_count / revoked_authorization_count changed, recompute SurgicalCase.vendor_coverage_status for each affected case"
        note: "Authorizations for cases whose scheduled_start_utc < now are deliberately left APPROVED — historical access is not rewritten."
      - from: SUSPENDED
        to: CREDENTIALED
        trigger: "POST /vendor-access/credentials/{id}/decide (decision=VERIFY) of a replacement credential, or ComplianceSweep phase 3"
        actor: CredentialingOfficer
        preconditions:
          - "recomputed credential_posture IN {COMPLIANT, EXPIRING_SOON}"
          - "suspension_reason == CREDENTIAL_LAPSED (an INCIDENT_SUBSTANTIATED suspension is not cleared by credential work)"
        side_effects:
          - "set VendorRep.suspension_reason = NONE"
          - "set VendorRep.reinstated_at_utc = logical clock now"
        note: "The cycle back to CREDENTIALED does NOT resurrect authorizations revoked during the suspension; those stay REVOKED."
      - from: PENDING_CREDENTIALING
        to: REVOKED
        trigger: "POST /vendor-access/vendor-reps/{id}/revoke-access"
        actor: CredentialingOfficer
        preconditions:
          - "access_status != REVOKED"
        side_effects:
          - "set revoked_by_user_id = X-User-ID, revoked_at_utc = logical clock now"
      - from: CREDENTIALED
        to: REVOKED
        trigger: "POST /vendor-access/vendor-reps/{id}/revoke-access"
        actor: CredentialingOfficer
        preconditions:
          - "access_status != REVOKED"
        side_effects:
          - "set revoked_by_user_id = X-User-ID, revoked_at_utc = logical clock now"
          - "CASCADE HOP: because this rep is now REVOKED, every CaseRepAuthorization of this rep with status == APPROVED whose SurgicalCase.scheduled_start_utc >= now moves to REVOKED with revoked_reason = REP_REVOKED, in created_at ASC order, with the same counter decrements as the SUSPENDED path"
          - "CASCADE HOP: because those authorizations are now REVOKED, each of their KioskCheckIn rows with badge_status == ISSUED moves to VOIDED"
          - "CASCADE HOP: recompute SurgicalCase.vendor_coverage_status for each affected case"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /vendor-access/vendor-reps/{id}/revoke-access"
        actor: CredentialingOfficer
        preconditions:
          - "access_status != REVOKED"
        side_effects:
          - "set revoked_by_user_id = X-User-ID, revoked_at_utc = logical clock now"
      - from: REVOKED
        to: CREDENTIALED
        trigger: "POST /vendor-access/access-appeals/{id}/decide (decision=OVERTURN)"
        actor: ComplianceAdmin | CredentialingOfficer
        preconditions:
          - "AccessAppeal.status == SUBMITTED"
          - "X-User-ID != VendorRep.revoked_by_user_id (segregation of duties)"
          - "recomputed credential_posture IN {COMPLIANT, EXPIRING_SOON}"
        side_effects:
          - "set VendorRep.reinstated_at_utc = logical clock now, suspension_reason = NONE"
        note: "Closes the revocation cycle. When posture is LAPSED or INCOMPLETE the overturn lands on SUSPENDED instead (next transition)."
      - from: REVOKED
        to: SUSPENDED
        trigger: "POST /vendor-access/access-appeals/{id}/decide (decision=OVERTURN)"
        actor: ComplianceAdmin | CredentialingOfficer
        preconditions:
          - "AccessAppeal.status == SUBMITTED"
          - "X-User-ID != VendorRep.revoked_by_user_id"
          - "recomputed credential_posture IN {LAPSED, INCOMPLETE}"
        side_effects:
          - "set VendorRep.suspension_reason = CREDENTIAL_LAPSED"
          - "set VendorRep.reinstated_at_utc = logical clock now"

  - entity: Credential
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED]
    state_field: status
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /vendor-access/credentials/{id}/decide (decision=VERIFY)"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_VERIFICATION"
        side_effects:
          - "set verified_by_user_id = X-User-ID, verified_at_utc = logical clock now"
          - "recompute VendorRep.credential_posture, then apply the VendorRep access_status transitions it enables"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /vendor-access/credentials/{id}/decide (decision=REJECT)"
        actor: CredentialingOfficer
        preconditions:
          - "Credential.status == PENDING_VERIFICATION"
        side_effects:
          - "set rejection_reason from the request body"
          - "recompute VendorRep.credential_posture (a REJECTED credential never covers its type)"
      - from: VERIFIED
        to: EXPIRING_SOON
        trigger: "ComplianceSweep phase 2"
        actor: system
        preconditions:
          - "expires_at_utc > sweep.swept_at_utc"
          - "expires_at_utc <= sweep.swept_at_utc + EXPIRY_WARNING_DAYS (14 days)"
        side_effects:
          - "increment ComplianceSweep.credentials_warned_count"
          - "recompute the owning VendorRep.credential_posture"
      - from: VERIFIED
        to: EXPIRED
        trigger: "ComplianceSweep phase 2"
        actor: system
        preconditions:
          - "expires_at_utc <= sweep.swept_at_utc (equality expires — the boundary is inclusive)"
        side_effects:
          - "increment ComplianceSweep.credentials_expired_count"
          - "CASCADE HOP: because this credential is now EXPIRED it no longer covers its type, so recompute the owning VendorRep.credential_posture"
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "ComplianceSweep phase 2"
        actor: system
        preconditions:
          - "expires_at_utc <= sweep.swept_at_utc"
        side_effects:
          - "increment ComplianceSweep.credentials_expired_count"
          - "CASCADE HOP: recompute the owning VendorRep.credential_posture"

  - entity: SurgicalCase
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    state_field: status
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /vendor-access/surgical-cases/{id}/reschedule"
        actor: ORCoordinator
        preconditions:
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "new_scheduled_end_utc > new_scheduled_start_utc"
        side_effects:
          - "overwrite scheduled_start_utc / scheduled_end_utc; original_scheduled_start_utc is NOT touched"
          - "increment reschedule_count; increment version"
          - "for each CaseRepAuthorization of the case with status == APPROVED: recompute badge_window_start_utc / badge_window_end_utc"
          - "for each KioskCheckIn of those authorizations with badge_status == ISSUED: refresh valid_from_utc / valid_until_utc"
          - "for each LoanerSet of the case with status IN {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE, HELD}: recompute required_delivery_deadline_utc and the SPD occupation window (pinned_deadline_utc is NOT touched)"
          - "for each such LoanerSet with delivered_at_utc != null: re-derive late_minutes_current_basis and re-adjudicate the delivery branch; a set that becomes on time flips to DELIVERED_ON_TIME and, if fee_status == ASSESSED, flips fee_status to REVERSED and debits Vendor.late_fee_balance_cents by assessed_late_fee_cents (assessed_late_fee_cents itself is retained)"
          - "recompute SurgicalCase.implant_readiness_status and vendor_coverage_status"
          - "recompute both Vendor compliance-score variants for every vendor whose sets changed branch"
      - from: RESCHEDULED
        to: RESCHEDULED
        trigger: "POST /vendor-access/surgical-cases/{id}/reschedule"
        actor: ORCoordinator
        preconditions:
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "new_scheduled_end_utc > new_scheduled_start_utc"
        side_effects:
          - "identical to the SCHEDULED -> RESCHEDULED side-effect set"
        note: "Self-loop: repeated reschedules are legal and each one re-derives the current_basis deadline while leaving the pinned basis alone."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vendor-access/surgical-cases/{id}/cancel"
        actor: ORCoordinator
        preconditions:
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "CASCADE HOP: because the case is CANCELLED, every CaseRepAuthorization of the case with status == REQUESTED moves to DENIED and every one with status == APPROVED moves to REVOKED with revoked_reason = CASE_CANCELLED, in created_at ASC order"
          - "each APPROVED->REVOKED decrements Vendor.authorizations_used_epoch, decrements VendorRep.open_authorization_count, decrements approved_rep_count, increments revoked_authorization_count"
          - "CASCADE HOP: because those authorizations are REVOKED, their KioskCheckIn rows with badge_status == ISSUED move to VOIDED"
          - "recompute vendor_coverage_status (lands on NOT_REQUIRED or UNCOVERED once approved_rep_count reaches 0)"
      - from: RESCHEDULED
        to: CANCELLED
        trigger: "POST /vendor-access/surgical-cases/{id}/cancel"
        actor: ORCoordinator
        preconditions:
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set"

  - entity: CaseRepAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    state_field: status
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /vendor-access/case-rep-authorizations/{id}/decide (decision=APPROVE)"
        actor: ORCoordinator
        preconditions:
          - "CaseRepAuthorization.status == REQUESTED"
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "VendorRep.access_status == CREDENTIALED (guarded cross-entity precondition)"
          - "VendorRep.credential_posture IN {COMPLIANT, EXPIRING_SOON}"
          - "if SurgicalCase.implant_required then the rep's Vendor must own at least one ApprovedProduct with status == ACTIVE"
          - "Vendor.late_fee_balance_cents < FEE_HOLD_THRESHOLD_CENTS"
          - "Vendor.authorizations_used_epoch < floor(Vendor.access_quota_in_effect * QUOTA_HARD_MULTIPLIER)"
          - "the rep has no other APPROVED authorization whose badge window overlaps this case's badge window (half-open [start, end))"
          - "X-User-ID != the user that created the authorization request (segregation of duties)"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at_utc = logical clock now"
          - "compute badge_window_start_utc / badge_window_end_utc (calculations.badge_validity_window)"
          - "set escort_required = SurgicalCase.restriction_level == RESTRICTED AND Facility.restricted_escort_required"
          - "set epoch_number = Vendor.last_sweep_epoch"
          - "increment Vendor.authorizations_used_epoch, VendorRep.open_authorization_count, SurgicalCase.approved_rep_count"
          - "recompute SurgicalCase.vendor_coverage_status"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /vendor-access/case-rep-authorizations/{id}/decide (decision=DENY)"
        actor: ORCoordinator
        preconditions:
          - "CaseRepAuthorization.status == REQUESTED"
          - "X-User-ID != the user that created the authorization request"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at_utc = logical clock now"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /vendor-access/surgical-cases/{id}/cancel"
        actor: system
        preconditions:
          - "the owning SurgicalCase moved to CANCELLED"
        side_effects:
          - "set revoked_reason = CASE_CANCELLED"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /vendor-access/case-rep-authorizations/{id}/revoke"
        actor: ORCoordinator | CredentialingOfficer
        preconditions:
          - "CaseRepAuthorization.status == APPROVED"
        side_effects:
          - "set revoked_reason from the request body (default MANUAL), decided_at_utc unchanged"
          - "decrement Vendor.authorizations_used_epoch (floor 0), decrement VendorRep.open_authorization_count (floor 0), decrement SurgicalCase.approved_rep_count (floor 0)"
          - "increment SurgicalCase.revoked_authorization_count"
          - "CASCADE HOP: every KioskCheckIn of this authorization with badge_status == ISSUED moves to VOIDED"
          - "recompute SurgicalCase.vendor_coverage_status"
      - from: APPROVED
        to: REVOKED
        trigger: "ComplianceSweep phase 4, POST /vendor-access/vendor-reps/{id}/revoke-access, POST /vendor-access/incidents/{id}/adjudicate (CRITICAL substantiated), or POST /vendor-access/surgical-cases/{id}/cancel"
        actor: system
        preconditions:
          - "the owning VendorRep moved to SUSPENDED or REVOKED, or the owning SurgicalCase moved to CANCELLED"
          - "for rep-driven revocation only: SurgicalCase.scheduled_start_utc >= now"
        side_effects:
          - "set revoked_reason = REP_SUSPENDED | REP_REVOKED | CASE_CANCELLED"
          - "same counter decrements, badge voiding and coverage recomputation as the manual revoke"

  # --- CYCLIC: CHANGES_REQUESTED -> CLINICAL_REVIEW re-enters an occupied
  #     state; revision_round bounds the loop at MAX_REVISION_ROUNDS. --------
  - entity: ProductIntroductionRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    state_field: status
    transitions:
      - from: DRAFT
        to: CLINICAL_REVIEW
        trigger: "POST /vendor-access/product-introduction-requests/{id}/submit"
        actor: VendorAdmin
        preconditions:
          - "ProductIntroductionRequest.status == DRAFT"
          - "the acting VendorAdmin's Vendor is the request's vendor_id"
        side_effects:
          - "increment Vendor.open_pir_count"
          - "increment ProductIntroductionRequest.version"
      - from: CLINICAL_REVIEW
        to: VALUE_ANALYSIS_REVIEW
        trigger: "POST /vendor-access/product-introduction-requests/{id}/clinical-review (decision=ENDORSE)"
        actor: ClinicalSponsor
        preconditions:
          - "ProductIntroductionRequest.status == CLINICAL_REVIEW"
        side_effects:
          - "set clinical_sponsor_user_id = X-User-ID, clinical_reviewed_at_utc = logical clock now"
      - from: CLINICAL_REVIEW
        to: REJECTED
        trigger: "POST /vendor-access/product-introduction-requests/{id}/clinical-review (decision=REJECT)"
        actor: ClinicalSponsor
        preconditions:
          - "ProductIntroductionRequest.status == CLINICAL_REVIEW"
        side_effects:
          - "set clinical_sponsor_user_id = X-User-ID, clinical_reviewed_at_utc, decided_at_utc = logical clock now"
          - "decrement Vendor.open_pir_count (floor 0)"
      - from: VALUE_ANALYSIS_REVIEW
        to: APPROVED
        trigger: "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision (decision=APPROVE)"
        actor: ValueAnalysisApprover
        preconditions:
          - "ProductIntroductionRequest.status == VALUE_ANALYSIS_REVIEW"
          - "X-User-ID != ProductIntroductionRequest.clinical_sponsor_user_id (segregation of duties)"
        side_effects:
          - "set value_analysis_user_id = X-User-ID, decided_at_utc = logical clock now"
          - "CASCADE HOP: create one ApprovedProduct copying product_name / product_catalog_number / manufacturer / is_implant / unit_cost_cents, with pinned_pir_version = ProductIntroductionRequest.version, approved_at_utc = now, approval_expires_at_utc = now + APPROVAL_VALIDITY_DAYS (365 days), status = ACTIVE"
          - "decrement Vendor.open_pir_count (floor 0)"
          - "CASCADE HOP: if supersedes_request_id is set, the ApprovedProduct of the superseded request (if ACTIVE) moves to SUSPENDED with suspended_reason = SUPERSEDED"
      - from: VALUE_ANALYSIS_REVIEW
        to: REJECTED
        trigger: "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision (decision=REJECT)"
        actor: ValueAnalysisApprover
        preconditions:
          - "ProductIntroductionRequest.status == VALUE_ANALYSIS_REVIEW"
          - "X-User-ID != ProductIntroductionRequest.clinical_sponsor_user_id"
        side_effects:
          - "set value_analysis_user_id = X-User-ID, decided_at_utc = logical clock now"
          - "decrement Vendor.open_pir_count (floor 0)"
      - from: VALUE_ANALYSIS_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision (decision=REQUEST_CHANGES)"
        actor: ValueAnalysisApprover
        preconditions:
          - "ProductIntroductionRequest.status == VALUE_ANALYSIS_REVIEW"
          - "X-User-ID != ProductIntroductionRequest.clinical_sponsor_user_id"
          - "revision_round < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "set value_analysis_user_id = X-User-ID"
          - "clear clinical_sponsor_user_id and clinical_reviewed_at_utc so the next round needs a fresh endorsement"
      - from: CHANGES_REQUESTED
        to: CLINICAL_REVIEW
        trigger: "POST /vendor-access/product-introduction-requests/{id}/submit"
        actor: VendorAdmin
        preconditions:
          - "ProductIntroductionRequest.status == CHANGES_REQUESTED"
          - "revision_round < MAX_REVISION_ROUNDS (2)"
          - "the acting VendorAdmin's Vendor is the request's vendor_id"
        side_effects:
          - "increment revision_round"
          - "increment ProductIntroductionRequest.version"
        note: "Loop back into CLINICAL_REVIEW. The third REQUEST_CHANGES attempt (revision_round == 2) is refused with ERR_PIR_REVISION_LIMIT, which terminates the cycle."

  - entity: ApprovedProduct
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    state_field: status
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED, incident references this product), or a superseding ProductIntroductionRequest approval"
        actor: system
        preconditions:
          - "ApprovedProduct.status == ACTIVE"
        side_effects:
          - "set suspended_reason = INCIDENT_SUBSTANTIATED or SUPERSEDED"
          - "CASCADE HOP (incident path only): every LoanerSet referencing this product with status IN {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE} moves to HELD, in created_at ASC order"
          - "CASCADE HOP (incident path only): recompute SurgicalCase.implant_readiness_status for each case owning one of those sets (a HELD set forces BLOCKED)"
        note: "The SUPERSEDED path deliberately does NOT hold loaner sets — only substantiated incidents do."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED) on the incident that suspended it"
        actor: ComplianceAdmin
        preconditions:
          - "ApprovedProduct.status == SUSPENDED"
          - "suspended_reason == INCIDENT_SUBSTANTIATED"
        side_effects:
          - "set suspended_reason = NONE"
          - "CASCADE HOP: every LoanerSet of this product with status == HELD returns to the delivery branch its late minutes imply (EXPECTED when delivered_at_utc is null, otherwise DELIVERED_ON_TIME / DELIVERED_LATE)"
          - "CASCADE HOP: recompute SurgicalCase.implant_readiness_status for each affected case"
      - from: ACTIVE
        to: EXPIRED
        trigger: "ComplianceSweep phase 6"
        actor: system
        preconditions:
          - "approval_expires_at_utc <= sweep.swept_at_utc (equality expires)"
        side_effects:
          - "increment ComplianceSweep.approvals_expired_count"
        note: "Expiry does not touch LoanerSet rows; it is felt later when POST /loaner-sets/{id}/release re-checks the product."
      - from: SUSPENDED
        to: EXPIRED
        trigger: "ComplianceSweep phase 6"
        actor: system
        preconditions:
          - "approval_expires_at_utc <= sweep.swept_at_utc"
        side_effects:
          - "increment ComplianceSweep.approvals_expired_count"

  # --- BRANCHING FORK/JOIN: the three delivery branches all join at
  #     RELEASED_TO_OR, and HELD is an out-of-band detour. ------------------
  - entity: LoanerSet
    initial_state: EXPECTED
    terminal_states: [RELEASED_TO_OR]
    state_field: status
    transitions:
      - from: EXPECTED
        to: DELIVERED_ON_TIME
        trigger: "POST /vendor-access/loaner-sets/{id}/receive"
        actor: SterileProcessingTech
        preconditions:
          - "LoanerSet.status == EXPECTED"
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "late_minutes_current_basis == 0 (delivered_at_utc <= required_delivery_deadline_utc; equality is on time)"
        side_effects:
          - "set delivered_at_utc, late_minutes_pinned_basis, late_minutes_current_basis (calculations.loaner_late_minutes)"
          - "set assessed_late_fee_cents = 0, fee_status = NONE"
          - "recompute SurgicalCase.implant_readiness_status"
      - from: EXPECTED
        to: DELIVERED_LATE
        trigger: "POST /vendor-access/loaner-sets/{id}/receive"
        actor: SterileProcessingTech
        preconditions:
          - "LoanerSet.status == EXPECTED"
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "0 < late_minutes_current_basis <= HARD_REJECT_GRACE_MINUTES (120)"
        side_effects:
          - "set delivered_at_utc, late_minutes_pinned_basis, late_minutes_current_basis"
          - "set assessed_late_fee_cents (calculations.loaner_late_fee); fee_status = ASSESSED when the fee is > 0, WAIVED when tray_count == 0"
          - "increment Vendor.late_fee_balance_cents by assessed_late_fee_cents"
          - "recompute both Vendor compliance-score variants and SurgicalCase.implant_readiness_status"
      - from: EXPECTED
        to: REJECTED_LATE
        trigger: "POST /vendor-access/loaner-sets/{id}/receive"
        actor: SterileProcessingTech
        preconditions:
          - "LoanerSet.status == EXPECTED"
          - "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
          - "late_minutes_current_basis > HARD_REJECT_GRACE_MINUTES (120)"
        side_effects:
          - "set delivered_at_utc, late_minutes_pinned_basis, late_minutes_current_basis"
          - "set assessed_late_fee_cents (calculations.loaner_late_fee), fee_status = ASSESSED (or WAIVED when tray_count == 0)"
          - "increment Vendor.late_fee_balance_cents by assessed_late_fee_cents"
          - "recompute both Vendor compliance-score variants"
          - "recompute SurgicalCase.implant_readiness_status (a REJECTED_LATE set forces BLOCKED)"
        note: "Fork: the same trigger reaches three different states purely on the current-basis late minutes."
      - from: DELIVERED_LATE
        to: DELIVERED_ON_TIME
        trigger: "POST /vendor-access/surgical-cases/{id}/reschedule (the new start pushes required_delivery_deadline_utc past delivered_at_utc)"
        actor: system
        preconditions:
          - "recomputed late_minutes_current_basis == 0"
        side_effects:
          - "set late_minutes_current_basis = 0; late_minutes_pinned_basis is retained unchanged"
          - "if fee_status == ASSESSED then fee_status = REVERSED and Vendor.late_fee_balance_cents is debited by assessed_late_fee_cents; assessed_late_fee_cents is retained as the historical assessment"
          - "recompute both Vendor compliance-score variants and SurgicalCase.implant_readiness_status"
      - from: REJECTED_LATE
        to: DELIVERED_LATE
        trigger: "POST /vendor-access/surgical-cases/{id}/reschedule (the new deadline brings late minutes back inside the 120-minute grace)"
        actor: system
        preconditions:
          - "0 < recomputed late_minutes_current_basis <= HARD_REJECT_GRACE_MINUTES"
        side_effects:
          - "re-derive assessed_late_fee_cents from the new late_minutes_current_basis and adjust Vendor.late_fee_balance_cents by the delta"
          - "recompute SurgicalCase.implant_readiness_status"
      - from: DELIVERED_ON_TIME
        to: RELEASED_TO_OR
        trigger: "POST /vendor-access/loaner-sets/{id}/release"
        actor: SterileProcessingTech
        preconditions:
          - "LoanerSet.status == DELIVERED_ON_TIME"
          - "the referenced ApprovedProduct.status == ACTIVE (guarded cross-entity precondition)"
          - "Vendor.late_fee_balance_cents < FEE_HOLD_THRESHOLD_CENTS"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status (READY once every set of the case is RELEASED_TO_OR)"
      - from: DELIVERED_LATE
        to: RELEASED_TO_OR
        trigger: "POST /vendor-access/loaner-sets/{id}/release"
        actor: SterileProcessingTech
        preconditions:
          - "LoanerSet.status == DELIVERED_LATE"
          - "the referenced ApprovedProduct.status == ACTIVE"
          - "Vendor.late_fee_balance_cents < FEE_HOLD_THRESHOLD_CENTS"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status"
        note: "Join: both DELIVERED_ON_TIME and DELIVERED_LATE converge on RELEASED_TO_OR; REJECTED_LATE cannot."
      - from: EXPECTED
        to: HELD
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED against the set's ApprovedProduct)"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct moved ACTIVE -> SUSPENDED with suspended_reason = INCIDENT_SUBSTANTIATED"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status (BLOCKED)"
      - from: DELIVERED_ON_TIME
        to: HELD
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED against the set's ApprovedProduct)"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct moved ACTIVE -> SUSPENDED with suspended_reason = INCIDENT_SUBSTANTIATED"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status (BLOCKED)"
      - from: DELIVERED_LATE
        to: HELD
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED against the set's ApprovedProduct)"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct moved ACTIVE -> SUSPENDED with suspended_reason = INCIDENT_SUBSTANTIATED"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status (BLOCKED)"
      - from: HELD
        to: EXPECTED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED) releasing the product suspension"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct returned to ACTIVE"
          - "LoanerSet.delivered_at_utc == null"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status"
      - from: HELD
        to: DELIVERED_LATE
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED) releasing the product suspension"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct returned to ACTIVE"
          - "LoanerSet.delivered_at_utc != null AND late_minutes_current_basis > 0"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status"
      - from: HELD
        to: DELIVERED_ON_TIME
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED) releasing the product suspension"
        actor: system
        preconditions:
          - "the referenced ApprovedProduct returned to ACTIVE"
          - "LoanerSet.delivered_at_utc != null AND late_minutes_current_basis == 0"
        side_effects:
          - "recompute SurgicalCase.implant_readiness_status"

  # --- PARALLEL: KioskCheckIn carries two independent state dimensions.
  #     Dimension 1 = badge_status (physical badge lifecycle). ---------------
  - entity: KioskCheckIn
    initial_state: ISSUED
    terminal_states: [CHECKED_OUT, EXPIRED, VOIDED]
    state_field: badge_status
    transitions:
      - from: ISSUED
        to: CHECKED_OUT
        trigger: "POST /vendor-access/kiosk-check-ins/{id}/check-out"
        actor: VendorRepUser | ORCoordinator
        preconditions:
          - "badge_status == ISSUED"
        side_effects:
          - "set checked_out_at_utc = logical clock now"
          - "if escort_status == ESCORT_ATTACHED then escort_status moves to ESCORT_RELEASED (the only place the two dimensions interact)"
      - from: ISSUED
        to: EXPIRED
        trigger: "ComplianceSweep phase 5"
        actor: system
        preconditions:
          - "valid_until_utc <= sweep.swept_at_utc"
        side_effects:
          - "increment ComplianceSweep.badges_expired_count"
          - "escort_status is left exactly as it was — badge expiry does not touch the escort dimension"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /vendor-access/case-rep-authorizations/{id}/revoke, ComplianceSweep phase 4, POST /vendor-access/vendor-reps/{id}/revoke-access, or POST /vendor-access/surgical-cases/{id}/cancel"
        actor: system
        preconditions:
          - "the owning CaseRepAuthorization moved to REVOKED"
        side_effects:
          - "increment ComplianceSweep.badges_voided_count when the void happened inside a sweep"
          - "escort_status is left unchanged"

  # --- PARALLEL dimension 2 = escort_status (department escort rules). ------
  - entity: KioskCheckIn
    initial_state: ESCORT_PENDING
    terminal_states: [ESCORT_NOT_REQUIRED, ESCORT_RELEASED]
    state_field: escort_status
    transitions:
      - from: ESCORT_PENDING
        to: ESCORT_ATTACHED
        trigger: "POST /vendor-access/kiosk-check-ins/{id}/attach-escort"
        actor: ORCoordinator
        preconditions:
          - "escort_status == ESCORT_PENDING"
          - "badge_status == ISSUED"
        side_effects:
          - "set escort_user_id = escort_user_id from the body, escort_attached_at_utc = logical clock now"
          - "badge_status is left unchanged at ISSUED"
      - from: ESCORT_ATTACHED
        to: ESCORT_RELEASED
        trigger: "POST /vendor-access/kiosk-check-ins/{id}/check-out"
        actor: VendorRepUser | ORCoordinator
        preconditions:
          - "escort_status == ESCORT_ATTACHED"
        side_effects:
          - "released together with the badge_status ISSUED -> CHECKED_OUT transition"
        note: "Initial value is ESCORT_NOT_REQUIRED (already terminal) when CaseRepAuthorization.escort_required is false, otherwise ESCORT_PENDING."

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    state_field: status
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /vendor-access/incidents/{id}/investigate"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status == REPORTED"
        side_effects:
          - "no score change: the provisional variant already counts REPORTED and UNDER_INVESTIGATION incidents at full weight"
      - from: REPORTED
        to: SUBSTANTIATED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED)"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status IN {REPORTED, UNDER_INVESTIGATION}"
          - "X-User-ID != Incident.reported_by_user_id (segregation of duties)"
        side_effects:
          - "set adjudicated_outcome = SUBSTANTIATED, adjudicated_by_user_id = X-User-ID, adjudicated_at_utc = logical clock now"
          - "recompute both Vendor compliance-score variants (the adjudicated variant now counts this incident)"
          - "CASCADE HOP: if approved_product_id is set, that ApprovedProduct moves ACTIVE -> SUSPENDED with suspended_reason = INCIDENT_SUBSTANTIATED"
          - "CASCADE HOP: that product's LoanerSet rows in {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE} move to HELD"
          - "CASCADE HOP: each owning SurgicalCase recomputes implant_readiness_status to BLOCKED"
          - "CASCADE HOP: if incident_type == UNAPPROVED_PRODUCT_USE and severity == CRITICAL, the reported VendorRep moves CREDENTIALED -> SUSPENDED (suspension_reason = INCIDENT_SUBSTANTIATED), which itself cascades to authorizations and badges"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=SUBSTANTIATED)"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status IN {REPORTED, UNDER_INVESTIGATION}"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "identical to the REPORTED -> SUBSTANTIATED side-effect set"
      - from: REPORTED
        to: UNSUBSTANTIATED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED)"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status IN {REPORTED, UNDER_INVESTIGATION}"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "set adjudicated_outcome = UNSUBSTANTIATED, adjudicated_by_user_id = X-User-ID, adjudicated_at_utc = logical clock now"
          - "recompute both Vendor compliance-score variants (the provisional variant drops this incident's weight; the adjudicated variant never carried it)"
          - "CASCADE HOP: a product suspended by this incident returns to ACTIVE and its HELD loaner sets return to their delivery branch"
      - from: UNDER_INVESTIGATION
        to: UNSUBSTANTIATED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED)"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status IN {REPORTED, UNDER_INVESTIGATION}"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "identical to the REPORTED -> UNSUBSTANTIATED side-effect set"
      - from: SUBSTANTIATED
        to: UNSUBSTANTIATED
        trigger: "POST /vendor-access/incidents/{id}/adjudicate (outcome=UNSUBSTANTIATED) reversing an earlier substantiation"
        actor: ComplianceAdmin
        preconditions:
          - "Incident.status == SUBSTANTIATED (a SUBSTANTIATED incident may only be re-adjudicated to UNSUBSTANTIATED; a second SUBSTANTIATED outcome is ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID != Incident.reported_by_user_id"
        side_effects:
          - "set adjudicated_outcome = UNSUBSTANTIATED, adjudicated_by_user_id = X-User-ID, adjudicated_at_utc = logical clock now"
          - "recompute both Vendor compliance-score variants (the adjudicated variant drops this incident's weight; the provisional variant never carried it once it was adjudicated)"
          - "CASCADE HOP: a product this incident suspended returns SUSPENDED -> ACTIVE with suspended_reason = NONE"
          - "CASCADE HOP: that product's HELD LoanerSet rows return to the delivery branch their late minutes imply, and each owning SurgicalCase recomputes implant_readiness_status"
          - "CASCADE HOP: a VendorRep this incident suspended is NOT reinstated here — reinstatement stays with credential verification, ComplianceSweep phase 3 and appeal overturn"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "ComplianceSweep phase 7"
        actor: system
        preconditions:
          - "adjudicated_at_utc + INCIDENT_CLOSE_DAYS (30 days) <= sweep.swept_at_utc"
        side_effects:
          - "increment ComplianceSweep.incidents_closed_count"
          - "the incident keeps its score_weight — CLOSED SUBSTANTIATED incidents still count in the adjudicated variant"
      - from: UNSUBSTANTIATED
        to: CLOSED
        trigger: "ComplianceSweep phase 7"
        actor: system
        preconditions:
          - "adjudicated_at_utc + INCIDENT_CLOSE_DAYS (30 days) <= sweep.swept_at_utc"
        side_effects:
          - "increment ComplianceSweep.incidents_closed_count"

  - entity: AccessAppeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED]
    state_field: status
    transitions:
      - from: SUBMITTED
        to: UPHELD
        trigger: "POST /vendor-access/access-appeals/{id}/decide (decision=UPHOLD)"
        actor: ComplianceAdmin | CredentialingOfficer
        preconditions:
          - "AccessAppeal.status == SUBMITTED"
          - "X-User-ID != VendorRep.revoked_by_user_id (segregation of duties)"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at_utc = logical clock now, decision_rationale from the body"
          - "VendorRep.access_status stays REVOKED"
      - from: SUBMITTED
        to: OVERTURNED
        trigger: "POST /vendor-access/access-appeals/{id}/decide (decision=OVERTURN)"
        actor: ComplianceAdmin | CredentialingOfficer
        preconditions:
          - "AccessAppeal.status == SUBMITTED"
          - "X-User-ID != VendorRep.revoked_by_user_id"
        side_effects:
          - "set decided_by_user_id = X-User-ID, decided_at_utc = logical clock now, decision_rationale from the body"
          - "CASCADE HOP: VendorRep leaves REVOKED — to CREDENTIALED when its recomputed credential_posture is COMPLIANT or EXPIRING_SOON, otherwise to SUSPENDED with suspension_reason = CREDENTIAL_LAPSED"
          - "set VendorRep.reinstated_at_utc = logical clock now"

# =============================================================================
# 1.2.1 Concurrency Control Rules
# =============================================================================
concurrency_rules:
  - rule_id: pir-create-stale-vendor
    parent_entity: Vendor
    child_entity: ProductIntroductionRequest
    write_endpoint: "POST /vendor-access/product-introduction-requests"
    occ_field: expected_vendor_version
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412
    description: >
      A product introduction request is authored against a snapshot of the vendor's
      compliance posture (compliance_status, late_fee_balance_cents, open_pir_count).
      The caller must echo the Vendor.version it read. If any earlier write moved the
      vendor forward — a substantiated incident rescoring it, a late loaner fee, a
      completed sweep, or an earlier request that this one supersedes — the echoed
      version no longer matches and the create is refused with ERR_STALE_VENDOR_VERSION
      (412). A successful create increments Vendor.version by 1, so a caller that
      submits two requests must re-read the vendor between them.
  - rule_id: loaner-set-register-stale-case
    parent_entity: SurgicalCase
    child_entity: LoanerSet
    write_endpoint: "POST /vendor-access/loaner-sets"
    occ_field: expected_case_version
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    description: >
      Registering a loaner set pins both delivery deadlines off the case schedule, so the
      caller must echo the SurgicalCase.version it read. A reschedule increments the case
      version, which means a set registered against a pre-reschedule read would pin the
      wrong deadline; that write is refused with ERR_STALE_CASE_VERSION (412). A successful
      registration increments SurgicalCase.version by 1, so registering a second tray set
      for the same case requires re-reading the case.

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: rep_credential_posture
    trigger: >
      Recomputed whenever a Credential of the rep changes status (POST /vendor-access/credentials,
      POST /vendor-access/credentials/{id}/decide) and in ComplianceSweep phase 3 after credential
      expiry processing. Read back on GET /vendor-access/vendor-reps/{id}.
    algorithm: threshold
    formula: |
      covered_types = { c.credential_type
                        for c in credentials(rep)
                        if c.status IN {VERIFIED, EXPIRING_SOON} }
      missing_types = REQUIRED_CREDENTIAL_TYPES - covered_types
      if missing_types is non-empty:
          posture = LAPSED   if rep.ever_credentialed else INCOMPLETE
      elif any(c.status == EXPIRING_SOON
               for c in credentials(rep)
               if c.credential_type IN REQUIRED_CREDENTIAL_TYPES):
          posture = EXPIRING_SOON
      else:
          posture = COMPLIANT
    input_set: >
      Credential rows of the rep whose status is VERIFIED or EXPIRING_SOON. Rows in
      PENDING_VERIFICATION, REJECTED and EXPIRED never cover their type. A type covered by two
      rows (one EXPIRING_SOON, one VERIFIED) counts as covered, and the EXPIRING_SOON row still
      forces the EXPIRING_SOON posture.
    constants:
      REQUIRED_CREDENTIAL_TYPES: [IMMUNIZATION_INFLUENZA, TRAINING_BLOODBORNE_PATHOGENS, BACKGROUND_CHECK, COI_GIFT_ATTESTATION]
    precision: "exact set arithmetic; no numeric rounding"

  - name: badge_validity_window
    trigger: >
      Computed when a CaseRepAuthorization is APPROVED (POST /vendor-access/case-rep-authorizations/{id}/decide)
      and recomputed for every APPROVED authorization of a case on POST /vendor-access/surgical-cases/{id}/reschedule.
    algorithm: interval_merge
    formula: |
      badge_window_start_utc = case.scheduled_start_utc - facility.badge_lead_minutes minutes
      badge_window_end_utc   = case.scheduled_end_utc   + facility.badge_grace_minutes minutes
      # kiosk check-in admissibility (inclusive on both ends):
      check_in_allowed = badge_window_start_utc <= now <= badge_window_end_utc
      # rep double-booking test uses HALF-OPEN windows so adjacency is legal:
      windows_conflict(a, b) = a.start < b.end AND b.start < a.end
    input_set: >
      For the conflict test: the rep's other CaseRepAuthorization rows with status == APPROVED,
      compared in created_at ASC order. REQUESTED, DENIED and REVOKED authorizations never conflict.
    constants:
      BADGE_LEAD_MINUTES_SOURCE: "Facility.badge_lead_minutes (default 60)"
      BADGE_GRACE_MINUTES_SOURCE: "Facility.badge_grace_minutes (default 30)"
    precision: "whole minutes; instants compared at second resolution"

  - name: loaner_delivery_deadline
    trigger: >
      Both variants computed on POST /vendor-access/loaner-sets; the current_basis variant is
      recomputed on every POST /vendor-access/surgical-cases/{id}/reschedule while the pinned_basis
      variant is written exactly once and never recomputed.
    algorithm: threshold
    formula: |
      tray_surcharge_hours = 0 if tray_count <= 4
                             1 if 5 <= tray_count <= 12
                             2 if tray_count >= 13
      turnaround_hours = facility.spd_turnaround_hours
                         + COMPLEXITY_HOURS[loaner_set.reprocessing_complexity]
                         + tray_surcharge_hours
      lead_hours = max(turnaround_hours,
                       IMPLANT_MIN_LEAD_HOURS if case.implant_required else 0)
      deadline = basis_start_utc - lead_hours hours
    input_set: >
      The owning SurgicalCase and its Facility, plus the set's own tray_count and
      reprocessing_complexity. tray_count == 0 still produces a deadline (surcharge 0).
    constants:
      COMPLEXITY_HOURS: { SIMPLE: 2, COMPLEX: 6, IMPLANT_SPECIALTY: 10 }
      TRAY_SURCHARGE_HOURS: "<=4 -> 0; 5-12 -> 1; >=13 -> 2"
      IMPLANT_MIN_LEAD_HOURS: 24
    precision: "whole hours subtracted from the basis instant; result stored as an ISO-8601 UTC instant"
    variants:
      - name: pinned_basis
        when: "written once at POST /vendor-access/loaner-sets into pinned_deadline_utc"
        difference: >
          basis_start_utc = case.original_scheduled_start_utc, i.e. the schedule as it stood the
          first time the case was created. Never recomputed, so a reschedule leaves it untouched and
          it remains the audit basis for late_minutes_pinned_basis.
      - name: current_basis
        when: "written at registration into required_delivery_deadline_utc and recomputed on every reschedule"
        difference: >
          basis_start_utc = case.scheduled_start_utc, i.e. the live schedule. This is the only
          variant that gates the DELIVERED_ON_TIME / DELIVERED_LATE / REJECTED_LATE fork and the
          only one that feeds the late fee.

  - name: loaner_late_minutes
    trigger: "POST /vendor-access/loaner-sets/{id}/receive, and again on POST /vendor-access/surgical-cases/{id}/reschedule for any delivered set."
    algorithm: threshold
    formula: |
      late_minutes(basis_deadline) = max(0, floor((delivered_at_utc - basis_deadline) / 60 seconds))
      late_minutes_pinned_basis  = late_minutes(pinned_deadline_utc)
      late_minutes_current_basis = late_minutes(required_delivery_deadline_utc)
      # branch selection uses the CURRENT basis only:
      branch = DELIVERED_ON_TIME  if late_minutes_current_basis == 0
               DELIVERED_LATE     if 0 < late_minutes_current_basis <= HARD_REJECT_GRACE_MINUTES
               REJECTED_LATE      if late_minutes_current_basis > HARD_REJECT_GRACE_MINUTES
    input_set: "the set's delivered_at_utc against each of the two deadline variants"
    constants:
      HARD_REJECT_GRACE_MINUTES: 120
    precision: >
      Truncate toward zero at whole minutes: a delivery 59 seconds past the deadline is 0 late
      minutes. delivered_at_utc exactly equal to the deadline is on time (0 minutes).

  - name: loaner_late_fee
    trigger: "POST /vendor-access/loaner-sets/{id}/receive, and re-derived when a reschedule moves the set between delivery branches."
    algorithm: tiered_pricing
    formula: |
      # PINNED ORDER: round the per-tray charge FIRST, then multiply by tray_count, then cap.
      per_tray_cents = round_half_up(
          late_minutes_current_basis
          * PER_TRAY_BASE_RATE_CENTS_PER_MINUTE
          * COMPLEXITY_FEE_MULTIPLIER[reprocessing_complexity],
          0)
      raw_fee_cents = per_tray_cents * tray_count
      assessed_late_fee_cents = min(raw_fee_cents, LATE_FEE_CAP_CENTS)
      fee_status = NONE     if late_minutes_current_basis == 0
                   WAIVED   if tray_count == 0
                   ASSESSED  otherwise
    input_set: >
      One LoanerSet in DELIVERED_LATE or REJECTED_LATE. Sets in DELIVERED_ON_TIME contribute 0 and
      carry fee_status NONE. Reversed fees keep assessed_late_fee_cents but drop out of the
      Vendor.late_fee_balance_cents sum.
    constants:
      PER_TRAY_BASE_RATE_CENTS_PER_MINUTE: 2.5
      COMPLEXITY_FEE_MULTIPLIER: { SIMPLE: 1.0, COMPLEX: 1.35, IMPLANT_SPECIALTY: 1.75 }
      LATE_FEE_CAP_CENTS: 250000
    precision: >
      round_half_up to whole cents, applied to the PER-TRAY charge before multiplication. Rounding
      after the multiplication (sum-then-round) yields a different integer for most inputs and is wrong.

  - name: spd_bay_occupation
    trigger: "POST /vendor-access/loaner-sets (capacity admission check), and re-evaluated for reporting on POST /vendor-access/surgical-cases/{id}/reschedule."
    algorithm: interval_merge
    formula: |
      occupation(set) = [ set.required_delivery_deadline_utc , set.case.scheduled_start_utc ]   # CLOSED interval
      buffered(set)   = [ occupation(set).start - SPD_BAY_BUFFER_MINUTES ,
                          occupation(set).end   + SPD_BAY_BUFFER_MINUTES ]
      collides(candidate, existing) =
          buffered(existing).start <= occupation(candidate).end
          AND occupation(candidate).start <= buffered(existing).end     # inclusive on both ends
      overlap_count = count(existing sets at the same facility, in created_at ASC order,
                            with status IN {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE, HELD},
                            where collides(candidate, existing))
      reject with ERR_SPD_BAY_CAPACITY_EXCEEDED when overlap_count >= facility.spd_bay_count
    input_set: >
      LoanerSet rows whose SurgicalCase belongs to the same Facility and whose status is in
      {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE, HELD}. RELEASED_TO_OR and REJECTED_LATE sets have
      left the bay and never count.
    constants:
      SPD_BAY_BUFFER_MINUTES: 30
      SPD_BAY_COUNT_SOURCE: "Facility.spd_bay_count (default 2)"
    precision: >
      Closed intervals with a 30-minute buffer on both sides of the EXISTING set only; touching
      endpoints DO collide. This is deliberately stricter than half-open adjacency: two sets whose
      raw occupations merely touch are rejected once the buffer is applied.

  - name: vendor_compliance_score
    trigger: >
      Recomputed on POST /vendor-access/incidents, POST /vendor-access/incidents/{id}/adjudicate,
      POST /vendor-access/loaner-sets/{id}/receive, POST /vendor-access/surgical-cases/{id}/reschedule
      (when a set changes branch) and in ComplianceSweep phase 8. Read on GET /vendor-access/vendors/{id}
      and GET /vendor-access/vendors/{id}/scorecard.
    algorithm: weighted_scoring
    formula: |
      incident_penalty = sum over counted incidents of
                           W_INCIDENT_MINOR    if severity == MINOR
                           W_INCIDENT_MAJOR    if severity == MAJOR
                           W_INCIDENT_CRITICAL if severity == CRITICAL
      late_penalty       = W_LATE_DELIVERY * count(LoanerSets of this vendor with
                              status IN {DELIVERED_LATE, REJECTED_LATE} AND fee_status != REVERSED)
      lapsed_rep_penalty = W_LAPSED_REP * lapsed_rep_count_at_last_sweep
      overage_penalty    = W_UTILIZATION_OVERAGE if utilization_ratio_at_last_sweep > 1.0 else 0
      score = clamp(BASE_SCORE - incident_penalty - late_penalty
                                - lapsed_rep_penalty - overage_penalty,
                    SCORE_FLOOR, SCORE_CEILING)
    input_set: >
      Incidents whose vendor_rep_id belongs to this vendor, plus that vendor's LoanerSet rows.
      lapsed_rep_count and utilization_ratio are refreshed ONLY inside ComplianceSweep phase 8 and are
      held constant between sweeps, which keeps Vendor.version stable during ordinary credentialing work.
    constants:
      BASE_SCORE: 100
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      W_INCIDENT_MINOR: 3
      W_INCIDENT_MAJOR: 8
      W_INCIDENT_CRITICAL: 20
      W_LATE_DELIVERY: 5
      W_LAPSED_REP: 6
      W_UTILIZATION_OVERAGE: 12
    precision: "integer arithmetic throughout; clamped to [0, 100] AFTER all penalties are subtracted, never per-term"
    variants:
      - name: provisional_scorecard
        when: "stored in Vendor.provisional_compliance_score; the number a coordinator sees while investigations are open"
        difference: >
          Counts an incident when its status IN {REPORTED, UNDER_INVESTIGATION} (unadjudicated, at
          full severity weight) OR its adjudicated_outcome == SUBSTANTIATED. An incident adjudicated
          UNSUBSTANTIATED drops out entirely, so the provisional score RISES when an investigation clears.
      - name: adjudicated_scorecard
        when: "stored in Vendor.adjudicated_compliance_score; the number that drives scorecard_tier, access_quota_in_effect and compliance_status in ComplianceSweep phase 8"
        difference: >
          Counts an incident ONLY when adjudicated_outcome == SUBSTANTIATED, regardless of whether the
          incident is still open or already CLOSED. Freshly reported incidents contribute nothing, so
          for identical data the adjudicated score is always >= the provisional score.

  - name: vendor_scorecard_tier_and_quota
    trigger: "ComplianceSweep phase 8 only (POST /vendor-access/compliance-sweeps). No other endpoint may change scorecard_tier, access_quota_in_effect, authorizations_used_epoch or compliance_status."
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER — the quota is both an input to and an output of this step,
      # so the order below is normative and any other order gives a different score.
      1. quota_in_effect := vendor.access_quota_in_effect AS READ BEFORE THIS SWEEP (pre-sweep value)
      2. utilization_ratio := round_half_up(vendor.authorizations_used_epoch / quota_in_effect, 4)
      3. overage_penalty := W_UTILIZATION_OVERAGE if utilization_ratio > 1.0 else 0
      4. adjudicated_score := vendor_compliance_score[adjudicated_scorecard] USING overage_penalty from step 3
      5. scorecard_tier := TIER_PLATINUM if adjudicated_score >= TIER_PLATINUM_MIN_SCORE
                           TIER_STANDARD if adjudicated_score >= TIER_STANDARD_MIN_SCORE
                           TIER_PROBATION otherwise
      6. access_quota_in_effect := max(1, floor(quota_in_effect * TIER_STEP[scorecard_tier]))
      7. authorizations_used_epoch := 0        # epoch reset, AFTER the ratio was taken
      8. compliance_status := BARRED            if adjudicated_score < 40
                              PROBATION         if adjudicated_score < 70
                              WATCH             if adjudicated_score < 85
                              IN_GOOD_STANDING  otherwise
         vendor.last_sweep_epoch := sweep.epoch_number
    input_set: >
      Every Vendor row is rescored on every sweep, processed in Vendor created_at ASC order.
      lapsed_rep_count for step 4 is the number of this vendor's reps whose credential_posture is
      LAPSED after sweep phase 3.
    constants:
      BASE_QUOTA: 4
      QUOTA_HARD_MULTIPLIER: 1.5
      TIER_STEP: { TIER_PLATINUM: 1.5, TIER_STANDARD: 1.0, TIER_PROBATION: 0.4 }
      TIER_PLATINUM_MIN_SCORE: 90
      TIER_STANDARD_MIN_SCORE: 70
      W_UTILIZATION_OVERAGE: 12
      COMPLIANCE_STATUS_BANDS: "<40 BARRED; 40-69 PROBATION; 70-84 WATCH; >=85 IN_GOOD_STANDING"
    precision: >
      utilization_ratio at 4 decimal places, round_half_up. The new quota uses floor() and a hard
      floor of 1 so a probation vendor never reaches zero access. Reading the quota after step 6, or
      resetting authorizations_used_epoch before step 2, changes the observable score.

  - name: vendor_access_quota_admission
    trigger: "POST /vendor-access/case-rep-authorizations/{id}/decide (decision=APPROVE)"
    algorithm: threshold
    formula: |
      hard_cap = floor(vendor.access_quota_in_effect * QUOTA_HARD_MULTIPLIER)
      reject with ERR_VENDOR_ACCESS_QUOTA_EXCEEDED when vendor.authorizations_used_epoch >= hard_cap
      # otherwise approve and increment authorizations_used_epoch by 1
    input_set: >
      The counter Vendor.authorizations_used_epoch, which counts APPROVED CaseRepAuthorization rows
      stamped with epoch_number == Vendor.last_sweep_epoch. Revocation decrements it, so a revoked
      authorization frees its slot.
    constants:
      QUOTA_HARD_MULTIPLIER: 1.5
    precision: >
      Soft gate: because the cap is 1.5x the quota, authorizations_used_epoch can legitimately exceed
      access_quota_in_effect, which is what makes utilization_ratio > 1.0 reachable at sweep time.
      With quota 4 the cap is 6, so the 7th approval in an epoch is the first refusal.

  - name: case_vendor_coverage_status
    trigger: >
      Recomputed whenever a CaseRepAuthorization of the case is APPROVED or REVOKED, whenever a
      covering rep's credential_posture changes, and in ComplianceSweep phase 4.
    algorithm: projection
    formula: |
      approved = authorizations(case) with status == APPROVED
      if not case.implant_required and len(approved) == 0: NOT_REQUIRED
      elif case.implant_required and len(approved) == 0:   UNCOVERED
      elif any(a.rep.credential_posture == EXPIRING_SOON for a in approved)
           or case.revoked_authorization_count >= 1:       AT_RISK
      else:                                               COVERED
    input_set: "CaseRepAuthorization rows of the case with status == APPROVED, plus their reps' postures and the case's revoked_authorization_count"
    constants: {}
    precision: "pure enum derivation; evaluated top-to-bottom so UNCOVERED wins over AT_RISK when nothing is approved"

  - name: case_implant_readiness_status
    trigger: >
      Recomputed on POST /vendor-access/loaner-sets, POST /vendor-access/loaner-sets/{id}/receive,
      POST /vendor-access/loaner-sets/{id}/release, POST /vendor-access/incidents/{id}/adjudicate and
      POST /vendor-access/surgical-cases/{id}/reschedule.
    algorithm: projection
    formula: |
      sets = loaner_sets(case)
      if not case.implant_required:                                  NOT_APPLICABLE
      elif any(s.status IN {HELD, REJECTED_LATE} for s in sets):     BLOCKED
      elif len(sets) >= 1 and all(s.status == RELEASED_TO_OR):       READY
      else:                                                          PENDING
    input_set: "all LoanerSet rows of the case regardless of status"
    constants: {}
    precision: >
      BLOCKED is checked before READY, so one held tray set blocks a case whose other sets are all
      released. A case with implant_required = true and zero sets is PENDING, never READY.

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:

  # --- 1-2: authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the authenticated role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # --- 3-4: request well-formedness -----------------------------------------
  - priority: 3
    category: business_constraint
    check: "all required body fields present, correct JSON types, enum values within the declared domain, integers within their declared ranges, ISO-8601 UTC instants parseable, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "any pair of instants supplied together is correctly ordered: SurgicalCase scheduled_end_utc > scheduled_start_utc (create and reschedule), Credential expires_at_utc > issued_at_utc"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /vendor-access/surgical-cases, POST /vendor-access/surgical-cases/{id}/reschedule, POST /vendor-access/credentials"

  # --- 5-6: existence --------------------------------------------------------
  - priority: 5
    category: existence
    check: "every resource named in the path exists, validated left to right"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_VENDOR_REP_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_SURGICAL_CASE_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_PIR_NOT_FOUND | ERR_APPROVED_PRODUCT_NOT_FOUND | ERR_LOANER_SET_NOT_FOUND | ERR_CHECK_IN_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body references an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_VENDOR_REP_NOT_FOUND | ERR_SURGICAL_CASE_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_PIR_NOT_FOUND | ERR_APPROVED_PRODUCT_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key in the body"

  # --- 7: vendor scoping -----------------------------------------------------
  - priority: 7
    category: auth
    check: "a VendorAdmin may only act on its own Vendor's rows (X-User-ID equals the Vendor.id reached through the resource's vendor_id), and a VendorRepUser may only act on its own VendorRep rows (X-User-ID equals the VendorRep.id)"
    error_id: ERR_VENDOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /vendor-access/product-introduction-requests, POST /vendor-access/product-introduction-requests/{id}/submit, POST /vendor-access/case-rep-authorizations, POST /vendor-access/kiosk-check-ins, POST /vendor-access/kiosk-check-ins/{id}/check-out, POST /vendor-access/access-appeals, GET /vendor-access/vendors/{id}/scorecard"

  # --- 8-9: optimistic concurrency (before any state or business check) ------
  - priority: 8
    category: state
    check: "expected_vendor_version equals the current Vendor.version"
    error_id: ERR_STALE_VENDOR_VERSION
    http_status: 412
    applies_to: "POST /vendor-access/product-introduction-requests"

  - priority: 9
    category: state
    check: "expected_case_version equals the current SurgicalCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /vendor-access/loaner-sets"

  # --- 10-22: state preconditions -------------------------------------------
  - priority: 10
    category: state
    check: "the acting or referenced VendorRep.access_status is not REVOKED"
    error_id: ERR_REP_ACCESS_REVOKED
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations, POST /vendor-access/kiosk-check-ins, POST /vendor-access/kiosk-check-ins/{id}/check-out, POST /vendor-access/credentials"

  - priority: 11
    category: state
    check: "the referenced VendorRep.access_status is not SUSPENDED"
    error_id: ERR_REP_ACCESS_SUSPENDED
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide, POST /vendor-access/kiosk-check-ins"

  - priority: 12
    category: state
    check: "Credential.status == PENDING_VERIFICATION"
    error_id: ERR_CREDENTIAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /vendor-access/credentials/{id}/decide"

  - priority: 13
    category: state
    check: "CaseRepAuthorization.status == REQUESTED"
    error_id: ERR_AUTHORIZATION_NOT_REQUESTED
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide"

  - priority: 14
    category: state
    check: "CaseRepAuthorization.status == APPROVED"
    error_id: ERR_AUTHORIZATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/revoke, POST /vendor-access/kiosk-check-ins"

  - priority: 15
    category: state
    check: "SurgicalCase.status IN {SCHEDULED, RESCHEDULED}"
    error_id: ERR_CASE_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /vendor-access/surgical-cases/{id}/reschedule, POST /vendor-access/surgical-cases/{id}/cancel, POST /vendor-access/case-rep-authorizations, POST /vendor-access/loaner-sets, POST /vendor-access/loaner-sets/{id}/receive"

  - priority: 16
    category: state
    check: "the ProductIntroductionRequest is in the state the requested step needs: DRAFT or CHANGES_REQUESTED for submit, CLINICAL_REVIEW for clinical-review, VALUE_ANALYSIS_REVIEW for value-analysis-decision"
    error_id: ERR_PIR_INVALID_STATE
    http_status: 409
    applies_to: "POST /vendor-access/product-introduction-requests/{id}/submit, POST /vendor-access/product-introduction-requests/{id}/clinical-review, POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision"

  - priority: 17
    category: state
    check: "LoanerSet.status == EXPECTED for receive, and IN {DELIVERED_ON_TIME, DELIVERED_LATE} for release"
    error_id: ERR_LOANER_SET_INVALID_STATE
    http_status: 409
    applies_to: "POST /vendor-access/loaner-sets/{id}/receive, POST /vendor-access/loaner-sets/{id}/release"

  - priority: 18
    category: state
    check: "KioskCheckIn.badge_status == ISSUED"
    error_id: ERR_CHECK_IN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /vendor-access/kiosk-check-ins/{id}/attach-escort, POST /vendor-access/kiosk-check-ins/{id}/check-out"

  - priority: 19
    category: state
    check: "KioskCheckIn.escort_status == ESCORT_PENDING"
    error_id: ERR_ESCORT_NOT_PENDING
    http_status: 409
    applies_to: "POST /vendor-access/kiosk-check-ins/{id}/attach-escort"

  - priority: 20
    category: state
    check: "Incident.status == REPORTED for investigate; for adjudicate the status is IN {REPORTED, UNDER_INVESTIGATION} for any outcome, plus SUBSTANTIATED when and only when outcome == UNSUBSTANTIATED (the substantiation-reversal path); a CLOSED incident and a second SUBSTANTIATED outcome are always refused"
    error_id: ERR_INCIDENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /vendor-access/incidents/{id}/investigate, POST /vendor-access/incidents/{id}/adjudicate"

  - priority: 21
    category: state
    check: "AccessAppeal.status == SUBMITTED"
    error_id: ERR_APPEAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /vendor-access/access-appeals/{id}/decide"

  - priority: 22
    category: state
    check: "VendorRep.access_status == REVOKED when filing an appeal"
    error_id: ERR_REP_NOT_REVOKED
    http_status: 409
    applies_to: "POST /vendor-access/access-appeals"

  # --- 23-25: business_safety (patient-safety and compliance gates first) ----
  - priority: 23
    category: business_safety
    check: "the acting X-User-ID differs from the counterparty user on the same record: the value-analysis approver is not the clinical sponsor, the incident adjudicator is not the reporter, the appeal decider is not the officer who revoked the rep, and the authorization decider is not its requester"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision, POST /vendor-access/incidents/{id}/adjudicate, POST /vendor-access/access-appeals/{id}/decide, POST /vendor-access/case-rep-authorizations/{id}/decide"

  - priority: 24
    category: business_safety
    check: "the VendorRep's recomputed credential_posture is COMPLIANT or EXPIRING_SOON (never INCOMPLETE or LAPSED)"
    error_id: ERR_REP_CREDENTIALS_NOT_COMPLIANT
    http_status: 422
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide, POST /vendor-access/kiosk-check-ins"

  - priority: 25
    category: business_safety
    check: "when CaseRepAuthorization.escort_required is true, an escort must be attached before the badge may be checked out"
    error_id: ERR_ESCORT_REQUIRED
    http_status: 422
    applies_to: "POST /vendor-access/kiosk-check-ins/{id}/check-out"

  # --- 26-29: business_temporal ---------------------------------------------
  - priority: 26
    category: business_temporal
    check: "the logical clock lies inside the authorization's badge window, inclusive of both endpoints: badge_window_start_utc <= now <= badge_window_end_utc"
    error_id: ERR_BADGE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /vendor-access/kiosk-check-ins"

  - priority: 27
    category: business_temporal
    check: "the appeal is filed no later than VendorRep.revoked_at_utc + APPEAL_WINDOW_DAYS (14 days); equality is still inside the window"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /vendor-access/access-appeals"

  - priority: 28
    category: business_temporal
    check: "the rep has no other APPROVED authorization whose half-open badge window [start, end) overlaps the badge window this approval would create; adjacency (one window's end equal to the next window's start) is legal"
    error_id: ERR_REP_BADGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide"

  - priority: 29
    category: business_temporal
    check: "the number of existing loaner sets at the facility whose buffered SPD occupation collides with the candidate's occupation is strictly less than Facility.spd_bay_count"
    error_id: ERR_SPD_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /vendor-access/loaner-sets"

  # --- 30-35: business_constraint (uniqueness, duplicates, loop bounds) -----
  - priority: 30
    category: business_constraint
    check: "no existing CaseRepAuthorization for the same (surgical_case_id, vendor_rep_id) pair with status IN {REQUESTED, APPROVED}"
    error_id: ERR_DUPLICATE_AUTHORIZATION
    http_status: 409
    applies_to: "POST /vendor-access/case-rep-authorizations"

  - priority: 31
    category: business_constraint
    check: "no existing Credential for the same (vendor_rep_id, credential_type) pair with status IN {PENDING_VERIFICATION, VERIFIED, EXPIRING_SOON}"
    error_id: ERR_DUPLICATE_CREDENTIAL
    http_status: 409
    applies_to: "POST /vendor-access/credentials"

  - priority: 32
    category: business_constraint
    check: "natural keys are unique: Facility.code, Vendor.vendor_code, SurgicalCase.case_number"
    error_id: "ERR_DUPLICATE_FACILITY_CODE | ERR_DUPLICATE_VENDOR_CODE | ERR_DUPLICATE_CASE_NUMBER"
    http_status: 409
    applies_to: "POST /vendor-access/facilities, POST /vendor-access/vendors, POST /vendor-access/surgical-cases"

  - priority: 33
    category: business_constraint
    check: "the authorization has no other KioskCheckIn with badge_status == ISSUED"
    error_id: ERR_CHECK_IN_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /vendor-access/kiosk-check-ins"

  - priority: 34
    category: business_constraint
    check: "the rep has no other AccessAppeal whose filed_for_revoked_at_utc equals the rep's current revoked_at_utc"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /vendor-access/access-appeals"

  - priority: 35
    category: business_constraint
    check: "ProductIntroductionRequest.revision_round < MAX_REVISION_ROUNDS (2) before a REQUEST_CHANGES decision or a re-submission is accepted"
    error_id: ERR_PIR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision, POST /vendor-access/product-introduction-requests/{id}/submit"

  # --- 36-37: business_referential -----------------------------------------
  - priority: 36
    category: business_referential
    check: "the referenced ApprovedProduct.status == ACTIVE (not SUSPENDED, not EXPIRED)"
    error_id: ERR_PRODUCT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /vendor-access/loaner-sets, POST /vendor-access/loaner-sets/{id}/release"

  - priority: 37
    category: business_referential
    check: "when SurgicalCase.implant_required is true, the rep's Vendor owns at least one ApprovedProduct with status == ACTIVE and is_implant == true"
    error_id: ERR_IMPLANT_REQUIRES_APPROVED_PRODUCT
    http_status: 422
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide"

  # --- 38-39: business_fiscal (quota and money checks last) -----------------
  - priority: 38
    category: business_fiscal
    check: "Vendor.authorizations_used_epoch < floor(Vendor.access_quota_in_effect * QUOTA_HARD_MULTIPLIER)"
    error_id: ERR_VENDOR_ACCESS_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide"

  - priority: 39
    category: business_fiscal
    check: "Vendor.late_fee_balance_cents < FEE_HOLD_THRESHOLD_CENTS (100000)"
    error_id: ERR_VENDOR_FEE_HOLD
    http_status: 402
    applies_to: "POST /vendor-access/case-rep-authorizations/{id}/decide, POST /vendor-access/loaner-sets/{id}/release"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Role shorthand used below: "ALL_ROLES" is written out explicitly on every
# endpoint — there is no macro. Read endpoints are open to all eight roles
# except GET /vendor-access/vendors/{id}/scorecard, which is restricted.
endpoints:

  # ---------------------------------------------------------------- Facility
  - method: POST
    path: "/vendor-access/facilities"
    description: "Register a hospital facility with its sterile-processing turnaround, bay count and badge window offsets."
    roles: [ComplianceAdmin, CredentialingOfficer]
    code: 201
    input: [name, code, spd_turnaround_hours, spd_bay_count, "badge_lead_minutes?", "badge_grace_minutes?", "restricted_escort_required?"]
    output: Facility
    side_effects:
      - "none beyond row creation; badge_lead_minutes defaults to 60, badge_grace_minutes to 30, restricted_escort_required to true"

  - method: GET
    path: "/vendor-access/facilities/{id}"
    description: "Read one facility."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ------------------------------------------------------------------ Vendor
  - method: POST
    path: "/vendor-access/vendors"
    description: "Enroll a medical device vendor company. Starts at score 100, TIER_PLATINUM, quota BASE_QUOTA (4), epoch 0."
    roles: [ComplianceAdmin, CredentialingOfficer]
    code: 201
    input: [legal_name, vendor_code]
    output: Vendor
    side_effects:
      - "initialise provisional_compliance_score = adjudicated_compliance_score = 100, scorecard_tier = TIER_PLATINUM, compliance_status = IN_GOOD_STANDING, access_quota_in_effect = BASE_QUOTA, authorizations_used_epoch = 0, late_fee_balance_cents = 0, open_pir_count = 0, last_sweep_epoch = 0"

  - method: GET
    path: "/vendor-access/vendors/{id}"
    description: "Read one vendor, including both compliance-score variants and the quota counters."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendor-access/vendors/{id}/scorecard"
    description: "Computed read: the vendor scorecard. Restricted to credentialing/compliance staff and the vendor itself; a VendorAdmin reading another vendor's scorecard gets ERR_VENDOR_SCOPE_VIOLATION."
    roles: [CredentialingOfficer, ComplianceAdmin, VendorAdmin]
    code: 200
    input: []
    output: "{ vendor_id: string, provisional_compliance_score: integer, adjudicated_compliance_score: integer, scorecard_tier: string, compliance_status: string, access_quota_in_effect: integer, authorizations_used_epoch: integer, utilization_ratio: number, late_fee_balance_cents: integer, lapsed_rep_count: integer, substantiated_incident_count: integer, open_incident_count: integer, late_delivery_count: integer, last_sweep_epoch: integer }"
    side_effects:
      - "read-only; utilization_ratio and lapsed_rep_count are derived live from the current counters and rep postures, so they may differ from the values frozen into the score at the last sweep"

  # --------------------------------------------------------------- VendorRep
  - method: POST
    path: "/vendor-access/vendor-reps"
    description: "Register a vendor representative. Starts PENDING_CREDENTIALING with credential_posture INCOMPLETE."
    roles: [VendorAdmin, CredentialingOfficer]
    code: 201
    input: [vendor_id, full_name, email]
    output: VendorRep
    side_effects:
      - "initialise access_status = PENDING_CREDENTIALING, credential_posture = INCOMPLETE, ever_credentialed = false, open_authorization_count = 0"

  - method: GET
    path: "/vendor-access/vendor-reps/{id}"
    description: "Read one vendor representative including access_status and credential_posture."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: VendorRep
    side_effects: []

  - method: GET
    path: "/vendor-access/vendor-reps"
    description: "List vendor representatives, filterable by vendor, access status and credential posture. Reverse-reachability channel for VendorRep.vendor_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["vendor_id?", "access_status?", "credential_posture?", "limit?", "offset?"]
    output: VendorRep[]
    side_effects: []

  - method: POST
    path: "/vendor-access/vendor-reps/{id}/revoke-access"
    description: "Revoke a representative's site access. Cascades to future authorizations and their issued badges."
    roles: [CredentialingOfficer, ComplianceAdmin]
    code: 200
    input: [reason]
    output: VendorRep
    side_effects:
      - "access_status -> REVOKED; revoked_by_user_id = X-User-ID; revoked_at_utc = logical clock now"
      - "APPROVED authorizations for cases starting at or after now -> REVOKED (revoked_reason = REP_REVOKED), in created_at ASC order"
      - "decrement Vendor.authorizations_used_epoch, VendorRep.open_authorization_count and SurgicalCase.approved_rep_count per revoked authorization; increment SurgicalCase.revoked_authorization_count"
      - "ISSUED KioskCheckIn badges of those authorizations -> VOIDED"
      - "recompute SurgicalCase.vendor_coverage_status for each affected case"

  - method: GET
    path: "/vendor-access/vendor-reps/{id}/credentials"
    description: "Sub-resource listing of a representative's credentials. Reverse-reachability channel for Credential.vendor_rep_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["credential_type?", "status?", "limit?", "offset?"]
    output: Credential[]
    side_effects: []

  - method: GET
    path: "/vendor-access/vendor-reps/{id}/access-appeals"
    description: "Sub-resource listing of a representative's revocation appeals. Reverse-reachability channel for AccessAppeal.vendor_rep_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccessAppeal[]
    side_effects: []

  # -------------------------------------------------------------- Credential
  - method: POST
    path: "/vendor-access/credentials"
    description: "Attest a credential (immunization, bloodborne-pathogens training, background check, or the combined conflict-of-interest and gift policy attestation). Lands in PENDING_VERIFICATION."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer]
    code: 201
    input: [vendor_rep_id, credential_type, issued_at_utc, expires_at_utc, document_reference]
    output: Credential
    side_effects:
      - "status = PENDING_VERIFICATION; the rep's credential_posture is NOT changed (a pending credential covers nothing)"

  - method: POST
    path: "/vendor-access/credentials/{id}/decide"
    description: "Credentialing officer verifies or rejects a pending credential. A verification may move the rep from PENDING_CREDENTIALING or SUSPENDED to CREDENTIALED."
    roles: [CredentialingOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Credential
    side_effects:
      - "decision VERIFY -> status VERIFIED, verified_by_user_id = X-User-ID, verified_at_utc = logical clock now"
      - "decision REJECT -> status REJECTED with rejection_reason"
      - "recompute VendorRep.credential_posture (calculations.rep_credential_posture)"
      - "apply the resulting VendorRep.access_status transition: PENDING_CREDENTIALING -> CREDENTIALED (sets ever_credentialed = true) or SUSPENDED -> CREDENTIALED when suspension_reason == CREDENTIAL_LAPSED (sets reinstated_at_utc)"

  # ------------------------------------------------------------ SurgicalCase
  - method: POST
    path: "/vendor-access/surgical-cases"
    description: "Schedule a surgical case at a facility. original_scheduled_start_utc is pinned to the initial start and never changes."
    roles: [ORCoordinator]
    code: 201
    input: [facility_id, case_number, procedure_name, scheduled_start_utc, scheduled_end_utc, "restriction_level?", "implant_required?"]
    output: SurgicalCase
    side_effects:
      - "original_scheduled_start_utc = scheduled_start_utc (pinned basis for loaner deadlines)"
      - "status = SCHEDULED; restriction_level defaults to STANDARD; implant_required defaults to false"
      - "vendor_coverage_status = UNCOVERED when implant_required else NOT_REQUIRED; implant_readiness_status = PENDING when implant_required else NOT_APPLICABLE"

  - method: GET
    path: "/vendor-access/surgical-cases/{id}"
    description: "Read one surgical case including the two derived coverage/readiness statuses and the OCC version."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []

  - method: GET
    path: "/vendor-access/surgical-cases"
    description: "List surgical cases. Reverse-reachability channel for SurgicalCase.facility_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["facility_id?", "status?", "vendor_coverage_status?", "implant_readiness_status?", "limit?", "offset?"]
    output: SurgicalCase[]
    side_effects: []

  - method: POST
    path: "/vendor-access/surgical-cases/{id}/reschedule"
    description: "Move a case. Recomputes badge windows, the current-basis loaner deadline and every derived delivery branch, while leaving the pinned basis untouched."
    roles: [ORCoordinator]
    code: 200
    input: [new_scheduled_start_utc, new_scheduled_end_utc]
    output: SurgicalCase
    side_effects:
      - "status -> RESCHEDULED; increment reschedule_count; increment version"
      - "recompute badge_window_start_utc / badge_window_end_utc for every APPROVED authorization and refresh valid_from_utc / valid_until_utc on every ISSUED badge"
      - "recompute required_delivery_deadline_utc (current basis only) for every LoanerSet in {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE, HELD}"
      - "re-derive late_minutes_current_basis and the delivery branch for delivered sets; a set that becomes on time flips fee_status ASSESSED -> REVERSED and debits Vendor.late_fee_balance_cents"
      - "recompute SurgicalCase.vendor_coverage_status, SurgicalCase.implant_readiness_status and both Vendor compliance-score variants for affected vendors"

  - method: POST
    path: "/vendor-access/surgical-cases/{id}/cancel"
    description: "Cancel a case. Denies outstanding requests, revokes approvals and voids issued badges."
    roles: [ORCoordinator]
    code: 200
    input: [cancellation_reason]
    output: SurgicalCase
    side_effects:
      - "status -> CANCELLED (terminal)"
      - "REQUESTED authorizations -> DENIED; APPROVED authorizations -> REVOKED with revoked_reason = CASE_CANCELLED, in created_at ASC order"
      - "counter decrements as for a manual revoke; ISSUED badges -> VOIDED"
      - "recompute vendor_coverage_status"

  # ------------------------------------------------- CaseRepAuthorization
  - method: POST
    path: "/vendor-access/case-rep-authorizations"
    description: "Request that a representative be authorized for a scheduled case. Lands in REQUESTED."
    roles: [VendorAdmin, ORCoordinator]
    code: 201
    input: [surgical_case_id, vendor_rep_id, requested_role]
    output: CaseRepAuthorization
    side_effects:
      - "status = REQUESTED; requested_by_user_id = X-User-ID; escort_required, badge windows and epoch_number stay null until the approval decision"

  - method: GET
    path: "/vendor-access/case-rep-authorizations/{id}"
    description: "Read one authorization including its badge window and epoch stamp."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: CaseRepAuthorization
    side_effects: []

  - method: GET
    path: "/vendor-access/case-rep-authorizations"
    description: "List authorizations. Reverse-reachability channel for both CaseRepAuthorization.surgical_case_id and CaseRepAuthorization.vendor_rep_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["surgical_case_id?", "vendor_rep_id?", "status?", "limit?", "offset?"]
    output: CaseRepAuthorization[]
    side_effects: []

  - method: POST
    path: "/vendor-access/case-rep-authorizations/{id}/decide"
    description: "Approve or deny a rep authorization. The approval path runs the full safety / temporal / referential / fiscal ladder and stamps the badge window."
    roles: [ORCoordinator]
    code: 200
    input: [decision, "escort_user_id?"]
    output: CaseRepAuthorization
    side_effects:
      - "decision APPROVE -> status APPROVED, decided_by_user_id = X-User-ID, decided_at_utc = logical clock now"
      - "compute badge_window_start_utc / badge_window_end_utc (calculations.badge_validity_window)"
      - "set escort_required from SurgicalCase.restriction_level and Facility.restricted_escort_required; store escort_user_id when supplied"
      - "stamp epoch_number = Vendor.last_sweep_epoch"
      - "increment Vendor.authorizations_used_epoch, VendorRep.open_authorization_count, SurgicalCase.approved_rep_count; recompute vendor_coverage_status"
      - "decision DENY -> status DENIED with decided_by_user_id / decided_at_utc and no counter movement"

  - method: POST
    path: "/vendor-access/case-rep-authorizations/{id}/revoke"
    description: "Manually revoke an approved authorization, releasing its quota slot and voiding its badge."
    roles: [ORCoordinator, CredentialingOfficer]
    code: 200
    input: ["revoked_reason?"]
    output: CaseRepAuthorization
    side_effects:
      - "status -> REVOKED; revoked_reason defaults to MANUAL"
      - "decrement Vendor.authorizations_used_epoch, VendorRep.open_authorization_count, SurgicalCase.approved_rep_count (each floored at 0); increment SurgicalCase.revoked_authorization_count"
      - "ISSUED KioskCheckIn badges of this authorization -> VOIDED"
      - "recompute SurgicalCase.vendor_coverage_status"

  - method: GET
    path: "/vendor-access/case-rep-authorizations/{id}/check-ins"
    description: "Sub-resource listing of the kiosk check-ins issued against an authorization. Reverse-reachability channel for KioskCheckIn.case_rep_authorization_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["badge_status?", "limit?", "offset?"]
    output: KioskCheckIn[]
    side_effects: []

  # ------------------------------------ ProductIntroductionRequest (PIR)
  - method: POST
    path: "/vendor-access/product-introduction-requests"
    description: "Open a product introduction request. Optimistically concurrent against the vendor: expected_vendor_version must equal the Vendor.version the caller read."
    roles: [VendorAdmin]
    code: 201
    input: [vendor_id, facility_id, product_name, product_catalog_number, manufacturer, is_implant, unit_cost_cents, expected_vendor_version, "supersedes_request_id?"]
    output: ProductIntroductionRequest
    side_effects:
      - "status = DRAFT, revision_round = 0"
      - "increments Vendor.version by 1"
      - "rejects with ERR_STALE_VENDOR_VERSION (412) when expected_vendor_version != Vendor.version"

  - method: GET
    path: "/vendor-access/product-introduction-requests/{id}"
    description: "Read one product introduction request including revision_round and the two reviewer user ids."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: ProductIntroductionRequest
    side_effects: []

  - method: GET
    path: "/vendor-access/product-introduction-requests"
    description: "List product introduction requests. Reverse-reachability channel for vendor_id, facility_id and the self-referential supersedes_request_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["vendor_id?", "facility_id?", "supersedes_request_id?", "status?", "is_implant?", "limit?", "offset?"]
    output: ProductIntroductionRequest[]
    side_effects: []

  - method: POST
    path: "/vendor-access/product-introduction-requests/{id}/submit"
    description: "Submit a DRAFT request, or re-submit one that came back CHANGES_REQUESTED, into clinical review."
    roles: [VendorAdmin]
    code: 200
    input: []
    output: ProductIntroductionRequest
    side_effects:
      - "status -> CLINICAL_REVIEW; increment ProductIntroductionRequest.version"
      - "from DRAFT: increment Vendor.open_pir_count"
      - "from CHANGES_REQUESTED: increment revision_round; refused with ERR_PIR_REVISION_LIMIT once revision_round has reached MAX_REVISION_ROUNDS (2)"

  - method: POST
    path: "/vendor-access/product-introduction-requests/{id}/clinical-review"
    description: "Clinical sponsor endorses or rejects the request. The endorsing user id is remembered for the segregation-of-duties check at value analysis."
    roles: [ClinicalSponsor]
    code: 200
    input: [decision, "review_note?"]
    output: ProductIntroductionRequest
    side_effects:
      - "decision ENDORSE -> status VALUE_ANALYSIS_REVIEW, clinical_sponsor_user_id = X-User-ID, clinical_reviewed_at_utc = logical clock now"
      - "decision REJECT -> status REJECTED, decided_at_utc = logical clock now, decrement Vendor.open_pir_count"

  - method: POST
    path: "/vendor-access/product-introduction-requests/{id}/value-analysis-decision"
    description: "Value analysis committee approves, rejects, or returns the request for changes. Approval materialises the ApprovedProduct that lets a rep bring the implant."
    roles: [ValueAnalysisApprover]
    code: 200
    input: [decision, "decision_note?"]
    output: ProductIntroductionRequest
    side_effects:
      - "refused with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == clinical_sponsor_user_id"
      - "decision APPROVE -> status APPROVED; creates one ApprovedProduct (status ACTIVE, pinned_pir_version = request version, approval_expires_at_utc = now + APPROVAL_VALIDITY_DAYS); decrement Vendor.open_pir_count; a superseded request's ACTIVE ApprovedProduct -> SUSPENDED with suspended_reason = SUPERSEDED"
      - "decision REJECT -> status REJECTED; decrement Vendor.open_pir_count"
      - "decision REQUEST_CHANGES -> status CHANGES_REQUESTED; clears clinical_sponsor_user_id and clinical_reviewed_at_utc; refused with ERR_PIR_REVISION_LIMIT once revision_round has reached MAX_REVISION_ROUNDS (2)"

  # -------------------------------------------------------- ApprovedProduct
  - method: GET
    path: "/vendor-access/approved-products/{id}"
    description: "Read one approved product, including its approval expiry and any suspension reason. Approved products are only ever created as a cascade of a value-analysis approval, so this read is their sole discovery channel alongside the filtered list."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: ApprovedProduct
    side_effects: []

  - method: GET
    path: "/vendor-access/approved-products"
    description: "List approved products. Reverse-reachability channel for ApprovedProduct.product_introduction_request_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["product_introduction_request_id?", "status?", "is_implant?", "limit?", "offset?"]
    output: ApprovedProduct[]
    side_effects: []

  # -------------------------------------------------------------- LoanerSet
  - method: POST
    path: "/vendor-access/loaner-sets"
    description: "Register a loaner instrument tray set for a case. Pins both delivery deadline variants and admits against sterile-processing bay capacity. Optimistically concurrent against the case."
    roles: [VendorAdmin, SterileProcessingTech]
    code: 201
    input: [surgical_case_id, approved_product_id, tray_count, reprocessing_complexity, expected_case_version]
    output: LoanerSet
    side_effects:
      - "compute pinned_deadline_utc from SurgicalCase.original_scheduled_start_utc and required_delivery_deadline_utc from SurgicalCase.scheduled_start_utc (calculations.loaner_delivery_deadline)"
      - "compute spd_occupation_start_utc / spd_occupation_end_utc and admit against Facility.spd_bay_count (calculations.spd_bay_occupation); refuse with ERR_SPD_BAY_CAPACITY_EXCEEDED"
      - "status = EXPECTED, fee_status = NONE, assessed_late_fee_cents = 0"
      - "increments SurgicalCase.version by 1"
      - "rejects with ERR_STALE_CASE_VERSION (412) when expected_case_version != SurgicalCase.version"
      - "recompute SurgicalCase.implant_readiness_status"

  - method: GET
    path: "/vendor-access/loaner-sets/{id}"
    description: "Read one loaner set, including both deadline variants, both late-minute variants and the fee state."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: LoanerSet
    side_effects: []

  - method: GET
    path: "/vendor-access/loaner-sets"
    description: "List loaner sets. Reverse-reachability channel for both LoanerSet.surgical_case_id and LoanerSet.approved_product_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["surgical_case_id?", "approved_product_id?", "status?", "fee_status?", "limit?", "offset?"]
    output: LoanerSet[]
    side_effects: []

  - method: POST
    path: "/vendor-access/loaner-sets/{id}/receive"
    description: "Sterile processing receives the tray set. Forks to DELIVERED_ON_TIME, DELIVERED_LATE or REJECTED_LATE purely on the current-basis late minutes, and assesses the per-tray late fee."
    roles: [SterileProcessingTech]
    code: 200
    input: ["delivered_at_utc?"]
    output: LoanerSet
    side_effects:
      - "delivered_at_utc defaults to the logical clock's current time when omitted"
      - "compute late_minutes_pinned_basis and late_minutes_current_basis (calculations.loaner_late_minutes)"
      - "status -> DELIVERED_ON_TIME | DELIVERED_LATE | REJECTED_LATE per the current-basis branch"
      - "compute assessed_late_fee_cents and fee_status (calculations.loaner_late_fee); add the fee to Vendor.late_fee_balance_cents"
      - "recompute both Vendor compliance-score variants and SurgicalCase.implant_readiness_status"

  - method: POST
    path: "/vendor-access/loaner-sets/{id}/release"
    description: "Release a received tray set to the operating room. Requires the underlying ApprovedProduct to still be ACTIVE and the vendor to be under the fee hold threshold."
    roles: [SterileProcessingTech]
    code: 200
    input: []
    output: LoanerSet
    side_effects:
      - "status -> RELEASED_TO_OR (terminal); the set leaves the SPD bay so it stops counting toward spd_bay_count"
      - "refused with ERR_PRODUCT_NOT_APPROVED (422) when the ApprovedProduct is SUSPENDED or EXPIRED"
      - "refused with ERR_VENDOR_FEE_HOLD (402) when Vendor.late_fee_balance_cents >= FEE_HOLD_THRESHOLD_CENTS"
      - "recompute SurgicalCase.implant_readiness_status (READY once every set of the case is released)"

  # ------------------------------------------------------------ KioskCheckIn
  - method: POST
    path: "/vendor-access/kiosk-check-ins"
    description: "Check in at the vendor kiosk against an approved authorization and issue a badge. Enforces the badge window, the rep's credential posture and the department escort rule."
    roles: [VendorRepUser, ORCoordinator]
    code: 201
    input: [case_rep_authorization_id]
    output: KioskCheckIn
    side_effects:
      - "badge_serial = Facility.code + '-' + a monotonic per-facility sequence"
      - "badge_status = ISSUED; valid_from_utc / valid_until_utc copied from the authorization's badge window"
      - "escort_status = ESCORT_PENDING when the authorization requires an escort, otherwise ESCORT_NOT_REQUIRED"
      - "refused with ERR_BADGE_WINDOW_NOT_OPEN (422) outside the inclusive window, and with ERR_CHECK_IN_ALREADY_ACTIVE (409) when an ISSUED badge already exists"

  - method: GET
    path: "/vendor-access/kiosk-check-ins/{id}"
    description: "Read one kiosk check-in, carrying both independent state dimensions (badge_status and escort_status)."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: KioskCheckIn
    side_effects: []

  - method: POST
    path: "/vendor-access/kiosk-check-ins/{id}/attach-escort"
    description: "Attach a department escort to an issued badge. Moves only the escort dimension; badge_status stays ISSUED."
    roles: [ORCoordinator]
    code: 200
    input: [escort_user_id]
    output: KioskCheckIn
    side_effects:
      - "escort_status -> ESCORT_ATTACHED; escort_user_id and escort_attached_at_utc set"
      - "badge_status is untouched"

  - method: POST
    path: "/vendor-access/kiosk-check-ins/{id}/check-out"
    description: "Check out at the kiosk. Moves the badge dimension to CHECKED_OUT and, only if an escort was attached, releases the escort dimension."
    roles: [VendorRepUser, ORCoordinator]
    code: 200
    input: []
    output: KioskCheckIn
    side_effects:
      - "badge_status -> CHECKED_OUT; checked_out_at_utc = logical clock now"
      - "escort_status ESCORT_ATTACHED -> ESCORT_RELEASED; ESCORT_NOT_REQUIRED stays as it is"
      - "refused with ERR_ESCORT_REQUIRED (422) when escort_status is still ESCORT_PENDING"

  # ---------------------------------------------------------------- Incident
  - method: POST
    path: "/vendor-access/incidents"
    description: "Report an incident such as unapproved product use. Immediately depresses the provisional score at full severity weight while leaving the adjudicated score untouched."
    roles: [ORCoordinator, SterileProcessingTech, ComplianceAdmin]
    code: 201
    input: [surgical_case_id, vendor_rep_id, incident_type, severity, narrative, "approved_product_id?"]
    output: Incident
    side_effects:
      - "status = REPORTED; reported_by_user_id = X-User-ID; reported_at_utc = logical clock now; score_weight from severity"
      - "recompute Vendor.provisional_compliance_score (falls by the severity weight); Vendor.adjudicated_compliance_score is unchanged"

  - method: GET
    path: "/vendor-access/incidents/{id}"
    description: "Read one incident including its adjudication outcome and score weight."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/vendor-access/incidents"
    description: "List incidents. Reverse-reachability channel for Incident.surgical_case_id, Incident.vendor_rep_id and Incident.approved_product_id."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: ["surgical_case_id?", "vendor_rep_id?", "approved_product_id?", "status?", "severity?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/vendor-access/incidents/{id}/investigate"
    description: "Open an investigation. Deliberately score-neutral: the provisional variant already counts REPORTED incidents at full weight."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "status -> UNDER_INVESTIGATION; neither score variant moves"

  - method: POST
    path: "/vendor-access/incidents/{id}/adjudicate"
    description: "Adjudicate an incident. Substantiation is the deepest cascade in the domain: product suspension, loaner holds, case blocking and (for critical unapproved product use) rep suspension."
    roles: [ComplianceAdmin]
    code: 200
    input: [outcome, "adjudication_note?"]
    output: Incident
    side_effects:
      - "refused with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == reported_by_user_id"
      - "status -> SUBSTANTIATED | UNSUBSTANTIATED; adjudicated_outcome, adjudicated_by_user_id, adjudicated_at_utc set"
      - "recompute both Vendor compliance-score variants"
      - "SUBSTANTIATED with approved_product_id: ApprovedProduct ACTIVE -> SUSPENDED (INCIDENT_SUBSTANTIATED); its LoanerSets in {EXPECTED, DELIVERED_ON_TIME, DELIVERED_LATE} -> HELD; owning cases -> implant_readiness_status BLOCKED"
      - "SUBSTANTIATED with incident_type UNAPPROVED_PRODUCT_USE and severity CRITICAL: the VendorRep CREDENTIALED -> SUSPENDED (INCIDENT_SUBSTANTIATED), which revokes its future APPROVED authorizations and voids their ISSUED badges"
      - "UNSUBSTANTIATED: a product suspended by this incident returns to ACTIVE and its HELD sets return to the branch their late minutes imply"
      - "accepted on a SUBSTANTIATED incident only when outcome == UNSUBSTANTIATED (the reversal path); a second SUBSTANTIATED outcome, an already UNSUBSTANTIATED incident and a CLOSED incident are all refused with ERR_INCIDENT_INVALID_STATE (409)"

  # ------------------------------------------------------------- AccessAppeal
  - method: POST
    path: "/vendor-access/access-appeals"
    description: "File an appeal against a revocation, inside APPEAL_WINDOW_DAYS of revoked_at_utc."
    roles: [VendorAdmin, VendorRepUser]
    code: 201
    input: [vendor_rep_id, grounds]
    output: AccessAppeal
    side_effects:
      - "status = SUBMITTED; filed_for_revoked_at_utc = VendorRep.revoked_at_utc; filed_at_utc = logical clock now; appeal_deadline_utc = revoked_at_utc + APPEAL_WINDOW_DAYS"
      - "refused with ERR_REP_NOT_REVOKED (409) unless the rep is REVOKED, and with ERR_APPEAL_WINDOW_CLOSED (422) past the deadline"

  - method: GET
    path: "/vendor-access/access-appeals/{id}"
    description: "Read one revocation appeal."
    roles: [VendorAdmin, VendorRepUser, CredentialingOfficer, ORCoordinator, ClinicalSponsor, ValueAnalysisApprover, SterileProcessingTech, ComplianceAdmin]
    code: 200
    input: []
    output: AccessAppeal
    side_effects: []

  - method: POST
    path: "/vendor-access/access-appeals/{id}/decide"
    description: "Decide an appeal. An overturn returns the rep to CREDENTIALED, or to SUSPENDED when its credentials have since lapsed. The decider may not be the officer who revoked the rep."
    roles: [ComplianceAdmin, CredentialingOfficer]
    code: 200
    input: [decision, decision_rationale]
    output: AccessAppeal
    side_effects:
      - "refused with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == VendorRep.revoked_by_user_id"
      - "decision UPHOLD -> status UPHELD; the rep stays REVOKED"
      - "decision OVERTURN -> status OVERTURNED; VendorRep -> CREDENTIALED when its recomputed posture is COMPLIANT or EXPIRING_SOON, otherwise -> SUSPENDED with suspension_reason = CREDENTIAL_LAPSED; reinstated_at_utc = logical clock now"

  # ------------------------------------------------------- ops / test-driving
  - method: POST
    path: "/vendor-access/compliance-sweeps"
    description: "Run one compliance sweep epoch. Nine pinned phases: expire credentials, refresh postures, suspend reps, revoke future authorizations, expire badges, expire approvals, close old adjudicated incidents, rescore every vendor, write counters."
    roles: [ComplianceAdmin]
    code: 201
    input: []
    output: ComplianceSweep
    side_effects:
      - "epoch_number = previous max epoch + 1; previous_epoch_number = the epoch this sweep supersedes; swept_at_utc = logical clock now"
      - "phase 2: VERIFIED credentials -> EXPIRING_SOON or EXPIRED (equality at swept_at_utc expires)"
      - "phase 3: recompute every VendorRep.credential_posture and apply CREDENTIALED <-> SUSPENDED transitions"
      - "phase 4: revoke APPROVED authorizations of newly suspended reps whose case starts at or after swept_at_utc, voiding their ISSUED badges and adjusting every counter"
      - "phase 5: ISSUED badges whose valid_until_utc <= swept_at_utc -> EXPIRED"
      - "phase 6: ApprovedProducts whose approval_expires_at_utc <= swept_at_utc -> EXPIRED (no loaner-set hold)"
      - "phase 7: adjudicated incidents older than INCIDENT_CLOSE_DAYS -> CLOSED"
      - "phase 8: rescore every Vendor in created_at ASC order using the pinned quota/tier/reset order (calculations.vendor_scorecard_tier_and_quota)"
      - "phase 9: write every counter field on the ComplianceSweep row"

  - method: POST
    path: "/vendor-access/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical current UTC instant, which every deadline, expiry, badge window and sweep decision reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the startup default) and never falls back to real wall-clock time."
    roles: [CredentialingOfficer, ComplianceAdmin, ORCoordinator, SterileProcessingTech, VendorAdmin, VendorRepUser, ClinicalSponsor, ValueAnalysisApprover]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; performs no state transitions of its own — sweeps and business calls observe the new instant"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles"
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "a VendorAdmin or VendorRepUser acts on a row belonging to a different Vendor / VendorRep than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the counterparty on the same record: value-analysis approver equals clinical sponsor, incident adjudicator equals reporter, appeal decider equals the revoking officer, or authorization decider equals the requester"

  # --- request well-formedness ---------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong JSON type, unknown enum value, out-of-range integer, unparseable ISO-8601 instant, or pagination limit outside 1..100"
  - id: ERR_INVALID_TIME_RANGE
    http: 400
    condition: "scheduled_end_utc <= scheduled_start_utc on a case create or reschedule, or expires_at_utc <= issued_at_utc on a credential"

  # --- existence (one per addressable entity) ------------------------------
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "no Facility with the given id, whether in the path or in a request body"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "no Vendor with the given id"
  - id: ERR_VENDOR_REP_NOT_FOUND
    http: 404
    condition: "no VendorRep with the given id"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "no Credential with the given id"
  - id: ERR_SURGICAL_CASE_NOT_FOUND
    http: 404
    condition: "no SurgicalCase with the given id"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "no CaseRepAuthorization with the given id"
  - id: ERR_PIR_NOT_FOUND
    http: 404
    condition: "no ProductIntroductionRequest with the given id, including as a supersedes_request_id target"
  - id: ERR_APPROVED_PRODUCT_NOT_FOUND
    http: 404
    condition: "no ApprovedProduct with the given id"
  - id: ERR_LOANER_SET_NOT_FOUND
    http: 404
    condition: "no LoanerSet with the given id"
  - id: ERR_CHECK_IN_NOT_FOUND
    http: 404
    condition: "no KioskCheckIn with the given id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no Incident with the given id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no AccessAppeal with the given id"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_VENDOR_VERSION
    http: 412
    condition: "expected_vendor_version does not equal the current Vendor.version on POST /vendor-access/product-introduction-requests"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current SurgicalCase.version on POST /vendor-access/loaner-sets"

  # --- state preconditions -------------------------------------------------
  - id: ERR_REP_ACCESS_REVOKED
    http: 409
    condition: "the referenced VendorRep.access_status is REVOKED"
  - id: ERR_REP_ACCESS_SUSPENDED
    http: 409
    condition: "the referenced VendorRep.access_status is SUSPENDED"
  - id: ERR_CREDENTIAL_NOT_PENDING
    http: 409
    condition: "a verify/reject decision targets a Credential that is not PENDING_VERIFICATION"
  - id: ERR_AUTHORIZATION_NOT_REQUESTED
    http: 409
    condition: "an approve/deny decision targets a CaseRepAuthorization that is not REQUESTED"
  - id: ERR_AUTHORIZATION_NOT_APPROVED
    http: 409
    condition: "a revoke or a kiosk check-in targets a CaseRepAuthorization that is not APPROVED"
  - id: ERR_CASE_NOT_SCHEDULED
    http: 409
    condition: "the SurgicalCase is CANCELLED when a reschedule, cancel, authorization request, loaner registration or receive is attempted"
  - id: ERR_PIR_INVALID_STATE
    http: 409
    condition: "the ProductIntroductionRequest is not in the state the requested review step needs"
  - id: ERR_LOANER_SET_INVALID_STATE
    http: 409
    condition: "receive targets a set that is not EXPECTED, or release targets a set that is not DELIVERED_ON_TIME or DELIVERED_LATE (including HELD and REJECTED_LATE)"
  - id: ERR_CHECK_IN_NOT_ACTIVE
    http: 409
    condition: "attach-escort or check-out targets a KioskCheckIn whose badge_status is not ISSUED"
  - id: ERR_ESCORT_NOT_PENDING
    http: 409
    condition: "attach-escort targets a check-in whose escort_status is not ESCORT_PENDING (already attached, released, or never required)"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "investigate targets an Incident that is not REPORTED, adjudicate targets a CLOSED or already UNSUBSTANTIATED Incident, or adjudicate re-substantiates an Incident that is already SUBSTANTIATED (only the SUBSTANTIATED -> UNSUBSTANTIATED reversal is admissible)"
  - id: ERR_APPEAL_INVALID_STATE
    http: 409
    condition: "a decision targets an AccessAppeal that is not SUBMITTED"
  - id: ERR_REP_NOT_REVOKED
    http: 409
    condition: "an appeal is filed for a VendorRep whose access_status is not REVOKED"

  # --- business_safety -----------------------------------------------------
  - id: ERR_REP_CREDENTIALS_NOT_COMPLIANT
    http: 422
    condition: "the VendorRep's credential_posture is INCOMPLETE or LAPSED when an authorization approval or kiosk check-in is attempted"
  - id: ERR_ESCORT_REQUIRED
    http: 422
    condition: "check-out attempted while escort_status is still ESCORT_PENDING on a restricted case"

  # --- business_temporal ---------------------------------------------------
  - id: ERR_BADGE_WINDOW_NOT_OPEN
    http: 422
    condition: "the logical clock is before badge_window_start_utc or after badge_window_end_utc at kiosk check-in (both endpoints are inclusive and therefore admissible)"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "an appeal is filed more than APPEAL_WINDOW_DAYS (14) after VendorRep.revoked_at_utc; filing exactly on the deadline is still accepted"
  - id: ERR_REP_BADGE_WINDOW_CONFLICT
    http: 409
    condition: "approving an authorization would give the rep two overlapping half-open badge windows; windows that merely touch (one ends exactly where the next begins) are accepted"
  - id: ERR_SPD_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "registering a loaner set would make the number of colliding buffered SPD occupations at the facility reach Facility.spd_bay_count"

  # --- business_constraint -------------------------------------------------
  - id: ERR_DUPLICATE_AUTHORIZATION
    http: 409
    condition: "a REQUESTED or APPROVED CaseRepAuthorization already exists for this (surgical_case_id, vendor_rep_id) pair"
  - id: ERR_DUPLICATE_CREDENTIAL
    http: 409
    condition: "a PENDING_VERIFICATION, VERIFIED or EXPIRING_SOON Credential of the same credential_type already exists for this rep"
  - id: ERR_DUPLICATE_FACILITY_CODE
    http: 409
    condition: "another Facility already uses this code"
  - id: ERR_DUPLICATE_VENDOR_CODE
    http: 409
    condition: "another Vendor already uses this vendor_code"
  - id: ERR_DUPLICATE_CASE_NUMBER
    http: 409
    condition: "another SurgicalCase already uses this case_number"
  - id: ERR_CHECK_IN_ALREADY_ACTIVE
    http: 409
    condition: "the authorization already has a KioskCheckIn with badge_status ISSUED"
  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "an AccessAppeal already exists for this rep with the same filed_for_revoked_at_utc"
  - id: ERR_PIR_REVISION_LIMIT
    http: 422
    condition: "a REQUEST_CHANGES decision or a re-submission is attempted once revision_round has reached MAX_REVISION_ROUNDS (2)"

  # --- business_referential ------------------------------------------------
  - id: ERR_PRODUCT_NOT_APPROVED
    http: 422
    condition: "the referenced ApprovedProduct is SUSPENDED or EXPIRED when a loaner set is registered or released"
  - id: ERR_IMPLANT_REQUIRES_APPROVED_PRODUCT
    http: 422
    condition: "approving an authorization for an implant case when the rep's Vendor owns no ACTIVE implant ApprovedProduct"

  # --- business_fiscal -----------------------------------------------------
  - id: ERR_VENDOR_ACCESS_QUOTA_EXCEEDED
    http: 422
    condition: "Vendor.authorizations_used_epoch has reached floor(access_quota_in_effect * QUOTA_HARD_MULTIPLIER) for the current epoch"
  - id: ERR_VENDOR_FEE_HOLD
    http: 402
    condition: "Vendor.late_fee_balance_cents is at or above FEE_HOLD_THRESHOLD_CENTS (100000) when an authorization approval or a loaner release is attempted"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: VendorAdmin
    description: "Vendor company administrator. Registers its own representatives, attests their credentials, opens product introduction requests, registers loaner sets and files revocation appeals."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-access/product-introduction-requests (open a request; only a vendor may open one for itself)"
      - "POST /vendor-access/product-introduction-requests/{id}/submit"
    shared_operations:
      - "POST /vendor-access/vendor-reps (with CredentialingOfficer)"
      - "POST /vendor-access/credentials (with VendorRepUser, CredentialingOfficer)"
      - "POST /vendor-access/case-rep-authorizations (with ORCoordinator)"
      - "POST /vendor-access/loaner-sets (with SterileProcessingTech)"
      - "POST /vendor-access/access-appeals (with VendorRepUser)"
      - "all GET endpoints, including GET /vendor-access/vendors/{id}/scorecard for its OWN vendor only"
      - "POST /vendor-access/_clock/set_current_utc"

  - name: VendorRepUser
    description: "An individual vendor representative. Uploads its own attestations, checks in and out at the kiosk, and may file its own appeal."
    identity: "entity_backed:VendorRep"
    exclusive_operations: []
    shared_operations:
      - "POST /vendor-access/credentials (with VendorAdmin, CredentialingOfficer)"
      - "POST /vendor-access/kiosk-check-ins (with ORCoordinator)"
      - "POST /vendor-access/kiosk-check-ins/{id}/check-out (with ORCoordinator)"
      - "POST /vendor-access/access-appeals (with VendorAdmin)"
      - "all GET endpoints except GET /vendor-access/vendors/{id}/scorecard"
      - "POST /vendor-access/_clock/set_current_utc"

  - name: CredentialingOfficer
    description: "Hospital credentialing office. Verifies attestations, revokes access, and may decide appeals it did not itself cause."
    identity: opaque
    exclusive_operations:
      - "POST /vendor-access/credentials/{id}/decide"
    shared_operations:
      - "POST /vendor-access/facilities (with ComplianceAdmin)"
      - "POST /vendor-access/vendors (with ComplianceAdmin)"
      - "POST /vendor-access/vendor-reps (with VendorAdmin)"
      - "POST /vendor-access/credentials (with VendorAdmin, VendorRepUser)"
      - "POST /vendor-access/vendor-reps/{id}/revoke-access (with ComplianceAdmin)"
      - "POST /vendor-access/case-rep-authorizations/{id}/revoke (with ORCoordinator)"
      - "POST /vendor-access/access-appeals/{id}/decide (with ComplianceAdmin) — blocked by ERR_SEGREGATION_OF_DUTIES when this officer is the one who revoked the rep"
      - "all GET endpoints, including GET /vendor-access/vendors/{id}/scorecard for any vendor"
      - "POST /vendor-access/_clock/set_current_utc"

  - name: ORCoordinator
    description: "Operating-room coordinator. Owns the case schedule, decides rep authorizations, attaches escorts and reports incidents."
    identity: opaque
    exclusive_operations:
      - "POST /vendor-access/surgical-cases"
      - "POST /vendor-access/surgical-cases/{id}/reschedule"
      - "POST /vendor-access/surgical-cases/{id}/cancel"
      - "POST /vendor-access/case-rep-authorizations/{id}/decide"
      - "POST /vendor-access/kiosk-check-ins/{id}/attach-escort"
    shared_operations:
      - "POST /vendor-access/case-rep-authorizations (with VendorAdmin)"
      - "POST /vendor-access/case-rep-authorizations/{id}/revoke (with CredentialingOfficer)"
      - "POST /vendor-access/kiosk-check-ins and /check-out (with VendorRepUser)"
      - "POST /vendor-access/incidents (with SterileProcessingTech, ComplianceAdmin)"
      - "all GET endpoints except GET /vendor-access/vendors/{id}/scorecard"
      - "POST /vendor-access/_clock/set_current_utc"

  - name: ClinicalSponsor
    description: "Surgeon or clinical champion who endorses or rejects a product introduction request. Cannot also cast the value-analysis vote on the same request."
    identity: opaque
    exclusive_operations:
      - "POST /vendor-access/product-introduction-requests/{id}/clinical-review"
    shared_operations:
      - "all GET endpoints except GET /vendor-access/vendors/{id}/scorecard"
      - "POST /vendor-access/_clock/set_current_utc"

  - name: ValueAnalysisApprover
    description: "Value analysis committee member. Approves, rejects or returns a product introduction request; approval is what materialises the ApprovedProduct."
    identity: opaque
    exclusive_operations:
      - "POST /vendor-access/product-introduction-requests/{id}/value-analysis-decision"
    shared_operations:
      - "all GET endpoints except GET /vendor-access/vendors/{id}/scorecard"
