      - name: error_package_retired_on_create_contract
        claim_type: Violation to Error
        grounds:
          - errors[ERR_PACKAGE_RETIRED]
          - state_machines.Contract
        distinguishing_aspect: |
          POST /contracts against a ContractPackage in status RETIRED returns
          ERR_PACKAGE_RETIRED.
        test_recipe:
          setup:
            - "A ContractPackage that has been retired via POST /contract-packages/{id}/retire."
            - "A Customer ready to attempt a contract creation."
