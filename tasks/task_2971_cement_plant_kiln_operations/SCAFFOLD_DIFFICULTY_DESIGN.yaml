  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_completed_loadout_restores_the_plant_cement_balance_with_no_drift
        grounds: >
          calculations.cement_tonne_conservation declares
          cement_tonne_balance_tonnes = sum(CEMENT Silo.tonnes_on_hand) +
          sum(COMPLETED LoadoutOrder.loaded_tonnes) and states the invariant that neither complete
          nor void-from-COMPLETED may change it. §1.2 LoadoutOrder's COMPLETED -> VOIDED transition
          is a post-terminal compensation: tonnes_on_hand += loaded_tonnes,
          Customer.lifetime_loaded_tonnes -= loaded_tonnes, then loaded_tonnes = 0.00.
        distinguishing_aspect: >
          An implementation that only flips the status leaves the balance at 454.72 (the silo never
          gets the cement back) — 120.00 t of cement vanish. One that returns the stock but forgets
          to zero loaded_tonnes reports 694.72 (the same 120.00 t counted twice). One that forgets
          the customer ledger leaves lifetime_loaded_tonnes at 120.00. Only the full compensation
          reads exactly 574.72 with lifetime_loaded_tonnes 0.00.
