        distinguishing_aspect: "A DRAFT batch can be rejected outright without ever being submitted, and REJECTED is terminal: the follow-up submit answers 409 ERR_INVALID_STATE_TRANSITION, so the DRAFT -> REJECTED edge is a real second path into the terminal state rather than an alias for SUBMITTED -> REJECTED."
