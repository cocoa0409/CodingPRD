    side_effects: []
  - method: GET
    path: "/distribution-listings"
    description: "list listings filtered by title_id and/or channel_id and/or status"
    roles: [PlatformAdmin, Author]
    code: 200
    input: ["title_id?", "channel_id?", "status?", "limit?", "offset?"]
