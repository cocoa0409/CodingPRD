            - { call: "GET /guardians/${gb}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { tier_b: $.data.loyalty_tier } }
          assert:
            - "Guardian.${ga}.loyalty_tier == SILVER (lifetime_points == 1000 hits the inclusive >= threshold)"
            - "Guardian.${gb}.loyalty_tier == BRONZE (999 is one below)"

      - name: reservation_quota_equality_rejected
        grounds:
          - calculations.session_slot_load
          - errors[ERR_RESERVATION_QUOTA_FULL]
        distinguishing_aspect: |
          Count boundary on a different metric (reservation quota vs points
          threshold) via a different endpoint (POST /visits): capacity 4 ->
          quota floor(2.8)=2; the second reservation (count 1 < 2) succeeds,
          the third (count 2 >= 2, equality) is rejected.
        test_recipe:
          setup:
            - "OPEN slot capacity 4 (quota 2); guardian with waiver and three children"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 4 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id, quota: $.data.reservation_quota } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G Q", email: "gq@x.com", phone: "303" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K1", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K2", birth_date: "2019-06-15" }, as: Guardian, as_user_id: "${g}", captures: { c2: $.data.id } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K3", birth_date: "2018-09-15" }, as: Guardian, as_user_id: "${g}", captures: { c3: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c2}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}" }
          trigger:
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c3}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "SessionSlot.${s1}.reservation_quota == 2 (floor(4*0.7))"
            - "third reservation: error_id == ERR_RESERVATION_QUOTA_FULL at exact equality reserved_count == quota"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_gated_by_waiver_state
        grounds:
          - state_machines.Visit.RESERVED_to_CHECKED_IN
          - state_machines.Waiver.SIGNED_to_EXPIRED
          - errors[ERR_WAIVER_INVALID]
        distinguishing_aspect: |
          Entity pair Visit -> Waiver: check-in is legal only while the
          guardian's newest waiver is SIGNED and unexpired; an ops-run expiry
          flips the waiver and blocks check-in even though the slot is OPEN
          and the window is valid.
        test_recipe:
          setup:
            - "waiver signed 2026-06-01 (expires 2027-06-01); slot 2027-06-10 14:00-15:30; reservation v1; clock 2027-06-10T13:55Z; slot opened; ops run flips waiver EXPIRED (visit not swept: no-show deadline 14:15 not yet reached)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2027-06-10", start_at: "2027-06-10T14:00:00Z", end_at: "2027-06-10T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
