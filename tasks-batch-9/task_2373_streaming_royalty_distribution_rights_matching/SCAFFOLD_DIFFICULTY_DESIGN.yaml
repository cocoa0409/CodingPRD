            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w2}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w2v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg: "$.data.id" }
            - call: "POST /royalties/rights-registrations/${rg}/review"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
          trigger:
            - call: "POST /royalties/rights-registrations/${rg}/approve"
              payload: {}
