  - rule_id: transitive_cascade
    note: >-
      Two cascades of depth 3 from DIFFERENT triggering transitions: one starts at
      Experiment READ_OUT -> ACCEPTED and propagates through the calibration axis and the
      market posture, the other starts at DataWindow SEALED -> REOPENED and propagates
      through the fit axis and the contribution currency flag. Each hop is caused by the
      hop before it, not by the original request.
    instances:
      - name: accept_readout_cascades_calibration_staleness_to_budget_freeze
        grounds:
          - "state_machines.Experiment.READ_OUT_to_ACCEPTED"
          - "state_machines.ModelRun.calibration_status=CALIBRATED_to_calibration_status=STALE"
          - "state_machines.ReconciliationReport.CURRENT_to_STALE"
          - "state_machines.BudgetScenario.OPTIMIZED_to_FROZEN"
          - "calculations.market_data_posture"
          - "entities.Market.fields.data_posture"
        distinguishing_aspect: |
          Accepting a SECOND readout fires a three-hop chain in which every hop is caused by
          its predecessor: hop 1 sets the published run calibration_status CALIBRATED -> STALE,
          hop 2 is the posture recomputation that only a STALE calibration can cause
          (OPEN -> RESTRICTED, by the second branch of calculations.market_data_posture), and
          hop 3 freezes the OPTIMIZED BudgetScenario because the posture LEFT OPEN - the scenario
          never references the accepted experiment, so it cannot have been touched by the request
          itself.
        test_recipe:
          setup:
            - "Fixture F1 fitted, validated and PUBLISHED; posture OPEN."
            - "Experiment exp1 on A_SEARCH read out at 10.00 lift, its CalibrationRecord filed (multiplier 0.5296) and the run recalibrated, so calibration_status == CALIBRATED and baseline_sales_units == 19050.9090."
            - "One ReconciliationReport on the CALIBRATED basis with status CURRENT."
            - "One BudgetScenario OPTIMIZED with allocations A_SEARCH 2300000 / B_SOCIAL 1600000, fee 9000, unallocated 91000."
            - "A SECOND experiment exp2 on B_SOCIAL, window 2026-10-12 to 2026-11-09, taken to READ_OUT so it can be accepted."
            - "Clock walked forward only: 2026-08-01 -> 08-31 -> 09-07 -> 10-05 -> 10-12 -> 11-09."
