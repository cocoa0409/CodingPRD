              as: PlatformAdmin
              captures: { st: $.data.id }
          trigger:
            - call: "POST /baggage/stations/${st}/outage/clear"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id is ERR_INVALID_STATE"
            - "Station.${st}.outage_active is still false and outage_started_utc is still null"
            - "Station.${st}.posture is still OPEN"
            - "declaring the outage then clearing it succeeds and returns posture OPEN with outage_active false"
            - "clearing it a second time returns ERR_INVALID_STATE again"
            - "Station.${st}.version advanced by exactly 2 across the declare-and-clear pair"

