      - name: second_countersign_of_an_executed_license_rejected
        claim_type: idempotency
        grounds:
          - state_machines.LicenseAgreement.ISSUED_to_EXECUTED
          - errors[ERR_LICENSE_STATE_INVALID]
          - validations[priority=40]
        distinguishing_aspect: |
          A replayed countersignature must not re-run the edge. The dangerous
          alternative is not merely a wrong status but a second escrow move: the first
          countersign left deposit_held_cents at 90900 and credit_balance_cents at
          109100, and both figures must be byte-identical after the rejected replay.
        test_recipe:
          setup:
            - "the Meeting Room 301 license is EXECUTED after one countersignature by the licensee"
            - "deposit_held_cents is 90900 and Client.credit_balance_cents is 109100"
