            - "${e_stale_partner_inv} == ERR_STALE_PARTNER_VERSION with HTTP 412 — the same error_id as the agreement rule, raised from a different write_endpoint with the same occ_field"
            - "${inv_variant} == NET — the draft picks the settlement_mode of the ACTIVE agreement — and ${inv_gross} == 0 because the period holds no borrow or lend lines"
            - "GET /ill/partners/${partner_id}/invoices?period_month=2026-08 returns exactly one row, ${inv_id}; the refused draft left no DRAFT behind"

      - name: cascading_side_effect_chain_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / lender_damage_confirmation_cascades_five_levels_from_shipment_to_patron_block
          rationale: "That §1.8 instance already walks the deepest chain in the domain end to end — Shipment lender-confirm with a damage fee -> LoanRecord damage billing -> Patron damaged_count and unpaid_balance_cents -> standing score recomputation -> Patron status BLOCKED -> the next intake refused — and asserts the intermediate value at every level as well as the ordering sensitivity, since the block is only reachable after the score step has run. The companion instance hold_shelf_expiry_sweep_cascades_four_levels_from_loan_to_patron_unclaimed_counter covers the second, sweep-driven chain. A separate §1.9 instance would restate the same assertions with a shallower chain."

      - name: the_cumulative_copyright_allowance_resets_when_the_calendar_year_rolls_over
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.copyright_rule_of_five_counter
          - entities.CopyrightClearance.fields.calendar_year
          - entities.CopyrightClearance.fields.sequence_in_year
          - endpoints[GET /ill/copyright-usage]
          - state_machines.IllRequest.SUBMITTED_to_COPYRIGHT_HOLD
        distinguishing_aspect: "The threshold is cumulative per (issn, calendar_year) and its reset is driven purely by the logical clock, not by any write: the same journal that is exhausted at 2026-12-31 admits a free fill again one instant later, and the 2026 register keeps reporting five afterwards, which proves the counter is keyed on the year rather than being a mutable running balance that gets zeroed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One patron with max_open_requests 20 so the request cap never interferes."
            - "One COPY rota with an electronic-capable partner."
            - "One ARTICLE BibItem, issn 2211-0007, publication_year 2024 — inside the five-year recency window in both 2026 (2022..2026) and 2027 (2023..2027)."
            - "Five COPY requests already taken in during 2026, each consuming one CONTU free fill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9062", full_name: "Ada Reader", email: "ada@u.edu", patron_type: "FACULTY", department: "PHYS", max_open_requests: 20 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
