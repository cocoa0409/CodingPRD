  - section: state_machines
    instances:
      - name: student_withdrawn_blocks_operations
        claim_type: invalid_transition
        grounds: ["errors[ERR_STUDENT_WITHDRAWN]"]
        distinguishing_aspect: "A mutating operation (finalize a determination) on a WITHDRAWN student returns 409 ERR_STUDENT_WITHDRAWN."
        test_recipe:
          setup: ["Enrolled student then withdrawn; a DRAFT determination created before withdrawal."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Wd", last_name: "Rn", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: Registrar
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/students/${s1}/withdraw"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STUDENT_WITHDRAWN"
