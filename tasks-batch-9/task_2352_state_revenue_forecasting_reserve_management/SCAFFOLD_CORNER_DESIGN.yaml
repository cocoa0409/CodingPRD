            - { call: "GET /consensus-rounds/00000000-0000-0000-0000-000000000004", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e4: $.data.error_id } }
            - { call: "GET /source-estimates/00000000-0000-0000-0000-000000000005", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e5: $.data.error_id } }
            - { call: "GET /disagreement-records/00000000-0000-0000-0000-000000000006", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { e6: $.data.error_id } }
