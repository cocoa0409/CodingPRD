          Pair (state vs business_safety): KycCase in AWAITING_DOCUMENTS
          (wrong state) AND sanctions_hit=true (safety) both fail; the
          state error ERR_INVALID_STATE fires first because priority 5 <
          priority 6.
        test_recipe:
          setup:
            - "KycCase K in AWAITING_DOCUMENTS with sanctions_hit=true"
          setup_api_calls:
