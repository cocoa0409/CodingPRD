            - { call: "POST /wt/feed-stations/${k2_fs}/telemetry", payload: { recorded_at: "2026-08-01T00:00:00Z", feed_pulses: 10000, ml_per_pulse: 2.0, level_gal: 50 }, as: WaterChemist }
            - { call: "POST /wt/feed-stations/${k2_fs}/telemetry", payload: { recorded_at: "2026-08-08T12:00:00Z", feed_pulses: 10000, ml_per_pulse: 2.0, level_gal: 45 }, as: WaterChemist }
