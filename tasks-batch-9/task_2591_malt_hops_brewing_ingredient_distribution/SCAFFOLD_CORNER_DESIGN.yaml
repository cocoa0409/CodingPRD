            - "duplicate-timestamp reading at 10:20: HTTP 201 with ${r4_interval} == 0 and ${r4_cum} == 20 — an equal timestamp is accepted and contributes nothing"
            - "ColdChainShipment.${cr_s_id}.reading_count == 3, excursion_minutes == 20, last_reading_at == 2026-08-01T10:20:00Z and status == IN_TRANSIT — 20 has not passed MAX_EXCURSION_MINUTES 30"
