              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
          assert:
            - "batch_low: qualified_in_view_impressions == 0 (0.9 < 1.0 rejects the entire in-view claim, no pro-rating to 5400)"
            - "batch_low: unmeasurable_impressions == 2000, non_viewable_impressions == 8000, coverage_rate == 0.8000, viewability_rate == 0.0000"
            - "batch_low: 0 + 8000 + 2000 == 10000 == measured_impressions (INVARIANT_IMPRESSION_CONSERVATION)"
            - "batch_exact: qualified_in_view_impressions == 6000 (1.0 >= 1.0 - the threshold is inclusive)"
            - "batch_exact: unmeasurable_impressions == 2000, non_viewable_impressions == 2000, coverage_rate == 0.8000, viewability_rate == 0.7500"
            - "batch_exact: 6000 + 2000 + 2000 == 10000 == measured_impressions"
            - "Both batches share the identical coverage_rate 0.8000 - the time threshold moves only the viewability figures, never the coverage figure"

      - name: large_display_format_uses_its_own_pixel_threshold
        claim_type: correct_result
        grounds:
          - calculations.viewability_and_coverage
          - entities.MethodologyVersion.large_display_pixel_pct
          - entities.MethodologyVersion.display_pixel_pct
        distinguishing_aspect: |
          The same pixel reading of 0.35 must qualify under LARGE_DISPLAY
          (threshold 0.3) and fail under DISPLAY (threshold 0.5). An
          implementation that reads display_pixel_pct for every non-video
          format zeroes a perfectly viewable large-format delivery, and one
          that reads large_display_pixel_pct for everything certifies a
          standard banner that never met the standard.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; VIEWABILITY methodology at defaults display_pixel_pct 0.5, large_display_pixel_pct 0.3, display_in_view_seconds 1.0."
            - "Two campaigns on the same advertiser, one DISPLAY and one LARGE_DISPLAY; one page carries a batch for each (the batch window collision rule is scoped per page AND format, so the identical window is legal)."
            - "Both batches: measured 10000, measurable 8000, in_view 8000, avg_in_view_seconds 1.2, avg_in_view_pixel_pct 0.35."
