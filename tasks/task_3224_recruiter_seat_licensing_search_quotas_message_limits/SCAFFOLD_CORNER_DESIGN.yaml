scaffold_corner_design:
- section: entities
  instances:
  - name: contract_create_applies_defaults
    claim_type: defaults
    grounds:
    - entities.RecruiterContract.fields.contract_status
    - entities.RecruiterContract.fields.seats_purchased
    - entities.RecruiterContract.fields.true_up_allowed
    distinguishing_aspect: POST /contracts without true_up_allowed yields contract_status=PENDING_ACTIVATION, seats_purchased=0, true_up_allowed=true, period_index=0 or unset until activation.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-ENT-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
          st: $.data.contract_status
          sp: $.data.seats_purchased
          tu: $.data.true_up_allowed
      trigger:
      - call: GET /contracts/${cid}
        as: ContractAdmin
        captures:
          st2: $.data.contract_status
          sp2: $.data.seats_purchased
      assert:
      - contract_status == PENDING_ACTIVATION at creation and on re-read
      - seats_purchased == 0 and true_up_allowed == true (default applied)
  - name: recruiter_soft_deleted_excluded_from_default_list
    claim_type: computed_fields
    grounds:
    - entities.Recruiter.fields.recruiter_status
    - complexity_profile.complexity_layers
    distinguishing_aspect: 'A DEACTIVATED recruiter is soft-deleted: excluded from GET /recruiters by default, included when recruiter_status=DEACTIVATED is requested.'
    test_recipe:
      setup:
      - ACTIVE PRO contract; two recruiters R1 (deactivated) and R2 (active)
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-ENT-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /recruiters
        payload:
          email: sd1@x.com
          full_name: SD One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: POST /recruiters
        payload:
          email: sd2@x.com
          full_name: SD Two
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r2: $.data.id
      - call: POST /recruiters/${r1}/deactivate
        as: ContractAdmin
      trigger:
      - call: GET /recruiters
        as: Auditor
      - call: GET /recruiters
        as: Auditor
        payload:
          recruiter_status: DEACTIVATED
      assert:
      - default list contains R2 but not R1
      - filtered list with recruiter_status=DEACTIVATED contains R1
  - name: get_contract_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.RecruiterContract
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /contracts/{id} with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /contracts/00000000-0000-0000-0000-000000000000
        as: ContractAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND with http 404
- section: state_machines
  instances:
  - name: assign_assigned_seat_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Seat.UNASSIGNED_to_ASSIGNED
    - errors[ERR_SEAT_NOT_AVAILABLE]
    distinguishing_aspect: Seat already ASSIGNED rejects a second assign with ERR_SEAT_NOT_AVAILABLE (409), regardless of OCC version freshness.
    test_recipe:
      setup:
      - ACTIVE PRO contract, one seat assigned to R1, second recruiter R2 active and seatless
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-SM-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: sm1a@x.com
          full_name: SM 1a
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: POST /recruiters
        payload:
          email: sm1b@x.com
          full_name: SM 1b
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r2: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: GET /seats/${s1}
        as: ContractAdmin
        captures:
          s1v2: $.data.version
      trigger:
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r2}
          expected_seat_version: ${s1v2}
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_SEAT_NOT_AVAILABLE (seat is ASSIGNED; fresh OCC version does not rescue it)
  - name: record_response_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Message
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A message already RESPONDED rejects a second record-response with ERR_INVALID_STATE; the credit is returned exactly once.
    test_recipe:
      setup:
      - ACTIVE PRO contract, assigned seat, OPEN project, PUBLIC candidate, one SENT message already RESPONDED
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-SM-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: sm2@x.com
          full_name: SM Two
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: SM2P
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: sm2-c
          full_name: C
          headline: h
          privacy_setting: PUBLIC
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 1
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: b
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m1: $.data.id
      - call: POST /messages/${m1}/record-response
        payload:
          response_kind: RESPONDED
        as: AtsService
      trigger:
      - call: POST /messages/${m1}/record-response
        payload:
          response_kind: RESPONDED
        as: AtsService
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (response_status already RESPONDED)
  - name: posting_activate_without_slot_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.JobPosting.DRAFT_to_ACTIVE
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: JobPosting DRAFT -> ACTIVE requires at least one RESERVED/CONFIRMED PromotedSlot; with zero slots the activate is rejected with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - ACTIVE PRO contract with assigned seat; DRAFT posting with valid window and no promoted slots
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-SM-3
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: sm3@x.com
          full_name: SM Three
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/job-postings
        payload:
          title: NoSlot
          budget_cents: 5000
          daily_cap_cents: 1000
          pacing_mode: EVEN
          start_at: '2026-09-01T00:00:00Z'
          end_at: '2026-09-05T00:00:00Z'
          created_by_seat_id: ${s1}
        as: SeatAdmin
        captures:
          jp: $.data.id
      trigger:
      - call: POST /contracts/${cid}/job-postings/${jp}/activate
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (no RESERVED/CONFIRMED slot exists)
  - name: report_publish_from_draft_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.TalentInsightReport
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: TalentInsightReport publish requires GENERATED state; publishing a DRAFT report is rejected with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - ACTIVE PRO contract; one DRAFT talent insight report
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-SM-4
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /contracts/${cid}/talent-insights
        payload:
          report_name: R1
          filter_spec:
            current_title: Eng
        as: ContractAdmin
        captures:
          rep: $.data.id
      trigger:
      - call: POST /contracts/${cid}/talent-insights/${rep}/publish
        as: ContractAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (DRAFT is not publishable)
  - name: candidate_search_on_unassigned_seat_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Seat
    - errors[ERR_INVALID_STATE]
    - endpoints
    distinguishing_aspect: candidate-search requires the seat to be ASSIGNED with an OPEN QuotaLedger; an UNASSIGNED seat is rejected with ERR_INVALID_STATE.
    test_recipe:
      setup:
      - ACTIVE PRO contract with seats_purchased=1 and no assignments
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-SM-5
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
      trigger:
      - call: POST /seats/${s1}/candidate-search
        payload:
          filter_spec:
            current_title: t
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (seat UNASSIGNED has no OPEN ledger)
- section: calculations
  instances:
  - name: free_message_for_open_to_work_all_members
    claim_type: correct_result
    grounds:
    - calculations.credit_return_on_response
    - entities.Message.fields.credit_consumed
    distinguishing_aspect: A message to an open-to-work candidate with visibility ALL_MEMBERS consumes zero credits (credit_consumed=0) and the pool's credits_available is unchanged.
    test_recipe:
      setup:
      - ACTIVE PRO contract, assigned seat, OPEN project, one candidate open_to_work=true with open_to_work_visibility=ALL_MEMBERS and privacy_setting=PRIVATE
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-CALC-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: calc1@x.com
          full_name: Calc One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: CalcP
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: calc1-c
          full_name: C
          headline: h
          privacy_setting: PRIVATE
          open_to_work: true
          open_to_work_visibility: ALL_MEMBERS
          years_experience: 4
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      trigger:
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: b
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          cc: $.data.credit_consumed
      - call: GET /seats/${s1}/credit-pools
        as: Auditor
        captures:
          avail: $.data.0.credits_available
          used: $.data.0.credits_used
      assert:
      - Message.credit_consumed == 0
      - pool credits_used == 0 and credits_available == 100 (unchanged by the free send)
  - name: private_candidate_not_visible_blocks_send
    claim_type: correct_result
    grounds:
    - calculations.visibility_filter
    - errors[ERR_CANDIDATE_NOT_VISIBLE]
    distinguishing_aspect: 'A PRIVATE candidate who is not open-to-work is invisible: message send is rejected with ERR_CANDIDATE_NOT_VISIBLE and no credit is consumed.'
    test_recipe:
      setup:
      - ACTIVE PRO contract, assigned seat, OPEN project, one PRIVATE candidate open_to_work=false
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-CALC-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: calc2@x.com
          full_name: Calc Two
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: CalcP2
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: calc2-c
          full_name: C
          headline: h
          privacy_setting: PRIVATE
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 4
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      trigger:
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: b
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CANDIDATE_NOT_VISIBLE
  - name: negative_response_adds_one_strike_no_credit_return
    claim_type: correct_result
    grounds:
    - calculations.spam_strike_scoring
    - calculations.credit_return_on_response
    distinguishing_aspect: NEGATIVE_RESPONSE adds exactly 1 strike and returns no credit; REPORTED_AS_SPAM adds 2; the strike deltas differ by response kind.
    test_recipe:
      setup:
      - ACTIVE PRO contract, assigned seat, OPEN project, PUBLIC candidate, two SENT messages
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-CALC-3
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: calc3@x.com
          full_name: Calc Three
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: POST /contracts/${cid}/projects
        payload:
          name: CalcP3
          owner_seat_id: ${s1}
        as: SeatAdmin
        captures:
          p1: $.data.id
      - call: POST /projects/${p1}/open
        as: SeatAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: calc3-c
          full_name: C
          headline: h
          privacy_setting: PUBLIC
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 4
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: m1
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m1: $.data.id
      - call: POST /seats/${s1}/messages
        payload:
          candidate_id: ${c1}
          project_id: ${p1}
          body: m2
        as: RecruiterUser
        as_user_id: ${r1}
        captures:
          m2: $.data.id
      trigger:
      - call: POST /messages/${m1}/record-response
        payload:
          response_kind: NEGATIVE_RESPONSE
        as: AtsService
      - call: POST /messages/${m2}/record-response
        payload:
          response_kind: REPORTED_AS_SPAM
        as: AtsService
      - call: GET /seats/${s1}/credit-pools
        as: Auditor
        captures:
          strikes: $.data.0.spam_strike_count
          ret: $.data.0.credits_returned
          pool_st: $.data.0.pool_status
      assert:
      - spam_strike_count == 3 (1 from NEGATIVE_RESPONSE + 2 from REPORTED_AS_SPAM)
      - credits_returned == 0 (neither kind returns a credit)
      - pool_status == THROTTLED (strikes >= 3)
  - name: ats_duplicate_fingerprint_skips_second_write
    claim_type: correct_result
    grounds:
    - calculations.ats_duplicate_detection
    - entities.AtsSyncRecord.fields.sync_status
    distinguishing_aspect: 'Two sync records with identical (candidate, event_type, payload) under the same CONNECTED integration: first is WRITTEN, second is DUPLICATE_SKIPPED.'
    test_recipe:
      setup:
      - ACTIVE PRO contract, CONNECTED GREENHOUSE integration, one candidate
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-CALC-4
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /contracts/${cid}/ats-integrations
        payload:
          vendor: GREENHOUSE
          external_tenant_id: gh-dup
          write_back_enabled: true
        as: ContractAdmin
        captures:
          intg: $.data.id
      - call: POST /contracts/${cid}/ats-integrations/${intg}/connect
        as: ContractAdmin
      - call: POST /candidate-profiles
        payload:
          member_id: calc4-c
          full_name: C
          headline: h
          privacy_setting: PUBLIC
          open_to_work: false
          open_to_work_visibility: NONE
          years_experience: 1
          current_title: t
        as: ContractAdmin
        captures:
          c1: $.data.id
      trigger:
      - call: POST /ats-sync-records
        payload:
          ats_integration_id: ${intg}
          candidate_id: ${c1}
          external_candidate_ref: gh-x
          event_type: HIRED
          payload:
            stage: hired
        as: AtsService
        captures:
          st1: $.data.sync_status
      - call: POST /ats-sync-records
        payload:
          ats_integration_id: ${intg}
          candidate_id: ${c1}
          external_candidate_ref: gh-x
          event_type: HIRED
          payload:
            stage: hired
        as: AtsService
        captures:
          st2: $.data.sync_status
      assert:
      - first record sync_status == WRITTEN
      - second record sync_status == DUPLICATE_SKIPPED (identical payload_fingerprint)
- section: validations
  instances:
  - name: recruiter_already_seated_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=7]
    - errors[ERR_RECRUITER_ALREADY_SEATED]
    distinguishing_aspect: Assigning a second seat to a recruiter who already holds one is rejected with ERR_RECRUITER_ALREADY_SEATED.
    test_recipe:
      setup:
      - ACTIVE PRO contract with seats_purchased=2; recruiter R1 already assigned to seat S1; seat S2 UNASSIGNED
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-VAL-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 2
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: val1@x.com
          full_name: Val One
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
          s2: $.data.1.id
          s2v: $.data.1.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      trigger:
      - call: POST /contracts/${cid}/seats/${s2}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s2v}
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_RECRUITER_ALREADY_SEATED (seat non-sharing, priority 7)
  - name: trueup_bounds_violation_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=14]
    - errors[ERR_TRUEUP_BOUNDS]
    distinguishing_aspect: A TRUE_UP approve that would drop seats_purchased below seats_assigned is rejected with ERR_TRUEUP_BOUNDS on an ACTIVE contract (no state shadowing).
    test_recipe:
      setup:
      - ACTIVE PRO contract, seats_purchased=1, the one seat assigned (seats_assigned=1); PROPOSED TRUE_UP with seats_delta=-1
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-VAL-2
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: val2@x.com
          full_name: Val Two
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      - call: GET /contracts/${cid}
        as: ContractAdmin
        captures:
          cv: $.data.version
      - call: POST /contracts/${cid}/renewal-events
        payload:
          event_kind: TRUE_UP
          seats_delta: -1
          expected_contract_version: ${cv}
        as: Auditor
        captures:
          ev: $.data.id
      trigger:
      - call: POST /renewal-events/${ev}/approve
        as: Auditor
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_TRUEUP_BOUNDS (1 - 1 = 0 < seats_assigned=1)
  - name: posting_invalid_date_range_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=15]
    - errors[ERR_INVALID_DATE_RANGE]
    distinguishing_aspect: JobPosting creation with end_at less than one day after start_at is rejected with ERR_INVALID_DATE_RANGE.
    test_recipe:
      setup:
      - ACTIVE PRO contract with assigned seat
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-VAL-3
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /contracts/${cid}/activate
        payload:
          seats_purchased_initial: 1
        as: ContractAdmin
      - call: POST /recruiters
        payload:
          email: val3@x.com
          full_name: Val Three
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          r1: $.data.id
      - call: GET /contracts/${cid}/seats
        as: ContractAdmin
        captures:
          s1: $.data.0.id
          s1v: $.data.0.version
      - call: POST /contracts/${cid}/seats/${s1}/assign
        payload:
          recruiter_id: ${r1}
          expected_seat_version: ${s1v}
        as: SeatAdmin
      trigger:
      - call: POST /contracts/${cid}/job-postings
        payload:
          title: BadDates
          budget_cents: 5000
          daily_cap_cents: 1000
          pacing_mode: EVEN
          start_at: '2026-09-05T00:00:00Z'
          end_at: '2026-09-05T12:00:00Z'
          created_by_seat_id: ${s1}
        as: SeatAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_DATE_RANGE (end - start < 1 day)
  - name: duplicate_contract_number_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=16]
    - errors[ERR_DUPLICATE]
    distinguishing_aspect: A second contract with the same contract_number is rejected with ERR_DUPLICATE.
    test_recipe:
      setup:
      - one contract with contract_number C-DUP-1 exists
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-DUP-1
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
      trigger:
      - call: POST /contracts
        payload:
          contract_number: C-DUP-1
          product_tier: RECRUITER_LITE
          seat_cap: 9
        as: ContractAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DUPLICATE (contract_number is tenant-wide unique)
  - name: inactive_manager_reference_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=9]
    - errors[ERR_MANAGER_INACTIVE]
    distinguishing_aspect: POST /recruiters with manager_recruiter_id pointing to a DEACTIVATED recruiter is rejected with ERR_MANAGER_INACTIVE.
    test_recipe:
      setup:
      - ACTIVE contract; manager recruiter M created then deactivated
      setup_api_calls:
      - call: POST /contracts
        payload:
          contract_number: C-VAL-4
          product_tier: RECRUITER_PRO
          seat_cap: 3
        as: ContractAdmin
        captures:
          cid: $.data.id
      - call: POST /recruiters
        payload:
          email: mgr@x.com
          full_name: Mgr
          home_contract_id: ${cid}
        as: ContractAdmin
        captures:
          mgr: $.data.id
      - call: POST /recruiters/${mgr}/deactivate
        as: ContractAdmin
      trigger:
      - call: POST /recruiters
        payload:
          email: sub@x.com
          full_name: Sub
          home_contract_id: ${cid}
          manager_recruiter_id: ${mgr}
        as: ContractAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_MANAGER_INACTIVE (422)
  - name: pacing_violation_error_stub
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PACING_VIOLATION]
    excluded_because:
      difficulty_instance: budget_pacing_even_vs_front_loaded_same_spend
      rationale: "ERR_PACING_VIOLATION is asserted as the failure path of the named \xA71.8 instance (EVEN posting rejects the 1200-cent day-1 spend)."
  - name: aggregation_floor_error_stub
