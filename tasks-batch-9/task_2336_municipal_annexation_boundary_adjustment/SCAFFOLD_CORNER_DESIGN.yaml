  # =====================================================================================
  # SECTION 6 — RBAC
  # =====================================================================================
  - section: rbac
    instances:
      - name: a_role_cannot_perform_another_roles_exclusive_operation
        claim_type: exclusive_operation_denied
        grounds:
          - roles[MunicipalPlanner]
          - roles[CityClerk]
          - roles[PropertyOwner]
          - roles[FiscalAnalyst]
          - roles[CountyAssessor]
          - validations[priority=2]
        distinguishing_aspect: |
          Five exclusive operations are probed by the wrong role in one chain, and each is refused
          before any state or business rule is consulted: the planner cannot certify petition
          sufficiency, the clerk cannot open a case, a property owner cannot open a case, the clerk
          cannot author a fiscal analysis and the planner cannot post the tax roll. The probed
          calls are all otherwise well-formed against a case that is genuinely in the right state,
          so a 403 rather than a 409 is the only correct answer.
        test_recipe:
          setup:
            - "A TERRITORY_CERTIFIED PETITION_MAJORITY case with a CIRCULATING petition and a valid case version read back for the fiscal probe."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_r1: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_r1}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_r1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: CityClerk
              as_user_id: "${muni_r1}"
              captures: { ow_r1: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r1}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
              captures: { case_r1: $.data.id }
            - call: "POST /annexation-cases/${case_r1}/parcels"
              payload: { primary_owner_id: "${ow_r1}", parcel_apn: "R1-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
            - call: "POST /annexation-cases/${case_r1}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_r1}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
              captures: { pet_r1: $.data.id }
            - call: "GET /annexation-cases/${case_r1}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
              captures: { case_r1_ver: $.data.version }
          trigger:
            - call: "POST /petitions/${pet_r1}/certify-sufficiency"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
              captures: { r1_e_planner_clerk: $.data.error_id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r1}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: CityClerk
              as_user_id: "${muni_r1}"
              captures: { r1_e_clerk_planner: $.data.error_id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r1}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: PropertyOwner
              as_user_id: "${ow_r1}"
              captures: { r1_e_owner_planner: $.data.error_id }
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_r1}", analysis_method: "AVERAGE_COST", projected_population: 5, expected_case_version: "${case_r1_ver}" }
              as: CityClerk
              as_user_id: "${muni_r1}"
              captures: { r1_e_clerk_analyst: $.data.error_id }
            - call: "POST /annexation-cases/${case_r1}/post-tax-roll"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_r1}"
              captures: { r1_e_planner_assessor: $.data.error_id }
          assert:
            - "${r1_e_planner_clerk} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${r1_e_clerk_planner} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${r1_e_owner_planner} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${r1_e_clerk_analyst} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "${r1_e_planner_assessor} == ERR_ROLE_NOT_PERMITTED with status 403"
            - "Petition.${pet_r1}.sufficiency_status == CIRCULATING"
            - "GET /annexation-cases?municipality_id=${muni_r1} returns total_count == 1"
            - "GET /fiscal-impact-analyses?annexation_case_id=${case_r1} returns total_count == 0"

      - name: a_clerk_of_another_municipality_cannot_act_on_this_municipalitys_case
        claim_type: scope_isolation
        grounds:
          - validations[priority=3]
          - roles[CityClerk]
        distinguishing_aspect: |
          Both operators hold the CityClerk role, so the role check passes and the request is still
          refused on municipal scope: the clerk of Ridgeview may not schedule a hearing on Cedar
          Grove's case even when the payload names Cedar Grove correctly, and may not adopt Cedar
          Grove's plan of services. The peer-role isolation is by operator identity, not by payload.
        test_recipe:
          setup:
            - "Two municipalities under one statute; Cedar Grove holds a TERRITORY_CERTIFIED case with a DRAFT plan of services and Ridgeview holds nothing."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_r2: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_r2}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_r2a: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_r2}", name: "Ridgeview", state_code: "NC", population: 20000, citywide_annual_service_cost_cents: 400000000, citywide_population: 20000, general_fund_millage_rate: 8.0, corporate_boundary_perimeter_feet: 60000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_r2b: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_r2: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r2a}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r2a}"
              captures: { case_r2: $.data.id }
            - call: "POST /annexation-cases/${case_r2}/parcels"
              payload: { primary_owner_id: "${ow_r2}", parcel_apn: "R2-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r2a}"
            - call: "POST /annexation-cases/${case_r2}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_r2a}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_r2}" }
              as: MunicipalPlanner
              as_user_id: "${muni_r2a}"
              captures: { plan_r2: $.data.id }
          trigger:
            - call: "POST /public-hearings"
              payload: { annexation_case_id: "${case_r2}", municipality_id: "${muni_r2a}", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T20:00:00Z", protest_window_days: 30 }
              as: CityClerk
              as_user_id: "${muni_r2b}"
              captures: { r2_e_hearing: $.data.error_id }
            - call: "POST /plans-of-services/${plan_r2}/adopt"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_r2b}"
              captures: { r2_e_adopt: $.data.error_id }
            - call: "POST /annexation-cases/${case_r2}/parcels"
              payload: { primary_owner_id: "${ow_r2}", parcel_apn: "R2-2", assessed_value_cents: 10000000, acreage: 1.00, is_developed: true, dwelling_units: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_r2b}"
              captures: { r2_e_parcel: $.data.error_id }
          assert:
            - "${r2_e_hearing} == ERR_MUNICIPALITY_SCOPE_VIOLATION with status 403"
            - "${r2_e_adopt} == ERR_MUNICIPALITY_SCOPE_VIOLATION with status 403"
            - "${r2_e_parcel} == ERR_MUNICIPALITY_SCOPE_VIOLATION with status 403"
            - "PlanOfServices.${plan_r2}.adoption_status == DRAFT"
            - "GET /public-hearings?annexation_case_id=${case_r2} returns total_count == 0"
            - "GET /parcels?annexation_case_id=${case_r2} returns total_count == 1"

      - name: an_owner_cannot_sign_or_protest_on_behalf_of_another_owner
        claim_type: scope_isolation
        grounds:
          - validations[priority=4]
          - roles[PropertyOwner]
        distinguishing_aspect: |
          The PropertyOwner role is self-scoped: the acting operator id must equal the
          property_owner_id in the body. OW2 naming OW1 on a consent is refused even though OW1
          genuinely owns the parcel and the petition is genuinely circulating, and the same
          operator cannot withdraw OW1's existing consent.
