scenario: 'Edge Traffic Filtering, Bot Management & Abuse Handling (Cloudflare): domain

  onboarding through name server delegation or partial proxying with record

  proxy status, traffic filtering rules across firewall, rate limiting and

  managed rule sets with false positive tuning, bot classification

  distinguishing verified crawlers, likely automated and human traffic with

  score-based actions, denial-of-service mitigation with automatic thresholds

  and customer-configured sensitivity, caching rules, purge operations and

  origin shield behavior affecting content freshness, abuse report intake

  against hosted and proxied sites with a policy of forwarding to the origin

  host, plan tiers determining feature availability and support response,

  network capacity planning across points of presence

  '
domain_name: edge-traffic-filtering-bot-management
api_prefix: /api
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: access_control_matrix
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - conditional_feature_flags
  - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Account
  parent: null
  common_fields: true
  fields:
  - name: company_name
    type: string
    source: input
    description: Display name of the customer organization.
  - name: plan_tier
    type: enum
    source: input
    description: Subscription tier; feature availability and support SLA derive from it via the pinned plan_feature_matrix constants.
    constraints: 'enum: FREE | PRO | BUSINESS | ENTERPRISE'
  - name: account_email
    type: string
    source: input
    description: Primary contact email; abuse reports for HOSTED zones of this Account are notified here.
  - name: support_response_sla_hours
    type: integer
    source: computed
    description: 'First-response SLA in hours from plan_tier at creation: FREE=72, PRO=24, BUSINESS=8, ENTERPRISE=4 (support_sla_by_plan).'
- name: Pop
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Three-letter point-of-presence code, e.g. 'SFO'. The retire path is intentionally out of scope; a PoP with windows whose end_utc has passed and which shields no zone is simply unused.
    constraints: unique across Pop rows
  - name: capacity_baseline_gbps
    type: integer
    source: input
    description: Provisioned baseline capacity in Gbps for planning arithmetic.
    constraints: integer > 0
  - name: maintenance_windows
    type: array
    source: input
    description: Immutable window objects [{start_utc, end_utc, headroom_pct}] appended via POST /api/pops/{id}/maintenance-windows; each occupies the half-open interval [start_utc, end_utc) and headroom_pct
      is an integer in [1, 99].
    default: []
  - name: status
    type: enum
    source: system
    description: PoP lifecycle status; ACTIVE on creation. (No retirement transition is exposed in this version of the surface; the value is always ACTIVE.)
    constraints: 'enum: ACTIVE'
    default: ACTIVE
  - name: effective_capacity_gbps
    type: integer
    source: computed
    description: Computed by effective_pop_capacity; populated on GET /api/pops/{id} only when as_of_utc is supplied.
    default: null
  - name: planned_utilization_pct
    type: integer
    source: computed
    description: Computed by effective_pop_capacity; populated on GET /api/pops/{id} only when as_of_utc and reserved_gbps are supplied.
    default: null
- name: Zone
  parent: Account
  common_fields: true
  fields:
  - name: account_id
    type: string
    source: input
    description: FK -> Account.id; owning account.
  - name: domain_name
    type: string
    source: input
    description: Fully qualified domain name of the zone.
    constraints: unique across all Zones regardless of account
  - name: onboarding_type
    type: enum
    source: input
    description: FULL = authoritative name-server delegation; PARTIAL = partial proxying over delegated sub-records.
    constraints: 'enum: FULL | PARTIAL'
  - name: origin_host_email
    type: string
    source: input
    description: Contact of the hosting provider for this zone; abuse forwarding target for PROXIED routing.
  - name: status
    type: enum
    source: system
    description: Zone onboarding state machine (see §1.2).
    constraints: 'enum: PENDING | ACTIVE | MOVED | DELETED'
  - name: dns_records
    type: array
    source: input
    description: Record objects [{name, record_type, content, proxied}]; record_type enum A|AAAA|CNAME|TXT; name unique within the zone; proxied may be true only for A/AAAA/CNAME. Replace-all via PATCH
      /api/zones/{id} or seed at POST /api/zones.
    default: []
  - name: bot_fight_mode
    type: boolean
    source: input
    description: When true, requests with bot_score in [1,29] are blocked with action_taken BLOCK:FIGHT_MODE. Toggling requires bot_classification_feature.
    default: false
  - name: dos_sensitivity
    type: enum
    source: input
    description: Customer-configured DoS sensitivity; selects SENSITIVITY_MULTIPLIER in dos_mitigation_effective_trigger.
    constraints: 'enum: DEFAULT | LOW | HIGH'
    default: DEFAULT
  - name: dos_mitigation_active
    type: boolean
    source: computed
    description: True while any DdosEvent of this zone is ACTIVATED.
    default: false
  - name: origin_shield_pop_code
    type: string
    source: input
    description: Code of the shield PoP; must equal an existing ACTIVE Pop.code when non-null (ERR_NOT_FOUND otherwise). Setting non-null requires origin_shield_feature; null clears. Shield tiering degrades
      purge completion latency (purge_request_status).
    default: null
  - name: edge_ttl_seconds
    type: integer
    source: input
    description: Cache time-to-live at the edge; governs content freshness after purge (cache_freshness_window).
    constraints: integer > 0
    default: 3600
  - name: cache_reserve
    type: boolean
    source: input
    description: Opt the zone's tiered cache into reserve storage; setting true requires cache_reserve_feature.
    default: false
  - name: last_purged_at
    type: datetime
    source: system
    description: Logical-clock completion timestamp of the most recent PURGE_ALL; null when never purged. PURGE_URL completions never stamp it.
    default: null
  - name: honeypot_paths
    type: array
    source: input
    description: Trap URL paths (strings, unique within the zone). Hits are recorded via POST /api/zones/{id}/honeypot-hits into an internal hit log (hit_at, client_ip) used by bot_classification's lookback.
    default: []
  - name: traffic_rules
    type: array
    source: input
    description: Rule objects [{name, rule_kind, expression, action, rate_limit_threshold_rpm, status}]; name unique within the zone; rule_kind enum FIREWALL_FILTER|RATE_LIMIT; action enum ALLOW|BLOCK;
      status enum ACTIVE|DISABLED; rate_limit_threshold_rpm required iff RATE_LIMIT.
    default: []
  - name: ruleset_subscriptions
    type: array
    source: input
    description: 'Subscription objects [{slug, sensitivity, status, overrides}]; slug unique within the zone; sensitivity enum LOW|MEDIUM|HIGH; status enum ACTIVE|UNSUBSCRIBED; overrides: [{managed_rule_id,
      override_action, status}] with managed_rule_id unique within the subscription, override_action enum DISABLE|CHALLENGE, status enum ACTIVE|REVERTED.'
    default: []
  - name: bot_action_bands
    type: array
    source: input
    description: Score-band actions [{name, action, min_score, max_score, status}]; name unique within the zone; action enum BLOCK|CHALLENGE|LOG; closed [min_score, max_score] bands of ACTIVE items must
      not overlap; status enum ACTIVE|DISABLED.
    default: []
  - name: bot_classifications
    type: array
    source: computed
    description: Classification log items [{request_fingerprint, verified_crawler, client_ip, classification, bot_score, classified_at, action_taken}] appended by POST /api/zones/{id}/bot-classifications;
      request_fingerprint unique within the zone.
    default: []
  - name: active_rules_count
    type: integer
    source: computed
    description: Count of traffic_rules items with status == ACTIVE (managed_ruleset_false_positive_rate).
  - name: disabled_managed_rules_count
    type: integer
    source: computed
    description: Count of overrides with override_action == DISABLE and status == ACTIVE across subscriptions with status == ACTIVE.
  - name: false_positive_rate_pct
    type: integer
    source: computed
    description: managed_ruleset_false_positive_rate output, recomputed on every read of the zone.
- name: DdosEvent
  parent: Zone
  common_fields: true
  fields:
  - name: zone_id
    type: string
    source: input
    description: FK -> Zone.id; attacked zone.
  - name: observed_rps
    type: integer
    source: input
    description: Observed requests-per-second spike fed to dos_mitigation_effective_trigger.
    constraints: integer >= 0
  - name: baseline_rps
    type: integer
    source: input
    description: Zone's ordinary traffic baseline in requests-per-second.
    constraints: integer > 0
  - name: trigger_threshold_rps
    type: integer
    source: computed
    description: floor(baseline_rps * AUTO_THRESHOLD_MULTIPLIER * SENSITIVITY_MULTIPLIER[zone.dos_sensitivity]) computed at ingest.
  - name: auto_mitigated
    type: boolean
    source: computed
    description: True when observed_rps >= trigger_threshold_rps at ingest; drives the automatic ACTIVATED status.
  - name: status
    type: enum
    source: system
    description: 'DDoS event lifecycle: ACTIVATED by automatic trigger, ENDED by operator or auto-expiry.'
    constraints: 'enum: ACTIVATED | ENDED'
  - name: activated_at
    type: datetime
    source: system
    description: Logical-clock timestamp when the event was ingested.
  - name: expires_at
    type: datetime
    source: computed
    description: activated_at + AUTO_MITIGATION_TTL_HOURS; the event auto-ends when the logical clock reaches this instant.
- name: PurgeRequest
  parent: Zone
  common_fields: true
  fields:
  - name: zone_id
    type: string
    source: input
    description: FK -> Zone.id; zone whose cached content is purged.
  - name: purge_type
    type: enum
    source: input
    description: PURGE_ALL clears every object for the zone; PURGE_URL clears enumerated URLs only.
    constraints: 'enum: PURGE_ALL | PURGE_URL'
  - name: urls
    type: array
    source: input
    description: Explicit URL list; required and non-empty iff purge_type == PURGE_URL, forbidden otherwise.
  - name: status
    type: enum
    source: system
    description: PurgeRequest lifecycle; completion is clock-driven per purge_request_status.
    constraints: 'enum: QUEUED | IN_PROGRESS | COMPLETED'
  - name: requested_at
    type: datetime
    source: system
    description: Logical-clock timestamp at submission; the per-entry completion deadline anchors here.
  - name: origin_shield_degraded
    type: boolean
    source: computed
    description: 'True when the zone has origin_shield_pop_code set at submission: shield tiering doubles per-entry completion latency, degrading post-purge freshness.'
- name: IpBlock
  parent: Zone
  common_fields: true
  fields:
  - name: zone_id
    type: string
    source: input
    description: FK -> Zone.id; zone this block protects.
  - name: ip
    type: string
    source: input
    description: IPv4 or IPv6 address under block.
    constraints: unique per zone among non-RELEASED blocks
  - name: ip_version
    type: enum
    source: input
    description: Address family; must match the shape of ip (dotted-quad vs colon-separated).
    constraints: 'enum: V4 | V6'
  - name: reason
    type: string
    source: input
    description: Human-readable justification for the block.
  - name: status
    type: enum
    source: system
    description: Provisional vs confirmed block lifecycle (see §1.2).
    constraints: 'enum: PROVISIONAL | CONFIRMED | EXPIRED'
  - name: confirmed_at
    type: datetime
    source: system
    description: Logical-clock timestamp of confirmation; null while PROVISIONAL.
    default: null
  - name: expires_at
    type: datetime
    source: computed
    description: 'PROVISIONAL: created_at + 900s. CONFIRMED: confirmed_at + 3600s, recomputed by block_expiry on extension (never shortens).'
  - name: blocked_seconds_total
    type: integer
    source: computed
    description: 'Computed live on reads of a CONFIRMED block: round_half_up((now_utc - confirmed_at) * (1 - 0.025)) whole seconds; null while PROVISIONAL or after EXPIRED.'
    default: null
- name: AbuseReport
  parent: Zone
  common_fields: true
  fields:
  - name: zone_id
    type: string
    source: input
    description: FK -> Zone.id; zone the report targets. The reporting party is an unauthenticated outsider; the Zone is the anchor.
  - name: reporter_email
    type: string
    source: input
    description: Contact of the reporter.
  - name: category
    type: enum
    source: input
    description: Abuse category.
    constraints: 'enum: PHISHING | MALWARE | CSAM | SPAM | COPYRIGHT | OTHER'
  - name: description
    type: string
    source: input
    description: Free-form report body.
  - name: target_url
    type: string
    source: input
    description: Offending URL on the zone.
  - name: reporter_trust_score
    type: integer
    source: input
    description: Reporter trust score 1..100; feeds abuse_trust_priority.
    constraints: integer in [1, 100]
  - name: priority_score
    type: integer
    source: computed
    description: 'Output of abuse_trust_priority: CATEGORY_BASE[category] + reporter_trust_score.'
  - name: routing_mode
    type: enum
    source: computed
    description: HOSTED (trust relationship — notify account_email) when zone.onboarding_type == FULL, else PROXIED (forward to origin host); computed at submission.
    constraints: 'enum: HOSTED | PROXIED'
  - name: forwarded_to
    type: string
    source: computed
    description: 'Destination recorded at FORWARDED: zone.origin_host_email (all reports follow the forwarding policy — hosted sites notify the account contact via account_email in the same forward record
      when routing_mode == HOSTED).'
    default: null
  - name: status
    type: enum
    source: system
    description: AbuseReport lifecycle with the REVIEWING <-> ACTION_TAKEN reconsideration loop (see §1.2).
    constraints: 'enum: SUBMITTED | REVIEWING | FORWARDED | ACTION_TAKEN | CLOSED'
  - name: forwarded_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the forward.
    default: null
  - name: resolved_at
    type: datetime
    source: system
    description: Logical-clock timestamp when the report reached CLOSED.
    default: null
state_machines:
- entity: Zone
  initial_state: PENDING
  terminal_states:
  - DELETED
  transitions:
  - from: PENDING
    to: ACTIVE
    trigger: POST /api/zones/{id}/verify
    actor: ZoneAdmin
    preconditions:
    - zone.status == PENDING
    - 'If zone.onboarding_type == FULL: count of dns_records items with proxied == true >= 1'
    - 'If zone.onboarding_type == PARTIAL: zone owns >= 1 proxied A/AAAA/CNAME record AND every proxied record with record_type == CNAME has content ending with ''.cdn.example.net'''
    side_effects:
    - Zone.version increments by 1
    note: Verification delegates the zone to the edge; a MOVED zone can be re-verified back to ACTIVE (re-delegation loop).
  - from: ACTIVE
    to: MOVED
    trigger: 'system: POST /api/_clock/set_current_utc — periodic delegation re-check: FULL zone whose dns_records no longer contain any proxied record, or PARTIAL zone whose proxied CNAME set no longer
      satisfies the .cdn.example.net suffix rule'
    actor: system
    preconditions:
    - zone.status == ACTIVE
    - the zone's current dns_records fail the verification delegation precondition (proxied record set no longer qualifies)
    side_effects:
    - Zone.version increments by 1
    - Every traffic_rules item with status == ACTIVE flips to DISABLED
    - Every bot_action_bands item with status == ACTIVE flips to DISABLED
    - Every DdosEvent with zone_id == zone.id and status == ACTIVATED flips to ENDED and zone.dos_mitigation_active := false
    note: 'Cascade A hop 1 (Rule 4): losing delegation disables every enforcement layer; each disabled item is itself the reason follow-up mutations fail (hop 2). The MOVED -> ACTIVE re-verification loop
      closes the cycle.'
  - from: MOVED
    to: ACTIVE
    trigger: POST /api/zones/{id}/verify
    actor: ZoneAdmin
    preconditions:
    - zone.status == MOVED
    - 'If zone.onboarding_type == FULL: count of dns_records items with proxied == true >= 1'
    - 'If zone.onboarding_type == PARTIAL: zone owns >= 1 proxied A/AAAA/CNAME record AND every proxied record with record_type == CNAME has content ending with ''.cdn.example.net'''
    side_effects:
    - Zone.version increments by 1
    note: Re-delegation closes the PENDING->ACTIVE->MOVED->ACTIVE cycle; disabled rules and bands stay DISABLED (no automatic re-enable).
  - from: ACTIVE
    to: DELETED
    trigger: DELETE /api/zones/{id}
    actor: ZoneAdmin
    preconditions:
    - zone.status == ACTIVE
    side_effects:
    - Zone.version increments by 1
    - Every AbuseReport with zone_id == zone.id and status in {SUBMITTED, REVIEWING} flips to CLOSED with resolved_at := current logical time
  - from: PENDING
    to: DELETED
    trigger: DELETE /api/zones/{id}
    actor: ZoneAdmin
    preconditions:
    - zone.status == PENDING
    side_effects:
    - Zone.version increments by 1
- entity: DdosEvent
  initial_state: ACTIVATED
  terminal_states:
  - ENDED
  transitions:
  - from: ACTIVATED
    to: ENDED
    trigger: 'system: logical clock reaches event.expires_at (via POST /api/_clock/set_current_utc)'
    actor: system
    preconditions:
    - event.status == ACTIVATED
    - current logical time >= event.expires_at
    side_effects:
    - DdosEvent.version increments by 1
    - If no other DdosEvent with zone_id == event.zone_id remains ACTIVATED, zone.dos_mitigation_active := false
    note: Auto-expiry after AUTO_MITIGATION_TTL_HOURS.
- entity: PurgeRequest
  initial_state: QUEUED
  terminal_states:
  - COMPLETED
  transitions:
  - from: QUEUED
    to: IN_PROGRESS
    trigger: 'system: logical clock advances past requested_at (via POST /api/_clock/set_current_utc)'
    actor: system
    preconditions:
    - purge_request.status == QUEUED
    - current logical time > purge_request.requested_at
    side_effects:
    - PurgeRequest.version increments by 1
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: 'system: logical clock reaches requested_at + per-entry completion latency (via POST /api/_clock/set_current_utc)'
    actor: system
    preconditions:
    - purge_request.status == IN_PROGRESS
    - current logical time >= purge_request.requested_at + PER_ENTRY_COMPLETION_SECONDS (0 unshielded, 900 when origin_shield_pop_code is set)
    side_effects:
    - PurgeRequest.version increments by 1
    - 'For PURGE_ALL: zone.last_purged_at := completion timestamp'
    - cache_freshness_window runs for the zone's cached objects
    note: A request submitted when the clock already equals a later time can traverse QUEUED->IN_PROGRESS->COMPLETED within one clock-set; each hop is still evaluated in order.
- entity: IpBlock
  initial_state: PROVISIONAL
  terminal_states:
  - EXPIRED
  transitions:
  - from: PROVISIONAL
    to: CONFIRMED
    trigger: POST /api/ip-blocks/{id}/confirm
    actor: TrustSafetyAnalyst
    preconditions:
    - block.status == PROVISIONAL
    - current logical time < block.expires_at (provisional window still open)
    side_effects:
    - IpBlock.version increments by 1
    - confirmed_at := current logical time
    - expires_at := confirmed_at + BLOCK_BASE_SECONDS
  - from: PROVISIONAL
    to: EXPIRED
    trigger: 'system: logical clock reaches block.expires_at while PROVISIONAL (via POST /api/_clock/set_current_utc)'
    actor: system
    preconditions:
    - block.status == PROVISIONAL
    - current logical time >= block.expires_at
    side_effects:
    - IpBlock.version increments by 1
    note: Provisional block that is never confirmed lapses automatically at the 900-second window.
  - from: CONFIRMED
    to: EXPIRED
    trigger: 'system: logical clock reaches block.expires_at while CONFIRMED (via POST /api/_clock/set_current_utc)'
    actor: system
    preconditions:
    - block.status == CONFIRMED
    - current logical time >= block.expires_at
    side_effects:
    - IpBlock.version increments by 1
- entity: AbuseReport
  initial_state: SUBMITTED
  terminal_states:
  - CLOSED
  transitions:
  - from: SUBMITTED
    to: REVIEWING
    trigger: POST /api/abuse-reports/{id}/claim
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == SUBMITTED
    side_effects:
    - AbuseReport.version increments by 1
  - from: REVIEWING
    to: FORWARDED
    trigger: POST /api/abuse-reports/{id}/disposition with disposition=FORWARD
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == REVIEWING
    - zone(report.zone_id).status == ACTIVE
    side_effects:
    - AbuseReport.version increments by 1
    - forwarded_at := current logical time
    - 'If report.routing_mode == PROXIED: forwarded_to := zone.origin_host_email (forwarding policy for proxied sites)'
    - 'If report.routing_mode == HOSTED: forwarded_to := account(zone.account_id).account_email'
  - from: REVIEWING
    to: ACTION_TAKEN
    trigger: POST /api/abuse-reports/{id}/disposition with disposition=TAKE_ACTION
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == REVIEWING
    - zone(report.zone_id).status == ACTIVE
    side_effects:
    - AbuseReport.version increments by 1
  - from: ACTION_TAKEN
    to: REVIEWING
    trigger: POST /api/abuse-reports/{id}/claim (reconsideration)
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == ACTION_TAKEN
    side_effects:
    - AbuseReport.version increments by 1
    note: 'Reconsideration loop: a HOSTED action can be walked back into review, then re-acted or closed.'
  - from: FORWARDED
    to: CLOSED
    trigger: POST /api/abuse-reports/{id}/close
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == FORWARDED
    side_effects:
    - AbuseReport.version increments by 1
    - resolved_at := current logical time
  - from: ACTION_TAKEN
    to: CLOSED
    trigger: POST /api/abuse-reports/{id}/close
    actor: TrustSafetyAnalyst
    preconditions:
    - report.status == ACTION_TAKEN
    side_effects:
    - AbuseReport.version increments by 1
    - resolved_at := current logical time
concurrency_rules:
- rule_id: zone-sensitivity-stale-version
  parent_entity: Zone
  write_endpoint: PATCH /api/zones/{id}
  occ_field: expected_zone_version
  description: Patching a zone's DoS sensitivity with an expected_zone_version the client observed before another writer mutated the zone (verification, records replace, or an earlier sensitivity change)
    is rejected as stale, because the sensitivity the client configured may no longer match the zone's current mitigation posture.
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: support_sla_by_plan
  trigger: On Account creation
  algorithm: threshold
  formula: 'support_response_sla_hours := SUPPORT_SLA_HOURS[account.plan_tier]

    '
  input_set: Account.plan_tier
  constants:
    SUPPORT_SLA_HOURS:
      FREE: 72
      PRO: 24
      BUSINESS: 8
      ENTERPRISE: 4
  precision: integer hours, exact
- name: plan_feature_matrix
  trigger: Evaluated on every gated operation (validation priority 12)
  algorithm: constraint_propagation
  formula: 'feature(tier, flag) := PLAN_FEATURES[tier][flag]

    The matrix is a platform constant, not per-account data.

    '
  input_set: account.plan_tier x the gated flag name
  constants:
    PLAN_FEATURES:
      FREE:
        rate_limiting: false
        bot_classification: false
        managed_rulesets: false
        dos_sensitivity: false
        origin_shield: false
        cache_reserve: false
      PRO:
        rate_limiting: true
        bot_classification: true
        managed_rulesets: true
        dos_sensitivity: true
        origin_shield: true
        cache_reserve: false
      BUSINESS:
        rate_limiting: true
        bot_classification: true
        managed_rulesets: true
        dos_sensitivity: true
        origin_shield: true
        cache_reserve: true
      ENTERPRISE:
        rate_limiting: true
        bot_classification: true
        managed_rulesets: true
        dos_sensitivity: true
        origin_shield: true
        cache_reserve: true
  precision: boolean lookup, exact
- name: dos_mitigation_effective_trigger
  trigger: On POST /api/zones/{id}/ddos-events ingest, before the auto-activation decision
  algorithm: threshold
  formula: 'trigger_threshold_rps := floor(baseline_rps * AUTO_THRESHOLD_MULTIPLIER * SENSITIVITY_MULTIPLIER[zone.dos_sensitivity])

    auto_mitigated := (observed_rps >= trigger_threshold_rps)

    Evaluation order is fixed: floor is applied ONCE to the full product, never per-factor.

    '
  input_set: The DdosEvent's observed_rps and baseline_rps inputs plus zone.dos_sensitivity at ingest time
  constants:
    AUTO_THRESHOLD_MULTIPLIER: 20
    SENSITIVITY_MULTIPLIER:
      HIGH: 0.5
      DEFAULT: 1.0
      LOW: 2.0
    AUTO_MITIGATION_TTL_HOURS: 4
  precision: integer rps, floor applied once to the full product
- name: bot_classification
  trigger: On POST /api/zones/{id}/bot-classifications
  algorithm: weighted_scoring
  formula: "Step 1 (honeypot override): if plan_feature_matrix(zone tier, bot_classification) is true AND\n  the internal honeypot hit log of the zone holds a hit H with H.client_ip == request.client_ip\
    \ and\n  H.hit_at in [classified_at - 86400 seconds, classified_at] (closed interval),\n  then bot_score := 1, classification := HONEYPOT_BOT.\nStep 2 (verified crawler): else if verified_crawler ==\
    \ true, bot_score := 99,\n  classification := VERIFIED_BOT.\nStep 3 (heuristic): else bot_score := 1 + (hash(request_fingerprint) mod 99), where\n  hash(s) is the sum of the ASCII byte values of the\
    \ characters of s (deterministic,\n  case-sensitive); classification := HUMAN iff bot_score == 30, else LIKELY_AUTOMATED.\n"
  input_set: The request's fingerprint, verified_crawler flag, client_ip, zone plan tier, and the zone's honeypot hit log within the 24h lookback
  constants:
    HONEYPOT_LOOKBACK_SECONDS: 86400
    HUMAN_SCORE: 30
    VERIFIED_SCORE: 99
  precision: integer score in [1, 99]
  variants:
  - name: plan_scoped_honeypot
    when: Zone plan tier has bot_classification feature vs not
    difference: With the feature on, a honeypot-hit client classifies HONEYPOT_BOT (score 1); with the feature off, the identical request classifies via the heuristic score and may be HUMAN or LIKELY_AUTOMATED
      — same data, different result by plan context.
- name: bot_score_action
  trigger: Immediately after bot_classification on the same request
  algorithm: threshold
  formula: "if classification == VERIFIED_BOT: action_taken := \"ALLOW\"   # verified crawlers always pass\nelif classification == HONEYPOT_BOT: action_taken := \"BLOCK\"\nelse:\n  candidates := zone.bot_action_bands\
    \ items with status == ACTIVE\n    and min_score <= bot_score <= max_score\n  if candidates non-empty: action_taken := the candidate's action\n    (overlap among ACTIVE bands is forbidden by validation,\
    \ so at most one matches)\n  elif zone.bot_fight_mode == true and 1 <= bot_score <= 29:\n    action_taken := \"BLOCK:FIGHT_MODE\"\n  else: action_taken := \"ALLOW\"\n"
  input_set: bot_classification output, ACTIVE items of zone.bot_action_bands, zone.bot_fight_mode
  constants:
    FIGHT_MODE_MIN_SCORE: 1
    FIGHT_MODE_MAX_SCORE: 29
  precision: exact band membership; no rounding
- name: traffic_rule_trigger
  trigger: On POST /api/zones/{id}/traffic-hits
  algorithm: threshold
  formula: "window_start := occurred_at - (RATE_LIMIT_WINDOW_SECONDS - 1) seconds   # closed window\nFor each traffic_rules item R with rule_kind == RATE_LIMIT and status == ACTIVE:\n  N := count of the\
    \ rule's internal hit log rows with occurred_at in [window_start, occurred_at]\n  R triggers iff N >= R.rate_limit_threshold_rpm; only the threshold-crossing hit\n    has triggered == true in the response.\n\
    \  When R triggers and R.action == BLOCK and no non-RELEASED IpBlock exists for\n    (zone_id, client_ip), a PROVISIONAL IpBlock is created for client_ip.\nEvaluated only when the zone is ACTIVE and\
    \ zone.dos_mitigation_active == false.\n"
  input_set: The zone's ACTIVE RATE_LIMIT rules and their internal hit logs; blocked while the zone is under automatic mitigation
  constants:
    RATE_LIMIT_WINDOW_SECONDS: 60
  precision: 'integer count, closed-interval boundary: a hit exactly 60 seconds older than the crossing hit is excluded'
- name: managed_ruleset_false_positive_rate
  trigger: On every read of the zone (fields recomputed)
  algorithm: aggregation
  formula: "active_subs := ruleset_subscriptions items with status == ACTIVE\ndisabled_rules := count of overrides with override_action == DISABLE and\n  status == ACTIVE across active_subs\nactive_zone_rules\
    \ := count of traffic_rules items with status == ACTIVE\ndenominator := disabled_rules + active_zone_rules\nfalse_positive_rate_pct := if denominator == 0 then 0 else\n  round_half_up(100 * disabled_rules\
    \ / denominator)\nInput-set nuance: DISABLED traffic_rules items, REVERTED overrides and\n  UNSUBSCRIBED subscriptions are excluded.\n"
  input_set: zone.ruleset_subscriptions (with overrides) and zone.traffic_rules
  constants: {}
  precision: percentage integer, round_half_up
- name: purge_request_status
  trigger: After every POST /api/_clock/set_current_utc, for every non-COMPLETED PurgeRequest
  algorithm: projection
  formula: "PER_ENTRY_COMPLETION_SECONDS := if zone.origin_shield_pop_code is null then 0 else 900\nQUEUED -> IN_PROGRESS once the logical clock is strictly after requested_at;\nIN_PROGRESS -> COMPLETED\
    \ once the logical clock reaches\n  requested_at + PER_ENTRY_COMPLETION_SECONDS.\nWith no shield PoP the latency is 0, so completion follows immediately;\nwith a shield PoP configured the shield tiering\
    \ adds 900 seconds, so\ncompletion waits for the clock — identical purges complete at different\ntimes depending only on the shield flag.\n"
  input_set: Non-COMPLETED PurgeRequest rows, zone.origin_shield_pop_code, logical clock
  constants:
    SHIELD_PER_ENTRY_COMPLETION_SECONDS: 900
    UNSHIELDED_PER_ENTRY_COMPLETION_SECONDS: 0
  precision: whole seconds on the logical clock
  variants:
  - name: shield_degraded
    when: zone.origin_shield_pop_code set vs null
    difference: Shielded zones add 900s of completion latency (origin shield behavior degrading content freshness after purge); unshielded zones complete immediately. Identical purge inputs, different completion
      times.
- name: cache_freshness_window
  trigger: Whenever a PURGE_ALL PurgeRequest transitions to COMPLETED
  algorithm: projection
  formula: "zone.last_purged_at := completed_at\nAn object ingested at ingested_at is STALE at completion iff\n  completed_at - ingested_at >= zone.edge_ttl_seconds\n(an object exactly edge_ttl_seconds\
    \ old is STALE); PURGE_URL completions\nnever stamp last_purged_at.\n"
  input_set: PurgeRequest rows, zone.edge_ttl_seconds, completion timestamp
  constants: {}
  precision: whole seconds; boundary is >= edge_ttl_seconds
- name: abuse_trust_priority
  trigger: On POST /api/abuse-reports (at intake)
  algorithm: weighted_scoring
  formula: 'priority_score := CATEGORY_BASE[category] + reporter_trust_score

    No normalization or rounding; the score is exact integer addition.

    '
  input_set: report category and reporter_trust_score
  constants:
    CATEGORY_BASE:
      CSAM: 1000
      PHISHING: 800
      MALWARE: 700
      COPYRIGHT: 500
      SPAM: 300
      OTHER: 100
  precision: integer, exact
- name: effective_pop_capacity
  trigger: On GET /api/pops/{id} when as_of_utc is supplied
  algorithm: waterfall_allocation
  formula: "windows := pop.maintenance_windows items with start_utc <= as_of_utc < end_utc\n  (half-open occupancy)\nIf the pop is ACTIVE and windows is empty:\n  effective_capacity_gbps := capacity_baseline_gbps\n\
    If the pop is ACTIVE and windows is non-empty:\n  effective_capacity_gbps := floor(capacity_baseline_gbps *\n    min(headroom_pct over windows) / 100)\nIf the pop is RETIRED:\n  effective_capacity_gbps\
    \ := 0\nplanned_utilization_pct := if effective_capacity_gbps == 0 then 0 else\n  round_half_up(100 * reserved_gbps / effective_capacity_gbps)\nWhen as_of_utc is omitted both computed fields are null.\n"
  input_set: Pop row, maintenance_windows containing as_of_utc, reserved_gbps query input
  constants: {}
  precision: capacity in whole Gbps (floor); utilization percentage round_half_up
- name: block_expiry
  trigger: On PATCH /api/ip-blocks/{id} with extend=true (CONFIRMED blocks only); the max() anchor means extension past the current expiry point is the only way to keep a CONFIRMED block alive
  algorithm: chronological
  formula: "expires_at := max(current_expires_at, confirmed_at + BLOCK_BASE_SECONDS,\n                  now_utc + BLOCK_BASE_SECONDS)\nExtension never shortens an expiry; the base is re-anchored at the\
    \ later of\nthe confirmation timestamp and the request instant.\n"
  input_set: IpBlock.confirmed_at, current expires_at, logical clock
  constants:
    BLOCK_BASE_SECONDS: 3600
    PROVISIONAL_WINDOW_SECONDS: 900
  precision: whole seconds
- name: block_duration_total
  trigger: On every read of a CONFIRMED IpBlock (live computation against the logical clock)
  algorithm: chronological
  formula: "blocked_seconds_total := round_half_up((now_utc - confirmed_at) * (1 - RELEASE_GRACE_FRACTION))\n      The 2.5% grace fraction discounts the observed tail; rounding to whole seconds happens\n\
    \      once, after the multiplication — never per-term. The value freezes when the block\n      reaches EXPIRED (now_utc clamped to expires_at)."
  input_set: IpBlock.confirmed_at, logical clock (clamped at expires_at once expired)
  constants:
    RELEASE_GRACE_FRACTION: 0.025
  precision: whole seconds, round_half_up applied once to the product
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers are present and X-User-Role names a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: The acting role is authorized for this endpoint per the RBAC matrix
  error_id: ERR_UNAUTHORIZED
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Every id in the path resolves to an existing resource, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: Every request field carrying an FK or code reference (account_id, zone_id, origin_shield_pop_code -> Pop.code, subscription slug, band name, rule name, classification fingerprint) resolves to an
    existing resource or item
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all mutation endpoints with reference inputs
- priority: 5
  category: existence
  check: Required input fields are present, correctly typed, and enum values are members of the declared enum set
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all mutation endpoints
- priority: 6
  category: state
  check: 'The target resource is in a state that permits the operation: zone mutating endpoints (records/traffic-hits/bot-fight-mode/dos-sensitivity/bot-classifications/honeypots/honeypot-hits PATCH/POST
    under the zone) require zone.status == ACTIVE except verify (PENDING or MOVED) and DELETE (PENDING or ACTIVE); POST /api/zones requires an ACTIVE account; child creation (ddos-events, purge-requests,
    ip-blocks, abuse-reports) requires an ACTIVE zone and ACTIVE account'
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to:
  - POST /api/zones
  - POST /api/zones/{id}/verify
  - PATCH /api/zones/{id}
  - POST /api/zones/{id}/traffic-hits
  - POST /api/zones/{id}/bot-classifications
  - POST /api/zones/{id}/honeypots
  - POST /api/zones/{id}/honeypot-hits
  - POST /api/zones/{id}/ddos-events
  - POST /api/purge-requests
  - POST /api/ip-blocks
  - POST /api/abuse-reports
  - DELETE /api/zones/{id}
- priority: 7
  category: state
  check: The target resource is already in a terminal state (DELETED zone, ENDED DdosEvent, COMPLETED PurgeRequest, CLOSED AbuseReport, EXPIRED IpBlock)
  error_id: ERR_ALREADY_TERMINAL
  http_status: 409
  applies_to: all state-transition endpoints
- priority: 8
  category: business_constraint
  check: 'Uniqueness within scope: Zone.domain_name globally; dns_records[].name within the zone; Pop.code globally; honeypot_paths[] within the zone; traffic_rules[].name within the zone; ruleset_subscriptions[].slug
    within the zone; overrides[].managed_rule_id within a subscription; bot_action_bands[].name within the zone; bot_classifications[].request_fingerprint within the zone; IpBlock.ip among non-EXPIRED blocks
    of the zone'
  error_id: ERR_DUPLICATE_RESOURCE
  http_status: 409
  applies_to:
  - POST /api/zones
  - PATCH /api/zones/{id}
  - POST /api/pops
  - POST /api/zones/{id}/honeypots
  - POST /api/zones/{id}/bot-classifications
  - POST /api/ip-blocks
- priority: 9
  category: business_constraint
  check: 'Record proxy eligibility: dns_records[] items with proxied == true must have record_type A, AAAA or CNAME; TXT records must be proxied=false'
  error_id: ERR_PROXY_STATUS_INVALID
  http_status: 422
  applies_to:
  - POST /api/zones
  - PATCH /api/zones/{id}
- priority: 10
  category: business_constraint
  check: 'Zone verification delegation precondition: FULL zones need >= 1 proxied record; PARTIAL zones need >= 1 proxied A/AAAA/CNAME record and every proxied CNAME content must end with ''.cdn.example.net'''
  error_id: ERR_ZONE_VERIFICATION_FAILED
  http_status: 422
  applies_to:
  - POST /api/zones/{id}/verify
- priority: 11
  category: business_constraint
  check: 'Plan feature gating per plan_feature_matrix: rate_limiting for RATE_LIMIT items in traffic_rules; managed_rulesets for non-empty ruleset_subscriptions; bot_classification for non-empty bot_action_bands
    and for bot_fight_mode == true; dos_sensitivity for dos_sensitivity != DEFAULT; origin_shield for non-null origin_shield_pop_code; cache_reserve for cache_reserve == true — all evaluated on PATCH /api/zones/{id}'
  error_id: ERR_PLAN_FEATURE_UNAVAILABLE
  http_status: 402
  applies_to:
  - PATCH /api/zones/{id}
- priority: 12
  category: business_temporal
  check: Maintenance window end_utc must be strictly after start_utc
  error_id: ERR_INVALID_TIME_RANGE
  http_status: 422
  applies_to:
  - POST /api/pops/{id}/maintenance-windows
- priority: 13
  category: business_temporal
  check: 'Maintenance window overlap: a new window on a Pop conflicts with an existing window iff new.start_utc < existing.end_utc AND existing.start_utc < new.end_utc (half-open [start,end) occupancy);
    touching boundaries (new.start_utc == existing.end_utc or new.end_utc == existing.start_utc) do NOT conflict'
  error_id: ERR_WINDOW_OVERLAP
  http_status: 409
  applies_to:
  - POST /api/pops/{id}/maintenance-windows
- priority: 14
  category: business_constraint
  check: 'Traffic-rule action-conflict overlap: two traffic_rules items (ACTIVE or DISABLED) of the zone conflict iff they have rule_kind == FIREWALL_FILTER, identical expression and different action; identical
    expression with identical action is allowed (distinct names) but offers no extra enforcement'
  error_id: ERR_RULE_OVERLAP
  http_status: 409
  applies_to:
  - POST /api/zones
  - PATCH /api/zones/{id}
- priority: 15
  category: business_constraint
  check: 'Bot band overlap: a new or replaced bot_action_bands item''s closed [min_score, max_score] band must not intersect another ACTIVE item''s band (new.min_score <= existing.max_score AND existing.min_score
    <= new.max_score); adjacent bands (new.min_score == existing.max_score + 1) are allowed; min_score <= max_score required'
  error_id: ERR_BAND_OVERLAP
  http_status: 409
  applies_to:
  - POST /api/zones
  - PATCH /api/zones/{id}
- priority: 16
  category: business_constraint
  check: 'Structural field rules: traffic_rules[] rate_limit_threshold_rpm required iff rule_kind == RATE_LIMIT and forbidden otherwise; PurgeRequest.urls required non-empty iff purge_type == PURGE_URL
    and forbidden otherwise; bot_action_bands[] min_score <= max_score; IpBlock.ip_version consistent with the ip string shape; DdosEvent.baseline_rps > 0; maintenance window headroom_pct in [1, 99]'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to:
  - POST /api/zones
  - PATCH /api/zones/{id}
  - POST /api/purge-requests
  - POST /api/ip-blocks
  - POST /api/zones/{id}/ddos-events
  - POST /api/pops/{id}/maintenance-windows
- priority: 17
  category: business_referential
  check: disposition=TAKE_ACTION is permitted only on HOSTED-routing reports; PROXIED reports may only be forwarded (forwarding policy)
  error_id: ERR_ABUSE_ROUTING_VIOLATION
  http_status: 409
  applies_to:
  - POST /api/abuse-reports/{id}/disposition
- priority: 18
  category: business_temporal
  check: An ACTIVE zone under automatic mitigation (dos_mitigation_active == true) rejects new traffic hits and any traffic_rules replacement until every ACTIVATED DdosEvent has ended
  error_id: ERR_MITIGATION_ACTIVE
  http_status: 409
  applies_to:
  - POST /api/zones/{id}/traffic-hits
  - PATCH /api/zones/{id}
endpoints:
- method: POST
  path: /api/_clock/set_current_utc
  description: Advance the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never wall-clock). Drives DdosEvent auto-expiry, IpBlock expiry, and purge-request
    status transitions.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - current_utc
  output:
    current_utc: datetime
  side_effects:
  - Every ACTIVATED DdosEvent with expires_at <= current_utc transitions to ENDED and its zone's dos_mitigation_active recomputes
  - Every PROVISIONAL or CONFIRMED IpBlock with expires_at <= current_utc transitions to EXPIRED
  - purge_request_status advances every non-COMPLETED PurgeRequest whose deadlines the new time crosses
- method: POST
  path: /api/accounts
  description: Create a customer account; support_response_sla_hours derives from plan_tier via the pinned plan matrix.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - company_name
  - plan_tier
  - account_email
  output: Account
  side_effects:
  - support_sla_by_plan computes Account.support_response_sla_hours
- method: POST
  path: /api/pops
  description: Register a point of presence with baseline capacity.
  roles:
  - PlatformAdmin
  code: 201
  input:
  - code
  - capacity_baseline_gbps
  output: Pop
  side_effects: []
- method: GET
  path: /api/pops/{id}
  description: Read one PoP; when as_of_utc (and reserved_gbps) are supplied, effective_capacity_gbps and planned_utilization_pct are computed (effective_pop_capacity).
  roles:
  - PlatformAdmin
  - NetworkPlanner
  - ZoneAdmin
  code: 200
  input:
  - as_of_utc?
  - reserved_gbps?
  output: Pop
  side_effects: []
- method: POST
  path: /api/pops/{id}/maintenance-windows
  description: Append a maintenance window; half-open overlap with existing windows on the same PoP is rejected.
  roles:
  - NetworkPlanner
  code: 200
  input:
  - start_utc
  - end_utc
  - headroom_pct
  output: Pop
  side_effects:
  - The window is appended to Pop.maintenance_windows; Pop.version increments by 1
- method: POST
  path: /api/zones
  description: Onboard a zone (FULL or PARTIAL); may seed dns_records. Starts PENDING.
  roles:
  - ZoneAdmin
  code: 201
  input:
  - account_id
  - domain_name
  - onboarding_type
  - origin_host_email
  - dns_records?
  output: Zone
  side_effects: []
- method: GET
  path: /api/zones/{id}
  description: Read one zone with all embedded arrays and recomputed false-positive metrics.
  roles:
  - PlatformAdmin
  - ZoneAdmin
  - TrustSafetyAnalyst
  - NetworkPlanner
  code: 200
  input: []
  output: Zone
  side_effects:
  - managed_ruleset_false_positive_rate recomputes active_rules_count, disabled_managed_rules_count, false_positive_rate_pct
- method: PATCH
  path: /api/zones/{id}
  description: Replace-all update of the zone's embedded collections, cache config, and toggles (dns_records, traffic_rules, ruleset_subscriptions, bot_action_bands, edge_ttl_seconds, cache_reserve, origin_shield_pop_code,
    bot_fight_mode, dos_sensitivity). Zone must be ACTIVE. expected_zone_version is required whenever dos_sensitivity is present (OCC on Zone.version). Version increments even when content is unchanged.
  roles:
  - ZoneAdmin
  code: 200
  input:
  - dns_records?
  - traffic_rules?
  - ruleset_subscriptions?
  - bot_action_bands?
  - edge_ttl_seconds?
  - cache_reserve?
  - origin_shield_pop_code?
  - bot_fight_mode?
  - dos_sensitivity?
  - expected_zone_version?
  output: Zone
  side_effects:
  - Zone.version increments by 1; replaced arrays are validated (duplicates, proxy eligibility, band overlap, rule overlap, plan gates); OCC check runs when dos_sensitivity is present
- method: POST
  path: /api/zones/{id}/verify
  description: Verify delegation / partial-proxy setup; PENDING->ACTIVE and MOVED->ACTIVE.
  roles:
  - ZoneAdmin
  code: 200
  input: []
  output: Zone
  side_effects:
  - Zone.status := ACTIVE per Zone state machine; Zone.version increments by 1
- method: DELETE
  path: /api/zones/{id}
  description: Delete an ACTIVE or PENDING zone; cascades child deletion and closes open abuse reports.
  roles:
  - ZoneAdmin
  code: 200
  input: []
  output: Zone
  side_effects:
  - Zone.status := DELETED plus deletion cascade
- method: POST
  path: /api/zones/{id}/traffic-hits
  description: Record a traffic hit at a logical timestamp; traffic_rule_trigger evaluates each ACTIVE RATE_LIMIT rule's rolling window and may create a PROVISIONAL IpBlock for client_ip.
  roles:
  - ZoneAdmin
  code: 201
  input:
  - occurred_at
  - client_ip
  output:
    triggered_rule_names: array
    blocked_ip_block_id: string
  side_effects:
  - traffic_rule_trigger evaluates the rolling 60s window; a triggering BLOCK rate-limit rule creates a PROVISIONAL IpBlock for client_ip
- method: POST
  path: /api/zones/{id}/bot-classifications
  description: Classify a request (verified crawler, likely automated, human) and apply the score-based action; appends to zone.bot_classifications.
  roles:
  - ZoneAdmin
  code: 201
  input:
  - request_fingerprint
  - verified_crawler
  - client_ip
  output:
    request_fingerprint: string
    verified_crawler: boolean
    client_ip: string
    classification: string
    bot_score: integer
    classified_at: datetime
    action_taken: string
  side_effects:
  - bot_classification computes classification and bot_score; bot_score_action computes action_taken
- method: POST
  path: /api/zones/{id}/honeypots
  description: Add a honeypot trap path to the zone (ungated; the plan feature controls whether the classification engine honors hits).
  roles:
  - ZoneAdmin
  code: 200
  input:
  - url_path
  output: Zone
  side_effects:
  - url_path appended to Zone.honeypot_paths; Zone.version increments by 1
- method: POST
  path: /api/zones/{id}/honeypot-hits
  description: Record a client IP touching one of the zone's honeypot paths (drives honeypot classification lookback).
  roles:
  - ZoneAdmin
  code: 201
  input:
  - client_ip
  - url_path
  output:
    honeypot_path: string
    client_ip: string
    hit_at: datetime
  side_effects:
  - hit appended to the zone's internal honeypot hit log
- method: POST
  path: /api/zones/{id}/ddos-events
  description: Ingest a traffic-spike observation; automatic threshold evaluation may activate mitigation.
  roles:
  - ZoneAdmin
  - PlatformAdmin
  code: 201
  input:
  - observed_rps
  - baseline_rps
  output: DdosEvent
  side_effects:
  - dos_mitigation_effective_trigger computes trigger_threshold_rps and auto_mitigated; on activation Zone.dos_mitigation_active := true and expires_at := activated_at + AUTO_MITIGATION_TTL_HOURS
- method: POST
  path: /api/purge-requests
  description: Submit a purge for a zone (PURGE_ALL or PURGE_URL); urls required iff PURGE_URL.
  roles:
  - ZoneAdmin
  code: 201
  input:
  - zone_id
  - purge_type
  - urls?
  output: PurgeRequest
  side_effects:
  - origin_shield_degraded computed from zone.origin_shield_pop_code
- method: POST
  path: /api/ip-blocks
  description: Provisionally block an IP for a zone (evidence pending confirmation).
  roles:
  - TrustSafetyAnalyst
  code: 201
  input:
  - zone_id
  - ip
  - ip_version
  - reason
  output: IpBlock
  side_effects:
  - IpBlock.status := PROVISIONAL; expires_at := created_at + PROVISIONAL_WINDOW_SECONDS
- method: POST
  path: /api/ip-blocks/{id}/confirm
  description: Confirm a PROVISIONAL block before its 900s window lapses; re-anchors expiry at confirmed_at + 3600s.
  roles:
  - TrustSafetyAnalyst
  code: 200
  input: []
  output: IpBlock
  side_effects:
  - IpBlock.status := CONFIRMED; confirmed_at set; expires_at recomputed per IpBlock state machine
- method: PATCH
  path: /api/ip-blocks/{id}
  description: Extend a CONFIRMED block (extend=true) per block_expiry; never shortens expiry.
  roles:
  - TrustSafetyAnalyst
  code: 200
  input:
  - extend
  output: IpBlock
  side_effects:
  - block_expiry recomputes expires_at; IpBlock.version increments by 1
- method: POST
  path: /api/abuse-reports
  description: Public intake of an abuse report against a hosted or proxied zone.
  roles:
  - Anonymous
  code: 201
  input:
  - zone_id
  - reporter_email
  - category
  - description
  - target_url
  - reporter_trust_score
  output: AbuseReport
  side_effects:
  - abuse_trust_priority computes priority_score; routing_mode computed from zone.onboarding_type
- method: POST
  path: /api/abuse-reports/{id}/claim
  description: Claim a SUBMITTED report (or re-open an ACTION_TAKEN report for reconsideration).
  roles:
  - TrustSafetyAnalyst
  code: 200
  input: []
  output: AbuseReport
  side_effects:
  - AbuseReport.status := REVIEWING; AbuseReport.version increments by 1
- method: POST
  path: /api/abuse-reports/{id}/close
  description: Close a FORWARDED or ACTION_TAKEN report.
  roles:
  - TrustSafetyAnalyst
  code: 200
  input: []
  output: AbuseReport
  side_effects:
  - AbuseReport.status := CLOSED; resolved_at set; AbuseReport.version increments by 1
- method: GET
  path: /api/zones
  description: List zones; filters account_id, status, onboarding_type (reverse reachability for Zone.account_id).
  roles:
  - PlatformAdmin
  - ZoneAdmin
  - TrustSafetyAnalyst
  - NetworkPlanner
  code: 200
  input:
  - account_id?
  - status?
  - onboarding_type?
  - limit?
  - offset?
  output: Zone[]
  side_effects: []
- method: GET
  path: /api/ddos-events
  description: List DDoS events; filters zone_id, status (reverse reachability for DdosEvent.zone_id).
  roles:
  - ZoneAdmin
  - PlatformAdmin
  - NetworkPlanner
  code: 200
  input:
  - zone_id?
  - status?
  - limit?
  - offset?
  output: DdosEvent[]
  side_effects: []
- method: GET
  path: /api/ip-blocks
  description: List IP blocks; filters zone_id, status, ip (reverse reachability for IpBlock.zone_id).
  roles:
  - TrustSafetyAnalyst
  - PlatformAdmin
  - ZoneAdmin
  code: 200
  input:
  - zone_id?
  - status?
  - ip?
  - limit?
  - offset?
  output: IpBlock[]
  side_effects: []
- method: GET
  path: /api/ddos-events/{id}
  description: Read one DDoS event.
  roles:
  - ZoneAdmin
  - PlatformAdmin
  - NetworkPlanner
  code: 200
  input: []
  output: DdosEvent
  side_effects: []
- method: GET
  path: /api/purge-requests/{id}
  description: Read one purge request.
  roles:
  - ZoneAdmin
  - PlatformAdmin
  - NetworkPlanner
  code: 200
  input: []
  output: PurgeRequest
  side_effects: []
- method: GET
  path: /api/ip-blocks/{id}
  description: Read one IP block.
  roles:
  - TrustSafetyAnalyst
  - PlatformAdmin
  - ZoneAdmin
  code: 200
  input: []
  output: IpBlock
  side_effects: []
- method: GET
  path: /api/abuse-reports/{id}
  description: Read one abuse report.
  roles:
  - TrustSafetyAnalyst
  - PlatformAdmin
  code: 200
  input: []
  output: AbuseReport
  side_effects: []
- method: POST
  path: /api/abuse-reports/{id}/disposition
  description: 'Disposition a REVIEWING report: action FORWARD forwards per the forwarding policy (PROXIED -> origin host, HOSTED -> account contact); action TAKE_ACTION takes direct enforcement (HOSTED
    routing only).'
  roles:
  - TrustSafetyAnalyst
  code: 200
  input:
  - disposition
  output: AbuseReport
  side_effects:
  - AbuseReport.status := FORWARDED or ACTION_TAKEN per disposition; forwarded_at and forwarded_to computed on FORWARD; AbuseReport.version increments by 1
- method: GET
  path: /api/purge-requests
  description: List purge requests; filters zone_id, status (reverse reachability for PurgeRequest.zone_id).
  roles:
  - ZoneAdmin
  - PlatformAdmin
  - NetworkPlanner
  code: 200
  input:
  - zone_id?
  - status?
  - limit?
  - offset?
  output: PurgeRequest[]
  side_effects: []
- method: GET
  path: /api/abuse-reports
  description: List abuse reports; filters zone_id, status, category (reverse reachability for AbuseReport.zone_id).
  roles:
  - TrustSafetyAnalyst
  - PlatformAdmin
  code: 200
  input:
  - zone_id?
  - status?
  - category?
  - limit?
  - offset?
  output: AbuseReport[]
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers, or undeclared role
- id: ERR_UNAUTHORIZED
  http: 403
  condition: Role not permitted for this endpoint per the RBAC matrix
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id or reference (account_id, zone_id, pop code, slug, band/rule name, fingerprint) does not resolve
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, wrong type, invalid enum member, or structural field-rule violation (rate_limit_threshold_rpm, urls, band bounds, ip_version shape, baseline_rps > 0, headroom range)
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource is not in a state that permits the requested transition
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: Target resource is in a terminal state (DELETED, ENDED, COMPLETED, CLOSED, RELEASED, EXPIRED, RETIRED)
- id: ERR_STALE_VERSION
  http: 412
  condition: 'OCC mismatch: expected_zone_version does not equal the zone''s current version'
- id: ERR_DUPLICATE_RESOURCE
  http: 409
  condition: Scoped uniqueness violation (zone domain, record name, PoP code, honeypot path, rule/band/subscription name, fingerprint, non-released block ip)
- id: ERR_PROXY_STATUS_INVALID
  http: 422
  condition: proxied=true on a TXT record or other proxy-ineligible record type
- id: ERR_ZONE_VERIFICATION_FAILED
  http: 422
  condition: 'Delegation requirements unmet: FULL zone without a proxied record, or PARTIAL zone without a proxied A/AAAA/CNAME or with a proxied CNAME not pointing at .cdn.example.net'
- id: ERR_PLAN_FEATURE_UNAVAILABLE
  http: 402
  condition: The account's plan tier does not include the gated feature (rate limiting, managed rulesets, bot classification, DoS sensitivity, origin shield, cache reserve)
- id: ERR_INVALID_TIME_RANGE
  http: 422
  condition: Maintenance window end_utc not strictly after start_utc
- id: ERR_WINDOW_OVERLAP
  http: 409
  condition: Half-open overlap with an existing maintenance window on the same PoP
- id: ERR_RULE_OVERLAP
  http: 409
  condition: A firewall filter with the identical expression but opposite action already exists on the zone
- id: ERR_BAND_OVERLAP
  http: 409
  condition: Bot action score band intersects another ACTIVE band on the same zone
- id: ERR_ABUSE_ROUTING_VIOLATION
  http: 409
  condition: take-action attempted on a PROXIED-routing report (only forwarding is permitted for proxied sites)
- id: ERR_MITIGATION_ACTIVE
  http: 409
  condition: Zone is under automatic DoS mitigation; traffic-hit recording and traffic_rules replacement are frozen until every ACTIVATED DdosEvent ends
roles:
- name: PlatformAdmin
  description: Edge platform operator; seeds accounts and PoPs; superset read access; drives the logical clock.
  identity: opaque
  exclusive_operations:
  - POST /api/accounts
  - POST /api/pops
  - POST /api/_clock/set_current_utc
  shared_operations:
  - All GET endpoints
  - POST /api/zones/{id}/ddos-events
- name: ZoneAdmin
  description: Customer-side administrator of the zones of one account; X-User-ID equals the Account id whose zones it administers.
  identity: entity_backed:Account
  exclusive_operations:
  - POST /api/zones
  - PATCH /api/zones/{id}
  - POST /api/zones/{id}/verify
  - DELETE /api/zones/{id}
  - POST /api/zones/{id}/traffic-hits
  - POST /api/zones/{id}/bot-classifications
  - POST /api/zones/{id}/honeypots
  - POST /api/zones/{id}/honeypot-hits
  - POST /api/purge-requests
  shared_operations:
  - GET endpoints over own-account zones and their children
  - POST /api/zones/{id}/ddos-events
- name: TrustSafetyAnalyst
  description: Abuse desk operator; triages abuse reports and manages IP blocks.
  identity: opaque
  exclusive_operations:
  - POST /api/ip-blocks
  - POST /api/ip-blocks/{id}/confirm
  - PATCH /api/ip-blocks/{id}
  - POST /api/abuse-reports/{id}/claim
  - POST /api/abuse-reports/{id}/close
  - POST /api/abuse-reports/{id}/disposition
  shared_operations:
  - GET endpoints for abuse reports, IP blocks, zones, accounts
- name: NetworkPlanner
  description: Capacity engineer; schedules maintenance windows and reads capacity plans.
  identity: opaque
  exclusive_operations:
  - POST /api/pops/{id}/maintenance-windows
  shared_operations:
  - GET endpoints for PoPs, zones, DDoS events, purge requests
- name: Anonymous
  description: Unauthenticated public reporter; may only file abuse reports.
  identity: opaque
  exclusive_operations:
  - POST /api/abuse-reports
  shared_operations: []
