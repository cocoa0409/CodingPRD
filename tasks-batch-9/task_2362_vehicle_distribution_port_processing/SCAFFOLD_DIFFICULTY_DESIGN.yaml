# =============================================================================
# task_2362 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Logical clock default: 2026-08-01T00:00:00Z (POST /vpc/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: storage_charge_provisional_vs_final_diverge_on_same_unit
        grounds:
          - calculations.vehicle_storage_charge
          - entities.Vehicle.fields.storage_charge_provisional_cents
          - entities.Vehicle.fields.storage_charge_final_cents
          - entities.Vehicle.fields.blocked_credit_days
          - state_machines.Vehicle.processing_status.SHIPPING_READY_to_ALLOCATED
          - state_machines.Vehicle.processing_status.RELEASED_to_GATED_OUT
        distinguishing_aspect: |
          Yard cost accounting on the Vehicle entity: the PROVISIONAL variant projects the
          dwell end two days past the allocation instant and credits zero damage-blocked days
          (13050 cents), while the FINAL variant uses the actual gate-out instant and credits
          3 damage-blocked days (8700 cents) — same yard_in_at and same rate card, 4350 cents apart.
        test_recipe:
          setup:
            - "One center: free_storage_days 5, daily_storage_rate_cents 1450, yard_capacity_slots 50."
            - "One unit discharged at 2026-08-02T00:00:00Z, surveyed at 2026-08-03 with severity_index 53 (damage opened, claim NOT mandatory)."
            - "Repair authorized automatically and completed at 2026-08-06 -> damage REPAIRED, blocked_credit_days 3."
            - "Unit inspected, prepped, SHIPPING_READY; dealer in zone B at 285 miles; one carrier at 412 cents/mile."
            - "Clock at 2026-08-14T00:00:00Z when the allocation is made; 2026-08-16T00:00:00Z at gate-out."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000001", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "BODY_PANEL", severity_points: 40, repair_estimate_cents: 40000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 20000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/repair-orders"
              payload: { description: "Left panel and windshield", estimate_cents: 60000 }
              as: DamageSurveyor
              captures: { ro_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: DamageSurveyor
            - call: "POST /vpc/repair-orders/${ro_id}/complete"
              payload: { actual_cost_cents: 58000 }
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp_id: $.data.id }
            - call: "POST /vpc/quality-inspections/${insp_id}/complete"
              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_id}/prep-complete"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/dealers"
              payload: { dealer_code: "D-ATL", name: "Atlanta Motors", route_zone: "B", distance_miles: 285, allocation_quota: 2 }
              as: DistributionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-ROAD", name: "Roadway Auto Transport", served_route_zones: ["B"], linehaul_rate_cents_per_mile: 412, slot_capacity: 3, concurrent_load_capacity: 2 }
              as: DistributionManager
              captures: { carrier_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: DistributionManager
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: DistributionManager
              captures: { veh_v: $.data.version, credit_days: $.data.blocked_credit_days }
          trigger:
            - call: "POST /vpc/vehicles/${veh_id}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-16T08:00:00Z", pickup_window_end: "2026-08-16T12:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: DistributionManager
              captures: { rel_id: $.data.id }
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: DistributionManager
              captures: { prov_after_alloc: $.data.storage_charge_provisional_cents }
            - call: "POST /vpc/release-orders/${rel_id}/dispatch"
              payload: {}
              as: DistributionManager
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: DistributionManager
            - call: "POST /vpc/release-orders/${rel_id}/gate-out"
              payload: {}
              as: DistributionManager
          assert:
            - "${prov_after_alloc} == 13050 — PROVISIONAL: dwell_days ceil(2026-08-02 -> 2026-08-16) = 14, minus free_storage_days 5, minus credit_days 0, times 1450"
            - "${credit_days} == 3"
            - "Vehicle.${veh_id}.storage_charge_final_cents == 8700 — FINAL: same 14 dwell_days, minus 5 free, minus blocked_credit_days 3, times 1450"
            - "Vehicle.${veh_id}.storage_charge_provisional_cents == 0 after gate-out"
            - "13050 - 8700 == 4350: the two variants disagree on identical yard_in_at, identical rate card and identical unit"
            - "ProcessingCenter.${center_id}.realized_storage_revenue_cents == 8700"
            - "ProcessingCenter.${center_id}.provisional_storage_accrued_cents == 0"

      - name: claim_recoverable_survey_based_vs_repair_actual_basis_switch
        grounds:
          - calculations.carrier_claim_recoverable_amount
          - entities.CarrierClaim.fields.recoverable_basis
          - entities.CarrierClaim.fields.recoverable_amount_cents
          - state_machines.RepairOrder.AUTHORIZED_to_COMPLETED
        distinguishing_aspect: |
          Claims recovery on the CarrierClaim entity (a different entity domain from the
          Vehicle storage instance): SURVEY_BASED recovers 87000 from capped survey estimates,
          while REPAIR_ACTUAL latches at repair completion and recovers 36500 from the actual
          cost — a 50500-cent divergence from byte-identical survey data.
        test_recipe:
          setup:
            - "One unit discharged 2026-08-02, surveyed 2026-08-03 with line items 95000 (UNDERBODY, 34 pts) and 32000 (GLASS, 30 pts) -> severity_index 66, claimed_amount_cents 112000."
            - "A CarrierClaim filed from that survey under the SURVEY_BASED basis."
            - "A RepairOrder for 120000 cents (below the 150000 escalation threshold, so AUTO-authorized) linked to that claim."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000002", model_line: "TX300" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "UNDERBODY", severity_points: 34, repair_estimate_cents: 95000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 32000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
              captures: { sev: $.data.severity_index, survey_claimed: $.data.claimed_amount_cents }
            - call: "GET /vpc/damage-surveys/${survey_id}"
              payload: {}
              as: DamageSurveyor
              captures: { survey_v: $.data.version }
            - call: "POST /vpc/damage-surveys/${survey_id}/claims"
              payload: { carrier_scac: "OCNL", expected_damage_survey_version: "${survey_v}" }
              as: DamageSurveyor
              captures: { claim_id: $.data.id, rec_survey_based: $.data.recoverable_amount_cents, basis_at_filing: $.data.recoverable_basis }
            - call: "POST /vpc/vehicles/${veh_id}/repair-orders"
              payload: { description: "Underbody weld and windshield", estimate_cents: 120000, carrier_claim_id: "${claim_id}" }
              as: DamageSurveyor
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /vpc/repair-orders/${ro_id}/complete"
              payload: { actual_cost_cents: 61500 }
              as: DamageSurveyor
          assert:
            - "${sev} == 66 and ${survey_claimed} == 112000 (min(95000,80000) + min(32000,80000))"
            - "${basis_at_filing} == SURVEY_BASED"
            - "${rec_survey_based} == 87000 — SURVEY_BASED: 112000 minus the 25000 deductible"
            - "CarrierClaim.${claim_id}.recoverable_basis == REPAIR_ACTUAL after the repair completes"
            - "CarrierClaim.${claim_id}.recoverable_amount_cents == 36500 — REPAIR_ACTUAL: min(112000, 61500) minus 25000"
            - "CarrierClaim.${claim_id}.claimed_amount_cents == 112000 — unchanged by the basis switch"
            - "87000 - 36500 == 50500: the two variants disagree on identical survey line items"

  - rule_id: combinatorial_formula
    instances:
      - name: accessory_billing_rounds_per_unit_then_multiplies_by_qty
        grounds:
          - calculations.accessory_program_billing
          - entities.AccessoryKit.fields.unit_cost_cents
          - entities.AccessoryKit.fields.install_minutes_per_unit
          - entities.ProcessingCenter.fields.labor_rate_cents_per_hour
          - state_machines.AccessoryWorkOrder.KITTED_to_INSTALLED
        distinguishing_aspect: |
          Mode (b) nested rounding whose order is pinned: parts 12340 x 1.125 = 13882.5 rounds
          half-up to 13883 per unit BEFORE the qty multiplication, so 3 units bill 52449 — the
          sum-unrounded-then-round-after-multiplying order would bill 52448.
        test_recipe:
          setup:
            - "Center labor_rate_cents_per_hour 9000."
            - "Kit KIT-ALLOY-19: received_qty_total 10, unit_cost_cents 12340, install_minutes_per_unit 24."
            - "One unit SURVEYED (cosmetic survey, severity_index 20, damage stays NONE) with a PLANNED work order for qty 3, already kitted."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000003", model_line: "LX500", pio_program_code: "PIO-ALLOY" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/processing-centers/${center_id}/accessory-kits"
              payload: { kit_code: "KIT-ALLOY-19", program_code: "PIO-ALLOY", received_qty_total: 10, unit_cost_cents: 12340, install_minutes_per_unit: 24 }
              as: AccessoryTechnician
              captures: { kit_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/accessory-work-orders"
              payload: { accessory_kit_id: "${kit_id}", qty: 3 }
              as: AccessoryTechnician
              captures: { awo_id: $.data.id }
            - call: "POST /vpc/accessory-work-orders/${awo_id}/kit"
              payload: {}
              as: AccessoryTechnician
              as_user_id: "u-tech-1"
          trigger:
            - call: "POST /vpc/accessory-work-orders/${awo_id}/install"
              payload: {}
              as: AccessoryTechnician
              as_user_id: "u-tech-1"
          assert:
            - "AccessoryWorkOrder.${awo_id}.billed_cents == 52449 — (round_half_up(12340 x 1.125) 13883 + round_half_up(24 x 9000 / 60) 3600) x 3"
            - "AccessoryWorkOrder.${awo_id}.billed_cents != 52448 — the sum-then-round-after-multiplying order is rejected"
            - "Vehicle.${veh_id}.accessory_billed_cents == 52449"
            - "AccessoryKit.${kit_id}.on_hand_qty == 7 and AccessoryKit.${kit_id}.consumed_qty == 3"

      - name: freight_discount_tier_keyed_on_gross_not_on_post_discount_total
        grounds:
          - calculations.release_freight_settlement
          - entities.ReleaseOrder.fields.gross_freight_cents
          - entities.ReleaseOrder.fields.freight_discount_cents
          - entities.ReleaseOrder.fields.freight_total_cents
          - state_machines.ReleaseOrder.ALLOCATED_to_RELEASED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the tier is keyed
          on gross_freight_cents 125129 (>= 120000 -> 6%), giving discount 7508 and total 117621.
          Keying the tier on the post-discount total 117621 (< 120000 -> 3%) would yield discount
          3754 and total 121375, so the pinned order is observable in a single response.
        test_recipe:
          setup:
            - "Center fuel_surcharge_pct 0.0925."
            - "Dealer D-COL in route_zone B, distance_miles 268, allocation_quota 2."
            - "Carrier TC-ROAD at 412 cents/mile serving zone B, slot_capacity 3, concurrent_load_capacity 2."
            - "One unit SHIPPING_READY (cosmetic survey severity_index 20, inspection passed, prepped) and allocated to that dealer."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000004", model_line: "EV900" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vessels/${vessel_id}/complete-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "INTERIOR", severity_points: 20, repair_estimate_cents: 0 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
            - call: "POST /vpc/vehicles/${veh_id}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
              captures: { insp_id: $.data.id }
            - call: "POST /vpc/quality-inspections/${insp_id}/complete"
              payload: { outcome: "PASS", defect_count: 0 }
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/vehicles/${veh_id}/prep-complete"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
            - call: "POST /vpc/dealers"
              payload: { dealer_code: "D-COL", name: "Columbus Auto Group", route_zone: "B", distance_miles: 268, allocation_quota: 2 }
              as: DistributionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-ROAD", name: "Roadway Auto Transport", served_route_zones: ["B"], linehaul_rate_cents_per_mile: 412, slot_capacity: 3, concurrent_load_capacity: 2 }
              as: DistributionManager
              captures: { carrier_id: $.data.id }
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: DistributionManager
              captures: { veh_v: $.data.version }
            - call: "POST /vpc/vehicles/${veh_id}/allocations"
              payload: { dealer_id: "${dealer_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", expected_vehicle_version: "${veh_v}" }
              as: DistributionManager
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /vpc/release-orders/${rel_id}/dispatch"
              payload: {}
              as: DistributionManager
          assert:
            - "ReleaseOrder.${rel_id}.base_linehaul_cents == 110416 (step 1: 268 x 412)"
            - "ReleaseOrder.${rel_id}.fuel_surcharge_cents == 10213 (step 2: round_half_up(110416 x 0.0925), on base only)"
            - "ReleaseOrder.${rel_id}.zone_accessorial_cents == 4500 (step 3: zone B)"
            - "ReleaseOrder.${rel_id}.gross_freight_cents == 125129 (step 4)"
            - "ReleaseOrder.${rel_id}.freight_discount_cents == 7508 (steps 5-6: tier keyed on gross 125129 >= 120000 -> 6%, round_half_up(7507.74))"
            - "ReleaseOrder.${rel_id}.freight_total_cents == 117621 (step 7)"
            - "ReleaseOrder.${rel_id}.freight_discount_cents != 3754 — keying the tier on the post-discount total would have applied 3%"
            - "ReleaseOrder.${rel_id}.status == RELEASED"

      - name: damage_severity_index_nested_max_zone_weight_and_line_spread
        grounds:
          - calculations.damage_severity_index
          - entities.DamageSurvey.fields.severity_index
          - entities.Vehicle.fields.claim_mandatory
          - state_machines.DamageSurvey.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) three interacting inputs with non-linear composition: the per-line weighted
          products 34 x 1.8 = 61.2 and 30 x 1.5 = 45 are reduced by max() BEFORE rounding
          (61.2 -> 61), then the line-count spread 5 x (2 - 1) is added for 66 — summing the
          weighted lines (106) or rounding each line before the max (61 + 45) both differ.
        test_recipe:
          setup:
            - "One unit discharged 2026-08-02 in processing_status DISCHARGED with a DRAFT survey."
            - "Survey lines: UNDERBODY 34 points (weight 1.8) and GLASS 30 points (weight 1.5)."
