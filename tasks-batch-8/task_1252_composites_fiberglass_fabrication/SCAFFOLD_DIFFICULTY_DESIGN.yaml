            - { call: "POST /cure-cycles/${cc1}/start", payload: {}, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc1}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 181, recorded_soak_minutes: 120, recorded_ramp_rate_c_per_min: 3.0 }, as: CureTechnician }
