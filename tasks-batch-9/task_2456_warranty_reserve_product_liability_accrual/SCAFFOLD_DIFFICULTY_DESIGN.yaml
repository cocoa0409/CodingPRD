            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_m_id}", action_code: "FA-M-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-02-01", affected_build_end_date: "2025-04-30", affected_unit_count: 4000, regulatory_notice_filed: false }
