          - validations[priority=9]
          - validations[priority=46]
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: "The plan-level token guards a write that silently revokes an incumbent role holder, so it is checked at priority 9 — ahead of the window checks at 45 and 46. A request that is both stale and overlapping therefore reports staleness, and a request that is stale on a plan whose version moved only because of a sibling allocation is refused even though nothing about the role it names has changed. Acknowledgment, by contrast, touches only the allocation, so it does not invalidate a plan token held across it."
