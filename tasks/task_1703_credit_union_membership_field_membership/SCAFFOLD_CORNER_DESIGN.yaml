            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${m1}", captures: { ballot_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-21T00:00:00Z" }, as: SystemAdmin }
