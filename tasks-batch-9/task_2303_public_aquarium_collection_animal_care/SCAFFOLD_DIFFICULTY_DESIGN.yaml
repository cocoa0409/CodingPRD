      assert:
      - after the setup the permit is SUBMITTED with submission_round == 1 and missing_document_codes == []
      - trigger[0] leaves status == INFO_REQUESTED, submission_round unchanged at 1
      - trigger[1] returns 200 with status == SUBMITTED and submission_round == 2
      - trigger[3] returns 200 with status == SUBMITTED and submission_round == 3 — the ceiling itself is allowed
      - trigger[5] returns 409 ERR_ROUND_LIMIT_EXCEEDED because 3 + 1 > PERMIT_MAX_ROUNDS 3
