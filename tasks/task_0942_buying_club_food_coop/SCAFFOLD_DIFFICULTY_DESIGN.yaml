          expected_member_order_version: ${mo_a_v1}
        as: Member
        as_user_id: ${ma_id}
        captures:
          ol_a_oat: $.data.id
      - call: GET /member-orders/${mo_a}
        payload: {}
        as: Member
        as_user_id: ${ma_id}
        captures:
          mo_a_v2: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_a}
          item_id: ${i_berry}
          qty_units: 4
          expected_member_order_version: ${mo_a_v2}
        as: Member
        as_user_id: ${ma_id}
        captures:
          ol_a_berry: $.data.id
      - call: GET /member-orders/${mo_a}
        payload: {}
        as: Member
        as_user_id: ${ma_id}
        captures:
          mo_a_v3: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_a}
          item_id: ${i_cheese}
          qty_units: 4
          expected_member_order_version: ${mo_a_v3}
          substitution_pref: APPROVAL_REQUIRED
        as: Member
        as_user_id: ${ma_id}
        captures:
          ol_a_cheese: $.data.id
      - call: POST /member-orders/${mo_a}/submit
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      - call: POST /member-orders
        payload:
          member_id: ${mb_id}
          drop_run_id: ${dr_b}
        as: Member
        as_user_id: ${mb_id}
        captures:
          mo_b: $.data.id
          mo_b_v1: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_b}
          item_id: ${i_oat}
          qty_units: 6
          expected_member_order_version: ${mo_b_v1}
        as: Member
        as_user_id: ${mb_id}
        captures:
          ol_b_oat: $.data.id
      - call: GET /member-orders/${mo_b}
        payload: {}
        as: Member
        as_user_id: ${mb_id}
        captures:
          mo_b_v2: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_b}
          item_id: ${i_berry}
          qty_units: 3
          expected_member_order_version: ${mo_b_v2}
        as: Member
        as_user_id: ${mb_id}
        captures:
          ol_b_berry: $.data.id
      - call: GET /member-orders/${mo_b}
        payload: {}
        as: Member
        as_user_id: ${mb_id}
        captures:
          mo_b_v3: $.data.version
      - call: POST /order-lines
        payload:
          member_order_id: ${mo_b}
          item_id: ${i_cheese}
          qty_units: 3
          expected_member_order_version: ${mo_b_v3}
        as: Member
        as_user_id: ${mb_id}
        captures:
          ol_b_cheese: $.data.id
      - call: POST /member-orders/${mo_b}/submit
        payload: {}
        as: Member
        as_user_id: ${mb_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-25T00:00:00Z'
        as: ClubAdmin
      trigger:
      - call: POST /cycles/${cyc}/lock
        payload: {}
        as: ClubAdmin
      - call: GET /order-lines/${ol_a_oat}
        payload: {}
        as: Member
        as_user_id: ${ma_id}
      assert:
      - OrderLine.${ol_a_oat}.bound_case_price_cents == 13200
      - OrderLine.${ol_a_oat}.unit_price_cents == 3696
      - OrderLine.${ol_a_oat}.split_fee_per_unit_cents == 396
      - OrderLine.${ol_a_oat}.is_split_unit == true
      - OrderLine.${ol_a_oat}.confirmed_units == 5
      - OrderLine.${ol_a_oat}.status == CONFIRMED
      - the rejected add_time_bound variant would have written bound_case_price_cents 12000 and unit_price_cents 3360
