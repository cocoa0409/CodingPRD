  - rule_id: boundary_precision_check
    instances:
      - name: mint_carryover_exact_1000_kwh
        grounds:
          - calculations.rec_minting_carryover
          - entities.Generator.fields.carryover_kwh
        distinguishing_aspect: |
          Metric kWh at the KWH_PER_REC boundary via POST mint-run: an exact 1000 kWh pool mints exactly 1 REC
          with carryover 0; a 999 kWh pool mints 0 and carries 999; a later 1 kWh reading crosses the boundary
          (999 + 1 = 1000 -> 1 REC). Different metric (energy) and endpoint than the capacity boundary.
        test_recipe:
          setup:
            - "Generator g1 with a single exact-1000-kWh accepted July reading; generator g2 with July 600 kWh accepted then August 400 kWh accepted"
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Exact Solar", facility_code: "EX1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g1: $.data.id }
            - call: "POST /greenpower/generators/${g1}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g1}"
            - call: "POST /greenpower/generators/${g1}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g1}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Under Solar", facility_code: "UN1", technology: "WIND", nameplate_capacity_kw: 3000, region_code: "ERCOT", commissioning_date: "2021-06-01" }
              as: RegistryAdmin
              captures: { g2: $.data.id }
            - call: "POST /greenpower/generators/${g2}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g2}"
            - call: "POST /greenpower/generators/${g2}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g2}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 999 }
              as: GeneratorOperator
              as_user_id: "${g2}"
              captures: { r2: $.data.id }
            - call: "POST /greenpower/meter-readings/${r2}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r2}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g2}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z", metered_kwh: 1 }
              as: GeneratorOperator
              as_user_id: "${g2}"
              captures: { r3: $.data.id }
            - call: "POST /greenpower/meter-readings/${r3}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r3}/accept"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/generators/${g1}/mint-run"
              payload: {}
              as: RegistryAdmin
              captures: { m1_count: $.data.minted_count, m1_carry: $.data.carryover_kwh }
            - call: "POST /greenpower/generators/${g2}/mint-run"
              payload: {}
              as: RegistryAdmin
              captures: { m2_count: $.data.minted_count, m2_carry: $.data.carryover_kwh }
          assert:
            - "g1 mint-run: minted_count == 1 and carryover_kwh == 0 (exact 1000 kWh mints 1 REC, boundary is inclusive floor(1000/1000))"
            - "g1 certificate: vintage_month == '2026-07', serial_start == 1, serial_end == 1, quantity_mwh == 1"
            - "g2 mint-run: minted_count == 1 (999 July carries, +1 August crosses to 1000) and carryover_kwh == 0"
            - "g2 certificate: vintage_month == '2026-08' (threshold crossed inside the August bucket), serial range [1,1] in g2's own serial space"
            - "MeterReading.${r2}.minted == true and MeterReading.${r3}.minted == true"

      - name: capacity_exact_fit_boundary
        grounds:
          - state_machines.Subscription.PENDING_to_ACTIVE
          - state_machines.Subscription.PENDING_to_WAITLISTED
          - entities.Program.fields.committed_capacity_kw
        distinguishing_aspect: |
          Metric kW at the capacity_cap boundary via POST activate: committed 600 + allocation 400 == cap 1000
          fits exactly (inclusive <=) and activates; the next 1 kW activation (1001 > 1000) parks in WAITLISTED
          rather than erroring. Different metric and endpoint than the mint boundary.
        test_recipe:
          setup: ["Program OPEN cap 1000; A 600 ACTIVE; B 400 and C 1 created"]
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
              captures: { pv2: $.data.version }
            - call: "POST /greenpower/programs/${p}/open"
              payload: {}
              as: RegistryAdmin
              captures: { pv3: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer A", utility_account_no: "U-A", allocation_kw: 600, estimated_usage_kwh: 5000, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { sa: $.data.id }
            - call: "POST /greenpower/subscriptions/${sa}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /greenpower/programs/${p}"
              as: ProgramManager
              captures: { pv4: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer B", utility_account_no: "U-B", allocation_kw: 400, estimated_usage_kwh: 3000, expected_program_version: "${pv4}" }
              as: ProgramManager
              captures: { sb: $.data.id }
          trigger:
            - call: "POST /greenpower/subscriptions/${sb}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /greenpower/programs/${p}"
              as: ProgramManager
              captures: { pv5: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer C", utility_account_no: "U-C", allocation_kw: 1, estimated_usage_kwh: 50, expected_program_version: "${pv5}" }
              as: ProgramManager
              captures: { sc: $.data.id }
            - call: "POST /greenpower/subscriptions/${sc}/activate"
              payload: {}
              as: ProgramManager
          assert:
            - "Subscription.${sb}.status == ACTIVE (600 + 400 == 1000 exactly: inclusive boundary admits the fit)"
            - "Program.${p}.committed_capacity_kw == 1000"
            - "Subscription.${sc}.status == WAITLISTED (1000 + 1 > 1000; overflow is parking, not an error)"

      - name: full_quantity_settle_no_remainder
        grounds:
          - calculations.serial_split_partition
          - entities.Certificate.fields.serial_end
        distinguishing_aspect: |
          Metric serial-count at the split boundary via POST settle: an item quantity exactly equal to the
          certificate quantity moves the whole batch (serial range [1,5] intact, same certificate id, no new
          row), whereas any smaller quantity would split — the t == q edge creates zero remainder rows.
        test_recipe:
          setup: ["5-MWh certificate (serials [1,5]) in broker b1; full-quantity trade to b2 accepted"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 5000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c}", quantity_mwh: 5}], unit_price_cents_per_mwh: 300, settlement_mode: "NET" }
              as: BrokerTrader
              as_user_id: "${b1}"
