              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /api/distribution-requests/${req_id}/verify-event"
              as: ComplianceOfficer
              captures: { verify_err: $.data.error_id }
            - call: "POST /api/separation-cases/${case_id}/determine"
              payload: { outcome: "CONFIRMED_SEPARATION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/distribution-requests/${req_id}/verify-event"
              as: ComplianceOfficer
              captures: { req_status: $.data.status }
          assert:
            - "${verify_err} == ERR_EVENT_NOT_CONFIRMED (case not yet DETERMINED_SEPARATED)"
            - "DistributionRequest.${req_id}.status remained REQUESTED after the failed verify"
            - "${req_status} == EVENT_VERIFIED after the case determination"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: window_overlap_closed_interval_touching_conflict
        grounds:
          - validations[priority=9]
          - entities.ElectionWindow.fields.general_close_date
        distinguishing_aspect: |
          Resource: ElectionWindow intervals on a Plan, CLOSED-interval semantics.
          Window A [2026-10-01, 2026-12-31]; a second window whose open date equals
          A's close date (2026-12-31) conflicts because closed intervals share
          that date; a window opening 2027-01-01 is accepted.
        test_recipe:
          setup:
            - "ACTIVE plan; window A [2026-10-01, 2026-12-31] for plan_year 2027 already created; Plan.version captured after each mutation"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan WO", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_a: $.data.id }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2028, general_open_date: "2026-12-31", general_close_date: "2027-12-31", expected_plan_version: "${plan_v2}" }
              as: PlanSponsor
              captures: { touch_err: $.data.error_id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2028, general_open_date: "2027-01-01", general_close_date: "2027-12-31", expected_plan_version: "${plan_v2}" }
              as: PlanSponsor
              captures: { window_b: $.data.id, window_b_status: $.data.status }
          assert:
            - "${touch_err} == ERR_WINDOW_OVERLAP (touching dates conflict under closed-interval semantics)"
            - "${window_b_status} == SCHEDULED (disjoint window accepted)"
            - "ElectionWindow list for plan contains exactly 2 windows (${window_a}, ${window_b})"
      - name: crediting_period_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - state_machines.CreditingRun
          - calculations.notional_crediting
        distinguishing_aspect: |
          Resource: CreditingRun periods on a Plan, HALF-OPEN [start, end)
          semantics — a different entity and a different interval geometry than
          the election windows. Run2 starting exactly at run1's period_end is
          accepted (adjacency is not overlap); run3 strictly inside run1 is
          rejected.
        test_recipe:
          setup:
            - "ACTIVE plan with no crediting runs; run1 [2027-01-01, 2027-02-01) POSTED"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan CO", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-01-01", period_end: "2027-02-01", expected_plan_version: "${plan_v}" }
              as: BenefitsAdministrator
              captures: { run1_id: $.data.id, run1_total: $.data.total_gain_cents }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-02-01", period_end: "2027-03-01", expected_plan_version: "${plan_v2}" }
              as: BenefitsAdministrator
              captures: { run2_id: $.data.id, run2_status: $.data.status }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v3: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-01-15", period_end: "2027-01-20", expected_plan_version: "${plan_v3}" }
              as: BenefitsAdministrator
              captures: { run3_err: $.data.error_id }
          assert:
            - "${run1_total} == 0 (no funded accounts; run still posts)"
            - "${run2_status} == POSTED (run2.period_start == run1.period_end is adjacency, not overlap, under half-open semantics)"
            - "${run3_err} == ERR_CREDITING_PERIOD_OVERLAP (2027-01-15 < run1.end 2027-02-01 and 2027-01-20 > run1.start 2027-01-01)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: crediting_reversal_restores_settled_balance
        grounds:
          - state_machines.CreditingRun.POSTED_to_REVERSED
          - calculations.notional_crediting
          - calculations.account_balances
        distinguishing_aspect: |
          Conserved quantity: account settled_balance_cents. Forward action
          (crediting run posts +142) paired with its compensating action
          (reverse posts -142) leaves the settled balance bit-identical:
          33333 -> 33475 -> 33333, and the ledger shows gain+reversal summing
          to zero.
        test_recipe:
          setup:
            - "ACTIVE plan, FIXED_RATE fund 500 bp, vested participant, account with exactly 33333 settled cents in that fund; no prior crediting runs"
          setup_api_calls:
            - call: "POST /api/plans"
