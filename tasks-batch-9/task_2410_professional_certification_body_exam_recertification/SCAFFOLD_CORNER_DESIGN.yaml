      - name: an_out_of_range_raw_score_is_refused_and_a_substantiated_critical_incident_bars_the_candidate
        claim_type: cross_entity
        grounds:
          - validations[priority=41]
          - validations[priority=20]
          - errors.ERR_RAW_SCORE_OUT_OF_RANGE
          - errors.ERR_CANDIDATE_BARRED
