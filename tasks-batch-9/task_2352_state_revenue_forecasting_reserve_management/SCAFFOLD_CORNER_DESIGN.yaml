            - "fourth trigger: HTTP 200; ConsensusRound.${rnd}.status == RATIFIED and ForecastCycle.${cyc}.status == CONSENSUS_REACHED"
            - "fifth trigger: HTTP 409 and ${err_reopen} == ERR_CYCLE_ALREADY_RATIFIED"
