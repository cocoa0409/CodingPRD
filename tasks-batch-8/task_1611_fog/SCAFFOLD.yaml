# =============================================================================
# FOG (Fats/Oils/Grease) Ordinance Compliance Program — benchmark seed tables
# =============================================================================

scenario: |
  FOG (Fats/Oils/Grease) Ordinance Compliance Program: food-service
  establishment inventory & risk classification, grease interceptor sizing &
  installation approval, pumping frequency requirement & manifest verification,
  inspection scoring & violation escalation, blockage investigation & cost
  recovery, hauler permitting & disposal tracking, variance request,
  public-education campaign

domain_name: fog-ordinance
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; no nested URL paths
  state_machine_shape: cyclic      # VarianceRequest info-cycle + Hauler suspend/reinstate cycle; posture-driven Establishment
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true  -> id, created_at, updated_at, version
# common_fields: false -> id, created_at only (append-only / immutable records)
# =============================================================================
entities:
  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Food-service establishment name" }
      - { name: street_address, type: string, source: input, description: "Street address" }
      - { name: seating_capacity, type: integer, source: input, description: "Number of seats", constraints: ">= 0" }
      - { name: fryer_count, type: integer, source: input, description: "Deep fryers on site", constraints: ">= 0" }
      - { name: has_charbroiler, type: boolean, source: input, default: false, description: "Whether a charbroiler is installed" }
      - { name: cuisine_profile, type: enum, source: input, description: "LOW_GREASE | MEDIUM_GREASE | HIGH_GREASE" }
      - { name: risk_score, type: number, source: computed, description: "Weighted risk score 0..100 (risk_classification)" }
      - { name: risk_class, type: enum, source: computed, description: "HIGH | MEDIUM | LOW derived from risk_score" }
      - { name: compliance_status, type: enum, source: computed, description: "COMPLIANT | WATCH | DELINQUENT | SUSPENDED — derived posture, see compliance_posture calc" }
      - { name: open_violation_count, type: integer, source: computed, default: 0, description: "Count of Violations with status IN {NOTICED, CITATION} for this establishment" }
      - { name: last_verified_pump_at, type: datetime, source: system, description: "pump_date of most recently VERIFIED PumpManifest; null if none", constraints: "nullable" }
      - { name: variance_override_frequency_days, type: integer, source: system, description: "Pumping frequency granted by latest APPROVED PUMPING_FREQUENCY variance; null when none", constraints: "nullable" }
      - { name: pumping_frequency_days, type: integer, source: computed, description: "= variance_override_frequency_days when set, else risk table HIGH:90 MEDIUM:180 LOW:365" }
      - { name: pumping_overdue, type: boolean, source: computed, description: "Forward-looking variant: now > baseline + pumping_frequency_days (baseline = last_verified_pump_at else created_at)" }
      - { name: missed_pump_windows, type: integer, source: computed, default: 0, description: "Chronological variant: count of fully elapsed frequency windows since created_at containing no VERIFIED manifest pump_date" }

  - name: GreaseInterceptor
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; owning establishment" }
      - { name: nominal_capacity_gal, type: integer, source: input, description: "Proposed tank capacity in gallons", constraints: "> 0" }
      - { name: measured_flow_gpm, type: number, source: input, description: "Optional measured peak flow in gallons/minute; drives MEASURED sizing variant", constraints: "nullable, > 0 when present" }
      - { name: provisional_required_gal, type: integer, source: computed, description: "Provisional sizing from establishment profile (interceptor_required_capacity, provisional variant)" }
      - { name: required_min_capacity_gal, type: integer, source: computed, description: "Final minimum capacity fixed at approval (max of provisional and measured variants)", constraints: "null until APPROVED" }
      - { name: sizing_method, type: enum, source: computed, description: "PROVISIONAL | MEASURED — which variant governed at approval", constraints: "null until APPROVED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | ACTIVE" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving ComplianceOfficer", constraints: "nullable" }
      - { name: commissioned_by_user_id, type: string, source: system, description: "X-User-ID of commissioning Inspector", constraints: "nullable" }

  - name: Inspection
    parent: null
    common_fields: false
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; inspected establishment" }
      - { name: items, type: array, source: input, description: "Array of {category, severity}; category IN {GREASE_TRAP_MAINTENANCE, RECORD_KEEPING, STRUCTURAL, BMP_PRACTICES}; severity IN {MINOR, MAJOR, CRITICAL}; may be empty" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the submitting Inspector" }
      - { name: score, type: integer, source: computed, description: "max(0, 100 - sum of severity deductions MINOR:3 MAJOR:8 CRITICAL:20)" }
      - { name: passed, type: boolean, source: computed, description: "score >= 70" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: system, description: "FK -> Establishment.id; copied from the source Inspection" }
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; the failing inspection that created this violation" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL — highest severity among inspection items" }
      - { name: status, type: enum, source: system, description: "NOTICED | CITATION | RESOLVED | DISMISSED" }
      - { name: cure_deadline, type: datetime, source: computed, description: "created_at + cure days by severity MINOR:30 MAJOR:14 CRITICAL:3" }
      - { name: fine_cents, type: integer, source: computed, default: 0, description: "Set on escalation to CITATION: MINOR 10000, MAJOR 50000, CRITICAL 250000; 0 while NOTICED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Inspector who submitted the source inspection (SoD anchor)" }
      - { name: escalated_at, type: datetime, source: system, description: "When status became CITATION", constraints: "nullable" }
      - { name: resolved_at, type: datetime, source: system, description: "When status became RESOLVED", constraints: "nullable" }
      - { name: dismissed_at, type: datetime, source: system, description: "When status became DISMISSED", constraints: "nullable" }
      - { name: dismissed_by_user_id, type: string, source: system, description: "X-User-ID of dismissing ComplianceOfficer; must differ from recorded_by_user_id", constraints: "nullable" }

  - name: PumpManifest
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; pumped establishment" }
      - { name: interceptor_id, type: string, source: input, description: "FK -> GreaseInterceptor.id; interceptor pumped" }
      - { name: hauler_id, type: string, source: input, description: "FK -> Hauler.id; hauling company" }
      - { name: pump_date, type: datetime, source: input, description: "When pumping occurred" }
      - { name: pumped_volume_gal, type: number, source: input, description: "Volume pumped in gallons", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting FseContact" }
      - { name: reject_reason, type: enum, source: system, description: "DISPOSAL_MISMATCH | MISSING_DISPOSAL_RECORD | HAULER_SUSPENDED | OTHER", constraints: "null unless REJECTED" }

  - name: Hauler
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hauling company name" }
      - { name: permit_number, type: string, source: input, description: "Municipal permit number", constraints: "unique across all haulers" }
      - { name: insurance_expires_on, type: datetime, source: input, description: "Liability insurance expiry; must be after current clock at permitting" }
      - { name: status, type: enum, source: system, description: "APPLIED | PERMITTED | SUSPENDED | REVOKED" }
      - { name: mismatch_count, type: integer, source: system, default: 0, description: "Count of DISPOSAL_MISMATCH manifest rejections; auto-suspends at 3; reset to 0 on reinstate" }

  - name: DisposalRecord
    parent: null
    common_fields: false
    fields:
      - { name: hauler_id, type: string, source: input, description: "FK -> Hauler.id; disposing hauler" }
      - { name: manifest_id, type: string, source: input, description: "FK -> PumpManifest.id; manifest this disposal settles", constraints: "unique — at most one DisposalRecord per manifest" }
      - { name: disposed_volume_gal, type: number, source: input, description: "Volume disposed at the receiving site", constraints: "> 0" }
      - { name: disposal_site_name, type: string, source: input, description: "Receiving facility name" }
      - { name: disposed_at, type: datetime, source: input, description: "When disposal occurred" }

  - name: BlockageEvent
    parent: null
    common_fields: true
    fields:
      - { name: location_description, type: string, source: input, description: "Where the sewer blockage occurred" }
      - { name: status, type: enum, source: system, description: "REPORTED | ASSESSED | CLOSED" }
      - { name: total_cleanup_cost_cents, type: integer, source: input, description: "Total cleanup cost in cents, fixed at assessment", constraints: "> 0; null until ASSESSED" }
      - { name: contributions, type: array, source: input, description: "Array of {establishment_id, weight_percent} supplied at assessment; server adds computed share_cents and system paid_at (null until paid). weight_percent integers summing to 100" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporting Inspector" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of assessing Inspector (SoD anchor for close)", constraints: "nullable" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of closing ComplianceOfficer; must differ from assessed_by_user_id", constraints: "nullable" }

  - name: VarianceRequest
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; requesting establishment" }
      - { name: scope, type: enum, source: input, description: "PUMPING_FREQUENCY | INTERCEPTOR_SIZE" }
      - { name: requested_frequency_days, type: integer, source: input, description: "Requested pumping frequency; required when scope == PUMPING_FREQUENCY, must be absent otherwise", constraints: "> 0; conditional on scope" }
      - { name: justification, type: string, source: input, description: "Written justification" }
      - { name: effective_from, type: datetime, source: input, description: "Requested window start (half-open interval start)" }
      - { name: effective_to, type: datetime, source: input, description: "Requested window end (half-open interval end); must be after effective_from" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of deciding ComplianceOfficer", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "When APPROVED or DENIED", constraints: "nullable" }

  - name: EducationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: outreach_zone, type: string, source: input, description: "Geographic outreach zone label" }
      - { name: start_date, type: datetime, source: input, description: "Campaign window start" }
      - { name: end_date, type: datetime, source: input, description: "Campaign window end; must be after start_date" }
      - { name: budget_cents, type: integer, source: input, description: "Total budget in cents", constraints: ">= 0" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "= budget_cents - sum(cost_cents of RECORDED OutreachEvents); voiding an event credits it back" }

  - name: OutreachEvent
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> EducationCampaign.id; set from the parent path" }
      - { name: event_date, type: datetime, source: input, description: "Date of the outreach event; must fall within [start_date, end_date] of the campaign" }
      - { name: venue_name, type: string, source: input, description: "Where the event took place" }
      - { name: attendance_count, type: integer, source: input, description: "Attendees reached", constraints: ">= 0" }
      - { name: cost_cents, type: integer, source: input, description: "Event cost debited from campaign budget", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Establishment
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: "COMPLIANT | WATCH | DELINQUENT"
        to: SUSPENDED
        trigger: "system (compliance_posture recompute when a Violation enters CITATION)"
        actor: system
        preconditions:
          - "at least one Violation of this establishment has status == CITATION"
        side_effects:
          - "every VarianceRequest of this establishment in UNDER_REVIEW or INFO_REQUESTED -> DENIED (decided_at set, approved_by null)"
      - from: "COMPLIANT | WATCH | SUSPENDED"
        to: DELINQUENT
        trigger: "system (compliance_posture recompute at sweep or on manifest verification when pumping_overdue becomes true)"
        actor: system
        preconditions:
          - "no Violation with status == CITATION"
          - "pumping_overdue == true (forward-looking variant)"
        side_effects: []
      - from: "COMPLIANT | DELINQUENT | SUSPENDED"
        to: WATCH
        trigger: "system (compliance_posture recompute)"
        actor: system
        preconditions:
          - "no Violation with status == CITATION"
          - "pumping_overdue == false"
          - "at least one Violation with status == NOTICED"
        side_effects: []
      - from: "WATCH | DELINQUENT | SUSPENDED"
        to: COMPLIANT
        trigger: "system (compliance_posture recompute when no CITATION, not overdue, no NOTICED violations remain)"
        actor: system
        preconditions:
          - "no Violation with status IN {CITATION, NOTICED}"
          - "pumping_overdue == false"
        side_effects: []

  - entity: GreaseInterceptor
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /interceptors/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "nominal_capacity_gal >= interceptor_required_capacity (final variant) else ERR_INTERCEPTOR_UNDERSIZED"
        side_effects:
          - "required_min_capacity_gal and sizing_method fixed (MEASURED only when measured_flow_gpm present and measured_required > provisional)"
          - "approved_by_user_id := caller X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /interceptors/{id}/commission"
        actor: Inspector
        preconditions: []
        side_effects:
          - "commissioned_by_user_id := caller X-User-ID"

  - entity: Violation
    initial_state: NOTICED
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: NOTICED
        to: CITATION
        trigger: "POST /violations/{id}/escalate OR system during POST /sweeps/run when cure_deadline <= current clock"
        actor: ComplianceOfficer | system
        preconditions:
          - "current clock >= cure_deadline (manual escalate: else ERR_ESCALATION_NOT_DUE; boundary: exactly at deadline is allowed)"
        side_effects:
          - "fine_cents set by severity (citation_fine calc)"
          - "escalated_at := current clock"
          - "Establishment compliance_posture recompute (may enter SUSPENDED; SUSPENDED cascade denies open VarianceRequests)"
      - from: NOTICED
        to: RESOLVED
        trigger: "POST /violations/{id}/resolve"
        actor: Inspector
        preconditions: []
        side_effects:
          - "resolved_at := current clock"
          - "Establishment open_violation_count -= 1; compliance_posture recompute"
      - from: CITATION
        to: RESOLVED
        trigger: "POST /violations/{id}/resolve"
        actor: Inspector
        preconditions: []
        side_effects:
          - "resolved_at := current clock"
          - "Establishment open_violation_count -= 1; compliance_posture recompute"
      - from: NOTICED
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "caller X-User-ID != recorded_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
        side_effects:
          - "dismissed_at := current clock; dismissed_by_user_id := caller"
          - "Establishment open_violation_count -= 1; compliance_posture recompute"
      - from: CITATION
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "caller X-User-ID != recorded_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
        side_effects:
          - "dismissed_at := current clock; dismissed_by_user_id := caller"
          - "Establishment open_violation_count -= 1; compliance_posture recompute"

  - entity: PumpManifest
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /pump-manifests/{id}/verify"
        actor: Inspector
        preconditions:
          - "Hauler.status == PERMITTED (ERR_HAULER_NOT_PERMITTED)"
          - "interceptor_id belongs to manifest.establishment_id (ERR_INTERCEPTOR_MISMATCH)"
          - "a DisposalRecord exists with manifest_id == this manifest (ERR_DISPOSAL_RECORD_MISSING)"
          - "disposal tolerance check passes (ERR_DISPOSAL_DISCREPANCY)"
        side_effects:
          - "Establishment.last_verified_pump_at := pump_date"
          - "Establishment compliance_posture recompute (may clear DELINQUENT)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pump-manifests/{id}/reject OR system cascade when the manifest's hauler becomes SUSPENDED"
        actor: Inspector | system
        preconditions: []
        side_effects:
          - "reject_reason set (caller-supplied reason_code, or HAULER_SUSPENDED when system-cascaded)"
          - "when reason_code == DISPOSAL_MISMATCH: Hauler.mismatch_count += 1; if mismatch_count reaches 3 the hauler auto-transitions PERMITTED -> SUSPENDED; that suspension itself cascades: every still-SUBMITTED manifest naming this hauler -> REJECTED with reject_reason HAULER_SUSPENDED"

  - entity: Hauler
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: PERMITTED
        trigger: "POST /haulers/{id}/permit"
        actor: ProgramAdmin
        preconditions:
          - "insurance_expires_on > current clock (ERR_INSURANCE_EXPIRED)"
        side_effects: []
      - from: PERMITTED
        to: SUSPENDED
        trigger: "POST /haulers/{id}/suspend OR system when mismatch_count reaches 3"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "every still-SUBMITTED PumpManifest naming this hauler -> REJECTED with reject_reason HAULER_SUSPENDED"
      - from: SUSPENDED
        to: PERMITTED
        trigger: "POST /haulers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "mismatch_count := 0 (reset mechanism)"
      - from: PERMITTED
        to: REVOKED
        trigger: "POST /haulers/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /haulers/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: BlockageEvent
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /blockage-events/{id}/assess"
        actor: Inspector
        preconditions:
          - "contributions non-empty (ERR_NO_CONTRIBUTORS)"
          - "sum of weight_percent == 100 (ERR_WEIGHTS_INVALID)"
          - "every contribution establishment_id exists (ERR_NOT_FOUND)"
        side_effects:
          - "share_cents computed per contribution (cost_share_apportionment: per-share round_half_up, remainder to largest weight, tie -> earliest Establishment.created_at)"
          - "assessed_by_user_id := caller X-User-ID"
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /blockage-events/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "caller X-User-ID != assessed_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
          - "every contribution has paid_at != null (ERR_COST_SHARE_UNPAID)"
        side_effects:
          - "closed_by_user_id := caller X-User-ID"

  - entity: VarianceRequest
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /variance-requests/{id}/request-info"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /variance-requests/{id}/provide-info"
        actor: FseContact
        preconditions:
          - "caller owns the variance's establishment (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "justification replaced by payload value"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /variance-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "expected_establishment_version matches Establishment.version (OCC, ERR_STALE_VERSION)"
          - "Establishment.compliance_status != SUSPENDED (ERR_ESTABLISHMENT_SUSPENDED)"
          - "no other APPROVED variance for same establishment+scope with overlapping [effective_from, effective_to) window; half-open adjacency is allowed (ERR_VARIANCE_WINDOW_OVERLAP)"
        side_effects:
          - "approved_by_user_id := caller; decided_at := current clock"
          - "when scope == PUMPING_FREQUENCY: Establishment.variance_override_frequency_days := requested_frequency_days; pumping_frequency_days recomputed"
          - "Establishment.version += 1; compliance_posture recompute (frequency change may clear DELINQUENT)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /variance-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decided_at := current clock"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /variance-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "decided_at := current clock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system cascade when Establishment enters SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "decided_at := current clock"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "system cascade when Establishment enters SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "decided_at := current clock"

  - entity: OutreachEvent
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /outreach-events/{id}/void"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "EducationCampaign.remaining_budget_cents += cost_cents (compensating credit)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: establishment-update-stale-version
    parent_entity: Establishment
    write_endpoint: "PATCH /establishments/{id}"
    occ_field: expected_establishment_version
    description: |
      Updating an Establishment profile with an expected_establishment_version
      that no longer matches the establishment's current version is rejected.
      The client's view is stale (another write — e.g. a variance approval
      cascade or an earlier profile update — has advanced the version), so the
      update must be rebased on a fresh read before it can apply.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: variance-approve-stale-establishment
    parent_entity: Establishment
    write_endpoint: "POST /variance-requests/{id}/approve"
    occ_field: expected_establishment_version
    description: |
      Approving a VarianceRequest against an Establishment whose version has
      advanced since the reviewer last observed it is rejected. Approval pins
      the requested frequency onto the establishment; a stale version means the
      compliance profile underpinning the review (risk class, posture, prior
      variance windows) has changed since review, so approval must not proceed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_classification
    trigger: "Establishment creation and every PATCH /establishments/{id} that changes seating_capacity, fryer_count, has_charbroiler, or cuisine_profile"
    algorithm: weighted_scoring
    formula: |
      capacity_points = min(40, seating_capacity * 0.1)
      equipment_points = min(30, fryer_count * 10 + (10 if has_charbroiler else 0))
      cuisine_points = { LOW_GREASE: 10, MEDIUM_GREASE: 20, HIGH_GREASE: 30 }[cuisine_profile]
      risk_score = capacity_points + equipment_points + cuisine_points      # 0..100
      risk_class = HIGH   if risk_score >= 70
                   MEDIUM if risk_score >= 40
                   LOW    otherwise
    input_set: "the Establishment row being created or patched"
    constants:
      CAPACITY_CAP: 40
      EQUIPMENT_CAP: 30
      HIGH_THRESHOLD: 70        # >= 70 is HIGH (boundary inclusive)
      MEDIUM_THRESHOLD: 40      # >= 40 is MEDIUM
    precision: "risk_score keeps one decimal place; thresholds compare on the unrounded value"
    variants:
      - name: standard
        when: "always"
        difference: "single variant; dual-variant requirement for this rule family lives on interceptor_required_capacity and pumping_delinquency"

  - name: interceptor_required_capacity
    trigger: "provisional variant at POST /interceptors; final variant at POST /interceptors/{id}/approve"
    algorithm: aggregation
    formula: |
      provisional = max(MIN_CAPACITY_GAL,
                        ceil(seating_capacity * SEAT_GAL
                             + fryer_count * FRYER_GAL
                             + (CHARBROILER_GAL if has_charbroiler else 0)
                             + CUISINE_ADDER_GAL[cuisine_profile]))
      measured    = ceil(measured_flow_gpm * RETENTION_MINUTES)   # only when measured_flow_gpm present
      required_min_capacity_gal = max(provisional, measured) if measured_flow_gpm present else provisional
      sizing_method = MEASURED if (measured_flow_gpm present and measured > provisional) else PROVISIONAL
    input_set: "the GreaseInterceptor plus its parent Establishment profile fields"
    constants:
      MIN_CAPACITY_GAL: 50
      SEAT_GAL: 2
      FRYER_GAL: 15
      CHARBROILER_GAL: 40
      RETENTION_MINUTES: 30
      CUISINE_ADDER_GAL: { LOW_GREASE: 0, MEDIUM_GREASE: 25, HIGH_GREASE: 50 }
    precision: "integer gallons, ceil at each variant, max() over integer gallons"
    variants:
      - name: provisional
        when: "no measured_flow_gpm supplied, or measured <= provisional"
        difference: "sizes purely from the establishment profile; ignores field-measured flow"
      - name: measured
        when: "measured_flow_gpm supplied and measured > provisional"
        difference: "same establishment inputs plus measured flow produce a strictly larger requirement whenever measured > provisional (e.g. profile 495 gal vs measured 20 gpm * 30 = 600 gal)"

  - name: inspection_score
    trigger: "POST /inspections (score computed atomically at creation; inspections are immutable)"
    algorithm: aggregation
    formula: |
      deduction(item) = { MINOR: 3, MAJOR: 8, CRITICAL: 20 }[item.severity]
      score = max(0, 100 - sum(deduction(i) for i in items))
      passed = (score >= PASS_THRESHOLD)          # exactly 70 passes; 69 fails
      if not passed: create Violation(NOTICED) with severity = highest severity present in items
                     (CRITICAL > MAJOR > MINOR ordering)
    input_set: "items array of the Inspection being created"
    constants:
      PASS_THRESHOLD: 70
      DEDUCTION_MINOR: 3
      DEDUCTION_MAJOR: 8
      DEDUCTION_CRITICAL: 20
    precision: "integer points"

  - name: pumping_delinquency
    trigger: "POST /sweeps/run; also recomputed on manifest verification, variance approval, and establishment create/PATCH"
    algorithm: forward_looking
    formula: |
      # Variant A — forward-looking (drives compliance_posture DELINQUENT):
      baseline = last_verified_pump_at if set else created_at
      pumping_overdue = (current_clock > baseline + pumping_frequency_days)
      # Variant B — chronological window replay (reported as missed_pump_windows):
      windows are half-open intervals [created_at + (k-1)*pumping_frequency_days,
                                       created_at + k*pumping_frequency_days)
      missed_pump_windows = count of windows with window_end <= current_clock
                            containing no VERIFIED PumpManifest pump_date
    input_set: "VERIFIED PumpManifests of the establishment; windows anchored at Establishment.created_at"
    constants: {}
    precision: "datetime comparison at second precision; windows half-open [start, end)"
    variants:
      - name: forward_looking
        when: "posture computation"
        difference: "a single recent VERIFIED pump resets the baseline — an establishment with a historically missed window but a recent pump is NOT overdue"
      - name: chronological
        when: "missed_pump_windows reporting"
        difference: "replays every fully elapsed window since created_at — a late pump satisfies only its own window, so the same data yields missed_pump_windows >= 1 while pumping_overdue == false"

  - name: compliance_posture
    trigger: "violation create/escalate/resolve/dismiss, manifest verify, sweep, variance approve, establishment PATCH"
    algorithm: constraint_propagation
    formula: |
      if any Violation of the establishment has status == CITATION:  SUSPENDED
      elif pumping_overdue:                                          DELINQUENT
      elif any Violation has status == NOTICED:                      WATCH
      else:                                                          COMPLIANT
      Priority order SUSPENDED > DELINQUENT > WATCH > COMPLIANT is fixed.
    input_set: "Violations of the establishment in statuses {NOTICED, CITATION}; pumping_overdue flag"
    constants: {}
    precision: "n/a"

  - name: cost_share_apportionment
    trigger: "POST /blockage-events/{id}/assess"
    algorithm: waterfall_allocation
    formula: |
      # Pinned rounding order: round EACH share first, then reconcile the remainder.
      share_i = round_half_up(total_cleanup_cost_cents * weight_i / 100)   # integer cents, per share
      remainder = total_cleanup_cost_cents - sum(share_i)                  # may be negative
      remainder is added to the contribution with the largest weight_percent;
      tie-break: the tied contribution whose Establishment.created_at is earliest.
    input_set: "contributions array of the BlockageEvent at assessment"
    constants: {}
    precision: "integer cents, round_half_up per share BEFORE remainder reconciliation (sum-then-round is forbidden — it yields different cents)"

  - name: disposal_tolerance
    trigger: "POST /pump-manifests/{id}/verify (after existence and mismatch checks pass)"
    algorithm: threshold
    formula: |
      ratio = abs(disposed_volume_gal - pumped_volume_gal) / pumped_volume_gal
      reject with ERR_DISPOSAL_DISCREPANCY only when ratio > TOLERANCE
      (ratio == TOLERANCE exactly passes)
    input_set: "the DisposalRecord whose manifest_id == this manifest"
    constants:
      TOLERANCE: 0.05
    precision: "ratio computed in floating point; comparison is strict >"

  - name: citation_fine
    trigger: "Violation transition NOTICED -> CITATION"
    algorithm: threshold
    formula: |
      fine_cents = { MINOR: 10000, MAJOR: 50000, CRITICAL: 250000 }[severity]
    input_set: "the Violation being escalated"
    constants:
      FINE_MINOR: 10000
      FINE_MAJOR: 50000
      FINE_CRITICAL: 250000
    precision: "integer cents"

  - name: campaign_budget
    trigger: "POST /campaigns/{id}/events (debit) and POST /outreach-events/{id}/void (credit)"
    algorithm: aggregation
    formula: |
      remaining_budget_cents = budget_cents
                               - sum(cost_cents of OutreachEvents with status == RECORDED)
      Invariant: a RECORDED event followed by its own void leaves remaining_budget_cents
      identical to its pre-event value (compensating action).
    input_set: "OutreachEvents of the campaign with status == RECORDED (VOIDED excluded)"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Request body shape: required fields present, no type violations, enum values in range, conditional requirement requested_frequency_days present iff scope == PUMPING_FREQUENCY, end_date > start_date, effective_to > effective_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Ownership for entity-backed roles: FseContact X-User-ID must equal the target Establishment id (create manifest/variance/interceptor, provide-info, pay share, read own establishment data); HaulerAdmin X-User-ID must equal the target Hauler id (create disposal record)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "endpoints invoked by FseContact or HaulerAdmin"
  - priority: 5
    category: existence
    check: "Every id in path and body exists: establishment, interceptor, hauler, manifest, inspection, violation, blockage event, variance request, campaign, outreach event; contribution establishment ids at assess"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition (interceptor PROPOSED->APPROVED->ACTIVE; violation NOTICED/CITATION; manifest SUBMITTED; hauler cycle states; blockage REPORTED->ASSESSED->CLOSED; variance UNDER_REVIEW/INFO_REQUESTED; outreach event RECORDED; paying an already-paid share)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_establishment_version must equal Establishment.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /establishments/{id}, POST /variance-requests/{id}/approve"
  - priority: 8
    category: auth
    check: "Segregation of duties: violation dismisser X-User-ID != violation.recorded_by_user_id; blockage closer X-User-ID != blockage.assessed_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /violations/{id}/dismiss, POST /blockage-events/{id}/close"
  - priority: 9
    category: business_safety
    check: "Regulatory gates: hauler PERMITTED for manifest verify and disposal create (ERR_HAULER_NOT_PERMITTED); interceptor ACTIVE for manifest creation (ERR_INTERCEPTOR_NOT_ACTIVE); hauler insurance not expired at permitting (ERR_INSURANCE_EXPIRED); establishment not SUSPENDED for variance approval (ERR_ESTABLISHMENT_SUSPENDED)"
    error_id: "ERR_HAULER_NOT_PERMITTED | ERR_INTERCEPTOR_NOT_ACTIVE | ERR_INSURANCE_EXPIRED | ERR_ESTABLISHMENT_SUSPENDED"
    http_status: 409
    applies_to: "manifest create/verify, disposal create, hauler permit, variance approve"
  - priority: 10
    category: business_referential
    check: "Cross-reference coherence at manifest verify: interceptor belongs to manifest establishment (ERR_INTERCEPTOR_MISMATCH); disposal record exists for manifest (ERR_DISPOSAL_RECORD_MISSING); disposal volume within 5% tolerance (ERR_DISPOSAL_DISCREPANCY 422)"
    error_id: "ERR_INTERCEPTOR_MISMATCH | ERR_DISPOSAL_RECORD_MISSING | ERR_DISPOSAL_DISCREPANCY"
    http_status: 422
    applies_to: "POST /pump-manifests/{id}/verify"
  - priority: 11
    category: business_temporal
    check: "Time-window rules: manual escalate only at/after cure_deadline (ERR_ESCALATION_NOT_DUE); variance window overlap vs APPROVED same-scope variances (ERR_VARIANCE_WINDOW_OVERLAP); campaign zone 14-day buffer (ERR_CAMPAIGN_WINDOW_CONFLICT); outreach event_date within campaign window (ERR_OUTSIDE_CAMPAIGN_WINDOW, 422); clock-set monotone non-decreasing (ERR_CLOCK_REGRESSION, 422)"
    error_id: "ERR_ESCALATION_NOT_DUE | ERR_VARIANCE_WINDOW_OVERLAP | ERR_CAMPAIGN_WINDOW_CONFLICT | ERR_OUTSIDE_CAMPAIGN_WINDOW | ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: "violation escalate, variance approve, campaign create, campaign event create, clock set"
  - priority: 12
    category: business_constraint
    check: "Uniqueness and structural constraints: one manifest per interceptor+pump_date (ERR_DUPLICATE_MANIFEST); one disposal record per manifest (ERR_DUPLICATE_DISPOSAL); one open variance per establishment+scope (ERR_VARIANCE_ALREADY_OPEN); interceptor nominal capacity >= required at approval (ERR_INTERCEPTOR_UNDERSIZED, 422); contributions non-empty (ERR_NO_CONTRIBUTORS, 422); weights sum to 100 (ERR_WEIGHTS_INVALID, 422)"
    error_id: "ERR_DUPLICATE_MANIFEST | ERR_DUPLICATE_DISPOSAL | ERR_VARIANCE_ALREADY_OPEN | ERR_INTERCEPTOR_UNDERSIZED | ERR_NO_CONTRIBUTORS | ERR_WEIGHTS_INVALID"
    http_status: 409
    applies_to: "manifest create, disposal create, variance create, interceptor approve, blockage assess"
  - priority: 13
    category: business_fiscal
    check: "Money checks last: campaign event cost <= remaining_budget_cents (ERR_CAMPAIGN_BUDGET_EXCEEDED, 422); blockage close requires all shares paid (ERR_COST_SHARE_UNPAID)"
    error_id: "ERR_CAMPAIGN_BUDGET_EXCEEDED | ERR_COST_SHARE_UNPAID"
    http_status: 409
    applies_to: "campaign event create, blockage close"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Establishments ---
  - method: POST
    path: "/establishments"
    description: "Register a food-service establishment; computes risk_score/risk_class, pumping_frequency_days, posture COMPLIANT"
    roles: [ProgramAdmin]
    code: 201
    input: [name, street_address, seating_capacity, fryer_count, cuisine_profile, "has_charbroiler?"]
    output: Establishment
    side_effects: ["risk_classification computed", "compliance_status = COMPLIANT", "open_violation_count = 0", "missed_pump_windows = 0"]
  - method: GET
    path: "/establishments/{id}"
    description: "Read one establishment including computed posture and delinquency fields"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: []
    output: Establishment
    side_effects: []
  - method: PATCH
    path: "/establishments/{id}"
    description: "Update profile fields; recomputes risk_class, pumping_frequency_days, posture; OCC via expected_establishment_version"
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "street_address?", "seating_capacity?", "fryer_count?", "has_charbroiler?", "cuisine_profile?", expected_establishment_version]
    output: Establishment
    side_effects: ["risk_classification recomputed", "pumping_frequency_days recomputed", "compliance_posture recomputed", "increments Establishment.version by 1"]

  # --- Grease Interceptors ---
  - method: POST
    path: "/interceptors"
    description: "Propose a grease interceptor for an establishment; provisional sizing computed; status PROPOSED"
    roles: [FseContact, ProgramAdmin]
    code: 201
    input: [establishment_id, nominal_capacity_gal, "measured_flow_gpm?"]
    output: GreaseInterceptor
    side_effects: ["provisional_required_gal computed (provisional variant)"]
  - method: GET
    path: "/interceptors"
    description: "List interceptors, filterable by establishment and status"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: ["establishment_id?", "status?", "limit?", "offset?"]
    output: "GreaseInterceptor[]"
    side_effects: []
  - method: GET
    path: "/interceptors/{id}"
    description: "Read one interceptor"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: []
    output: GreaseInterceptor
    side_effects: []
  - method: POST
    path: "/interceptors/{id}/approve"
    description: "Sizing approval: fixes required_min_capacity_gal and sizing_method; rejects undersized proposals"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GreaseInterceptor
    side_effects: ["status PROPOSED -> APPROVED", "final sizing variant fixed"]
  - method: POST
    path: "/interceptors/{id}/commission"
    description: "Installation approval: field-verified interceptor goes ACTIVE and becomes pumpable"
    roles: [Inspector]
    code: 200
    input: []
    output: GreaseInterceptor
    side_effects: ["status APPROVED -> ACTIVE"]

  # --- Inspections ---
  - method: POST
    path: "/inspections"
    description: "Record a scored inspection (immutable); failing score auto-creates a NOTICED Violation"
    roles: [Inspector]
    code: 201
    input: [establishment_id, items]
    output: Inspection
    side_effects: ["inspection_score computed", "if score < 70: Violation created NOTICED with cure_deadline; Establishment.open_violation_count += 1; compliance_posture recomputed"]
  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by establishment"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer]
    code: 200
    input: ["establishment_id?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Read one inspection"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # --- Violations ---
  - method: GET
    path: "/violations"
    description: "List violations, filterable by establishment, source inspection, and status"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: ["establishment_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: "Violation[]"
    side_effects: []
  - method: GET
    path: "/violations/{id}"
    description: "Read one violation"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: POST
    path: "/violations/{id}/escalate"
    description: "Escalate NOTICED -> CITATION once cure_deadline has been reached; sets fine; posture may enter SUSPENDED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["citation_fine applied", "compliance_posture recompute", "SUSPENDED cascade denies open VarianceRequests"]
  - method: POST
    path: "/violations/{id}/resolve"
    description: "Mark a violation corrected"
    roles: [Inspector]
    code: 200
    input: []
    output: Violation
    side_effects: ["status -> RESOLVED", "open_violation_count -= 1", "compliance_posture recompute"]
  - method: POST
    path: "/violations/{id}/dismiss"
    description: "Dismiss a violation; segregation of duties vs recording inspector"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: ["status -> DISMISSED", "open_violation_count -= 1", "compliance_posture recompute"]

  # --- Pump Manifests ---
  - method: POST
    path: "/pump-manifests"
    description: "Submit a pumping manifest; interceptor must be ACTIVE; one manifest per interceptor per pump_date"
    roles: [FseContact]
    code: 201
    input: [establishment_id, interceptor_id, hauler_id, pump_date, pumped_volume_gal]
    output: PumpManifest
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/pump-manifests"
    description: "List manifests, filterable by establishment, hauler, interceptor, status"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact, HaulerAdmin]
    code: 200
    input: ["establishment_id?", "hauler_id?", "interceptor_id?", "status?", "limit?", "offset?"]
    output: "PumpManifest[]"
    side_effects: []
  - method: GET
    path: "/pump-manifests/{id}"
    description: "Read one manifest"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact, HaulerAdmin]
    code: 200
    input: []
    output: PumpManifest
    side_effects: []
  - method: POST
    path: "/pump-manifests/{id}/verify"
    description: "Verify a manifest against hauler permit, interceptor ownership, and disposal reconciliation"
    roles: [Inspector]
    code: 200
    input: []
    output: PumpManifest
    side_effects: ["status -> VERIFIED", "Establishment.last_verified_pump_at := pump_date", "compliance_posture recompute"]
  - method: POST
    path: "/pump-manifests/{id}/reject"
    description: "Reject a manifest with a reason; DISPOSAL_MISMATCH increments hauler.mismatch_count and may auto-suspend the hauler"
    roles: [Inspector]
    code: 200
    input: [reason_code]
    output: PumpManifest
    side_effects: ["status -> REJECTED", "DISPOSAL_MISMATCH cascade: mismatch_count += 1 -> hauler auto-SUSPENDED at 3 -> hauler's SUBMITTED manifests auto-REJECTED (HAULER_SUSPENDED)"]

  # --- Haulers ---
  - method: POST
    path: "/haulers"
    description: "Register a waste hauler; status APPLIED"
    roles: [ProgramAdmin]
    code: 201
    input: [name, permit_number, insurance_expires_on]
    output: Hauler
    side_effects: ["status = APPLIED", "mismatch_count = 0"]
  - method: GET
    path: "/haulers/{id}"
    description: "Read one hauler"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, HaulerAdmin]
    code: 200
    input: []
    output: Hauler
    side_effects: []
  - method: POST
    path: "/haulers/{id}/permit"
    description: "Grant the operating permit; insurance must be unexpired"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Hauler
    side_effects: ["status APPLIED -> PERMITTED"]
  - method: POST
    path: "/haulers/{id}/suspend"
    description: "Suspend a permitted hauler; its SUBMITTED manifests are auto-rejected"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Hauler
    side_effects: ["status PERMITTED -> SUSPENDED", "SUBMITTED manifests of this hauler -> REJECTED (HAULER_SUSPENDED)"]
  - method: POST
    path: "/haulers/{id}/reinstate"
    description: "Reinstate a suspended hauler; resets mismatch_count to 0"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Hauler
    side_effects: ["status SUSPENDED -> PERMITTED", "mismatch_count := 0"]
  - method: POST
    path: "/haulers/{id}/revoke"
    description: "Revoke a hauler permit permanently"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Hauler
    side_effects: ["status PERMITTED|SUSPENDED -> REVOKED"]

  # --- Disposal Records ---
  - method: POST
    path: "/disposal-records"
    description: "Record disposal at a receiving site; hauler must be PERMITTED; manifest must be SUBMITTED; one record per manifest"
    roles: [HaulerAdmin]
    code: 201
    input: [hauler_id, manifest_id, disposed_volume_gal, disposal_site_name, disposed_at]
    output: DisposalRecord
    side_effects: []
  - method: GET
    path: "/disposal-records"
    description: "List disposal records, filterable by hauler and manifest"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, HaulerAdmin]
    code: 200
    input: ["hauler_id?", "manifest_id?", "limit?", "offset?"]
    output: "DisposalRecord[]"
    side_effects: []
  - method: GET
    path: "/disposal-records/{id}"
    description: "Read one disposal record"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, HaulerAdmin]
    code: 200
    input: []
    output: DisposalRecord
    side_effects: []

  # --- Blockage Events & Cost Recovery ---
  - method: POST
    path: "/blockage-events"
    description: "Report a sewer blockage; status REPORTED"
    roles: [Inspector]
    code: 201
    input: [location_description]
    output: BlockageEvent
    side_effects: ["status = REPORTED"]
  - method: GET
    path: "/blockage-events/{id}"
    description: "Read one blockage event including contributions and computed shares"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: []
    output: BlockageEvent
    side_effects: []
  - method: POST
    path: "/blockage-events/{id}/assess"
    description: "Fix total cleanup cost and contributing establishments; computes per-contribution share_cents"
    roles: [Inspector]
    code: 200
    input: [total_cleanup_cost_cents, contributions]
    output: BlockageEvent
    side_effects: ["cost_share_apportionment computed", "status REPORTED -> ASSESSED"]
  - method: POST
    path: "/blockage-events/{id}/pay"
    description: "FseContact pays its own establishment's assessed share"
    roles: [FseContact]
    code: 200
    input: [establishment_id]
    output: BlockageEvent
    side_effects: ["contribution.paid_at := current clock"]
  - method: POST
    path: "/blockage-events/{id}/close"
    description: "Close once all shares are paid; closer must differ from assessor (SoD)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BlockageEvent
    side_effects: ["status ASSESSED -> CLOSED"]

  # --- Variance Requests ---
  - method: POST
    path: "/variance-requests"
    description: "Request a variance; at most one open variance per establishment+scope; starts UNDER_REVIEW"
    roles: [FseContact]
    code: 201
    input: [establishment_id, scope, justification, effective_from, effective_to, "requested_frequency_days?"]
    output: VarianceRequest
    side_effects: ["status = UNDER_REVIEW"]
  - method: GET
    path: "/variance-requests"
    description: "List variance requests, filterable by establishment, status, scope"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: ["establishment_id?", "status?", "scope?", "limit?", "offset?"]
    output: "VarianceRequest[]"
    side_effects: []
  - method: GET
    path: "/variance-requests/{id}"
    description: "Read one variance request"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer, FseContact]
    code: 200
    input: []
    output: VarianceRequest
    side_effects: []
  - method: POST
    path: "/variance-requests/{id}/request-info"
    description: "Ask the applicant for more information"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: VarianceRequest
    side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED"]
  - method: POST
    path: "/variance-requests/{id}/provide-info"
    description: "Applicant supplies the requested information; returns to UNDER_REVIEW"
    roles: [FseContact]
    code: 200
    input: [justification]
    output: VarianceRequest
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW", "justification replaced"]
  - method: POST
    path: "/variance-requests/{id}/approve"
    description: "Approve a variance; OCC-pinned to the establishment version; writes frequency override for PUMPING_FREQUENCY scope"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_establishment_version]
    output: VarianceRequest
    side_effects: ["status -> APPROVED", "Establishment.variance_override_frequency_days set when scope == PUMPING_FREQUENCY", "increments Establishment.version by 1", "compliance_posture recompute"]
  - method: POST
    path: "/variance-requests/{id}/deny"
    description: "Deny a variance"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: VarianceRequest
    side_effects: ["status UNDER_REVIEW|INFO_REQUESTED -> DENIED"]

  # --- Public Education Campaigns ---
  - method: POST
    path: "/campaigns"
    description: "Create an education campaign; zone windows must not overlap or sit within 14 days of another campaign in the same zone"
    roles: [ProgramAdmin]
    code: 201
    input: [name, outreach_zone, start_date, end_date, budget_cents]
    output: EducationCampaign
    side_effects: ["remaining_budget_cents := budget_cents"]
  - method: GET
    path: "/campaigns/{id}"
    description: "Read one campaign including remaining budget"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: EducationCampaign
    side_effects: []
  - method: POST
    path: "/campaigns/{id}/events"
    description: "Record an outreach event; debits campaign budget; event_date must fall inside the campaign window"
    roles: [ProgramAdmin]
    code: 201
    input: [event_date, venue_name, attendance_count, cost_cents]
    output: OutreachEvent
    side_effects: ["OutreachEvent created RECORDED", "remaining_budget_cents -= cost_cents"]
  - method: GET
    path: "/outreach-events"
    description: "List outreach events, filterable by campaign and status"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "OutreachEvent[]"
    side_effects: []
  - method: GET
    path: "/outreach-events/{id}"
    description: "Read one outreach event"
    roles: [ProgramAdmin, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: []
  - method: POST
    path: "/outreach-events/{id}/void"
    description: "Void an event; credits its cost back to the campaign budget"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: ["status RECORDED -> VOIDED", "remaining_budget_cents += cost_cents"]

  # --- Operations ---
  - method: POST
    path: "/sweeps/run"
    description: "Compliance sweep checkpoint: auto-escalates every NOTICED violation whose cure_deadline <= current clock to CITATION (with posture cascade); recomputes pumping delinquency posture for all establishments"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "{ escalated_violation_ids: string[], delinquent_establishment_ids: string[] }"
    side_effects: ["overdue NOTICED violations -> CITATION (citation_fine applied)", "compliance_posture recomputed per establishment", "SUSPENDED cascade denies open VarianceRequests"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). New value must be strictly after the current value (monotone; ERR_CLOCK_REGRESSION otherwise)"
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, unknown enum value, end before start, scope-conditional field violation" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller acts on a resource owned by a different establishment/hauler" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_establishment_version does not match the establishment's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: dismisser == recorder, or blockage closer == assessor" }
  - { id: ERR_HAULER_NOT_PERMITTED, http: 409, condition: "Hauler not in PERMITTED status at manifest verify or disposal create" }
  - { id: ERR_INTERCEPTOR_NOT_ACTIVE, http: 409, condition: "Manifest created against an interceptor not yet ACTIVE" }
  - { id: ERR_INSURANCE_EXPIRED, http: 422, condition: "insurance_expires_on is at/before the current clock when permitting a hauler" }
  - { id: ERR_ESTABLISHMENT_SUSPENDED, http: 409, condition: "Variance approval while the establishment's compliance_status is SUSPENDED" }
  - { id: ERR_INTERCEPTOR_MISMATCH, http: 422, condition: "Manifest's interceptor belongs to a different establishment" }
  - { id: ERR_DISPOSAL_RECORD_MISSING, http: 422, condition: "Verify requested but no DisposalRecord exists for the manifest" }
  - { id: ERR_DISPOSAL_DISCREPANCY, http: 422, condition: "|disposed - pumped| / pumped > 0.05 at manifest verify" }
  - { id: ERR_DUPLICATE_MANIFEST, http: 409, condition: "A manifest already exists for the same interceptor and pump_date" }
  - { id: ERR_DUPLICATE_DISPOSAL, http: 409, condition: "A DisposalRecord already exists for the manifest" }
  - { id: ERR_VARIANCE_ALREADY_OPEN, http: 409, condition: "An UNDER_REVIEW or INFO_REQUESTED variance already exists for the same establishment and scope" }
  - { id: ERR_VARIANCE_WINDOW_OVERLAP, http: 409, condition: "Approval would overlap another APPROVED same-scope variance window (half-open; adjacency allowed)" }
  - { id: ERR_ESCALATION_NOT_DUE, http: 409, condition: "Manual escalate before cure_deadline (exactly at deadline is allowed)" }
  - { id: ERR_CAMPAIGN_WINDOW_CONFLICT, http: 409, condition: "Campaign overlaps or sits within 14 days of another campaign in the same outreach_zone" }
  - { id: ERR_OUTSIDE_CAMPAIGN_WINDOW, http: 422, condition: "Outreach event_date outside the campaign's [start_date, end_date]" }
  - { id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http: 422, condition: "Event cost exceeds remaining_budget_cents (cost exactly equal to remaining is allowed)" }
  - { id: ERR_NO_CONTRIBUTORS, http: 422, condition: "Blockage assessment with an empty contributions array" }
  - { id: ERR_WEIGHTS_INVALID, http: 422, condition: "Contribution weight_percent values do not sum to 100" }
  - { id: ERR_COST_SHARE_UNPAID, http: 409, condition: "Close requested while any contribution has paid_at == null" }
  - { id: ERR_INTERCEPTOR_UNDERSIZED, http: 422, condition: "nominal_capacity_gal < required_min_capacity_gal at approval" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "Clock-set value not strictly after the current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "City FOG program administrator; manages the establishment inventory, hauler registration and permitting, campaigns, sweeps, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /establishments, PATCH /establishments/{id}"
      - "POST /haulers, POST /haulers/{id}/permit"
      - "POST /campaigns, POST /campaigns/{id}/events, POST /outreach-events/{id}/void"
      - "POST /sweeps/run, POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads on all resources"
      - "POST /interceptors (shared with FseContact)"
  - name: Inspector
    description: "Field inspector; scores inspections, commissions interceptors, verifies/rejects manifests, resolves violations, investigates blockages"
    identity: opaque
    exclusive_operations:
      - "POST /inspections"
      - "POST /interceptors/{id}/commission"
      - "POST /pump-manifests/{id}/verify, POST /pump-manifests/{id}/reject"
      - "POST /violations/{id}/resolve"
      - "POST /blockage-events, POST /blockage-events/{id}/assess"
    shared_operations:
      - "GET reads on all resources"
  - name: ComplianceOfficer
    description: "Compliance reviewer; approves interceptor sizing, escalates/dismisses violations, suspends/reinstates/revokes haulers, decides variances, closes blockage cost recovery"
    identity: opaque
    exclusive_operations:
      - "POST /interceptors/{id}/approve"
      - "POST /violations/{id}/escalate, POST /violations/{id}/dismiss"
      - "POST /haulers/{id}/suspend, POST /haulers/{id}/reinstate, POST /haulers/{id}/revoke"
      - "POST /variance-requests/{id}/request-info, POST /variance-requests/{id}/approve, POST /variance-requests/{id}/deny"
      - "POST /blockage-events/{id}/close"
    shared_operations:
      - "GET reads on all resources"
  - name: FseContact
    description: "Food-service establishment contact; owns exactly one establishment (X-User-ID == Establishment.id); proposes interceptors, submits manifests, requests variances, pays cost shares"
    identity: "entity_backed:Establishment"
    exclusive_operations:
      - "POST /pump-manifests"
      - "POST /variance-requests, POST /variance-requests/{id}/provide-info"
      - "POST /blockage-events/{id}/pay"
    shared_operations:
      - "POST /interceptors (shared with ProgramAdmin)"
      - "GET reads limited to own establishment's resources"
  - name: HaulerAdmin
    description: "Waste hauler administrator; owns exactly one hauler (X-User-ID == Hauler.id); files disposal records"
    identity: "entity_backed:Hauler"
    exclusive_operations:
      - "POST /disposal-records"
    shared_operations:
      - "GET reads on own hauler, manifests naming the hauler, and own disposal records"
