scenario: |
  2900. Electronic Resource Licensing & Consortium Purchasing (academic library collections office): trial setup, evaluation criteria and stakeholder feedback before subscription, license negotiation for interlibrary loan, text mining, accessibility and perpetual access terms, consortium tier pricing and participation commitments, authentication configuration and off-campus access troubleshooting, usage statistics collection with cost-per-use analysis, renewal decisions with inflation caps and cancellation notice deadlines, title swap and package restructuring, post-cancellation access rights and archival deposit verification
domain_name: electronic-resource-licensing-consortium
api_prefix: "/erm"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Member x Product participation is a many-to-many junction (Commitment); Trial,
  # Negotiation, Subscription and RenewalDecision form cross-aggregate reference
  # edges rather than a single ownership tree. No entity nests more than one level
  # deep in a URL path.

  state_machine_shape: parallel
  # Subscription carries two independent state axes (contract_status x access_status).
  # Negotiation is cyclic (DRAFTING -> VENDOR_REVIEW -> COUNTERED -> DRAFTING).
  # RenewalDecision is branching fork-join (VOTING -> {RENEW|CANCEL|RESTRUCTURE} -> EXECUTED)
  # with a divergent side-effect set per branch. AccessIncident is cyclic via REOPENED.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The LicenseNegotiator operator id that last submitted a negotiation round MUST NOT
  # be the operator id that signs it. VendorRep and MemberLibrarian are entity-backed
  # peer roles scoped to their own Vendor / Member rows.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 54 endpoints / 52 error codes / 7 calculations / 9 state machines /
  # 33 ordered validation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Institution name of the consortium member library."
      - name: fte_count
        type: integer
        source: input
        description: "Full-time-equivalent enrolled population; drives the FTE pricing factor and the invoice allocation weight."
        constraints: ">= 1"
      - name: carnegie_class
        type: enum
        source: input
        description: "Carnegie classification band; drives the carnegie pricing factor."
        constraints: "one of R1 | R2 | MASTERS | BACCALAUREATE"
      - name: budget_ceiling_cents
        type: integer
        source: input
        description: "Hard annual ceiling on this member's committed spend, in cents."
        constraints: ">= 0"
      - name: annual_committed_cents
        type: integer
        source: computed
        description: "Sum of tier_price_cents over this member's Commitment rows with status == CONFIRMED. Maintained incrementally by commitment confirm / withdraw / release side effects."
        default: 0
      - name: standing
        type: enum
        source: computed
        description: "IN_GOOD_STANDING while annual_committed_cents <= budget_ceiling_cents; OVER_COMMITTED once annual_committed_cents > budget_ceiling_cents; returns to IN_GOOD_STANDING when a withdraw or release brings the total back to <= ceiling."
        default: IN_GOOD_STANDING
        constraints: "one of IN_GOOD_STANDING | OVER_COMMITTED"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Publisher or aggregator legal name."
      - name: archival_agency_code
        type: enum
        source: input
        description: "Third-party preservation agency this vendor deposits with; null when the vendor deposits nowhere."
        default: null
        constraints: "one of PORTICO | CLOCKSS | LOCKSS | null"
      - name: vpat_on_file
        type: boolean
        source: input
        description: "True when a current accessibility conformance report (VPAT) is on file with the collections office."
        default: false

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor that licenses this package."
      - name: name
        type: string
        source: input
        description: "Package or database name."
      - name: base_list_price_cents
        type: integer
        source: input
        description: "Vendor list price for the whole package for one term, in cents."
        constraints: ">= 1"
      - name: title_count
        type: integer
        source: input
        description: "Number of titles in the package as offered."
        constraints: ">= 1"
      - name: inflation_cap_pct
        type: number
        source: input
        description: "Maximum annual price increase percentage the collections office will accept at renewal."
        constraints: ">= 0 and <= 25, two decimal places"
      - name: cancellation_notice_days
        type: integer
        source: input
        description: "Number of days before term_end by which a cancellation must be executed."
        constraints: ">= 0"
      - name: perpetual_access_mode_offered
        type: enum
        source: input
        description: "Strongest perpetual-access term the vendor is willing to offer for this package."
        constraints: "one of NONE | POST_CANCELLATION_SUBSET | FULL_ARCHIVE"
      - name: ill_mode_offered
        type: enum
        source: input
        description: "Strongest interlibrary-loan term the vendor is willing to offer for this package."
        constraints: "one of PROHIBITED | PRINT_ONLY | SECURE_ELECTRONIC"
      - name: text_mining_offered
        type: boolean
        source: input
        description: "True when the vendor is willing to grant a text and data mining right for this package."
      - name: tier_bands
        type: array
        source: input
        description: "Consortium participation discount schedule; ordered array of objects { min_participants: integer, discount_pct: number }. Evaluated by selecting the single band with the largest min_participants that is <= the participant count."
        constraints: "at least one band; the first band MUST have min_participants == 1; min_participants strictly increasing"

  - name: Trial
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the package being trialled."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member library running the trial."
      - name: start_date
        type: string
        source: input
        description: "Trial window start, calendar date YYYY-MM-DD, inclusive."
      - name: end_date
        type: string
        source: input
        description: "Trial window end, calendar date YYYY-MM-DD, exclusive (half-open window [start_date, end_date))."
      - name: criteria
        type: array
        source: input
        description: "Evaluation criteria for this trial; array of objects { code: string, weight_pct: number }. weight_pct values MUST sum to exactly 100."
        constraints: "1..6 entries; code one of CONTENT_FIT | INTERFACE | ILL_TERMS | TEXT_MINING | ACCESSIBILITY | PRICE_VALUE; codes unique"
      - name: status
        type: enum
        source: system
        description: "Trial lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | CLOSED | ENDORSED | DECLINED | WITHDRAWN"
      - name: provisional_score
        type: number
        source: computed
        description: "trial_endorsement_score computed with the provisional_at_close variant when the trial is closed; null before close."
        default: null
      - name: final_score
        type: number
        source: computed
        description: "trial_endorsement_score computed with the final_at_evaluation variant when the trial is evaluated; null before evaluation."
        default: null
      - name: feedback_count
        type: integer
        source: computed
        description: "Count of FeedbackEntry rows whose trial_id == this Trial.id."
        default: 0
      - name: distinct_stakeholder_group_count
        type: integer
        source: computed
        description: "Count of distinct FeedbackEntry.stakeholder_group values among this trial's feedback rows."
        default: 0
      - name: quorum_penalty_applied
        type: boolean
        source: computed
        description: "True when the final_at_evaluation variant applied the QUORUM_PENALTY_FACTOR because distinct_stakeholder_group_count < STAKEHOLDER_QUORUM_GROUPS."
        default: false

  - name: FeedbackEntry
    parent: Trial
    common_fields: false
    fields:
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; the trial this feedback scores."
      - name: stakeholder_group
        type: enum
        source: input
        description: "Stakeholder cohort of the respondent; selects the stakeholder weight used by trial_endorsement_score."
        constraints: "one of FACULTY | GRADUATE | UNDERGRADUATE | LIBRARIAN"
      - name: criterion_code
        type: string
        source: input
        description: "Code of the Trial.criteria entry this row scores; MUST match one of the trial's declared criterion codes."
      - name: score
        type: integer
        source: input
        description: "Raw stakeholder score on a 0..100 scale for the named criterion."
        constraints: ">= 0 and <= 100"
      - name: submitted_during_status
        type: enum
        source: system
        description: "Trial.status observed at the instant this row was accepted; ACTIVE rows enter both score variants, CLOSED rows enter only the final variant."
        constraints: "one of ACTIVE | CLOSED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MemberLibrarian that submitted the row; audit only, never a pricing or ordering input."
      - name: comment
        type: string
        source: input
        description: "Free-text stakeholder comment."
        default: null

  - name: Negotiation
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the package under negotiation."
      - name: trial_id
        type: string
        source: input
        description: "FK -> Trial.id; the trial whose endorsement gates signing."
      - name: status
        type: enum
        source: system
        description: "Negotiation round state; cyclic through COUNTERED -> DRAFTING."
        default: DRAFTING
        constraints: "one of DRAFTING | VENDOR_REVIEW | COUNTERED | AGREED | SIGNED"
      - name: round_count
        type: integer
        source: computed
        description: "Number of times this negotiation has entered VENDOR_REVIEW; incremented by every submit."
        default: 0
      - name: target_term_start
        type: string
        source: input
        description: "Requested subscription term start, calendar date YYYY-MM-DD, inclusive."
      - name: target_term_end
        type: string
        source: input
        description: "Requested subscription term end, calendar date YYYY-MM-DD, inclusive."
      - name: requested_ill_mode
        type: enum
        source: input
        description: "Interlibrary-loan term the consortium asks for."
        constraints: "one of PROHIBITED | PRINT_ONLY | SECURE_ELECTRONIC"
      - name: requested_text_mining
        type: boolean
        source: input
        description: "True when the consortium asks for a text and data mining right."
      - name: requested_accessibility_conformance
        type: enum
        source: input
        description: "Accessibility conformance level the consortium asks for."
        constraints: "one of NONE | VPAT_PARTIAL | WCAG_2_1_AA"
      - name: requested_perpetual_access
        type: enum
        source: input
        description: "Perpetual-access term the consortium asks for."
        constraints: "one of NONE | POST_CANCELLATION_SUBSET | FULL_ARCHIVE"
      - name: granted_ill_mode
        type: enum
        source: system
        description: "Interlibrary-loan term the vendor granted in its latest response; null before the first vendor response."
        default: null
        constraints: "one of PROHIBITED | PRINT_ONLY | SECURE_ELECTRONIC | null"
      - name: granted_text_mining
        type: boolean
        source: system
        description: "Text and data mining right granted by the vendor's latest response; null before the first vendor response."
        default: null
      - name: granted_accessibility_conformance
        type: enum
        source: system
        description: "Accessibility conformance level granted by the vendor's latest response; null before the first vendor response."
        default: null
        constraints: "one of NONE | VPAT_PARTIAL | WCAG_2_1_AA | null"
      - name: granted_perpetual_access
        type: enum
        source: system
        description: "Perpetual-access term granted by the vendor's latest response; null before the first vendor response."
        default: null
        constraints: "one of NONE | POST_CANCELLATION_SUBSET | FULL_ARCHIVE | null"
      - name: vendor_counter_price_cents
        type: integer
        source: system
        description: "Package price the vendor named in its latest COUNTER response; null when no counter has been made."
        default: null
      - name: agreed_price_cents
        type: integer
        source: system
        description: "Package price locked when the vendor response disposition is ACCEPT; the Subscription is created at this price."
        default: null
      - name: last_submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LicenseNegotiator that performed the most recent submit; compared against the signer's X-User-ID by the segregation-of-duties check."
        default: null
      - name: last_vendor_disposition
        type: enum
        source: system
        description: "Disposition of the most recent vendor response."
        default: null
        constraints: "one of ACCEPT | COUNTER | null"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: negotiation_id
        type: string
        source: system
        description: "FK -> Negotiation.id; the signed negotiation that produced this subscription."
      - name: product_id
        type: string
        source: system
        description: "FK -> Product.id; denormalized from the negotiation for direct product lookups."
      - name: contract_status
        type: enum
        source: system
        description: "Contract state axis. Evolves independently of access_status except at cancellation execution."
        default: PENDING_ACTIVATION
        constraints: "one of PENDING_ACTIVATION | ACTIVE | NOTICE_GIVEN | CANCELLED | EXPIRED"
      - name: access_status
        type: enum
        source: system
        description: "Access state axis, driven by AuthConfig verification and AccessIncident volume."
        default: UNCONFIGURED
        constraints: "one of UNCONFIGURED | CONFIGURED | DEGRADED | POST_CANCELLATION | SUSPENDED"
      - name: term_start
        type: string
        source: system
        description: "Subscription term start, calendar date YYYY-MM-DD, inclusive."
      - name: term_end
        type: string
        source: system
        description: "Subscription term end, calendar date YYYY-MM-DD, inclusive."
      - name: activation_start_date
        type: string
        source: input
        description: "Date on which the logical clock flips contract_status PENDING_ACTIVATION -> ACTIVE."
      - name: negotiated_price_cents
        type: integer
        source: system
        description: "Current package price for the running term, in cents; set from Negotiation.agreed_price_cents at signing and mutated by renewal execution and restructuring."
      - name: entitled_title_count
        type: integer
        source: computed
        description: "Titles the consortium is entitled to under the running term: Product.title_count minus the titles_out size plus the titles_in size of every RenewalDecision on this subscription whose status == EXECUTED and resolved_action == RESTRUCTURE."
      - name: perpetual_access_mode
        type: enum
        source: system
        description: "Perpetual-access term locked at signing from Negotiation.granted_perpetual_access."
        constraints: "one of NONE | POST_CANCELLATION_SUBSET | FULL_ARCHIVE"
      - name: access_health_score
        type: integer
        source: computed
        description: "access_health_score output for this subscription; recomputed on incident create, reopen and resolve."
        default: 100
      - name: degrade_count
        type: integer
        source: computed
        description: "Number of times access_status has entered DEGRADED; caps the SLA credit accrual at SLA_CREDIT_MAX_EVENTS."
        default: 0
      - name: sla_credit_cents
        type: integer
        source: computed
        description: "Accrued service-level credit, in cents; each DEGRADED entry adds round_half_up(negotiated_price_cents * SLA_CREDIT_PCT_PER_EVENT / 100) while degrade_count <= SLA_CREDIT_MAX_EVENTS."
        default: 0
      - name: notice_deadline_date
        type: string
        source: computed
        description: "term_end minus Product.cancellation_notice_days, as a calendar date; a cancellation execution on or before this date is timely."
      - name: renewal_term_count
        type: integer
        source: computed
        description: "Number of RenewalDecision rows on this subscription with status == EXECUTED and resolved_action == RENEW."
        default: 0

  - name: Commitment
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the package the member is pledging to."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the pledging member."
      - name: subscription_id
        type: string
        source: system
        description: "FK -> Subscription.id; set when signing confirms this pledge, null while the pledge is unattached."
        default: null
      - name: status
        type: enum
        source: system
        description: "Participation commitment state."
        default: PLEDGED
        constraints: "one of PLEDGED | CONFIRMED | WITHDRAWN | RELEASED"
      - name: projected_price_cents
        type: integer
        source: computed
        description: "member_tier_price_cents under the committed_projection variant, stamped at pledge time."
      - name: tier_price_cents
        type: integer
        source: computed
        description: "member_tier_price_cents under the settled_invoice variant, stamped when the pledge is confirmed by signing; null while status == PLEDGED."
        default: null
      - name: applied_discount_pct
        type: number
        source: computed
        description: "discount_pct of the tier_bands band selected by the variant that produced the latest price on this row."
      - name: participant_count_at_pricing
        type: integer
        source: computed
        description: "Participant count the latest pricing pass counted for this row; makes the variant divergence observable."

  - name: AuthConfig
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this authentication binding configures."
      - name: auth_method
        type: enum
        source: input
        description: "Authentication mechanism for on-campus and off-campus access."
        constraints: "one of IP_RANGE | EZPROXY | SHIBBOLETH | OPENATHENS"
      - name: auth_realm_code
        type: string
        source: input
        description: "Shared federation realm identifier; the overlap-capacity resource that realm bindings compete for."
      - name: ip_ranges
        type: array
        source: input
        description: "Array of CIDR strings registered with the vendor."
      - name: proxy_prefix
        type: string
        source: input
        description: "Off-campus proxy URL prefix; required when auth_method == EZPROXY."
        default: null
      - name: verification_status
        type: enum
        source: system
        description: "Result of the access probe."
        default: PENDING
        constraints: "one of PENDING | VERIFIED | FAILED"
      - name: last_probe_result
        type: enum
        source: system
        description: "Outcome reported by the most recent verify call."
        default: null
        constraints: "one of PASS | FAIL_OFF_CAMPUS | FAIL_ON_CAMPUS | null"

  - name: AccessIncident
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription whose access failed."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member library that reported the failure."
      - name: symptom_code
        type: enum
        source: input
        description: "Reported symptom."
        constraints: "one of OFF_CAMPUS_DENIED | WALK_IN_BLOCKED | PROXY_LOOP | SAML_ATTRIBUTE_MISSING"
      - name: off_campus
        type: boolean
        source: input
        description: "True when the failure was observed from outside the registered IP ranges; selects the heavier health penalty."
      - name: status
        type: enum
        source: system
        description: "Incident state; cyclic through REOPENED -> DIAGNOSED."
        default: OPEN
        constraints: "one of OPEN | DIAGNOSED | RESOLVED | REOPENED"
      - name: root_cause_code
        type: enum
        source: system
        description: "Root cause recorded by the diagnosing AccessEngineer."
        default: null
        constraints: "one of IP_RANGE_STALE | PROXY_MISCONFIGURED | VENDOR_SIDE | ENTITLEMENT_MISSING | null"
      - name: remedy_code
        type: enum
        source: system
        description: "Remedy recorded by the resolving AccessEngineer."
        default: null
        constraints: "one of IP_RANGE_UPDATED | PROXY_FIXED | VENDOR_TICKET_CLOSED | ENTITLEMENT_LOADED | null"
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of times this incident has been reopened; each reopen adds REOPEN_PENALTY to the subscription health penalty."
        default: 0

  - name: UsageReport
    parent: Subscription
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the usage belongs to."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member library whose users generated the usage."
      - name: period_month
        type: string
        source: input
        description: "Usage month in YYYY-MM form; the aggregation window is inclusive on both ends."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: full_text_requests
        type: integer
        source: input
        description: "COUNTER total_item_requests for the month; the denominator of cost_per_use_cents."
        constraints: ">= 0"
      - name: searches
        type: integer
        source: input
        description: "COUNTER searches_regular for the month."
        constraints: ">= 0"
      - name: denials
        type: integer
        source: input
        description: "COUNTER no_license denials for the month."
        constraints: ">= 0"

  - name: RenewalDecision
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this decision governs."
      - name: status
        type: enum
        source: system
        description: "Decision state; forks at decide into three branches with divergent execution side effects."
        default: DRAFT
        constraints: "one of DRAFT | VOTING | DECIDED_RENEW | DECIDED_CANCEL | DECIDED_RESTRUCTURE | EXECUTED | REVERTED | SUPERSEDED"
      - name: recommended_action
        type: enum
        source: input
        description: "Collections-office recommendation put to the member vote."
        constraints: "one of RENEW | CANCEL | RESTRUCTURE"
      - name: resolved_action
        type: enum
        source: system
        description: "Action chosen at decide; null before decide."
        default: null
        constraints: "one of RENEW | CANCEL | RESTRUCTURE | null"
      - name: vendor_requested_increase_pct
        type: number
        source: input
        description: "Price increase percentage the vendor asked for at renewal."
        constraints: ">= 0, two decimal places"
      - name: capped_increase_pct
        type: number
        source: computed
        description: "min(vendor_requested_increase_pct, Product.inflation_cap_pct); computed at decide."
        default: null
      - name: cost_per_use_cents
        type: integer
        source: computed
        description: "cost_per_use_cents over the running term at decide time; null when the usage denominator is zero."
        default: null
      - name: cost_per_use_band
        type: enum
        source: computed
        description: "Band selected from cost_per_use_cents; NO_USE when the usage denominator is zero."
        default: null
        constraints: "one of EXCELLENT | GOOD | POOR | NO_USE | null"
      - name: loyalty_credit_cents
        type: integer
        source: computed
        description: "Credit derived from cost_per_use_band and the prior-term price; computed at decide."
        default: 0
      - name: sla_credit_applied_cents
        type: integer
        source: computed
        description: "Subscription.sla_credit_cents snapshotted into the offer at decide."
        default: 0
      - name: offer_price_cents
        type: integer
        source: computed
        description: "renewal_offer_price output; computed at decide, applied to Subscription.negotiated_price_cents on RENEW execution."
        default: null
      - name: ballots
        type: array
        source: system
        description: "Array of objects { member_id: string, ballot: string, cast_at: string } appended by vote calls; at most one entry per member_id."
        default: []
      - name: yes_count
        type: integer
        source: computed
        description: "Count of ballots entries whose ballot == YES."
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: "True when ballots length >= ceil(count of Commitment rows with status == CONFIRMED on this subscription * VOTE_QUORUM_PCT / 100)."
        default: false
      - name: titles_out
        type: array
        source: input
        description: "Array of title identifier strings to drop from the package; RESTRUCTURE branch only."
        default: []
      - name: titles_in
        type: array
        source: input
        description: "Array of title identifier strings to add to the package; RESTRUCTURE branch only."
        default: []
      - name: delta_price_cents
        type: integer
        source: system
        description: "Price delta the vendor attached to the title swap; recorded at decide for the RESTRUCTURE branch, null otherwise."
        default: null

  - name: ArchivalDepositCheck
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription whose archival deposit is being verified."
      - name: agency_code
        type: enum
        source: input
        description: "Preservation agency the deposit is claimed with; MUST equal the Vendor.archival_agency_code of the subscription's product."
        constraints: "one of PORTICO | CLOCKSS | LOCKSS"
      - name: deposited_title_count
        type: integer
        source: input
        description: "Title count the collections office observed in the agency's holdings report."
        constraints: ">= 0"
      - name: attested_title_count
        type: integer
        source: system
        description: "Title count the vendor attested to; null before attestation."
        default: null
      - name: coverage_pct
        type: number
        source: computed
        description: "archival_coverage_pct output; null before verification."
        default: null
      - name: status
        type: enum
        source: system
        description: "Verification state; a FAILED check can be re-attested and re-verified."
        default: PENDING
        constraints: "one of PENDING | ATTESTED | VERIFIED | FAILED"

state_machines:
  - entity: Trial
    initial_state: DRAFT
    terminal_states: [ENDORSED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /erm/trials/{id}/open"
        actor: MemberLibrarian
        preconditions:
          - "Trial.status == DRAFT"
          - "Trial.member_id == X-User-ID of the acting MemberLibrarian"
          - "Member.standing of Trial.member_id == IN_GOOD_STANDING"
          - "logical clock calendar date < Trial.end_date"
        side_effects:
          - "Trial.status := ACTIVE"
          - "Trial.updated_at refreshed; Trial.version incremented by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /erm/trials/{id}/close"
        actor: MemberLibrarian
        preconditions:
          - "Trial.status == ACTIVE"
          - "Trial.member_id == X-User-ID of the acting MemberLibrarian"
        side_effects:
          - "Trial.provisional_score := trial_endorsement_score under the provisional_at_close variant"
          - "Trial.status := CLOSED"
          - "Trial.feedback_count and Trial.distinct_stakeholder_group_count refreshed"
      - from: CLOSED
        to: ENDORSED
        trigger: "POST /erm/trials/{id}/evaluate"
        actor: ConsortiumAdmin
        preconditions:
          - "Trial.status == CLOSED"
          - "Trial.feedback_count >= MIN_FEEDBACK_ROWS"
          - "trial_endorsement_score under the final_at_evaluation variant >= ENDORSEMENT_THRESHOLD"
        side_effects:
          - "Trial.final_score := trial_endorsement_score under the final_at_evaluation variant"
          - "Trial.quorum_penalty_applied := (Trial.distinct_stakeholder_group_count < STAKEHOLDER_QUORUM_GROUPS)"
          - "Trial.status := ENDORSED"
        note: "Branch fork: the ENDORSED and DECLINED edges share the same trigger and differ only on the ENDORSEMENT_THRESHOLD comparison, which is >= (a final_score of exactly 70.00 endorses)."
      - from: CLOSED
        to: DECLINED
        trigger: "POST /erm/trials/{id}/evaluate"
        actor: ConsortiumAdmin
        preconditions:
          - "Trial.status == CLOSED"
          - "Trial.feedback_count >= MIN_FEEDBACK_ROWS"
          - "trial_endorsement_score under the final_at_evaluation variant < ENDORSEMENT_THRESHOLD"
        side_effects:
          - "Trial.final_score := trial_endorsement_score under the final_at_evaluation variant"
          - "Trial.quorum_penalty_applied := (Trial.distinct_stakeholder_group_count < STAKEHOLDER_QUORUM_GROUPS)"
          - "Trial.status := DECLINED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: Member.standing of Trial.member_id became OVER_COMMITTED (hop 4 of the signing cascade)"
        actor: system
        preconditions:
          - "Trial.status == DRAFT"
          - "Member.standing == OVER_COMMITTED"
        side_effects:
          - "Trial.status := WITHDRAWN"
          - "Trial.updated_at refreshed; Trial.version incremented by 1"
        note: "Only DRAFT trials are withdrawn; ACTIVE, CLOSED and terminal trials are untouched (conditional cascade)."

  - entity: Negotiation
    initial_state: DRAFTING
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFTING
        to: VENDOR_REVIEW
        trigger: "POST /erm/negotiations/{id}/submit"
        actor: LicenseNegotiator
        preconditions:
          - "Negotiation.status == DRAFTING"
          - "Negotiation.round_count < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "Negotiation.round_count incremented by 1"
          - "Negotiation.last_submitted_by_user_id := X-User-ID of the acting LicenseNegotiator"
          - "Negotiation.status := VENDOR_REVIEW"
      - from: VENDOR_REVIEW
        to: COUNTERED
        trigger: "POST /erm/negotiations/{id}/vendor-response with disposition == COUNTER"
        actor: VendorRep
        preconditions:
          - "Negotiation.status == VENDOR_REVIEW"
          - "X-User-ID of the acting VendorRep == Product.vendor_id of Negotiation.product_id"
          - "counter_price_cents is present and >= 1"
        side_effects:
          - "Negotiation.vendor_counter_price_cents := counter_price_cents"
          - "Negotiation.granted_ill_mode / granted_text_mining / granted_accessibility_conformance / granted_perpetual_access := the granted_* values on the request"
          - "Negotiation.last_vendor_disposition := COUNTER"
          - "Negotiation.status := COUNTERED"
      - from: COUNTERED
        to: DRAFTING
        trigger: "POST /erm/negotiations/{id}/revise"
        actor: LicenseNegotiator
        preconditions:
          - "Negotiation.status == COUNTERED"
          - "Negotiation.round_count < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "Negotiation.requested_* fields replaced by the revised request values"
          - "Negotiation.status := DRAFTING"
        note: "Closes the negotiation cycle DRAFTING -> VENDOR_REVIEW -> COUNTERED -> DRAFTING; MAX_NEGOTIATION_ROUNDS bounds the loop."
      - from: VENDOR_REVIEW
        to: AGREED
        trigger: "POST /erm/negotiations/{id}/vendor-response with disposition == ACCEPT"
        actor: VendorRep
        preconditions:
          - "Negotiation.status == VENDOR_REVIEW"
          - "X-User-ID of the acting VendorRep == Product.vendor_id of Negotiation.product_id"
          - "granted_ill_mode is no stronger than Product.ill_mode_offered on the ordering PROHIBITED < PRINT_ONLY < SECURE_ELECTRONIC"
          - "granted_perpetual_access is no stronger than Product.perpetual_access_mode_offered on the ordering NONE < POST_CANCELLATION_SUBSET < FULL_ARCHIVE"
          - "granted_text_mining is false whenever Product.text_mining_offered is false"
        side_effects:
          - "Negotiation.agreed_price_cents := accepted_price_cents from the request"
          - "Negotiation.granted_* fields := the granted_* values on the request"
          - "Negotiation.last_vendor_disposition := ACCEPT"
          - "Negotiation.status := AGREED"
      - from: AGREED
        to: SIGNED
        trigger: "POST /erm/negotiations/{id}/sign"
        actor: ConsortiumAdmin
        preconditions:
          - "Negotiation.status == AGREED"
          - "Trial.status of Negotiation.trial_id == ENDORSED"
          - "Negotiation.granted_accessibility_conformance != NONE and (Vendor.vpat_on_file == true for the product's vendor)"
          - "X-User-ID of the acting ConsortiumAdmin != Negotiation.last_submitted_by_user_id"
          - "at least one Commitment row with status == PLEDGED exists on Negotiation.product_id"
        side_effects:
          - "Negotiation.status := SIGNED"
          - "hop 1: a Subscription row is created with contract_status = PENDING_ACTIVATION, access_status = UNCONFIGURED, negotiated_price_cents = Negotiation.agreed_price_cents, term_start = Negotiation.target_term_start, term_end = Negotiation.target_term_end, entitled_title_count = Product.title_count, perpetual_access_mode = Negotiation.granted_perpetual_access, notice_deadline_date = term_end minus Product.cancellation_notice_days"
          - "hop 2: the Subscription creation confirms participation - every Commitment row on Negotiation.product_id with status == PLEDGED gets subscription_id := the new Subscription.id, tier_price_cents := member_tier_price_cents under the settled_invoice variant, applied_discount_pct and participant_count_at_pricing refreshed, status := CONFIRMED"
          - "hop 3: each Commitment confirmation adds its own tier_price_cents to Member.annual_committed_cents of that commitment's member_id"
          - "hop 4: each Member whose annual_committed_cents now exceeds budget_ceiling_cents flips standing := OVER_COMMITTED, and that flip transitions every Trial of that member with status == DRAFT to WITHDRAWN"
        note: "Cascade of depth 4 (Negotiation -> Subscription -> Commitment -> Member -> Trial); each hop is caused by the mutation of the previous hop, not by the sign call itself."

  - entity: Subscription
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /erm/_clock/set_current_utc advancing the logical clock to a calendar date >= Subscription.activation_start_date"
        actor: system
        preconditions:
          - "Subscription.contract_status == PENDING_ACTIVATION"
          - "logical clock calendar date >= Subscription.activation_start_date"
        side_effects:
          - "Subscription.contract_status := ACTIVE"
          - "Subscription.updated_at refreshed; Subscription.version incremented by 1"
        note: "Contract axis. Evaluated for every PENDING_ACTIVATION subscription on every clock set, in Subscription.created_at ASC order."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /erm/renewal-decisions/{id}/execute on a decision whose resolved_action == RENEW"
        actor: ConsortiumAdmin
        preconditions:
          - "Subscription.contract_status == ACTIVE"
          - "RenewalDecision.status == DECIDED_RENEW"
        side_effects:
          - "Subscription.negotiated_price_cents := RenewalDecision.offer_price_cents"
          - "Subscription.term_start := previous term_end plus 1 day; Subscription.term_end := previous term_end plus 1 year; Subscription.notice_deadline_date recomputed"
          - "Subscription.sla_credit_cents := 0 and Subscription.degrade_count := 0 (credit consumed by the renewal offer)"
          - "Subscription.renewal_term_count incremented by 1"
          - "every Commitment row on this subscription with status == CONFIRMED is re-priced with member_tier_price_cents under the settled_invoice variant and the Member.annual_committed_cents of each affected member is adjusted by the price delta"
        note: "Contract-axis self-loop: RENEW keeps contract_status ACTIVE and rolls the term forward."
      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /erm/renewal-decisions/{id}/decide with resolved_action == CANCEL"
        actor: ConsortiumAdmin
        preconditions:
          - "Subscription.contract_status == ACTIVE"
          - "RenewalDecision.status == VOTING"
        side_effects:
          - "Subscription.contract_status := NOTICE_GIVEN"
      - from: NOTICE_GIVEN
        to: CANCELLED
        trigger: "POST /erm/renewal-decisions/{id}/execute on a decision whose resolved_action == CANCEL"
        actor: ConsortiumAdmin
        preconditions:
          - "Subscription.contract_status == NOTICE_GIVEN"
          - "RenewalDecision.status == DECIDED_CANCEL"
          - "an ArchivalDepositCheck row on this subscription has status == VERIFIED"
          - "logical clock calendar date <= Subscription.notice_deadline_date"
        side_effects:
          - "Subscription.contract_status := CANCELLED"
          - "Subscription.access_status := POST_CANCELLATION when Subscription.perpetual_access_mode != NONE, otherwise SUSPENDED"
          - "every Commitment row on this subscription with status == CONFIRMED becomes RELEASED and its tier_price_cents is subtracted from Member.annual_committed_cents of that commitment's member_id; a member whose annual_committed_cents falls back to <= budget_ceiling_cents flips standing := IN_GOOD_STANDING"
        note: "The only point at which the contract axis writes the access axis."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /erm/_clock/set_current_utc advancing the logical clock to a calendar date > Subscription.term_end"
        actor: system
        preconditions:
          - "Subscription.contract_status == ACTIVE"
          - "logical clock calendar date > Subscription.term_end"
        side_effects:
          - "Subscription.contract_status := EXPIRED"
          - "Subscription.access_status := SUSPENDED when Subscription.perpetual_access_mode == NONE, otherwise POST_CANCELLATION"

  - entity: Subscription
    initial_state: UNCONFIGURED
    terminal_states: [SUSPENDED]
    transitions:
      - from: UNCONFIGURED
        to: CONFIGURED
        trigger: "POST /erm/auth-configs/{id}/verify with probe_result == PASS"
        actor: AccessEngineer
        preconditions:
          - "Subscription.access_status == UNCONFIGURED"
          - "Subscription.contract_status == ACTIVE"
          - "AuthConfig.verification_status IN {PENDING, FAILED}"
        side_effects:
          - "AuthConfig.verification_status := VERIFIED"
          - "Subscription.access_status := CONFIGURED"
          - "Subscription.access_health_score := 100"
        note: "Access axis. Runs independently of the contract axis in both directions except for the cancellation write above."
      - from: CONFIGURED
        to: DEGRADED
        trigger: "system: access_health_score recomputation after POST /erm/subscriptions/{id}/access-incidents or POST /erm/access-incidents/{id}/reopen drops the score below DEGRADE_THRESHOLD"
        actor: system
        preconditions:
          - "Subscription.access_status == CONFIGURED"
          - "recomputed access_health_score < DEGRADE_THRESHOLD"
        side_effects:
          - "Subscription.access_status := DEGRADED"
          - "Subscription.degrade_count incremented by 1"
          - "Subscription.sla_credit_cents increased by round_half_up(Subscription.negotiated_price_cents * SLA_CREDIT_PCT_PER_EVENT / 100) when the new degrade_count <= SLA_CREDIT_MAX_EVENTS, unchanged otherwise"
          - "the sla_credit_cents change re-runs renewal_offer_price on every RenewalDecision row of this subscription whose status == VOTING, refreshing sla_credit_applied_cents and offer_price_cents"
        note: "Hops 2-4 of the reopen cascade; the credit accrual is caused by the DEGRADED entry, and the RenewalDecision refresh is caused by the credit accrual."
      - from: DEGRADED
        to: CONFIGURED
        trigger: "POST /erm/access-incidents/{id}/resolve raising access_health_score back to >= DEGRADE_THRESHOLD"
        actor: AccessEngineer
        preconditions:
          - "Subscription.access_status == DEGRADED"
          - "recomputed access_health_score >= DEGRADE_THRESHOLD"
        side_effects:
          - "Subscription.access_status := CONFIGURED"
        note: "Access-axis cycle CONFIGURED -> DEGRADED -> CONFIGURED; the boundary is >= so a recomputed score of exactly 60 restores CONFIGURED."
      - from: CONFIGURED
        to: POST_CANCELLATION
        trigger: "POST /erm/renewal-decisions/{id}/execute on a CANCEL decision when Subscription.perpetual_access_mode != NONE"
        actor: ConsortiumAdmin
        preconditions:
          - "Subscription.access_status IN {CONFIGURED, DEGRADED}"
          - "Subscription.perpetual_access_mode IN {POST_CANCELLATION_SUBSET, FULL_ARCHIVE}"
        side_effects:
          - "Subscription.access_status := POST_CANCELLATION"
      - from: CONFIGURED
        to: SUSPENDED
        trigger: "POST /erm/renewal-decisions/{id}/execute on a CANCEL decision when Subscription.perpetual_access_mode == NONE"
        actor: ConsortiumAdmin
        preconditions:
          - "Subscription.access_status IN {CONFIGURED, DEGRADED, UNCONFIGURED}"
          - "Subscription.perpetual_access_mode == NONE"
        side_effects:
          - "Subscription.access_status := SUSPENDED"

  - entity: Commitment
    initial_state: PLEDGED
    terminal_states: [WITHDRAWN, RELEASED]
    transitions:
      - from: PLEDGED
        to: CONFIRMED
        trigger: "system: hop 2 of the signing cascade (POST /erm/negotiations/{id}/sign)"
        actor: system
        preconditions:
          - "Commitment.status == PLEDGED"
          - "Commitment.product_id == the signed Negotiation.product_id"
        side_effects:
          - "Commitment.subscription_id := the new Subscription.id"
          - "Commitment.tier_price_cents := member_tier_price_cents under the settled_invoice variant"
          - "Commitment.status := CONFIRMED"
          - "Member.annual_committed_cents of Commitment.member_id increased by Commitment.tier_price_cents"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /erm/commitments/{id}/withdraw"
        actor: MemberLibrarian
        preconditions:
          - "Commitment.status == PLEDGED"
          - "Commitment.member_id == X-User-ID of the acting MemberLibrarian"
        side_effects:
          - "Commitment.status := WITHDRAWN"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /erm/commitments/{id}/withdraw"
        actor: MemberLibrarian
        preconditions:
          - "Commitment.status == CONFIRMED"
          - "Commitment.member_id == X-User-ID of the acting MemberLibrarian"
          - "Subscription.contract_status of Commitment.subscription_id IN {PENDING_ACTIVATION, ACTIVE}"
        side_effects:
          - "Member.annual_committed_cents of Commitment.member_id decreased by Commitment.tier_price_cents (compensating action of the confirm hop)"
          - "Member.standing := IN_GOOD_STANDING when annual_committed_cents <= budget_ceiling_cents after the decrement"
          - "Commitment.tier_price_cents := null"
          - "Commitment.status := WITHDRAWN"
        note: "Conserved quantity: after withdraw, sum over Members of annual_committed_cents equals sum of tier_price_cents over Commitment rows with status == CONFIRMED."
      - from: CONFIRMED
        to: RELEASED
        trigger: "system: cancellation execution on the commitment's subscription"
        actor: system
        preconditions:
          - "Commitment.status == CONFIRMED"
          - "Subscription.contract_status transitioned NOTICE_GIVEN -> CANCELLED"
        side_effects:
          - "Member.annual_committed_cents of Commitment.member_id decreased by Commitment.tier_price_cents"
          - "Commitment.status := RELEASED"

  - entity: AuthConfig
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /erm/auth-configs/{id}/verify with probe_result == PASS"
        actor: AccessEngineer
        preconditions:
          - "AuthConfig.verification_status == PENDING"
          - "Subscription.contract_status of AuthConfig.subscription_id == ACTIVE"
        side_effects:
          - "AuthConfig.verification_status := VERIFIED; AuthConfig.last_probe_result := PASS"
          - "Subscription.access_status := CONFIGURED and Subscription.access_health_score := 100"
      - from: PENDING
        to: FAILED
        trigger: "POST /erm/auth-configs/{id}/verify with probe_result IN {FAIL_OFF_CAMPUS, FAIL_ON_CAMPUS}"
        actor: AccessEngineer
        preconditions:
          - "AuthConfig.verification_status == PENDING"
          - "Subscription.contract_status of AuthConfig.subscription_id == ACTIVE"
        side_effects:
          - "AuthConfig.verification_status := FAILED; AuthConfig.last_probe_result := the reported probe_result"
          - "Subscription.access_status unchanged (stays UNCONFIGURED)"
      - from: FAILED
        to: VERIFIED
        trigger: "POST /erm/auth-configs/{id}/verify with probe_result == PASS"
        actor: AccessEngineer
        preconditions:
          - "AuthConfig.verification_status == FAILED"
          - "Subscription.contract_status of AuthConfig.subscription_id == ACTIVE"
        side_effects:
          - "AuthConfig.verification_status := VERIFIED; AuthConfig.last_probe_result := PASS"
          - "Subscription.access_status := CONFIGURED and Subscription.access_health_score := 100"

  - entity: AccessIncident
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: DIAGNOSED
        trigger: "POST /erm/access-incidents/{id}/diagnose"
        actor: AccessEngineer
        preconditions:
          - "AccessIncident.status == OPEN"
        side_effects:
          - "AccessIncident.root_cause_code := root_cause_code from the request"
          - "AccessIncident.status := DIAGNOSED"
      - from: DIAGNOSED
        to: RESOLVED
        trigger: "POST /erm/access-incidents/{id}/resolve"
        actor: AccessEngineer
        preconditions:
          - "AccessIncident.status == DIAGNOSED"
        side_effects:
          - "AccessIncident.remedy_code := remedy_code from the request"
          - "AccessIncident.status := RESOLVED"
          - "Subscription.access_health_score recomputed (the RESOLVE_RECOVERY credit is added), which may transition the access axis DEGRADED -> CONFIGURED"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /erm/access-incidents/{id}/reopen"
        actor: MemberLibrarian
        preconditions:
          - "AccessIncident.status == RESOLVED"
          - "AccessIncident.member_id == X-User-ID of the acting MemberLibrarian"
        side_effects:
          - "hop 1: AccessIncident.reopen_count incremented by 1; AccessIncident.status := REOPENED; AccessIncident.remedy_code := null"
          - "hop 2: Subscription.access_health_score recomputed, which transitions the access axis CONFIGURED -> DEGRADED when the recomputed score < DEGRADE_THRESHOLD"
          - "hop 3: the DEGRADED entry accrues Subscription.sla_credit_cents"
          - "hop 4: the sla_credit_cents change refreshes sla_credit_applied_cents and offer_price_cents on every RenewalDecision of this subscription whose status == VOTING"
        note: "Cascade of depth 4 originating from a reopen; distinct from the signing cascade in both trigger and propagation path."
      - from: REOPENED
        to: DIAGNOSED
        trigger: "POST /erm/access-incidents/{id}/diagnose"
        actor: AccessEngineer
        preconditions:
          - "AccessIncident.status == REOPENED"
        side_effects:
          - "AccessIncident.root_cause_code := root_cause_code from the request"
          - "AccessIncident.status := DIAGNOSED"
        note: "Closes the incident cycle RESOLVED -> REOPENED -> DIAGNOSED -> RESOLVED."

  - entity: RenewalDecision
    initial_state: DRAFT
    terminal_states: [EXECUTED, REVERTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VOTING
        trigger: "POST /erm/renewal-decisions/{id}/open-vote"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == DRAFT"
          - "Subscription.contract_status of RenewalDecision.subscription_id == ACTIVE"
          - "at least one Commitment row with status == CONFIRMED exists on the subscription"
        side_effects:
          - "RenewalDecision.status := VOTING"
          - "RenewalDecision.cost_per_use_cents, cost_per_use_band, capped_increase_pct, loyalty_credit_cents, sla_credit_applied_cents and offer_price_cents computed as a preliminary offer via renewal_offer_price"
      - from: VOTING
        to: DECIDED_RENEW
        trigger: "POST /erm/renewal-decisions/{id}/decide with resolved_action == RENEW"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == VOTING"
          - "RenewalDecision.quorum_met == true"
          - "RenewalDecision.vendor_requested_increase_pct <= Product.inflation_cap_pct OR accept_capped_offer == true on the request"
        side_effects:
          - "RenewalDecision.resolved_action := RENEW"
          - "renewal_offer_price re-run so capped_increase_pct, cost_per_use_cents, cost_per_use_band, loyalty_credit_cents, sla_credit_applied_cents and offer_price_cents hold their final values"
          - "RenewalDecision.status := DECIDED_RENEW"
        note: "Fork branch 1 of 3; the three decide branches share a trigger and diverge in both preconditions and execution side effects."
      - from: VOTING
        to: DECIDED_CANCEL
        trigger: "POST /erm/renewal-decisions/{id}/decide with resolved_action == CANCEL"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == VOTING"
          - "RenewalDecision.quorum_met == true"
        side_effects:
          - "RenewalDecision.resolved_action := CANCEL"
          - "RenewalDecision.status := DECIDED_CANCEL"
          - "Subscription.contract_status := NOTICE_GIVEN"
      - from: VOTING
        to: DECIDED_RESTRUCTURE
        trigger: "POST /erm/renewal-decisions/{id}/decide with resolved_action == RESTRUCTURE"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == VOTING"
          - "RenewalDecision.quorum_met == true"
          - "RenewalDecision.titles_out and RenewalDecision.titles_in are both non-empty and share no title identifier"
          - "delta_price_cents is present on the request"
        side_effects:
          - "RenewalDecision.resolved_action := RESTRUCTURE"
          - "RenewalDecision.delta_price_cents := delta_price_cents from the request"
          - "RenewalDecision.status := DECIDED_RESTRUCTURE"
      - from: DECIDED_RENEW
        to: EXECUTED
        trigger: "POST /erm/renewal-decisions/{id}/execute"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == DECIDED_RENEW"
          - "Subscription.contract_status == ACTIVE"
        side_effects:
          - "RenewalDecision.status := EXECUTED"
          - "the Subscription ACTIVE -> ACTIVE renewal self-loop side effects run (price, term roll, credit reset, commitment re-pricing)"
      - from: DECIDED_CANCEL
        to: EXECUTED
        trigger: "POST /erm/renewal-decisions/{id}/execute"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == DECIDED_CANCEL"
          - "Subscription.contract_status == NOTICE_GIVEN"
          - "an ArchivalDepositCheck row on the subscription has status == VERIFIED"
          - "logical clock calendar date <= Subscription.notice_deadline_date"
        side_effects:
          - "RenewalDecision.status := EXECUTED"
          - "the Subscription NOTICE_GIVEN -> CANCELLED side effects run (access axis write, commitment release, member ledger decrements)"
      - from: DECIDED_RESTRUCTURE
        to: EXECUTED
        trigger: "POST /erm/renewal-decisions/{id}/execute"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == DECIDED_RESTRUCTURE"
          - "Subscription.contract_status == ACTIVE"
          - "Subscription.access_status == CONFIGURED"
        side_effects:
          - "RenewalDecision.status := EXECUTED"
          - "Subscription.entitled_title_count := entitled_title_count - length(titles_out) + length(titles_in)"
          - "Subscription.negotiated_price_cents := negotiated_price_cents + RenewalDecision.delta_price_cents"
          - "every Commitment row on the subscription with status == CONFIRMED is re-priced with member_tier_price_cents under the settled_invoice variant and Member.annual_committed_cents adjusted by the delta"
      - from: EXECUTED
        to: REVERTED
        trigger: "POST /erm/renewal-decisions/{id}/revert-restructure"
        actor: ConsortiumAdmin
        preconditions:
          - "RenewalDecision.status == EXECUTED"
          - "RenewalDecision.resolved_action == RESTRUCTURE"
          - "Subscription.contract_status == ACTIVE"
        side_effects:
          - "Subscription.entitled_title_count := entitled_title_count + length(titles_out) - length(titles_in)"
          - "Subscription.negotiated_price_cents := negotiated_price_cents - RenewalDecision.delta_price_cents"
          - "every Commitment row with status == CONFIRMED is re-priced with member_tier_price_cents under the settled_invoice variant and Member.annual_committed_cents adjusted by the delta"
          - "RenewalDecision.status := REVERTED"
        note: "Compensating action of the RESTRUCTURE execution; conserved quantity is the entitled title count."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer RenewalDecision was created on the same subscription"
        actor: system
        preconditions:
          - "RenewalDecision.status IN {DRAFT, VOTING}"
        side_effects:
          - "RenewalDecision.status := SUPERSEDED"
      - from: VOTING
        to: SUPERSEDED
        trigger: "system: a newer RenewalDecision was created on the same subscription"
        actor: system
        preconditions:
          - "RenewalDecision.status == VOTING"
        side_effects:
          - "RenewalDecision.status := SUPERSEDED"

  - entity: ArchivalDepositCheck
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /erm/archival-checks/{id}/attest"
        actor: VendorRep
        preconditions:
          - "ArchivalDepositCheck.status == PENDING"
          - "X-User-ID of the acting VendorRep == Vendor.id of the subscription's product"
        side_effects:
          - "ArchivalDepositCheck.attested_title_count := attested_title_count from the request"
          - "ArchivalDepositCheck.status := ATTESTED"
      - from: ATTESTED
        to: VERIFIED
        trigger: "POST /erm/archival-checks/{id}/verify"
        actor: ConsortiumAdmin
        preconditions:
          - "ArchivalDepositCheck.status == ATTESTED"
          - "archival_coverage_pct >= ARCHIVAL_COVERAGE_THRESHOLD_PCT"
        side_effects:
          - "ArchivalDepositCheck.coverage_pct := archival_coverage_pct output"
          - "ArchivalDepositCheck.status := VERIFIED"
      - from: ATTESTED
        to: FAILED
        trigger: "POST /erm/archival-checks/{id}/verify"
        actor: ConsortiumAdmin
        preconditions:
          - "ArchivalDepositCheck.status == ATTESTED"
          - "archival_coverage_pct < ARCHIVAL_COVERAGE_THRESHOLD_PCT"
        side_effects:
          - "ArchivalDepositCheck.coverage_pct := archival_coverage_pct output"
          - "ArchivalDepositCheck.status := FAILED"
      - from: FAILED
        to: ATTESTED
        trigger: "POST /erm/archival-checks/{id}/attest"
        actor: VendorRep
        preconditions:
          - "ArchivalDepositCheck.status == FAILED"
          - "X-User-ID of the acting VendorRep == Vendor.id of the subscription's product"
        side_effects:
          - "ArchivalDepositCheck.attested_title_count := attested_title_count from the request"
          - "ArchivalDepositCheck.coverage_pct := null"
          - "ArchivalDepositCheck.status := ATTESTED"
        note: "Re-attestation cycle FAILED -> ATTESTED -> VERIFIED."

concurrency_rules:
  - rule_id: renewal-decision-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /erm/subscriptions/{id}/renewal-decisions"
    occ_field: "expected_subscription_version"
    description: |
      Creating a RenewalDecision against a Subscription whose version has advanced
      since the client last observed it is rejected. A newly created decision
      legitimately supersedes any DRAFT or VOTING decision on the same subscription,
      so the operation would otherwise succeed on a stale view and silently discard
      the offer figures another writer already put to the member vote.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
  - rule_id: archival-check-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /erm/subscriptions/{id}/archival-checks"
    occ_field: "expected_subscription_version"
    description: |
      Creating an ArchivalDepositCheck against a Subscription whose version has
      advanced since the client last observed it is rejected. A new check
      legitimately supersedes the evidentiary value of an earlier FAILED check for
      the cancellation gate, so a stale view would let the collections office record
      coverage against an entitled_title_count that has already been restructured.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

calculations:
  - name: trial_endorsement_score
    trigger: "POST /erm/trials/{id}/close (provisional_at_close variant, writes Trial.provisional_score) and POST /erm/trials/{id}/evaluate (final_at_evaluation variant, writes Trial.final_score and Trial.quorum_penalty_applied)"
    algorithm: weighted_scoring
    formula: |
      # Iterate criteria in the exact order of the Trial.criteria input array.
      for c in Trial.criteria:
          rows_c = [f for f in FeedbackEntry
                    if f.trial_id == Trial.id
                    and f.criterion_code == c.code
                    and f.submitted_during_status in INCLUDED_STATUSES]   # variant-controlled
          if len(rows_c) == 0:
              criterion_avg[c.code] = 0.00
          else:
              num = sum(STAKEHOLDER_WEIGHTS[f.stakeholder_group] * f.score for f in rows_c)
              den = sum(STAKEHOLDER_WEIGHTS[f.stakeholder_group] for f in rows_c)
              criterion_avg[c.code] = round_half_up(num / den, 2)      # PINNED: round per criterion first
      raw = sum(criterion_avg[c.code] * c.weight_pct / 100 for c in Trial.criteria)
      score = round_half_up(raw, 2)                                     # PINNED: then round the weighted sum
      if VARIANT == "final_at_evaluation" and Trial.distinct_stakeholder_group_count < STAKEHOLDER_QUORUM_GROUPS:
          score = round_half_up(score * QUORUM_PENALTY_FACTOR, 2)
      return score
    input_set: "FeedbackEntry rows of this trial only. provisional_at_close counts rows with submitted_during_status == ACTIVE; final_at_evaluation counts rows with submitted_during_status IN {ACTIVE, CLOSED}. Criteria with no matching row contribute a criterion average of 0.00 rather than being dropped from the weighted sum."
    constants:
      STAKEHOLDER_WEIGHTS: { FACULTY: 1.5, GRADUATE: 1.0, UNDERGRADUATE: 0.5, LIBRARIAN: 1.25 }
      ENDORSEMENT_THRESHOLD: 70.00
      QUORUM_PENALTY_FACTOR: 0.90
      STAKEHOLDER_QUORUM_GROUPS: 3
      MIN_FEEDBACK_ROWS: 3
    precision: "criterion averages and the final score both to 2 decimal places, round_half_up"
    variants:
      - name: provisional_at_close
        when: "computed by POST /erm/trials/{id}/close and stored in Trial.provisional_score"
        difference: "INCLUDED_STATUSES = {ACTIVE}; the quorum penalty is never applied."
      - name: final_at_evaluation
        when: "computed by POST /erm/trials/{id}/evaluate and stored in Trial.final_score; it alone is compared against ENDORSEMENT_THRESHOLD"
        difference: "INCLUDED_STATUSES = {ACTIVE, CLOSED}, so feedback accepted during the post-close grace period enters the score; and the QUORUM_PENALTY_FACTOR multiplies the result when fewer than STAKEHOLDER_QUORUM_GROUPS distinct stakeholder groups responded."

  - name: member_tier_price_cents
    trigger: "POST /erm/products/{id}/commitments (committed_projection variant, writes Commitment.projected_price_cents) and hop 2 of the signing cascade / renewal execution / restructure execution / restructure revert (settled_invoice variant, writes Commitment.tier_price_cents)"
    algorithm: tiered_pricing
    formula: |
      participant_count = VARIANT_PARTICIPANT_COUNT            # variant-controlled, see variants
      band = the Product.tier_bands entry with the largest min_participants <= participant_count
      fte_factor      = 0.60 if Member.fte_count < 5000
                        else 0.85 if Member.fte_count < 20000
                        else 1.15
      carnegie_factor = CARNEGIE_FACTORS[Member.carnegie_class]
      gross_cents     = Product.base_list_price_cents * fte_factor * carnegie_factor
                        * (1 - band.discount_pct / 100)
      ceiling_cents   = round_half_up(Product.base_list_price_cents * MAX_MEMBER_SHARE_PCT / 100)
      price_cents     = max(MIN_MEMBER_PRICE_CENTS,
                            min(round_half_up(gross_cents), ceiling_cents))
      return price_cents
    input_set: "One Member row and one Product row; the participant count is drawn from Commitment rows on that product with the variant's explicit status filter. Members are never excluded by standing - an OVER_COMMITTED member's confirmed commitment still prices and still counts as a participant."
    constants:
      CARNEGIE_FACTORS: { R1: 1.10, R2: 1.00, MASTERS: 0.85, BACCALAUREATE: 0.75 }
      FTE_BAND_SMALL_MAX: 5000
      FTE_BAND_MEDIUM_MAX: 20000
      FTE_FACTORS: { SMALL: 0.60, MEDIUM: 0.85, LARGE: 1.15 }
      MIN_MEMBER_PRICE_CENTS: 150000
      MAX_MEMBER_SHARE_PCT: 60
    precision: "whole cents; round_half_up is applied to gross_cents and to the ceiling before the min/max clamp, never after"
    variants:
      - name: committed_projection
        when: "a member pledges via POST /erm/products/{id}/commitments"
        difference: "VARIANT_PARTICIPANT_COUNT = count of Commitment rows on the product with status IN {PLEDGED, CONFIRMED}, including the row being created. Early pledgers therefore see a smaller participant count, land in a lower tier_bands band and get a higher projected_price_cents."
      - name: settled_invoice
        when: "hop 2 of the signing cascade, and again on renewal / restructure / restructure-revert execution"
        difference: "VARIANT_PARTICIPANT_COUNT = count of Commitment rows on the product with status == CONFIRMED evaluated after the whole confirmation hop has run, so every co-participant counts. The same Member and Product therefore yield a different price than committed_projection whenever the two counts fall in different tier_bands bands."

  - name: consortium_invoice_allocation
    trigger: "GET /erm/subscriptions/{id}/invoice-allocation"
    algorithm: waterfall_allocation
    formula: |
      lines_src = [c for c in Commitment
                   if c.subscription_id == Subscription.id and c.status == "CONFIRMED"]
      lines_src = sort(lines_src, key = Member.created_at ASC, then Commitment.created_at ASC)
      total = Subscription.negotiated_price_cents
      W     = sum(Member(c.member_id).fte_count for c in lines_src)
      # PINNED ORDER: round each line to whole cents FIRST, then reconcile the residual.
      # Summing the exact shares and rounding the sum is explicitly forbidden - it
      # produces a different cent distribution.
      for c in lines_src:
          raw[c]  = total * Member(c.member_id).fte_count / W       # exact rational, unrounded
          line[c] = round_half_up(raw[c], 0)
      residual = total - sum(line[c] for c in lines_src)
      winner = the line with the largest fractional part of raw[c]
               (frac = raw[c] - floor(raw[c]));
               tie-break Member.created_at ASC, then Commitment.created_at ASC
      line[winner] = line[winner] + residual                        # residual may be negative
      return { total_cents: total, lines: [{ commitment_id, member_id, allocated_cents: line[c],
               fte_weight }], residual_cents: residual,
               residual_assigned_commitment_id: winner.id }
    input_set: "Commitment rows with status == CONFIRMED on this subscription only; PLEDGED, WITHDRAWN and RELEASED rows are excluded from both the numerator and the FTE denominator W."
    constants:
      ROUNDING_ORDER: "per_line_then_reconcile"
    precision: "whole cents per line; the allocated cents of all lines sum exactly to Subscription.negotiated_price_cents"

  - name: renewal_offer_price
    trigger: "POST /erm/renewal-decisions/{id}/open-vote (preliminary), POST /erm/renewal-decisions/{id}/decide (final), and the hop-4 refresh of the reopen cascade for decisions with status == VOTING"
    algorithm: constraint_propagation
    formula: |
      # The dependency LOOKS circular: the offer depends on a loyalty credit that is
      # keyed on a cost-per-use band, and cost-per-use is a price divided by usage.
      # EVALUATION ORDER IS PINNED to break it - the band is always keyed on the
      # PRIOR term price, never on the offer being computed. Re-deriving the band
      # from offer_price_cents is explicitly forbidden.
      step_1: prior_price = Subscription.negotiated_price_cents      # running term price
      step_2: usage_count, cost_per_use_cents = cost_per_use_cents(subscription,
                  settled_invoice_total_cents = prior_price)
      step_3: band = "NO_USE"    if usage_count == 0
                     "EXCELLENT" if cost_per_use_cents < CPU_EXCELLENT_MAX_CENTS
                     "GOOD"      if CPU_EXCELLENT_MAX_CENTS <= cost_per_use_cents < CPU_GOOD_MAX_CENTS
                     "POOR"      otherwise
      step_4: capped_increase_pct = min(RenewalDecision.vendor_requested_increase_pct,
                                        Product.inflation_cap_pct)
      step_5: escalated_cents = round_half_up(prior_price * (1 + capped_increase_pct / 100))
      step_6: loyalty_credit_cents = round_half_up(prior_price
                                     * LOYALTY_CREDIT_PCT[band] / 100)
      step_7: sla_credit_applied_cents = Subscription.sla_credit_cents
      step_8: floor_cents = round_half_up(prior_price * OFFER_FLOOR_PCT / 100)
      step_9: offer_price_cents = max(floor_cents,
                  escalated_cents - loyalty_credit_cents - sla_credit_applied_cents)
      return { capped_increase_pct, cost_per_use_cents, cost_per_use_band: band,
               loyalty_credit_cents, sla_credit_applied_cents, offer_price_cents }
    input_set: "The subscription's running-term price, its accrued sla_credit_cents, the product's inflation_cap_pct, and UsageReport rows inside the running-term window defined by cost_per_use_cents."
    constants:
      CPU_EXCELLENT_MAX_CENTS: 500
      CPU_GOOD_MAX_CENTS: 1500
      LOYALTY_CREDIT_PCT: { EXCELLENT: 0, GOOD: 2, POOR: 5, NO_USE: 0 }
      OFFER_FLOOR_PCT: 50
    precision: "whole cents; round_half_up applied at step_5, step_6 and step_8 independently, never to an intermediate sum"

  - name: cost_per_use_cents
    trigger: "GET /erm/subscriptions/{id}/cost-per-use, and step_2 of renewal_offer_price"
    algorithm: aggregation
    formula: |
      window_start_month = the YYYY-MM prefix of Subscription.term_start
      window_end_month   = as_of_month when the request supplies it,
                           otherwise the YYYY-MM prefix of the logical clock date
      rows = [u for u in UsageReport
              if u.subscription_id == Subscription.id
              and window_start_month <= u.period_month <= window_end_month]   # inclusive both ends
      usage_count = sum(u.full_text_requests for u in rows)     # all members pooled
      if usage_count == 0:
          return { usage_count: 0, cost_per_use_cents: null, band: "NO_USE",
                   settled_invoice_total_cents: Subscription.negotiated_price_cents }
      cpu = round_half_up(settled_invoice_total_cents / usage_count)
      return { usage_count, cost_per_use_cents: cpu, band: band_of(cpu),
               settled_invoice_total_cents }
    input_set: "UsageReport rows of this subscription whose period_month lies in the closed month interval [term_start month, as_of_month or clock month]. Reports for months outside the window are excluded even when they belong to the same subscription. Rows contribute regardless of which member filed them."
    constants:
      MONTH_WINDOW_BOUNDS: "inclusive_both_ends"
    precision: "whole cents, round_half_up; the zero-usage case returns null rather than raising a division error"

  - name: access_health_score
    trigger: "POST /erm/subscriptions/{id}/access-incidents, POST /erm/access-incidents/{id}/reopen, POST /erm/access-incidents/{id}/resolve, and POST /erm/auth-configs/{id}/verify with probe_result == PASS (which resets it to 100)"
    algorithm: decay_function
    formula: |
      penalty = 0
      for i in [AccessIncident rows with subscription_id == Subscription.id]:
          penalty += PENALTY_OFF_CAMPUS if i.off_campus else PENALTY_ON_CAMPUS
          penalty += REOPEN_PENALTY * i.reopen_count
          if i.status == "RESOLVED":
              penalty -= RESOLVE_RECOVERY
      score = min(SCORE_CEILING, max(SCORE_FLOOR, 100 - penalty))
      return score
    input_set: "Every AccessIncident row on the subscription regardless of status; a RESOLVED row keeps its base penalty and earns back RESOLVE_RECOVERY, a REOPENED row loses that recovery again and additionally carries REOPEN_PENALTY per reopen. A verify PASS resets the score to 100 and future incidents decay from there."
    constants:
      PENALTY_OFF_CAMPUS: 8
      PENALTY_ON_CAMPUS: 4
      REOPEN_PENALTY: 15
      RESOLVE_RECOVERY: 5
      DEGRADE_THRESHOLD: 60
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      SLA_CREDIT_PCT_PER_EVENT: 2
      SLA_CREDIT_MAX_EVENTS: 3
    precision: "integer score; the DEGRADED comparison is strict (< 60 degrades) and the recovery comparison is inclusive (>= 60 restores CONFIGURED)"

  - name: archival_coverage_pct
    trigger: "POST /erm/archival-checks/{id}/verify"
    algorithm: threshold
    formula: |
      coverage_pct = round_half_up(ArchivalDepositCheck.attested_title_count
                                   / Subscription.entitled_title_count * 100, 2)
      status = "VERIFIED" if coverage_pct >= ARCHIVAL_COVERAGE_THRESHOLD_PCT else "FAILED"
      return { coverage_pct, status }
    input_set: "The single ArchivalDepositCheck row being verified plus the current Subscription.entitled_title_count - a restructure that changed entitled_title_count therefore changes the coverage of an already-attested check."
    constants:
      ARCHIVAL_COVERAGE_THRESHOLD_PCT: 95.00
      ARCHIVAL_DISCREPANCY_TOLERANCE: 5
    precision: "2 decimal places, round_half_up; the threshold comparison is >= so exactly 95.00 verifies"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_TRIAL_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_AUTH_CONFIG_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_USAGE_REPORT_NOT_FOUND | ERR_RENEWAL_DECISION_NOT_FOUND | ERR_ARCHIVAL_CHECK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_TRIAL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /erm/products, POST /erm/products/{id}/trials, POST /erm/products/{id}/commitments, POST /erm/negotiations, POST /erm/subscriptions/{id}/access-incidents, POST /erm/subscriptions/{id}/usage-reports, POST /erm/renewal-decisions/{id}/vote"
  - priority: 5
    category: auth
    check: "entity-backed identity scope: a MemberLibrarian's X-User-ID equals the member_id the request targets; a VendorRep's X-User-ID equals the Vendor.id of the product behind the targeted resource"
    error_id: "ERR_MEMBER_SCOPE_VIOLATION | ERR_VENDOR_SCOPE_VIOLATION"
    http_status: 403
    applies_to: "all MemberLibrarian and VendorRep write endpoints"
  - priority: 6
    category: business_constraint
    check: "request shape: required body fields present; enum values inside their declared sets; integer fields non-negative; Trial.criteria weight_pct values sum to exactly 100 with unique codes; period_month matches YYYY-MM; ip_ranges non-empty; proxy_prefix present when auth_method == EZPROXY"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "expected_subscription_version equals the current Subscription.version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /erm/subscriptions/{id}/renewal-decisions, POST /erm/subscriptions/{id}/archival-checks"
  - priority: 8
    category: state
    check: "the target row is in a state from which the requested transition exists per the state machine table"
    error_id: "ERR_TRIAL_INVALID_STATE | ERR_NEGOTIATION_INVALID_STATE | ERR_COMMITMENT_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_RENEWAL_INVALID_STATE | ERR_ARCHIVAL_CHECK_INVALID_STATE | ERR_SUBSCRIPTION_CONTRACT_INVALID_STATE | ERR_SUBSCRIPTION_ACCESS_INVALID_STATE | ERR_AUTH_CONFIG_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "Member.standing of the acting member is IN_GOOD_STANDING"
    error_id: ERR_MEMBER_OVER_COMMITTED
    http_status: 409
    applies_to: "POST /erm/products/{id}/commitments, POST /erm/products/{id}/trials, POST /erm/trials/{id}/open"
  - priority: 10
    category: business_safety
    check: "signing requires Negotiation.granted_accessibility_conformance != NONE and Vendor.vpat_on_file == true for the product's vendor"
    error_id: ERR_ACCESSIBILITY_TERM_MISSING
    http_status: 422
    applies_to: "POST /erm/negotiations/{id}/sign"
  - priority: 11
    category: business_safety
    check: "segregation of duties: the signer's X-User-ID differs from Negotiation.last_submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /erm/negotiations/{id}/sign"
  - priority: 12
    category: business_safety
    check: "a vendor response never grants a term stronger than the product offers: granted_ill_mode <= Product.ill_mode_offered on PROHIBITED < PRINT_ONLY < SECURE_ELECTRONIC, granted_perpetual_access <= Product.perpetual_access_mode_offered on NONE < POST_CANCELLATION_SUBSET < FULL_ARCHIVE, and granted_text_mining false whenever Product.text_mining_offered is false"
    error_id: ERR_TERM_EXCEEDS_PRODUCT_OFFER
    http_status: 422
    applies_to: "POST /erm/negotiations/{id}/vendor-response"
  - priority: 13
    category: business_referential
    check: "the Trial referenced by Negotiation.trial_id has status == ENDORSED"
    error_id: ERR_TRIAL_NOT_ENDORSED
    http_status: 409
    applies_to: "POST /erm/negotiations/{id}/sign"
  - priority: 14
    category: business_referential
    check: "at least one ArchivalDepositCheck row on the subscription has status == VERIFIED"
    error_id: ERR_ARCHIVAL_DEPOSIT_UNVERIFIED
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/execute when resolved_action == CANCEL"
  - priority: 15
    category: business_referential
    check: "ArchivalDepositCheck.agency_code equals Vendor.archival_agency_code of the subscription's product, and that vendor field is not null"
    error_id: ERR_ARCHIVAL_AGENCY_MISMATCH
    http_status: 422
    applies_to: "POST /erm/subscriptions/{id}/archival-checks"
  - priority: 16
    category: business_temporal
    check: "no existing Trial on the same (product_id, member_id) pair with status IN {DRAFT, ACTIVE, CLOSED, ENDORSED, DECLINED, WITHDRAWN} conflicts with the requested window: a conflict exists when new.start_date < existing.end_date + TRIAL_COOLDOWN_DAYS AND existing.start_date < new.end_date, with windows treated as half-open [start_date, end_date)"
    error_id: ERR_TRIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /erm/products/{id}/trials"
  - priority: 17
    category: business_temporal
    check: "the number of AuthConfig rows sharing auth_realm_code, having verification_status IN {PENDING, VERIFIED}, and whose subscription window [activation_start_date, term_end] (closed on both ends) intersects the new subscription's window, is < MAX_OVERLAPPING_REALM_BINDINGS"
    error_id: ERR_REALM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /erm/subscriptions/{id}/auth-configs"
  - priority: 18
    category: business_temporal
    check: "the logical clock calendar date is <= Subscription.notice_deadline_date"
    error_id: ERR_NOTICE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/execute when resolved_action == CANCEL"
  - priority: 19
    category: business_temporal
    check: "UsageReport.period_month lies inside the closed month interval [term_start month, term_end month] of the subscription"
    error_id: ERR_USAGE_PERIOD_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /erm/subscriptions/{id}/usage-reports"
  - priority: 20
    category: business_constraint
    check: "RenewalDecision.quorum_met == true at decide time"
    error_id: ERR_VOTE_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/decide"
  - priority: 21
    category: business_constraint
    check: "the voting member has no existing ballots entry on this decision"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/vote"
  - priority: 22
    category: business_constraint
    check: "the voting member holds a Commitment row with status == CONFIRMED on the decision's subscription"
    error_id: ERR_MEMBER_NOT_PARTICIPANT
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/vote"
  - priority: 23
    category: business_constraint
    check: "for a RESTRUCTURE decide, titles_out and titles_in are both non-empty, contain no duplicate identifiers within themselves, and share no identifier with each other; delta_price_cents is present"
    error_id: ERR_TITLE_SWAP_INVALID
    http_status: 422
    applies_to: "POST /erm/renewal-decisions/{id}/decide"
  - priority: 24
    category: business_constraint
    check: "executing a RESTRUCTURE leaves Subscription.entitled_title_count >= MIN_ENTITLED_TITLES"
    error_id: ERR_TITLE_COUNT_FLOOR_BREACHED
    http_status: 409
    applies_to: "POST /erm/renewal-decisions/{id}/execute when resolved_action == RESTRUCTURE"
  - priority: 25
    category: business_constraint
    check: "no existing UsageReport row shares the same (subscription_id, member_id, period_month) triple"
    error_id: ERR_DUPLICATE_USAGE_REPORT
    http_status: 409
    applies_to: "POST /erm/subscriptions/{id}/usage-reports"
  - priority: 26
    category: business_constraint
    check: "no existing Commitment row on the same (product_id, member_id) pair has status IN {PLEDGED, CONFIRMED}"
    error_id: ERR_DUPLICATE_COMMITMENT
    http_status: 409
    applies_to: "POST /erm/products/{id}/commitments"
  - priority: 27
    category: business_constraint
    check: "FeedbackEntry.criterion_code matches one of the codes declared in Trial.criteria"
    error_id: ERR_UNKNOWN_CRITERION
    http_status: 422
    applies_to: "POST /erm/trials/{id}/feedback"
  - priority: 28
    category: business_constraint
    check: "Trial.feedback_count >= MIN_FEEDBACK_ROWS at evaluation time"
    error_id: ERR_INSUFFICIENT_FEEDBACK
    http_status: 409
    applies_to: "POST /erm/trials/{id}/evaluate"
  - priority: 29
    category: business_constraint
    check: "abs(ArchivalDepositCheck.attested_title_count - ArchivalDepositCheck.deposited_title_count) <= ARCHIVAL_DISCREPANCY_TOLERANCE"
    error_id: ERR_ARCHIVAL_COUNT_DISCREPANCY
    http_status: 409
    applies_to: "POST /erm/archival-checks/{id}/verify"
  - priority: 30
    category: business_constraint
    check: "Negotiation.round_count < MAX_NEGOTIATION_ROUNDS"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /erm/negotiations/{id}/submit, POST /erm/negotiations/{id}/revise"
  - priority: 31
    category: business_temporal
    check: "to_iso8601 is greater than or equal to the current logical clock value"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /erm/_clock/set_current_utc"
  - priority: 32
    category: business_fiscal
    check: "Member.annual_committed_cents + the committed_projection price of the new pledge <= Member.budget_ceiling_cents"
    error_id: ERR_BUDGET_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /erm/products/{id}/commitments"
  - priority: 33
    category: business_fiscal
    check: "for a RENEW decide, either RenewalDecision.vendor_requested_increase_pct <= Product.inflation_cap_pct, or accept_capped_offer == true on the request"
    error_id: ERR_INFLATION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /erm/renewal-decisions/{id}/decide"

global_constants:
  TRIAL_COOLDOWN_DAYS: 30
  MAX_OVERLAPPING_REALM_BINDINGS: 3
  MAX_NEGOTIATION_ROUNDS: 3
  VOTE_QUORUM_PCT: 60
  MIN_ENTITLED_TITLES: 1
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

endpoints:
  - method: POST
    path: "/erm/members"
    description: "Register a consortium member library with its FTE population, Carnegie class and annual budget ceiling."
    roles: [ConsortiumAdmin]
    code: 201
    input: [name, fte_count, carnegie_class, budget_ceiling_cents]
    output: Member
    side_effects: ["Member.annual_committed_cents initialised to 0", "Member.standing initialised to IN_GOOD_STANDING"]
  - method: GET
    path: "/erm/members/{id}"
    description: "Read one member including the derived annual_committed_cents ledger and standing."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/erm/vendors"
    description: "Register a publisher or aggregator, including the preservation agency it deposits with and whether an accessibility conformance report is on file."
    roles: [ConsortiumAdmin]
    code: 201
    input: ["name", "archival_agency_code?", "vpat_on_file?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/erm/vendors/{id}"
    description: "Read one vendor."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/erm/products"
    description: "Register a licensable package with its list price, title count, inflation cap, cancellation notice period, offered ILL / text-mining / perpetual-access ceilings and the consortium tier discount schedule."
    roles: [ConsortiumAdmin]
    code: 201
    input: [vendor_id, name, base_list_price_cents, title_count, inflation_cap_pct, cancellation_notice_days, perpetual_access_mode_offered, ill_mode_offered, text_mining_offered, tier_bands]
    output: Product
    side_effects: []
  - method: GET
    path: "/erm/products/{id}"
    description: "Read one product."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/erm/products"
    description: "List products, optionally filtered by vendor; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: POST
    path: "/erm/products/{id}/trials"
    description: "Set up a trial of a package for one member library, with the evaluation criteria and their weights."
    roles: [MemberLibrarian]
    code: 201
    input: [member_id, start_date, end_date, criteria]
    output: Trial
    side_effects: ["window overlap and TRIAL_COOLDOWN_DAYS buffer check against existing trials on the same (product_id, member_id) pair", "Trial.status initialised to DRAFT"]
  - method: GET
    path: "/erm/trials/{id}"
    description: "Read one trial including provisional_score, final_score and the feedback counters."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: []
    output: Trial
    side_effects: []
  - method: GET
    path: "/erm/trials"
    description: "List trials, optionally filtered by product, member or status; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator]
    code: 200
    input: ["product_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Trial[]
    side_effects: []
  - method: POST
    path: "/erm/trials/{id}/open"
    description: "Open a DRAFT trial for stakeholder use."
    roles: [MemberLibrarian]
    code: 200
    input: []
    output: Trial
    side_effects: ["Trial.status DRAFT -> ACTIVE"]
  - method: POST
    path: "/erm/trials/{id}/close"
    description: "Close an ACTIVE trial and stamp the provisional endorsement score."
    roles: [MemberLibrarian]
    code: 200
    input: []
    output: Trial
    side_effects: ["Trial.provisional_score := trial_endorsement_score (provisional_at_close)", "Trial.status ACTIVE -> CLOSED"]
  - method: POST
    path: "/erm/trials/{id}/evaluate"
    description: "Evaluate a CLOSED trial: compute the final endorsement score including post-close feedback and the quorum penalty, then fork to ENDORSED or DECLINED."
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: Trial
    side_effects: ["Trial.final_score := trial_endorsement_score (final_at_evaluation)", "Trial.quorum_penalty_applied set", "Trial.status CLOSED -> ENDORSED when final_score >= ENDORSEMENT_THRESHOLD, otherwise CLOSED -> DECLINED"]
  - method: POST
    path: "/erm/trials/{id}/feedback"
    description: "Submit one stakeholder score against one evaluation criterion of the trial. Accepted while the trial is ACTIVE or CLOSED; the observed status is stamped on the row and decides which score variant counts it."
    roles: [MemberLibrarian]
    code: 201
    input: ["stakeholder_group", "criterion_code", "score", "comment?"]
    output: FeedbackEntry
    side_effects: ["FeedbackEntry.submitted_during_status := the trial's status at acceptance", "Trial.feedback_count and Trial.distinct_stakeholder_group_count refreshed"]
  - method: GET
    path: "/erm/trials/{id}/feedback"
    description: "List the feedback rows of one trial; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedbackEntry[]
    side_effects: []
  - method: POST
    path: "/erm/negotiations"
    description: "Open a license negotiation for a package, anchored on the trial whose endorsement will gate signing, with the requested ILL, text-mining, accessibility and perpetual-access terms."
    roles: [ConsortiumAdmin]
    code: 201
    input: [product_id, trial_id, target_term_start, target_term_end, requested_ill_mode, requested_text_mining, requested_accessibility_conformance, requested_perpetual_access]
    output: Negotiation
    side_effects: ["Negotiation.status initialised to DRAFTING", "Negotiation.round_count initialised to 0"]
  - method: GET
    path: "/erm/negotiations/{id}"
    description: "Read one negotiation including round_count, granted_* terms and the signer-segregation audit field."
    roles: [ConsortiumAdmin, LicenseNegotiator, VendorRep]
    code: 200
    input: []
    output: Negotiation
    side_effects: []
  - method: GET
    path: "/erm/negotiations"
    description: "List negotiations, optionally filtered by product, trial or status; paginated."
    roles: [ConsortiumAdmin, LicenseNegotiator, VendorRep]
    code: 200
    input: ["product_id?", "trial_id?", "status?", "limit?", "offset?"]
    output: Negotiation[]
    side_effects: []
  - method: POST
    path: "/erm/negotiations/{id}/submit"
    description: "Send the current draft terms to the vendor for review; records the submitting negotiator for the segregation-of-duties check at signing."
    roles: [LicenseNegotiator]
    code: 200
    input: []
    output: Negotiation
    side_effects: ["Negotiation.round_count incremented by 1", "Negotiation.last_submitted_by_user_id := acting X-User-ID", "Negotiation.status DRAFTING -> VENDOR_REVIEW"]
  - method: POST
    path: "/erm/negotiations/{id}/vendor-response"
    description: "Vendor answers the round: disposition ACCEPT locks agreed_price_cents and moves to AGREED; disposition COUNTER records counter_price_cents and moves to COUNTERED."
    roles: [VendorRep]
    code: 200
    input: ["disposition", "granted_ill_mode", "granted_text_mining", "granted_accessibility_conformance", "granted_perpetual_access", "accepted_price_cents?", "counter_price_cents?"]
    output: Negotiation
    side_effects: ["Negotiation.granted_* fields written", "Negotiation.last_vendor_disposition written", "Negotiation.status VENDOR_REVIEW -> AGREED or VENDOR_REVIEW -> COUNTERED"]
  - method: POST
    path: "/erm/negotiations/{id}/revise"
    description: "Revise the consortium's requested terms after a counter and return the negotiation to DRAFTING, closing one negotiation cycle."
    roles: [LicenseNegotiator]
    code: 200
    input: [requested_ill_mode, requested_text_mining, requested_accessibility_conformance, requested_perpetual_access]
    output: Negotiation
    side_effects: ["Negotiation.requested_* fields replaced", "Negotiation.status COUNTERED -> DRAFTING"]
  - method: POST
    path: "/erm/negotiations/{id}/sign"
    description: "Sign an AGREED negotiation. Creates the Subscription and drives the four-hop confirmation cascade (Subscription -> Commitment -> Member -> Trial)."
    roles: [ConsortiumAdmin]
    code: 201
    input: [activation_start_date]
    output: Subscription
    side_effects: ["Negotiation.status AGREED -> SIGNED", "Subscription created (PENDING_ACTIVATION / UNCONFIGURED)", "every PLEDGED Commitment on the product becomes CONFIRMED and is priced with member_tier_price_cents (settled_invoice)", "Member.annual_committed_cents incremented per confirmed commitment", "Members crossing budget_ceiling_cents flip standing to OVER_COMMITTED, which withdraws their DRAFT trials"]
  - method: POST
    path: "/erm/products/{id}/commitments"
    description: "Pledge a member library's participation in a package; stamps the committed_projection price using the participant count at pledge time."
    roles: [MemberLibrarian]
    code: 201
    input: [member_id]
    output: Commitment
    side_effects: ["Commitment.projected_price_cents := member_tier_price_cents (committed_projection)", "Commitment.applied_discount_pct and participant_count_at_pricing stamped", "Commitment.status initialised to PLEDGED"]
  - method: GET
    path: "/erm/commitments/{id}"
    description: "Read one participation commitment including both the projected and settled prices."
    roles: [ConsortiumAdmin, MemberLibrarian, VendorRep]
    code: 200
    input: []
    output: Commitment
    side_effects: []
  - method: GET
    path: "/erm/commitments"
    description: "List commitments, optionally filtered by product, member, subscription or status; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, VendorRep]
    code: 200
    input: ["product_id?", "member_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: Commitment[]
    side_effects: []
  - method: POST
    path: "/erm/commitments/{id}/withdraw"
    description: "Withdraw a member's pledge or confirmed participation; the compensating action of the confirmation hop."
    roles: [MemberLibrarian]
    code: 200
    input: []
    output: Commitment
    side_effects: ["Member.annual_committed_cents decremented by Commitment.tier_price_cents when the row was CONFIRMED", "Member.standing recomputed", "Commitment.tier_price_cents := null", "Commitment.status -> WITHDRAWN"]
  - method: GET
    path: "/erm/subscriptions/{id}"
    description: "Read one subscription including both state axes, the access health score, the accrued SLA credit, the entitled title count and the notice deadline."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/erm/subscriptions"
    description: "List subscriptions, optionally filtered by product, negotiation, contract state or access state; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, LicenseNegotiator, VendorRep, AccessEngineer]
    code: 200
    input: ["product_id?", "negotiation_id?", "contract_status?", "access_status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/erm/subscriptions/{id}/cost-per-use"
    description: "Cost-per-use analysis over the running term: pooled full-text requests inside the closed month window, the settled invoice total and the resulting band. Returns a null cost_per_use_cents with band NO_USE when the pooled usage is zero."
    roles: [ConsortiumAdmin, MemberLibrarian]
    code: 200
    input: ["as_of_month?"]
    output: "{ usage_count: integer, cost_per_use_cents: integer, band: string, settled_invoice_total_cents: integer }"
    side_effects: []
  - method: GET
    path: "/erm/subscriptions/{id}/invoice-allocation"
    description: "Per-member invoice allocation of the negotiated price across CONFIRMED commitments by FTE weight, with the rounding residual assigned to a single line."
    roles: [ConsortiumAdmin, MemberLibrarian]
    code: 200
    input: []
    output: "{ total_cents: integer, lines: array, residual_cents: integer, residual_assigned_commitment_id: string }"
    side_effects: []
  - method: POST
    path: "/erm/subscriptions/{id}/auth-configs"
    description: "Configure authentication for a subscription and bind it to a shared federation realm; the realm has finite overlapping-binding capacity."
    roles: [AccessEngineer]
    code: 201
    input: ["auth_method", "auth_realm_code", "ip_ranges", "proxy_prefix?"]
    output: AuthConfig
    side_effects: ["realm overlap-capacity check against MAX_OVERLAPPING_REALM_BINDINGS", "AuthConfig.verification_status initialised to PENDING"]
  - method: GET
    path: "/erm/subscriptions/{id}/auth-configs"
    description: "List the authentication configurations of one subscription; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, AccessEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: AuthConfig[]
    side_effects: []
  - method: POST
    path: "/erm/auth-configs/{id}/verify"
    description: "Record the outcome of an on-campus / off-campus access probe. A PASS verifies the binding, flips the subscription's access axis to CONFIGURED and resets the access health score to 100."
    roles: [AccessEngineer]
    code: 200
    input: [probe_result]
    output: AuthConfig
    side_effects: ["AuthConfig.verification_status and last_probe_result written", "on PASS: Subscription.access_status := CONFIGURED and Subscription.access_health_score := 100"]
  - method: POST
    path: "/erm/subscriptions/{id}/access-incidents"
    description: "Report an off-campus or on-campus access failure; decays the subscription's access health score and can degrade the access axis."
    roles: [MemberLibrarian]
    code: 201
    input: [member_id, symptom_code, off_campus]
    output: AccessIncident
    side_effects: ["Subscription.access_health_score recomputed", "Subscription.access_status CONFIGURED -> DEGRADED when the score drops below DEGRADE_THRESHOLD, with SLA credit accrual and the VOTING renewal-offer refresh"]
  - method: GET
    path: "/erm/access-incidents/{id}"
    description: "Read one access incident including its reopen count."
    roles: [ConsortiumAdmin, MemberLibrarian, AccessEngineer]
    code: 200
    input: []
    output: AccessIncident
    side_effects: []
  - method: GET
    path: "/erm/access-incidents"
    description: "List access incidents, optionally filtered by subscription, member or status; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, AccessEngineer]
    code: 200
    input: ["subscription_id?", "member_id?", "status?", "limit?", "offset?"]
    output: AccessIncident[]
    side_effects: []
  - method: POST
    path: "/erm/access-incidents/{id}/diagnose"
    description: "Record the root cause of an OPEN or REOPENED incident."
    roles: [AccessEngineer]
    code: 200
    input: [root_cause_code]
    output: AccessIncident
    side_effects: ["AccessIncident.root_cause_code written", "AccessIncident.status -> DIAGNOSED"]
  - method: POST
    path: "/erm/access-incidents/{id}/resolve"
    description: "Record the remedy for a DIAGNOSED incident; credits the access health score and can restore the access axis to CONFIGURED."
    roles: [AccessEngineer]
    code: 200
    input: [remedy_code]
    output: AccessIncident
    side_effects: ["AccessIncident.remedy_code written", "AccessIncident.status -> RESOLVED", "Subscription.access_health_score recomputed; DEGRADED -> CONFIGURED when the score is >= DEGRADE_THRESHOLD"]
  - method: POST
    path: "/erm/access-incidents/{id}/reopen"
    description: "Reopen a RESOLVED incident because the member still cannot reach the resource off campus; origin of the four-hop access cascade."
    roles: [MemberLibrarian]
    code: 200
    input: []
    output: AccessIncident
    side_effects: ["AccessIncident.reopen_count incremented, remedy_code cleared, status -> REOPENED", "Subscription.access_health_score recomputed", "access axis CONFIGURED -> DEGRADED with SLA credit accrual", "renewal_offer_price refreshed on VOTING renewal decisions of the subscription"]
  - method: POST
    path: "/erm/subscriptions/{id}/usage-reports"
    description: "Vendor files one month of COUNTER usage for one member on this subscription."
    roles: [VendorRep]
    code: 201
    input: [member_id, period_month, full_text_requests, searches, denials]
    output: UsageReport
    side_effects: ["duplicate (subscription_id, member_id, period_month) rejected", "the row enters the cost_per_use_cents aggregation window when its period_month is inside it"]
  - method: GET
    path: "/erm/usage-reports/{id}"
    description: "Read one usage report."
    roles: [ConsortiumAdmin, MemberLibrarian, VendorRep]
    code: 200
    input: []
    output: UsageReport
    side_effects: []
  - method: GET
    path: "/erm/usage-reports"
    description: "List usage reports, optionally filtered by subscription, member or month; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, VendorRep]
    code: 200
    input: ["subscription_id?", "member_id?", "period_month?", "limit?", "offset?"]
    output: UsageReport[]
    side_effects: []
  - method: POST
    path: "/erm/subscriptions/{id}/renewal-decisions"
    description: "Open a renewal decision on a subscription with the recommended action and the vendor's requested increase. Requires the subscription version the client last observed; the new decision supersedes any DRAFT or VOTING decision on the same subscription."
    roles: [ConsortiumAdmin]
    code: 201
    input: ["recommended_action", "vendor_requested_increase_pct", "expected_subscription_version", "titles_out?", "titles_in?"]
    output: RenewalDecision
    side_effects: ["any existing RenewalDecision on the subscription with status IN {DRAFT, VOTING} becomes SUPERSEDED", "increments Subscription.version by 1", "RenewalDecision.status initialised to DRAFT"]
  - method: GET
    path: "/erm/subscriptions/{id}/renewal-decisions"
    description: "List the renewal decisions of one subscription, optionally filtered by status; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenewalDecision[]
    side_effects: []
  - method: POST
    path: "/erm/renewal-decisions/{id}/open-vote"
    description: "Put the decision to the participating members and stamp the preliminary renewal offer (capped increase, cost-per-use band, loyalty credit, SLA credit)."
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: ["RenewalDecision.status DRAFT -> VOTING", "renewal_offer_price computed as a preliminary offer"]
  - method: POST
    path: "/erm/renewal-decisions/{id}/vote"
    description: "A participating member casts its ballot on a VOTING decision."
    roles: [MemberLibrarian]
    code: 200
    input: [member_id, ballot]
    output: RenewalDecision
    side_effects: ["ballot appended to RenewalDecision.ballots", "yes_count and quorum_met recomputed"]
  - method: POST
    path: "/erm/renewal-decisions/{id}/decide"
    description: "Fork the decision to RENEW, CANCEL or RESTRUCTURE once quorum is met; recomputes the final offer figures and, for CANCEL, puts the subscription on notice."
    roles: [ConsortiumAdmin]
    code: 200
    input: ["resolved_action", "delta_price_cents?", "accept_capped_offer?"]
    output: RenewalDecision
    side_effects: ["RenewalDecision.resolved_action written and status -> DECIDED_RENEW | DECIDED_CANCEL | DECIDED_RESTRUCTURE", "renewal_offer_price re-run for the final figures", "on CANCEL: Subscription.contract_status ACTIVE -> NOTICE_GIVEN"]
  - method: POST
    path: "/erm/renewal-decisions/{id}/execute"
    description: "Execute the decided branch: roll the term and price forward, cancel with post-cancellation access handling, or apply the title swap."
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: ["RenewalDecision.status -> EXECUTED", "branch-specific Subscription, Commitment and Member side effects per the state machine table"]
  - method: POST
    path: "/erm/renewal-decisions/{id}/revert-restructure"
    description: "Reverse an executed package restructuring; the compensating action that must leave the entitled title count and the negotiated price exactly as they were before execution."
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: ["Subscription.entitled_title_count and negotiated_price_cents restored", "CONFIRMED commitments re-priced and member ledgers adjusted", "RenewalDecision.status EXECUTED -> REVERTED"]
  - method: POST
    path: "/erm/subscriptions/{id}/archival-checks"
    description: "Open an archival deposit verification against the preservation agency the vendor deposits with. Requires the subscription version the client last observed."
    roles: [ConsortiumAdmin]
    code: 201
    input: [agency_code, deposited_title_count, expected_subscription_version]
    output: ArchivalDepositCheck
    side_effects: ["agency_code checked against Vendor.archival_agency_code", "increments Subscription.version by 1", "ArchivalDepositCheck.status initialised to PENDING"]
  - method: GET
    path: "/erm/subscriptions/{id}/archival-checks"
    description: "List the archival deposit checks of one subscription, optionally filtered by status; paginated."
    roles: [ConsortiumAdmin, MemberLibrarian, VendorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ArchivalDepositCheck[]
    side_effects: []
  - method: POST
    path: "/erm/archival-checks/{id}/attest"
    description: "Vendor attests the number of titles it has deposited with the agency."
    roles: [VendorRep]
    code: 200
    input: [attested_title_count]
    output: ArchivalDepositCheck
    side_effects: ["ArchivalDepositCheck.attested_title_count written", "status PENDING -> ATTESTED or FAILED -> ATTESTED with coverage_pct cleared"]
  - method: POST
    path: "/erm/archival-checks/{id}/verify"
    description: "Verify the attested deposit against the current entitled title count; forks to VERIFIED or FAILED on the coverage threshold."
    roles: [ConsortiumAdmin]
    code: 200
    input: []
    output: ArchivalDepositCheck
    side_effects: ["ArchivalDepositCheck.coverage_pct := archival_coverage_pct", "status ATTESTED -> VERIFIED when coverage_pct >= ARCHIVAL_COVERAGE_THRESHOLD_PCT, otherwise ATTESTED -> FAILED"]
  - method: POST
    path: "/erm/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock activates every PENDING_ACTIVATION subscription whose activation_start_date has arrived and expires every ACTIVE subscription past its term_end, evaluated in Subscription.created_at ASC order."
    roles: [ConsortiumAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, activated_subscription_ids: array, expired_subscription_ids: array }"
    side_effects: ["Subscription.contract_status PENDING_ACTIVATION -> ACTIVE when activation_start_date <= clock date", "Subscription.contract_status ACTIVE -> EXPIRED when term_end < clock date, with the access axis written per perpetual_access_mode"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "a MemberLibrarian acts on a member_id other than its own X-User-ID"
  - id: ERR_VENDOR_SCOPE_VIOLATION
    http: 403
    condition: "a VendorRep acts on a resource whose product belongs to a different vendor than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID signing a negotiation equals Negotiation.last_submitted_by_user_id"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id in the path or body does not exist"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor_id in the path or body does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id in the path or body does not exist"
  - id: ERR_TRIAL_NOT_FOUND
    http: 404
    condition: "trial_id in the path or body does not exist"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "negotiation_id in the path does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription_id in the path does not exist"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitment_id in the path does not exist"
  - id: ERR_AUTH_CONFIG_NOT_FOUND
    http: 404
    condition: "auth_config_id in the path does not exist"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident_id in the path does not exist"
  - id: ERR_USAGE_REPORT_NOT_FOUND
    http: 404
    condition: "usage_report_id in the path does not exist"
  - id: ERR_RENEWAL_DECISION_NOT_FOUND
    http: 404
    condition: "renewal_decision_id in the path does not exist"
  - id: ERR_ARCHIVAL_CHECK_NOT_FOUND
    http: 404
    condition: "archival_check_id in the path does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required body field, enum value outside its declared set, negative integer where non-negative is required, Trial.criteria weights not summing to 100, malformed period_month, empty ip_ranges, or missing proxy_prefix for EZPROXY"
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal the current Subscription.version"
  - id: ERR_TRIAL_INVALID_STATE
    http: 409
    condition: "the trial is not in a state from which the requested trial transition exists, including feedback submission on a DRAFT or terminal trial"
  - id: ERR_NEGOTIATION_INVALID_STATE
    http: 409
    condition: "the negotiation is not in a state from which the requested negotiation transition exists"
  - id: ERR_COMMITMENT_INVALID_STATE
    http: 409
    condition: "the commitment is already WITHDRAWN or RELEASED, or its subscription's contract axis forbids withdrawal"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "the incident is not in a state from which the requested incident transition exists"
  - id: ERR_RENEWAL_INVALID_STATE
    http: 409
    condition: "the renewal decision is not in a state from which the requested decision transition exists, including reverting a non-RESTRUCTURE decision"
  - id: ERR_ARCHIVAL_CHECK_INVALID_STATE
    http: 409
    condition: "the archival check is not in a state from which the requested attest or verify transition exists"
  - id: ERR_SUBSCRIPTION_CONTRACT_INVALID_STATE
    http: 409
    condition: "the subscription's contract axis forbids the operation (for example configuring authentication or executing a renewal on a non-ACTIVE contract)"
  - id: ERR_SUBSCRIPTION_ACCESS_INVALID_STATE
    http: 409
    condition: "the subscription's access axis forbids the operation (for example executing a restructure while access_status != CONFIGURED)"
  - id: ERR_AUTH_CONFIG_INVALID_STATE
    http: 409
    condition: "the authentication binding is already VERIFIED and cannot be re-probed"
  - id: ERR_MEMBER_OVER_COMMITTED
    http: 409
    condition: "the acting member's standing is OVER_COMMITTED"
  - id: ERR_ACCESSIBILITY_TERM_MISSING
    http: 422
    condition: "signing a negotiation whose granted_accessibility_conformance is NONE, or whose vendor has no accessibility conformance report on file"
  - id: ERR_TERM_EXCEEDS_PRODUCT_OFFER
    http: 422
    condition: "a vendor response grants an ILL, text-mining or perpetual-access term stronger than the product offers"
  - id: ERR_TRIAL_NOT_ENDORSED
    http: 409
    condition: "signing a negotiation whose trial is not ENDORSED"
  - id: ERR_ARCHIVAL_DEPOSIT_UNVERIFIED
    http: 409
    condition: "executing a CANCEL decision with no VERIFIED archival deposit check on the subscription"
  - id: ERR_ARCHIVAL_AGENCY_MISMATCH
    http: 422
    condition: "the archival check's agency_code differs from the vendor's archival_agency_code, or the vendor deposits with no agency"
  - id: ERR_TRIAL_WINDOW_CONFLICT
    http: 409
    condition: "the requested trial window overlaps, or falls inside the cooldown buffer after, an existing trial on the same product and member"
  - id: ERR_REALM_CAPACITY_EXCEEDED
    http: 409
    condition: "the federation realm already holds MAX_OVERLAPPING_REALM_BINDINGS bindings whose subscription windows intersect the new one"
  - id: ERR_NOTICE_DEADLINE_PASSED
    http: 409
    condition: "executing a CANCEL decision after the subscription's notice_deadline_date"
  - id: ERR_USAGE_PERIOD_OUT_OF_TERM
    http: 422
    condition: "the usage report's period_month falls outside the subscription's term months"
  - id: ERR_VOTE_QUORUM_NOT_MET
    http: 409
    condition: "deciding a renewal before the ballot quorum is reached"
  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "a member casts a second ballot on the same decision"
  - id: ERR_MEMBER_NOT_PARTICIPANT
    http: 409
    condition: "a member without a CONFIRMED commitment on the subscription tries to vote"
  - id: ERR_TITLE_SWAP_INVALID
    http: 422
    condition: "a RESTRUCTURE decide with an empty titles_out or titles_in, duplicate identifiers, an identifier appearing on both sides, or a missing delta_price_cents"
  - id: ERR_TITLE_COUNT_FLOOR_BREACHED
    http: 409
    condition: "executing a restructure would leave the subscription with fewer than MIN_ENTITLED_TITLES titles"
  - id: ERR_DUPLICATE_USAGE_REPORT
    http: 409
    condition: "a usage report already exists for the same subscription, member and month"
  - id: ERR_DUPLICATE_COMMITMENT
    http: 409
    condition: "the member already holds a PLEDGED or CONFIRMED commitment on the product"
  - id: ERR_UNKNOWN_CRITERION
    http: 422
    condition: "the feedback's criterion_code is not one of the trial's declared criteria codes"
  - id: ERR_INSUFFICIENT_FEEDBACK
    http: 409
    condition: "evaluating a trial with fewer than MIN_FEEDBACK_ROWS feedback rows"
  - id: ERR_ARCHIVAL_COUNT_DISCREPANCY
    http: 409
    condition: "the vendor's attested title count differs from the observed deposited count by more than ARCHIVAL_DISCREPANCY_TOLERANCE"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 409
    condition: "submitting or revising a negotiation that has already reached MAX_NEGOTIATION_ROUNDS rounds"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "setting the logical clock to an instant earlier than its current value"
  - id: ERR_BUDGET_CEILING_EXCEEDED
    http: 409
    condition: "the projected price of a new pledge would push the member's committed spend past its budget ceiling"
  - id: ERR_INFLATION_CAP_EXCEEDED
    http: 422
    condition: "deciding RENEW with a vendor increase above the product's inflation cap without accept_capped_offer"

roles:
  - name: ConsortiumAdmin
    description: "Collections-office operator: registers members, vendors and products, opens and signs negotiations, evaluates trials, drives renewal decisions and archival verification, and moves the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /erm/members"
      - "POST /erm/vendors"
      - "POST /erm/products"
      - "POST /erm/negotiations"
      - "POST /erm/negotiations/{id}/sign"
      - "POST /erm/trials/{id}/evaluate"
      - "POST /erm/subscriptions/{id}/renewal-decisions"
      - "POST /erm/renewal-decisions/{id}/open-vote"
      - "POST /erm/renewal-decisions/{id}/decide"
      - "POST /erm/renewal-decisions/{id}/execute"
      - "POST /erm/renewal-decisions/{id}/revert-restructure"
      - "POST /erm/subscriptions/{id}/archival-checks"
      - "POST /erm/archival-checks/{id}/verify"
      - "POST /erm/_clock/set_current_utc"
    shared_operations:
      - "GET /erm/members/{id}"
      - "GET /erm/vendors/{id}"
      - "GET /erm/products, GET /erm/products/{id}"
      - "GET /erm/trials, GET /erm/trials/{id}, GET /erm/trials/{id}/feedback"
      - "GET /erm/negotiations, GET /erm/negotiations/{id}"
      - "GET /erm/commitments, GET /erm/commitments/{id}"
      - "GET /erm/subscriptions, GET /erm/subscriptions/{id}"
      - "GET /erm/subscriptions/{id}/cost-per-use, GET /erm/subscriptions/{id}/invoice-allocation"
      - "GET /erm/subscriptions/{id}/auth-configs, GET /erm/subscriptions/{id}/archival-checks, GET /erm/subscriptions/{id}/renewal-decisions"
      - "GET /erm/access-incidents, GET /erm/access-incidents/{id}"
      - "GET /erm/usage-reports, GET /erm/usage-reports/{id}"
  - name: MemberLibrarian
    description: "Electronic resources librarian at one member library: sets up and runs trials, submits stakeholder feedback, pledges and withdraws participation, reports and reopens access incidents, and casts the member's renewal ballot."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /erm/products/{id}/trials"
      - "POST /erm/trials/{id}/open"
      - "POST /erm/trials/{id}/close"
      - "POST /erm/trials/{id}/feedback"
      - "POST /erm/products/{id}/commitments"
      - "POST /erm/commitments/{id}/withdraw"
      - "POST /erm/subscriptions/{id}/access-incidents"
      - "POST /erm/access-incidents/{id}/reopen"
      - "POST /erm/renewal-decisions/{id}/vote"
    shared_operations:
      - "GET /erm/members/{id}"
      - "GET /erm/vendors/{id}"
      - "GET /erm/products, GET /erm/products/{id}"
      - "GET /erm/trials, GET /erm/trials/{id}, GET /erm/trials/{id}/feedback"
      - "GET /erm/commitments, GET /erm/commitments/{id}"
      - "GET /erm/subscriptions, GET /erm/subscriptions/{id}"
      - "GET /erm/subscriptions/{id}/cost-per-use, GET /erm/subscriptions/{id}/invoice-allocation"
      - "GET /erm/subscriptions/{id}/auth-configs, GET /erm/subscriptions/{id}/archival-checks, GET /erm/subscriptions/{id}/renewal-decisions"
      - "GET /erm/access-incidents, GET /erm/access-incidents/{id}"
      - "GET /erm/usage-reports, GET /erm/usage-reports/{id}"
  - name: LicenseNegotiator
    description: "Consortium license negotiator: drafts, submits and revises license terms across negotiation rounds. Never signs - the signer must be a different operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /erm/negotiations/{id}/submit"
      - "POST /erm/negotiations/{id}/revise"
    shared_operations:
      - "GET /erm/members/{id}"
      - "GET /erm/vendors/{id}"
      - "GET /erm/products, GET /erm/products/{id}"
      - "GET /erm/trials, GET /erm/trials/{id}"
      - "GET /erm/negotiations, GET /erm/negotiations/{id}"
      - "GET /erm/subscriptions, GET /erm/subscriptions/{id}"
  - name: VendorRep
    description: "Publisher or aggregator representative: answers negotiation rounds, files COUNTER usage statistics, and attests archival deposits for its own products."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /erm/negotiations/{id}/vendor-response"
      - "POST /erm/subscriptions/{id}/usage-reports"
      - "POST /erm/archival-checks/{id}/attest"
    shared_operations:
      - "GET /erm/members/{id}"
      - "GET /erm/vendors/{id}"
      - "GET /erm/products, GET /erm/products/{id}"
      - "GET /erm/trials/{id}"
      - "GET /erm/negotiations, GET /erm/negotiations/{id}"
      - "GET /erm/commitments, GET /erm/commitments/{id}"
      - "GET /erm/subscriptions, GET /erm/subscriptions/{id}"
      - "GET /erm/subscriptions/{id}/archival-checks"
      - "GET /erm/usage-reports, GET /erm/usage-reports/{id}"
  - name: AccessEngineer
    description: "Consortium access services engineer: configures authentication realms, runs on-campus and off-campus probes, and diagnoses and resolves access incidents."
    identity: opaque
    exclusive_operations:
      - "POST /erm/subscriptions/{id}/auth-configs"
      - "POST /erm/auth-configs/{id}/verify"
      - "POST /erm/access-incidents/{id}/diagnose"
      - "POST /erm/access-incidents/{id}/resolve"
    shared_operations:
      - "GET /erm/members/{id}"
      - "GET /erm/vendors/{id}"
      - "GET /erm/products, GET /erm/products/{id}"
      - "GET /erm/trials/{id}"
      - "GET /erm/subscriptions, GET /erm/subscriptions/{id}"
      - "GET /erm/subscriptions/{id}/auth-configs"
      - "GET /erm/access-incidents, GET /erm/access-incidents/{id}"
