# =============================================================================
# SCAFFOLD — Learning-Center Franchise & Skill Assessment (Kumon/Mathnasium/Sylvan style)
# Difficulty: Expert
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  Learning-Center Franchise & Skill Assessment (Kumon/Mathnasium/Sylvan style):
  diagnostic placement & level, individualized worksheet/curriculum progression,
  recurring tuition & enrollment fee, session scheduling & instructor ratio,
  mastery/advancement & report, multi-subject & sibling discount, franchise royalty
  & territory, attendance

domain_name: learning-center-franchise
api_prefix: ""

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: graph_constraint
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys (Center, Family, Student, Enrollment,
  # Subject, CurriculumLevel, Worksheet, Session, AttendanceRecord, Invoice,
  # FranchiseAgreement). No deep nesting in URL paths; resources are top-level
  # collections with FK references in bodies/queries.

  state_machine_shape: cyclic
  # Worksheet progression cycles (ASSIGNED -> GRADED -> {RETRY -> ASSIGNED} | MASTERED);
  # Enrollment has branching lifecycle with revert; Invoice has branching settle/void;
  # Session has fork-join attendance dimension.

  relationship_patterns:
    - one_to_many        # Family -> Student, Center -> Enrollment, Subject -> CurriculumLevel
    - self_referential   # CurriculumLevel.prereq_level_id references CurriculumLevel (DAG of levels)
    - cross_aggregate    # Enrollment references Student, Subject, CurriculumLevel; Worksheet references Enrollment + CurriculumLevel

  role_model: peer_roles
  # FranchiseAdmin owns Center/FranchiseAgreement/Subject/CurriculumLevel config;
  # CenterDirector owns Enrollment/Session/Invoice operations within own Center;
  # Instructor grades Worksheets and marks Attendance for sessions they staff;
  # Parent (entity_backed Family) reads own children's progress and pays invoices.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Center
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Franchise learning-center name" }
      - { name: territory_code, type: string, source: input, description: "Postal/territory code this center serves; unique across all centers (ERR_TERRITORY_CONFLICT on duplicate)", constraints: "uppercase string, unique among Centers" }
      - { name: instructor_ratio_cap, type: integer, source: input, description: "Maximum students one instructor may staff in a single session at this center", default: 6, constraints: ">= 1" }
      - { name: enrollment_fee_cents, type: integer, source: input, description: "One-time enrollment fee charged on first active enrollment per Student at this center", default: 5000, constraints: ">= 0" }
      - { name: monthly_tuition_cents, type: integer, source: input, description: "Base monthly tuition per subject-enrollment before discounts", default: 15000, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Center lifecycle status", default: PROVISIONING, constraints: "PROVISIONING | OPERATING | SUSPENDED" }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of Enrollments at this center whose status IN {ACTIVE, PAUSED}", default: 0 }

  - name: FranchiseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; the center this agreement governs (1:1, enforced unique per center)" }
      - { name: royalty_rate_bps, type: integer, source: input, description: "Royalty rate in basis points applied to collected tuition revenue", default: 1000, constraints: "0..10000 (bps)" }
      - { name: marketing_fee_bps, type: integer, source: input, description: "National marketing fee in basis points applied to collected tuition revenue", default: 200, constraints: "0..10000 (bps)" }
      - { name: minimum_monthly_royalty_cents, type: integer, source: input, description: "Royalty floor; the greater of percentage royalty and this floor is owed", default: 50000, constraints: ">= 0" }
      - { name: royalty_basis, type: enum, source: input, description: "Selects the royalty_owed variant: ROYALTY_FLOOR applies the minimum floor to the percentage royalty only; COMBINED_FLOOR applies it to percentage+marketing combined", default: ROYALTY_FLOOR, constraints: "ROYALTY_FLOOR | COMBINED_FLOOR" }
      - { name: status, type: enum, source: system, description: "Agreement status; ACTIVE required for Center to enter OPERATING", default: PENDING, constraints: "PENDING | ACTIVE | TERMINATED" }

  - name: Subject
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; subject offered at this center" }
      - { name: name, type: string, source: input, description: "Subject name (e.g., MATH, READING)" }
      - { name: code, type: string, source: input, description: "Short subject code, unique within a center", constraints: "unique per center_id" }
      - { name: status, type: enum, source: system, description: "Subject availability; subjects are created ACTIVE and remain ACTIVE in this version", default: ACTIVE, constraints: "ACTIVE" }

  - name: CurriculumLevel
    parent: null
    common_fields: true
    fields:
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; subject this level belongs to" }
      - { name: rank, type: integer, source: input, description: "Ordinal rank of this level within the subject (1 = lowest); strictly increasing along prerequisite chain", constraints: ">= 1, unique per subject_id" }
      - { name: label, type: string, source: input, description: "Human level label (e.g., 'A', 'B', '3A')" }
      - { name: prereq_level_id, type: string, source: input, description: "FK -> CurriculumLevel.id; the immediately-lower prerequisite level (null for the entry level). Forms a self-referential DAG; cycles rejected", default: null }
      - { name: worksheets_to_master, type: integer, source: input, description: "Number of distinct worksheet sets that must reach MASTERED to advance out of this level", default: 10, constraints: ">= 1" }
      - { name: mastery_score_threshold, type: integer, source: input, description: "Minimum worksheet score (0..100) counted as a pass toward mastery", default: 80, constraints: "0..100" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; home center for billing" }
      - { name: contact_email, type: string, source: input, description: "Billing/login email for the parent account" }
      - { name: contact_name, type: string, source: input, description: "Parent/guardian full name" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Account credit balance from refunds/voids, applied to future invoices", default: 0 }
      - { name: sibling_count, type: integer, source: computed, description: "Number of Students in this Family with at least one ACTIVE enrollment", default: 0 }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the family this student belongs to" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: birthdate, type: datetime, source: input, description: "Student date of birth (ISO 8601)" }
      - { name: enrollment_fee_charged, type: boolean, source: computed, description: "True once the one-time enrollment fee has been billed for this student", default: false }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; center the student is enrolled at" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the enrolled student" }
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; the subject enrolled in" }
      - { name: placement_level_id, type: string, source: input, description: "FK -> CurriculumLevel.id; level assigned by diagnostic placement", default: null }
      - { name: current_level_id, type: string, source: computed, description: "FK -> CurriculumLevel.id; the level the student is presently working in (advances on mastery)" }
      - { name: diagnostic_raw_score, type: integer, source: input, description: "Raw diagnostic placement score 0..100 used to derive placement_level_id", default: null, constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle", default: PLACEMENT_PENDING, constraints: "PLACEMENT_PENDING | ACTIVE | PAUSED | COMPLETED | WITHDRAWN" }
      - { name: mastered_sets_in_level, type: integer, source: computed, description: "Count of distinct MASTERED worksheet sets in current_level_id", default: 0 }
      - { name: monthly_rate_cents, type: integer, source: computed, description: "Per-enrollment monthly tuition after multi-subject and sibling discounts", default: 0 }

  - name: Worksheet
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment this worksheet set belongs to" }
      - { name: level_id, type: string, source: input, description: "FK -> CurriculumLevel.id; curriculum level the worksheet set targets" }
      - { name: set_number, type: integer, source: input, description: "Sequential set index within the level (1..worksheets_to_master)", constraints: ">= 1" }
      - { name: score, type: integer, source: input, description: "Graded score 0..100; null until graded", default: null, constraints: "0..100" }
      - { name: attempt_count, type: integer, source: computed, description: "Number of times this set has been graded (increments each grade)", default: 0 }
      - { name: status, type: enum, source: system, description: "Worksheet set lifecycle", default: ASSIGNED, constraints: "ASSIGNED | GRADED | RETRY | MASTERED" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; center hosting the session" }
      - { name: instructor_user_id, type: string, source: input, description: "Opaque X-User-ID of the Instructor staffing this session (audit only)" }
      - { name: start_at, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be strictly after start_at" }
      - { name: seat_cap, type: integer, source: input, description: "Maximum seats; must not exceed the center's instructor_ratio_cap", constraints: "1..instructor_ratio_cap" }
      - { name: booked_seat_count, type: integer, source: computed, description: "Count of AttendanceRecords on this session whose status IN {BOOKED, PRESENT}", default: 0 }
      - { name: status, type: enum, source: system, description: "Session lifecycle", default: SCHEDULED, constraints: "SCHEDULED | OPEN | CLOSED | CANCELLED" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; the session attended" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment booking this seat" }
      - { name: status, type: enum, source: system, description: "Attendance lifecycle", default: BOOKED, constraints: "BOOKED | PRESENT | ABSENT | CANCELLED" }
      - { name: marked_at, type: datetime, source: system, description: "When PRESENT/ABSENT was recorded (ISO 8601 UTC); null until marked", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the billed family" }
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; center whose tuition is billed" }
      - { name: period_month, type: string, source: input, description: "Billing period 'YYYY-MM' the invoice covers", constraints: "YYYY-MM" }
      - { name: enrollment_fee_component_cents, type: integer, source: computed, description: "Sum of one-time enrollment fees included on this invoice", default: 0 }
      - { name: tuition_component_cents, type: integer, source: computed, description: "Sum of post-discount monthly_rate_cents across enrollments billed", default: 0 }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Family wallet credit applied to this invoice", default: 0 }
      - { name: total_due_cents, type: integer, source: computed, description: "enrollment_fee_component + tuition_component - wallet_applied (>= 0)", default: 0 }
      - { name: royalty_owed_cents, type: integer, source: computed, description: "Royalty owed to franchisor on this invoice's collected tuition (computed at PAID)", default: 0 }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Center -------------------------------------------------------------
  - entity: Center
    field: status
    initial_state: PROVISIONING
    terminal_states: []
    transitions:
      - from: PROVISIONING
        to: OPERATING
        trigger: "POST /centers/{center_id}/activate"
        actor: FranchiseAdmin
        preconditions:
          - "A FranchiseAgreement with center_id == this Center exists and is in status ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Center.status = OPERATING"
          - "increments Center.version by 1"
      - from: OPERATING
        to: SUSPENDED
        trigger: "POST /centers/{center_id}/suspend"
        actor: FranchiseAdmin
        preconditions: []
        side_effects:
          - "Center.status = SUSPENDED"
          - "All Sessions at this center in status IN {SCHEDULED, OPEN} -> CANCELLED (cascade L1)"
          - "Each CANCELLED Session's AttendanceRecords in status IN {BOOKED, PRESENT} -> CANCELLED, and each such cancel recomputes that Session.booked_seat_count (cascade L2)"
          - "increments Center.version by 1"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /centers/{center_id}/activate"
        actor: FranchiseAdmin
        preconditions:
          - "A FranchiseAgreement with center_id == this Center exists and is in status ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Center.status = OPERATING"
          - "increments Center.version by 1"

  # ---- FranchiseAgreement -------------------------------------------------
  - entity: FranchiseAgreement
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /franchise-agreements/{agreement_id}/activate"
        actor: FranchiseAdmin
        preconditions:
          - "royalty_rate_bps + marketing_fee_bps <= 10000 (ERR_ROYALTY_RATE_INVALID)"
        side_effects:
          - "FranchiseAgreement.status = ACTIVE"
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /franchise-agreements/{agreement_id}/terminate"
        actor: FranchiseAdmin
        preconditions:
          - "The referenced Center is NOT in status OPERATING (ERR_CENTER_OPERATING); a terminated agreement may not back an operating center"
        side_effects:
          - "FranchiseAgreement.status = TERMINATED"
          - "increments FranchiseAgreement.version by 1"

  # ---- Enrollment (branching with revert + cross-entity guards) -----------
  - entity: Enrollment
    field: status
    initial_state: PLACEMENT_PENDING
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PLACEMENT_PENDING
        to: ACTIVE
        trigger: "POST /enrollments/{enrollment_id}/place"
        actor: CenterDirector
        preconditions:
          - "The Enrollment's Center.status == OPERATING (ERR_CENTER_NOT_OPERATING) [cross-entity: Enrollment depends on Center.status]"
          - "diagnostic_raw_score is present (0..100) (ERR_DIAGNOSTIC_MISSING)"
          - "The CurriculumLevel chosen by placement belongs to the Enrollment.subject_id (ERR_LEVEL_SUBJECT_MISMATCH)"
        side_effects:
          - "placement_level_id and current_level_id set by diagnostic_placement calc"
          - "Enrollment.status = ACTIVE"
          - "recompute Student.enrollment_fee_charged: if false, set true and stage enrollment fee for next invoice"
          - "recompute Family.sibling_count and re-run sibling_discount across all ACTIVE enrollments of every Student in the Family (cascade L1: enrollment activation -> Family.sibling_count change)"
          - "for each affected ACTIVE enrollment, recompute monthly_rate_cents via tuition_rate calc (cascade L2: sibling_count change -> per-enrollment monthly_rate_cents change)"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /enrollments/{enrollment_id}/pause"
        actor: CenterDirector
        preconditions: []
        side_effects:
          - "Enrollment.status = PAUSED"
          - "recompute Family.sibling_count (a paused enrollment no longer counts toward sibling discount)"
          - "recompute monthly_rate_cents for all still-ACTIVE enrollments in the Family"
          - "increments Enrollment.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollment_id}/resume"
        actor: CenterDirector
        preconditions:
          - "The Enrollment's Center.status == OPERATING (ERR_CENTER_NOT_OPERATING)"
        side_effects:
          - "Enrollment.status = ACTIVE"
          - "recompute Family.sibling_count and monthly_rate_cents across the Family"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (advancement calc: current_level_id has no higher level AND mastered_sets_in_level >= worksheets_to_master)"
        actor: system
        preconditions:
          - "current_level_id is the highest-rank CurriculumLevel for the subject (no level with greater rank)"
          - "mastered_sets_in_level >= current_level.worksheets_to_master"
        side_effects:
          - "Enrollment.status = COMPLETED"
          - "recompute Family.sibling_count and monthly_rate_cents across the Family"
          - "increments Enrollment.version by 1"
      - from: [ACTIVE, PAUSED, PLACEMENT_PENDING]
        to: WITHDRAWN
        trigger: "POST /enrollments/{enrollment_id}/withdraw"
        actor: CenterDirector
        preconditions: []
        side_effects:
          - "Enrollment.status = WITHDRAWN"
          - "All Worksheets of this enrollment in status IN {ASSIGNED, GRADED, RETRY} -> RETRY is NOT applied; instead they are detached: their status is left unchanged but no further grading is allowed"
          - "All future AttendanceRecords (session.start_at > clock now) of this enrollment in status IN {BOOKED} -> CANCELLED, recomputing each Session.booked_seat_count"
          - "recompute Family.sibling_count and monthly_rate_cents across the Family"
          - "increments Enrollment.version by 1"

  # ---- Worksheet (CYCLIC: ASSIGNED->GRADED->{RETRY->ASSIGNED}|MASTERED) ----
  - entity: Worksheet
    field: status
    initial_state: ASSIGNED
    terminal_states: [MASTERED]
    transitions:
      - from: ASSIGNED
        to: GRADED
        trigger: "POST /worksheets/{worksheet_id}/grade"
        actor: Instructor
        preconditions:
          - "Parent Enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE) [cross-entity: Worksheet depends on Enrollment.status]"
          - "score in body is 0..100 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "Worksheet.score = body score; attempt_count += 1"
          - "Worksheet.status = GRADED"
          - "increments Worksheet.version by 1"
      - from: GRADED
        to: MASTERED
        trigger: "system (immediately after grade when score >= level.mastery_score_threshold)"
        actor: system
        preconditions:
          - "Worksheet.score >= the worksheet's level.mastery_score_threshold"
        side_effects:
          - "Worksheet.status = MASTERED"
          - "recompute Enrollment.mastered_sets_in_level (count distinct MASTERED set_numbers in current_level_id)"
          - "run advancement calc: if mastered_sets_in_level >= level.worksheets_to_master, advance current_level_id to the next-rank level for the subject (cascade L1: mastery -> Enrollment.current_level_id change) and reset mastered_sets_in_level to count of MASTERED sets already in the new level"
          - "if no higher level exists and mastery target met, Enrollment ACTIVE -> COMPLETED (cascade L2: current_level_id terminal -> Enrollment.status change)"
          - "increments Worksheet.version by 1"
      - from: GRADED
        to: RETRY
        trigger: "system (immediately after grade when score < level.mastery_score_threshold)"
        actor: system
        preconditions:
          - "Worksheet.score < the worksheet's level.mastery_score_threshold"
        side_effects:
          - "Worksheet.status = RETRY"
          - "increments Worksheet.version by 1"
      - from: RETRY
        to: ASSIGNED
        trigger: "POST /worksheets/{worksheet_id}/reassign"
        actor: Instructor
        preconditions:
          - "Parent Enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "Worksheet.status = ASSIGNED; score reset to null (next grade re-attempts the same set_number)"
          - "increments Worksheet.version by 1"

  # ---- Session (fork-join attendance; cross-entity capacity) --------------
  - entity: Session
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /sessions/{session_id}/open"
        actor: CenterDirector
        preconditions:
          - "The Session's Center.status == OPERATING (ERR_CENTER_NOT_OPERATING) [cross-entity: Session depends on Center.status]"
        side_effects:
          - "Session.status = OPEN (bookings allowed)"
          - "increments Session.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /sessions/{session_id}/close"
        actor: CenterDirector
        preconditions:
          - "clock now >= Session.start_at (ERR_SESSION_NOT_STARTED)"
        side_effects:
          - "Session.status = CLOSED"
          - "Every AttendanceRecord still in status BOOKED -> ABSENT (fork-join: all booked seats resolved on close), marked_at = clock now"
          - "increments Session.version by 1"
      - from: [SCHEDULED, OPEN]
        to: CANCELLED
        trigger: "POST /sessions/{session_id}/cancel or system (center suspended)"
        actor: "CenterDirector or system"
        preconditions: []
        side_effects:
          - "Session.status = CANCELLED"
          - "Every AttendanceRecord in status IN {BOOKED, PRESENT} -> CANCELLED, recompute booked_seat_count = 0"
          - "increments Session.version by 1"

  # ---- AttendanceRecord (fork-join branch dimension) ----------------------
  - entity: AttendanceRecord
    field: status
    initial_state: BOOKED
    terminal_states: [PRESENT, ABSENT, CANCELLED]
    transitions:
      - from: BOOKED
        to: PRESENT
        trigger: "POST /attendance-records/{record_id}/check-in"
        actor: Instructor
        preconditions:
          - "Parent Session.status == OPEN (ERR_SESSION_NOT_OPEN) [cross-entity: AttendanceRecord depends on Session.status]"
        side_effects:
          - "AttendanceRecord.status = PRESENT; marked_at = clock now"
          - "increments AttendanceRecord.version by 1"
      - from: BOOKED
        to: ABSENT
        trigger: "POST /attendance-records/{record_id}/mark-absent or system (session close)"
        actor: "Instructor or system"
        preconditions:
          - "Parent Session.status IN {OPEN, CLOSED}"
        side_effects:
          - "AttendanceRecord.status = ABSENT; marked_at = clock now"
          - "recompute Session.booked_seat_count (ABSENT no longer counts)"
          - "increments AttendanceRecord.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /attendance-records/{record_id}/cancel or system (session/enrollment terminated)"
        actor: "CenterDirector or system"
        preconditions: []
        side_effects:
          - "AttendanceRecord.status = CANCELLED"
          - "recompute Session.booked_seat_count (frees a seat)"
          - "increments AttendanceRecord.version by 1"

  # ---- Invoice (branching settle/void) ------------------------------------
  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoice_id}/issue"
        actor: CenterDirector
        preconditions:
          - "tuition_component_cents + enrollment_fee_component_cents > 0 (ERR_EMPTY_INVOICE)"
        side_effects:
          - "Invoice.status = ISSUED"
          - "apply invoice_total calc: wallet_applied_cents and total_due_cents pinned"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoice_id}/pay"
        actor: "Parent or CenterDirector"
        preconditions:
          - "amount_cents in body == Invoice.total_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Invoice.status = PAID"
          - "deduct wallet_applied_cents from Family.wallet_credit_cents (cascade L1: payment -> Family.wallet_credit_cents change)"
          - "compute royalty_owed_cents via royalty calc over tuition_component_cents"
          - "increments Invoice.version by 1"
      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "POST /invoices/{invoice_id}/void"
        actor: CenterDirector
        preconditions: []
        side_effects:
          - "Invoice.status = VOID"
          - "if previously ISSUED: refund wallet_applied_cents back to Family.wallet_credit_cents (compensating action restores wallet conserved quantity)"
          - "increments Invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: invoice-issue-stale-family
    parent_entity: Family
    write_endpoint: "POST /invoices"
    occ_field: "expected_family_version"
    description: |
      Creating a draft Invoice for a Family bills tuition and enrollment fees that
      legitimately supersede a prior unbilled state. A create whose
      expected_family_version no longer matches the Family's current version is
      rejected: another draft Invoice creation has already advanced the Family's
      version (and consumed/recomputed the billable enrollments), so the current
      writer's view of the Family is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: attendance-book-stale-session
    parent_entity: Session
    write_endpoint: "POST /attendance-records"
    occ_field: "expected_session_version"
    description: |
      Booking a seat on a Session whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      booked a seat (advancing Session.version and Session.booked_seat_count) and
      the current writer's view of remaining capacity is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Dual-variant #1: diagnostic placement (Enrollment domain) ----------
  - name: diagnostic_placement
    trigger: "POST /enrollments/{enrollment_id}/place"
    algorithm: threshold
    formula: |
      Inputs: diagnostic_raw_score (0..100), the ordered list of CurriculumLevels
      for Enrollment.subject_id sorted by rank ASC.
      Band width B = ceil(100 / N) where N = count of CurriculumLevels whose
        subject_id == Enrollment.subject_id.
      target_index = min(floor(diagnostic_raw_score / B), N-1)   # 0-based into rank-sorted list
      placement_level = level at target_index.
      VARIANT SELECTION pins which of the two variants below applies based on
      center policy flag `placement_policy` supplied on the place request.
    input_set: "all CurriculumLevels whose subject_id == Enrollment.subject_id, sorted by rank ASC, tie-break created_at ASC"
    constants:
      MAX_SCORE: 100
    precision: "integer level index; round via floor as written"
    variants:
      - name: STRICT
        when: "placement_policy == STRICT (default): place exactly at target_index"
        difference: "placement_level = level[target_index]"
      - name: SUPPORTIVE
        when: "placement_policy == SUPPORTIVE: place one level below target unless already at entry level"
        difference: "placement_level = level[max(0, target_index - 1)] — for identical diagnostic_raw_score this yields a DIFFERENT level than STRICT whenever target_index > 0"

  # ---- Dual-variant #2: royalty owed (Invoice/FranchiseAgreement domain) ---
  - name: royalty_owed
    trigger: "POST /invoices/{invoice_id}/pay"
    algorithm: tiered_pricing
    formula: |
      Inputs: Invoice.tuition_component_cents (collected tuition; enrollment fee is
      NOT royalty-bearing), FranchiseAgreement for the center
      (royalty_rate_bps, marketing_fee_bps, minimum_monthly_royalty_cents).
      percentage_royalty = floor(tuition_component_cents * royalty_rate_bps / 10000)
      marketing = floor(tuition_component_cents * marketing_fee_bps / 10000)
      VARIANT SELECTION pins how the monthly minimum interacts (see variants).
    input_set: "the single FranchiseAgreement whose center_id == Invoice.center_id and status == ACTIVE"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, floor per term before summing (round-per-line-item-then-sum)"
    variants:
      - name: FLOOR_ON_ROYALTY_ONLY
        when: "agreement.royalty_basis == ROYALTY_FLOOR (default)"
        difference: "royalty_owed_cents = max(percentage_royalty, minimum_monthly_royalty_cents) + marketing"
      - name: FLOOR_ON_COMBINED
        when: "agreement.royalty_basis == COMBINED_FLOOR"
        difference: "royalty_owed_cents = max(percentage_royalty + marketing, minimum_monthly_royalty_cents) — for identical tuition this DIFFERS from FLOOR_ON_ROYALTY_ONLY whenever percentage_royalty < minimum and marketing > 0"

  # ---- Combinatorial (mode a): tuition with nested discounts --------------
  - name: tuition_rate
    trigger: "enrollment place/pause/resume/withdraw/complete (Family sibling_count recompute), and POST /invoices"
    algorithm: tiered_pricing
    formula: |
      Per-enrollment monthly rate, >=3 inputs with non-linear interaction:
        base = Center.monthly_tuition_cents
        # multi-subject discount: nth ACTIVE enrollment of the SAME student (ordered
        #   by Enrollment.created_at ASC) gets a stacking discount.
        subject_index = rank of this enrollment among the student's ACTIVE enrollments
                        ordered by created_at ASC, tie-break id is FORBIDDEN -> use created_at only (1-based)
        multi_subject_pct = 0 if subject_index == 1
                            0.10 if subject_index == 2
                            0.15 if subject_index >= 3
        # sibling discount tier keyed on Family.sibling_count (students with >=1 ACTIVE enrollment):
        sibling_pct = 0 if sibling_count <= 1
                      0.05 if sibling_count == 2
                      0.10 if sibling_count >= 3
        # discounts are applied multiplicatively in a PINNED order: multi-subject first, then sibling
        after_multi = floor(base * (1 - multi_subject_pct))      # round per-step (floor)
        monthly_rate_cents = floor(after_multi * (1 - sibling_pct))
    input_set: "ACTIVE enrollments of the student (multi-subject); Students in the Family with >=1 ACTIVE enrollment (sibling_count)"
    constants:
      MULTI_2: 0.10
      MULTI_3PLUS: 0.15
      SIB_2: 0.05
      SIB_3PLUS: 0.10
    precision: "integer cents; floor after EACH discount step (multi-subject step, then sibling step) — order pinned: multi-subject before sibling"

  # ---- Combinatorial (mode b): invoice total, sum-then-apply-wallet -------
  - name: invoice_total
    trigger: "POST /invoices/{invoice_id}/issue"
    algorithm: aggregation
    formula: |
      enrollment_fee_component_cents = sum over Students newly charged on this invoice
        of Center.enrollment_fee_cents  (each student charged at most once, ever)
      tuition_component_cents = sum over billed ACTIVE enrollments of monthly_rate_cents
      # ROUNDING ORDER PINNED (mode b): each enrollment's monthly_rate_cents is already
      #   an integer; sum the integer per-line components FIRST, THEN apply wallet.
      gross = enrollment_fee_component_cents + tuition_component_cents
      wallet_applied_cents = min(Family.wallet_credit_cents, gross)
      total_due_cents = gross - wallet_applied_cents      # >= 0
    input_set: "ACTIVE enrollments whose center_id == Invoice.center_id and whose Student.family_id == Invoice.family_id"
    constants: {}
    precision: "integer cents; SUM per-line integer components first, THEN subtract wallet (sum-then-apply order pinned)"

  # ---- Combinatorial (mode c): advancement (eval order pinned) ------------
  - name: advancement
    trigger: "system, immediately after a Worksheet enters MASTERED"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency pinned by explicit evaluation order:
        step 1: mastered_sets_in_level = count(distinct set_number of Worksheets with
                status==MASTERED and level_id == Enrollment.current_level_id)
        step 2: let L = current_level (its worksheets_to_master, rank).
        step 3: if mastered_sets_in_level >= L.worksheets_to_master:
                  next = CurriculumLevel with subject_id == L.subject_id and
                         minimal rank strictly greater than L.rank (tie-break created_at ASC)
                  if next exists:
                     current_level_id = next.id
                     # re-evaluate mastered_sets_in_level AGAINST THE NEW LEVEL (step 1 re-run)
                     mastered_sets_in_level = count MASTERED sets already in next level
                  else:
                     Enrollment.status -> COMPLETED   # terminal, no further advance
      Evaluation order is pinned: compute mastery count, compare to threshold, then
      (and only then) advance and recompute the count against the new level.
    input_set: "Worksheets of the enrollment with status==MASTERED, grouped by level_id"
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix; Parent/Instructor/CenterDirector scoped to their own entity/center"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges respected (e.g., diagnostic_raw_score 0..100, seat_cap 1..instructor_ratio_cap)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version (when supplied/required) matches parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /invoices, POST /attendance-records"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from: set)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  # ---- business rules: ordering matters for priority-conflict tests -------
  - priority: 7
    category: business_safety
    check: "Instructor ratio / seat capacity: a booking must not push booked_seat_count above Session.seat_cap, and seat_cap must not exceed Center.instructor_ratio_cap"
    error_id: ERR_RATIO_EXCEEDED
    http_status: 409
    applies_to: "POST /attendance-records, POST /sessions"

  - priority: 8
    category: business_temporal
    check: "Session interval overlap: an enrollment may not hold two BOOKED/PRESENT AttendanceRecords on the SAME center whose Sessions' [start_at, end_at) half-open intervals overlap (touching end==start is allowed)"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /attendance-records"

  - priority: 9
    category: business_temporal
    check: "Session scheduling overlap for one instructor: a new Session may not be created for the same instructor_user_id at the same center if its buffer-expanded closed interval [start_at - 30min, end_at + 30min] overlaps the (unexpanded) [start_at, end_at] interval of an existing Session of that instructor whose status IN {SCHEDULED, OPEN, CLOSED} (i.e. not CANCELLED). INSTRUCTOR_BUFFER_MINUTES = 30; adjacency within 30 minutes is a conflict."
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 10
    category: business_referential
    check: "Curriculum integrity: a CurriculumLevel.prereq_level_id must reference a level in the same subject with strictly lower rank, and must not introduce a cycle in the prerequisite DAG"
    error_id: ERR_PREREQ_CYCLE
    http_status: 409
    applies_to: "POST /curriculum-levels"

  - priority: 11
    category: business_referential
    check: "Level/subject coherence: a Worksheet.level_id and an Enrollment.placement_level_id must belong to the Enrollment's subject_id"
    error_id: ERR_LEVEL_SUBJECT_MISMATCH
    http_status: 409
    applies_to: "POST /worksheets, POST /enrollments/{enrollment_id}/place"

  - priority: 12
    category: business_constraint
    check: "Territory uniqueness: no two Centers may share territory_code"
    error_id: ERR_TERRITORY_CONFLICT
    http_status: 409
    applies_to: "POST /centers"

  - priority: 13
    category: business_fiscal
    check: "Payment amount must equal Invoice.total_due_cents exactly; an invoice with zero billable components may not be issued"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /invoices/{invoice_id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [FranchiseAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock now == to_iso8601 for all subsequent deadline/overlap/age checks"]

  # ---- Center -------------------------------------------------------------
  - method: POST
    path: "/centers"
    description: "Create a center"
    roles: [FranchiseAdmin]
    code: 201
    input: [name, territory_code, "instructor_ratio_cap?", "enrollment_fee_cents?", "monthly_tuition_cents?"]
    output: Center
    side_effects: ["status=PROVISIONING, active_enrollment_count=0", "ERR_TERRITORY_CONFLICT if territory_code already used"]

  - method: GET
    path: "/centers/{center_id}"
    description: "Get center details"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Center
    side_effects: []

  - method: GET
    path: "/centers"
    description: "List centers (paginated)"
    roles: [FranchiseAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Center[]
    side_effects: []

  - method: POST
    path: "/centers/{center_id}/activate"
    description: "Activate (open) a center; PROVISIONING/SUSPENDED -> OPERATING"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: Center
    side_effects: ["status -> OPERATING (requires ACTIVE FranchiseAgreement)", "increments Center.version by 1"]

  - method: POST
    path: "/centers/{center_id}/suspend"
    description: "Suspend a center; OPERATING -> SUSPENDED"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: Center
    side_effects: ["status -> SUSPENDED", "cascade: SCHEDULED/OPEN Sessions -> CANCELLED -> their BOOKED/PRESENT AttendanceRecords -> CANCELLED", "increments Center.version by 1"]

  # ---- FranchiseAgreement -------------------------------------------------
  - method: POST
    path: "/franchise-agreements"
    description: "Create a franchise agreement for a center (1:1)"
    roles: [FranchiseAdmin]
    code: 201
    input: [center_id, "royalty_rate_bps?", "marketing_fee_bps?", "minimum_monthly_royalty_cents?", "royalty_basis?"]
    output: FranchiseAgreement
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/franchise-agreements/{agreement_id}"
    description: "Get agreement"
    roles: [FranchiseAdmin, CenterDirector]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: []

  - method: GET
    path: "/franchise-agreements"
    description: "List/filter agreements; filter by center_id"
    roles: [FranchiseAdmin, CenterDirector]
    code: 200
    input: ["center_id?", "limit?", "offset?"]
    output: FranchiseAgreement[]
    side_effects: []

  - method: POST
    path: "/franchise-agreements/{agreement_id}/activate"
    description: "Activate agreement; PENDING -> ACTIVE"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["status -> ACTIVE", "increments FranchiseAgreement.version by 1"]

  - method: POST
    path: "/franchise-agreements/{agreement_id}/terminate"
    description: "Terminate agreement; ACTIVE -> TERMINATED"
    roles: [FranchiseAdmin]
    code: 200
    input: []
    output: FranchiseAgreement
    side_effects: ["status -> TERMINATED (rejected if center OPERATING)", "increments FranchiseAgreement.version by 1"]

  # ---- Subject ------------------------------------------------------------
  - method: POST
    path: "/subjects"
    description: "Create a subject at a center"
    roles: [FranchiseAdmin]
    code: 201
    input: [center_id, name, code]
    output: Subject
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/subjects/{subject_id}"
    description: "Get subject"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Subject
    side_effects: []

  - method: GET
    path: "/subjects"
    description: "List/filter subjects; filter by center_id"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["center_id?", "limit?", "offset?"]
    output: Subject[]
    side_effects: []

  # ---- CurriculumLevel ----------------------------------------------------
  - method: POST
    path: "/curriculum-levels"
    description: "Create a curriculum level within a subject (DAG node)"
    roles: [FranchiseAdmin]
    code: 201
    input: [subject_id, rank, label, "prereq_level_id?", "worksheets_to_master?", "mastery_score_threshold?"]
    output: CurriculumLevel
    side_effects: ["rejects prereq cycles / lower-rank violations (ERR_PREREQ_CYCLE)"]

  - method: GET
    path: "/curriculum-levels/{level_id}"
    description: "Get a curriculum level"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: CurriculumLevel
    side_effects: []

  - method: GET
    path: "/curriculum-levels"
    description: "List/filter levels; filter by subject_id or by prereq_level_id (reverse-reachability for self-FK)"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["subject_id?", "prereq_level_id?", "limit?", "offset?"]
    output: CurriculumLevel[]
    side_effects: []

  # ---- Family -------------------------------------------------------------
  - method: POST
    path: "/families"
    description: "Create a family/parent account"
    roles: [FranchiseAdmin, CenterDirector]
    code: 201
    input: [center_id, contact_email, contact_name]
    output: Family
    side_effects: ["wallet_credit_cents=0, sibling_count=0"]

  - method: GET
    path: "/families/{family_id}"
    description: "Get family (with computed wallet_credit_cents, sibling_count)"
    roles: [FranchiseAdmin, CenterDirector, Parent]
    code: 200
    input: []
    output: Family
    side_effects: []

  - method: GET
    path: "/families"
    description: "List/filter families; filter by center_id"
    roles: [FranchiseAdmin, CenterDirector]
    code: 200
    input: ["center_id?", "limit?", "offset?"]
    output: Family[]
    side_effects: []

  - method: POST
    path: "/families/{family_id}/wallet-adjustments"
    description: "Admin goodwill/credit adjustment to a family wallet (real-world operator surface; also the deterministic way to seed wallet_credit_cents)"
    roles: [FranchiseAdmin, CenterDirector]
    code: 200
    input: [amount_cents, reason]
    output: Family
    side_effects: ["wallet_credit_cents += amount_cents (amount_cents may be negative but wallet floored at 0)", "increments Family.version by 1"]

  # ---- Student ------------------------------------------------------------
  - method: POST
    path: "/students"
    description: "Create a student under a family"
    roles: [FranchiseAdmin, CenterDirector, Parent]
    code: 201
    input: [family_id, full_name, birthdate]
    output: Student
    side_effects: ["enrollment_fee_charged=false"]

  - method: GET
    path: "/students/{student_id}"
    description: "Get a student"
    roles: [FranchiseAdmin, CenterDirector, Parent, Instructor]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List/filter students; filter by family_id"
    roles: [FranchiseAdmin, CenterDirector, Parent, Instructor]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ---- Enrollment ---------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Create an enrollment (student x subject at a center); starts PLACEMENT_PENDING"
    roles: [FranchiseAdmin, CenterDirector]
    code: 201
    input: [center_id, student_id, subject_id, "diagnostic_raw_score?"]
    output: Enrollment
    side_effects: ["status=PLACEMENT_PENDING, monthly_rate_cents=0"]

  - method: GET
    path: "/enrollments/{enrollment_id}"
    description: "Get enrollment (computed current_level_id, mastered_sets_in_level, monthly_rate_cents)"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List/filter enrollments; filter by center_id, student_id, subject_id, placement_level_id, or current_level_id"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["center_id?", "student_id?", "subject_id?", "placement_level_id?", "current_level_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollment_id}/place"
    description: "Run diagnostic placement and activate; PLACEMENT_PENDING -> ACTIVE"
    roles: [CenterDirector]
    code: 200
    input: ["diagnostic_raw_score?", "placement_policy?"]
    output: Enrollment
    side_effects: ["sets placement_level_id/current_level_id via diagnostic_placement", "stages enrollment fee", "recomputes sibling_count + monthly_rate_cents across Family", "increments Enrollment.version by 1"]

  - method: POST
    path: "/enrollments/{enrollment_id}/pause"
    description: "Pause an active enrollment; ACTIVE -> PAUSED"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> PAUSED", "recompute sibling_count + monthly_rate_cents across Family", "increments Enrollment.version by 1"]

  - method: POST
    path: "/enrollments/{enrollment_id}/resume"
    description: "Resume a paused enrollment; PAUSED -> ACTIVE"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE", "recompute sibling_count + monthly_rate_cents across Family", "increments Enrollment.version by 1"]

  - method: POST
    path: "/enrollments/{enrollment_id}/withdraw"
    description: "Withdraw an enrollment; {ACTIVE,PAUSED,PLACEMENT_PENDING} -> WITHDRAWN"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> WITHDRAWN", "cancel future BOOKED AttendanceRecords", "recompute sibling_count + monthly_rate_cents across Family", "increments Enrollment.version by 1"]

  - method: GET
    path: "/enrollments/{enrollment_id}/report"
    description: "Mastery/advancement report: current_level, mastered_sets_in_level, per-level mastered counts"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  # ---- Worksheet ----------------------------------------------------------
  - method: POST
    path: "/worksheets"
    description: "Assign a worksheet set to an enrollment at a level"
    roles: [CenterDirector, Instructor]
    code: 201
    input: [enrollment_id, level_id, set_number]
    output: Worksheet
    side_effects: ["status=ASSIGNED, attempt_count=0"]

  - method: GET
    path: "/worksheets/{worksheet_id}"
    description: "Get a worksheet set"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Worksheet
    side_effects: []

  - method: GET
    path: "/worksheets"
    description: "List/filter worksheets; filter by enrollment_id or level_id"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["enrollment_id?", "level_id?", "status?", "limit?", "offset?"]
    output: Worksheet[]
    side_effects: []

  - method: POST
    path: "/worksheets/{worksheet_id}/grade"
    description: "Grade a worksheet set; ASSIGNED -> GRADED, then auto -> MASTERED or RETRY"
    roles: [Instructor]
    code: 200
    input: [score]
    output: Worksheet
    side_effects: ["score set, attempt_count += 1", "auto MASTERED (>=threshold) triggers advancement, possibly COMPLETED; else RETRY", "increments Worksheet.version by 1"]

  - method: POST
    path: "/worksheets/{worksheet_id}/reassign"
    description: "Reassign a failed worksheet set; RETRY -> ASSIGNED"
    roles: [Instructor]
    code: 200
    input: []
    output: Worksheet
    side_effects: ["status -> ASSIGNED, score reset to null", "increments Worksheet.version by 1"]

  # ---- Session ------------------------------------------------------------
  - method: POST
    path: "/sessions"
    description: "Schedule a session at a center for an instructor"
    roles: [CenterDirector]
    code: 201
    input: [center_id, instructor_user_id, start_at, end_at, seat_cap]
    output: Session
    side_effects: ["status=SCHEDULED, booked_seat_count=0", "rejects instructor double-booking with BUFFER (ERR_INSTRUCTOR_DOUBLE_BOOKED)", "rejects seat_cap > instructor_ratio_cap (ERR_RATIO_EXCEEDED)"]

  - method: GET
    path: "/sessions/{session_id}"
    description: "Get a session"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "List/filter sessions; filter by center_id"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["center_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: POST
    path: "/sessions/{session_id}/open"
    description: "Open a session for booking; SCHEDULED -> OPEN"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> OPEN", "increments Session.version by 1"]

  - method: POST
    path: "/sessions/{session_id}/close"
    description: "Close a session; OPEN -> CLOSED"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> CLOSED", "remaining BOOKED AttendanceRecords -> ABSENT", "increments Session.version by 1"]

  - method: POST
    path: "/sessions/{session_id}/cancel"
    description: "Cancel a session; {SCHEDULED,OPEN} -> CANCELLED"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Session
    side_effects: ["status -> CANCELLED", "BOOKED/PRESENT AttendanceRecords -> CANCELLED, booked_seat_count=0", "increments Session.version by 1"]

  # ---- AttendanceRecord ---------------------------------------------------
  - method: POST
    path: "/attendance-records"
    description: "Book a seat for an enrollment on an open/scheduled session"
    roles: [CenterDirector, Parent]
    code: 201
    input: [session_id, enrollment_id, expected_session_version]
    output: AttendanceRecord
    side_effects: ["status=BOOKED", "increments Session.booked_seat_count", "increments Session.version by 1", "rejects ratio/overlap/stale-version conflicts"]

  - method: GET
    path: "/attendance-records/{record_id}"
    description: "Get an attendance record"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

  - method: GET
    path: "/attendance-records"
    description: "List/filter attendance records; filter by session_id or enrollment_id"
    roles: [FranchiseAdmin, CenterDirector, Instructor, Parent]
    code: 200
    input: ["session_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []

  - method: POST
    path: "/attendance-records/{record_id}/check-in"
    description: "Mark present; BOOKED -> PRESENT"
    roles: [Instructor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["status -> PRESENT, marked_at set", "increments AttendanceRecord.version by 1"]

  - method: POST
    path: "/attendance-records/{record_id}/mark-absent"
    description: "Mark absent; BOOKED -> ABSENT"
    roles: [Instructor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["status -> ABSENT, marked_at set", "recompute Session.booked_seat_count", "increments AttendanceRecord.version by 1"]

  - method: POST
    path: "/attendance-records/{record_id}/cancel"
    description: "Cancel a booking; BOOKED -> CANCELLED"
    roles: [CenterDirector, Parent]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["status -> CANCELLED", "recompute Session.booked_seat_count (frees seat)", "increments AttendanceRecord.version by 1"]

  # ---- Invoice ------------------------------------------------------------
  - method: POST
    path: "/invoices"
    description: "Create a draft invoice for a family for a billing period (bills enrollment fees + tuition)"
    roles: [CenterDirector]
    code: 201
    input: [family_id, center_id, period_month, expected_family_version]
    output: Invoice
    side_effects: ["status=DRAFT", "computes enrollment_fee_component_cents + tuition_component_cents", "increments Family.version by 1 (OCC parent)"]

  - method: GET
    path: "/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [FranchiseAdmin, CenterDirector, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List/filter invoices; filter by family_id or center_id"
    roles: [FranchiseAdmin, CenterDirector, Parent]
    code: 200
    input: ["family_id?", "center_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{invoice_id}/issue"
    description: "Issue an invoice; DRAFT -> ISSUED (applies wallet, pins total_due_cents)"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> ISSUED", "invoice_total calc pins wallet_applied_cents + total_due_cents", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{invoice_id}/pay"
    description: "Pay an issued invoice; ISSUED -> PAID"
    roles: [Parent, CenterDirector]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["status -> PAID", "deduct wallet_applied_cents from Family.wallet_credit_cents", "compute royalty_owed_cents", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{invoice_id}/void"
    description: "Void an invoice; {DRAFT,ISSUED} -> VOID"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID", "if was ISSUED: refund wallet_applied_cents to Family.wallet_credit_cents", "increments Invoice.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / existence / request ----
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted, or acting on a resource outside the caller's center/family scope" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, numeric out of declared range" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "Worksheet grade score not in 0..100" }
  # ---- concurrency / state ----
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  # ---- center / agreement ----
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Center activation requires an ACTIVE FranchiseAgreement for the center" }
  - { id: ERR_CENTER_OPERATING, http: 409, condition: "Cannot terminate the agreement of a center that is OPERATING" }
  - { id: ERR_CENTER_NOT_OPERATING, http: 409, condition: "Operation requires the center to be OPERATING (e.g., place/resume enrollment, open session)" }
  - { id: ERR_ROYALTY_RATE_INVALID, http: 409, condition: "royalty_rate_bps + marketing_fee_bps exceeds 10000 on activation" }
  - { id: ERR_TERRITORY_CONFLICT, http: 409, condition: "Another Center already uses this territory_code" }
  # ---- enrollment / curriculum ----
  - { id: ERR_DIAGNOSTIC_MISSING, http: 409, condition: "Placement attempted without a diagnostic_raw_score" }
  - { id: ERR_LEVEL_SUBJECT_MISMATCH, http: 409, condition: "A level referenced does not belong to the enrollment's subject" }
  - { id: ERR_PREREQ_CYCLE, http: 409, condition: "prereq_level_id would create a cycle or references a non-lower-rank level" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Worksheet grading/reassign requires the parent enrollment to be ACTIVE" }
  # ---- session / attendance ----
  - { id: ERR_RATIO_EXCEEDED, http: 409, condition: "Booking would exceed Session.seat_cap, or seat_cap exceeds Center.instructor_ratio_cap" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Enrollment already has a BOOKED/PRESENT seat on an overlapping session at the same center" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Instructor already staffs a session whose buffered interval overlaps the new session" }
  - { id: ERR_SESSION_NOT_OPEN, http: 409, condition: "Check-in requires the session to be OPEN" }
  - { id: ERR_SESSION_NOT_STARTED, http: 409, condition: "Cannot close a session before its start_at" }
  # ---- invoice ----
  - { id: ERR_EMPTY_INVOICE, http: 409, condition: "Issuing an invoice with zero billable components" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "Payment amount_cents != Invoice.total_due_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FranchiseAdmin
    description: "Franchisor operator: configures centers, agreements, subjects, curriculum levels; sets system clock. Operational identity not tied to a persisted business entity."
    identity: opaque
    exclusive_operations:
      - "POST /centers, POST /centers/{id}/activate, POST /centers/{id}/suspend"
      - "POST /franchise-agreements and its activate/terminate"
      - "POST /subjects, POST /curriculum-levels"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on centers, subjects, curriculum-levels, families, students, enrollments, worksheets, sessions, attendance-records, invoices, franchise-agreements"
      - "POST /families, POST /students"

  - name: CenterDirector
    description: "Runs day-to-day operations of a single center: enrollment lifecycle, sessions, invoices. X-User-ID is an opaque operator id; scoped to the center(s) it operates (enforced via resource.center_id)."
    identity: opaque
    exclusive_operations:
      - "Enrollment lifecycle: POST /enrollments/{id}/place, /pause, /resume, /withdraw"
      - "Session lifecycle: POST /sessions and /open, /close, /cancel"
      - "Invoice lifecycle: POST /invoices and /issue, /void"
    shared_operations:
      - "POST /families, POST /students, POST /enrollments"
      - "POST /worksheets (shared with Instructor)"
      - "POST /attendance-records, POST /attendance-records/{id}/cancel (shared with Parent)"
      - "POST /invoices/{id}/pay (shared with Parent)"
      - "GET reads across the center's resources"

  - name: Instructor
    description: "Teaches sessions and grades worksheets. X-User-ID is an opaque instructor id recorded on Session.instructor_user_id (audit only); not tied to a persisted entity's id."
    identity: opaque
    exclusive_operations:
      - "POST /worksheets/{id}/grade, POST /worksheets/{id}/reassign"
      - "POST /attendance-records/{id}/check-in, POST /attendance-records/{id}/mark-absent"
    shared_operations:
      - "POST /worksheets (shared with CenterDirector)"
      - "GET reads on subjects, curriculum-levels, students, enrollments, worksheets, sessions, attendance-records"

  - name: Parent
    description: "Family account holder. X-User-ID equals the id of the Family the parent acts as; ownership checks compare X-User-ID to the resource's family_id (directly or via student/enrollment)."
    identity: entity_backed:Family
    exclusive_operations: []
    shared_operations:
      - "POST /students (under own family)"
      - "POST /attendance-records, POST /attendance-records/{id}/cancel (own enrollments)"
      - "POST /invoices/{id}/pay (own family's invoices)"
      - "GET reads scoped to own family: families/{own}, own students, enrollments, worksheets, sessions, attendance-records, invoices"
