            - "BreweryAdmin-only calls succeeded: brewery create, order create, excise draft with prepared_by_user_id == u_admin_1"
            - "Shared operations resolved for either holder: POST /beers accepted from ComplianceOfficer, POST /keg-assets/{id}/movements accepted from TaproomStaff, POST /_clock/set_current_utc accepted from both BreweryAdmin and ComplianceOfficer"
            - "ExciseReport.${report_id}.state == FILED with taproom_bbl 0.004, distribution_bbl 0.000, federal_tax_cents 1, state_tax_cents 2, total_tax_due_cents 3"
