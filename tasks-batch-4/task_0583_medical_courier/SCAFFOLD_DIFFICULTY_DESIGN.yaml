# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Medical Courier & Specimen Logistics — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: route_charge_provisional_vs_final
        grounds:
          - calculations.route_charge
          - entities.Route.fields.provisional_charge_cents
          - entities.Route.fields.final_charge_cents
        distinguishing_aspect: "Same route, identical mileage inputs: provisional (round whole-route mileage once) = 2598 cents while final (round each COMPLETED leg then sum) = 2599 cents — the dual variant lives on the Route cost domain."
        test_recipe:
          setup:
            - "Rate card 500/stop, 133 c/mile, temp fee 800; lab budget 100000; refrigerated vehicle; STANDARD driver valid through 2026-12-31"
            - "SCHEDULED route, planned_total_miles 6.0, 2 stops (PICKUP seq1, DROPOFF seq2), 1 REFRIGERATED BLOOD specimen pickup@s1 dropoff@s2"
            - "Route dispatched (provisional computed), then both stops served with actual legs 2.5 and 3.5 and completed"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true, sanitation_buffer_minutes: 30 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher, captures: { prov: $.data.provisional_charge_cents } }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { fin: $.data.final_charge_cents } }
          assert:
            - "Route.${rt}.provisional_charge_cents == 2598"
            - "Route.${rt}.final_charge_cents == 2599"
            - "Route.${rt}.provisional_charge_cents != Route.${rt}.final_charge_cents"

      - name: specimen_risk_estimated_vs_final
        grounds:
          - calculations.specimen_risk
          - entities.Specimen.fields.estimated_risk_score
          - entities.Specimen.fields.final_risk_score
        distinguishing_aspect: "On the Specimen risk domain (not Route cost): estimated (planned 120-min window) = 22 while final (actual 40-min transit + 1 excursion * 25) = 39 — two valid approaches, different numbers, different entity domain than route_charge."
        test_recipe:
          setup:
            - "BLOOD REFRIGERATED [2,8] specimen on a dispatched route with window 09:00-11:00 (120 min planned)"
            - "Pickup scanned at 09:15 with reading 9.0 (one excursion), dropoff scanned at 09:55 (40-min actual transit)"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 9.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:55:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
          assert:
            - "Specimen.${spec}.estimated_risk_score == 22"
            - "Specimen.${spec}.final_risk_score == 39"
            - "Specimen.${spec}.estimated_risk_score != Specimen.${spec}.final_risk_score"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_charge_conditional_capped_mode_a
        grounds:
          - calculations.route_charge
          - entities.RateCard.fields.stat_surcharge_pct
          - entities.RateCard.fields.stat_surcharge_cap_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (stop count, mileage, temp-specimen count, run_type) with a conditional STAT branch and a nested min-cap — STAT provisional = base 2598 + min(round(2598*0.30)=779, cap 10000) = 3377."
        test_recipe:
          setup:
            - "STAT route, 2 stops, planned 6.0 miles, 1 REFRIGERATED specimen, cap 10000 (surcharge 779 stays below cap)"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "STAT", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher, captures: { prov: $.data.provisional_charge_cents } }
          assert:
            - "Route.${rt}.provisional_charge_cents == 3377"

      - name: final_charge_per_leg_rounding_order_mode_b
        grounds:
          - calculations.route_charge
          - entities.Stop.fields.leg_charge_cents
          - entities.Stop.fields.actual_leg_miles
        distinguishing_aspect: "Mode (b): nested rounding where order matters — rounding each leg (round(2.5*133)=333, round(3.5*133)=466) then summing gives 799 mile-cents, whereas rounding the 6.0-mile total once gives 798; final = 2599, not 2598."
        test_recipe:
          setup:
            - "SCHEDULED route, 2 stops, legs 2.5 and 3.5 actual miles, 1 REFRIGERATED specimen delivered; served and completed"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/complete", payload: {}, as: Dispatcher, captures: { fin: $.data.final_charge_cents } }
          assert:
            - "Stop.${s1}.leg_charge_cents == 833"
            - "Stop.${s2}.leg_charge_cents == 966"
            - "Route.${rt}.final_charge_cents == 2599"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: specimen_parallel_custody_and_integrity
        grounds:
          - state_machines.Specimen.AWAITING_PICKUP_to_IN_TRANSIT
          - state_machines.Specimen.INTACT_to_COMPROMISED
          - entities.Specimen.fields.custody_status
          - entities.Specimen.fields.integrity_status
        distinguishing_aspect: "One PICKUP scan advances the custody dimension (AWAITING_PICKUP->IN_TRANSIT) AND, independently, the integrity dimension (INTACT->COMPROMISED via a 9.0 reading breaching [2,8]) on the SAME Specimen row — two parallel state axes."
        test_recipe:
          setup:
            - "Dispatched route with REFRIGERATED [2,8] specimen; pickup scanned once at 9.0"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 9.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}", captures: { exc: $.data.is_excursion } }
          assert:
            - "Specimen.${spec}.custody_status == IN_TRANSIT"
            - "Specimen.${spec}.integrity_status == COMPROMISED"
            - "Specimen.${spec}.excursion_count == 1"

      - name: stop_cyclic_miss_then_reschedule
        grounds:
          - state_machines.Stop.SCHEDULED_to_MISSED
          - state_machines.Stop.MISSED_to_SCHEDULED
          - entities.Stop.fields.status
        distinguishing_aspect: "The Stop machine is cyclic: SCHEDULED->MISSED (miss) then MISSED->SCHEDULED (reschedule) returns the stop to its original state with arrived_at cleared — a revision loop, not a linear pipeline."
        test_recipe:
          setup:
            - "Dispatched route with a single SCHEDULED stop; the stop is missed then rescheduled"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/miss", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s1}/reschedule", payload: {}, as: Dispatcher }
          assert:
            - "Stop.${s1}.status == SCHEDULED"
            - "Stop.${s1}.arrived_at == null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: miss_stop_depth3_specimen_exception_chain
        grounds:
          - state_machines.Stop.SCHEDULED_to_MISSED
          - state_machines.Specimen.AWAITING_PICKUP_to_EXCEPTION
          - entities.RouteException.fields.exception_type
        distinguishing_aspect: "Depth-3 cascade from the miss trigger: miss -> Stop MISSED (link A->B) -> its AWAITING specimen -> EXCEPTION (link B->C) -> a RouteException(MISSED_STOP, OPEN) row is created (link C->D)."
        test_recipe:
          setup:
            - "Dispatched route; stop s1 (PICKUP) holds one AWAITING specimen (dropoff at s2)"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/stops/${s1}/miss", payload: {}, as: Dispatcher }
          assert:
            - "Stop.${s1}.status == MISSED"
            - "Specimen.${spec}.custody_status == EXCEPTION"
            - "GET /med-courier/exceptions?stop_id=${s1} returns exactly 1 RouteException with exception_type == MISSED_STOP and status == OPEN and specimen_id == ${spec}"

      - name: dropoff_delivery_depth2_stop_autocomplete
        grounds:
          - state_machines.Specimen.IN_TRANSIT_to_DELIVERED
          - state_machines.Stop.ARRIVED_to_COMPLETED
          - entities.Stop.fields.completed_at
        distinguishing_aspect: "Depth-2 cascade from the dropoff-scan trigger (distinct from miss): dropoff scan -> Specimen IN_TRANSIT->DELIVERED (link A->B) -> its dropoff Stop bubble-up ARRIVED->COMPLETED (link B->C)."
        test_recipe:
          setup:
            - "Dispatched route; specimen picked up at s1 (IN_TRANSIT), then dropoff-scanned at s2"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-12-31T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:15:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 2, address: "B", stop_kind: "DROPOFF", planned_leg_miles: 3.5 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/specimens", payload: { pickup_stop_id: "${s1}", dropoff_stop_id: "${s2}", specimen_type: "BLOOD", temp_requirement: "REFRIGERATED", required_temp_min_c: 2, required_temp_max_c: 8 }, as: Dispatcher, captures: { spec: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /med-courier/stops/${s1}/scan", payload: { specimen_id: "${spec}", scan_type: "PICKUP", temp_reading_c: 5.0, leg_miles: 2.5 }, as: Driver, as_user_id: "${drv}" }
          trigger:
            - { call: "POST /med-courier/stops/${s2}/scan", payload: { specimen_id: "${spec}", scan_type: "DROPOFF", temp_reading_c: 5.0, leg_miles: 3.5 }, as: Driver, as_user_id: "${drv}" }
          assert:
            - "Specimen.${spec}.custody_status == DELIVERED"
            - "Stop.${s2}.status == COMPLETED"
            - "Stop.${s2}.completed_at != null"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_beats_budget
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_ROUTE_INVALID_STATE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: "state (priority 5) vs business_fiscal (priority 17): dispatching a PLANNED route (never assigned) whose provisional charge (>= 500) also exceeds a budget of 1 returns ERR_ROUTE_INVALID_STATE, proving state outranks fiscal."
        test_recipe:
          setup:
            - "Lab budget 1; route PLANNED (unassigned) with 1 stop; provisional would far exceed 1"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 1 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt: $.data.id } }
            - { call: "POST /med-courier/routes/${rt}/stops", payload: { sequence: 1, address: "A", stop_kind: "PICKUP", planned_leg_miles: 2.5 }, as: Dispatcher, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /med-courier/routes/${rt}/dispatch", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROUTE_INVALID_STATE"

      - name: assign_credential_beats_schedule_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_DRIVER_CREDENTIAL_INVALID]
          - errors[ERR_DRIVER_SCHEDULE_CONFLICT]
        distinguishing_aspect: "business_safety (priority 7) vs business_constraint (priority 12): assigning a driver whose credential has lapsed AND who already holds an overlapping route returns ERR_DRIVER_CREDENTIAL_INVALID — a different category pair than the state/fiscal conflict."
        test_recipe:
          setup:
            - "Driver credential expires 2026-05-10; assigned to route1 (05-05 09:00-11:00) while valid at clock 05-01"
            - "Clock advanced to 2026-05-11 (credential now lapsed); route2 (05-05 10:00-12:00) overlaps route1; assigned with a second AVAILABLE vehicle"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
            - { call: "POST /med-courier/lab-clients", payload: { name: "Lab", budget_cents: 100000 }, as: Dispatcher, captures: { lab: $.data.id } }
            - { call: "POST /med-courier/drivers", payload: { name: "Drv", credential_type: "STANDARD", credential_expiry: "2026-05-10T00:00:00Z" }, as: Dispatcher, captures: { drv: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V1", has_refrigeration: true }, as: Dispatcher, captures: { veh1: $.data.id } }
            - { call: "POST /med-courier/vehicles", payload: { plate: "V2", has_refrigeration: true }, as: Dispatcher, captures: { veh2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T11:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt1: $.data.id } }
            - { call: "POST /med-courier/routes/${rt1}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh1}" }, as: Dispatcher }
            - { call: "POST /med-courier/routes", payload: { lab_client_id: "${lab}", rate_card_id: "${rc}", run_type: "SCHEDULED", scheduled_start: "2026-05-05T10:00:00Z", scheduled_end: "2026-05-05T12:00:00Z", planned_total_miles: 6.0 }, as: Dispatcher, captures: { rt2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /med-courier/routes/${rt2}/assign", payload: { driver_id: "${drv}", vehicle_id: "${veh2}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DRIVER_CREDENTIAL_INVALID"

