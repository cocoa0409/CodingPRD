      - name: expired_qualification_is_requalified_by_the_annual_retraining
        claim_type: cyclic_shape
        grounds:
          - 'state_machines.VolunteerQualification.EXPIRED_to_QUALIFIED'
          - 'state_machines.Volunteer.INACTIVE_to_ACTIVE'
          - 'endpoints."POST /volunteers/{volunteer_id}/retraining"'
        distinguishing_aspect: "At clock 2027-04-02 both the volunteer (retraining_due_at 2027-04-01) and the qualification (expires_at 2027-04-01) have lapsed; one retraining call restores both, giving expires_at 2028-04-01T00:00:00.000Z."
        test_recipe:
          setup: ["Volunteer Sam registered with last_retraining_on 2026-04-01 and a SIDEWALKER qualification signed off on 2026-04-01; the clock is then moved to 2027-04-02T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /volunteers"
              payload: { full_name: "Sam Sidewalker", date_of_birth: "2000-02-02", last_retraining_on: "2026-04-01" }
              as: VolunteerCoordinator
              captures: { v_id: "$.data.id", v_due: "$.data.retraining_due_at" }
            - call: "POST /volunteers/${v_id}/qualifications"
              payload: { crew_role: "SIDEWALKER", training_hours: 6 }
              as: VolunteerCoordinator
              captures: { q_id: "$.data.id" }
            - call: "POST /volunteer-qualifications/${q_id}/sign-off"
              payload: { signed_off_on: "2026-04-01" }
              as: VolunteerCoordinator
              captures: { q_exp: "$.data.expires_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /volunteer-qualifications/${q_id}"
              payload: {}
              as: VolunteerCoordinator
              captures: { q_status_before: "$.data.status" }
            - call: "POST /volunteers/${v_id}/retraining"
              payload: { completed_on: "2027-04-02" }
              as: VolunteerCoordinator
              captures: { v_status_after: "$.data.status" }
            - call: "GET /volunteer-qualifications/${q_id}"
              payload: {}
              as: VolunteerCoordinator
              captures: { q_status_after: "$.data.status", q_exp_after: "$.data.expires_at" }
          assert:
            - "${v_due} == 2027-04-01T00:00:00.000Z and ${q_exp} == 2027-04-01T00:00:00.000Z"
            - "${q_status_before} == EXPIRED and Volunteer.${v_id}.status was INACTIVE"
            - "${v_status_after} == ACTIVE"
            - "${q_status_after} == QUALIFIED and ${q_exp_after} == 2028-04-01T00:00:00.000Z"

