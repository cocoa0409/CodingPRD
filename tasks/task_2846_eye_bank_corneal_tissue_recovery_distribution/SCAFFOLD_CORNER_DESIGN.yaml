      - name: deferring_an_approved_donor_aborts_the_open_dispatch_and_frees_the_technician
        claim_type: side_effect_execution
        grounds:
          - state_machines.Donor.APPROVED_FOR_RECOVERY_to_DEFERRED
          - state_machines.Recovery.DISPATCHED_to_ABORTED
          - entities.Technician.fields.open_dispatch_count
          - "endpoints[POST /eye-bank/donors/{id}/defer]"
        distinguishing_aspect: |
          One defer call fires the whole declared side-effect set: the donor lands in DEFERRED
          with deferral_reason recorded, its single DISPATCHED recovery becomes ABORTED with
          abort_reason DONOR_DEFERRED, and the technician's open_dispatch_count drops 1 -> 0 with
          Technician.version reaching 3 (create 1, dispatch 2, abort cascade 3).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one RECOVERY_ONLY technician; one donor in APPROVED_FOR_RECOVERY with a NON_REACTIVE panel"
            - "one Recovery in DISPATCHED for that donor/technician (dispatched 06:30, planned release 10:00), so open_dispatch_count == 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
