  # ---- Voucher ----
  - method: POST
    path: "/vouchers"
    description: "Create a draft voucher (panel fee or service)"
    roles: [Attorney]
    code: 201
    input: [case_id, attorney_id, voucher_type, claimed_hours, "service_request_id?"]
    output: Voucher
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/vouchers/{voucherId}"
    description: "Get a voucher"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: GET
    path: "/vouchers"
    description: "List vouchers; filter by case_id/attorney_id/service_request_id (reverse-reachability for all three FKs)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["case_id?", "attorney_id?", "service_request_id?", "status?", "limit?", "offset?"]
    output: "Voucher[]"
    side_effects: []

  - method: POST
    path: "/vouchers/{voucherId}/submit"
    description: "Submit a draft voucher for approval"
    roles: [Attorney]
    code: 200
    input: []
    output: Voucher
    side_effects: ["status -> SUBMITTED (panel requires case DISPOSED; service requires SR COMPLETED)"]

  - method: POST
    path: "/vouchers/{voucherId}/approve"
    description: "Approve a submitted voucher (computes approved_amount; debits office budget)"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: Voucher
    side_effects:
      - "approved_amount_cents computed; status -> APPROVED"
      - "office voucher_spent_cents += approved_amount_cents; may flip office -> RESTRICTED"

  - method: POST
    path: "/vouchers/{voucherId}/reject"
    description: "Reject a submitted voucher"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: Voucher
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vouchers/{voucherId}/revise"
    description: "Return a rejected voucher to draft for revision"
    roles: [Attorney]
    code: 200
    input: []
    output: Voucher
    side_effects: ["status -> DRAFT; approved_amount_cents reset to 0"]

  - method: POST
    path: "/vouchers/{voucherId}/void"
    description: "Void an approved voucher (compensates office budget)"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: Voucher
    side_effects:
      - "status -> VOIDED; office voucher_spent_cents -= approved_amount_cents; may flip office -> OPEN"

  # ---- RecoupmentOrder (cascade-created; discovered via list) ----
  - method: GET
    path: "/recoupment-orders/{recoupmentOrderId}"
    description: "Get a recoupment order"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: []
    output: RecoupmentOrder
    side_effects: []

  - method: GET
    path: "/recoupment-orders"
    description: "List recoupment orders; filter by case_id (reverse-reachability for RecoupmentOrder.case_id)"
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: "RecoupmentOrder[]"
    side_effects: []

  - method: POST
    path: "/recoupment-orders/{recoupmentOrderId}/collect"
    description: "Record a recoupment collection"
    roles: [SupervisingAttorney]
    code: 200
    input: [amount_cents]
    output: RecoupmentOrder
    side_effects: ["collected_amount_cents += amount_cents; -> PARTIALLY_COLLECTED or SATISFIED"]

  - method: POST
    path: "/recoupment-orders/{recoupmentOrderId}/waive"
    description: "Waive a recoupment order (segregation-of-duties enforced)"
    roles: [SupervisingAttorney]
    code: 200
    input: []
    output: RecoupmentOrder
    side_effects: ["status -> WAIVED, waived_by_user_id set"]

  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [IntakeClerk, ScreeningOfficer, AssignmentCoordinator, SupervisingAttorney, Attorney]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth --
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Attorney acting on a Voucher whose attorney_id != X-User-ID" }
  # -- request validation --
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, hours<=0, income<0, size<1, or scheduled_end not strictly after scheduled_start" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version != Case.version on reassign (OCC)" }
  # -- not found --
  - { id: ERR_OFFICE_NOT_FOUND, http: 404, condition: "DefenderOffice id does not exist" }
  - { id: ERR_ATTORNEY_NOT_FOUND, http: 404, condition: "Attorney id does not exist" }
  - { id: ERR_COURTROOM_NOT_FOUND, http: 404, condition: "Courtroom id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Case id does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "FinancialScreening id does not exist" }
  - { id: ERR_CONFLICT_CHECK_NOT_FOUND, http: 404, condition: "ConflictCheck id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Assignment id does not exist" }
  - { id: ERR_COURT_EVENT_NOT_FOUND, http: 404, condition: "CourtEvent id does not exist" }
  - { id: ERR_SERVICE_REQUEST_NOT_FOUND, http: 404, condition: "ServiceRequest id does not exist" }
  - { id: ERR_VOUCHER_NOT_FOUND, http: 404, condition: "Voucher id does not exist" }
  - { id: ERR_RECOUPMENT_ORDER_NOT_FOUND, http: 404, condition: "RecoupmentOrder id does not exist" }
  # -- state --
  - { id: ERR_CASE_NOT_SCREENED, http: 409, condition: "Assignment requires Case.status == SCREENED" }
  - { id: ERR_CASE_NOT_ASSIGNED, http: 409, condition: "Operation requires Case.status == ASSIGNED (reassign/dispose/court-event/service-request)" }
  - { id: ERR_CASE_NOT_DISPOSED, http: 409, condition: "PANEL_FEE voucher submit requires Case.status == DISPOSED" }
  - { id: ERR_SCREENING_ALREADY_DECIDED, http: 409, condition: "decide called on a screening already DECIDED" }
  - { id: ERR_ATTORNEY_NOT_ACTIVE, http: 409, condition: "Target attorney is SUSPENDED (assign/reassign) or suspend called on already SUSPENDED" }
  - { id: ERR_SERVICE_REQUEST_NOT_APPROVED, http: 409, condition: "complete requires ServiceRequest.status == APPROVED, or approve called from wrong state" }
  - { id: ERR_SERVICE_REQUEST_NOT_COMPLETED, http: 409, condition: "SERVICE voucher submit requires linked ServiceRequest.status == COMPLETED" }
  - { id: ERR_VOUCHER_INVALID_STATE, http: 409, condition: "Voucher transition attempted from an incompatible status" }
  - { id: ERR_COURT_EVENT_NOT_SCHEDULED, http: 409, condition: "vacate requires CourtEvent.status == SCHEDULED" }
  - { id: ERR_RECOUPMENT_NOT_COLLECTIBLE, http: 409, condition: "collect/waive requires RecoupmentOrder.status in {ASSESSED, PARTIALLY_COLLECTED}" }
  # -- business --
  - { id: ERR_SCREENING_ALREADY_EXISTS, http: 409, condition: "A FinancialScreening already exists for this case" }
  - { id: ERR_CONFLICT_NOT_CLEARED, http: 409, condition: "No CLEAR ConflictCheck exists for (case, attorney) at assignment/reassignment" }
  - { id: ERR_CASELOAD_CAPACITY_EXCEEDED, http: 409, condition: "Attorney ACTIVE load + candidate weight would exceed max_weighted_caseload" }
  - { id: ERR_EVENT_IN_PAST, http: 409, condition: "scheduled_start is before the current logical clock" }
  - { id: ERR_ATTORNEY_SCHEDULE_CONFLICT, http: 409, condition: "New event within 30-min buffer of another SCHEDULED event of the same attorney" }
  - { id: ERR_COURTROOM_DOUBLE_BOOKED, http: 409, condition: "New event overlaps another SCHEDULED event in the same courtroom" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Recoupment waiver X-User-ID equals the case screening's decided_by_user_id" }
  - { id: ERR_BUDGET_RESTRICTED, http: 402, condition: "ServiceRequest approval attempted while office budget_status == RESTRICTED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeClerk
    description: "Handles case referral/intake and submits financial screenings"
    identity: opaque
    exclusive_operations:
      - "POST /cases — refer a case"
      - "POST /financial-screenings — submit screening"
    shared_operations:
      - "GET endpoints (read)"

  - name: ScreeningOfficer
    description: "Decides financial eligibility"
    identity: opaque
    exclusive_operations:
      - "POST /financial-screenings/{screeningId}/decide"
    shared_operations:
      - "GET endpoints (read)"

  - name: AssignmentCoordinator
    description: "Runs conflict checks, assigns/reassigns attorneys, calendars court events, requests services, disposes cases"
    identity: opaque
    exclusive_operations:
      - "POST /conflict-checks"
      - "POST /assignments"
      - "POST /cases/{caseId}/reassign"
      - "POST /cases/{caseId}/adjust-weight"
      - "POST /cases/{caseId}/dispose"
      - "POST /court-events, POST /court-events/{courtEventId}/vacate"
      - "POST /service-requests, POST /service-requests/{serviceRequestId}/complete"
    shared_operations:
      - "GET endpoints (read)"

  - name: SupervisingAttorney
    description: "Administers offices/attorneys/courtrooms; approves service requests, vouchers, and recoupment"
    identity: opaque
    exclusive_operations:
      - "POST /defender-offices, POST /attorneys, POST /courtrooms"
      - "POST /attorneys/{attorneyId}/suspend, POST /attorneys/{attorneyId}/reactivate"
      - "POST /service-requests/{serviceRequestId}/approve"
      - "POST /vouchers/{voucherId}/approve, POST /vouchers/{voucherId}/reject, POST /vouchers/{voucherId}/void"
      - "POST /recoupment-orders/{recoupmentOrderId}/collect, POST /recoupment-orders/{recoupmentOrderId}/waive"
    shared_operations:
      - "GET endpoints (read)"

  - name: Attorney
    description: "Panel/staff attorney; authors and submits own vouchers"
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /vouchers (attorney_id must equal X-User-ID)"
      - "POST /vouchers/{voucherId}/submit, POST /vouchers/{voucherId}/revise"
    shared_operations:
      - "GET endpoints (read)"
