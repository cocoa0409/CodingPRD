scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_event_success_with_computed_fields
        claim_type: Creation
        grounds: ["entities.Event.fields.required_bartender_count", "entities.Event.fields.billable_hours"]
        distinguishing_aspect: "POST /events returns 201 with system defaults (booking_status=DRAFT, payment_status=UNPAID, version=1) and computed billable_hours=5, required_bartender_count=2."
        test_recipe:
          setup: ["A CLASSIC package; one 80-guest, 5h event."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Event.${event_id}.booking_status == DRAFT"
            - "Event.${event_id}.payment_status == UNPAID"
            - "Event.${event_id}.version == 1"
            - "Event.${event_id}.billable_hours == 5"
            - "Event.${event_id}.required_bartender_count == 2"

      - name: get_event_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /events/{id} with a non-existent UUID returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_EVENT_NOT_FOUND"

      - name: create_event_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.Event.fields.guest_count", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /events without guest_count returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A client and package exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_event_invalid_time_range
        claim_type: Type Constraints
        grounds: ["entities.Event.fields.event_end", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /events with event_end <= event_start returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A client and package exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Bad", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T23:00:00Z", event_end: "2026-06-01T18:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_event_client_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Event.fields.client_id", "errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /events referencing a non-existent client_id returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["A package exists; client_id is bogus."]
          setup_api_calls:
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "00000000-0000-0000-0000-000000000000", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CLIENT_NOT_FOUND"

      - name: bartender_reliability_empty_history_baseline
        claim_type: Computed Fields
        grounds: ["calculations.bartender_reliability_score", "entities.Bartender.fields.reliability_score_strict"]
        distinguishing_aspect: "A newly created bartender with zero assignment history has reliability_score_strict == 100 and reliability_score_lenient == 100 (empty-set boundary)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
          trigger:
            - call: "GET /bartenders/${bartender_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Bartender.${bartender_id}.reliability_score_strict == 100"
            - "Bartender.${bartender_id}.reliability_score_lenient == 100"
            - "Bartender.${bartender_id}.availability_status == AVAILABLE"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_event_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Event.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED event returns ERR_INVALID_STATE (409); terminal-state lockdown."
        test_recipe:
          setup: ["A DRAFT event already cancelled."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: checkin_before_confirm_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Assignment.CONFIRMED_to_CHECKED_IN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking in a PROPOSED (not yet CONFIRMED) assignment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PROPOSED assignment on a DRAFT event."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T17:00:00Z", shift_end: "2026-06-01T23:30:00Z", role_on_event: "BACK", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: Bartender
              as_user_id: "${bartender_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: kit_return_before_deploy_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.KitReservation.DEPLOYED_to_RETURNED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Returning a RESERVED (not DEPLOYED) kit reservation returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A RESERVED kit reservation on an event."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bar-kits"
              payload: { kit_name: "Full Bar A", station_type: "FULL_BAR", glassware_count: 200 }
              as: PlatformAdmin
              captures: { kit_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/kit-reservations"
              payload: { kit_id: "${kit_id}", reserve_start: "2026-06-01T16:00:00Z", reserve_end: "2026-06-02T00:00:00Z" }
              as: Coordinator
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /kit-reservations/${resv_id}/return"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: compliance_clear_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.ComplianceReview.SUBMITTED_to_CLEARED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Clearing a DRAFT (never SUBMITTED) compliance review returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT compliance review."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "HOST_NO_SALE", liquor_liability_insurance_verified: true, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_of_new_event_is_draft
        claim_type: initial_state
        grounds: ["state_machines.Event.DRAFT_to_CONFIRMED"]
        excluded_because:
          difficulty_instance: dual_variant_calc / event_charge_provisional_vs_final_diverge
          rationale: "Event creation and its DRAFT initial state are exercised by the §1.8 provisional-vs-final instance's trigger."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: assignment_labor_cost_regular_hours
        claim_type: Correct Result
        grounds: ["calculations.assignment_labor_cost", "entities.Assignment.fields.labor_cost_cents"]
        distinguishing_aspect: "A 5.5h shift at 4000/hr (no overtime) yields labor_cost_cents == 22000."
        test_recipe:
          setup: ["A bartender at 4000/hr and a DRAFT event; one 5.5h assignment."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T18:00:00Z", shift_end: "2026-06-01T23:30:00Z", role_on_event: "BACK", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
          assert:
            - "Assignment.${asg_id}.shift_hours == 5.5"
            - "Assignment.${asg_id}.labor_cost_cents == 22000"

      - name: assignment_labor_cost_overtime
        claim_type: Correct Result
        grounds: ["calculations.assignment_labor_cost", "entities.Assignment.fields.labor_cost_cents"]
        distinguishing_aspect: "A 10h shift at 4000/hr crosses OT_THRESHOLD_HOURS=8: labor_cost_cents == 44000 (8*4000 + 2*4000*1.5)."
        test_recipe:
          setup: ["A bartender at 4000/hr and a DRAFT event; one 10h assignment."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T13:00:00Z", shift_end: "2026-06-01T23:00:00Z", role_on_event: "LEAD", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
          assert:
            - "Assignment.${asg_id}.shift_hours == 10"
            - "Assignment.${asg_id}.labor_cost_cents == 44000"

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: compliance_clear_abc_model_invalid
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_ABC_MODEL_INVALID]"]
        distinguishing_aspect: "Clearing a review whose abc_model == CASH_BAR (not HOST_NO_SALE) returns ERR_ABC_MODEL_INVALID (422)."
        test_recipe:
          setup: ["A SUBMITTED review with abc_model=CASH_BAR."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "CASH_BAR", liquor_liability_insurance_verified: true, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ABC_MODEL_INVALID"

      - name: compliance_clear_insurance_not_verified
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_INSURANCE_NOT_VERIFIED]"]
        distinguishing_aspect: "Clearing a HOST_NO_SALE review with liquor_liability_insurance_verified=false returns ERR_INSURANCE_NOT_VERIFIED (422)."
