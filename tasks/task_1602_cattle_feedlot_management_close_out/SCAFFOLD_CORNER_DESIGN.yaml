      - name: hedge_expiry_settles_at_entry
        claim_type: correct_result
        grounds: [state_machines.HedgePosition.OPEN_to_EXPIRED, calculations.hedge_pnl]
        distinguishing_aspect: "A hedge whose contract month begins while OPEN expires with exit := entry and realized_pnl 0; the lot P&L accumulator is unchanged."
        test_recipe:
          setup: ["Lot L-HE (80 head, marketable 1200 cwt); hedge H of 1 contract for 2026-09 at 19000c; clock advanced to 2026-08-15"]
          setup_api_calls:
