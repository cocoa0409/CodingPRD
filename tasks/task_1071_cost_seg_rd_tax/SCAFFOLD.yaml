# =============================================================================
# Cost-Segregation & R&D Tax-Credit Service — seed tables (v1)
# =============================================================================

scenario: |
  1071. Cost-Segregation & R&D Tax-Credit Service: study scope & asset/property,
  engineering allocation & depreciation, tax-benefit calc & documentation,
  audit-support & report, fee (fixed/%), CPA coordination, look-back/amended,
  deliverable

domain_name: cost-seg-rd-tax
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation      # same depreciation inputs, two methods (with/without bonus) → different benefit; regular vs ASC credit
  secondary_archetype: workflow_orchestration    # study lifecycle scope→engineering→review→finalize→deliver with revision loop
  complexity_layers:
    - dual_variant_calculation                   # with-bonus vs without-bonus; regular vs ASC
    - cascading_side_effects                      # finalize → report issue → fee invoice → client ledger
    - optimistic_concurrency                      # amended-return create supersedes prior; OCC on Study.version
    - rate_threshold_triggers                     # bonus % by placed-in-service year; fee-% cap; contract-research 65% cap
  entity_topology: flat                           # peer entities linked by FK ids in bodies; no deep nested URL ownership beyond one level
  state_machine_shape: cyclic                     # Study IN_REVIEW↔ENGINEERING and Report DRAFT↔REVISION_REQUESTED loops
  relationship_patterns:
    - one_to_many                                 # Study has many AssetComponents / QreLineItems / Reports / FeeInvoices
    - cross_aggregate                             # fee depends on benefit calc; SoD compares Reviewer id to Study.assigned_engineer_id
  role_model: segregation_of_duties               # preparer (assigned Engineer) cannot approve/finalize as Reviewer
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Taxpayer legal name" }
      - { name: entity_type, type: enum, source: input, description: "C_CORP | S_CORP | PARTNERSHIP | INDIVIDUAL", constraints: "one of C_CORP, S_CORP, PARTNERSHIP, INDIVIDUAL" }
      - { name: marginal_tax_rate, type: number, source: input, description: "Marginal federal tax rate as a decimal in [0,1], applied to depreciation deductions to yield tax benefit", constraints: ">= 0 and <= 1" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE", default: ONBOARDING, constraints: "one of ONBOARDING, ACTIVE" }
      - { name: outstanding_fee_cents, type: integer, source: computed, description: "Sum of amount_cents over this client's FeeInvoices in status ISSUED (not PAID, not VOID); conserved quantity for the fee-ledger invariant", default: 0 }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning taxpayer" }
      - { name: address, type: string, source: input, description: "Property street address" }
      - { name: building_type, type: enum, source: input, description: "COMMERCIAL | RESIDENTIAL_RENTAL | INDUSTRIAL", constraints: "one of COMMERCIAL, RESIDENTIAL_RENTAL, INDUSTRIAL" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Total acquisition price in cents", constraints: "> 0" }
      - { name: land_value_cents, type: integer, source: input, description: "Non-depreciable land value in cents", constraints: ">= 0 and < purchase_price_cents" }
      - { name: placed_in_service_date, type: datetime, source: input, description: "ISO 8601 UTC date the building was placed in service; its calendar year selects the bonus-depreciation percentage" }
      - { name: depreciable_basis_cents, type: integer, source: computed, description: "purchase_price_cents - land_value_cents; upper bound on total allocated component cost" }

  - name: Engineer
    parent: null
    common_fields: false     # id, created_at only — immutable staff record backing Engineer and Reviewer roles
    fields:
      - { name: full_name, type: string, source: input, description: "Engineer full name" }
      - { name: email, type: string, source: input, description: "Engineer contact email" }

  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the taxpayer this study is performed for" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the studied building. Null until scoped; required for COST_SEGREGATION studies at scope time", default: null }
      - { name: assigned_engineer_id, type: string, source: input, description: "FK -> Engineer.id; the preparer engineer. Null until assign-engineer. The finalizing Reviewer MUST NOT equal this id (segregation of duties)", default: null }
      - { name: study_type, type: enum, source: input, description: "COST_SEGREGATION | RD_CREDIT", constraints: "one of COST_SEGREGATION, RD_CREDIT" }
      - { name: tax_year, type: integer, source: input, description: "Tax year the study applies to (e.g., 2024)" }
      - { name: is_look_back, type: boolean, source: input, description: "True when this is a look-back study eligible for an amended return / §481(a) catch-up", default: false }
      - { name: fee_type, type: enum, source: input, description: "FIXED | PERCENT; set at scope", default: null, constraints: "one of FIXED, PERCENT" }
      - { name: fee_fixed_amount_cents, type: integer, source: input, description: "Flat fee in cents; required when fee_type=FIXED", default: null }
      - { name: fee_percent_bps, type: integer, source: input, description: "Contingent fee in basis points of realized tax benefit; required when fee_type=PERCENT; must be <= MAX_FEE_BPS", default: null }
      - { name: credit_method, type: enum, source: input, description: "REGULAR | ASC; selected R&D credit method for RD_CREDIT studies; set at scope", default: null, constraints: "one of REGULAR, ASC" }
      - { name: fixed_base_pct, type: number, source: input, description: "Fixed-base percentage (decimal) used by the REGULAR credit method", default: null }
      - { name: avg_annual_gross_receipts_cents, type: integer, source: input, description: "Average annual gross receipts in cents used by the REGULAR credit method base amount", default: null }
      - { name: prior_qre_year1_cents, type: integer, source: input, description: "Prior tax year -1 total QRE in cents (ASC base period)", default: 0 }
      - { name: prior_qre_year2_cents, type: integer, source: input, description: "Prior tax year -2 total QRE in cents (ASC base period)", default: 0 }
      - { name: prior_qre_year3_cents, type: integer, source: input, description: "Prior tax year -3 total QRE in cents (ASC base period)", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SCOPING | ENGINEERING | IN_REVIEW | FINALIZED | DELIVERED | CANCELLED", default: DRAFT, constraints: "one of DRAFT, SCOPING, ENGINEERING, IN_REVIEW, FINALIZED, DELIVERED, CANCELLED" }
      - { name: reviewer_engineer_id, type: string, source: system, description: "Engineer.id of the Reviewer who finalized the study; stamped at finalize; null before", default: null }
      - { name: total_allocated_cost_cents, type: integer, source: computed, description: "Sum of allocated_cost_cents over this study's AssetComponents in status ALLOCATED; conserved quantity for the allocation invariant", default: 0 }
      - { name: first_year_depreciation_cents, type: integer, source: computed, description: "WITH_BONUS first-year depreciation over ALLOCATED components (cost-seg)", default: 0 }
      - { name: first_year_depreciation_no_bonus_cents, type: integer, source: computed, description: "WITHOUT_BONUS first-year depreciation over ALLOCATED components (cost-seg)", default: 0 }
      - { name: rd_credit_regular_cents, type: integer, source: computed, description: "R&D credit under the REGULAR method over QUALIFIED QreLineItems", default: 0 }
      - { name: rd_credit_asc_cents, type: integer, source: computed, description: "R&D credit under the ASC method over QUALIFIED QreLineItems", default: 0 }
      - { name: estimated_tax_benefit_cents, type: integer, source: computed, description: "Realized benefit basis used for percent fees: for COST_SEGREGATION = round(first_year_depreciation_cents * client.marginal_tax_rate); for RD_CREDIT = the selected credit_method's credit", default: 0 }
      - { name: section_481a_cents, type: integer, source: computed, description: "§481(a) catch-up adjustment stamped when an amended return is filed; 0 before", default: 0 }

  - name: AssetComponent
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the cost-seg study this component belongs to" }
      - { name: component_name, type: string, source: input, description: "Component description (e.g., 'site paving')" }
      - { name: asset_class, type: enum, source: input, description: "FIVE_YEAR | SEVEN_YEAR | FIFTEEN_YEAR | THIRTY_NINE_YEAR", constraints: "one of FIVE_YEAR, SEVEN_YEAR, FIFTEEN_YEAR, THIRTY_NINE_YEAR" }
      - { name: allocated_cost_cents, type: integer, source: input, description: "Cost reclassified to this component in cents", constraints: "> 0" }
      - { name: recovery_period_years, type: integer, source: computed, description: "5 | 7 | 15 | 39 derived from asset_class" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ALLOCATED | EXCLUDED", default: PROPOSED, constraints: "one of PROPOSED, ALLOCATED, EXCLUDED" }

  - name: QreLineItem
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the R&D study this expense line belongs to" }
      - { name: qre_category, type: enum, source: input, description: "WAGES | SUPPLIES | CONTRACT_RESEARCH", constraints: "one of WAGES, SUPPLIES, CONTRACT_RESEARCH" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Gross expense amount in cents", constraints: "> 0" }
      - { name: qualified_percent, type: number, source: input, description: "Fraction of gross that is qualified, decimal in (0,1]; CONTRACT_RESEARCH is additionally capped at CONTRACT_RESEARCH_CAP when computing qualified_amount", constraints: "> 0 and <= 1" }
      - { name: qualified_amount_cents, type: integer, source: computed, description: "round_half_up(gross_amount_cents * effective_percent); effective_percent = min(qualified_percent, CONTRACT_RESEARCH_CAP) for CONTRACT_RESEARCH else qualified_percent; set on qualify", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | QUALIFIED", default: DRAFT, constraints: "one of DRAFT, QUALIFIED" }

  - name: Report
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the study this deliverable documents" }
      - { name: report_type, type: enum, source: computed, description: "COST_SEG_REPORT | RD_CREDIT_REPORT, derived from study.study_type" }
      - { name: revision_count, type: integer, source: system, description: "Number of revision rounds; incremented each time the report returns from REVISION_REQUESTED to DRAFT", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp when the report was ISSUED; null before", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | REVISION_REQUESTED | ISSUED | SUPERSEDED", default: DRAFT, constraints: "one of DRAFT, REVISION_REQUESTED, ISSUED, SUPERSEDED" }

  - name: AuditSupportCase
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the delivered study under IRS examination" }
      - { name: irs_notice_ref, type: string, source: input, description: "IRS notice / examination reference" }
      - { name: resolution_note, type: string, source: input, description: "Free-text resolution summary; set on resolve", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED", default: OPEN, constraints: "one of OPEN, RESOLVED" }

  - name: AmendedReturn
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the look-back study being amended" }
      - { name: amended_tax_year, type: integer, source: input, description: "Tax year of the amended return" }
      - { name: section_481a_cents, type: integer, source: computed, description: "§481(a) catch-up adjustment computed on file", default: 0 }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp when filed; null before", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED", default: DRAFT, constraints: "one of DRAFT, FILED" }

  - name: FeeInvoice
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> Study.id; the study this fee bills for" }
      - { name: amount_cents, type: integer, source: system, description: "Fee amount in cents computed by the study_fee calculation at creation" }
      - { name: fee_basis, type: enum, source: system, description: "FIXED | PERCENT, copied from study.fee_type at creation", constraints: "one of FIXED, PERCENT" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID", default: ISSUED, constraints: "one of ISSUED, PAID, VOID" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: StudyManager
        preconditions: []
        side_effects: ["Client eligible to own Studies (studies may now be created for it)"]

  - entity: Study
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPING
        trigger: "POST /studies/{id}/scope"
        actor: StudyManager
        preconditions:
          - "fee_type provided; if FIXED then fee_fixed_amount_cents present, if PERCENT then fee_percent_bps present and <= MAX_FEE_BPS (ERR_FEE_PERCENT_TOO_HIGH)"
          - "For COST_SEGREGATION: property_id present and references a Property owned by study.client_id; no other non-CANCELLED COST_SEGREGATION Study exists for that property whose tax_year equals this study's tax_year (ERR_PROPERTY_STUDY_OVERLAP)"
          - "For RD_CREDIT: credit_method present; no other non-CANCELLED RD_CREDIT Study for the same client_id has a base period [tax_year-3, tax_year) overlapping this study's base period (ERR_RD_BASE_PERIOD_OVERLAP)"
        side_effects:
          - "fee_type / fee_fixed_amount_cents / fee_percent_bps recorded"
          - "property_id recorded (COST_SEGREGATION); credit_method + REGULAR/ASC params recorded (RD_CREDIT)"

      - from: SCOPING
        to: ENGINEERING
        trigger: "POST /studies/{id}/assign-engineer"
        actor: StudyManager
        preconditions: ["assigned_engineer_id references an existing Engineer"]
        side_effects: ["assigned_engineer_id recorded (this is the preparer for SoD)"]

      - from: ENGINEERING
        to: IN_REVIEW
        trigger: "POST /studies/{id}/submit-review"
        actor: Engineer
        preconditions:
          - "For COST_SEGREGATION: at least one AssetComponent in status ALLOCATED (ERR_NO_ALLOCATED_COMPONENTS)"
          - "For RD_CREDIT: at least one QreLineItem in status QUALIFIED (ERR_NO_QUALIFIED_QRE)"
        side_effects:
          - "Recompute benefit fields (first_year_depreciation_cents, first_year_depreciation_no_bonus_cents, rd_credit_regular_cents, rd_credit_asc_cents, estimated_tax_benefit_cents) per §1.3"
          - "If no Report exists for this study: create Report in DRAFT (revision_count=0). If a Report exists in REVISION_REQUESTED: transition it REVISION_REQUESTED->DRAFT and increment its revision_count by 1"

      - from: IN_REVIEW
        to: ENGINEERING
        trigger: "POST /studies/{id}/reject"
        actor: Reviewer
        preconditions: ["acting Reviewer's engineer id MUST differ from assigned_engineer_id (ERR_SOD_VIOLATION)"]
        side_effects:
          - "This study's Report transitions DRAFT->REVISION_REQUESTED"

      - from: IN_REVIEW
        to: FINALIZED
        trigger: "POST /studies/{id}/finalize"
        actor: Reviewer
        preconditions: ["acting Reviewer's engineer id MUST differ from assigned_engineer_id (ERR_SOD_VIOLATION)"]
        side_effects:
          - "reviewer_engineer_id stamped with the acting Reviewer's id"
          - "CASCADE link1: this study's Report transitions DRAFT->ISSUED, issued_at stamped from the logical clock"
          - "CASCADE link2: Report ISSUED triggers creation of a FeeInvoice (status ISSUED) whose amount_cents is the study_fee calculation over estimated_tax_benefit_cents; fee_basis = fee_type"
          - "CASCADE link3: FeeInvoice ISSUED triggers client.outstanding_fee_cents += amount_cents"

      - from: FINALIZED
        to: DELIVERED
        trigger: "POST /studies/{id}/deliver"
        actor: CPA
        preconditions: []
        side_effects: ["Deliverable accepted by the client's CPA"]

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /studies/{id}/cancel"
        actor: StudyManager
        preconditions: []
        side_effects: []
      - from: SCOPING
        to: CANCELLED
        trigger: "POST /studies/{id}/cancel"
        actor: StudyManager
        preconditions: []
        side_effects: []
      - from: ENGINEERING
        to: CANCELLED
        trigger: "POST /studies/{id}/cancel"
        actor: StudyManager
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /studies/{id}/cancel"
        actor: StudyManager
        preconditions: []
        side_effects: []

  - entity: AssetComponent
    initial_state: PROPOSED
    terminal_states: [EXCLUDED]
    transitions:
      - from: PROPOSED
        to: ALLOCATED
        trigger: "POST /asset-components/{id}/allocate"
        actor: Engineer
        preconditions:
          - "parent Study.status == ENGINEERING (ERR_INVALID_STATE)"
          - "study.total_allocated_cost_cents + this.allocated_cost_cents <= property.depreciable_basis_cents (ERR_ALLOCATION_EXCEEDS_BASIS)"
        side_effects:
          - "study.total_allocated_cost_cents += allocated_cost_cents"
      - from: PROPOSED
        to: EXCLUDED
        trigger: "POST /asset-components/{id}/exclude"
        actor: Engineer
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: EXCLUDED
        trigger: "POST /asset-components/{id}/exclude"
        actor: Engineer
        preconditions: []
        side_effects:
          - "study.total_allocated_cost_cents -= allocated_cost_cents (compensating: reverses the allocate increment)"

  - entity: QreLineItem
    initial_state: DRAFT
    terminal_states: [QUALIFIED]
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /qre-line-items/{id}/qualify"
        actor: Engineer
        preconditions: ["parent Study.status == ENGINEERING (ERR_INVALID_STATE)"]
        side_effects:
          - "qualified_amount_cents = round_half_up(gross_amount_cents * effective_percent); effective_percent = min(qualified_percent, CONTRACT_RESEARCH_CAP) for CONTRACT_RESEARCH else qualified_percent"

  - entity: Report
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: REVISION_REQUESTED
        trigger: "system: parent Study IN_REVIEW->ENGINEERING via POST /studies/{id}/reject"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "system: parent Study ENGINEERING->IN_REVIEW via POST /studies/{id}/submit-review (revision loop)"
        actor: system
        preconditions: []
        side_effects: ["revision_count += 1"]
      - from: DRAFT
        to: ISSUED
        trigger: "system: parent Study IN_REVIEW->FINALIZED via POST /studies/{id}/finalize"
        actor: system
        preconditions: []
        side_effects:
          - "issued_at stamped from logical clock"
          - "triggers FeeInvoice creation (cascade link2)"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: an AmendedReturn for this study is FILED via POST /amended-returns/{id}/file"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditSupportCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /audit-cases/{id}/resolve"
        actor: StudyManager
        preconditions: []
        side_effects: ["resolution_note recorded"]

  - entity: AmendedReturn
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /amended-returns/{id}/file"
        actor: StudyManager
        preconditions:
          - "current logical-clock year <= amended_tax_year + AMEND_STATUTE_YEARS (ERR_AMEND_WINDOW_EXPIRED)"
        side_effects:
          - "section_481a_cents computed per §1.3 section_481a_adjustment"
          - "filed_at stamped from logical clock"
          - "CASCADE link1: parent study.section_481a_cents set to this.section_481a_cents"
          - "CASCADE link2: study change triggers this study's Report ISSUED->SUPERSEDED"

  - entity: FeeInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /fee-invoices/{id}/pay"
        actor: StudyManager
        preconditions: []
        side_effects:
          - "client.outstanding_fee_cents -= amount_cents"
      - from: ISSUED
        to: VOID
        trigger: "POST /fee-invoices/{id}/void"
        actor: StudyManager
        preconditions: []
        side_effects:
          - "client.outstanding_fee_cents -= amount_cents (compensating: reverses the finalize cascade link3 increment)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: amended-return-create-stale-study
    parent_entity: Study
    write_endpoint: "POST /studies/{id}/amended-returns"
    occ_field: "expected_study_version"
    description: |
      Creating an AmendedReturn against a Study whose version has advanced since
      the client last observed it is rejected. A DELIVERED look-back study may
      legitimately have more than one amended return created against it over its
      life, so a second create is not blocked by any state precondition; the
      stale-version check exists because an earlier amended-return create has
      already advanced the study's version, making this writer's view stale.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cost_seg_first_year_depreciation
    trigger: "POST /studies/{id}/submit-review (COST_SEGREGATION); recomputed for GET /studies/{id}"
    algorithm: dual_variant_depreciation
    formula: |
      Inputs: this study's AssetComponents in status ALLOCATED; property.placed_in_service_date (its calendar year Y); client.marginal_tax_rate.
      recovery/rate by asset_class from MACRS_Y1_RATE. bonus_pct = BONUS_PCT_BY_YEAR[Y].
      bonus_eligible = asset_class in BONUS_ELIGIBLE_CLASSES (FIVE_YEAR, SEVEN_YEAR, FIFTEEN_YEAR).

      PER-COMPONENT ROUNDING IS PINNED: round each component's first-year figure to whole
      cents with round_half_up, THEN sum. (Do NOT sum raw products then round once.)

      WITHOUT_BONUS variant, per component:
        fy = round_half_up(allocated_cost_cents * MACRS_Y1_RATE[asset_class])
      first_year_depreciation_no_bonus_cents = sum(fy over ALLOCATED components)

      WITH_BONUS variant, per component:
        if bonus_eligible:
          bonus_amt = round_half_up(allocated_cost_cents * bonus_pct)
          macrs_part = round_half_up((allocated_cost_cents - bonus_amt) * MACRS_Y1_RATE[asset_class])
          fy = bonus_amt + macrs_part
        else:  # THIRTY_NINE_YEAR
          fy = round_half_up(allocated_cost_cents * MACRS_Y1_RATE[asset_class])
      first_year_depreciation_cents = sum(fy over ALLOCATED components)

      estimated_tax_benefit_cents (COST_SEGREGATION) = round_half_up(first_year_depreciation_cents * client.marginal_tax_rate)
    input_set: "AssetComponents with status == ALLOCATED only; PROPOSED and EXCLUDED are excluded"
    constants:
      MACRS_Y1_RATE: { FIVE_YEAR: 0.20, SEVEN_YEAR: 0.1429, FIFTEEN_YEAR: 0.05, THIRTY_NINE_YEAR: 0.02564 }
      BONUS_PCT_BY_YEAR: { 2022: 1.00, 2023: 0.80, 2024: 0.60, 2025: 0.40, 2026: 0.20 }
      BONUS_ELIGIBLE_CLASSES: [FIVE_YEAR, SEVEN_YEAR, FIFTEEN_YEAR]
    precision: "whole cents, round_half_up, per-component then sum"
    variants:
      - name: WITH_BONUS
        when: "realized benefit basis; used for estimated_tax_benefit_cents and percent fees"
        difference: "applies bonus_pct of the cost of bonus-eligible components in year 1, then MACRS on the remainder"
      - name: WITHOUT_BONUS
        when: "comparison / as-filed baseline"
        difference: "pure MACRS first-year rate on full component cost, no bonus"

  - name: rd_credit
    trigger: "POST /studies/{id}/submit-review (RD_CREDIT); recomputed for GET /studies/{id}"
    algorithm: dual_variant_credit
    formula: |
      Inputs: this study's QreLineItems in status QUALIFIED; study.credit_method; study.fixed_base_pct;
      study.avg_annual_gross_receipts_cents; study.prior_qre_year1_cents/2/3.
      current_qre = sum(qualified_amount_cents over QUALIFIED QreLineItems)   # already contract-capped at qualify time

      ASC variant (>=3 inputs, conditional branch — combinatorial mode (a)):
        avg_prior = (prior_qre_year1_cents + prior_qre_year2_cents + prior_qre_year3_cents) / 3   # exact, not pre-rounded
        if avg_prior > 0:
          rd_credit_asc_cents = max(0, round_half_up(ASC_RATE * (current_qre - 0.5 * avg_prior)))
        else:
          rd_credit_asc_cents = round_half_up(ASC_STARTUP_RATE * current_qre)

      REGULAR variant:
        base_amount = max(round_half_up(0.5 * current_qre), round_half_up(fixed_base_pct * avg_annual_gross_receipts_cents))
        rd_credit_regular_cents = max(0, round_half_up(REGULAR_RATE * (current_qre - base_amount)))

      estimated_tax_benefit_cents (RD_CREDIT) = rd_credit_asc_cents if credit_method==ASC else rd_credit_regular_cents
    input_set: "QreLineItems with status == QUALIFIED only"
    constants: { ASC_RATE: 0.14, ASC_STARTUP_RATE: 0.06, REGULAR_RATE: 0.20 }
    precision: "whole cents, round_half_up"
    variants:
      - name: ASC
        when: "credit_method == ASC"
        difference: "14% of (current_qre - 50% of 3-year average prior QRE); 6% of current_qre when no prior QRE"
      - name: REGULAR
        when: "credit_method == REGULAR"
        difference: "20% of (current_qre - base_amount), base floored at 50% of current_qre"

  - name: qre_qualified_amount
    trigger: "POST /qre-line-items/{id}/qualify"
    algorithm: threshold_cap
    formula: |
      effective_percent = min(qualified_percent, CONTRACT_RESEARCH_CAP) if qre_category == CONTRACT_RESEARCH else qualified_percent
      qualified_amount_cents = round_half_up(gross_amount_cents * effective_percent)
    input_set: "single QreLineItem"
    constants: { CONTRACT_RESEARCH_CAP: 0.65 }
    precision: "whole cents, round_half_up"

  - name: study_fee
    trigger: "FeeInvoice creation cascaded from POST /studies/{id}/finalize"
    algorithm: conditional_rate
    formula: |
      if study.fee_type == FIXED:
        amount_cents = study.fee_fixed_amount_cents
      else:  # PERCENT
        amount_cents = round_half_up(study.fee_percent_bps / 10000 * study.estimated_tax_benefit_cents)
      fee_basis = study.fee_type
    input_set: "single Study; estimated_tax_benefit_cents already computed at submit-review"
    constants: { MAX_FEE_BPS: 3000 }
    precision: "whole cents, round_half_up"

  - name: section_481a_adjustment
    trigger: "POST /amended-returns/{id}/file (look-back study)"
    algorithm: ledger_reconciliation
    formula: |
      # Catch-up = additional year-1 deduction cost-seg unlocks vs the as-filed all-39-year treatment of the full basis.
      as_filed_first_year = round_half_up(property.depreciable_basis_cents * MACRS_Y1_RATE[THIRTY_NINE_YEAR])
      section_481a_cents = study.first_year_depreciation_cents - as_filed_first_year
    input_set: "single Study (COST_SEGREGATION, is_look_back) plus its Property"
    constants: { }
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of StudyManager, Engineer, Reviewer, CPA"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every id in the path (and required FK ids in the body) resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "On finalize and reject, the acting Reviewer's engineer id MUST NOT equal study.assigned_engineer_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /studies/{id}/finalize, POST /studies/{id}/reject"

  - priority: 6
    category: business_referential
    check: "AssetComponent operations require the parent study.study_type == COST_SEGREGATION; QreLineItem operations require study.study_type == RD_CREDIT"
    error_id: ERR_STUDY_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /studies/{id}/asset-components, POST /studies/{id}/qre-line-items"

  - priority: 7
    category: business_constraint
    check: "Numeric inputs within range: allocated_cost_cents > 0; gross_amount_cents > 0; qualified_percent in (0,1]; marginal_tax_rate in [0,1]"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /studies/{id}/asset-components, POST /studies/{id}/qre-line-items, POST /clients, POST /properties"

  - priority: 8
    category: business_temporal
    check: "COST_SEGREGATION: no other non-CANCELLED cost-seg study on the same property with the same tax_year"
    error_id: ERR_PROPERTY_STUDY_OVERLAP
    http_status: 409
    applies_to: "POST /studies/{id}/scope"

  - priority: 9
    category: business_temporal
    check: "RD_CREDIT: no other non-CANCELLED R&D study for the same client whose base period [tax_year-3, tax_year) overlaps this study's base period"
    error_id: ERR_RD_BASE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /studies/{id}/scope"

  - priority: 10
    category: business_temporal
    check: "Amended return may be filed only if current logical-clock year <= amended_tax_year + AMEND_STATUTE_YEARS (3)"
    error_id: ERR_AMEND_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /amended-returns/{id}/file"

  - priority: 11
    category: business_fiscal
    check: "PERCENT fee: fee_percent_bps <= MAX_FEE_BPS (3000)"
    error_id: ERR_FEE_PERCENT_TOO_HIGH
    http_status: 422
    applies_to: "POST /studies/{id}/scope"

  - priority: 12
    category: business_fiscal
    check: "Allocating a component must not push study.total_allocated_cost_cents above property.depreciable_basis_cents"
    error_id: ERR_ALLOCATION_EXCEEDS_BASIS
    http_status: 409
    applies_to: "POST /asset-components/{id}/allocate"

  - priority: 13
    category: business_fiscal
    check: "submit-review requires a non-empty benefit input set: >=1 ALLOCATED component (cost-seg) or >=1 QUALIFIED QRE (R&D)"
    error_id: ERR_NO_ALLOCATED_COMPONENTS
    http_status: 409
    applies_to: "POST /studies/{id}/submit-review"

  - priority: 14
    category: concurrency
    check: "expected_study_version must equal current study.version"
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    applies_to: "POST /studies/{id}/amended-returns"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Create a taxpayer client"
    roles: [StudyManager]
    code: 201
    input: [legal_name, entity_type, marginal_tax_rate]
    output: Client
    side_effects: ["status=ONBOARDING", "outstanding_fee_cents=0"]

  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/activate"
    description: "Activate an onboarding client"
    roles: [StudyManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status ONBOARDING->ACTIVE"]

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property"
    roles: [StudyManager]
    code: 201
    input: [client_id, address, building_type, purchase_price_cents, land_value_cents, placed_in_service_date]
    output: Property
    side_effects: ["depreciable_basis_cents = purchase_price_cents - land_value_cents"]

  - method: GET
    path: "/properties/{id}"
    description: "Get a property"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties, optionally filtered by client_id"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # --- Engineer ---
  - method: POST
    path: "/engineers"
    description: "Create an engineer (backs Engineer and Reviewer roles)"
    roles: [StudyManager]
    code: 201
    input: [full_name, email]
    output: Engineer
    side_effects: []

  - method: GET
    path: "/engineers/{id}"
    description: "Get an engineer"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: []
    output: Engineer
    side_effects: []

  # --- Study ---
  - method: POST
    path: "/studies"
    description: "Create a study for an ACTIVE client"
    roles: [StudyManager]
    code: 201
    input: [client_id, study_type, tax_year, "is_look_back?"]
    output: Study
    side_effects: ["status=DRAFT"]
    note: "Precondition: client.status == ACTIVE else ERR_CLIENT_NOT_ACTIVE (cross-entity Study->Client)"

  - method: GET
    path: "/studies/{id}"
    description: "Get a study including computed benefit fields"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: []
    output: Study
    side_effects: ["recompute benefit fields for the response"]

  - method: GET
    path: "/studies"
    description: "List studies, optionally filtered"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["client_id?", "property_id?", "assigned_engineer_id?", "limit?", "offset?"]
    output: Study[]
    side_effects: []

  - method: POST
    path: "/studies/{id}/scope"
    description: "Scope a study: fee arrangement, property (cost-seg), credit method + params (R&D)"
    roles: [StudyManager]
    code: 200
    input: [fee_type, "fee_fixed_amount_cents?", "fee_percent_bps?", "property_id?", "credit_method?", "fixed_base_pct?", "avg_annual_gross_receipts_cents?", "prior_qre_year1_cents?", "prior_qre_year2_cents?", "prior_qre_year3_cents?"]
    output: Study
    side_effects: ["status DRAFT->SCOPING", "fee + property/credit params recorded"]

  - method: POST
    path: "/studies/{id}/assign-engineer"
    description: "Assign the preparer engineer"
    roles: [StudyManager]
    code: 200
    input: [assigned_engineer_id]
    output: Study
    side_effects: ["status SCOPING->ENGINEERING", "assigned_engineer_id recorded"]

  - method: POST
    path: "/studies/{id}/submit-review"
    description: "Submit study for review; computes benefit and creates/advances the Report"
    roles: [Engineer]
    code: 200
    input: []
    output: Study
    side_effects:
      - "status ENGINEERING->IN_REVIEW"
      - "recompute benefit fields"
      - "create Report DRAFT, or move existing Report REVISION_REQUESTED->DRAFT (revision_count += 1)"

  - method: POST
    path: "/studies/{id}/reject"
    description: "Reviewer sends study back for revision"
    roles: [Reviewer]
    code: 200
    input: ["review_note?"]
    output: Study
    side_effects: ["status IN_REVIEW->ENGINEERING", "Report DRAFT->REVISION_REQUESTED", "SoD enforced"]

  - method: POST
    path: "/studies/{id}/finalize"
    description: "Reviewer finalizes; cascades Report issue -> fee invoice -> client ledger"
    roles: [Reviewer]
    code: 200
    input: []
    output: Study
    side_effects:
      - "status IN_REVIEW->FINALIZED"
      - "reviewer_engineer_id stamped; SoD enforced"
      - "Report DRAFT->ISSUED (issued_at stamped)"
      - "FeeInvoice created (ISSUED) with amount_cents from study_fee"
      - "client.outstanding_fee_cents += amount_cents"

  - method: POST
    path: "/studies/{id}/deliver"
    description: "CPA accepts the deliverable"
    roles: [CPA]
    code: 200
    input: []
    output: Study
    side_effects: ["status FINALIZED->DELIVERED"]

  - method: POST
    path: "/studies/{id}/cancel"
    description: "Cancel a non-terminal study"
    roles: [StudyManager]
    code: 200
    input: []
    output: Study
    side_effects: ["status ->CANCELLED"]

  # --- AssetComponent ---
  - method: POST
    path: "/studies/{id}/asset-components"
    description: "Add a proposed cost-seg component"
    roles: [Engineer]
    code: 201
    input: [component_name, asset_class, allocated_cost_cents]
    output: AssetComponent
    side_effects: ["status=PROPOSED", "recovery_period_years derived from asset_class"]

  - method: GET
    path: "/studies/{id}/asset-components"
    description: "List a study's asset components"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: AssetComponent[]
    side_effects: []

  - method: POST
    path: "/asset-components/{id}/allocate"
    description: "Mark a component ALLOCATED and add its cost to the study allocation ledger"
    roles: [Engineer]
    code: 200
    input: []
    output: AssetComponent
    side_effects: ["status PROPOSED->ALLOCATED", "study.total_allocated_cost_cents += allocated_cost_cents"]

  - method: POST
    path: "/asset-components/{id}/exclude"
    description: "Exclude a component; reverses its allocation if it was ALLOCATED"
    roles: [Engineer]
    code: 200
    input: []
    output: AssetComponent
    side_effects: ["status ->EXCLUDED", "if was ALLOCATED: study.total_allocated_cost_cents -= allocated_cost_cents"]

  # --- QreLineItem ---
  - method: POST
    path: "/studies/{id}/qre-line-items"
    description: "Add a draft R&D expense line"
    roles: [Engineer]
    code: 201
    input: [qre_category, gross_amount_cents, qualified_percent]
    output: QreLineItem
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/studies/{id}/qre-line-items"
    description: "List a study's QRE line items"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: QreLineItem[]
    side_effects: []

  - method: POST
    path: "/qre-line-items/{id}/qualify"
    description: "Qualify a QRE line; computes qualified_amount_cents with contract-research cap"
    roles: [Engineer]
    code: 200
    input: []
    output: QreLineItem
    side_effects: ["status DRAFT->QUALIFIED", "qualified_amount_cents computed"]

  # --- Report ---
  - method: GET
    path: "/studies/{id}/reports"
    description: "List a study's reports (deliverables)"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: Report[]
    side_effects: []

  # --- AuditSupportCase ---
  - method: POST
    path: "/studies/{id}/audit-cases"
    description: "Open an audit-support case on a delivered study"
    roles: [StudyManager]
    code: 201
    input: [irs_notice_ref]
    output: AuditSupportCase
    side_effects: ["status=OPEN"]
    note: "Precondition: study.status == DELIVERED else ERR_INVALID_STATE (cross-entity AuditSupportCase->Study)"

  - method: GET
    path: "/studies/{id}/audit-cases"
    description: "List a study's audit-support cases"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditSupportCase[]
    side_effects: []

  - method: POST
    path: "/audit-cases/{id}/resolve"
    description: "Resolve an open audit-support case"
    roles: [StudyManager]
    code: 200
    input: [resolution_note]
    output: AuditSupportCase
    side_effects: ["status OPEN->RESOLVED", "resolution_note recorded"]

  # --- AmendedReturn (look-back) ---
  - method: POST
    path: "/studies/{id}/amended-returns"
    description: "Create an amended-return draft for a delivered look-back study (OCC on study.version)"
    roles: [StudyManager]
    code: 201
    input: [amended_tax_year, expected_study_version]
    output: AmendedReturn
    side_effects: ["status=DRAFT", "increments Study.version by 1"]
    note: "Preconditions: study.is_look_back == true AND study.status == DELIVERED (cross-entity AmendedReturn->Study) else ERR_INVALID_STATE; expected_study_version must match study.version else ERR_STALE_STUDY_VERSION"

  - method: GET
    path: "/studies/{id}/amended-returns"
    description: "List a study's amended returns"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: AmendedReturn[]
    side_effects: []

  - method: POST
    path: "/amended-returns/{id}/file"
    description: "File the amended return; computes §481(a) and supersedes the report"
    roles: [StudyManager]
    code: 200
    input: []
    output: AmendedReturn
    side_effects:
      - "status DRAFT->FILED, filed_at stamped"
      - "section_481a_cents computed"
      - "study.section_481a_cents set (cascade link1)"
      - "study's Report ISSUED->SUPERSEDED (cascade link2)"

  # --- FeeInvoice ---
  - method: GET
    path: "/studies/{id}/fee-invoices"
    description: "List a study's fee invoices"
    roles: [StudyManager, Engineer, Reviewer, CPA]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: POST
    path: "/fee-invoices/{id}/pay"
    description: "Mark a fee invoice paid"
    roles: [StudyManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status ISSUED->PAID", "client.outstanding_fee_cents -= amount_cents"]

  - method: POST
    path: "/fee-invoices/{id}/void"
    description: "Void a fee invoice (compensating action)"
    roles: [StudyManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status ISSUED->VOID", "client.outstanding_fee_cents -= amount_cents"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to real wall-clock time."
    roles: [StudyManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601; drives issued_at, filed_at, and the amend statute-year check"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body or missing required field" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (includes cross-entity state preconditions: study not DELIVERED for audit/amend, parent study not ENGINEERING for allocate/qualify)" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Study creation requires client.status == ACTIVE" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Acting Reviewer's engineer id equals study.assigned_engineer_id on finalize/reject" }
  - { id: ERR_STUDY_TYPE_MISMATCH, http: 409, condition: "AssetComponent added to a non-COST_SEGREGATION study, or QreLineItem added to a non-RD_CREDIT study" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Numeric input out of range (cost/amount <= 0, percent outside its bound, rate outside [0,1])" }
  - { id: ERR_PROPERTY_STUDY_OVERLAP, http: 409, condition: "Another non-CANCELLED cost-seg study exists for the same property and tax_year" }
  - { id: ERR_RD_BASE_PERIOD_OVERLAP, http: 409, condition: "Another non-CANCELLED R&D study for the same client has an overlapping base period" }
  - { id: ERR_AMEND_WINDOW_EXPIRED, http: 409, condition: "Current year is past amended_tax_year + AMEND_STATUTE_YEARS" }
  - { id: ERR_FEE_PERCENT_TOO_HIGH, http: 422, condition: "PERCENT fee exceeds MAX_FEE_BPS" }
  - { id: ERR_ALLOCATION_EXCEEDS_BASIS, http: 409, condition: "Allocating the component would exceed property.depreciable_basis_cents" }
  - { id: ERR_NO_ALLOCATED_COMPONENTS, http: 409, condition: "submit-review with no ALLOCATED component (cost-seg) or no QUALIFIED QRE (R&D)" }
  - { id: ERR_NO_QUALIFIED_QRE, http: 409, condition: "submit-review on an R&D study with no QUALIFIED QRE line" }
  - { id: ERR_MISSING_FEE_TERMS, http: 422, condition: "scope with fee_type=FIXED missing fee_fixed_amount_cents, or fee_type=PERCENT missing fee_percent_bps" }
  - { id: ERR_STALE_STUDY_VERSION, http: 412, condition: "expected_study_version does not match current study.version on amended-return create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudyManager
    description: "Engagement operator: manages clients, properties, engineers, study lifecycle scoping/assignment/cancel, audit cases, amended returns, and billing"
    identity: opaque
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /clients/{id}/activate — activate client"
      - "POST /properties — create property"
      - "POST /engineers — create engineer"
      - "POST /studies — create study"
      - "POST /studies/{id}/scope — scope study"
      - "POST /studies/{id}/assign-engineer — assign preparer"
      - "POST /studies/{id}/cancel — cancel study"
      - "POST /studies/{id}/audit-cases — open audit case"
      - "POST /audit-cases/{id}/resolve — resolve audit case"
      - "POST /studies/{id}/amended-returns — create amended return"
      - "POST /amended-returns/{id}/file — file amended return"
      - "POST /fee-invoices/{id}/pay — pay fee invoice"
      - "POST /fee-invoices/{id}/void — void fee invoice"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET endpoints (clients, properties, engineers, studies, components, qre, reports, audit-cases, amended-returns, fee-invoices)"

  - name: Engineer
    description: "Preparer: builds allocation / QRE detail and submits the study for review"
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /studies/{id}/asset-components — add component"
      - "POST /asset-components/{id}/allocate — allocate component"
      - "POST /asset-components/{id}/exclude — exclude component"
      - "POST /studies/{id}/qre-line-items — add QRE line"
      - "POST /qre-line-items/{id}/qualify — qualify QRE line"
      - "POST /studies/{id}/submit-review — submit for review"
    shared_operations:
      - "GET endpoints"

  - name: Reviewer
    description: "Independent reviewer (also an Engineer entity): approves or rejects; segregation of duties forbids reviewing one's own preparation"
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /studies/{id}/reject — send back for revision"
      - "POST /studies/{id}/finalize — finalize study"
    shared_operations:
      - "GET endpoints"

  - name: CPA
    description: "Client's CPA coordinating acceptance of the deliverable"
    identity: opaque
    exclusive_operations:
      - "POST /studies/{id}/deliver — accept deliverable"
    shared_operations:
      - "GET endpoints"
