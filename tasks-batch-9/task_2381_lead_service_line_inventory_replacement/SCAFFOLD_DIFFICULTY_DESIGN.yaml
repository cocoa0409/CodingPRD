            - "${err} != ERR_CCT_NOT_OPTIMIZED and ${err} != ERR_PROGRAM_POSTURE_RESTRICTED"
            - "the breach is caused by the single shared date 2026-08-12; a window of 2026-08-13..2026-08-14 would satisfy the same capacity of 1"
            - "ReplacementOrder.${ob}.fulfillment_state == FUNDED"
            - "StreetProject.${sp}.active_excavation_order_count == 1 (unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: funding_source_ledger_conserved_across_commit_and_release
        grounds:
          - state_machines.ReplacementOrder.fulfillment_state.FUNDED_to_CANCELLED
          - state_machines.ServiceLine.replacement_state.IN_PROGRAM_to_ELIGIBLE
          - entities.FundingSource.fields.available_cents
          - entities.FundingSource.fields.committed_cents
          - entities.ReplacementOrder.fields.funding_allocations
        distinguishing_aspect: |
          Conserved quantity: MONEY. FundingSource.authorized_cents ==
          available_cents + committed_cents + drawn_cents must hold identically before the
          commit, while 100000 cents sit COMMITTED, and after the compensating cancel
          releases them. The cancel is a true inverse: allocations move COMMITTED ->
          RELEASED, allocated_total_cents returns to 0 and the line returns to ELIGIBLE
          with no cents stranded in drawn_cents.
        test_recipe:
          setup:
            - "WaterSystem with a PUBLISHED inventory and one LEAD ServiceLine."
            - "One ACTIVE FundingSource with authorized_cents 200000, max_share_pct 100.0, equity_required_pct 0.0; at creation available 200000 / committed 0 / drawn 0."
            - "A ReplacementOrder for 100000 cents with consent GRANTED that has been funded, so exactly one COMMITTED allocation of 100000 exists and the line is IN_PROGRAM."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031020", system_name: "Marlowe Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 1.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 5.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIFTH_LITER" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id }
            - call: "POST /lsl/inventory-publications/${pub}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/inventory-publications/${pub}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/funding-sources"
              payload: { water_system_id: "${ws}", source_kind: "STATE_REVOLVING_FUND", authorized_cents: 200000, priority_rank: 1, max_share_pct: 100.0, equity_required_pct: 0.0 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { s1: $.data.id, avail_t0: $.data.available_cents, comm_t0: $.data.committed_cents, drawn_t0: $.data.drawn_cents }
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l1}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-10", excavation_end_date: "2026-08-11" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { o1: $.data.id }
            - call: "POST /lsl/replacement-orders/${o1}/consent-request"
              payload: {}
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "POST /lsl/replacement-orders/${o1}/consent-response"
              payload: { outcome: "GRANTED" }
              as: CustomerRepresentative
              as_user_id: "csr-1"
            - call: "POST /lsl/replacement-orders/${o1}/funding-plan"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { total_t1: $.data.allocated_total_cents }
            - call: "GET /lsl/funding-sources/${s1}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { avail_t1: $.data.available_cents, comm_t1: $.data.committed_cents, drawn_t1: $.data.drawn_cents }
          trigger:
            - call: "POST /lsl/replacement-orders/${o1}/cancel"
              payload: { reason: "CUSTOMER_WITHDREW" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "${avail_t0} == 200000 and ${comm_t0} == 0 and ${drawn_t0} == 0 (invariant holds at t0: 200000 == 200000 + 0 + 0)"
            - "${total_t1} == 100000"
            - "${avail_t1} == 100000 and ${comm_t1} == 100000 and ${drawn_t1} == 0 (invariant holds at t1: 200000 == 100000 + 100000 + 0)"
            - "FundingSource.${s1}.available_cents == 200000 and FundingSource.${s1}.committed_cents == 0 and FundingSource.${s1}.drawn_cents == 0"
            - "FundingSource.${s1}.authorized_cents == FundingSource.${s1}.available_cents + FundingSource.${s1}.committed_cents + FundingSource.${s1}.drawn_cents == 200000 (invariant holds at t2)"
            - "FundingSource.${s1}.disadvantaged_committed_cents == 0 and FundingSource.${s1}.disadvantaged_share_pct == 0.00 and FundingSource.${s1}.equity_shortfall_cents == 0"
            - "every ReplacementOrder.${o1}.funding_allocations[].state == RELEASED"
            - "ReplacementOrder.${o1}.allocated_total_cents == 0 and ReplacementOrder.${o1}.fulfillment_state == CANCELLED and ReplacementOrder.${o1}.cancellation_reason == CUSTOMER_WITHDREW"
            - "ServiceLine.${l1}.replacement_state == ELIGIBLE and ServiceLine.${l1}.classification == LEAD"
            - "no cents were stranded: FundingSource.${s1}.drawn_cents == 0 even though the order passed through FUNDED"

      - name: water_system_classification_counter_partition_conserved_across_evidence_retraction
        grounds:
          - state_machines.ServiceLine.inventory_state.CLASSIFIED_PROVISIONAL_to_CLASSIFIED_PROVISIONAL
          - endpoints.POST_lsl_evidence_items_id_retract
          - calculations.service_line_classification
          - entities.WaterSystem.fields.unknown_share_pct
          - entities.WaterSystem.fields.total_service_line_count
        distinguishing_aspect: |
          A structurally different conserved quantity: a COUNT PARTITION, not a money
          ledger. total_service_line_count == lead_count + grr_count + non_lead_count +
          unknown_count must hold before the LEAD evidence is added, while the line counts
          as LEAD, and after the retraction moves it back to UNKNOWN — with no line ever
          double-counted in two buckets and none lost. The retraction is the compensating
          operation and it also restores certainty_score from 16.00 to 0.00.
        test_recipe:
          setup:
            - "One WaterSystem (still DRAFT, which is irrelevant to evidence writes) with no disadvantaged tracts."
            - "One ServiceLine whose only evidence is PREDICTIVE_MODEL/CUSTOMER/UNKNOWN, so classification == UNKNOWN and the partition reads 1 = 0 + 0 + 0 + 1."
            - "A HISTORIC_RECORD/UTILITY/LEAD item is then added, moving the line to LEAD and the partition to 1 = 1 + 0 + 0 + 0."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031021", system_name: "Rookwood Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "PREDICTIVE_MODEL", side: "CUSTOMER", observed_material: "UNKNOWN", observed_at: "2026-06-02T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { ev_pred: $.data.id }
            - call: "GET /lsl/water-systems/${ws}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { total_t0: $.data.total_service_line_count, lead_t0: $.data.lead_count, grr_t0: $.data.grr_count, nonlead_t0: $.data.non_lead_count, unknown_t0: $.data.unknown_count, share_t0: $.data.unknown_share_pct }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { ev_lead: $.data.id }
            - call: "GET /lsl/water-systems/${ws}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { total_t1: $.data.total_service_line_count, lead_t1: $.data.lead_count, unknown_t1: $.data.unknown_count, share_t1: $.data.unknown_share_pct }
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { cls_t1: $.data.classification, cert_t1: $.data.certainty_score, prio_t1: $.data.replacement_priority_score }
          trigger:
            - call: "POST /lsl/evidence-items/${ev_lead}/retract"
              payload: { reason: "RECORD_ATTRIBUTED_TO_WRONG_PREMISE" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { retracted: $.data.retracted }
          assert:
            - "${total_t0} == 1 and ${lead_t0} == 0 and ${grr_t0} == 0 and ${nonlead_t0} == 0 and ${unknown_t0} == 1 and ${share_t0} == 100.00 (partition holds at t0)"
            - "${total_t1} == 1 and ${lead_t1} == 1 and ${unknown_t1} == 0 and ${share_t1} == 0.00 (partition holds at t1)"
            - "${cls_t1} == LEAD and ${cert_t1} == 16.00 and ${prio_t1} == 50.00"
            - "${retracted} == true"
            - "EvidenceItem.${ev_lead}.retraction_reason == RECORD_ATTRIBUTED_TO_WRONG_PREMISE"
            - "WaterSystem.${ws}.total_service_line_count == 1 and lead_count == 0 and grr_count == 0 and non_lead_count == 0 and unknown_count == 1 (partition restored at t2)"
            - "WaterSystem.${ws}.unknown_share_pct == 100.00"
            - "ServiceLine.${l1}.classification == UNKNOWN and ServiceLine.${l1}.utility_side_material == UNKNOWN and ServiceLine.${l1}.customer_side_material == UNKNOWN"
            - "ServiceLine.${l1}.certainty_score == 0.00 and ServiceLine.${l1}.replacement_priority_score == 40.00"
            - "ServiceLine.${l1}.inventory_state == CLASSIFIED_PROVISIONAL and ServiceLine.${l1}.replacement_state == ELIGIBLE"
            - "EvidenceItem.${ev_pred}.retracted == false (the compensation touched only the retracted row)"
