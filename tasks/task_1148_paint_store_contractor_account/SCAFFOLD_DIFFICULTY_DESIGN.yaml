            - { call: "POST /jurisdictions", payload: { code: "CA-BAAQMD", name: "BAAQMD" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "FLAT", max_voc_gpl: 250, effective_from: "2026-01-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "SF Site", site_address: "1 Market St" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-EQ", name: "Boundary Flat", category: "FLAT", voc_gpl: 250, list_price_cents: 10000, tintable: false }, as: CorporateAdmin, captures: { p_eq: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-OVER", name: "Over Flat", category: "FLAT", voc_gpl: 251, list_price_cents: 10000, tintable: false }, as: CorporateAdmin, captures: { p_over: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${p_eq}", quantity: 1 }] }, as: StoreAssociate, captures: { o_eq: "$.data.id" } }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${p_over}", quantity: 1 }] }, as: StoreAssociate }
