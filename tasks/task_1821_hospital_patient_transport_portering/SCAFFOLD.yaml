# =============================================================================
# Task 1821 — Hospital Patient Transport & Portering
# =============================================================================

scenario: |
  1821. Hospital Patient Transport & Portering (hospital transport department):
  transport request queue & priority by clinical urgency, transporter dispatch &
  travel-time estimation, equipment (wheelchair/stretcher/oxygen) requirement
  matching, isolation precaution & cleaning between trips, delay tracking &
  OR/imaging on-time impact, staffing by demand curve, request cancellation &
  duplicate handling, response-time service level

domain_name: hospital-patient-transport
api_prefix: /transport

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique location code, e.g. WARD-4E" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: location_type, type: enum, source: input, description: "WARD | ICU | ED | OR | IMAGING | DISCHARGE_LOUNGE | OTHER; drives delay cascade multiplier" }
      - { name: zone_code, type: string, source: input, description: "Free-form zone grouping label (no FK)" }

  - name: TravelEdge
    parent: null
    common_fields: true
    fields:
      - { name: from_location_id, type: string, source: input, description: "FK -> Location.id; directed edge origin" }
      - { name: to_location_id, type: string, source: input, description: "FK -> Location.id; directed edge destination" }
      - { name: base_minutes, type: integer, source: input, description: "Walking minutes for a porter with standard equipment; > 0" }
      - { name: airborne_minutes, type: integer, source: input, description: "Replacement leg minutes when the trip's isolation_precaution == AIRBORNE (longer corridor); > 0" }

  - name: Transporter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Transporter display name" }
      - { name: home_location_id, type: string, source: input, description: "FK -> Location.id; base location" }
      - { name: certified_equipment, type: array, source: input, default: [], description: "Subset of [WHEELCHAIR, STRETCHER, BARIATRIC_STRETCHER] the transporter may move" }
      - { name: oxygen_certified, type: boolean, source: input, default: false, description: "May escort trips with oxygen_required == true" }
      - { name: isolation_certified, type: boolean, source: input, default: false, description: "May escort trips with isolation_precaution != NONE (safety gate)" }
      - { name: status, type: enum, source: system, description: "OFF_SHIFT | ON_SHIFT | SUSPENDED" }
      - { name: current_location_id, type: string, source: system, description: "FK -> Location.id; initialized to home_location_id, updated to trip destination on COMPLETE" }

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_tag, type: string, source: input, description: "Human-readable tag, unique; deterministic tie-break after created_at" }
      - { name: equipment_type, type: enum, source: input, description: "WHEELCHAIR | STRETCHER | BARIATRIC_STRETCHER" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | IN_USE | AWAITING_CLEANING | IN_CLEANING | OUT_OF_SERVICE" }
      - { name: current_location_id, type: string, source: input, description: "FK -> Location.id; set at creation, system-updated to trip destination on COMPLETE" }
      - { name: isolation_contaminated, type: boolean, source: system, default: false, description: "true after completing an isolation trip; cleared when its CleaningTask is VERIFIED" }

  - name: TransportRequest
    parent: null
    common_fields: true
    fields:
      - { name: patient_ref, type: string, source: input, description: "Opaque patient identifier used for duplicate and separation checks" }
      - { name: origin_location_id, type: string, source: input, description: "FK -> Location.id; pickup location" }
      - { name: destination_location_id, type: string, source: input, description: "FK -> Location.id; drop-off location" }
      - { name: priority, type: enum, source: input, description: "ROUTINE | URGENT | STAT; may be escalated by sweeps" }
      - { name: required_equipment, type: enum, source: input, description: "PORTER_ONLY | WHEELCHAIR | STRETCHER | BARIATRIC_STRETCHER" }
      - { name: oxygen_required, type: boolean, source: input, default: false, description: "Trip needs oxygen escort" }
      - { name: isolation_precaution, type: enum, source: input, default: NONE, description: "NONE | CONTACT | DROPLET | AIRBORNE" }
      - { name: scheduled_pickup_time, type: datetime, source: input, description: "Optional booked pickup time; drives patient minimum-separation rule", constraints: "optional" }
      - { name: appointment_deadline, type: datetime, source: input, description: "Optional downstream appointment time; lateness creates APPOINTMENT_LATE DelayRecord", constraints: "optional" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of the creating RequestingClinician" }
      - { name: status, type: enum, source: system, description: "QUEUED | ASSIGNED | AT_PICKUP | IN_TRANSIT | COMPLETED | CANCELLED | SUPERSEDED" }
      - { name: sla_posture, type: enum, source: system, description: "ON_TRACK | AT_RISK | BREACHED; parallel state dimension, frozen once response measured" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Number of sweep-driven priority escalations" }
      - { name: decline_count, type: integer, source: system, default: 0, description: "Offers declined on this request" }
      - { name: release_count, type: integer, source: system, default: 0, description: "Times an assigned transporter released the trip back to queue" }
      - { name: offer_seq_count, type: integer, source: system, default: 0, description: "Offers ever created for this request" }
      - { name: excluded_transporter_ids, type: array, source: system, default: [], description: "Transporters who declined or released this request; excluded from future selection" }
      - { name: assigned_transporter_id, type: string, source: system, description: "FK -> Transporter.id; null unless ASSIGNED/AT_PICKUP/IN_TRANSIT", constraints: "nullable" }
      - { name: assigned_equipment_id, type: string, source: system, description: "FK -> EquipmentAsset.id; null for PORTER_ONLY or before dispatch", constraints: "nullable" }
      - { name: duplicate_of_id, type: string, source: input, description: "FK -> TransportRequest.id; self-referential; set via close SUPERSEDE", constraints: "nullable" }
      - { name: committed_eta_minutes, type: integer, source: computed, description: "Commit-variant travel estimate computed at offer ACCEPT; null before", constraints: "nullable" }
      - { name: response_minutes, type: integer, source: computed, description: "(at_pickup_at - created_at) in whole minutes; null before ARRIVE_PICKUP", constraints: "nullable" }
      - { name: at_pickup_at, type: datetime, source: system, description: "Set by ARRIVE_PICKUP", constraints: "nullable" }
      - { name: picked_up_at, type: datetime, source: system, description: "Set by PICKUP", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Set by COMPLETE", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Set by close (CANCEL or SUPERSEDE)", constraints: "nullable" }
      - { name: cancel_reason, type: string, source: system, description: "Reason from close payload", constraints: "nullable" }

  - name: DispatchOffer
    parent: null
    common_fields: true
    fields:
      - { name: transport_request_id, type: string, source: system, description: "FK -> TransportRequest.id; owning request (path)" }
      - { name: transporter_id, type: string, source: input, description: "FK -> Transporter.id; dispatcher-supplied, or server-selected when omitted", constraints: "optional on input" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | SUPERSEDED | EXPIRED" }
      - { name: offer_seq, type: integer, source: system, description: "Per-request sequence number, 1-based" }
      - { name: estimated_travel_minutes, type: integer, source: computed, description: "Dispatch-variant travel estimate snapshot at offer creation" }
      - { name: responded_at, type: datetime, source: system, description: "Set on ACCEPT/DECLINE", constraints: "nullable" }

  - name: CleaningTask
    parent: null
    common_fields: true
    fields:
      - { name: equipment_asset_id, type: string, source: system, description: "FK -> EquipmentAsset.id; asset to clean" }
      - { name: transport_request_id, type: string, source: system, description: "FK -> TransportRequest.id; trip that soiled the asset" }
      - { name: task_type, type: enum, source: system, description: "DEEP iff trip isolation_precaution != NONE, else STANDARD" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | AWAITING_VERIFICATION | VERIFIED" }
      - { name: started_at, type: datetime, source: system, description: "Set on each entry to IN_PROGRESS", constraints: "nullable" }
      - { name: finished_at, type: datetime, source: system, description: "Set on entry to AWAITING_VERIFICATION", constraints: "nullable" }
      - { name: verified_at, type: datetime, source: system, constraints: "nullable", description: "Set on VERIFIED" }
      - { name: performed_by, type: string, source: system, description: "X-User-ID of the HousekeepingStaff who last finished the task", constraints: "nullable" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying supervisor; must differ from performed_by", constraints: "nullable" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Times verification rejected the task back to IN_PROGRESS" }

  - name: StaffingShift
    parent: null
    common_fields: true
    fields:
      - { name: transporter_id, type: string, source: input, description: "FK -> Transporter.id" }
      - { name: shift_start, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: shift_end, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > shift_start" }
      - { name: status, type: enum, source: system, description: "PLANNED | CANCELLED" }

  - name: DemandCurve
    parent: null
    common_fields: true
    fields:
      - { name: day_type, type: enum, source: input, description: "WEEKDAY | WEEKEND" }
      - { name: hour_block, type: integer, source: input, description: "Hour of day 0..23 this row models" }
      - { name: priority, type: enum, source: input, description: "ROUTINE | URGENT | STAT" }
      - { name: expected_requests, type: number, source: input, description: "Expected request volume in the block; >= 0" }
      - { name: mean_service_minutes, type: integer, source: input, description: "Mean end-to-end service minutes per request of this priority; > 0" }

  - name: DelayRecord
    parent: null
    common_fields: false
    fields:
      - { name: transport_request_id, type: string, source: system, description: "FK -> TransportRequest.id" }
      - { name: record_kind, type: enum, source: system, description: "SLA_BREACH | APPOINTMENT_LATE" }
      - { name: delay_minutes, type: integer, source: computed, description: "Attributed delay: elapsed minus current target (SLA_BREACH) or completed_at minus appointment_deadline (APPOINTMENT_LATE), whole minutes" }
      - { name: impact_minutes, type: integer, source: computed, description: "Cascade-variant impact: round_half_up(delay_minutes x multiplier(destination location_type)); OR 2.0, IMAGING 1.5, else 1.0" }
      - { name: cause_code, type: enum, source: system, description: "NO_TRANSPORTER | NO_EQUIPMENT | CLEANING_BACKLOG | PATIENT_NOT_READY | SYSTEM | OTHER; SYSTEM for sweep-created records" }
      - { name: recorded_via, type: enum, source: system, description: "SWEEP | COMPLETION" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TransportRequest
    field: status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: QUEUED
        trigger: "POST /transport/requests/{id}/offers"
        actor: TransportDispatcher
        preconditions:
          - "request.status == QUEUED (else ERR_INVALID_REQUEST_STATE)"
          - "expected_request_version == request.version (else ERR_STALE_VERSION)"
          - "selected transporter eligible: status == ON_SHIFT, no active assignment (no request with assigned_transporter_id == t and status IN {ASSIGNED, AT_PICKUP, IN_TRANSIT}), no other PENDING offer addressed to t, t not in request.excluded_transporter_ids"
          - "isolation_precaution != NONE => transporter.isolation_certified (else ERR_ISOLATION_CAPABILITY_MISMATCH)"
          - "oxygen_required => transporter.oxygen_certified (else ERR_TRANSPORTER_INELIGIBLE)"
          - "required_equipment != PORTER_ONLY => required_equipment IN transporter.certified_equipment (else ERR_TRANSPORTER_INELIGIBLE)"
          - "travel edges exist: transporter.current_location_id -> origin and origin -> destination (else ERR_NO_TRAVEL_EDGE)"
          - "required_equipment != PORTER_ONLY => an AVAILABLE EquipmentAsset of matching type exists (else ERR_NO_AVAILABLE_EQUIPMENT)"
        side_effects:
          - "existing PENDING offer on this request -> SUPERSEDED and its RESERVED asset -> AVAILABLE (no auto-dispatch eval on this path)"
          - "server selects asset when required_equipment != PORTER_ONLY: AVAILABLE, matching type, ordered created_at ASC then asset_tag ASC; asset -> RESERVED; request.assigned_equipment_id := asset"
          - "creates DispatchOffer(PENDING, offer_seq := offer_seq_count + 1, estimated_travel_minutes := dispatch-variant estimate)"
          - "request.offer_seq_count += 1; request.version += 1"
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /transport/dispatch-offers/{id}/respond with decision == ACCEPT"
        actor: Transporter
        preconditions:
          - "offer.status == PENDING (else ERR_INVALID_OFFER_STATE)"
          - "offer.transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
          - "request.status == QUEUED (else ERR_INVALID_REQUEST_STATE)"
          - "transporter.status == ON_SHIFT (else ERR_INVALID_TRANSPORTER_STATE)"
        side_effects:
          - "offer -> ACCEPTED, responded_at := now"
          - "request.assigned_transporter_id := offer.transporter_id; at-pickup chain armed"
          - "request.committed_eta_minutes := commit-variant estimate (dispatch estimate + 2 x min(active_in_transit_count, 5))"
          - "request.version += 1"
      - from: ASSIGNED
        to: AT_PICKUP
        trigger: "POST /transport/requests/{id}/trip-events with event == ARRIVE_PICKUP"
        actor: Transporter
        preconditions:
          - "request.status == ASSIGNED (else ERR_INVALID_REQUEST_STATE)"
          - "request.assigned_transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "at_pickup_at := now; response_minutes := floor((at_pickup_at - created_at) / 60s)"
          - "sla_posture frozen: response_minutes > target(priority) => BREACHED; >= floor(3 x target / 4) => AT_RISK; else ON_TRACK; sweeps no longer mutate posture"
          - "request.version += 1"
      - from: AT_PICKUP
        to: IN_TRANSIT
        trigger: "POST /transport/requests/{id}/trip-events with event == PICKUP"
        actor: Transporter
        preconditions:
          - "request.status == AT_PICKUP (else ERR_INVALID_REQUEST_STATE)"
          - "request.assigned_transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
          - "assigned_equipment_id IS NULL OR assigned asset.status == RESERVED (else ERR_INVALID_ASSET_STATE)"
        side_effects:
          - "picked_up_at := now; assigned asset (if any) -> IN_USE"
          - "request.version += 1"
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /transport/requests/{id}/trip-events with event == COMPLETE"
        actor: Transporter
        preconditions:
          - "request.status == IN_TRANSIT (else ERR_INVALID_REQUEST_STATE)"
          - "request.assigned_transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "completed_at := now; assigned_transporter_id := null"
          - "transporter.current_location_id := destination_location_id"
          - "assigned asset (if any) -> AWAITING_CLEANING; if isolation_precaution != NONE then asset.isolation_contaminated := true"
          - "cascade: asset entering AWAITING_CLEANING creates CleaningTask(PENDING, task_type := DEEP iff isolation != NONE else STANDARD)"
          - "if appointment_deadline set AND completed_at > deadline AND no APPOINTMENT_LATE record exists: create DelayRecord(APPOINTMENT_LATE, delay_minutes := floor((completed_at - deadline)/60s), cause_code := payload cause_code or OTHER, recorded_via := COMPLETION)"
          - "if response_minutes > target(priority) AND no SLA_BREACH record exists: create DelayRecord(SLA_BREACH, delay_minutes := response_minutes - target, cause_code := SYSTEM, recorded_via := COMPLETION)"
          - "request.version += 1"
      - from: ASSIGNED
        to: QUEUED
        trigger: "POST /transport/requests/{id}/trip-events with event == RELEASE"
        actor: "Transporter (assigned) | TransportDispatcher"
        preconditions:
          - "request.status == ASSIGNED (else ERR_INVALID_REQUEST_STATE)"
          - "actor is TransportDispatcher OR request.assigned_transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "assigned_transporter_id := null; release_count += 1; releasing transporter appended to excluded_transporter_ids"
          - "assigned asset (if any) -> AVAILABLE, then run auto-dispatch eval for the freed asset"
          - "request.version += 1"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /transport/requests/{id}/close with action == CANCEL"
        actor: "RequestingClinician (own requests only, requested_by == X-User-ID) | TransportDispatcher | TransportSupervisor"
        preconditions:
          - "request.status IN {QUEUED, ASSIGNED, AT_PICKUP} (terminal => ERR_ALREADY_TERMINAL; IN_TRANSIT => ERR_INVALID_REQUEST_STATE)"
          - "RequestingClinician may cancel only from QUEUED and only own requests"
        side_effects:
          - "PENDING offer (if any) -> SUPERSEDED; its RESERVED asset -> AVAILABLE, then auto-dispatch eval"
          - "if ASSIGNED/AT_PICKUP: assigned asset -> AVAILABLE (no cleaning; never IN_USE), transporter freed, assigned_transporter_id := null, then auto-dispatch eval"
          - "closed_at := now; cancel_reason := payload reason; request.version += 1"
      - from: QUEUED
        to: SUPERSEDED
        trigger: "POST /transport/requests/{id}/close with action == SUPERSEDE"
        actor: TransportDispatcher
        preconditions:
          - "request.status == QUEUED (else ERR_INVALID_REQUEST_STATE; terminal => ERR_ALREADY_TERMINAL)"
          - "duplicate_of_id references a TransportRequest that exists, != self, status == QUEUED, same patient_ref (else ERR_NOT_DUPLICATE)"
        side_effects:
          - "request.duplicate_of_id := payload duplicate_of_id; closed_at := now"
          - "PENDING offer (if any) -> SUPERSEDED; its asset -> AVAILABLE, then auto-dispatch eval"
          - "request.version += 1"
      - from: QUEUED
        to: QUEUED
        trigger: "POST /_sweeps/run (priority escalation self-mutation)"
        actor: system
        preconditions:
          - "posture evaluated BREACHED against current priority target AND priority != STAT"
        side_effects:
          - "priority escalates one tier (ROUTINE -> URGENT -> STAT); escalation_count += 1"
          - "sla_posture recomputed against the NEW target (see calculations.sla_posture_evaluation ordering)"
          - "request.version += 1"

  - entity: TransportRequest
    field: sla_posture
    initial_state: ON_TRACK
    terminal_states: []
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "POST /_sweeps/run"
        actor: system
        preconditions:
          - "status IN {QUEUED, ASSIGNED} AND elapsed_minutes >= floor(3 x target(priority) / 4) AND elapsed_minutes <= target(priority)"
        side_effects: ["request.version += 1 when posture changes"]
      - from: AT_RISK
        to: BREACHED
        trigger: "POST /_sweeps/run"
        actor: system
        preconditions:
          - "status IN {QUEUED, ASSIGNED} AND elapsed_minutes > target(priority)"
        side_effects: ["request.version += 1 when posture changes"]
      - from: ON_TRACK
        to: BREACHED
        trigger: "POST /_sweeps/run"
        actor: system
        preconditions:
          - "status IN {QUEUED, ASSIGNED} AND elapsed_minutes > target(priority)"
        side_effects: ["request.version += 1 when posture changes"]
      - from: BREACHED
        to: ON_TRACK
        trigger: "POST /_sweeps/run (post-escalation recompute)"
        actor: system
        preconditions:
          - "escalation just raised priority so elapsed_minutes <= floor(3 x new_target / 4) - 1... i.e. recomputed posture is ON_TRACK"
        side_effects: ["posture may cycle downward only via the escalation recompute step; never directly"]
      - from: any
        to: frozen
        trigger: "ARRIVE_PICKUP event"
        actor: system
        preconditions: ["status left {QUEUED, ASSIGNED}"]
        side_effects: ["posture computed one final time from response_minutes and never changes afterwards"]

  - entity: DispatchOffer
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /transport/dispatch-offers/{id}/respond decision == ACCEPT"
        actor: Transporter
        preconditions: ["see TransportRequest QUEUED -> ASSIGNED"]
        side_effects: ["request QUEUED -> ASSIGNED cascade (see above)"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /transport/dispatch-offers/{id}/respond decision == DECLINE"
        actor: Transporter
        preconditions:
          - "offer.status == PENDING (else ERR_INVALID_OFFER_STATE)"
          - "offer.transporter_id == X-User-ID (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "offer.responded_at := now; request.decline_count += 1; transporter appended to request.excluded_transporter_ids"
          - "offer's RESERVED asset (if any) -> AVAILABLE, then auto-dispatch eval for the freed asset"
          - "request.version += 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "cascade: newer offer created on same request, or request closed"
        actor: system
        preconditions: []
        side_effects: ["offer's RESERVED asset (if any) -> AVAILABLE"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_sweeps/run"
        actor: system
        preconditions:
          - "now - offer.created_at > OFFER_TTL_MINUTES (10), strictly greater; exactly 10 minutes stays PENDING"
        side_effects:
          - "offer's RESERVED asset (if any) -> AVAILABLE (NO auto-dispatch eval on expiry)"
          - "request fields untouched (no version bump, no exclusion entry)"

  - entity: EquipmentAsset
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "offer creation (manual or auto-dispatch)"
        actor: system
        preconditions: ["asset selected by deterministic selector (created_at ASC, asset_tag ASC)"]
        side_effects: []
      - from: RESERVED
        to: IN_USE
        trigger: "PICKUP trip event"
        actor: Transporter
        preconditions: ["request AT_PICKUP with this asset assigned"]
        side_effects: []
      - from: IN_USE
        to: AWAITING_CLEANING
        trigger: "COMPLETE trip event"
        actor: Transporter
        preconditions: []
        side_effects:
          - "creates CleaningTask(PENDING); task_type DEEP iff isolation != NONE"
          - "isolation_contaminated := true iff isolation trip"
      - from: RESERVED
        to: AVAILABLE
        trigger: "offer DECLINED / SUPERSEDED / EXPIRED, request close, or RELEASE"
        actor: system
        preconditions: []
        side_effects: ["auto-dispatch eval runs for the freed asset except on EXPIRED and on offer-create supersession"]
      - from: AWAITING_CLEANING
        to: IN_CLEANING
        trigger: "cleaning advance to IN_PROGRESS"
        actor: HousekeepingStaff
        preconditions: ["linked task.status == PENDING"]
        side_effects: []
      - from: IN_CLEANING
        to: AVAILABLE
        trigger: "cleaning advance to VERIFIED"
        actor: TransportSupervisor
        preconditions: ["linked task.status == AWAITING_VERIFICATION"]
        side_effects:
          - "isolation_contaminated := false"
          - "auto-dispatch eval for the freed asset"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /transport/equipment-assets/{id}/set-service-status service_status == OUT_OF_SERVICE"
        actor: TransportSupervisor
        preconditions: ["status IN {AVAILABLE, RESERVED} (IN_USE / AWAITING_CLEANING / IN_CLEANING => ERR_INVALID_ASSET_STATE)"]
        side_effects: ["if RESERVED for a request, that request's PICKUP will now fail with ERR_INVALID_ASSET_STATE"]
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /transport/equipment-assets/{id}/set-service-status service_status == AVAILABLE"
        actor: TransportSupervisor
        preconditions: ["status == OUT_OF_SERVICE (else ERR_INVALID_ASSET_STATE)"]
        side_effects: ["auto-dispatch eval for the freed asset"]

  - entity: CleaningTask
    field: status
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /transport/cleaning-tasks/{id}/advance to_state == IN_PROGRESS"
        actor: HousekeepingStaff
        preconditions:
          - "task.status == PENDING (else ERR_INVALID_CLEANING_STATE)"
          - "asset.status == AWAITING_CLEANING (else ERR_INVALID_ASSET_STATE)"
        side_effects: ["started_at := now; asset -> IN_CLEANING"]
      - from: IN_PROGRESS
        to: AWAITING_VERIFICATION
        trigger: "POST /transport/cleaning-tasks/{id}/advance to_state == AWAITING_VERIFICATION"
        actor: HousekeepingStaff
        preconditions:
          - "task.status == IN_PROGRESS (else ERR_INVALID_CLEANING_STATE)"
          - "task_type == DEEP => now - started_at >= DWELL_MINUTES_DEEP (15), inclusive (else ERR_DWELL_NOT_ELAPSED); STANDARD has no dwell"
        side_effects: ["finished_at := now; performed_by := X-User-ID"]
      - from: AWAITING_VERIFICATION
        to: VERIFIED
        trigger: "POST /transport/cleaning-tasks/{id}/advance to_state == VERIFIED"
        actor: TransportSupervisor
        preconditions:
          - "task.status == AWAITING_VERIFICATION (else ERR_INVALID_CLEANING_STATE)"
          - "X-User-ID != performed_by (else ERR_SEGREGATION_OF_DUTY)"
        side_effects: ["verified_at := now; verified_by := X-User-ID; asset -> AVAILABLE cascade"]
      - from: AWAITING_VERIFICATION
        to: IN_PROGRESS
        trigger: "POST /transport/cleaning-tasks/{id}/advance to_state == IN_PROGRESS (rework)"
        actor: TransportSupervisor
        preconditions: ["task.status == AWAITING_VERIFICATION (else ERR_INVALID_CLEANING_STATE)"]
        side_effects: ["rework_count += 1; started_at := now; asset stays IN_CLEANING; dwell re-applies to next finish"]

  - entity: Transporter
    field: status
    initial_state: OFF_SHIFT
    terminal_states: []
    transitions:
      - from: OFF_SHIFT
        to: ON_SHIFT
        trigger: "POST /transport/transporters/{id}/set-status status == ON_SHIFT"
        actor: "Transporter (self: path id == X-User-ID) | TransportSupervisor"
        preconditions:
          - "status == OFF_SHIFT (SUSPENDED => ERR_INVALID_TRANSPORTER_STATE)"
          - "a StaffingShift with status == PLANNED covers now: shift_start <= now < shift_end (else ERR_NO_SHIFT_COVERAGE)"
        side_effects: []
      - from: ON_SHIFT
        to: OFF_SHIFT
        trigger: "POST /transport/transporters/{id}/set-status status == OFF_SHIFT"
        actor: "Transporter (self) | TransportSupervisor"
        preconditions:
          - "no active assignment and no PENDING offer addressed to this transporter (else ERR_INVALID_TRANSPORTER_STATE)"
        side_effects: []
      - from: ON_SHIFT
        to: SUSPENDED
        trigger: "POST /transport/transporters/{id}/set-status status == SUSPENDED"
        actor: "TransportSupervisor only (Transporter setting SUSPENDED => ERR_FORBIDDEN_ROLE)"
        preconditions:
          - "no active assignment and no PENDING offer addressed (else ERR_INVALID_TRANSPORTER_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: OFF_SHIFT
        trigger: "POST /transport/transporters/{id}/set-status status == OFF_SHIFT"
        actor: TransportSupervisor
        preconditions: ["status == SUSPENDED"]
        side_effects: []

  - entity: StaffingShift
    field: status
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /transport/staffing-shifts/{id}/set-status status == CANCELLED"
        actor: TransportSupervisor
        preconditions: ["status == PLANNED (else ERR_INVALID_SHIFT_STATE)"]
        side_effects: ["cancelled shifts are excluded from staffing adequacy scheduled counts"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-request
    parent_entity: TransportRequest
    write_endpoint: "POST /transport/requests/{id}/offers"
    occ_field: expected_request_version
    description: |
      Creating a DispatchOffer against a TransportRequest whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an offer (which legitimately
      supersedes the prior PENDING offer) and the current writer's view of the
      request is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: travel_time_estimate
    description: "Estimated total trip minutes, snapshotted per offer (dispatch variant) and recomputed at accept (commit variant)"
    trigger: "dispatch variant: on POST /transport/requests/{id}/offers (stored on DispatchOffer.estimated_travel_minutes); commit variant: on offer ACCEPT (stored on TransportRequest.committed_eta_minutes)"
    inputs: ["TravelEdge(transporter.current_location_id -> origin).base_minutes", "TravelEdge(origin -> destination).base_minutes or airborne_minutes", "required_equipment factor", "oxygen_required", "isolation_precaution", "active_in_transit_count (commit only)"]
    algorithm: forward_looking
    formula: |
      deadhead = 0 when transporter.current_location_id == origin (no edge required),
                 else edge(t.current_location_id, origin).base_minutes
      loaded_base = isolation_precaution == AIRBORNE ? edge(origin, dest).airborne_minutes
                                                       : edge(origin, dest).base_minutes
      loaded = ceil(loaded_base x EQUIPMENT_FACTOR[required_equipment])
      oxygen_add = oxygen_required ? OXYGEN_SETUP_MINUTES : 0
      dispatch_estimate = deadhead + loaded + oxygen_add
      commit_estimate = dispatch_estimate + CONGESTION_SURCHARGE_PER_TRIP x min(active_in_transit_count, CONGESTION_CAP)
      active_in_transit_count = count of TransportRequest with status == IN_TRANSIT at accept time
      Missing edge on either leg => ERR_NO_TRAVEL_EDGE (offer creation fails)
    constants:
      EQUIPMENT_FACTOR: { PORTER_ONLY: 1.0, WHEELCHAIR: 1.1, STRETCHER: 1.25, BARIATRIC_STRETCHER: 1.4 }
      OXYGEN_SETUP_MINUTES: 2
      CONGESTION_SURCHARGE_PER_TRIP: 2
      CONGESTION_CAP: 5
    precision: "integer minutes; ceil applied to the equipment-factor multiplication only"
    variants:
      - name: dispatch
        when: "offer creation; optimistic, no congestion"
        difference: "excludes congestion surcharge"
      - name: commit
        when: "offer accept; committed ETA"
        difference: "adds 2 x min(in-transit count, 5) to the identical legs, so it diverges whenever any other trip is IN_TRANSIT"

  - name: staffing_requirement
    description: "Required transporter headcount per hour block, served by GET /transport/staffing/adequacy"
    trigger: "GET /transport/staffing/adequacy?date&hour_block&window_hours&variant"
    inputs: ["DemandCurve rows (FORECAST)", "completed requests in trailing 24h (REPLAY)", "StaffingShift rows"]
    algorithm: aggregation
    formula: |
      FORECAST: for each block h in [hour_block, hour_block + window_hours):
        required(h) = ceil( SUM_over_priority( expected_requests(h,p) x mean_service_minutes(h,p) ) / 60 )
        day_type is derived from `date`: Monday-Friday => WEEKDAY, Saturday/Sunday => WEEKEND
      REPLAY: required(h) = ceil( SUM of service minutes of requests COMPLETED in [now-24h, now)
        whose created_at hour == h ) / 60 ); service minutes of a request = completed_at - at_pickup_at;
        zero matching completions => required(h) == 0
      ROUNDING ORDER IS PINNED: ceil is applied PER BLOCK, then per-block integers are summed
        (sum-then-round is a different, incorrect algorithm)
      required_transporters = SUM_h required(h)
      scheduled_transporters = count of DISTINCT transporter_id over StaffingShift with status == PLANNED
        that cover block h (shift_start < block_end AND shift_end > block_start, half-open), unioned across blocks
      gap = scheduled_transporters - required_transporters
      window validity: window_hours >= 1 AND hour_block + window_hours <= 24 (else ERR_VALIDATION)
    constants: {}
    precision: "integer headcount; ceil per block"
    variants:
      - name: forecast
        when: "variant == FORECAST"
        difference: "uses configured DemandCurve rows"
      - name: replay
        when: "variant == REPLAY"
        difference: "uses trailing-24h actual completions; produces different headcount whenever actuals diverge from plan"

  - name: sla_posture_evaluation
    description: "Response-time service level: posture per request, escalation, breach recording"
    trigger: "POST /_sweeps/run (queued/assigned requests); ARRIVE_PICKUP (final freeze); COMPLETE (breach record)"
    inputs: ["created_at", "priority", "status", "current clock"]
    algorithm: threshold
    formula: |
      target(priority) = TARGET_RESPONSE_MINUTES[priority]
      elapsed = floor((now - created_at) / 60s)
      EVALUATION ORDER IS PINNED per sweep, per request in created_at ASC order:
        (1) posture := elapsed > target ? BREACHED : (elapsed >= floor(3 x target / 4) ? AT_RISK : ON_TRACK)
        (2) if status == QUEUED AND posture == BREACHED AND priority != STAT:
              escalate priority one tier; escalation_count += 1
        (3) recompute posture fresh against the NEW target (this may drop posture back to AT_RISK/ON_TRACK)
        (4) if final posture == BREACHED AND status IN {QUEUED, ASSIGNED} AND no SLA_BREACH DelayRecord exists:
              create DelayRecord(SLA_BREACH, delay_minutes := elapsed - target(current priority),
                                 cause_code := SYSTEM, recorded_via := SWEEP)
      Boundary: breach requires elapsed STRICTLY > target; elapsed == target remains AT_RISK (within SLA)
    constants:
      TARGET_RESPONSE_MINUTES: { ROUTINE: 120, URGENT: 45, STAT: 15 }
      AT_RISK_NUM: 3
      AT_RISK_DEN: 4
      OFFER_TTL_MINUTES: 10
    precision: "integer minutes, floor on elapsed"
    variants: []

  - name: delay_impact
    description: "DelayRecord downstream impact on OR/imaging schedules"
    trigger: "DelayRecord creation (sweep SLA_BREACH or completion APPOINTMENT_LATE)"
    inputs: ["delay_minutes", "destination Location.location_type"]
    algorithm: weighted_scoring
    formula: |
      attributed = delay_minutes
      cascade = round_half_up(delay_minutes x LOCATION_MULTIPLIER[destination.location_type])
      DelayRecord stores delay_minutes (attributed) and impact_minutes (cascade)
    constants:
      LOCATION_MULTIPLIER: { OR: 2.0, IMAGING: 1.5, WARD: 1.0, ICU: 1.0, ED: 1.0, DISCHARGE_LOUNGE: 1.0, OTHER: 1.0 }
    precision: "integer minutes, round_half_up on the cascade variant"
    variants:
      - name: attributed
        when: "raw delay vs deadline/target"
        difference: "unweighted minutes"
      - name: cascade
        when: "downstream schedule impact"
        difference: "weighted by destination criticality; OR trips count double"

  - name: auto_dispatch_selection
    description: "Selector policy: equipment pick and transporter pick for manual (transporter_id omitted) and automatic offers"
    trigger: "offer creation without transporter_id; auto-dispatch eval when an asset returns to AVAILABLE"
    inputs: ["QUEUED requests", "Transporter set", "AVAILABLE EquipmentAsset set", "TravelEdge set"]
    algorithm: constraint_propagation
    formula: |
      AUTO-DISPATCH EVAL (runs on: offer DECLINE, close CANCEL/SUPERSEDE, RELEASE, cleaning VERIFIED,
      equipment return-to-service; NOT on offer expiry, NOT on manual-offer supersession):
        candidates = TransportRequest with status == QUEUED AND no PENDING offer
          AND required_equipment == freed asset's equipment_type
        rank requests: priority rank (STAT < URGENT < ROUTINE) ASC, then created_at ASC
        take first candidate; eligible transporters =
          status == ON_SHIFT AND no active assignment AND no PENDING offer addressed
          AND not in request.excluded_transporter_ids AND certifications match
          AND edge(t.current_location_id, request.origin) exists
        rank transporters: deadhead base_minutes ASC, tie-break transporter.created_at ASC
        empty transporter pool => no offer; asset stays AVAILABLE
        else create offer + reserve freed asset (AVAILABLE -> RESERVED)
      MANUAL OFFER with transporter_id omitted: same eligibility/ranking over transporters for THIS request;
        empty pool => ERR_NO_ELIGIBLE_TRANSPORTER
      EQUIPMENT SELECTION (manual or auto): AVAILABLE, matching type, created_at ASC then asset_tag ASC;
        empty pool (when required_equipment != PORTER_ONLY) => ERR_NO_AVAILABLE_EQUIPMENT
      PORTER_ONLY requests never trigger and never participate in auto-dispatch (no asset frees for them)
    constants: {}
    precision: "integer minutes"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role allowed on endpoint per §1.5 roles; role-payload restrictions (Transporter may only set own status ON_SHIFT/OFF_SHIFT; only TransportSupervisor sets SUSPENDED; HousekeepingStaff may only advance to IN_PROGRESS/AWAITING_VERIFICATION; VERIFIED/rework only Supervisor; SUPERSEDE only TransportDispatcher; ownership: Transporter acts only on own record/offers/trips, RequestingClinician cancels only own requests)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "request body schema: required fields present, enums in range, integer bounds (base_minutes > 0, window_hours >= 1, hour_block + window_hours <= 24, shift_start < shift_end); SUPERSEDE requires duplicate_of_id present", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path ids exist, validated left-to-right; body-referenced ids (transporter_id, duplicate_of_id, location/equipment FKs) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_request_version == TransportRequest.version on offer creation", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /transport/requests/{id}/offers"] }
  - { priority: 6, category: state, check: "entity status preconditions per §1.2 (request/offer/cleaning/shift/transporter/asset states); terminal request on close or trip-events => ERR_ALREADY_TERMINAL", error_id: "ERR_INVALID_*_STATE | ERR_ALREADY_TERMINAL", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "isolation_precaution != NONE requires transporter.isolation_certified; DEEP cleaning finish requires dwell >= 15 min; verifier must differ from performer (SoD)", error_id: "ERR_ISOLATION_CAPABILITY_MISMATCH | ERR_DWELL_NOT_ELAPSED | ERR_SEGREGATION_OF_DUTY", http_status: 422, applies_to: ["POST /transport/requests/{id}/offers", "POST /transport/cleaning-tasks/{id}/advance"] }
  - { priority: 8, category: business_referential, check: "referenced entity in proper state: shift creation requires transporter NOT SUSPENDED; supersede target must be QUEUED with same patient_ref; clock-in requires a covering PLANNED shift", error_id: "ERR_TRANSPORTER_SUSPENDED | ERR_NOT_DUPLICATE | ERR_NO_SHIFT_COVERAGE", http_status: 422, applies_to: ["POST /transport/staffing-shifts", "POST /transport/requests/{id}/close", "POST /transport/transporters/{id}/set-status"] }
  - { priority: 9, category: business_temporal, check: "scheduled_pickup_time / appointment_deadline must be >= now; new shift must not overlap same transporter's PLANNED shifts (half-open: [start,end), adjacency allowed); patient minimum separation: two non-terminal requests for same patient_ref with scheduled_pickup_time within strictly less than 75 minutes of each other conflict", error_id: "ERR_SCHEDULE_IN_PAST | ERR_SHIFT_OVERLAP | ERR_PATIENT_SCHEDULE_CONFLICT", http_status: 409, applies_to: ["POST /transport/requests", "POST /transport/staffing-shifts"] }
  - { priority: 10, category: business_constraint, check: "uniqueness + capacity: no duplicate active request (same patient_ref + destination, status IN {QUEUED, ASSIGNED, AT_PICKUP, IN_TRANSIT}); TravelEdge (from,to) unique; DemandCurve (day_type, hour_block, priority) unique; transporter eligibility (ON_SHIFT, equipment cert, oxygen cert, no active assignment, no PENDING offer, not excluded); selector empty pools; travel edge existence", error_id: "ERR_DUPLICATE_ACTIVE_REQUEST | ERR_TRAVEL_EDGE_DUPLICATE | ERR_DEMAND_CURVE_CONFLICT | ERR_TRANSPORTER_INELIGIBLE | ERR_NO_ELIGIBLE_TRANSPORTER | ERR_NO_AVAILABLE_EQUIPMENT | ERR_NO_TRAVEL_EDGE", http_status: 422, applies_to: ["POST /transport/requests", "POST /transport/travel-edges", "POST /transport/demand-curves", "POST /transport/requests/{id}/offers"] }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/transport/locations", description: "Create a hospital location", roles: [TransportSupervisor], code: 201, input: [code, name, location_type, zone_code], output: Location, side_effects: [] }
  - { method: POST, path: "/transport/travel-edges", description: "Create a directed travel edge between locations", roles: [TransportSupervisor], code: 201, input: [from_location_id, to_location_id, base_minutes, airborne_minutes], output: TravelEdge, side_effects: [] }
  - { method: GET, path: "/transport/travel-edges", description: "List travel edges", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: ["from_location_id?", "to_location_id?", "limit?", "offset?"], output: "TravelEdge[]", side_effects: [] }
  - { method: GET, path: "/transport/travel-edges/{id}", description: "Get one travel edge", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: [], output: TravelEdge, side_effects: [] }
  - { method: POST, path: "/transport/transporters", description: "Register a transporter (starts OFF_SHIFT, current_location = home)", roles: [TransportSupervisor], code: 201, input: [name, home_location_id, "certified_equipment?", "oxygen_certified?", "isolation_certified?"], output: Transporter, side_effects: [] }
  - { method: GET, path: "/transport/transporters", description: "List transporters", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: ["status?", "home_location_id?", "current_location_id?", "limit?", "offset?"], output: "Transporter[]", side_effects: [] }
  - { method: GET, path: "/transport/transporters/{id}", description: "Get one transporter", roles: [TransportDispatcher, TransportSupervisor, Transporter], code: 200, input: [], output: Transporter, side_effects: [] }
  - { method: POST, path: "/transport/transporters/{id}/set-status", description: "Clock in/out or suspend/reinstate; Transporter self may only set ON_SHIFT/OFF_SHIFT; SUSPENDED and SUSPENDED->OFF_SHIFT are Supervisor-only", roles: [Transporter, TransportSupervisor], code: 200, input: [status], output: Transporter, side_effects: ["Transporter state machine; increments Transporter.version by 1"] }
  - { method: GET, path: "/transport/transporters/{id}/shifts", description: "List shifts of a transporter", roles: [TransportDispatcher, TransportSupervisor, Transporter], code: 200, input: ["status?", "limit?", "offset?"], output: "StaffingShift[]", side_effects: [] }
  - { method: GET, path: "/transport/transporters/{id}/offers", description: "List dispatch offers addressed to a transporter", roles: [TransportDispatcher, TransportSupervisor, Transporter], code: 200, input: ["status?", "limit?", "offset?"], output: "DispatchOffer[]", side_effects: [] }
  - { method: POST, path: "/transport/equipment-assets", description: "Register an equipment asset (starts AVAILABLE)", roles: [TransportSupervisor], code: 201, input: [asset_tag, equipment_type, current_location_id], output: EquipmentAsset, side_effects: [] }
  - { method: GET, path: "/transport/equipment-assets", description: "List equipment assets", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: ["status?", "equipment_type?", "current_location_id?", "limit?", "offset?"], output: "EquipmentAsset[]", side_effects: [] }
  - { method: GET, path: "/transport/equipment-assets/{id}", description: "Get one equipment asset", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: [], output: EquipmentAsset, side_effects: [] }
  - { method: POST, path: "/transport/equipment-assets/{id}/set-service-status", description: "Pull asset OUT_OF_SERVICE (from AVAILABLE/RESERVED) or return to AVAILABLE", roles: [TransportSupervisor], code: 200, input: [service_status], output: EquipmentAsset, side_effects: ["return to AVAILABLE triggers auto-dispatch eval; increments EquipmentAsset.version by 1"] }
  - { method: POST, path: "/transport/requests", description: "Create a transport request (QUEUED, posture ON_TRACK)", roles: [RequestingClinician], code: 201, input: [patient_ref, origin_location_id, destination_location_id, priority, required_equipment, "oxygen_required?", "isolation_precaution?", "scheduled_pickup_time?", "appointment_deadline?"], output: TransportRequest, side_effects: ["requested_by := X-User-ID"] }
  - { method: GET, path: "/transport/requests", description: "List transport requests", roles: [RequestingClinician, TransportDispatcher, TransportSupervisor, Transporter], code: 200, input: ["status?", "priority?", "sla_posture?", "origin_location_id?", "destination_location_id?", "assigned_transporter_id?", "assigned_equipment_id?", "duplicate_of_id?", "limit?", "offset?"], output: "TransportRequest[]", side_effects: [] }
  - { method: GET, path: "/transport/requests/{id}", description: "Get one transport request", roles: [RequestingClinician, TransportDispatcher, TransportSupervisor, Transporter], code: 200, input: [], output: TransportRequest, side_effects: [] }
  - { method: POST, path: "/transport/requests/{id}/close", description: "CANCEL (Clinician own QUEUED / Dispatcher / Supervisor) or SUPERSEDE-as-duplicate (Dispatcher only; duplicate_of_id required)", roles: [RequestingClinician, TransportDispatcher, TransportSupervisor], code: 200, input: [action, "duplicate_of_id?", "reason?"], output: TransportRequest, side_effects: ["offer supersession, asset release + auto-dispatch eval; increments TransportRequest.version by 1"] }
  - { method: POST, path: "/transport/requests/{id}/offers", description: "Dispatch: create a DispatchOffer (manual transporter_id or server auto-select when omitted); supersedes prior PENDING offer; OCC via expected_request_version", roles: [TransportDispatcher], code: 201, input: ["transporter_id?", expected_request_version], output: DispatchOffer, side_effects: ["prior PENDING offer SUPERSEDED + its asset released", "equipment reserved", "increments TransportRequest.version by 1"] }
  - { method: GET, path: "/transport/requests/{id}/offers", description: "List offers of a request, created_at ASC", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: ["status?", "limit?", "offset?"], output: "DispatchOffer[]", side_effects: [] }
  - { method: POST, path: "/transport/dispatch-offers/{id}/respond", description: "Addressed transporter ACCEPTs or DECLINEs a PENDING offer", roles: [Transporter], code: 200, input: [decision], output: DispatchOffer, side_effects: ["ACCEPT: request QUEUED->ASSIGNED + committed_eta", "DECLINE: exclusion + asset release + auto-dispatch eval"] }
  - { method: POST, path: "/transport/requests/{id}/trip-events", description: "Advance trip: ARRIVE_PICKUP | PICKUP | COMPLETE (assigned Transporter) or RELEASE (assigned Transporter or Dispatcher)", roles: [Transporter, TransportDispatcher], code: 200, input: [event, "cause_code?"], output: TransportRequest, side_effects: ["see TransportRequest transitions; COMPLETE spawns CleaningTask and DelayRecords; increments version by 1"] }
  - { method: GET, path: "/transport/requests/{id}/delay-records", description: "List delay records of a request, created_at ASC", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: ["limit?", "offset?"], output: "DelayRecord[]", side_effects: [] }
  - { method: POST, path: "/transport/cleaning-tasks/{id}/advance", description: "Housekeeping: IN_PROGRESS / AWAITING_VERIFICATION; Supervisor: VERIFIED or IN_PROGRESS (rework)", roles: [HousekeepingStaff, TransportSupervisor], code: 200, input: [to_state, "note?"], output: CleaningTask, side_effects: ["asset status coupling; VERIFIED frees asset + auto-dispatch eval"] }
  - { method: GET, path: "/transport/cleaning-tasks", description: "List cleaning tasks", roles: [HousekeepingStaff, TransportDispatcher, TransportSupervisor], code: 200, input: ["status?", "equipment_asset_id?", "transport_request_id?", "limit?", "offset?"], output: "CleaningTask[]", side_effects: [] }
  - { method: GET, path: "/transport/cleaning-tasks/{id}", description: "Get one cleaning task", roles: [HousekeepingStaff, TransportDispatcher, TransportSupervisor], code: 200, input: [], output: CleaningTask, side_effects: [] }
  - { method: POST, path: "/transport/staffing-shifts", description: "Plan a transporter shift (half-open [start,end))", roles: [TransportSupervisor], code: 201, input: [transporter_id, shift_start, shift_end], output: StaffingShift, side_effects: [] }
  - { method: POST, path: "/transport/staffing-shifts/{id}/set-status", description: "Cancel a PLANNED shift", roles: [TransportSupervisor], code: 200, input: [status], output: StaffingShift, side_effects: [] }
  - { method: POST, path: "/transport/demand-curves", description: "Create a demand-curve row (unique per day_type+hour_block+priority)", roles: [TransportSupervisor], code: 201, input: [day_type, hour_block, priority, expected_requests, mean_service_minutes], output: DemandCurve, side_effects: [] }
  - { method: GET, path: "/transport/staffing/adequacy", description: "Computed read: required vs scheduled transporters for a window; day_type derived from date (Mon-Fri WEEKDAY)", roles: [TransportDispatcher, TransportSupervisor], code: 200, input: [date, hour_block, window_hours, variant], output: { required_transporters: integer, scheduled_transporters: integer, gap: integer }, side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. All timestamps and elapsed computations read this clock.", roles: [TransportSupervisor], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }
  - { method: POST, path: "/_sweeps/run", description: "Run the time-driven sweep in pinned order: (1) expire PENDING offers past TTL (created_at ASC); (2) recompute sla_posture for QUEUED/ASSIGNED; (3) escalate QUEUED+BREACHED priorities with posture recompute; (4) create missing SLA_BREACH DelayRecords", roles: [TransportSupervisor], code: 200, input: [], output: { offers_expired: integer, requests_escalated: integer, sla_records_created: integer }, side_effects: ["see state machines; increments version of every mutated entity"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, role-payload restriction violated, or ownership check failed (foreign transporter/offer/trip; clinician cancelling another's request)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, bad bounds (window, minutes, shift_start >= shift_end), SUPERSEDE without duplicate_of_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_request_version != TransportRequest.version on offer creation" }
  - { id: ERR_INVALID_REQUEST_STATE, http: 409, condition: "TransportRequest not in a status that allows the operation (offer on non-QUEUED, trip event out of order, supersede non-QUEUED, cancel from IN_TRANSIT)" }
  - { id: ERR_INVALID_OFFER_STATE, http: 409, condition: "DispatchOffer not PENDING on respond" }
  - { id: ERR_INVALID_ASSET_STATE, http: 409, condition: "EquipmentAsset status blocks the operation (PICKUP with asset not RESERVED; set-service-status from IN_USE/AWAITING_CLEANING/IN_CLEANING; cleaning start with asset not AWAITING_CLEANING)" }
  - { id: ERR_INVALID_CLEANING_STATE, http: 409, condition: "CleaningTask status blocks the advance" }
  - { id: ERR_INVALID_TRANSPORTER_STATE, http: 409, condition: "Transporter status blocks the operation (clock-out/suspend with active assignment or PENDING offer; clock-in while ON_SHIFT or SUSPENDED; accept while not ON_SHIFT)" }
  - { id: ERR_INVALID_SHIFT_STATE, http: 409, condition: "StaffingShift not PLANNED on cancel" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Operation on a COMPLETED/CANCELLED/SUPERSEDED request" }
  - { id: ERR_ISOLATION_CAPABILITY_MISMATCH, http: 422, condition: "Trip isolation_precaution != NONE but selected transporter.isolation_certified is false" }
  - { id: ERR_DWELL_NOT_ELAPSED, http: 422, condition: "DEEP cleaning finished before 15-minute dwell elapsed" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Verifying supervisor's X-User-ID equals performed_by of the cleaning finish" }
  - { id: ERR_TRANSPORTER_SUSPENDED, http: 422, condition: "Shift creation for a SUSPENDED transporter" }
  - { id: ERR_NOT_DUPLICATE, http: 409, condition: "SUPERSEDE target missing, is self, not QUEUED, or different patient_ref" }
  - { id: ERR_NO_SHIFT_COVERAGE, http: 422, condition: "Clock-in without a PLANNED shift covering now" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_pickup_time or appointment_deadline before current clock time" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift overlaps a PLANNED shift of the same transporter (half-open intervals; touching endpoints allowed)" }
  - { id: ERR_PATIENT_SCHEDULE_CONFLICT, http: 409, condition: "Non-terminal request for same patient_ref with scheduled_pickup_time strictly less than 75 minutes apart" }
  - { id: ERR_DUPLICATE_ACTIVE_REQUEST, http: 409, condition: "Same patient_ref + destination_location_id already has a non-terminal request" }
  - { id: ERR_TRAVEL_EDGE_DUPLICATE, http: 409, condition: "TravelEdge with same (from_location_id, to_location_id) exists" }
  - { id: ERR_DEMAND_CURVE_CONFLICT, http: 409, condition: "DemandCurve row with same (day_type, hour_block, priority) exists" }
  - { id: ERR_TRANSPORTER_INELIGIBLE, http: 422, condition: "Manually selected transporter fails eligibility (OFF_SHIFT, equipment/oxygen cert, active assignment, PENDING offer elsewhere, excluded)" }
  - { id: ERR_NO_ELIGIBLE_TRANSPORTER, http: 422, condition: "Auto-select (transporter_id omitted) finds an empty eligible pool" }
  - { id: ERR_NO_AVAILABLE_EQUIPMENT, http: 422, condition: "required_equipment != PORTER_ONLY and no AVAILABLE asset of matching type" }
  - { id: ERR_NO_TRAVEL_EDGE, http: 422, condition: "Missing travel edge on deadhead or loaded leg for the selected transporter" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: RequestingClinician
    description: "Clinical staffer who orders patient transport; owns requests they created"
    identity: opaque
    exclusive_operations:
      - "POST /transport/requests"
    shared_operations:
      - "POST /transport/requests/{id}/close (CANCEL only, own requests only)"
      - "GET /transport/requests, GET /transport/requests/{id}"
  - name: TransportDispatcher
    description: "Transport desk operator who runs the queue and dispatch board"
    identity: opaque
    exclusive_operations:
      - "POST /transport/requests/{id}/offers"
      - "close SUPERSEDE (duplicate consolidation)"
      - "trip-events RELEASE (force-release)"
    shared_operations:
      - "close CANCEL (any non-terminal request)"
      - "read endpoints for requests, offers, transporters, equipment, cleaning, shifts, adequacy"
  - name: Transporter
    description: "Porter who executes trips; X-User-ID equals Transporter.id"
    identity: "entity_backed:Transporter"
    exclusive_operations:
      - "POST /transport/dispatch-offers/{id}/respond (own offers only)"
      - "trip-events ARRIVE_PICKUP / PICKUP / COMPLETE / RELEASE (own assigned trips only)"
      - "set-status ON_SHIFT / OFF_SHIFT (own record only)"
    shared_operations:
      - "GET /transport/transporters/{id}, own shifts, own offers, request reads"
  - name: HousekeepingStaff
    description: "Cleaning crew; performs equipment cleaning but may never verify own work"
    identity: opaque
    exclusive_operations:
      - "cleaning advance to IN_PROGRESS / AWAITING_VERIFICATION"
    shared_operations:
      - "GET /transport/cleaning-tasks(+/{id})"
  - name: TransportSupervisor
    description: "Department supervisor: configuration, staffing, verification, overrides, clock/sweep"
    identity: opaque
    exclusive_operations:
      - "locations/travel-edges/transporters/equipment/shifts/demand-curves creation"
      - "transporter SUSPENDED / reinstate; equipment set-service-status"
      - "cleaning VERIFIED / rework (segregated from performer)"
      - "POST /_clock/set_current_utc, POST /_sweeps/run"
    shared_operations:
      - "close CANCEL (any), all read endpoints"
