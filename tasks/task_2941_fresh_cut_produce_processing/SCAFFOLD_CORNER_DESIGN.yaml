            - call: "GET /grower-lots/${lot_id}"
              as: Auditor
              captures: { d9: "$.data.error_id" }
            - call: "GET /grower-lots/${lot_id}"
              as: QAManager
              captures: { lot_status: "$.data.status", lot_v: "$.data.version" }
          assert:
            - "${d1} through ${d8} are all ERR_UNAUTHORIZED with HTTP 403: PlantAdmin, ReceivingClerk, QATechnician, QAManager, LineOperator, SanitationTech and ShippingClerk each hold their exclusive writes against every other role"
            - "${d6} is ERR_UNAUTHORIZED rather than ERR_SANITATION_INVALID_STATE, even though the event is already VALIDATED: priority 2 precedes every state check"
            - "${d9} == ERR_UNAUTHORIZED for the role string Auditor, which is not one of the seven declared roles, on an endpoint that four real roles may read"
            - "${lot_status} == APPROVED and ${lot_v} == 2: none of the nine refusals mutated anything"

      - name: corner_shared_reads_open_to_some_roles_and_closed_to_others
        claim_type: Shared operation
        grounds:
          - endpoints[GET /process-runs/{id}]
          - endpoints[GET /process-runs/{id}/traceability]
          - roles[ShippingClerk].shared_operations
          - roles[LineOperator].shared_operations
        distinguishing_aspect: "One read is deliberately wide and another deliberately narrow: five roles may fetch a run while ReceivingClerk and SanitationTech may not, and of those five only three may open the traceability view, so the operator who packed the cases cannot see the recall graph."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with 900 cases"]
          setup_api_calls: []
          trigger:
            - call: "GET /process-runs/${run_id}"
              as: PlantAdmin
              captures: { a1: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { a2: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: QATechnician
              captures: { a3: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { a4: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: ShippingClerk
              captures: { a5: "$.data.run_status" }
            - call: "GET /process-runs/${run_id}"
              as: ReceivingClerk
              captures: { r1: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: SanitationTech
              captures: { r2: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}/traceability"
              as: QATechnician
              captures: { t_ok: "$.data.case_count" }
            - call: "GET /process-runs/${run_id}/traceability"
              as: LineOperator
              captures: { r3: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}/traceability"
              as: ShippingClerk
              captures: { r4: "$.data.error_id" }
          assert:
            - "${a1} == ${a2} == ${a3} == ${a4} == ${a5} == CLOSED: all five listed roles read the identical row with HTTP 200"
            - "${r1} and ${r2} are ERR_UNAUTHORIZED with HTTP 403, because neither dock nor sanitation is on the run read"
            - "${t_ok} == 900 for QATechnician, while ${r3} and ${r4} are ERR_UNAUTHORIZED: the traceability view is limited to PlantAdmin, QAManager and QATechnician"

      - name: corner_corrective_action_verifier_cannot_be_the_implementer
        claim_type: Segregation of duties
        grounds:
          - validations[priority=37]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines[CorrectiveAction].transitions[PENDING_VERIFICATION->VERIFIED]
          - entities.CorrectiveAction.fields.implemented_by_user_id
        distinguishing_aspect: "The third declared segregation control is on the corrective action: the operator recorded in implemented_by_user_id is refused the verification even while presenting the QAManager role, and a different manager then verifies the very same record - the check is on X-User-ID, not on the role header."
        test_recipe:
          setup:
            - "execute BASE steps 1-9, so P_ROMAINE, S_FS, L1 (max_atp_rlu 200, 12 components), W1, G1 APPROVED and R1 ACCEPTED exist and the clock is 2026-08-02T05:00:00Z"
            - "a clean fails on ATP, opening a MAJOR corrective action, which operator qat-7 then implements"
          setup_api_calls:
            - call: "POST /lines/${line_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-02T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { san_f: "$.data.id" }
            - call: "POST /sanitation-events/${san_f}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${san_f}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 250, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${san_f}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
            - call: "GET /lines/${line_id}/corrective-actions"
              as: QAManager
              captures: { ca_id: "$.data[0].id", ca_status0: "$.data[0].status" }
            - call: "POST /corrective-actions/${ca_id}/start"
              as: QATechnician
              as_user_id: "qat-7"
              captures: { ca_status1: "$.data.status", ca_impl: "$.data.implemented_by_user_id" }
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { action_taken: "Re-cleaned the blade housing and re-swabbed at 40 RLU" }
              as: QATechnician
              as_user_id: "qat-7"
              captures: { ca_status2: "$.data.status" }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "PASS" }
              as: QAManager
              as_user_id: "qat-7"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qam-3"
              captures: { e_role: "$.data.error_id" }
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { outcome: "PASS" }
              as: QAManager
              as_user_id: "qam-3"
              captures: { ca_status3: "$.data.status", ca_ver: "$.data.verified_by_user_id", ca_vat: "$.data.verified_at", ca_reopen: "$.data.reopen_count" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture: "$.data.posture", open_cnt: "$.data.open_corrective_action_count" }
          assert:
            - "${ca_status0} == OPEN, ${ca_status1} == IN_PROGRESS with ${ca_impl} == qat-7, and ${ca_status2} == PENDING_VERIFICATION"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 409: qat-7 wearing the QAManager role is still the implementer of record"
            - "${e_role} == ERR_UNAUTHORIZED with HTTP 403: qam-3 is a permitted user but QATechnician is not a permitted role, and priority 2 is checked long before priority 37"
            - "${ca_status3} == VERIFIED with ${ca_ver} == qam-3, ${ca_vat} non-null and ${ca_reopen} == 0"
            - "${open_cnt} == 0 and ${posture} == RESTRICTED still, because the failed clean itself has not yet been re-performed - clearing the action alone does not reopen the line"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_spec_create_rejects_a_stale_product_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[spec-create-stale-product]
          - validations[priority=24]
          - errors[ERR_STALE_PRODUCT_VERSION]
          - entities.Product.fields.active_spec_count
        distinguishing_aspect: "The first spec write bumps the product's version through its derived active_spec_count, so replaying the version the client first observed is refused with 412 while the freshly re-read version succeeds - and the refused attempt leaves active_spec_count untouched."
        test_recipe:
          setup: ["execute BASE steps 1-2, so the clock reads 2026-08-02T05:00:00Z and product RML-SHRED exists at version 1 with active_spec_count 0"]
          setup_api_calls:
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { v_seen: "$.data.version", specs0: "$.data.active_spec_count" }
          trigger:
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 14, min_remaining_shelf_life_days_at_ship: 10, atmosphere_required: "MAP_LOW_O2", case_net_weight_lb: 20.0, code_date_format: "JULIAN", expected_product_version: "${v_seen}" }
              as: PlantAdmin
              captures: { spec_a: "$.data.id", spec_a_rev: "$.data.spec_revision", spec_a_status: "$.data.status" }
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { v_after: "$.data.version", specs1: "$.data.active_spec_count" }
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "RTL-WEST", channel: "RETAIL", max_shelf_life_days_offered: 17, min_remaining_shelf_life_days_at_ship: 12, atmosphere_required: "AIR", case_net_weight_lb: 12.0, code_date_format: "CALENDAR", expected_product_version: "${v_seen}" }
              as: PlantAdmin
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { v_still: "$.data.version", specs_still: "$.data.active_spec_count" }
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "RTL-WEST", channel: "RETAIL", max_shelf_life_days_offered: 17, min_remaining_shelf_life_days_at_ship: 12, atmosphere_required: "AIR", case_net_weight_lb: 12.0, code_date_format: "CALENDAR", expected_product_version: "${v_still}" }
              as: PlantAdmin
              captures: { spec_b: "$.data.id", spec_b_rev: "$.data.spec_revision" }
            - call: "GET /products/${prod_id}/customer-specs"
              payload: { status: "ACTIVE" }
              as: QAManager
              captures: { list_first: "$.data[0].id" }
          assert:
            - "${v_seen} == 1 and ${specs0} == 0 on the untouched product"
            - "${spec_a_rev} == 1 with ${spec_a_status} == ACTIVE, and ${v_after} == 2 with ${specs1} == 1: the child write incremented the parent's version through its derived counter"
            - "${e_stale} == ERR_STALE_PRODUCT_VERSION with HTTP 412, the parent-entity form of the stale-version error, because the presented version 1 is no longer current"
            - "${v_still} == 2 and ${specs_still} == 1: the 412 wrote nothing at all"
            - "${spec_b_rev} == 1 as the first revision on the RETAIL channel, and after it the product reads version 3 with active_spec_count 2"
            - "the ACTIVE spec list returns 2 rows with total_count 2, so ${list_first} is one of {${spec_a}, ${spec_b}}"

      - name: corner_consumption_and_void_reject_a_stale_run_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consumption-create-stale-run]
          - validations[priority=25]
          - errors[ERR_STALE_PROCESS_RUN_VERSION]
          - endpoints[POST /lot-consumptions/{id}/void]
        distinguishing_aspect: "Every consumption bumps the run's version, so a client that posts twice from one observed version is refused the second time, and the void endpoint - which carries the same occ_field although it is not itself a declared rule - refuses the same stale value before it touches the receipt balance."
        test_recipe:
          setup: ["execute BASE steps 1-18, so RUN1 is RUNNING at 2026-08-03T07:00:00Z with no consumptions yet and R1 holding 36000.00 accepted pounds"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv1: "$.data.version", in0: "$.data.input_lb" }
          trigger:
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 10000.00, expected_process_run_version: "${rv1}" }
              as: LineOperator
              captures: { cons_a: "$.data.id", cons_a_status: "$.data.status" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 5000.00, expected_process_run_version: "${rv1}" }
              as: LineOperator
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv2: "$.data.version", in1: "$.data.input_lb" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 5000.00, expected_process_run_version: "${rv2}" }
              as: LineOperator
              captures: { cons_b: "$.data.id" }
            - call: "POST /lot-consumptions/${cons_b}/void"
              payload: { expected_process_run_version: "${rv2}" }
              as: LineOperator
              captures: { e_stale2: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { rv3: "$.data.version", in2: "$.data.input_lb" }
            - call: "POST /lot-consumptions/${cons_b}/void"
              payload: { expected_process_run_version: "${rv3}" }
              as: LineOperator
              captures: { void_status: "$.data.status" }
            - call: "GET /raw-receipts/${rcpt_id}"
              as: LineOperator
              captures: { rem: "$.data.remaining_lb" }
          assert:
            - "${in0} == 0.00 with ${rv1} the version observed before any consumption"
            - "${cons_a_status} == ACTIVE and ${rv2} == ${rv1} + 1 with ${in1} == 10000.00"
            - "${e_stale} == ERR_STALE_PROCESS_RUN_VERSION with HTTP 412 for the replayed version, and no second row was created"
            - "${rv3} == ${rv2} + 1 with ${in2} == 15000.00 after the correctly versioned repeat"
            - "${e_stale2} == ERR_STALE_PROCESS_RUN_VERSION: the void presented the version it saw before its own create advanced the run"
            - "${void_status} == VOIDED once the current version is presented, and ${rem} == 26000.00 == 36000.00 - 10000.00, the voided 5000.00 having been returned"

      - name: corner_recall_and_environmental_cascades
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: grower_lot_recall_cascades_to_cases_and_rework_runs
          rationale: "That instance walks the six-hop recall chain end to end including the rework descendant and the trailing-risk recomputation, and env_swab_confirmation_freezes_line_and_holds_runs walks the five-hop environmental chain, so both multi-level cascades and their ordering are already verified there."

      - name: corner_both_dual_variant_calculations
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: run_shelf_life_provisional_vs_final_diverges
          rationale: "That instance shows the PROVISIONAL and FINAL shelf-life variants diverging by three days on one run and the delta being restamped onto the cases, and grower_lot_preharvest_vs_trailing_risk_diverges does the same for the risk score, so both variant pairs and their reconciliation are covered."

      - name: corner_threshold_triggers_and_their_reset
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: wash_target_ppm_then_dwell_evaluation_order_pinned
          rationale: "That instance drives the cumulative organic-load index across its tier boundaries and into the change-out ceiling in the pinned step order, and the corner instance corner_load_index_at_exact_ceiling_forces_changeout_and_reset adds the exact-ceiling trigger plus the reset to zero, so both the boundary and the reset behaviour are pinned."

  - section: consistency_model
    instances:
      - name: corner_every_effect_is_visible_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /process-runs/{id}/close]
          - endpoints[POST /finished-cases/{id}/ship]
        distinguishing_aspect: "The close response itself already carries the yield, the provisional shelf life, the cost allocation and the case counters produced by its own side effects, and an immediately following read returns byte-identical values - nothing is denormalised late, and the ship counters move in the same instant."
        test_recipe:
          setup: ["execute BASE steps 1-22, so RUN1 is RUNNING with 30000.00 lb consumed and the clock reads 2026-08-03T11:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { c_status: "$.data.run_status", c_disp: "$.data.disposition_status", c_out: "$.data.output_lb", c_yield: "$.data.yield_pct", c_prov: "$.data.provisional_shelf_life_days", c_code: "$.data.provisional_code_date", c_total: "$.data.total_run_cost_cents", c_hold: "$.data.cases_on_hold", c_avail: "$.data.cases_available", c_min: "$.data.min_ppm_observed", c_v: "$.data.version" }
            - call: "GET /process-runs/${run_id}"
              as: QAManager
              captures: { g_status: "$.data.run_status", g_disp: "$.data.disposition_status", g_yield: "$.data.yield_pct", g_total: "$.data.total_run_cost_cents", g_hold: "$.data.cases_on_hold", g_v: "$.data.version" }
            - call: "GET /process-runs/${run_id}/hold-records"
              as: QATechnician
              captures: { h_id: "$.data[0].id", h_status: "$.data[0].status", h_held: "$.data[0].cases_held_count", h_shipped: "$.data[0].shipped_case_count" }
          assert:
            - "${c_status} == CLOSED and ${c_disp} == HELD in the close response itself: the automatic hold-and-release hold is already reflected in the body that opened it"
            - "${c_out} == 18000.00 (900 cases x 20.0 lb) and ${c_yield} == 60.00, computed inside the same request"
            - "${c_prov} == 14 with ${c_code} == 2026-08-17, ${c_total} > 0 and ${c_min} == 22.0, all present in the close response rather than on a later read"
            - "${c_hold} == 900 and ${c_avail} == 0: the 900 cases were created and immediately moved ON_HOLD by the same call"
            - "${g_status}, ${g_disp}, ${g_yield}, ${g_total} and ${g_hold} equal ${c_status}, ${c_disp}, ${c_yield}, ${c_total} and ${c_hold} exactly, and ${g_v} == ${c_v}: the read adds no correction"
            - "${h_id} is the hold the close opened, with ${h_status} == HELD, ${h_held} == 900 and ${h_shipped} == 0 - already listable in the very next request"
