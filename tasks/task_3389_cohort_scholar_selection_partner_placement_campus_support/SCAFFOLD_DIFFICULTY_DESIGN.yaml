            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom Two" }, as: Nominator, as_user_id: "${np}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOMINATION_WINDOW_CLOSED (captured ${err}): temporal tier 9 beats fiscal tier 11"
            - "HTTP status 422"
            - "partner.nominations_used remains 1 (no nomination was created)"

  - rule_id: boundary_precision_check
    instances:
      - name: cohort_locks_at_exactly_cohort_size
        grounds:
          - state_machines.Cohort.FORMING_to_LOCKED
          - calculations.cohort_seat_ledger
        distinguishing_aspect: |
          Metric = committed seat count, exercised through POST
          /api/offers/{id}/accept: with cohort_size 3 the cohort must stay
          FORMING at seats_committed == 2 and flip to LOCKED at exactly
          seats_committed == 3 (inclusive >= boundary; a > implementation
          would wrongly stay FORMING at 3).
        test_recipe:
          setup:
            - "Cohort size 3 FORMING; three SELECTED nominees with offers O1,O2,O3"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 20 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, collv: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${collv}" }, as: ProgramAdmin, captures: { agr: $.data.id } }
