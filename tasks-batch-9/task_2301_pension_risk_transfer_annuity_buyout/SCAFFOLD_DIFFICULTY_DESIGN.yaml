            - "Insurer.${ins_c_id}.rating_grade == BBB and Insurer.${ins_c_id}.capital_ratio_bp == 2600"
            - "AnnuityQuote.${qa_id}.quote_status == DECLINED — unchanged, because DECLINED is terminal and the cascade does not resurrect losing quotes"
