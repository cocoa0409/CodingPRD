# =============================================================================
# Task 0102: Auto Insurance Claims (FNOL) — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rules x >=2 instances. Every grounds[] ref resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls/trigger call is a declared
# §1.5 endpoint; literals were computed against §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: repair_vs_total_loss_settlement_diverge_on_same_claim
        grounds:
          - calculations.repair_path_settlement
          - calculations.total_loss_settlement
          - state_machines.Claim.UNDER_REVIEW_to_REPAIR_APPROVED
          - state_machines.Claim.UNDER_REVIEW_to_TOTAL_LOSS
          - entities.Claim.fields.settlement_cents
        distinguishing_aspect: |
          Two valid settlement algorithms on the SAME Claim subject produce different
          payouts for identical ACV/repair/deductible inputs: repair path pays
          (repair_total - deductible) capped at limit = 550000; total-loss path pays
          (ACV - salvage - deductible) capped at limit = 630000. Domain = Claim payout.
        test_recipe:
          setup:
            - "Two claims with identical Coverage (limit 1000000, deductible 50000), identical SUBMITTED estimate repair_total=600000, identical vehicle_acv_cents=800000."
            - "Claim A taken down the REPAIR path; Claim B taken down the TOTAL_LOSS path."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Acme A", policy_number: "POL-A-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "MODIFIED_50" }
              as: ClaimsSupervisor
              captures: { pol_a: $.data.id }
            - call: "POST /policies/${pol_a}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj Senior", license_tier: "SENIOR" }
              as: ClaimsSupervisor
              captures: { adjS: $.data.id }
            # ----- Claim A: repair path -----
            - call: "POST /claims"
              payload: { policy_id: "${pol_a}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000, salvage_value_cents: 120000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim_a: $.data.id }
            - call: "POST /claims/${claim_a}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { ca_v1: $.data.version }
            - call: "POST /claims/${claim_a}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${ca_v1}" }
              as: ClaimsSupervisor
              captures: { ca_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim_a}", lines: [ { description: "labor", labor_cents: 400000, parts_cents: 0 }, { description: "parts", labor_cents: 0, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est_a: $.data.id }
            - call: "POST /repair-estimates/${est_a}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            # ----- Claim B: total-loss path -----
            - call: "POST /claims"
              payload: { policy_id: "${pol_a}", loss_datetime: "2026-06-02T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000, salvage_value_cents: 120000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim_b: $.data.id }
            - call: "POST /claims/${claim_b}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cb_v1: $.data.version }
            - call: "POST /claims/${claim_b}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${cb_v1}" }
              as: ClaimsSupervisor
              captures: { cb_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim_b}", lines: [ { description: "labor", labor_cents: 400000, parts_cents: 0 }, { description: "parts", labor_cents: 0, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est_b: $.data.id }
            - call: "POST /repair-estimates/${est_b}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /total-loss-evaluations"
              payload: { claim_id: "${claim_b}", salvage_retained_by_insurer: true }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
          trigger:
            - call: "POST /claims/${claim_a}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${ca_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { sa: $.data.settlement_cents }
            - call: "POST /claims/${claim_b}/decide-disposition"
              payload: { decision: "TOTAL_LOSS", expected_claim_version: "${cb_v2}" }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
              captures: { sb: $.data.settlement_cents }
          assert:
            - "Claim.${claim_a}.settlement_cents == 550000"
            - "Claim.${claim_b}.settlement_cents == 630000"
            - "Claim.${claim_a}.settlement_cents != Claim.${claim_b}.settlement_cents"

      - name: subrogation_recovery_pure_vs_modified_bar_diverge
        grounds:
          - calculations.subrogation_recovery
          - entities.SubrogationCase.fields.recoverable_cents
          - entities.Policy.fields.comparative_fault_rule
          - state_machines.SubrogationCase.OPEN_to_DEMAND_SENT
        distinguishing_aspect: |
          The comparative-negligence calculation on the SubrogationCase domain (distinct
          from the Claim-payout domain of the sibling instance) yields different recoverable
          amounts for identical demand/fault under different rules: PURE at 50% fault recovers
          250000, MODIFIED_50 at 50% fault recovers 0 (barred).
        test_recipe:
          setup:
            - "Two settled claims, one under a PURE policy and one under a MODIFIED_50 policy, each with insured_fault_pct=50 and a THIRD_PARTY, each subrogation demand_cents=500000."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Pure Co", policy_number: "POL-PURE-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol_pure: $.data.id }
            - call: "POST /policies/${pol_pure}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /policies"
              payload: { policyholder_name: "Mod Co", policy_number: "POL-MOD-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "MODIFIED_50" }
              as: ClaimsSupervisor
              captures: { pol_mod: $.data.id }
            - call: "POST /policies/${pol_mod}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            # ---- helper: drive a claim to SETTLED with a THIRD_PARTY, returns claim id + party id ----
            # PURE claim
            - call: "POST /claims"
              payload: { policy_id: "${pol_pure}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 2000000, insured_fault_pct: 50 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim_p: $.data.id }
            - call: "POST /claim-parties"
              payload: { claim_id: "${claim_p}", party_role: "THIRD_PARTY", display_name: "Other Driver", fault_pct: 50, at_fault_carrier_name: "Rival Mutual" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { party_p: $.data.id }
            - call: "POST /claims/${claim_p}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cp_v1: $.data.version }
            - call: "POST /claims/${claim_p}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${cp_v1}" }
              as: ClaimsSupervisor
              captures: { cp_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim_p}", lines: [ { description: "labor", labor_cents: 600000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est_p: $.data.id }
            - call: "POST /repair-estimates/${est_p}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim_p}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${cp_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cp_v3: $.data.version }
            - call: "POST /claims/${claim_p}/settle"
              payload: { expected_claim_version: "${cp_v3}" }
              as: ClaimsSupervisor
            # MODIFIED_50 claim
            - call: "POST /claims"
              payload: { policy_id: "${pol_mod}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 2000000, insured_fault_pct: 50 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim_m: $.data.id }
            - call: "POST /claim-parties"
              payload: { claim_id: "${claim_m}", party_role: "THIRD_PARTY", display_name: "Other Driver", fault_pct: 50, at_fault_carrier_name: "Rival Mutual" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { party_m: $.data.id }
            - call: "POST /claims/${claim_m}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cm_v1: $.data.version }
            - call: "POST /claims/${claim_m}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${cm_v1}" }
              as: ClaimsSupervisor
              captures: { cm_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim_m}", lines: [ { description: "labor", labor_cents: 600000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est_m: $.data.id }
            - call: "POST /repair-estimates/${est_m}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim_m}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${cm_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { cm_v3: $.data.version }
            - call: "POST /claims/${claim_m}/settle"
              payload: { expected_claim_version: "${cm_v3}" }
              as: ClaimsSupervisor
            # open both subrogation cases
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim_p}", target_party_id: "${party_p}", demand_cents: 500000 }
              as: SubrogationSpecialist
              captures: { sub_p: $.data.id, rec_p: $.data.recoverable_cents }
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim_m}", target_party_id: "${party_m}", demand_cents: 500000 }
              as: SubrogationSpecialist
              captures: { sub_m: $.data.id, rec_m: $.data.recoverable_cents }
          trigger:
            - call: "GET /subrogation-cases/${sub_p}"
              payload: {}
              as: SubrogationSpecialist
              captures: { rp: $.data.recoverable_cents }
            - call: "GET /subrogation-cases/${sub_m}"
              payload: {}
              as: SubrogationSpecialist
              captures: { rm: $.data.recoverable_cents }
          assert:
            - "SubrogationCase.${sub_p}.recoverable_cents == 250000"
            - "SubrogationCase.${sub_m}.recoverable_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: total_loss_settlement_nested_min_max_with_salvage_branch
        grounds:
          - calculations.total_loss_settlement
          - entities.TotalLossEvaluation.fields.salvage_retained_by_insurer
          - entities.Claim.fields.salvage_value_cents
          - state_machines.Claim.UNDER_REVIEW_to_TOTAL_LOSS
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (ACV, salvage, deductible, limit) and non-linear
          interaction — a conditional branch on salvage_retained_by_insurer feeding nested
          max(0, .)/min(., limit). salvage_retained=true yields 630000; the branch is structural,
          not a second tiered-rate copy.
        test_recipe:
          setup:
            - "Total-loss claim: ACV=800000, salvage=120000, COLLISION deductible=50000, limit=1000000, salvage_retained_by_insurer=true."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Comb Co", policy_number: "POL-COMB-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Adj Senior", license_tier: "SENIOR" }
              as: ClaimsSupervisor
              captures: { adjS: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 800000, salvage_value_cents: 120000 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "body", labor_cents: 400000, parts_cents: 200000 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /total-loss-evaluations"
              payload: { claim_id: "${claim}", salvage_retained_by_insurer: true }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
          trigger:
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "TOTAL_LOSS", expected_claim_version: "${c_v2}" }
              as: TotalLossAdjuster
              as_user_id: "${adjS}"
              captures: { s: $.data.settlement_cents }
          assert:
            - "Claim.${claim}.settlement_cents == 630000"

      - name: subrogation_rounding_order_pinned_round_once_at_end
        grounds:
          - calculations.subrogation_recovery
          - entities.SubrogationCase.fields.recoverable_cents
          - state_machines.SubrogationCase.OPEN_to_DEMAND_SENT
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. demand_cents=333333, insured_fault_pct=33, PURE:
          333333 * 67 / 100 = 223333.11 -> round_half_up ONCE at the end = 223333. Rounding per
          intermediate (e.g. rounding the percentage first) would diverge; the scaffold pins
          round-once-at-end.
        test_recipe:
          setup:
            - "A settled PURE-rule claim with insured_fault_pct=33 and a THIRD_PARTY; subrogation demand_cents=333333."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Round Co", policy_number: "POL-RND-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 2000000, insured_fault_pct: 33 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claim-parties"
              payload: { claim_id: "${claim}", party_role: "THIRD_PARTY", display_name: "Other Driver", fault_pct: 67, at_fault_carrier_name: "Rival Mutual" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { party: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "labor", labor_cents: 600000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${c_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v3: $.data.version }
            - call: "POST /claims/${claim}/settle"
              payload: { expected_claim_version: "${c_v3}" }
              as: ClaimsSupervisor
          trigger:
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim}", target_party_id: "${party}", demand_cents: 333333 }
              as: SubrogationSpecialist
              captures: { sub: $.data.id, rec: $.data.recoverable_cents }
          assert:
            - "SubrogationCase.${sub}.recoverable_cents == 223333"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: subrogation_cyclic_negotiating_back_to_demand_sent
        grounds:
          - state_machines.SubrogationCase.DEMAND_SENT_to_NEGOTIATING
          - state_machines.SubrogationCase.NEGOTIATING_to_DEMAND_SENT
          - entities.SubrogationCase.fields.status
        distinguishing_aspect: |
          SubrogationCase exhibits a cycle: DEMAND_SENT -> NEGOTIATING -> DEMAND_SENT (revised
          demand). The re-send recomputes recoverable_cents from the new demand, proving the loop
          is real (not a terminal step). Cyclic shape on the SubrogationCase entity.
        test_recipe:
          setup:
            - "A settled PURE claim with a THIRD_PARTY; an OPEN subrogation case demand_cents=400000; demand sent then negotiation begun."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policyholder_name: "Cyc Co", policy_number: "POL-CYC-1", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-12-31T00:00:00.000Z", comparative_fault_rule: "PURE" }
              as: ClaimsSupervisor
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/coverages"
              payload: { coverage_type: "COLLISION", limit_cents: 1000000, deductible_cents: 50000 }
              as: ClaimsSupervisor
            - call: "POST /adjusters"
              payload: { full_name: "Adj One", license_tier: "STANDARD" }
              as: ClaimsSupervisor
              captures: { adj1: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol}", loss_datetime: "2026-06-01T00:00:00.000Z", loss_type: "COLLISION", vehicle_acv_cents: 2000000, insured_fault_pct: 0 }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { claim: $.data.id }
            - call: "POST /claim-parties"
              payload: { claim_id: "${claim}", party_role: "THIRD_PARTY", display_name: "Other Driver", fault_pct: 100, at_fault_carrier_name: "Rival Mutual" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { party: $.data.id }
            - call: "POST /claims/${claim}/verify-coverage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v1: $.data.version }
            - call: "POST /claims/${claim}/assign-adjuster"
              payload: { adjuster_id: "${adj1}", expected_claim_version: "${c_v1}" }
              as: ClaimsSupervisor
              captures: { c_v2: $.data.version }
            - call: "POST /repair-estimates"
              payload: { claim_id: "${claim}", lines: [ { description: "labor", labor_cents: 600000, parts_cents: 0 } ] }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { est: $.data.id }
            - call: "POST /repair-estimates/${est}/submit"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
            - call: "POST /claims/${claim}/decide-disposition"
              payload: { decision: "REPAIR", expected_claim_version: "${c_v2}" }
              as: ClaimsAdjuster
              as_user_id: "${adj1}"
              captures: { c_v3: $.data.version }
            - call: "POST /claims/${claim}/settle"
              payload: { expected_claim_version: "${c_v3}" }
              as: ClaimsSupervisor
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim}", target_party_id: "${party}", demand_cents: 400000 }
              as: SubrogationSpecialist
              captures: { sub: $.data.id }
            - call: "POST /subrogation-cases/${sub}/send-demand"
              payload: {}
              as: SubrogationSpecialist
            - call: "POST /subrogation-cases/${sub}/begin-negotiation"
              payload: {}
              as: SubrogationSpecialist
          trigger:
            - call: "POST /subrogation-cases/${sub}/send-demand"
              payload: { demand_cents: 300000 }
              as: SubrogationSpecialist
              captures: { st: $.data.status, rec: $.data.recoverable_cents }
          assert:
            - "SubrogationCase.${sub}.status == DEMAND_SENT"
            - "SubrogationCase.${sub}.recoverable_cents == 300000"

      - name: claim_branching_fork_repair_vs_total_loss_divergent_side_effects
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_REPAIR_APPROVED
          - state_machines.Claim.UNDER_REVIEW_to_TOTAL_LOSS
          - entities.Claim.fields.disposition
        distinguishing_aspect: |
          Claim forks at UNDER_REVIEW into two branches with divergent side-effect sets:
          REPAIR sets disposition=REPAIR via repair_path_settlement; TOTAL_LOSS sets
          disposition=TOTAL_LOSS via total_loss_settlement AND curtails rentals. Branching
          shape on the Claim entity (different entity than the cyclic SubrogationCase instance).
