              payload: { leg_index: 2, from_holder: "SERVICE", to_holder: "AGENCY", scheduled_date: "2026-06-01" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg2_id: $.data.id }
            - call: "POST /expediting/courier-legs/${leg2_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg2_id}/complete"
              payload: { outcome: "DELIVERED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/orders/${ord_id}/tender"
              payload: {}
              as: AgencyLiaison
              as_user_id: "al-1"
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-24T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/orders/${ord_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyLiaison
              as_user_id: "al-1"
            - call: "GET /expediting/orders/${ord_id}/courier-legs"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
              captures: { leg3_id: "$.data[2].id" }
            - call: "POST /expediting/courier-legs/${leg3_id}/dispatch"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/courier-legs/${leg3_id}/complete"
              payload: { outcome: "DELIVERED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/orders/${ord_id}/shipments"
              payload: { method: "GROUND", address_region_code: "CA" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /expediting/shipments/${ship_id}/delivery-attempt"
              payload: { outcome: "FAILED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/shipments/${ship_id}/delivery-attempt"
              payload: { outcome: "FAILED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/shipments/${ship_id}/delivery-attempt"
              payload: { outcome: "FAILED" }
              as: CourierOps
              as_user_id: "co-1"
            - call: "POST /expediting/shipments/${ship_id}/delivery-attempt"
              payload: { outcome: "FAILED" }
              as: CourierOps
              as_user_id: "co-1"
              captures: { del_err: $.data.error_id }
            - call: "POST /expediting/shipments/${ship_id}/pickup"
              payload: {}
              as: CourierOps
              as_user_id: "co-1"
          assert:
            - "Shipment.${ship_id}.method == OVERNIGHT"
            - "Shipment.${ship_id}.escalation_fee_cents == 4500"
            - "Order.${ord_id}.service_fee_quoted_cents == 15000"
            - "Order.${ord_id}.total_quoted_cents == 31000"
            - "after three FAILED attempts Shipment.${ship_id}.delivery_status == HELD_FOR_PICKUP and attempt_count == 3"
            - "the fourth attempt responds 409 with error_id ERR_DELIVERY_ATTEMPT_CAP_EXCEEDED"
            - "Shipment.${ship_id}.delivery_status == PICKED_UP"
            - "Order.${ord_id}.workflow_status == COMPLETED"
            - "Order.${ord_id}.custody_holder == APPLICANT"
