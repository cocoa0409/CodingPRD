      - name: stale_or_future_period_version_on_invoice_prepare_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.UtilizationPeriod_version_guard
          - validations[priority 30 ERR_STALE_PERIOD_VERSION]
          - errors.ERR_STALE_PERIOD_VERSION
          - endpoints[POST /wetlease/settlement-invoices]
        distinguishing_aspect: |
          The guard is EQUALITY against the live version, not a `>=` watermark, so both a version one
          behind (the classic lost-update race, where a clerk read the period before the month was
          closed) and a version one ahead are 412 ERR_STALE_PERIOD_VERSION. Because closing the month
          incremented the version, the stale value is exactly the pre-close one. The failed attempts
          must not create an invoice, must not move the period and must NOT bump the version - so the
          third attempt with the unchanged live version still succeeds.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Lease ACTIVE on G-ACMI with no legs; the 2026-09 period has been closed, so it is PENDING_SETTLEMENT at final_charge_cents 2400000 and its version has been incremented once by the close."
