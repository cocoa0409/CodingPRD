# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3457_watch_warning_issuance_polygon_definition_dissemination
# 19 instances across the nine Difficulty Rules of SKILL.md §0.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: polygon_area_planar_vs_geodetic_same_vertices
        grounds:
          - calculations.polygon_area_sq_km
          - entities.ForecastOffice.fields.area_method
          - entities.Product.fields.polygon_area_sq_km
        distinguishing_aspect: "Geometry domain: identical polygon vertices produce polygon_area_sq_km 246.42 under a PLANAR office and 123.21 under a GEODETIC office at 60 degrees latitude (cos 60 = 0.5 exactly) — the variant is selected by office configuration, not by request input."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Office P is PLANAR, office G is GEODETIC; each has one forecaster and one SEVERE_THUNDERSTORM storm with wind 60 mph. Both warning drafts carry the identical rectangle: lat 59.95..60.05 (centroid exactly 60.0), lon 0.0..0.2."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KPLA", name: "Planar Office", region: "NORTH", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_p: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KGEO", name: "Geodetic Office", region: "NORTH", area_method: "GEODETIC" }
              as: PlatformAdmin
              captures: { off_g: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_p}", full_name: "Pat Planar", employee_code: "EMP-P1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_p: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_g}", full_name: "Gail Geodesy", employee_code: "EMP-G1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_g: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_p}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${fc_p}"
              captures: { storm_p: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_g}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${fc_g}"
              captures: { storm_g: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${off_p}", storm_event_id: "${storm_p}", polygon: { vertices: [ { lat: 59.95, lon: 0.0 }, { lat: 59.95, lon: 0.2 }, { lat: 60.05, lon: 0.2 }, { lat: 60.05, lon: 0.0 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_p}"
              captures: { prod_p: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${off_g}", storm_event_id: "${storm_g}", polygon: { vertices: [ { lat: 59.95, lon: 0.0 }, { lat: 59.95, lon: 0.2 }, { lat: 60.05, lon: 0.2 }, { lat: 60.05, lon: 0.0 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_g}"
              captures: { prod_g: $.data.id }
          assert:
            - "Product.${prod_p}.polygon_area_sq_km == 246.42 (PLANAR: 0.2*111 km by 0.1*111 km)"
            - "Product.${prod_g}.polygon_area_sq_km == 123.21 (GEODETIC: 0.2*111*cos(60deg) = 11.1 km by 11.1 km)"
            - "Product.${prod_p}.polygon_area_sq_km != Product.${prod_g}.polygon_area_sq_km for byte-identical vertices"
            - "both products are DRAFT with version 1 (creation-time computation, no issuance needed)"

      - name: verification_matching_polygon_strict_vs_county_fallback
        grounds:
          - calculations.verification_matching
          - calculations.verification_statistics_aggregation
          - endpoints.POST_/alerts/verification-statistics
        distinguishing_aspect: "Verification domain: the same confirmed events and the same warning yield pod 0.500 / avg lead 30.0 under POLYGON_STRICT but pod 1.000 / avg lead 35.0 under COUNTY_FALLBACK, because the second event sits in the resolved county yet outside the drawn polygon."
        test_recipe:
          setup:
            - "Office O (PLANAR) with zone Z (rect lat 0..0.1, lon 0..0.1, surveyed 123.21, LOW). FLASH_FLOOD storm with rainfall_rate 2.5. Warning W covers the left half of Z (lon 0..0.05), issued at 2026-09-01T10:00:00Z, expires 11:00. Event E1 inside the polygon observed 10:30; event E2 inside Z but outside the polygon observed 10:40; both CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:50:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/offices"
              payload: { office_code: "KVRF", name: "Verify Office", region: "EAST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_o: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "EZ01", name: "Echo Zone", office_id: "${off_o}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { zone_z: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_o}", full_name: "Fred Verify", employee_code: "EMP-V1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_o: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_o}", hazard_type: "FLASH_FLOOD", rainfall_rate_in_hr: 2.5 }
              as: Forecaster
              as_user_id: "${fc_o}"
              captures: { storm_s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "FLASH_FLOOD", issuing_office_id: "${off_o}", storm_event_id: "${storm_s}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.05 }, { lat: 0.1, lon: 0.05 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T11:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_o}"
              captures: { prod_w: $.data.id, w_v: $.data.version }
            - call: "POST /alerts/products/${prod_w}/issue"
              payload: { expected_product_version: "${w_v}" }
              as: Forecaster
              as_user_id: "${fc_o}"
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${zone_z}", hazard_type: "FLASH_FLOOD", observed_at: "2026-09-01T10:30:00Z", location_lat: 0.05, location_lon: 0.02, magnitude: "2.5in" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { ev_1: $.data.id }
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${zone_z}", hazard_type: "FLASH_FLOOD", observed_at: "2026-09-01T10:40:00Z", location_lat: 0.05, location_lon: 0.075, magnitude: "2.4in" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { ev_2: $.data.id }
            - call: "POST /alerts/verification-events/${ev_1}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
            - call: "POST /alerts/verification-events/${ev_2}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
          trigger:
            - call: "POST /alerts/verification-statistics"
              payload: { office_id: "${off_o}", hazard_type: "FLASH_FLOOD", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z", matching_variant: "POLYGON_STRICT" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { stat_strict: $.data.id }
            - call: "POST /alerts/verification-statistics"
              payload: { office_id: "${off_o}", hazard_type: "FLASH_FLOOD", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z", matching_variant: "COUNTY_FALLBACK" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { stat_fallback: $.data.id }
          assert:
            - "VerificationStatistic.${stat_strict}: total_warnings == 1, events_total == 2, events_warned == 1, events_unwarned == 1, false_alarms == 0"
            - "VerificationStatistic.${stat_strict}.pod == 0.5 and .far == 0.0 and .avg_lead_time_minutes == 30.0"
            - "VerificationStatistic.${stat_fallback}: events_warned == 2, events_unwarned == 0, pod == 1.0, avg_lead_time_minutes == 35.0, far == 0.0"
            - "VerificationStatistic.${stat_strict}.pod != VerificationStatistic.${stat_fallback}.pod over identical underlying data"
            - "VerificationEvent.${ev_1}.matched_product_ids == [${prod_w}] and VerificationEvent.${ev_2}.matched_product_ids == [] (adjudication always uses POLYGON_STRICT)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: impact_tier_population_gate_downgrades_tag
        grounds:
          - calculations.impact_tier_scoring
          - entities.Product.fields.damage_threat
          - entities.CountyZone.fields.population_tier
        distinguishing_aspect: "Mode (a) >=3 inputs with non-linear interaction: identical storm readings (wind 85, qualifying for CATASTROPHIC) yield damage_threat NONE over a LOW-tier zone but CATASTROPHIC over an URBAN-tier zone, because the population gate overrides the reading tier."
        test_recipe:
          setup:
            - "Office with two zones: ZL (LOW, rect lon 0.2..0.3) and ZU (URBAN, rect lon 0.0..0.1), both lat 0..0.1 surveyed 123.21. One SEVERE_THUNDERSTORM storm, max_wind_mph 85 (>= 80 catastrophic-qualified, >= 70 considerable-qualified)."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KIMP", name: "Impact Office", region: "EAST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_i: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZL01", name: "Lowland", office_id: "${off_i}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { zone_l: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZU01", name: "Urbania", office_id: "${off_i}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "URBAN", coastal: false }
              as: PlatformAdmin
              captures: { zone_u: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_i}", full_name: "Ivy Impact", employee_code: "EMP-I1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_i: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_i}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 85 }
              as: Forecaster
              as_user_id: "${fc_i}"
              captures: { storm_i: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${off_i}", storm_event_id: "${storm_i}", polygon: { vertices: [ { lat: 0.0, lon: 0.2 }, { lat: 0.0, lon: 0.3 }, { lat: 0.1, lon: 0.3 }, { lat: 0.1, lon: 0.2 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_i}"
              captures: { prod_low: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${off_i}", storm_event_id: "${storm_i}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_i}"
              captures: { prod_urb: $.data.id }
          assert:
            - "Product.${prod_low}.damage_threat == NONE (catastrophic gate needs HIGH/URBAN, considerable gate needs MEDIUM+; LOW satisfies neither despite wind 85)"
            - "Product.${prod_low}.wea_360 == false"
            - "Product.${prod_urb}.damage_threat == CATASTROPHIC and .wea_360 == true (wind 85 >= 80 plus URBAN resolved zone)"
            - "both drafts drew on the same StormEvent readings — only the resolved zone population tiers differ"

      - name: lead_time_per_event_floor_then_average
        grounds:
          - calculations.verification_statistics_aggregation
          - entities.VerificationStatistic.fields.avg_lead_time_minutes
        distinguishing_aspect: "Mode (b) nested rounding order: leads of 89 and 121 seconds are floored to 1 and 2 whole minutes BEFORE averaging, giving 1.5; the forbidden order (average 105 raw seconds, then convert) gives 1.8 — the scaffold pins floor-then-average."
        test_recipe:
          setup:
            - "Office, one zone Z (rect lat 0..0.1 lon 0..0.1, surveyed 123.21), FLASH_FLOOD storm rain 2.5, warning covering all of Z issued exactly 2026-09-01T10:00:00Z, expires 11:00. Two confirmed events inside the polygon: E1 observed 10:01:29 (89 s lead), E2 observed 10:02:01 (121 s lead)."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KRND", name: "Round Office", region: "EAST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_r: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZR01", name: "Round Zone", office_id: "${off_r}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { zone_r: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_r}", full_name: "Rita Round", employee_code: "EMP-R1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_r: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_r}", hazard_type: "FLASH_FLOOD", rainfall_rate_in_hr: 2.5 }
              as: Forecaster
              as_user_id: "${fc_r}"
              captures: { storm_r: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "FLASH_FLOOD", issuing_office_id: "${off_r}", storm_event_id: "${storm_r}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T11:00:00Z" }
              as: Forecaster
              as_user_id: "${fc_r}"
              captures: { prod_r: $.data.id, w_rv: $.data.version }
            - call: "POST /alerts/products/${prod_r}/issue"
              payload: { expected_product_version: "${w_rv}" }
              as: Forecaster
              as_user_id: "${fc_r}"
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${zone_r}", hazard_type: "FLASH_FLOOD", observed_at: "2026-09-01T10:01:29Z", location_lat: 0.05, location_lon: 0.05, magnitude: "2.5in" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { ev_a: $.data.id }
            - call: "POST /alerts/verification-events"
              payload: { zone_id: "${zone_r}", hazard_type: "FLASH_FLOOD", observed_at: "2026-09-01T10:02:01Z", location_lat: 0.06, location_lon: 0.06, magnitude: "2.6in" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { ev_b: $.data.id }
            - call: "POST /alerts/verification-events/${ev_a}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
            - call: "POST /alerts/verification-events/${ev_b}/adjudicate"
              payload: { outcome: "CONFIRMED" }
              as: VerificationAnalyst
              as_user_id: "va-1"
          trigger:
            - call: "POST /alerts/verification-statistics"
              payload: { office_id: "${off_r}", hazard_type: "FLASH_FLOOD", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z", matching_variant: "POLYGON_STRICT" }
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { stat_r: $.data.id }
          assert:
            - "VerificationStatistic.${stat_r}.events_warned == 2 and .pod == 1.0"
            - "VerificationStatistic.${stat_r}.avg_lead_time_minutes == 1.5 (floor(89s)=1, floor(121s)=2, mean 1.5)"
            - "VerificationStatistic.${stat_r}.avg_lead_time_minutes != 1.8 (the average-then-convert order is forbidden)"

      - name: wea_truncation_drops_lowest_overlap_preserving_threshold
        grounds:
          - calculations.wea_message_rendering
          - calculations.zone_overlap_resolution
          - endpoints.GET_/alerts/products/{id}/wea-preview
        distinguishing_aspect: "Mode (c) circular-looking dependency: the WEA message budget truncates the zone list while the zone list determines message length; the pinned order computes the >= 0.10 inclusion set once, then drops smallest-overlap zones (tie: greatest zone_code) without ever recomputing the threshold."
        test_recipe:
          setup:
            - "Office (PLANAR) with three lat 0..0.1 zones: ZB01 lon 0.0..0.1 (LOW), ZA01 lon 0.1..0.2 (URBAN), ZC01 lon 0.2..0.3 (LOW), each surveyed 123.21. TORNADO storm with debris_signature true. Polygon lon 0.075..0.225 lat 0..0.1 overlaps ZA01 100%, ZB01 25%, ZC01 25%. WEA channel budget 36 chars."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KWEA", name: "Wea Office", region: "EAST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_w: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZB01", name: "Zone Bee", office_id: "${off_w}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { zone_b: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZA01", name: "Zone Ay", office_id: "${off_w}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.1, lon_max: 0.2, surveyed_area_sq_km: 123.21, population_tier: "URBAN", coastal: false }
              as: PlatformAdmin
              captures: { zone_a: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZC01", name: "Zone Cee", office_id: "${off_w}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { zone_c: $.data.id }
            - call: "POST /alerts/alert-channels"
              payload: { name: "WEA-TEST", channel_type: "WEA", supports_levels: ["WARNING"], max_message_chars: 36, requires_confirmation: true }
              as: PlatformAdmin
              captures: { chan_w: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${off_w}", full_name: "Wendy Wea", employee_code: "EMP-W1", level: "SENIOR" }
              as: PlatformAdmin
              captures: { fc_w: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${off_w}", hazard_type: "TORNADO", debris_signature: true }
              as: Forecaster
              as_user_id: "${fc_w}"
              captures: { storm_w: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "TORNADO", issuing_office_id: "${off_w}", storm_event_id: "${storm_w}", polygon: { vertices: [ { lat: 0.0, lon: 0.075 }, { lat: 0.0, lon: 0.225 }, { lat: 0.1, lon: 0.225 }, { lat: 0.1, lon: 0.075 } ] }, expires_at: "2026-09-01T23:45:00Z" }
              as: Forecaster
              as_user_id: "${fc_w}"
              captures: { prod_w2: $.data.id }
          trigger:
            - call: "GET /alerts/products/${prod_w2}/wea-preview"
              payload: { channel_id: "${chan_w}" }
              as: Forecaster
              as_user_id: "${fc_w}"
          assert:
            - "Product.${prod_w2}.damage_threat == CATASTROPHIC (debris signature plus URBAN ZA01)"
            - "preview.message == \"WEA TORNADO CATASTROPHIC ZA01 2345Z\" and preview.char_count == 35"
            - "preview.included_zone_ids == [${zone_a}]"
            - "preview.dropped_zone_ids == [${zone_c}, ${zone_b}] in drop order (0.250 tie broken by greatest zone_code: ZC01 before ZB01)"
            - "preview.would_overflow == false and 35 <= 36 (budget honored without recomputing the 0.10 inclusion threshold)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: product_coordination_decline_revert_resubmit_cycle
        grounds:
          - state_machines.Product.PENDING_COORDINATION_to_DRAFT
          - state_machines.Product.DRAFT_to_PENDING_COORDINATION
          - state_machines.CoordinationRequest.REQUESTED_to_DECLINED
        distinguishing_aspect: "Product has a revert cycle (PENDING_COORDINATION -> DRAFT on decline, then DRAFT -> PENDING_COORDINATION again) — not a linear pipeline — and the version increments across every loop iteration."
        test_recipe:
          setup:
            - "Offices A, B, C. Agreements AB and AC both cover HURRICANE (timeouts 15 and 20). Zone ZA1 belongs to A. A HURRICANE watch over ZA1 requires coordination with all agreement partners (hazard-driven requirement)."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KAAA", name: "Office A", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KBBB", name: "Office B", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_b: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KCCC", name: "Office C", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { off_c: $.data.id }
            - call: "POST /alerts/neighbor-agreements"
              payload: { office_a_id: "${off_a}", office_b_id: "${off_b}", hazard_types: ["HURRICANE"], coordination_timeout_minutes: 15 }
              as: PlatformAdmin
            - call: "POST /alerts/neighbor-agreements"
