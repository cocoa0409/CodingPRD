              captures: { st_verifier: $.data.status, acreage_verifier: $.data.outstanding_acreage }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: Landowner
              as_user_id: "landowner-1"
              captures: { st_landowner: $.data.status, acreage_landowner: $.data.outstanding_acreage }
          assert:
            - "both trigger calls return HTTP 200"
            - "${st_verifier} == DRAFT"
            - "${st_landowner} == DRAFT"
            - "${acreage_verifier} == 4000.0000"
            - "${acreage_landowner} == 4000.0000"
            - "StorageProject.${proj_id}.version == 1"

  # ===========================================================================
  # §1.9 corner coverage, section 8 of 9
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: project_version_advances_one_step_per_write_and_the_matching_version_is_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[model-create-stale-project]
          - endpoints[POST /ccs/geologic-models]
          - entities.StorageProject.fields.version
        distinguishing_aspect: |
          The version guard is a per-write ratchet, not a one-off token: the project is created at
          version 1, the first model create carrying expected_project_version 1 succeeds and leaves the
          project at 2, and a second model create carrying the freshly read 2 also succeeds and leaves it
          at 3, so each write is accepted exactly once with the value the previous write produced.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' freshly created at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { m1_id: $.data.id }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { proj_v1: $.data.version }
          trigger:
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v1}", model_label: "M2-PROB", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "PROBABILISTIC_P10" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { m2_id: $.data.id }
          assert:
            - "${proj_v0} == 1"
            - "${proj_v1} == 2"
            - "the trigger call returns HTTP 201"
            - "StorageProject.${proj_id}.version == 3"
            - "GeologicModel.${m1_id}.version == 1"
            - "GeologicModel.${m2_id}.version == 1"
            - "GeologicModel.${m2_id}.assessment_variant == PROBABILISTIC_P10"
            - "GeologicModel.${m2_id}.plume_status == NOT_RUN"

      - name: one_write_fans_out_across_four_entity_kinds
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /ccs/remediation-orders]
          - entities.StorageProject.fields.operational_posture
        distinguishing_aspect: |
          A single write reaching project, instrument, permit and order state in one request is the
          fan-out asserted by the §1.8 cascade instance.
        excluded_because:
          difficulty_instance: "transitive_cascade / remediation_order_freeze_cascade_depth_four"
          rationale: "That §1.8 instance walks all four depths of the cascade and asserts the state of every touched row."

      - name: two_indices_stored_side_by_side_on_one_row
        claim_type: dual_variant_calculation
        grounds:
          - calculations.seal_integrity_index
          - entities.GeologicModel.fields.seal_integrity_index_p10
        distinguishing_aspect: |
          Storing both the deterministic and the P10 index on every model and letting only one of them
          govern is the dual-variant layer asserted by the §1.8 instance.
        excluded_because:
          difficulty_instance: "dual_variant_calc / seal_integrity_index_variant_flips_pass_to_fail"
          rationale: "That §1.8 instance asserts 1.600 PASS and 0.498 FAIL from the same inputs on two models."

      - name: derived_requirement_survives_repeated_recomputation
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.required_financial_assurance
          - entities.StorageProject.fields.assurance_coverage_status
        distinguishing_aspect: |
          The requirement is recomputed by six different triggers and must land on the same value each
          time it is read, which is the reconciliation asserted step by step by the §1.8 instance.
        excluded_because:
          difficulty_instance: "combinatorial_formula / required_assurance_pinned_evaluation_order"
          rationale: "That §1.8 instance asserts the stored requirement after each recompute trigger in the pinned order."

  # ===========================================================================
  # §1.9 corner coverage, section 9 of 9
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: finalize_aor_effects_are_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - endpoints[POST /ccs/geologic-models/{id}/finalize-aor]
          - calculations.legacy_wellbore_risk_score
          - calculations.required_financial_assurance
        distinguishing_aspect: |
          Every consequence of the write is readable in the very next request with no settling step: the
          finalize-aor response itself reports plume_status AOR_FINALIZED, the immediately following
          project read reports aor_radius_km 3.0 and required_financial_assurance_usd 25259166.94, and
          the immediately following wellbore read reports the re-screened CA_REQUIRED with risk_score
          92.00, so no read ever observes the pre-write values once the write has returned.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' with an ACCEPTED model whose simulation produced aor_radius_km 3.0"
            - "one LegacyWellbore 0.4 km out, 2400 m deep, OPEN_HOLE, no plug record, penetrating the seal, still OUT_OF_AOR"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/geologic-models/${model_id}/review"
              payload: { decision: "ACCEPT", review_note: "seal integrity acceptable" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/legacy-wellbores"
              payload: { project_id: "${proj_id}", api_number: "15-001-00021", distance_from_injector_km: 0.4, total_depth_m: 2400, penetrates_seal: true, plug_condition: "OPEN_HOLE", plug_record_available: false }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w_id: $.data.id, ca_before: $.data.corrective_action_status, risk_before: $.data.risk_score }
          trigger:
            - call: "POST /ccs/geologic-models/${model_id}/finalize-aor"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plume_state: $.data.plume_status, model_aor: $.data.aor_radius_km }
            - call: "GET /ccs/storage-projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { proj_aor: $.data.aor_radius_km, req_after: $.data.required_financial_assurance_usd, pct_after: $.data.corrective_action_completion_pct }
            - call: "GET /ccs/legacy-wellbores/${w_id}"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { ca_after: $.data.corrective_action_status, risk_after: $.data.risk_score, cost_after: $.data.ca_cost_estimate_usd }
          assert:
            - "${ca_before} == OUT_OF_AOR"
            - "${risk_before} == 52.00"
            - "the first trigger call returns HTTP 200"
            - "${plume_state} == AOR_FINALIZED"
            - "${model_aor} == 3.0"
            - "${proj_aor} == 3.0"
            - "${req_after} == 25259166.94"
            - "${pct_after} == 0.00"
            - "${ca_after} == CA_REQUIRED"
            - "${risk_after} == 92.00"
            - "${cost_after} == 622000.00"
            - "StorageProject.${proj_id}.assurance_coverage_status == UNFUNDED"

      - name: new_monitoring_method_is_visible_in_the_parent_listing_on_the_next_request
        claim_type: immediate
        grounds:
          - endpoints[POST /ccs/monitoring-plans/{id}/methods]
          - endpoints[GET /ccs/monitoring-plans/{id}/methods]
          - calculations.mrv_coverage_score
        distinguishing_aspect: |
          A child created by one request is already part of its parent's listing and of its parent's
          derived score in the next request: the domain-filtered method listing reports total_count 1 for
          ATMOSPHERIC immediately after the create, and the plan read already shows coverage_score 70.00
          instead of the 65.00 it had one request earlier.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
            - "one DRAFT MonitoringPlan with a subsurface method scoring 1.0000 and a surface method scoring 0.5000, coverage_score 65.00 and no atmospheric method"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/monitoring-plans"
              payload: { project_id: "${proj_id}", plan_label: "MRV-1" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SUBSURFACE", technique: "4D seismic and downhole pressure", detection_threshold_tpy: 500, frequency_per_year: 2, spatial_coverage_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SURFACE", technique: "soil gas flux survey", detection_threshold_tpy: 100, frequency_per_year: 4, spatial_coverage_pct: 50 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "GET /ccs/monitoring-plans/${plan_id}"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { cov_before: $.data.coverage_score, atm_sub_before: $.data.atmospheric_subscore }
          trigger:
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "ATMOSPHERIC", technique: "tunable diode laser tower", detection_threshold_tpy: 25, frequency_per_year: 12, spatial_coverage_pct: 25 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { atm_id: $.data.id, atm_score: $.data.method_score }
            - call: "GET /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "ATMOSPHERIC", status: "ACTIVE", limit: 10, offset: 0 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "GET /ccs/monitoring-plans/${plan_id}"
              payload: {}
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { cov_after: $.data.coverage_score, atm_sub_after: $.data.atmospheric_subscore }
          assert:
            - "${cov_before} == 65.00"
            - "${atm_sub_before} == 0.0000"
            - "the first trigger call returns HTTP 201"
            - "${atm_score} == 0.2500"
            - "the second trigger call returns HTTP 200 with total_count 1 and lists only ${atm_id}"
            - "${cov_after} == 70.00"
            - "${atm_sub_after} == 0.2500"
            - "MonitoringMethod.${atm_id}.status == ACTIVE"
            - "MonitoringPlan.${plan_id}.status == DRAFT"
