  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: Calculations
    instances:

      - name: scaled_score_rounds_half_up_then_penalises_then_clamps
        claim_type: Precision
        grounds: [calculations.attempt_scaled_score, "endpoints[POST /test-attempts/{attempt_id}/score]"]
        distinguishing_aspect: |
          The three steps are ordered: round_half_up the scaled base, SUBTRACT the
          irregularity penalty, and only then clamp to [0, 1000]. A raw score of 7
          lands on the exact .75 rounding case, and a raw score of 3 with an
          irregularity drives the intermediate value NEGATIVE, which is the only
          input that distinguishes penalise-then-clamp from clamp-then-penalise.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One TestAdministration E2 (room T40, MATH, proctor-40, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 8) driven to OPEN — the window brackets the clock."
            - "Four Students SU1-SU4 with no transcript and no placement, one attempt each."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T40", subject_area: "MATH", proctor_user_id: "proctor-40", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 8 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e2: $.data.id }
            - call: "POST /test-administrations/${e2}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-40"
            - call: "POST /students"
              payload: { student_number: "SU1", full_name: "Student U One", race_ethnicity_code: "AIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su1: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${su1}", administration_id: "${e2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a1: $.data.id }
            - call: "POST /test-attempts/${a1}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-40"
            - call: "POST /students"
              payload: { student_number: "SU2", full_name: "Student U Two", race_ethnicity_code: "AIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su2: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${su2}", administration_id: "${e2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a2: $.data.id }
            - call: "POST /test-attempts/${a2}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-40"
            - call: "POST /students"
              payload: { student_number: "SU3", full_name: "Student U Three", race_ethnicity_code: "NHPI" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su3: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${su3}", administration_id: "${e2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a3: $.data.id }
            - call: "POST /test-attempts/${a3}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-40"
            - call: "POST /students"
              payload: { student_number: "SU4", full_name: "Student U Four", race_ethnicity_code: "NHPI" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su4: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${su4}", administration_id: "${e2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a4: $.data.id }
            - call: "POST /test-attempts/${a4}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-40"
          trigger:
            - call: "POST /test-attempts/${a1}/score"
              payload: { raw_score: 7 }
              as: Proctor
              as_user_id: "proctor-40"
              captures: { s1: $.data.scaled_score, st1: $.data.state, sat1: $.data.scored_at }
            - call: "POST /test-attempts/${a2}/score"
              payload: { raw_score: 160 }
              as: Proctor
              as_user_id: "proctor-40"
              captures: { s2: $.data.scaled_score }
            - call: "POST /test-attempts/${a3}/score"
              payload: { raw_score: 160, irregularity_flag: true }
              as: Proctor
              as_user_id: "proctor-40"
              captures: { s3: $.data.scaled_score, irr3: $.data.irregularity_flag }
            - call: "POST /test-attempts/${a4}/score"
              payload: { raw_score: 3, irregularity_flag: true }
              as: Proctor
              as_user_id: "proctor-40"
              captures: { s4: $.data.scaled_score }
            - call: "GET /students/${su4}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { su4_counts: $.data.attempt_counts, su4_remaining: $.data.remaining_attempts }
          assert:
            - "${st1} == \"SCORED\" and ${sat1} == \"2026-08-01T00:00:00Z\" — scored_at is the logical clock"
            - "${s1} == 44 — 7 * 6.25 == 43.75 rounded HALF UP to 44, not truncated to 43"
            - "${s2} == 1000 — 160 * 6.25 == 1000.0 sits exactly on MAX_SCALED_SCORE and is not clipped below it"
            - "${s3} == 975 and ${irr3} == true — the 25-point penalty is subtracted from the un-clamped base"
            - "${s4} == 0 — 3 * 6.25 == 18.75 rounds to 19, minus 25 gives -6, and the floor clamp lifts it to 0; a NEGATIVE stored score or the value 19 both mean the clamp ran before the penalty"
            - "${su4_counts}.MATH == 1 and ${su4_remaining}.MATH == 2 — a zero scaled_score still consumes one attempt of the budget"

      - name: prerequisite_closure_ranks_p_with_c_and_refuses_d
        claim_type: Input Set Filtering
        grounds: [calculations.prerequisite_satisfaction_closure, "errors[ERR_PREREQUISITE_NOT_MET]", "validations[priority=12]"]
        distinguishing_aspect: |
          GRADE_RANK is a rank comparison and not an alphabetical or enum-ordinal one:
          P ties with C at rank 2 and therefore SATISFIES a min_grade of C, while D
          sits one rank below and does not. The closure is evaluated at hold time
          and re-evaluated at confirm, so the UNMET student receives a PENDING row
          and is only refused when the seat is confirmed.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
