            - { call: "GET /on-site-hosts/${host_id}", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { host_count2: "$.data.active_assignment_count" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { out2: "$.data.outstanding_cents" } }
          assert: >-
            Setup: ${b1_fee} == 55872 (= round_half_up(558720 * 0.10) on the
            TIER_SCHEDULE variant, 184 days out), ${b1_bal} == 55872 and
            ${b1_pay} == "SETTLEMENT_DUE".
            Trigger: HTTP 200 with ${ev_st} == "CANCELLED".
            Spared (already terminal): ${b1_f2} == "CANCELLED" with
            ${b1_fee2} == 55872 and ${b1_bal2} == 55872 unchanged and
            ${b1_pay2} == "SETTLEMENT_DUE" — the provider waiver did NOT reopen
            and re-settle it. Its SETTLEMENT installment is still visible:
            GET /payment-installments?booking_id=${b1}&installment_kind=SETTLEMENT
            returns total_count 1 with installment_state "SCHEDULED".
            Swept with a full waiver: ${b2_f2} == "CANCELLED",
            ${b2_fee2} == 0, ${b2_ref2} == 0 (= paid_cents),
            ${b2_pay2} == "REFUNDED" and ${b2_blk2} == null; its three SCHEDULE
            installments are all VOIDED
            (GET /payment-installments?booking_id=${b2}&installment_state=VOIDED
            returns total_count 3).
            ${deal_st2} == "TERMINATED"; ${tr_st2} == "CONFIRMED" with
            ${tr_lapsed} == null — a CONFIRMED tranche is not a PENDING one;
            ${blk_st2} == "RECALLED"; ${ready_st2} == "CLOSED" while
            ${planned_st2} == "CANCELLED"; ${ha_st2} == "VOIDED" with
            ${ha_rel} == "2026-08-01T00:00:00.000Z" and ${host_count2} == 0.
            GET /package-products/${pkg_id} shows package_status "CLOSED".
            ${out2} == 55872 — only B1's surviving balance, since B2's waiver
            zeroed its contribution.

      - name: client_outstanding_reconciles_after_each_booking_and_payment
        claim_type: ledger_sync
        grounds: >-
          calculations.client_credit_exposure (outstanding_cents = sum of
          max(0, net_price_cents - paid_cents) over live bookings plus the
          balance_due_cents of CANCELLED bookings awaiting settlement);
          endpoints "POST /bookings" and
          "POST /payment-installments/{id}/pay" side_effects (recomputes
          client_credit_exposure; recomputes Booking.paid_cents; advances the
          payment dimension); state_machines.Booking UNPAID -> DEPOSIT_PAID.
        distinguishing_aspect: >-
          A derived aggregate walked in both directions across five mutations:
          it rises by the full net on a booking, falls by exactly the paid
          installment amount twice, and rises again when a second booking lands
          on the same client. The intermediate value 391104 is only reachable if
          paid_cents is accumulated per installment rather than snapped to the
          booking total, and the final 1238496 is only reachable if the partly
          paid booking still contributes its REMAINING 167616 rather than its
          full net.
        test_recipe:
          setup: "STANDARD SELLABLE FIXTURE with one client and no bookings yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id", out0: "$.data.outstanding_cents" } }
          trigger:
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b1: "$.data.id", b1_net: "$.data.net_price_cents", b1_paid0: "$.data.paid_cents" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { out1: "$.data.outstanding_cents" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${b1}", installment_state: "SCHEDULED", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { i1: "$.data[0].id", i1_amt: "$.data[0].amount_cents", i2: "$.data[1].id", i2_amt: "$.data[1].amount_cents", i3_amt: "$.data[2].amount_cents" } }
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: "${i1_amt}" }, as: FinanceController, as_user_id: u_fin, captures: { i1_state: "$.data.installment_state" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { out2: "$.data.outstanding_cents" } }
            - { call: "POST /payment-installments/${i2}/pay", payload: { amount_cents_paid: "${i2_amt}" }, as: FinanceController, as_user_id: u_fin, captures: { i2_state: "$.data.installment_state" } }
            - { call: "GET /bookings/${b1}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { b1_paid2: "$.data.paid_cents", b1_pay2: "$.data.payment_status" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { out3: "$.data.outstanding_cents" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2_net: "$.data.net_price_cents" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { out4: "$.data.outstanding_cents" } }
          assert: >-
            ${out0} == 0 at registration.
            ${b1_net} == 558720 and ${b1_paid0} == 0, so ${out1} == 558720.
            The generated schedule is ${i1_amt} == 167616, ${i2_amt} == 223488
            and ${i3_amt} == 167616 (three SCHEDULED rows, total_count 3, summing
            back to 558720).
            After paying installment 1: ${i1_state} == "PAID" and
            ${out2} == 391104 (= 558720 - 167616).
            After paying installment 2: ${i2_state} == "PAID",
            ${b1_paid2} == 391104, ${b1_pay2} == "DEPOSIT_PAID" (not
            PAID_IN_FULL — 167616 is still open) and ${out3} == 167616.
            A second 10-unit booking prices at ${b2_net} == 1070880 and lifts the
            aggregate to ${out4} == 1238496 (= 167616 + 1070880), proving the
            partly paid booking contributes only its remainder.

      - name: booking_parallel_dimensions_are_covered_by_the_difficulty_suite
        claim_type: parallel
        grounds: >-
          complexity_profile.state_machine_shape "parallel";
          state_machines.Booking (initial_state "RESERVED (fulfillment_status)
          x UNPAID (payment_status)") — the independent-dimension row of the
          claim-extraction guide's state-machine-shape table.
        excluded_because:
          difficulty_instance: booking_parallel_fulfillment_and_payment_dimensions_advance_independently
          rationale: >-
            That §0.5 non_linear_state_machine instance already drives the two
            dimensions in interleaved order and asserts that each combined state
            (RESERVED x DEPOSIT_PAID, ALLOCATED x DEPOSIT_PAID,
            CREDENTIALED x PAID_IN_FULL) is reachable and that neither dimension's
            trigger moves the other. A separate corner test here would restate
            the same claim with weaker assertions.

      - name: postpone_cascade_depth_is_covered_by_the_difficulty_suite
        claim_type: cascade_down
        grounds: >-
          state_machines.Event SCHEDULED -> POSTPONED side_effects (CASCADE hops
          2, 2b, 3, 3b, 4, 4b); complexity_profile.complexity_layers
          "cascading_side_effects".
        excluded_because:
          difficulty_instance: postpone_event_depth4_cascade_to_host_counter_and_client_overdue
          rationale: >-
            The §0.5 transitive_cascade instance already walks all four hops of
            the postpone cascade end to end — Booking -> AllocationBlock
            counters -> PaymentInstallment due dates -> HostAssignment/OnSiteHost
            and Client counters — and pins each intermediate value. Re-testing
            "parent change reaches children" here would be a strict subset.

      - name: block_preemption_cross_entity_revert_is_covered_by_the_difficulty_suite
        claim_type: cross_entity
        grounds: >-
          endpoints "POST /allocation-blocks" side_effects (a higher-priority
          block reduces an incumbent's allocated_units and the waterfall's
          revert pass moves its most recently created ALLOCATED Bookings back to
          RESERVED); state_machines.Booking ALLOCATED -> RESERVED.
        excluded_because:
          difficulty_instance: block_preemption_depth3_cascade_reverts_a_sold_allocation
          rationale: >-
            The §0.5 transitive_cascade instance already asserts the full
            entity-A-to-entity-B adjustment (new block -> incumbent block
            EXHAUSTED -> OPEN -> sold Booking reverted to RESERVED with
            allocation_block_id cleared, in created_at DESC order). A second
            cross-entity corner would duplicate its fixture and its assertions.

      - name: cancellation_compensation_symmetry_is_covered_by_the_difficulty_suite
        claim_type: compensation
        grounds: >-
          endpoints "POST /bookings/{id}/cancel" side_effects (returns committed
          units to the AllocationBlock, voids installments, recomputes host
          counters, client exposure and event risk);
          calculations.booking_cancellation_settlement.
        excluded_because:
          difficulty_instance: allocation_units_restored_exactly_after_allocate_then_cancel
          rationale: >-
            The §0.5 compensating_invariant instance already proves that an
            allocate-then-cancel round trip restores the block's ledger exactly
            (committed_units back to 0, released_back_units credited,
            allocated_units and block_state unchanged) and that the freed units
            are re-sellable afterwards — i.e. no drift, which is precisely the
            compensation claim.

      - name: rights_deal_cycle_edges_are_covered_by_the_difficulty_suite
        claim_type: cyclic
        grounds: >-
          state_machines.RightsDeal cycle edges SHORTFALL_DECLARED -> COMMITTED
          and SHORTFALL_DECLARED -> PARTIALLY_RELEASED (trigger
          POST /release-tranches on a shortfall deal), plus
          PARTIALLY_RELEASED -> SHORTFALL_DECLARED via tranche lapse in
          POST /operations/daily-run.
        excluded_because:
          difficulty_instance: rights_deal_shortfall_reopens_to_partially_released_twice
          rationale: >-
            The §0.5 non_linear_state_machine instance already traverses the loop
            twice and asserts the non-obvious invariant that shortfall_units does
            NOT reset when the deal re-enters PARTIALLY_RELEASED (only confirmed
            releases reduce it), which is the loop-count/termination claim the
            `cyclic` row asks for.

  # ===========================================================================
  # SECTION 3 — calculations (§1.4 + §1.4.1 dual variants)
  #
  # SIMPLE PRICING FIXTURE (7 setup calls, no rights deal at all — with no
  # TICKET deal on the fixture the guarantee-exposure surcharge in
  # booking_net_price is switched off, so every net below is the clean
  # discount-and-commission number):
  #   clock 2026-08-01; canonical event; simple BRONZE package priced and
  #   published; client "Northbridge Capital" CORPORATE limit 50000000.
  # ===========================================================================
  - section: calculations
    instances:

      - name: tier_multiplier_constants_drive_list_price_and_margin_for_all_four_tiers
        claim_type: constants_applied
        grounds: >-
          calculations.package_list_pricing constants TIER_MULTIPLIER
          {BRONZE 1.0, SILVER 1.1, GOLD 1.25, PLATINUM 1.45} and precision
          ("list_price_cents: integer cents, round_half_up; margin_pct:
          fraction, round_half_up to 4 decimal places");
          entities.PackageProduct.tier.
        distinguishing_aspect: >-
          Four packages on one event with byte-identical component lines, so the
          only variable is the tier constant. The margins are deliberately
          non-terminating decimals (2424..., 3333..., 4252...) which forces the
          4-decimal round_half_up to be exercised three different ways, and the
          BRONZE multiplier of exactly 1.0 proves the multiplier is applied
          rather than special-cased away (BRONZE's list equals its subtotal while
          its margin_pct 0.1667 is still a rounded fraction).
        test_recipe:
          setup: "One canonical event; four DRAFT packages, one per tier, each with the same single component (TICKET qty 2, unit_cost 50000, markup 0.2000)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_bronze: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Silver Hospitality", tier: "SILVER", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_silver: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_gold: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Platinum Hospitality", tier: "PLATINUM", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { p_plat: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${p_bronze}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${p_silver}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${p_gold}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${p_plat}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
          trigger:
            - { call: "POST /package-products/${p_bronze}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { b_base: "$.data.base_cost_cents", b_sub: "$.data.component_price_subtotal_cents", b_list: "$.data.list_price_cents", b_margin: "$.data.margin_pct" } }
            - { call: "POST /package-products/${p_silver}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { s_list: "$.data.list_price_cents", s_margin: "$.data.margin_pct" } }
            - { call: "POST /package-products/${p_gold}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { g_list: "$.data.list_price_cents", g_margin: "$.data.margin_pct" } }
            - { call: "POST /package-products/${p_plat}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pl_list: "$.data.list_price_cents", pl_margin: "$.data.margin_pct" } }
          assert: >-
            All four calls return HTTP 200 with package_status "PRICED".
            Shared line arithmetic: ${b_base} == 100000 and ${b_sub} == 120000
            (the same base and subtotal hold for all four packages).
            BRONZE (x1.0): ${b_list} == 120000, ${b_margin} == 0.1667
            (= round_half_up_4(20000 / 120000) on 0.166666...).
            SILVER (x1.1): ${s_list} == 132000
            (= round_half_up(120000 * 1.1)), ${s_margin} == 0.2424
            (= round_half_up_4(32000 / 132000) on 0.242424...).
            GOLD (x1.25): ${g_list} == 150000, ${g_margin} == 0.3333
            (= round_half_up_4(50000 / 150000) on 0.333333...).
            PLATINUM (x1.45): ${pl_list} == 174000, ${pl_margin} == 0.4253
            (= round_half_up_4(74000 / 174000) on 0.4252873...).
            The margin denominator is the LIST price, not the base cost: a
            base-denominated margin would give 0.2000 / 0.3200 / 0.5000 / 0.7400
            instead.

      - name: volume_discount_tier_boundaries_at_five_ten_and_twenty_units
        claim_type: correct_result
        grounds: >-
          calculations.booking_net_price constants VOLUME_TIER_UNITS [5, 10, 20]
          and CHANNEL_COMMISSION_PCT.CORPORATE 0.03; its formula (volume tier is
          keyed on booking UNITS with `>=` comparisons: >= 20 -> 0.12,
          >= 10 -> 0.08, >= 5 -> 0.04, else 0); endpoints "POST /bookings".
        distinguishing_aspect: >-
          Both sides of all three tier breakpoints on one fixture (4/5, 9/10,
          19/20 units) — six bookings whose only difference is the unit count.
          The tiers are keyed on units, not on gross money, and the comparison is
          `>=`, so 5 units already earns 4% while 4 units earns nothing. The pairs
          straddling a boundary also show the discount is a FLAT rate on the whole
          gross rather than marginal: 9 units pays 4% on all nine, and 10 units
          jumps to 8% on all ten, so the 10-unit net is not a smooth extension of
          the 9-unit one.
        test_recipe:
          setup: "SIMPLE PRICING FIXTURE (list_price 120000, no rights deal, so no guarantee surcharge)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
          trigger:
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 4 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n4: "$.data.net_price_cents", d4: "$.data.volume_discount_pct", g4: "$.data.gross_price_cents" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n5: "$.data.net_price_cents", d5: "$.data.volume_discount_pct" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 9 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n9: "$.data.net_price_cents", d9: "$.data.volume_discount_pct" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n10: "$.data.net_price_cents", d10: "$.data.volume_discount_pct" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 19 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n19: "$.data.net_price_cents", d19: "$.data.volume_discount_pct" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 20 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { n20: "$.data.net_price_cents", d20: "$.data.volume_discount_pct", g20: "$.data.gross_price_cents", s20: "$.data.guarantee_surcharge_cents" } }
          assert: >-
            All six calls return HTTP 201.
