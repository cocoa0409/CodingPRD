# SCAFFOLD_CORNER_DESIGN — breadth coverage (§1.9)
# Walks references/claim-extraction-guide.md section-by-section against this
# scaffold's §1.1–§1.7 surface. Corners already exercised by a §1.8 difficulty
# instance are emitted as excluded_because stubs (no test_recipe).
scaffold_corner_design:

  - section: entities
    instances:
      - name: applicant_create_returns_201_with_system_fields
        claim_type: creation
        grounds: [entities.Applicant, endpoints]
        distinguishing_aspect: "POST /pha/applicants with household_name returns 201; response carries id, created_at, version==1, status==APPLIED, application_date set from the clock."
        test_recipe:
          setup: ["Empty DB, default clock."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Nguyen" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /pha/applicants/${app_id}"
              payload: {}
              as: IntakeClerk
          assert:
            - "Applicant ${app_id}.status == APPLIED and version == 1 and household_size == 0"
            - "Applicant ${app_id}.application_date == 2026-03-01T00:00:00.000Z (unset clock default)"

      - name: applicant_missing_household_name_rejected
        claim_type: required_fields
        grounds: [entities.Applicant, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /pha/applicants with no household_name returns 422 ERR_VALIDATION; no applicant is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pha/applicants"
              payload: {}
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 422 with ${err} == ERR_VALIDATION"

      - name: member_invalid_relationship_enum_rejected
        claim_type: type_constraints
        grounds: [entities.HouseholdMember, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST member with relationship not in {HEAD,SPOUSE,DEPENDENT,OTHER_ADULT} returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["One applicant."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "EnumTest" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Bad", relationship: "COUSIN" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 422 with ${err} == ERR_VALIDATION"

      - name: unit_create_defaults_utility_allowance_zero
        claim_type: defaults
        grounds: [entities.Unit.fields.utility_allowance_cents, endpoints]
        distinguishing_aspect: "POST /pha/units omitting utility_allowance_cents defaults it to 0; status defaults AVAILABLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /pha/units"
              payload: { address_label: "U-D", bedroom_size: 2, income_limit_cents: 5000000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /pha/units/${unit_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "Unit ${unit_id}.utility_allowance_cents == 0 and status == AVAILABLE"

      - name: applicant_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Applicant, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /pha/applicants/{unknown} returns 404 ERR_APPLICANT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pha/applicants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 404 with ${err} == ERR_APPLICANT_NOT_FOUND"

      - name: entry_create_unknown_applicant_returns_404
        claim_type: parent_relationships
        grounds: [entities.WaitlistEntry.fields.applicant_id, "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "POST /pha/waitlists/{id}/entries with a non-existent applicant_id returns 404 ERR_APPLICANT_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["One OPEN bedroom-2 waitlist."]
          setup_api_calls:
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "00000000-0000-0000-0000-000000000000" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 404 with ${err} == ERR_APPLICANT_NOT_FOUND"

  - section: state_machines
    instances:
      - name: verify_already_verified_claim_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PreferenceClaim.CLAIMED_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying a claim already VERIFIED returns 409 ERR_INVALID_STATE; points are not added twice."
        test_recipe:
          setup: ["Applicant with a VERIFIED VETERAN claim."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "SM1" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/preference-claims"
              payload: { preference_type: "VETERAN" }
              as: IntakeClerk
              captures: { claim_id: $.data.id }
            - call: "POST /pha/preference-claims/${claim_id}/verify"
              payload: { decision: "VERIFY" }
              as: IntakeClerk
          trigger:
            - call: "POST /pha/preference-claims/${claim_id}/verify"
              payload: { decision: "VERIFY" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_INVALID_STATE"

      - name: hud_result_before_submit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Certification.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording a hud-result while hud_status is NOT_SUBMITTED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Tenancy ACTIVE with an EFFECTIVE ANNUAL cert whose hud_status is NOT_SUBMITTED."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "SM2" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head SM2", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-SM2", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /pha/certifications/${cert_id}/finalize"
              payload: {}
              as: HousingSpecialist
          trigger:
            - call: "POST /pha/certifications/${cert_id}/hud-result"
              payload: { result: "ACCEPTED" }
              as: HousingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_INVALID_STATE"

      - name: refuse_accepted_offer_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Offer.PENDING_to_REFUSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Refusing an offer already ACCEPTED returns 409 ERR_INVALID_STATE (terminal offer)."
        test_recipe:
          setup: ["An ACCEPTED offer with its resulting tenancy."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "SM3" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head SM3", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-SM3", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
          trigger:
            - call: "POST /pha/offers/${offer_id}/refuse"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_INVALID_STATE"

      - name: decide_already_decided_grievance_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Grievance.FILED_to_SUSTAINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding a grievance already SUSTAINED returns 409 ERR_INVALID_STATE (terminal)."
        test_recipe:
          setup: ["A GRIEVANCE decided SUSTAINED on an active tenancy."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "SM4" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head SM4", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-SM4", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id }
            - call: "POST /pha/tenancies/${t_id}/grievances"
              payload: { grievance_type: "GRIEVANCE", reason: "repair" }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { griev_id: $.data.id }
            - call: "POST /pha/grievances/${griev_id}/decide"
              payload: { outcome: "SUSTAINED" }
              as: PropertyManager
          trigger:
            - call: "POST /pha/grievances/${griev_id}/decide"
              payload: { outcome: "OVERRULED" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_INVALID_STATE; Grievance ${griev_id}.status stays SUSTAINED"

      - name: grievance_sustained_leaves_tenancy_active
        claim_type: side_effect_execution
        grounds: [state_machines.Grievance.FILED_to_SUSTAINED, entities.Tenancy.fields.status]
        distinguishing_aspect: "The SUSTAINED branch (the fork not taken in the §1.8 OVERRULED instance) leaves Tenancy ACTIVE and Unit OCCUPIED — divergent side-effect set."
        test_recipe:
          setup: ["Tenancy ACTIVE with a FILED EVICTION grievance."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "SM5" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head SM5", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-SM5", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id }
            - call: "POST /pha/tenancies/${t_id}/grievances"
              payload: { grievance_type: "EVICTION", reason: "cause" }
              as: PropertyManager
              captures: { griev_id: $.data.id }
          trigger:
            - call: "POST /pha/grievances/${griev_id}/decide"
              payload: { outcome: "SUSTAINED" }
              as: PropertyManager
          assert:
            - "Grievance ${griev_id}.status == SUSTAINED"
            - "Tenancy ${t_id}.status == ACTIVE and Unit ${unit_id}.status == OCCUPIED (no termination cascade)"

      - name: offer_accept_cascade_full_chain
        claim_type: side_effect_execution
        grounds: [state_machines.Offer.PENDING_to_ACCEPTED]
        excluded_because:
          difficulty_instance: transitive_cascade / offer_accept_occupancy_chain
          rationale: "The accept cascade (Tenancy/Unit/WaitlistEntry/Applicant/sibling) is asserted end-to-end by the named §1.8 instance."

  - section: calculations
    instances:
      - name: total_points_excludes_denied_claim
        claim_type: input_set_filtering
        grounds: [calculations.waitlist_total_points, "entities.PreferenceClaim.fields.status"]
        distinguishing_aspect: "A DENIED VETERAN claim contributes 0 points; only VERIFIED claims count, so total_points stays 0 after a deny."
        test_recipe:
          setup: ["Applicant with a PENDING bedroom-2 entry and one VETERAN claim decided DENY."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Calc1" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/preference-claims"
              payload: { preference_type: "VETERAN" }
              as: IntakeClerk
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /pha/preference-claims/${claim_id}/verify"
              payload: { decision: "DENY" }
              as: IntakeClerk
          assert:
            - "PreferenceClaim ${claim_id}.status == DENIED and points_awarded == 0"
            - "WaitlistEntry ${entry_id}.total_points == 0"

      - name: utility_reimbursement_when_ua_exceeds_ttp
        claim_type: correct_result
        grounds: [calculations.monthly_tenant_rent_and_reimbursement, "entities.Tenancy.fields.utility_reimbursement_cents"]
        distinguishing_aspect: "For a low-income household (ttp 5000) in a unit with UA 8000, monthly_tenant_rent_cents == 0 and utility_reimbursement_cents == 3000 (8000-5000)."
        test_recipe:
          setup: ["Single-member household income 120,000 accepted into a bedroom-2 unit with UA 8,000; ANNUAL cert to be finalized (ttp floors at 5000)."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Reimb" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head RB", relationship: "HEAD", annual_income_cents: 120000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-RB", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 8000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /pha/certifications/${cert_id}/finalize"
              payload: {}
              as: HousingSpecialist
          assert:
            - "Certification ${cert_id}.ttp_cents == 5000"
            - "Tenancy ${t_id}.monthly_tenant_rent_cents == 0 and Tenancy ${t_id}.utility_reimbursement_cents == 3000"

  - section: validations
    instances:
      - name: waitlist_closed_rejects_entry
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_WAITLIST_CLOSED]"]
        distinguishing_aspect: "Adding an entry to a CLOSED waitlist returns 409 ERR_WAITLIST_CLOSED."
        test_recipe:
          setup: ["A CLOSED bedroom-2 waitlist and one applicant."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "WLC" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2, status: "CLOSED" }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_WAITLIST_CLOSED"

      - name: accept_expired_pending_offer_returns_offer_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Accepting a still-PENDING offer after its expires_at returns 409 ERR_OFFER_EXPIRED (temporal check alone, no state failure)."
        test_recipe:
          setup: ["A PENDING offer with expires_at 2026-03-05; clock advanced to 2026-03-10."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Exp" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head Exp", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-Exp", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-03-05T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: IntakeClerk
          trigger:
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is HTTP 409 with ${err} == ERR_OFFER_EXPIRED"

      - name: offer_bedroom_mismatch_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_BEDROOM_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / offer_bedroom_mismatch_beats_turnover_buffer
          rationale: "ERR_BEDROOM_MISMATCH is asserted as the winning error of the named §1.8 conflict instance."

      - name: initial_cert_over_income_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVER_INCOME]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / initial_cert_over_income_one_cent_over_limit
          rationale: "ERR_OVER_INCOME is asserted by the named §1.8 boundary instance."

      - name: cert_period_overlap_error
        claim_type: violation_to_error
