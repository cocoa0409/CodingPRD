          trigger:
            - call: "POST /procedure-audits"
              payload: { procedure_id: "${p}", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: EHSAuditor
              as_user_id: "${w2}"
              captures: { a1: $.data.id }
            - call: "POST /procedure-audits"
              payload: { procedure_id: "${p}", scheduled_start: "2026-09-01T12:00:00Z", scheduled_end: "2026-09-01T15:00:00Z" }
              as: EHSAuditor
              as_user_id: "${w2}"
              captures: { err: $.data.error_id }
            - call: "POST /procedure-audits"
              payload: { procedure_id: "${p}", scheduled_start: "2026-09-01T12:00:01Z", scheduled_end: "2026-09-01T15:00:00Z" }
              as: EHSAuditor
              as_user_id: "${w2}"
              captures: { a3: $.data.id }
          assert:
            - "ProcedureAudit.${a1}.status == SCHEDULED (first window booked)"
            - "Touching window 12:00:00Z rejected with ${err} == ERR_AUDITOR_DOUBLE_BOOKED (closed intervals: endpoints touch => overlap)"
            - "ProcedureAudit.${a3}.status == SCHEDULED (one second later is disjoint)"

