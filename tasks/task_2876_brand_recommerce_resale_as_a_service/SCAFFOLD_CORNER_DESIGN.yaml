        grounds:
          - endpoints[POST /recommerce/refurb-orders/{id}/tasks]
          - endpoints[GET /recommerce/refurb-orders/{id}/tasks]
          - calculations.refurb_logged_cost
          - response_envelope.pagination_fields
        distinguishing_aspect: "The sub-resource listing returns the two immutable task rows in sequence_no order with their per-line 392 costs, honours limit/offset with total_count 2 and has_more, filters on task_type, and the parent order's logged_cost_minor reads 784 — the per-line rounded sum, not round(783.0)."
        test_recipe:
          setup:
            - "Ava's accepted OWNED_INVENTORY OUTERWEAR grade B unit (msrp 50000) is IN_PROGRESS in a REPAIR bay (multiplier 13500 bp)."
            - "Two task lines are logged: a REPAIR line and a CLEANING line, each labor_minutes 2 with parts_cost_minor 0."
