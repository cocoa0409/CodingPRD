              captures: { inc_limit: $.data.id }
            - call: "POST /public-art/damage-incidents/${inc_limit}/triage"
              payload: { triage_class: "TOTAL_LOSS" }
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/damage-incidents"
              payload: { artwork_id: "${work_old}", incident_type: "THEFT", damage_extent_pct: 1.00, narrative: "plaque removed overnight" }
