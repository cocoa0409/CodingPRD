        distinguishing_aspect: "A different category pair business_safety (priority 8) vs business_referential (priority 9): the sole INTENT_TO_LIEN notice is DISPUTED (so no SENT notice exists AND a dispute is active); lien attempt returns ERR_ACTIVE_DISPUTE, proving safety outranks the referential demand-notice requirement."
