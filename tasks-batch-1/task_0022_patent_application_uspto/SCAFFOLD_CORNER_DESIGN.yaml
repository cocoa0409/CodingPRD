  # ============================================================
  # Section: cross_cutting_complexity_layers — OCC stale-version
  # ============================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_version_pay_issue_fee_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.issue-fee-stale-application
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Pay-issue-fee with expected_application_version older than current (after a side-effect bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "LARGE UTILITY application in ALLOWED, version V observed by client."
            - "An OA was just superseded (NOA-while-OUTSTANDING) causing version bump from V to V+1."
            - "Client still holds V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "OCC1 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { o1_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${o1_owner_id}", application_type: "UTILITY", title: "OCC1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${o1_owner_id}"
              captures: { o1_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${o1_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${o1_owner_id}"
            - call: "POST /applications/${o1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${o1_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${o1_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${o1_owner_id}"
              captures: { o1_v_correct: "$.data.version" }
          trigger:
            - call: "POST /applications/${o1_app_id}/pay-issue-fee"
              payload: { amount_cents: 120000, expected_application_version: "${o1_v_correct} - 1" }
              as: Applicant
              as_user_id: "${o1_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == 'ERR_STALE_VERSION'"

