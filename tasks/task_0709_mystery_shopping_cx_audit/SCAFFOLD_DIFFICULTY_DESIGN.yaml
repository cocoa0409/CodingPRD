              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-30T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { ok_asg: $.data.id }
          trigger:
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-07-01T00:00:00Z" }
