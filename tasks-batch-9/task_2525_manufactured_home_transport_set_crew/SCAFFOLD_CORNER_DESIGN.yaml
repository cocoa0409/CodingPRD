      - name: claim_cap_stage_and_evidence_errors_then_a_clean_evidence_adjudication
        claim_type: error_triggerable
        grounds:
          - validations[priority 28]
          - validations[priority 30]
          - errors[ERR_CLAIM_AMOUNT_EXCEEDS_CAP]
          - errors[ERR_CLAIM_STAGE_MISMATCH]
          - errors[ERR_CLAIM_EVIDENCE_MISSING]
          - calculations.damage_claim_allocation
        distinguishing_aspect: |
          CLAIM_CAP_CENTS is inclusive, so 2500001 is refused with
          ERR_CLAIM_AMOUNT_EXCEEDS_CAP while 2500000 is accepted. That accepted claim
          carries discovered_stage UNKNOWN, which is deliberately absent from
          STAGE_OWNER, so a STAGE adjudication returns ERR_CLAIM_STAGE_MISMATCH and an
          EVIDENCE adjudication with 0 + 0 + 0 points returns
          ERR_CLAIM_EVIDENCE_MISSING - two different arms of the same priority-28
          rule. After the hauler disputes and self-scores 3 points, the EVIDENCE
          adjudication settles the whole 2250000 haircut amount on the hauler and
          suspends it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant, one ACTIVE AZ hauler, one licensed SetCrew"
            - "a single-section AZ order with its section created"
            - "one claim of exactly CLAIM_CAP_CENTS with discovered_stage UNKNOWN, blocks_set false and all three evidence-point fields omitted so they default to 0, moved to UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "UNKNOWN", claimed_amount_cents: 2500001, blocks_set: false }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "UNKNOWN", claimed_amount_cents: 2500000, blocks_set: false }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /installations/damage-claims/${claim_id}/review"
              payload: { notes: "stage of origin cannot be established" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/adjudicate"
              payload: { allocation_basis: "STAGE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/adjudicate"
              payload: { allocation_basis: "EVIDENCE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/dispute"
              payload: { reason_code: "OWN_FAULT_ACCEPTED", hauler_evidence_points: 3 }
              as: TransportManager
              as_user_id: "${hauler_id}"
            - call: "POST /installations/damage-claims/${claim_id}/review"
              payload: { notes: "hauler accepts responsibility" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/adjudicate"
              payload: { allocation_basis: "EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "trigger step 1 returns HTTP 422 with error_id ERR_CLAIM_AMOUNT_EXCEEDS_CAP"
            - "trigger step 2 returns HTTP 201 with data.claimed_amount_cents == 2500000 and data.status == SUBMITTED"
            - "after trigger step 2: DamageClaim.${claim_id}.plant_evidence_points == 0 and hauler_evidence_points == 0 and installer_evidence_points == 0 and dispute_round == 0"
            - "after trigger step 3: DamageClaim.${claim_id}.status == UNDER_REVIEW"
            - "trigger step 4 returns HTTP 422 with error_id ERR_CLAIM_STAGE_MISMATCH"
            - "trigger step 5 returns HTTP 422 with error_id ERR_CLAIM_EVIDENCE_MISSING"
            - "after trigger step 5: DamageClaim.${claim_id}.status == UNDER_REVIEW and approved_amount_cents == null"
            - "after trigger step 6: DamageClaim.${claim_id}.status == DISPUTED and dispute_round == 1 and hauler_evidence_points == 3"
            - "after trigger step 7: DamageClaim.${claim_id}.status == UNDER_REVIEW"
            - "trigger step 8 returns HTTP 200"
            - "DamageClaim.${claim_id}.status == ADJUDICATED"
            - "DamageClaim.${claim_id}.approved_amount_cents == 2250000"
            - "DamageClaim.${claim_id}.hauler_charge_cents == 2250000"
            - "DamageClaim.${claim_id}.plant_charge_cents == 0 and installer_charge_cents == 0"
            - "Hauler.${hauler_id}.chargeback_balance_cents == 2250000"
            - "Hauler.${hauler_id}.status == SUSPENDED"

