            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
          trigger:
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { err: $.data.error_id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_id: $.data.id } }
          assert:
            - "captured ${err} == ERR_DRAWING_NOT_APPROVED"
            - "MachiningProgram.${prog_id}.status == CREATED (identical request succeeds once the drawing is APPROVED)"
      - name: trip_assign_requires_staged_opening
        grounds:
          - endpoints[POST /millwork/delivery-trips/{id}/assign]
          - state_machines.DeliveryTrip.PLANNED_to_DEPARTED
          - errors[ERR_OPENING_NOT_STAGED]
        distinguishing_aspect: |
          Entity pair (DeliveryTrip, Opening) — different pair than
          (MachiningProgram, ShopDrawing): assign gates on the opening's fab
          axis; a FINISHED-but-unstaged opening is rejected, then the same
          request succeeds after STAGED.
        test_recipe:
          setup:
            - "Unrated PAINT_GRADE order; opening X finished (batch passed) but NOT staged; trip PLANNED with arrival <= required date."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Stage Proj", site_address: "3 Yard Rd", contract_code: "C-8002" }, as: PlantManager, captures: { proj_id: $.data.id } }
