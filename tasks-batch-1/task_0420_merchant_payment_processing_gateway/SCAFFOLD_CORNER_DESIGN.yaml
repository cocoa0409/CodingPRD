            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 5000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_keep: $.data.id }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 3000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_void: $.data.id }
            - call: "POST /charges/${ch_void}/void"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /charges?merchant_id=${m_id}&settlement_status=PENDING&auth_status=AUTHORIZED"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          assert:
            - "response status == 200"
            - "charge ${ch_keep} is in the returned list"
            - "every returned charge has auth_status == AUTHORIZED and settlement_status == PENDING"

      - name: corner_webhook_idempotent_emit_returns_existing
        claim_type: Conditional action
        grounds:
          - entities.WebhookEvent.fields.idempotency_key
          - endpoints.POST./merchants/{id}/webhook-events
        distinguishing_aspect: "Emitting a webhook event twice with the same idempotency_key returns the SAME WebhookEvent id on both calls (the repeat does not create a second event)."
        test_recipe:
          setup:
            - "An APPROVED merchant."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "WH Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/webhook-events"
              payload: { event_type: "DISPUTE_OPENED", source_id: "abc", idempotency_key: "key-123" }
              as: PlatformOperator
              captures: { first_event_id: $.data.id }
          trigger:
            - call: "POST /merchants/${m_id}/webhook-events"
              payload: { event_type: "DISPUTE_OPENED", source_id: "abc", idempotency_key: "key-123" }
              as: PlatformOperator
              captures: { second_event_id: $.data.id }
          assert:
            - "${second_event_id} == ${first_event_id} (idempotent emit returned the existing event)"

