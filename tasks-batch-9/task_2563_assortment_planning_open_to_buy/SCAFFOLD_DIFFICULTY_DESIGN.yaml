            - "before the trigger: PlanMonth.${m1_id}.otb_open_cents == 0 and PlanMonth.${m2_id}.otb_open_cents == 1970000, so CategoryPlan.${plan_id}.open_ratio_bps == 490 (1970000 over 40170000) and otb_posture == FROZEN"
            - "before the trigger: the freeze already demoted the items - AssortmentItem.${item_x}.status == DEFERRED, AssortmentItem.${item_c}.status == DEFERRED, AssortmentItem.${item_n}.status == DEFERRED"
            - "LINK 1: ReceiptCommitment.${rc2}.commit_status == CANCELLED, cancelled_units == 8000, open_cost_cents == 0, fulfillment_status == VOID (received_units was 0)"
            - "LINK 2 (caused by link 1 zeroing open_cost_cents): PlanMonth.${m2_id}.otb_committed_cents == 0 and otb_open_cents == 21970000, with otb_planned_cents still 21970000 and otb_received_cents 0"
            - "LINK 3 (caused by link 2 raising otb_open_cents): CategoryPlan.${plan_id}.open_ratio_bps == 5469 (21970000 over 40170000) and otb_posture == OPEN - the boundary out of FROZEN was crossed by this link and no other"
            - "LINK 4 (caused by link 3 leaving FROZEN, conditionally): AssortmentItem.${item_x}.status == PROPOSED and AssortmentItem.${item_c}.status == PROPOSED, but AssortmentItem.${item_n}.status is STILL DEFERRED because lifecycle_stage NEW is excluded from the restore"
            - "LINK 4 is genuinely link 3's consequence, not the cancel's: the same cancel request with the posture already OPEN restores nothing, which the second cancel below demonstrates"
            - "after the second cancel: ReceiptCommitment.${rc1}.commit_status == CANCELLED, PlanMonth.${m1_id}.otb_committed_cents == 0 and otb_open_cents == 18200000, CategoryPlan.${plan_id}.open_ratio_bps == 10000 and otb_posture == OPEN - links 1 to 3 ran again"
            - "after the second cancel: AssortmentItem.${item_n}.status is STILL DEFERRED - link 4 did not fire because the posture did not cross out of FROZEN this time, proving the cascade's fourth link is conditioned on link 3's transition and not merely on the trigger"
            - "the ledger invariant otb_open_cents + otb_committed_cents + otb_received_cents == otb_planned_cents holds on ${m1_id} and ${m2_id} after every link"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_beats_otb_exceeded
        grounds:
          - validations[priority=16].ERR_OTB_POSTURE_FROZEN
          - validations[priority=37].ERR_OTB_EXCEEDED
          - calculations.otb_posture
          - errors.ERR_OTB_POSTURE_FROZEN
          - errors.ERR_OTB_EXCEEDED
        distinguishing_aspect: |
          One byte-identical request violates a business_safety rule at priority 16 and a
          business_fiscal rule at priority 37 simultaneously, and the response must be the
          priority-16 ERR_OTB_POSTURE_FROZEN (409), never the priority-37 ERR_OTB_EXCEEDED (422).
          The pair is made unambiguous by a control: cancelling one commitment lifts the posture out
          of FROZEN without changing the request, and the very same payload then returns
          ERR_OTB_EXCEEDED - so an implementation that evaluates the cheap arithmetic check first
          is caught by the first probe and an implementation that hard-codes the frozen error is
          caught by the second.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 (otb_planned 18,200,000) and M2 (otb_planned 21,970,000) LOCKED_PLAN, OptionPlan OP1 SLOTTED"
            - "one CARRYOVER AssortmentItem X supplied by Aurora Mills, which is AUTHORIZED with weekly_unit_capacity 12000 and an ACTIVE DRSS authorization for 40000 open units"
            - "COMMITTED commitments of 18,200,000 on M1 and 20,000,000 on M2, which drive the plan posture to FROZEN at 490 bps"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 2, fiscal_month_label: "2027-04", first_receipt_date: "2027-04-02T00:00:00Z", bom_inventory_cents: 22000000, planned_sales_cents: 36000000, planned_markdown_cents: 3000000, planned_eom_cents: 24000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m2_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-CARRY-X", color_code: "BLACK", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2600, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_x: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 7000, unit_cost_cents: 2600, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc1: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc1}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/plan-months/${m2_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m2_v1: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m2_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 8000, unit_cost_cents: 2500, ship_window_start: "2027-04-02T00:00:00Z", ship_window_end: "2027-04-16T00:00:00Z", expected_plan_month_version: "${m2_v1}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc2: $.data.id }
            - call: "POST /otb/receipt-commitments/${rc2}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/plan-months/${m2_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m2_v2: $.data.version }
          trigger:
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m2_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 12000, unit_cost_cents: 2500, ship_window_start: "2027-05-01T00:00:00Z", ship_window_end: "2027-05-15T00:00:00Z", expected_plan_month_version: "${m2_v2}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { frozen_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc2}/cancel"
              payload: { cancel_reason: "release April dollars" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/plan-months/${m2_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m2_v3: $.data.version }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m2_id}", assortment_item_id: "${item_x}", vendor_id: "${vendor_id}", units: 12000, unit_cost_cents: 2500, ship_window_start: "2027-05-01T00:00:00Z", ship_window_end: "2027-05-15T00:00:00Z", expected_plan_month_version: "${m2_v3}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { fiscal_error: $.data.error_id }
          assert:
            - "before the first probe: CategoryPlan.${plan_id}.open_ratio_bps == 490 and otb_posture == FROZEN, PlanMonth.${m2_id}.otb_open_cents == 1970000"
            - "the first probe violates BOTH rules: the plan posture is FROZEN (priority 16) and the candidate cost 30000000 (12000 * 2500) exceeds PlanMonth.${m2_id}.otb_open_cents 1970000 by 28030000 (priority 37)"
            - "the first probe returns HTTP 409 with ${frozen_error} == ERR_OTB_POSTURE_FROZEN, NOT ERR_OTB_EXCEEDED and NOT a 422"
            - "the first probe is otherwise clean, so no lower-numbered rule can pre-empt it: M2 is LOCKED_PLAN (priority 10 satisfied), the vendor is AUTHORIZED (13), the submitted version matches (15), the item is CARRYOVER so the RESTRICTED-new-item rule is inapplicable (17), an ACTIVE DRSS authorization exists (19), the item's OptionPlan belongs to the same plan and the body vendor_id matches the item's (20), 12000 >= min_order_units 200 (30), and the May ship window overlaps neither committed window so vendor load is 0 + 12000 == weekly_unit_capacity 12000 and category open units 7000 + 8000 + 12000 == 27000 <= 40000 (31)"
            - "the first probe created nothing: GET /otb/receipt-commitments filtered to plan_month_id ${m2_id} still returns exactly one row (${rc2}) and PlanMonth.${m2_id}.version is unchanged at ${m2_v2}"
            - "after the cancel: PlanMonth.${m2_id}.otb_open_cents == 21970000, CategoryPlan.${plan_id}.open_ratio_bps == 5469 and otb_posture == OPEN, so the priority-16 rule is now satisfied while nothing else about the request changed"
            - "the second probe, byte-identical except for the freshly captured version, returns HTTP 422 with ${fiscal_error} == ERR_OTB_EXCEEDED, because 30000000 still exceeds the new otb_open_cents 21970000 by 8030000"
            - "${frozen_error} != ${fiscal_error}: the pair is genuinely ordered rather than coincidentally equal"

      - name: vendor_authorization_beats_lead_time_infeasible
        grounds:
          - validations[priority=19].ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY
          - validations[priority=34].ERR_LEAD_TIME_INFEASIBLE
          - entities.VendorAuthorization
          - errors.ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY
          - errors.ERR_LEAD_TIME_INFEASIBLE
        distinguishing_aspect: |
          A different error-category pair from the frozen/exceeded conflict: business_referential at
          priority 19 versus business_temporal at priority 34, both 422s, so the discriminator is the
          error_id alone and not the status code. The single request has no authorization joining the
          vendor to the category AND a ship window inside the vendor's 120-day lead time; the
          referential defect must win. Granting the authorization then re-issuing the identical
          request flips the answer to ERR_LEAD_TIME_INFEASIBLE, and moving the window past the lead
