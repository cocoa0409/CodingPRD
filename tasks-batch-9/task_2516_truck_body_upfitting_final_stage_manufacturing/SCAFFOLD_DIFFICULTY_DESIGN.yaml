# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: truck-body-upfitting-final-stage-manufacturing  (task 2516)
# 9 rule_id blocks / 19 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7; every numeric literal in an assert was computed by executing the
# §1.3 formula against the pinned setup.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: axle_load_as_designed_versus_as_measured_divergence
        grounds:
          - calculations.axle_load_distribution
          - calculations.payload_capacity
          - entities.WeightCertification.fields.basis
          - entities.WeightCertification.fields.included_component_count
          - state_machines.UpfitOrder.body_install_status.PLANNED_to_INSTALLED
          - state_machines.EquipmentInstallation.status.PLANNED_to_INSTALLED
        distinguishing_aspect: |
          This instance's two variants live in the physical weight domain on WeightCertification: for
          one unchanged truck the AS_DESIGNED basis reports front 4491 / rear 7139 / gvw 11630 /
          payload 7870 over 3 components while AS_MEASURED reports front 5048 / rear 6062 / gvw 11110 /
          payload 8390 over 2, because AS_MEASURED swaps book curb weights for the scale ticket and
          drops the still-PLANNED liftgate.
        test_recipe:
          setup:
            - "ChassisModel F550-DRW-84CA: wheelbase 200 in, cab-to-axle 84 in, curb axles 4820 / 2680 lb, GVWR 19500, front GAWR 7000, rear GAWR 14706, max aux 60 A, J1939_CAN bus, PTO FULL at 18 gpm."
            - "BodySpec SERVICE-11FT: 2100 lb at cg 62 in from body front, cargo cg 66 in, min CA 84 in, min wheelbase 189 in, 12 A, no hydraulics."
            - "EquipmentSpecs CRANE-6000 (1250 lb, PTO, 8 gpm, 10 A, duty 1, BEHIND_CAB) and LIFTGATE-2500 (780 lb, no PTO, 30 A, duty 3, REAR_OVERHANG)."
            - "One CUSTOMER_SPECIFIC order on a chassis whose incoming scale ticket read 4905 / 2755 lb; body mounted 120 in behind the front axle, so the body centroid sits at 182 in and the cargo centroid at 186 in."
            - "Crane planned at 208 in and installed with an actual weight of 1290 lb; liftgate planned at 320 in and still PLANNED; body installed with an actual weight of 2160 lb."
            - "An APPROVED AS_DESIGNED certification already exists on the order; the order is IN_BUILD with body_install_status INSTALLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "CRANE-6000", equipment_class: "CRANE", weight_lb: 1250, requires_pto: true, required_flow_gpm: 8, aux_amp_draw: 10, duty_priority: 1, mount_zone: "BEHIND_CAB", requires_can_gateway: false, list_price_cents: 780000 }
              as: PlantAdmin
              captures: { es_crane: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "LIFTGATE-2500", equipment_class: "LIFTGATE", weight_lb: 780, requires_pto: false, required_flow_gpm: 0, aux_amp_draw: 30, duty_priority: 3, mount_zone: "REAR_OVERHANG", requires_can_gateway: false, list_price_cents: 320000 }
              as: PlantAdmin
              captures: { es_lg: "$.data.id" }
            - call: "POST /upfit/work-bays"
              payload: { code: "BAY-1", concurrent_capacity: 1, supported_body_types: ["SERVICE", "DUMP", "FLATBED", "VAN"] }
              as: PlantAdmin
              captures: { bay1: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0AA10001", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4905, measured_rear_axle_weight_lb: 2755 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ch_v: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-1001", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120, required_payload_lb: 5000, requested_in_service_date: "2026-09-15" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
            - call: "POST /upfit/upfit-orders/${uo}/allocate-chassis"
              payload: { chassis_id: "${ch}", expected_chassis_version: "${ch_v}" }
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_crane}", mount_cg_from_front_axle_in: 208, hydraulic_circuit: "PRIMARY" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_crane: "$.data.id" }
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${es_lg}", mount_cg_from_front_axle_in: 320, hydraulic_circuit: "NONE" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { ei_lg: "$.data.id" }
            - call: "POST /upfit/upfit-orders/${uo}/submit-engineering"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { uo_v1: "$.data.version" }
            - call: "POST /upfit/weight-certifications"
              payload: { upfit_order_id: "${uo}", basis: "AS_DESIGNED", expected_upfit_order_version: "${uo_v1}" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { wc_d: "$.data.id" }
            - call: "POST /upfit/weight-certifications/${wc_d}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /upfit/upfit-orders/${uo}/release"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/build-slots"
              payload: { upfit_order_id: "${uo}", work_bay_id: "${bay1}", slot_type: "FINAL_QC", start_date: "2026-09-01", end_date: "2026-09-10" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { slot1: "$.data.id" }
            - call: "POST /upfit/build-slots/${slot1}/start"
              payload: {}
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/equipment-installations/${ei_crane}/install"
              payload: { actual_weight_lb: 1290 }
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/upfit-orders/${uo}/body-install"
              payload: { body_actual_weight_lb: 2160 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { uo_v2: "$.data.version" }
          trigger:
            - call: "POST /upfit/weight-certifications"
              payload: { upfit_order_id: "${uo}", basis: "AS_MEASURED", expected_upfit_order_version: "${uo_v2}" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { wc_m: "$.data.id" }
          assert:
            - "WeightCertification.${wc_d}.basis == AS_DESIGNED"
            - "WeightCertification.${wc_d}.front_axle_load_lb == 4491"
            - "WeightCertification.${wc_d}.rear_axle_load_lb == 7139"
            - "WeightCertification.${wc_d}.gvw_lb == 11630"
            - "WeightCertification.${wc_d}.payload_capacity_lb == 7870"
            - "WeightCertification.${wc_d}.included_component_count == 3"
            - "WeightCertification.${wc_m}.basis == AS_MEASURED"
            - "WeightCertification.${wc_m}.front_axle_load_lb == 5048"
            - "WeightCertification.${wc_m}.rear_axle_load_lb == 6062"
            - "WeightCertification.${wc_m}.gvw_lb == 11110"
            - "WeightCertification.${wc_m}.payload_capacity_lb == 8390"
            - "WeightCertification.${wc_m}.included_component_count == 2"
            - "WeightCertification.${wc_m}.front_axle_load_lb - WeightCertification.${wc_d}.front_axle_load_lb == 557"
            - "WeightCertification.${wc_d}.gvw_lb - WeightCertification.${wc_m}.gvw_lb == 520"
            - "WeightCertification.${wc_m}.gvw_lb == WeightCertification.${wc_m}.front_axle_load_lb + WeightCertification.${wc_m}.rear_axle_load_lb"

      - name: warranty_split_provisional_versus_final_taint_shift
        grounds:
          - calculations.warranty_liability_split
          - calculations.electrical_warranty_impact
          - entities.WarrantyClaim.fields.split_basis
          - entities.UpfitOrder.fields.chassis_warranty_status
          - state_machines.WarrantyClaim.status.INSPECTED_to_ADJUDICATED
        distinguishing_aspect: |
          This instance's two variants live in the money/liability domain on WarrantyClaim: the same
          73333-cent CHASSIS_ELECTRICAL claim on the same truck is split 60/35/5 -> 44000 / 25667 /
          3666 at submission (PROVISIONAL) and 15/80/5 -> 11000 / 58666 / 3667 at adjudication
          (FINAL), because the 45-point taint shift only applies once teardown confirmed taint on a
          chassis whose warranty posture is CONDITIONAL.
        test_recipe:
          setup:
            - "A DELIVERED CUSTOMER_SPECIFIC service-body truck on the F550-DRW-84CA model (J1939_CAN bus), no equipment installed, warranty_liability_cap_cents 5000000."
            - "One APPROVED ElectricalInterface with interface_method CAN_GATEWAY on the J1939_CAN bus, drawing 8 A, so UpfitOrder.chassis_warranty_status is CONDITIONAL."
            - "A CHASSIS_ELECTRICAL warranty claim for 73333 cents, already INSPECTED with taint_confirmed true."
