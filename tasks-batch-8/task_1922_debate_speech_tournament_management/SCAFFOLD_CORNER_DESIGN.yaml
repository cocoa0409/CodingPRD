# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_1922_debate_speech_tournament_management
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------ entities ---
  - section: entities
    instances:
      - name: tournament_creation_defaults
        claim_type: creation_defaults
        grounds: [entities.Tournament]
        distinguishing_aspect: "Creating a tournament with only required fields applies every default: prelim_round_count 4, entry_fee_cents 2500, tournament_staff_count 10, status DRAFT, results_visibility HIDDEN, late_fee_starts_at null, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Defaults", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
          trigger:
            - { call: "GET /tournaments/${t}", as: TournamentDirector }
          assert:
            - "Tournament.${t}: prelim_round_count == 4, entry_fee_cents == 2500, tournament_staff_count == 10"
            - "Tournament.${t}: status == DRAFT, results_visibility == HIDDEN, late_fee_starts_at == null, version == 1"

      - name: tournament_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TOURNAMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /tournaments/{random uuid} on an empty database returns 404 ERR_TOURNAMENT_NOT_FOUND."
        test_recipe:
          setup: ["one unrelated tournament exists"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "X", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
          trigger:
            - { call: "GET /tournaments/11111111-1111-1111-1111-111111111111", as: TournamentDirector, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_TOURNAMENT_NOT_FOUND", "http status == 404"]

