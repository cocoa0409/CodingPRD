  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_timed_entry_hold_stale_slot_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[timed-entry-hold-stale-slot]"]
        distinguishing_aspect: "Booking a timed-entry hold with a stale expected_slot_version (after another hold bumped the slot version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A released slot capacity 5; one hold already placed (version advanced to v0+1); a second create still carrying v0."]
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "CC01", name: "CC Park", utc_offset_minutes: 0, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-05T08:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "paFF@x.com", full_name: "PAFF", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
