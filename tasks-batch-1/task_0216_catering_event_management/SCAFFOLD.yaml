        type: datetime
        source: input
        description: "Calendar date (UTC midnight) this route runs; all legs scheduled on this route share this date."
      - name: vehicle_capacity_legs
        type: integer
        source: input
        description: "Maximum number of DeliveryLeg children that may be DISPATCHED on this route."
        constraints: ">= 1"
      - name: posture
        type: enum
        source: computed
        description: "Derived from child DeliveryLeg states: OPEN while any leg PLANNED; ROLLING once any leg DISPATCHED and none FAILED; CLOSED once all legs DELIVERED; BLOCKED if any leg FAILED. See calc route_posture."
        default: "OPEN"
        constraints: "enum: OPEN | ROLLING | CLOSED | BLOCKED"
      - name: dispatched_leg_count
        type: integer
        source: computed
        description: "Count of child DeliveryLeg rows in state DISPATCHED or DELIVERED. Maintained on every leg transition."
        default: 0

