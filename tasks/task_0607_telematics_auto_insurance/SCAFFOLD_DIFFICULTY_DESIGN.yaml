              captures: { et1: $.data.id }
            - call: "POST /trips/${et1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-06-01T02:00:00Z", ended_at: "2026-06-01T02:10:00Z", distance_miles: 4.0 }
              as: DriverUser
