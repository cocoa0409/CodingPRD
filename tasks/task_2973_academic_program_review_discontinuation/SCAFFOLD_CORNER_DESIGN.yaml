              as: ReviewCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { adj_id: $.data.id }
          assert:
            - "AcademicProgram.${prog_id}.severance_budget_cap_cents == 5100001 — floor(0.15 x 34000010); the value 5100002 is round_half_up and is wrong"
            - "cost_per_credit_hour_rolling_cents == 45946 — round_half_up(34000010 / 740), still half-up on the same window"
            - "ViabilityMetricSnapshot.${s1_id}.cost_per_credit_hour_cents == 40000 — round_half_up(12000010 / 300)"
            - "composite_score == 29.06 and viability_band == NONVIABLE, unchanged by the ten-cent nudge"
            - "FacultyAppointment.${adj_id}.notice_pay_cents == 82192 and reduction_sequence_position == 1 — 82192 fits inside the 5100001 cap"
            - "AcademicProgram.${prog_id}.staffing_liability_cents == 82192 and deferred_fte == 0.00"

      - name: notice_pay_applies_statutory_notice_days_per_tenure_status
        claim_type: constants_applied
        grounds:
          - calculations.staffing_reduction_waterfall.constants.STATUTORY_NOTICE_DAYS
          - calculations.staffing_reduction_waterfall.precision
          - entities.FacultyAppointment.fields.notice_pay_cents
        distinguishing_aspect: |
          notice_pay_cents is priced for EVERY appointment in the pool before
          the waterfall loop runs, so the four statutory day counts are all
          observable on a program whose severance cap is 0 and where therefore
          nobody is ever funded: every reduction_sequence_position stays null
          while every notice_pay_cents is populated. The 365-day divisor makes
          three of the four figures non-round.
        test_recipe:
          setup:
            - "One program HIST-BA with NO metric snapshots, so the rolling cost window is empty and severance_budget_cap_cents is 0."
            - "Four appointments, one per tenure_status: ADJUNCT 0.25 fte / 4000000, NON_TENURE_TRACK 1.00 / 7200000, TENURE_TRACK 1.00 / 9000000, TENURED 1.00 / 12000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { adj_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-NTT-1", tenure_status: "NON_TENURE_TRACK", fte: 1.00, annual_salary_cents: 7200000 }
              as: HRPartner
              captures: { ntt_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-TT-1", tenure_status: "TENURE_TRACK", fte: 1.00, annual_salary_cents: 9000000 }
              as: HRPartner
              captures: { tt_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-TEN-1", tenure_status: "TENURED", fte: 1.00, annual_salary_cents: 12000000 }
              as: HRPartner
              captures: { ten_id: $.data.id }
          assert:
            - "FacultyAppointment.${adj_id}.notice_pay_cents == 82192 — round_half_up(4000000 x 0.25 x 30 / 365), not 82191"
            - "FacultyAppointment.${ntt_id}.notice_pay_cents == 1775342 — round_half_up(7200000 x 1.00 x 90 / 365)"
            - "FacultyAppointment.${tt_id}.notice_pay_cents == 4438356 — round_half_up(9000000 x 1.00 x 180 / 365)"
            - "FacultyAppointment.${ten_id}.notice_pay_cents == 12000000 — the 365-day tenured notice is exactly one year of fte-weighted salary"
            - "AcademicProgram.${prog_id}.severance_budget_cap_cents == 0 (empty cost window) and staffing_liability_cents == 0"
            - "every one of the four appointments has reduction_sequence_position == null — the cap broke the loop before the first ADJUNCT could be funded"
            - "AcademicProgram.${prog_id}.faculty_fte_baseline == 3.25, assigned_pool_fte == 3.25, retained_teach_out_fte == 0.00, reducible_fte == 3.25, deferred_fte == 3.25"

      - name: overdue_sweep_marks_only_strictly_past_due_notices
        claim_type: threshold
        grounds:
          - calculations.agency_notice_deadline
          - calculations.agency_notice_deadline.constants.AGENCY_NOTICE_DAYS
          - endpoints["POST /provost/compliance-sweeps"]
        distinguishing_aspect: |
          The overdue comparison is strictly `>`, so a sweep run at exactly
          due_at leaves the notice PENDING and a sweep one second later marks it
          OVERDUE. The 30-day ACCREDITOR and 45-day STATE_AGENCY offsets both
          anchor on ratified_at and preserve its 10:00:00 time of day, so the
          state notice is untouched on the day the accreditor notice expires.
        test_recipe:
          setup:
            - "Program HIST-BA carried to a RATIFIED DISCONTINUATION decision at 2026-09-15T10:00:00Z, which auto-mints the ACCREDITOR and STATE_AGENCY notices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
