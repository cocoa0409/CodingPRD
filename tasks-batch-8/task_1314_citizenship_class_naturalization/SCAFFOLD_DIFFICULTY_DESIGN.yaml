              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /naturalization/enrollments/${enr_a7}/attendance-records"
              payload: { session_index: 3, outcome: PRESENT }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /naturalization/enrollments/${enr_a7}/attendance-records"
              payload: { session_index: 4, outcome: ABSENT_UNEXCUSED }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /naturalization/enrollments/${enr_a7}/attendance-records"
              payload: { session_index: 5, outcome: PRESENT }
              as: Volunteer
