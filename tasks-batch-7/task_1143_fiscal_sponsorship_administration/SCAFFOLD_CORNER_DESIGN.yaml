            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_2 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 5000, purpose: "x", payee_type: "VENDOR", payee_name: "V", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id } }
