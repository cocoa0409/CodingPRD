              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${ta_id}/lines"
              payload: { line_seq: 2, subprimal_code: "CHUCK_TRIM_80", disposition: "GRIND_TRIM", yield_weight_lb: 25.0, market_value_per_lb_cents: 400, lean_pct: 80.0 }
              as: MeatCutter
