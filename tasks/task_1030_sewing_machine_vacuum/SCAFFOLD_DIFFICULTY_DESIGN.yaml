# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_1030
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_estimate_vs_final_appraisal
        grounds:
          - calculations.trade_in_appraisal
          - entities.SalesOrder.fields.trade_in_estimate_cents
          - entities.SalesOrder.fields.trade_in_final_cents
          - state_machines.SalesOrder.RESERVED_to_COMPLETED
        distinguishing_aspect: |
          Same trade-in yields two different numbers: the schedule estimate
          (GOOD=40000) at reservation and the manager's final appraisal (48000)
          at completion; the store-credit grant uses the FINAL value, not the
          estimate. This dual-variant lives on the SalesOrder (trade-in valuation)
          domain.
        test_recipe:
          setup:
            - "One Customer with store_credit 0; one SEWING_MACHINE Product; one IN_STOCK InventoryItem of it."
            - "One RESERVED SalesOrder with a GOOD-condition trade-in (estimate 40000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada Byron", email: "ada@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Bernina 770", category: "SEWING_MACHINE", brand: "Bernina", msrp_cents: 120000, warranty_months: 24 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-1", condition: "NEW", acquisition_cost_cents: 80000, list_price_cents: 120000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 100000, trade_in_model: "Old Singer", trade_in_condition: "GOOD" }
              as: SalesAssociate
              captures: { so_id: $.data.id, est: $.data.trade_in_estimate_cents }
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: { trade_in_final_cents: 48000 }
              as: SalesAssociate
              captures: { final: $.data.trade_in_final_cents }
          assert:
            - "SalesOrder.${so_id}.trade_in_estimate_cents == 40000"
            - "SalesOrder.${so_id}.trade_in_final_cents == 48000"
            - "Customer.${cust_id}.store_credit_cents == 48000"

      - name: repair_labor_estimate_vs_final_invoice
        grounds:
          - calculations.repair_invoice
          - entities.RepairTicket.fields.labor_estimate_cents
          - entities.RepairTicket.fields.final_invoice_cents
          - state_machines.RepairTicket.IN_REPAIR_to_READY
        distinguishing_aspect: |
          The provisional labor estimate at quote (2.5h * 9000 = 22500) diverges
          from the final invoice at completion (labor 22500 + parts 7500 = 30000).
          This dual-variant lives on the RepairTicket (service invoicing) domain —
          a different entity domain than the trade-in dual-variant.
        test_recipe:
          setup:
            - "One Customer; one SEWING_MACHINE Product (the machine); one PART Product with two IN_STOCK part units priced 3000 and 4500."
            - "A non-warranty RepairTicket quoted at 2.5 labor hours, approved into IN_REPAIR, with both parts consumed (parts_cost 7500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Carl Gauss", email: "carl@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Miele C3", category: "VACUUM", brand: "Miele", msrp_cents: 90000 }
              as: StoreManager
              captures: { machine_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "HEPA Filter", category: "PART", brand: "Miele", msrp_cents: 3000 }
              as: StoreManager
              captures: { part_prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${part_prod_id}", condition: "NEW", acquisition_cost_cents: 1000, list_price_cents: 3000 }
              as: StoreManager
              captures: { part1_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${part_prod_id}", condition: "NEW", acquisition_cost_cents: 1500, list_price_cents: 4500 }
              as: StoreManager
              captures: { part2_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${machine_id}", is_warranty: false }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "Motor seized", labor_hours: 2.5 }
              as: ServiceTech
              captures: { labor_est: $.data.labor_estimate_cents }
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: SalesAssociate
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${part1_id}" }
              as: ServiceTech
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${part2_id}" }
              as: ServiceTech
          trigger:
            - call: "POST /repair-tickets/${rt_id}/complete"
              payload: {}
              as: ServiceTech
              captures: { final_inv: $.data.final_invoice_cents }
          assert:
            - "RepairTicket.${rt_id}.labor_estimate_cents == 22500"
            - "RepairTicket.${rt_id}.parts_cost_cents == 7500"
            - "RepairTicket.${rt_id}.final_invoice_cents == 30000"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sales_total_nested_min_credit
        grounds:
          - calculations.sales_total
          - entities.SalesOrder.fields.total_due_cents
          - entities.SalesOrder.fields.credit_applied_cents
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Mode (a): total_due = (sale_price - discount) + tax - min(store_credit,
          taxable+tax) has >=3 inputs and a nested min. With store_credit 200000 >
          the 108000 bill, the min binds to the BILL, driving total_due to 0 and
          leaving store_credit 92000. Distinct from the mode-(b) proration formula.
        test_recipe:
          setup:
            - "One Customer given 200000 store credit (STANDARD tier, lifetime_spend 0)."
            - "One SEWING_MACHINE Product; one IN_STOCK InventoryItem; one RESERVED SalesOrder (sale_price 100000, no trade-in)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Emmy Noether", email: "emmy@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/store-credit/adjustments"
              payload: { amount_cents: 200000, reason: "goodwill" }
              as: StoreManager
            - call: "POST /products"
              payload: { model_name: "Juki TL", category: "SEWING_MACHINE", brand: "Juki", msrp_cents: 130000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-J", condition: "NEW", acquisition_cost_cents: 90000, list_price_cents: 130000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 100000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: {}
              as: SalesAssociate
          assert:
            - "SalesOrder.${so_id}.tax_cents == 8000"
            - "SalesOrder.${so_id}.credit_applied_cents == 108000"
            - "SalesOrder.${so_id}.total_due_cents == 0"
            - "Customer.${cust_id}.store_credit_cents == 92000"

      - name: subscription_proration_rounding_order
        grounds:
          - calculations.subscription_proration
          - state_machines.TuneUpSubscription.ACTIVE_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Mode (b): refund = round_half_up(monthly_fee * unused_days / period_days)
          must multiply-before-dividing-before-rounding. With fee 3100, 20 unused
          of 30 days, the pinned order gives 2067, whereas rounding the daily rate
          first (round(3100/30)*20) gives 2060 — the assertion pins 2067.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z; one Customer; one ACTIVE BASIC subscription (fee 3100, period 07-01..07-31)."
            - "Clock advanced to 2026-07-11T00:00:00Z (20 unused days remain)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Sofia Kovalevskaya", email: "sofia@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /tune-up-subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "BASIC", monthly_fee_cents: 3100, tune_ups_included: 2 }
              as: SalesAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /tune-up-subscriptions/${sub_id}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "TuneUpSubscription.${sub_id}.status == CANCELLED"
            - "Customer.${cust_id}.store_credit_cents == 2067"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_ticket_reject_requote_cycle
        grounds:
          - state_machines.RepairTicket.AWAITING_APPROVAL_to_INTAKE
          - state_machines.RepairTicket.INTAKE_to_AWAITING_APPROVAL
          - entities.RepairTicket.fields.labor_estimate_cents
        distinguishing_aspect: |
          RepairTicket is cyclic: AWAITING_APPROVAL -> INTAKE (reject clears the
          quote) -> AWAITING_APPROVAL (re-quote). After a reject+re-quote at 2.0h
          the ticket is back in AWAITING_APPROVAL with labor_estimate 18000, proving
          the loop. Entity: RepairTicket.
        test_recipe:
          setup:
            - "One Customer; one VACUUM Product; a RepairTicket quoted at 1.0h (AWAITING_APPROVAL, labor_estimate 9000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Alan Turing", email: "alan@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Dyson V15", category: "VACUUM", brand: "Dyson", msrp_cents: 75000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "Battery fault", labor_hours: 1.0 }
              as: ServiceTech
          trigger:
            - call: "POST /repair-tickets/${rt_id}/reject"
              payload: {}
              as: SalesAssociate
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "Battery + trigger fault", labor_hours: 2.0 }
              as: ServiceTech
              captures: { est2: $.data.labor_estimate_cents }
          assert:
            - "RepairTicket.${rt_id}.status == AWAITING_APPROVAL"
            - "RepairTicket.${rt_id}.labor_estimate_cents == 18000"

      - name: inventory_item_reserve_release_cycle
        grounds:
          - state_machines.InventoryItem.IN_STOCK_to_RESERVED
          - state_machines.InventoryItem.RESERVED_to_IN_STOCK
          - state_machines.SalesOrder.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          InventoryItem is cyclic: IN_STOCK -> RESERVED (order 1) -> IN_STOCK
          (order 1 cancelled) -> RESERVED (order 2). After cancelling the first
          order and reserving with a second, the item is RESERVED again, proving
          the cycle. Entity: InventoryItem (different from RepairTicket).
        test_recipe:
          setup:
            - "One Customer; one Product; one IN_STOCK InventoryItem; a first RESERVED SalesOrder that is then cancelled (item back to IN_STOCK)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Grace Hopper", email: "grace@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Shark NV", category: "VACUUM", brand: "Shark", msrp_cents: 30000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-S", condition: "NEW", acquisition_cost_cents: 18000, list_price_cents: 30000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 28000 }
              as: SalesAssociate
              captures: { so1_id: $.data.id }
            - call: "POST /sales-orders/${so1_id}/cancel"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 27000 }
              as: SalesAssociate
              captures: { so2_id: $.data.id }
          assert:
            - "SalesOrder.${so1_id}.status == CANCELLED"
            - "InventoryItem.${item_id}.status == RESERVED"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: class_session_cancel_refund_cascade_depth3
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - state_machines.ClassEnrollment.ENROLLED_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: |
          Three causal hops from one trigger: cancel session -> each ENROLLED
          ClassEnrollment goes CANCELLED -> that cancellation refunds fee_charged
          to the enrollee's store_credit. Session -> Enrollment -> Customer.
        test_recipe:
          setup:
            - "Two Customers each given 20000 store credit; one SCHEDULED ClassSession (capacity 5, fee 5000); both enrolled (each store_credit now 15000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cust One", email: "c1@x.com" }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers/${c1_id}/store-credit/adjustments"
              payload: { amount_cents: 20000, reason: "seed" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Cust Two", email: "c2@x.com" }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /customers/${c2_id}/store-credit/adjustments"
              payload: { amount_cents: 20000, reason: "seed" }
              as: StoreManager
            - call: "POST /class-sessions"
              payload: { title: "Intro to Quilting", machine_type: "SEWING", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T12:00:00Z", capacity: 5, fee_cents: 5000 }
              as: StoreManager
              captures: { cs_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c1_id}" }
              as: SalesAssociate
              captures: { e1_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c2_id}" }
              as: SalesAssociate
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${cs_id}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "ClassSession.${cs_id}.status == CANCELLED"
            - "ClassEnrollment.${e1_id}.status == CANCELLED"
            - "ClassEnrollment.${e2_id}.status == CANCELLED"
            - "Customer.${c1_id}.store_credit_cents == 20000"
            - "Customer.${c2_id}.store_credit_cents == 20000"

      - name: enrollment_cancel_waitlist_promotion_depth2
        grounds:
          - state_machines.ClassEnrollment.ENROLLED_to_CANCELLED
          - entities.ClassSession.fields.enrolled_count
          - entities.ClassSession.fields.waitlist_count
        distinguishing_aspect: |
          Two causal hops from a different trigger: cancel an ENROLLED seat ->
          the freed seat promotes the earliest-created WAITLISTED enrollment
          (created_at ASC) to ENROLLED. Enrollment(cancel) -> Enrollment(promote).
          Distinct trigger from the session-cancel cascade.
        test_recipe:
          setup:
            - "Three Customers; one SCHEDULED ClassSession (capacity 1, fee 0); c1 ENROLLED, c2 WAITLISTED (earlier), c3 WAITLISTED (later)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "WL One", email: "w1@x.com" }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "WL Two", email: "w2@x.com" }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "WL Three", email: "w3@x.com" }
              as: SalesAssociate
              captures: { c3_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "Serger Basics", machine_type: "SEWING", start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", capacity: 1, fee_cents: 0 }
              as: StoreManager
              captures: { cs_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c1_id}" }
              as: SalesAssociate
              captures: { e1_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c2_id}" }
              as: SalesAssociate
              captures: { e2_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c3_id}" }
              as: SalesAssociate
              captures: { e3_id: $.data.id }
          trigger:
            - call: "POST /class-enrollments/${e1_id}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "ClassEnrollment.${e1_id}.status == CANCELLED"
            - "ClassEnrollment.${e2_id}.status == ENROLLED"
            - "ClassEnrollment.${e3_id}.status == WAITLISTED"
            - "ClassSession.${cs_id}.enrolled_count == 1"
            - "ClassSession.${cs_id}.waitlist_count == 1"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rental_state_beats_temporal_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_ITEM_NOT_AVAILABLE]
          - errors[ERR_RENTAL_OVERLAP]
        distinguishing_aspect: |
          A rental create that violates BOTH the state check (item RESERVED by a
          sale, priority 6) AND the temporal overlap check (priority 8) returns the
          higher-priority ERR_ITEM_NOT_AVAILABLE, not ERR_RENTAL_OVERLAP. Category
          pair: state vs business_temporal.
        test_recipe:
          setup:
            - "One Customer; one Product; one InventoryItem; an ACTIVE rental R1 over [07-02,07-10); then the same item reserved by a sale order (item now RESERVED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rent Cust", email: "rent@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Loaner Vac", category: "VACUUM", brand: "Generic", msrp_cents: 20000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-L", condition: "REFURBISHED", acquisition_cost_cents: 8000, list_price_cents: 20000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-10T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { r1_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 19000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-05T00:00:00Z", due_at: "2026-07-08T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ITEM_NOT_AVAILABLE"
            - "response status code == 409"

      - name: sale_recall_safety_beats_tradein_band
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_PRODUCT_RECALLED]
          - errors[ERR_TRADE_IN_OUT_OF_BAND]
        distinguishing_aspect: |
          A sale completion that violates BOTH the recall safety check (product
          RECALLED, priority 7) AND the trade-in band check (final 99000 vs estimate
          40000, |delta|=59000 > 15000, priority 12) returns ERR_PRODUCT_RECALLED.
          Category pair: business_safety vs business_constraint.
        test_recipe:
          setup:
            - "One Customer; one SEWING_MACHINE Product; one IN_STOCK InventoryItem; a RESERVED SalesOrder with GOOD trade-in (estimate 40000); the product then RECALLED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Recall Cust", email: "rc@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Recalled 900", category: "SEWING_MACHINE", brand: "Acme", msrp_cents: 110000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-R", condition: "NEW", acquisition_cost_cents: 70000, list_price_cents: 110000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 100000, trade_in_model: "Old Kenmore", trade_in_condition: "GOOD" }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /products/${prod_id}/recall"
              payload: { recall_reason: "Fire hazard" }
              as: StoreManager
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: { trade_in_final_cents: 99000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_RECALLED"
            - "response status code == 409"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: class_capacity_ge_boundary_waitlists
        grounds:
          - state_machines.ClassEnrollment.null_to_WAITLISTED
          - entities.ClassSession.fields.capacity
          - entities.ClassSession.fields.enrolled_count
        distinguishing_aspect: |
          At exactly enrolled_count == capacity (1 == 1) the next enrollment is
          WAITLISTED, not ENROLLED — the boundary is '>=' capacity, not '>'. Metric:
          seat count; endpoint: POST /class-sessions/{id}/enrollments.
        test_recipe:
          setup:
            - "Two Customers; one SCHEDULED ClassSession capacity 1, fee 0; c1 already ENROLLED (enrolled_count == capacity == 1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cap One", email: "cap1@x.com" }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cap Two", email: "cap2@x.com" }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "Full Class", machine_type: "VACUUM", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", capacity: 1, fee_cents: 0 }
              as: StoreManager
              captures: { cs_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c1_id}" }
              as: SalesAssociate
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${c2_id}" }
              as: SalesAssociate
              captures: { e2_id: $.data.id, e2_status: $.data.status }
          assert:
            - "ClassEnrollment.${e2_id}.status == WAITLISTED"
            - "ClassSession.${cs_id}.enrolled_count == 1"
            - "ClassSession.${cs_id}.waitlist_count == 1"

      - name: tuneup_used_ge_included_exhausted
        grounds:
          - validations[priority=11]
          - entities.TuneUpSubscription.fields.tune_ups_used
          - errors[ERR_TUNE_UPS_EXHAUSTED]
        distinguishing_aspect: |
          At exactly tune_ups_used == tune_ups_included (2 == 2) a third redeem is
          rejected with ERR_TUNE_UPS_EXHAUSTED — the guard is 'used < included', so
          the boundary equals-included is a rejection. Metric: usage counter;
          endpoint: POST /tune-up-subscriptions/{id}/redeem. Different metric and
          endpoint from the capacity boundary.
        test_recipe:
          setup:
            - "One Customer; one ACTIVE subscription (included 2); both tune-ups already redeemed (tune_ups_used == 2)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sub Cust", email: "sub@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /tune-up-subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "PRO", monthly_fee_cents: 5000, tune_ups_included: 2 }
              as: SalesAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /tune-up-subscriptions/${sub_id}/redeem"
              payload: {}
              as: ServiceTech
            - call: "POST /tune-up-subscriptions/${sub_id}/redeem"
              payload: {}
              as: ServiceTech
              captures: { used_now: $.data.tune_ups_used }
          trigger:
            - call: "POST /tune-up-subscriptions/${sub_id}/redeem"
              payload: {}
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TUNE_UPS_EXHAUSTED"
            - "response status code == 409"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sale_complete_blocked_by_product_recall
        grounds:
          - state_machines.SalesOrder.RESERVED_to_COMPLETED
          - entities.Product.fields.recall_status
          - errors[ERR_PRODUCT_RECALLED]
        distinguishing_aspect: |
          SalesOrder's RESERVED->COMPLETED transition depends on the state of a
          different entity: the Product (of the reserved item) must have
          recall_status == NONE. With the product RECALLED and no other violation,
          completion fails ERR_PRODUCT_RECALLED. Entity pair: SalesOrder -> Product.
        test_recipe:
          setup:
            - "One Customer; one SEWING_MACHINE Product; one IN_STOCK InventoryItem; a RESERVED SalesOrder (NO trade-in); the product then RECALLED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dep Cust", email: "dep@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Model X", category: "SEWING_MACHINE", brand: "Acme", msrp_cents: 100000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-X", condition: "NEW", acquisition_cost_cents: 60000, list_price_cents: 100000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 95000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /products/${prod_id}/recall"
              payload: { recall_reason: "Wiring defect" }
              as: StoreManager
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_RECALLED"
            - "SalesOrder.${so_id}.status == RESERVED"

      - name: enroll_blocked_by_session_not_scheduled
        grounds:
          - state_machines.ClassEnrollment.null_to_ENROLLED
          - entities.ClassSession.fields.status
          - errors[ERR_SESSION_NOT_OPEN]
        distinguishing_aspect: |
          ClassEnrollment creation depends on a different entity's state: the
          ClassSession must be SCHEDULED. Enrolling into a CANCELLED session fails
          ERR_SESSION_NOT_OPEN. Entity pair: ClassEnrollment -> ClassSession
          (different pair from SalesOrder -> Product).
        test_recipe:
          setup:
            - "One Customer; one ClassSession that is then CANCELLED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Enr Cust", email: "enr@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "Cancelled Class", machine_type: "SEWING", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z", capacity: 3, fee_cents: 0 }
              as: StoreManager
              captures: { cs_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/cancel"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_OPEN"
            - "response status code == 409"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_half_open_item_overlap
        grounds:
          - calculations.rental_overlap_check
          - validations[priority=8]
          - errors[ERR_RENTAL_OVERLAP]
        distinguishing_aspect: |
          On the InventoryItem resource, rentals use HALF-OPEN [start,due) geometry:
          a new [07-05,07-08) collides with an ACTIVE [07-02,07-06) (05<06 and
          02<08) -> ERR_RENTAL_OVERLAP, while adjacency (start==due) would NOT
          collide. Interval semantics: half-open, adjacency allowed.
        test_recipe:
          setup:
            - "One Customer; one Product; one InventoryItem; an ACTIVE rental R1 over [07-02,07-06)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ov Cust", email: "ov@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Ov Vac", category: "VACUUM", brand: "Generic", msrp_cents: 25000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-O", condition: "REFURBISHED", acquisition_cost_cents: 9000, list_price_cents: 25000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-06T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-05T00:00:00Z", due_at: "2026-07-08T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RENTAL_OVERLAP"
            - "response status code == 409"

      - name: class_closed_buffer_customer_schedule
        grounds:
          - calculations.class_schedule_overlap_check
          - validations[priority=9]
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          On the Customer resource (personal schedule), sessions use CLOSED
          [start,end] geometry with a 30-minute buffer: a new session starting
          12:20 only 20 minutes after an enrolled session ending 12:00 fails
          ERR_SCHEDULE_CONFLICT (buffer not met). Different interval semantics
          (closed + buffer) and different resource (Customer) than rentals.
        test_recipe:
          setup:
            - "One Customer enrolled in session S1 [10:00,12:00]; a second SCHEDULED session S2 [12:20,14:00] only 20 minutes later."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sched Cust", email: "sc@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "S1", machine_type: "SEWING", start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T12:00:00Z", capacity: 5, fee_cents: 0 }
              as: StoreManager
              captures: { s1_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "S2", machine_type: "SEWING", start_at: "2026-08-05T12:20:00Z", end_at: "2026-08-05T14:00:00Z", capacity: 5, fee_cents: 0 }
              as: StoreManager
              captures: { s2_id: $.data.id }
            - call: "POST /class-sessions/${s1_id}/enrollments"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${s2_id}/enrollments"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_CONFLICT"
            - "response status code == 409"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sale_complete_cancel_store_credit_conserved
        grounds:
          - state_machines.SalesOrder.RESERVED_to_COMPLETED
          - state_machines.SalesOrder.COMPLETED_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
          - entities.SalesOrder.fields.credit_applied_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.store_credit_cents. A sale that consumes
          30000 credit and grants a 48000 trade-in, then is reversed, must leave
          store_credit exactly at its pre-sale 30000: 30000 -30000(consume)
          +48000(grant) +30000(refund) -48000(clawback) == 30000.
        test_recipe:
          setup:
            - "One Customer given 30000 store credit; one SEWING_MACHINE Product; one IN_STOCK InventoryItem; a COMPLETED SalesOrder (sale_price 100000, GOOD trade-in, final 48000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv Cust", email: "inv@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/store-credit/adjustments"
              payload: { amount_cents: 30000, reason: "seed" }
              as: StoreManager
            - call: "POST /products"
              payload: { model_name: "Cons Model", category: "SEWING_MACHINE", brand: "Acme", msrp_cents: 120000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-C", condition: "NEW", acquisition_cost_cents: 70000, list_price_cents: 120000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 100000, trade_in_model: "Old Bernina", trade_in_condition: "GOOD" }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /sales-orders/${so_id}/complete"
              payload: { trade_in_final_cents: 48000 }
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${so_id}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "SalesOrder.${so_id}.status == CANCELLED"
            - "SalesOrder.${so_id}.credit_applied_cents == 30000"
            - "Customer.${cust_id}.store_credit_cents == 30000"
            - "Customer.${cust_id}.lifetime_spend_cents == 0"

      - name: inventory_reserve_cancel_instock_count_conserved
        grounds:
          - state_machines.InventoryItem.IN_STOCK_to_RESERVED
          - state_machines.InventoryItem.RESERVED_to_IN_STOCK
          - entities.InventoryItem.fields.status
        distinguishing_aspect: |
          Conserved quantity = the number of InventoryItems with status IN_STOCK.
          Reserving the item via a sale (IN_STOCK->RESERVED) then cancelling
          (RESERVED->IN_STOCK) returns the item to IN_STOCK, leaving the IN_STOCK
          count unchanged. Different conserved quantity (item availability count)
          from the store-credit invariant.
        test_recipe:
          setup:
            - "One Customer; one Product; one IN_STOCK InventoryItem (IN_STOCK count == 1); a RESERVED SalesOrder reserving it (IN_STOCK count == 0)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cnt Cust", email: "cnt@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Cnt Model", category: "VACUUM", brand: "Generic", msrp_cents: 40000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-CNT", condition: "NEW", acquisition_cost_cents: 25000, list_price_cents: 40000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 38000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${so_id}/cancel"
              payload: {}
              as: SalesAssociate
          assert:
            - "SalesOrder.${so_id}.status == CANCELLED"
            - "InventoryItem.${item_id}.status == IN_STOCK"
