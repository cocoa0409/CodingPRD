      - name: certificate_lapses_in_lifecycle_dimension_while_verification_dimension_still_pending
        grounds:
          - state_machines.InsuranceCertificate.PENDING_to_VERIFIED
          - calculations.certificate_lifecycle_status
          - entities.InsuranceCertificate.fields.lifecycle_status
          - entities.InsuranceCertificate.fields.verification_status
          - entities.Contractor.fields.verified_coverage_types
        distinguishing_aspect: |
          Two independent state dimensions on one row: `verification_status` is moved only by the
          analyst decision and `lifecycle_status` only by the logical clock, so the row legally
          reaches (VERIFIED, LAPSED) - verification succeeds on an already-lapsed certificate - and
          Contractor.verified_coverage_types stays [] because it filters on the FRESH lifecycle
          rather than on verification_status.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Contractor Acme registered with hazard_profile [GENERAL] (base_hazard_tier 1)."
            - "A GL certificate 1000000/2000000 covering 2026-07-01 to 2026-08-15 is created while the clock reads 2026-08-01, so its materialized lifecycle_status is EXPIRING_SOON (14 days to expiry) and its verification_status is PENDING."
            - "The clock is then moved to 2026-08-20T00:00:00Z without any other write, so the stored lifecycle_status is deliberately stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
            - call: "POST /contractors/${con_id}/insurance-certificates"
              payload: { coverage_type: "GL", carrier_name: "Ironclad Mutual", each_occurrence_limit: 1000000, aggregate_limit: 2000000, effective_date: "2026-07-01T00:00:00Z", expiration_date: "2026-08-15T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /insurance-certificates/${cert_gl_id}/verify"
              payload: { decision: "VERIFY" }
              as: VerificationAnalyst
              as_user_id: "analyst-ins-1"
          assert:
            - "the certificate was created with lifecycle_status EXPIRING_SOON (14 days to expiry at the 2026-08-01 clock)"
            - "verify response HTTP 200 - an already-lapsed certificate is still verifiable because the two dimensions do not gate each other"
            - "InsuranceCertificate.${cert_gl_id}.verification_status == VERIFIED"
            - "InsuranceCertificate.${cert_gl_id}.lifecycle_status == LAPSED (re-materialized against the 2026-08-20 clock)"
            - "InsuranceCertificate.${cert_gl_id}.verified_by_user_id == analyst-ins-1"
            - "Contractor.${con_id}.verified_coverage_types == []"

