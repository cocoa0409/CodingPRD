      - name: trend_rollup_sum_then_round_pinned
        grounds:
          - calculations.trend_case_rate
          - entities.TrendSnapshot.fields.case_rate_per_100
        distinguishing_aspect: |
          Mode (b) nested rounding: per-scope rates are rounded individually
          (round_half_up to 2dp), but any cross-scope rollup MUST sum the
          UNROUNDED per-scope rates and round once. With per-scope raw rates
          1/3*100 = 33.333... and 1/6*100 = 16.666..., the pinned rollup is
          round_half_up(50.0, 2) == 50.00; the forbidden round-then-sum order
          yields 33.33 + 16.67 = 50.00 only coincidentally — the discriminating
          fixture uses raw rates 1/6*100=16.666... and 1/6*100=16.666... where
          pinned order gives 33.33 but forbidden order gives 16.67+16.67=33.34.
        test_recipe:
          setup:
            - "Two LOCATION scopes: LA with 6 ACTIVE employees and 1 closed case; NY with 6 ACTIVE employees and 1 closed case (both closures within the rolling window)."
            - "Clock at 2026-08-20T00:00:00Z (as_of)."
            - "Each location's ROLLING_90D snapshot computed; per-scope rounded rate is 16.67 each, but the rollup over raw values is round_half_up(16.666...+16.666..., 2) == 33.33."
