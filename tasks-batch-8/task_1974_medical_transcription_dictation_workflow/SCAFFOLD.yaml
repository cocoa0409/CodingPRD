# =============================================================================
# Task 1974 — Medical Transcription & Dictation Workflow (vendor side)
# =============================================================================

scenario: |
  1974. Medical Transcription & Dictation Workflow (transcription service vendor): dictation capture & job routing by turnaround priority, speech-recognition draft with editor review, quality scoring & error-severity classification, STAT job escalation & pool capacity, provider template & macro management, transcript return to record & signature queue, unsigned-report aging & suspension policy, vendor SLA & per-line billing

domain_name: medical-transcription
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy            # STAT preemption + capacity-shrink preemption selectors
    - optimistic_concurrency     # OCC on Provider.version (template supersede) and ProviderTemplate.version
    - cascading_side_effects     # QA review -> editor standing -> capacity -> job preemption; clock sweep -> aging -> provider -> clinic
    - rate_threshold_triggers    # QA pass boundary, aging tiers, standing bands, escalation buffers
  entity_topology: flat          # all resources top-level; relationships via FK references
  state_machine_shape: parallel  # DictationJob.workflow_status x DictationJob.escalation_level; Editor/Provider machines cyclic; Transcript/BillingPeriod branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # QA reviewer must differ from transcript author; vendor-side vs clinic-side roles disjoint
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 5
  calculation_count: 11
  endpoint_count: 45
  error_code_count: 40
  role_count: 5

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClinicAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic organization name" }
      - { name: unsigned_report_threshold, type: integer, source: input, default: 3, description: "TIER_2-aged unsigned transcripts per provider that trigger SUSPENDED; constraint: >= 1" }
      - { name: aging_tier1_hours, type: integer, source: input, default: 24, description: "Hours after delivered_at when an unsigned transcript enters TIER_1; constraint: >= 1 and < aging_tier2_hours" }
      - { name: aging_tier2_hours, type: integer, source: input, default: 72, description: "Hours after delivered_at when an unsigned transcript enters TIER_2 (aged)" }
      - { name: payment_grace_days, type: integer, source: input, default: 14, description: "Days after finalized_at before an unpaid FINALIZED period triggers billing_hold" }
      - { name: billing_hold, type: boolean, source: computed, description: "True when a FINALIZED BillingPeriod exists with now >= finalized_at + payment_grace_days*86400s; blocks new dictation uploads" }
      - { name: suspended_provider_count, type: integer, source: computed, default: 0, description: "Count of this clinic's Providers with status == SUSPENDED" }

  - name: SLAPolicy
    parent: null
    common_fields: true
    fields:
      - { name: clinic_account_id, type: string, source: input, description: "FK -> ClinicAccount.id; owning clinic" }
      - { name: priority, type: enum, source: input, description: "STAT | URGENT | ROUTINE" }
      - { name: tat_minutes, type: integer, source: input, description: "Turnaround target in minutes; constraint: > 0" }
      - { name: rate_per_line_cents, type: integer, source: input, description: "Billed rate per 65-char line for this priority; constraint: > 0" }
      - { name: breach_credit_pct, type: integer, source: input, description: "Percent of a breaching line item's final_amount_cents credited back; constraint: 0..100" }
      - { name: measurement_basis, type: enum, source: input, description: "END_TO_END | PRODUCTION_WINDOW; selects the tat_compliance_measurement variant" }
    # uniqueness: at most one SLAPolicy per (clinic_account_id, priority)

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: clinic_account_id, type: string, source: input, description: "FK -> ClinicAccount.id; employing clinic" }
      - { name: full_name, type: string, source: input, description: "Provider display name" }
      - { name: specialty, type: enum, source: input, description: "RADIOLOGY | CARDIOLOGY | ORTHOPEDICS | GENERAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WARNING | SUSPENDED (signature-compliance machine)" }
      - { name: unsigned_tier1_count, type: integer, source: computed, default: 0, description: "Provider's transcripts with status == DELIVERED and aging_tier == TIER_1" }
      - { name: unsigned_aged_count, type: integer, source: computed, default: 0, description: "Provider's transcripts with status == DELIVERED and aging_tier == TIER_2" }
      - { name: suspension_reason, type: string, source: system, description: "Null, or 'UNSIGNED_REPORT_AGING' when auto-suspended" }

  - name: Editor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Editor display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PROBATION | SUSPENDED (quality-standing machine, cyclic)" }
      - { name: rolling_quality_score, type: number, source: computed, default: 100.0, description: "Mean of accuracy_score over the editor's 20 most recent QAReviews, 2dp round_half_up" }
      - { name: qa_review_count, type: integer, source: computed, default: 0, description: "Total QAReviews recorded against this editor's transcripts" }
      - { name: skill_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3; provisional TIER_2 until qa_review_count >= 5" }
      - { name: max_concurrent_claims, type: integer, source: computed, default: 3, description: "TIER_1=1, TIER_2=3, TIER_3=5, SUSPENDED=0" }
      - { name: active_claim_count, type: integer, source: computed, default: 0, description: "DictationJobs with workflow_status IN {EDITING, SUBMITTED} and claimed_by_editor_id == this editor" }

  - name: EditorShiftWindow
    parent: null
    common_fields: true
    fields:
      - { name: editor_id, type: string, source: input, description: "FK -> Editor.id; window owner" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive); half-open interval semantics" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); must be strictly > start_at" }
    # immutable: no update endpoint; overlap rule in validations

  - name: DictationJob
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; dictating provider (must equal X-User-ID for role Provider)" }
      - { name: clinic_account_id, type: string, source: system, description: "FK -> ClinicAccount.id; copied from Provider.clinic_account_id at creation" }
      - { name: work_type, type: enum, source: input, description: "CONSULT | OP_NOTE | DISCHARGE_SUMMARY | CLINIC_NOTE | RADIOLOGY_REPORT" }
      - { name: priority, type: enum, source: input, description: "STAT | URGENT | ROUTINE" }
      - { name: audio_duration_seconds, type: integer, source: input, description: "Captured dictation length; constraint: > 0" }
      - { name: template_id, type: string, source: input, description: "FK -> ProviderTemplate.id; optional template applied to the draft" , default: null }
      - { name: workflow_status, type: enum, source: system, description: "QUEUED | EDITING | SUBMITTED | DELIVERED | CANCELLED" }
      - { name: escalation_level, type: enum, source: system, description: "NONE | ESCALATED | CRITICAL; parallel axis, monotonic non-decreasing, driven by clock sweep" }
      - { name: claimed_by_editor_id, type: string, source: system, description: "FK -> Editor.id; null while QUEUED" , default: null }
      - { name: first_claimed_at, type: datetime, source: system, description: "Timestamp of the job's first claim ever (PRODUCTION_WINDOW basis); null until first claim" , default: null }
      - { name: claimed_at, type: datetime, source: system, description: "Timestamp of the current claim; null while QUEUED" , default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of the latest submission; null until first submit" , default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of QA-pass delivery; null until delivered" , default: null }
      - { name: due_at, type: datetime, source: computed, description: "= created_at + SLAPolicy(clinic, priority).tat_minutes; fixed at creation, never recomputed" }
      - { name: asr_char_estimate, type: integer, source: computed, description: "Speech-recognition draft estimate = audio_duration_seconds * 2 (ASR_CHARS_PER_SECOND)" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Increments on QA FAIL and on provider return" }
      - { name: preempted_count, type: integer, source: system, default: 0, description: "Increments each time the job is force-released by a preemption" }

  - name: Transcript
    parent: null
    common_fields: true
    fields:
      - { name: dictation_job_id, type: string, source: system, description: "FK -> DictationJob.id; owning job (1:N — each submission creates a new version)" }
      - { name: editor_id, type: string, source: system, description: "FK -> Editor.id; author = claiming editor at submit time (segregation-of-duties anchor)" }
      - { name: version_number, type: integer, source: system, description: "Per-job transcript version, starts at 1, +1 per submission" }
      - { name: final_text, type: string, source: input, description: "Edited transcript text supplied on submit" }
      - { name: visible_char_count, type: integer, source: computed, description: "len(final_text) after removing all whitespace characters (space, tab, newline)" }
      - { name: line_count, type: integer, source: computed, description: "= ceil(visible_char_count / 65) (CHARS_PER_LINE); 0 chars -> 0 lines" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | DELIVERED | REJECTED | RETURNED | SIGNED | AMENDED" }
      - { name: aging_tier, type: enum, source: computed, description: "NONE | TIER_1 | TIER_2; computed from delivered_at vs clinic aging thresholds while status == DELIVERED" }
      - { name: delivered_at, type: datetime, source: system, description: "When QA passed; null until DELIVERED" , default: null }
      - { name: signed_at, type: datetime, source: system, description: "When provider signed; null until SIGNED" , default: null }
      - { name: addendum_text, type: string, source: input, description: "Supplied on addend; null otherwise" , default: null }

  - name: QAReview
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: dictation_job_id, type: string, source: input, description: "FK -> DictationJob.id; job under review (must be SUBMITTED)" }
      - { name: transcript_id, type: string, source: system, description: "FK -> Transcript.id; the job's current SUBMITTED transcript version" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the QASupervisor; must differ from transcript.editor_id" }
      - { name: critical_error_count, type: integer, source: input, description: "Constraint: >= 0" }
      - { name: major_error_count, type: integer, source: input, description: "Constraint: >= 0" }
      - { name: minor_error_count, type: integer, source: input, description: "Constraint: >= 0" }
      - { name: accuracy_score, type: number, source: computed, description: "= max(0, 100 - 25*critical - 5*major - 1*minor), 2dp" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL; PASS iff accuracy_score >= 80.0 AND critical_error_count == 0" }
      - { name: editor_sequence, type: integer, source: system, description: "Per-editor monotonic review ordinal (1,2,3,...); tie-break for same-timestamp windows" }

  - name: ProviderTemplate
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; owning provider (must equal X-User-ID for role Provider)" }
      - { name: work_type, type: enum, source: input, description: "CONSULT | OP_NOTE | DISCHARGE_SUMMARY | CLINIC_NOTE | RADIOLOGY_REPORT" }
      - { name: name, type: string, source: input, description: "Template name" }
      - { name: body_text, type: string, source: input, description: "Template body with macro placeholders" }
      - { name: is_active, type: boolean, source: computed, default: true, description: "Exactly one active template per (provider_id, work_type); creating a new one deactivates the prior" }

  - name: Macro
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; owning provider" }
      - { name: shortcut, type: string, source: input, description: "Expansion trigger; unique per provider among status == ACTIVE" }
      - { name: expansion_text, type: string, source: input, description: "Text the macro expands to" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED (soft delete; archived excluded from lists by default)" }

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: clinic_account_id, type: string, source: input, description: "FK -> ClinicAccount.id; billed clinic" }
      - { name: period_start, type: datetime, source: input, description: "Closed-interval start for both overlap and membership" }
      - { name: period_end, type: datetime, source: input, description: "Closed-interval end; must be strictly > period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | FINALIZED | DISPUTED | SETTLED" }
      - { name: gross_amount_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents over line items at finalize; invariant: gross == net + credit" }
      - { name: credit_amount_cents, type: integer, source: computed, default: 0, description: "Sum of per-item SLA credits (each rounded half-up before summing)" }
      - { name: net_amount_cents, type: integer, source: computed, default: 0, description: "= gross_amount_cents - credit_amount_cents" }
      - { name: finalized_at, type: datetime, source: system, description: "Set on finalize; drives billing_hold aging" , default: null }

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id; containing period" }
      - { name: transcript_id, type: string, source: system, description: "FK -> Transcript.id; billed transcript version" }
      - { name: priority, type: enum, source: system, description: "Snapshot of job priority at close" }
      - { name: rate_per_line_cents, type: integer, source: system, description: "Snapshot of SLAPolicy.rate_per_line_cents at close" }
      - { name: provisional_line_count, type: integer, source: computed, description: "= ceil(job.asr_char_estimate / 65) at close" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "= provisional_line_count * rate_per_line_cents" }
      - { name: final_line_count, type: integer, source: computed, description: "= transcript.line_count; null until finalize" , default: null }
      - { name: final_amount_cents, type: integer, source: computed, description: "= final_line_count * rate_per_line_cents; null until finalize" , default: null }
      - { name: sla_breach, type: boolean, source: computed, description: "Result of tat_compliance_measurement under the clinic's measurement_basis; null until finalize" , default: null }
      - { name: credit_cents, type: integer, source: computed, description: "= sla_breach ? round_half_up(final_amount_cents * breach_credit_pct / 100) : 0; null until finalize" , default: null }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | CREDIT_REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DictationJob
    initial_state: QUEUED   # workflow_status axis; creation runs ASR inline and lands in QUEUED
    terminal_states: [CANCELLED]
    transitions:
      # ---- workflow_status axis ----
      - from: QUEUED
        to: EDITING
        trigger: POST /dictation-jobs/{id}/claim
        actor: Editor
        preconditions:
          - "Job QUEUED (ERR_JOB_NOT_QUEUED)"
          - "Editor not SUSPENDED (ERR_EDITOR_NOT_ACTIVE)"
          - "If priority == STAT: editor.status must be ACTIVE (ERR_PROBATION_STAT_FORBIDDEN)"
          - "editor.active_claim_count < editor.max_concurrent_claims (ERR_EDITOR_CAPACITY_FULL)"
          - "now within some EditorShiftWindow of editor (ERR_OUTSIDE_SHIFT_WINDOW)"
        side_effects:
          - "claimed_by_editor_id = editor, claimed_at = now, first_claimed_at = now if null"
          - "editor.active_claim_count += 1"

      - from: EDITING
        to: QUEUED
        trigger: "POST /dictation-jobs/{id}/release (voluntary) OR system preemption (STAT escalation / capacity shrink)"
        actor: Editor | VendorAdmin | system
        preconditions:
          - "Voluntary: job EDITING and (caller is claimed editor or VendorAdmin) (ERR_JOB_NOT_EDITING)"
          - "System: fired by selector in calculations.escalation_and_preemption / editor_capacity_reevaluation"
        side_effects:
          - "claimed_by_editor_id = null, claimed_at = null"
          - "editor.active_claim_count -= 1"
          - "system preemption additionally: preempted_count += 1"

      - from: EDITING
        to: SUBMITTED
        trigger: POST /dictation-jobs/{id}/submit
        actor: Editor
        preconditions:
          - "Job EDITING and claimed_by_editor_id == X-User-ID (ERR_JOB_NOT_EDITING / ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Create Transcript: status SUBMITTED, version_number = prior count + 1, visible_char_count & line_count computed"
          - "submitted_at = now"

      - from: SUBMITTED
        to: DELIVERED
        trigger: "system on QA PASS (POST /qa-reviews with outcome PASS)"
        actor: system
        preconditions:
          - "QAReview outcome == PASS"
        side_effects:
          - "Transcript -> DELIVERED, transcript.delivered_at = now, transcript.aging_tier = NONE"
          - "delivered_at = now; claimed_by_editor_id = null; claimed_at = null; editor.active_claim_count -= 1"
          - "Editor standing cascade runs (see calculations.editor_rolling_quality_and_standing)"

      - from: SUBMITTED
        to: EDITING
        trigger: "system on QA FAIL (POST /qa-reviews with outcome FAIL)"
        actor: system
        preconditions:
          - "QAReview outcome == FAIL"
        side_effects:
          - "Transcript (current version) -> REJECTED"
          - "rework_count += 1; job stays claimed by same editor (active_claim_count unchanged)"
          - "Editor standing cascade runs; may preempt this job afterwards (capacity shrink)"

      - from: DELIVERED
        to: EDITING
        trigger: POST /transcripts/{id}/return (provider rejects delivered transcript)
        actor: Provider
        preconditions:
          - "Transcript DELIVERED and job's provider == X-User-ID (ERR_TRANSCRIPT_NOT_DELIVERED / ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Transcript -> RETURNED (terminal for that version); provider unsigned counts recomputed"
          - "rework_count += 1; claimed_by_editor_id = transcript.editor_id, claimed_at = now (system re-claim, bypasses capacity/window gates; does NOT trigger preemption)"
          - "transcript.editor_id.active_claim_count += 1"

      - from: QUEUED
        to: CANCELLED
        trigger: POST /dictation-jobs/{id}/cancel
        actor: Provider | VendorAdmin
        preconditions:
          - "Job QUEUED or EDITING (ERR_JOB_NOT_CANCELLABLE); Provider caller must own job"
        side_effects: []

      - from: EDITING
        to: CANCELLED
        trigger: POST /dictation-jobs/{id}/cancel
        actor: Provider | VendorAdmin
        preconditions:
          - "Job QUEUED or EDITING (ERR_JOB_NOT_CANCELLABLE); Provider caller must own job"
        side_effects:
          - "Compensation: claimed_by_editor_id = null; editor.active_claim_count -= 1"

      # ---- escalation_level axis (parallel; frozen once DELIVERED or CANCELLED) ----
      - from: NONE
        to: ESCALATED
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "workflow_status IN {QUEUED, EDITING, SUBMITTED}"
          - "now >= due_at - (tat_minutes // 4) minutes AND now < due_at"
        side_effects: []

      - from: ESCALATED
        to: CRITICAL
        trigger: "system sweep on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "workflow_status IN {QUEUED, EDITING, SUBMITTED}"
          - "now >= due_at"
        side_effects:
          - "If priority == STAT and workflow_status == QUEUED: run STAT preemption routine (calculations.escalation_and_preemption)"

      - from: NONE
        to: CRITICAL
        trigger: "system sweep on POST /_clock/set_current_utc (now already >= due_at)"
        actor: system
        preconditions:
          - "workflow_status IN {QUEUED, EDITING, SUBMITTED} and now >= due_at"
        side_effects:
          - "If priority == STAT and workflow_status == QUEUED: run STAT preemption routine"

  - entity: Transcript
    initial_state: SUBMITTED
    terminal_states: [REJECTED, RETURNED, AMENDED]
    transitions:
      - from: SUBMITTED
        to: DELIVERED
        trigger: "system on QA PASS"
        actor: system
        preconditions: ["QAReview outcome == PASS on parent job"]
        side_effects: ["delivered_at = now; signature-queue aging clock starts"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system on QA FAIL"
        actor: system
        preconditions: ["QAReview outcome == FAIL on parent job"]
        side_effects: []
      - from: DELIVERED
        to: SIGNED
        trigger: POST /transcripts/{id}/sign
        actor: Provider
        preconditions: ["Transcript DELIVERED; job provider == X-User-ID (ERR_TRANSCRIPT_NOT_DELIVERED / ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects:
          - "signed_at = now; aging_tier frozen (stops aging)"
          - "Provider unsigned_tier1_count / unsigned_aged_count recomputed immediately (may drive WARNING -> ACTIVE recovery)"
      - from: DELIVERED
        to: RETURNED
        trigger: POST /transcripts/{id}/return
        actor: Provider
        preconditions: ["Transcript DELIVERED; job provider == X-User-ID"]
        side_effects: ["Parent job DELIVERED -> EDITING (see DictationJob machine)"]
      - from: SIGNED
        to: AMENDED
        trigger: POST /transcripts/{id}/addend
        actor: Provider
        preconditions: ["Transcript SIGNED; job provider == X-User-ID (ERR_TRANSCRIPT_NOT_SIGNED / ERR_FORBIDDEN_OWNERSHIP)"]
        side_effects: ["addendum_text stored; billing line items unchanged (addenda never re-bill)"]

  - entity: Editor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system after each QAReview when qa_review_count >= 5 and rolling_quality_score < 85"
        actor: system
        preconditions: []
        side_effects: ["Standing-change cascade: re-derive skill_tier -> max_concurrent_claims -> preempt excess EDITING jobs"]
      - from: PROBATION
        to: ACTIVE
        trigger: "system after each QAReview when rolling_quality_score >= 90"
        actor: system
        preconditions: []
        side_effects: ["Standing-change cascade (capacity grows; no preemption needed)"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "system after each QAReview when rolling_quality_score < 75 OR latest review critical_error_count > 0"
        actor: system
        preconditions: []
        side_effects: ["Standing-change cascade: max_concurrent_claims -> 0, all EDITING jobs preempted"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system after each QAReview when qa_review_count >= 5 and rolling_quality_score < 70"
        actor: system
        preconditions: []
        side_effects: ["Standing-change cascade: max_concurrent_claims -> 0, all EDITING jobs preempted"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /editors/{id}/reinstate
        actor: VendorAdmin
        preconditions: ["Editor SUSPENDED (ERR_EDITOR_NOT_ACTIVE)"]
        side_effects: ["rolling_quality_score unchanged; skill_tier/max_concurrent_claims re-derived from current rolling score"]

  - entity: Provider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WARNING
        trigger: "system sweep or sign-recompute when unsigned_tier1_count + unsigned_aged_count >= 1"
        actor: system
        preconditions: []
        side_effects: ["ClinicAccount counters unchanged (WARNING is advisory)"]
      - from: WARNING
        to: ACTIVE
        trigger: "system sweep or sign-recompute when both unsigned counts == 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system sweep when unsigned_aged_count >= clinic.unsigned_report_threshold"
        actor: system
        preconditions: []
        side_effects: ["suspension_reason = UNSIGNED_REPORT_AGING; clinic.suspended_provider_count recomputed"]
      - from: WARNING
        to: SUSPENDED
        trigger: "system sweep when unsigned_aged_count >= clinic.unsigned_report_threshold"
        actor: system
        preconditions: []
        side_effects: ["suspension_reason = UNSIGNED_REPORT_AGING; clinic.suspended_provider_count recomputed"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /providers/{id}/reinstate
        actor: ClientAdmin
        preconditions: ["unsigned_aged_count == 0 (ERR_UNSIGNED_REPORTS_REMAIN)"]
        side_effects: ["suspension_reason = null; clinic.suspended_provider_count recomputed"]
        note: "Suspension exit is manual only; signing reduces counts but never auto-lifts SUSPENDED"

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /billing-periods/{id}/close
        actor: VendorAdmin
        preconditions: ["Period OPEN (ERR_BILLING_PERIOD_NOT_OPEN)"]
        side_effects:
          - "Generate PROVISIONAL LineItems: per job, latest Transcript with delivered_at in [period_start, period_end] (closed) and status IN {DELIVERED, SIGNED, AMENDED}; none -> no item"
          - "Snapshot rate_per_line_cents + priority; compute provisional_line_count and provisional_amount_cents"
      - from: CLOSED
        to: FINALIZED
        trigger: POST /billing-periods/{id}/finalize
        actor: VendorAdmin
        preconditions: ["Period CLOSED (ERR_BILLING_PERIOD_NOT_CLOSED)"]
        side_effects:
          - "Per item: final_line_count/final_amount_cents, sla_breach per measurement_basis, credit_cents (round half-up per item)"
          - "Rollups: gross/credit/net; items -> FINAL; finalized_at = now; clinic.billing_hold recomputed on future sweeps"
      - from: FINALIZED
        to: DISPUTED
        trigger: POST /billing-periods/{id}/dispute
        actor: ClientAdmin
        preconditions: ["Period FINALIZED (ERR_BILLING_PERIOD_NOT_FINALIZED)"]
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: POST /billing-periods/{id}/resolve-dispute
        actor: VendorAdmin
        preconditions: ["Period DISPUTED (ERR_BILLING_PERIOD_NOT_DISPUTED)"]
        side_effects:
          - "outcome UPHELD: amounts unchanged"
          - "outcome REVERSED: every item credit_cents -> 0, item -> CREDIT_REVERSED; credit_amount_cents = 0; net_amount_cents = gross_amount_cents"
      - from: FINALIZED
        to: SETTLED
        trigger: POST /billing-periods/{id}/settle
        actor: VendorAdmin
        preconditions: ["Period FINALIZED (ERR_BILLING_PERIOD_NOT_FINALIZED)"]
        side_effects: ["clinic.billing_hold recomputed (a SETTLED period never holds)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: template-create-stale-provider
    parent_entity: Provider
    write_endpoint: POST /provider-templates
    occ_field: expected_provider_version
    description: |
      Creating a ProviderTemplate against a Provider whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a template for the same (provider, work_type),
      legitimately superseding the prior active one, and the current writer's view
      of the provider is therefore stale.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

  - rule_id: template-update-stale-version
    parent_entity: ProviderTemplate
    write_endpoint: PUT /provider-templates/{id}
    occ_field: expected_template_version
    description: |
      Updating a ProviderTemplate whose version has advanced since the client last
      observed it is rejected; the client's edit is based on a stale template body.
    error_id: ERR_STALE_TEMPLATE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: due_at_assignment
    trigger: "DictationJob creation"
    algorithm: threshold
    formula: |
      tat = SLAPolicy(job.clinic_account_id, job.priority).tat_minutes
      due_at = job.created_at + tat minutes
      escalation_buffer_minutes = tat // 4 (integer division)
      Fixed at creation; never recomputed (rework, preemption, return leave due_at unchanged).
    input_set: "The SLAPolicy row matching (clinic, priority); must exist (ERR_SLA_POLICY_MISSING)"
    constants:
      ASR_CHARS_PER_SECOND: 2
    precision: "timestamps ISO8601 UTC, second precision"

  - name: tat_compliance_measurement
    trigger: "BillingPeriod finalize, per LineItem"
    algorithm: threshold
    formula: |
      Variant END_TO_END:        breach iff transcript.delivered_at > job.due_at   (strictly greater; exactly due_at is NOT a breach)
      Variant PRODUCTION_WINDOW: breach iff (accepted_transcript.submitted_at - job.first_claimed_at) > tat_minutes (strictly greater)
      The clinic's SLAPolicy(clinic, priority).measurement_basis selects the variant.
      Same timestamps produce different breach outcomes under the two bases.
    input_set: "LineItems generated at close, evaluated at finalize"
    precision: "boolean; comparison at second precision"
    variants:
      - name: END_TO_END
        when: "SLAPolicy.measurement_basis == END_TO_END"
        difference: "Measures wall-clock upload->delivery; queue wait time counts against the vendor"
      - name: PRODUCTION_WINDOW
        when: "SLAPolicy.measurement_basis == PRODUCTION_WINDOW"
        difference: "Measures first-claim->final-submit; queue wait time excluded — same job data yields breach=false where END_TO_END yields true"

  - name: qa_accuracy_score
    trigger: "POST /qa-reviews"
    algorithm: weighted_scoring
    formula: |
      score = max(0, 100 - 25*critical_error_count - 5*major_error_count - 1*minor_error_count)
      outcome = PASS iff (score >= 80.0 AND critical_error_count == 0) else FAIL
      Note the nested clamp (max with 0 floor), three weighted inputs, and the
      conditional branch on critical count independent of the numeric threshold.
    input_set: "The submitted QAReview's three error counts"
    constants:
      CRITICAL_WEIGHT: 25
      MAJOR_WEIGHT: 5
      MINOR_WEIGHT: 1
      PASS_THRESHOLD: 80.0
    precision: "2 decimal places, round_half_up"

  - name: editor_rolling_quality_and_standing
    trigger: "after each QAReview is recorded"
    algorithm: weighted_scoring
    formula: |
      window = editor's 20 most recent QAReviews, ordered created_at DESC,
               tie-break editor_sequence DESC
      rolling_quality_score = mean(accuracy_score over window), 2dp round_half_up
      Standing evaluation (only when qa_review_count >= 5):
        ACTIVE   -> PROBATION when rolling < 85
        ACTIVE   -> SUSPENDED when rolling < 70
        PROBATION -> ACTIVE    when rolling >= 90
        PROBATION -> SUSPENDED when rolling < 75 OR latest review critical_error_count > 0
      skill_tier (qa_review_count >= 5): TIER_3 rolling >= 95; TIER_2 85 <= rolling < 95; TIER_1 rolling < 85
      skill_tier (qa_review_count < 5): provisional TIER_2
      max_concurrent_claims: TIER_1=1, TIER_2=3, TIER_3=5, SUSPENDED=0
    input_set: "QAReviews whose transcript.editor_id == editor (any outcome)"
    constants:
      STANDING_MIN_REVIEWS: 5
      ROLLING_WINDOW: 20
    precision: "2 decimal places, round_half_up"

  - name: editor_capacity_reevaluation
    trigger: "any Editor standing change (from editor_rolling_quality_and_standing or reinstate)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency; evaluation order is pinned:
        (1) recompute rolling_quality_score (already done by caller)
        (2) evaluate standing transition (status)
        (3) re-derive skill_tier from rolling + qa_review_count
        (4) re-derive max_concurrent_claims from skill_tier (SUSPENDED -> 0)
        (5) if active_claim_count > max_concurrent_claims: preempt
            (active_claim_count - max_concurrent_claims) of the editor's EDITING jobs
      Preemption selector: candidates = editor's jobs with workflow_status == EDITING;
        rank priority ASC (ROUTINE=0 < URGENT=1 < STAT=2), tie-break claimed_at DESC,
        further tie-break created_at DESC. Each preempted job: EDITING -> QUEUED,
        claimed_by_editor_id = null, claimed_at = null, preempted_count += 1.
    input_set: "The editor whose standing changed and that editor's EDITING jobs"
    precision: "integer counts"

  - name: visible_chars_and_line_count
    trigger: "DictationJob submit (Transcript creation)"
    algorithm: aggregation
    formula: |
      visible_char_count = len(final_text with all whitespace characters removed)
      line_count = ceil(visible_char_count / CHARS_PER_LINE); 0 chars -> 0 lines
    input_set: "The submitted final_text"
    constants:
      CHARS_PER_LINE: 65
    precision: "integer"

  - name: provisional_vs_final_line_billing
    trigger: "provisional at BillingPeriod close; final at BillingPeriod finalize"
    algorithm: tiered_pricing
    formula: |
      Provisional (close):    provisional_line_count = ceil(job.asr_char_estimate / 65)
                              provisional_amount_cents = provisional_line_count * rate_snapshot
      Final (finalize):       final_line_count = transcript.line_count
                              final_amount_cents = final_line_count * rate_snapshot
      Same delivered work, two algorithms (ASR estimate vs edited text) — amounts diverge.
    input_set: "LineItems of the period; rate snapshot from SLAPolicy at close time"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at close"
        difference: "uses asr_char_estimate (speech-recognition draft size)"
      - name: final
        when: "at finalize"
        difference: "uses transcript.line_count (edited text) — differs whenever the editor's text diverges from the ASR estimate"

  - name: sla_credit_and_period_rollup
    trigger: "BillingPeriod finalize"
    algorithm: aggregation
    formula: |
      Per item (pinned rounding order — per-item first, then sum):
        credit_cents = sla_breach ? round_half_up(final_amount_cents * breach_credit_pct / 100) : 0
      Period rollups:
        gross_amount_cents  = sum(final_amount_cents)
        credit_amount_cents = sum(credit_cents)
        net_amount_cents    = gross_amount_cents - credit_amount_cents
      Rounding per-item-then-sum is pinned; sum-then-round is FORBIDDEN
      (e.g. two items of 105c at 10% -> 11 + 11 = 22, not round(210 * 0.10) = 21).
    input_set: "LineItems of the period (any status PROVISIONAL)"
    precision: "integer cents, round_half_up per item"

  - name: escalation_and_preemption
    trigger: "clock sweep (POST /_clock/set_current_utc) and STAT job creation"
    algorithm: threshold
    formula: |
      Escalation (sweep, jobs with workflow_status IN {QUEUED, EDITING, SUBMITTED}):
        level = CRITICAL  when now >= due_at
                ESCALATED when now >= due_at - (tat_minutes // 4) minutes
                NONE      otherwise
        Levels are monotonic non-decreasing; DELIVERED/CANCELLED jobs never change level.
      STAT preemption — runs (a) inline at creation of a priority==STAT job, and
      (b) from the sweep when a QUEUED STAT job enters CRITICAL:
        free_capacity = sum over Editors with status == ACTIVE of max(0, max_concurrent_claims - active_claim_count)
        if free_capacity == 0:
          candidates = DictationJobs with workflow_status == EDITING and priority IN {ROUTINE, URGENT}
          rank: priority ASC (ROUTINE first), tie claimed_at DESC, further tie created_at DESC
          if candidates non-empty: preempt first candidate (EDITING -> QUEUED, claimed_by=null,
            claimed_at=null, preempted_count += 1, editor.active_claim_count -= 1),
            then auto-assign the STAT job to the preempted job's former editor:
            workflow_status = EDITING, claimed_by_editor_id = that editor, claimed_at = now,
            first_claimed_at = now if null, editor.active_claim_count += 1.
            STAT auto-assignment bypasses the shift-window and capacity gates.
          if candidates empty: job remains QUEUED (deferred; no error).
    input_set: "All Editors (pool) and all non-terminal DictationJobs"
    precision: "integer counts; timestamps second precision"

  - name: unsigned_aging_sweep
    trigger: "clock sweep (POST /_clock/set_current_utc); sign/return recompute counts immediately for the affected provider"
    algorithm: threshold
    formula: |
      Per Transcript with status == DELIVERED (unsigned):
        age_hours = (now - delivered_at) / 3600
        aging_tier = TIER_2 when age_hours >= clinic.aging_tier2_hours   (>=, exact boundary counts)
                     TIER_1 when age_hours >= clinic.aging_tier1_hours
                     NONE   otherwise
      Per Provider (recompute immediately on any of their transcripts' tier/status change):
        unsigned_tier1_count = count(transcripts DELIVERED with aging_tier == TIER_1)
        unsigned_aged_count  = count(transcripts DELIVERED with aging_tier == TIER_2)
        status: SUSPENDED when unsigned_aged_count >= clinic.unsigned_report_threshold
                WARNING   when unsigned_aged_count + unsigned_tier1_count >= 1
                ACTIVE    when both == 0 (auto-recovery from WARNING only; SUSPENDED exits only via reinstate)
      Sweep order on clock set (pinned): (1) aging tiers -> (2) provider counts/status ->
      (3) clinic.suspended_provider_count -> (4) billing_hold -> (5) escalation levels
      (STAT CRITICAL preemptions processed in job created_at ASC order).
    input_set: "All Transcripts with status == DELIVERED; their jobs' providers; clinic config"
    precision: "age in whole hours toward threshold comparisons; boundary uses >= (exactly at threshold ages)"

  - name: billing_hold_evaluation
    trigger: "clock sweep; also evaluated inline on POST /dictation-jobs"
    algorithm: threshold
    formula: |
      clinic.billing_hold = exists BillingPeriod with clinic_account_id == clinic
        AND status == FINALIZED
        AND now >= finalized_at + payment_grace_days * 86400 seconds      (>=, exact boundary holds)
      SETTLED / DISPUTED / CLOSED / OPEN periods never hold.
    input_set: "BillingPeriods of the clinic"
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 2.5
    category: business_constraint
    check: "Request body schema: required fields present, types match, enum members valid, numeric ranges respected (audio_duration_seconds > 0, error counts >= 0, tat_minutes > 0, breach_credit_pct 0..100, outcome IN {UPHELD, REVERSED}, interval bounds parseable). Schema validation runs right after role auth, before existence."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints with a request body"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist (dictation_job_id, clinic_account_id, provider_id, editor_id, template_id). Existence precedes ownership (a resource that does not exist can raise no ownership check)."
    error_id: "ERR_CLINIC_NOT_FOUND / ERR_PROVIDER_NOT_FOUND / ERR_EDITOR_NOT_FOUND / ERR_JOB_NOT_FOUND / ERR_TRANSCRIPT_NOT_FOUND / ERR_TEMPLATE_NOT_FOUND / ERR_MACRO_NOT_FOUND / ERR_BILLING_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: auth
    check: "Entity-backed ownership: for role Provider, X-User-ID must equal the resource's provider_id (or the job's provider for transcript actions); for role Editor, X-User-ID must equal editor_id (claim, shift-window create) or the job's claimed_by_editor_id (submit, release). When the compared owner field is null (e.g., an unclaimed job's claimed_by_editor_id), the ownership check is vacuous and evaluation proceeds to the state gates — so submit on a QUEUED job fails with ERR_JOB_NOT_EDITING, not an ownership error."
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /dictation-jobs, POST /dictation-jobs/{id}/claim, POST /dictation-jobs/{id}/release, POST /dictation-jobs/{id}/submit, POST /dictation-jobs/{id}/cancel (Provider caller), POST /transcripts/{id}/sign, POST /transcripts/{id}/return, POST /transcripts/{id}/addend, POST /provider-templates, PUT /provider-templates/{id}, POST /macros, POST /macros/{id}/archive, POST /editor-shift-windows (Editor caller)"

  - priority: 5
    category: state
    check: "OCC version preconditions (expected_provider_version / expected_template_version match current version)"
    error_id: "ERR_STALE_PROVIDER_VERSION / ERR_STALE_TEMPLATE_VERSION"
    http_status: 412
    applies_to: "POST /provider-templates, PUT /provider-templates/{id}"
    note: "OCC check runs after existence, before all business rules"

  - priority: 6
    category: state
    check: "Resource state preconditions: job QUEUED for claim; job EDITING for submit/release; job SUBMITTED for qa-review; job QUEUED|EDITING for cancel; transcript DELIVERED for sign/return; transcript SIGNED for addend; provider not SUSPENDED for dictation upload; editor not SUSPENDED for claim; editor SUSPENDED for editor reinstate; period OPEN for close, CLOSED for finalize, FINALIZED for dispute/settle, DISPUTED for resolve-dispute; provider reinstate requires unsigned_aged_count == 0"
    error_id: "ERR_JOB_NOT_QUEUED / ERR_JOB_NOT_EDITING / ERR_JOB_NOT_SUBMITTED / ERR_JOB_NOT_CANCELLABLE / ERR_TRANSCRIPT_NOT_DELIVERED / ERR_TRANSCRIPT_NOT_SIGNED / ERR_PROVIDER_SUSPENDED / ERR_EDITOR_NOT_ACTIVE / ERR_BILLING_PERIOD_NOT_OPEN / ERR_BILLING_PERIOD_NOT_CLOSED / ERR_BILLING_PERIOD_NOT_FINALIZED / ERR_BILLING_PERIOD_NOT_DISPUTED / ERR_UNSIGNED_REPORTS_REMAIN"
    http_status: 409
    applies_to: "action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: QA reviewer X-User-ID must differ from the transcript's editor_id"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: "POST /qa-reviews"

  - priority: 8
    category: business_safety
    check: "PROBATION editor may not claim a STAT job (quality-risk gate)"
    error_id: ERR_PROBATION_STAT_FORBIDDEN
    http_status: 403
    applies_to: "POST /dictation-jobs/{id}/claim"

  - priority: 9
    category: business_constraint
    check: "Editor capacity: active_claim_count < max_concurrent_claims at claim time"
    error_id: ERR_EDITOR_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /dictation-jobs/{id}/claim"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: at most one ACTIVE Macro per (provider_id, shortcut); at most one SLAPolicy per (clinic_account_id, priority)"
    error_id: "ERR_DUPLICATE_MACRO_SHORTCUT / ERR_DUPLICATE_SLA_POLICY"
    http_status: 409
    applies_to: "POST /macros, POST /sla-policies"

  - priority: 11
    category: business_temporal
    check: "Interval well-formedness: end strictly after start (shift windows, billing periods)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /editor-shift-windows, POST /billing-periods"

  - priority: 12
    category: business_temporal
    check: "EditorShiftWindow overlap: half-open [start_at, end_at) — new window rejected iff new.start < existing.end AND existing.start < new.end; adjacency (end == start) is ALLOWED"
    error_id: ERR_SHIFT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /editor-shift-windows"

  - priority: 13
    category: business_temporal
    check: "Claim allowed only while now is inside some EditorShiftWindow [start_at, end_at) of the claiming editor"
    error_id: ERR_OUTSIDE_SHIFT_WINDOW
    http_status: 422
    applies_to: "POST /dictation-jobs/{id}/claim"

  - priority: 14
    category: business_temporal
    check: "BillingPeriod overlap: CLOSED interval [period_start, period_end] — rejected iff new.start <= existing.end AND existing.start <= new.end; touching endpoints (end == start) IS a conflict (unlike shift windows)"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /billing-periods"

  - priority: 15
    category: business_referential
    check: "SLAPolicy must exist for (job clinic, job priority) at upload"
    error_id: ERR_SLA_POLICY_MISSING
    http_status: 422
    applies_to: "POST /dictation-jobs"

  - priority: 16
    category: business_referential
    check: "template_id (when provided) must belong to the same provider AND its work_type must equal the job's work_type"
    error_id: "ERR_TEMPLATE_PROVIDER_MISMATCH / ERR_TEMPLATE_WORK_TYPE_MISMATCH"
    http_status: 422
    applies_to: "POST /dictation-jobs"

  - priority: 17
    category: business_fiscal
    check: "Clinic billing_hold must be false for new dictation uploads"
    error_id: ERR_CLINIC_BILLING_HOLD
    http_status: 402
    applies_to: "POST /dictation-jobs"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- System / logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. The server's logical clock starts at the fixed default 2026-08-01T00:00:00Z before any set call and NEVER falls back to wall-clock time; all server-stamped timestamps (created_at, delivered_at, due_at, finalized_at, ...) read this clock. Setting the clock runs the full sweep in pinned order: aging tiers -> provider counts/status -> clinic counters -> billing_hold -> escalation levels (with STAT CRITICAL preemption)."
    roles: [VendorAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Full system sweep per calculations.unsigned_aging_sweep + escalation_and_preemption + billing_hold_evaluation"]

  # --- ClinicAccount ---
  - method: POST
    path: "/clinic-accounts"
    description: "Create a clinic account (config defaults: threshold 3, tier1 24h, tier2 72h, grace 14d)"
    roles: [VendorAdmin]
    code: 201
    input: [name, "unsigned_report_threshold?", "aging_tier1_hours?", "aging_tier2_hours?", "payment_grace_days?"]
    output: ClinicAccount
    side_effects: ["billing_hold=false, suspended_provider_count=0"]

  - method: GET
    path: "/clinic-accounts/{id}"
    description: "Get a clinic account"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: ClinicAccount
    side_effects: []

  - method: GET
    path: "/clinic-accounts/{id}/providers"
    description: "List providers of a clinic (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/clinic-accounts/{id}/sla-policies"
    description: "List SLA policies of a clinic (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "SLAPolicy[]"
    side_effects: []

  - method: GET
    path: "/clinic-accounts/{id}/billing-periods"
    description: "List billing periods of a clinic (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "BillingPeriod[]"
    side_effects: []

  # --- SLAPolicy ---
  - method: POST
    path: "/sla-policies"
    description: "Create an SLA policy row (unique per clinic+priority)"
    roles: [VendorAdmin]
    code: 201
    input: [clinic_account_id, priority, tat_minutes, rate_per_line_cents, breach_credit_pct, measurement_basis]
    output: SLAPolicy
    side_effects: []

  # --- Provider ---
  - method: POST
    path: "/providers"
    description: "Create a provider under a clinic"
    roles: [ClientAdmin]
    code: 201
    input: [clinic_account_id, full_name, specialty]
    output: Provider
    side_effects: ["status=ACTIVE, counts=0"]

  - method: GET
    path: "/providers/{id}"
    description: "Get a provider"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/providers/{id}/reinstate"
    description: "Lift a signature-compliance suspension (requires unsigned_aged_count == 0)"
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status -> ACTIVE, suspension_reason=null, clinic.suspended_provider_count recomputed"]

  - method: GET
    path: "/providers/{id}/templates"
    description: "List templates of a provider (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "ProviderTemplate[]"
    side_effects: []

  - method: GET
    path: "/providers/{id}/macros"
    description: "List macros of a provider (FK reverse); ARCHIVED excluded unless include_archived=true"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: ["include_archived?"]
    output: "Macro[]"
    side_effects: []

  # --- Editor ---
  - method: POST
    path: "/editors"
    description: "Create an editor (pool member)"
    roles: [VendorAdmin]
    code: 201
    input: [display_name]
    output: Editor
    side_effects: ["status=ACTIVE, rolling_quality_score=100.0, skill_tier=TIER_2 (provisional), max_concurrent_claims=3"]

  - method: GET
    path: "/editors/{id}"
    description: "Get an editor"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: Editor
    side_effects: []

  - method: POST
    path: "/editors/{id}/reinstate"
    description: "Reinstate a SUSPENDED editor (rolling score preserved; tier/max re-derived)"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: Editor
    side_effects: ["status -> ACTIVE; skill_tier and max_concurrent_claims re-derived from current rolling score"]

  - method: GET
    path: "/editors/{id}/shift-windows"
    description: "List shift windows of an editor (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "EditorShiftWindow[]"
    side_effects: []

  - method: POST
    path: "/editor-shift-windows"
    description: "Declare an editor availability window (half-open [start_at, end_at); adjacency allowed; overlap rejected)"
    roles: [Editor, VendorAdmin]
    code: 201
    input: [editor_id, start_at, end_at]
    output: EditorShiftWindow
    side_effects: []

  # --- DictationJob ---
  - method: POST
    path: "/dictation-jobs"
    description: "Capture a dictation: ASR draft runs inline (asr_char_estimate = duration*2), due_at fixed from SLA, lands in QUEUED. STAT priority may trigger immediate preemption + auto-assignment."
    roles: [Provider]
    code: 201
    input: [provider_id, work_type, priority, audio_duration_seconds, "template_id?"]
    output: DictationJob
    side_effects:
      - "clinic_account_id copied from provider; workflow_status=QUEUED; escalation_level=NONE"
      - "due_at = created_at + SLAPolicy.tat_minutes"
      - "asr_char_estimate = audio_duration_seconds * 2"
      - "STAT + zero ACTIVE-editor free capacity: preemption routine (calculations.escalation_and_preemption)"

  - method: GET
    path: "/dictation-jobs/{id}"
    description: "Get a dictation job"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: DictationJob
    side_effects: []

  - method: GET
    path: "/dictation-jobs"
    description: "List/filter dictation jobs (FK reverse for provider_id, clinic_account_id, claimed_by_editor_id, template_id). All list endpoints return items ordered by created_at ASC; tests needing distinct ordering keys separate creations via the logical clock."
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: ["provider_id?", "clinic_account_id?", "claimed_by_editor_id?", "template_id?", "workflow_status?", "limit?", "offset?"]
    output: "DictationJob[]"
    side_effects: []

  - method: POST
    path: "/dictation-jobs/{id}/claim"
    description: "Editor claims a queued job (capacity, standing, shift-window gated)"
    roles: [Editor]
    code: 200
    input: [editor_id]
    output: DictationJob
    side_effects: ["workflow_status -> EDITING; claimed_by/claimed_at/first_claimed_at set; editor.active_claim_count += 1"]

  - method: POST
    path: "/dictation-jobs/{id}/release"
    description: "Voluntarily release a claimed job back to the pool (compensating action of claim)"
    roles: [Editor, VendorAdmin]
    code: 200
    input: []
    output: DictationJob
    side_effects: ["workflow_status -> QUEUED; claimed_by/claimed_at cleared; editor.active_claim_count -= 1"]

  - method: POST
    path: "/dictation-jobs/{id}/submit"
    description: "Submit the edited transcript; creates the next Transcript version (SUBMITTED)"
    roles: [Editor]
    code: 200
    input: [final_text]
    output: DictationJob
    side_effects: ["workflow_status -> SUBMITTED; submitted_at=now; Transcript created with computed visible_char_count and line_count"]

  - method: POST
    path: "/dictation-jobs/{id}/cancel"
    description: "Cancel a QUEUED or EDITING job (provider-owner or vendor ops)"
    roles: [Provider, VendorAdmin]
    code: 200
    input: []
    output: DictationJob
    side_effects: ["workflow_status -> CANCELLED; if EDITING: claim released, editor.active_claim_count -= 1"]

  # --- Transcript ---
  - method: GET
    path: "/transcripts/{id}"
    description: "Get a transcript"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: Transcript
    side_effects: []

  - method: GET
    path: "/transcripts"
    description: "List/filter transcripts (FK reverse for dictation_job_id, editor_id)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: ["dictation_job_id?", "editor_id?", "limit?", "offset?"]
    output: "Transcript[]"
    side_effects: []

  - method: POST
    path: "/transcripts/{id}/sign"
    description: "Provider signs a delivered transcript (signature queue exit; aging stops; provider counts recomputed immediately)"
    roles: [Provider]
    code: 200
    input: []
    output: Transcript
    side_effects: ["status -> SIGNED; signed_at=now; provider unsigned counts recomputed (WARNING may auto-recover to ACTIVE)"]

  - method: POST
    path: "/transcripts/{id}/return"
    description: "Provider rejects a delivered transcript; parent job reopens to EDITING with the original editor re-claimed"
    roles: [Provider]
    code: 200
    input: []
    output: Transcript
    side_effects: ["status -> RETURNED; job DELIVERED -> EDITING, rework_count += 1, re-claimed to transcript.editor_id (bypasses capacity/window; no preemption)"]

  - method: POST
    path: "/transcripts/{id}/addend"
    description: "Provider amends a signed transcript (SIGNED -> AMENDED; never re-bills)"
    roles: [Provider]
    code: 200
    input: [addendum_text]
    output: Transcript
    side_effects: ["status -> AMENDED; addendum_text stored"]

  # --- QAReview ---
  - method: POST
    path: "/qa-reviews"
    description: "Score a SUBMITTED job with error-severity counts; computes accuracy_score/outcome and drives delivery-or-rework plus the full editor standing cascade"
    roles: [QASupervisor]
    code: 201
    input: [dictation_job_id, critical_error_count, major_error_count, minor_error_count]
    output: QAReview
    side_effects:
      - "accuracy_score = max(0, 100 - 25c - 5m - 1i); outcome PASS iff score >= 80.0 AND c == 0"
      - "PASS: transcript -> DELIVERED, job -> DELIVERED, claimed_by_editor_id/claimed_at cleared, editor.active_claim_count -= 1"
      - "FAIL: transcript -> REJECTED, job -> EDITING, rework_count += 1"
      - "Editor rolling/tier/standing recompute; standing change triggers editor_capacity_reevaluation (preemptions)"

  - method: GET
    path: "/dictation-jobs/{id}/qa-reviews"
    description: "List QA reviews for a job (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "QAReview[]"
    side_effects: []

  - method: GET
    path: "/transcripts/{id}/qa-reviews"
    description: "List QA reviews for a transcript (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "QAReview[]"
    side_effects: []

  # --- ProviderTemplate ---
  - method: POST
    path: "/provider-templates"
    description: "Create a template version; supersedes (deactivates) the prior active template for the same (provider, work_type). OCC-guarded on Provider.version."
    roles: [Provider]
    code: 201
    input: [provider_id, work_type, name, body_text, expected_provider_version]
    output: ProviderTemplate
    side_effects: ["prior active template for (provider, work_type): is_active=false; increments Provider.version by 1"]

  - method: PUT
    path: "/provider-templates/{id}"
    description: "Update template name/body. OCC-guarded on ProviderTemplate.version."
    roles: [Provider]
    code: 200
    input: ["name?", "body_text?", expected_template_version]
    output: ProviderTemplate
    side_effects: ["increments ProviderTemplate.version by 1"]

  # --- Macro ---
  - method: POST
    path: "/macros"
    description: "Create a provider macro (shortcut unique per provider among ACTIVE)"
    roles: [Provider]
    code: 201
    input: [provider_id, shortcut, expansion_text]
    output: Macro
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/macros/{id}/archive"
    description: "Soft-delete a macro (ARCHIVED); excluded from default listings; shortcut freed for reuse"
    roles: [Provider]
    code: 200
    input: []
    output: Macro
    side_effects: ["status -> ARCHIVED"]

  # --- BillingPeriod ---
  - method: POST
    path: "/billing-periods"
    description: "Create a billing period (closed-interval [period_start, period_end]; touching endpoints conflict)"
    roles: [VendorAdmin]
    code: 201
    input: [clinic_account_id, period_start, period_end]
    output: BillingPeriod
    side_effects: ["status=OPEN, amounts=0"]

  - method: GET
    path: "/billing-periods/{id}"
    description: "Get a billing period"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []

  - method: POST
    path: "/billing-periods/{id}/close"
    description: "Close the period: generate PROVISIONAL line items (per job, the latest transcript version with delivered_at in closed [start, end] and status IN {DELIVERED, SIGNED, AMENDED}) with rate snapshots; items are generated in job created_at ASC order so list reads are deterministic"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> CLOSED; LineItems created (PROVISIONAL) with provisional_line_count/provisional_amount_cents"]

  - method: POST
    path: "/billing-periods/{id}/finalize"
    description: "Finalize: compute final amounts, SLA breach per measurement_basis, per-item credits (round half-up per item, then sum), period rollups"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> FINALIZED; finalized_at=now; items -> FINAL; gross/credit/net computed"]

  - method: POST
    path: "/billing-periods/{id}/dispute"
    description: "Clinic disputes a finalized period"
    roles: [ClientAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> DISPUTED"]

  - method: POST
    path: "/billing-periods/{id}/resolve-dispute"
    description: "Resolve a dispute: UPHELD keeps credits; REVERSED zeroes all item credits (items -> CREDIT_REVERSED, net = gross)"
    roles: [VendorAdmin]
    code: 200
    input: [outcome]
    output: BillingPeriod
    side_effects: ["status -> FINALIZED; REVERSED: credit_cents=0 per item, credit_amount_cents=0, net_amount_cents=gross_amount_cents"]

  - method: POST
    path: "/billing-periods/{id}/settle"
    description: "Settle a finalized period (clears any billing hold contribution)"
    roles: [VendorAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> SETTLED; clinic.billing_hold recomputed"]

  # --- LineItem ---
  - method: GET
    path: "/billing-periods/{id}/line-items"
    description: "List line items of a period (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "LineItem[]"
    side_effects: []

  - method: GET
    path: "/transcripts/{id}/line-items"
    description: "List line items billing a transcript (FK reverse)"
    roles: [VendorAdmin, ClientAdmin, Provider, Editor, QASupervisor]
    code: 200
    input: []
    output: "LineItem[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target resource (provider_id / editor_id / claimed_by mismatch)" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "ClinicAccount id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id does not exist" }
  - { id: ERR_EDITOR_NOT_FOUND, http: 404, condition: "Editor id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "DictationJob id does not exist" }
  - { id: ERR_TRANSCRIPT_NOT_FOUND, http: 404, condition: "Transcript id does not exist" }
  - { id: ERR_TEMPLATE_NOT_FOUND, http: 404, condition: "ProviderTemplate id does not exist" }
  - { id: ERR_MACRO_NOT_FOUND, http: 404, condition: "Macro id does not exist" }
  - { id: ERR_BILLING_PERIOD_NOT_FOUND, http: 404, condition: "BillingPeriod id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or out-of-range value (e.g. audio_duration_seconds <= 0, negative error counts, tat_minutes <= 0)" }
  - { id: ERR_STALE_PROVIDER_VERSION, http: 412, condition: "expected_provider_version does not match Provider.version (template create-supersede OCC)" }
  - { id: ERR_STALE_TEMPLATE_VERSION, http: 412, condition: "expected_template_version does not match ProviderTemplate.version" }
  - { id: ERR_PROVIDER_SUSPENDED, http: 409, condition: "Provider is SUSPENDED (unsigned-report aging); new dictation uploads blocked" }
  - { id: ERR_EDITOR_NOT_ACTIVE, http: 409, condition: "Editor is SUSPENDED for claim; or editor not SUSPENDED for reinstate" }
  - { id: ERR_JOB_NOT_QUEUED, http: 409, condition: "Job not QUEUED for claim" }
  - { id: ERR_JOB_NOT_EDITING, http: 409, condition: "Job not EDITING for submit or release" }
  - { id: ERR_JOB_NOT_SUBMITTED, http: 409, condition: "Job not SUBMITTED for QA review" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "Job not in QUEUED or EDITING for cancel (SUBMITTED/DELIVERED/CANCELLED)" }
  - { id: ERR_TRANSCRIPT_NOT_DELIVERED, http: 409, condition: "Transcript not DELIVERED for sign or return" }
  - { id: ERR_TRANSCRIPT_NOT_SIGNED, http: 409, condition: "Transcript not SIGNED for addend" }
  - { id: ERR_UNSIGNED_REPORTS_REMAIN, http: 409, condition: "Provider reinstate blocked: unsigned_aged_count > 0" }
  - { id: ERR_BILLING_PERIOD_NOT_OPEN, http: 409, condition: "Period not OPEN for close" }
  - { id: ERR_BILLING_PERIOD_NOT_CLOSED, http: 409, condition: "Period not CLOSED for finalize" }
  - { id: ERR_BILLING_PERIOD_NOT_FINALIZED, http: 409, condition: "Period not FINALIZED for dispute or settle" }
  - { id: ERR_BILLING_PERIOD_NOT_DISPUTED, http: 409, condition: "Period not DISPUTED for resolve-dispute" }
  - { id: ERR_SELF_REVIEW_FORBIDDEN, http: 403, condition: "QA reviewer X-User-ID equals the transcript's editor_id (segregation of duties)" }
  - { id: ERR_PROBATION_STAT_FORBIDDEN, http: 403, condition: "PROBATION editor may not claim STAT jobs" }
  - { id: ERR_EDITOR_CAPACITY_FULL, http: 409, condition: "editor.active_claim_count >= editor.max_concurrent_claims at claim" }
  - { id: ERR_DUPLICATE_MACRO_SHORTCUT, http: 409, condition: "An ACTIVE macro with the same shortcut already exists for this provider" }
  - { id: ERR_DUPLICATE_SLA_POLICY, http: 409, condition: "An SLAPolicy already exists for (clinic_account_id, priority)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "end_at <= start_at (shift window) or period_end <= period_start (billing period)" }
  - { id: ERR_SHIFT_WINDOW_OVERLAP, http: 422, condition: "Half-open overlap with an existing EditorShiftWindow of the same editor (adjacency allowed)" }
  - { id: ERR_OUTSIDE_SHIFT_WINDOW, http: 422, condition: "No EditorShiftWindow of the claiming editor contains the current logical time" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 422, condition: "Closed-interval overlap with an existing BillingPeriod of the same clinic (touching endpoints conflict)" }
  - { id: ERR_TEMPLATE_PROVIDER_MISMATCH, http: 422, condition: "template_id belongs to a different provider than the job" }
  - { id: ERR_TEMPLATE_WORK_TYPE_MISMATCH, http: 422, condition: "template work_type differs from the job's work_type" }
  - { id: ERR_SLA_POLICY_MISSING, http: 422, condition: "No SLAPolicy exists for (job clinic, job priority) at upload" }
  - { id: ERR_CLINIC_BILLING_HOLD, http: 402, condition: "Clinic has an overdue FINALIZED billing period past the payment grace window; new dictations blocked" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VendorAdmin
    description: "Transcription vendor operations: clinic onboarding, SLA policy, editor pool, billing lifecycle, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /clinic-accounts"
      - "POST /sla-policies"
      - "POST /editors"
      - "POST /editors/{id}/reinstate"
      - "POST /billing-periods + close/finalize/resolve-dispute/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /dictation-jobs/{id}/release (with Editor)"
      - "POST /dictation-jobs/{id}/cancel (with Provider)"
      - "POST /editor-shift-windows (with Editor; any editor_id)"

  - name: ClientAdmin
    description: "Clinic-side administrator: provider roster, signature-suspension reinstatement, billing disputes"
    identity: opaque
    exclusive_operations:
      - "POST /providers"
      - "POST /providers/{id}/reinstate"
      - "POST /billing-periods/{id}/dispute"
    shared_operations:
      - "All GET endpoints"

  - name: Provider
    description: "Dictating clinician; owns dictations, templates, macros; signs/returns/addends own transcripts"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /dictation-jobs (provider_id == X-User-ID)"
      - "POST /provider-templates, PUT /provider-templates/{id} (own)"
      - "POST /macros, POST /macros/{id}/archive (own)"
      - "POST /transcripts/{id}/sign, /return, /addend (own jobs' transcripts)"
    shared_operations:
      - "All GET endpoints"
      - "POST /dictation-jobs/{id}/cancel (own jobs; with VendorAdmin)"

  - name: Editor
    description: "Medical transcription editor; claims, edits, submits jobs; declares own shift windows"
    identity: "entity_backed:Editor"
    exclusive_operations:
      - "POST /dictation-jobs/{id}/claim (editor_id == X-User-ID)"
      - "POST /dictation-jobs/{id}/submit (claimed job only)"
    shared_operations:
      - "All GET endpoints"
      - "POST /dictation-jobs/{id}/release (own claimed jobs; with VendorAdmin)"
      - "POST /editor-shift-windows (own editor_id; with VendorAdmin)"

  - name: QASupervisor
    description: "Quality assurance reviewer; scores submitted work with error-severity counts; may never review a transcript authored by the same X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /qa-reviews"
    shared_operations:
      - "All GET endpoints"
