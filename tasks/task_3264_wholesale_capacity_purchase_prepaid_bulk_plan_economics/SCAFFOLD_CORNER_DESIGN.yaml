          trigger:
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_id}", prepaid_term_id: "${term_id}", activation_channel: "RETAIL_PARTNER", retail_partner_id: "${partner_ca_id}" }
              as: Subscriber
