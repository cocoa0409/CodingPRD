              as_user_id: "${uw_id}"
            - call: "GET /policies"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { pol_id: "$.data[0].id" }
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "BINDING", amount: 997.50 }
              as: Agent
          trigger:
            - call: "POST /endorsements/${e1}/remove"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
          assert:
            - "Before remove: Policy.${pol_id}.premium_balance == 1077.50 and Property.${prop_id}.total_insured_value == 294200.00"
            - "After remove: Policy.${pol_id}.premium_balance == 997.50 (DEBIT 80.00 offset by CREDIT 80.00 — zero drift on the endorsement)"
            - "After remove: Property.${prop_id}.total_insured_value == 274200.00 (endorsement coverage 20000 reversed)"

      - name: lapse_writeoff_then_reinstate_balance_reconstructed
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - state_machines.Policy.LAPSED_to_REINSTATED
          - calculations.premium_balance
          - entities.Policy.fields.lapse_count
        distinguishing_aspect: "Conserved quantity = Policy.lapse-cycle premium ledger: lapse posts a LAPSE_WRITEOFF CREDIT zeroing premium_balance, and reinstatement re-posts the annual_premium DEBIT plus a REINSTATEMENT_FEE (250) DEBIT, reconstructing premium_balance to 997.50 + 250.00 = 1247.50 — a different conserved quantity (lapse/reinstate ledger) than the endorsement apply/remove pair."
        test_recipe:
          setup:
            - "An ACTIVE policy (premium_balance 997.50, no endorsements) ready to lapse."
          setup_api_calls:
            - call: "POST /underwriters"
              payload: { full_name: "Uma UW", authority_limit: 1000000 }
              as: Admin
              captures: { uw_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "19 Lapse Ln", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1751200000, window_end: 1751203600 }
              as: Underwriter
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: { roof_ok: true, electrical_ok: true, plumbing_ok: true, hvac_ok: true }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000, wind_hail_deductible_pct: 2 }
              as: Agent
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
            - call: "POST /applications/${app_id}/take-review"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { app_v: $.data.version }
            - call: "POST /applications/${app_id}/bind"
              payload: { effective_date: 1751000000, expiration_date: 1782536000, expected_application_version: "${app_v}" }
              as: Underwriter
              as_user_id: "${uw_id}"
            - call: "GET /policies"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { pol_id: "$.data[0].id", pol_v: "$.data[0].version" }
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "BINDING", amount: 997.50 }
              as: Agent
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v_active: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/lapse"
              payload: { expected_policy_version: "${pol_v_active}" }
              as: Underwriter
              as_user_id: "${uw_id}"
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "REINSTATEMENT", amount: 1247.50 }
              as: Agent
          assert:
            - "After lapse: Policy.${pol_id}.premium_balance == 0.00 and lapse_count == 1 (LAPSE_WRITEOFF credit cleared 997.50)"
            - "After reinstatement: Policy.${pol_id}.status == REINSTATED and premium_balance == 1247.50 (annual_premium 997.50 + REINSTATEMENT_FEE 250.00 re-debited)"
