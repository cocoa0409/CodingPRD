          assert:
            - "${net} == 3000000"
            - "${err} == ERR_ADJUSTER_AUTHORITY_EXCEEDED"
            - "response HTTP status == 422"
            - "CoveredClaim.${clm_id}.status == ADJUSTING"
            - "CoveredClaim.${clm_id}.recommended_amount_cents == null"

