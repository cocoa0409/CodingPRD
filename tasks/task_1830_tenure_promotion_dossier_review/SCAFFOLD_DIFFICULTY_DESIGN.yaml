            - { call: "POST /api/dossier-items/${s_t1}/submit", as: Candidate, as_user_id: "${cand_s}" }
            - { call: "POST /api/dossier-items/${s_t2}/submit", as: Candidate, as_user_id: "${cand_s}" }
            - { call: "POST /api/dossier-items/${s_t3}/submit", as: Candidate, as_user_id: "${cand_s}" }
            - { call: "POST /api/dossier-items/${s_r1}/submit", as: Candidate, as_user_id: "${cand_s}" }
            - { call: "POST /api/dossier-items/${s_r2}/submit", as: Candidate, as_user_id: "${cand_s}" }
            - { call: "POST /api/dossier-items/${s_r3}/submit", as: Candidate, as_user_id: "${cand_s}" }
