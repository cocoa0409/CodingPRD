  # ===========================================================================
  - section: rbac
    instances:

      - name: each_of_the_six_roles_performs_its_own_permitted_operation
        claim_type: role_allowed_operations
        grounds:
          - roles.LibraryAdmin
          - roles.IllBorrowingStaff
          - roles.Patron
          - roles.PartnerAgent
          - roles.AcquisitionsLibrarian
          - roles.ConsortiumAccountant
        distinguishing_aspect: "One borrowing lifecycle is driven end to end by six different roles, each touching only what §1.7 grants it: the admin owns partner master data, the desk sources, the patron files and reads its own request, the partner agent accepts its own offer, the acquisitions librarian edits bibliographic data and the accountant drafts the invoice."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, later advanced to 2026-09-01T00:00:00Z for the accountant's step."
            - "A LOAN rota created by the borrowing desk and one BibItem created by the acquisitions librarian."
            - "No ops-run is executed at any point, so the accepted offer is never swept."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/bib-items"
              payload: { title: "Roman Roads of Gaul", item_type: "BOOK", publication_year: 2008, isbn: "978-0-000-00070-7", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { bib_id: $.data.id }
          trigger:
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9060", full_name: "Kim Reader", email: "kim@u.edu", patron_type: "FACULTY", department: "CLAS", max_open_requests: 5 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${partner_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { entry_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: Patron
              as_user_id: "${patron_id}"
              captures: { req_id: $.data.id, req_status: $.data.status, req_intake: $.data.intake_user_id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id, offer_status_0: $.data.status }
            - call: "POST /ill/supply-offers/${offer_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${partner_id}"
              captures: { offer_status_1: $.data.status }
            - call: "PATCH /ill/bib-items/${bib_id}"
              payload: { list_price_cents: 11000 }
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { bib_price: $.data.list_price_cents }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
              captures: { own_read_status: $.data.status }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Outbound lend, volume 4", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-05T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { charge_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { pv: $.data.version }
            - call: "POST /ill/partners/${partner_id}/invoices"
              payload: { expected_partner_version: "${pv}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id, inv_recv: $.data.receivable_total_cents }
          assert:
            - "Every call above returns 2xx — no ERR_UNAUTHORIZED and no ERR_NOT_RESOURCE_OWNER is raised anywhere in the chain"
            - "${req_status} == SOURCING and ${req_intake} == ${patron_id} — a patron filing for itself becomes the intake_user_id"
            - "${offer_status_0} == OFFERED and ${offer_status_1} == ACCEPTED — the partner agent may act on an offer addressed to its own partner row"
            - "${bib_price} == 11000 — the acquisitions librarian shares PATCH /ill/bib-items/{id} with the admin"
            - "${own_read_status} == SUPPLY_COMMITTED — the patron reads its own request after the commitment"
            - "${inv_recv} == 2150 — the accountant's exclusive draft picks up the 2000-cent lend line surcharged at 0.075"
            - "GET /ill/rota-entries/${entry_id} as IllBorrowingStaff succeeds, and GET /ill/lending-charges/${charge_id} as ConsortiumAccountant succeeds"
            - "The AcquisitionsLibrarian's own exclusive operations, POST /ill/pod-orders/{id}/decision and /receive, are exercised in the segregation-of-duties instance below"

      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: role_denied_operations
        grounds:
          - roles.LibraryAdmin
          - roles.ConsortiumAccountant
          - roles.AcquisitionsLibrarian
          - roles.IllBorrowingStaff
          - roles.Patron
          - roles.PartnerAgent
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=20]
        distinguishing_aspect: "The role model is peer segregation rather than a hierarchy: LibraryAdmin, the most privileged role in the domain, is itself refused on the accountant's exclusive POST /ill/invoices/{id}/issue, which proves there is no super-role override — and every refusal is a 403 raised before the path id is even looked up."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "The database is otherwise empty; none of the UUIDs below exists, which is deliberate — priority 20 must answer before priority 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /ill/partners"
              payload: { code: "SNEAK", name: "Sneak Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { e_partner_create: $.data.error_id }
            - call: "PATCH /ill/patrons/00000000-0000-4000-8000-000000000c01"
              payload: { status: "BLOCKED" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { e_patron_patch: $.data.error_id }
            - call: "POST /ill/requests/00000000-0000-4000-8000-000000000c02/source"
              payload: {}
              as: AcquisitionsLibrarian
              as_user_id: "acq-01"
              captures: { e_source: $.data.error_id }
            - call: "POST /ill/pod-orders/00000000-0000-4000-8000-000000000c03/decision"
              payload: { decision: "APPROVE" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { e_decision: $.data.error_id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "00000000-0000-4000-8000-000000000c04", item_title: "Not mine to bill", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-01T00:00:00Z" }
              as: Patron
              as_user_id: "00000000-0000-4000-8000-000000000c05"
              captures: { e_charge: $.data.error_id }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "1111-0001", calendar_year: 2026 }
              as: PartnerAgent
              as_user_id: "00000000-0000-4000-8000-000000000c06"
              captures: { e_usage: $.data.error_id }
            - call: "POST /ill/invoices/00000000-0000-4000-8000-000000000c07/issue"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { e_issue: $.data.error_id }
          assert:
            - "${e_partner_create} == ERR_UNAUTHORIZED and ${e_patron_patch} == ERR_UNAUTHORIZED — partner master data and patron standing belong to LibraryAdmin alone"
            - "${e_source} == ERR_UNAUTHORIZED — rota sourcing is exclusive to IllBorrowingStaff"
            - "${e_decision} == ERR_UNAUTHORIZED — the purchase-on-demand decision is exclusive to AcquisitionsLibrarian"
            - "${e_charge} == ERR_UNAUTHORIZED — a patron cannot raise a lending charge, and the answer is not ERR_NOT_RESOURCE_OWNER because the role never clears priority 20"
            - "${e_usage} == ERR_UNAUTHORIZED — the copyright register is a borrowing-side read"
            - "${e_issue} == ERR_UNAUTHORIZED — even LibraryAdmin cannot issue an invoice; there is no hierarchical override in this domain"
            - "All seven responses are HTTP 403 and none is HTTP 404, even though every referenced id is unused — priority 20 precedes priority 30"
            - "No row of any kind exists afterwards: GET /ill/partners and GET /ill/lending-charges/00000000-0000-4000-8000-000000000c04 confirm nothing was created"

      - name: the_same_user_may_not_escalate_and_then_decide_the_purchase_on_demand_order
        claim_type: segregation_of_duties
        grounds:
          - roles.AcquisitionsLibrarian
          - validations[priority=28]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.PurchaseOnDemandOrder.fields.escalated_by_user_id
          - state_machines.PurchaseOnDemandOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: "The duty check is on X-User-ID and not on X-User-Role: user acq-01 escalates while wearing the IllBorrowingStaff role and is then refused on the decision even though it holds a perfectly valid AcquisitionsLibrarian role, while acq-02 with the identical role and payload is allowed through."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9061 with max_open_requests 5."
            - "Partner NORTHU on a LOAN rota with max_attempts 3 and auto_escalate_pod false."
            - "One BibItem with local_holding_status NONE and list_price_cents 9000."
            - "One request in SOURCING, taken in by ill-staff-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
