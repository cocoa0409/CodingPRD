  # --- Age sweep (system) ---
  - method: POST
    path: "/api/_sweeps/age-and-retention"
    description: "Test-driving endpoint: run the daily age sweep + retention sweep + wellness deadline sweep; MINOR->MEMBER promotions, consent EXPIRE on disclosure-bump deadline, RETIRED marking on out-of-window fixes, ESCALATED transition on unanswered wellness checks"
    roles: [System]
    code: 200
    input: []
    output: "{ promoted_member_ids: string[], expired_consent_member_ids: string[], retired_fix_count: integer }"
    side_effects:
      - "MINOR members with age_years >= 16 -> role=MEMBER, tension_flag cleared"
      - "GRANTED members with monetization_opt_in under an OPEN disclosure hold past deadline -> consent EXPIRED, privacy forced HIDDEN"
      - "Fixes older than retention window -> fix_status RETIRED"
      - "WellnessCheck rows past deadline with check_status == SENT -> UNANSWERED, owning CrashEvent -> ESCALATED"
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint or member-of-circle check failed" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated id does not resolve (or resolves outside the path's parent scope)" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not declared from the entity's current state" }
  - { id: ERR_CIRCLE_FROZEN, http: 409, condition: "Circle posture FROZEN blocks this mutation" }
  - { id: ERR_CIRCLE_RESTRICTED, http: 409, condition: "Circle posture RESTRICTED blocks assistance-unit consumption" }
  - { id: ERR_WELLNESS_EXPIRED, http: 409, condition: "Wellness deadline passed; acknowledge no longer accepted" }
  - { id: ERR_DISPATCH_ALREADY_STAGED, http: 409, condition: "Dispatch in STAGED or COMPLETED cannot be cancelled" }
  - { id: ERR_TRIP_NOT_OPEN, http: 409, condition: "TripReport not OPEN; crash detection requires an active trip" }

  # --- Business safety (consent/privacy) ---
  - { id: ERR_CONSENT_NOT_GRANTED, http: 409, condition: "Member consent_state != GRANTED" }
  - { id: ERR_MINOR_CONSENT_LOCKED, http: 403, condition: "Only OWNER may revoke a MINOR's consent" }
  - { id: ERR_PRIVACY_SELF_ONLY, http: 403, condition: "HIDDEN -> PRECISE allowed only for the member themselves" }

  # --- Business constraint ---
  - { id: ERR_PLACE_CONFIG_INVALID, http: 422, condition: "Place field out of range (radius, accuracy_floor, dwell bucket, lat/lng)" }
  - { id: ERR_FIX_CLOCK_SKEW, http: 422, condition: "LocationFix field invalid: recorded_at skew > 300s, accuracy <= 0, negative speed, battery out of range, or bad motion_context" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic malformed request body, missing required field, or unknown enum value" }
  - { id: ERR_ROLE_INCOMPATIBLE, http: 409, condition: "Role transition incompatible (e.g., MINOR -> ADMIN, transfer to MINOR, transfer to non-GRANTED target)" }

  # --- Business temporal ---
  - { id: ERR_PLACE_OVERLAP, http: 409, condition: "Place geofence overlaps an existing ACTIVE place of the same circle by more than 50% of the smaller area" }

  # --- Business fiscal ---
  - { id: ERR_ASSISTANCE_UNITS_EXHAUSTED, http: 402, condition: "assistance_units_balance exhausted (FREE/PLUS at 0; PROTECT at -1)" }
  - { id: ERR_NO_IDENTITY_CREDIT, http: 402, condition: "identity_protection_credits exhausted (non-PROTECT tier always 0)" }
  - { id: ERR_CRASH_BELOW_THRESHOLD, http: 422, condition: "delta_v < 8.0; crash candidate rejected, no CrashEvent created" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current entity version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Owner
    description: "The OWNER member of a circle. Superset of Admin powers plus transfer-ownership, subscription changes, dispatch verify/complete/cancel, MINOR consent revocation, and compliance-hold resolution."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/circles (initial circle creation)"
      - "POST /api/circles/{id}/transfer-ownership"
      - "POST /api/circles/{id}/subscription/change-tier"
      - "POST /api/circles/{id}/subscription/reactivate"
      - "POST /api/circles/{id}/identity-protection/consume"
      - "POST /api/circles/{id}/compliance-holds/{hold_id}/resolve"
      - "POST /api/emergency-dispatches/{id}/verify | complete | cancel"
      - "POST /api/circles/{id}/members/{mid}/consent/revoke on a MINOR target"
    shared_operations:
      - "All Admin shared operations"
      - "PATCH member privacy (subject to anti-coercion rule)"
      - "POST fixes / crash-events as self"

  - name: Admin
    description: "An ADMIN member of the circle. Manages members, places, and read access; cannot transfer ownership, change subscription, or verify dispatches."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/circles/{id}/members (invite)"
      - "POST /api/circles/{id}/members/{mid}/promote | demote"
      - "POST /api/circles/{id}/places; PATCH .../places/{pid}; POST .../places/{pid}/archive"
      - "POST /api/circles/{id}/roadside-assistance"
    shared_operations:
      - "GET member/place/trip/fix/crash/subscription-event lists"
      - "POST consent/grant for MINOR or self (within actor matrix)"
      - "PATCH member privacy (subject to anti-coercion rule)"

  - name: Member
    description: "An adult MEMBER (or demoted ADMIN) of the circle. Self-service on privacy, consent, fixes, trips, crash ack/false-alarm."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "PATCH privacy HIDDEN -> PRECISE on self (anti-coercion)"
    shared_operations:
      - "POST fixes / crash-events as self"
      - "POST consent/grant on self"
      - "POST consent/revoke on self"
      - "POST wellness acknowledge as the crash-subject"
      - "POST mark-false-alarm as the crash-subject"
      - "GET own member/trip/fix/crash data"

  - name: Minor
    description: "A MINOR member (computed age < 16). Same self-service surface as Member, but consent revocation is locked to the OWNER and role cannot be promoted to ADMIN."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST fixes / crash-events as self"
      - "POST wellness acknowledge as the crash-subject"
      - "PATCH privacy on self (except HIDDEN -> PRECISE stays self-only anyway)"

  - name: System
    description: "Opaque operator/system identity used by the test harness for clock control, sweeps, and payment simulations. Not backed by a Member row."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/_sweeps/age-and-retention"
      - "POST /api/circles/{id}/subscription/simulate-payment-failed"
      - "POST /api/circles/{id}/subscription/simulate-suspend"
      - "POST /api/circles/{id}/compliance-holds"
      - "GET /api/circles"
    shared_operations:
      - "GET any sub-resource for diagnostics"
