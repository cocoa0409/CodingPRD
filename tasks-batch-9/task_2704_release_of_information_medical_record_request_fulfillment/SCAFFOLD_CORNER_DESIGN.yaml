            - "sweep 1: Request.${rq_p}.penalty_exposure_cents == 12500 (5 days x 2500) and safe_harbor_penalty_cents == 7500 (Aug 17-21 = 5 business days, minus the 2-day grace, x 2500)"
            - "sweep 1: Request.${rq_t}.penalty_exposure_cents == 0 and safe_harbor_penalty_cents == 0"
