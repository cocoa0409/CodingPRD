              as: PlatformAdmin
              captures: { company_s_admin_id: $.data.id }
            - call: "POST /api/companies/${company_s_id}/users/${company_s_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_s_admin_id}"
            - &k_mig_s1
              call: "POST /api/companies/${company_s_id}/migration_jobs"
              payload: { company_id: "${company_s_id}", source_product: "DESKTOP_PRO", source_file_size_bytes: 1000000, target_list_entries: 50000 }
              as: CompanyUser
              as_user_id: "${company_s_admin_id}"
              captures: { mig_s1_id: $.data.id }
          trigger:
            # Second job while first is QUEUED (non-terminal) — overlap on company lifetime
            - call: "POST /api/companies/${company_s_id}/migration_jobs"
              payload: { company_id: "${company_s_id}", source_product: "DESKTOP_PREMIER", source_file_size_bytes: 2000000, target_list_entries: 60000 }
              as: CompanyUser
              as_user_id: "${company_s_admin_id}"
              captures: { err_mig: $.data.error_id }
            # Cancel first; now a new one should succeed (window closed)
            - call: "POST /api/companies/${company_s_id}/migration_jobs/${mig_s1_id}/cancel"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_s_admin_id}"
            - call: "POST /api/companies/${company_s_id}/migration_jobs"
              payload: { company_id: "${company_s_id}", source_product: "DESKTOP_PREMIER", source_file_size_bytes: 2000000, target_list_entries: 60000 }
              as: CompanyUser
              as_user_id: "${company_s_admin_id}"
              captures: { mig_s2_id: $.data.id }
          assert:
            - "err_mig == ERR_MIGRATION_ALREADY_IN_FLIGHT (state-machine lifetime window)"
            - "MigrationJob.${mig_s2_id} was created successfully after first was CANCELLED (window released)"
            - "Different interval semantics than recon windows: state-lifetime vs numeric range"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: suspension_resume_preserves_employee_headcount
        grounds:
          - state_machines.Subscription.transitions.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.transitions.SUSPENDED_to_ACTIVE
          - state_machines.PayrollAddon
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE PayrollEmployees. Suspend
          cascades payroll to PAUSED (which does NOT change employment_status);
          resume restores payroll to ACTIVE. Forward + compensation leaves
          headcount unchanged.
        test_recipe:
          setup:
            - "Company T with ACTIVE payroll and 2 ACTIVE employees. Subscription driven SUSPENDED then resumed."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_t
              call: "POST /api/companies"
              payload: { legal_name: "Upsilon Corp", admin_email: "t@t.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_t_id: $.data.id }
            - &k_company_t_admin
              call: "POST /api/companies/${company_t_id}/users"
              payload: { company_id: "${company_t_id}", email: "admin@t.example", display_name: "T Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_t_admin_id: $.data.id }
            - call: "POST /api/companies/${company_t_id}/users/${company_t_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - call: "POST /api/companies/${company_t_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - &k_sub_t
              call: "GET /api/companies/${company_t_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { sub_t_id: $.data.id }
            - &k_payroll_t
              call: "POST /api/companies/${company_t_id}/payroll"
              payload: { subscription_id: "${sub_t_id}", service_level: "SELF_SERVICE" }
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
              captures: { payroll_t_id: $.data.id }
            - call: "POST /api/companies/${company_t_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_t_id}", legal_name: "T Emp1", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - call: "POST /api/companies/${company_t_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_t_id}", legal_name: "T Emp2", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - &k_pre_employees
              call: "GET /api/companies/${company_t_id}/payroll/employees"
              payload: { employment_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { pre_first_emp: "$.data[0].employment_status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/companies/${company_t_id}/invoices/${sub_t_id}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { inv_t_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-11-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/companies/${company_t_id}/invoices/${inv_t_id}/pay"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - call: "POST /api/companies/${company_t_id}/subscription/resume"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_t_admin_id}"
            - call: "GET /api/companies/${company_t_id}/payroll/employees"
              payload: { employment_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { post_first_emp: "$.data[0].employment_status" }
          assert:
            - "pre_first_emp == ACTIVE (before suspension)"
            - "post_first_emp == ACTIVE (after suspend+resume — conserved)"
            - "GET /api/companies/${company_t_id}/payroll/employees?employment_status=ACTIVE returns exactly 2 rows before and after"
            - "PayrollAddon.${payroll_t_id}.addon_status == ACTIVE (compensation of PAUSED)"
            - "No employee was spuriously terminated or duplicated by the cycle"

      - name: rule_pause_resume_preserves_uncategorized_count
        grounds:
          - state_machines.CategorizationRule.transitions.ACTIVE_to_PAUSED
          - state_machines.CategorizationRule.transitions.PAUSED_to_ACTIVE
          - calculations.rule_match_selector
        distinguishing_aspect: |
          Conserved quantity: count of UNCATEGORIZED BankTransactions.
          Pausing a rule does not re-uncategorize already-categorized txns
          (no reverse cascade); resuming a rule re-evaluates only
          UNCATEGORIZED. Different conserved quantity than headcount.
        test_recipe:
          setup:
            - "Company U with bank connection, a PAYEE_CONTAINS rule (auto_apply=true), one txn already CATEGORIZED by the rule, and a second UNCATEGORIZED txn that would match."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_u
              call: "POST /api/companies"
              payload: { legal_name: "Phi Corp", admin_email: "u@u.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_u_id: $.data.id }
            - &k_company_u_admin
              call: "POST /api/companies/${company_u_id}/users"
              payload: { company_id: "${company_u_id}", email: "admin@u.example", display_name: "U Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_u_admin_id: $.data.id }
            - call: "POST /api/companies/${company_u_id}/users/${company_u_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
            - call: "POST /api/companies/${company_u_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
            - &k_bc_u
              call: "POST /api/companies/${company_u_id}/bank_connections"
              payload: { company_id: "${company_u_id}", institution_name: "Chase", external_account_mask: "3333", consent_expires_at: "2027-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
              captures: { bc_u_id: $.data.id }
            - call: "POST /api/companies/${company_u_id}/bank_connections/${bc_u_id}/authorize"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
            - &k_cat_u
              call: "POST /api/companies/${company_u_id}/categories"
              payload: { company_id: "${company_u_id}", name: "Coffee", tax_line: "SCH-C-L24" }
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
              captures: { cat_u_id: $.data.id }
            - &k_rule_u
              call: "POST /api/companies/${company_u_id}/categorization_rules"
              payload: { company_id: "${company_u_id}", rule_name: "Coffee rule", match_field: "PAYEE_CONTAINS", match_value: "COFFEE", assign_category_id: "${cat_u_id}", priority: 1, auto_apply: true }
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
              captures: { rule_u_id: $.data.id }
            - &k_txn_u1
              call: "POST /api/companies/${company_u_id}/bank_connections/${bc_u_id}/transactions"
              payload: { posted_at: "2026-09-10T00:00:00Z", amount_cents: -500, payee_raw: "COFFEE BEAN" }
              as: PlatformAdmin
              captures: { txn_u1_id: $.data.id }
          trigger:
            # Pause the rule, then ingest a second matching txn — it should NOT auto-categorize
            - call: "POST /api/companies/${company_u_id}/categorization_rules/${rule_u_id}/pause"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
            - call: "POST /api/companies/${company_u_id}/bank_connections/${bc_u_id}/transactions"
              payload: { posted_at: "2026-09-11T00:00:00Z", amount_cents: -600, payee_raw: "COFFEE SHOP" }
              as: PlatformAdmin
              captures: { txn_u2_id: $.data.id, txn_u2_status: $.data.txn_status }
            # Resume rule, verify it picks up only the UNCATEGORIZED one
            - call: "POST /api/companies/${company_u_id}/categorization_rules/${rule_u_id}/resume"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_u_admin_id}"
            - call: "GET /api/companies/${company_u_id}/bank_transactions/${txn_u1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { txn_u1_final: $.data.txn_status }
            - call: "GET /api/companies/${company_u_id}/bank_transactions/${txn_u2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { txn_u2_final: $.data.txn_status }
          assert:
            - "txn_u2_status == UNCATEGORIZED (rule was PAUSED at ingestion — no auto-apply)"
            - "txn_u1_final == CATEGORIZED (originally categorized before pause; pause did NOT re-uncategorize)"
            - "txn_u2_final == CATEGORIZED (resume re-evaluated the UNCATEGORIZED pool)"
            - "Invariant: pause/resume round-trip preserves the integrity of the categorized pool — no spurious reverts"
