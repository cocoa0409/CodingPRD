        claim_type: constants_applied
        grounds:
          - calculations.next_monitoring_due
          - state_machines.MonitoringCycle.transitions
        distinguishing_aspect: "Advancing the clock past due_at promotes SCHEDULED to OVERDUE; boundary: exactly == due_at is NOT overdue (promotion fires only when now > due_at); 1 second past is overdue."
