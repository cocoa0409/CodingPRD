            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "Y", potential_cents: 1000, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { ty: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tz}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ty}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 1000000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "RZ", email: "rz@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rz: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rz}", territory_id: "${tz}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${tz}", proposed_quota_cents: 400000 }, as: SalesRep, as_user_id: "${rz}" }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
