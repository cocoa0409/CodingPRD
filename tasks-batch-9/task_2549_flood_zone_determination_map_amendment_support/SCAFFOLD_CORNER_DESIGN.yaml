              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_1_id: $.data.id }
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_1_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { p2_id: $.data.id }
            - call: "POST /flood-zone/map-panels/${p2_id}/appeal-period"
              payload: {}
              as: AgencyOfficer
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/map-panels/${p2_id}/appeal-decision"
              payload: { outcome: "LFD_ISSUED" }
              as: AgencyOfficer
              captures: { p2_lfd_at: $.data.lfd_issued_at }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2027-04-28T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/map-panels/${p2_id}/effective"
              payload: {}
              as: AgencyOfficer
              captures: { p2_status: $.data.revision_status }
            - call: "GET /flood-zone/map-panels/${p1_id}"
              as: ProviderAnalyst
              captures: { p1_status: $.data.revision_status, p1_superseded_at: $.data.superseded_at }
            - call: "GET /flood-zone/determinations/${det_1_id}"
              as: ProviderAnalyst
              captures: { det_status: $.data.status, det_reason: $.data.flagged_reason }
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: ProviderAnalyst
              captures: { folio_pending: $.data.pending_redetermination_count, folio_posture: $.data.compliance_posture, folio_open_notices: $.data.open_notice_count }
            - call: "GET /flood-zone/compliance-notices/${n1_id}"
              as: ProviderAnalyst
              captures: { n1_status: $.data.status, n1_closed_at: $.data.closed_at }
          assert:
            - "the POST response itself already reports revision_status == EFFECTIVE for ${p2_id}; nothing about the cascade is deferred to a background pass"
            - "the very first read of ${p1_id} shows revision_status == SUPERSEDED with superseded_at == 2027-04-28T00:00:00Z (HOP 2)"
            - "the very first read of ${det_1_id} shows status == FLAGGED_FOR_REVIEW and flagged_reason == MAP_REVISION (HOP 3)"
            - "the very first read of ${f_a_id} shows pending_redetermination_count == 1, compliance_posture == REVIEW_PENDING and open_notice_count == 0 (HOP 4 and HOP 5) - note the posture is REVIEW_PENDING and not FORCE_PLACE_ELIGIBLE even though the notice deadline lapsed months earlier"
            - "the very first read of ${n1_id} shows status == SUPERSEDED with closed_at == 2027-04-28T00:00:00Z (HOP 5)"
            - "re-reading every one of those five rows a second time returns byte-identical values: there is no eventual convergence step and no read-your-writes anomaly to wait out"

      - name: corner_sweep_counters_agree_with_the_rows_they_describe
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model.immediate
          - calculations.monitoring_run_sweep
        distinguishing_aspect: "A bulk endpoint returns aggregate counters rather than the rows it touched, so the immediate-consistency claim is that the counters and the rows agree at the same instant - and that an immediate second run is a no-op rather than a repeat."
        test_recipe:
          setup:
            - "FL chain with an ISSUED determination, then a geocode correction that flags it"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
