            - call: "POST /membership/members/${mo}/deployment-orders"
              payload: { orders_number: "ORD-400", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2026-12-01", scra_eligible: true, expected_member_version: "${mo_v}" }
              as: VerificationOfficer
              captures: { dep_o: $.data.id }
            - call: "POST /membership/deployment-orders/${dep_o}/complete"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/members/${mo}/protection-claims"
              payload: { claim_type: "RATE_REDUCTION", obligation_label: "OBL_X", deployment_order_id: "${dep_o}", base_rate_bps: 1200, monthly_interest_cents: 12000 }
              as: Member
              as_user_id: "${mo}"
              captures: { pc_o: $.data.id }
          trigger:
            - call: "POST /membership/protection-claims/${pc_o}/decide"
