# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3203_creator_monetization_review_content_claims_revenue_split
#
# Breadth probe over every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: channel_create_returns_every_declared_field_and_starts_not_applied
        claim_type: Creation
        grounds:
          - entities.Channel
          - endpoints.POST_/api/channels
        distinguishing_aspect: "A channel created with only channel_name, country_code, lifetime_watch_hours and subscriber_count comes back 201 with monetization_status MONETIZATION_NOT_APPLIED, posture OPEN, copyright_strike_count 0, a null last_copyright_strike_activated_at and version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels"
              payload: { channel_name: "Fresh Channel", country_code: "US", lifetime_watch_hours: 500, subscriber_count: 20 }
              as: Anonymous
              captures: { ch_new: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Channel.${ch_new}.monetization_status == MONETIZATION_NOT_APPLIED"
            - "Channel.${ch_new}.monetization_posture == OPEN"
            - "Channel.${ch_new}.copyright_strike_count == 0"
            - "Channel.${ch_new}.last_copyright_strike_activated_at == null"
            - "Channel.${ch_new}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: channel_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Channel
          - endpoints.POST_/api/channels
        distinguishing_aspect: "Omitting membership_offered, tax_tin_status, tax_treaty, payment_threshold_cents and policy_strike_count yields false / TIN_MISSING / false / 10000 / 0 rather than nulls."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels"
              payload: { channel_name: "Defaults Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_def: $.data.id }
          assert:
            - "Channel.${ch_def}.membership_offered == false"
            - "Channel.${ch_def}.tax_tin_status == TIN_MISSING"
            - "Channel.${ch_def}.tax_treaty == false"
            - "Channel.${ch_def}.payment_threshold_cents == 10000"
            - "Channel.${ch_def}.policy_strike_count == 0"

      - name: channel_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.Channel
          - endpoints.GET_/api/channels
        distinguishing_aspect: "GET /api/channels with limit 1 and offset 0 on a two-channel database returns exactly one row, total_count 2 and has_more true."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two channels exist."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Page One", country_code: "US", lifetime_watch_hours: 1000, subscriber_count: 10 }
              as: Anonymous
            - call: "POST /api/channels"
              payload: { channel_name: "Page Two", country_code: "GB", lifetime_watch_hours: 2000, subscriber_count: 20 }
              as: Anonymous
          trigger:
            - call: "GET /api/channels"
              payload: { limit: 1, offset: 0 }
              as: Any
          assert:
            - "response_type is array and the data array has length 1"
            - "total_count == 2 and has_more == true"
            - "offset 1 with limit 1 yields has_more false"

      - name: channel_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CHANNEL_NOT_FOUND]
          - endpoints.GET_/api/channels/{id}
        distinguishing_aspect: "GET /api/channels/00000000-0000-4000-8000-000000000000 returns 404 with error_id ERR_CHANNEL_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/channels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e_nf: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_CHANNEL_NOT_FOUND and response_type is error"

      - name: channel_create_missing_required_field_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.Channel
          - endpoints.POST_/api/channels
        distinguishing_aspect: "POST /api/channels without subscriber_count is rejected before any row is written; the created_no_row assertion distinguishes it from a silent default to 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels"
              payload: { channel_name: "Incomplete", country_code: "US", lifetime_watch_hours: 5000 }
              as: Anonymous
              captures: { e_req: $.data.error_id }
          assert:
            - "the response status is 400 with response_type error"
            - "GET /api/channels still reports total_count 0, proving no row was written"

      - name: content_item_create_ignores_client_supplied_computed_fields
        claim_type: System Fields
        grounds:
          - entities.ContentItem
          - endpoints.POST_/api/channels/{id}/content-items
        distinguishing_aspect: "Client attempts to seed gross_revenue_cents, ad_suitability and holds_revenue on create; the server ignores all three and stamps upload_status UPLOADED with a server id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Ignoring Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_ig: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_ig}/content-items"
              payload: { title: "Seeded Attempt", duration_seconds: 300, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_ig}"
              captures: { i_ig: $.data.id }
          assert:
            - "the response status is 201"
            - "ContentItem.${i_ig}.gross_revenue_cents == 0 and routed_revenue_cents == 0"
            - "ContentItem.${i_ig}.upload_status == UPLOADED and holds_revenue == false and takedown_flag == false"
            - "the server-minted id is a bare UUID with no type prefix"

      - name: content_item_filtered_list_by_channel_id
        claim_type: Retrieval
        grounds:
          - entities.ContentItem
          - endpoints.GET_/api/content-items
        distinguishing_aspect: "GET /api/content-items?channel_id= returns only the requested channel's items, and a channel with no items yields an empty array rather than a 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two channels, one item on the first, none on the second."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Filter A", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_fa: $.data.id }
            - call: "POST /api/channels"
              payload: { channel_name: "Filter B", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_fb: $.data.id }
            - call: "POST /api/channels/${ch_fa}/content-items"
              payload: { title: "Only On A", duration_seconds: 300, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_fa}"
              captures: { i_fa: $.data.id }
          trigger:
            - call: "GET /api/content-items"
              payload: { channel_id: "${ch_fa}" }
              as: Any
              captures: { "i_first": "$.data[0].id" }
          assert:
            - "the filtered list contains exactly one row whose id is ${i_fa}"
            - "filtering on ${ch_fb} returns an empty array with total_count 0"

      - name: reference_file_fingerprint_must_be_globally_unique
        claim_type: Type Constraints
        grounds:
          - entities.ReferenceFile
          - validations[priority=10]
        distinguishing_aspect: "Registering a second reference file with an already-used reference_fingerprint is rejected with 409 ERR_DUPLICATE_REFERENCE_FINGERPRINT while a distinct fingerprint succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One reference file with fingerprint fp-uniq-1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Uniq Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-uniq-1", policy_mode: "TRACK", claimed_segment_seconds: 30 }
              as: RightsHolder
              as_user_id: "rh-uniq-1"
              captures: { rf_uq: $.data.id }
          trigger:
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Uniq Rights Two", asset_kind: "VIDEO", reference_fingerprint: "fp-uniq-1", policy_mode: "TRACK", claimed_segment_seconds: 30 }
              as: RightsHolder
              as_user_id: "rh-uniq-2"
              captures: { e_dup_fp: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_DUPLICATE_REFERENCE_FINGERPRINT"
            - "a retry with reference_fingerprint fp-uniq-2 succeeds with 201"

      - name: channel_membership_requires_an_existing_parent_channel
        claim_type: Parent Relationships
        grounds:
          - entities.ChannelMembership
          - endpoints.POST_/api/channels/{id}/memberships
        distinguishing_aspect: "POST /api/channels/<unknown-uuid>/memberships returns 404 ERR_CHANNEL_NOT_FOUND rather than creating an orphaned membership."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/00000000-0000-4000-8000-000000000001/memberships"
              payload: { member_name: "Ghost Member", monthly_fee_cents: 499 }
              as: PlatformAdmin
              captures: { e_orphan: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_CHANNEL_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: content_item_review_request_from_uploaded_moves_to_classifying
        claim_type: Valid Transition
        grounds:
          - state_machines.ContentItem.UPLOADED_to_CLASSIFYING
          - endpoints.POST_/api/channels/{id}/content-items/{id}/requests-review
        distinguishing_aspect: "A freshly created item is UPLOADED and a review request leaves it CLASSIFYING or beyond, never UPLOADED-with-a-review."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel and one UPLOADED item."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Transition Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_tr: $.data.id }
            - call: "POST /api/channels/${ch_tr}/content-items"
              payload: { title: "Transition Item", duration_seconds: 400, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_tr}"
              captures: { i_tr: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_tr}/content-items/${i_tr}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_tr}"
          assert:
            - "ContentItem.${i_tr}.upload_status IN {CLASSIFYING, CLASSIFIED, CLAIM_SCAN_COMPLETE}"
            - "ContentItem.${i_tr}.upload_status != UPLOADED"

      - name: content_item_review_request_from_classified_is_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ContentItem.UPLOADED_to_CLASSIFYING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-driving an already CLASSIFIED item through requests-review is rejected with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with one item already past UPLOADED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "No Replay Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_nr: $.data.id }
            - call: "POST /api/channels/${ch_nr}/content-items"
              payload: { title: "Already Reviewed", duration_seconds: 400, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_nr}"
              captures: { i_nr: $.data.id }
            - call: "POST /api/channels/${ch_nr}/content-items/${i_nr}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_nr}"
          trigger:
            - call: "POST /api/channels/${ch_nr}/content-items/${i_nr}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_nr}"
              captures: { e_replay: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INVALID_STATE"

      - name: claim_initial_state_is_active_and_dispute_window_is_preserved
        claim_type: Initial State
        grounds:
          - entities.Claim
          - entities.Claim
        distinguishing_aspect: "A manual claim lands ACTIVE with lock_reason PENDING_RETRO and dispute_deadline_at null (the deadline is only stamped when a dispute is filed)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel, one reviewed item, one reference file."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Init Claim Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_ic: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Init Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-initclaim-1", policy_mode: "MONETIZE", claimed_segment_seconds: 45 }
              as: RightsHolder
              as_user_id: "rh-initclaim-1"
              captures: { rf_ic: $.data.id }
            - call: "POST /api/channels/${ch_ic}/content-items"
              payload: { title: "Init Claim Item", duration_seconds: 400, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_ic}"
              captures: { i_ic: $.data.id }
            - call: "POST /api/channels/${ch_ic}/content-items/${i_ic}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_ic}"
          trigger:
            - call: "POST /api/claims"
              payload: { content_item_id: "${i_ic}", reference_file_id: "${rf_ic}", match_confidence: 0.820, claim_level: "HIGH" }
              as: RightsHolder
              as_user_id: "${rf_ic}"
              captures: { cl_ic: $.data.id }
          assert:
            - "Claim.${cl_ic}.status == ACTIVE and source == MANUAL"
            - "Claim.${cl_ic}.lock_reason == PENDING_RETRO and revenue_locked == true"
            - "Claim.${cl_ic}.match_confidence == 0.820"
            - "Claim.${cl_ic}.claim_level == HIGH"
            - "Claim.${cl_ic}.taken_down_at == null and dispute_deadline_at == null"

      - name: taken_down_claim_cannot_be_disputed_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.APPEALED_to_TAKEN_DOWN
          - errors[ERR_CLAIM_TERMINAL]
        distinguishing_aspect: "A claim that reached TAKEN_DOWN rejects a fresh dispute with 409 ERR_CLAIM_TERMINAL even though the dispute window arithmetic would otherwise be satisfied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with one taken-down claim at the end of the appeal ladder."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Terminal Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_td: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Terminal Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-terminal-1", policy_mode: "MONETIZE", claimed_segment_seconds: 45 }
              as: RightsHolder
              as_user_id: "rh-terminal-1"
              captures: { rf_td: $.data.id }
            - call: "POST /api/channels/${ch_td}/content-items"
              payload: { title: "Terminal Item", duration_seconds: 400, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_td}"
              captures: { i_td: $.data.id }
            - call: "POST /api/channels/${ch_td}/content-items/${i_td}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_td}"
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_td}" }
              as: Any
              captures: { "cl_td": "$.data[0].id", "cl_tdv1": "$.data[0].version" }
            - call: "POST /api/claims/${cl_td}/dispute"
              payload: { expected_claim_version: "${cl_tdv1}", reason_code: "FAIR_USE" }
              as: Creator
              as_user_id: "${ch_td}"
            - call: "POST /api/claims/${cl_td}/appeals"
              payload: { grounds_code: "REVIEW_ERROR" }
              as: RightsHolder
              as_user_id: "${rf_td}"
              captures: { ap_td1: $.data.id }
            - call: "POST /api/claims/${cl_td}/appeals/${ap_td1}/decide"
              payload: { decision: "DENY" }
              as: RightsHolder
              as_user_id: "${rf_td}"
            - call: "POST /api/claims/${cl_td}/appeals"
              payload: { grounds_code: "NEW_EVIDENCE" }
              as: RightsHolder
              as_user_id: "${rf_td}"
              captures: { ap_td2: $.data.id }
            - call: "POST /api/claims/${cl_td}/takedown"
              payload: {}
              as: RightsHolder
              as_user_id: "${rf_td}"
          trigger:
            - call: "POST /api/claims/${cl_td}/dispute"
              payload: { expected_claim_version: "${cl_tdv1}", reason_code: "OWNERSHIP" }
              as: Creator
              as_user_id: "${ch_td}"
              captures: { e_terminal: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_CLAIM_TERMINAL"
            - "Claim.${cl_td}.status is still TAKEN_DOWN"

      - name: second_dispute_on_the_same_claim_is_rejected
        claim_type: Idempotency
        grounds:
          - errors[ERR_CLAIM_ALREADY_DISPUTED]
          - state_machines.Claim.ACTIVE_to_DISPUTED
        distinguishing_aspect: "Filing a dispute twice on one claim fails the second time with ERR_CLAIM_ALREADY_DISPUTED rather than creating a second ClaimDispute."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel with one ACTIVE claim, already disputed once."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Idem Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_id2: $.data.id }
            - call: "POST /api/reference-files"
              payload: { rights_holder_name: "Idem Rights", asset_kind: "AUDIO", reference_fingerprint: "fp-idem-1", policy_mode: "MONETIZE", claimed_segment_seconds: 45 }
              as: RightsHolder
              as_user_id: "rh-idem-1"
              captures: { rf_id2: $.data.id }
            - call: "POST /api/channels/${ch_id2}/content-items"
              payload: { title: "Idem Item", duration_seconds: 400, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_id2}"
              captures: { i_id2: $.data.id }
            - call: "POST /api/channels/${ch_id2}/content-items/${i_id2}/requests-review"
              payload: {}
              as: Creator
              as_user_id: "${ch_id2}"
            - call: "GET /api/claims"
              payload: { content_item_id: "${i_id2}" }
              as: Any
              captures: { "cl_id2": "$.data[0].id", "cl_id2v1": "$.data[0].version" }
            - call: "POST /api/claims/${cl_id2}/dispute"
              payload: { expected_claim_version: "${cl_id2v1}", reason_code: "FAIR_USE" }
              as: Creator
              as_user_id: "${ch_id2}"
          trigger:
            - call: "POST /api/claims/${cl_id2}/dispute"
              payload: { expected_claim_version: "${cl_id2v1}", reason_code: "MISMATCH" }
              as: Creator
              as_user_id: "${ch_id2}"
              captures: { e_dup_dispute: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_CLAIM_ALREADY_DISPUTED"
            - "GET /api/claims/${cl_id2}/disputes returns exactly one ClaimDispute"

      - name: monetization_revoke_is_maintained_by_the_strike_counter
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Channel.MONETIZATION_APPROVED_to_MONETIZATION_REVOKED
          - calculations.strike_escalation_thresholds
        distinguishing_aspect: "The third ACTIVE community strike drives status to MONETIZATION_REVOKED and posture to FROZEN in the same response, and a fourth strike leaves both unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Channel US with two ACTIVE community strikes."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Revoke Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_rv: $.data.id }
            - call: "POST /api/channels/${ch_rv}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "VIOLENT_CONTENT" }
              as: Moderator
            - call: "POST /api/channels/${ch_rv}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "HATE_SPEECH" }
              as: Moderator
