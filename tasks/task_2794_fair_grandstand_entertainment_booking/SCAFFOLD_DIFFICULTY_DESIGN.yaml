  # ===========================================================================
  # RULE 2 - Combinatorial formulas (three distinct modes: rounding order,
  #          pinned circular evaluation order, >=3 interacting inputs)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_gross_potential_per_line_then_sum
        grounds:
