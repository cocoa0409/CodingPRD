            - "${e_window} == ERR_INVALID_WINDOW (422): a zero-length service window is refused by the strict comparison"
            - "${e_before_shift} == ERR_WINDOW_OUTSIDE_SHIFT (422): window_start_utc 11:30Z precedes shift_start_utc 12:00Z, and the start side carries no buffer"
            - "${e_buffer} == ERR_WINDOW_OUTSIDE_SHIFT (422): 13:45Z is inside the shift, but 13:45Z plus the branch's 30-minute buffer is 14:15Z, past the 14:00Z shift end"
