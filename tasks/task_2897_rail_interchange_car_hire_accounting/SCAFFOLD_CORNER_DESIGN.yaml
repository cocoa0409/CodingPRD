      - name: cascading_car_dimensions_covered_by_difficulty_index
        claim_type: Independent state dimensions change independently
        grounds:
          - state_machines.Car.dimensions
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The parallel-shape claim — three dimensions advancing without collapsing into one status field — is asserted in full by the difficulty index."
        excluded_because:
          difficulty_instance: car_three_state_dimensions_advance_independently_not_as_one_status
          rationale: "That instance drives all three Car dimensions to non-initial values in one chain (ON_FOREIGN_ROAD + UNDER_REPAIR + OBLIGATION_VIOLATED) and asserts each moves without disturbing the others; repeating a weaker version here would add no coverage."

      - name: dispute_negotiation_loop_covered_by_difficulty_index
        claim_type: Entity can loop back
        grounds:
          - state_machines.Dispute
          - global_constants.MAX_DISPUTE_ROUNDS
        distinguishing_aspect: "The cyclic OPEN <-> COUNTERED loop with its alternating actor and its round cap is asserted in full by the difficulty index."
        excluded_because:
          difficulty_instance: dispute_open_countered_loop_alternates_actor_and_caps_at_three_rounds
          rationale: "That instance walks the loop round by round, checks the turn rule flips with the state, and confirms the MAX_DISPUTE_ROUNDS-th counter succeeds while the next is refused — the repair-bill self-loop instance above already covers the second cyclic machine."

      - name: erroneous_event_void_cascade_covered_by_difficulty_index
        claim_type: Cascade down
        grounds:
          - state_machines.CorrectionRequest.CONFIRMED_to_APPLIED.side_effects
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The deepest cascade in the scaffold — event to movement to money to reclaim to railroad exposure — is asserted end to end by the difficulty index."
        excluded_because:
          difficulty_instance: erroneous_event_void_cascades_five_levels_from_event_to_railroad_exposure
          rationale: "That instance verifies all five levels in one chain including the SETTLED -> REOPENED hop and the forced DISALLOWED reclaim; a shallower cascade instance here would only re-test level 1."

      - name: reclaim_withdraw_compensation_covered_by_difficulty_index
        claim_type: Compensation
        grounds:
          - state_machines.ReclaimClaim.ALLOWED_to_WITHDRAWN.side_effects
        distinguishing_aspect: "The undo-transition claim — every side effect of the allow reversed with no drift — is asserted by the difficulty index."
        excluded_because:
          difficulty_instance: reclaim_withdraw_restores_cycle_money_exactly_and_ledger_sums_to_pre_fee_net
          rationale: "That instance asserts byte-exact restoration of the movement, the cycle and the railroad exposure plus a ledger that sums to pre_fee_net_cents, which is strictly stronger than a state-only compensation check."

      - name: settle_guard_on_open_disputes_covered_by_difficulty_index
        claim_type: Cross-entity preconditions
        grounds:
          - state_machines.SettlementCycle.EXCHANGED_to_SETTLED.preconditions
          - validations.priority_49_ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
        distinguishing_aspect: "The guarded-transition claim — EXCHANGED -> SETTLED only if no Dispute row is OPEN or COUNTERED — is asserted by the difficulty index."
        excluded_because:
          difficulty_instance: cycle_settle_blocked_by_a_dispute_row_in_another_aggregate
          rationale: "That instance blocks the settle with a dispute, then unblocks it by resolving the dispute and re-settles, covering both sides of the guard in one chain."

  # ===========================================================================
  - section: calculations
    instances:

      - name: hourly_car_type_time_component_uses_the_hourly_rate
        claim_type: Correct Result
        grounds:
          - calculations.hire_time_component
          - entities.CarType.fields.time_component_mode
          - entities.CarType.fields.loaded_mileage_only
        distinguishing_aspect: "The HOURLY branch is a different formula, not a different rate on the same formula: a 54.00-hour segment of an HR car yields chargeable_hours 50.00, chargeable_days NULL (no ceiling to days at all) and time_component_cents 7500 = round_half_up(50.00 * 150); and because HR has loaded_mileage_only false, the 90 EMPTY miles still bill 212 cents where an XM car would bill 0."
        test_recipe:
          setup:
            - "Railroads BN/CX, junction JCT-CHI, car type HR (HOURLY, free_time_hours 4, hourly_rate_cents 150, mileage_rate_millicents_per_mile 2350, loaded_mileage_only false); CX-owned car CX 200001 moved EMPTY to BN at 2026-08-24T00:00:00Z (odometer 500) and back at 2026-08-26T06:00:00Z (odometer 590)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T06:00:00Z" }
              as: ClearinghouseAdmin
