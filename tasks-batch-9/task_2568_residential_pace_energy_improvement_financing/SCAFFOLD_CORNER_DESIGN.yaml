              payload: { product_code: "WATER_LOWFLOW_KIT", category: "WATER_EFFICIENCY", useful_life_years: 10, max_annual_savings_cents: 90000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_water: $.data.id }
