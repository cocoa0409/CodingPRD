            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
            - { call: "POST /api/aircraft", payload: { n_number: "N820XS", serial_number: "S-820", make_model: "Cessna 172", year: 1999 }, as: EscrowOfficer, captures: { ac: $.data.id } }
