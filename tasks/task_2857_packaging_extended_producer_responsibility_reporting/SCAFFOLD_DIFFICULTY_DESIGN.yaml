            - "A PROVISIONAL assess was never required: the same report priced FINAL only after the engagement reached OPINION_ISSUED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reporting_period_half_open_windows_allow_touching
        grounds:
          - validations.priority_31_ERR_PERIOD_WINDOW_OVERLAP
          - entities.ReportingPeriod.fields.data_start
          - entities.ReportingPeriod.fields.data_end
        distinguishing_aspect: |
          The resource is a StateProgram's data-window calendar and the semantics are half-open
          [data_start, data_end): a new period starting exactly on an existing period's end is
          accepted, while one overlapping by a single day is rejected.
        test_recipe:
          setup:
            - "One CA state program with a single existing period CA-2026-H1 whose data window is [2026-01-01, 2026-07-01)."
            - "No producers, registrations or reports are needed: the overlap rule is evaluated purely between ReportingPeriod rows of the same program."
            - "The logical clock is 2026-08-01T00:00:00Z, the default, because period creation does not consult it."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2026-H1", data_start: "2026-01-01", data_end: "2026-07-01", submission_open: "2026-08-01T00:00:00Z", submission_deadline: "2026-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { per_h1_id: $.data.id }
          trigger:
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2026-H2", data_start: "2026-07-01", data_end: "2027-01-01", submission_open: "2026-08-15T00:00:00Z", submission_deadline: "2026-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { per_h2_id: $.data.id }
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2026-MID", data_start: "2026-06-01", data_end: "2026-12-01", submission_open: "2026-08-15T00:00:00Z", submission_deadline: "2026-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2027-H1", data_start: "2027-01-01", data_end: "2027-07-01", submission_open: "2027-08-01T00:00:00Z", submission_deadline: "2027-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { per_2027_id: $.data.id }
          assert:
            - "The touching period CA-2026-H2 is created with 201: ReportingPeriod.${per_h2_id}.data_start == 2026-07-01 equals ReportingPeriod.${per_h1_id}.data_end and both rows exist"
            - "The straddling period CA-2026-MID returns 409 with error.error_id == ERR_PERIOD_WINDOW_OVERLAP because [2026-06-01, 2026-12-01) intersects both existing windows"
            - "No row named CA-2026-MID exists after the rejection: GET /epr/state-programs/${sp_ca_id}/reporting-periods returns exactly 3 rows once CA-2027-H1 is added"
            - "The period touching the far end, CA-2027-H1 with data_start 2027-01-01 == CA-2026-H2's data_end, is created with 201 as ReportingPeriod.${per_2027_id}"

      - name: fee_schedule_closed_windows_forbid_touching_and_open_ended_blocks_later
        grounds:
          - validations.priority_32_ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP
          - entities.FeeSchedule.fields.effective_from
          - entities.FeeSchedule.fields.effective_to
        distinguishing_aspect: |
          A different resource (a Pro's fee-schedule calendar for one state program) with the opposite
          interval semantics: the window is closed [effective_from, effective_to], so touching is
          forbidden, and a null effective_to is an open-ended lock that rejects every later window.
        test_recipe:
          setup:
            - "One CA state program and one PRO, with a single existing FeeSchedule whose closed effective window is [2026-07-01, 2026-12-31] and whose GLASS band is [0, null) at 9 cents/kg."
            - "All candidate schedules in the trigger use the same single contiguous GLASS band starting at 0 with tier_max_kg null, so the tier-continuity rule at priority 33 is always satisfied and only the window rule can fire."
            - "No membership exists, so publishing state is irrelevant: the overlap rule is evaluated at creation against every schedule of the same (pro_id, state_program_id) pair regardless of status."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "PRO West", contact_email: "pro@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pro_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-07-01", effective_to: "2026-12-31", membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 9 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_base_id: $.data.id }
          trigger:
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-01-01", effective_to: "2026-07-01", membership_fee_cents: 240000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 8 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-01-01", effective_to: "2026-06-30", membership_fee_cents: 240000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 8 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_early_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2027-01-01", effective_to: null, membership_fee_cents: 260000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 10 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_open_id: $.data.id }
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2027-06-01", effective_to: "2027-12-31", membership_fee_cents: 270000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "GLASS", tier_min_kg: 0, tier_max_kg: null, rate_cents_per_kg: 11 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
          assert:
            - "The touching window [2026-01-01, 2026-07-01] returns 409 with error.error_id == ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP: sharing the single day 2026-07-01 with FeeSchedule.${fs_base_id} is enough"
            - "Backing off by one day to [2026-01-01, 2026-06-30] returns 201 as FeeSchedule.${fs_early_id} with status == DRAFT"
            - "The open-ended window [2027-01-01, null] returns 201 as FeeSchedule.${fs_open_id} because it starts after 2026-12-31"
            - "The later window [2027-06-01, 2027-12-31] returns 409 ERR_FEE_SCHEDULE_EFFECTIVE_OVERLAP: the open-ended FeeSchedule.${fs_open_id} blocks every window that starts on or after 2027-01-01"
            - "Exactly 3 FeeSchedule rows exist for (${pro_id}, ${sp_ca_id}) at the end: ${fs_base_id}, ${fs_early_id}, ${fs_open_id}"

      - name: verifier_buffered_aggregate_capacity_across_reports
        grounds:
          - validations.priority_39_ERR_VERIFIER_CAPACITY_EXCEEDED
          - entities.VerificationEngagement.fields.fieldwork_start
