            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "one", asset_class: "SEVEN_YEAR", allocated_cost_cents: 5000000 }, as: Engineer, as_user_id: "${eng}", captures: { c: "$.data.id" } }
