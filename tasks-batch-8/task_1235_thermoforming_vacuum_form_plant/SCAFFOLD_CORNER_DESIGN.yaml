  - section: validations
    instances:
      - name: run_window_inverted_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "planned_end <= planned_start is a format-level violation detected before existence checks (nonexistent order/station ids present) — ERR_INVALID_REQUEST wins over any 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /forming-runs", payload: { production_order_id: "00000000-0000-4000-8000-0000000000aa", station_id: "00000000-0000-4000-8000-0000000000bb", planned_start: "2026-05-02T11:00:00Z", planned_end: "2026-05-02T10:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 10 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (captured ${err})"
      - name: allocation_zero_quantity_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "qty_kg == 0 violates the > 0 numeric constraint — zero-quantity edge rejected as ERR_INVALID_REQUEST before any existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /material-allocations", payload: { production_order_id: "00000000-0000-4000-8000-0000000000aa", source_type: VIRGIN_LOT, lot_id: "00000000-0000-4000-8000-0000000000bb", qty_kg: 0 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
