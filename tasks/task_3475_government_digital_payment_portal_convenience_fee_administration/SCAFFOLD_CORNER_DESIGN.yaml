            - "the ABSORBED activation returns 200 — statutory coverage is only a CONVENIENCE_FEE gate"

      - name: err_no_verified_account_on_agency_activate
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_VERIFIED_ACCOUNT
          - state_machines.Agency.ONBOARDING_to_ACTIVE
        distinguishing_aspect: "Activation needs a VERIFIED account: with the account still PENDING_VERIFICATION (attestation CURRENT), activate fails 409 ERR_NO_VERIFIED_ACCOUNT."
        test_recipe:
