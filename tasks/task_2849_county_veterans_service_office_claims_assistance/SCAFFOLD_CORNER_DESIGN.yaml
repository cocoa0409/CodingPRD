      - name: corner_caseload_read_decomposes_the_outreach_terms
        claim_type: computed_read
        grounds:
          - endpoints[GET /cvso/representatives/{id}/caseload]
          - calculations.representative_caseload_weight
        distinguishing_aspect: "For a representative holding no designations but two PLANNED outreach events on separate days, the computed read returns planned_outreach_count 2, active_poa_count 0, open_claim_count 0 and caseload_weight 4.0, which is 2 * PLANNED_OUTREACH_WEIGHT and nothing else."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO with no designations and no claims."
            - "Two PLANNED outreach events on rep_a: 2026-08-05 09:00-11:00 and 2026-08-06 09:00-10:00, far enough apart that the 30-minute travel buffers cannot touch."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-561", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "RURAL_CLINIC", location_name: "Grange Hall", starts_at: "2026-08-05T09:00:00.000Z", ends_at: "2026-08-05T11:00:00.000Z", underserved_flag: true }
              as: SystemAdmin
              captures: { ev1: $.data.id }
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "TRIBAL_OUTREACH", location_name: "Tribal Center", starts_at: "2026-08-06T09:00:00.000Z", ends_at: "2026-08-06T10:00:00.000Z", underserved_flag: true }
              as: SystemAdmin
              captures: { ev2: $.data.id }
            - call: "GET /cvso/representatives/${rep_a}/caseload"
              payload: {}
              as: StateAuditor
              captures: { rid: $.data.representative_id, poa_n: $.data.active_poa_count, claim_n: $.data.open_claim_count, out_n: $.data.planned_outreach_count, w: $.data.caseload_weight, elig: $.data.assignment_eligible }
          assert:
            - "HTTP status of both event creates == 201"
            - "OutreachEvent.${ev1}.status == PLANNED"
            - "OutreachEvent.${ev2}.status == PLANNED"
            - "${rid} == ${rep_a}"
            - "${poa_n} == 0"
            - "${claim_n} == 0"
            - "${out_n} == 2"
            - "${w} == 4.0"
            - "${elig} == true"

