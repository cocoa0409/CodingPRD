scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_vendor_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Vendor, endpoints]
        distinguishing_aspect: "POST /ap/vendors with required fields -> 201; status defaults ACTIVE, ytd_1099_paid_cents 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Acme", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id, st: $.data.status, ytd: $.data.ytd_1099_paid_cents, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Vendor.${ven}.status == ACTIVE"
            - "Vendor.${ven}.ytd_1099_paid_cents == 0"
            - "Vendor.${ven}.version == 1"

      - name: get_vendor_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Vendor, endpoints]
        distinguishing_aspect: "GET /ap/vendors/{id} returns the stored vendor with matching legal_name."
        test_recipe:
          setup: ["One vendor exists."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Echo", payment_method: "CHECK" }
              as: APManager
              captures: { ven: $.data.id }
          trigger:
            - call: "GET /ap/vendors/${ven}"
              payload: {}
              as: Auditor
              captures: { name: $.data.legal_name }
          assert:
            - "response.status == 200"
            - "Vendor.${ven}.legal_name == Echo"

      - name: get_vendor_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /ap/vendors with an unknown UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /ap/vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_vendor_missing_payment_method_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /ap/vendors without payment_method -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "NoMethod" }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: vendor_default_net_terms_applied_to_due_date
        claim_type: Defaults
        grounds: [entities.Vendor.fields.net_terms_days, entities.Invoice.fields.due_date]
        distinguishing_aspect: "Vendor omitting net_terms_days defaults 30, so an invoice dated 2026-05-01 gets due_date 2026-05-31."
        test_recipe:
          setup: ["Vendor created without net_terms_days (default 30)."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Def", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "DUE-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id, due: $.data.due_date }
          assert:
            - "Invoice.${inv}.due_date == 2026-05-31"

      - name: invoice_total_amount_computed_from_lines
        claim_type: Computed Fields
        grounds: [entities.Invoice.fields.total_amount_cents, endpoints]
        distinguishing_aspect: "Adding two lines 30000 and 20000 sets Invoice.total_amount_cents to 50000 (sum of lines)."
        test_recipe:
          setup: ["Vendor; one non-PO invoice with two lines."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Sum", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "SUM-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 30000, description: "a" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 20000, description: "b" }
              as: APClerk
          assert:
            - "Invoice.${inv}.total_amount_cents == 50000"

      - name: create_vendor_invalid_payment_method_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Vendor.fields.payment_method"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /ap/vendors with payment_method WIRE (not in ACH|CHECK|CARD) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "BadEnum", payment_method: "WIRE" }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: invoice_wrong_vendor_parent_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Invoice.fields.vendor_id"
          - "validations[priority=3]"
        distinguishing_aspect: "POST /ap/invoices with a non-existent vendor_id -> 404 ERR_NOT_FOUND (FK parent must exist)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/invoices"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", invoice_number: "ORPH", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: vendor_1099_without_tax_id_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_TAX_ID_REQUIRED]"
        distinguishing_aspect: "POST /ap/vendors with is_1099 true and no tax_id -> 422 ERR_TAX_ID_REQUIRED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ap/vendors"
              payload: { legal_name: "NoTIN", payment_method: "ACH", is_1099: true }
              as: APManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "error_id == ERR_TAX_ID_REQUIRED"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: invoice_initial_state_is_captured
        claim_type: Initial State
        grounds: [state_machines.Invoice, entities.Invoice.fields.status]
        distinguishing_aspect: "A freshly captured invoice with ocr_confidence default 1.0 starts in CAPTURED."
        test_recipe:
          setup: ["Vendor exists."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Init", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "INIT-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id, st: $.data.status }
          assert:
            - "Invoice.${inv}.status == CAPTURED"

      - name: invoice_low_ocr_confidence_starts_coding_review
        claim_type: Valid Transition
        grounds: [state_machines.Invoice.CAPTURED_to_CODING_REVIEW, entities.Invoice.fields.ocr_confidence]
        distinguishing_aspect: "Capturing an invoice with ocr_confidence 0.5 (< 0.80) forces status CODING_REVIEW at creation."
        test_recipe:
          setup: ["Vendor exists."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Blur", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "OCR-LOW", invoice_date: "2026-05-01", ocr_confidence: 0.5 }
              as: APClerk
              captures: { inv: $.data.id, st: $.data.status }
          assert:
            - "Invoice.${inv}.status == CODING_REVIEW"

      - name: submit_approval_from_captured_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Invoice"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting a CAPTURED (un-matched) invoice for approval -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CAPTURED invoice with one line but not yet coded/matched."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Cap", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "CAP-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 1000, description: "x" }
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: code_invoice_with_no_lines_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Invoice.CAPTURED_to_MATCHED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Coding a CAPTURED invoice with zero lines (total 0) -> 409 ERR_INVALID_STATE (precondition total > 0 violated)."
        test_recipe:
          setup: ["A CAPTURED invoice with no lines."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Empty", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "EMPTY-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: reject_invoice_in_coding_review_reaches_terminal
        claim_type: Valid Transition
        grounds: [state_machines.Invoice.CODING_REVIEW_to_REJECTED]
        distinguishing_aspect: "An invoice in CODING_REVIEW (forced by low OCR) rejected -> REJECTED terminal."
        test_recipe:
          setup: ["A low-OCR invoice in CODING_REVIEW."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Rej", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "REJ-1", invoice_date: "2026-05-01", ocr_confidence: 0.4 }
              as: APClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /ap/invoices/${inv}/reject"
              payload: {}
              as: APClerk
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv}.status == REJECTED"

      - name: terminal_rejected_cannot_be_coded_again
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Invoice"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Coding a REJECTED (terminal) invoice -> 409 ERR_INVALID_STATE; no transition leaves REJECTED."
        test_recipe:
          setup: ["A REJECTED invoice."]
          setup_api_calls:
            - call: "POST /ap/vendors"
              payload: { legal_name: "Term", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "TERM-1", invoice_date: "2026-05-01", ocr_confidence: 0.4 }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/reject"
              payload: {}
              as: APClerk
          trigger:
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: final_approval_bubbles_invoice_to_approved
        claim_type: Bubble up
        grounds: [state_machines.Invoice.PENDING_APPROVAL_to_APPROVED, state_machines.ApprovalStep, entities.Invoice.fields.approved_by]
        distinguishing_aspect: "Approving the single ApprovalStep bubbles the invoice PENDING_APPROVAL->APPROVED and stamps approved_by."
        test_recipe:
          setup: ["A non-PO invoice 50000 matched and submitted for 1-level approval."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Bub", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "BUB-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "x" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
          trigger:
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
              as_user_id: "APV1"
          assert:
            - "Invoice.${inv}.status == APPROVED"
            - "Invoice.${inv}.approved_by == APV1"

      - name: approval_level2_before_level1_out_of_order
        claim_type: guarded transitions
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_APPROVAL_OUT_OF_ORDER]"
        distinguishing_aspect: "With a 2-level route, acting on the level-2 step while level-1 is still PENDING -> 409 ERR_APPROVAL_OUT_OF_ORDER."
        test_recipe:
          setup: ["A non-PO invoice 60000 in a 2-level approval tier; both steps PENDING."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Ord", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 50000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 50000, max_amount_cents: 1000000000, required_levels: 2 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "ORD-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 60000, description: "x" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step2: "$.data[1].id" }
          trigger:
            - call: "POST /ap/approval-steps/${step2}/approve"
              payload: {}
              as: Approver
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_APPROVAL_OUT_OF_ORDER"

      - name: void_released_batch_reverts_invoices_to_approved
        claim_type: Compensation
        grounds: [state_machines.PaymentBatch.RELEASED_to_VOID, state_machines.Invoice.PAID_to_APPROVED]
        distinguishing_aspect: "Voiding a RELEASED batch cascades each member Invoice PAID->APPROVED and deletes payments; total_disbursed_cents -> 0."
        test_recipe:
          setup: ["A non-PO invoice 50000 paid in a RELEASED (unsettled) ACH batch."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Vd", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "VD-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "x" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-20" }
              as: APManager
              captures: { batch: $.data.id }
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
            - call: "GET /ap/payment-batches/${batch}"
              payload: {}
              as: APManager
              captures: { bv: $.data.version }
            - call: "POST /ap/payment-batches/${batch}/release"
              payload: { expected_paymentbatch_version: "${bv}" }
              as: APManager
          trigger:
            - call: "POST /ap/payment-batches/${batch}/void"
              payload: {}
              as: APManager
              captures: { st: $.data.status, tot: $.data.total_disbursed_cents }
          assert:
            - "PaymentBatch.${batch}.status == VOID"
            - "PaymentBatch.${batch}.total_disbursed_cents == 0"
            - "Invoice.${inv}.status == APPROVED"

      - name: invoice_revision_cycle_excluded
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.CODING_REVIEW_to_MATCHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / invoice_coding_review_revision_cycle
          rationale: "The CODING_REVIEW->MATCHED revision loop is exercised end-to-end by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: early_pay_discount_past_window_yields_no_discount
        claim_type: Correct Result
        grounds: [calculations.early_pay_discount, entities.Payment.fields.discount_taken_cents]
        distinguishing_aspect: "run_date 2026-05-12 strictly after discount_deadline 2026-05-11 -> discount_taken 0, net == gross 50000."
        test_recipe:
          setup: ["Vendor ACH early_pay 0.02 window 10; non-PO invoice 50000 approved; batch run_date past deadline."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "Late", payment_method: "ACH", early_pay_terms_pct: 0.02, early_pay_window_days: 10 }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/approval-routes"
              payload: { min_amount_cents: 0, max_amount_cents: 1000000000, required_levels: 1 }
              as: APManager
            - call: "POST /ap/invoices"
              payload: { vendor_id: "${ven}", invoice_number: "LATE-1", invoice_date: "2026-05-01" }
              as: APClerk
              captures: { inv: $.data.id }
            - call: "POST /ap/invoices/${inv}/lines"
              payload: { gl_account_code: "5000", amount_cents: 50000, description: "x" }
              as: APClerk
            - call: "POST /ap/invoices/${inv}/code"
              payload: {}
              as: APClerk
            - call: "POST /ap/invoices/${inv}/submit-approval"
              payload: {}
              as: APClerk
            - call: "GET /ap/invoices/${inv}/approval-steps"
              payload: {}
              as: APManager
              captures: { step: "$.data[0].id" }
            - call: "POST /ap/approval-steps/${step}/approve"
              payload: {}
              as: Approver
            - call: "POST /ap/payment-batches"
              payload: { payment_method: "ACH", run_date: "2026-05-12" }
              as: APManager
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /ap/payment-batches/${batch}/payments"
              payload: { invoice_id: "${inv}" }
              as: APManager
              captures: { disc: $.data.discount_taken_cents, net: $.data.net_amount_cents }
          assert:
            - "Payment.discount_taken_cents == 0"
            - "Payment.net_amount_cents == 50000"

      - name: non_po_invoice_zero_variance_matches
        claim_type: Input Set Filtering
        grounds: [calculations.match_variance, entities.Invoice.fields.match_type]
        distinguishing_aspect: "A NON_PO invoice (po_id null) codes to variance 0 and match_type NON_PO regardless of amount."
        test_recipe:
          setup: ["Vendor; non-PO invoice 77777 with one line."]
          setup_api_calls:
            - call: "POST /ap/gl-accounts"
              payload: { code: "5000", name: "COGS", is_postable: true }
              as: APManager
            - call: "POST /ap/vendors"
              payload: { legal_name: "NP", payment_method: "ACH" }
              as: APManager
              captures: { ven: $.data.id }
            - call: "POST /ap/invoices"
