            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_k2}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${kc1}", attempted_at: "2026-03-18T02:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${kc2}", attempted_at: "2026-03-18T02:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-03-18T02:00:00Z", idempotency_key: "cap-2507-2"}, as: AlarmCompanyOperator, as_user_id: "${company_cap}", captures: {dr_k2: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_k2}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_k2}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
