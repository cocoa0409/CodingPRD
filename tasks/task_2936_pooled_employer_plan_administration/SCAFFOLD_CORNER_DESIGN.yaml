              payload: { plan_document_id: "${plan_id}", legal_name: "Northgate Trust Services Inc", provider_type: "TRUSTEE", revenue_sharing_bps: 0, direct_fee_cents_per_participant: 20000, affiliated_service_provider_id: "${sp_other_id}" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_INVALID_AFFILIATION
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Northgate Trust Services Inc", provider_type: "TRUSTEE", revenue_sharing_bps: 0, direct_fee_cents_per_participant: 20000, affiliated_service_provider_id: "00000000-0000-4000-8000-000000000000" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_SERVICE_PROVIDER_NOT_FOUND
            - call: "POST /pep/service-providers"
              payload: { plan_document_id: "${plan_id}", legal_name: "Northgate Trust Services Inc", provider_type: "TRUSTEE", revenue_sharing_bps: 0, direct_fee_cents_per_participant: 20000, affiliated_service_provider_id: "${rk_id}" }
              as: PooledPlanProvider
