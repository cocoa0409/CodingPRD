              captures: { a1_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a1_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /clients/${c_id}/assessments/${a1_id}/verify"
              payload: { expected_client_version: "${c_v0}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /pantry-items"
              payload: { item_name: "Milk", category: "PERISHABLE", point_cost: 10, quantity_on_hand: 10, reorder_threshold: 0, per_visit_limit: 5 }
              as: HubAdmin
              captures: { i_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: HubAdmin
            - call: "POST /clients/${c_id}/pantry-visits"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
              captures: { va_id: $.data.id }
            - call: "POST /pantry-visits/${va_id}/line-items"
              payload: { item_id: "${i_id}", quantity: 5 }
              as: PantryStaff
              as_user_id: "${ps_id}"
            - call: "POST /pantry-visits/${va_id}/checkout"
              payload: {}
              as: PantryStaff
              as_user_id: "${ps_id}"
            - call: "POST /clients/${c_id}/assessments"
              payload: { household_size: 1, monthly_income_cents: 100000, housing_status: "STABLE", dependents_under_18: 0, receives_snap: false, receives_childcare_subsidy: false, food_insecurity_score: 1, consent_confidential: true }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /clients/${c_id}/assessments/${a2_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "GET /clients/${c_id}"
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { c_v1: $.data.version }
            - call: "POST /clients/${c_id}/assessments/${a2_id}/verify"
              payload: { expected_client_version: "${c_v1}" }
              as: IntakeCoordinator
