      - name: interim_extension_closed_window_overlap_and_ninety_day_budget
        grounds:
          - validations[priority=32]
          - validations[priority=34]
          - entities.InterimExtension.fields.extension_end_utc
          - entities.CarriageAgreement.fields.consumed_extension_days
          - calculations.interim_extension_rate
        distinguishing_aspect: |
          A different resource entity (InterimExtension windows on one agreement, not carriage terms
          on a slot) with the OPPOSITE interval semantics: windows are CLOSED at both endpoints, so a
          successor extension starting exactly on the incumbent's extension_end_utc IS an overlap and
          is refused, which is precisely the case the half-open carriage-term instance accepts. The
          same recipe then walks the aggregate 90-day budget to its exact limit and one day past it.
