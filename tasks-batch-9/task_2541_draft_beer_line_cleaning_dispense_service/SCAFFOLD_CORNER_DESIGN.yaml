      - name: corner_one_line_out_of_three_holds_but_two_trips_the_doubling_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.line_compliance_projection
          - state_machines.ServiceAccount.ACTIVE_to_SUSPENDED
          - endpoints.POST_component_inspections
        distinguishing_aspect: |
          The threshold is integer doubling against contracted_line_count 3:
          1*2 = 2 is below 3 so the first FAILED faucet leaves the account ACTIVE,
          and 2*2 = 4 reaches it so the second FAILED coupler suspends the account
          with suspended_reason LINE_COMPLIANCE_THRESHOLD and suspends its
          contract — while the IN_PROGRESS visit is not abandoned, because only
          SCHEDULED visits are.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract whose contracted_line_count is 3."
            - "BeerLine #1 and #2 both IN_SERVICE; Technician 'Dana Ruiz' ACTIVE."
            - "One visit IN_PROGRESS at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 3, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 2, run_length_feet: 24, vertical_rise_feet: 3, inner_diameter_inches: 0.25, beer_style_group: "LAGER", average_daily_throughput_liters: 9.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line2: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /draft-service/component-inspections"
              payload: { visit_id: "${visit}", line_id: "${line1}", component_type: "FAUCET", condition_grade: "FAILED", action_taken: "NONE" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { insp1: $.data.id, charge1: $.data.part_charge_cents }
            - call: "GET /draft-service/accounts/${acct}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { st1: $.data.status, out1: $.data.lines_out_of_service_count }
            - call: "POST /draft-service/component-inspections"
              payload: { visit_id: "${visit}", line_id: "${line2}", component_type: "COUPLER", condition_grade: "FAILED", action_taken: "NONE" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { insp2: $.data.id }
            - call: "GET /draft-service/accounts/${acct}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { st2: $.data.status, out2: $.data.lines_out_of_service_count, reason: $.data.suspended_reason }
            - call: "GET /draft-service/contracts/${ctr}"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { cstatus: $.data.status }
          assert:
            - "${charge1} == 0 — a FAILED component left unreplaced carries no part charge"
            - "BeerLine.${line1}.status == OUT_OF_SERVICE after the first inspection"
            - "${st1} == ACTIVE and ${out1} == 1 — 1*2 = 2 is still below contracted_line_count 3"
            - "BeerLine.${line2}.status == OUT_OF_SERVICE after the second inspection"
            - "${st2} == SUSPENDED, ${out2} == 2 and ${reason} == LINE_COMPLIANCE_THRESHOLD"
            - "${cstatus} == SUSPENDED"
            - "ServiceVisit.${visit}.work_status == IN_PROGRESS and .abandon_reason == null"

      - name: corner_cascading_side_effect_chain_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.POST_cleaning_cycles
        excluded_because:
          difficulty_instance: "transitive_cascade / failed_cycle_takes_line_out_then_suspends_account_contract_and_abandons_scheduled_visit"
          rationale: |
            §1.8 rule 4 walks the full four-hop chain from one non-PASS cycle to
            the line, the account, its contract and its SCHEDULED visit, asserting
            every hop, so a second end-to-end chain here would be redundant.

      - name: corner_dual_variant_results_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.visit_charge_settlement
          - calculations.yield_loss_estimate
        excluded_because:
          difficulty_instance: "dual_variant_calc / visit_charge_provisional_bills_every_serviced_line_settled_bills_only_pass_lines"
          rationale: |
            §1.8 rule 1 asserts both variants of both dual-variant calculations on
            the same rows together with the delta between them.

  # ===========================================================================
  # SECTION 9 — consistency_model
  # consistency_model: immediate. One instance is enough: it proves that a
  # single write's derived fields are readable in the same response and that an
  # immediately following read of every touched aggregate already agrees.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_every_derived_field_touched_by_one_cycle_is_readable_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_cleaning_cycles
          - calculations.chemical_cycle_dosing
          - calculations.line_compliance_projection
        distinguishing_aspect: |
          One POST /cleaning-cycles returns its own computed dosing figures in the
          create response, and the very next reads — with no clock move and no
          further write — already show the line's replayed projection, the lot's
          decremented volume and the filtered list membership. Nothing lags a
          request.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract, cleaning_frequency_days 21."
            - "BeerLine #1 32ft/4ft/0.375in ALE (line_volume 2.214 L, solution 7 L, prescribed 0.31 L)."
            - "Technician 'Dana Ruiz'; CAUSTIC lot C-2001 45.0 pct, 20.0 L; visit IN_PROGRESS at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-2001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit}", line_id: "${line1}", chemical_lot_id: "${lot}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc: $.data.id, vol: $.data.line_volume_liters, sol: $.data.total_solution_liters, presc: $.data.prescribed_concentrate_liters, eff: $.data.effective_active_pct, req: $.data.required_contact_minutes, grade: $.data.compliance_result }
            - call: "GET /draft-service/beer-lines/${line1}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { lastc: $.data.last_cleaned_at, due: $.data.next_due_at, od: $.data.days_overdue, flag: $.data.compliance_flag, lastchem: $.data.last_chemical_type }
            - call: "GET /draft-service/chemical-lots/${lot}"
              payload: {}
              as: ServiceTechnician
