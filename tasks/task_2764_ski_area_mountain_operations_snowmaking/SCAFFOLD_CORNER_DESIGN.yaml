            - "Trigger 3: HTTP 200 with state == 'EXECUTED', charges_used == 2, road_closure_minutes == 40 (20 per charge) and clearance_valid_hours 24 once cleared."
            - "Trigger 7: HTTP 422 with data.error_id == 'ERR_SKI_CUT_PARTNER_REQUIRED' - P1 is on duty and AVAILABLE but cannot be his own partner."
            - "Trigger 9: HTTP 200 with state == 'EXECUTED' - restoring exactly one peer to duty satisfies the partner rule."
            - "Mission AV-2 was still PLANNED after trigger 7, so the rejected execute stamped no executed_at and no executed_by_patroller_id."
            - "Neither rejection reports ERR_PATROLLER_NOT_ON_DUTY, because the acting patroller P1 was on duty in every trigger."

      - name: the_certification_floor_guards_both_mission_clearance_and_serious_incident_dispatch
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_PATROLLER_CERT_INSUFFICIENT]
          - entities.Patroller.fields.cert_level
          - state_machines.PatrolIncident.REPORTED_to_DISPATCHED
        distinguishing_aspect: |
          One rule, two endpoints, two different conditions: clearing a mitigation mission ALWAYS
          requires EMT or PARAMEDIC, while incident dispatch requires it only for SERIOUS and CRITICAL
          severities. A BASIC patroller is therefore rejected on both endpoints for different reasons, and
          the same BASIC patroller must be accepted on a MINOR incident - so an implementation that
          applies the floor unconditionally, or only on one of the two endpoints, fails.
        test_recipe:
          setup:
            - "A season with an avalanche-terrain area and three patrollers on duty: P1 (EMT), P2 (PARAMEDIC) and P4 (BASIC)."
            - "Mission AV-1 (SKI_CUT) has been executed by P1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: true }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P1", full_name: "Ada Patrol", cert_level: "EMT", blaster_certified: true, on_duty: true, assigned_terrain_area_id: "${area_id}" }
              as: MountainOpsDirector
              captures: { p1_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P2", full_name: "Bo Patrol", cert_level: "PARAMEDIC", blaster_certified: true, on_duty: true, assigned_terrain_area_id: "${area_id}" }
              as: MountainOpsDirector
              captures: { p2_id: $.data.id }
            - call: "POST /mountain-ops/patrollers"
              payload: { season_id: "${season_id}", patroller_code: "P4", full_name: "Ed Patrol", cert_level: "BASIC", blaster_certified: true, on_duty: true, assigned_terrain_area_id: "${area_id}" }
              as: MountainOpsDirector
              captures: { p4_id: $.data.id }
            - call: "POST /mountain-ops/mitigation-missions"
              payload: { terrain_area_id: "${area_id}", route_code: "AV-1", method: "SKI_CUT", hazard_rating_pre: "CONSIDERABLE", planned_charges: 0 }
              as: MountainOpsDirector
              captures: { m1: $.data.id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/execute"
              payload: { charges_used: 0 }
              as: Patroller
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /mountain-ops/mitigation-missions/${m1}/clear"
              payload: { hazard_rating_post: "LOW" }
              as: Patroller
              as_user_id: "${p4_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/mitigation-missions/${m1}/clear"
              payload: { hazard_rating_post: "LOW" }
              as: Patroller
              as_user_id: "${p2_id}"
            - call: "POST /mountain-ops/incidents"
              payload: { terrain_area_id: "${area_id}", reporter_code: "LIFTIE-3", severity: "SERIOUS", location_note: "skier left of tower 7" }
              as: MountainOpsDirector
              captures: { inc: $.data.id }
            - call: "POST /mountain-ops/incidents/${inc}/dispatch"
              payload: { patroller_id: "${p4_id}" }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/incidents/${inc}/dispatch"
              payload: { patroller_id: "${p1_id}" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/incidents"
              payload: { terrain_area_id: "${area_id}", reporter_code: "LIFTIE-3", severity: "MINOR", location_note: "skier left of tower 7" }
              as: MountainOpsDirector
              captures: { inc2: $.data.id }
            - call: "POST /mountain-ops/incidents/${inc2}/dispatch"
              payload: { patroller_id: "${p4_id}" }
              as: MountainOpsDirector
          assert:
            - "Trigger 1: HTTP 422 with data.error_id == 'ERR_PATROLLER_CERT_INSUFFICIENT' - P4 did not execute the mission, so priority 19 (segregation of duties) passes and the cert floor is the reported failure."
            - "Trigger 2: HTTP 200 with state == 'CLEARED' and cleared_by_patroller_id == ${p2_id}."
            - "Trigger 4: HTTP 422 with data.error_id == 'ERR_PATROLLER_CERT_INSUFFICIENT' - a SERIOUS incident needs EMT or PARAMEDIC; P4 is still AVAILABLE afterwards."
            - "Trigger 5: HTTP 200 with responder_patroller_id == ${p1_id}, response_minutes == 0 and P1 status 'ON_INCIDENT'."
            - "Trigger 7: HTTP 200 - the same BASIC patroller is a legal responder for a MINOR incident, so the floor is severity-conditional."
            - "Trigger 4 does not report ERR_PATROLLER_BUSY: P4 was AVAILABLE, so priority 24 cannot mask priority 23."

      - name: transport_modes_are_gated_by_incident_severity_in_two_tiers
