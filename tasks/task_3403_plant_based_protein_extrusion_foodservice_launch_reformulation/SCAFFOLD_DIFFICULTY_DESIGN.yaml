          setup:
            - "Clock at 2026-09-01T00:00:00Z. OWNED line LINE-OV-1 CERTIFIED; product PROD-OV-1 ACTIVE with APPROVED label; run A scheduled 2026-09-10T08:00:00Z..10:00:00Z."
