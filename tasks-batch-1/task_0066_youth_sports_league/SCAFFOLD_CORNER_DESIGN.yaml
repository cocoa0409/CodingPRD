scaffold_corner_design:
- section: entities
  instances:
  - name: create_league_returns_defaults
    claim_type: Creation
    grounds:
    - entities.League.fields.status
    - entities.League.fields.version
    distinguishing_aspect: POST /leagues with required fields -> 201; status=SETUP, version=1, total_registered_players=0, draft_round_index=0.
    test_recipe:
      setup:
      - Empty DB.
      setup_api_calls: []
      trigger:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      assert:
      - League.${lg}.status == SETUP
      - League.${lg}.version == 1
      - League.${lg}.total_registered_players == 0
      - League.${lg}.draft_round_index == 0
  - name: get_player_not_found
    claim_type: Not Found
    grounds:
    - entities.Player
    - validations[priority=3]
    distinguishing_aspect: GET a non-existent player id under a real league -> ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - League exists.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      trigger:
      - call: GET /players/00000000-0000-4000-8000-000000000000
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
        payload: {}
      assert:
      - Response error_id == ERR_NOT_FOUND
  - name: create_player_missing_required_field
    claim_type: Required Fields
    grounds:
    - entities.Player.fields.birth_date
    distinguishing_aspect: POST player omitting required birth_date -> ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - League in REGISTRATION with a division and family.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /_clock/set
        payload: &id001
          now_iso: '2026-06-01T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /families
        payload:
          league_id: ${lg}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fam: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: NoDOB
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
      assert:
      - Response error_id == ERR_INVALID_REQUEST
  - name: computed_league_age_ignores_client_input
    claim_type: Computed Fields
    grounds:
    - entities.Player.fields.league_age
    - calculations.league_age_computation
    distinguishing_aspect: league_age is server-computed from birth_date and cutoff; a client-supplied league_age is ignored (field not in input).
    test_recipe:
      setup:
      - League in REGISTRATION, division, family.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /_clock/set
        payload: *id001
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /families
        payload:
          league_id: ${lg}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fam: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: Kid
          birth_date: '2016-12-25'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          p: $.data.id
      assert:
      - Player.${p}.league_age == 9 (computed from 2016-12-25 vs 2026-08-31)
  - name: create_player_bad_division_scope
    claim_type: Parent Relationships
    grounds:
    - entities.Player.fields.division_id
    - validations[priority=4]
    distinguishing_aspect: Player whose division_id belongs to a DIFFERENT league -> ERR_FK_SCOPE_MISMATCH (422).
    test_recipe:
      setup:
      - Two leagues L1, L2; division D2 belongs to L2; family F1 in L1; register a player in L1 referencing D2.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: L1
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          l1: $.data.id
      - call: POST /_clock/set
        payload: *id001
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues
        payload:
          name: L2
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          l2: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${l2}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          d2: $.data.id
      - call: POST /families
        payload:
          league_id: ${l1}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          f1: $.data.id
      - call: POST /leagues/${l1}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /players
        payload:
          league_id: ${l1}
          family_id: ${f1}
          division_id: ${d2}
          full_name: Kid
          birth_date: '2015-01-15'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
      assert:
      - Response error_id == ERR_FK_SCOPE_MISMATCH
  - name: list_divisions_pagination_envelope
    claim_type: Listing
    grounds:
    - entities.Division
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /leagues/{id}/divisions returns array envelope with total_count and has_more pagination fields.
    test_recipe:
      setup:
      - League with two divisions.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Minors
          min_league_age: 7
          max_league_age: 9
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: GET /divisions
        as: LeagueAdmin
        as_user_id: admin-1
        payload: {}
      assert:
      - response_type == array; meta.total_count == 2; has_more == false
- section: state_machines
  instances:
  - name: rainout_from_final_is_invalid
    claim_type: Invalid Transitions
    grounds:
    - state_machines.Game.SCHEDULED_to_RAINED_OUT
    - entities.Game.fields.status
    distinguishing_aspect: Calling rainout on a FINAL game -> ERR_INVALID_STATE; FINAL is terminal and not a valid from-state for rainout.
    test_recipe:
      setup:
      - League in SEASON; one game taken to FINAL.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
          draft_slot: 2
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ty: $.data.id
      - call: POST /fields
        payload:
          league_id: ${lg}
          name: Field 1
          turnover_buffer_minutes: 30
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fld: $.data.id
      - call: POST /referees
        payload:
          league_id: ${lg}
          user_id: ref-1
          full_name: Ref One
          max_games_per_day: 10
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ref: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: DRAFT
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: SEASON
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /games
        payload:
          league_id: ${lg}
          division_id: ${div}
          home_team_id: ${tx}
          away_team_id: ${ty}
          field_id: ${fld}
          start_iso: '2026-05-01T17:00:00Z'
          end_iso: '2026-05-01T19:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          g1: $.data.id
      - call: POST /assignments
        payload:
          game_id: ${g1}
          referee_id: ${ref}
          role: PLATE
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          a1: $.data.id
      - call: POST /assignments/${a1}/confirm
        payload: {}
        as: Referee
        as_user_id: ref-1
      - call: POST /games/${g1}/start
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /games/${g1}/finalize
        payload:
          home_runs: 5
          away_runs: 2
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /games/${g1}/rainout
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
      assert:
      - Response error_id == ERR_INVALID_STATE
  - name: terminal_withdrawn_player_cannot_verify
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.Player.REGISTERED_to_WITHDRAWN
    - state_machines.Player.REGISTERED_to_AGE_VERIFIED
    distinguishing_aspect: A WITHDRAWN player (terminal) cannot be age-verified -> ERR_INVALID_STATE.
    test_recipe:
      setup:
      - League in REGISTRATION; one REGISTERED player then withdrawn.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /_clock/set
        payload: *id001
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /families
        payload:
          league_id: ${lg}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fam: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: P1
          birth_date: '2015-01-15'
          birth_certificate_ref: bc1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          p1: $.data.id
      - call: POST /players/${p1}/withdraw
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /players/${p1}/verify-age
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
      assert:
      - Response error_id == ERR_INVALID_STATE
  - name: advance_to_evaluation_requires_registered_player
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.League.REGISTRATION_to_EVALUATION
    - entities.League.fields.total_registered_players
    distinguishing_aspect: Advancing REGISTRATION->EVALUATION with zero registered players -> ERR_INVALID_STATE (precondition total_registered_players >= 1).
    test_recipe:
      setup:
      - League in REGISTRATION with a division but no players.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          err: $.data.error_id
      assert:
      - Response error_id == ERR_INVALID_STATE
  - name: finalize_advances_playoff_eliminates_loser
    claim_type: Side Effect Execution
    grounds:
    - state_machines.Game.IN_PROGRESS_to_FINAL
    - entities.Game.fields.winner_team_id
    distinguishing_aspect: Finalizing a PLAYOFF game sets winner_team_id to the higher-run team and updates standings.
    test_recipe:
      setup:
      - League in PLAYOFFS with two seeded teams and a started PLAYOFF game.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
          draft_slot: 2
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ty: $.data.id
      - call: POST /fields
        payload:
          league_id: ${lg}
          name: Field 1
          turnover_buffer_minutes: 30
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fld: $.data.id
      - call: POST /referees
        payload:
          league_id: ${lg}
          user_id: ref-1
          full_name: Ref One
          max_games_per_day: 10
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ref: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: DRAFT
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: SEASON
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: PLAYOFFS
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /games
        payload:
          league_id: ${lg}
          division_id: ${div}
          home_team_id: ${tx}
          away_team_id: ${ty}
          field_id: ${fld}
          start_iso: '2026-06-01T17:00:00Z'
          end_iso: '2026-06-01T19:00:00Z'
          game_type: PLAYOFF
          playoff_round: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          g1: $.data.id
      - call: POST /assignments
        payload:
          game_id: ${g1}
          referee_id: ${ref}
          role: PLATE
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          a1: $.data.id
      - call: POST /assignments/${a1}/confirm
        payload: {}
        as: Referee
        as_user_id: ref-1
      - call: POST /games/${g1}/start
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /games/${g1}/finalize
        payload:
          home_runs: 8
          away_runs: 3
        as: LeagueAdmin
        as_user_id: admin-1
      assert:
      - Game.${g1}.status == FINAL and Game.${g1}.winner_team_id == ${tx}
      - Team.${tx}.wins == 1; Team.${ty}.losses == 1
  - name: rainout_reschedule_cycle_covered
    claim_type: Valid Transition
    grounds:
    - state_machines.Game.RAINED_OUT_to_SCHEDULED
    excluded_because:
      difficulty_instance: non_linear_state_machine / game_rainout_reschedule_cycle
      rationale: The rainout->reschedule cycle valid transition is asserted by the named §1.8 instance.
- section: calculations
  instances:
  - name: snake_draft_round2_reverses_order
    claim_type: Correct Result
    grounds:
    - calculations.snake_draft_order
    - entities.DraftPick.fields.round_number
    - entities.DraftPick.fields.overall_number
    distinguishing_aspect: 'With 2 teams and snake on, after 2 picks (round 1: slot1 then slot2), pick 3 must be slot 2 again (round 2 reversed); a slot-1 pick is rejected ERR_NOT_YOUR_PICK.'
    test_recipe:
      setup:
      - League in DRAFT; 2 teams slots 1,2; 3 EVALUATED players; team X (slot1) picks P1, team Y (slot2) picks P2.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
          draft_snake: true
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /_clock/set
        payload: *id001
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
