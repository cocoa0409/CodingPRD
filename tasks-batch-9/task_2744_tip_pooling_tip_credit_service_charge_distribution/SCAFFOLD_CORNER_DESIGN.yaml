            - "trigger 2 returns HTTP 422 with data.error_id == ERR_PAY_PERIOD_LENGTH: six calendar days is equally wrong"
            - "trigger 3 returns HTTP 201 with status == OPEN, start_date == 2026-08-03T00:00:00.000Z and end_date == 2026-08-09T00:00:00.000Z, the only accepted length"
            - "trigger 4 returns HTTP 409 with data.error_id == ERR_ASSIGNMENT_OVERLAP: Ana's existing SERVER assignment has effective_to null, so it is unbounded and 2026-08-01 falls inside it"
            - "trigger 5 returns HTTP 201 for the identical interval on the BAR role, because priority 40 scopes overlap to (employee_id, job_role_id); GET /role-assignments?employee_id=${ana_id} then reports total_count == 2 and both rows report dual_job == true"
            - "trigger 6 returns HTTP 422 with data.error_id == ERR_EMPLOYEE_SEPARATED: effective_from 2026-08-10 is after Zed's separation_date"
            - "trigger 7 returns HTTP 201: a pre-separation assignment for a terminated employee is exactly how a final cheque gets recorded"
            - "trigger 8 returns HTTP 422 with data.error_id == ERR_EMPLOYEE_SEPARATED, not ERR_NO_ACTIVE_ROLE_ASSIGNMENT, because Zed's accepted assignment is open-ended and does cover 2026-08-06"
            - "trigger 9 returns HTTP 201 with scheduled_minutes == 480: the same employee, role and period one business date earlier is lawful, so the guard is date-scoped and not employee-scoped"
            - "GET /shifts reports total_count == 1 and GET /pay-periods reports total_count == 1"

      - name: pool_creation_policy_declaration_and_duplicate_guards_rejected
        claim_type: triggerable
        grounds:
          - errors[ERR_NO_ACTIVE_POOL_POLICY]
          - errors[ERR_UNDECLARED_SHIFT_IN_POOL]
          - errors[ERR_EMPTY_POOL_NO_CONTRIBUTIONS]
          - errors[ERR_POOL_DATE_DUPLICATE]
          - validations.priority_33
          - validations.priority_34
          - validations.priority_46
          - validations.priority_52
        distinguishing_aspect: >-
          One shift walked through every gate on the way to a pool, in priority order, each gate
          opened only by the action that satisfies it: activate the policy, declare the shift, then
          amend the declaration to put actual money in it. The first probe proves priority 33 wins
          over priority 34 even though the shift is simultaneously undeclared, and the last proves a
          second pool for the same (location, business_date) is a 409 once a CONTRIBUTED one exists.
        test_recipe:
          setup:
