              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415625", total_capacity: 1, max_concurrent_reservations: 1 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "4001" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
          trigger:
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
