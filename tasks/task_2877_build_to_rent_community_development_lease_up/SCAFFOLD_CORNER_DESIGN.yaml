          The sponsor basis is a pure read that must reproduce every named step of the formula in order:
          one EXECUTED lease at unburdened gross, pro-forma market rent for the three unleased planned
          units through the mix-blended rate, a 5% vacancy deduction, a 34% opex ratio and a 5.25% cap
          rate. Because the lease is EXECUTED and not ACTIVE it counts here while contributing nothing to
          the trailing basis, which is what makes the projection observable in isolation.
