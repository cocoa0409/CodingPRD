- section: cross_cutting_complexity_layers
  instances:
  - name: occ_stale_account_version_on_action_charge_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[charge-stale-account]
    - errors[ERR_STALE_ACCOUNT_VERSION]
    - validations[priority=23]
    distinguishing_aspect: An action charge carrying the account version observed before activation is rejected with 412 because activation already advanced that version.
    test_recipe:
      setup:
      - account version captured as 1 at creation, later advanced by activation
      setup_api_calls:
      - call: POST /zapier/accounts
        payload:
          name: C8a
          plan_code: TEAM_PRO
          task_allowance: 100
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
          acct_v: $.data.version
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
