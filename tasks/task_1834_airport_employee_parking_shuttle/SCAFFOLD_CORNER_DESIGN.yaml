scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: employee_creation_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.Employee.fields.badge_number"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /parking/employees without badge_number (a source:input field with no default) is rejected 400 ERR_INVALID_REQUEST and no employee is persisted."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-E1" }, as: ParkingAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", full_name: "No Badge", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST with http 400"
            - "GET /parking/employees?program_id=${prog} returns total_count 0"
      - name: program_config_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.ParkingProgram.fields.proration_mode"
          - "entities.ParkingProgram.fields.waitlist_offer_ttl_hours"
        distinguishing_aspect: "Omitting all optional config on POST /parking/programs applies the declared defaults (CALENDAR_DAY, pool 0, ttl 72, threshold 3, tow hold 48, posture PROGRAM_NORMAL, ops_run_index 0)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parking/programs", payload: { name: "P-DEF" }, as: ParkingAdmin, captures: { prog: $.data } }
          assert:
            - "prog.proration_mode == CALENDAR_DAY, monthly_subsidy_pool_cents == 0, waitlist_offer_ttl_hours == 72, violation_suspension_threshold == 3, tow_hold_hours == 48, posture == PROGRAM_NORMAL, ops_run_index == 0, version == 1"
      - name: lot_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.ParkingLot.fields.occupied_slots"
          - "entities.ParkingLot.fields.reserved_slots"
        distinguishing_aspect: "Client-supplied values for computed fields (occupied_slots, reserved_slots) and system fields (version) on lot creation are ignored; the lot starts at 0/0 with version 1."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-E2" }, as: ParkingAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10, occupied_slots: 99, reserved_slots: 99, version: 42 }, as: ParkingAdmin, captures: { lot: $.data } }
          assert:
            - "lot.occupied_slots == 0 and lot.reserved_slots == 0 and lot.version == 1 (inputs ignored)"
            - "lot.status == ACTIVE (tier CORE initial)"
      - name: badge_number_unique_per_program_only
        claim_type: type_constraints
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_BADGE_NUMBER_TAKEN]"
        distinguishing_aspect: "badge_number uniqueness is scoped per program: duplicate in the same program is rejected; the same badge in a different program succeeds."
        test_recipe:
          setup: ["Programs P1 and P2; employee with badge B100 in P1"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P1" }, as: ParkingAdmin, captures: { p1: $.data.id } }
            - { call: "POST /parking/programs", payload: { name: "P2" }, as: ParkingAdmin, captures: { p2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${p1}", badge_number: "B100", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/employees", payload: { program_id: "${p1}", badge_number: "B100", full_name: "Dup", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-02-01" }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /parking/employees", payload: { program_id: "${p2}", badge_number: "B100", full_name: "Ok", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-02-01" }, as: ParkingAdmin, captures: { e2: $.data.id } }
          assert:
            - "err1 == ERR_BADGE_NUMBER_TAKEN with http 409"
            - "e2 bound (cross-program reuse succeeds)"
      - name: permit_get_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET /parking/permits/{id} with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /parking/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_NOT_FOUND with http 404; error envelope carries meta.api_request_id"
      - name: employee_list_pagination_and_filter
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
          - "entities.Employee.fields.standing"
        distinguishing_aspect: "List endpoints honor limit/offset/total_count/has_more with default limit 10, and compose with the standing filter (GOOD_STANDING returns only matching rows)."
        test_recipe:
          setup: ["Program with 12 employees (badges B001..B012), all GOOD_STANDING"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-LST" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "E01", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "E02", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "E03", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B004", full_name: "E04", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B005", full_name: "E05", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B006", full_name: "E06", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B007", full_name: "E07", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B008", full_name: "E08", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B009", full_name: "E09", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B010", full_name: "E10", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B011", full_name: "E11", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B012", full_name: "E12", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin }
          trigger:
            - { call: "GET /parking/employees", payload: { program_id: "${prog}" }, as: ParkingAdmin, captures: { page1: $.data } }
            - { call: "GET /parking/employees", payload: { program_id: "${prog}", shift_pattern: DAY }, as: ParkingAdmin, captures: { pagef: $.data } }
          assert:
            - "Unfiltered first page: response_type array, pagination meta limit == 10 (default), total_count == 12, has_more == true"
            - "Filtered page: every returned row has shift_pattern == DAY and total_count == 2"
      - name: employee_invalid_enum_shift_pattern
        claim_type: type_constraints
        grounds:
          - "entities.Employee.fields.shift_pattern"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "shift_pattern GRAVEYARD is not a declared enum member -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /parking/programs", payload: { name: "P-E3" }, as: ParkingAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "X", employer_code: "ACME", shift_pattern: GRAVEYARD, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_REQUEST with http 400"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: violation_fine_constants_applied
        claim_type: constants_applied
        grounds:
          - "calculations.violation_fine_escalation"
        excluded_because:
          difficulty_instance: "boundary_precision_check / violation_suspension_at_exact_threshold"
          rationale: "WRONG_LOT base 3500 with x1.0/x1.5/x2.0 escalation (3500/5250/7000) is asserted literally in that §1.8 instance's trigger captures."
      - name: tow_impound_fee_two_day_hold
        claim_type: correct_result
        grounds:
          - "calculations.tow_impound_fee"
          - "state_machines.TowEvent.TOWED_to_RELEASED"
        distinguishing_aspect: "Tow held 36 hours bills ceil(36/24) = 2 storage days: 15000 + 2*2500 = 20000, posted as a PENDING TOW_FEE entry linked via charge_entry_id."
        test_recipe:
          setup:
            - "Program threshold 3, tow_hold_hours 48, pool 0; CORE lot; OPEN August cycle; E1 DAY ACTIVE then SUSPENDED by three WRONG_LOT violations at 2026-08-10T08:00:00Z"
            - "Clock 2026-08-12T09:00:00Z (49h hold elapsed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-TOW", monthly_subsidy_pool_cents: 0, violation_suspension_threshold: 3, tow_hold_hours: 48 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events", payload: { permit_id: "${p1}", violation_id: "${v1}" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { tow: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: MARK_TOWED }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T22:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: RELEASE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { t: $.data } }
          assert:
            - "t.status == RELEASED, t.impound_fee_cents == 20000 (15000 base + 2 days x 2500), t.charge_entry_id set"
            - "The linked ChargeEntry: charge_type TOW_FEE, amount_cents 20000, status PENDING, cycle ${cyc}"
      - name: tow_impound_fee_minimum_one_day
        claim_type: boundary
        grounds:
          - "calculations.tow_impound_fee"
        distinguishing_aspect: "days_held is max(1, ceil(hours/24)): a 12-hour hold bills exactly 1 storage day -> 17500 (not 15000, not 20000)."
        test_recipe:
          setup: ["Identical suspension setup as tow_impound_fee_two_day_hold; tow authorized and MARK_TOWED at 2026-08-12T10:00:00Z; clock at 2026-08-12T22:00:00Z (12h later)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-TOW1", monthly_subsidy_pool_cents: 0, violation_suspension_threshold: 3, tow_hold_hours: 48 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 5 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { v1: $.data.id } }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /parking/violations", payload: { permit_id: "${p1}", violation_code: WRONG_LOT }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events", payload: { permit_id: "${p1}", violation_id: "${v1}" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { tow: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: MARK_TOWED }, as: EnforcementOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T22:00:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/tow-events/${tow}/events", payload: { event_type: RELEASE }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { t: $.data } }
          assert:
            - "t.impound_fee_cents == 17500 (15000 + 1 x 2500; 12h clamps to the 1-day minimum)"
      - name: employee_balance_exactly_zero_is_good_standing
        claim_type: boundary
        grounds:
          - "calculations.employee_balance_due"
          - "entities.Employee.fields.standing"
        distinguishing_aspect: "The standing threshold is strict >: a DEDUCTION_FAILED 5000 debit flips standing to BILLING_HOLD, and settling it back returns balance to exactly 0 -> GOOD_STANDING (0 is not a hold)."
        test_recipe:
          setup: ["Program; August cycle; E1 employee; 5000 ADJUSTMENT_DEBIT posted, cycle closed and exported"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-BAL" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc}", employee_id: "${e1}", charge_type: ADJUSTMENT_DEBIT, amount_cents: 5000, description: "badge replacement" }, as: PayrollAdmin, captures: { adj: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: DEDUCTION_FAILED }, as: PayrollAdmin }
          trigger:
            - { call: "GET /parking/employees/${e1}", payload: {}, as: PayrollAdmin, captures: { mid: $.data } }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: SETTLED }, as: PayrollAdmin }
            - { call: "GET /parking/employees/${e1}", payload: {}, as: PayrollAdmin, captures: { fin: $.data } }
          assert:
            - "mid.balance_due_cents == 5000 and mid.standing == BILLING_HOLD"
            - "fin.balance_due_cents == 0 and fin.standing == GOOD_STANDING (boundary: exactly 0 is GOOD)"
      - name: subsidy_cap_excludes_billing_hold_employees
        claim_type: input_set_filtering
        grounds:
          - "calculations.subsidy_per_capita_cap"
          - "entities.BillingCycle.fields.subsidy_per_capita_cap_cents"
        distinguishing_aspect: "The eligible_count snapshot counts only ACTIVE permits whose employee is GOOD_STANDING: with pool 900 and one of three permit holders on BILLING_HOLD at September creation, cap == floor(900/2) == 450 and all three full-period entries clamp subsidy to 450 (total 29850)."
        test_recipe:
          setup:
            - "Program pool 900; CORE lot; August cycle; DAY/NIGHT/ROTATING employees all ACTIVE (August entries 11100/8100/9300 under cap 900)"
            - "E2 put on BILLING_HOLD via 100 ADJUSTMENT_DEBIT -> close -> export -> settle DEDUCTION_FAILED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-FILT", monthly_subsidy_pool_cents: 900 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 10 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Night Two", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "Rot Three", employer_code: "ACME", shift_pattern: ROTATING, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e3: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e3}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e3}", captures: { p3: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p2}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e2}" }
            - { call: "POST /parking/permits/${p3}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e3}" }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc1}", employee_id: "${e2}", charge_type: ADJUSTMENT_DEBIT, amount_cents: 100, description: "key fob" }, as: PayrollAdmin, captures: { adj: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc1}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc1}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc1}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: DEDUCTION_FAILED }, as: PayrollAdmin }
          trigger:
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: PayrollAdmin, captures: { cyc2: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc2}", payload: {}, as: PayrollAdmin, captures: { c2: $.data } }
          assert:
            - "c2.subsidy_per_capita_cap_cents == 450 (only E1 and E3 counted; E2 on BILLING_HOLD is excluded from the eligible set)"
            - "September entries: E1 11550, E2 8550, E3 9750 (subsidy clamped to 450 for all three, including E2)"
            - "c2.total_charges_cents == 29850"
      - name: lot_availability_exactly_one_slot
        claim_type: boundary
        grounds:
          - "calculations.lot_occupancy"
          - "entities.ParkingLot.fields.reserved_slots"
        distinguishing_aspect: "The >= 1 availability comparison: with capacity 1 the first application is OFFERED (1 >= 1) and the second is WAITLISTED (0 >= 1 false); reserved_slots reads 1 after the offer."
        test_recipe:
          setup: ["Program; CORE lot capacity 1; OPEN August cycle; two DAY employees"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-CAP" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 1 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { pa: $.data } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { pb: $.data } }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { l: $.data } }
          assert:
            - "pa.status == OFFERED (available exactly 1 satisfies >= 1); pb.status == WAITLISTED (0 available)"
            - "l.occupied_slots == 0 and l.reserved_slots == 1"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: permit_cancel_from_revoked_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Permit"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REVOKED is terminal: CANCEL on a revoked permit returns ERR_INVALID_STATE and fires no side effects (no billing touch, no promotion)."
        test_recipe:
          setup: ["Program; CORE lot capacity 2; OPEN August cycle; E1 with ACTIVE permit, then revoked by ParkingAdmin"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SM1" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: REVOKE }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: CANCEL }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE with http 409"
            - "GET /parking/permits/${p1}.status remains REVOKED"
      - name: permit_second_accept_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Permit.OFFERED_to_ACTIVE"
          - "errors[ERR_PERMIT_NOT_OFFERED]"
        distinguishing_aspect: "ACCEPT is single-shot: a second ACCEPT on an ACTIVE permit fails with ERR_PERMIT_NOT_OFFERED and posts no additional PERMIT_FEE entry."
        test_recipe:
          setup: ["Program pool 0; CORE lot capacity 2; OPEN August cycle; E1 ACTIVE (accepted 2026-08-01, one 12000 entry)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SM2", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}", captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_PERMIT_NOT_OFFERED with http 409"
            - "GET /parking/charge-entries?permit_id=${p1} still shows exactly one PERMIT_FEE entry (12000, PENDING)"
      - name: employee_cannot_terminate_twice
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Employee"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "TERMINATED is terminal for employees: a second terminate returns ERR_INVALID_STATE; terminated_at keeps its first value."
        test_recipe:
          setup: ["Program; E1 terminated at 2026-08-02T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SM3" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/employees/${e1}/terminate", payload: {}, as: ParkingAdmin, captures: { emp: $.data } }
          trigger:
            - { call: "POST /parking/employees/${e1}/terminate", payload: {}, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE with http 409"
            - "emp.terminated_at == 2026-08-02T09:00:00Z and is unchanged by the rejected second terminate"
      - name: cycle_reject_export_compensation_and_locks
        claim_type: invalid_transition
        grounds:
          - "state_machines.BillingCycle.EXPORTED_to_CLOSED"
          - "state_machines.ChargeEntry"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REJECT_EXPORT compensates EXPORT (entries EXPORTED -> APPLIED, cycle back to CLOSED); settle on an APPLIED entry is then rejected; and once any entry is SETTLED, REJECT_EXPORT itself is rejected."
        test_recipe:
          setup: ["Program; August cycle with one 700 ADJUSTMENT_DEBIT for E1; cycle closed then exported"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SM4" }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/charge-entries", payload: { cycle_id: "${cyc}", employee_id: "${e1}", charge_type: ADJUSTMENT_DEBIT, amount_cents: 700, description: "fine admin" }, as: PayrollAdmin, captures: { adj: $.data.id } }
            - { call: "GET /parking/billing-cycles/${cyc}", payload: {}, as: PayrollAdmin, captures: { cv: $.data.version } }
            - { call: "POST /parking/billing-cycles/${cyc}/close", payload: { expected_billing_cycle_version: "${cv}" }, as: PayrollAdmin }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
          trigger:
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: REJECT_EXPORT }, as: PayrollAdmin, captures: { cycr: $.data } }
            - { call: "GET /parking/charge-entries/${adj}", payload: {}, as: PayrollAdmin, captures: { adjr: $.data } }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: SETTLED }, as: PayrollAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: EXPORT }, as: PayrollAdmin }
            - { call: "POST /parking/charge-entries/${adj}/settle", payload: { outcome: SETTLED }, as: PayrollAdmin, captures: { adj2: $.data } }
            - { call: "POST /parking/billing-cycles/${cyc}/events", payload: { event_type: REJECT_EXPORT }, as: PayrollAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "cycr.status == CLOSED and adjr.status == APPLIED (export compensated)"
            - "err1 == ERR_INVALID_STATE (settle requires EXPORTED or DEDUCTION_FAILED, not APPLIED)"
            - "adj2.status == SETTLED after re-export"
            - "err2 == ERR_INVALID_STATE (REJECT_EXPORT forbidden once an entry is SETTLED)"
      - name: renewal_decide_twice_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.PermitRenewal.PENDING_to_APPROVED"
          - "entities.Permit.fields.term_end"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "APPROVED is terminal for a renewal: a second decide returns ERR_INVALID_STATE; the approval side effect extended Permit.term_end from 2027-08-01 to 2028-08-01."
        test_recipe:
          setup: ["Program pool 0; CORE lot; OPEN August cycle; E1 ACTIVE permit activated 2026-08-01 (term_end 2027-08-01); one PENDING renewal created with the permit's current version"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-SM5", monthly_subsidy_pool_cents: 0 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 2 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/billing-cycles", payload: { program_id: "${prog}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: ACCEPT }, as: Employee, as_user_id: "${e1}" }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { pv: $.data.version } }
            - { call: "POST /parking/permits/${p1}/renewals", payload: { expected_permit_version: "${pv}" }, as: Employee, as_user_id: "${e1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /parking/renewals/${r1}/decide", payload: { decision: APPROVE }, as: ParkingAdmin, captures: { rd: $.data } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { perm: $.data } }
            - { call: "POST /parking/renewals/${r1}/decide", payload: { decision: REJECT }, as: ParkingAdmin, captures: { err1: $.data.error_id } }
          assert:
            - "rd.status == APPROVED and rd.decided_by is the ParkingAdmin's X-User-ID"
            - "perm.term_end == 2028-08-01 (12-month extension applied exactly once)"
            - "err1 == ERR_INVALID_STATE with http 409"
      - name: waitlist_promotion_shift_priority_over_arrival
        claim_type: side_effect_execution
        grounds:
          - "calculations.waitlist_promotion_order"
          - "state_machines.Permit.WAITLISTED_to_OFFERED"
        distinguishing_aspect: "Promotion ranking is shift-class first: when E1 declines, the later-created NIGHT entry (priority 3) is promoted ahead of the earlier-created DAY entry (priority 0); arrival order only breaks same-class ties."
        test_recipe:
          setup:
            - "Program ttl 72; CORE lot capacity 1; E1 DAY OFFERED at 09:00; E2 DAY WAITLISTED at 09:01; E3 NIGHT WAITLISTED at 09:02 (all 2026-08-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-WL", waitlist_offer_ttl_hours: 72 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "CORE-A", tier: CORE, capacity: 1 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "Day One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Day Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B003", full_name: "Night Three", employer_code: "ACME", shift_pattern: NIGHT, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e3: $.data.id } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:01:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:02:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/permits", payload: { employee_id: "${e3}", lot_id: "${lot}", vehicle_plate: "P003" }, as: Employee, as_user_id: "${e3}", captures: { p3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:05:00Z" }, as: ParkingAdmin }
          trigger:
            - { call: "POST /parking/permits/${p1}/events", payload: { event_type: DECLINE }, as: Employee, as_user_id: "${e1}" }
            - { call: "GET /parking/permits/${p3}", payload: {}, as: ParkingAdmin, captures: { pr3: $.data } }
            - { call: "GET /parking/permits/${p2}", payload: {}, as: ParkingAdmin, captures: { pr2: $.data } }
          assert:
            - "pr3.status == OFFERED with offered_at == 2026-08-01T09:05:00Z and offer_expires_at == 2026-08-04T09:05:00Z (NIGHT class beats DAY despite later created_at)"
            - "pr2.status == WAITLISTED (still queued behind no one — the single freed slot went to E3)"
            - "GET /parking/lots/${lot}.reserved_slots == 1"
      - name: peak_window_activation_and_ending_via_run_ops
        claim_type: valid_transition
        grounds:
          - "state_machines.PeakWindow.SCHEDULED_to_ACTIVE"
          - "state_machines.PeakWindow.ACTIVE_to_ENDED"
          - "state_machines.ParkingLot.STANDBY_to_ACTIVATED"
          - "errors[ERR_LOT_NOT_BOOKABLE]"
        distinguishing_aspect: "Half-open activation semantics: at exactly starts_at the window activates (lot STANDBY -> ACTIVATED, remote lot becomes bookable); at exactly ends_at it ends (lot back to STANDBY, new applications rejected ERR_LOT_NOT_BOOKABLE)."
        test_recipe:
          setup:
            - "Program; REMOTE lot capacity 40 (STANDBY); PeakWindow [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z); employees E1, E2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs", payload: { name: "P-PK2", waitlist_offer_ttl_hours: 72 }, as: ParkingAdmin, captures: { prog: $.data.id } }
            - { call: "POST /parking/lots", payload: { program_id: "${prog}", code: "REM-A", tier: REMOTE, capacity: 40 }, as: ParkingAdmin, captures: { lot: $.data.id } }
            - { call: "POST /parking/peak-windows", payload: { lot_id: "${lot}", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }, as: ParkingAdmin, captures: { w1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B001", full_name: "One", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e1: $.data.id } }
            - { call: "POST /parking/employees", payload: { program_id: "${prog}", badge_number: "B002", full_name: "Two", employer_code: "ACME", shift_pattern: DAY, hire_date: "2024-01-15" }, as: ParkingAdmin, captures: { e2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "POST /parking/permits", payload: { employee_id: "${e1}", lot_id: "${lot}", vehicle_plate: "P001" }, as: Employee, as_user_id: "${e1}", captures: { p1: $.data } }
          trigger:
            - { call: "GET /parking/peak-windows/${w1}", payload: {}, as: ParkingAdmin, captures: { wmid: $.data } }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { lmid: $.data } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ParkingAdmin }
            - { call: "POST /parking/programs/${prog}/run-ops", payload: {}, as: ParkingAdmin }
            - { call: "GET /parking/peak-windows/${w1}", payload: {}, as: ParkingAdmin, captures: { wend: $.data } }
            - { call: "GET /parking/lots/${lot}", payload: {}, as: ParkingAdmin, captures: { lend: $.data } }
            - { call: "GET /parking/permits/${p1}", payload: {}, as: ParkingAdmin, captures: { p1end: $.data } }
            - { call: "POST /parking/permits", payload: { employee_id: "${e2}", lot_id: "${lot}", vehicle_plate: "P002" }, as: Employee, as_user_id: "${e2}", captures: { err1: $.data.error_id } }
          assert:
            - "wmid.status == ACTIVE and lmid.status == ACTIVATED at exactly starts_at (inclusive lower bound)"
            - "E1's application during the window succeeds OFFERED (remote lot bookable while ACTIVATED)"
            - "wend.status == ENDED and lend.status == STANDBY at exactly ends_at (exclusive upper bound)"
            - "p1end.status == EXPIRED (its 72h offer lapsed at 2026-08-13T00:00:00Z and the 08-20 run-ops swept it)"
            - "err1 == ERR_LOT_NOT_BOOKABLE with http 409"
      - name: offer_expiry_sweep_promotes_waitlist
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Permit.OFFERED_to_EXPIRED"
          - "calculations.waitlist_promotion_order"
        distinguishing_aspect: "run-ops expires stale offers and promotes within the same checkpoint: E1's offer lapses at 2026-08-04T09:00:00Z, and E2 is promoted OFFERED with a fresh 72h expiry anchored to the sweep time."
        test_recipe:
          setup: ["Program ttl 72; CORE lot capacity 1; E1 OFFERED at 2026-08-01T09:00:00Z; E2 WAITLISTED; clock advanced to 2026-08-04T09:00:01Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ParkingAdmin }
