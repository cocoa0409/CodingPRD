            - "PayrollRun.${run}.settled_gross_cents == 9900 and PayrollRun.${run}.settled_net_cents == 9900 and PayrollRun.${run}.accrued_gross_cents == 13950"
            - "PayrollRun.${run}.reconciliation_delta_cents == -4050"
            - "Crew.${crew}.accrued_wage_cents == 0 and Crew.${crew}.settled_wage_cents == 9900 and Crew.${crew}.reconciliation_delta_cents == -4050"
            - "PickSession.${ses_a}.status == SETTLED and PickSession.${ses_b}.status == SETTLED"

      - name: commitment_risk_flag_flips_only_past_the_three_day_lead_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.commitment_settlement
          - entities.BuyerCommitment.fields.risk_flag
          - endpoints["POST /berry-ops/_clock/set_current_utc"]
        distinguishing_aspect: |
          The risk threshold is a strict comparison against
          window_end_date - RISK_LEAD_DAYS: with a delivery window ending
          2026-08-10 the pivot date is 2026-08-07, so an allocation recomputed
          with the clock ON 2026-08-07 leaves risk_flag ON_TRACK even at 25%
          coverage, and only the recompute with the clock at 2026-08-08 flips it to
          AT_RISK. Coverage is the second half of the conjunction, so the flip
          needs BOTH the date past the pivot and coverage below FILL_TARGET_PCT.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one RECRUITING crew; one PLANNED window over 2026-08-03; two PACKED grade-A lots of 100 clamshells at 1.00 lb each."
            - "One OPEN commitment for 200.00 lb over 2026-08-01..2026-08-10, so the risk pivot date is 2026-08-07."
            - "The logical clock is advanced to exactly 2026-08-07T00:00:00Z."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V35", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V35" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V35", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot1: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot2: $.data.id }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer V35", buyer_user_id: "buyer-10", variety: "STRAWBERRY", volume_commitment_lbs: 200.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, cv0: $.data.version }
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot1}", buyer_commitment_id: "${com}", allocated_lbs: 50.00, expected_buyer_commitment_version: "${cv0}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc1: $.data.id }
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "GET /berry-ops/buyer-commitments/${com}"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
              captures: { cv1: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot2}", buyer_commitment_id: "${com}", allocated_lbs: 50.00, expected_buyer_commitment_version: "${cv1}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc2: $.data.id }
          assert:
            - "after the first trigger BuyerCommitment.${com}.risk_flag == ON_TRACK, because the clock date 2026-08-07 is not strictly after the pivot 2026-08-07"
            - "after the first trigger BuyerCommitment.${com}.committed_lbs == 50.00 and BuyerCommitment.${com}.coverage_pct == 0.2500 and BuyerCommitment.${com}.open_lbs == 150.00"
            - "the fourth trigger is HTTP 201 and BuyerCommitment.${com}.risk_flag == AT_RISK"
            - "BuyerCommitment.${com}.committed_lbs == 100.00 and BuyerCommitment.${com}.coverage_pct == 0.5000 and BuyerCommitment.${com}.open_lbs == 100.00 and BuyerCommitment.${com}.version == 3"
            - "BuyerCommitment.${com}.shipped_lbs == 0.00 and BuyerCommitment.${com}.fill_pct == 0.0000 and BuyerCommitment.${com}.status == OPEN"
            - "LotAllocation.${alloc1}.status == RESERVED and LotAllocation.${alloc2}.status == RESERVED"

      - name: block_quarantine_cascade_reaches_the_crew_wage_ledger
        excluded_because:
          difficulty_instance: "transitive_cascade / block_quarantine_cascades_four_levels_to_crew_wage_ledger"
          rationale: |
            The §1.8 instance already drives the full four-level quarantine
            cascade (windows -> sessions -> picker/window aggregates -> crew wage
            ledger) from a single quarantine call and pins every level's post-state,
            which is precisely what a cascading_side_effects corner claim would
            assert. Restating it here would duplicate the same trigger and the
            same ledger arithmetic.

      - name: lot_rejection_cascade_reaches_buyer_commitment_exposure
        excluded_because:
          difficulty_instance: "transitive_cascade / lot_rejection_cascades_three_levels_to_buyer_commitment_exposure"
          rationale: |
            The §1.8 instance already rejects a RESERVED lot and verifies the
            three-level chain (lot -> allocations RELEASED -> commitment
            committed_lbs / open_lbs / risk_flag and version), including the
            ordering of the released lines. A §1.9 copy would exercise the same
            endpoint with the same cascade depth.

  - section: consistency_model
    instances:
      - name: derived_pounds_and_postures_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - response_envelope
          - calculations.commitment_settlement
          - calculations.water_quality_status
          - entities.FruitLot.fields.available_lbs
        distinguishing_aspect: |
          The consistency model is immediate, so no derived value ever lags a
          request: the water-test response's own block recompute is already
          visible to the very next read (geometric mean 40.0, PROVISIONAL,
          CLEARED), and the allocation response returns a lot whose available_lbs
          has already dropped to 60.00 while the commitment read in the same
          sequence already shows committed_lbs 40.00 and open_lbs 160.00 - no
          re-read loop, no retry, no eventual convergence step.
        test_recipe:
          setup:
            - "One STRAWBERRY block with no samples; one RECRUITING crew; one PLANNED window over 2026-08-03; one PACKED grade-A lot of 100 clamshells at 1.00 lb; one OPEN commitment for 200.00 lb."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V36", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V36" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V36", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T12:00:00Z", field_pulp_temp_f: 62.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "Buyer V36", buyer_user_id: "buyer-11", variety: "STRAWBERRY", volume_commitment_lbs: 200.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "GET /berry-ops/blocks/${blk}"
              payload: {}
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com}", allocated_lbs: 40.00, expected_buyer_commitment_version: "${cv}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc: $.data.id }
            - call: "GET /berry-ops/fruit-lots/${lot}"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
            - call: "GET /berry-ops/buyer-commitments/${com}"
              payload: {}
              as: SalesManager
              as_user_id: "sales-1"
          assert:
            - "the water-test response is HTTP 201 with data.resulting_water_status == PROVISIONAL and data.single_sample_exceedance == false"
            - "the block read immediately after is HTTP 200 with data.water_sample_count == 1, data.water_geomean_mpn == 40.0, data.water_status == PROVISIONAL, data.food_safety_posture == CLEARED and data.last_sample_date == 2026-07-20"
            - "the allocation response is HTTP 201 with data.status == RESERVED and data.allocated_lbs == 40.00"
            - "the lot read immediately after is HTTP 200 with data.allocated_lbs == 40.00, data.available_lbs == 60.00 and data.disposition_status == RESERVED"
            - "the commitment read immediately after is HTTP 200 with data.committed_lbs == 40.00, data.open_lbs == 160.00, data.coverage_pct == 0.2000 and data.version == 2"
            - "every figure above is observed without any intervening write, so no derived field required a second request to converge"
