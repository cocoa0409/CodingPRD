              payload: { provider_id: "${p7_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c7_id}"
              captures: { cg7_id: $.data.id }
            - call: "POST /intakes/${i7_id}/referrals"
              payload: { program_id: "${prog7_id}", consent_grant_id: "${cg7_id}", transport_mode: "AGENCY_SHUTTLE" }
              as: Caseworker
              captures: { r7_id: $.data.id }
            - call: "POST /referrals/${r7_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p7_id}"
            - call: "POST /referrals/${r7_id}/transport-plans"
              payload: { pickup_start_ts: "2026-06-10T09:00:00Z", pickup_end_ts: "2026-06-10T10:00:00Z", mode: "AGENCY_SHUTTLE", cost_cents: 500 }
              as: Caseworker
              captures: { tp7_id: $.data.id }
          trigger:
            - call: "POST /consent-grants/${cg7_id}/revoke"
              payload: {}
              as: Client
              as_user_id: "${c7_id}"
          assert:
            - "ConsentGrant.${cg7_id}.status == REVOKED (link 1)"
            - "Referral.${r7_id}.status == WITHDRAWN (link 2, caused by link 1 cascade)"
            - "TransportPlan.${tp7_id}.status == CANCELLED (link 3, caused by link 2 cascade — depth 3)"
            - "Program.${prog7_id}.capacity_slots_taken == 0 (parallel side-effect of link 2's transition)"

      - name: complete_referral_cascades_capacity_decrement_and_posture_recompute_depth_3
        grounds:
          - state_machines.Referral.SERVICE_IN_PROGRESS_to_COMPLETED_SUCCESS
          - calculations.program_utilization
          - entities.Program.fields.intake_posture
          - entities.Program.fields.capacity_slots_taken
        distinguishing_aspect: |
          Trigger: POST /referrals/{id}/complete (a DIFFERENT triggering transition from the
          consent-revoke cascade above). Depth-3 cascade — Link 1 sets Referral.status =
