            - call: "POST /records-desk/datasets/${ds_refused_id}/field-definitions"
              payload: { field_name: "case_number", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 1, is_source_identifying: false }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_refused_id}/field-definitions"
              payload: { field_name: "closed_on", data_type: "DATE", null_rate_pct: 12.5, reidentification_risk: 1, is_source_identifying: false }
              as: DataReporter
