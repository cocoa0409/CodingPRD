# =====================================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: precision-spring-wire-form-manufacturing (task 2514)
#
# Every instance grounds only in elements declared by SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in an `assert:` was computed by executing the relevant
# calculations[].formula with its declared constants and rounding mode.
#
# Shared fixture vocabulary used across instances (each instance re-derives it in full):
#   MS-CRSI-1  CHROME_SILICON_A401, tensile 1900 MPa, G 79.3 GPa, density 7850, 850 c/kg
#   MS-SS302-1 STAINLESS_302_A313,  tensile 1650 MPa, G 69.0 GPa, density 7900, 2200 c/kg
#   MS-MW-1    MUSIC_WIRE_ASTM_A228 tensile 1750 MPa, G 79.3 GPa, density 7850, 620 c/kg
#   D1 (on MS-CRSI-1) d 2.5 / OD 20.0 / FL 60.0 / Na 8 / 150-50 N / peened
#        -> spring_rate 9.031, tau 513.37 / 171.12, amp 171.12, mean 342.25,
#           Goodman 1.757, Soderberg 1.428, mass_pp 0.021185 kg, tangle 3.000 LOW
#   D2 (on MS-SS302-1) d 1.2 / OD 10.0 / FL 24.0 / Na 6 / 25-8 N / unpeened
#        -> spring_rate 4.374, Goodman 1.593, Soderberg 1.351, mass_pp 0.001976 kg
#   D3 (on MS-MW-1) d 2.0 / OD 16.0 / FL 48.0 / Na 10 / 90-30 N / unpeened
#        -> spring_rate 5.780, Goodman 1.366, Soderberg 1.155, mass_pp 0.013016 kg
# =====================================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: fatigue_criterion_soderberg_versus_goodman_on_identical_wire_form
        grounds:
          - calculations.fatigue_margin_ratio
          - calculations.predicted_fatigue_life
          - entities.SpringDesign.fields.fatigue_criterion
          - entities.SpringDesign.fields.fatigue_margin_ratio
          - entities.SpringDesign.fields.predicted_fatigue_life_cycles
          - entities.CustomerProgram.fields.application_class
        distinguishing_aspect: |
          This instance's two variants live in the ENGINEERING domain of SpringDesign: goodman_line divides
          the mean shear stress by Ssu = 0.67 * tensile while soderberg_line divides it by Ssy = 0.45 * tensile,
          so byte-identical geometry, loads and material yield 1.366 under an INDUSTRIAL program and 1.155 under
          an AUTOMOTIVE_SAFETY program, and the divergence propagates into two different life tiers
          (10000000 vs 5000000 cycles).
        test_recipe:
          setup:
            - "Two customer programs differing ONLY in application_class: INDUSTRIAL and AUTOMOTIVE_SAFETY; both require 0 salt-spray hours and carry min_fatigue_margin 1.0."
            - "One music-wire material spec MS-MW-1 (tensile 1750 MPa, G 79.3 GPa, density 7850 kg/m3, coating NONE, 0 salt-spray hours)."
            - "One design geometry D3 (d 2.0 mm, OD 16.0 mm, free length 48.0 mm, 10 active coils, 90 N / 30 N, unpeened) created once under each program."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-IND-1", customer_name: "Bramble Industrial Supply", application_class: "INDUSTRIAL", ppap_level: 1, committed_pieces: 100000, minimum_order_quantity: 5000, required_salt_spray_hours: 0, biocompatibility_required: false, min_fatigue_margin: 1.0, required_ppk: 1.0, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_ind_id: $.data.id }
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-SAFE-1", customer_name: "Northwind Drivetrain", application_class: "AUTOMOTIVE_SAFETY", ppap_level: 3, committed_pieces: 100000, minimum_order_quantity: 5000, required_salt_spray_hours: 0, biocompatibility_required: false, min_fatigue_margin: 1.0, required_ppk: 1.0, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_safe_id: $.data.id }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-MW-1", wire_material: "MUSIC_WIRE_ASTM_A228", tensile_grade_mpa: 1750, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "NONE", salt_spray_hours: 0, biocompatible: false, cost_per_kg_cents: 620 }
              as: DesignEngineer
              captures: { ms_mw_id: $.data.id }
          trigger:
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_ind_id}", material_spec_id: "${ms_mw_id}", part_number: "D3-IND", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.0, outer_diameter_mm: 16.0, free_length_mm: 48.0, active_coils: 10, max_working_load_n: 90, min_working_load_n: 30, cycle_seconds_per_piece: 3.0, shot_peening_required: false }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d3_ind_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_safe_id}", material_spec_id: "${ms_mw_id}", part_number: "D3-SAFE", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.0, outer_diameter_mm: 16.0, free_length_mm: 48.0, active_coils: 10, max_working_load_n: 90, min_working_load_n: 30, cycle_seconds_per_piece: 3.0, shot_peening_required: false }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d3_safe_id: $.data.id }
          assert:
            - "SpringDesign.${d3_ind_id}.fatigue_criterion == GOODMAN"
            - "SpringDesign.${d3_safe_id}.fatigue_criterion == SODERBERG"
            - "SpringDesign.${d3_ind_id}.fatigue_margin_ratio == 1.366"
            - "SpringDesign.${d3_safe_id}.fatigue_margin_ratio == 1.155"
            - "SpringDesign.${d3_ind_id}.predicted_fatigue_life_cycles == 10000000"
            - "SpringDesign.${d3_safe_id}.predicted_fatigue_life_cycles == 5000000"
            - "SpringDesign.${d3_ind_id}.spring_rate_n_per_mm == 5.780 and SpringDesign.${d3_safe_id}.spring_rate_n_per_mm == 5.780"
            - "SpringDesign.${d3_ind_id}.stress_amplitude_mpa == 160.43 and SpringDesign.${d3_safe_id}.stress_amplitude_mpa == 160.43"
            - "SpringDesign.${d3_ind_id}.mean_stress_mpa == 320.86 and SpringDesign.${d3_safe_id}.mean_stress_mpa == 320.86"
            - "GET /spring-designs/${d3_safe_id}/fatigue-analysis returns fatigue_margin_goodman == 1.366 AND fatigue_margin_soderberg == 1.155 AND criterion_in_force == SODERBERG"

      - name: tooling_amortization_forecast_versus_accelerated_on_identical_ledger
        grounds:
          - calculations.tooling_amortization_recovery
          - entities.ToolingAsset.fields.unamortized_cents
          - entities.ToolingAsset.fields.amort_per_piece_cents
          - entities.CustomerProgram.fields.amortization_method
          - entities.CustomerProgram.fields.open_commitment_pieces
          - endpoints["GET /customer-programs/{id}/tooling-amortization"]
        distinguishing_aspect: |
          This instance's two variants live in the FINANCIAL domain of ToolingAsset, not the engineering domain:
          straight_line_forecast recovers a flat ceil(4800000/40000) = 120 cents per piece and is therefore linear
          in piece_count and blind to the outstanding balance, while accelerated_declining recovers
          ceil(4800000 * 1.5 * 2000 / 40000) = 360000 cents by scaling the REMAINING balance against the REMAINING
          commitment, so one identical 2000-piece draw against one identical ledger posts 240000 vs 360000.
        test_recipe:
          setup:
            - "One MEDICAL_IMPLANT program on ACTUAL_BASIS amortization with committed_pieces 40000 and no lots yet, so open_commitment_pieces is still 40000."
            - "One biocompatible stainless material spec MS-SS302-1 (240 salt-spray hours)."
            - "Design D2 in DRAFT and one tooling asset of 4800000 cents against it, still PENDING so amort_per_piece_cents is not frozen."
            - "A quote has been priced on the program for 40000 pieces of D2, which is what binds the amortization read to this tooling row."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-MED-1", customer_name: "Halcyon Medical", application_class: "MEDICAL_IMPLANT", ppap_level: 4, committed_pieces: 40000, minimum_order_quantity: 2000, required_salt_spray_hours: 240, biocompatibility_required: true, min_fatigue_margin: 1.35, required_ppk: 1.67, amortization_method: "ACTUAL_BASIS" }
              as: ProgramManager
              captures: { prog_med_id: $.data.id, prog_med_v: $.data.version }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-SS302-1", wire_material: "STAINLESS_302_A313", tensile_grade_mpa: 1650, shear_modulus_gpa: 69.0, elastic_modulus_gpa: 193.0, density_kg_per_m3: 7900, coating: "PASSIVATED", salt_spray_hours: 240, biocompatible: true, cost_per_kg_cents: 2200 }
              as: DesignEngineer
              captures: { ms_ss_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_med_id}", material_spec_id: "${ms_ss_id}", part_number: "D2-MED", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 1.2, outer_diameter_mm: 10.0, free_length_mm: 24.0, active_coils: 6, max_working_load_n: 25, min_working_load_n: 8, cycle_seconds_per_piece: 2.4, shot_peening_required: false }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d2_id: $.data.id }
            - call: "POST /tooling-assets"
              payload: { design_id: "${d2_id}", tool_code: "TL-D2", original_cost_cents: 4800000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_d2_id: $.data.id }
            - call: "POST /customer-programs/${prog_med_id}/quote"
              payload: { design_id: "${d2_id}", quoted_qty: 40000, expected_program_version: "${prog_med_v}" }
              as: ProgramManager
          trigger:
            - call: "GET /customer-programs/${prog_med_id}/tooling-amortization"
              payload: { piece_count: 2000 }
              as: ProgramManager
          assert:
            - "response amortization_method == ACTUAL_BASIS"
            - "response tooling_asset_id == ${tool_d2_id}"
            - "response original_cost_cents == 4800000 and response recovered_cents == 0 and response unamortized_cents == 4800000"
            - "response open_commitment_pieces == 40000"
            - "response forecast_basis_recovery_cents == 240000"
            - "response actual_basis_recovery_cents == 360000"
            - "response actual_basis_recovery_cents - response forecast_basis_recovery_cents == 120000"
            - "ToolingAsset.${tool_d2_id}.recovered_cents == 0 (a read posts nothing to the ledger)"

  - rule_id: combinatorial_formula
    instances:

      - name: wire_reservation_pinned_rounding_order_mode_b
        grounds:
          - calculations.wire_mass_required
          - calculations.wire_mass_per_piece
          - entities.SpringDesign.fields.wire_mass_per_piece_kg
          - entities.ProductionRun.fields.wire_reserved_kg
          - entities.WireLot.fields.on_hand_kg
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity. The per-piece mass MUST be rounded to exactly 6 dp and stored on
          the design BEFORE it is scaled: 0.021185 * 10000 * 1.03 rounds to 218.206 kg, whereas carrying the
          unrounded 0.0211849... through the scale-and-inflate and rounding only at the end yields 218.205 kg.
          The reserved and on-hand figures therefore discriminate the pinned order from the forbidden one by
          exactly 0.001 kg.
        test_recipe:
          setup:
            - "Design D1 (mass_pp 0.021185 kg) PROTOTYPE_RELEASED under an AUTOMOTIVE_SAFETY program, on coiler COIL-1 with an ACTIVE setup."
            - "Wire heat lot HT-500 of MS-CRSI-1 received at 500.000 kg and CERTIFIED at 1930 MPa."
            - "Logical clock advanced to 2026-08-05T08:30:00Z, inside the setup window."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-AUTO-1", customer_name: "Northwind Drivetrain", application_class: "AUTOMOTIVE_SAFETY", ppap_level: 3, committed_pieces: 500000, minimum_order_quantity: 25000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.33, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_auto_id: $.data.id }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-CRSI-1", wire_material: "CHROME_SILICON_A401", tensile_grade_mpa: 1900, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "ZINC_PHOSPHATE", salt_spray_hours: 96, biocompatible: false, cost_per_kg_cents: 850 }
              as: DesignEngineer
              captures: { ms_crsi_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_auto_id}", material_spec_id: "${ms_crsi_id}", part_number: "D1-AUTO", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/critical-characteristics"
              payload: { char_code: "FREE_LENGTH", nominal_value: 60.0, lsl: 59.5, usl: 60.5, is_safety_critical: true, cpk_floor: 1.333 }
              as: DesignEngineer
              captures: { cc_fl_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/submit-for-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-01"
            - call: "POST /spring-designs/${d1_id}/review"
              payload: { decision: "APPROVE_PROTOTYPE" }
              as: EngineeringManager
              as_user_id: "em-01"
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-D1", original_cost_cents: 4800000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_d1_id: $.data.id }
            - call: "POST /coiling-machines"
              payload: { machine_code: "COIL-1", max_wire_diameter_mm: 4.0, changeover_buffer_minutes: 45 }
              as: PlantAdmin
              captures: { mach1_id: $.data.id, mach1_v: $.data.version }
            - call: "POST /machine-setups"
              payload: { machine_id: "${mach1_id}", design_id: "${d1_id}", tooling_asset_id: "${tool_d1_id}", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_machine_version: "${mach1_v}" }
              as: ProcessTechnician
              captures: { setup1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:30:00Z" }
              as: PlantAdmin
            - call: "POST /machine-setups/${setup1_id}/activate"
              payload: {}
              as: ProcessTechnician
            - call: "POST /wire-lots"
              payload: { material_spec_id: "${ms_crsi_id}", heat_number: "HT-500", received_kg: 500.0 }
              as: QualityInspector
              captures: { wl1_id: $.data.id }
            - call: "POST /wire-lots/${wl1_id}/certify"
              payload: { tensile_test_mpa: 1930 }
              as: QualityInspector
              as_user_id: "qi-01"
          trigger:
            - call: "POST /production-runs"
              payload: { setup_id: "${setup1_id}", wire_lot_id: "${wl1_id}", design_id: "${d1_id}", planned_pieces: 10000 }
              as: ProcessTechnician
              captures: { run1_id: $.data.id }
          assert:
            - "SpringDesign.${d1_id}.wire_mass_per_piece_kg == 0.021185"
            - "ProductionRun.${run1_id}.wire_reserved_kg == 218.206"
            - "ProductionRun.${run1_id}.wire_reserved_kg != 218.205 (the forbidden single-rounding order)"
            - "WireLot.${wl1_id}.reserved_kg == 218.206"
            - "WireLot.${wl1_id}.on_hand_kg == 281.794"
            - "WireLot.${wl1_id}.consumed_kg == 0.000"
            - "ProductionRun.${run1_id}.process_status == FAI_PENDING and ProductionRun.${run1_id}.quality_status == OPEN"

      - name: quote_pinned_evaluation_order_mode_c
        grounds:
          - calculations.program_quote_pricing
          - entities.CustomerProgram.fields.quoted_pre_discount_subtotal_cents
          - entities.CustomerProgram.fields.quoted_volume_discount_pct
          - entities.CustomerProgram.fields.quoted_tooling_amort_per_piece_cents
          - entities.CustomerProgram.fields.quoted_unit_price_cents
          - entities.CustomerProgram.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (c) — evaluation-order sensitivity, a different mode from the rounding-order instance above. The
          volume tier is keyed on the step-4 PRE-discount subtotal (21.2573 * 2352 -> 49997 cents, below the 50000
          breakpoint, so 0.00) while the tooling-amortization cap is keyed on the step-6 POST-discount unit price
          (floor(0.25 * 21.2573) = 5). Evaluating the tier after amortization was folded in (26 * 2352 = 61152)
          would cross the breakpoint and produce discount 0.03 and total 186178 instead of 186152.
        test_recipe:
          setup:
            - "An INDUSTRIAL program on FORECAST_BASIS with committed_pieces 100000, freshly created so its version is the one the quote will present."
            - "Material spec MS-CRSI-1 at 850 cents/kg and design D1 (mass_pp 0.021185 kg, cycle 1.8 s) in DRAFT."
            - "One tooling asset of 4800000 unamortized cents against D1."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-IND-2", customer_name: "Bramble Industrial Supply", application_class: "INDUSTRIAL", ppap_level: 1, committed_pieces: 100000, minimum_order_quantity: 2000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.0, required_ppk: 1.0, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_ind_id: $.data.id, prog_ind_v: $.data.version }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-CRSI-1", wire_material: "CHROME_SILICON_A401", tensile_grade_mpa: 1900, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "ZINC_PHOSPHATE", salt_spray_hours: 96, biocompatible: false, cost_per_kg_cents: 850 }
              as: DesignEngineer
              captures: { ms_crsi_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_ind_id}", material_spec_id: "${ms_crsi_id}", part_number: "D1-IND", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-D1", original_cost_cents: 4800000 }
              as: EngineeringManager
              as_user_id: "em-01"
          trigger:
            - call: "POST /customer-programs/${prog_ind_id}/quote"
              payload: { design_id: "${d1_id}", quoted_qty: 2352, expected_program_version: "${prog_ind_v}" }
              as: ProgramManager
          assert:
            - "CustomerProgram.${prog_ind_id}.quoted_qty == 2352"
            - "CustomerProgram.${prog_ind_id}.quoted_pre_discount_subtotal_cents == 49997"
            - "CustomerProgram.${prog_ind_id}.quoted_volume_discount_pct == 0.00"
            - "CustomerProgram.${prog_ind_id}.quoted_tooling_amort_per_piece_cents == 5"
            - "CustomerProgram.${prog_ind_id}.quoted_unit_price_cents == 26"
            - "CustomerProgram.${prog_ind_id}.quoted_total_cents == 186152"
            - "CustomerProgram.${prog_ind_id}.quoted_total_cents != 186178 (the order that keys the tier on the amortized unit price)"
            - "CustomerProgram.${prog_ind_id}.version == ${prog_ind_v} + 1"

  - rule_id: non_linear_state_machine
    instances:

      - name: production_run_parallel_axes_move_independently
        grounds:
          - state_machines.ProductionRun.OPEN_to_SPC_HOLD
          - state_machines.ProductionRun.SPC_HOLD_to_OPEN
          - state_machines.ProductionRun.RUNNING_to_COMPLETE
          - entities.ProductionRun.fields.process_status
          - entities.ProductionRun.fields.quality_status
          - validations[priority=23]
          - calculations.process_capability
        distinguishing_aspect: |
          ProductionRun is a PARALLEL machine: process_status and quality_status advance on independent axes, so a
          single run traverses RUNNING x OPEN -> RUNNING x SPC_HOLD -> RUNNING x OPEN -> COMPLETE x OPEN, and the
          combined state (not either axis alone) decides whether /complete is admissible — the same RUNNING run is
          rejected with ERR_RUN_ON_SPC_HOLD while the quality axis sits on SPC_HOLD and accepted once it returns to OPEN.
        test_recipe:
          setup:
            - "Design D1 PROTOTYPE_RELEASED with one safety-critical FREE_LENGTH characteristic (nominal 60.0, LSL 59.5, USL 60.5, cpk_floor 1.333)."
            - "Coiler COIL-1 with an ACTIVE setup and a CERTIFIED 500.000 kg heat lot; a 1000-piece run whose first article was ACCEPTED by a second inspector, so process_status is RUNNING and quality_status is OPEN."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-AUTO-1", customer_name: "Northwind Drivetrain", application_class: "AUTOMOTIVE_SAFETY", ppap_level: 3, committed_pieces: 500000, minimum_order_quantity: 25000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.33, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_auto_id: $.data.id }
            - call: "POST /material-specs"
              payload: { spec_code: "MS-CRSI-1", wire_material: "CHROME_SILICON_A401", tensile_grade_mpa: 1900, shear_modulus_gpa: 79.3, elastic_modulus_gpa: 203.0, density_kg_per_m3: 7850, coating: "ZINC_PHOSPHATE", salt_spray_hours: 96, biocompatible: false, cost_per_kg_cents: 850 }
              as: DesignEngineer
              captures: { ms_crsi_id: $.data.id }
            - call: "POST /spring-designs"
              payload: { program_id: "${prog_auto_id}", material_spec_id: "${ms_crsi_id}", part_number: "D1-AUTO", form_type: "COMPRESSION", end_type: "CLOSED_GROUND", wire_diameter_mm: 2.5, outer_diameter_mm: 20.0, free_length_mm: 60.0, active_coils: 8, max_working_load_n: 150, min_working_load_n: 50, cycle_seconds_per_piece: 1.8, shot_peening_required: true }
              as: DesignEngineer
              as_user_id: "de-01"
              captures: { d1_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/critical-characteristics"
              payload: { char_code: "FREE_LENGTH", nominal_value: 60.0, lsl: 59.5, usl: 60.5, is_safety_critical: true, cpk_floor: 1.333 }
              as: DesignEngineer
              captures: { cc_fl_id: $.data.id }
            - call: "POST /spring-designs/${d1_id}/submit-for-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-01"
            - call: "POST /spring-designs/${d1_id}/review"
              payload: { decision: "APPROVE_PROTOTYPE" }
              as: EngineeringManager
              as_user_id: "em-01"
            - call: "POST /tooling-assets"
              payload: { design_id: "${d1_id}", tool_code: "TL-D1", original_cost_cents: 4800000 }
              as: EngineeringManager
              as_user_id: "em-01"
              captures: { tool_d1_id: $.data.id }
            - call: "POST /coiling-machines"
              payload: { machine_code: "COIL-1", max_wire_diameter_mm: 4.0, changeover_buffer_minutes: 45 }
              as: PlantAdmin
