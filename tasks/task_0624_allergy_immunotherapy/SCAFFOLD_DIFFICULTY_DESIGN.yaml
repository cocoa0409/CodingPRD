              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-500", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
