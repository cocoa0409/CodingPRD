              as: Coordinator
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${a2_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T15:00:00Z", scheduled_end: "2026-05-02T16:00:00Z" }
