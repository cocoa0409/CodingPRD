            - call: "GET /duct-sealing/seal-jobs?limit=1&offset=1"
              as: ProgramAdmin
              captures: { page2_id: "$.data[0].id" }
            - call: "GET /duct-sealing/seal-jobs?limit=0"
              as: ProgramAdmin
              captures: { err_limit: $.data.error_id }
