# =============================================================================
# Task 1899 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules, 22 instances. Every chain replays against SCAFFOLD.yaml
# §1.2 / §1.4 / §1.5 / §1.6. Logical clock default: 2026-08-01T00:00:00Z.
# Pinned operator ids: spec-1/spec-2 (CredentialingSpecialist), ver-1/ver-2
# (PrimarySourceVerifier), mgr-1 (NurseManager), co-1/co-2 (ComplianceOfficer),
# ops-1 (SystemOperator).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: competency_expiry_rolling_vs_fiscal_divergence
        grounds:
          - calculations.competency_expiry_date
          - entities.CompetencyCompletion.fields.expires_on
          - entities.CompetencyRequirement.fields.window_mode
        distinguishing_aspect: |
          Entity domain = CompetencyCompletion (competency/annual requirements), distinct from the
          AuditRun domain of the sibling instance. The ROLLING and FISCAL variants of
          competency_expiry_date return different expires_on values (2027-07-15 vs 2027-06-30)
          for the identical completed_on 2026-07-15.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a ROLLING 12-month requirement and a FISCAL 12-month requirement exist; one STAFF nurse exists."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ROLLING12", name: "Rolling Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_roll_id: "$.data.id" } }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "FISCAL12", name: "Fiscal Annual Skills", validity_months: 12, window_mode: "FISCAL", mandatory: true, applies_to: ["STAFF"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_fisc_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Dana Roll", email: "dana.roll@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_roll_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}", captures: { c_roll_id: "$.data.id" } }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_fisc_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}", captures: { c_fisc_id: "$.data.id" } }
          assert:
            - "CompetencyCompletion.${c_roll_id}.expires_on == '2027-07-15' (ROLLING: 2026-07-15 + 12 months)"
            - "CompetencyCompletion.${c_fisc_id}.expires_on == '2027-06-30' (FISCAL: first 06-30 >= 2026-07-15)"
            - "Identical completed_on '2026-07-15' produces divergent expires_on across the two variants"

      - name: audit_validity_rate_point_in_time_vs_shift_incidence
        grounds:
          - calculations.nurse_credential_validity_rate
          - entities.AuditRun.fields.point_in_time_rate
          - entities.AuditRun.fields.shift_incidence_rate
        distinguishing_aspect: |
          Entity domain = AuditRun/survey-rates, distinct from the CompetencyCompletion domain of
          the sibling instance. POINT_IN_TIME (slot validity as of window_end) yields 66.67 while
          SHIFT_INCIDENCE (was_clear_at_start over completed shifts) yields 100.0 for identical data,
          because the nurse's BLS expired after her shifts ran.
        test_recipe:
          setup:
            - "Unit MED-SURG exists (no required certs); nurse Evelyn is fully credentialed and ACTIVE with BLS expiring 2026-07-31; two shifts ran 2026-07-10 and 2026-07-20 while she was CLEAR; clock is 2026-08-15; an audit run over 2026-07-01..2026-08-15 with sample size 10 is in FIELD_WORK with Evelyn sampled."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED-SURG", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Evelyn Audit", email: "evelyn.audit@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-06-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-EV1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-01", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2025-08-01", expires_on: "2026-07-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-06-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-07-10T07:00:00Z", ends_at: "2026-07-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh1_id: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-07-20T07:00:00Z", ends_at: "2026-07-20T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh2_id: "$.data.id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T07:30:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/shift-assignments/${sh1_id}/start", payload: {}, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/shift-assignments/${sh1_id}/complete", payload: {}, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T07:30:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/shift-assignments/${sh2_id}/start", payload: {}, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/shift-assignments/${sh2_id}/complete", payload: {}, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/audit-runs", payload: { window_start: "2026-07-01", window_end: "2026-08-15", per_unit_sample_size: 10 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { run_id: "$.data.id" } }
            - { call: "POST /credentialing/audit-runs/${run_id}/begin-fieldwork", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credentialing/audit-runs/${run_id}/issue-findings", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          assert:
            - "AuditRun.${run_id}.point_in_time_rate == 66.67 (pooled slots: license valid to 2027-06-30, competency valid to 2027-06-15, BLS expired 2026-07-31 < window_end 2026-08-15 -> 2/3)"
            - "AuditRun.${run_id}.shift_incidence_rate == 100.0 (2 of 2 completed shifts in window have was_clear_at_start == true)"
            - "point_in_time_rate != shift_incidence_rate for identical underlying data"
            - "Exactly 1 AuditFinding exists for the run with finding_type CERTIFICATION_NOT_CURRENT_IN_WINDOW and nurse_id == ${n_id}"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: packet_readiness_score_critical_cap
        grounds:
          - calculations.packet_readiness_score
          - entities.PacketItem.fields.critical
          - entities.CredentialPacket.fields.readiness_score
        distinguishing_aspect: |
          Mode (a): a formula with 5 weighted inputs, status-dependent credit mapping, a conditional
          item set driven by unit requirements, and a nested min() critical cap keyed on item state.
          The critical ACLS item being MISSING clamps the score to 0.49 although the raw weighted
          mean is 0.775.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement exists; unit ICU requires ACLS; travel nurse Tessa is ACTIVE/CLEAR with an ACTIVE AZ multistate license, ACTIVE BLS, CURRENT competency, but NO ACLS cert; a packet targeting ICU exists with its 5 items materialized; all items except ACLS are VERIFIED, ATTESTATION is WAIVED."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "ICU", required_cert_types: ["ACLS"] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Tessa Cap", email: "tessa.cap@x.com", primary_state_of_residence: "AZ", employment_type: "TRAVEL", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-TC1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/credential-packets", payload: { nurse_id: "${n_id}", target_unit_id: "${unit_id}" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { pkt_id: "$.data.id" } }
            - { call: "GET /credentialing/packet-items?packet_id=${pkt_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { item_lv: "$.data[0].id", item_bls: "$.data[1].id", item_acls: "$.data[2].id", item_comp: "$.data[3].id", item_att: "$.data[4].id" } }
            - { call: "POST /credentialing/packet-items/${item_lv}/submit-evidence", payload: { evidence_ref: "lic-ev-1" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_bls}/submit-evidence", payload: { evidence_ref: "bls-ev-1" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_comp}/submit-evidence", payload: { evidence_ref: "comp-ev-1" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_att}/submit-evidence", payload: { evidence_ref: "attest-form-1" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/packet-items/${item_lv}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_bls}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_comp}/verify", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/packet-items/${item_att}/waive", payload: { waive_reason: "attestation on file" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "GET /credentialing/credential-packets/${pkt_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "CredentialPacket.${pkt_id}.readiness_score == 0.49 (raw = (40*1 + 20*1 + 20*0 + 15*1 + 5*0.5)/100 = 0.775; critical ACLS item MISSING -> min(0.775, 0.49))"
            - "PacketItem.${item_acls}.status == 'MISSING' and PacketItem.${item_acls}.critical == true"

      - name: survey_projection_per_stratum_rounding
        grounds:
          - calculations.survey_deficiency_projection
          - entities.AuditRun.fields.projected_deficiency_count
        distinguishing_aspect: |
          Mode (b) nested rounding order: the scaffold pins per-stratum round_half_up(...,2) BEFORE
          summation, then a final integer rounding of the sum. Strata 2.5 (unit A: 1/2 x 5) and 1.5
          (unit B: 1/2 x 3) sum to 4.0 -> 4; the integer-first ordering would yield round(2.5)=3 +
          round(1.5)=2 = 5. The two orderings disagree, and the pinned one MUST win.
        test_recipe:
          setup:
            - "Clock starts 2026-07-01; mandatory ROLLING requirement exists; units UNIT-A and UNIT-B (created in that order, no required certs). Unit A has 5 nurses (A1..A5) and unit B has 3 nurses (B1..B3), each fully credentialed and ACTIVE with a completed 12h shift on 2026-07-06; A1 and B1 additionally completed a second shift on 2026-07-07 and hold BLS certs expiring 2026-07-20 (all other BLS certs expire 2027-03-31). An audit run over 2026-07-01..2026-08-01 with per_unit_sample_size 2 is in FIELD_WORK."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "UNIT-A", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_a: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "UNIT-B", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_b: "$.data.id" } }
            # --- Unit A nurses (A1 deficient: BLS expires 2026-07-20) ---
            - { call: "POST /credentialing/nurses", payload: { full_name: "Nurse A1", email: "a1@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-06-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_a1: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a1}", state_code: "AZ", license_number: "RN-AZ-A1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-01", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a1: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_a1}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_a1}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_a1: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_a1}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_a1}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_a1}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2025-07-20", expires_on: "2026-07-20" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_a1}", requirement_id: "${req_id}", completed_on: "2026-06-15" }, as: Nurse, as_user_id: "${n_a1}" }
            - { call: "POST /credentialing/nurses/${n_a1}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Nurse A2", email: "a2@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-06-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_a2: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a2}", state_code: "AZ", license_number: "RN-AZ-A2", license_class: "RN", multistate_flag: true, issued_on: "2026-06-01", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a2: "$.data.id" } }
