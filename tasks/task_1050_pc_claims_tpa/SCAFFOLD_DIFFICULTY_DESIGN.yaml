# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. All grounds resolve to
# SCAFFOLD.yaml §1.1-§1.7. All numeric asserts pre-computed as literals.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: claim_incurred_provisional_vs_developed
        grounds:
          - calculations.claim_incurred
          - entities.Claim.fields.gross_incurred_cents
        distinguishing_aspect: "On one Claim with paid_total=600000 and zero case reserve, provisional gross incurred (600000) differs from developed gross incurred (690000) because the developed basis floors outstanding at round_half_up(paid_total*0.15)=90000."
        test_recipe:
          setup:
            - "Account + ACTIVE policy + ACTIVE adjuster (authority 5000000)."
            - "Claim assigned; indemnity reserve raised to 600000; one indemnity payment of 600000 approved and ISSUED, so paid_indemnity=600000 and indemnity_reserve back to 0."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "DV1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-DV1", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { asg_id: $.data.id }
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 600000, reason: "set", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 600000, expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "ISSUED" }
              as: FinanceOfficer
          trigger:
            - call: "GET /claims/${claim_id}/financials"
              as: ClaimsManager
          assert:
            - "response.data.paid_total_cents == 600000"
            - "response.data.outstanding_reserve_cents == 0"
            - "response.data.gross_incurred_provisional_cents == 600000"
            - "response.data.gross_incurred_developed_cents == 690000"
            - "response.data.net_incurred_cents == 600000"

      - name: subrogation_recovery_prorata_vs_indemnity_first
        grounds:
          - calculations.subrogation_recovery_allocation
          - state_machines.SubrogationCase.NEGOTIATING_to_RECOVERED
          - entities.Claim.fields.recovered_indemnity_cents
        distinguishing_aspect: "On a Claim with paid_indemnity=600000 and paid_expense=400000, an INDEMNITY_FIRST recovery of 500000 credits recovered_indemnity=500000 / recovered_expense=0, whereas PRO_RATA would credit 300000/200000 — allocation lives on the SubrogationCase, a different entity domain than claim loss-reserving."
        test_recipe:
          setup:
            - "Claim assigned; paid_indemnity=600000 via an issued indemnity payment; paid_expense=400000 via an approved+paid vendor invoice (materials 400000)."
            - "SubrogationCase advanced OPEN->DEMAND_SENT->NEGOTIATING."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "DV2", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-DV2", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "IA Co", vendor_type: "INDEPENDENT_ADJUSTER", credentialed_coverages: ["PROPERTY","AUTO","LIABILITY","WORKERS_COMP"] }
              as: ClaimsManager
              captures: { vendor_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "VENDOR", vendor_id: "${vendor_id}", scope: "APPRAISAL", inspection_start: "2026-06-17T09:00:00Z", inspection_end: "2026-06-17T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { vasg_id: $.data.id }
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 600000, reason: "set", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v2: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 600000, expected_claim_version: "${v2}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "APPROVED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "ISSUED" }
              as: FinanceOfficer
            - call: "POST /vendor-invoices"
              payload: { claim_id: "${claim_id}", assignment_id: "${vasg_id}", hours: 0, miles: 0, materials_cents: 400000 }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /vendor-invoices/${inv_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ClaimsManager
            - call: "POST /vendor-invoices/${inv_id}/transition"
              payload: { to_status: "PAID" }
              as: FinanceOfficer
            - call: "POST /subrogation-cases"
              payload: { claim_id: "${claim_id}", at_fault_party: "X", demand_cents: 800000 }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subrogation-cases/${sub_id}/transition"
              payload: { to_status: "DEMAND_SENT" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /subrogation-cases/${sub_id}/transition"
              payload: { to_status: "NEGOTIATING" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v3: $.data.version }
            - call: "POST /subrogation-cases/${sub_id}/transition"
              payload: { to_status: "RECOVERED", recovered_cents: 500000, allocation_method: "INDEMNITY_FIRST", expected_claim_version: "${v3}" }
              as: FinanceOfficer
          assert:
            - "SubrogationCase.${sub_id}.recovered_cents == 500000"
            - "SubrogationCase.${sub_id}.allocation_method == INDEMNITY_FIRST"
            - "Claim.${claim_id}.recovered_indemnity_cents == 500000"
            - "Claim.${claim_id}.recovered_expense_cents == 0"
            - "Claim.${claim_id}.recovered_cents == 500000"
            - "Claim.${claim_id}.net_incurred_cents == 500000"

  - rule_id: combinatorial_formula
    instances:
      - name: vendor_invoice_amount_tiered_clamp
        grounds:
          - calculations.vendor_invoice_amount
          - entities.VendorInvoice.fields.amount_cents
        distinguishing_aspect: "Mode (a): amount = clamp(max=5000, min=2000000) over rate_by_type(DEFENSE_ATTORNEY=35000)*hours + round(miles*55) + materials — 3+ inputs with tier selection and nested min/max; for hours=10, miles=100, materials=20000 -> 350000+5500+20000 = 375500."
        test_recipe:
          setup:
            - "Account + policy + adjuster + DEFENSE_ATTORNEY vendor credentialed for PROPERTY; claim assigned to adjuster; a VENDOR assignment exists for the vendor."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "CF1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-CF1", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Law LLP", vendor_type: "DEFENSE_ATTORNEY", credentialed_coverages: ["PROPERTY"] }
              as: ClaimsManager
              captures: { vendor_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "VENDOR", vendor_id: "${vendor_id}", scope: "DEFENSE", inspection_start: "2026-06-17T09:00:00Z", inspection_end: "2026-06-17T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { vasg_id: $.data.id }
          trigger:
            - call: "POST /vendor-invoices"
              payload: { claim_id: "${claim_id}", assignment_id: "${vasg_id}", hours: 10, miles: 100, materials_cents: 20000 }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "VendorInvoice.${inv_id}.amount_cents == 375500"
            - "VendorInvoice.${inv_id}.status == SUBMITTED"

      - name: bordereau_rounding_order_per_claim_first
        grounds:
          - calculations.bordereau_totals
          - entities.BordereauReport.fields.total_incurred_dollars
        distinguishing_aspect: "Mode (b): two claims each with gross_incurred_cents=150 give round_half_up(1.50)=2 per claim, summed = 4; sum-then-round would give round_half_up(300/100)=3. The pinned round-per-claim-then-sum order yields total_incurred_dollars=4, differing from instance (a)'s tiered-clamp mode."
        test_recipe:
          setup:
            - "One account; two PROPERTY claims (reported 2026-06-15), each assigned to the same adjuster on non-overlapping windows, each with indemnity reserve raised to 150."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "CF2", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-CF2", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "A", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_a}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T10:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "B", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_b}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T13:00:00Z", inspection_end: "2026-06-16T14:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_a}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { va: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_a}", reserve_type: "INDEMNITY", delta_cents: 150, reason: "set", expected_claim_version: "${va}" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_b}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { vb: $.data.version }
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_b}", reserve_type: "INDEMNITY", delta_cents: 150, reason: "set", expected_claim_version: "${vb}" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "POST /bordereau-reports"
              payload: { client_account_id: "${acct_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "PROVISIONAL" }
              as: ClaimsManager
              captures: { rpt_id: $.data.id }
          assert:
            - "BordereauReport.${rpt_id}.total_claim_count == 2"
            - "BordereauReport.${rpt_id}.total_incurred_dollars == 4"
            - "BordereauReport.${rpt_id}.total_paid_dollars == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_reopen_cycle_closed_reopened_closed
        grounds:
          - state_machines.Claim.CLOSED_to_REOPENED
          - state_machines.Claim.REOPENED_to_CLOSED
        distinguishing_aspect: "Claim revisits CLOSED via the CLOSED->REOPENED->CLOSED cycle (a back edge into a prior state) — a cyclic shape a linear pipeline cannot express; on the Claim entity."
        test_recipe:
          setup:
            - "Claim assigned, INVESTIGATING, EVALUATED, then CLOSED (no litigation/subrogation/pending payments)."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "NL1", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-NL1", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "INVESTIGATING" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "EVALUATED" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "CLOSED" }
              as: Adjuster
              as_user_id: "${adj_id}"
          trigger:
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "REOPENED" }
              as: ClaimsManager
            - call: "POST /claims/${claim_id}/transition"
              payload: { to_status: "CLOSED" }
              as: Adjuster
              as_user_id: "${adj_id}"
          assert:
            - "Claim.${claim_id}.status == CLOSED"

      - name: payment_branch_pending_to_rejected
        grounds:
          - state_machines.Payment.PENDING_APPROVAL_to_REJECTED
          - state_machines.Payment.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: "Payment PENDING_APPROVAL forks to {APPROVED, REJECTED} with divergent effects; taking the REJECTED branch draws no money (paid_indemnity stays 0) — a branching shape on the Payment entity, distinct from the Claim cycle."
        test_recipe:
          setup:
            - "Claim assigned; one indemnity payment created (PENDING_APPROVAL)."
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "NL2", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-NL2", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
            - call: "POST /payments"
              payload: { claim_id: "${claim_id}", payment_type: "INDEMNITY", payee_type: "CLAIMANT", payee_name: "CN", amount_cents: 300000, expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/transition"
              payload: { to_status: "REJECTED" }
              as: ClaimsManager
          assert:
            - "Payment.${pay_id}.status == REJECTED"
            - "Claim.${claim_id}.paid_indemnity_cents == 0"

  - rule_id: transitive_cascade
    instances:
      - name: claim_close_cancels_assignment_voids_vendor_invoice
        grounds:
          - state_machines.Claim.EVALUATED_to_CLOSED
          - state_machines.Assignment.ACTIVE_to_CANCELLED
          - state_machines.VendorInvoice.APPROVED_to_VOID
        distinguishing_aspect: "Depth-3 chain from Claim close: close -> vendor Assignment CANCELLED (link1) -> that assignment's APPROVED VendorInvoice VOID (link2) -> expense-reserve release + account rollup (link3); each hop is caused by the prior hop (close never voids the invoice directly)."
        test_recipe:
          setup:
            - "Claim assigned to an adjuster; a VENDOR assignment exists; the vendor submitted an invoice (materials 300000) that was APPROVED (expense_reserve earmarked 300000); claim advanced to EVALUATED; no pending payments/litigation/subrogation."
          setup_api_calls:
            - call: "POST /client-accounts"
