              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /demurrage/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { inv_v: $.data.version }
            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "RAILROAD_CAUSED_DELAY", narrative: "The crew never showed.", claimed_credit_cents: 20000, expected_invoice_version: "${inv_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /demurrage/disputes/${dsp_id}/evidence"
              payload: { evidence_type: "SWITCH_LIST", observed_at: "2026-08-08T00:00:00Z", description: "Switch list." }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-c9r3-a"
          trigger:
