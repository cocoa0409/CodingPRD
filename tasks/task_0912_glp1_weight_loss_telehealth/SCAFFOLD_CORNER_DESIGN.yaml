  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: response_envelope_shape_on_object_and_array_reads
        claim_type: computed_read
        grounds:
          - endpoints[GET /glp1/patients/{patient_id}]
          - endpoints[GET /glp1/screenings]
        distinguishing_aspect: "Every response carries meta.api_request_id and meta.api_request_timestamp, response_type object for a single read and array for a list read, with the payload under data."
        test_recipe:
          setup:
            - "One patient and one DRAFT screening exist."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "env1@example.com", full_name: "Env One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710014001" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /glp1/screenings"
              payload: { patient_id: "${p_id}" }
              as: PlatformAdmin
              captures: { first_screening: "$.data[0].id" }
          assert:
            - "the single read returns response_type == object with data.id == ${p_id}"
            - "the list read returns response_type == array with total_count == 1, limit == 10, offset == 0 and has_more == false"
            - "both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: pagination_limit_above_maximum_rejected
        claim_type: standard_crud
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[GET /glp1/supply-lots]
        distinguishing_aspect: "GET /glp1/supply-lots with limit 101 is refused with ERR_VALIDATION because the declared maximum is 100, while limit 100 succeeds."
        test_recipe:
          setup:
            - "One pharmacy with one lot exists."
          setup_api_calls:
            - call: "POST /glp1/pharmacies"
              payload: { name: "Bay Compounding", dispense_type: "COMPOUNDED", served_state_codes: ["CA"], status: "ACTIVE" }
              as: PlatformAdmin
              captures: { ph_id: "$.data.id" }
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "PG-1", strength_mg: 0.25, total_units: 5, window_capacity_units: 5, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "GET /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", limit: 101 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", limit: 100 }
              as: PlatformAdmin
          assert:
            - "the limit 101 call returns HTTP 400 with error_id ERR_VALIDATION"
            - "the limit 100 call returns HTTP 200 with total_count == 1"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_collection_scoped_not_found_errors
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_CLINICAL_RECORD_NOT_FOUND]
          - errors[ERR_FULFILLMENT_RECORD_NOT_FOUND]
          - errors[ERR_BILLING_RECORD_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "Each collection group maps to its own 404 code: an unknown provider_id in a consult body yields ERR_PROVIDER_NOT_FOUND, an unknown prescription path id yields ERR_CLINICAL_RECORD_NOT_FOUND, an unknown pharmacy order yields ERR_FULFILLMENT_RECORD_NOT_FOUND and an unknown subscription yields ERR_BILLING_RECORD_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z with exactly one patient enrolled and nothing else."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "nf1@example.com", full_name: "Nf One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", scheduled_start_at: "2026-06-03T15:00:00Z", scheduled_end_at: "2026-06-03T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { e_provider: "$.data.error_id" }
            - call: "GET /glp1/prescriptions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
              payload: {}
              as: PlatformAdmin
              captures: { e_clinical: "$.data.error_id" }
            - call: "GET /glp1/pharmacy-orders/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
              payload: {}
              as: PlatformAdmin
              captures: { e_fulfillment: "$.data.error_id" }
            - call: "GET /glp1/subscriptions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
              payload: {}
              as: PlatformAdmin
              captures: { e_billing: "$.data.error_id" }
          assert:
            - "the consult call returns HTTP 404 with error_id ERR_PROVIDER_NOT_FOUND"
            - "the prescription read returns HTTP 404 with error_id ERR_CLINICAL_RECORD_NOT_FOUND"
            - "the pharmacy order read returns HTTP 404 with error_id ERR_FULFILLMENT_RECORD_NOT_FOUND"
            - "the subscription read returns HTTP 404 with error_id ERR_BILLING_RECORD_NOT_FOUND"

      - name: error_no_eligible_supply_lot_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ELIGIBLE_SUPPLY_LOT]"]
        excluded_because:
          difficulty_instance: zero_available_units_yields_empty_routing_pool
          rationale: "Triggered there as the empty-candidate-set boundary."

      - name: error_lot_capacity_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: supply_lot_windowed_aggregate_capacity
          rationale: "Triggered there by the overlapping-window aggregate cap."

      - name: error_consult_slot_conflict_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONSULT_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: consult_fifteen_minute_buffer_on_provider_calendar
          rationale: "Triggered there by the 14-minute gap booking."

      - name: error_coach_slot_conflict_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_COACH_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: coaching_zero_buffer_adjacency_on_coach_calendar
          rationale: "Triggered there by the one-minute overlap booking."

      - name: error_appeal_limit_reached_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: prior_authorization_denial_appeal_cycle_bounded_at_two
          rationale: "Triggered there by the third appeal."

      - name: error_prior_auth_required_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRIOR_AUTH_REQUIRED]"]
        excluded_because:
          difficulty_instance: branded_shipment_requires_approved_prior_authorization
          rationale: "Triggered there by shipping before the payer decision."

      - name: error_open_escalated_check_in_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_ESCALATED_CHECK_IN]"]
        excluded_because:
          difficulty_instance: escalation_blocked_by_open_escalated_check_in
          rationale: "Triggered there while the score-7 report is still open."

      - name: error_titration_interval_not_met_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_TITRATION_INTERVAL_NOT_MET]"]
        excluded_because:
          difficulty_instance: titration_interval_exactly_twenty_eight_days_permits_escalation
          rationale: "Triggered there at 27 whole days elapsed."

      - name: error_screening_not_eligible_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCREENING_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: prescription_creation_requires_eligible_screening
          rationale: "Triggered there by the INELIGIBLE screening."

      - name: error_prescription_not_active_is_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRESCRIPTION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: state_beats_business_constraint_on_order_creation
          rationale: "Triggered there against the HELD prescription."

