              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { stop_status: $.data.status }
          assert:
            - "${tot} == 866404"
            - "${drawn_before} == 20000"
            - "${stop_status} == SHORTED"
            - "Order.${order_id}.fulfillment_status == SHORT_SHIPPED"
            - "Order.${order_id}.short_ship_lb == 8000"
            - "Order.${order_id}.delivered_on == 2026-09-15T00:00:00Z"
            - "Order.${order_id}.pricing_status == PROVISIONAL"
            - "Order.${order_id}.total_cents == 866404"
            - "ContractLine.${cl_id}.volume_drawn_lb == 12000"
            - "ContractLine.${cl_id}.volume_committed_lb == 50000"
            - "ForwardPricingContract.${contract_id}.drawn_volume_lb == 12000"
            - "ForwardPricingContract.${contract_id}.committed_volume_lb == 50000"
            - "ForwardPricingContract.${contract_id}.status == ACTIVE"
            - "50000 - 12000 == 38000 pounds of commitment remain undrawn"
            - "Lot.${lot_id}.quantity_consumed_lb == 12000"
            - "Lot.${lot_id}.quantity_on_hand_lb == 38000"
            - "Lot.${lot_id}.quantity_reserved_lb == 0"
            - "Lot.${lot_id}.quantity_received_lb == 50000"
            - "OrderLine.${line_id}.allocation_status == SHIPPED"
            - "DeliveryRoute.${route_id}.status == COMPLETED"
            - "Customer.${cust_id}.allergen_risk_score == 55.00"
            - "Customer.${cust_id}.risk_tier == AMBER"

      - name: conserved_open_credit_exposure_cents_survives_limit_cut_and_is_released_by_cancel
        grounds:
          - calculations.customer_open_exposure
          - state_machines.Order.PROVISIONAL_to_VOID
          - entities.Customer.fields.open_exposure_cents
          - entities.Customer.fields.credit_limit_cents
          - entities.Customer.fields.status
        distinguishing_aspect: |
          Conserved quantity #3 = OPEN CREDIT EXPOSURE CENTS, a money ledger rather than pounds, and
          it is exercised in BOTH directions of the status guard: exposure 827022 is unchanged by an
          AccountManager cutting credit_limit_cents 1000000 -> 500000 (the ledger tracks orders, not
          limits) yet that alone flips ACTIVE -> CREDIT_HOLD, and the compensating cancel drops the
          order to pricing_status VOID so exposure returns to exactly 0 and the customer walks back
          CREDIT_HOLD -> ACTIVE. An implementation that decrements exposure incrementally, or that
          treats CREDIT_HOLD as terminal, fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Ledger Bakery ACTIVE, credit_limit_cents 1000000, min_drop_cents 25000, open_exposure_cents 0."
            - "Flour SKU FLR-HRW-50 (GLUTEN, list 42, index NONE); no lot is needed because the order is never allocated."
            - "One BAGGED order with a single 20000 lb flour line, submitted: subtotal 814800, fuel 20370, rebate 8148, total_cents 827022, so open_exposure_cents is 827022 and 827022 <= 1000000 keeps the customer ACTIVE."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Ledger Bakery", allergen_program: "STANDARD", credit_limit_cents: 1000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-HRW-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 42, min_rotation_days: 30 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { flour_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${flour_id}", quantity_lb: 20000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { tot: $.data.total_cents }
            - call: "GET /bakery-distribution/customers/${cust_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
              captures: { exp_1: $.data.open_exposure_cents, status_1: $.data.status }
          trigger:
            - call: "POST /bakery-distribution/customers/${cust_id}/credit-limit-adjustments"
              payload: { new_credit_limit_cents: 500000, reason: "terms renegotiated after a late payment" }
              as: AccountManager
              as_user_id: "am-1"
              captures: { exp_2: $.data.open_exposure_cents, status_2: $.data.status, limit_2: $.data.credit_limit_cents }
            - call: "POST /bakery-distribution/orders/${order_id}/cancel"
              payload: { cancellation_reason: "bakery released the order to free up credit" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { ps_3: $.data.pricing_status, tot_3: $.data.total_cents }
            - call: "GET /bakery-distribution/customers/${cust_id}"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
              captures: { exp_3: $.data.open_exposure_cents, status_3: $.data.status }
          assert:
            - "${tot} == 827022"
            - "${exp_1} == 827022"
            - "${status_1} == ACTIVE"
            - "${exp_2} == 827022"
            - "${limit_2} == 500000"
            - "${status_2} == CREDIT_HOLD"
            - "${ps_3} == VOID"
            - "${tot_3} == 0"
            - "${exp_3} == 0"
            - "${status_3} == ACTIVE"
            - "Order.${order_id}.fulfillment_status == CANCELLED"
            - "Order.${order_id}.subtotal_cents == 0"
            - "Order.${order_id}.fuel_surcharge_cents == 0"
            - "Order.${order_id}.volume_rebate_cents == 0"
            - "Customer.${cust_id}.credit_limit_cents == 500000"
            - "Customer.${cust_id}.open_exposure_cents == 0"
