            - "The first L-OCC2 attempt returns 412 ERR_STALE_WIRE_LOT_VERSION — not ERR_TOOL_WINDOW_CONFLICT — and the wire lot is still at version 3 with available 479.000"
            - "The refreshed attempt with the overlapping window returns 409 ERR_TOOL_WINDOW_CONFLICT and still leaves version 3"
