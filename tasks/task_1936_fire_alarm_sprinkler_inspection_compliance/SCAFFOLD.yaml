scenario: |
  1936. Fire Alarm & Sprinkler Inspection Compliance (fire protection service contractor): device inventory & inspection frequency by code (monthly/quarterly/annual), inspection scheduling & impairment notification to authority, deficiency classification (critical/noncritical) & correction deadline, tag/report submission to fire marshal portal, backflow & fire pump testing coordination, false alarm fee & cause analysis, system modification permit, service contractor licensing verification

domain_name: fire-protection-compliance
api_prefix: /fire-compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the fire protection service contractor" }
      - { name: state_license_no, type: string, source: input, description: "State contractor license number; unique across all Contractors", constraints: "globally unique (ERR_DUPLICATE_LICENSE_NO on conflict)" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Compliance posture score; starts at 1000, floor 0; recomputed by compliance_score_recompute" }
      - { name: posture, type: enum, source: computed, default: GOOD_STANDING, description: "GOOD_STANDING | PROBATION | SUSPENDED. Derived from compliance_score and open critical counts; gates child operations. See posture_derive." }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACTIVATED; DEACTIVATED contractors reject all child writes", constraints: "values: ACTIVE, DEACTIVATED" }

  - name: Technician
    parent: Contractor
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; owning contractor" }
      - { name: full_name, type: string, source: input, description: "Technician full legal name" }
      - { name: nicet_level, type: enum, source: input, description: "NICET certification level: I | II | III | IV", constraints: "values: I, II, III, IV" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; INACTIVE technicians may not be newly assigned", constraints: "values: ACTIVE, INACTIVE" }

  - name: LicenseRecord
    parent: Technician
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; technician this license belongs to" }
      - { name: license_class, type: enum, source: input, description: "ALARM | SPRINKLER | BACKFLOW | PUMP; which trade the license covers", constraints: "values: ALARM, SPRINKLER, BACKFLOW, PUMP" }
      - { name: issued_on, type: string, source: input, description: "ISO date the license was issued" }
      - { name: expires_on, type: string, source: input, description: "ISO date the license expires; must be strictly after issued_on (ERR_INVALID_DATE_RANGE)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | REVOKED; EXPIRED set by system when current date passes expires_on; REVOKED by FireMarshal", constraints: "values: ACTIVE, EXPIRED, REVOKED" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; the service contractor of record for this property" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: occupancy_class, type: enum, source: input, description: "ASSEMBLY | BUSINESS | EDUCATIONAL | MERCANTILE | RESIDENTIAL | STORAGE; drives false-alarm fee schedule variant selection", constraints: "values: ASSEMBLY, BUSINESS, EDUCATIONAL, MERCANTILE, RESIDENTIAL, STORAGE" }
      - { name: jurisdiction_code, type: string, source: input, description: "AHJ (authority having jurisdiction) code; determines marshal portal endpoint routing" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED; ARCHIVED properties excluded from scheduling sweeps", constraints: "values: ACTIVE, ARCHIVED" }

  - name: ProtectedSystem
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property containing this system" }
      - { name: system_category, type: enum, source: input, description: "FIRE_ALARM | SPRINKLER | BACKFLOW | FIRE_PUMP", constraints: "values: FIRE_ALARM, SPRINKLER, BACKFLOW, FIRE_PUMP" }
      - { name: install_date, type: string, source: input, description: "ISO date the system was placed in service; seeds first inspection due dates" }
      - { name: impairment_status, type: enum, source: computed, default: NORMAL, description: "NORMAL | IMPAIRED | OUT_OF_SERVICE; derived from open Impairments on this system" }
      - { name: certification_cycle_anchor, type: string, source: input, description: "ISO date (month/day reused annually) anchoring the certification year for proration; must be a valid calendar date in year 2000" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | DECOMMISSIONED; DECOMMISSIONED halts scheduling and cancels open events", constraints: "values: IN_SERVICE, DECOMMISSIONED" }

  - name: Device
    parent: ProtectedSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> ProtectedSystem.id; parent system" }
      - { name: device_type, type: enum, source: input, description: "SMOKE_DETECTOR | PULL_STATION | NOTIFICATION_APPLIANCE | SPRINKLER_HEAD | GAUGE_VALVE | FIRE_PUMP_CONTROLLER | BACKFLOW_ASSEMBLY | SUPERVISORY_SWITCH", constraints: "values: SMOKE_DETECTOR, PULL_STATION, NOTIFICATION_APPLIANCE, SPRINKLER_HEAD, GAUGE_VALVE, FIRE_PUMP_CONTROLLER, BACKFLOW_ASSEMBLY, SUPERVISORY_SWITCH" }
      - { name: serial_no, type: string, source: input, description: "Manufacturer serial; unique within parent system", constraints: "unique per system_id (ERR_DUPLICATE_DEVICE_SERIAL)" }
      - { name: frequency_code, type: enum, source: computed, description: "MONTHLY | QUARTERLY | ANNUAL; derived from device_type via code table (see frequency_code_lookup)" }
      - { name: next_due_date, type: string, source: computed, description: "ISO date of next required inspection; computed by next_due_recompute" }
      - { name: replaced_by_device_id, type: string, source: input, description: "FK -> Device.id; self-referential pointer when this device was replaced by another device in the same system; null if not replaced", constraints: "nullable; must reference a Device in the same system (ERR_DEVICE_REPLACEMENT_MISMATCH)" }
      - { name: status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | REPLACED | REMOVED; REPLACED/REMOVED devices excluded from due sweeps", constraints: "values: IN_SERVICE, REPLACED, REMOVED" }

  - name: InspectionPlan
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property the plan covers" }
      - { name: plan_year, type: integer, source: input, description: "Calendar year this plan covers; unique per property", constraints: "unique per property_id (ERR_DUPLICATE_PLAN_YEAR)" }
      - { name: expected_property_version, type: integer, source: input, description: "OCC field: version of Property last observed by client; server rejects stale plan creation with ERR_STALE_VERSION" }
      - { name: total_events_required, type: integer, source: computed, description: "Count of InspectionEvents required to satisfy all device frequencies in plan_year" }
      - { name: events_completed, type: integer, source: computed, default: 0, description: "Count of child InspectionEvents in COMPLETED status" }
      - { name: plan_posture, type: enum, source: computed, default: DRAFT, description: "DRAFT | SCHEDULED | IN_PROGRESS | FULFILLED | LAPSED; compound from child event states and clock", constraints: "values: DRAFT, SCHEDULED, IN_PROGRESS, FULFILLED, LAPSED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional plan fee by calendar-day proration (fee_proration provisional variant)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final plan fee by remaining-full-month proration (fee_proration final variant); populated when plan leaves DRAFT" }

  - name: InspectionEvent
    parent: InspectionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> InspectionPlan.id; owning plan" }
      - { name: system_id, type: string, source: input, description: "FK -> ProtectedSystem.id; system under inspection (must belong to plan's property)" }
      - { name: lead_technician_id, type: string, source: input, description: "FK -> Technician.id; assigned lead technician" }
      - { name: scheduled_start, type: string, source: input, description: "ISO datetime the inspection begins" }
      - { name: scheduled_end, type: string, source: input, description: "ISO datetime the inspection ends; must be strictly after scheduled_start (ERR_INVALID_DATE_RANGE)" }
      - { name: completed_at, type: string, source: system, description: "ISO datetime stamped by system on completion; null until COMPLETED", constraints: "nullable" }
      - { name: report_due_date, type: string, source: computed, description: "completed date + MARSHAL_REPORT_WINDOW_DAYS calendar days; null until COMPLETED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | NO_ACCESS; see state machine", constraints: "values: SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, NO_ACCESS" }

  - name: Deficiency
    parent: InspectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> InspectionEvent.id; inspection that found this deficiency" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device found deficient (must belong to the event's system)" }
      - { name: classification, type: enum, source: input, description: "CRITICAL | NONCRITICAL", constraints: "values: CRITICAL, NONCRITICAL" }
      - { name: correction_deadline, type: string, source: computed, description: "ISO date: event completion date + CRITICAL_CORRECTION_DAYS (critical) or + NONCRITICAL_CORRECTION_DAYS (noncritical); extended once for NONCRITICAL via approved extension" }
      - { name: extension_used, type: boolean, source: system, default: false, description: "True once a NONCRITICAL extension has been granted; second extension rejected" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Accrued late fee; recomputed by deficiency_late_fee on resolution and on daily sweep while overdue" }
      - { name: corrected_at, type: string, source: system, description: "ISO datetime of correction verification; null until CORRECTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CORRECTED | VERIFIED | WAIVED; VERIFIED is terminal-accepted, WAIVED requires FireMarshal", constraints: "values: OPEN, CORRECTED, VERIFIED, WAIVED" }

  - name: Impairment
    parent: ProtectedSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> ProtectedSystem.id; impaired system" }
      - { name: impairment_kind, type: enum, source: input, description: "PLANNED | UNPLANNED; drives notification deadline rule", constraints: "values: PLANNED, UNPLANNED" }
      - { name: planned_start, type: string, source: input, description: "ISO datetime impairment begins (for UNPLANNED, set to discovery time)" }
      - { name: planned_end, type: string, source: input, description: "ISO datetime impairment expected to end; must be strictly after planned_start (ERR_INVALID_DATE_RANGE)" }
      - { name: notification_deadline, type: string, source: computed, description: "PLANNED: planned_start - 8h; UNPLANNED: discovered_at + 2h" }
      - { name: authority_notified_at, type: string, source: system, description: "ISO datetime when authority notification was dispatched; null until notify", constraints: "nullable" }
      - { name: notification_late, type: boolean, source: computed, default: false, description: "True when authority_notified_at > notification_deadline; drives compliance score deduction" }
      - { name: discovered_at, type: string, source: system, description: "ISO datetime stamped at creation" }
      - { name: restored_at, type: string, source: system, description: "ISO datetime service restored; null until RESTORED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | NOTIFIED | RESTORED | CLOSED", constraints: "values: OPEN, NOTIFIED, RESTORED, CLOSED" }

  - name: MarshalReport
    parent: InspectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> InspectionEvent.id; the completed inspection this report covers (1:1)" }
      - { name: portal_submission_id, type: string, source: system, description: "Portal receipt token stamped on ACCEPTED; null until then", constraints: "nullable" }
      - { name: submitted_at, type: string, source: system, description: "ISO datetime of portal submission; null until submitted", constraints: "nullable" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "True when submitted date > event.report_due_date" }
      - { name: revision_of_id, type: string, source: input, description: "FK -> MarshalReport.id; self-referential pointer when this report revises a REJECTED report on the same event; null for first submission", constraints: "nullable; referenced report must be REJECTED and on same event (ERR_REPORT_REVISION_INVALID)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED; REJECTED reopens a revision loop", constraints: "values: DRAFT, SUBMITTED, ACCEPTED, REJECTED" }

  - name: BackflowTest
    parent: ProtectedSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> ProtectedSystem.id; must be a BACKFLOW-category system (ERR_SYSTEM_CATEGORY_MISMATCH)" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; the BACKFLOW_ASSEMBLY device under test" }
      - { name: tester_technician_id, type: string, source: input, description: "FK -> Technician.id; must hold ACTIVE BACKFLOW license" }
      - { name: tested_at, type: string, source: input, description: "ISO datetime the field test was performed" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "values: PASS, FAIL" }
      - { name: unpaid_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding test fee; accrues compounding late penalty (backflow_late_penalty) while status is INVOICED past due date" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | INVOICED | PAID | FAILED_OPEN", constraints: "values: RECORDED, INVOICED, PAID, FAILED_OPEN" }

  - name: FirePumpTest
    parent: ProtectedSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> ProtectedSystem.id; must be a FIRE_PUMP-category system (ERR_SYSTEM_CATEGORY_MISMATCH)" }
      - { name: test_kind, type: enum, source: input, description: "CHURN | ANNUAL_FLOW; CHURN monthly, ANNUAL_FLOW yearly", constraints: "values: CHURN, ANNUAL_FLOW" }
      - { name: tester_technician_id, type: string, source: input, description: "FK -> Technician.id; must hold ACTIVE PUMP license" }
      - { name: tested_at, type: string, source: input, description: "ISO datetime the test was performed" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "values: PASS, FAIL" }
      - { name: coordinated_event_id, type: string, source: input, description: "FK -> InspectionEvent.id; annual flow test must be coordinated with a COMPLETED annual inspection event on the same system", constraints: "nullable; required when test_kind == ANNUAL_FLOW (ERR_PUMP_COORDINATION_REQUIRED)" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | ATTESTED | FAILED_OPEN", constraints: "values: RECORDED, ATTESTED, FAILED_OPEN" }

  - name: FalseAlarmCase
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; property where the alarm occurred" }
      - { name: alarm_occurred_at, type: string, source: input, description: "ISO datetime of the alarm activation" }
      - { name: cause_code, type: enum, source: input, description: "NEGLIGENCE | EQUIPMENT_FAULT | UNKNOWN | MALICIOUS | WEATHER; only NEGLIGENCE | EQUIPMENT_FAULT | UNKNOWN are chargeable", constraints: "values: NEGLIGENCE, EQUIPMENT_FAULT, UNKNOWN, MALICIOUS, WEATHER" }
      - { name: chargeable, type: boolean, source: computed, description: "True when cause_code in {NEGLIGENCE, EQUIPMENT_FAULT, UNKNOWN}" }
      - { name: sequence_number, type: integer, source: computed, description: "1-indexed count of this property's chargeable cases within rolling 365-day window ending on alarm date (inclusive); drives fee tier" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "Fee assessed by false_alarm_fee using sequence_number tier + habitual surcharge" }
      - { name: waived, type: boolean, source: system, default: false, description: "True when FireMarshal waives the fee; fee_cents zeroed on waiver" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ASSESSED | WAIVED | PAID", constraints: "values: OPEN, ASSESSED, WAIVED, PAID" }

  - name: ModificationPermit
    parent: ProtectedSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> ProtectedSystem.id; system being modified" }
      - { name: project_valuation_cents, type: integer, source: input, description: "Declared project valuation in cents; feeds permit_fee_tiers" }
      - { name: permit_fee_cents, type: integer, source: computed, description: "Marginal tiered fee with minimum; see permit_fee_tiers" }
      - { name: expected_system_version, type: integer, source: input, description: "OCC field: version of ProtectedSystem last observed by client; stale value rejected with ERR_STALE_VERSION" }
      - { name: work_commenced_at, type: string, source: system, description: "ISO datetime work began; null until commencement attested", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: APPLIED, description: "APPLIED | ISSUED | WORK_COMMENCED | FINED | CLOSED | EXPIRED", constraints: "values: APPLIED, ISSUED, WORK_COMMENCED, FINED, CLOSED, EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contractor
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /fire-compliance/contractors/{id}/deactivate"
        actor: FireMarshal
        preconditions:
          - "Contractor.status == ACTIVE (else ERR_INVALID_STATE)"
          - "No InspectionEvent in SCHEDULED or IN_PROGRESS under any plan of any property of this contractor (ERR_OPEN_EVENTS_BLOCK_DEACTIVATION)"
        side_effects:
          - "All Technicians of this contractor -> INACTIVE"
          - "All OPEN Impairments on systems of this contractor's properties -> CLOSED with restored_at stamped at deactivation time"
          - "All DRAFT MarshalReports on events of this contractor -> deleted-from-workflow (remain queryable, status unchanged)"
          - "Contractor.updated_at refreshed; Contractor.version incremented"

  - entity: Technician
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /fire-compliance/technicians/{id}/deactivate"
        actor: ContractorAdmin
        preconditions:
          - "Technician.status == ACTIVE (else ERR_INVALID_STATE)"
          - "No InspectionEvent assigned to this technician in SCHEDULED or IN_PROGRESS (ERR_TECHNICIAN_HAS_OPEN_EVENTS)"
        side_effects:
          - "All LicenseRecords of this technician in ACTIVE with expires_on < current date -> EXPIRED"
          - "Technician.updated_at refreshed; Technician.version incremented"

  - entity: LicenseRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily sweep when current date > expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "Technician.updated_at refreshed; Technician.version incremented"
          - "Contractor compliance_score recompute (compliance_score_recompute) with license-deduction branch"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /fire-compliance/license-records/{id}/revoke"
        actor: FireMarshal
        preconditions:
          - "LicenseRecord.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Contractor compliance_score recompute (compliance_score_recompute) with license-deduction branch"
          - "LicenseRecord.updated_at refreshed; LicenseRecord.version incremented"

  - entity: Property
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /fire-compliance/properties/{id}/archive"
        actor: ContractorAdmin
        preconditions:
          - "Property.status == ACTIVE (else ERR_INVALID_STATE)"
          - "All ProtectedSystems of property DECOMMISSIONED (ERR_SYSTEMS_STILL_IN_SERVICE)"
          - "No FalseAlarmCase in OPEN or ASSESSED for this property (ERR_UNRESOLVED_FALSE_ALARMS)"
        side_effects:
          - "All InspectionPlans of property in DRAFT or SCHEDULED -> LAPSED"
          - "Property.updated_at refreshed; Property.version incremented"

  - entity: ProtectedSystem
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /fire-compliance/systems/{id}/decommission"
        actor: ContractorAdmin
        preconditions:
          - "ProtectedSystem.status == IN_SERVICE (else ERR_INVALID_STATE)"
          - "No OPEN or NOTIFIED Impairment on this system (ERR_OPEN_IMPAIRMENT_EXISTS)"
          - "No ModificationPermit in APPLIED, ISSUED, or WORK_COMMENCED (ERR_OPEN_PERMIT_EXISTS)"
        side_effects:
          - "All Devices of system IN_SERVICE -> REMOVED"
          - "All SCHEDULED InspectionEvents referencing this system -> CANCELLED; each cancellation re-evaluates parent plan posture (plan_posture_derive)"
          - "ProtectedSystem.impairment_status -> OUT_OF_SERVICE"
          - "ProtectedSystem.updated_at refreshed; ProtectedSystem.version incremented"

  - entity: Device
    initial_state: IN_SERVICE
    terminal_states: [REPLACED, REMOVED]
    transitions:
      - from: IN_SERVICE
        to: REPLACED
        trigger: "POST /fire-compliance/devices/{id}/replace"
        actor: ContractorAdmin
        preconditions:
          - "Device.status == IN_SERVICE (else ERR_INVALID_STATE)"
          - "replaced_by_device_id references an IN_SERVICE Device in the same system with a different id (ERR_DEVICE_REPLACEMENT_MISMATCH)"
          - "No OPEN Deficiency on this device (ERR_DEVICE_HAS_OPEN_DEFICIENCY)"
        side_effects:
          - "Old device REPLACED; next_due recompute (next_due_recompute) for replacement device: it inherits the old device's next_due_date if earlier than its own default"
          - "Device.updated_at refreshed; Device.version incremented"
      - from: IN_SERVICE
        to: REMOVED
        trigger: "POST /fire-compliance/devices/{id}/remove"
        actor: ContractorAdmin
        preconditions:
          - "Device.status == IN_SERVICE (else ERR_INVALID_STATE)"
          - "No OPEN Deficiency on this device (ERR_DEVICE_HAS_OPEN_DEFICIENCY)"
        side_effects:
          - "Parent plan total_events_required recompute (plan_requirement_count) for the plan covering current year"
          - "Device.updated_at refreshed; Device.version incremented"

  - entity: InspectionPlan
    initial_state: DRAFT
    terminal_states: [FULFILLED, LAPSED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /fire-compliance/inspection-plans/{id}/publish"
        actor: ContractorAdmin
        preconditions:
          - "Plan.status == DRAFT (else ERR_INVALID_STATE)"
          - "total_events_required > 0 (ERR_EMPTY_PLAN)"
          - "Contractor.posture == GOOD_STANDING (ERR_CONTRACTOR_POSTURE_BLOCKED)"
        side_effects:
          - "final_fee_cents populated by fee_proration FINAL variant; provisional_fee_cents retained for audit"
          - "Plan.updated_at refreshed; Plan.version incremented"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (automatic when first child InspectionEvent moves to IN_PROGRESS or COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: FULFILLED
        trigger: "system (automatic when events_completed == total_events_required and all events terminal, evaluated after each event transition)"
        actor: system
        preconditions: []
        side_effects:
          - "Contractor compliance_score recompute (on-time completion branch of compliance_score_recompute)"
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system (automatic when events_completed == total_events_required and all events terminal)"
        actor: system
        preconditions: []
        side_effects:
          - "Contractor compliance_score recompute (on-time completion branch)"
      - from: SCHEDULED
        to: LAPSED
        trigger: "system (automatic when current date > plan_year-12-31 and plan not FULFILLED) OR parent Property archived"
        actor: system
        preconditions: []
        side_effects:
          - "All SCHEDULED child InspectionEvents -> CANCELLED"
      - from: IN_PROGRESS
        to: LAPSED
        trigger: "system (automatic when current date > plan_year-12-31 and events_completed < total_events_required)"
        actor: system
        preconditions: []
        side_effects:
          - "All SCHEDULED child InspectionEvents -> CANCELLED"
          - "Contractor compliance_score recompute with lapsed-plan penalty (-75)"

  - entity: InspectionEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_ACCESS]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /fire-compliance/inspection-events/{id}/start"
        actor: Technician
        preconditions:
          - "Event.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Acting technician (X-User-ID) == event.lead_technician_id (ERR_TECHNICIAN_NOT_ASSIGNED)"
          - "Lead technician holds ACTIVE LicenseRecord in class matching system's category mapping (ALARM for FIRE_ALARM, SPRINKLER for SPRINKLER, BACKFLOW for BACKFLOW, PUMP for FIRE_PUMP) with expires_on > event scheduled date (ERR_LICENSE_NOT_VALID)"
          - "Contractor.posture != SUSPENDED (ERR_CONTRACTOR_POSTURE_BLOCKED)"
          - "System impairment_status != OUT_OF_SERVICE (ERR_SYSTEM_OUT_OF_SERVICE)"
        side_effects:
          - "Parent plan posture re-evaluate (plan_posture_derive): SCHEDULED -> IN_PROGRESS"
          - "Event.updated_at refreshed; Event.version incremented"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fire-compliance/inspection-events/{id}/complete"
        actor: Technician
        preconditions:
          - "Event.status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "Acting technician == event.lead_technician_id (ERR_TECHNICIAN_NOT_ASSIGNED)"
        side_effects:
          - "completed_at stamped with current clock; report_due_date = date(completed_at) + 7 days"
          - "Every covered Device: next_due_recompute from completed date"
          - "Parent plan events_completed += 1; plan_posture_derive re-evaluates (may auto-FULFILL)"
          - "MarshalReport (status DRAFT) auto-created 1:1 for this event"
          - "Deficiency late-fee snapshot: each OPEN Deficiency created on this event gets correction_deadline from completion date"
          - "Contractor compliance_score recompute (on-time branch when completed on/before latest device due date covered)"
          - "Event.updated_at refreshed; Event.version incremented"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fire-compliance/inspection-events/{id}/cancel"
        actor: ContractorAdmin
        preconditions:
          - "Event.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Parent plan total_events_required recompute only if cancellation removes plan coverage (plan_requirement_count)"
          - "Plan posture re-evaluate (plan_posture_derive)"
          - "Event.updated_at refreshed; Event.version incremented"
      - from: SCHEDULED
        to: NO_ACCESS
        trigger: "POST /fire-compliance/inspection-events/{id}/mark-no-access"
        actor: Technician
        preconditions:
          - "Event.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Acting technician == event.lead_technician_id (ERR_TECHNICIAN_NOT_ASSIGNED)"
          - "Current clock datetime >= event.scheduled_start (ERR_EVENT_NOT_YET_DUE)"
        side_effects:
          - "Each covered Device keeps old next_due_date (missed inspection does NOT roll due date forward)"
          - "Plan posture re-evaluate; NO_ACCESS counts as terminal-but-unfulfilled (plan can never reach FULFILLED while any event is NO_ACCESS unless a replacement event is created)"
          - "Contractor compliance_score recompute with no-access penalty (-20)"
          - "Event.updated_at refreshed; Event.version incremented"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: CORRECTED
        trigger: "POST /fire-compliance/deficiencies/{id}/attest-correction"
        actor: ContractorAdmin
        preconditions:
          - "Deficiency.status == OPEN (else ERR_INVALID_STATE)"
          - "Parent event status == COMPLETED (ERR_EVENT_NOT_COMPLETED)"
        side_effects:
          - "corrected_at stamped; deficiency_late_fee computes final late_fee_cents from corrected date vs correction_deadline"
          - "Contractor compliance_score recompute (overdue branch drops off when corrected on time; late correction keeps deduction)"
          - "Deficiency.updated_at refreshed; Deficiency.version incremented"
      - from: CORRECTED
        to: VERIFIED
        trigger: "POST /fire-compliance/deficiencies/{id}/verify"
        actor: FireMarshal
        preconditions:
          - "Deficiency.status == CORRECTED (else ERR_INVALID_STATE)"
          - "Segregation of duties: verifying FireMarshal's X-User-ID must differ from the X-User-ID that performed attest-correction (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Deficiency.updated_at refreshed; Deficiency.version incremented"
      - from: OPEN
        to: WAIVED
        trigger: "POST /fire-compliance/deficiencies/{id}/waive"
        actor: FireMarshal
        preconditions:
          - "Deficiency.status == OPEN (else ERR_INVALID_STATE)"
          - "classification == NONCRITICAL (ERR_CRITICAL_NOT_WAIVABLE)"
        side_effects:
          - "late_fee_cents zeroed"
          - "Contractor compliance_score recompute (waiver removes overdue deduction but applies waiver penalty -5)"
      - from: CORRECTED
        to: OPEN
        trigger: "POST /fire-compliance/deficiencies/{id}/reject-correction"
        actor: FireMarshal
        preconditions:
          - "Deficiency.status == CORRECTED (else ERR_INVALID_STATE)"
        side_effects:
          - "corrected_at cleared to null; late fee accrual resumes against ORIGINAL correction_deadline (no reset)"
          - "Deficiency.updated_at refreshed; Deficiency.version incremented"

  - entity: Impairment
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: NOTIFIED
        trigger: "POST /fire-compliance/impairments/{id}/notify-authority"
        actor: ContractorAdmin
        preconditions:
          - "Impairment.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "authority_notified_at stamped with current clock; notification_late computed vs notification_deadline"
          - "If notification_late: Contractor compliance_score recompute with late-notification deduction (-60)"
          - "Impairment.updated_at refreshed; Impairment.version incremented"
      - from: OPEN
        to: RESTORED
        trigger: "POST /fire-compliance/impairments/{id}/restore"
        actor: ContractorAdmin
        preconditions:
          - "Impairment.status in {OPEN, NOTIFIED} (else ERR_INVALID_STATE)"
        side_effects:
          - "restored_at stamped; system impairment_status recompute (impairment_status_derive): returns to NORMAL if no other open impairments"
          - "Impairment.updated_at refreshed; Impairment.version incremented"
      - from: NOTIFIED
        to: RESTORED
        trigger: "POST /fire-compliance/impairments/{id}/restore"
        actor: ContractorAdmin
        preconditions:
          - "Impairment.status in {OPEN, NOTIFIED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same as OPEN -> RESTORED"
      - from: RESTORED
        to: CLOSED
        trigger: "POST /fire-compliance/impairments/{id}/close"
        actor: FireMarshal
        preconditions:
          - "Impairment.status == RESTORED (else ERR_INVALID_STATE)"
        side_effects:
          - "Impairment.updated_at refreshed; Impairment.version incremented"

  - entity: MarshalReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fire-compliance/marshal-reports/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "Report.status == DRAFT (else ERR_INVALID_STATE)"
          - "Parent event status == COMPLETED (ERR_EVENT_NOT_COMPLETED)"
          - "Contractor.posture != SUSPENDED (ERR_CONTRACTOR_POSTURE_BLOCKED)"
        side_effects:
          - "submitted_at stamped; is_late computed vs event.report_due_date"
          - "If is_late: Contractor compliance_score recompute with late-report deduction (-25)"
          - "Report.updated_at refreshed; Report.version incremented"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /fire-compliance/marshal-reports/{id}/accept"
        actor: FireMarshal
        preconditions:
          - "Report.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "All Deficiencies on the parent event are in {VERIFIED, WAIVED} OR still within their correction_deadline window (ERR_UNRESOLVED_OVERDUE_DEFICIENCIES)"
        side_effects:
          - "portal_submission_id stamped (server-minted receipt token, non-UUID sequential per jurisdiction: '<jurisdiction_code>-<zero-padded 8-digit counter>')"
          - "Report.updated_at refreshed; Report.version incremented"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fire-compliance/marshal-reports/{id}/reject"
        actor: FireMarshal
        preconditions:
          - "Report.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "Report.updated_at refreshed; Report.version incremented"
      - from: REJECTED
        to: DRAFT
        trigger: "system (automatic when a revision MarshalReport with revision_of_id = this report is created)"
        actor: system
        preconditions: []
        side_effects:
          - "The REJECTED report remains REJECTED for audit; the NEW revision report starts in DRAFT (cycle is expressed across two rows)"

  - entity: BackflowTest
    initial_state: RECORDED
    terminal_states: [PAID, FAILED_OPEN]
    transitions:
      - from: RECORDED
        to: INVOICED
        trigger: "POST /fire-compliance/backflow-tests/{id}/invoice"
        actor: ContractorAdmin
        preconditions:
          - "BackflowTest.status == RECORDED (else ERR_INVALID_STATE)"
          - "result == PASS (a FAIL result goes to FAILED_OPEN instead; ERR_INVALID_STATE)"
        side_effects:
          - "unpaid_balance_cents set to BACKFLOW_TEST_FEE_CENTS constant"
          - "BackflowTest.updated_at refreshed; BackflowTest.version incremented"
      - from: RECORDED
        to: FAILED_OPEN
        trigger: "system (automatic on creation when result == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Device next_due unchanged; a FAIL requires a re-test (new BackflowTest row)"
          - "Contractor compliance_score recompute with failed-test deduction (-30)"
      - from: INVOICED
        to: PAID
        trigger: "POST /fire-compliance/backflow-tests/{id}/record-payment"
        actor: ContractorAdmin
        preconditions:
          - "BackflowTest.status == INVOICED (else ERR_INVALID_STATE)"
        side_effects:
          - "backflow_late_penalty computes final compounded penalty into unpaid_balance_cents before zeroing"
          - "unpaid_balance_cents -> 0"
          - "BackflowTest.updated_at refreshed; BackflowTest.version incremented"

  - entity: FirePumpTest
    initial_state: RECORDED
    terminal_states: [ATTESTED, FAILED_OPEN]
    transitions:
      - from: RECORDED
        to: ATTESTED
        trigger: "POST /fire-compliance/fire-pump-tests/{id}/attest"
        actor: ContractorAdmin
        preconditions:
          - "FirePumpTest.status == RECORDED (else ERR_INVALID_STATE)"
          - "result == PASS (else ERR_INVALID_STATE)"
          - "For ANNUAL_FLOW: coordinated_event_id's event is COMPLETED and covers the same system (ERR_PUMP_COORDINATION_REQUIRED)"
        side_effects:
          - "FirePumpTest.updated_at refreshed; FirePumpTest.version incremented"
      - from: RECORDED
        to: FAILED_OPEN
        trigger: "system (automatic on creation when result == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Contractor compliance_score recompute with failed-test deduction (-30)"

  - entity: FalseAlarmCase
    initial_state: OPEN
    terminal_states: [ASSESSED, WAIVED, PAID]
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /fire-compliance/false-alarm-cases/{id}/assess"
        actor: FireMarshal
        preconditions:
          - "FalseAlarmCase.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "false_alarm_fee computes fee_cents from sequence_number and property occupancy_class variant"
          - "If cause_code == NEGLIGENCE: Contractor compliance_score recompute with negligence deduction (-15)"
          - "FalseAlarmCase.updated_at refreshed; FalseAlarmCase.version incremented"
      - from: OPEN
        to: WAIVED
        trigger: "POST /fire-compliance/false-alarm-cases/{id}/waive"
        actor: FireMarshal
        preconditions:
          - "FalseAlarmCase.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "fee_cents zeroed; waived -> true"
          - "FalseAlarmCase.updated_at refreshed; FalseAlarmCase.version incremented"
      - from: ASSESSED
        to: PAID
        trigger: "POST /fire-compliance/false-alarm-cases/{id}/record-payment"
        actor: ContractorAdmin
        preconditions:
          - "FalseAlarmCase.status == ASSESSED (else ERR_INVALID_STATE)"
        side_effects:
          - "FalseAlarmCase.updated_at refreshed; FalseAlarmCase.version incremented"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /fire-compliance/false-alarm-cases/{id}/waive"
        actor: FireMarshal
        preconditions:
          - "FalseAlarmCase.status == ASSESSED (else ERR_INVALID_STATE)"
        side_effects:
          - "fee_cents zeroed; waived -> true"

  - entity: ModificationPermit
    initial_state: APPLIED
    terminal_states: [CLOSED, EXPIRED, FINED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /fire-compliance/modification-permits/{id}/issue"
        actor: FireMarshal
        preconditions:
          - "Permit.status == APPLIED (else ERR_INVALID_STATE)"
          - "Contractor.posture == GOOD_STANDING (ERR_CONTRACTOR_POSTURE_BLOCKED)"
          - "System impairment_status == NORMAL (ERR_SYSTEM_IMPAIRED)"
        side_effects:
          - "Permit.updated_at refreshed; Permit.version incremented"
      - from: ISSUED
        to: WORK_COMMENCED
        trigger: "POST /fire-compliance/modification-permits/{id}/commence-work"
        actor: ContractorAdmin
        preconditions:
          - "Permit.status == ISSUED (else ERR_INVALID_STATE)"
          - "Current date <= issue date + PERMIT_VALIDITY_DAYS (ERR_PERMIT_EXPIRED)"
        side_effects:
          - "work_commenced_at stamped"
          - "System impairment check: commencing work auto-creates an UNPLANNED Impairment on the system (discovered_at = now), which itself requires authority notification within 2h (cascade: permit -> impairment)"
          - "Permit.updated_at refreshed; Permit.version incremented"
      - from: WORK_COMMENCED
        to: CLOSED
        trigger: "POST /fire-compliance/modification-permits/{id}/close"
        actor: FireMarshal
        preconditions:
          - "Permit.status == WORK_COMMENCED (else ERR_INVALID_STATE)"
          - "The auto-created Impairment for this permit is CLOSED (ERR_OPEN_IMPAIRMENT_EXISTS)"
          - "A passing post-modification inspection event on the system is COMPLETED after work_commenced_at (ERR_POST_MOD_INSPECTION_REQUIRED)"
        side_effects:
          - "Device frequencies re-seeded: any device whose device_type mapping changed gets next_due_recompute from close date"
          - "Permit.updated_at refreshed; Permit.version incremented"
      - from: APPLIED
        to: FINED
        trigger: "POST /fire-compliance/modification-permits/{id}/cite-unpermitted-work"
        actor: FireMarshal
        preconditions:
          - "Permit.status in {APPLIED, ISSUED} (else ERR_INVALID_STATE)"
          - "Evidence of work commencement before issuance (request field unpermitted_work_detected: true) (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "permit_fee_cents doubled (unpermitted-work penalty); Contractor compliance_score recompute (-100)"
          - "Permit.updated_at refreshed; Permit.version incremented"
      - from: ISSUED
        to: FINED
        trigger: "POST /fire-compliance/modification-permits/{id}/cite-unpermitted-work"
        actor: FireMarshal
        preconditions:
          - "Permit.status in {APPLIED, ISSUED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Same penalty as APPLIED -> FINED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (daily sweep: current date > issue date + PERMIT_VALIDITY_DAYS while no work commenced)"
        actor: system
        preconditions: []
        side_effects:
          - "Permit.updated_at refreshed; Permit.version incremented"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only, per filter)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /fire-compliance/properties/{id}/inspection-plans"
    occ_field: "expected_property_version"
    description: |
      Creating an InspectionPlan against a Property whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just mutated the property (e.g., archiving it
      or creating the same plan_year), so the current writer's view of the
      property is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: permit-create-stale-system
    parent_entity: ProtectedSystem
    write_endpoint: "POST /fire-compliance/systems/{id}/modification-permits"
    occ_field: "expected_system_version"
    description: |
      Creating a ModificationPermit against a ProtectedSystem whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just changed the system (e.g., a device
      replacement or impairment restore bumping system.version), so the current
      writer's view of the system is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: frequency_code_lookup
    trigger: "On Device creation (and on re-seed after permit close)"
    algorithm: threshold
    formula: |
      STATIC CODE TABLE (device_type -> frequency_code):
        FIRE_PUMP_CONTROLLER -> MONTHLY
        GAUGE_VALVE          -> QUARTERLY
        SUPERVISORY_SWITCH   -> QUARTERLY
        SMOKE_DETECTOR       -> ANNUAL
        PULL_STATION         -> ANNUAL
        NOTIFICATION_APPLIANCE -> ANNUAL
        SPRINKLER_HEAD       -> ANNUAL
        BACKFLOW_ASSEMBLY    -> ANNUAL
    input_set: "The created Device's device_type only"
    constants:
      MONTHLY_INTERVAL_MONTHS: 1
      QUARTERLY_INTERVAL_MONTHS: 3
      ANNUAL_INTERVAL_MONTHS: 12
    precision: "enum assignment; no rounding"
    variants: []

  - name: next_due_recompute
    trigger: "Device creation; InspectionEvent completion; Device replacement (inheritance branch); permit close re-seed"
    algorithm: chronological
    formula: |
      interval_months = MONTHLY_INTERVAL_MONTHS if frequency_code == MONTHLY
                        else QUARTERLY_INTERVAL_MONTHS if QUARTERLY
                        else ANNUAL_INTERVAL_MONTHS
      if device has a COMPLETED inspection event covering it:
          base = date(latest such event.completed_at)
      else:
          base = parent system.install_date
      next_due_date = add_calendar_months(base, interval_months)
      # add_calendar_months clamps to month end: 2026-01-31 + 1 month = 2026-02-28.
      # Replacement inheritance: replacement.next_due_date = min(replacement_default, old_device.next_due_date)
    input_set: "Device rows with status == IN_SERVICE; completed InspectionEvents on the device' system that include the device's frequency_code coverage"
    constants:
      MONTHLY_INTERVAL_MONTHS: 1
      QUARTERLY_INTERVAL_MONTHS: 3
      ANNUAL_INTERVAL_MONTHS: 12
    precision: "date granularity; no time component"
    variants:
      - name: inheritance
        when: "Device created as replacement (old device's replace call points at it)"
        difference: "next_due_date = min(default_from_install_date, replaced device's current next_due_date)"

  - name: fee_proration
    trigger: "InspectionPlan creation (provisional) and publish (final)"
    algorithm: tiered_pricing
    formula: |
      BASE_ANNUAL_CENTS by system_category:
        FIRE_ALARM: 120000; SPRINKLER: 180000; BACKFLOW: 9000; FIRE_PUMP: 240000
      service_start = max(plan creation date, latest system install_date among covered systems)
      cert_year_end = Dec 31 of plan_year
      FINAL variant:
        remaining_full_months = count of whole calendar months strictly after
          month(service_start) through month(cert_year_end), i.e. months
          service_start.month+1 .. 12 when service_start.year == plan_year else 12
        per system: fee = round_half_up(BASE * remaining_full_months / 12) to whole cents
        final_fee_cents = sum over covered systems  (round PER SYSTEM, then sum)
    input_set: "ProtectedSystems of the plan's property with status == IN_SERVICE at computation time"
    constants:
      BASE_FIRE_ALARM_CENTS: 120000
      BASE_SPRINKLER_CENTS: 180000
      BASE_BACKFLOW_CENTS: 9000
      BASE_FIRE_PUMP_CENTS: 240000
    precision: "integer cents, round_half_up per system line, then sum"
    variants:
      - name: provisional
        when: "Plan in DRAFT (at creation)"
        difference: "per system: fee = round_half_up(BASE * remaining_calendar_days_inclusive / 365); sum over systems; remaining days counted from service_start through Dec 31 inclusive"
      - name: final
        when: "Plan publish (DRAFT -> SCHEDULED)"
        difference: "month-based proration as in base formula; rounding per system line then summed"

  - name: deficiency_late_fee
    trigger: "Deficiency attest-correction; daily sweep while OPEN past deadline"
    algorithm: threshold
    formula: |
      days_late = max(0, (date(relevant_timestamp) - correction_deadline).days)
      rate_per_day = CRITICAL_LATE_PER_DAY_CENTS if classification == CRITICAL
                     else NONCRITICAL_LATE_PER_DAY_CENTS
      days_late = min(days_late, LATE_FEE_CAP_DAYS)
      late_fee_cents = days_late * rate_per_day
    input_set: "The single Deficiency row; relevant_timestamp = corrected_at when correcting, else current clock for sweep"
    constants:
      CRITICAL_LATE_PER_DAY_CENTS: 20000
      NONCRITICAL_LATE_PER_DAY_CENTS: 5000
      LATE_FEE_CAP_DAYS: 30
    precision: "integer cents; no rounding"
    variants: []

  - name: false_alarm_fee
    trigger: "FalseAlarmCase assess transition"
    algorithm: tiered_pricing
    formula: |
      window_start = date(alarm_occurred_at) - 364 days
      prior = count of this property's FalseAlarmCases with chargeable == true,
              status != WAIVED, and window_start <= date(alarm_occurred_at') < date(alarm_occurred_at)
      sequence_number = prior + 1   (only when this case.chargeable)
      STANDARD tier (occupancy_class != RESIDENTIAL):
        n 1-2: 0; n 3-4: 15000; n 5-6: 30000; n >= 7: 50000
      RESIDENTIAL variant: every tier at half rate, round_half_up:
        n 1-2: 0; n 3-4: 7500; n 5-6: 15000; n >= 7: 25000
      habitual surcharge (both variants): if n >= 7 add 25000
      fee_cents = tier + surcharge
    input_set: "FalseAlarmCase rows of the same property, chargeable, not WAIVED, alarm date within the trailing 365-day window [alarm_date-364d, alarm_date)"
    constants:
      TIER3_4_CENTS: 15000
      TIER5_6_CENTS: 30000
      TIER7P_CENTS: 50000
      HABITUAL_SURCHARGE_CENTS: 25000
      WINDOW_DAYS: 365
    precision: "integer cents; residential halving uses round_half_up on the halved tier"
    variants:
      - name: residential
        when: "Property.occupancy_class == RESIDENTIAL"
        difference: "All tiers at half of STANDARD, round_half_up after halving; habitual surcharge unchanged"

  - name: permit_fee_tiers
    trigger: "ModificationPermit creation; doubled on cite-unpermitted-work"
    algorithm: tiered_pricing
    formula: |
      v = project_valuation_cents
      fee = 0
      t1 = min(v, 200000);            fee += t1 * 0.03;   v -= t1
      if v > 0: t2 = min(v, 300000);  fee += t2 * 0.025;  v -= t2
      if v > 0:                       fee += v * 0.015
      fee = max(fee, MIN_PERMIT_FEE_CENTS)
      permit_fee_cents = round_half_up(fee)  # single rounding at the end only
    input_set: "project_valuation_cents input only"
    constants:
      TIER1_CAP_CENTS: 200000
      TIER1_RATE: 0.03
      TIER2_CAP_CENTS: 300000
      TIER2_RATE: 0.025
      TIER3_RATE: 0.015
      MIN_PERMIT_FEE_CENTS: 7500
    precision: "integer cents; round_half_up once at end (no per-tier rounding)"
    variants: []

  - name: backflow_late_penalty
    trigger: "BackflowTest record-payment; monthly sweep while INVOICED past due"
    algorithm: decay_function
    formula: |
      # penalty COMPOUNDS monthly at 5% on the unpaid balance, rounding to whole
      # cents (round_half_up) after EACH monthly compounding step.
      due_date = date(invoice transition timestamp) + BACKFLOW_PAYMENT_DUE_DAYS
      months_late = number of whole calendar months elapsed from due_date to payment date
                    (a partial month does not compound)
      balance = BACKFLOW_TEST_FEE_CENTS
      repeat months_late times: balance = round_half_up(balance * 1.05)
      unpaid_balance_cents (before payment) = balance
    input_set: "The single BackflowTest row in INVOICED"
    constants:
      BACKFLOW_TEST_FEE_CENTS: 40000
      BACKFLOW_PAYMENT_DUE_DAYS: 30
      MONTHLY_COMPOUND_RATE: 0.05
    precision: "integer cents; round_half_up applied after each monthly compounding step (order matters: round-per-month, not round-at-end)"
    variants: []

  - name: compliance_score_recompute
    trigger: "Every state transition whose side_effects cite it; daily sweep; license expiry/revocation"
    algorithm: weighted_scoring
    formula: |
      score = 1000
      # PROVISIONAL deductions (state-dependent, evaluated now):
      for each Deficiency of contractor's properties with status OPEN and current date > correction_deadline:
          score -= 40 if classification == CRITICAL else 10
      for each MarshalReport SUBMITTED with is_late:            score -= 25
      for each Impairment NOTIFIED/RESTORED/CLOSED with notification_late: score -= 60
      for each FalseAlarmCase ASSESSED/PAID with cause_code == NEGLIGENCE: score -= 15
      for each BackflowTest or FirePumpTest in FAILED_OPEN:     score -= 30
      for each InspectionPlan LAPSED:                           score -= 75
      for each InspectionEvent NO_ACCESS:                       score -= 20
      for each Deficiency WAIVED:                               score -= 5
      for each ModificationPermit FINED:                        score -= 100
      score = max(0, score)
    input_set: "All entities whose FK chain reaches the Contractor (Contractor <- Technician; Property <- ProtectedSystem <- Device/Impairment/BackflowTest/FirePumpTest/ModificationPermit; Property <- InspectionPlan <- InspectionEvent <- Deficiency/MarshalReport; Property <- FalseAlarmCase)"
    constants:
      DEDUCT_CRITICAL_OVERDUE: 40
      DEDUCT_NONCRITICAL_OVERDUE: 10
      DEDUCT_LATE_REPORT: 25
      DEDUCT_LATE_IMPAIRMENT_NOTICE: 60
      DEDUCT_NEGLIGENCE_ALARM: 15
      DEDUCT_FAILED_SPECIALTY_TEST: 30
      DEDUCT_LAPSED_PLAN: 75
      DEDUCT_NO_ACCESS: 20
      DEDUCT_WAIVER: 5
      DEDUCT_UNPERMITTED_WORK: 100
      AUDIT_ONTIME_EVENT_BONUS: 2
      AUDIT_BONUS_CAP: 50
      AUDIT_LICENSE_DEDUCTION: 100
      AUDIT_WINDOW_DAYS: 90
    precision: "integer; floor 0; no ceiling other than bonus cap"
    variants:
      - name: provisional
        when: "Listing endpoints and posture gating (default)"
        difference: "Exactly the base formula; no bonuses, no license deduction"
      - name: audited
        when: "POST /fire-compliance/contractors/{id}/audit-score invocation"
        difference: "Base PLUS min(AUDIT_BONUS_CAP, AUDIT_ONTIME_EVENT_BONUS * count of COMPLETED events with completed date in trailing AUDIT_WINDOW_DAYS that were on-time) MINUS AUDIT_LICENSE_DEDUCTION if any technician of the contractor holds a LicenseRecord in {EXPIRED, REVOKED} at audit time; floor 0"

  - name: posture_derive
    trigger: "After every compliance_score_recompute and after every deficiency open/close"
    algorithm: threshold
    formula: |
      open_critical_overdue = count of Deficiencies CRITICAL, OPEN, current date > correction_deadline
      if compliance_score < 600 or open_critical_overdue >= 3: posture = SUSPENDED
      elif compliance_score < 850 or open_critical_overdue >= 1: posture = PROBATION
      else: posture = GOOD_STANDING
    input_set: "Contractor.compliance_score plus open overdue critical Deficiencies reachable via FK chain"
    constants:
      SUSPEND_SCORE_LT: 600
      PROBATION_SCORE_LT: 850
      SUSPEND_CRITICAL_GTE: 3
      PROBATION_CRITICAL_GTE: 1
    precision: "integer comparisons; >= and < as written"
    variants: []

  - name: impairment_status_derive
    trigger: "Impairment create / restore / close"
    algorithm: aggregation
    formula: |
      open_impairments = count of Impairments on system with status in {OPEN, NOTIFIED}
      if any OPEN/NOTIFIED impairment has been open longer than IMPAIRMENT_OUT_OF_SERVICE_HOURS:
          impairment_status = OUT_OF_SERVICE
      elif open_impairments > 0: impairment_status = IMPAIRED
      else: impairment_status = NORMAL
      # DECOMMISSIONED systems always read OUT_OF_SERVICE regardless.
    input_set: "Impairments of the ProtectedSystem with status in {OPEN, NOTIFIED, RESTORED}"
    constants:
      IMPAIRMENT_OUT_OF_SERVICE_HOURS: 10
    precision: "integer hours; strictly-greater comparison"
    variants: []

  - name: plan_requirement_count
    trigger: "Plan creation; device add/remove/replace; event cancel"
    algorithm: aggregation
    formula: |
      # number of inspection events needed in plan_year per device frequency:
      #   MONTHLY -> 12, QUARTERLY -> 4, ANNUAL -> 1
      # Devices with status != IN_SERVICE contribute 0.
      total_events_required = sum over IN_SERVICE devices of events_per_frequency(frequency_code)
      events_completed = count of child InspectionEvents with status == COMPLETED
    input_set: "Devices of all IN_SERVICE ProtectedSystems of the plan's property; child events by status"
    constants:
      MONTHLY_EVENTS_PER_YEAR: 12
      QUARTERLY_EVENTS_PER_YEAR: 4
      ANNUAL_EVENTS_PER_YEAR: 1
    precision: "integer counts"
    variants: []

  - name: plan_posture_derive
    trigger: "After every child InspectionEvent transition and plan publish"
    algorithm: constraint_propagation
    formula: |
      children = child InspectionEvents
      if any child.status == IN_PROGRESS or any == COMPLETED (and plan was SCHEDULED): IN_PROGRESS
      if events_completed == total_events_required and all children terminal
         and no child in NO_ACCESS: FULFILLED
      if current date > plan_year-12-31 and not FULFILLED: LAPSED
      # evaluation order: LAPSED check first when out of year, then FULFILLED, then IN_PROGRESS.
    input_set: "Child InspectionEvents of the plan; clock"
    constants: {}
    precision: "enum; deterministic evaluation order as written"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present for non-Anonymous calls", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per §1.5 roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every id in the path exists (validated left-to-right); non-existent -> not found", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every FK-valued body field references an existing entity", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints with FK body fields" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition exists (per §1.2)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Parent-scope state gates: Contractor.status == ACTIVE for all child writes; Property.status == ACTIVE for child writes; Contractor.posture gate per transition preconditions", error_id: ERR_CONTRACTOR_POSTURE_BLOCKED, http_status: 409, applies_to: "child-mutating endpoints" }
  - { priority: 7, category: business_safety, check: "License validity gate: technician LicenseRecord ACTIVE and expires_on strictly after the relevant event date; license class matches system category", error_id: ERR_LICENSE_NOT_VALID, http_status: 422, applies_to: "inspection-event start; backflow/fire-pump test create" }
  - { priority: 8, category: business_safety, check: "System impairment gate: operations requiring NORMAL system (permit issue) or forbidding OUT_OF_SERVICE (event start)", error_id: ERR_SYSTEM_IMPAIRED, http_status: 422, applies_to: "permit issue; event start" }
  - { priority: 9, category: business_safety, check: "Critical deficiency is never waivable", error_id: ERR_CRITICAL_NOT_WAIVABLE, http_status: 422, applies_to: "deficiency waive" }
  - { priority: 10, category: business_temporal, check: "Date/datetime ordering: end strictly after start; expires_on strictly after issued_on; scheduled_end strictly after scheduled_start", error_id: ERR_INVALID_DATE_RANGE, http_status: 422, applies_to: "all endpoints taking date ranges" }
  - { priority: 11, category: business_temporal, check: "Impairment overlap + re-certification buffer: no new PLANNED Impairment on the same system may overlap [planned_start, planned_end) of another non-CLOSED impairment, and planned_start must be >= (other.planned_end + 4h) when other ends before it; adjacency (start == other.end) is INSIDE the buffer and rejected; start == other.end + 4h exactly is allowed", error_id: ERR_IMPAIRMENT_OVERLAP, http_status: 409, applies_to: "impairment create" }
  - { priority: 12, category: business_temporal, check: "Technician aggregate capacity: assigning lead to an InspectionEvent is rejected when the technician already leads 3 other SCHEDULED/IN_PROGRESS events whose [scheduled_start, scheduled_end] (closed-closed) intersect the new event's interval", error_id: ERR_TECHNICIAN_CAPACITY, http_status: 409, applies_to: "inspection-event create" }
  - { priority: 13, category: business_constraint, check: "Uniqueness: Contractor.state_license_no globally unique; Device.serial_no unique within system; InspectionPlan.plan_year unique per property", error_id: ERR_DUPLICATE_CONSTRAINT, http_status: 409, applies_to: "create endpoints" }
  - { priority: 14, category: business_constraint, check: "Enum membership: every enum field value is in its declared set", error_id: ERR_INVALID_ENUM, http_status: 422, applies_to: "all create endpoints" }
  - { priority: 15, category: business_referential, check: "Cross-aggregate integrity: event.system_id belongs to plan's property; deficiency.device_id belongs to event's system; pump test coordinated_event belongs to same system; backflow/pump test system category matches device/category requirements", error_id: ERR_CROSS_REFERENCE_MISMATCH, http_status: 422, applies_to: "event create; deficiency create; specialty test create" }
  - { priority: 16, category: business_referential, check: "Open-item blockers: archive/deactivate/decommission/replace/remove blocked by listed open children (per §1.2 preconditions)", error_id: ERR_OPEN_ITEMS_BLOCK, http_status: 409, applies_to: "archive/deactivate/decommission/replace/remove endpoints" }
  - { priority: 17, category: business_fiscal, check: "OCC: expected_property_version / expected_system_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "plan create; permit create" }
  - { priority: 18, category: business_fiscal, check: "Required-field presence and scalar types for all body fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 19, category: state, check: "Segregation of duties: verify actor differs from attest actor on the same Deficiency", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "deficiency verify" }
  - { priority: 20, category: business_constraint, check: "extend-deadline only on OPEN NONCRITICAL deficiency with extension_used == false", error_id: ERR_DEFICIENCY_NOT_EXTENSIBLE, http_status: 422, applies_to: "deficiency extend-deadline" }

