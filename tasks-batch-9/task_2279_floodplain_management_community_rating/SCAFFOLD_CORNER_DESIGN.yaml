          - errors.ERR_PANEL_NOT_PENDING
          - validations.priority_40
        distinguishing_aspect: |
          Activation is not idempotent: the second call on an already EFFECTIVE panel
          returns 409 ERR_PANEL_NOT_PENDING, its supersedes_panel_id stays null and no
          second map-revision cascade runs.
        test_recipe:
          setup:
            - "Community with one panel activated once."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
