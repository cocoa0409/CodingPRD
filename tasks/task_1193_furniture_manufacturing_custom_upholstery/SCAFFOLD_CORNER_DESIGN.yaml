      - name: occ_stale_version_rejected_and_supersede
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[cutplan-create-stale-line]", "state_machines.CutPlan.DRAFT_to_SUPERSEDED"]
        distinguishing_aspect: "OCC on OrderLine.version at cut-plan create: a create carrying the pre-supersede version is rejected 412 ERR_STALE_VERSION; the fresh-version create succeeds and the previous DRAFT plan is SUPERSEDED."
        test_recipe:
          setup: ["Confirmed order with ALLOCATED line qty 2 (lot 30.0 measured 54); line version captured before and after first plan create"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-OCC", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 2 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
          trigger:
            - call: "GET /mill/order-lines/${line_id}"
              as: ProductionPlanner
              captures: { v1: $.data.version }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${v1}" }
              as: ProductionPlanner
              captures: { cp1: $.data.id }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${v1}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "GET /mill/order-lines/${line_id}"
              as: ProductionPlanner
              captures: { v2: $.data.version }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${v2}" }
              as: ProductionPlanner
              captures: { cp2: $.data.id }
          assert:
            - "Second create with the stale ${v1}: 412 ERR_STALE_VERSION (line version advanced when the first plan was created)"
            - "Create with fresh ${v2}: 201, CutPlan.${cp2}.status == DRAFT"
            - "CutPlan.${cp1}.status == SUPERSEDED (supersede side effect of the accepted create)"
            - "OrderLine.${line_id}.version == ${v2} + 1 after the third create"

      - name: fefo_selector_order_and_tiebreak
        claim_type: selector_determinism
        grounds: ["calculations.lot_selector_fefo"]
        distinguishing_aspect: "FEFO selector with created_at tie-break: two AVAILABLE lots share the same received_at (same clock), so created_at ASC decides; the requirement 14.331 is filled greedily — 6.000 from the earlier lot, then 8.331 from the later one."
        test_recipe:
          setup: ["Clock fixed 2026-05-10 (both receives share received_at); lot A (usable 6.0) created and inspected BEFORE lot B (usable 10.0); order with PLANT line qty 4 (requirement 14.331)"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 6.0 }
              as: MaterialReceiver
              captures: { lot_a: $.data.id }
            - call: "POST /mill/material-lots/${lot_a}/receive"
              payload: { received_yards: 6.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_a}/inspect"
              payload: { result: "PASS", usable_yards: 6.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot_b: $.data.id }
            - call: "POST /mill/material-lots/${lot_b}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_b}/inspect"
              payload: { result: "PASS", usable_yards: 10.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-FEFO", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "GET /mill/material-allocations?lot_id=${lot_a}"
              as: ProductionPlanner
              captures: { alloc_a_yards: "$.data[0].yards" }
            - call: "GET /mill/material-allocations?lot_id=${lot_b}"
              as: ProductionPlanner
              captures: { alloc_b_yards: "$.data[0].yards" }
          assert:
            - "alloc_a_yards == 6.000 (earlier-created lot drained first — received_at ties, created_at ASC breaks the tie)"
            - "alloc_b_yards == 8.331 (residual after lot A is exhausted: 14.331 − 6.000)"
            - "OrderLine.${line_id}.allocated_yards == 14.331 and status == ALLOCATED"
            - "MaterialLot.${lot_a}.available_yards == 0.0; MaterialLot.${lot_b}.available_yards == 1.669"

      - name: dual_variant_coverage_by_difficulty_design
        claim_type: variant_divergence
        grounds: ["calculations.fabric_requirement_provisional", "calculations.freight_charge"]
        excluded_because:
          difficulty_instance: fabric_requirement_provisional_vs_final
          rationale: "Both-variant divergence (and the freight counterpart freight_charge_ltl_vs_white_glove) is asserted by the named §1.8 instances."

      - name: cascade_coverage_by_difficulty_design
        claim_type: cascading_side_effects
        grounds: ["state_machines.MaterialLot.AVAILABLE_to_REJECTED", "state_machines.CustomerOrder.CONFIRMED_to_CANCELLED"]
        excluded_because:
          difficulty_instance: lot_recall_cascade
          rationale: "N-level cascades (recall depth-4, cancel depth-3) are asserted by the named §1.8 instances lot_recall_cascade and order_cancel_cascade."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "calculations.order_pricing"]
        distinguishing_aspect: "Immediate consistency: the confirm RESPONSE itself carries computed totals (subtotal 22604, total 22604), and a subsequent GET returns the same values — no stale reads, no repair pass."
        test_recipe:
          setup: ["Model M-PRICE (unit 11302), spec, dealer, order with line qty 2"]
          setup_api_calls:
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PRICE", category: "CHAIR", base_fabric_yards: 2.0, base_price_cents: 10002, requires_pattern_match: false, flammability_standard: "TB133", required_component_codes: [], option_rules: [{ fabric_grade: "C", finish_code: "WALNUT", allowed: true, surcharge_pct: 0.13, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-C", origin: "PLANT", grade: "C", nominal_width_inches: 54.0, price_per_yard_cents: 4000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-IMM", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "WALNUT", quantity: 2 }
              as: SalesRep
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
              captures: { conf_subtotal: $.data.subtotal_cents, conf_status: $.data.status }
            - call: "GET /mill/customer-orders/${order_id}"
              as: SalesRep
              captures: { get_total: $.data.total_cents }
          assert:
            - "Confirm response itself: conf_subtotal == 22604 and conf_status == MATERIAL_HOLD (no stock reserved — no lots exist)"
            - "Immediate GET: get_total == 22604 — identical to the write response"
