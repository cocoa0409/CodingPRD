  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tranche_exact_fit_then_one_cent_over
        grounds:
          - validations[priority=12]
          - state_machines.CapacityAllocation.ACTIVE_to_EXHAUSTED
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: |
          Metric = tranche capacity cents on the bind endpoint: consumption reaching
          EXACTLY allocated_cents (295000 == 295000) is allowed (<=) and flips the
          tranche to EXHAUSTED; one more policy (6500) over zero remaining headroom is
          ERR_TRANCHE_EXHAUSTED.
        test_recipe:
          setup:
            - "ACTIVE program (aggregate 500000, tranche exactly 295000)"
            - "P1 gross 155000 and P2 gross 140000 (90 units) quoted; P3 gross 6500 (1 unit) quoted"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier BP1", naic_code: "NAIC-BP1", contact_email: "uw@bp1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "BP1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 295000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { alloc: $.data.id } }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P1", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { p1: $.data.id } }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P2", state_code: "CA", class_code: "ARTISAN", exposure_units: 90, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { p2: $.data.id } }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "P3", state_code: "CA", class_code: "ARTISAN", exposure_units: 1, coverage_limit_cents: 50000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { p3: $.data.id } }
            - { call: "POST /mga/policies/${p1}/bind", payload: {}, as: MGAUnderwriter }
          trigger:
            - { call: "POST /mga/policies/${p2}/bind", payload: {}, as: MGAUnderwriter, captures: { p2_st: $.data.status } }
            - { call: "GET /mga/capacity-allocations/${alloc}", payload: {}, as: MGAUnderwriter, captures: { tr_st: $.data.status, tr_cons: $.data.consumed_cents } }
            - { call: "POST /mga/policies/${p3}/bind", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "P2 bind succeeds at exact fit: consumed 155000 + 140000 == allocated 295000 (equality allowed, boundary is inclusive <=)"
            - "tranche status == EXHAUSTED with consumed_cents == 295000"
            - "P3 bind (gross 6500, 1 cent of headroom short) rejected: error_id == ERR_TRANCHE_EXHAUSTED"
            - "Policy.${p3}.status remains QUOTED"

