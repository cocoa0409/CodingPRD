            - { call: "POST /escorts", payload: { operator_name: "OK only", certified_state_codes: ["OK"] }, as: Dispatcher, captures: { esc_ok: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Both", certified_state_codes: ["TX", "OK"] }, as: Dispatcher, captures: { esc_both: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_a}", load_description: "jA", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_a}", captures: { job_a: $.data.id } }
            - { call: "GET /jobs/${job_a}/legs", payload: {}, as: Dispatcher, captures: { leg_a: "$.data[0].id" } }
