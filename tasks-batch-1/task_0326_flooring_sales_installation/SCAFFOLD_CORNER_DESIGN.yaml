  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: missing_headers_unauthenticated
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Calling GET /flooring/products/{id} as Anonymous (no auth headers) returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /flooring/products"
              payload: { sku: "AUTH-1", name: "Auth LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /flooring/products/${prod_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: estimator_cannot_create_product_forbidden
        claim_type: Authorization
        grounds: ["validations[priority=2]", roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /flooring/products by an Estimator returns ERR_FORBIDDEN_ROLE (403); product creation is Admin-exclusive (peer_roles)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flooring/products"
              payload: { sku: "FORB-1", name: "Forb", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_accept_other_customers_estimate
        claim_type: Authorization
        grounds: ["validations[priority=3]", roles, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Customer accepting an estimate on a job owned by a different customer returns ERR_NOT_RESOURCE_OWNER (403) (entity_backed ownership)."
        test_recipe:
          setup: ["Customer A owns a job with an ISSUED estimate; Customer B (different id) attempts to accept it."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Owner A", address: "25 St", email: "ownera@x.com" }
              as: Anonymous
              captures: { cust_a: $.data.id }
            - call: "POST /flooring/customers"
              payload: { full_name: "Intruder B", address: "26 St", email: "ownerb@x.com" }
              as: Anonymous
              captures: { cust_b: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Ow" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "OWN-1", name: "Own LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_a}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: scheduler_cannot_create_job_forbidden
        claim_type: Authorization
        grounds: ["validations[priority=2]", roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /flooring/jobs by a Scheduler returns ERR_FORBIDDEN_ROLE (403); job creation is SalesRep/Admin only (peer_roles non-overlap)."
        test_recipe:
          setup: ["Customer, rep, product exist."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Sch Guy", address: "27 St", email: "sch@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Sc" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "SCH-1", name: "Sch LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

  # =====================================================================
  # Section: cross_cutting_complexity_layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_job_version_explicit_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-issue-stale-job]", entities.Estimate.fields.expected_job_version, "errors[ERR_STALE_JOB_VERSION]"]
        distinguishing_aspect: "Issuing est2 with a stale expected_job_version (the value observed before est1's issue bumped Job.version) returns ERR_STALE_JOB_VERSION (412); est2 stays DRAFT."
        test_recipe:
          setup: ["Job MEASURED; est1 issued (Job.version bumped); est2 created DRAFT; client still holds the pre-issue job version captured at measure."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Occ Guy", address: "28 St", email: "occ@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Oc" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "OCC-1", name: "Occ LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v_stale: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est1_id: $.data.id }
            - call: "POST /flooring/estimates/${est1_id}/issue"
              payload: { expected_job_version: "${job_v_stale}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est2_id: $.data.id }
          trigger:
            - call: "POST /flooring/estimates/${est2_id}/issue"
              payload: { expected_job_version: "${job_v_stale}" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_JOB_VERSION"
            - "Estimate.${est2_id}.status == DRAFT"

      - name: backorder_reorder_pushes_ready_date
        claim_type: rate_threshold_triggers
        grounds: [calculations.ready_date, state_machines.MaterialOrder.BACKORDERED_to_ORDERED, entities.MaterialOrder.fields.expected_ready_date]
        distinguishing_aspect: "Reordering a BACKORDERED order recomputes expected_ready_date from the reorder clock: reorder at 2026-06-10 for a 7-day-lead product sets expected_ready_date 2026-06-17T00:00:00.000Z (pushed out from the original 2026-06-08)."
        test_recipe:
          setup: ["ACCEPTED LVP job (lead 7d), MaterialOrder ORDERED ready 2026-06-08, backordered then reordered at clock 2026-06-10."]
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Push Guy", address: "29 St", email: "push@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Pu" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "PUSH-1", name: "Push LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 7, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 200 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 200, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /flooring/jobs/${job_id}/material-orders"
              payload: {}
              as: Scheduler
              captures: { mo_id: "$.data[0].id" }
            - call: "POST /flooring/material-orders/${mo_id}/backorder"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00.000Z" }
              as: Admin
          trigger:
            - call: "POST /flooring/material-orders/${mo_id}/reorder"
              payload: {}
              as: Scheduler
              captures: { erd: $.data.expected_ready_date }
          assert:
            - "MaterialOrder.${mo_id}.expected_ready_date == 2026-06-17T00:00:00.000Z"
            - "MaterialOrder.${mo_id}.status == ORDERED"

      - name: cascade_job_cancel_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Job.ACCEPTED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / job_cancel_depth3_teardown_estimate_order_slot
          rationale: "The depth-3 Job-cancel teardown cascade is asserted by the named §1.8 instance."

      - name: dual_variant_estimate_already_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.estimate_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / estimate_provisional_vs_measured_diverge_on_same_job
          rationale: "Both PROVISIONAL and MEASURED variant results and their divergence are asserted by the named §1.8 instance."

