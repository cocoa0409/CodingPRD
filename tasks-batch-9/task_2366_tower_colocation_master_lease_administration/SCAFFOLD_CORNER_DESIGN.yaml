              as: Tenant
              as_user_id: "${id_ten_id}"
              captures: { id_app_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${id_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "ID-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${id_ten_id}"
            - call: "POST /tower-colo/colocation-applications/${id_app_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${id_ten_id}"
          trigger:
            - call: "POST /tower-colo/colocation-applications/${id_app_id}/submit"
