      - name: scan_price_overcharge_at_enforcement_boundary_withdraws_the_lot
        claim_type: cross_entity
        grounds:
          - calculations.scan_price_enforcement
          - state_machines.DateCodeLot.transitions.MARKED_DOWN_to_WITHDRAWN
          - endpoints[POST /fresh/lots/{lotId}/scan-price-checks]
          - entities.ScanPriceCheck.fields.enforcement_action
        distinguishing_aspect: |
          A write to ScanPriceCheck changes DateCodeLot: scanning 534 against an expected 509 is a
          variance of exactly 25, the inclusive enforcement boundary, so enforcement_action is
          LOT_WITHDRAWN and the whole withdraw cascade fires — 24 units become a system
          WITHDRAWAL_AUTO shrink event, the APPLIED label is VOIDED and department liability
          collapses to 0 while shrink_cost_ratio_pct becomes 100.00.
        test_recipe:
          setup:
            - "The MEAT base chain; clock at 2026-08-12T00:00:00.000Z; rung-0 markdown to 509 cents with the label PRINTED and APPLIED."
            - "Before the scan the department shows markdown_liability_cents 2160 and shrink_cost_ratio_pct 0.00 with compliance_status COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/lots/${lot_id}/markdowns"
              payload: { expected_lot_version: "${lot_v1}", pricing_variant: "LADDER_DAYS" }
              as: FreshClerk
              captures: { label_id: $.data.id }
            - call: "POST /fresh/markdown-labels/${label_id}/print"
              payload: {}
              as: FreshClerk
            - call: "POST /fresh/markdown-labels/${label_id}/apply"
              payload: {}
              as: FreshClerk
          trigger:
            - call: "POST /fresh/lots/${lot_id}/scan-price-checks"
              payload: { register_lane_code: "L07", scanned_price_cents: 534 }
              as: FreshClerk
              captures: { check_id: $.data.id }
            - call: "GET /fresh/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
            - call: "GET /fresh/shrink-events?lot_id=${lot_id}&origin=WITHDRAWAL_AUTO"
              payload: {}
              as: DepartmentManager
          assert:
            - "check response: data.expected_price_cents == 509 and data.variance_cents == 25"
            - "check response: data.outcome == 'OVERCHARGE' and data.enforcement_action == 'LOT_WITHDRAWN'"
            - "DateCodeLot.${lot_id}.status == 'WITHDRAWN' with quantity_on_hand == 0 and units_shrunk == 24"
            - "MarkdownLabel.${label_id}.status == 'VOIDED'"
            - "shrink-events response: total_count == 1, data[0].status == 'VERIFIED', data[0].cause_code == 'SPOILAGE', data[0].quantity_units == 24, data[0].verified_by_user_id == 'system'"
            - "department response: data.markdown_liability_cents == 0"
            - "department response: data.shrink_cost_ratio_pct == 100.00 (round_half_up(24 * 420 * 1.035) == 10433 over a denominator of 10433)"
            - "department response: data.compliance_status == 'WATCH' (100.00 > shrink_budget_pct 2.5)"

      - name: pickup_cancel_unwinds_only_the_lines_still_assigned
        claim_type: conditional_cascade
        grounds:
          - state_machines.DonationPickup.transitions.SCHEDULED_to_CANCELLED
          - entities.DonationLotAssignment.fields.status
          - endpoints[POST /fresh/donation-pickups/{pickupId}/cancel]
          - endpoints[POST /fresh/lots/{lotId}/withdraw]
        distinguishing_aspect: |
          The cancel cascade is conditional on the child's state: of two manifest lines, the one
          already REJECTED by an earlier lot withdrawal is untouched and its lot stays WITHDRAWN,
          while the still-ASSIGNED line flips to REJECTED and only its lot leaves DONATION_PENDING
          for FRESH.
        test_recipe:
          setup:
            - "A PRODUCE department on store 0412 with an ACTIVE PRODUCE ladder and a MID-ATL food bank accepting PRODUCE."
            - "Two lots of 10 units produced 2026-08-10 with a 5-day department shelf life, so sell_by_at is 2026-08-15T00:00:00.000Z."
            - "Clock at 2026-08-13T12:00:00.000Z, inside the 48-hour donation window that opened 2026-08-13T00:00:00.000Z."
            - "Both lots assigned to one SCHEDULED pickup (manifest DRAFT, assignment_count 2), then lot P1 withdrawn, which REJECTs its line and drops assignment_count to 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
