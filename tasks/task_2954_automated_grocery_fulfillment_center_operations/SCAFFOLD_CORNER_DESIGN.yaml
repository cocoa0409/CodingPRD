# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
#
# Task 2954 — Automated Grocery Fulfillment Center Operations
#
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# `section:` values are the guide's nine section names; `claim_type:` values are
# the guide's per-section table rows. §1.8 owns the depth probe; anything §1.8
# already asserts is emitted here as an `excluded_because:` stub.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * The logical clock boots at 2026-08-01T00:00:00.000Z and is only moved by
#     an explicit POST /_clock/set_current_utc call.
#   * Slot windows at 2026-08-05T10:00:00.000Z are >= 36 h ahead of the boot
#     clock, so slot_surge_multiplier's lead_add is 0.00.
#   * "00000000-0000-4000-8000-0000000000NN" ids are deliberately unused so
#     they resolve to nothing.
#   * Rows the scaffold makes non-applicable are skipped: every entity declares
#     `common_fields: true`, so the Entities "Immutability" row has no subject;
#     `entity_topology` is `flat`, so the hierarchical / graph / hybrid topology
#     rows have no subject; `complexity_layers` declares only
#     optimistic_concurrency, cascading_side_effects, dual_variant_calculation
#     and selector_policy, so every other layer row (soft_delete, idempotency,
#     pagination_with_filtering, bulk_operations, scheduled_actions,
#     multi_tenancy, rate_threshold_triggers, derived_field_reconciliation,
#     conditional_feature_flags) has no subject. `selector_policy` has no row in
#     the guide's layer table, so it is emitted in the complexity_layers section
#     under its own declared layer name and is probed further through the
#     Calculations `weighted_scoring` / `chronological` rows its selectors use.
#   * `consistency_model` is `immediate` and `state_machine_shape` is `cyclic`,
#     so only those two rows of their respective tables are emitted.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_delivery_route_persists_all_input_fields
        claim_type: creation
        grounds:
          - entities.DeliveryRoute
          - endpoints[POST /delivery-routes]
        distinguishing_aspect: "POST /delivery-routes with all five required inputs returns the DeliveryRoute with every submitted value echoed plus system id / created_at / updated_at / version."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /delivery-routes/${route_id}"
              as: FulfillmentAdmin
              as_user_id: "admin-1"
          assert:
            - "DeliveryRoute.${route_id}.route_code == R1"
            - "DeliveryRoute.${route_id}.service_area_name == North"
            - "DeliveryRoute.${route_id}.van_capacity_totes == 40"
            - "DeliveryRoute.${route_id}.base_delivery_fee_cents == 599"
            - "DeliveryRoute.${route_id}.per_km_cost_cents == 150"
            - "DeliveryRoute.${route_id}.version == 1"
            - "response envelope contains meta.api_request_id and response_type == object"

      - name: get_delivery_route_unknown_id_returns_route_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_ROUTE_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A GET on a well-formed but unused DeliveryRoute id returns ERR_ROUTE_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup: ["Empty database; no DeliveryRoute has ever been created."]
          setup_api_calls:
            - call: "POST /dock-bays"
              payload: { bay_code: "B1", parallel_van_capacity: 2 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
          trigger:
            - call: "GET /delivery-routes/00000000-0000-4000-8000-000000000001"
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_ROUTE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"
            - "DockBay.${bay_id} still exists and is untouched"

      - name: create_delivery_route_missing_per_km_cost_cents_rejected
        claim_type: required_fields
        grounds:
          - entities.DeliveryRoute.fields.per_km_cost_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=8]
        distinguishing_aspect: "Omitting the required per_km_cost_cents input returns ERR_INVALID_REQUEST (422) and creates no DeliveryRoute row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /dock-bays"
              payload: { bay_code: "B1", parallel_van_capacity: 2 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /delivery-slots returns total_count == 0 (no route exists to hang a slot on)"
            - "DockBay.${bay_id}.parallel_van_capacity == 2"

      - name: create_delivery_route_van_capacity_totes_zero_rejected
        claim_type: type_constraints
        grounds:
          - entities.DeliveryRoute.fields.van_capacity_totes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "van_capacity_totes is constrained to >= 1, so the value 0 is rejected with ERR_INVALID_REQUEST (422) rather than stored."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 0, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"

      - name: create_delivery_route_duplicate_route_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.DeliveryRoute.fields.route_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "route_code is unique, so a second POST reusing R1 returns ERR_INVALID_REQUEST (422) and leaves exactly one route."
        test_recipe:
          setup: ["One DeliveryRoute with route_code R1 already exists."]
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "South", van_capacity_totes: 20, base_delivery_fee_cents: 499, per_km_cost_cents: 120 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "DeliveryRoute.${route_id}.service_area_name == North"
            - "DeliveryRoute.${route_id}.van_capacity_totes == 40"

      - name: get_dock_bay_unknown_id_returns_dock_bay_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_DOCK_BAY_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A GET on an unused DockBay id returns ERR_DOCK_BAY_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One DockBay exists so the collection is non-empty."]
          setup_api_calls:
            - call: "POST /dock-bays"
              payload: { bay_code: "B1", parallel_van_capacity: 2 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
          trigger:
            - call: "GET /dock-bays/00000000-0000-4000-8000-000000000002"
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_DOCK_BAY_NOT_FOUND"
            - "DockBay.${bay_id}.bay_code == B1"

      - name: create_grid_zone_defaults_operational_status_and_null_scores
        claim_type: defaults
        grounds:
          - entities.GridZone.fields.status
          - entities.GridZone.fields.accuracy_score_unit_weighted
          - entities.GridZone.fields.accuracy_score_sku_weighted
          - entities.GridZone.fields.last_audited_at
          - state_machines.GridZone.initial_state
        distinguishing_aspect: "A newly created GridZone starts OPERATIONAL with both accuracy scores and last_audited_at null — the audit fields are only written by POST /grid-zones/{zoneId}/audit-counts."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "F1", temperature_zone: "FROZEN", bot_count: 12 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
          trigger:
            - call: "GET /grid-zones/${zone_id}"
              as: GridEngineer
              as_user_id: "grid-1"
          assert:
            - "GridZone.${zone_id}.status == OPERATIONAL"
            - "GridZone.${zone_id}.temperature_zone == FROZEN"
            - "GridZone.${zone_id}.bot_count == 12"
            - "GridZone.${zone_id}.accuracy_score_unit_weighted == null"
            - "GridZone.${zone_id}.accuracy_score_sku_weighted == null"
            - "GridZone.${zone_id}.last_audited_at == null"

      - name: create_grid_zone_invalid_temperature_zone_rejected
        claim_type: type_constraints
        grounds:
          - entities.GridZone.fields.temperature_zone
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "temperature_zone accepts only AMBIENT / CHILLED / FROZEN, so the value COOL returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /grid-zones"
              payload: { zone_code: "X1", temperature_zone: "COOL", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_grid_zone_unknown_id_returns_zone_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_ZONE_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A GET on an unused GridZone id returns ERR_ZONE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One AMBIENT GridZone exists."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
          trigger:
            - call: "GET /grid-zones/00000000-0000-4000-8000-000000000003"
              as: GridEngineer
              as_user_id: "grid-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_ZONE_NOT_FOUND"
            - "GridZone.${zone_id}.status == OPERATIONAL"

      - name: create_pick_station_defaults_zero_totes_and_idle_status
        claim_type: defaults
        grounds:
          - entities.PickStation.fields.current_tote_count
          - entities.PickStation.fields.status
        distinguishing_aspect: "A newly created PickStation starts with current_tote_count 0 and status IDLE; the capability array is stored verbatim."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["CHILLED", "FROZEN"], max_concurrent_totes: 3 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { station_id: $.data.id }
          trigger:
            - call: "GET /pick-stations/${station_id}"
              as: PickOperator
              as_user_id: "picker-1"
          assert:
            - "PickStation.${station_id}.current_tote_count == 0"
            - "PickStation.${station_id}.status == IDLE"
            - "PickStation.${station_id}.max_concurrent_totes == 3"
            - "PickStation.${station_id}.temperature_zone_capability == [CHILLED, FROZEN]"

      - name: get_pick_station_unknown_id_returns_pick_station_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PICK_STATION_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A GET on an unused PickStation id returns ERR_PICK_STATION_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One PickStation exists."]
          setup_api_calls:
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT"], max_concurrent_totes: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { station_id: $.data.id }
          trigger:
            - call: "GET /pick-stations/00000000-0000-4000-8000-000000000004"
              as: PickOperator
              as_user_id: "picker-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_PICK_STATION_NOT_FOUND"
            - "PickStation.${station_id}.station_code == S1"

      - name: create_inventory_sku_computes_on_hand_units_from_physical_units
        claim_type: computed_fields
        grounds:
          - entities.InventorySku.fields.allocated_units
          - entities.InventorySku.fields.on_hand_units
          - calculations.sku_unit_ledger
        distinguishing_aspect: "A brand-new InventorySku has allocated_units 0 and on_hand_units equal to physical_units (250), satisfying physical_units == on_hand_units + allocated_units before any PickTask exists."
        test_recipe:
          setup: ["One CHILLED GridZone exists to host the SKU."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "C1", temperature_zone: "CHILLED", bot_count: 6 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_chl: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "CHL-1", name: "Fresh Milk", grid_zone_id: "${zone_chl}", temperature_zone: "CHILLED", substitution_group_code: "DAIRY", is_catchweight: false, unit_price_cents: 120, physical_units: 250 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
          trigger:
            - call: "GET /inventory-skus/${sku_id}"
              as: PickOperator
              as_user_id: "picker-1"
          assert:
            - "InventorySku.${sku_id}.physical_units == 250"
            - "InventorySku.${sku_id}.allocated_units == 0"
            - "InventorySku.${sku_id}.on_hand_units == 250"
            - "InventorySku.${sku_id}.last_count_system_units == null"
            - "InventorySku.${sku_id}.last_count_counted_units == null"
            - "InventorySku.${sku_id}.last_count_variance_units == null"
            - "InventorySku.${sku_id}.price_per_kg_cents == null"
            - "InventorySku.${sku_id}.nominal_weight_grams == null"

      - name: create_inventory_sku_system_fields_generated_and_extra_field_ignored
        claim_type: system_fields
        grounds:
          - entities.InventorySku
          - endpoints[POST /inventory-skus]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server; an unrecognised body key is not persisted and the created SKU's version is 1."
        test_recipe:
          setup: ["One AMBIENT GridZone exists."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
          trigger:
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
          assert:
            - "InventorySku.${sku_id}.id is a server-generated identifier, not any client-supplied value"
            - "InventorySku.${sku_id}.version == 1"
            - "InventorySku.${sku_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "InventorySku.${sku_id}.updated_at == 2026-08-01T00:00:00.000Z"
            - "InventorySku.${sku_id}.allocated_units == 0"

      - name: create_inventory_sku_zone_temperature_zone_mismatch_rejected
        claim_type: parent_relationships
        grounds:
          - entities.InventorySku.fields.grid_zone_id
          - errors.ERR_TEMPERATURE_ZONE_MISMATCH
          - validations[priority=14]
        distinguishing_aspect: "A FROZEN SKU pointed at an AMBIENT GridZone is rejected with ERR_TEMPERATURE_ZONE_MISMATCH (422): the FK must resolve AND agree on temperature_zone."
        test_recipe:
          setup: ["One AMBIENT GridZone exists; no FROZEN zone exists."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
          trigger:
            - call: "POST /inventory-skus"
              payload: { sku_code: "FRZ-1", name: "Ice Cream", grid_zone_id: "${zone_amb}", temperature_zone: "FROZEN", substitution_group_code: "DESSERT", is_catchweight: false, unit_price_cents: 450, physical_units: 40 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_TEMPERATURE_ZONE_MISMATCH"
            - "GET /inventory-skus?grid_zone_id=${zone_amb} returns total_count == 0"

      - name: create_inventory_sku_unknown_grid_zone_returns_zone_not_found
        claim_type: parent_relationships
        grounds:
          - entities.InventorySku.fields.grid_zone_id
          - errors.ERR_ZONE_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "A body FK naming a non-existent GridZone yields ERR_ZONE_NOT_FOUND (404) at validation priority 6, ahead of any field-shape or business check."
        test_recipe:
          setup: ["Empty database; no GridZone exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "00000000-0000-4000-8000-000000000005", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_ZONE_NOT_FOUND"

      - name: get_inventory_sku_unknown_id_returns_sku_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_SKU_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A GET on an unused InventorySku id returns ERR_SKU_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["One AMBIENT SKU exists."]
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
          trigger:
            - call: "GET /inventory-skus/00000000-0000-4000-8000-000000000006"
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_SKU_NOT_FOUND"
            - "InventorySku.${sku_id}.sku_code == AMB-1"

      - name: list_inventory_skus_returns_paginated_envelope_with_default_limit
        claim_type: listing
        grounds:
          - endpoints[GET /inventory-skus]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 12 SKUs in one zone and no pagination inputs, the list returns limit 10, offset 0, total_count 12 and has_more true — the declared defaults, not all 12 rows."
        test_recipe:
          setup:
            - "One AMBIENT GridZone holding exactly 12 AMBIENT SKUs with sku_code AMB-01 .. AMB-12, each physical_units 10 and unit_price_cents 700."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-01", name: "Item 01", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_first: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-02", name: "Item 02", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-03", name: "Item 03", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-04", name: "Item 04", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-05", name: "Item 05", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-06", name: "Item 06", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
            - call: "POST /inventory-skus"
