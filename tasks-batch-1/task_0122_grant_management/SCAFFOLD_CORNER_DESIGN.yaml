              payload: { nofo_number: "NOFO-2026-C23", applicant_org_name: "Corner Org 23", requested_amount_cents: 100000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c23_app_id: $.data.id }
            - call: "POST /applications/${c23_app_id}/submit"
