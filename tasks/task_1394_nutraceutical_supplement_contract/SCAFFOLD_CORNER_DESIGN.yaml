        as: ProductionPlanner
        captures:
          err: $.data.error_id
      assert:
      - First PUT -> 200 and ${f_v2} == ${f_v} + 1
      - Second PUT with the original base version -> ${err} == ERR_STALE_VERSION (412)
      - Formula.${f_id}.name == 'C500-v1.1' (first write stands)
