              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-UNQ", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
