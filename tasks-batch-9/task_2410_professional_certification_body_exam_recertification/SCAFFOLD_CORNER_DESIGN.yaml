      - name: cycle_close_is_refused_until_credits_are_satisfied_and_then_needs_the_current_certificant_version
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/recertification-cycles/{id}/close
          - validations[priority=39]
          - validations[priority=11]
          - errors.ERR_CREDITS_NOT_SATISFIED
          - errors.ERR_STALE_VERSION
          - concurrency_rules.cycle-close-stale-certificant
          - state_machines.RecertificationCycle.SATISFIED_to_CLOSED
          - calculations.carryover_computation
        distinguishing_aspect: |
          The close action is admissible only under two independent conditions: credits_applied
          must have reached required_credits — otherwise 422 ERR_CREDITS_NOT_SATISFIED with an
          otherwise valid OCC token — and the supplied expected_certificant_version must be the
