# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2366 — Tower Colocation & Master Lease Administration
# 9 rule_ids / 25 instances. Every asserted numeric literal was produced by
# executing the corresponding §1.3 formula in code against the pinned fixture.
# Logical clock default: 2026-08-01T00:00:00Z (POST /tower-colo/_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: structural_analysis_preliminary_vs_detailed_divergence_on_tower
        grounds:
          - calculations.structural_loading_analysis
          - entities.StructuralAnalysis.fields.variant
          - entities.StructuralAnalysis.fields.projected_loading_pct
          - state_machines.ColocationApplication.UNDER_STRUCTURAL_REVIEW_to_MODIFICATION_REQUIRED
        distinguishing_aspect: |
          This dual variant operates on the STRUCTURAL domain of a Tower: PRELIMINARY sets the
          pipeline term to 0 while DETAILED adds every other application's reserved-but-unbuilt
          load, so the identical subject application on the identical tower yields 63.889 PASS
          under PRELIMINARY and 98.611 MODIFICATION_REQUIRED under DETAILED.
        test_recipe:
          setup:
            - "Tower T3 rated 7200 load units with 3000 baseline reserved load units and an ACTIVE ground lease, posture OPEN."
            - "Tenant BBB's application app_b (total_load_units 2500) is APPROVED, so it contributes pipeline demand but no standing load."
            - "Tenant AAA's application app_a (total_load_units 1600) sits in UNDER_STRUCTURAL_REVIEW."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T3 Summit", structure_type: "SELF_SUPPORT", rated_capacity_load_units: 7200, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 20000, baseline_reserved_load_units: 3000, baseline_reserved_ground_sqft: 0 }
              as: PortfolioAdmin
              captures: { t3_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Summit Land LLC", remit_contact_email: "pay@summit.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { ll3_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${t3_id}", landlord_id: "${ll3_id}", base_monthly_rent_cents: 400000, escalator_pct: 2.5, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 2, renewal_term_years: 5, buyout_price_cents: 12000000 }
              as: PortfolioAdmin
              captures: { gl3_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Alpha Wireless", carrier_code: "AAA" }
              as: PortfolioAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Beta Mobility", carrier_code: "BBB" }
              as: PortfolioAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${ta_id}", base_monthly_rent_cents: 250000, escalator_pct: 3.5, initial_term_years: 10, renewal_terms_count: 2, expires_on: "2036-07-31", expedited_review_days: 15 }
              as: PortfolioAdmin
              captures: { mla_a_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${mla_a_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${tb_id}", base_monthly_rent_cents: 300000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 2, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { mla_b_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${mla_b_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${t3_id}", master_lease_agreement_id: "${mla_b_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 400 }
              as: Tenant
              as_user_id: "${tb_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_b_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "PX-250", quantity: 10, unit_weight_lbs: 250, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${tb_id}"
            - call: "POST /tower-colo/colocation-applications/${app_b_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${tb_id}"
            - call: "GET /tower-colo/towers/${t3_id}"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { t3_v_pre_b: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${app_b_id}", variant: "PRELIMINARY", expected_tower_version: "${t3_v_pre_b}" }
              as: StructuralEngineer
              as_user_id: "eng-1"
            - call: "POST /tower-colo/colocation-applications/${app_b_id}/approve"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${t3_id}", master_lease_agreement_id: "${mla_a_id}", requested_elevation_bottom_ft: 150, requested_elevation_top_ft: 190, requested_ground_space_sqft: 500 }
              as: Tenant
              as_user_id: "${ta_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "PX-160", quantity: 10, unit_weight_lbs: 160, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${ta_id}"
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${ta_id}"
          trigger:
            - call: "GET /tower-colo/towers/${t3_id}"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { t3_v_pre: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${app_a_id}", variant: "PRELIMINARY", expected_tower_version: "${t3_v_pre}" }
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { pre_analysis_id: $.data.id }
            - call: "GET /tower-colo/towers/${t3_id}"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { t3_v_det: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${app_a_id}", variant: "DETAILED", expected_tower_version: "${t3_v_det}" }
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { det_analysis_id: $.data.id }
          assert:
            - "StructuralAnalysis.${pre_analysis_id}.included_load_units == 4600"
            - "StructuralAnalysis.${pre_analysis_id}.projected_loading_pct == 63.889"
            - "StructuralAnalysis.${pre_analysis_id}.result == PASS"
            - "StructuralAnalysis.${det_analysis_id}.included_load_units == 7100"
            - "StructuralAnalysis.${det_analysis_id}.projected_loading_pct == 98.611"
            - "StructuralAnalysis.${det_analysis_id}.result == MODIFICATION_REQUIRED"
            - "StructuralAnalysis.${pre_analysis_id}.status == SUPERSEDED"
            - "ColocationApplication.${app_a_id}.status == MODIFICATION_REQUIRED"
            - "Tower.${t3_id}.open_review_count == 0"

      - name: retroactive_billing_install_date_vs_discovery_limited_on_tenant
        grounds:
          - calculations.retroactive_unauthorized_billing
          - entities.EquipmentAudit.fields.basis
          - entities.AuditFinding.fields.months_billable
          - state_machines.EquipmentAudit.IN_PROGRESS_to_FINALIZED
        distinguishing_aspect: |
          This dual variant operates on the RECEIVABLES domain of a Tenant, not on tower
          structure: with identical finding inputs (installed 2023-02-15, audited 2026-07-31,
          120 observed load units) INSTALL_DATE_BASIS bills 41 months = 184500 cents while
          DISCOVERY_LIMITED caps at RETRO_CAP_MONTHS 24 = 108000 cents.
        test_recipe:
          setup:
            - "Tower T5 exists; tenant CCC exists with a zero balance."
            - "Two audits on T5 dated 2026-07-31, one with basis INSTALL_DATE_BASIS and one with basis DISCOVERY_LIMITED, each IN_PROGRESS and each carrying one identical finding (120 load units installed 2023-02-15)."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T5 Mesa", structure_type: "GUYED", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 40, max_elevation_ft: 320, ground_space_total_sqft: 15000 }
              as: PortfolioAdmin
              captures: { t5_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Gamma Telecom", carrier_code: "CCC" }
              as: PortfolioAdmin
              captures: { tc_id: $.data.id }
            - call: "POST /tower-colo/equipment-audits"
              payload: { tower_id: "${t5_id}", audit_date: "2026-07-31", basis: "INSTALL_DATE_BASIS" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_i_id: $.data.id }
            - call: "POST /tower-colo/equipment-audits/${audit_i_id}/start"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /tower-colo/equipment-audits/${audit_i_id}/findings"
              payload: { tenant_id: "${tc_id}", description: "Unpermitted 4-panel array on north leg", observed_load_units: 120, installed_on_date: "2023-02-15", mount_elevation_ft: 180 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { finding_i_id: $.data.id }
            - call: "POST /tower-colo/equipment-audits"
              payload: { tower_id: "${t5_id}", audit_date: "2026-07-31", basis: "DISCOVERY_LIMITED" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_d_id: $.data.id }
            - call: "POST /tower-colo/equipment-audits/${audit_d_id}/start"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /tower-colo/equipment-audits/${audit_d_id}/findings"
              payload: { tenant_id: "${tc_id}", description: "Unpermitted 4-panel array on south leg", observed_load_units: 120, installed_on_date: "2023-02-15", mount_elevation_ft: 180 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { finding_d_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/equipment-audits/${audit_i_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /tower-colo/equipment-audits/${audit_d_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "AuditFinding.${finding_i_id}.months_billable == 41"
            - "AuditFinding.${finding_i_id}.retroactive_billing_cents == 184500"
            - "AuditFinding.${finding_d_id}.months_billable == 24"
            - "AuditFinding.${finding_d_id}.retroactive_billing_cents == 108000"
            - "EquipmentAudit.${audit_i_id}.retroactive_billing_total_cents == 184500"
            - "EquipmentAudit.${audit_d_id}.retroactive_billing_total_cents == 108000"
            - "Tenant.${tc_id}.outstanding_balance_cents == 292500"
            - "Tenant.${tc_id}.credit_status == CURRENT"

  - rule_id: combinatorial_formula
    instances:
      - name: equipment_line_load_tiered_elevation_multiplier_mode_a
        grounds:
          - calculations.equipment_line_load_units
          - entities.EquipmentLine.fields.load_units
          - entities.ColocationApplication.fields.total_load_units
        distinguishing_aspect: |
          Mode (a): four inputs (unit_weight_lbs, wind_area_sqft, quantity, mount_elevation_ft)
          interact non-linearly because mount_elevation_ft selects a multiplier from a strict
          three-step conditional ladder (1.00 / 1.25 / 1.50) that multiplies the wind-augmented
          weight product — three lines on one application land in three different tiers.
        test_recipe:
          setup:
            - "Tower T6 with usable elevation 40..320 ft and an ACTIVE master lease for tenant DDD."
            - "A DRAFT application with three equipment lines mounted at 125 ft (tier 2), 95 ft (tier 1) and 250 ft (tier 3)."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T6 Bluff", structure_type: "MONOPOLE", rated_capacity_load_units: 12000, min_colocation_elevation_ft: 40, max_elevation_ft: 320, ground_space_total_sqft: 18000 }
              as: PortfolioAdmin
              captures: { t6_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Delta Networks", carrier_code: "DDD" }
              as: PortfolioAdmin
              captures: { td_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${td_id}", base_monthly_rent_cents: 220000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { mla_d_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${mla_d_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${t6_id}", master_lease_agreement_id: "${mla_d_id}", requested_elevation_bottom_ft: 90, requested_elevation_top_ft: 260, requested_ground_space_sqft: 600 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { app_d_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/colocation-applications/${app_d_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "AX-60", quantity: 3, unit_weight_lbs: 60, wind_area_sqft: 8, mount_elevation_ft: 125 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { line_t2_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_d_id}/equipment-lines"
              payload: { equipment_type: "RRU", model_code: "RU-55", quantity: 6, unit_weight_lbs: 55, wind_area_sqft: 2, mount_elevation_ft: 95 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { line_t1_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_d_id}/equipment-lines"
              payload: { equipment_type: "DISH", model_code: "MW-20", quantity: 4, unit_weight_lbs: 20, wind_area_sqft: 0.5, mount_elevation_ft: 250 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { line_t3_id: $.data.id }
          assert:
            - "EquipmentLine.${line_t2_id}.load_units == 1125.0"
            - "EquipmentLine.${line_t1_id}.load_units == 690.0"
            - "EquipmentLine.${line_t3_id}.load_units == 210.0"
            - "ColocationApplication.${app_d_id}.total_load_units == 2025.0"

      - name: amendment_rent_rounds_at_every_anniversary_mode_b
        grounds:
          - calculations.amendment_rent_escalation
          - entities.SiteAmendment.fields.current_monthly_rent_cents
          - state_machines.SiteAmendment.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is the whole difference — rounding to whole cents at each
          of the 4 anniversaries yields 286880 while the single-shot power form
          round_half_up(250000 * 1.035^4) yields 286881; the scaffold pins round-then-compound.
        test_recipe:
          setup:
            - "Tower T1 rated 10000 load units with 2000 baseline reserved load units, 20000 sqft ground space and an ACTIVE ground lease running to 2031-05-31."
            - "Tenant AAA holds an ACTIVE master lease at 250000 cents / 3.5% escalator; its application app_a (total_load_units 1815) is APPROVED after a PASS analysis."
            - "A DRAFT site amendment for app_a with effective_date 2022-08-01, base rent 250000 and escalator 3.5%; the logical clock stands at the 2026-08-01 default, i.e. exactly 4 anniversaries later."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T1 Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 10000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 20000, baseline_reserved_load_units: 2000, baseline_reserved_ground_sqft: 0 }
              as: PortfolioAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Ridge Land LLC", remit_contact_email: "pay@ridge.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { ll1_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${t1_id}", landlord_id: "${ll1_id}", base_monthly_rent_cents: 400000, escalator_pct: 2.5, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 2, renewal_term_years: 5, buyout_price_cents: 12000000 }
              as: PortfolioAdmin
              captures: { gl1_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Alpha Wireless", carrier_code: "AAA" }
              as: PortfolioAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${ta_id}", base_monthly_rent_cents: 250000, escalator_pct: 3.5, initial_term_years: 10, renewal_terms_count: 2, expires_on: "2036-07-31", expedited_review_days: 15 }
              as: PortfolioAdmin
              captures: { mla_a_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${mla_a_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${t1_id}", master_lease_agreement_id: "${mla_a_id}", requested_elevation_bottom_ft: 150, requested_elevation_top_ft: 190, requested_ground_space_sqft: 500 }
              as: Tenant
              as_user_id: "${ta_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "AX-60", quantity: 3, unit_weight_lbs: 60, wind_area_sqft: 8, mount_elevation_ft: 125 }
              as: Tenant
              as_user_id: "${ta_id}"
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/equipment-lines"
              payload: { equipment_type: "RRU", model_code: "RU-55", quantity: 6, unit_weight_lbs: 55, wind_area_sqft: 2, mount_elevation_ft: 95 }
              as: Tenant
              as_user_id: "${ta_id}"
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${ta_id}"
            - call: "GET /tower-colo/towers/${t1_id}"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { t1_v_pre: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${app_a_id}", variant: "PRELIMINARY", expected_tower_version: "${t1_v_pre}" }
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { an_a_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_a_id}/approve"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/site-amendments"
              payload: { master_lease_agreement_id: "${mla_a_id}", tower_id: "${t1_id}", colocation_application_id: "${app_a_id}", effective_date: "2022-08-01", term_end_date: "2031-05-31", base_monthly_rent_cents: 250000, escalator_pct: 3.5, restoration_deposit_cents: 0 }
              as: PortfolioAdmin
              captures: { am_a_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/site-amendments/${am_a_id}/execute"
              payload: { signature_received: true }
              as: PortfolioAdmin
          assert:
            - "SiteAmendment.${am_a_id}.current_monthly_rent_cents == 286880"
            - "SiteAmendment.${am_a_id}.current_monthly_rent_cents != 286881"
            - "SiteAmendment.${am_a_id}.execution_status == EXECUTED"
            - "SiteAmendment.${am_a_id}.billing_status == BILLING"
            - "StructuralAnalysis.${an_a_id}.projected_loading_pct == 38.15"
            - "Tower.${t1_id}.reserved_load_units == 3815.0"

      - name: modification_cost_pipeline_pins_discount_tier_mode_c
        grounds:
          - calculations.modification_project_total_cost
          - entities.ModificationProject.fields.volume_discount_pct
          - entities.ModificationProject.fields.total_cost_cents
          - state_machines.ModificationProject.PROPOSED_to_COST_ALLOCATED
        distinguishing_aspect: |
          Mode (c): the fee depends on the construction cost, the discount tier depends on the
          construction-plus-fee total, and the discount changes the construction cost the fee is
          computed from; the pinned order selects the 3% tier ONCE from base_total 25088000 and
          yields total_cost_cents 24335360, whereas re-deriving the tier from the post-discount
          total (24335360 < 25000000, i.e. the 1.5% tier) would yield 24711680.
        test_recipe:
          setup:
            - "Tower T2 rated 4000 load units with 3000 baseline reserved load units, posture OPEN."
            - "Tenant EEE's application app_q (total_load_units 800.1) is in MODIFICATION_REQUIRED after a PRELIMINARY analysis returned 95.003%."
            - "That analysis carries a quotation of 22400000 cents and a PROPOSED project reserves the window 2026-09-01..2026-10-31."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T2 Crest", structure_type: "SELF_SUPPORT", rated_capacity_load_units: 4000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 10000, baseline_reserved_load_units: 3000, baseline_reserved_ground_sqft: 0 }
              as: PortfolioAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Epsilon Cellular", carrier_code: "EEE" }
              as: PortfolioAdmin
              captures: { te_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${te_id}", base_monthly_rent_cents: 240000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { mla_e_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${mla_e_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${t2_id}", master_lease_agreement_id: "${mla_e_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 400 }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { app_q_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${app_q_id}/equipment-lines"
