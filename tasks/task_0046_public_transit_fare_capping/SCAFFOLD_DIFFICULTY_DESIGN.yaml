scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tap_charge_chronological_vs_forward_diverge_on_out_of_order_quote
        grounds:
          - calculations.compute_tap_charge
          - state_machines.Tap.PENDING_to_CAPTURED
          - endpoints./taps/quote
          - entities.Tap.fields.charge_cents
        distinguishing_aspect: |
          On the Tap domain: a tap quoted with tapped_at 07:00 — earlier than an already-CAPTURED 08:00
          tap — yields forward_looking_estimate 200 (appends to today's set) while chronological_actual
          would charge 300 (no prior captured tap before 07:00); the two algorithms produce different cents
          for identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T12:00:00Z."
            - "FareProduct zone ZONE_X: base 300, daily_cap 500, weekly_cap 2500, transfer_discount_pct 0, reduced_fare_pct 0.5."
            - "Rider R1 (STANDARD) with an ACTIVE FundingSource F1 loaded to 100000 cents."
            - "OPEN FareWeek W1 for R1, week_start 2026-06-01 (Monday), zone ZONE_X."
            - "One CAPTURED tap T1 at 2026-06-01T08:00:00Z charged 300; FareWeek.charged_total_cents == 300."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500, transfer_discount_pct: 0, reduced_fare_pct: 0.5 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r1@x.com", full_name: "R One", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r1: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r1}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r1}"
              captures: { f1: $.data.id }
            - call: "POST /funding-sources/${f1}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r1}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r1}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r1}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r1}", fare_week_id: "${w1}", funding_source_id: "${f1}", tapped_at: "2026-06-01T08:00:00Z" }
              as: Rider
              as_user_id: "${r1}"
              captures: { t1: $.data.id }
            - call: "POST /taps/${t1}/settle"
              payload: {}
              as: PaymentGateway
          trigger:
            - call: "GET /taps/quote?rider_id=${r1}&fare_week_id=${w1}&tapped_at=2026-06-01T07:00:00Z"
              payload: { rider_id: "${r1}", fare_week_id: "${w1}", tapped_at: "2026-06-01T07:00:00Z" }
              as: Rider
              as_user_id: "${r1}"
              captures: { est: $.data.estimated_charge_cents }
          assert:
            - "quote.estimated_charge_cents == 200"
            - "Tap.${t1}.charge_cents == 300"
            - "If a real tap were settled at 2026-06-01T07:00:00Z it would charge 300 (full fare), diverging from the 200 estimate."

      - name: rider_risk_gross_vs_trailing_week_diverge
        grounds:
          - calculations.rider_risk_score
          - endpoints./riders/{id}/risk
          - entities.Rider.fields.status
        distinguishing_aspect: |
          On the Rider domain (distinct from compute_tap_charge): gross counts every REJECTED/REVERSED tap
          (2 rejects -> 30) while trailing_week counts only incidents within 7 days of the clock (1 recent
          reject -> 15); same rider, two scores.
        test_recipe:
          setup:
            - "Clock at 2026-06-20T00:00:00Z."
            - "FareProduct ZONE_X base 300, daily 500, weekly 2500."
            - "Rider R2 with FundingSource F2 loaded to 200 cents (below the 300 fare)."
            - "OPEN FareWeek W_old (week_start 2026-06-01) and W_new (week_start 2026-06-15)."
            - "One REJECTED tap on 2026-06-02 (insufficient funds, old) and one REJECTED tap on 2026-06-16 (within trailing week)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r2@x.com", full_name: "R Two", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r2: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r2}", source_type: "GOOGLE_PAY" }
              as: Rider
              as_user_id: "${r2}"
              captures: { f2: $.data.id }
            - call: "POST /funding-sources/${f2}/load"
              payload: { amount_cents: 200 }
              as: Rider
              as_user_id: "${r2}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r2}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r2}"
              captures: { w_old: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r2}", fare_week_id: "${w_old}", funding_source_id: "${f2}", tapped_at: "2026-06-02T08:00:00Z" }
              as: Rider
              as_user_id: "${r2}"
              captures: { tap_old: $.data.id }
            - call: "POST /taps/${tap_old}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r2}", week_start_date: "2026-06-15", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r2}"
              captures: { w_new: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r2}", fare_week_id: "${w_new}", funding_source_id: "${f2}", tapped_at: "2026-06-16T08:00:00Z" }
              as: Rider
              as_user_id: "${r2}"
              captures: { tap_new: $.data.id }
            - call: "POST /taps/${tap_new}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: FareAdmin
          trigger:
            - call: "GET /riders/${r2}/risk?mode=gross"
              payload: { mode: "gross" }
              as: FareAdmin
              captures: { gross: $.data.rider_risk_score }
            - call: "GET /riders/${r2}/risk?mode=trailing_week"
              payload: { mode: "trailing_week" }
              as: FareAdmin
              captures: { tw: $.data.rider_risk_score }
          assert:
            - "gross rider_risk_score == 50 (2 rejects * 15 == 30, plus low-balance flag 20 since F2 balance 200 < 500)"
            - "trailing_week rider_risk_score == 35 (1 reject in window * 15 == 15, plus low-balance flag 20)"
            - "gross != trailing_week"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: discount_stacking_takes_max_then_min_caps_mode_a
        grounds:
          - calculations.compute_tap_charge
          - entities.Rider.fields.low_income_discount_pct
          - entities.FareProduct.fields.reduced_fare_pct
          - state_machines.Tap.PENDING_to_CAPTURED
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction — eff_discount = max(reduced_fare_pct,
          low_income_discount_pct) (LARGER discount, never summed), then billable = min(post_transfer,
          daily_room, weekly_room). A LOW_INCOME rider (0.6) holding a VERIFIED card (0.5) is charged on
          0.6, not 1.1.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X: base 300, daily 500, weekly 2500, reduced_fare_pct 0.5, transfer_discount_pct 0."
            - "Rider R3 income_tier LOW_INCOME, low_income_discount_pct 0.6; FundingSource F3 loaded 100000."
            - "R3 holds a VERIFIED ReducedFareCard (program SENIOR) not expired."
            - "OPEN FareWeek W1 week_start 2026-06-01 zone ZONE_X; no prior taps."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500, reduced_fare_pct: 0.5, transfer_discount_pct: 0 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r3@x.com", full_name: "R Three", home_zone_code: "ZONE_X", income_tier: "LOW_INCOME", low_income_discount_pct: 0.6 }
              as: Anonymous
              captures: { r3: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r3}", source_type: "CONTACTLESS_CARD" }
              as: Rider
              as_user_id: "${r3}"
              captures: { f3: $.data.id }
            - call: "POST /funding-sources/${f3}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r3}"
            - call: "POST /reduced-fare-cards"
              payload: { rider_id: "${r3}", program_code: "SENIOR", expires_on: "2027-01-01" }
              as: Rider
              as_user_id: "${r3}"
              captures: { card3: $.data.id, tok3: $.data.verification_token }
            - call: "POST /reduced-fare-cards/${card3}/verify"
              payload: { verification_token: "${tok3}" }
              as: FareAdmin
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r3}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r3}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r3}", fare_week_id: "${w1}", funding_source_id: "${f3}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r3}"
              captures: { tap3: $.data.id }
          trigger:
            - call: "POST /taps/${tap3}/settle"
              payload: {}
              as: PaymentGateway
              captures: { ch3: $.data.charge_cents }
          assert:
            - "Tap.${tap3}.list_fare_cents == 120 (round_half_up(300 * (1 - max(0.5,0.6))) == round_half_up(120.0))"
            - "Tap.${tap3}.charge_cents == 120 (eff_daily_cap == 200, eff_weekly_cap == 1000, so cap room does not bind)"

      - name: per_ride_rounding_before_sum_mode_b
        grounds:
          - calculations.compute_tap_charge
          - entities.FareProduct.fields.base_fare_cents
          - entities.FareWeek.fields.charged_total_cents
          - state_machines.Tap.PENDING_to_CAPTURED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-PER-RIDE then sum. Three
          taps at base 275, reduced 0.5 each round to 138 (275*0.5=137.5 -> 138), summing to 414; the
          forbidden sum-then-round path (round(3*137.5)=413) is one cent lower. The pinned per-ride order
          must win.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_Y: base 275, daily 5000, weekly 5000 (caps slack), reduced_fare_pct 0.5, transfer_discount_pct 0."
            - "Rider R4 STANDARD with a VERIFIED ReducedFareCard; FundingSource F4 loaded 100000."
            - "OPEN FareWeek W1 week_start 2026-06-01 zone ZONE_Y."
            - "Three taps T1 09:00, T2 11:00, T3 13:00 (all >120m apart so none is a transfer)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_Y", base_fare_cents: 275, daily_cap_cents: 5000, weekly_cap_cents: 5000, reduced_fare_pct: 0.5, transfer_discount_pct: 0 }
              as: FareAdmin
              captures: { prod_y: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r4@x.com", full_name: "R Four", home_zone_code: "ZONE_Y" }
              as: Anonymous
              captures: { r4: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r4}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r4}"
              captures: { f4: $.data.id }
            - call: "POST /funding-sources/${f4}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r4}"
            - call: "POST /reduced-fare-cards"
              payload: { rider_id: "${r4}", program_code: "STUDENT", expires_on: "2027-01-01" }
              as: Rider
              as_user_id: "${r4}"
              captures: { card4: $.data.id, tok4: $.data.verification_token }
            - call: "POST /reduced-fare-cards/${card4}/verify"
              payload: { verification_token: "${tok4}" }
              as: FareAdmin
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r4}", week_start_date: "2026-06-01", zone_code: "ZONE_Y" }
              as: Rider
              as_user_id: "${r4}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r4}", fare_week_id: "${w1}", funding_source_id: "${f4}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r4}"
              captures: { tA: $.data.id }
            - call: "POST /taps/${tA}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${r4}", fare_week_id: "${w1}", funding_source_id: "${f4}", tapped_at: "2026-06-01T11:00:00Z" }
              as: Rider
              as_user_id: "${r4}"
              captures: { tB: $.data.id }
            - call: "POST /taps/${tB}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${r4}", fare_week_id: "${w1}", funding_source_id: "${f4}", tapped_at: "2026-06-01T13:00:00Z" }
              as: Rider
              as_user_id: "${r4}"
              captures: { tC: $.data.id }
          trigger:
            - call: "POST /taps/${tC}/settle"
              payload: {}
              as: PaymentGateway
              captures: { chC: $.data.charge_cents }
          assert:
            - "Tap.${tA}.charge_cents == 138 and Tap.${tB}.charge_cents == 138 and Tap.${tC}.charge_cents == 138"
            - "FareWeek.${w1}.charged_total_cents == 414 (per-ride round-then-sum; sum-then-round would give 413)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tap_branching_capture_vs_reject_then_reverse
        grounds:
          - state_machines.Tap.PENDING_to_CAPTURED
          - state_machines.Tap.PENDING_to_REJECTED
          - state_machines.Tap.CAPTURED_to_REVERSED
          - entities.Tap.fields.status
        distinguishing_aspect: |
          Branching fork-join on the Tap entity: the same trigger POST /taps/{id}/settle forks to CAPTURED
          (debit + accrue) or REJECTED (no ledger effect) selected by the funds precondition, and only the
          CAPTURED branch can later transition to REVERSED — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 500, weekly 2500."
            - "Rider R5; FundingSource F5 loaded to exactly 300 cents."
            - "OPEN FareWeek W1 week_start 2026-06-01 zone ZONE_X."
            - "Tap T1 09:00 (will capture, balance -> 0) and Tap T2 10:00 (will reject, balance 0 < 300)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r5@x.com", full_name: "R Five", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r5: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r5}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r5}"
              captures: { f5: $.data.id }
            - call: "POST /funding-sources/${f5}/load"
              payload: { amount_cents: 300 }
              as: Rider
              as_user_id: "${r5}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r5}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r5}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r5}", fare_week_id: "${w1}", funding_source_id: "${f5}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r5}"
              captures: { t1: $.data.id }
            - call: "POST /taps/${t1}/settle"
              payload: {}
              as: PaymentGateway
            - call: "POST /taps"
              payload: { rider_id: "${r5}", fare_week_id: "${w1}", funding_source_id: "${f5}", tapped_at: "2026-06-01T10:00:00Z" }
              as: Rider
              as_user_id: "${r5}"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /taps/${t2}/settle"
              payload: {}
              as: PaymentGateway
              captures: { err2: $.data.error_id }
            - call: "GET /taps/${t2}"
              payload: {}
              as: FareAdmin
              captures: { st2: $.data.status }
            - call: "POST /taps/${t1}/reverse"
              payload: {}
              as: FareAdmin
              captures: { st1: $.data.status }
          assert:
            - "Settling t2 returns 402 ERR_INSUFFICIENT_FUNDS and persists Tap.${t2}.status == REJECTED (300 > balance 0); no debit, FareWeek.charged_total_cents unaffected by t2"
            - "Tap.${t1}.status transitions PENDING -> CAPTURED -> REVERSED"
            - "After reverse, FundingSource.${f5}.prepaid_balance_cents == 300 and FareWeek.${w1}.charged_total_cents == 0"

      - name: reduced_fare_card_cyclic_verified_expired_verified
        grounds:
          - state_machines.ReducedFareCard.VERIFIED_to_EXPIRED
          - state_machines.ReducedFareCard.EXPIRED_to_VERIFIED
          - state_machines.ReducedFareCard.PENDING_VERIFICATION_to_VERIFIED
          - entities.ReducedFareCard.fields.status
        distinguishing_aspect: |
          Cyclic shape on the ReducedFareCard entity (different entity than Tap): VERIFIED -> EXPIRED ->
          VERIFIED forms a revision loop, re-entered after PATCH extends expires_on; a linear machine cannot
          re-reach VERIFIED.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X."
            - "Rider R6; ReducedFareCard C6 verified with expires_on 2026-06-10."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r6@x.com", full_name: "R Six", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r6: $.data.id }
            - call: "POST /reduced-fare-cards"
              payload: { rider_id: "${r6}", program_code: "DISABILITY", expires_on: "2026-06-10" }
              as: Rider
              as_user_id: "${r6}"
              captures: { c6: $.data.id, tok6: $.data.verification_token }
            - call: "POST /reduced-fare-cards/${c6}/verify"
              payload: { verification_token: "${tok6}" }
              as: FareAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: FareAdmin
            - call: "POST /reduced-fare-cards/${c6}/refresh-expiry"
              payload: {}
              as: FareAdmin
              captures: { st_exp: $.data.status }
            - call: "PATCH /reduced-fare-cards/${c6}"
              payload: { expires_on: "2027-01-01" }
              as: FareAdmin
          trigger:
            - call: "POST /reduced-fare-cards/${c6}/verify"
              payload: { verification_token: "${tok6}" }
              as: FareAdmin
              captures: { st_final: $.data.status }
          assert:
            - "After refresh-expiry at 2026-06-15 the card status == EXPIRED"
            - "After PATCH + re-verify the card status == VERIFIED (cycle closed)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_captures_then_consumes_benefit_then_exhausts_allocation_depth3
        grounds:
          - state_machines.Tap.PENDING_to_CAPTURED
          - state_machines.BenefitAllocation.ACTIVE_to_EXHAUSTED
          - entities.BenefitAllocation.fields.consumed_cents
          - entities.BenefitAllocation.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from POST /taps/{id}/settle: (hop1) Tap PENDING -> CAPTURED; (hop2) the capture
          increments BenefitAllocation.consumed_cents; (hop3) consumed_cents reaching allocated_cents — a
          consequence of hop2, not of the original settle — flips the allocation ACTIVE -> EXHAUSTED. Each
          link is caused by the prior link.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 5000, weekly 5000 (caps slack), transfer_discount_pct 0."
            - "Rider R7; FundingSource F7 loaded 100000."
            - "ACTIVE BenefitAllocation A7 for period 2026-06, allocated 300, consumed 0 (exactly one tap's worth)."
            - "OPEN FareWeek W1 week_start 2026-06-01 zone ZONE_X; Tap T1 09:00 PENDING."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 5000, weekly_cap_cents: 5000, transfer_discount_pct: 0 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
