              payload: { order_id: "${o1_id}", carrier_name: "Gulf Freight", erection_stage: "SECONDARY_FRAME", component_marks: ["P-1"], unload_window_start: "2026-09-17T08:00:00Z", unload_window_end: "2026-09-17T12:00:00Z", expected_order_version: "${o1_v_released}" }
              as: LogisticsCoordinator
