            - "Advisor.${adv_id}.production_ytd_provisional_cents == 0"

  # ==========================================================================
  # 2. STATE MACHINES
  # ==========================================================================
  - section: state_machines
    instances:
      - name: corner_initial_states_of_every_freshly_created_row
        claim_type: initial_state
        grounds:
          - state_machines.Advisor.initial_state
          - state_machines.AdvisorAgreement.initial_state
          - state_machines.ComplianceCredential.initial_state
          - state_machines.SettlementRun.initial_state
        distinguishing_aspect: "A newly created Advisor is DRAFT, a newly signed AdvisorAgreement is ACTIVE, a newly filed ComplianceCredential is PENDING_REVIEW and a newly opened SettlementRun is OPEN with every monetary total and statement_count at 0."
        test_recipe:
          setup:
            - "One split schedule exists so an agreement can be signed."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_id: $.data.id }
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-06" }
              as: HostOperations
              captures: { run_id: $.data.id }
          assert:
            - "Advisor.${adv_id}.status == DRAFT"
            - "AdvisorAgreement.${agr_id}.status == ACTIVE"
            - "ComplianceCredential.${cr_id}.status == PENDING_REVIEW and verified_at is null and verified_by_user_id is null"
            - "SettlementRun.${run_id}.status == OPEN"
            - "SettlementRun.${run_id}.statement_count == 0, gross_commission_cents == 0, advisor_share_total_cents == 0, chargeback_total_cents == 0, platform_fee_total_cents == 0, marketing_fund_total_cents == 0, net_payout_total_cents == 0"
            - "SettlementRun.${run_id}.calculated_by_user_id is null and posted_by_user_id is null"

      - name: corner_triggers_absent_from_the_current_state_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Advisor
          - state_machines.SettlementRun
          - validations[priority=40]
          - errors[ERR_INVALID_ADVISOR_STATE]
          - errors[ERR_INVALID_RUN_STATE]
        distinguishing_aspect: "From DRAFT the Advisor machine declares only activate, so suspend, reinstate and departure/finalize each return HTTP 409 ERR_INVALID_ADVISOR_STATE; from OPEN the SettlementRun machine declares only calculate, so post returns HTTP 409 ERR_INVALID_RUN_STATE — and none of the four rows changes state."
        test_recipe:
          setup:
            - "One DRAFT advisor and one OPEN settlement run; nothing else."
          setup_api_calls:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-06" }
              as: HostOperations
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/suspend"
              payload: { reason: "Attempted suspension of a DRAFT advisor" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_suspend: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/reinstate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_reinstate: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/departure/finalize"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_finalize: $.data.error_id }
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { err_post: $.data.error_id }
          assert:
            - "err_suspend == ERR_INVALID_ADVISOR_STATE with HTTP 409"
            - "err_reinstate == ERR_INVALID_ADVISOR_STATE with HTTP 409"
            - "err_finalize == ERR_INVALID_ADVISOR_STATE with HTTP 409"
            - "err_post == ERR_INVALID_RUN_STATE with HTTP 409"
            - "Advisor.${adv_id}.status is still DRAFT and its version is unchanged"
            - "SettlementRun.${run_id}.status is still OPEN and posted_by_user_id is still null"

      - name: corner_terminal_credential_states_accept_no_further_decision
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ComplianceCredential.terminal_states
          - errors[ERR_INVALID_CREDENTIAL_STATE]
          - endpoints["POST /host-agency/compliance-credentials/{id}/decision"]
        distinguishing_aspect: "REJECTED and REVOKED are terminal for ComplianceCredential: a second decision on a REJECTED row and a decision on a REVOKED row both return HTTP 409 ERR_INVALID_CREDENTIAL_STATE, and the recorded verified_at of the revoked row is not cleared or overwritten."
        test_recipe:
          setup:
            - "One DRAFT advisor with two filed credentials: one rejected outright, one verified and then revoked."
          setup_api_calls:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-BAD-1", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_rej_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_rej_id}/decision"
              payload: { decision: "REJECT", note: "Certificate could not be authenticated" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_rev_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_rev_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rev_verified_at: $.data.verified_at }
            - call: "POST /host-agency/compliance-credentials/${cr_rev_id}/decision"
              payload: { decision: "REVOKE", note: "Carrier cancelled the policy" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /host-agency/compliance-credentials/${cr_rej_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_rej: $.data.error_id }
            - call: "POST /host-agency/compliance-credentials/${cr_rev_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_rev: $.data.error_id }
          assert:
            - "err_rej == ERR_INVALID_CREDENTIAL_STATE with HTTP 409 and ComplianceCredential.${cr_rej_id}.status is still REJECTED"
            - "err_rev == ERR_INVALID_CREDENTIAL_STATE with HTTP 409 and ComplianceCredential.${cr_rev_id}.status is still REVOKED"
            - "ComplianceCredential.${cr_rev_id}.verified_at == ${rev_verified_at} — revocation does not erase the verification audit trail"
            - "Advisor.${adv_id}.status is still DRAFT (revoking an EO_POLICY row never forces a suspension; only the last in-force SELLER_OF_TRAVEL row does)"

      - name: corner_activation_preconditions_enforced_one_by_one
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Advisor.DRAFT_to_ACTIVE
          - errors[ERR_ACTIVE_AGREEMENT_MISSING]
          - errors[ERR_SELLER_OF_TRAVEL_INVALID]
          - errors[ERR_EO_COVERAGE_INSUFFICIENT]
          - errors[ERR_TRAINING_CERT_MISSING]
          - validations[priority=50]
          - validations[priority=52]
          - validations[priority=54]
        distinguishing_aspect: "Each DRAFT -> ACTIVE precondition is enforced separately and in the §1.4 priority order: no agreement yields ERR_ACTIVE_AGREEMENT_MISSING, then no seller-of-travel registration yields ERR_SELLER_OF_TRAVEL_INVALID, then an E&O policy of 50000000 (below MIN_EO_COVERAGE_CENTS 100000000) yields ERR_EO_COVERAGE_INSUFFICIENT, then a missing training certificate yields ERR_TRAINING_CERT_MISSING, and only the complete set produces ACTIVE."
        test_recipe:
          setup:
            - "One split schedule and one DRAFT advisor in NY with nothing else attached."
            - "Logical clock at the 2026-08-01T00:00:00Z default, so every credential dated 2026-01-01..2027-01-01 is in force."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
              captures: { err_no_agreement: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
              captures: { err_no_sot: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-LOW-1", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 50000000 }
              as: HostOperations
              captures: { cr_eo_low_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_eo_low_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eo_low_cov: $.data.coverage_amount_cents }
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
              captures: { err_low_eo: $.data.error_id }
            - call: "POST /host-agency/compliance-credentials/${cr_eo_low_id}/decision"
              payload: { decision: "REVOKE", note: "Replaced by a higher-limit policy" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
              captures: { err_no_training: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
              captures: { final_status: $.data.status }
          assert:
            - "err_no_agreement == ERR_ACTIVE_AGREEMENT_MISSING with HTTP 422"
            - "err_no_sot == ERR_SELLER_OF_TRAVEL_INVALID with HTTP 422"
            - "err_low_eo == ERR_EO_COVERAGE_INSUFFICIENT with HTTP 422 and eo_low_cov == 50000000"
            - "err_no_training == ERR_TRAINING_CERT_MISSING with HTTP 422"
            - "final_status == ACTIVE and Advisor.${adv_id}.activated_by_user_id equals the acting HostOperations X-User-ID"
            - "Advisor.${adv_id}.eo_coverage_verified_cents == 100000000 (the maximum across in-force VERIFIED EO_POLICY rows; the revoked 50000000 row is excluded)"
            - "Advisor.${adv_id}.split_tier_provisional == 1 and split_tier_final == 1 (seeded at production 0)"
            - "the replacement EO_POLICY was accepted because the revoked row no longer occupies the coverage window (validations[priority=65] counts only PENDING_REVIEW and VERIFIED rows)"

      - name: corner_second_post_of_the_same_settlement_run_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.SettlementRun.CALCULATED_to_POSTED
          - errors[ERR_INVALID_RUN_STATE]
          - validations[priority=92]
        distinguishing_aspect: "Posting an empty settlement run once moves it OPEN -> CALCULATED -> POSTED with statement_count 0; a second post of the same run returns HTTP 409 ERR_INVALID_RUN_STATE and leaves posted_by_user_id at the first poster's id."
        test_recipe:
          setup:
            - "One settlement run for 2026-06 and no advisors at all, so the run is legitimately empty."
          setup_api_calls:
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-06" }
              as: HostOperations
              captures: { run_id: $.data.id }
            - call: "POST /host-agency/settlement-runs/${run_id}/calculate"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { calc_count: $.data.statement_count }
          trigger:
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { posted_status: $.data.status }
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { err_second: $.data.error_id }
          assert:
            - "calc_count == 0 and SettlementRun.${run_id}.status was CALCULATED after the calculate call"
