      - name: withdrawing_a_priority_drafting_request_returns_the_member_slot_ledger_to_its_prior_count
        grounds:
          - state_machines.DraftingRequest.to_WITHDRAWN
          - calculations.member_priority_slot_ledger
          - entities.Member.fields.priority_slots_used
          - validations.priority_170.ERR_PRIORITY_SLOTS_EXHAUSTED
          - endpoints.POST_drafting_requests_withdraw
        distinguishing_aspect: |
          A different conserved quantity type: an integer SLOT COUNT
          (Member.priority_slots_used), not money. The debit happens at intake and the
          compensation happens at withdrawal, and the proof is not merely that the
          counter reads 1 again but that the freed slot is genuinely spendable - a
          fresh priority request that would have been refused with
          ERR_PRIORITY_SLOTS_EXHAUSTED before the withdrawal now succeeds. The
          withdrawn row is retained in status WITHDRAWN, so the ledger must exclude it
          by status rather than by deletion.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; CONVENED session; one member with priority_slots_total 2."
            - "Request A filed with priority_flag true (priority_slots_used becomes 1) and left SUBMITTED."
            - "Request B filed with priority_flag true (priority_slots_used becomes 2, exhausting the member) and left SUBMITTED."
            - "One probe call confirms the exhausted state: a third priority_flag request is refused with ERR_PRIORITY_SLOTS_EXHAUSTED before anything is withdrawn."
            - "Member.clarification_pending_count is 0 and intake_hold is false throughout, so the priority-145 rule can never mask the priority-170 rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Gamma", chamber: "SENATE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Rural broadband easements", summary: "Simplify broadband easements.", requested_sections_count: 3, target_code_chapter: "Title 40", confidentiality: "PUBLIC", priority_flag: true, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_a: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Utility pole attachment rates", summary: "Cap pole attachment rates.", requested_sections_count: 3, target_code_chapter: "Title 40", confidentiality: "PUBLIC", priority_flag: true, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_b: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Probe request that must be refused", summary: "Confirms the member is out of priority slots.", requested_sections_count: 1, target_code_chapter: "Title 40", confidentiality: "PUBLIC", priority_flag: true, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /drafting-requests/${dr_b}/withdraw"
              payload: { withdrawal_reason: "Sponsor consolidated the measure into request A." }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Middle mile grant conditions", summary: "Attach conditions to middle mile grants.", requested_sections_count: 3, target_code_chapter: "Title 40", confidentiality: "PUBLIC", priority_flag: true, appropriation_requested_cents: 0 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_c: $.data.id }
          assert:
            - "The setup probe call returned HTTP 409 with error.code == ERR_PRIORITY_SLOTS_EXHAUSTED while priority_slots_used was 2"
            - "After the withdraw, DraftingRequest.${dr_b}.status == WITHDRAWN and sla_due_utc == null and the row still exists (it is excluded by status, not deleted)"
            - "After the withdraw, Member.${m1_id}.priority_slots_used == 1 - exactly the value it held before request B was filed"
            - "After the withdraw, Member.${m1_id}.clarification_pending_count == 0 and intake_hold == false (untouched by the compensation)"
            - "The SECOND trigger call returns HTTP 201: DraftingRequest.${dr_c}.status == SUBMITTED with priority_flag true and intake_complexity_estimate == 20 (4 * 3 sections + 8 priority weight + 0 tier bonus)"
            - "After the second trigger call Member.${m1_id}.priority_slots_used == 2 again"
            - "DraftingRequest.${dr_a}.status == SUBMITTED and priority_flag == true (unaffected)"
