            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 2, requested_route: WAREHOUSE, transit_days: 1 }
              as: RoutePlanner
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /snack-mfg/shipments/${sh_id}/plan"
              as: RoutePlanner
              captures: { err: $.data.error_id }
            - call: "POST /snack-mfg/production-runs/${run_id}/quality-disposition"
              payload: { disposition: PASS }
              as: QualityTechnician
            - call: "POST /snack-mfg/shipments/${sh_id}/plan"
              as: RoutePlanner
          assert:
            - "first plan fails 409 ERR_RUN_NOT_PASSED (quality PENDING)"
            - "after disposition PASS the retry succeeds: Shipment.${sh_id}.status == WAREHOUSE_PLANNED, planned_route == WAREHOUSE, freshness_days_at_plan == 30"

      - name: slot_confirm_gated_on_agreement_active
        grounds:
          - state_machines.CoManSlot.BOOKED_to_CONFIRMED
          - state_machines.CoManAgreement.ACTIVE_to_SUSPENDED
          - state_machines.CoManAgreement.SUSPENDED_to_ACTIVE
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair CoManSlot x CoManAgreement: the slot's own state (BOOKED) is a
          valid from-state, yet confirm is gated on the PARENT agreement being
          ACTIVE — a suspended agreement blocks confirm with
          ERR_AGREEMENT_NOT_ACTIVE until resumed, without releasing the slot.
        test_recipe:
          setup:
            - "agreement ACTIVE (capacity 10000, rate 50, budget 1000000); slot BOOKED for week 2026-09-07 by the owning co-manufacturer"
            - "agreement suspended, then resumed"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/co-manufacturers"
              payload: { name: "TollCo" }
              as: PlantManager
              captures: { cm_id: $.data.id }
            - call: "POST /snack-mfg/co-man-agreements"
              payload: { co_manufacturer_id: "${cm_id}", weekly_capacity_lbs: 10000, rate_per_lb_cents: 50, budget_cents: 1000000 }
              as: PlantManager
              captures: { ag_id: $.data.id }
            - call: "POST /snack-mfg/co-man-agreements/${ag_id}/activate"
              as: PlantManager
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 2000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /snack-mfg/co-man-agreements/${ag_id}/suspend"
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/co-man-slots/${slot_id}/confirm"
              as: CoManufacturer
              as_user_id: "${cm_id}"
              captures: { err: $.data.error_id }
            - call: "POST /snack-mfg/co-man-agreements/${ag_id}/resume"
              as: PlantManager
            - call: "POST /snack-mfg/co-man-slots/${slot_id}/confirm"
              as: CoManufacturer
              as_user_id: "${cm_id}"
          assert:
            - "confirm during suspension fails 409 ERR_AGREEMENT_NOT_ACTIVE"
            - "CoManSlot.${slot_id}.status remains BOOKED through the suspension (suspend does not cascade)"
            - "after resume the retry succeeds: CoManSlot.${slot_id}.status == CONFIRMED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: run_schedule_half_open_with_allergen_buffer
        grounds:
          - calculations.changeover_requirement
          - errors[ERR_SCHEDULE_OVERLAP]
          - entities.ProductionLine.fields.cleaning_minutes_full_wash
          - entities.ProductionLine.fields.cleaning_minutes_dry
        distinguishing_aspect: |
          Resource ProductionLine, HALF-OPEN interval semantics with a
          product-dependent buffer: adjacent runs (B.start == A.end) are legal
          when no cleaning is required, but a DRY_CLEAN (flavor-only change)
          demands A.end + 30 min and a FULL_WASH (allergen removal) demands
          A.end + 120 min — the boundary start exactly at end+buffer is legal.
        test_recipe:
          setup:
            - "products: P1 DAIRY/CHEESE, P2 DAIRY/SPICY (same allergens, flavor change -> DRY_CLEAN 30), P3 allergen-free PLAIN (removal -> FULL_WASH 120); line defaults (dry 30, full 120)"
            - "runA P1 [2026-08-03T08:00, 10:00) created"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Cheese Puffs", process_type: FRYER, allergen_profile: [DAIRY], flavor_group: CHEESE, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p1: $.data.id }
            - call: "POST /snack-mfg/products"
              payload: { name: "Spicy Cheese Puffs", process_type: FRYER, allergen_profile: [DAIRY], flavor_group: SPICY, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p2: $.data.id }
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p3: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, lv: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p1}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv}" }
              as: PlantManager
              captures: { runA: $.data.id }
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { lv2: $.data.version }
          trigger:
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p1}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T12:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv2}" }
              as: PlantManager
              captures: { runB: $.data.id }
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { lv3: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p2}", scheduled_start: "2026-08-03T12:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv3}" }
              as: PlantManager
              captures: { errC: $.data.error_id }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p2}", scheduled_start: "2026-08-03T12:30:00Z", scheduled_end: "2026-08-03T14:30:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv3}" }
              as: PlantManager
              captures: { runC: $.data.id }
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { lv4: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p3}", scheduled_start: "2026-08-03T14:30:00Z", scheduled_end: "2026-08-03T16:30:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv4}" }
              as: PlantManager
              captures: { errD: $.data.error_id }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p3}", scheduled_start: "2026-08-03T16:30:00Z", scheduled_end: "2026-08-03T18:30:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${lv4}" }
              as: PlantManager
              captures: { runD: $.data.id }
          assert:
            - "runB created at exactly runA.end (10:00): half-open adjacency with identical product is legal (requirement NONE, no buffer)"
            - "runC at 12:00 fails 409 ERR_SCHEDULE_OVERLAP: P1 -> P2 is flavor-only change = DRY_CLEAN, 12:00 < 12:00+30min"
            - "runC at 12:30 succeeds: start exactly at end + cleaning_minutes_dry is legal (inclusive buffer boundary)"
            - "runD at 14:30 fails 409 ERR_SCHEDULE_OVERLAP: P2 -> P3 removes DAIRY = FULL_WASH, 14:30 < 14:30+120min"
            - "runD at 16:30 succeeds (exactly end + cleaning_minutes_full_wash)"

      - name: promo_window_closed_interval_adjacency
        grounds:
          - state_machines.PromoWindow.DRAFT_to_ACTIVE
          - errors[ERR_PROMO_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource Product (its ACTIVE promo windows), CLOSED interval semantics:
          two ACTIVE windows for the same product sharing a single boundary DATE
          (W1 ends 2026-09-15, W2 starts 2026-09-15) overlap because both ends
          are inclusive, while [2026-09-16, 2026-09-30] is legal — the exact
          opposite adjacency rule from the runs' half-open intervals.
        test_recipe:
          setup:
            - "product created; window W1 [2026-09-01, 2026-09-15] created and ACTIVE"
            - "W2 [2026-09-15, 2026-09-30] and W3 [2026-09-16, 2026-09-30] created for the same product (both DRAFT)"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/promo-windows"
              payload: { product_id: "${p_id}", quota_total_cases: 10, window_start_date: "2026-09-01", window_end_date: "2026-09-15" }
              as: PlantManager
              captures: { w1: $.data.id }
            - call: "POST /snack-mfg/promo-windows/${w1}/activate"
              as: PlantManager
            - call: "POST /snack-mfg/promo-windows"
              payload: { product_id: "${p_id}", quota_total_cases: 10, window_start_date: "2026-09-15", window_end_date: "2026-09-30" }
              as: PlantManager
              captures: { w2: $.data.id }
            - call: "POST /snack-mfg/promo-windows"
              payload: { product_id: "${p_id}", quota_total_cases: 10, window_start_date: "2026-09-16", window_end_date: "2026-09-30" }
              as: PlantManager
              captures: { w3: $.data.id }
          trigger:
            - call: "POST /snack-mfg/promo-windows/${w2}/activate"
              as: PlantManager
              captures: { err2: $.data.error_id }
            - call: "POST /snack-mfg/promo-windows/${w3}/activate"
              as: PlantManager
          assert:
            - "W2 activation fails 409 ERR_PROMO_WINDOW_OVERLAP: 2026-09-15 belongs to both closed intervals"
            - "W3 activation succeeds: [2026-09-16, 2026-09-30] is disjoint from [2026-09-01, 2026-09-15] under closed semantics"
            - "PromoWindow.${w3}.status == ACTIVE and PromoWindow.${w2}.status == DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: oil_gallons_topoff_discard_conservation
        grounds:
          - entities.FryerOil.fields.current_gallons
          - calculations.tpm_degradation
          - state_machines.FryerOil
        distinguishing_aspect: |
          Conserved quantity: fryer oil gallons. The forward action (TOP_OFF 6
          gal) paired with its compensating action (DISCARD 6 gal) restores the
          mass balance exactly: current_gallons == initial_charge +
          sum(TOP_OFF) - sum(DISCARD) - absorbed (100 + 6 - 6 - 6.000 == 94),
          while tpm_pct (7.99) legitimately does NOT restore — dilution is
          one-way, proving the invariant is about gallons, not quality.
        test_recipe:
          setup:
            - "line capacity 100 (charge 100 gal, tpm 0.5); run started"
            - "one check fries 4000 lbs at target temp: tpm 8.5, absorbed 6.000, gallons 94"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 4000, cases_planned: 200, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.1, lbs_fried_since_last_check: 4000, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", oil_v1: "$.data[0].version" }
          trigger:
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: TOP_OFF, gallons: 6, unit_price_cents_per_gal: 600, expected_oil_version: "${oil_v1}" }
              as: LineOperator
            - call: "GET /snack-mfg/fryer-oils/${oil_id}"
              as: PlantManager
              captures: { oil_v2: $.data.version }
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: DISCARD, gallons: 6, expected_oil_version: "${oil_v2}" }
              as: LineOperator
            - call: "GET /snack-mfg/fryer-oils/${oil_id}"
              as: PlantManager
          assert:
            - "after TOP_OFF: current_gallons == 100 and tpm_pct == 7.99 (diluted 8.5 * 94/100)"
            - "after compensating DISCARD: current_gallons == 94 == 100 + 6 - 6 - 6.000 (mass balance restored)"
            - "tpm_pct remains 7.99 after the pair (DISCARD does not change concentration) — the invariant covers gallons only"

      - name: promo_quota_build_cancel_conservation
        grounds:
          - entities.PromoWindow.fields.quota_remaining_cases
          - state_machines.DisplayCase.PLANNED_to_BUILT
          - state_machines.DisplayCase.BUILT_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: promotional quota cases. quota_total (10) ==
          quota_remaining + quota_consumed - quota_released at every step; the
          forward action (build 4) paired with its compensating action (cancel
          the BUILT case) returns quota_remaining to exactly 10 and restores the
          run's cases_unrouted from 16 to 20 — zero drift across the pair.
        test_recipe:
          setup:
            - "window quota 10 ACTIVE over [2026-08-01, 2026-08-31]; run COMPLETED with 20 accepted cases"
            - "DisplayCase dc (4 cases) PLANNED; clock inside the window (2026-08-05)"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/promo-windows"
              payload: { product_id: "${p_id}", quota_total_cases: 10, window_start_date: "2026-08-01", window_end_date: "2026-08-31" }
              as: PlantManager
              captures: { win_id: $.data.id }
            - call: "POST /snack-mfg/promo-windows/${win_id}/activate"
              as: PlantManager
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", lbs_planned: 200, cases_planned: 20, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 200, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 200, cases_produced: 20, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/display-cases"
              payload: { promo_window_id: "${win_id}", run_id: "${run_id}", cases_planned: 4 }
              as: PlantManager
              captures: { dc_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/display-cases/${dc_id}/build"
              as: LineOperator
            - call: "GET /snack-mfg/promo-windows/${win_id}"
              as: PlantManager
              captures: { rem_mid: $.data.quota_remaining_cases }
            - call: "GET /snack-mfg/production-runs/${run_id}"
              as: PlantManager
              captures: { unrouted_mid: $.data.cases_unrouted }
            - call: "POST /snack-mfg/display-cases/${dc_id}/cancel"
              as: PlantManager
            - call: "GET /snack-mfg/promo-windows/${win_id}"
              as: PlantManager
            - call: "GET /snack-mfg/production-runs/${run_id}"
              as: PlantManager
          assert:
            - "after build: quota_consumed_cases == 4, quota_remaining_cases == 6, run.cases_unrouted == 16"
            - "after compensating cancel: quota_released_cases == 4, quota_remaining_cases == 10 == quota_total_cases"
            - "invariant holds at every step: 10 == quota_remaining + quota_consumed - quota_released (10 == 6 + 4 - 0 after build; 10 == 10 + 4 - 4 after cancel)"
            - "run.cases_unrouted restored to exactly 20 (no reservation drift)"


