            - call: "POST /connections/${xt_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "TermShip" }
              as: PlatformAdmin
              captures: { xt_shp_id: $.data.id }
            - call: "POST /shippers/${xt_shp_id}/purchase-orders"
              payload: { po_number: "PO-5", destination_code: "LAX", booking_reference: "BK-5" }
              as: ShipperRep
              as_user_id: "${xt_shp_id}"
              captures: { xt_po_id: $.data.id, xt_po_v: $.data.version }
            - call: "POST /shippers/${xt_shp_id}/shipments"
              payload: { carrier_id: "${xt_car_id}", connection_id: "${xt_conn_id}", mode: "TRUCKLOAD", tracking_reference: "BK-5", mode_reference: "PRO-5", destination_code: "LAX", po_reference_claim: "PO-5", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${xt_shp_id}"
              captures: { xt_ship_id: $.data.id }
            - call: "POST /shipments/${xt_ship_id}/identity-links"
              payload: { purchase_order_id: "${xt_po_id}", expected_po_version: "${xt_po_v}" }
              as: NetworkOps
              captures: { xt_link_id: $.data.id }
            - call: "POST /shipments/${xt_ship_id}/cancel"
              payload: {}
              as: ShipperRep
              as_user_id: "${xt_shp_id}"
          trigger:
            - call: "POST /identity-links/${xt_link_id}/confirm"
              payload: {}
              as: ShipperRep
              as_user_id: "${xt_shp_id}"
              captures: { xt_err: $.data.error_id }
          assert:
