              as_user_id: "U_PREP"
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "GET /remittances"
              payload: { period_month: "2025-08", jurisdiction: "FEDERAL", tax_type: "FED_INCOME" }
              as: ComplianceOfficer
              captures: { rem_id: "$.data[0].id" }
            - call: "POST /remittances/${rem_id}/close-period"
              payload: {}
              as: ComplianceOfficer
              captures: { closed_v: $.data.version }
          trigger:
            - call: "POST /remittances/${rem_id}/remit"
              payload: { paid_cents: 16357, expected_remittance_version: "${closed_v}" }
              as: ComplianceOfficer
              captures: { final_v: $.data.version }
          assert:
            - "response.status_code == 200"
            - "Remittance.${rem_id}.status == REMITTED"
            - "Remittance.${rem_id}.paid_cents == 16357"
            - "response.data.version > ${closed_v}"

      - name: cascade_remittance_accrual_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PaycheckRun.APPROVED_to_PAID
          - calculations.remittance_accrual
        excluded_because:
          difficulty_instance: transitive_cascade / paycheck_run_pay_cascade_depth_4
          rationale: "The PaycheckRun PAY cascade (hop 4 -> Remittance) is the depth-4 trigger of the named difficulty instance."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_paycheck_after_create
        claim_type: immediate_consistency
        grounds:
          - endpoints.POST_/paychecks
          - endpoints.GET_/paychecks/{id}
        distinguishing_aspect: "POST /paychecks returns the created paycheck with all computed fields visible in the SAME response; a subsequent GET /paychecks/{id} sees identical values (immediate consistency model)."
        test_recipe:
          setup:
            - "Federal + CA seeded; Employee ACTIVE with W4 FILED; PaycheckRun DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Im Imm", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "GET /paychecks/${pay_id}"
              payload: {}
              as: PayrollPreparer
              as_user_id: "U_PREP"
          assert:
            - "response.status_code == 200"
            - "response.data.gross_wages_cents == 200000"
            - "response.data.fed_withheld_cents == 16357"
            - "response.data.status == PENDING"
