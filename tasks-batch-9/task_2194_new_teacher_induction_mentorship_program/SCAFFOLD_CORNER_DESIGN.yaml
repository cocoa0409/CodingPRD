            - "GET /mentors/${mentor_id} reports active_caseload_count == 0 and GET /sites/${site_id} reports active_match_count == 0"
            - "the second call returns HTTP 409 with data.error_id == \"ERR_MATCH_STATE_INVALID\" and GET /mentor-matches/${match_id} still reports version == 2"

      - name: seminar_attendance_links_session_and_novice_of_same_cohort
