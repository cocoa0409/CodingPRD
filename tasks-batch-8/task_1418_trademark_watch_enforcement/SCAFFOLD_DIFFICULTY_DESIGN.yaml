              as: AssociateAttorney
              as_user_id: assoc_1
              captures: { letter2_id: $.data.id }
            - call: "POST /brand/cease-desist-letters/${letter2_id}/submit-review"
              as: AssociateAttorney
              as_user_id: assoc_1
            - call: "POST /brand/cease-desist-letters/${letter2_id}/approve"
