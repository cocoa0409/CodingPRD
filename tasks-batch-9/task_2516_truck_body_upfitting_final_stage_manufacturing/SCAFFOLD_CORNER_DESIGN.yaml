            - "Chassis.${ch}.status == \"RECEIVED\" (unchanged by the order create)"

      - name: slot_start_moves_slot_order_and_chassis_in_one_call
        claim_type: Valid Transition
        grounds:
          - state_machines.BuildSlot.SCHEDULED_to_IN_BUILD
          - state_machines.UpfitOrder.build_status.SCHEDULED_to_IN_BUILD
          - state_machines.Chassis.ALLOCATED_to_IN_UPFIT
          - endpoints.POST_/upfit/build-slots/{build_slot_id}/start
        distinguishing_aspect: |
          One trigger drives three machines at once: the slot, the order's build dimension and the
          chassis. The same edge appears in all three §1.2 tables, so an implementation that moves
          the slot but forgets the chassis leaves a unit that can still be quarantined mid-build.
        test_recipe:
          setup:
