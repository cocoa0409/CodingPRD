          == ACTIVE; a DRAFT listing rejects with ERR_LISTING_NOT_PURCHASABLE, and after
          publish the same create succeeds.
        test_recipe:
          setup:
            - "Shop ACTIVE; listing left in DRAFT (not published)."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
