            - call: "GET /carpetloop/replacement-orders"
              payload: { zone_id: "${z1}" }
              as: PlatformAdmin
            - call: "GET /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", status: "REQUESTED" }
              as: PlatformAdmin
            - call: "GET /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", status: "CREDITED" }
              as: PlatformAdmin
            - call: "GET /carpetloop/pcf-reports"
