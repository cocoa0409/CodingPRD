            - { call: "GET /grants/awards/${aw}/tax-report", payload: { tax_year: 2027, basis: CASH }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw}/tax-report", payload: { tax_year: 2028, basis: CASH }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw}/tax-report", payload: {}, as: Artist, as_user_id: "${art}" }
            - { call: "GET /grants/awards/${aw}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
