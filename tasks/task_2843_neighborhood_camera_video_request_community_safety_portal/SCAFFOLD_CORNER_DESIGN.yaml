      - name: justification_state_rule_beats_agency_quota_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - validations[priority=44]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / submit_state_rule_16_beats_fiscal_rule_44
          rationale: "That instance submits with the justification missing while the agency is already at its open-request ceiling and asserts ERR_JUSTIFICATION_NOT_LOGGED, then repairs one condition at a time."

      - name: opt_out_rule_beats_device_window_conflict_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / share_safety_rule_30_beats_constraint_rule_40
          rationale: "That instance makes a share violate both the resident opt-out gate and the overlapping-clip gate and asserts ERR_RESIDENT_OPTED_OUT wins."

      - name: justification_length_satisfied_at_configured_minimum
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=32]
          - errors.ERR_JUSTIFICATION_TOO_SHORT
        excluded_because:
          difficulty_instance: boundary_precision_check / justification_length_boundary_at_configured_minimum_chars
          rationale: "That instance submits 79-, 80- and 200-character justifications against justification_min_chars 80 and asserts the rejection and both acceptances."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: device_patch_updates_supplied_fields_only_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints[POST /neighborhood-safety/devices]
          - endpoints[GET /neighborhood-safety/devices/{id}]
          - endpoints[PATCH /neighborhood-safety/devices/{id}]
          - endpoints[GET /neighborhood-safety/devices]
        distinguishing_aspect: "The PATCH is a true partial update: sending only label and retention_window_days leaves grid position, auto_decline_requests and auto_decline_source untouched, bumps version exactly once, and the change is visible in both the single read and the owner-filtered list."
        test_recipe:
