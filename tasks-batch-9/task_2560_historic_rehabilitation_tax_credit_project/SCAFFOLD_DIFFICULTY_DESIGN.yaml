  - rule_id: transitive_cascade
    instances:
      - name: amendment_concurrence_resolves_finding_then_auto_approves_part2_then_certifies_project
        grounds:
          - state_machines.Amendment.SUBMITTED_to_CONCURRED
          - state_machines.PartApplication.CONDITIONAL_to_APPROVED
          - state_machines.Project.PART1_CERTIFIED_to_PART2_APPROVED
          - entities.StandardFinding.fields.resolution_state
          - entities.PartApplication.fields.unresolved_condition_count
          - entities.Amendment.fields.requires_nps_concurrence
        distinguishing_aspect: |
          Depth-4 cascade originating from the amendment-concurrence transition: the
          concurrence mutates the StandardFinding (hop 1), that resolution decrements
          the PartApplication's unresolved_condition_count (hop 2), reaching zero
          itself triggers CONDITIONAL -> APPROVED on the application (hop 3), and that
          approval itself advances Project.certification_status (hop 4) — each link is
          caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; Part 1 approved so the property is CERTIFIED_HISTORIC and certification_status == PART1_CERTIFIED."
            - "Part 2 in NPS review with one CONDITION finding against Standard 6, then determined CONDITIONAL so the application sits in CONDITIONAL with unresolved_condition_count == 1."
            - "A DRAFT-then-SUBMITTED amendment addressing that finding, scope_category WINDOW_REPLACEMENT and cost_delta_cents 1000000, so requires_nps_concurrence == false."
