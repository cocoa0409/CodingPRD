        grounds: [state_machines.FurnishingSpan.ACTIVE_to_SUPERSEDED, calculations.furnishing_date_determination]
        distinguishing_aspect: "Creating a second BASE_CONTRACT span supersedes the first: old span SUPERSEDED, project furnishing dates recomputed from the new ACTIVE span only."
