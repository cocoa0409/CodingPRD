              as: AccountManager
              captures: { c9a_o2: $.data.id, c9a_o2_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c9a_o2}/submit", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${c9a_o2}/schedule", payload: { scheduled_for: "2026-08-06T00:00:00Z", expected_delivery_order_version: "${c9a_o2_v}" }, as: AccountManager }
          trigger:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${c9a_o2}/cancel", payload: {}, as: AccountManager }
          assert:
            - "FeedStation.${c9a_fs}.inventory_gal == 65.9991"
            - "DeliveryOrder.${c9a_o2}.status == CANCELLED"
            - "FeedStation.${c9a_fs}.inventory_gal unchanged by the cancel (still 65.9991)"
            - "invariant: 110 (delivered) - 4 (returned) - 40.0009 (consumed) == inventory_gal"

      - name: water_balance_residual_zero_with_compensating_makeup
        grounds:
          - calculations.cycles_blowdown_water_balance
          - entities.BlowdownEvent.fields.balance_residual_gal
        distinguishing_aspect: |
          Conserved quantity: water volume per event window. The forward
          blowdown event paired with its compensating makeup admission leaves
          balance_residual_gal == 0.0 when makeup == evaporation + blowdown +
          drift (18528 = 12240 + 6000 + 288) — a different conserved quantity
          (gallons of water) than chemical mass, and the residual must be
          exactly 0.0 at 2dp.
        test_recipe:
          setup:
            - "Account; asset (recirc 500 gpm, evap 0.0085, drift 0.0002) created at 2026-08-01T00:00:00Z; clock advanced to 2026-08-03T00:00:00Z (2880-minute first window)"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
