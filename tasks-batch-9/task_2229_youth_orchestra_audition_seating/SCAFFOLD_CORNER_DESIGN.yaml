              captures: { e_grad_blocked: "$.data.error_id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "CLOSED" }
              as: ArtisticDirector
            - call: "GET /seasons/${season_id}"
              as: ArtisticDirector
          assert:
            - "trigger[0] -> 200 with data.aid_status == \"REQUESTED\" (an empty pool does not block the request)"
            - "trigger[1] -> 422 with data.error_id == \"ERR_NO_AID_BUDGET\" and the account stays \"REQUESTED\""
            - "trigger[2] -> 409 with data.error_id == \"ERR_INVALID_MEMBER_TRANSITION\" (ALUMNI only from GRADUATED)"
            - "trigger[3] -> 409 with data.error_id == \"ERR_INVALID_MEMBER_TRANSITION\" (CLEAR -> CLEAR is not declared)"
            - "trigger[5] -> 201 with data.billing_status == \"DELINQUENT\", data.payments_total_cents == 1 and data.balance_cents == 123222 (clock 2026-12-02 is past tuition_due_at)"
            - "trigger[6] -> 200 with data.standing_status == \"FINANCIAL_HOLD\" and data.enrollment_status == \"ENROLLED\""
            - "trigger[7] -> 409 with data.error_id == \"ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE\""
            - "trigger[8] -> 409 with data.error_id == \"ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE\" (same id, different endpoint)"
            - "trigger[9] -> 200 with data.status == \"IN_SEASON\" (the season never closed)"

  # =========================================================================
  # Table 7 (RBAC) - one instance per authorization row of the guide.
  - section: rbac
    instances:
      - name: each_role_executes_its_own_exclusive_operations_end_to_end
        claim_type: exclusive_operations
        grounds:
          - rbac.roles[ArtisticDirector].exclusive_operations
          - rbac.roles[RegistrarStaff].exclusive_operations
          - rbac.roles[FinanceOfficer].exclusive_operations
          - rbac.roles[Panelist].exclusive_operations
          - rbac.roles[Guardian].exclusive_operations
        distinguishing_aspect: |
          The five roles are a partition of the write surface, so one member's whole
          journey needs all five: the Panelist closes the rubric quorum, the
          ArtisticDirector adjudicates, advances the season and creates the offer, the
          Guardian accepts it and pays, the FinanceOfficer finalizes the assessment and opens
          the aid review, and the RegistrarStaff rosters the concert and runs the expiry
          sweep. Every call in the trigger chain is issued by the ONE role that lists it in
          §1.7 exclusive_operations, and every one of them succeeds - so the chain doubles as
          proof that no operation was accidentally reserved to a role that cannot reach that
          part of the workflow.
        test_recipe:
          setup:
            - "Season 2026-27 in AUDITIONS_OPEN with tuition_base_cents 123223, tuition_due_at"
            - "2026-12-01 and aid_budget_cents 100000; a Philharmonic ensemble with a VIOLIN"
            - "section min 1 / target 1 / max 2; Ada Strings (BAND_B, years_in_org 1) with an"
            - "audition SCHEDULED into a quorum-3 slot that already holds two sheets of"
            - "(22, 20, 21, 18) = 81.80. The clock reads 2026-08-05T09:00:00Z."
