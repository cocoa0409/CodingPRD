        distinguishing_aspect: "Five machines are exercised in one pass: a new segment is SOUND, a new fuel contract ACTIVE, a new plan DRAFT, a new work order DRAFT with permit_decision PENDING and a new expansion project SCREENING — none of them accepts a client-supplied state because no state field appears in any create endpoint's input list."
