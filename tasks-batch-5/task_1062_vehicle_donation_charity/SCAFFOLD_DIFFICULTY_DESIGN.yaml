  - rule_id: transitive_cascade
    instances:
      - name: record_sale_cascades_to_auto_opened_remittance_batch_and_task
        grounds:
          - state_machines.AuctionLot.LISTED_to_SOLD
          - state_machines.Donation.PENDING_to_ACCRUED
          - entities.CharityAffiliate.fields.pledged_balance_cents
          - entities.RemittanceBatch.fields.status
          - entities.FollowUpTask.fields.task_type
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /api/auction-lots/{id}/record-sale: the lot SOLD makes
          the Donation ACCRUED (link 1); the ACCRUED transition raises the charity's
          pledged_balance_cents to 897500 (link 2); crossing AUTO_BATCH_THRESHOLD_CENTS causes a
          RemittanceBatch to be auto-opened (link 3); the auto-opened batch raises a
          REMITTANCE_PENDING FollowUpTask (link 4). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "logical clock is 2026-07-10T00:00:00Z"
            - "charity cb has pledged_balance_cents 0 and no batch of any status"
            - "donation dbig is IN_CUSTODY with a CLEARED title and a LISTED lot with reserve 100000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/charities"
              payload: { name: "Big Wheels Trust", ein: "91-7777777", state_code: "CA", remittance_fee_pct: 0.10 }
              as: ProgramAdmin
              captures: { cb: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "big@example.com", full_name: "Bea Ig", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${cb}", intake_channel: "PARTNER", declared_condition: "EXCELLENT", pickup_required: false }
              as: IntakeAgent
              captures: { dbig: $.data.id }
            - call: "POST /api/donations/${dbig}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dbig}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dbig}", title_number: "CA-TTL-BIG", owner_name: "Bea Ig" }
              as: TitleClerk
              captures: { tbig: $.data.id }
            - call: "POST /api/title-records/${tbig}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tbig}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dbig}", venue_id: "${ve1}", lot_number: "L-BIG", reserve_price_cents: 100000 }
              as: AuctionManager
              captures: { lbig: $.data.id }
            - call: "GET /api/donations/${dbig}"
              as: AuctionManager
              captures: { dbig_v: $.data.version }
          trigger:
            - call: "POST /api/auction-lots/${lbig}/record-sale"
              payload: { sale_price_cents: 1000000, expected_donation_version: "${dbig_v}" }
              as: AuctionManager
          assert:
            - "link 1: Donation.${dbig}.status == SOLD and Donation.${dbig}.payout_status == ACCRUED"
            - "link 1: Donation.${dbig}.program_fee_cents == 100000 and Donation.${dbig}.net_to_charity_cents == 897500"
            - "link 2: CharityAffiliate.${cb}.pledged_balance_cents == 897500"
            - "link 2: GET /api/donations/${dbig}/ledger-entries returns exactly 3 entries (PROCEEDS_CREDIT 1000000, PROGRAM_FEE_DEBIT 100000, ADMIN_FEE_DEBIT 2500) and no TOW_COST_DEBIT because tow_allowance_cents == 0"
            - "link 3: GET /api/remittance-batches with charity_id == ${cb} returns exactly 1 batch with status OPEN, period_start_utc == 2026-07-10T00:00:00Z and period_end_utc == 2026-08-09T00:00:00Z"
            - "link 4: GET /api/donations/${dbig}/follow-up-tasks returns exactly 1 task with task_type REMITTANCE_PENDING, status OPEN, assigned_role FinanceOfficer and due_utc == 2026-07-25T00:00:00Z"

      - name: pickup_failure_cascades_to_pickup_block_and_escalation_task
        grounds:
          - state_machines.PickupOrder.SCHEDULED_to_FAILED
          - state_machines.Donation.ACCEPTED_to_PICKUP_BLOCKED
          - entities.Donation.fields.pickup_attempts
          - entities.FollowUpTask.fields.task_type
          - entities.TowVendor.fields.booked_slots_count
        distinguishing_aspect: |
          Depth-2 chain triggered by a different transition, POST /api/pickup-orders/{id}/fail:
          the third failure pushes Donation.pickup_attempts to MAX_PICKUP_ATTEMPTS and moves the
          Donation ACCEPTED -> PICKUP_BLOCKED (link 1); the Donation entering PICKUP_BLOCKED is
          what raises the PICKUP_ESCALATION FollowUpTask (link 2).
        test_recipe:
          setup:
            - "logical clock is 2026-07-05T00:00:00Z"
            - "vendor tv1 has daily_capacity_slots 5 and is ACTIVE"
            - "donation dp is ACCEPTED with pickup_required true and pickup_attempts 0"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "91-8888888", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "fail@example.com", full_name: "Fay Led", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/tow-vendors"
              payload: { name: "Hauler One", service_state_code: "CA", hourly_rate_cents: 12000, daily_capacity_slots: 5 }
              as: ProgramAdmin
              captures: { tv1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PHONE", declared_condition: "POOR", pickup_required: true }
              as: IntakeAgent
              captures: { dp: $.data.id }
            - call: "POST /api/donations/${dp}/accept"
              payload: {}
              as: IntakeAgent
              captures: { dp_v1: $.data.version }
          trigger:
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dp}", tow_vendor_id: "${tv1}", scheduled_start_utc: "2026-07-06T09:00:00Z", scheduled_end_utc: "2026-07-06T11:00:00Z", expected_donation_version: "${dp_v1}" }
              as: IntakeAgent
              captures: { pa: $.data.id }
            - call: "POST /api/pickup-orders/${pa}/fail"
              payload: { failure_reason: "vehicle not at address" }
              as: IntakeAgent
            - call: "GET /api/donations/${dp}"
              as: IntakeAgent
              captures: { dp_v2: $.data.version }
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dp}", tow_vendor_id: "${tv1}", scheduled_start_utc: "2026-07-07T09:00:00Z", scheduled_end_utc: "2026-07-07T11:00:00Z", expected_donation_version: "${dp_v2}" }
              as: IntakeAgent
              captures: { pb: $.data.id }
            - call: "POST /api/pickup-orders/${pb}/fail"
              payload: { failure_reason: "keys unavailable" }
              as: IntakeAgent
            - call: "GET /api/donations/${dp}"
              as: IntakeAgent
              captures: { dp_v3: $.data.version }
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dp}", tow_vendor_id: "${tv1}", scheduled_start_utc: "2026-07-08T09:00:00Z", scheduled_end_utc: "2026-07-08T11:00:00Z", expected_donation_version: "${dp_v3}" }
              as: IntakeAgent
              captures: { pc: $.data.id }
            - call: "POST /api/pickup-orders/${pc}/fail"
              payload: { failure_reason: "donor not reachable" }
              as: IntakeAgent
          assert:
            - "after the first fail, Donation.${dp}.pickup_attempts == 1 and Donation.${dp}.status == ACCEPTED"
            - "after the second fail, Donation.${dp}.pickup_attempts == 2 and Donation.${dp}.status == ACCEPTED"
            - "link 1: after the third fail, Donation.${dp}.pickup_attempts == 3 and Donation.${dp}.status == PICKUP_BLOCKED"
            - "link 2: GET /api/donations/${dp}/follow-up-tasks returns exactly 1 task with task_type PICKUP_ESCALATION, status OPEN, assigned_role ProgramAdmin and due_utc == 2026-07-20T00:00:00Z"
            - "TowVendor.${tv1}.booked_slots_count == 0"
            - "PickupOrder.${pc}.attempt_number == 3"
            - "Donation.${dp}.payout_status == PENDING throughout"

