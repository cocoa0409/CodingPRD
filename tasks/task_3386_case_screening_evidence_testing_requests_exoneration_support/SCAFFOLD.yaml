# =============================================================================
# SCAFFOLD.yaml — Case Screening, Evidence Testing Requests & Exoneration
# Support (post-conviction innocence review organization)
# =============================================================================
# Topology: FLAT. All resources live at top level; parent/child linkage is via
# FK fields and sub-resource / filtered-list reads. api_prefix is "" (empty):
# every §1.5 path is already absolute from the domain root.

scenario: |
  Case Screening, Evidence Testing Requests & Exoneration Support (Innocence Project): intake of requests for assistance with initial screening against case criteria including claims of actual innocence and available evidence, evidence location efforts with court, police and laboratory records requests that often reveal destroyed or missing materials, testing motions and agreements with prosecutors for post-conviction analysis of preserved evidence, result interpretation with expert consultation and identification of alternate perpetrators through database comparison, litigation strategy across post-conviction petitions, appeals and clemency paths with jurisdictional differences, client communication over multi-year timelines with expectation management, exoneration support including release logistics, compensation claims and reentry services, policy reform work informed by case patterns

domain_name: innocence-case-review
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration      # gated multi-path pipeline: intake -> evidence -> testing -> litigation -> exoneration
  secondary_archetype: compliance_audit          # segregation of duties on screening decisions; jurisdictional statutory constraints; audit of every state change
  complexity_layers:
    - optimistic_concurrency                     # OCC on Case.version and TestingAuthorization.version
    - cascading_side_effects                     # records-response -> evidence -> case -> policy-initiative chains
    - ops_run_checkpoint                         # contact-overdue sweep advances the contact-compliance epoch
    - conditional_feature_flags                  # jurisdiction statute flags reshape petition/motion/compensation rules
  entity_topology: flat
  state_machine_shape: cyclic                    # intake info-loop, records appeal loop, agreement negotiation loop, petition appeal loop, policy stall/resume loop
  relationship_patterns:
    - one_to_many                                # Case -> EvidenceItem / RecordsRequest / LegalPetition / ...
    - cross_aggregate                            # LabAnalysis -> TestingAuthorization; PolicyInitiative pattern-counts over Cases
  role_model: segregation_of_duties              # screener who recommends cannot decide; ManagingAttorney decides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# common_fields: true expands to: id (server-minted UUID, no type prefix;
# identity only — forbidden in selector/ranking/tie-break decisions),
# created_at / updated_at (ISO 8601 UTC, three fractional digits), version
# (integer, starts at 1, +1 on every mutation including cascaded side effects).
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; unique across all Jurisdictions", constraints: "unique; uppercase A-Z{2}; duplicate create -> ERR_DUPLICATE_STATE_CODE" }
      - { name: name, type: string, source: input, description: "Display name of the jurisdiction" }
      - { name: has_post_conviction_dna_statute, type: boolean, source: input, description: "Whether this jurisdiction has a post-conviction DNA testing statute; gates kind=MOTION TestingAuthorization creation" }
      - { name: post_conviction_deadline_years, type: integer, source: input, description: "Years after conviction_date within which a POST_CONVICTION petition must be FILED; null means no statutory deadline", constraints: "null or >= 1" }
      - { name: clemency_available, type: boolean, source: input, description: "Whether clemency petitions exist in this jurisdiction; gates petition_type=CLEMENCY" }
      - { name: compensation_statute_exists, type: boolean, source: input, description: "Whether a wrongful-conviction compensation statute exists; gates CompensationClaim creation" }
      - { name: compensation_cap_cents, type: integer, source: input, description: "Statutory cap on the tiered award portion, in cents; null means uncapped", constraints: "null or >= 0" }
      - { name: actual_innocence_enhancement_pct, type: integer, source: input, default: 0, description: "Percentage enhancement applied to the tiered award when the case carries exculpatory evidence; 0 means no enhancement", constraints: "0..100" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the incarcerated person requesting assistance" }
      - { name: inmate_number, type: string, source: input, description: "Department-of-corrections inmate number" }
      - { name: facility_name, type: string, source: input, description: "Current facility of incarceration", constraints: "optional" }

  - name: IntakeRequest
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the person requesting assistance" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction of conviction" }
      - { name: conviction_date, type: datetime, source: input, description: "Date of conviction (ISO 8601); drives petition filing deadlines and verified incarceration duration" }
      - { name: conviction_summary, type: string, source: input, description: "Free-text summary of the conviction" }
      - { name: claim_of_actual_innocence, type: boolean, source: input, description: "Whether the request claims factual innocence (screening criterion)" }
      - { name: claim_strength, type: enum, source: input, description: "WEAK | MODERATE | STRONG | COMPELLING — screener-assessed claim strength factor" }
      - { name: evidence_potential, type: enum, source: input, description: "NONE_KNOWN | UNCERTAIN | LIKELY_STORED | CONFIRMED_STORED — screener-assessed evidence availability factor" }
      - { name: years_served, type: integer, source: input, description: "Whole years already incarcerated", constraints: ">= 0" }
      - { name: health_urgency, type: enum, source: input, description: "NONE | MODERATE | CRITICAL — client health/time-sensitivity factor" }
      - { name: expedited_review, type: boolean, source: input, default: false, description: "When true, the EXPEDITED weight profile is used for the waitlist priority score" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SCREENING | MORE_INFO_REQUESTED | DECISION_PENDING | ACCEPTED | REJECTED | WAITLISTED" }
      - { name: screening_score_standard, type: number, source: computed, description: "calculations.screening_priority_score under the STANDARD weight profile; null until RECOMMEND" }
      - { name: screening_score_expedited, type: number, source: computed, description: "calculations.screening_priority_score under the EXPEDITED weight profile; null until RECOMMEND" }
      - { name: waitlist_priority_score, type: number, source: computed, description: "Score frozen at decide-time when decision=WAITLISTED: the STANDARD score when expedited_review is false, the EXPEDITED score when true; null unless decision=WAITLISTED" }
      - { name: recommendation, type: enum, source: system, description: "ACCEPT | REJECT | WAITLIST — the screener's recommendation recorded by RECOMMEND; null until then" }
      - { name: recommended_by_user_id, type: string, source: system, description: "X-User-ID of the IntakeSpecialist who performed RECOMMEND; drives the segregation-of-duties check at decide" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ManagingAttorney who performed decide; null until then" }
      - { name: decision, type: enum, source: system, description: "ACCEPTED | REJECTED | WAITLISTED; null until decided" }
      - { name: decision_reason, type: string, source: system, description: "Optional rationale recorded at decide" , constraints: "optional" }
      - { name: accepted_case_id, type: string, source: system, description: "Server-minted id of the Case created when decision=ACCEPTED; null otherwise (the Case carries the canonical FK back to this request)" }
      - { name: supplement_notes, type: string, source: system, description: "Most recent supplement text supplied via submit-supplement", constraints: "optional" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: intake_request_id, type: string, source: system, description: "FK -> IntakeRequest.id; the accepted intake request this Case was created from. Client identity and jurisdiction are reached ONLY through this path: Case.intake_request_id -> IntakeRequest.client_id / IntakeRequest.jurisdiction_id" }
      - { name: assigned_attorney_id, type: string, source: input, description: "Opaque staff user id of the responsible StaffAttorney; supplied at decide time or via PUT /cases/{id}", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATION | TESTING | LITIGATION | EXONERATED | CLOSED" }
      - { name: resolution, type: enum, source: system, description: "UNSUBSTANTIATED | EVIDENCE_LOST | CLIENT_WITHDREW | OTHER; set by CLOSE, null until then" }
      - { name: evidence_posture, type: enum, source: computed, description: "calculations.evidence_posture_derivation: NO_EVIDENCE | SEEKING | SECURED | PARTIALLY_COMPROMISED | FULLY_COMPROMISED | EXCULPATORY" }
      - { name: destroyed_evidence_count, type: integer, source: computed, default: 0, description: "Count of child EvidenceItems whose location_status is REPORTED_DESTROYED or DESTRUCTION_VERIFIED; +1 on entry (REPORTED_DESTROYED is unrecoverable, so the count never decrements)" }
      - { name: exculpatory_evidence_flag, type: boolean, source: system, default: false, description: "Set true by a DatabaseComparison HIT cascade (LabAnalysis db_comparison_status -> COMPLETED_HIT); never auto-cleared" }
      - { name: strategy_notes, type: string, source: input, description: "Litigation strategy notes; mutable via PUT /cases/{id} under OCC", constraints: "optional" }
      - { name: theory_of_case, type: string, source: input, description: "Working theory narrative; mutable via PUT /cases/{id} under OCC", constraints: "optional" }
      - { name: last_contact_at, type: datetime, source: system, description: "Logical-clock timestamp of case creation, then refreshed by every POST /cases/{id}/log-contact" }
      - { name: contact_count, type: integer, source: system, default: 0, description: "Number of logged client-contact events" }
      - { name: contact_overdue, type: boolean, source: system, default: false, description: "Written ONLY by POST /ops/contact-overdue-sweep (and cleared by log-contact): true when days since last_contact_at strictly exceed contact_interval_days" }
      - { name: contact_interval_days, type: integer, source: computed, description: "calculations.contact_overdue_evaluation interval map: OPEN=90, INVESTIGATION=90, TESTING=60, LITIGATION=30, EXONERATED=14; null when CLOSED", constraints: "null when status=CLOSED" }
      - { name: last_expectation_setting, type: enum, source: system, description: "CAUTIOUS | NEUTRAL | OPTIMISTIC — expectation level set on the most recent log-contact; null until first contact" }
      - { name: exoneration_date, type: datetime, source: system, description: "Logical-clock timestamp when the case entered EXONERATED (petition grant with vacates_conviction=true); null until then" }
      - { name: release_housing_ready, type: boolean, source: input, default: false, description: "Release checklist: post-release housing arranged (set via advance event UPDATE_RELEASE_CHECKLIST)" }
      - { name: release_id_documents_ready, type: boolean, source: input, default: false, description: "Release checklist: identification documents secured" }
      - { name: release_transportation_ready, type: boolean, source: input, default: false, description: "Release checklist: transportation from facility arranged" }
      - { name: scheduled_release_date, type: datetime, source: input, description: "Planned release instant; EXECUTE_RELEASE requires the logical clock >= this value", constraints: "optional" }
      - { name: release_readiness, type: enum, source: computed, description: "NOT_APPLICABLE | PLANNING | READY | RELEASED — derived: NOT_APPLICABLE until EXONERATED; PLANNING while any checklist flag false; READY when all three flags true; RELEASED after EXECUTE_RELEASE" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this physical evidence belongs to" }
      - { name: description, type: string, source: input, description: "Human description of the item (e.g. 'rape kit swab, 1998 collection')" }
      - { name: evidence_type, type: enum, source: input, description: "BIOLOGICAL_SWAB | CLOTHING | WEAPON | FINGERPRINT_CARD | OTHER" }
      - { name: custodian_type, type: enum, source: input, description: "COURT_CLERK | POLICE_PROPERTY | CRIME_LAB | MEDICAL_EXAMINER — the agency believed to hold the item" }
      - { name: location_status, type: enum, source: system, description: "IDENTIFIED | SEARCHING | LOCATED | REPORTED_MISSING | REPORTED_DESTROYED | CUSTODY_CONFIRMED | DESTRUCTION_VERIFIED — the location-tracking dimension (see state_machines)" }
      - { name: testing_status, type: enum, source: computed, description: "UNTESTED | TESTING_AUTHORIZED | SAMPLE_RESERVED | TESTED | SAMPLE_EXHAUSTED — FULLY DERIVED by calculations.testing_status_derivation from remaining_sample_ng, sibling LabAnalyses and TestingAuthorizations; never set directly" }
      - { name: initial_sample_ng, type: integer, source: input, description: "Initial testable sample mass in nanograms", constraints: ">= 1" }
      - { name: remaining_sample_ng, type: integer, source: computed, description: "initial_sample_ng minus reserved mass of non-terminal LabAnalyses minus consumed mass of resulted LabAnalyses; debited at reservation, refunded at cancellation or at under-consumption" }

  - name: RecordsRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case whose records are being requested" }
      - { name: agency_type, type: enum, source: input, description: "COURT | POLICE | LABORATORY | MEDICAL_EXAMINER — the class of agency addressed" }
      - { name: agency_name, type: string, source: input, description: "Name of the specific agency (e.g. 'Harris County District Clerk')" }
      - { name: request_summary, type: string, source: input, description: "Scope of records sought" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FULFILLED | PARTIALLY_FULFILLED | DENIED | APPEALED" }
      - { name: response_disposition, type: enum, source: system, description: "FULFILLED | PARTIALLY_FULFILLED | DENIED — disposition of the most recent RECORD_RESPONSE; null until first response" }
      - { name: items_revealed, type: array, source: system, description: "Array of { evidence_item_id, disposition } from the most recent RECORD_RESPONSE (disposition in LOCATED | DESTROYED | MISSING); [] until a fulfilling response" }

  - name: TestingAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: evidence_item_id, type: string, source: input, description: "FK -> EvidenceItem.id; the preserved item to be tested" }
      - { name: kind, type: enum, source: input, description: "AGREEMENT (consent path negotiated with the prosecutor — cyclic lifecycle) | MOTION (contested court motion — branching lifecycle). Immutable after creation; the two kinds share the entity but not the transition graph" }
      - { name: status, type: enum, source: system, description: "DRAFTED | PROPOSED | NEGOTIATING | SIGNED | REJECTED_BY_PROSECUTION (AGREEMENT states) | FILED | GRANTED | DENIED | APPEALED (MOTION states)" }
      - { name: terms, type: string, source: input, description: "Negotiated testing terms (scope, lab, cost split narrative); mutable via amendments under OCC while status in {DRAFTED, PROPOSED, NEGOTIATING}", constraints: "optional" }
      - { name: proposed_test_types, type: array, source: input, description: "Array of LabAnalysis.test_type values proposed for testing", constraints: "optional" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the StaffAttorney who created this authorization" }
      - { name: last_ruling, type: enum, source: system, description: "GRANTED | DENIED — most recent court ruling (MOTION kind only); null until first RECORD_RULING" }

  - name: LabAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: evidence_item_id, type: string, source: input, description: "FK -> EvidenceItem.id; the preserved item under test" }
      - { name: authorization_id, type: string, source: input, description: "FK -> TestingAuthorization.id; must reference a TestingAuthorization in status SIGNED or GRANTED at creation" }
      - { name: lab_name, type: string, source: input, description: "Laboratory performing the test; the resource over which scheduled-window overlap is enforced" }
      - { name: test_type, type: enum, source: input, description: "DNA_STR | DNA_TOUCH | DNA_YSTR | MITOCHONDRIAL_DNA | SEROLOGY" }
      - { name: required_sample_ng, type: integer, source: input, description: "Sample mass reserved at creation", constraints: ">= 1" }
      - { name: reserved_sample_ng, type: integer, source: system, description: "= required_sample_ng, debited from EvidenceItem.remaining_sample_ng at creation; refunded in full on CANCEL, refunded partially on under-consumption" }
      - { name: actual_consumed_ng, type: integer, source: system, description: "Mass actually consumed, set by RECORD_RESULT; null until then", constraints: "1..reserved_sample_ng when set" }
      - { name: scheduled_start, type: datetime, source: input, description: "Lab bench window start (half-open interval [scheduled_start, scheduled_end))" }
      - { name: scheduled_end, type: datetime, source: input, description: "Lab bench window end; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SAMPLE_SHIPPED | RESULT_RECORDED | INTERPRETED | CANCELLED" }
      - { name: outcome, type: enum, source: system, description: "EXCLUSIONARY | INCLUSIONARY | INCONCLUSIVE | NO_PROFILE — set by RECORD_RESULT; null until then" }
      - { name: profile_obtained, type: boolean, source: system, description: "Whether a comparable DNA profile was obtained; set by RECORD_RESULT; null until then" }
      - { name: expert_name, type: string, source: system, description: "Consulting expert recorded by RECORD_EXPERT_INTERPRETATION; null until then" }
      - { name: expert_interpretation, type: enum, source: system, description: "SUPPORTS_INNOCENCE | NEUTRAL | SUPPORTS_CONVICTION — set by RECORD_EXPERT_INTERPRETATION; null until then" }
      - { name: db_comparison_status, type: enum, source: system, description: "NOT_RUN | COMPLETED_HIT | COMPLETED_NO_HIT | COMPLETED_PARTIAL — set by RUN_DATABASE_COMPARISON" }
      - { name: db_matched_subject_name, type: string, source: system, description: "Alternate perpetrator name returned by the database on a HIT; null otherwise" }

  - name: LegalPetition
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: petition_type, type: enum, source: input, description: "POST_CONVICTION | DIRECT_APPEAL | CLEMENCY | HABEAS_CORPUS" }
      - { name: court_name, type: string, source: input, description: "Court or clemency authority the petition is addressed to" }
      - { name: claim_basis, type: enum, source: input, description: "ACTUAL_INNOCENCE | PROCEDURAL | BOTH — ACTUAL_INNOCENCE and BOTH require Case.exculpatory_evidence_flag = true at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | DECIDED_GRANTED | DECIDED_DENIED | APPEAL_FILED" }
      - { name: decision_vacates_conviction, type: boolean, source: system, description: "Set by RECORD_DECISION when decision=GRANTED; true triggers the exoneration cascade; null until decided" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of the FILE transition; null until filed" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent RECORD_DECISION; null until decided" }

  - name: CompensationClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case must be EXONERATED at creation" }
      - { name: years_incarcerated_claimed, type: integer, source: input, description: "Claimant-declared whole years incarcerated; feeds the PROVISIONAL estimate", constraints: ">= 1" }
      - { name: documented_legal_fees_cents, type: integer, source: input, default: 0, description: "Documented legal fees in cents, reimbursed after the statutory cap, capped by FEE_REIMBURSEMENT_CAP_CENTS", constraints: ">= 0" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "calculations.compensation_award under the PROVISIONAL variant, frozen at creation" }
      - { name: final_award_cents, type: integer, source: computed, description: "calculations.compensation_award under the FINAL_VERIFIED variant, computed at RECORD_DECISION=APPROVED; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | APPROVED | DENIED | APPEALED | PAID" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount disbursed by RECORD_PAYMENT; must equal final_award_cents exactly; null until paid" }

  - name: ReentryProvider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider organization name (the capacity-holding resource)" }
      - { name: service_type, type: enum, source: input, description: "HOUSING | EMPLOYMENT | MEDICAL | COUNSELING" }
      - { name: total_capacity, type: integer, source: input, description: "Maximum number of referrals whose service windows may overlap", constraints: ">= 1" }
      - { name: slots_in_use, type: integer, source: computed, default: 0, description: "Count of this provider's ReentryReferrals in status PENDING or ACTIVE; written by referral create/COMPLETE/CANCEL" }

  - name: ReentryReferral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the exonerated client receiving the service" }
      - { name: provider_id, type: string, source: input, description: "FK -> ReentryProvider.id" }
      - { name: service_start, type: datetime, source: input, description: "Service window start (half-open interval [service_start, service_end))" }
      - { name: service_end, type: datetime, source: input, description: "Service window end; must be strictly after service_start" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | COMPLETED | CANCELLED" }

  - name: PolicyInitiative
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; the jurisdiction whose case patterns inform this initiative" }
      - { name: topic, type: enum, source: input, description: "EVIDENCE_PRESERVATION | COMPENSATION_REFORM | DATABASE_ACCESS | RECORDS_TRANSPARENCY" }
      - { name: title, type: string, source: input, description: "Initiative title" }
      - { name: status, type: enum, source: system, description: "PROPOSED | RESEARCHING | DRAFTED | ADOPTED | STALLED" }
      - { name: pattern_case_count, type: integer, source: computed, default: 0, description: "calculations.policy_pattern_count: number of distinct Cases in this jurisdiction matching the topic pattern; stored and re-derived whenever a qualifying Case mutation occurs" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# Trigger names in "POST ..." form reference §1.5 endpoints; advance-style
# endpoints dispatch on the request body's `event` field. Any event listed for
# an advance endpoint but not legal from the entity's current status is
# rejected with ERR_INVALID_STATE; any event value outside the endpoint's
# declared event vocabulary is rejected with ERR_INVALID_TRANSITION_EVENT.
state_machines:
  - entity: IntakeRequest
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: SCREENING
        trigger: "POST /intake-requests/{id}/advance (event=BEGIN_SCREENING)"
        actor: IntakeSpecialist
        preconditions: ["status == RECEIVED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SCREENING
        to: MORE_INFO_REQUESTED
        trigger: "POST /intake-requests/{id}/advance (event=REQUEST_MORE_INFO)"
        actor: IntakeSpecialist
        preconditions: ["status == SCREENING (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "Cyclic information-gathering loop: the request returns to SCREENING when the client supplements it."
      - from: MORE_INFO_REQUESTED
        to: SCREENING
        trigger: "POST /intake-requests/{id}/submit-supplement"
        actor: Client | IntakeSpecialist
        preconditions:
          - "status == MORE_INFO_REQUESTED (else ERR_INVALID_STATE)"
          - "actor Client only when IntakeRequest.client_id == X-User-ID (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["supplement_notes := payload.supplement_notes"]
      - from: SCREENING
        to: DECISION_PENDING
        trigger: "POST /intake-requests/{id}/advance (event=RECOMMEND, payload.recommendation in {ACCEPT, REJECT, WAITLIST})"
        actor: IntakeSpecialist
        preconditions:
          - "status == SCREENING (else ERR_INVALID_STATE)"
          - "when recommendation=ACCEPT: claim_of_actual_innocence == true AND evidence_potential IN {LIKELY_STORED, CONFIRMED_STORED} (else ERR_SCREENING_CRITERIA_NOT_MET)"
        side_effects:
          - "recommendation := payload.recommendation"
          - "recommended_by_user_id := X-User-ID"
          - "screening_score_standard := calculations.screening_priority_score(STANDARD)"
          - "screening_score_expedited := calculations.screening_priority_score(EXPEDITED)"
      - from: DECISION_PENDING
        to: ACCEPTED
        trigger: "POST /intake-requests/{id}/decide (payload.decision=ACCEPTED)"
        actor: ManagingAttorney
        preconditions:
          - "status == DECISION_PENDING (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != recommended_by_user_id (else ERR_DECISION_SELF_APPROVAL)"
        side_effects:
          - "decision := ACCEPTED; decided_by_user_id := X-User-ID; decision_reason := payload.rejection_reason (optional)"
          - "CREATE Case: intake_request_id := this id; status := OPEN; assigned_attorney_id := payload.assigned_attorney_id; exculpatory_evidence_flag := false; destroyed_evidence_count := 0; evidence_posture := NO_EVIDENCE; release_readiness := NOT_APPLICABLE; last_contact_at := current logical clock; contact_count := 0; contact_overdue := false; contact_interval_days := 90"
          - "accepted_case_id := new Case.id"
      - from: DECISION_PENDING
        to: REJECTED
        trigger: "POST /intake-requests/{id}/decide (payload.decision=REJECTED)"
        actor: ManagingAttorney
        preconditions:
          - "status == DECISION_PENDING (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != recommended_by_user_id (else ERR_DECISION_SELF_APPROVAL)"
        side_effects: ["decision := REJECTED; decided_by_user_id := X-User-ID; decision_reason := payload.rejection_reason"]
      - from: DECISION_PENDING
        to: WAITLISTED
        trigger: "POST /intake-requests/{id}/decide (payload.decision=WAITLISTED)"
        actor: ManagingAttorney
        preconditions:
          - "status == DECISION_PENDING (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != recommended_by_user_id (else ERR_DECISION_SELF_APPROVAL)"
        side_effects:
          - "decision := WAITLISTED; decided_by_user_id := X-User-ID"
          - "waitlist_priority_score := (expedited_review ? screening_score_expedited : screening_score_standard)"
      - from: WAITLISTED
        to: SCREENING
        trigger: "POST /intake-requests/activate-waitlist-next (selector picks this request)"
        actor: ManagingAttorney
        preconditions:
          - "the selector chose this request per calculations.waitlist_selection (else it is not transitioned)"
        side_effects: ["decision/decided_by_user_id retained; recommendation fields retained"]
        note: "Waitlist re-entry cycle: re-enters SCREENING for a fresh RECOMMEND; scores are recomputed at the next RECOMMEND."

  - entity: Case
    initial_state: OPEN
    terminal_states: [EXONERATED, CLOSED]
    transitions:
      - from: OPEN
        to: INVESTIGATION
        trigger: "POST /cases/{id}/advance (event=BEGIN_INVESTIGATION)"
        actor: StaffAttorney | ManagingAttorney
        preconditions: ["status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["contact_interval_days := 90 (unchanged value, restated)"]
      - from: INVESTIGATION
        to: TESTING
        trigger: "POST /cases/{id}/advance (event=BEGIN_TESTING)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status == INVESTIGATION (else ERR_INVALID_STATE)"
          - "at least one child EvidenceItem has location_status == CUSTODY_CONFIRMED (else ERR_NO_PRESERVED_EVIDENCE)"
        side_effects: ["contact_interval_days := 60; contact_overdue recomputed by next sweep only"]
      - from: TESTING
        to: LITIGATION
        trigger: "POST /cases/{id}/advance (event=BEGIN_LITIGATION)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status == TESTING (else ERR_INVALID_STATE)"
          - "at least one LabAnalysis on a child EvidenceItem has status IN {RESULT_RECORDED, INTERPRETED} (else ERR_NO_TEST_RESULTS)"
        side_effects: ["contact_interval_days := 30"]
      - from: LITIGATION
        to: EXONERATED
        trigger: "system cascade: POST /legal-petitions/{id}/advance (event=RECORD_DECISION) with decision=GRANTED and vacates_conviction=true on a petition of this case"
        actor: system
        preconditions: ["the triggering petition's case_id == this Case.id"]
        side_effects:
          - "status := EXONERATED; exoneration_date := current logical clock"
          - "release_readiness := PLANNING"
          - "contact_interval_days := 14"
        note: "There is NO direct advance event into EXONERATED; only the petition-grant cascade enters it."
      - from: OPEN
        to: CLOSED
        trigger: "POST /cases/{id}/advance (event=CLOSE, payload.resolution required)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status IN {OPEN, INVESTIGATION, TESTING, LITIGATION} (else ERR_INVALID_STATE)"
          - "no child LegalPetition with status IN {DRAFT, FILED, APPEAL_FILED} (else ERR_OPEN_PETITIONS_EXIST)"
          - "no LabAnalysis on a child EvidenceItem with status IN {SCHEDULED, SAMPLE_SHIPPED} (else ERR_ACTIVE_LAB_ANALYSES_EXIST)"
        side_effects: ["resolution := payload.resolution; contact_interval_days := null; contact_overdue := false"]
      - from: INVESTIGATION
        to: CLOSED
        trigger: "POST /cases/{id}/advance (event=CLOSE, payload.resolution required)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status IN {OPEN, INVESTIGATION, TESTING, LITIGATION} (else ERR_INVALID_STATE)"
          - "no child LegalPetition with status IN {DRAFT, FILED, APPEAL_FILED} (else ERR_OPEN_PETITIONS_EXIST)"
          - "no LabAnalysis on a child EvidenceItem with status IN {SCHEDULED, SAMPLE_SHIPPED} (else ERR_ACTIVE_LAB_ANALYSES_EXIST)"
        side_effects: ["resolution := payload.resolution; contact_interval_days := null; contact_overdue := false"]
      - from: TESTING
        to: CLOSED
        trigger: "POST /cases/{id}/advance (event=CLOSE, payload.resolution required)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status IN {OPEN, INVESTIGATION, TESTING, LITIGATION} (else ERR_INVALID_STATE)"
          - "no child LegalPetition with status IN {DRAFT, FILED, APPEAL_FILED} (else ERR_OPEN_PETITIONS_EXIST)"
          - "no LabAnalysis on a child EvidenceItem with status IN {SCHEDULED, SAMPLE_SHIPPED} (else ERR_ACTIVE_LAB_ANALYSES_EXIST)"
        side_effects: ["resolution := payload.resolution; contact_interval_days := null; contact_overdue := false"]
      - from: LITIGATION
        to: CLOSED
        trigger: "POST /cases/{id}/advance (event=CLOSE, payload.resolution required)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status IN {OPEN, INVESTIGATION, TESTING, LITIGATION} (else ERR_INVALID_STATE)"
          - "no child LegalPetition with status IN {DRAFT, FILED, APPEAL_FILED} (else ERR_OPEN_PETITIONS_EXIST)"
          - "no LabAnalysis on a child EvidenceItem with status IN {SCHEDULED, SAMPLE_SHIPPED} (else ERR_ACTIVE_LAB_ANALYSES_EXIST)"
        side_effects: ["resolution := payload.resolution; contact_interval_days := null; contact_overdue := false"]
      - from: EXONERATED
        to: EXONERATED
        trigger: "POST /cases/{id}/advance (event=UPDATE_RELEASE_CHECKLIST)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status == EXONERATED (else ERR_CASE_NOT_EXONERATED)"
          - "release_readiness IN {PLANNING, READY} (else ERR_INVALID_STATE)"
        side_effects:
          - "release_housing_ready / release_id_documents_ready / release_transportation_ready := payload values (each optional; absent key leaves the flag unchanged)"
          - "scheduled_release_date := payload.scheduled_release_date when provided"
          - "release_readiness := READY when all three flags true else PLANNING (READY -> PLANNING regression cycle is legal)"
      - from: EXONERATED
        to: EXONERATED
        trigger: "POST /cases/{id}/advance (event=EXECUTE_RELEASE)"
        actor: StaffAttorney | ManagingAttorney
        preconditions:
          - "status == EXONERATED (else ERR_CASE_NOT_EXONERATED)"
          - "release_readiness == READY (else ERR_RELEASE_NOT_READY)"
          - "current logical clock >= scheduled_release_date (else ERR_RELEASE_DATE_NOT_REACHED)"
        side_effects: ["release_readiness := RELEASED"]

  - entity: EvidenceItem
    note: "Two INDEPENDENT state dimensions evolve on the same row. location_status is moved by explicit advance events and by RecordsRequest cascades; testing_status is never set directly — it is re-derived by calculations.testing_status_derivation whenever remaining_sample_ng mutates, whenever a sibling LabAnalysis changes status, and whenever a TestingAuthorization for this item becomes SIGNED/GRANTED. A transition on one dimension never writes the other dimension."
    initial_state: "location_status=IDENTIFIED, testing_status=UNTESTED"
    terminal_states: ["location_status=DESTRUCTION_VERIFIED (location dimension only; the testing dimension has no terminal state)"]
    transitions:
      - from: "location_status=IDENTIFIED"
        to: "location_status=SEARCHING"
        trigger: "POST /evidence-items/{id}/advance (event=START_SEARCH)"
        actor: EvidenceAnalyst
        preconditions: ["location_status == IDENTIFIED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: "location_status=SEARCHING"
        to: "location_status=LOCATED"
        trigger: "POST /evidence-items/{id}/advance (event=MARK_LOCATED) OR RecordsRequest RECORD_RESPONSE cascade with reveal disposition LOCATED"
        actor: EvidenceAnalyst | system
        preconditions: ["location_status IN {SEARCHING, REPORTED_MISSING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: "location_status=REPORTED_MISSING"
        to: "location_status=LOCATED"
        trigger: "POST /evidence-items/{id}/advance (event=MARK_LOCATED) OR RecordsRequest RECORD_RESPONSE cascade with reveal disposition LOCATED"
        actor: EvidenceAnalyst | system
        preconditions: ["location_status IN {SEARCHING, REPORTED_MISSING} (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "Found-after-reported-missing cycle: material written off as missing can resurface."
      - from: "location_status=IDENTIFIED|SEARCHING"
        to: "location_status=REPORTED_MISSING"
        trigger: "POST /evidence-items/{id}/advance (event=MARK_MISSING) OR RecordsRequest RECORD_RESPONSE cascade with reveal disposition MISSING"
        actor: EvidenceAnalyst | system
        preconditions: ["location_status IN {IDENTIFIED, SEARCHING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: "location_status=IDENTIFIED|SEARCHING|REPORTED_MISSING"
        to: "location_status=REPORTED_DESTROYED"
        trigger: "RecordsRequest RECORD_RESPONSE cascade with reveal disposition DESTROYED (only)"
        actor: system
        preconditions: ["location_status IN {IDENTIFIED, SEARCHING, REPORTED_MISSING}"]
        side_effects:
          - "Case (via case_id): destroyed_evidence_count += 1"
          - "Case.evidence_posture := calculations.evidence_posture_derivation(Case)"
          - "Case.updated_at refreshed; Case.version += 1"
          - "every PolicyInitiative whose jurisdiction matches Case.intake_request_id -> IntakeRequest.jurisdiction_id AND topic == EVIDENCE_PRESERVATION: pattern_case_count re-derived per calculations.policy_pattern_count (PolicyInitiative.updated_at refreshed, version += 1 when the count changes)"
        note: "This is cascade chain A: records response -> EvidenceItem -> Case -> PolicyInitiative (three links past the trigger)."
      - from: "location_status=REPORTED_DESTROYED"
        to: "location_status=DESTRUCTION_VERIFIED"
        trigger: "POST /evidence-items/{id}/advance (event=VERIFY_DESTRUCTION)"
        actor: EvidenceAnalyst
        preconditions: ["location_status == REPORTED_DESTROYED (else ERR_INVALID_STATE)"]
        side_effects: ["Case.evidence_posture re-derived (count unchanged — DESTRUCTION_VERIFIED already counted)"]
      - from: "location_status=LOCATED"
        to: "location_status=CUSTODY_CONFIRMED"
        trigger: "POST /evidence-items/{id}/advance (event=CONFIRM_CUSTODY)"
        actor: EvidenceAnalyst
        preconditions: ["location_status == LOCATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Case.evidence_posture re-derived"
          - "testing_status re-derived (calculations.testing_status_derivation)"
      - from: "location_status=REPORTED_DESTROYED|REPORTED_MISSING"
        to: "location_status=LOCATED"
        trigger: "RecordsRequest RECORD_RESPONSE cascade with reveal disposition LOCATED"
        actor: system
        preconditions: ["location_status IN {SEARCHING, REPORTED_MISSING}"]
        side_effects: []
        note: "REPORTED_DESTROYED is NOT recoverable through the LOCATED cascade; only REPORTED_MISSING is. The from-set is authoritative."
      - from: "testing_status (derived)"
        to: "testing_status (derived)"
        trigger: "system: re-derived by calculations.testing_status_derivation on every mutation of remaining_sample_ng, sibling LabAnalysis status, or linked TestingAuthorization status"
        actor: system
        preconditions: []
        side_effects: []
        note: "SAMPLE_EXHAUSTED is reachable: a reservation that leaves remaining_sample_ng < 5 (MIN_TESTABLE_NG) flips the dimension to SAMPLE_EXHAUSTED; a cancellation refund that restores remaining_sample_ng >= 5 flips it back."

  - entity: RecordsRequest
    initial_state: DRAFT
    terminal_states: [FULFILLED, PARTIALLY_FULFILLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /records-requests/{id}/advance (event=SUBMIT)"
        actor: EvidenceAnalyst
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: FULFILLED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=FULFILLED)"
        actor: EvidenceAnalyst
        preconditions:
          - "status IN {SUBMITTED, APPEALED} (else ERR_INVALID_STATE)"
          - "every payload.items_revealed[i].disposition is legal for the referenced EvidenceItem's current location_status: LOCATED requires location_status IN {SEARCHING, REPORTED_MISSING}; DESTROYED requires IN {IDENTIFIED, SEARCHING, REPORTED_MISSING}; MISSING requires IN {IDENTIFIED, SEARCHING} (else ERR_INVALID_STATE on the request)"
        side_effects:
          - "response_disposition := FULFILLED; items_revealed := payload.items_revealed"
          - "for each reveal, in payload array order: apply the EvidenceItem location transition (LOCATED -> MARK_LOCATED semantics; DESTROYED -> the REPORTED_DESTROYED cascade incl. Case + PolicyInitiative links; MISSING -> REPORTED_MISSING)"
      - from: SUBMITTED
        to: PARTIALLY_FULFILLED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=PARTIALLY_FULFILLED)"
        actor: EvidenceAnalyst
        preconditions:
          - "status IN {SUBMITTED, APPEALED} (else ERR_INVALID_STATE)"
          - "same per-item legality as the FULFILLED branch"
        side_effects: ["same per-item cascade as the FULFILLED branch; response_disposition := PARTIALLY_FULFILLED"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=DENIED)"
        actor: EvidenceAnalyst
        preconditions:
          - "status IN {SUBMITTED, APPEALED} (else ERR_INVALID_STATE)"
          - "payload.items_revealed must be absent or empty for DENIED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "response_disposition := DENIED"
          - "every PolicyInitiative whose jurisdiction matches the case's AND topic == RECORDS_TRANSPARENCY: pattern_case_count re-derived"
      - from: APPEALED
        to: FULFILLED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=FULFILLED)"
        actor: EvidenceAnalyst
        preconditions: ["status IN {SUBMITTED, APPEALED}; same per-item legality"]
        side_effects: ["same per-item cascade as from SUBMITTED"]
      - from: APPEALED
        to: PARTIALLY_FULFILLED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=PARTIALLY_FULFILLED)"
        actor: EvidenceAnalyst
        preconditions: ["status IN {SUBMITTED, APPEALED}; same per-item legality"]
        side_effects: ["same per-item cascade as from SUBMITTED"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /records-requests/{id}/advance (event=RECORD_RESPONSE, payload.disposition=DENIED)"
        actor: EvidenceAnalyst
        preconditions: ["status IN {SUBMITTED, APPEALED}"]
        side_effects: ["response_disposition := DENIED; RECORDS_TRANSPARENCY pattern re-derived"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /records-requests/{id}/advance (event=APPEAL)"
        actor: EvidenceAnalyst
        preconditions: ["status == DENIED (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "Appeal cycle: DENIED -> APPEALED -> RECORD_RESPONSE -> FULFILLED/PARTIALLY_FULFILLED/DENIED; a DENIED-after-appeal request may be appealed again."

  - entity: TestingAuthorization
    note: "One entity, two kind-conditional lifecycles. kind=AGREEMENT follows the prosecutor-negotiation graph (cyclic NEGOTIATING loop); kind=MOTION follows the contested-court graph (DENIED -> APPEALED -> ruling cycle). An event legal for one kind is ERR_INVALID_STATE for the other kind regardless of status."
    initial_state: DRAFTED
    terminal_states: [SIGNED, REJECTED_BY_PROSECUTION, GRANTED, DENIED]
    transitions:
      - from: DRAFTED
        to: PROPOSED
        trigger: "POST /testing-authorizations/{id}/advance (event=PROPOSE; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status == DRAFTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PROPOSED
        to: NEGOTIATING
        trigger: "POST /testing-authorizations/{id}/advance (event=COUNTER; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "COUNTER from NEGOTIATING is a legal self-loop (another negotiation round)."
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /testing-authorizations/{id}/advance (event=COUNTER; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /testing-authorizations/{id}/advance (event=SIGN; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects:
          - "EvidenceItem (evidence_item_id): testing_status re-derived -> TESTING_AUTHORIZED when no LabAnalysis activity exists yet"
      - from: NEGOTIATING
        to: SIGNED
        trigger: "POST /testing-authorizations/{id}/advance (event=SIGN; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects: ["EvidenceItem testing_status re-derived"]
      - from: PROPOSED
        to: REJECTED_BY_PROSECUTION
        trigger: "POST /testing-authorizations/{id}/advance (event=REJECT; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: NEGOTIATING
        to: REJECTED_BY_PROSECUTION
        trigger: "POST /testing-authorizations/{id}/advance (event=REJECT; kind=AGREEMENT only)"
        actor: StaffAttorney
        preconditions: ["kind == AGREEMENT AND status IN {PROPOSED, NEGOTIATING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DRAFTED
        to: FILED
        trigger: "POST /testing-authorizations/{id}/advance (event=FILE; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status == DRAFTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: FILED
        to: GRANTED
        trigger: "POST /testing-authorizations/{id}/advance (event=RECORD_RULING, payload.ruling=GRANTED; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "last_ruling := GRANTED"
          - "EvidenceItem (evidence_item_id): testing_status re-derived -> TESTING_AUTHORIZED when no LabAnalysis activity exists yet"
      - from: FILED
        to: DENIED
        trigger: "POST /testing-authorizations/{id}/advance (event=RECORD_RULING, payload.ruling=DENIED; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["last_ruling := DENIED"]
      - from: APPEALED
        to: GRANTED
        trigger: "POST /testing-authorizations/{id}/advance (event=RECORD_RULING, payload.ruling=GRANTED; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["last_ruling := GRANTED; EvidenceItem testing_status re-derived"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /testing-authorizations/{id}/advance (event=RECORD_RULING, payload.ruling=DENIED; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["last_ruling := DENIED"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /testing-authorizations/{id}/advance (event=APPEAL; kind=MOTION only)"
        actor: StaffAttorney
        preconditions: ["kind == MOTION AND status == DENIED (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "Motion appeal cycle: DENIED -> APPEALED -> RECORD_RULING -> GRANTED|DENIED; DENIED is terminal only in the sense that the sole exit is APPEAL."

  - entity: LabAnalysis
    initial_state: SCHEDULED
    terminal_states: [INTERPRETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SAMPLE_SHIPPED
        trigger: "POST /lab-analyses/{id}/advance (event=SHIP_SAMPLE)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions: ["status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SAMPLE_SHIPPED
        to: RESULT_RECORDED
        trigger: "POST /lab-analyses/{id}/advance (event=RECORD_RESULT, payload: outcome, actual_consumed_ng, profile_obtained)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions:
          - "status == SAMPLE_SHIPPED (else ERR_INVALID_STATE)"
          - "payload.actual_consumed_ng >= 1 AND <= reserved_sample_ng (else ERR_CONSUMED_EXCEEDS_RESERVED)"
        side_effects:
          - "outcome := payload.outcome; actual_consumed_ng := payload.actual_consumed_ng; profile_obtained := payload.profile_obtained"
          - "EvidenceItem.remaining_sample_ng += (reserved_sample_ng - actual_consumed_ng) — under-consumption refund"
          - "EvidenceItem.testing_status re-derived (calculations.testing_status_derivation)"
      - from: RESULT_RECORDED
        to: INTERPRETED
        trigger: "POST /lab-analyses/{id}/advance (event=RECORD_EXPERT_INTERPRETATION, payload: expert_name, expert_interpretation)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions: ["status == RESULT_RECORDED (else ERR_INVALID_STATE)"]
        side_effects: ["expert_name := payload.expert_name; expert_interpretation := payload.expert_interpretation"]
      - from: RESULT_RECORDED
        to: RESULT_RECORDED
        trigger: "POST /lab-analyses/{id}/advance (event=RUN_DATABASE_COMPARISON, payload: database_name, comparison_result, matched_subject_name)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions:
          - "status IN {RESULT_RECORDED, INTERPRETED} (else ERR_INVALID_STATE)"
          - "profile_obtained == true (else ERR_INVALID_STATE)"
        side_effects:
          - "db_comparison_status := COMPLETED_HIT when payload.comparison_result=HIT, COMPLETED_NO_HIT when NO_HIT, COMPLETED_PARTIAL when PARTIAL"
          - "db_matched_subject_name := payload.matched_subject_name (HIT only; must be absent otherwise — else ERR_INVALID_REQUEST)"
          - "CASCADE (chain B, link 1) when payload.comparison_result=HIT: Case (evidence_item_id -> case_id).exculpatory_evidence_flag := true"
          - "CASCADE (chain B, link 2): Case.evidence_posture re-derived -> EXCULPATORY precedence applies"
      - from: INTERPRETED
        to: INTERPRETED
        trigger: "POST /lab-analyses/{id}/advance (event=RUN_DATABASE_COMPARISON, payload: database_name, comparison_result, matched_subject_name)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions:
          - "status IN {RESULT_RECORDED, INTERPRETED} (else ERR_INVALID_STATE)"
          - "profile_obtained == true (else ERR_INVALID_STATE)"
        side_effects: ["same as the RESULT_RECORDED branch, including the Case exculpatory cascade on HIT"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lab-analyses/{id}/advance (event=CANCEL)"
        actor: StaffAttorney | EvidenceAnalyst
        preconditions: ["status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects:
          - "EvidenceItem.remaining_sample_ng += reserved_sample_ng — full reservation refund (compensating action for the creation-time debit)"
          - "EvidenceItem.testing_status re-derived"
        note: "Cancellation is impossible once the sample has shipped; the reservation is refunded only from SCHEDULED."

  - entity: LegalPetition
    initial_state: DRAFT
    terminal_states: [DECIDED_GRANTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /legal-petitions/{id}/advance (event=FILE)"
        actor: StaffAttorney
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "Case (case_id).status == LITIGATION (else ERR_CASE_NOT_IN_LITIGATION)"
          - "when petition_type == POST_CONVICTION and jurisdiction.post_conviction_deadline_years is not null: current logical clock <= IntakeRequest.conviction_date + post_conviction_deadline_years years (anniversary date); equality is timely (else ERR_FILING_DEADLINE_EXCEEDED)"
        side_effects: ["filed_at := current logical clock"]
      - from: FILED
        to: DECIDED_GRANTED
        trigger: "POST /legal-petitions/{id}/advance (event=RECORD_DECISION, payload.decision=GRANTED, payload.vacates_conviction)"
        actor: StaffAttorney
        preconditions:
          - "status IN {FILED, APPEAL_FILED} (else ERR_INVALID_STATE)"
          - "payload.vacates_conviction may only be true when payload.decision=GRANTED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decision_vacates_conviction := payload.vacates_conviction; decided_at := current logical clock"
          - "when vacates_conviction == true: Case (case_id) -> EXONERATED cascade (status, exoneration_date, release_readiness := PLANNING, contact_interval_days := 14)"
      - from: FILED
        to: DECIDED_DENIED
        trigger: "POST /legal-petitions/{id}/advance (event=RECORD_DECISION, payload.decision=DENIED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEAL_FILED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "decision_vacates_conviction := false; decided_at := current logical clock"
          - "every PolicyInitiative whose jurisdiction matches the case's AND topic == COMPENSATION_REFORM is NOT touched here (claim denials only); no Case mutation"
      - from: APPEAL_FILED
        to: DECIDED_GRANTED
        trigger: "POST /legal-petitions/{id}/advance (event=RECORD_DECISION, payload.decision=GRANTED, payload.vacates_conviction)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEAL_FILED} (else ERR_INVALID_STATE)"]
        side_effects: ["same as the FILED branch, including the exoneration cascade when vacates_conviction"]
      - from: APPEAL_FILED
        to: DECIDED_DENIED
        trigger: "POST /legal-petitions/{id}/advance (event=RECORD_DECISION, payload.decision=DENIED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEAL_FILED} (else ERR_INVALID_STATE)"]
        side_effects: ["decision_vacates_conviction := false; decided_at := current logical clock"]
      - from: DECIDED_DENIED
        to: APPEAL_FILED
        trigger: "POST /legal-petitions/{id}/advance (event=APPEAL)"
        actor: StaffAttorney
        preconditions:
          - "status == DECIDED_DENIED (else ERR_INVALID_STATE)"
          - "petition_type != CLEMENCY — clemency denials are unappealable (else ERR_NOT_APPEALABLE)"
        side_effects: []
        note: "Appeal cycle: DECIDED_DENIED -> APPEAL_FILED -> RECORD_DECISION -> DECIDED_GRANTED|DECIDED_DENIED; a twice-denied petition may be appealed again."

  - entity: CompensationClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /compensation-claims/{id}/advance (event=FILE)"
        actor: StaffAttorney
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: FILED
        to: APPROVED
        trigger: "POST /compensation-claims/{id}/advance (event=RECORD_DECISION, payload.decision=APPROVED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["final_award_cents := calculations.compensation_award(FINAL_VERIFIED)"]
      - from: FILED
        to: DENIED
        trigger: "POST /compensation-claims/{id}/advance (event=RECORD_DECISION, payload.decision=DENIED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "every PolicyInitiative whose jurisdiction matches the case's AND topic == COMPENSATION_REFORM: pattern_case_count re-derived (version += 1 on change)"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /compensation-claims/{id}/advance (event=RECORD_DECISION, payload.decision=APPROVED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["final_award_cents := calculations.compensation_award(FINAL_VERIFIED)"]
      - from: APPEALED
        to: DENIED
        trigger: "POST /compensation-claims/{id}/advance (event=RECORD_DECISION, payload.decision=DENIED)"
        actor: StaffAttorney
        preconditions: ["status IN {FILED, APPEALED} (else ERR_INVALID_STATE)"]
        side_effects: ["COMPENSATION_REFORM pattern re-derived"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /compensation-claims/{id}/advance (event=APPEAL)"
        actor: StaffAttorney
        preconditions: ["status == DENIED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /compensation-claims/{id}/advance (event=RECORD_PAYMENT, payload.paid_amount_cents)"
        actor: StaffAttorney
        preconditions:
          - "status == APPROVED (else ERR_INVALID_STATE)"
          - "payload.paid_amount_cents == final_award_cents exactly (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: ["paid_amount_cents := payload.paid_amount_cents"]

  - entity: ReentryReferral
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /reentry-referrals/{id}/advance (event=ACTIVATE)"
        actor: ClientServicesAdvocate
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
          - "current logical clock >= service_start (else ERR_SERVICE_WINDOW_NOT_STARTED)"
        side_effects: ["ReentryProvider.slots_in_use unchanged by this transition (PENDING already occupies a slot)"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /reentry-referrals/{id}/advance (event=COMPLETE)"
        actor: ClientServicesAdvocate
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["ReentryProvider.slots_in_use -= 1 (slot release; provider version += 1)"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reentry-referrals/{id}/advance (event=CANCEL)"
        actor: ClientServicesAdvocate
        preconditions: ["status IN {PENDING, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["ReentryProvider.slots_in_use -= 1 (slot release; provider version += 1)"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /reentry-referrals/{id}/advance (event=CANCEL)"
        actor: ClientServicesAdvocate
        preconditions: ["status IN {PENDING, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["ReentryProvider.slots_in_use -= 1 (slot release; provider version += 1)"]

  - entity: PolicyInitiative
    initial_state: PROPOSED
    terminal_states: [ADOPTED]
    transitions:
      - from: PROPOSED
        to: RESEARCHING
        trigger: "POST /policy-initiatives/{id}/advance (event=BEGIN_RESEARCH)"
        actor: PolicyDirector
        preconditions: ["status == PROPOSED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RESEARCHING
        to: DRAFTED
        trigger: "POST /policy-initiatives/{id}/advance (event=SUBMIT_DRAFT)"
        actor: PolicyDirector
        preconditions:
          - "status == RESEARCHING (else ERR_INVALID_STATE)"
          - "pattern_case_count >= 3 (POLICY_PATTERN_THRESHOLD; else ERR_INSUFFICIENT_PATTERN_EVIDENCE)"
        side_effects: []
      - from: DRAFTED
        to: ADOPTED
        trigger: "POST /policy-initiatives/{id}/advance (event=ADOPT)"
        actor: PolicyDirector
        preconditions: ["status == DRAFTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RESEARCHING
        to: STALLED
        trigger: "POST /policy-initiatives/{id}/advance (event=STALL)"
        actor: PolicyDirector
        preconditions: ["status IN {RESEARCHING, DRAFTED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DRAFTED
        to: STALLED
        trigger: "POST /policy-initiatives/{id}/advance (event=STALL)"
        actor: PolicyDirector
        preconditions: ["status IN {RESEARCHING, DRAFTED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: STALLED
        to: RESEARCHING
        trigger: "POST /policy-initiatives/{id}/advance (event=RESUME)"
        actor: PolicyDirector
        preconditions: ["status == STALLED (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "Stall/resume cycle: a stalled initiative returns to RESEARCHING and must satisfy the pattern threshold again from there."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
# Only TRUE races live here (a second strictly-sequential request would still
# legitimately succeed under natural product semantics). Everything else is a
# state precondition in §1.2 or a §1.4 validation.
concurrency_rules:
  - rule_id: case-update-stale-version
    parent_entity: Case
    write_endpoint: "PUT /cases/{id}"
    occ_field: expected_case_version
    description: |
      Updating a Case's strategy_notes / theory_of_case / assigned_attorney_id
      with an expected_case_version that no longer matches Case.version is
      rejected. A stale writer's view of the case predates another completed
      update (which itself legitimately succeeded and bumped version), so the
      stale update is refused even though no state precondition would reject it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-amend-stale-version
    parent_entity: TestingAuthorization
    write_endpoint: "POST /testing-authorizations/{id}/amendments"
    occ_field: expected_testing_authorization_version
    description: |
      Recording an amendment to an AGREEMENT's terms against a
      TestingAuthorization whose version has advanced since the client last
      observed it is rejected. The new amendment legitimately supersedes the
      prior terms, so a stale base must be refused rather than layered over
      terms the client never saw.
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_priority_score
    trigger: "IntakeRequest RECOMMEND transition — both variants are computed and stored on every RECOMMEND"
    algorithm: weighted_scoring
    formula: |
      factor maps (integers):
        claim_strength:      WEAK=25, MODERATE=55, STRONG=80, COMPELLING=95
        evidence_potential:  NONE_KNOWN=0, UNCERTAIN=35, LIKELY_STORED=65, CONFIRMED_STORED=95
        health_urgency:      NONE=0, MODERATE=45, CRITICAL=90
        f_years := min(years_served * 100 / 30, 100), rounded to 2 decimals HALF_UP
      weight profiles (each sums to exactly 1.000):
        STANDARD:  claim=0.425, evidence=0.275, time=0.185, urgency=0.115
        EXPEDITED: claim=0.260, evidence=0.240, time=0.155, urgency=0.345
      ROUNDING ORDER IS PINNED (mode b): round each weighted product to
      2 decimals HALF_UP FIRST, then sum the four rounded products; the sum is
      the score as-is (NO final re-round):
        score = round2(w_claim*f_claim) + round2(w_evid*f_evid)
              + round2(w_time*f_years) + round2(w_urg*f_urgency)
      Worked anchor (pins the rounding order — sum-then-round would give 66.54):
        STRONG, LIKELY_STORED, 7 years, CRITICAL, STANDARD:
        f_years = round2(23.3333...) = 23.33
        parts = [round2(0.425*80)=34.00, round2(0.275*65)=17.88,
                 round2(0.185*23.33)=4.32, round2(0.115*90)=10.35]
        score = 66.55
    input_set: "the IntakeRequest under RECOMMEND; all four factor inputs are request fields"
    constants:
      ROUND_MODE: HALF_UP
      ROUND_DECIMALS: 2
      YEARS_SATURATION: 30
    precision: "2 decimal places per weighted product, round_half_up; no final re-round"
    variants:
      - name: STANDARD
        when: "always computed; it is the waitlist_priority_score source when expedited_review == false"
        difference: "uses the STANDARD weight profile (claim-heavy: 0.425/0.275/0.185/0.115)"
      - name: EXPEDITED
        when: "always computed; it is the waitlist_priority_score source when expedited_review == true"
        difference: "uses the EXPEDITED weight profile (urgency-heavy: 0.260/0.240/0.155/0.345); identical inputs yield a different score (anchor: 66.55 STANDARD vs 71.07 EXPEDITED)"

  - name: compensation_award
    trigger: "CompensationClaim creation (PROVISIONAL variant, stored as provisional_estimate_cents); RECORD_DECISION=APPROVED (FINAL_VERIFIED variant, stored as final_award_cents)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (creation):
        base := FLAT_RATE_CENTS_PER_YEAR * years_incarcerated_claimed
        award := min(base, jurisdiction.compensation_cap_cents) when cap is not null else base
        (no enhancement, no fee reimbursement in the provisional estimate)
      FINAL_VERIFIED variant (approval) — EVALUATION ORDER IS PINNED:
        1. verified_years := floor( (Case.exoneration_date - IntakeRequest.conviction_date).days / 365 )
           (date path: Case.intake_request_id -> IntakeRequest.conviction_date; day count on UTC dates)
        2. tiered_base := TIER1_RATE_CENTS * min(verified_years, TIER1_YEARS)
                        + TIER2_RATE_CENTS * max(0, verified_years - TIER1_YEARS)
        3. enhancement: when Case.exculpatory_evidence_flag == true AND
           jurisdiction.actual_innocence_enhancement_pct > 0:
           tiered_base := floor(tiered_base * (1 + actual_innocence_enhancement_pct / 100))
        4. cap: award_before_fees := min(tiered_base, jurisdiction.compensation_cap_cents)
           when cap is not null, else tiered_base   [cap applied BEFORE fees]
        5. fees: award := award_before_fees + min(documented_legal_fees_cents, FEE_REIMBURSEMENT_CAP_CENTS)
           [fees added AFTER the cap — the cap never eats the fee reimbursement]
      Worked anchor (pin): conviction 2016-03-15, exoneration 2026-11-20 ->
        3902 days -> verified_years = 10; claimed 10 years; enhancement 10% and
        exculpatory_evidence_flag true; cap 100000000; fees 3000000.
        PROVISIONAL = 50000000.  FINAL_VERIFIED = min(62500000*1.10, cap) + min(fees, 2500000)
        = 68750000 + 2500000 = 71250000.
      Second anchor (cap bites before fees): cap 60000000 -> 60000000 + 2500000 = 62500000.
    input_set: "the CompensationClaim; its Case; the Case's IntakeRequest; the Jurisdiction reached via IntakeRequest.jurisdiction_id"
    constants:
      FLAT_RATE_CENTS_PER_YEAR: 5000000
      TIER1_YEARS: 5
      TIER1_RATE_CENTS: 5000000
      TIER2_RATE_CENTS: 7500000
      FEE_REIMBURSEMENT_CAP_CENTS: 2500000
      DAYS_PER_YEAR: 365
    precision: "integer cents; enhancement multiplication floored to integer cents"
    variants:
      - name: PROVISIONAL
        when: "at CompensationClaim creation"
        difference: "flat rate on claimant-DECLARED years; no enhancement; no fees; identical case data yields a different (lower) number than FINAL_VERIFIED"
      - name: FINAL_VERIFIED
        when: "at RECORD_DECISION=APPROVED"
        difference: "tiered marginal rates on SYSTEM-VERIFIED years (floor of days/365); exculpatory enhancement; cap before fees; fees after cap"

  - name: sample_ledger
    trigger: "LabAnalysis creation (debit), RECORD_RESULT (settle: refund under-consumption), CANCEL (full refund)"
    algorithm: chronological
    formula: |
      reservation (create): require remaining_sample_ng >= required_sample_ng
        AND remaining_sample_ng >= MIN_TESTABLE_NG (else ERR_INSUFFICIENT_SAMPLE);
        then remaining_sample_ng -= required_sample_ng; reserved_sample_ng := required_sample_ng
      settle (RECORD_RESULT): remaining_sample_ng += (reserved_sample_ng - actual_consumed_ng)
      refund (CANCEL from SCHEDULED): remaining_sample_ng += reserved_sample_ng
      CONSERVATION INVARIANT (pinned, over each EvidenceItem):
        initial_sample_ng == remaining_sample_ng
          + sum(reserved_sample_ng over LabAnalyses in {SCHEDULED, SAMPLE_SHIPPED})
          + sum(actual_consumed_ng over LabAnalyses in {RESULT_RECORDED, INTERPRETED})
    input_set: "all LabAnalyses of one EvidenceItem, filtered by the status sets in the invariant"
    constants:
      MIN_TESTABLE_NG: 5
    precision: "integer nanograms"

  - name: testing_status_derivation
    trigger: "any mutation of EvidenceItem.remaining_sample_ng; any sibling LabAnalysis status change; any linked TestingAuthorization becoming SIGNED or GRANTED"
    algorithm: constraint_propagation
    formula: |
      Evaluate top-down; first match wins:
        1. remaining_sample_ng < MIN_TESTABLE_NG           -> SAMPLE_EXHAUSTED
        2. any LabAnalysis in {SCHEDULED, SAMPLE_SHIPPED}  -> SAMPLE_RESERVED
        3. any LabAnalysis in {RESULT_RECORDED, INTERPRETED} -> TESTED
        4. any TestingAuthorization for this item in {SIGNED, GRANTED} -> TESTING_AUTHORIZED
        5. else                                            -> UNTESTED
    input_set: "one EvidenceItem; all LabAnalyses with evidence_item_id = item.id; all TestingAuthorizations with evidence_item_id = item.id"
    constants:
      MIN_TESTABLE_NG: 5
    precision: "n/a (enum derivation)"

  - name: contact_overdue_evaluation
    trigger: "POST /ops/contact-overdue-sweep (epoch checkpoint over every Case whose status != CLOSED)"
    algorithm: threshold
    formula: |
      interval_days(status): OPEN=90, INVESTIGATION=90, TESTING=60, LITIGATION=30, EXONERATED=14, CLOSED=null
      for each Case with status != CLOSED:
        days_since := floor((current_clock - last_contact_at) in whole days)
        contact_overdue := (days_since > interval_days(status))    [STRICTLY greater;
          exactly == interval is NOT overdue]
      Cases in CLOSED are skipped entirely (contact_overdue stays false).
      POST /cases/{id}/log-contact sets last_contact_at := current_clock,
      contact_count += 1, contact_overdue := false (immediate clear, no sweep needed).
    input_set: "all Cases with status IN {OPEN, INVESTIGATION, TESTING, LITIGATION, EXONERATED}"
    constants:
      INTERVAL_OPEN: 90
      INTERVAL_INVESTIGATION: 90
      INTERVAL_TESTING: 60
      INTERVAL_LITIGATION: 30
      INTERVAL_EXONERATED: 14
    precision: "whole days (floor of the UTC day difference)"

  - name: evidence_posture_derivation
    trigger: "EvidenceItem creation; any EvidenceItem location_status transition (explicit or cascaded); exculpatory_evidence_flag set"
    algorithm: aggregation
    formula: |
      Let items := all EvidenceItems of the Case; destroyed := items with
      location_status IN {REPORTED_DESTROYED, DESTRUCTION_VERIFIED};
      confirmed := items with location_status == CUSTODY_CONFIRMED.
      Evaluate top-down; first match wins:
        1. exculpatory_evidence_flag == true                 -> EXCULPATORY
        2. items empty                                       -> NO_EVIDENCE
        3. |confirmed| >= 1 AND |destroyed| == 0             -> SECURED
        4. |confirmed| >= 1 AND |destroyed| >= 1             -> PARTIALLY_COMPROMISED
        5. |confirmed| == 0 AND |destroyed| >= 1             -> FULLY_COMPROMISED
        6. else                                              -> SEEKING
    input_set: "all EvidenceItems of one Case; the Case's exculpatory_evidence_flag"
    precision: "n/a (enum derivation)"

  - name: provider_capacity_check
    trigger: "ReentryReferral creation"
    algorithm: aggregation
    formula: |
      overlapping_live := count of ReentryReferrals R with R.provider_id == provider.id,
        R.status IN {PENDING, ACTIVE}, and windows overlapping by STRICT pairwise test
        (R.service_start < new.service_end AND R.service_end > new.service_start)
        [half-open windows: new.service_start == R.service_end does NOT overlap]
      create allowed iff overlapping_live < provider.total_capacity
      (== total_capacity is full -> ERR_PROVIDER_CAPACITY_EXCEEDED)
      provider.slots_in_use := count of this provider's referrals in {PENDING, ACTIVE}
        (window-independent; written on create / COMPLETE / CANCEL)
    input_set: "all ReentryReferrals of one ReentryProvider in status PENDING or ACTIVE"
    precision: "integer count"

  - name: policy_pattern_count
    trigger: "stored field re-derived whenever a Case in the initiative's jurisdiction undergoes a mutation that changes pattern membership (evidence-destruction cascade, compensation-claim DENIED, db-comparison HIT, records-request DENIED); also derivable on read"
    algorithm: aggregation
    formula: |
      Cases considered: every Case whose intake_request_id -> IntakeRequest.jurisdiction_id
      == initiative.jurisdiction_id, ANY Case status (open or closed).
      Pattern per topic (count DISTINCT cases matching):
        EVIDENCE_PRESERVATION:  Case.destroyed_evidence_count >= 1
        COMPENSATION_REFORM:    Case has >= 1 CompensationClaim with status IN {DENIED, APPEALED}
        DATABASE_ACCESS:        Case has >= 1 descendant LabAnalysis with db_comparison_status == COMPLETED_HIT
        RECORDS_TRANSPARENCY:   Case has >= 1 RecordsRequest with status == DENIED
      Gate: SUBMIT_DRAFT requires pattern_case_count >= POLICY_PATTERN_THRESHOLD (>= inclusive).
    input_set: "all Cases joined through IntakeRequest on jurisdiction_id; per-topic child collections"
    constants:
      POLICY_PATTERN_THRESHOLD: 3
    precision: "integer count"

  - name: waitlist_selection
    trigger: "POST /intake-requests/activate-waitlist-next"
    algorithm: selector
    formula: |
      eligibility: IntakeRequest.status == WAITLISTED
      ranking: waitlist_priority_score DESC
      tie-break: created_at ASC (ISO 8601 string order on equal timestamps is
        impossible in practice; created_at has 3-fractional-digit precision)
      fallback: empty candidate set -> ERR_WAITLIST_EMPTY (409), no state change
      The selected request transitions WAITLISTED -> SCREENING.
      NOTE: id MUST NOT participate in ranking or tie-break.
    input_set: "all IntakeRequests with status == WAITLISTED"
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# single request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty; X-User-Role must be one of the declared role names"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right; then request-body ids (client_id, jurisdiction_id, case_id, evidence_item_id, authorization_id, provider_id) must exist, in payload field order"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CLIENT_NOT_FOUND, ERR_INTAKE_REQUEST_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_EVIDENCE_ITEM_NOT_FOUND, ERR_RECORDS_REQUEST_NOT_FOUND, ERR_TESTING_AUTHORIZATION_NOT_FOUND, ERR_LAB_ANALYSIS_NOT_FOUND, ERR_LEGAL_PETITION_NOT_FOUND, ERR_COMPENSATION_CLAIM_NOT_FOUND, ERR_REENTRY_PROVIDER_NOT_FOUND, ERR_REENTRY_REFERRAL_NOT_FOUND, ERR_POLICY_INITIATIVE_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"
  - priority: 3.4
    category: auth
    check: "Ownership: when X-User-Role is Client, the target resource must belong to X-User-ID — Client.id == X-User-ID for /clients/{id}; IntakeRequest.client_id == X-User-ID for /intake-requests/{id} and submit-supplement; Case.intake_request_id -> IntakeRequest.client_id == X-User-ID for /cases/{id}"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Client-role requests on owned resources"
  - priority: 3.6
    category: business_concurrency
    check: "OCC: expected_case_version must equal Case.version on PUT /cases/{id}; expected_testing_authorization_version must equal TestingAuthorization.version on POST /testing-authorizations/{id}/amendments"
    error_id: "ERR_STALE_VERSION / ERR_STALE_AUTHORIZATION_VERSION"
    http_status: 412
    applies_to: "PUT /cases/{id}; POST /testing-authorizations/{id}/amendments"
    note: "Evaluated BEFORE any business logic, after existence/ownership"
  - priority: 3.8
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum values in vocabulary, integer floors respected (initial_sample_ng >= 1, required_sample_ng >= 1, years_incarcerated_claimed >= 1, total_capacity >= 1, years_served >= 0, documented_legal_fees_cents >= 0), unknown fields rejected, scheduled_end strictly after scheduled_start, service_end strictly after service_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3.9
    category: business_constraint
    check: "advance-style endpoints: payload.event must be in the endpoint's declared event vocabulary"
    error_id: ERR_INVALID_TRANSITION_EVENT
    http_status: 400
    applies_to: "all */advance endpoints"
  - priority: 4
    category: state
    check: "From-state precondition of the requested transition on the target resource (including kind-conditional legality on TestingAuthorization: AGREEMENT events on a MOTION and vice versa)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all advance / decide / submit-supplement endpoints"
  - priority: 4.5
    category: state
    check: "Cross-entity state gates: petition create requires Case.status == LITIGATION; compensation-claim create / reentry-referral create / UPDATE_RELEASE_CHECKLIST / EXECUTE_RELEASE require Case.status == EXONERATED; TestingAuthorization create requires Case.status IN {INVESTIGATION, TESTING}; LabAnalysis create requires Case.status == TESTING (via evidence_item_id -> Case); TestingAuthorization create requires EvidenceItem.location_status == CUSTODY_CONFIRMED; BEGIN_TESTING requires >= 1 CUSTODY_CONFIRMED EvidenceItem; BEGIN_LITIGATION requires >= 1 RESULT_RECORDED/INTERPRETED LabAnalysis"
    error_id: "ERR_CASE_NOT_IN_LITIGATION / ERR_CASE_NOT_EXONERATED / ERR_CASE_NOT_READY_FOR_TESTING_AUTH / ERR_CASE_NOT_IN_TESTING / ERR_EVIDENCE_NOT_IN_CUSTODY / ERR_NO_PRESERVED_EVIDENCE / ERR_NO_TEST_RESULTS"
    http_status: 409
    applies_to: "petition create; compensation-claim create; referral create; case advance; testing-authorization create; lab-analysis create"
    note: "ERR_EVIDENCE_NOT_IN_CUSTODY carries http 422; the others 409 — the http code is pinned per error_id in §1.6, the priority here governs ordering only"
  - priority: 5
    category: business_safety
    check: "Segregation of duties on decide: X-User-ID must differ from IntakeRequest.recommended_by_user_id"
    error_id: ERR_DECISION_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /intake-requests/{id}/decide"
  - priority: 6
    category: business_referential
    check: "Referenced-entity validity: LabAnalysis.authorization_id must reference a TestingAuthorization whose status is SIGNED or GRANTED"
    error_id: ERR_AUTHORIZATION_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /lab-analyses"
  - priority: 7
    category: business_temporal
    check: "Temporal gates: petition FILE deadline (clock <= conviction_date + deadline years, equality timely); lab-window overlap on same lab_name (strict pairwise overlap on half-open windows); EXECUTE_RELEASE clock >= scheduled_release_date; referral ACTIVATE clock >= service_start"
    error_id: "ERR_FILING_DEADLINE_EXCEEDED / ERR_LAB_SCHEDULE_OVERLAP / ERR_RELEASE_DATE_NOT_REACHED / ERR_SERVICE_WINDOW_NOT_STARTED"
    http_status: 422
    applies_to: "petition advance FILE; lab-analysis create; case advance EXECUTE_RELEASE; referral advance ACTIVATE"
    note: "ERR_FILING_DEADLINE_EXCEEDED carries http 422; the other three carry 409 per §1.6"
  - priority: 8
    category: business_constraint
    check: "Domain constraints, in this sub-order: (a) jurisdictional statute flags (MOTION requires has_post_conviction_dna_statute; CLEMENCY requires clemency_available; claim create requires compensation_statute_exists; claim_basis ACTUAL_INNOCENCE|BOTH requires Case.exculpatory_evidence_flag); (b) screening criteria on RECOMMEND=ACCEPT; (c) sample sufficiency and consumption bounds; (d) provider capacity; (e) pattern threshold on SUBMIT_DRAFT; (f) aggregate close gates (open petitions, active analyses); (g) misc (waitlist non-empty, clemency appealability, duplicate state_code, payment amount equality)"
    error_id: "ERR_JURISDICTION_NO_TESTING_STATUTE / ERR_CLEMENCY_NOT_AVAILABLE / ERR_NO_COMPENSATION_STATUTE / ERR_NO_EXCULPATORY_BASIS / ERR_SCREENING_CRITERIA_NOT_MET / ERR_INSUFFICIENT_SAMPLE / ERR_CONSUMED_EXCEEDS_RESERVED / ERR_PROVIDER_CAPACITY_EXCEEDED / ERR_INSUFFICIENT_PATTERN_EVIDENCE / ERR_OPEN_PETITIONS_EXIST / ERR_ACTIVE_LAB_ANALYSES_EXIST / ERR_WAITLIST_EMPTY / ERR_NOT_APPEALABLE / ERR_DUPLICATE_STATE_CODE / ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 422
    applies_to: "per-error applies_to is pinned in §1.6"
    note: "http codes per error_id in §1.6 (422 vs 409 vary); priority ordering is governed here"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Staff-role shorthand used below in `roles:` is expanded explicitly per
# endpoint (no wildcards). GET list endpoints accept the §1.0 pagination
# fields as query parameters in addition to the filter inputs listed.
endpoints:
  # --- logical clock (test-driving; outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. MANDATORY DEFAULT: before any set_current_utc call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All timestamps the server writes (last_contact_at, filed_at, exoneration_date, ...) read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := payload.to_iso8601; no entity mutates"]

  # --- ops checkpoint ---
  - method: POST
    path: "/ops/contact-overdue-sweep"
    description: "Ops-run checkpoint: re-evaluate contact_overdue for every Case with status != CLOSED per calculations.contact_overdue_evaluation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { swept_case_count: integer, newly_overdue_count: integer, newly_overdue_case_ids: array }
    side_effects: ["contact_overdue := (days_since_last_contact > contact_interval_days) per case; version += 1 on each case whose flag changes"]

  # --- Jurisdictions ---
  - method: POST
    path: "/jurisdictions"
    description: "Register a jurisdiction (statutory feature flags)"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, name, has_post_conviction_dna_statute, clemency_available, compensation_statute_exists, "post_conviction_deadline_years?", "compensation_cap_cents?", "actual_innocence_enhancement_pct?"]
    output: Jurisdiction
    side_effects: ["duplicate state_code -> ERR_DUPLICATE_STATE_CODE"]
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read one jurisdiction"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector, Client]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}/policy-initiatives"
    description: "List policy initiatives of a jurisdiction (FK reverse-reachability for PolicyInitiative.jurisdiction_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: "PolicyInitiative[]"
    side_effects: []

  # --- Clients ---
  - method: POST
    path: "/clients"
    description: "Register an incarcerated person requesting assistance"
    roles: [IntakeSpecialist]
    code: 201
    input: [full_name, inmate_number, "facility_name?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Read one client; Client role may read only its own record"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- Intake requests ---
  - method: POST
    path: "/intake-requests"
    description: "Create an intake request; a Client may only create for itself (client_id == X-User-ID)"
    roles: [IntakeSpecialist, Client]
    code: 201
    input: [client_id, jurisdiction_id, conviction_date, conviction_summary, claim_of_actual_innocence, claim_strength, evidence_potential, years_served, health_urgency, "expedited_review?"]
    output: IntakeRequest
    side_effects: ["status := RECEIVED"]
  - method: GET
    path: "/intake-requests"
    description: "List intake requests with filters (FK reverse-reachability for IntakeRequest.client_id and IntakeRequest.jurisdiction_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?", "client_id?", "jurisdiction_id?", "limit?", "offset?"]
    output: "IntakeRequest[]"
    side_effects: []
  - method: GET
    path: "/intake-requests/{id}"
    description: "Read one intake request; Client role only when it owns the request"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector, Client]
    code: 200
    input: []
    output: IntakeRequest
    side_effects: []
  - method: POST
    path: "/intake-requests/{id}/advance"
    description: "Screening transitions: BEGIN_SCREENING | REQUEST_MORE_INFO | RECOMMEND"
    roles: [IntakeSpecialist]
    code: 200
    input: [event, "recommendation?"]
    output: IntakeRequest
    side_effects: ["per IntakeRequest state machine; RECOMMEND computes both screening score variants and records recommended_by_user_id := X-User-ID"]
  - method: POST
    path: "/intake-requests/{id}/submit-supplement"
    description: "Supply requested supplemental information (MORE_INFO_REQUESTED -> SCREENING)"
    roles: [Client, IntakeSpecialist]
    code: 200
    input: [supplement_notes]
    output: IntakeRequest
    side_effects: ["supplement_notes := payload.supplement_notes; status := SCREENING"]
  - method: POST
    path: "/intake-requests/{id}/decide"
    description: "Managing-attorney decision with segregation of duties; ACCEPTED creates the Case"
    roles: [ManagingAttorney]
    code: 200
    input: [decision, "assigned_attorney_id?", "rejection_reason?"]
    output: IntakeRequest
    side_effects: ["per IntakeRequest state machine (decision branch); ACCEPTED creates Case and sets accepted_case_id"]
  - method: POST
    path: "/intake-requests/activate-waitlist-next"
    description: "Selector: activate the highest-priority WAITLISTED request back into SCREENING per calculations.waitlist_selection"
    roles: [ManagingAttorney]
    code: 200
    input: []
    output: IntakeRequest
    side_effects: ["selected request: status := SCREENING"]
  - method: GET
    path: "/intake-requests/{id}/cases"
    description: "List the Case created from this intake request (0 or 1 element; FK reverse-reachability for Case.intake_request_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: "Case[]"
    side_effects: []

  # --- Cases ---
  - method: GET
    path: "/cases/{id}"
    description: "Read one case; Client role only for its own case (via Case.intake_request_id -> IntakeRequest.client_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector, Client]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: PUT
    path: "/cases/{id}"
    description: "Update case strategy fields under OCC (concurrency rule case-update-stale-version)"
    roles: [StaffAttorney]
    code: 200
    input: [expected_case_version, "strategy_notes?", "theory_of_case?", "assigned_attorney_id?"]
    output: Case
    side_effects: ["apply provided fields; Case.version += 1; updated_at refreshed"]
  - method: POST
    path: "/cases/{id}/advance"
    description: "Case lifecycle: BEGIN_INVESTIGATION | BEGIN_TESTING | BEGIN_LITIGATION | UPDATE_RELEASE_CHECKLIST | EXECUTE_RELEASE | CLOSE"
    roles: [StaffAttorney, ManagingAttorney]
    code: 200
    input: [event, "resolution?", "housing_arranged?", "id_documents_ready?", "transportation_arranged?", "scheduled_release_date?"]
    output: Case
    side_effects: ["per Case state machine, incl. release_readiness re-derivation and close gates"]
  - method: POST
    path: "/cases/{id}/log-contact"
    description: "Log a client-communication event at the current logical clock (expectation management)"
    roles: [ClientServicesAdvocate]
    code: 200
    input: [channel, expectation_setting, "summary?"]
    output: Case
    side_effects: ["last_contact_at := current clock; contact_count += 1; contact_overdue := false; last_expectation_setting := payload.expectation_setting"]
  - method: GET
    path: "/cases/{id}/evidence-items"
    description: "List evidence items of a case (FK reverse-reachability for EvidenceItem.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["location_status?", "testing_status?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}/records-requests"
    description: "List records requests of a case (FK reverse-reachability for RecordsRequest.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?"]
    output: "RecordsRequest[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}/testing-authorizations"
    description: "List testing authorizations of a case (FK reverse-reachability for TestingAuthorization.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["kind?", "status?"]
    output: "TestingAuthorization[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}/legal-petitions"
    description: "List legal petitions of a case (FK reverse-reachability for LegalPetition.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?", "petition_type?"]
    output: "LegalPetition[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}/compensation-claims"
    description: "List compensation claims of a case (FK reverse-reachability for CompensationClaim.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?"]
    output: "CompensationClaim[]"
    side_effects: []
  - method: GET
    path: "/cases/{id}/reentry-referrals"
    description: "List reentry referrals of a case (FK reverse-reachability for ReentryReferral.case_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?", "provider_id?"]
    output: "ReentryReferral[]"
    side_effects: []

  # --- Evidence items ---
  - method: POST
    path: "/evidence-items"
    description: "Register a physical evidence item on a case"
    roles: [EvidenceAnalyst]
    code: 201
    input: [case_id, description, evidence_type, custodian_type, initial_sample_ng]
    output: EvidenceItem
    side_effects: ["location_status := IDENTIFIED; remaining_sample_ng := initial_sample_ng; Case.evidence_posture re-derived (NO_EVIDENCE -> SEEKING)"]
  - method: GET
    path: "/evidence-items/{id}"
    description: "Read one evidence item"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: POST
    path: "/evidence-items/{id}/advance"
    description: "Location-dimension transitions: START_SEARCH | MARK_LOCATED | MARK_MISSING | CONFIRM_CUSTODY | VERIFY_DESTRUCTION"
    roles: [EvidenceAnalyst]
    code: 200
    input: [event]
    output: EvidenceItem
    side_effects: ["per EvidenceItem state machine; Case.evidence_posture re-derived on location change"]
  - method: GET
    path: "/evidence-items/{id}/testing-authorizations"
    description: "List testing authorizations for an evidence item (FK reverse-reachability for TestingAuthorization.evidence_item_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: "TestingAuthorization[]"
    side_effects: []
  - method: GET
    path: "/evidence-items/{id}/lab-analyses"
    description: "List lab analyses for an evidence item (FK reverse-reachability for LabAnalysis.evidence_item_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: "LabAnalysis[]"
    side_effects: []

  # --- Records requests ---
  - method: POST
    path: "/records-requests"
    description: "Open a records request to a court / police / laboratory / medical-examiner agency"
    roles: [EvidenceAnalyst]
    code: 201
    input: [case_id, agency_type, agency_name, request_summary]
    output: RecordsRequest
    side_effects: ["status := DRAFT"]
  - method: POST
    path: "/records-requests/{id}/advance"
    description: "Records lifecycle: SUBMIT | RECORD_RESPONSE (disposition + items_revealed) | APPEAL"
    roles: [EvidenceAnalyst]
    code: 200
    input: [event, "disposition?", "items_revealed?"]
    output: RecordsRequest
    side_effects: ["per RecordsRequest state machine, incl. per-item EvidenceItem location cascades and the Case -> PolicyInitiative chain"]

  # --- Testing authorizations (agreement + motion) ---
  - method: POST
    path: "/testing-authorizations"
    description: "Create a testing agreement (prosecutor consent path) or testing motion (contested court path) for a preserved evidence item"
    roles: [StaffAttorney]
    code: 201
    input: [case_id, evidence_item_id, kind, "terms?", "proposed_test_types?"]
    output: TestingAuthorization
    side_effects: ["status := DRAFTED; created_by_user_id := X-User-ID"]
  - method: GET
    path: "/testing-authorizations/{id}"
    description: "Read one testing authorization (OCC version source for amendments)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: TestingAuthorization
    side_effects: []
  - method: POST
    path: "/testing-authorizations/{id}/advance"
    description: "Kind-conditional lifecycle. AGREEMENT events: PROPOSE | COUNTER | SIGN | REJECT. MOTION events: FILE | RECORD_RULING (ruling=GRANTED|DENIED) | APPEAL"
    roles: [StaffAttorney]
    code: 200
    input: [event, "ruling?"]
    output: TestingAuthorization
    side_effects: ["per TestingAuthorization state machine; SIGNED/GRANTED re-derives the evidence item's testing_status"]
  - method: POST
    path: "/testing-authorizations/{id}/amendments"
    description: "Amend agreement terms under OCC (concurrency rule agreement-amend-stale-version); AGREEMENT kind only"
    roles: [StaffAttorney]
    code: 200
    input: [expected_testing_authorization_version, "terms?", "proposed_test_types?"]
    output: TestingAuthorization
    side_effects: ["apply provided fields; TestingAuthorization.version += 1; updated_at refreshed"]
  - method: GET
    path: "/testing-authorizations/{id}/lab-analyses"
    description: "List lab analyses authorized by this testing authorization (FK reverse-reachability for LabAnalysis.authorization_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: "LabAnalysis[]"
    side_effects: []

  # --- Lab analyses ---
  - method: POST
    path: "/lab-analyses"
    description: "Schedule a lab analysis: reserves sample mass and occupies a half-open lab bench window"
    roles: [StaffAttorney]
    code: 201
    input: [evidence_item_id, authorization_id, lab_name, test_type, required_sample_ng, scheduled_start, scheduled_end]
    output: LabAnalysis
    side_effects:
      - "status := SCHEDULED; reserved_sample_ng := required_sample_ng"
      - "EvidenceItem.remaining_sample_ng -= required_sample_ng (sample_ledger reservation)"
      - "EvidenceItem.testing_status re-derived -> SAMPLE_RESERVED"
      - "Case.status must be TESTING (ERR_CASE_NOT_IN_TESTING)"
  - method: POST
    path: "/lab-analyses/{id}/advance"
    description: "Lab lifecycle: SHIP_SAMPLE | RECORD_RESULT (outcome, actual_consumed_ng, profile_obtained) | RECORD_EXPERT_INTERPRETATION (expert_name, expert_interpretation) | RUN_DATABASE_COMPARISON (database_name, comparison_result, matched_subject_name) | CANCEL"
    roles: [StaffAttorney, EvidenceAnalyst]
    code: 200
    input: [event, "outcome?", "actual_consumed_ng?", "profile_obtained?", "expert_name?", "expert_interpretation?", "database_name?", "comparison_result?", "matched_subject_name?"]
    output: LabAnalysis
    side_effects: ["per LabAnalysis state machine, incl. sample settle/refund and the HIT -> Case exculpatory cascade"]

  # --- Legal petitions ---
  - method: POST
    path: "/legal-petitions"
    description: "Draft a legal petition (post-conviction, direct appeal, clemency, habeas) for a case in LITIGATION"
    roles: [StaffAttorney]
    code: 201
    input: [case_id, petition_type, court_name, claim_basis]
    output: LegalPetition
    side_effects: ["status := DRAFT"]
  - method: POST
    path: "/legal-petitions/{id}/advance"
    description: "Petition lifecycle: FILE | RECORD_DECISION (decision=GRANTED|DENIED, vacates_conviction) | APPEAL"
    roles: [StaffAttorney]
    code: 200
    input: [event, "decision?", "vacates_conviction?"]
    output: LegalPetition
    side_effects: ["per LegalPetition state machine; GRANTED + vacates_conviction cascades Case -> EXONERATED"]

  # --- Compensation claims ---
  - method: POST
    path: "/compensation-claims"
    description: "Open a statutory compensation claim for an EXONERATED case; freezes the PROVISIONAL estimate"
    roles: [StaffAttorney]
    code: 201
    input: [case_id, years_incarcerated_claimed, "documented_legal_fees_cents?"]
    output: CompensationClaim
    side_effects: ["status := DRAFT; provisional_estimate_cents := calculations.compensation_award(PROVISIONAL)"]
  - method: POST
    path: "/compensation-claims/{id}/advance"
    description: "Claim lifecycle: FILE | RECORD_DECISION (decision=APPROVED|DENIED) | APPEAL | RECORD_PAYMENT (paid_amount_cents)"
    roles: [StaffAttorney]
    code: 200
    input: [event, "decision?", "paid_amount_cents?"]
    output: CompensationClaim
    side_effects: ["per CompensationClaim state machine; APPROVED computes final_award_cents (FINAL_VERIFIED); DENIED re-derives COMPENSATION_REFORM pattern counts"]

  # --- Reentry providers & referrals ---
  - method: POST
    path: "/reentry-providers"
    description: "Register a reentry service provider with a fixed concurrent-service capacity"
    roles: [ClientServicesAdvocate]
    code: 201
    input: [name, service_type, total_capacity]
    output: ReentryProvider
    side_effects: ["slots_in_use := 0"]
  - method: GET
    path: "/reentry-providers/{id}"
    description: "Read one reentry provider"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: []
    output: ReentryProvider
    side_effects: []
  - method: GET
    path: "/reentry-providers/{id}/reentry-referrals"
    description: "List referrals held by a provider (FK reverse-reachability for ReentryReferral.provider_id)"
    roles: [PlatformAdmin, IntakeSpecialist, ManagingAttorney, StaffAttorney, EvidenceAnalyst, ClientServicesAdvocate, PolicyDirector]
    code: 200
    input: ["status?"]
    output: "ReentryReferral[]"
    side_effects: []
  - method: POST
    path: "/reentry-referrals"
    description: "Refer an exonerated client to a provider for a half-open service window; aggregate capacity enforced"
    roles: [ClientServicesAdvocate]
    code: 201
    input: [case_id, provider_id, service_start, service_end]
    output: ReentryReferral
    side_effects: ["status := PENDING; ReentryProvider.slots_in_use += 1 (provider version += 1)"]
  - method: POST
    path: "/reentry-referrals/{id}/advance"
    description: "Referral lifecycle: ACTIVATE | COMPLETE | CANCEL"
    roles: [ClientServicesAdvocate]
    code: 200
    input: [event]
    output: ReentryReferral
    side_effects: ["per ReentryReferral state machine; COMPLETE/CANCEL release the provider slot"]

  # --- Policy initiatives ---
  - method: POST
    path: "/policy-initiatives"
    description: "Open a policy-reform initiative informed by case patterns in a jurisdiction"
    roles: [PolicyDirector]
    code: 201
    input: [jurisdiction_id, topic, title]
    output: PolicyInitiative
    side_effects: ["status := PROPOSED; pattern_case_count := calculations.policy_pattern_count (initial derivation)"]
  - method: POST
    path: "/policy-initiatives/{id}/advance"
    description: "Initiative lifecycle: BEGIN_RESEARCH | SUBMIT_DRAFT | ADOPT | STALL | RESUME"
    roles: [PolicyDirector]
    code: 200
    input: [event]
    output: PolicyInitiative
    side_effects: ["per PolicyInitiative state machine; SUBMIT_DRAFT enforces pattern_case_count >= POLICY_PATTERN_THRESHOLD"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth & identity ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or an undeclared role name" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "The X-User-Role is not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Client-role caller does not own the addressed resource (Client.id / IntakeRequest.client_id / Case's intake client != X-User-ID)" }
  # --- existence (one per addressable entity) ---
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "Referenced jurisdiction id does not exist" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Referenced client id does not exist" }
  - { id: ERR_INTAKE_REQUEST_NOT_FOUND, http: 404, condition: "Referenced intake request id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Referenced case id does not exist" }
  - { id: ERR_EVIDENCE_ITEM_NOT_FOUND, http: 404, condition: "Referenced evidence item id does not exist" }
  - { id: ERR_RECORDS_REQUEST_NOT_FOUND, http: 404, condition: "Referenced records request id does not exist" }
  - { id: ERR_TESTING_AUTHORIZATION_NOT_FOUND, http: 404, condition: "Referenced testing authorization id does not exist" }
  - { id: ERR_LAB_ANALYSIS_NOT_FOUND, http: 404, condition: "Referenced lab analysis id does not exist" }
  - { id: ERR_LEGAL_PETITION_NOT_FOUND, http: 404, condition: "Referenced legal petition id does not exist" }
  - { id: ERR_COMPENSATION_CLAIM_NOT_FOUND, http: 404, condition: "Referenced compensation claim id does not exist" }
  - { id: ERR_REENTRY_PROVIDER_NOT_FOUND, http: 404, condition: "Referenced reentry provider id does not exist" }
  - { id: ERR_REENTRY_REFERRAL_NOT_FOUND, http: 404, condition: "Referenced reentry referral id does not exist" }
  - { id: ERR_POLICY_INITIATIVE_NOT_FOUND, http: 404, condition: "Referenced policy initiative id does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum outside vocabulary, unknown field, numeric floor violated, end-before-start window, or structurally illegal payload combination (e.g. DENIED ruling carrying vacates_conviction=true; DENIED records disposition carrying items_revealed; matched_subject_name without HIT)" }
  - { id: ERR_INVALID_TRANSITION_EVENT, http: 400, condition: "advance payload.event is outside the endpoint's declared event vocabulary" }
  # --- concurrency (OCC) ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version != current Case.version on PUT /cases/{id}" }
  - { id: ERR_STALE_AUTHORIZATION_VERSION, http: 412, condition: "expected_testing_authorization_version != current TestingAuthorization.version on POST /testing-authorizations/{id}/amendments" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource's current status does not admit the requested transition/event (covers from-state violations, kind-conditional event legality, terminal-state lockdown, and amendment on kind=MOTION or status not in {DRAFTED, PROPOSED, NEGOTIATING})" }
  - { id: ERR_CASE_NOT_IN_LITIGATION, http: 409, condition: "LegalPetition create or FILE requires the case to be in LITIGATION" }
  - { id: ERR_CASE_NOT_EXONERATED, http: 409, condition: "Compensation-claim create, reentry-referral create, UPDATE_RELEASE_CHECKLIST and EXECUTE_RELEASE require Case.status == EXONERATED" }
  - { id: ERR_CASE_NOT_READY_FOR_TESTING_AUTH, http: 409, condition: "TestingAuthorization create requires Case.status IN {INVESTIGATION, TESTING}" }
  - { id: ERR_CASE_NOT_IN_TESTING, http: 409, condition: "LabAnalysis create requires the owning Case.status == TESTING" }
  - { id: ERR_NO_PRESERVED_EVIDENCE, http: 409, condition: "BEGIN_TESTING requires at least one CUSTODY_CONFIRMED evidence item" }
  - { id: ERR_NO_TEST_RESULTS, http: 409, condition: "BEGIN_LITIGATION requires at least one LabAnalysis in RESULT_RECORDED or INTERPRETED" }
  - { id: ERR_OPEN_PETITIONS_EXIST, http: 409, condition: "CLOSE blocked: a LegalPetition of the case is in DRAFT, FILED or APPEAL_FILED" }
  - { id: ERR_ACTIVE_LAB_ANALYSES_EXIST, http: 409, condition: "CLOSE blocked: a LabAnalysis on a case evidence item is in SCHEDULED or SAMPLE_SHIPPED" }
  - { id: ERR_WAITLIST_EMPTY, http: 409, condition: "activate-waitlist-next found no WAITLISTED intake request" }
  - { id: ERR_NOT_APPEALABLE, http: 409, condition: "APPEAL on a CLEMENCY petition (clemency denials are unappealable)" }
  - { id: ERR_RELEASE_NOT_READY, http: 409, condition: "EXECUTE_RELEASE requires release_readiness == READY" }
  - { id: ERR_RELEASE_DATE_NOT_REACHED, http: 409, condition: "EXECUTE_RELEASE before scheduled_release_date (clock < scheduled_release_date)" }
  - { id: ERR_SERVICE_WINDOW_NOT_STARTED, http: 409, condition: "Referral ACTIVATE before service_start" }
  - { id: ERR_LAB_SCHEDULE_OVERLAP, http: 409, condition: "Another non-CANCELLED LabAnalysis for the same lab_name has a strictly overlapping half-open window" }
  - { id: ERR_PROVIDER_CAPACITY_EXCEEDED, http: 409, condition: "Referral create would make the count of overlapping live referrals equal or exceed the provider's total_capacity" }
  - { id: ERR_INSUFFICIENT_PATTERN_EVIDENCE, http: 409, condition: "SUBMIT_DRAFT requires pattern_case_count >= 3" }
  # --- business (referential / fiscal / criteria) ---
  - { id: ERR_DECISION_SELF_APPROVAL, http: 403, condition: "decide caller's X-User-ID equals IntakeRequest.recommended_by_user_id (segregation of duties)" }
  - { id: ERR_SCREENING_CRITERIA_NOT_MET, http: 422, condition: "RECOMMEND with recommendation=ACCEPT requires claim_of_actual_innocence == true and evidence_potential IN {LIKELY_STORED, CONFIRMED_STORED}" }
  - { id: ERR_EVIDENCE_NOT_IN_CUSTODY, http: 422, condition: "TestingAuthorization create requires EvidenceItem.location_status == CUSTODY_CONFIRMED" }
  - { id: ERR_AUTHORIZATION_NOT_EFFECTIVE, http: 422, condition: "LabAnalysis authorization_id references a TestingAuthorization not in status SIGNED or GRANTED" }
  - { id: ERR_INSUFFICIENT_SAMPLE, http: 422, condition: "LabAnalysis create: remaining_sample_ng < required_sample_ng OR remaining_sample_ng < MIN_TESTABLE_NG (5)" }
  - { id: ERR_CONSUMED_EXCEEDS_RESERVED, http: 422, condition: "RECORD_RESULT actual_consumed_ng is below 1 or exceeds reserved_sample_ng" }
  - { id: ERR_FILING_DEADLINE_EXCEEDED, http: 422, condition: "POST_CONVICTION petition FILE after conviction_date + jurisdiction.post_conviction_deadline_years (strictly later than the anniversary; equality is timely)" }
  - { id: ERR_CLEMENCY_NOT_AVAILABLE, http: 422, condition: "petition_type=CLEMENCY in a jurisdiction with clemency_available == false" }
  - { id: ERR_JURISDICTION_NO_TESTING_STATUTE, http: 422, condition: "TestingAuthorization kind=MOTION in a jurisdiction with has_post_conviction_dna_statute == false" }
  - { id: ERR_NO_EXCULPATORY_BASIS, http: 422, condition: "claim_basis ACTUAL_INNOCENCE or BOTH while Case.exculpatory_evidence_flag is false" }
  - { id: ERR_NO_COMPENSATION_STATUTE, http: 422, condition: "CompensationClaim create in a jurisdiction with compensation_statute_exists == false" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "RECORD_PAYMENT paid_amount_cents != final_award_cents" }
  - { id: ERR_DUPLICATE_STATE_CODE, http: 409, condition: "Jurisdiction create with a state_code that already exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations administrator: logical clock, contact-overdue sweep, jurisdiction registry"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ops/contact-overdue-sweep"
      - "POST /jurisdictions"
    shared_operations:
      - "all GET endpoints"

  - name: IntakeSpecialist
    description: "Screens requests for assistance; registers clients; drives intake screening transitions"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /intake-requests/{id}/advance (BEGIN_SCREENING | REQUEST_MORE_INFO | RECOMMEND)"
    shared_operations:
      - "POST /intake-requests (create on behalf of a client; shared with Client self-submission)"
      - "POST /intake-requests/{id}/submit-supplement (shared with the owning Client)"
      - "all GET endpoints"

  - name: ManagingAttorney
    description: "Decides intake outcomes (segregated from the recommending screener); manages the waitlist; may advance cases"
    identity: opaque
    exclusive_operations:
      - "POST /intake-requests/{id}/decide"
      - "POST /intake-requests/activate-waitlist-next"
    shared_operations:
      - "POST /cases/{id}/advance (shared with StaffAttorney)"
      - "all GET endpoints"

  - name: StaffAttorney
    description: "Litigates: case strategy, testing authorizations, lab analyses, petitions, compensation claims"
    identity: opaque
    exclusive_operations:
      - "PUT /cases/{id}"
      - "POST /testing-authorizations and their advance/amendments"
      - "POST /legal-petitions and their advance"
      - "POST /compensation-claims and their advance"
    shared_operations:
      - "POST /cases/{id}/advance (shared with ManagingAttorney)"
      - "POST /lab-analyses/{id}/advance (shared with EvidenceAnalyst)"
      - "all GET endpoints"

  - name: EvidenceAnalyst
    description: "Locates and preserves evidence; runs records requests; ships samples and records lab results"
    identity: opaque
    exclusive_operations:
      - "POST /evidence-items and /evidence-items/{id}/advance"
      - "POST /records-requests and /records-requests/{id}/advance"
    shared_operations:
      - "POST /lab-analyses/{id}/advance (shared with StaffAttorney)"
      - "all GET endpoints"

  - name: ClientServicesAdvocate
    description: "Client communication over multi-year timelines; release logistics support; reentry referrals"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/log-contact"
      - "POST /reentry-providers"
      - "POST /reentry-referrals and /reentry-referrals/{id}/advance"
    shared_operations:
      - "all GET endpoints"

  - name: PolicyDirector
    description: "Policy reform work informed by aggregated case patterns"
    identity: opaque
    exclusive_operations:
      - "POST /policy-initiatives and /policy-initiatives/{id}/advance"
    shared_operations:
      - "all GET endpoints"

  - name: Client
    description: "The incarcerated requester; self-submits and supplements its own intake request; reads its own records"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /intake-requests (self-submission only: payload client_id must equal X-User-ID, else ERR_OWNERSHIP_MISMATCH)"
      - "POST /intake-requests/{id}/submit-supplement (own requests only)"
      - "GET /clients/{id}, GET /intake-requests/{id}, GET /cases/{id} (own records only)"
      - "GET /jurisdictions/{id}"
