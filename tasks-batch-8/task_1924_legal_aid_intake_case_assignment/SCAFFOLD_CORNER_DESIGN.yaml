            - { call: "POST /clients", payload: { full_name: "Cli W", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { cl_w: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${cl_w}", case_type: "CONSUMER_DEBT", opposing_party_name: "Other Collector", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_w: "$.data.id" } }
            - { call: "POST /intake-applications/${app_w}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_w}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_w}/enqueue-waitlist", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramDirector }
          trigger:
            - { call: "POST /ops/run-daily-sweep", payload: {}, as: ProgramDirector, captures: { closed_n: "$.data.auto_closed_cases", promoted_n: "$.data.promoted_applications" } }
            - { call: "GET /intake-applications/${app_w}", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { w_status: "$.data.status", w_promoted: "$.data.promoted_from_waitlist" } }
            - { call: "GET /staff-members/${att_id}/caseload", payload: {}, as: ProgramDirector, captures: { att_load: "$.data.weighted_open_units" } }
          assert:
            - "auto_closed_cases == 1 (the overdue advice case); the EXTENDED case is untouched"
            - "promoted_applications == 1 — possible ONLY because the waterfall ran after the auto-close freed 2 units (order pinned)"
            - "Application ${app_w}: status == ELIGIBLE, promoted_from_waitlist == true"
            - "Attorney weighted_open_units == 5 after the sweep (7 - 2 freed)"

