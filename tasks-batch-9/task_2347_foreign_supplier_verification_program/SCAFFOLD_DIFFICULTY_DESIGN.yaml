  - rule_id: combinatorial_formula
    instances:
      - name: hazard_risk_score_nonlinear_clamp_on_infant_ready_to_eat_food
        grounds:
          - calculations.hazard_risk_score
          - calculations.hazard_risk_score.constants.cap
          - entities.Hazard.fields.risk_score
          - endpoints["POST /fsvp/hazard-analyses/{id}/hazards"]
        distinguishing_aspect: "Mode (a) — five interacting inputs (severity, probability, consumer-group multiplier, RAC/RTE conditional branches, control-owner factor) whose raw product 40.25 is clamped by the nested min/max to exactly 25.00, so a linear reading of the formula overshoots by 15.25."
        test_recipe:
          setup:
            - "Importer with one ACTIVE qualified individual, one supplier and one INFANT ready-to-eat food."
            - "A DRAFT hazard analysis on the pair, with no hazards yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Infant rice cereal", fda_product_code: "40-INF-06", is_raw_agricultural_commodity: false, intended_consumer_group: "INFANT", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food6: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food6}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair6: $.data.id, pair6_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair6}", expected_pair_version: "${pair6_v}", methodology_note: "Infant food hazard identification per Codex and FDA guidance" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha6: $.data.id }
          trigger:
            - call: "POST /fsvp/hazard-analyses/${ha6}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Cronobacter sakazakii", severity: 5, probability: 5, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { hz_cap: $.data.id }
          assert:
            - "Hazard.${hz_cap}.risk_score == 25.00"
            - "Hazard.${hz_cap}.requires_control == true"
            - "HazardAnalysis.${ha6}.risk_total == 25.00"
            - "HazardAnalysis.${ha6}.hazard_count == 1"
            - "HazardAnalysis.${ha6}.significant_hazard_count == 1"

      - name: hazard_analysis_risk_total_rounds_per_hazard_then_sums
        grounds:
          - calculations.hazard_analysis_risk_total
          - calculations.hazard_risk_score.precision
          - entities.HazardAnalysis.fields.risk_total
          - endpoints["POST /fsvp/hazard-analyses/{id}/hazards"]
        distinguishing_aspect: "Mode (b) — the three hazards have raw scores 4.3125 / 4.675 / 14.025; rounding each to 2dp first and summing yields risk_total 23.02, while summing raw and rounding once yields 23.01, so the pinned round-then-sum order is observable to the cent."
        test_recipe:
          setup:
            - "Importer with one ACTIVE qualified individual, one supplier, and an IMMUNOCOMPROMISED raw-agricultural-commodity ready-to-eat food."
            - "A DRAFT hazard analysis with two of the three hazards already recorded (4.31 and 4.68)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Fresh cantaloupe", fda_product_code: "22-CAN-03", is_raw_agricultural_commodity: true, intended_consumer_group: "IMMUNOCOMPROMISED", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food3: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food3}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair3: $.data.id, pair3_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair3}", expected_pair_version: "${pair3_v}", methodology_note: "Melon hazard identification for an immunocompromised consumer group" }
