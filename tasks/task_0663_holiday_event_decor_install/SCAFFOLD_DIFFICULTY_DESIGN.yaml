            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: FieldSupervisor
            - call: "POST /visits/${v1}/complete"
              payload: { actual_minutes: 55 }
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldSupervisor
            - call: "POST /work-orders/${wo_id}/damage-reports"
              payload: { inventory_item_id: "${sku_id}", damaged_qty: 5 }
