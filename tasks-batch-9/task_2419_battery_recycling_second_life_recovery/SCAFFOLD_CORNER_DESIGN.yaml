            - call: "POST /recycling/intakes/${i3_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
            - call: "POST /recycling/intakes/${i3_id}/discharge"
              payload: { soc_pct: 12.0 }
