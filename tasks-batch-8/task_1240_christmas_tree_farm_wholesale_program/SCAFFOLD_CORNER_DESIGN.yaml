  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: allocate_no_eligible_species_pool
        claim_type: conditional_action
        grounds: ["calculations.allocation_waterfall", "errors[ERR_NO_ELIGIBLE_INVENTORY]"]
        distinguishing_aspect: "The selector's eligibility filter is exact: a NOBLE_FIR order against a pool holding only DOUGLAS_FIR yields zero candidates and ERR_NO_ELIGIBLE_INVENTORY, not a substitution."
        test_recipe:
          setup: ["season in BOOKING; lot of DOUGLAS_FIR with H_6_7 = 100; submitted NOBLE_FIR order"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "DOUGLAS_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 100, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 5, expected_order_version: "${ov}" }, as: FarmManager }
          assert:
            - "422 with error_id == ERR_NO_ELIGIBLE_INVENTORY (species mismatch empties the eligible pool)"
            - "GET /api/allocations?order_id=${ord} returns total_count == 0; order stays SUBMITTED with allocated_qty 0"

      - name: run_ops_second_run_sweeps_nothing
        claim_type: idempotent_sweep
        grounds: ["calculations.run_ops_sweeps", "state_machines.WholesaleOrder.DRAFT_to_EXPIRED"]
        distinguishing_aspect: "run-ops is an epoch checkpoint: the first run past booking close expires the DRAFT order; a second run changes no state besides ops_run_index."
        test_recipe:
          setup: ["season in BOOKING with one DRAFT order; clock moved to 2026-09-01 (past booking_close_at)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: Owner }
          trigger:
            - { call: "POST /api/seasons/${s}/run-ops", payload: {}, as: Owner, captures: { idx1: $.data.ops_run_index } }
            - { call: "POST /api/seasons/${s}/run-ops", payload: {}, as: Owner, captures: { idx2: $.data.ops_run_index } }
          assert:
            - "first run: WholesaleOrder.${ord}.status == EXPIRED (clock 2026-09-01 > booking_close_at) and ${idx1} == 1"
            - "second run: ${idx2} == 2 and the order is still EXPIRED with unchanged updated_at — the sweep re-fires nothing"

      - name: order_list_filter_by_buyer
        claim_type: filtered_list
        grounds: ["endpoints[\"GET /api/wholesale-orders\"]"]
        distinguishing_aspect: "buyer_account_id filter isolates one buyer's orders; the WholesaleBuyer role only ever sees its own rows."
        test_recipe:
          setup: ["season in BOOKING; buyers A and B each with one DRAFT order"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Buyer A", credit_limit_cents: 100000000 }, as: Owner, captures: { ba: $.data.id } }
            - { call: "POST /api/buyer-accounts", payload: { name: "Buyer B", credit_limit_cents: 100000000 }, as: Owner, captures: { bb: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${ba}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 5, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${ba}", captures: { oa: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${bb}", species: "GRAND_FIR", height_class: "H_7_8", quantity: 7, unit_price_cents: 600 }, as: WholesaleBuyer, as_user_id: "${bb}", captures: { ob: $.data.id } }
          trigger:
            - { call: "GET /api/wholesale-orders?buyer_account_id=${ba}", payload: {}, as: FarmManager }
            - { call: "GET /api/wholesale-orders", payload: {}, as: WholesaleBuyer, as_user_id: "${ba}" }
          assert:
            - "filtered list: total_count == 1 and [0].id == ${oa}"
            - "buyer-role unfiltered list returns only own orders: total_count == 1 and [0].id == ${oa} (Buyer B's ${ob} invisible)"

