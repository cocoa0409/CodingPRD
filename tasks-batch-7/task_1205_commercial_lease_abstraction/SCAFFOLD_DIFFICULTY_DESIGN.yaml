scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recovery_billing_estimate_vs_final_with_gross_up
        grounds:
          - calculations.recovery_billing_estimate
          - calculations.reconciliation_final
          - entities.RecoveryBilling.fields.estimate_cents
          - entities.RecoveryBilling.fields.final_cents
        distinguishing_aspect: |
          Same RecoveryBilling row produces different amounts under the two variants:
          `estimate` uses RecoveryPool.budgeted_cents (forward-looking), `final` uses
          RecoveryPool.actual_cents with gross-up scaling (chronological close). Entity
          domain: RecoveryBilling / RecoveryPool (operating expense recovery).
        test_recipe:
          setup:
            - "Property P1 with total_rentable_sf=10000, fiscal_year_end_month=12"
            - "Lease L1 on P1, leased_sf=4000, pro_rata_share_bps=4000, recovery_structure=NNN, ACTIVE"
            - "RecoveryPool CAM for FY2027 with budgeted_cents=12000000, actual_cents=10000000, gross_up_floor_pct_bps=9500"
            - "12 RecoveryBilling rows for L1 FY2027 CAM, period_index 1..12, all ISSUED"
            - "Logical clock at 2027-06-01 (mid fiscal year)"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main St", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 12000000, gross_up_floor_pct_bps: 9500 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { billing_1: $.data.id, billing_1_estimate: $.data.estimate_cents }
            - call: "POST /lease-admin/recovery-billings/${billing_1}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "PUT /lease-admin/recovery-pools/${pool_id}/actuals"
              payload: { actual_cents: 10000000 }
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/reconciliations"
              payload: { fiscal_year: 2027 }
              as: LeaseAccountant
              captures: { recon_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/reconciliations/${recon_id}/post"
              payload: {}
              as: LeaseAccountant
            - call: "GET /lease-admin/recovery-billings/${billing_1}"
              payload: {}
              as: LeaseAccountant
              captures: { billing_1_final: $.data.final_cents }
          assert:
            - "billing_1_estimate == 400000   # 12000000 * 4000/10000 / 12"
            - "Reconciliation.${recon_id}.gross_up_applied == true"
            - "billing_1_final == 791667  # row 1 of waterfall: round_half_up(9500000/12) = 791667"
            - "billing_1_final != billing_1_estimate  # variant divergence: grossed-up actual differs from budgeted estimate"

      - name: rent_roll_cash_vs_straight_line
        grounds:
          - calculations.annual_rent_total
          - calculations.straight_line_rent
          - entities.Lease.fields.cached_annual_rent_cents
        distinguishing_aspect: |
          Same Lease and same fiscal year produce different total_rent_cents depending
          on basis variant: `cash` sums scheduled effective_rent_cents (1,200,000),
          `straight_line` smooths total term rent over days (1,260,000). Entity domain:
          Lease / RentScheduleLine (revenue recognition). Different entity domain
          from recovery_billing (expense recovery).
        test_recipe:
          setup:
            - "Property P1 with fiscal_year_end_month=12 (calendar FY)"
            - "Lease L1 with 2-year term 2026-01-01 to 2027-12-31, escalation_type=FIXED_PCT"
            - "EscalationStep idx=1, kind=FIXED_PCT, pct_bps=1000, effective_on=2027-01-01"
            - "RentScheduleLine L1a [2026-01-01, 2027-01-01) base=1200000 (no escalation)"
            - "RentScheduleLine L1b [2027-01-01, 2028-01-01) base=1200000 with escalation step 1 -> effective=1320000"
            - "Logical clock 2026-06-01 (mid FY2026)"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main St", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2026-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: FIXED_PCT, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/escalation-steps"
              payload: { step_index: 1, kind: FIXED_PCT, pct_bps: 1000, effective_on: "2027-01-01" }
              as: PortfolioManager
              captures: { step_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2026-01-01", period_end: "2027-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000, escalation_step_id: "${step_id}" }
              as: PortfolioManager
          trigger:
            - call: "GET /lease-admin/leases/${lease_id}/rent-roll"
              payload: { fiscal_year: 2026, basis: "cash" }
              as: LeaseAccountant
              captures: { cash_total: $.data.total_rent_cents }
            - call: "GET /lease-admin/leases/${lease_id}/rent-roll"
              payload: { fiscal_year: 2026, basis: "straight_line" }
              as: LeaseAccountant
              captures: { sl_total: $.data.total_rent_cents }
          assert:
            - "cash_total == 1200000   # only L1a overlaps FY2026"
            - "sl_total == 1260000     # straight-line: 2520000 * 365/730"
            - "sl_total - cash_total == 60000  # divergence from smoothing"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reconciliation_final_gross_up_waterfall
        grounds:
          - calculations.reconciliation_final
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction — conditional
          branch on occupancy_rate_bps < gross_up_floor_pct_bps (entity-state-derived),
          tiered escalation through pro_rata_share_bps, then nested division for the
          12-period waterfall with rounding remainder absorption in row 12.
        test_recipe:
          setup:
            - "Property P1 total_rentable_sf=10000; single ACTIVE lease of 4000 SF => occupancy 4000 bps"
            - "RecoveryPool CAM FY2027 actual_cents=10000000, gross_up_floor=9500 bps"
            - "RecoveryPool TAX FY2027 actual_cents=2000000 (fixed, not in VARIABLE_SET)"
            - "12 CAM billings + 12 TAX billings for the lease, all ISSUED"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 12000000, gross_up_floor_pct_bps: 9500 }
              as: LeaseAccountant
              captures: { cam_pool: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: TAX, fiscal_year: 2027, budgeted_cents: 2400000, gross_up_floor_pct_bps: 9500 }
              as: LeaseAccountant
              captures: { tax_pool: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${cam_pool}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { cam_b1: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${cam_b1}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${cam_pool}", fiscal_year: 2027, period_index: 12 }
              as: LeaseAccountant
              captures: { cam_b12: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${cam_b12}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "PUT /lease-admin/recovery-pools/${cam_pool}/actuals"
              payload: { actual_cents: 10000000 }
              as: LeaseAccountant
            - call: "PUT /lease-admin/recovery-pools/${tax_pool}/actuals"
              payload: { actual_cents: 2000000 }
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/reconciliations"
              payload: { fiscal_year: 2027 }
              as: LeaseAccountant
              captures: { recon_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/reconciliations/${recon_id}/post"
              payload: {}
              as: LeaseAccountant
            - call: "GET /lease-admin/recovery-billings/${cam_b1}"
              payload: {}
              as: LeaseAccountant
              captures: { cam_b1_final: $.data.final_cents }
            - call: "GET /lease-admin/recovery-billings/${cam_b12}"
              payload: {}
              as: LeaseAccountant
              captures: { cam_b12_final: $.data.final_cents }
          assert:
            - "Reconciliation.${recon_id}.gross_up_applied == true   # 4000 < 9500 AND CAM in VARIABLE_SET"
            - "cam_b1_final == 791667    # round_half_up(9500000/12)"
            - "cam_b12_final == 791663   # remainder: 9500000 - 11*791667"
            - "11 * cam_b1_final + cam_b12_final == 9500000  # invariant: waterfall preserves total"

      - name: escalated_rent_per_line_rounding
        grounds:
          - calculations.escalated_rent_for_period
          - calculations.annual_rent_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up then
          sum produces a different annual total than sum-then-round. The scaffold pins
          per-line rounding. Three lines with fractional-cent escalations demonstrate
          the pinned order.
        test_recipe:
          setup:
            - "Property P1, Lease L1 with escalation_type=FIXED_PCT"
            - "EscalationStep pct_bps=33 (0.33%) — produces fractional cents on odd bases"
            - "Three monthly RentScheduleLines, each base=333333 cents ($3,333.33), all with same step"
            - "Per-line: round_half_up(333333 * 10033 / 10000) = round_half_up(334433.0 - actually 334433.0 is exact; let's pick base=333333 and pct=33 -> 333333*10033/10000 = 334433.9889 -> 334434"
            - "Sum of 3 rounded lines = 1003302; sum-then-round would be round_half_up(3*334433.9889)=1003302 (same here); use pct_bps=1 for clearer divergence:"
            - "Effective per line with pct_bps=1: round_half_up(333333 * 10001 / 10000) = round_half_up(333366.3333) = 333366"
            - "Per-line sum = 3 * 333366 = 1000098; sum-then-round = round_half_up(1000098.9999...) = 1000099 — differs by 1 cent"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: FIXED_PCT, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/escalation-steps"
              payload: { step_index: 1, kind: FIXED_PCT, pct_bps: 1, effective_on: "2027-01-01" }
              as: PortfolioManager
              captures: { step_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2027-02-01", base_rent_cents: 333333, escalation_step_id: "${step_id}" }
              as: PortfolioManager
              captures: { line1_id: $.data.id, line1_eff: $.data.effective_rent_cents }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-02-01", period_end: "2027-03-01", base_rent_cents: 333333, escalation_step_id: "${step_id}" }
              as: PortfolioManager
              captures: { line2_id: $.data.id, line2_eff: $.data.effective_rent_cents }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-03-01", period_end: "2027-04-01", base_rent_cents: 333333, escalation_step_id: "${step_id}" }
              as: PortfolioManager
              captures: { line3_id: $.data.id, line3_eff: $.data.effective_rent_cents }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-04-01", period_end: "2028-01-01", base_rent_cents: 200001 }
              as: PortfolioManager
          trigger:
            - call: "GET /lease-admin/leases/${lease_id}/rent-roll"
              payload: { fiscal_year: 2027, basis: "cash" }
              as: LeaseAccountant
              captures: { fy_total: $.data.total_rent_cents }
          assert:
            - "line1_eff == 333366   # per-line round_half_up(333333 * 10001/10000)"
            - "line2_eff == 333366"
            - "line3_eff == 333366"
            - "fy_total == 333366 + 333366 + 333366 + 200001   # = 1200099, sum of per-line rounded"
            - "fy_total == 1200099"
            - "fy_total != 1200100  # sum-then-round of unrounded values (333366.3333*3 + 200001 = 1200100.0 -> 1200100) would differ"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tenant_challenge_cyclic_reopen
        grounds:
          - state_machines.TenantChallenge.OPEN_to_UNDER_REVIEW
          - state_machines.TenantChallenge.UNDER_REVIEW_to_OPEN
        distinguishing_aspect: |
          Cyclic shape: OPEN -> UNDER_REVIEW -> OPEN allowed while round_index < 3.
          Each cycle increments round_index. Different entity from the parallel-dimension
          Lease machine.
        test_recipe:
          setup:
            - "Full pipeline through an APPROVED reconciliation and a challenge"
            - "TenantChallenge created in OPEN"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000, gross_up_floor_pct_bps: 9500 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b_id: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b_id}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "PUT /lease-admin/recovery-pools/${pool_id}/actuals"
              payload: { actual_cents: 1200000 }
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/reconciliations"
              payload: { fiscal_year: 2027 }
              as: LeaseAccountant
              captures: { recon_id: $.data.id }
            - call: "POST /lease-admin/reconciliations/${recon_id}/post"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/reconciliations/${recon_id}/approve"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/tenant-challenges"
              payload: { reconciliation_id: "${recon_id}", reason_code: MATH_ERROR, claimed_overbilling_cents: 1000 }
              as: PropertyManager
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/start-review"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/reopen"
              payload: {}
              as: LeaseAccountant
              captures: { round_after_1: $.data.round_index, status_after_1: $.data.status }
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/start-review"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/reopen"
              payload: {}
              as: LeaseAccountant
              captures: { round_after_2: $.data.round_index }
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/start-review"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/reopen"
              payload: {}
              as: LeaseAccountant
              captures: { round_after_3: $.data.round_index }
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/start-review"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/tenant-challenges/${ch_id}/reopen"
              payload: {}
              as: LeaseAccountant
              captures: { err: $.data.error_id }
          assert:
            - "round_after_1 == 1"
            - "status_after_1 == OPEN   # cycled back"
            - "round_after_2 == 2"
            - "round_after_3 == 3"
            - "err == ERR_MAX_ROUNDS_REACHED   # 4th reopen rejected"

      - name: lease_parallel_dimensions
        grounds:
          - state_machines.Lease
          - entities.Lease.fields.status
          - entities.Lease.fields.abstraction_status
          - entities.Lease.fields.billing_posture
        distinguishing_aspect: |
          Parallel shape: Lease carries three independent dimensions
          (status × abstraction_status × billing_posture) that evolve orthogonally —
          abstraction_status CERTIFIED -> PENDING (via reopen) does not change
          billing_posture; a RecoveryBilling transitioning to DISPUTED changes
          billing_posture to FROZEN without touching abstraction_status. Different
          entity from TenantChallenge.
        test_recipe:
          setup:
            - "Lease fully ACTIVE with CERTIFIED abstraction"
            - "RecoveryBilling ISSUED; TenantChallenge opens against it"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
