            - call: "POST /mpi/overlay-corrections/${ov_vj_id}/apply"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/propagation-tasks?downstream_system_id=${sys_vja_id}"
              payload: {}
              as: MpiAdmin
              captures: { task_vja_id: "$.data[0].id", task_vja_deadline: "$.data[0].propagation_deadline_at", task_vja_state: "$.data[0].state" }
            - call: "GET /mpi/propagation-tasks?downstream_system_id=${sys_vjb_id}"
