              captures: { case_id: "$.data.id", paid_at_filing: "$.data.paid_cents", pool_at_filing: "$.data.honoraria_pool_cents" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "IMMEDIATE is a registered mark, exhibit A attached.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
