scaffold_corner_design:
- section: entities
  instances:
  - name: landlord_creation_system_fields
    claim_type: creation
    grounds:
    - entities.Landlord
    distinguishing_aspect: POST /api/landlords returns 201 with server-minted id, created_at, and version == 1; client cannot supply them.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /api/landlords
        payload:
          legal_name: Acme Homes
          contact_email: a@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
          v: $.data.version
      assert:
      - v == 1
      - Landlord.${ll}.legal_name == Acme Homes and created_at is present
  - name: unit_defaults_to_vacant
    claim_type: defaults
    grounds:
    - entities.RentalUnit.fields.status
    distinguishing_aspect: A new RentalUnit starts VACANT without the client passing any status.
    test_recipe:
      setup:
      - one landlord
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      trigger:
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: TX
          street_address: 5 S St
          unit_label: '1'
        as: Landlord
        as_user_id: ${ll}
        captures:
          st: $.data.status
      assert:
      - st == VACANT
  - name: notice_computed_cure_schedule
    claim_type: computed_fields
    grounds:
    - entities.Notice.fields.statutory_cure_days
    - entities.Notice.fields.cure_deadline
    - calculations.notice_cure_schedule
    distinguishing_aspect: OH CURE_OR_QUIT served 2026-05-02 computes statutory_cure_days 7 and cure_deadline 2026-05-09T23:59:59Z (jurisdiction x notice-type table, end-of-day).
    test_recipe:
      setup:
      - one OH unit/tenancy and a LEASE_VIOLATION case; clock 2026-05-02T08:00:00Z
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: OH
          street_address: 5 S St
          unit_label: '1'
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 90000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: LEASE_VIOLATION
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cv: $.data.version
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: CURE_OR_QUIT
          served_on: '2026-05-02'
          violation_description: unauthorized pet
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
        captures:
          days: $.data.statutory_cure_days
          dl: $.data.cure_deadline
      assert:
      - days == 7
      - dl == 2026-05-09T23:59:59Z
  - name: judgment_reverse_list_empty_before_entry
    claim_type: retrieval
    grounds:
    - entities.Judgment.fields.case_id
    distinguishing_aspect: GET /api/cases/{id}/judgment (1:1 reverse reachability) returns an empty array with total_count 0 before any judgment is entered.
    test_recipe:
      setup:
      - one CA case in DRAFT
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: NONPAYMENT
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
      trigger:
      - call: GET /api/cases/${c}/judgment
        payload: {}
        as: CourtClerk
      assert:
      - response is an array of length 0 with total_count == 0 and has_more == false
  - name: collection_entry_immutable_shape
    claim_type: immutability
    grounds:
    - entities.CollectionEntry
    distinguishing_aspect: 'CollectionEntry has common_fields false: reads expose id and created_at but no version/updated_at, and no update endpoint exists.'
    test_recipe:
      setup:
      - 'one CA judgment (total 108000: rent 100000, damages 5000, late 2000, costs 1000, interest 0)'
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: NONPAYMENT
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cv: $.data.version
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T08:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: PAY_OR_QUIT
          served_on: '2026-05-02'
          claimed_rent_owed_cents: 100000
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-06T00:00:01Z'
        as: PlatformAdmin
      - call: POST /api/ops/runs
        payload: {}
        as: CourtClerk
      - call: POST /api/cases/${c}/filing-packages
        payload:
          claimed_amount_cents: 100000
          defendant_names:
          - Dee A
          jury_demanded: false
          efiled: false
        as: Landlord
        as_user_id: ${ll}
        captures:
          p: $.data.id
      - call: POST /api/filing-packages/${p}/fee-payments
        payload:
          amount_cents: 27250
        as: Landlord
        as_user_id: ${ll}
      - call: POST /api/filing-packages/${p}/review
        payload:
          decision: ACCEPT
        as: CourtClerk
        as_user_id: clerk-a
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-01T11:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/service-attempts
        payload:
          defendant_name: Dee A
          method: PERSONAL
          result: SERVED
          served_at: '2026-06-01T10:00:00Z'
        as: ProcessServer
        as_user_id: ps-1
      - call: POST /api/cases/${c}/hearings
        payload:
          courtroom: CR-1
          start_at: '2026-06-15T10:00:00Z'
          end_at: '2026-06-15T10:30:00Z'
        as: CourtClerk
        as_user_id: clerk-a
        captures:
          h: $.data.id
      - call: POST /api/hearings/${h}/conclude
        payload: {}
        as: CourtClerk
        as_user_id: clerk-a
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-06-20T12:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/judgment
        payload:
          possession_granted: true
          rent_awarded_cents: 100000
          damages_cents: 5000
          late_fee_cents: 2000
          court_costs_cents: 1000
          oldest_unpaid_due_date: '2026-06-20'
        as: CourtClerk
        as_user_id: clerk-b
        captures:
          j: $.data.id
      - call: POST /api/judgments/${j}/collection-entries
        payload:
          entry_type: PAYMENT
          amount_cents: 1000
        as: Landlord
        as_user_id: ${ll}
        captures:
          e: $.data.id
      trigger:
      - call: GET /api/collection-entries/${e}
        payload: {}
        as: CourtClerk
      assert:
      - response data contains id and created_at but no 'version' and no 'updated_at' key
      - resulting_outstanding_cents == 107000
- section: state_machines
  instances:
  - name: cured_notice_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Notice
    distinguishing_aspect: A CURED notice accepts no further record-cure; the second attempt is rejected with ERR_INVALID_STATE and nothing changes.
    test_recipe:
      setup:
      - one CA case CURED via exact-amount cure (claimed 150000)
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: NONPAYMENT
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cv: $.data.version
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T08:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: PAY_OR_QUIT
          served_on: '2026-05-02'
          claimed_rent_owed_cents: 150000
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
        captures:
          n: $.data.id
      - call: POST /api/notices/${n}/record-cure
        payload:
          paid_amount_cents: 150000
        as: Landlord
        as_user_id: ${ll}
      trigger:
      - call: POST /api/notices/${n}/record-cure
        payload:
          paid_amount_cents: 150000
        as: Landlord
        as_user_id: ${ll}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_STATE
  - name: cure_after_deadline_rejected
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=23]
    - state_machines.Notice.PENDING_to_CURED
    distinguishing_aspect: "The notice is still PENDING (no ops run expired it) but the logical clock is past cure_deadline; record-cure fails with ERR_CURE_WINDOW_CLOSED \u2014 temporal gate independent\
      \ of status."
    test_recipe:
      setup:
      - one CA PAY_OR_QUIT notice PENDING, served 2026-05-02 (deadline 2026-05-05T23:59:59Z); clock 2026-05-06T00:00:01Z; NO ops run executed
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: NONPAYMENT
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cv: $.data.version
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T08:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: PAY_OR_QUIT
          served_on: '2026-05-02'
          claimed_rent_owed_cents: 150000
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
        captures:
          n: $.data.id
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-06T00:00:01Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/notices/${n}/record-cure
        payload:
          paid_amount_cents: 150000
        as: Landlord
        as_user_id: ${ll}
        captures:
          err: $.data.error_id
      - call: GET /api/notices/${n}
        payload: {}
        as: CourtClerk
        captures:
          st: $.data.status
      assert:
      - err == ERR_CURE_WINDOW_CLOSED
      - st == PENDING (status unchanged until an ops run expires it)
  - name: unconditional_quit_never_curable
    claim_type: invalid_transition
    grounds:
    - state_machines.Notice.PENDING_to_CURED
    - validations[priority=23]
    distinguishing_aspect: UNCONDITIONAL_QUIT (case_reason SEVERE, cure days 0) rejects any cure attempt even inside the same day, with ERR_CURE_WINDOW_CLOSED.
    test_recipe:
      setup:
      - one CA case (SEVERE) with UNCONDITIONAL_QUIT notice served 2026-05-02; clock 2026-05-02T10:00:00Z
      setup_api_calls:
      - call: POST /api/landlords
        payload:
          legal_name: L
          contact_email: l@x.com
        as: PlatformAdmin
        captures:
          ll: $.data.id
      - call: POST /api/units
        payload:
          landlord_id: ${ll}
          jurisdiction_code: CA
          street_address: 1 A St
          unit_label: A
        as: Landlord
        as_user_id: ${ll}
        captures:
          u: $.data.id
      - call: POST /api/tenancies
        payload:
          unit_id: ${u}
          tenant_full_name: T
          monthly_rent_cents: 150000
          lease_start_date: '2026-01-01'
        as: Landlord
        as_user_id: ${ll}
        captures:
          t: $.data.id
      - call: POST /api/cases
        payload:
          tenancy_id: ${t}
          case_reason: SEVERE
        as: Landlord
        as_user_id: ${ll}
        captures:
          c: $.data.id
          cv: $.data.version
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-02T10:00:00Z'
        as: PlatformAdmin
      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: UNCONDITIONAL_QUIT
          served_on: '2026-05-02'
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
        captures:
          n: $.data.id
      trigger:
      - call: POST /api/notices/${n}/record-cure
        payload:
          violation_cured: true
        as: Landlord
        as_user_id: ${ll}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_CURE_WINDOW_CLOSED
  - name: filing_reject_then_refile_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.EvictionCase.FILING_REJECTED_to_FILED
    - state_machines.FilingPackage.DRAFT_to_REJECTED
    distinguishing_aspect: A clerk REJECT sends the case to FILING_REJECTED; a fresh package can then be prepared, paid, and ACCEPTED, cycling the case to FILED.
    test_recipe:
      setup:
      - one CA case NOTICE_EXPIRED with a paid package P1
      setup_api_calls:
      - call: POST /api/landlords
