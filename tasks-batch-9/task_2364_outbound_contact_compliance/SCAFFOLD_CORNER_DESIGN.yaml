- section: errors
  instances:
  - name: pagination_limit_above_the_maximum_returns_the_error_envelope
    claim_type: Triggerability
    grounds:
    - errors[ERR_INVALID_REQUEST]
    - validations[priority=30]
    - response_envelope.pagination_defaults
    distinguishing_aspect: limit 101 exceeds the declared maximum of 100, so the list read fails with the error envelope shape (response_type error, data.error_id, data.message) instead of silently clamping to 100.
    test_recipe:
      setup:
      - clock at 2026-08-03T00:00:00Z; one CA contact and one OPEN complaint are irrelevant to the check
      - empty database is sufficient
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /compliance/complaints
        payload:
          limit: 101
        as: ComplianceOfficer
        captures:
          err_id: $.data.error_id
      assert:
      - the trigger returns 400 with response_type == "error"
      - data.error_id == "ERR_INVALID_REQUEST" and data.message is a non-empty string
      - meta.api_request_id and meta.api_request_timestamp are present on the error envelope
      - the same read with limit 100 returns 200 with total_count == 0 and has_more == false
