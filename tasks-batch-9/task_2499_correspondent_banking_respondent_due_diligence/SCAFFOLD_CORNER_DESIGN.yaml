              as: FIGRelationshipManager
              captures: { r2: $.data.id }
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Bank 3", swift_bic: "BANKDE03", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 10 }
              as: FIGRelationshipManager
              captures: { r3: $.data.id }
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Bank 4", swift_bic: "BANKDE04", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 10 }
              as: FIGRelationshipManager
              captures: { r4: $.data.id }
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Bank 5", swift_bic: "BANKDE05", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 100000.00, expected_monthly_count: 10 }
              as: FIGRelationshipManager
              captures: { r5: $.data.id }
          trigger:
            - call: "GET /correspondent-banking/respondents?limit=2&offset=2"
              payload: {}
              as: ComplianceAnalyst
