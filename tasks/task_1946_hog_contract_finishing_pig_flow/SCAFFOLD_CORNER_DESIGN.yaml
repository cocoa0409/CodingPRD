            - "1000 head into 7000-sqft barn (needs 8000) -> 409 ERR_FLOOR_SPACE_EXCEEDED (${err2})"

      - name: settlement_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.settlement_pay]
        excluded_because:
          difficulty_instance: settlement_provisional_vs_final_divergence
          rationale: "§1.8 instance asserts PROVISIONAL 4360000 vs FINAL 4600000 on one group — the divergence claim itself."

  # ============================================================ validations
  - section: validations
    instances:
      - name: auth_header_missing_beats_not_found
        claim_type: priority_ordering
        grounds: [ "validations[priority=1]", "validations[priority=4]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no auth headers against a nonexistent id returns 401 ERR_UNAUTHENTICATED, never 404 — priority 1 precedes priority 4."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /barns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED (${err})"

      - name: grower_cannot_create_pig_group_even_with_bad_refs
        claim_type: priority_ordering
        grounds: [ "validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Role check (priority 2) precedes FK existence (priority 4): Grower creating a group with a nonexistent barn_id gets 403 ERR_FORBIDDEN_ROLE, not 404."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", contract_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", placement_date: "2026-09-01", target_market_date: "2027-01-12", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${grower_id}" }, as: Grower, as_user_id: "${grower_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; error_id == ERR_FORBIDDEN_ROLE (${err})"

      - name: grower_reading_foreign_group_forbidden
        claim_type: cross_entity_validation
        grounds: [ "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Ownership is resolved through the group's contract chain: Grower B reading Grower A's group gets 403 ERR_NOT_RESOURCE_OWNER."
