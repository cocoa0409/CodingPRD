        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid X-User-Role header → ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["A park exists"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
          trigger:
            - call: "GET /parks/${park_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_UNAUTHENTICATED"

  # =================================================================
  - section: endpoints
    instances:
      - name: list_rides_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Ride]
        distinguishing_aspect: "GET /parks/{id}/rides returns response_type array with pagination meta total_count and has_more."
        test_recipe:
          setup: ["A park with two rides"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R1", hourly_throughput: 100 }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R2", hourly_throughput: 50 }
              as: ParkAdmin
          trigger:
            - call: "GET /parks/${park_id}/rides"
              payload: {}
              as: ParkAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == false"

      - name: redeem_within_window_succeeds_and_credits_counters
        claim_type: Action endpoint
        grounds: [state_machines.Reservation.BOOKED_to_REDEEMED, entities.Ride.fields.booked_slot_count]
        distinguishing_aspect: "Redeeming a BOOKED reservation when current_utc is inside [start,end) succeeds, sets REDEEMED, and decrements ride booked_slot_count and window reserved_count."
        test_recipe:
          setup: ["Ride R5 60-min window capacity 2; one BOOKED reservation; clock at 10:30 (inside window)"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T10:30:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /reservations/${res_id}/redeem"
              payload: {}
              as: RideOperator
          assert:
            - "Reservation.${res_id}.reservation_status == REDEEMED"
            - "ReturnWindow.${win_id}.reserved_count == 0"
            - "Ride.${ride_id}.booked_slot_count == 0"

  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_window_version_on_reservation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[vq-book-stale-window]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Booking a VIRTUAL_QUEUE reservation with expected_return_window_id_version one behind the window's current version → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Window with capacity; one reservation already created (window.version advanced); a second booking reuses the pre-advance version"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GB", height_cm: 170 }
              as: ParkAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${gb_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${gb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_party_version_on_party_book
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[party-book-stale-party]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "party-book with expected_party_version stale (membership changed after the client read) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A party whose version advanced via a member-link after the client captured an earlier version"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GL", height_cm: 170 }
              as: ParkAdmin
              captures: { gl_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GM", height_cm: 170 }
              as: ParkAdmin
              captures: { gm_id: $.data.id }
            - call: "POST /parks/${park_id}/parties"
              payload: { leader_guest_id: "${gl_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { party_id: $.data.id, party_v0: $.data.version }
            - call: "POST /parties/${party_id}/members"
              payload: { guest_id: "${gm_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
          trigger:
            - call: "POST /parties/${party_id}/party-book"
              payload: { ride_id: "${ride_id}", return_window_id: "${win_id}", expected_party_version: "${party_v0}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_window_version_increments_on_each_booking
        claim_type: optimistic_concurrency
        grounds: [entities.ReturnWindow.fields.reserved_count, "concurrency_rules[vq-book-stale-window]"]
        distinguishing_aspect: "ReturnWindow.version increments by 1 on each VIRTUAL_QUEUE booking, so a correctly-passed expected_return_window_id_version succeeds where a stale one fails."
        test_recipe:
          setup: ["A window with capacity 2; two sequential bookings each pass the freshly-read version"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GA", height_cm: 170 }
              as: ParkAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GB", height_cm: 170 }
              as: ParkAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${ga_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${ga_id}"
              captures: { win_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${gb_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v1}" }
              as: GuestApp
              as_user_id: "${gb_id}"
              captures: { res_b_id: $.data.id }
          assert:
            - "Reservation.${res_b_id}.reservation_status == HELD"
            - "ReturnWindow.${win_id}.reserved_count == 2"
            - "ReturnWindow.${win_id}.window_status == EXHAUSTED"

      - name: ride_down_redistribution_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Ride.OPEN_to_DOWN, state_machines.Reservation.BOOKED_to_REDISTRIBUTED, entities.ReturnWindow.fields.reserved_count]
        distinguishing_aspect: "declare-down cascades: BOOKED reservation -> REDISTRIBUTED, its old window reserved_count decremented, window SUSPENDED, ride booked_slot_count -> 0."
        test_recipe:
          setup: ["Ride R5 60-min window capacity 2 with one BOOKED reservation (reserved_count 1)"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
          assert:
            - "Reservation.${res_id}.reservation_status == REDISTRIBUTED"
            - "Reservation.${res_id}.redistributed_from_window_id == ${win_id}"
            - "ReturnWindow.${win_id}.reserved_count == 0"
            - "ReturnWindow.${win_id}.window_status == SUSPENDED"
            - "Ride.${ride_id}.booked_slot_count == 0"

      - name: rate_threshold_peak_phase_boundary_allows_open_below_threshold
        claim_type: rate_threshold_triggers
        grounds: [entities.Park.fields.day_phase, "validations[priority=10]"]
        distinguishing_aspect: "At admitted_count/gate_capacity just BELOW peak_threshold_pct the park is OPEN and a non-MULTI_PASS guest CAN book a VIRTUAL_QUEUE slot (boundary opposite of the §1.8 PEAK-blocked instance)."
        test_recipe:
          setup: ["Park gate_capacity 4, peak_threshold_pct 0.85; admit 1 guest -> 1/4=0.25 < 0.85 (OPEN); a second guest books a VQ slot successfully"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 4, peak_threshold_pct: 0.85, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
