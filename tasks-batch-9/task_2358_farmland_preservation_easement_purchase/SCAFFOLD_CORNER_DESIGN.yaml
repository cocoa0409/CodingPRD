      - name: accepting_a_second_plan_against_drained_local_headroom_raises_source_window_capacity_exceeded
        claim_type: Error triggerable
        grounds:
          - validations[priority=29]
          - errors[ERR_SOURCE_WINDOW_CAPACITY_EXCEEDED]
          - calculations.funding_waterfall_allocation.input_set
          - state_machines.Application.status[OFFER_ISSUED -> ACCEPTED]
        distinguishing_aspect: "available_cents deliberately nets only OBLIGATED and DISBURSED commitments, so two funded plans may reserve against the same local headroom. Plan PT reserves 8,925,000 of the LOCAL source and plan A reserves 56,127,723 of the same 60,000,000 source; accepting A obligates 56,127,723 and leaves the source ACTIVE because 56,127,723 < floor(60,000,000 * 0.95) == 57,000,000, so no FULLY_OBLIGATED lapse cascade rescues PT. PT's own acceptance would drive the source's OBLIGATED total to 65,052,723 > authorized 60,000,000 and is rejected by priority 29 — the only path on which that code is reachable."
