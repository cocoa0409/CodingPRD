              payload: { name: "Bad Enum", objective_type: "BRAND_LOVE", target_segment_codes: ["URBAN_MILLENNIAL"], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000 }
