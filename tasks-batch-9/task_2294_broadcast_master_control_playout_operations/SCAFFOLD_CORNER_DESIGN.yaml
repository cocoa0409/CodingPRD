              payload: { event_kind: START, event_utc: "2026-08-01T14:05:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:06:39Z" }
              as: StationAdmin
            - &end_r4
              call: "POST /playlist-items/${r4_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T14:06:39Z", measured_duration_seconds: 99, source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          trigger:
            - call: "GET /playlists/${plr_id}/reconciliation"
              payload: { basis: PRELIMINARY }
              as: TrafficCoordinator
              captures: { pre_credit: "$.data.reconciliation_credit_cents" }
            - call: "GET /playlists/${plr_id}/reconciliation"
              payload: { basis: FINAL }
              as: TrafficCoordinator
            - call: "GET /spot-orders/${ord5_id}"
              as: TrafficCoordinator
