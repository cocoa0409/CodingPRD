        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid X-User-Role/X-User-ID headers returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", forester_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
