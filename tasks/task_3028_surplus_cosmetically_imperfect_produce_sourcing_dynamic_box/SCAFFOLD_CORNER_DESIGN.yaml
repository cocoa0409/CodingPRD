          region: NE
        as: PlatformAdmin
        captures:
          of_s: $.data.id
      - call: POST /produce/suppliers/${of_s}/lots
        payload:
          fulfillment_center_id: ${of_c}
          product_name: OF1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          of_l: $.data.id
          of_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${of_l}
          supplier_id: ${of_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${of_s}
      - call: POST /produce/supply-lots/${of_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${of_lv}
        as: PlatformAdmin
        captures:
          of_lv2: $.data.version
      - call: POST /produce/supply-lots/${of_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${of_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: of@example.com
          full_name: Sub Of
          service_region: NE
        as: Anonymous
        captures:
          of_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${of_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          of_sub: $.data.id
          of_subv: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${of_cu}
          subscription_id: ${of_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          of_o1: $.data.id
          of_o1v: $.data.version
      trigger:
      - call: POST /produce/box-orders/${of_o1}/finalize
        payload:
          expected_box_order_version: ${of_o1v} - 1
        as: PlatformAdmin
        captures:
          of_err: $.data.error_id
      - call: POST /produce/box-orders/${of_o1}/finalize
        payload:
          expected_box_order_version: ${of_o1v}
        as: PlatformAdmin
      assert:
      - the stale finalize returns 412 and of_err == ERR_STALE_VERSION
      - the subsequent finalize with the current version returns 200
      - BoxOrder.${of_o1}.status == AWAITING_WINDOW afterwards
  - name: cascading_side_effects_reach_the_supplier_tier
    claim_type: cascading_side_effects
    grounds:
    - state_machines.SupplyLot.INVESTIGATION_to_REJECTED
    - calculations.reliability_score
    excluded_because:
      difficulty_instance: quality_investigation_cascade_lot_expiry_to_supplier_score
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: rate_threshold_triggers_flip_the_cold_chain_decision_at_one_gram
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.cold_chain_selection
    excluded_because:
      difficulty_instance: cold_weight_boundary_is_inclusive_at_1200_and_exclusive_at_1199
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: scheduled_deferred_actions_resolve_at_the_logical_clock
    claim_type: scheduled_actions
    grounds:
    - state_machines.BoxOrder.AWAITING_WINDOW_to_READY_TO_BUILD
    excluded_because:
      difficulty_instance: maintenance_interval_blocks_the_center_between_two_helped_windows
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: selector_policy_picks_the_specialty_lot_only_when_the_class_is_reached
    claim_type: selector_policy
    grounds:
    - calculations.allocate_box_lines
    excluded_because:
      difficulty_instance: box_pricing_provisional_line_major_vs_final_box_major
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: dual_variant_calculation_drifts_by_one_cent_per_retired_line
    claim_type: dual_variant_calculation
    grounds:
    - calculations.advance_box_order_pricing
    excluded_because:
      difficulty_instance: box_pricing_provisional_line_major_vs_final_box_major
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: derived_field_reconciliation_reshapes_the_order_total_on_the_second_pass
    claim_type: derived_field_reconciliation
    grounds:
    - state_machines.BoxOrder.PRICED_to_REVISED
    excluded_because:
      difficulty_instance: box_pricing_provisional_line_major_vs_final_box_major
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: pagination_with_filtering_pages_the_center_filtered_order_list
    claim_type: pagination_with_filtering
    grounds:
    - endpoints.GET_/produce/box-orders
    excluded_because:
      difficulty_instance: box_order_items_list_filters_by_line_status
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
  - name: idempotency_of_the_second_pack_attempt
    claim_type: idempotency
    grounds:
    - endpoints.POST_/produce/box-orders/{id}/pack
    excluded_because:
      difficulty_instance: box_order_resubmit_after_pack_returns_invalid_state
      rationale: "That \xA71.8 instance already exercises this complexity layer as a pinned outcome."
- section: consistency_model
  instances:
  - name: build_writes_are_visible_on_the_immediate_order_read
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - endpoints.GET_/produce/box-orders/{id}
    distinguishing_aspect: The scaffold declares immediate consistency, so every field the build writes is already present in the very next read of the order and requires no clock advance or retry.
    test_recipe:
      setup: One center, supplier, lot and customer with a WEEKLY subscription and one DRAFT order.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          im_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co IM
          region: NE
        as: PlatformAdmin
        captures:
          im_s: $.data.id
      - call: POST /produce/suppliers/${im_s}/lots
        payload:
          fulfillment_center_id: ${im_c}
          product_name: IM1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          im_l: $.data.id
          im_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${im_l}
          supplier_id: ${im_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${im_s}
      - call: POST /produce/supply-lots/${im_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${im_lv}
        as: PlatformAdmin
        captures:
          im_lv2: $.data.version
      - call: POST /produce/supply-lots/${im_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${im_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: im@example.com
          full_name: Sub Im
          service_region: NE
        as: Anonymous
        captures:
          im_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${im_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          im_sub: $.data.id
          im_subv: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${im_cu}
          subscription_id: ${im_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          im_o1: $.data.id
          im_o1v: $.data.version
      trigger:
      - call: POST /produce/box-orders/${im_o1}/build
        payload:
          expected_box_order_version: ${im_o1v}
          line_plan:
          - supply_lot_id: ${im_l}
            units: 6
        as: FulfillmentOperator
        as_user_id: ${im_c}
      - call: GET /produce/box-orders/${im_o1}
        as: PlatformAdmin
      assert:
      - the read immediately after the build reports status == BUILDING
      - the read reports pricing_status == PRICED with no further call
      - the read reports weight_total_grams == 720
      - GET /produce/supply-lots/${im_l} reports quantity_available == 294 in the same round
