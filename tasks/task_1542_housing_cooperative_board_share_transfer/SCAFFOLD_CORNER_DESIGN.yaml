scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, retrieval, listing, not-found, required
  # fields, defaults, computed fields, system fields, type constraints,
  # immutability, parent relationships
  # ===========================================================================
  - section: entities
    instances:
      - name: cooperative_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Cooperative]
        distinguishing_aspect: "Omitting optional Cooperative fields applies declared defaults (flip_tax_policy=GROSS_PERCENT, flip_tax_percent_bps=200, etc.)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Default Coop", address: "100 Main", underlying_mortgage_principal_cents: 1000000, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id, ftp: $.data.flip_tax_policy, ftb: $.data.flip_tax_percent_bps, ftps: $.data.flip_tax_per_share_cents, sublet_max: $.data.sublet_policy_years_max, grace: $.data.arrears_grace_days, clock: $.data.current_utc }
          trigger:
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
          assert:
            - "Cooperative.flip_tax_policy == GROSS_PERCENT"
            - "Cooperative.flip_tax_percent_bps == 200"
            - "Cooperative.flip_tax_per_share_cents == 50000"
            - "Cooperative.sublet_policy_years_max == 2"
            - "Cooperative.sublet_policy_gap_years == 1"
            - "Cooperative.arrears_grace_days == 10"
            - "Cooperative.arrears_termination_threshold_cents == 1000000"
            - "Cooperative.annual_meeting_quorum_percent_bps == 5000"
            - "Cooperative.current_utc == 2026-08-01T00:00:00Z  # logical clock default"
            - "Cooperative.total_shares == 0"

      - name: cooperative_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Cooperative.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cooperatives without required field name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cooperatives"
              payload: { address: "X St", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: get_nonexistent_cooperative_returns_404
        claim_type: not_found
        grounds: [entities.Cooperative, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cooperatives/{non-existent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cooperatives/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: unit_total_shares_computed_field
        claim_type: computed_field
        grounds: [entities.Cooperative.fields.total_shares, entities.Unit.fields.shares_allocated]
        distinguishing_aspect: "Cooperative.total_shares is computed — client cannot set it directly; it derives from Unit.shares_allocated sum."
        test_recipe:
          setup: ["Cooperative exists"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Computed Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 150 }
              as: PlatformAdmin
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1B", shares_allocated: 250 }
              as: PlatformAdmin
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
              captures: { total: $.data.total_shares }
          assert:
            - "Cooperative.total_shares == 400  # 150 + 250, computed server-side"

      - name: system_fields_id_created_at_updated_at_version
        claim_type: system_fields
        grounds: [entities.Cooperative]
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated; client cannot override them in POST body."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cooperatives"
              payload: { name: "SysCoop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id, v: $.data.version, ca: $.data.created_at }
          assert:
            - "Cooperative.id is a UUID (server-minted, no 'coop_' prefix)"
            - "Cooperative.created_at is ISO8601 UTC with 3 fractional digits"
            - "Cooperative.version == 1"

      - name: shareholder_email_unique_within_cooperative
        claim_type: type_constraint
        grounds: [entities.Shareholder.fields.email]
        distinguishing_aspect: "Two shareholders with same email in the same cooperative → ERR_BUSINESS_CONSTRAINT."
        test_recipe:
          setup: ["Cooperative exists with one shareholder using email dup@x.com"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Dup Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "A", email: "dup@x.com" }
              as: BoardOfficer
          trigger:
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "B", email: "dup@x.com" }
              as: BoardOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BUSINESS_CONSTRAINT"
            - "http_status == 422"

      - name: unit_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Unit, response_envelope]
        distinguishing_aspect: "GET /units supports limit/offset; envelope includes total_count and has_more."
        test_recipe:
          setup: ["Cooperative with 3 units"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Page Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "A", shares_allocated: 100 }
              as: PlatformAdmin
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "B", shares_allocated: 100 }
              as: PlatformAdmin
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "C", shares_allocated: 100 }
              as: PlatformAdmin
          trigger:
            - call: "GET /cooperatives/${cid}/units?limit=2&offset=0"
              as: PlatformAdmin
              captures: { data: $.data }
          assert:
            - "Response envelope has meta.api_request_id and meta.api_request_timestamp"
            - "data is an array of length 2"
            - "pagination fields include total_count == 3 and has_more == true"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, preconditions,
  # side effects, terminal states, idempotency, initial state
  # ===========================================================================
  - section: state_machines
    instances:
      - name: purchase_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseApplication]
        distinguishing_aspect: "Submitting an already-SUBMITTED application is an invalid transition → ERR_INVALID_STATE."
        test_recipe:
          setup: ["PurchaseApplication in SUBMITTED state"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "SM Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/purchase-applications"
              payload: { unit_id: "${uid}", seller_shareholder_id: "${sid}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 99999999 }
              as: Shareholder
              as_user_id: "${sid}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${cid}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sid}"
          trigger:
            - call: "POST /cooperatives/${cid}/purchase-applications/${app_id}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: purchase_application_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PurchaseApplication]
        distinguishing_aspect: "Once WITHDRAWN, no further transitions are permitted (terminal state lockdown)."
        test_recipe:
          setup: ["PurchaseApplication in WITHDRAWN state"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Term Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/purchase-applications"
              payload: { unit_id: "${uid}", seller_shareholder_id: "${sid}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 99999999 }
              as: Shareholder
              as_user_id: "${sid}"
              captures: { app_id: $.data.id }
            - call: "POST /cooperatives/${cid}/purchase-applications/${app_id}/withdraw"
              payload: {}
              as: Shareholder
              as_user_id: "${sid}"
          trigger:
            - call: "POST /cooperatives/${cid}/purchase-applications/${app_id}/certify"
              payload: {}
              as: ManagingAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL or ERR_INVALID_STATE"
            - "http_status in (409,)"

      - name: meeting_open_requires_notice_sent
        claim_type: precondition_enforcement
        grounds: [state_machines.Meeting]
        distinguishing_aspect: "Cannot open a Meeting whose preparation_state == PREPARING (must send-notice first)."
        test_recipe:
          setup: ["Meeting SCHEDULED with preparation_state == PREPARING"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Prep Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/meetings"
              payload: { meeting_kind: "ANNUAL", scheduled_at: "2026-08-20T18:00:00Z" }
              as: BoardOfficer
              captures: { mid: $.data.id }
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T18:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cooperatives/${cid}/meetings/${mid}/open"
              payload: {}
              as: BoardOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "preparation_state must be NOTICE_SENT before open"

      - name: resolution_withdraw_forbidden_after_vote_cast
        claim_type: invalid_transition
        grounds: [state_machines.Resolution, "errors[ERR_RESOLUTION_ALREADY_VOTED]"]
        distinguishing_aspect: "Withdraw on a Resolution that has at least one vote returns ERR_RESOLUTION_ALREADY_VOTED."
        test_recipe:
          setup: ["Resolution OPEN with one vote already cast"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "WV Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "SET_POLICY", subject_entity_kind: "Cooperative", subject_entity_id: "${cid}", payload_json: { flip_tax_percent_bps: 250 } }
              as: BoardOfficer
              captures: { rid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
          trigger:
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/withdraw"
              payload: {}
              as: BoardOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESOLUTION_ALREADY_VOTED"
            - "http_status == 409"

      - name: duplicate_vote_by_same_voter_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Resolution, "errors[ERR_VOTER_ALREADY_CAST]"]
        distinguishing_aspect: "Same BoardMember voting twice on same Resolution → ERR_VOTER_ALREADY_CAST."
        test_recipe:
          setup: ["Resolution OPEN, voter bm-1 already voted"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "DupV", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "SET_POLICY", subject_entity_kind: "Cooperative", subject_entity_id: "${cid}", payload_json: {} }
              as: BoardOfficer
              captures: { rid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "bm-1"
          trigger:
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "AGAINST" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VOTER_ALREADY_CAST"
            - "http_status == 409"

      - name: payment_void_compensation_flow
        claim_type: side_effect_execution
        grounds: [state_machines.Payment.POSTED_to_VOIDED]
        distinguishing_aspect: "Voiding a POSTED payment decrements MaintenanceCharge.paid_cents and recomputes outstanding."
        test_recipe:
          setup: ["PAST_DUE charge with one POSTED payment of 30000"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Void", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500, arrears_late_fee_flat_cents: 5000, arrears_grace_days: 5, arrears_interest_rate_bps: 0 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
              captures: { cv: $.data.version }
            - call: "POST /cooperatives/${cid}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${cv}" }
              as: BoardOfficer
              captures: { cs: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs}", payload_json: {} }
              as: BoardOfficer
              captures: { rid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cooperatives/${cid}/maintenance-charges"
              as: ManagingAgent
              captures: { mc: "$.data[0].id" }
            - call: "POST /cooperatives/${cid}/maintenance-charges/${mc}/payments"
              payload: { shareholder_id: "${sid}", amount_cents: 30000 }
              as: ManagingAgent
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /cooperatives/${cid}/payments/${pid}/void"
              payload: {}
              as: ManagingAgent
            - call: "GET /cooperatives/${cid}/maintenance-charges/${mc}"
              as: ManagingAgent
              captures: { paid: $.data.paid_cents, out: $.data.outstanding_cents }
          assert:
            - "After void: paid_cents == 0"
            - "outstanding_cents == 105000 (restored to base 100000 + late_fee 5000)"

  # ===========================================================================
  # Section: calculations — precision, constants, boundary, input-set filter
  # ===========================================================================
  - section: calculations
    instances:
      - name: arrears_late_fee_boundary_exact_grace_day
        claim_type: correct_result
        grounds: [calculations.arrears_late_fee, entities.Cooperative.fields.arrears_grace_days]
        distinguishing_aspect: "At current_utc == due_date + grace_days exactly, charge is NOT yet PAST_DUE; one second later it is."
        excluded_because:
          difficulty_instance: boundary_precision_check / arrears_termination_threshold_boundary
          rationale: "Boundary semantic (> grace_days, not >=) is the core mechanism asserted by the named §1.8 instance."

      - name: sublet_fee_is_15_percent_of_base
        claim_type: constants_applied
        grounds: [calculations.sublet_monthly_fee]
        distinguishing_aspect: "monthly_sublet_fee_cents = round_half_up(0.15 × base maintenance) on SubletAgreement SUBMITTED→APPROVED."
        test_recipe:
          setup:
            - "Cooperative, unit 100 shares, shareholder GOOD_STANDING"
            - "APPROVED schedule yielding monthly base = 100000 cents (annual 1200000)"
            - "SubletAgreement SUBMITTED for window 2027-01 to 2028-01"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Fee Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500, sublet_policy_gap_years: 0 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
              captures: { cv: $.data.version }
            - call: "POST /cooperatives/${cid}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${cv}" }
              as: BoardOfficer
              captures: { cs: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs}", payload_json: {} }
              as: BoardOfficer
              captures: { rid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
            - call: "POST /cooperatives/${cid}/sublet-agreements"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", subtenant_name: "T", sublet_start_date: "2026-09-01T00:00:00Z", sublet_end_date: "2027-09-01T00:00:00Z" }
              as: Shareholder
              as_user_id: "${sid}"
              captures: { subid: $.data.id }
            - call: "POST /cooperatives/${cid}/sublet-agreements/${subid}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sid}"
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "APPROVE_SUBLET", subject_entity_kind: "SubletAgreement", subject_entity_id: "${subid}", payload_json: {} }
              as: BoardOfficer
              captures: { sres: $.data.id }
          trigger:
            - call: "POST /cooperatives/${cid}/resolutions/${sres}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${sres}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${sres}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
            - call: "GET /cooperatives/${cid}/sublet-agreements/${subid}"
              as: BoardOfficer
              captures: { fee: $.data.monthly_sublet_fee_cents, status: $.data.sublet_status }
          assert:
            - "SubletAgreement.sublet_status == APPROVED"
            - "SubletAgreement.monthly_sublet_fee_cents == 15000  # round_half_up(100000 * 1500 / 10000)"

      - name: quorum_ceiling_division_precision
        claim_type: precision
        grounds: [calculations.quorum_check]
        distinguishing_aspect: "Quorum threshold uses ceiling division: total=3 shares at 50% → ceil(1.5)=2 shares required."
        test_recipe:
          setup:
            - "Cooperative with total_shares=3 (three 1-share units), quorum 5000 bps (50%)"
            - "Threshold = ceil(3 * 5000/10000) = ceil(1.5) = 2 shares"
            - "Meeting IN_SESSION"
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Ceil Coop", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500, annual_meeting_quorum_percent_bps: 5000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "A", shares_allocated: 1 }
              as: PlatformAdmin
              captures: { ua: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "B", shares_allocated: 1 }
              as: PlatformAdmin
              captures: { ub: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "C", shares_allocated: 1 }
              as: PlatformAdmin
              captures: { uc: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "SA", email: "sa@x.com" }
              as: BoardOfficer
              captures: { sha: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "SB", email: "sb@x.com" }
              as: BoardOfficer
              captures: { shb: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${ua}", shareholder_id: "${sha}", shares_held: 1 }
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${ub}", shareholder_id: "${shb}", shares_held: 1 }
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/meetings"
              payload: { meeting_kind: "ANNUAL", scheduled_at: "2026-08-20T18:00:00Z" }
              as: BoardOfficer
              captures: { mid: $.data.id }
            - call: "POST /cooperatives/${cid}/meetings/${mid}/send-notice"
              payload: {}
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T18:30:00Z" }
              as: PlatformAdmin
            - call: "POST /cooperatives/${cid}/meetings/${mid}/open"
              payload: {}
              as: BoardOfficer
          trigger:
            # Only shareholder A (1 share) votes — below threshold
            - call: "POST /cooperatives/${cid}/meetings/${mid}/ballots"
              payload: { shareholder_id: "${sha}", ballot_kind: "IN_PERSON", candidate_user_ids: ["c1"] }
              as: Shareholder
              as_user_id: "${sha}"
            - call: "GET /cooperatives/${cid}/meetings/${mid}"
              as: BoardOfficer
              captures: { q1: $.data.quorum_state, sr1: $.data.shares_represented }
            # Now B votes (adds 1 share → total 2 = threshold)
            - call: "POST /cooperatives/${cid}/meetings/${mid}/ballots"
              payload: { shareholder_id: "${shb}", ballot_kind: "PROXY", candidate_user_ids: ["c1"] }
              as: Shareholder
              as_user_id: "${shb}"
            - call: "GET /cooperatives/${cid}/meetings/${mid}"
              as: BoardOfficer
              captures: { q2: $.data.quorum_state, sr2: $.data.shares_represented }
          assert:
            - "After 1 share: shares_represented == 1, quorum_state == QUORUM_PENDING"
            - "After 2 shares: shares_represented == 2, quorum_state == QUORUM_MET"
            - "Ceiling of 1.5 is 2 — exact boundary verifies ceiling division"

