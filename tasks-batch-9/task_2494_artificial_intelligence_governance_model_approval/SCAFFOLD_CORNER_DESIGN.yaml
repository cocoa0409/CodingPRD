        distinguishing_aspect: "grant-grace is declared only out of DISCOVERED, so a second grant on a GRACE_GRANTED deployment is refused 409 ERR_SHADOW_NOT_ACTIONABLE - which is also why grace_days cannot be accumulated by repeated calls."
        test_recipe:
          setup: ["One SANDBOX shadow deployment discovered 2026-08-01T00:00:00Z (BASE_GRACE_DAYS 30) with a 10-day extension already granted, so grace_deadline_at is 2026-09-10T00:00:00Z and the clock is well inside it."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
