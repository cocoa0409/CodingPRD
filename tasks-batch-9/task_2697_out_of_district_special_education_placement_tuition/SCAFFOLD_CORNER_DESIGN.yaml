  # ===========================================================================
  # Table 7 (RBAC) - per-role exclusive/shared operations plus the declared
  # role_model: segregation_of_duties. Note that both SOD pairs are keyed on
  # X-User-ID, not on role, so no role substitution can evade them.
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_exercises_its_own_exclusive_and_shared_operations
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - "roles.TeamChair.exclusive_operations"
          - "roles.PlacementCoordinator.exclusive_operations"
          - "roles.FiscalOfficer.exclusive_operations"
          - "roles.SchoolBillingAgent.exclusive_operations"
          - "roles.SystemAdmin.exclusive_operations"
          - "roles.ParentGuardian.shared_operations"
          - "roles.HearingAdjudicator.shared_operations"
        distinguishing_aspect: |
          The positive half of RBAC: one continuous workflow in which every role touches only what
          it owns and each call succeeds. TeamChair approves, PlacementCoordinator places, activates
          and verifies, FiscalOfficer executes the contract, SchoolBillingAgent submits and amends
          attendance under its own school id, SystemAdmin drives the clock and reference data,
          ParentGuardian edits its own student's Medicaid consent, and HearingAdjudicator reads.
          An implementation that over-restricts - for instance requiring SystemAdmin for the clock
          AND for placement writes - fails here even though it passes every negative RBAC test.
          HearingAdjudicator's two exclusive adjudication operations are exercised positively by the
          reimbursement instances in the difficulty design.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000, Harbor Academy APPROVED with a STATE_APPROVED FY2027 schedule."
            - "One student and one PlacementDecision for a DAY placement sitting in TEAM_REVIEW."
