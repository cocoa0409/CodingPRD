            - "EntityPeriod.${ep_id}.nci_share_minor == 0 exactly (ownership 100 → no NCI split)"

      - name: flux_variant_excluded_because_covered
        claim_type: variant_divergence
        grounds: ["calculations.flux_variance"]
        excluded_because:
          difficulty_instance: flux_variance_materiality_or_pct_tiered_gate
          rationale: "The OR-gate + denominator-floor divergence and the >= boundaries are asserted in the named §1.8 combinatorial_formula instance."

      - name: translation_dual_variant_excluded_because_covered
        claim_type: variant_divergence
        grounds: ["calculations.currency_translation"]
        excluded_because:
          difficulty_instance: currency_translation_current_rate_vs_temporal_cta_divergence
          rationale: "Current-rate vs temporal CTA divergence asserted in the named §1.8 dual_variant_calc instance."

      - name: recon_tolerance_boundary_is_within_tolerance
        claim_type: correct_result
        grounds: ["calculations.recon_aging", "entities.Reconciliation.fields.is_within_tolerance"]
        distinguishing_aspect: "is_within_tolerance uses abs(difference) <= 500: a difference of exactly 500 is within tolerance (true), 501 is not (false). Tests the <= edge on the reconciliation tolerance constant."
        test_recipe:
          setup: ["Period opened; entity-period; two reconciliations with differences exactly 500 and 501"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "1010", recon_type: BANK, gl_balance_minor: 100500, subledger_balance_minor: 100000 }
              as: Preparer
              captures: { rec500: $.data.id, tol500: $.data.is_within_tolerance }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "1020", recon_type: BANK, gl_balance_minor: 100501, subledger_balance_minor: 100000 }
              as: Preparer
              captures: { rec501: $.data.id, tol501: $.data.is_within_tolerance }
          trigger:
            - { call: "GET /close/entity-periods/${ep_id}/reconciliations", payload: {}, as: Preparer }
          assert:
            - "Reconciliation.${rec500}.is_within_tolerance == true (abs(500) <= 500, inclusive)"
            - "Reconciliation.${rec501}.is_within_tolerance == false (abs(501) > 500)"

