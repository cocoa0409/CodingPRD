scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "endpoints.POST /api/customers"
          - "entities.Customer.fields.loyalty_tier"
        distinguishing_aspect: "POST /api/customers with the four required fields returns 201 with loyalty_points_balance 0, lifetime_points_earned 0, loyalty_tier BRONZE, status ACTIVE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "New Cust", email: "new.c@x.com", date_of_birth: "1990-06-15", residency_state: "CA" }
              as: ShopClerk
              captures: { cust_id: "$.data.id" }
          assert:
            - "Customer.${cust_id}.loyalty_points_balance == 0"
            - "Customer.${cust_id}.lifetime_points_earned == 0"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"
            - "Customer.${cust_id}.status == ACTIVE"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "endpoints.GET /api/customers/{id}"
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "GET /api/customers with a random non-existent UUID returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_CUSTOMER_NOT_FOUND"

      - name: create_customer_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - "endpoints.POST /api/customers"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /api/customers omitting the required date_of_birth field returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "No DOB", email: "nodob@x.com", residency_state: "CA" }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_VALIDATION"

      - name: product_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - "endpoints.POST /api/products"
          - "entities.Product.fields.status"
        distinguishing_aspect: "POST /api/products mints id/created_at/version and defaults status ACTIVE; client cannot set version."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "ROD-1", name: "Ugly Stik", category: "ROD", unit_price_cents: 5999, stock_qty: 10 }
              as: ShopManager
              captures: { pid: "$.data.id" }
          assert:
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.version == 1"

      - name: license_type_creation_and_fetch_immutable_no_version
        claim_type: Immutability
        grounds:
          - "endpoints.POST /api/license-types"
          - "endpoints.GET /api/license-types/{id}"
        distinguishing_aspect: "LicenseType is common_fields:false (config): created then fetched by id; it carries id and created_at but no version/update endpoint."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /api/license-types"
              payload: { code: "CA-IMM", state_code: "CA", license_class: "NONRESIDENT", base_price_cents: 8000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
          trigger:
            - call: "GET /api/license-types/${lt_id}"
              payload: {}
              as: ShopClerk
              captures: { got: "$.data.base_price_cents" }
          assert:
            - "LicenseType.${lt_id}.base_price_cents == 8000"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: void_already_voided_license_returns_already_voided
        claim_type: invalid_transition
        grounds:
          - "state_machines.LicenseSale.ACTIVE_to_VOIDED"
          - "errors[ERR_ALREADY_VOIDED]"
        distinguishing_aspect: "A second void on a license already VOIDED is rejected ERR_ALREADY_VOIDED; no further loyalty reversal occurs."
        test_recipe:
          setup:
            - "Clock 2026-07-10. Customer M holds a license that has already been voided once."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Void", email: "m.sv1@x.com", date_of_birth: "1980-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-V1", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id" }
            - call: "POST /api/license-sales/${ls_id}/void"
              payload: {}
              as: ShopClerk
          trigger:
            - call: "POST /api/license-sales/${ls_id}/void"
              payload: {}
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ALREADY_VOIDED"

      - name: checkin_without_payment_returns_payment_required
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.CharterBooking.RESERVED_to_CHECKED_IN"
          - "errors[ERR_PAYMENT_REQUIRED]"
        distinguishing_aspect: "Check-in on a RESERVED but UNPAID booking is rejected ERR_PAYMENT_REQUIRED (cross-dimension precondition: payment_status must be PAID)."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Customer M (license) has a RESERVED, UNPAID booking on charter C (2026-08-03)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M NoPay", email: "m.sv2@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-V2", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap P", license_no: "P-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "Unpaid", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 1 }
              as: ShopClerk
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /api/charter-bookings/${b_id}/check-in"
              payload: {}
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_PAYMENT_REQUIRED"

      - name: customer_initiated_cancel_partial_refund_within_48h
        claim_type: side_effect_execution
        grounds:
          - "calculations.charter_cancellation_refund"
          - "state_machines.CharterBooking.RESERVED_to_CANCELLED"
          - "entities.CharterBooking.fields.refund_amount_cents"
        distinguishing_aspect: "A customer-initiated cancel 24h before start (< 48h) refunds half of amount_paid: paid 10000 -> refund 5000, payment_status REFUNDED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00Z. Customer M (license) has a PAID booking (1 seat, paid 10000) on charter starting 2026-08-02T09:00Z (24h out)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Part", email: "m.sv3@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-V3", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap Q", license_no: "Q-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "Soon", start_at: "2026-08-02T09:00:00Z", end_at: "2026-08-02T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 1 }
              as: ShopClerk
              captures: { b_id: "$.data.id" }
            - call: "POST /api/charter-bookings/${b_id}/pay"
              payload: {}
              as: ShopClerk
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /api/charter-bookings/${b_id}/cancel"
              payload: {}
              as: ShopClerk
          assert:
            - "CharterBooking.${b_id}.refund_amount_cents == 5000"
            - "CharterBooking.${b_id}.payment_status == REFUNDED"
            - "CharterBooking.${b_id}.booking_status == CANCELLED"

      - name: tournament_finalize_ranks_winner_and_awards_prize_points
        claim_type: side_effect_execution
        grounds:
          - "calculations.tournament_ranking"
          - "state_machines.TournamentEntry.WEIGHED_to_WINNER"
          - "entities.TournamentEntry.fields.final_rank"
          - "entities.Customer.fields.loyalty_points_balance"
        distinguishing_aspect: "Finalize ranks two qualifying entries by best weight DESC: the 5000 g entry wins (final_rank 1, status WINNER) over the 4000 g entry, and the winner's customer gains prize_points 300."
        test_recipe:
          setup:
            - "Clock 2026-07-22T08:00Z. Tournament T (BASS, 06:00-18:00, min 1000, prize_points 300) IN_PROGRESS with two CHECKED_IN entries E1 (customer C1) and E2 (customer C2); E1 weighed 5000 g, E2 weighed 4000 g."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-22T08:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "C1", email: "c1.sv4@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "C2", email: "c2.sv4@x.com", date_of_birth: "1991-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c2_id: "$.data.id" }
            - call: "POST /api/tournaments"
              payload: { name: "Bass Blitz", species: "BASS", start_at: "2026-07-22T06:00:00Z", end_at: "2026-07-22T18:00:00Z", min_qualifying_weight_grams: 1000, prize_points: 300 }
              as: ShopManager
              captures: { t_id: "$.data.id" }
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "OPEN" }
              as: ShopManager
            - call: "POST /api/tournament-entries"
              payload: { tournament_id: "${t_id}", customer_id: "${c1_id}" }
              as: ShopClerk
              captures: { e1_id: "$.data.id" }
            - call: "POST /api/tournament-entries"
              payload: { tournament_id: "${t_id}", customer_id: "${c2_id}" }
              as: ShopClerk
              captures: { e2_id: "$.data.id" }
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "IN_PROGRESS" }
              as: ShopManager
            - call: "POST /api/tournament-entries/${e1_id}/status"
              payload: { status: "CHECKED_IN" }
              as: ShopClerk
            - call: "POST /api/tournament-entries/${e2_id}/status"
              payload: { status: "CHECKED_IN" }
              as: ShopClerk
            - call: "POST /api/tournament-entries/${e1_id}/weigh-in"
              payload: { species: "BASS", weight_grams: 5000 }
              as: ShopClerk
            - call: "POST /api/tournament-entries/${e2_id}/weigh-in"
              payload: { species: "BASS", weight_grams: 4000 }
              as: ShopClerk
          trigger:
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "FINALIZED" }
              as: ShopManager
          assert:
            - "TournamentEntry.${e1_id}.final_rank == 1"
            - "TournamentEntry.${e1_id}.status == WINNER"
            - "TournamentEntry.${e2_id}.final_rank == 2"
            - "Customer.${c1_id}.loyalty_points_balance == 300"

      - name: terminal_completed_booking_cannot_cancel
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CharterBooking.CHECKED_IN_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a COMPLETED booking (terminal) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Customer M (license) completed a booking on charter C (2026-08-04)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "M Done", email: "m.sv5@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-V5", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap R", license_no: "R-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "DoneTrip", start_at: "2026-08-04T09:00:00Z", end_at: "2026-08-04T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 1 }
              as: ShopClerk
              captures: { b_id: "$.data.id" }
            - call: "POST /api/charter-bookings/${b_id}/pay"
              payload: {}
              as: ShopClerk
            - call: "POST /api/charter-bookings/${b_id}/check-in"
              payload: {}
              as: ShopClerk
            - call: "POST /api/charter-bookings/${b_id}/complete"
              payload: {}
              as: ShopClerk
          trigger:
            - call: "POST /api/charter-bookings/${b_id}/cancel"
              payload: {}
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: duplicate_tournament_entry_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_DUPLICATE_ENTRY]"
        distinguishing_aspect: "Registering the same customer twice in one OPEN tournament is rejected ERR_DUPLICATE_ENTRY."
        test_recipe:
          setup:
            - "Tournament T OPEN; Customer C already REGISTERED."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Dup", email: "c.sv6@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/tournaments"
              payload: { name: "Dup Cup", species: "BASS", start_at: "2026-07-26T06:00:00Z", end_at: "2026-07-26T18:00:00Z", min_qualifying_weight_grams: 500 }
              as: ShopManager
              captures: { t_id: "$.data.id" }
            - call: "POST /api/tournaments/${t_id}/status"
              payload: { status: "OPEN" }
              as: ShopManager
            - call: "POST /api/tournament-entries"
              payload: { tournament_id: "${t_id}", customer_id: "${c_id}" }
              as: ShopClerk
          trigger:
            - call: "POST /api/tournament-entries"
              payload: { tournament_id: "${t_id}", customer_id: "${c_id}" }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DUPLICATE_ENTRY"

      - name: service_ready_insufficient_stock_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_INSUFFICIENT_STOCK]"
        distinguishing_aspect: "Moving a ServiceOrder to READY with line_units 5 while product stock is 3 is rejected ERR_INSUFFICIENT_STOCK; no stock is deducted."
        test_recipe:
          setup:
            - "Customer C; Product P stock 3; ServiceOrder S DIAGNOSED then IN_PROGRESS."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Low", email: "c.sv7@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
            - call: "POST /api/products"
              payload: { sku: "LINE-LOW", name: "low", category: "LINE", unit_price_cents: 0, stock_qty: 3 }
              as: ShopManager
              captures: { p_id: "$.data.id" }
            - call: "POST /api/service-orders"
              payload: { customer_id: "${c_id}", service_type: "SPOOLING", base_service_cents: 2500, product_id: "${p_id}", line_price_cents_per_meter: 30, estimated_line_meters: 100 }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "IN_PROGRESS" }
              as: ShopClerk
          trigger:
            - call: "POST /api/service-orders/${s_id}/transition"
              payload: { to_status: "READY", actual_line_meters: 120, parts_cents: 0, line_units: 5 }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INSUFFICIENT_STOCK"
            - "Product.${p_id}.stock_qty == 3"

      - name: error_charter_state_beats_capacity_covered_by_difficulty
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_CHARTER_NOT_OPEN]"
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / booking_state_beats_seat_capacity"
          rationale: "Booking against a CANCELLED charter (ERR_CHARTER_NOT_OPEN) is exercised as the winning error of the named §1.8 priority-conflict instance."

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: license_price_youth_tier_selected
        claim_type: correct_result
        grounds:
          - "calculations.license_price"
          - "entities.LicenseType.fields.youth_price_cents"
        distinguishing_aspect: "A 10-year-old (age <= youth_max_age 15) selects youth_price 1000 with no peak surcharge (clock in March), so price_paid_cents == 1000 (youth branch, distinct from the adult branch in §1.8)."
        test_recipe:
          setup:
            - "Clock 2026-03-10 (outside peak months 6-8). Customer Y age 10 (dob 2016-01-01). LicenseType LT tiered (base 4000, youth<=15 ->1000, peak 6-8 +500, min_age 0)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "Y Kid", email: "y.ca1@x.com", date_of_birth: "2016-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { y_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-YT", state_code: "CA", license_class: "RESIDENT", base_price_cents: 4000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365, youth_max_age: 15, youth_price_cents: 1000, senior_min_age: 65, senior_price_cents: 2000, peak_surcharge_cents: 500, peak_start_month: 6, peak_end_month: 8 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
          trigger:
            - call: "POST /api/license-sales"
              payload: { customer_id: "${y_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id" }
          assert:
            - "LicenseSale.${ls_id}.price_paid_cents == 1000"

      - name: license_void_prorated_after_grace
        claim_type: variant_selection
        grounds:
          - "calculations.license_void_refund"
          - "entities.LicenseSale.fields.refund_amount_cents"
        distinguishing_aspect: "Voiding 41 days after a 4500-cent, 365-day license (past the 7-day grace) selects the PRORATED variant: round(4500 * (365-41)/365) = 3995."
        test_recipe:
          setup:
            - "Clock 2026-07-10 at issue; a tiered license priced 4500 (adult+peak) is sold, then the clock advances to 2026-08-20 (41 days later)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "A Pro", email: "a.ca2@x.com", date_of_birth: "1986-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { a_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-PR", state_code: "CA", license_class: "RESIDENT", base_price_cents: 4000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365, peak_surcharge_cents: 500, peak_start_month: 6, peak_end_month: 8 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${a_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { ls_id: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /api/license-sales/${ls_id}/void"
              payload: {}
              as: ShopClerk
          assert:
            - "LicenseSale.${ls_id}.refund_amount_cents == 3995"

      - name: loyalty_tier_boundary_exactly_500_is_silver
        claim_type: constants_applied
        grounds:
          - "calculations.loyalty_tier"
          - "entities.Customer.fields.loyalty_tier"
        distinguishing_aspect: "A manual +500 adjustment sets lifetime_points_earned to exactly SILVER_THRESHOLD (500), so loyalty_tier is SILVER (inclusive boundary), whereas +499 would remain BRONZE."
        test_recipe:
          setup:
            - "Customer C at 0 lifetime points."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Edge", email: "c.ca3@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/customers/${c_id}/loyalty-adjustments"
              payload: { points_delta: 500, reason: "boundary" }
              as: ShopManager
          assert:
            - "Customer.${c_id}.loyalty_tier == SILVER"
            - "Customer.${c_id}.lifetime_points_earned == 500"

  # =================================================================
  # Validations
  # =================================================================
  - section: validations
    instances:
      - name: loyalty_adjustment_below_zero_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_INSUFFICIENT_POINTS]"
        distinguishing_aspect: "A -100 adjustment on a customer with balance 0 is rejected ERR_INSUFFICIENT_POINTS (402); balance stays 0."
        test_recipe:
          setup:
            - "Customer C balance 0."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Neg", email: "c.va1@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/customers/${c_id}/loyalty-adjustments"
              payload: { points_delta: -100, reason: "overdraw" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INSUFFICIENT_POINTS"
            - "Customer.${c_id}.loyalty_points_balance == 0"

      - name: license_sale_out_of_season_alone_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_LICENSE_OUT_OF_SEASON]"
        distinguishing_aspect: "An age-qualified adult buying a license before its season window is rejected ERR_LICENSE_OUT_OF_SEASON (isolates the temporal rule from the age rule that co-fires in §1.8)."
        test_recipe:
          setup:
            - "Clock 2026-07-10 (before season 2026-08-01). Customer A age 40 (dob 1986). LicenseType requires min_age 16 and season 2026-08-01..2026-12-31."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "A OldEnough", email: "a.va2@x.com", date_of_birth: "1986-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { a_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-SEAS", state_code: "CA", license_class: "RESIDENT", base_price_cents: 5000, min_age: 16, season_start_date: "2026-08-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
          trigger:
            - call: "POST /api/license-sales"
              payload: { customer_id: "${a_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_LICENSE_OUT_OF_SEASON"

      - name: suspended_customer_cannot_book
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CUSTOMER_SUSPENDED]"
        distinguishing_aspect: "A SUSPENDED customer (even with an ACTIVE license) is blocked from booking with ERR_CUSTOMER_SUSPENDED."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Customer S has an ACTIVE license but is SUSPENDED. Charter C OPEN (2026-08-06)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/customers"
              payload: { full_name: "S Susp", email: "s.va3@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { s_id: "$.data.id" }
            - call: "POST /api/license-types"
              payload: { code: "CA-SU", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${s_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/customers/${s_id}/status"
              payload: { status: "SUSPENDED" }
              as: ShopManager
            - call: "POST /api/guides"
              payload: { name: "Cap S", license_no: "S-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "OpenS", start_at: "2026-08-06T09:00:00Z", end_at: "2026-08-06T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${s_id}", seats: 1 }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_CUSTOMER_SUSPENDED"

  # =================================================================
  # Endpoints
  # =================================================================
  - section: endpoints
    instances:
      - name: list_charter_bookings_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET /api/charter-bookings"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: "GET /api/charter-bookings?limit=1 over a charter with 2 bookings returns 1 item with total_count 2 and has_more true."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Charter C (cap 4) with two bookings from two licensed customers."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-PG", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "P1", email: "p1.ep1@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${c1_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/customers"
              payload: { full_name: "P2", email: "p2.ep1@x.com", date_of_birth: "1986-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c2_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${c2_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap T", license_no: "T-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "PageTrip", start_at: "2026-08-07T09:00:00Z", end_at: "2026-08-07T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${c1_id}", seats: 1 }
              as: ShopClerk
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${c2_id}", seats: 1 }
              as: ShopClerk
          trigger:
            - call: "GET /api/charter-bookings?charter_id=${c_id}&limit=1&offset=0"
              payload: {}
              as: ShopClerk
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "len(data) == 1"

      - name: reschedule_charter_updates_window_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - "endpoints.PUT /api/charters/{id}"
          - "entities.Charter.fields.version"
        distinguishing_aspect: "PUT /api/charters/{id} with the correct expected_charter_version reschedules the window and increments version 1 -> 2."
        test_recipe:
          setup:
            - "Guide G with charter C (version 1) at 2026-08-08 09:00-12:00."
          setup_api_calls:
            - call: "POST /api/guides"
              payload: { name: "Cap U", license_no: "U-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "Resch", start_at: "2026-08-08T09:00:00Z", end_at: "2026-08-08T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id", cv: "$.data.version" }
          trigger:
            - call: "PUT /api/charters/${c_id}"
              payload: { expected_charter_version: "${cv}", start_at: "2026-08-08T13:00:00Z", end_at: "2026-08-08T16:00:00Z" }
              as: ShopManager
          assert:
            - "Charter.${c_id}.version == 2"
            - "Charter.${c_id}.start_at == 2026-08-08T13:00:00Z"

  # =================================================================
  # Errors  (triggerability of remaining catalog entries)
  # =================================================================
  - section: errors
    instances:
      - name: charter_not_found_on_booking
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CHARTER_NOT_FOUND]"
        distinguishing_aspect: "Booking against a non-existent charter_id returns ERR_CHARTER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Customer C (no charter exists)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C NF", email: "c.er1@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "00000000-0000-4000-8000-0000000000ab", customer_id: "${c_id}", seats: 1 }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_CHARTER_NOT_FOUND"

      - name: service_order_not_found_on_transition
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SERVICE_ORDER_NOT_FOUND]"
        distinguishing_aspect: "Transitioning a non-existent service order returns ERR_SERVICE_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /api/service-orders/00000000-0000-4000-8000-0000000000cd/transition"
              payload: { to_status: "DIAGNOSED" }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_SERVICE_ORDER_NOT_FOUND"

  # =================================================================
  # RBAC
  # =================================================================
  - section: rbac
    instances:
      - name: clerk_cannot_suspend_customer
        claim_type: unauthorized_operation
        grounds:
          - "roles.ShopClerk"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "customers/{id}/status is a ShopManager exclusive; a ShopClerk attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "Customer C ACTIVE."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Auth", email: "c.rb1@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/customers/${c_id}/status"
              payload: { status: "SUSPENDED" }
              as: ShopClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: customer_cannot_create_license_type
        claim_type: unauthorized_operation
        grounds:
          - "roles.Customer"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "license-types creation is a ShopManager exclusive; a Customer attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "Customer C registered (acts with its own id)."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C Role", email: "c.rb2@x.com", date_of_birth: "1990-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/license-types"
              payload: { code: "X", state_code: "CA", license_class: "RESIDENT", base_price_cents: 1000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_UNAUTHORIZED"

  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_charter_version_reschedule_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[charter-reschedule-stale]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After one successful reschedule advances Charter.version 1 -> 2, a second reschedule still carrying the original expected_charter_version (1) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Guide G with charter C (version 1) at 2026-08-09 09:00-12:00."
          setup_api_calls:
            - call: "POST /api/guides"
              payload: { name: "Cap V", license_no: "V-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "OCC", start_at: "2026-08-09T09:00:00Z", end_at: "2026-08-09T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c_id: "$.data.id", cv1: "$.data.version" }
            - call: "PUT /api/charters/${c_id}"
              payload: { expected_charter_version: "${cv1}", start_at: "2026-08-09T13:00:00Z", end_at: "2026-08-09T16:00:00Z" }
              as: ShopManager
          trigger:
            - call: "PUT /api/charters/${c_id}"
              payload: { expected_charter_version: "${cv1}", start_at: "2026-08-09T17:00:00Z", end_at: "2026-08-09T19:00:00Z" }
              as: ShopManager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_STALE_VERSION"
            - "Charter.${c_id}.version == 2"

      - name: guide_suspend_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Guide.AVAILABLE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: "transitive_cascade / guide_suspend_depth2_cancel_charter_then_refund_booking"
          rationale: "The guide-suspend -> charter-cancel -> booking-refund cascade is fully asserted by the named §1.8 depth-2 instance."

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: booking_create_immediately_reflects_provisional_total
        claim_type: immediate_consistency
        grounds:
          - "endpoints.POST /api/charter-bookings"
          - "entities.CharterBooking.fields.provisional_total_cents"
        distinguishing_aspect: "The booking create response itself already carries provisional_total_cents (1 seat * 12000 + 1 * 1000 = 13000) in the same request — immediate consistency."
        test_recipe:
          setup:
            - "Clock 2026-07-15. Charter C price 12000 fuel 1000; Customer M licensed."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/license-types"
              payload: { code: "CA-IM", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
            - call: "POST /api/customers"
              payload: { full_name: "M Imm", email: "m.cm1@x.com", date_of_birth: "1985-01-01", residency_state: "CA" }
              as: ShopClerk
              captures: { m_id: "$.data.id" }
            - call: "POST /api/license-sales"
              payload: { customer_id: "${m_id}", license_type_id: "${lt_id}" }
              as: ShopClerk
            - call: "POST /api/guides"
              payload: { name: "Cap W", license_no: "W-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "ImmTrip", start_at: "2026-08-11T09:00:00Z", end_at: "2026-08-11T12:00:00Z", capacity: 4, price_per_seat_cents: 12000, fuel_surcharge_cents: 1000 }
              as: ShopManager
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/charter-bookings"
              payload: { charter_id: "${c_id}", customer_id: "${m_id}", seats: 1 }
              as: ShopClerk
              captures: { b_id: "$.data.id", prov: "$.data.provisional_total_cents" }
          assert:
            - "CharterBooking.${b_id}.provisional_total_cents == 13000"
