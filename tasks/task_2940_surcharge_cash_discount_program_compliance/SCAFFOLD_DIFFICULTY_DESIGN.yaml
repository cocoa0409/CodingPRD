          assert:
            - "After trigger step 1 (SUSPEND): SurchargeProgram.${prog_id}.status == SUSPENDED and disable_reason == OPERATOR_SUSPENSION"
            - "After trigger step 2 (RESUME): SurchargeProgram.${prog_id}.status == ACTIVE and disable_reason == NONE"
            - "After trigger step 3 (law change to prohibited): SurchargeProgram.${prog_id}.status == DISABLED and disable_reason == JURISDICTION_PROHIBITION"
            - "After trigger step 4 (law change back to permitted): SurchargeProgram.${prog_id}.status == SUSPENDED and disable_reason == OPERATOR_SUSPENSION"
            - "After trigger step 5 (RESUME): SurchargeProgram.${prog_id}.status == ACTIVE and disable_reason == NONE"
