        grounds:
          - state_machines.PersonalRepresentative.NOMINATED_to_APPOINTED
          - state_machines.Petition.PENDING_to_GRANTED
          - validations[priority=9]
        distinguishing_aspect: |
          PR appoint depends on the referenced Petition being GRANTED (PR->Petition
          pair). With the petition still PENDING, appoint fails ERR_CROSS_ENTITY_STATE.
        test_recipe:
          setup:
            - "A DRAFT estate with a PENDING petition and a NOMINATED PR referencing it (INDEPENDENT gross so no bond required)."
          setup_api_calls:
            - call: "POST /estates"
              payload: { decedent_name: "CE1", date_of_death: "2026-04-01T00:00:00Z", county_code: "LA", estate_type: "INTESTATE", gross_estate_value_cents: 300000 }
