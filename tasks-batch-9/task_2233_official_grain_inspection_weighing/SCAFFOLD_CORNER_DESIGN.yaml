# =============================================================================
# Task 2233 — Official Grain Inspection & Weighing
# §1.9 Scaffold Corner Design — breadth coverage index for every testable claim
# in SCAFFOLD.yaml §1.1–§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does
# not already assert. Sections and claim_type values come from
# references/claim-extraction-guide.md; corners already exercised by a §1.8
# instance appear as `excluded_because:` stubs naming that instance.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: inspection_request_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - "entities.InspectionRequest"
          - "endpoints[POST /grain-inspection/inspection-requests]"
          - "entities.InspectionRequest.fields.certified_quantity_bushels"
        distinguishing_aspect: "A request created with the minimum required body must come back 201 with all system and computed fields materialised — grading_status OPEN, weighing_status PENDING because WEIGHING was requested, certified_quantity_bushels falling back to declared_quantity_bushels, grade_revision_count 0 and version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One DESIGNATED service area and one applicant exist; nothing else."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-100", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-CREATE", declared_quantity_bushels: 4000, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
          assert:
            - "201; response envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == object and data"
            - "data.id is a bare UUID with no type prefix; data.version == 1; created_at == updated_at == 2026-08-03T09:00:00.000Z"
            - "grading_status == OPEN, weighing_status == PENDING (WEIGHING was requested), certified_quantity_bushels == 4000, grade_revision_count == 0"
            - "GET /grain-inspection/inspection-requests/${req} returns byte-identical business fields (consistency_model immediate)"
            - "A second request omitting WEIGHING from requested_services has weighing_status == NOT_REQUIRED"
        
      - name: sample_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.Sample.fields.sample_type"
          - "entities.Sample.fields.integrity_status"
          - "entities.Sample.fields.portions_available"
          - "entities.Sample.fields.file_retention_until"
        distinguishing_aspect: "Omitting sample_type must yield ORIGINAL, integrity_status must default to SEALED, portions_consumed and portions_retained to 0, portions_available to portions_count, and collected_at / file_retention_until must be stamped from the logical clock rather than from wall time."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING; one CORN request in grading_status OPEN."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-101", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1101", full_name: "S. Sampler", endorsements: ["SAMPLING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-DEF", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-DEF", declared_quantity_bushels: 4000, requested_services: ["GRADING"] }
              captures: { req: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-DEF", portions_count: 3 }
              captures: { smp: "$.data.id" }
          assert:
            - "201; sample_type == ORIGINAL (default applied), integrity_status == SEALED, portions_consumed == 0, portions_retained == 0, portions_available == 3"
            - "collected_at == 2026-08-03T09:00:00.000Z and file_retention_until == 2026-11-01T09:00:00.000Z (90 days later, from the logical clock)"
            - "GET /grain-inspection/inspection-requests/${req} -> grading_status == SAMPLED (sampling advanced the grading dimension)"
            - "Omitting portions_count -> 422 ERR_INVALID_REQUEST (no default exists); portions_count 11 -> 422 ERR_INVALID_REQUEST (range 1..10)"

      - name: inspection_request_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.InspectionRequest.fields.requested_services"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "requested_services has source input with no default, so omitting it must fail schema validation at priority 5 — before any referential check on applicant_id or service_area_id could run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; one DESIGNATED area and one applicant exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-102", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-MISS", declared_quantity_bushels: 4000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_INVALID_REQUEST"
            - "The same body with requested_services [\"WEIGHING\"] (GRADING absent) -> 422 ERR_INVALID_REQUEST, since the constraint requires GRADING"
            - "The same body with declared_quantity_bushels 0 -> 422 ERR_INVALID_REQUEST (> 0 constraint)"
            - "No InspectionRequest row is created: GET /grain-inspection/inspection-requests?applicant_id=${app} -> total_count 0"

      - name: certificates_list_paginates_and_filters_by_declared_inputs
        claim_type: listing
        grounds:
          - "endpoints[GET /grain-inspection/certificates]"
          - "response_envelope.pagination_defaults"
          - "entities.Certificate.fields.certificate_type"
        distinguishing_aspect: "The list endpoint must apply the declared pagination defaults (limit 10, offset 0) and combine them with the certificate_type and status filters, reporting total_count over the FILTERED set and has_more relative to the page window."
        test_recipe:
          setup:
            - "A DELEGATED area with an ACTIVE GRADING schedule (base 8000, 2000 per thousand, minimum 10000) and an applicant with credit limit 900000."
            - "Twelve CORN requests of 500 declared bushels each, every one with a FINAL grading result and an ISSUED GRADE certificate of 10000 cents, all issued at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-100", contact_email: "billing@prairie.example", credit_limit_cents: 900000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1102", full_name: "P. Pager", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-PAGE", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-PAGE-1", declared_quantity_bushels: 500, requested_services: ["GRADING"] }
              captures: { req1: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-PAGE-1", portions_count: 2 }
              captures: { smp1: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", sample_id: "${smp1}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req1}", issuing_inspector_id: "${insp}", certificate_type: "GRADE" }
              captures: { cert1: "$.data.id" }
          trigger:
            - call: GET /grain-inspection/certificates
              as: Auditor
              captures: { page_head: "$.data[0].id" }
          assert:
            - "Repeating the request/sample/grading/certificate block eleven more times with distinct lot_identifier and seal_number values yields twelve ISSUED GRADE certificates of 10000 cents each"
            - "GET /grain-inspection/certificates with no query parameters -> exactly 10 items, total_count == 12, limit == 10, offset == 0, has_more == true"
            - "GET /grain-inspection/certificates?limit=5&offset=10 -> 2 items, total_count == 12, has_more == false"
            - "GET /grain-inspection/certificates?certificate_type=WEIGHT -> 0 items, total_count == 0, has_more == false"
            - "GET /grain-inspection/certificates?inspection_request_id=${req1} -> 1 item whose id == ${cert1}"
            - "limit=0 or limit=101 -> 422 ERR_INVALID_REQUEST (declared bounds min 1, max 100)"

      - name: equipment_system_and_computed_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - "entities.Equipment.fields.approval_status"
          - "entities.Equipment.fields.certified_until"
          - "entities.Equipment.fields.recent_deviations_pct"
          - "endpoints[POST /grain-inspection/equipment]"
        distinguishing_aspect: "approval_status, certified_until, last_certification_error_lbs and the whole comparison history are system or computed, and POST /grain-inspection/equipment does not accept them as input at all — a newly registered device must land in PENDING_APPROVAL with a null certified_until regardless of what the caller wants."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; one DESIGNATED service area exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-SYS", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
          assert:
            - "201; approval_status == PENDING_APPROVAL, certified_until == null, last_certification_error_lbs == null"
            - "recent_deviations_pct == [], rolling_bias_pct == null, last_comparison_deviation_pct == null, comparison_check_count == 0, consecutive_out_of_tolerance_checks == 0"
            - "capacity_lbs == null and tolerance_lbs == null (omitted optional inputs), version == 1"
            - "Using the device before certification -> 409 ERR_EQUIPMENT_NOT_APPROVED; only POST /grain-inspection/equipment/${nir}/certify can set certified_until"

      - name: appeal_vote_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - "entities.AppealVote"
          - "endpoints[GET /grain-inspection/appeal-votes/{id}]"
          - "concurrency_rules[appeal_vote_occ]"
        distinguishing_aspect: "AppealVote is declared common_fields false, so it exposes only id and created_at — no version and no updated_at — and §1.5 offers no PATCH or DELETE for it; the OCC token that guards vote creation lives on the parent Appeal, not on the vote."
        test_recipe:
          setup:
            - "A DELEGATED area with ACTIVE GRADING and APPEAL schedules, an ISSUED GRADE certificate of 10000 cents and a REINSPECTION in UNDER_REVIEW with a FINAL regrade recorded."
            - "One ACTIVE panel inspector who did not produce the original determination."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "APPEAL", base_fee_cents: 20000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_a: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_a}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-101", contact_email: "billing@prairie.example", credit_limit_cents: 900000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1103", full_name: "O. Original", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1104", full_name: "V. Voter", endorsements: ["GRADING", "SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp_v: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp_v}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp_v}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-VOTE", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-VOTE", declared_quantity_bushels: 500, requested_services: ["GRADING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-VOTE", portions_count: 4 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.2, moisture_pct: 14.04, damaged_total_pct: 4.0, heat_damaged_pct: 0.15, foreign_material_pct: 2.5 }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", issuing_inspector_id: "${insp}", certificate_type: "GRADE" }
              captures: { cert: "$.data.id", cert_v: "$.data.version" }
            - call: POST /grain-inspection/appeals
              as: ApplicantUser
              payload: { certificate_id: "${cert}", applicant_id: "${app}", appeal_type: "REINSPECTION", expected_certificate_version: "${cert_v}" }
              captures: { ap: "$.data.id" }
            - call: POST /grain-inspection/appeals/${ap}/assign-sample
              as: SupervisingInspector
              payload: { sample_id: "${smp}" }
            - call: POST /grain-inspection/grading-results
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp_v}", appeal_id: "${ap}", test_weight_lbs_per_bushel: 53.9, moisture_pct: 16.2, damaged_total_pct: 6.4, heat_damaged_pct: 0.44, foreign_material_pct: 3.9 }
            - call: GET /grain-inspection/appeals/${ap}
              as: SupervisingInspector
              captures: { ap_v: "$.data.version" }
          trigger:
            - call: POST /grain-inspection/appeal-votes
              as: SupervisingInspector
              payload: { appeal_id: "${ap}", inspector_id: "${insp_v}", vote: "REVISE", rationale: "Test weight below 54.0", expected_appeal_version: "${ap_v}" }
              captures: { vote: "$.data.id" }
          assert:
            - "201; the vote payload exposes id and created_at but NO version and NO updated_at field"
            - "GET /grain-inspection/appeal-votes/${vote} returns the same row; §1.5 declares no PATCH or DELETE for appeal-votes, so the vote can never be edited or withdrawn"
            - "GET /grain-inspection/appeals/${ap} -> version strictly greater than ${ap_v}, votes_cast_count == 1, revise_votes_count == 1, effective_votes_count == 1"
            - "Re-posting the same vote with the now-stale ${ap_v} -> 412 ERR_APPEAL_VERSION_CONFLICT (the OCC token belongs to the Appeal)"
            - "Posting a second vote by ${insp_v} with a fresh appeal version -> 409 ERR_DUPLICATE_PANEL_VOTE"

      - name: inspector_endorsement_enum_rejects_unknown_value
        claim_type: type_constraints
        grounds:
          - "entities.Inspector.fields.endorsements"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "endorsements is constrained to a non-empty subset of {SAMPLING, GRADING, PROTEIN, WEIGHING, SUPERVISION}; an unknown member and an empty list must both be rejected at schema priority, not silently normalised."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; one DESIGNATED service area exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1105", full_name: "E. Enum", endorsements: ["SAMPLING", "STOWAGE"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_INVALID_REQUEST"
            - "endorsements [] -> 422 ERR_INVALID_REQUEST (non-empty subset required)"
            - "state_code \"Texas\" on POST /grain-inspection/service-areas -> 422 ERR_INVALID_REQUEST (^[A-Z]{2}$)"
            - "fee_multiplier_bp 9999 or 15001 -> 422 ERR_INVALID_REQUEST (10000..15000)"
            - "No Inspector row is created: GET /grain-inspection/inspectors?service_area_id=${area} -> total_count 0"

      - name: sample_cannot_be_created_under_a_nonexistent_request
        claim_type: parent_relationships
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_INSPECTION_REQUEST_NOT_FOUND]"
          - "entities.Sample.fields.inspection_request_id"
        distinguishing_aspect: "inspection_request_id is a body FK rather than a path segment, so a syntactically valid but unknown UUID must surface the referential 404 ERR_INSPECTION_REQUEST_NOT_FOUND at priority 7 — after schema validation has passed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; a DESIGNATED area with an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING; NO inspection request exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1106", full_name: "S. Sampler", endorsements: ["SAMPLING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
