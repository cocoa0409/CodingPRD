# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# One-Day Bath Remodel — 9 Difficulty Rules x >=2 instances (18 instances)
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Numeric asserts pre-computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_final_total_permit_surcharge
        grounds:
          - calculations.quote_final_total_cents
          - entities.Quote.fields.net_price_cents
          - entities.Quote.fields.final_total_cents
          - entities.Quote.fields.permit_surcharge_cents
          - state_machines.Quote.PRESENTED_to_ACCEPTED
        distinguishing_aspect: >
          Same spec (SMOOTH, 60 sqft, WALK_IN_TUB, SPRING750): ESTIMATE observed at
          PRESENTED is net_price_cents=617344 with final_total_cents null; FINAL at
          ACCEPTED adds the permit surcharge 30000 to give final_total_cents=647344 —
          a 30000-cent divergence on the Quote cost domain.
        test_recipe:
          setup:
            - "One designer, one customer, one project driven to DESIGN_COMPLETE with measured_wall_area_sqft=60"
            - "A DRAFT->PRESENTED quote: wall_system SMOOTH_ACRYLIC, WALK_IN_TUB add-on, promo SPRING750, no financing"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Homer H", email: "homer@x.com", phone: "555-1", street_address: "1 Main", city: "LA", state_code: "CA", postal_code: "90001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 60 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "SMOOTH_ACRYLIC", color: "WHITE", accessibility_addon: "WALK_IN_TUB", promo_code: "SPRING750", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Quote.${q_id}.net_price_cents == 617344"
            - "Quote.${q_id}.permit_surcharge_cents == 30000"
            - "Quote.${q_id}.final_total_cents == 647344"
            - "Quote.${q_id}.status == ACCEPTED"
            - "Project.${proj_id}.permit_required == true"
            - "Project.${proj_id}.status == PERMIT_PENDING"

      - name: referral_reward_premium_percentage_variant
        grounds:
          - calculations.referral_reward_cents
          - entities.Referral.fields.reward_cents
          - entities.Customer.fields.referral_credit_cents
          - state_machines.Referral.REGISTERED_to_REWARDED
        distinguishing_aspect: >
          For a referred project whose accepted final_total is 647344, a PREMIUM referral
          rewards 3% = 19420 (vs the STANDARD flat 50000) — a different reward on the
          Referral/credit domain, distinct from the Quote-cost dual variant.
        test_recipe:
          setup:
            - "A referrer customer with a PREMIUM referral issued"
            - "A referred customer registered via the referral_code, with a project driven to a PRESENTED WALK_IN_TUB quote (final_total 647344)"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana2@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rita Referrer", email: "rita@x.com", phone: "555-2", street_address: "2 Oak", city: "LA", state_code: "CA", postal_code: "90002" }
              as: PlatformAdmin
              captures: { ref_cust_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_customer_id: "${ref_cust_id}", program_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { referral_id: $.data.id, ref_code: $.data.referral_code }
            - call: "POST /customers"
              payload: { full_name: "Ned New", email: "ned@x.com", phone: "555-3", street_address: "3 Elm", city: "LA", state_code: "CA", postal_code: "90003", referral_code_used: "${ref_code}" }
              as: PlatformAdmin
              captures: { new_cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${new_cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
              payload: { project_id: "${proj_id}", designer_id: "${des_id}", scheduled_start: "2026-05-10T14:00:00Z", scheduled_end: "2026-05-10T16:00:00Z" }
              as: InstallCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /design-appointments/${appt_id}/complete"
              payload: { measured_wall_area_sqft: 60 }
              as: Designer
              as_user_id: "${des_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: InstallCoordinator
              captures: { p_v: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", wall_system: "SMOOTH_ACRYLIC", color: "WHITE", accessibility_addon: "WALK_IN_TUB", promo_code: "SPRING750", expected_project_version: "${p_v}" }
              as: Designer
              as_user_id: "${des_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/present"
              payload: {}
              as: Designer
              as_user_id: "${des_id}"
          trigger:
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${new_cust_id}"
          assert:
            - "Referral.${referral_id}.status == REWARDED"
            - "Referral.${referral_id}.reward_cents == 19420"
            - "Referral.${referral_id}.referred_project_id == ${proj_id}"
            - "Customer.${ref_cust_id}.referral_credit_cents == 19420"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_system_price_three_tiers_mode_a
        grounds:
          - calculations.quote_system_price_cents
          - entities.Quote.fields.system_price_cents
          - entities.Quote.fields.net_price_cents
        distinguishing_aspect: >
          Mode (a) non-linear tier selection: TILE_LOOK rate 5900 over 100 sqft splits
          40@100% + 40@90% + 20@80% = 236000+212400+94400 = 542800; three inputs
          (rate, area, tier breakpoints) interact non-linearly.
        test_recipe:
          setup:
            - "A DESIGN_COMPLETE project with measured_wall_area_sqft=100"
          setup_api_calls:
            - call: "POST /designers"
              payload: { full_name: "Dana D", email: "dana3@x.com", region_state_code: "CA" }
              as: PlatformAdmin
              captures: { des_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Homer H", email: "homer3@x.com", phone: "555-4", street_address: "4 Ash", city: "LA", state_code: "CA", postal_code: "90004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", state_code: "CA", bathroom_type: "FULL_BATH" }
              as: InstallCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /design-appointments"
