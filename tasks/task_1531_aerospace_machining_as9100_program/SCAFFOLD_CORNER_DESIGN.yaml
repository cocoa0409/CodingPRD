# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Aerospace Machining & AS9100 Program
# Taxonomy per references/claim-extraction-guide.md
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: lta_creation_defaults
        claim_type: defaults
        grounds: ["entities.LongTermAgreement", "endpoints[POST /api/ltas]"]
        distinguishing_aspect: "A freshly created LTA starts DRAFT with version 1, remaining_ceiling_cents == ceiling_cents, consecutive_not_ready_count == 0, last_audit_result null."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}] }, as: ContractsManager, captures: { lta_id: $.data.id, st: $.data.status, v: $.data.version, rem: $.data.remaining_ceiling_cents, cnt: $.data.consecutive_not_ready_count, last: $.data.last_audit_result } }
          assert:
            - "LongTermAgreement.${lta_id}.status == DRAFT (initial state)"
            - "version == 1"
            - "remaining_ceiling_cents == 100000000 == ceiling_cents"
            - "consecutive_not_ready_count == 0 and last_audit_result == null"

      - name: po_creation_computed_and_pinned_fields
        claim_type: computed_fields
        grounds: ["entities.PurchaseOrder.fields.unit_price_cents", "entities.PurchaseOrder.fields.lta_version_pinned", "endpoints[POST /api/purchase-orders]"]
        distinguishing_aspect: "unit_price_cents, total_cents, unreleased_quantity, delivered_quantity and lta_version_pinned are server-computed at creation, not client-supplied."
        test_recipe:
          setup: ["LTA ACTIVE, version ${lta_v} after activation"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-C1", part_number: "P100", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id, up: $.data.unit_price_cents, tot: $.data.total_cents, unrel: $.data.unreleased_quantity, dlv: $.data.delivered_quantity, pin: $.data.lta_version_pinned, st: $.data.status } }
          assert:
            - "unit_price_cents == 5000 (tier 1), total_cents == 50000"
            - "unreleased_quantity == 10, delivered_quantity == 0, status == RECEIVED"
            - "lta_version_pinned == ${lta_v} (LTA version observed at creation)"

      - name: serial_number_system_format
        claim_type: system_fields
        grounds: ["entities.SerialNumber.fields.serial_number", "endpoints[POST /api/work-orders/{woId}/serials]"]
        distinguishing_aspect: "serial_number is system-minted as SN-NNNN with a per-work-order zero-padded sequence in creation order."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 2 RELEASED; WO qty 2 RELEASED; ACCEPTED cert with quantity 5"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SN", part_number: "P101", part_revision: "A", quantity: 2, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SN", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SN", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { sn1: $.data.0.serial_number, sn2: $.data.1.serial_number, s1: $.data.0.id } }
          assert:
            - "serials[0].serial_number == 'SN-0001' and serials[1].serial_number == 'SN-0002'"
            - "WorkOrder.${wo_id}.status == IN_PRODUCTION after first batch"

      - name: po_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PO_NOT_FOUND]", "endpoints[GET /api/purchase-orders/{poId}]"]
        distinguishing_aspect: "GET with a well-formed but non-existent PO id returns ERR_PO_NOT_FOUND, 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /api/purchase-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PO_NOT_FOUND, http_status == 404"

      - name: lta_create_missing_required_field
        claim_type: required_fields
        grounds: ["entities.LongTermAgreement.fields.ceiling_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required ceiling_cents yields ERR_INVALID_REQUEST, 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http_status == 400"

      - name: fai_create_invalid_enum
        claim_type: type_constraints
        grounds: ["entities.FirstArticleInspection.fields.fai_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "fai_type outside {FULL, PARTIAL} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/first-articles", payload: { part_number: "P102", part_revision: "A", fai_type: "DELTA" }, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http_status == 400"

      - name: characteristic_negative_tolerance_rejected
        claim_type: type_constraints
        grounds: ["entities.BalloonedCharacteristic.fields.tolerance_minus", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tolerance_minus < 0 is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["FAI exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P103", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: -0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http_status == 400"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /api/purchase-orders]"]
        distinguishing_aspect: "List endpoints honor limit/offset and return total_count and has_more in the envelope."
        test_recipe:
          setup: ["LTA ACTIVE with two POs"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-PG1", part_number: "P104", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v2: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-PG2", part_number: "P104", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v2}" }, as: ContractsManager }
          trigger:
            - { call: "GET /api/purchase-orders?lta_id=${lta_id}&limit=1&offset=0", payload: {}, as: ContractsManager }
          assert:
            - "response envelope contains total_count == 2 and has_more == true"
            - "data array length == 1 (limit honored)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: lta_activate_happy
        claim_type: valid_transition
        grounds: ["state_machines.LongTermAgreement.DRAFT_to_ACTIVE"]
        distinguishing_aspect: "DRAFT LTA with valid commercial terms activates to ACTIVE."
        test_recipe:
          setup: ["LTA DRAFT"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
          trigger:
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { st: $.data.status } }
          assert:
            - "LongTermAgreement.${lta_id}.status == ACTIVE"

      - name: fai_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.FirstArticleInspection.SUBMITTED_to_APPROVED", "errors[ERR_FAI_NOT_SUBMITTED]"]
        distinguishing_aspect: "approve from DRAFT (not SUBMITTED) is rejected with ERR_FAI_NOT_SUBMITTED."
        test_recipe:
          setup: ["FAI in DRAFT"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P105", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/approve", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FAI_NOT_SUBMITTED, http_status == 409; FAI stays DRAFT"

      - name: po_double_cancel_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.PurchaseOrder.RECEIVED_to_CANCELLED", "errors[ERR_PO_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A CANCELLED PO is terminal: a second cancel is rejected."
        test_recipe:
          setup: ["LTA ACTIVE; PO RECEIVED (no work orders)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-TL", part_number: "P106", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: ContractsManager }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/cancel", payload: {}, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PO_NOT_CANCELLABLE, http_status == 409"

      - name: wo_complete_requires_serials_complete
        claim_type: precondition_enforcement
        grounds: ["state_machines.WorkOrder.IN_PRODUCTION_to_FINAL_INSPECTION", "errors[ERR_SERIALS_INCOMPLETE]"]
        distinguishing_aspect: "complete is rejected while serials_created_count (2) < quantity (3)."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 3 RELEASED; WO qty 3 IN_PRODUCTION with only 2 serials"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SC", part_number: "P107", part_revision: "A", quantity: 3, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 3, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SC", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SC", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERIALS_INCOMPLETE, http_status == 422; WO stays IN_PRODUCTION"

      - name: serial_ship_bubbles_po_close
        claim_type: side_effect_execution
        grounds: ["state_machines.SerialNumber.CREATED_to_SHIPPED", "state_machines.PurchaseOrder.RELEASED_to_CLOSED"]
        distinguishing_aspect: "Shipping the final unit bubbles up: delivered_quantity reaches quantity and the PO auto-transitions RELEASED -> CLOSED."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 RELEASED; WO qty 1 COMPLETED (customer source inspection); serial SN-0001 CREATED"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-BUB", part_number: "P108", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-BUB", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-BUB", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 1 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
          trigger:
            - { call: "POST /api/serials/${s1}/ship", payload: {}, as: ManufacturingPlanner, captures: { s1_st: $.data.status } }
            - { call: "GET /api/purchase-orders/${po_id}", payload: {}, as: ContractsManager, captures: { po_st: $.data.status, po_dlv: $.data.delivered_quantity } }
          assert:
            - "SerialNumber.${s1}.status == SHIPPED with shipped_at set"
            - "PurchaseOrder.${po_id}.delivered_quantity == 1 and status == CLOSED (automatic bubble-up)"

      - name: characteristic_remeasure_fail_to_pass
        claim_type: valid_transition
        grounds: ["state_machines.BalloonedCharacteristic.FAIL_to_PASS"]
        distinguishing_aspect: "A FAIL characteristic may be re-measured after rework and move FAIL -> PASS."
        test_recipe:
          setup: ["FAI IN_INSPECTION with characteristic balloon 1 (usl 10.10, lsl 9.90) currently FAIL"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P109", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { ch_id: $.data.id } }
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 10.2 }, as: QualityInspector, as_user_id: "insp-1", captures: { r1: $.data.result } }
          trigger:
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 10.05 }, as: QualityInspector, as_user_id: "insp-1", captures: { r2: $.data.result } }
          assert:
            - "First measurement 10.2 > usl 10.10: result == FAIL"
            - "Re-measurement 10.05: result == PASS, measured_value overwritten to 10.05"

      - name: characteristic_pass_remeasure_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.BalloonedCharacteristic.UNMEASURED_to_PASS", "errors[ERR_CHARACTERISTIC_NOT_MEASURABLE]"]
        distinguishing_aspect: "A PASS characteristic is terminal for measurement; re-measurement is rejected."
        test_recipe:
          setup: ["FAI IN_INSPECTION with characteristic balloon 1 PASS"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P110", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { ch_id: $.data.id } }
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 10.01 }, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CHARACTERISTIC_NOT_MEASURABLE, http_status == 409"

      - name: source_disqualify_suspends_process_approvals
        claim_type: side_effect_execution
        grounds: ["state_machines.ApprovedSource.APPROVED_to_DISQUALIFIED", "state_machines.SpecialProcessApproval.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Disqualifying a source cascades: its ACTIVE special-process approvals become SUSPENDED."
        test_recipe:
          setup: ["APPROVED SPECIAL_PROCESS source with one ACTIVE HEAT_TREAT approval"]
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-DQ", approval_scope: "SPECIAL_PROCESS", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "HEAT_TREAT", valid_from: "2026-01-01", valid_to: "2027-01-01", cert_reference: "NADCAP-1" }, as: SupplyChainManager, captures: { pa_id: $.data.id } }
          trigger:
            - { call: "POST /api/sources/${src_id}/disqualify", payload: { reason: "fraudulent certs" }, as: SupplyChainManager, captures: { src_st: $.data.status } }
            - { call: "GET /api/process-approvals/${pa_id}", payload: {}, as: SupplyChainManager, captures: { pa_st: $.data.status } }
          assert:
            - "ApprovedSource.${src_id}.status == DISQUALIFIED (terminal)"
            - "SpecialProcessApproval.${pa_id}.status == SUSPENDED (cascade)"

      - name: spa_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: ["state_machines.SpecialProcessApproval.ACTIVE_to_SUSPENDED", "state_machines.SpecialProcessApproval.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "SpecialProcessApproval is cyclic: ACTIVE -> SUSPENDED -> ACTIVE via reinstate (overlap rule re-applied)."
        test_recipe:
          setup: ["APPROVED SPECIAL_PROCESS source with one ACTIVE NDT approval"]
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-CYC", approval_scope: "SPECIAL_PROCESS", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "NDT", valid_from: "2026-01-01", valid_to: "2027-01-01", cert_reference: "NADCAP-2" }, as: SupplyChainManager, captures: { pa_id: $.data.id } }
          trigger:
            - { call: "POST /api/process-approvals/${pa_id}/suspend", payload: {}, as: SupplyChainManager, captures: { st1: $.data.status } }
            - { call: "POST /api/process-approvals/${pa_id}/reinstate", payload: {}, as: SupplyChainManager, captures: { st2: $.data.status } }
          assert:
            - "After suspend: status == SUSPENDED"
            - "After reinstate: status == ACTIVE (no overlapping ACTIVE window exists)"

      - name: revoke_hold_useasis_release_cycle
        claim_type: side_effect_execution
        grounds: ["state_machines.NonconformanceReport.MRB_REVIEW_to_DISPOSITIONED", "state_machines.SerialNumber.QUARANTINED_to_CREATED", "state_machines.WorkOrder.QUALITY_HOLD_to_IN_PRODUCTION"]
        distinguishing_aspect: "Compensation pattern: USE_AS_IS disposition releases quarantined serials back to CREATED, and once no quarantined serials or open NCRs remain, release-hold returns the WO to IN_PRODUCTION."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 2 RELEASED; WO qty 2 IN_PRODUCTION with serials SN-0001/2 from cert H-RH; cert REVOKED (serials QUARANTINED, WO QUALITY_HOLD, AUTO_COUNTERFEIT NCR OPEN)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-RH", part_number: "P111", part_revision: "A", quantity: 2, flowdown_clauses: ["DFARS_COUNTERFEIT_PREVENTION"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-RH", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "MEDIUM" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-RH", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id } }
            - { call: "POST /api/material-certs/${cert_id}/revoke", payload: { reason: "suspect cert" }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /api/ncrs?wo_id=${wo_id}", payload: {}, as: QualityManager, captures: { ncr_id: $.data.0.id } }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "USE_AS_IS", rework_hours_per_unit: 0, material_cost_per_unit_cents: 0 }, as: MRBMember, as_user_id: "mrb-1", captures: { d_st: $.data.status } }
            - { call: "GET /api/serials/${s1}", payload: {}, as: QualityManager, captures: { s1_st: $.data.status } }
            - { call: "POST /api/work-orders/${wo_id}/release-hold", payload: {}, as: QualityManager, captures: { wo_st: $.data.status } }
          assert:
            - "After USE_AS_IS disposition: SerialNumber.${s1}.status == CREATED (released from quarantine)"
            - "release-hold succeeds: WorkOrder.${wo_id}.status == IN_PRODUCTION (NCR DISPOSITIONED, no QUARANTINED serials)"

      - name: fai_supersede_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.FirstArticleInspection.SUBMITTED_to_APPROVED", "errors[ERR_FAI_NOT_SUBMITTED]"]
        distinguishing_aspect: "Approving a second FAI for the same (part_number, part_revision) supersedes the first; SUPERSEDED is terminal (reject on it fails)."
        test_recipe:
          setup: ["FAI-1 for P112/A APPROVED; FAI-2 for P112/A SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P112", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai1: $.data.id } }
            - { call: "POST /api/first-articles/${fai1}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { c1: $.data.id } }
            - { call: "POST /api/characteristics/${c1}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/first-articles/${fai1}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
            - { call: "POST /api/first-articles/${fai1}/approve", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/first-articles", payload: { part_number: "P112", part_revision: "A", fai_type: "PARTIAL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai2: $.data.id } }
            - { call: "POST /api/first-articles/${fai2}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { c2: $.data.id } }
            - { call: "POST /api/characteristics/${c2}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/first-articles/${fai2}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/first-articles/${fai2}/approve", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { f2_st: $.data.status } }
            - { call: "GET /api/first-articles/${fai1}", payload: {}, as: QualityManager, captures: { f1_st: $.data.status } }
            - { call: "POST /api/first-articles/${fai1}/reject", payload: { reason: "late rejection" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { err: $.data.error_id } }
          assert:
            - "FirstArticleInspection.${fai2}.status == APPROVED"
            - "FirstArticleInspection.${fai1}.status == SUPERSEDED (automatic side effect of the second approval)"
            - "Reject on SUPERSEDED fails: error_id == ERR_FAI_NOT_SUBMITTED, http_status == 409"

      - name: ncr_kickback_cycle_corner
        claim_type: valid_transition
        grounds: ["state_machines.NonconformanceReport.MRB_REVIEW_to_OPEN"]
        excluded_because:
          difficulty_instance: ncr_kickback_and_scrap_branching
          rationale: "The MRB_REVIEW -> OPEN kickback cycle is exercised as the first trigger step of the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: rebate_gross_keyed_tier_boundary
        claim_type: correct_result
        grounds: ["calculations.lta_annual_volume_rebate", "endpoints[GET /api/ltas/{ltaId}/rebate-preview]"]
        distinguishing_aspect: "Circular-looking dependency resolved by pinned evaluation order: the rebate tier is keyed on GROSS pre-rebate invoiced cents; gross exactly == min_invoiced_cents (10000000) selects the 2% tier."
        test_recipe:
          setup:
            - "LTA ACTIVE with rebate_tiers [0:0, 10000000:0.02]; PO qty 2500 (tier 4000, total 10000000) RELEASED"
            - "WO qty 2500 COMPLETED; all 2500 serials shipped in the default-clock month -> PO CLOSED in 2026"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 3000, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-REB", part_number: "P113", part_revision: "A", quantity: 2500, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id, po_tot: $.data.total_cents } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2500, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-REB", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-REB", material_spec: "AMS 5643", quantity_received: 3000 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2500 }, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/work-orders/${wo_id}/ship-all", payload: {}, as: ManufacturingPlanner }
          trigger:
            - { call: "GET /api/ltas/${lta_id}/rebate-preview?year=2026", payload: {}, as: ContractsManager, captures: { gross: $.data.gross_invoiced_cents, pct: $.data.rebate_pct, reb: $.data.rebate_cents, net: $.data.net_cents } }
          assert:
            - "PurchaseOrder.${po_id}.total_cents == 10000000 (2500 x 4000)"
            - "gross_invoiced_cents == 10000000 (exactly the tier breakpoint; >= selects the 2% tier)"
            - "rebate_pct == 0.02, rebate_cents == 200000, net_cents == 9800000 (tier keyed on gross pre-rebate)"

      - name: rate_readiness_auto_suspend_at_two
        claim_type: correct_result
        grounds: ["calculations.rate_readiness_score", "state_machines.LongTermAgreement.ACTIVE_to_SUSPENDED", "endpoints[POST /api/ltas/{ltaId}/run-rate-audit]"]
        distinguishing_aspect: "Threshold + epoch behavior: 75% in August is NOT_READY (count 1); 0% in September is the second consecutive NOT_READY, auto-suspending the LTA."
        test_recipe:
          setup: ["LTA ACTIVE (committed_monthly_rate_units 100); PO qty 75; WO qty 75 COMPLETED in August (default clock)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-RR", part_number: "P114", part_revision: "A", quantity: 75, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 75, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-RR", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-RR", material_spec: "AMS 5643", quantity_received: 100 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 75 }, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
          trigger:
            - { call: "POST /api/ltas/${lta_id}/run-rate-audit", payload: {}, as: QualityManager, captures: { r1: $.data.last_audit_result, c1: $.data.consecutive_not_ready_count, st1: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/ltas/${lta_id}/run-rate-audit", payload: {}, as: QualityManager, captures: { r2: $.data.last_audit_result, c2: $.data.consecutive_not_ready_count, st2: $.data.status } }
          assert:
            - "August audit: demonstrated 75/100 -> readiness_pct 75 -> last_audit_result == NOT_READY (75 < 80), consecutive_not_ready_count == 1, status still ACTIVE"
            - "September audit: demonstrated 0 -> NOT_READY, consecutive_not_ready_count == 2, status == SUSPENDED (automatic)"

      - name: rate_readiness_rerun_replaces_and_resets
        claim_type: input_set_filtering
        grounds: ["calculations.rate_readiness_score"]
        distinguishing_aspect: "Same-month re-audit replaces the stored result: an initial 0% NOT_READY is replaced by an 80% MARGINAL after completions land, and the consecutive counter resets to 0."
        test_recipe:
          setup: ["LTA ACTIVE (committed 100); PO qty 80; WO qty 80 with 80 serials, still IN_PRODUCTION"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-RR2", part_number: "P115", part_revision: "A", quantity: 80, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 80, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-RR2", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-RR2", material_spec: "AMS 5643", quantity_received: 100 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 80 }, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/ltas/${lta_id}/run-rate-audit", payload: {}, as: QualityManager, captures: { r1: $.data.last_audit_result, c1: $.data.consecutive_not_ready_count } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/ltas/${lta_id}/run-rate-audit", payload: {}, as: QualityManager, captures: { r2: $.data.last_audit_result, c2: $.data.consecutive_not_ready_count } }
          assert:
            - "First audit (no completions yet): NOT_READY, consecutive_not_ready_count == 1"
            - "Same-month re-run after completing 80: last_audit_result == MARGINAL (80 <= 80 < 100), consecutive_not_ready_count == 0 (replaced, not double-counted)"

      - name: fai_completeness_aggregation
        claim_type: correct_result
        grounds: ["calculations.fai_characteristic_completeness", "entities.FirstArticleInspection.fields.characteristics_complete"]
        distinguishing_aspect: "Aggregation correctness after each mutation: counts and the completeness flag track adds and measurements incrementally."
        test_recipe:
          setup: ["FAI with two ballooned characteristics, both UNMEASURED"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P116", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { c1: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 2, nominal: 20.0, tolerance_plus: 0.2, tolerance_minus: 0.2 }, as: QualityInspector, as_user_id: "insp-1", captures: { c2: $.data.id } }
          trigger:
            - { call: "GET /api/first-articles/${fai_id}", payload: {}, as: QualityManager, captures: { n0: $.data.characteristic_count, m0: $.data.measured_count, f0: $.data.characteristics_complete } }
            - { call: "POST /api/characteristics/${c1}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/first-articles/${fai_id}", payload: {}, as: QualityManager, captures: { m1: $.data.measured_count, f1: $.data.characteristics_complete } }
            - { call: "POST /api/characteristics/${c2}/record-measurement", payload: { measured_value: 20.1 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/first-articles/${fai_id}", payload: {}, as: QualityManager, captures: { m2: $.data.measured_count, f2: $.data.characteristics_complete } }
          assert:
            - "Initially: characteristic_count == 2, measured_count == 0, characteristics_complete == false"
            - "After one measurement: measured_count == 1, characteristics_complete == false"
            - "After both: measured_count == 2, characteristics_complete == true"

      - name: cpk_incapable_auto_ncr_and_flags
        claim_type: constants_applied
        grounds: ["calculations.spc_capability_index", "entities.WorkOrder.fields.requires_100pct_inspection", "entities.NonconformanceReport.fields.origin"]
        distinguishing_aspect: "CPK_THRESHOLD 1.33 constant: the 5th measurement yielding cpk 1.111 (< 1.33) flips the characteristic INCAPABLE, sets WO flags, and auto-creates an AUTO_SPC NCR."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 5 (no AS9102_FAI) RELEASED; FAI for P117/A with key characteristic (usl 10.10, lsl 9.90); WO qty 5 IN_PRODUCTION with 5 serials"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-INC", part_number: "P117", part_revision: "A", quantity: 5, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/first-articles", payload: { part_number: "P117", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, is_key_characteristic: true }, as: QualityInspector, as_user_id: "insp-1", captures: { kc_id: $.data.id } }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 5, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-INC", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-INC", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 5 }, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.03 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:02:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.97 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:03:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.03 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:04:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.97 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.00 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/characteristics/${kc_id}", payload: {}, as: QualityManager, captures: { kc_st: $.data.spc_eval_status, kc_cpk: $.data.cpk_provisional } }
            - { call: "GET /api/work-orders/${wo_id}", payload: {}, as: QualityManager, captures: { wo_spc: $.data.spc_status, wo_100: $.data.requires_100pct_inspection } }
            - { call: "GET /api/ncrs?wo_id=${wo_id}", payload: {}, as: QualityManager, captures: { ncr_origin: $.data.0.origin, ncr_st: $.data.0.status } }
          assert:
            - "BalloonedCharacteristic.${kc_id}.cpk_provisional == 1.111 (< CPK_THRESHOLD 1.33) and spc_eval_status == INCAPABLE"
            - "WorkOrder.${wo_id}.spc_status == INCAPABLE and requires_100pct_inspection == true"
            - "An NCR with origin == AUTO_SPC, status == OPEN was auto-created for the WO"

      - name: spc_dual_variant_corner
        claim_type: variant_divergence
        grounds: ["calculations.spc_capability_index"]
        excluded_because:
          difficulty_instance: spc_cpk_provisional_vs_final
          rationale: "Variant divergence (provisional vs final sigma) is asserted by the named §1.8 instance."

      - name: ncr_cost_variants_corner
        claim_type: variant_divergence
        grounds: ["calculations.ncr_disposition_cost"]
        excluded_because:
          difficulty_instance: ncr_estimated_vs_actual_cost
          rationale: "Estimated-vs-actual variant divergence and reconciliation are asserted by the named §1.8 instance."

      - name: po_tier_boundary_corner
        claim_type: correct_result
        grounds: ["calculations.po_unit_price"]
        excluded_because:
          difficulty_instance: po_tier_boundary_qty_equals_min
          rationale: "Tier-boundary >= semantics are asserted by the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: po_number_uniqueness_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PO_NUMBER_EXISTS]"]
        distinguishing_aspect: "po_number is unique per LTA; the second create with the same number is rejected."
        test_recipe:
          setup: ["LTA ACTIVE; PO PO-DUP exists"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-DUP", part_number: "P118", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager }
          trigger:
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v2: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-DUP", part_number: "P119", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v2}" }, as: ContractsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PO_NUMBER_EXISTS, http_status == 409"

      - name: balloon_number_uniqueness_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_BALLOON_NUMBER_EXISTS]"]
        distinguishing_aspect: "balloon_number is unique per FAI."
        test_recipe:
          setup: ["FAI IN_INSPECTION with balloon 1"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P120", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 20.0, tolerance_plus: 0.2, tolerance_minus: 0.2 }, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BALLOON_NUMBER_EXISTS, http_status == 409"

      - name: fai_submit_self_inspection_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the inspector who recorded a characteristic measurement cannot submit that FAI."
        test_recipe:
          setup: ["FAI IN_INSPECTION; characteristic recorded by insp-1 (result PASS)"]
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P121", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1 }, as: QualityInspector, as_user_id: "insp-1", captures: { c1: $.data.id } }
            - { call: "POST /api/characteristics/${c1}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http_status == 403 (submitter insp-1 == recorder insp-1)"

      - name: ncr_disposition_by_discoverer_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the NCR discoverer cannot sit as its own MRB disposer, even with the MRBMember role."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 RELEASED; WO PLANNED; NCR created by insp-1, in MRB_REVIEW"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SOD", part_number: "P122", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "SCRATCH", description: "handling scratch", quantity_affected: 1, detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "REWORK", rework_hours_per_unit: 0.5, material_cost_per_unit_cents: 0 }, as: MRBMember, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http_status == 403 (disposition_by would equal discovered_by insp-1)"

      - name: cert_accept_by_creator_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]", "state_machines.MaterialCert.RECEIVED_to_ACCEPTED"]
        distinguishing_aspect: "Segregation of duties at receiving inspection: the SupplyChainManager who registered the cert cannot also accept it."
        test_recipe:
          setup: ["APPROVED RAW_MATERIAL source; cert created by scm-1 (RECEIVED)"]
          setup_api_calls:
            - { call: "POST /api/sources", payload: { supplier_code: "S-SOD", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SOD", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
          trigger:
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "scm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http_status == 403 (acceptor X-User-ID scm-1 == created_by_user_id scm-1)"

      - name: escape_submit_window_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=10]", "errors[ERR_ESCAPE_WINDOW_EXCEEDED]", "state_machines.EscapeReport.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "The 48h escape window is inclusive: submit at exactly NCR.created_at + 48h succeeds; one second later fails."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 2 RELEASED; WO qty 2 COMPLETED; both serials SHIPPED at default clock 2026-08-01T00:00:00Z; two post-shipment NCRs created (each spawning a DRAFT EscapeReport with due_at 2026-08-03T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-EW", part_number: "P123", part_revision: "A", quantity: 2, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-EW", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-EW", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id, s2: $.data.1.id } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/work-orders/${wo_id}/accept", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1" }
            - { call: "POST /api/serials/${s1}/ship", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/serials/${s2}/ship", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "FIELD_1", description: "escape one", quantity_affected: 1, affected_serial_ids: ["${s1}"], detected_post_shipment: true }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr1: $.data.id } }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "FIELD_2", description: "escape two", quantity_affected: 1, affected_serial_ids: ["${s2}"], detected_post_shipment: true }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr2: $.data.id } }
            - { call: "GET /api/escape-reports?ncr_id=${ncr1}", payload: {}, as: QualityManager, captures: { er1: $.data.0.id } }
            - { call: "GET /api/escape-reports?ncr_id=${ncr2}", payload: {}, as: QualityManager, captures: { er2: $.data.0.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/escape-reports/${er1}/submit", payload: {}, as: QualityManager, captures: { er1_st: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: SystemAdmin }
            - { call: "POST /api/escape-reports/${er2}/submit", payload: {}, as: QualityManager, captures: { err: $.data.error_id } }
          assert:
            - "At exactly due_at (NCR.created_at 2026-08-01T00:00:00Z + 48h): EscapeReport.${er1} submit succeeds, status == SUBMITTED (inclusive boundary)"
            - "One second past due_at: submit of EscapeReport.${er2} fails with error_id == ERR_ESCAPE_WINDOW_EXCEEDED, http_status == 422"

      - name: wo_release_process_gate_missing
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PROCESS_NOT_APPROVED]", "state_machines.WorkOrder.PLANNED_to_RELEASED"]
        distinguishing_aspect: "WO requiring HEAT_TREAT cannot release when no ACTIVE approval exists for that process."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 (no AS9102_FAI) RELEASED; WO qty 1 PLANNED with special_processes_required [HEAT_TREAT]"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-PG", part_number: "P124", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: true, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: ["HEAT_TREAT"] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROCESS_NOT_APPROVED, http_status == 422; WO stays PLANNED"

      - name: wo_release_process_window_expired
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_PROCESS_NOT_APPROVED]", "entities.SpecialProcessApproval.fields.valid_to"]
        distinguishing_aspect: "Conditional on the logical clock: an approval whose half-open window ended before today does not satisfy the gate; moving the clock inside the window does."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 RELEASED; WO qty 1 PLANNED requiring NDT; APPROVED SPECIAL_PROCESS source with NDT approval window [2026-01-01, 2026-06-01); clock at default 2026-08-01 (outside window)"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-PW", part_number: "P125", part_revision: "A", quantity: 1, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: true, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 1, special_processes_required: ["NDT"] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/sources", payload: { supplier_code: "S-PW", approval_scope: "SPECIAL_PROCESS", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/process-approvals", payload: { source_id: "${src_id}", process_code: "NDT", valid_from: "2026-01-01", valid_to: "2026-06-01", cert_reference: "NADCAP-3" }, as: SupplyChainManager }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner, captures: { wo_st: $.data.status } }
          assert:
            - "With clock 2026-08-01 (past valid_to 2026-06-01): release fails, error_id == ERR_PROCESS_NOT_APPROVED"
            - "With clock 2026-05-01 (inside [2026-01-01, 2026-06-01)): release succeeds, status == RELEASED"

      - name: wo_accept_delegation_gate
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_DELEGATION_REQUIRED]", "state_machines.WorkOrder.FINAL_INSPECTION_to_COMPLETED"]
        distinguishing_aspect: "Conditional validation on actor identity: a QualityInspector may complete final acceptance only when an ACTIVE delegation covers (po_id, inspector X-User-ID) at the clock date; CustomerQualityRep needs none."
        test_recipe:
          setup: ["LTA ACTIVE; PO qty 1 (clause DELEGATED_INSPECTION_PERMITTED) RELEASED; WO qty 1 FINAL_INSPECTION with 1 serial"]
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.0, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
