          assert:
            - "before the trigger, PaymentPlan.${plan_id}.paid_amount == 0.00 and outstanding_amount == 960.00, summing to principal_amount 960.00"
            - "after the pay, PaymentPlan.${plan_id}.paid_amount == 320.00 and outstanding_amount == 640.00, summing to 960.00"
            - "after the pay, Installment.${inst1_id}.installment_status == PAID"
            - "after the reverse-payment, PaymentPlan.${plan_id}.paid_amount == 0.00 and outstanding_amount == 960.00, summing to 960.00"
            - "after the reverse-payment, Installment.${inst1_id}.installment_status == SCHEDULED and paid_at is null"
            - "PaymentPlan.${plan_id}.plan_status == ACTIVE at every observation"
