              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_TOO_MANY_ATTEMPTS (409) — 6th attempt within 30 days"

  - section: roles
    instances:
      - name: contributor_cannot_suspend_or_resolve
        claim_type: rbac_denial
        grounds:
          - "roles.Contributor"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Contributor calling POST /v1/business-listings/{id}/suspend or POST /v1/review-tickets -> 403 ERR_UNAUTHORIZED (exclusive to PolicyAnalyst / Moderator)."
        test_recipe:
          setup: ["Region R; listing L; contributor C"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C", email: "rbac@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "RBAC Biz", category: "RETAIL", address_text: "19 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /v1/business-listings/${l_id}/suspend"
              payload: { violation_type: "IMPERSONATION", evidence_notes: "contributor-forged suspend" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err_suspend: $.data.error_id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "EDIT_REVIEW" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { err_ticket: $.data.error_id }
          assert:
            - "Suspend call: error_id == ERR_UNAUTHORIZED (403)"
            - "Ticket-create call: error_id == ERR_UNAUTHORIZED (403)"
      - name: missing_auth_headers_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request without X-User-Role -> 401 ERR_UNAUTHENTICATED before any role or existence check runs (auth beats everything)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/regions"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED when the role header is omitted entirely (GET /v1/regions does not admit Anonymous)"
            - "HTTP status == 401 or 403 depending on header omission handling — pinned: 401 ERR_UNAUTHENTICATED when headers missing"
      - name: imagery_operator_cannot_validate_routing
        claim_type: rbac_denial
        grounds:
          - "roles.ImageryOperator"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "ImageryOperator calling POST /v1/routing-updates/{id}/validate -> 403 ERR_UNAUTHORIZED (exclusive to RoutingEngineer)."
        test_recipe:
          setup: ["Region R; routing update U PROPOSED"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /v1/routing-updates"
              payload: { region_id: "${r_id}", segment_ref: "S20", kind: "CLOSURE", effective_start: "2026-10-01T00:00:00Z", effective_end: "2026-10-02T00:00:00Z", expected_region_version: "${r_v0}" }
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /v1/routing-updates/${u_id}/validate"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-9"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (403)"
            - "RoutingUpdate.${u_id}.status == PROPOSED (unchanged)"

  - section: cross_cutting_layers
    instances:
      - name: listing_version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - "complexity_profile.complexity_layers"
          - "entities.BusinessListing.fields"
        distinguishing_aspect: "Optimistic-concurrency layer: version starts at 1 on create, +1 on claim, +1 on each edit write; two bumps observed across the chain."
        test_recipe:
          setup: ["Region R; listing L created (version 1)"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C", email: "ver@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Version Biz", category: "RETAIL", address_text: "20 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
          trigger:
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { l_v1: $.data.version }
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l_id}", contributor_id: "${c_id}", edit_type: "ATTRIBUTE", payload: { attribute: "wifi", value: true }, expected_listing_version: "${l_v1}" }
              as: Contributor
              as_user_id: "${c_id}"
            - call: "GET /v1/business-listings/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v2: $.data.version }
          assert:
            - "Initial version == 1 (captured ${l_v0})"
            - "After claim version == 2 (captured ${l_v1})"
            - "After edit write version == 3 (captured ${l_v2})"
      - name: threshold_trigger_region_posture_flip_and_restore
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.region_privacy_clearance"
        excluded_because:
          difficulty_instance: transitive_cascade / imagery_capture_region_posture_cascade
          rationale: "The bubble-up half (ACTIVE -> CLEARANCE_PENDING) is asserted in the named §1.8 instance; the drain half (publish -> count 0 -> CLEAR) is asserted below in a distinct recipe."
      - name: region_posture_drains_to_clear_on_publish
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.region_privacy_clearance"
          - "state_machines.ImageryTask.BLURRED_to_PUBLISHED"
        distinguishing_aspect: "Full cycle: capture sets pending=1 / CLEARANCE_PENDING; blur-complete then publish drains pending to 0 and posture flips to CLEAR (a region that has ever captured media reports CLEAR, not ACTIVE)."
        test_recipe:
          setup: ["Region R; task T captured with 3 media inside window"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/imagery-tasks"
              payload: { region_id: "${r_id}", collection_zone: "zc", operator_id: "op-1", window_start: "2026-09-02T00:00:00Z", window_end: "2026-09-05T00:00:00Z", blur_obligation: "FULL_PRIVACY" }
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { t_id: $.data.id }
            - call: "POST /v1/imagery-tasks/${t_id}/schedule"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-1"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/imagery-tasks/${t_id}/capture"
              payload: { capture_media_count: 3 }
              as: ImageryOperator
              as_user_id: "op-1"
            - call: "POST /v1/imagery-tasks/${t_id}/blur-complete"
              payload: { blurred_media_count: 3 }
              as: ImageryOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /v1/imagery-tasks/${t_id}/publish"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-1"
            - call: "GET /v1/regions/${r_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r_posture: $.data.posture, r_pending: $.data.privacy_pending_count }
          assert:
            - "Region.privacy_pending_count == 0"
            - "Region.posture == CLEAR (captured media exists, none pending)"
            - "ImageryTask.${t_id}.status == PUBLISHED"

