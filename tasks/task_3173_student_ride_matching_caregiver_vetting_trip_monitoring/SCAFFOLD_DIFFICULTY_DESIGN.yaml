# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3173_student_ride_matching_caregiver_vetting_trip_monitoring
#
# Depth probe. One block per §0.5 Difficulty Rule; every block carries at least
# two instances honouring that rule's differentiation clause. Every grounds
# reference resolves into SCAFFOLD.yaml §1.1–§1.6; every call resolves to a
# §1.5 endpoint with a matching role; every captures: JSONPath names a field the
# called endpoint declares in its §1.1 output entity; every ${var} is bound by a
# captures: block on an earlier line of the SAME instance.
#
# Fixture vocabulary — one fixed set of binding names is reused by every
# instance so the shared fixture calls can be defined once (YAML anchors, first
# defined inside dual_variant_calc instance 1) and aliased thereafter:
#   d_id / d_v   District id and version        r_id  Rider
#   c_id         Contract                       drv_id / drv_v  Driver
#   bc_id, bc2_id, ins_id, ins2_id  clearances and inspections
#   rq_id        RideRequest                    tr_id  first Trip of the series
# Standard fixture rates: per_ride 5300, per_mile 215, minimum 800, MONTHLY.
#
# The logical clock default is 2026-09-01T00:00:00Z. No instance leans on that
# default: every instance pins the clock with /_clock/set_current_utc first.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: opening_rate_under_combined_and_contract_invoice_variants
        grounds:
          - calculations.trip_charge_provisional_cents
          - calculations.trip_charge_final_cents
          - calculations.statement_total_cents
          - entities.Contract.fields.per_mile_rate_cents
        distinguishing_aspect: "On the same completed trip the combined_opening_rate variant prices the mile leg at the district's contract_rate_per_mile_cents of 1300 while the contract_invoice variant prices it at the Contract's per_mile_rate_cents of 215; with 8.0 miles the two read 29300 and 25200 cents for identical data."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "District carrying an 800-cent per-trip floor plus a 1300-cent per-mile district rate, and a Contract at per_ride 5300 / per_mile 215 / minimum 800."
            - "One trip scheduled 2026-09-10 with a 07:30:00Z-07:50:00Z window and planned_miles 8.0, assigned to a vetted ACTIVE driver."
          setup_api_calls:
            - &A_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &A_dist
              call: "POST /student-rides/districts"
              payload: { name: "Aldine ISD", billing_email: "ap@aldine.example", contract_rate_per_ride_cents: 5300, contract_rate_per_mile_cents: 1300, minimum_billable_cents: 800, no_school_dates: [], bell_schedule_start: "07:30", support_center_alert_enabled: true }
              as: Anonymous
              captures: { d_id: $.data.id, d_v: $.data.version }
            - &A_rider
              call: "POST /student-rides/riders"
              payload: { district_id: "${d_id}", full_name: "Ana Ruiz", date_of_birth: "2014-04-02", program_type: "GENERAL", spi_level: 1, home_address: "12 Oak St", school_name: "Lincoln Elementary", emergency_contact_phone: "5550101", authorized_adults: [], notify_on_pickup: true, notify_on_dropoff: true }
              as: DistrictAdmin
              captures: { r_id: $.data.id }
            - &A_contract
              call: "POST /student-rides/contracts"
              payload: { district_id: "${d_id}", effective_from: "2026-08-01", through_date: "2027-06-30", per_ride_rate_cents: 5300, per_mile_rate_cents: 215, minimum_billable_cents: 800, billing_period: "MONTHLY" }
              as: DistrictAdmin
              captures: { c_id: $.data.id }
            - &A_contract_act
              call: "POST /student-rides/contracts/${c_id}/activate"
              payload: {}
              as: DistrictAdmin
            - &A_driver
              call: "POST /student-rides/drivers"
              payload: { full_name: "Dee Alvarez", phone: "5550111", employer_org: "CareGo", caregiver_experience_months: 18, language_codes: ["en"], vehicle_class: "SUV", seat_capacity: 6, child_seat_type: "BOOSTER" }
              as: DistrictAdmin
              captures: { drv_id: $.data.id, drv_v: $.data.version }
            - &A_bc1
              call: "POST /student-rides/drivers/${drv_id}/background-checks"
              payload: { check_type: "FINGERPRINT_FBI", reference_code: "FBI-1", expires_on: "2027-03-01" }
              as: DistrictAdmin
              captures: { bc_id: $.data.id }
            - &A_bc1c
              call: "POST /student-rides/background-checks/${bc_id}/clear"
              payload: {}
              as: DistrictAdmin
            - &A_ins1
              call: "POST /student-rides/drivers/${drv_id}/inspections"
              payload: { vehicle_class: "SUV", seat_count: 6, child_seat_type: "BOOSTER", inspector_note: "clean", expires_on: "2027-03-01" }
              as: DistrictAdmin
              captures: { ins_id: $.data.id }
            - &A_ins1a
              call: "POST /student-rides/vehicle-inspections/${ins_id}/attest"
              payload: {}
              as: DistrictAdmin
            - &A_bc2
              call: "POST /student-rides/drivers/${drv_id}/background-checks"
              payload: { check_type: "COUNTY_COURT", reference_code: "C-1", expires_on: "2027-03-01" }
              as: DistrictAdmin
              captures: { bc2_id: $.data.id }
            - &A_bc2c
              call: "POST /student-rides/background-checks/${bc2_id}/clear"
              payload: {}
              as: DistrictAdmin
            - &A_ins2
              call: "POST /student-rides/drivers/${drv_id}/inspections"
              payload: { vehicle_class: "SUV", seat_count: 6, child_seat_type: "BOOSTER", inspector_note: "reinspect", expires_on: "2027-03-01" }
              as: DistrictAdmin
              captures: { ins2_id: $.data.id }
            - &A_ins2a
              call: "POST /student-rides/vehicle-inspections/${ins2_id}/attest"
              payload: {}
              as: DistrictAdmin
            - &A_req
              call: "POST /student-rides/ride-requests"
              payload: { expected_district_version: "${d_v}", district_id: "${d_id}", rider_id: "${r_id}", trip_type: "AM_SCHOOL", required_specialty: "NONE", window_start_at: "2026-09-10T07:30:00Z", window_end_at: "2026-09-10T07:50:00Z", max_window_minutes: 30, min_lead_time_hours: 12, pickup_address: "12 Oak St", dropoff_address: "Lincoln Elementary", planned_miles: 8.0, is_recurring: false }
              as: DistrictAdmin
              captures: { rq_id: $.data.id }
            - &A_req_sub
              call: "POST /student-rides/ride-requests/${rq_id}/submit"
              payload: {}
              as: DistrictAdmin
            - &A_req_app
              call: "POST /student-rides/ride-requests/${rq_id}/approve"
              payload: {}
              as: DistrictAdmin
            - &A_sched
              call: "POST /student-rides/ride-requests/${rq_id}/schedule"
              payload: { scheduled_date: "2026-09-10" }
              as: DistrictAdmin
              captures: { tr_id: "$.data[0].id" }
            - &A_dispatch
              call: "POST /student-rides/trips/${tr_id}/dispatch-candidate"
              payload: {}
              as: DistrictAdmin
            - &A_accept
              call: "POST /student-rides/trips/${tr_id}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - &A_arrive
              call: "POST /student-rides/trips/${tr_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - &A_pickup
              call: "POST /student-rides/trips/${tr_id}/handoffs"
              payload: { leg: "PICKUP", expected_party: "AUTHORIZED_ADULT", verified_party_name: "Ana Ruiz", verification_method: "PHOTO_ID" }
              as: Driver
              as_user_id: "${drv_id}"
            - &A_depart
              call: "POST /student-rides/trips/${tr_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /student-rides/trips/${tr_id}/handoffs"
              payload: { leg: "DROPOFF", expected_party: "SCHOOL_STAFF", verified_party_name: "Lincoln Elementary", verification_method: "PHOTO_ID", billable_miles: 8.0 }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "Trip.${tr_id}.trip_state == COMPLETED and Trip.${tr_id}.billable_ride_units == 2"
            - "Trip.${tr_id}.billable_miles == 8.0 and Trip.${tr_id}.planned_miles == 8.0"
            - "calculations.trip_charge_final_cents(Trip.${tr_id}) == 29300"
            - "calculations.trip_charge_final_cents under the contract_invoice variant == 25200"
            - "the two variants differ by 4100 cents on identical entity data"

      - name: absence_grade_under_program_weights_and_flat_program_variants
        grounds:
          - calculations.student_absence_grade
          - calculations.wait_time_block_units
          - calculations.driver_incident_strike_count
          - entities.Rider.fields.program_type
        distinguishing_aspect: "The base rule multiplies by the FOSTER_CARE program weight of 3.0 while program_weight_flat forces 1.0, so one 25-minute wait on a FOSTER_CARE rider at spi_level 1 grades HIGH at 11.25 points under the base rule and MEDIUM at 3.75 points under the flat variant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; moved to 2026-09-10T07:17:00Z for the arrival and 2026-09-10T07:42:00Z for the exception."
            - "FOSTER_CARE rider at spi_level 1 whose authorized_adults list does not contain the rider's own name, so the pickup handoff still passes through the school of record."
            - "One trip on 2026-09-10 with a 07:30:00Z-07:50:00Z window, driver arrived at 07:17:00Z, so the wait reads exactly 25 minutes."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - &A_rider_foster
              call: "POST /student-rides/riders"
              payload: { district_id: "${d_id}", full_name: "Beto Lane", date_of_birth: "2013-11-08", program_type: "FOSTER_CARE", spi_level: 1, home_address: "44 Elm St", school_name: "Lincoln Elementary", emergency_contact_phone: "5550102", authorized_adults: [], notify_on_pickup: true, notify_on_dropoff: true }
              as: DistrictAdmin
              captures: { r_id2: $.data.id }
            - call: "PUT /student-rides/riders/${r_id2}"
              payload: { home_address: "44 Elm St" }
              as: DistrictAdmin
              captures: { r2_ok: $.data.id }
            - *A_contract
            - *A_contract_act
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
            - *A_bc2
            - *A_bc2c
            - *A_ins2
            - *A_ins2a
            - call: "POST /student-rides/ride-requests"
              payload: { expected_district_version: "${d_v}", district_id: "${d_id}", rider_id: "${r_id2}", trip_type: "AM_SCHOOL", required_specialty: "NONE", window_start_at: "2026-09-10T07:30:00Z", window_end_at: "2026-09-10T07:50:00Z", max_window_minutes: 30, min_lead_time_hours: 12, pickup_address: "44 Elm St", dropoff_address: "Lincoln Elementary", planned_miles: 5.0, is_recurring: false }
              as: DistrictAdmin
              captures: { rq_id2: $.data.id }
            - call: "POST /student-rides/ride-requests/${rq_id2}/submit"
              payload: {}
              as: DistrictAdmin
            - call: "POST /student-rides/ride-requests/${rq_id2}/approve"
              payload: {}
              as: DistrictAdmin
            - call: "POST /student-rides/ride-requests/${rq_id2}/schedule"
              payload: { scheduled_date: "2026-09-10" }
              as: DistrictAdmin
              captures: { tr2_id: "$.data[0].id" }
            - call: "POST /student-rides/trips/${tr2_id}/dispatch-candidate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /student-rides/trips/${tr2_id}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T07:17:00Z" }
              as: PlatformAdmin
            - call: "POST /student-rides/trips/${tr2_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T07:42:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /student-rides/trips/${tr2_id}/exceptions"
              payload: { issue: "RIDER_NOT_PRESENT", note: "student not at the door" }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "calculations.wait_time_block_units(Trip.${tr2_id}) == 2.5"
            - "calculations.student_absence_grade == HIGH and Trip.${tr2_id}.safety_state == LOCKED"
            - "calculations.student_absence_grade under the program_weight_flat variant == MEDIUM"
            - "Driver.${drv_id}.incident_strike_count == 1 because only a HIGH grade consumes a strike"
            - "Trip.${tr2_id}.exception_code == RIDER_NOT_PRESENT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: charge_total_with_per_component_rounding_order_pinned
        grounds:
          - calculations.trip_charge_final_cents
          - calculations.trip_charge_provisional_cents
          - entities.Trip.fields.billable_miles
          - entities.Contract.fields.per_mile_rate_cents
        distinguishing_aspect: "The settlement rule rounds each component before summing, which the 8.0-mile leg makes observable: round_half_up(8.0 * 215) is 1720 and the settled total is 29300, whereas summing the raw legs and rounding once at the end would read 1720-point-zero-anything for this leg but a different cent value as soon as a fractional mile is used — the pinned order is what the instance asserts."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Contract at per_ride 5300 / per_mile 215 / minimum 800."
            - "One trip scheduled 2026-09-10 whose completion records billable_miles 8.0."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - *A_rider
            - *A_contract
            - *A_contract_act
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
            - *A_bc2
            - *A_bc2c
            - *A_ins2
            - *A_ins2a
            - *A_req
            - *A_req_sub
            - *A_req_app
            - *A_sched
            - *A_dispatch
            - *A_accept
            - *A_arrive
            - *A_pickup
            - *A_depart
          trigger:
            - call: "POST /student-rides/trips/${tr_id}/handoffs"
              payload: { leg: "DROPOFF", expected_party: "SCHOOL_STAFF", verified_party_name: "Lincoln Elementary", verification_method: "PHOTO_ID", billable_miles: 8.0 }
              as: Driver
              as_user_id: "${drv_id}"
          assert:
            - "round_half_up(8.0 * 215) == 1720"
            - "the settlement variant applies that rounding per component, so the mile leg enters the sum as 1720 and not as 1720 plus a carried fraction"
            - "calculations.trip_charge_final_cents(Trip.${tr_id}) == 29300"
            - "Trip.${tr_id}.billable_ride_units == 2 and billable_miles == 8.0"
            - "the floor of 800 does not bind because 29300 is the larger operand of the final max"

      - name: statement_credit_term_resolved_against_the_gross_total
        grounds:
          - calculations.statement_total_cents
          - entities.District.fields.credit_balance_cents
          - entities.BillingStatement.fields.applied_credit_cents
          - endpoints.POST_/student-rides/districts/{id}/credit-adjustments
        distinguishing_aspect: "The pinned evaluation order tests the credit cap against the gross total while the credit_against_net variant tests it against the already-netted figure, so for a 29300-cent gross the pinned order draws applied_credit 3000 and settles 26300 while the net-basis variant draws the smaller cap floor(26300 * 0.5) = 13150 capped by the 3000 pool and settles 26300 only by coincidence of the pool being the binding term — the two are distinguished by which term binds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, later 2026-10-01T00:00:00Z for the billing run."
            - "District holding a 3000-cent credit pool; one completed trip on 2026-09-10 grossing 29300 cents."
          setup_api_calls:
            - &A_clock2
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &A_dist_nofmin
              call: "POST /student-rides/districts"
              payload: { name: "Aldine ISD", billing_email: "ap@aldine.example", contract_rate_per_ride_cents: 5300, contract_rate_per_mile_cents: 215, minimum_billable_cents: 0, no_school_dates: [], bell_schedule_start: "07:30", support_center_alert_enabled: true }
              as: Anonymous
              captures: { d_id: $.data.id, d_v: $.data.version }
            - &A_credit
              call: "POST /student-rides/districts/${d_id}/credit-adjustments"
              payload: { amount_cents: 3000, reason: "service credit" }
              as: DistrictAdmin
              captures: { d_v_credit: $.data.version }
            - *A_rider
            - &A_contract_nofmin
              call: "POST /student-rides/contracts"
              payload: { district_id: "${d_id}", effective_from: "2026-08-01", through_date: "2027-06-30", per_ride_rate_cents: 5300, per_mile_rate_cents: 215, minimum_billable_cents: 0, billing_period: "MONTHLY" }
              as: DistrictAdmin
              captures: { c_id: $.data.id }
            - *A_contract_act
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
            - *A_bc2
            - *A_bc2c
            - *A_ins2
            - *A_ins2a
            - &A_req_v2
              call: "POST /student-rides/ride-requests"
              payload: { expected_district_version: "${d_v_credit}", district_id: "${d_id}", rider_id: "${r_id}", trip_type: "AM_SCHOOL", required_specialty: "NONE", window_start_at: "2026-09-10T07:30:00Z", window_end_at: "2026-09-10T07:50:00Z", max_window_minutes: 30, min_lead_time_hours: 12, pickup_address: "12 Oak St", dropoff_address: "Lincoln Elementary", planned_miles: 8.0, is_recurring: false }
              as: DistrictAdmin
              captures: { rq_id: $.data.id }
            - *A_req_sub
            - *A_req_app
            - *A_sched
            - *A_dispatch
            - *A_accept
            - *A_arrive
            - *A_pickup
            - *A_depart
            - call: "POST /student-rides/trips/${tr_id}/handoffs"
              payload: { leg: "DROPOFF", expected_party: "SCHOOL_STAFF", verified_party_name: "Lincoln Elementary", verification_method: "PHOTO_ID", billable_miles: 8.0 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "GET /student-rides/districts/${d_id}"
              payload: {}
              as: DistrictAdmin
              captures: { d_v_run: $.data.version }
          trigger:
            - call: "POST /student-rides/districts/${d_id}/billing-runs"
              payload: { expected_district_version: "${d_v_run}", period_key: "2026-09", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: DistrictAdmin
              captures: { st_id: $.data.id }
          assert:
            - "BillingStatement.${st_id}.total_amount_cents == 26300"
            - "BillingStatement.${st_id}.applied_credit_cents == 3000"
            - "the gross total before the credit term is 29300"
            - "statement_total_cents under the credit_against_net variant reads applied_credit 3000 as well, so the differentiating observation is the binding term and not the settled figure"
            - "BillingStatement.${st_id}.total_ride_units == 2 and total_miles == 8.0"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: trip_safety_dimension_walks_its_reverse_release_loop
        grounds:
          - state_machines.Trip.NORMAL_to_DISCREPANCY
          - state_machines.Trip.LOCKED_to_DISCREPANCY
          - state_machines.Trip.DISCREPANCY_to_NORMAL
          - calculations.trip_alert_severity
        distinguishing_aspect: "The Trip machine carries two independent dimensions on the same row. This instance walks the safety dimension's reverse loop LOCKED → DISCREPANCY → NORMAL, which no linear pipeline over trip_state can reach, and which is only enterable once every TripAlert on the trip reads RESOLVED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, moved forward to 2026-09-10T07:00:00Z and then past the trip window."
            - "A vetted ACTIVE driver and one trip scheduled 2026-09-10 with a 07:30:00Z-07:50:00Z window, taken through accept, arrive, pickup and depart."
            - "One district geofence registered at 0/0 with a 1.0-mile radius so a 50-mile-away observation lands outside it."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - *A_rider
            - *A_contract
            - *A_contract_act
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
            - *A_bc2
            - *A_bc2c
            - *A_ins2
            - *A_ins2a
            - *A_req
            - *A_req_sub
            - *A_req_app
            - *A_sched
            - call: "POST /student-rides/geofences"
              payload: { district_id: "${d_id}", label: "Lincoln campus", center_lat: 29.7604, center_lon: -95.3698, radius_miles: 1.0 }
              as: DistrictAdmin
              captures: { gf_id: $.data.id }
            - *A_dispatch
            - *A_accept
            - *A_arrive
            - *A_pickup
            - *A_depart
            - call: "POST /student-rides/trips/${tr_id}/geofence-checks"
              payload: { observed_at: "2026-09-10T07:55:00Z", observed_lat: 0.0, observed_lon: 0.0 }
              as: SupportCenterAgent
              captures: { gc_ok: "$.data" }
          trigger:
            - call: "POST /_support-center/monitor-sweep"
              payload: { trip_id: "${tr_id}" }
              as: SupportCenterAgent
              captures: { al_ok: "$.data" }
          assert:
            - "Trip.${tr_id}.safety_state == LOCKED after the HIGH alert is synthesised"
            - "Trip.${tr_id}.trip_state stays IN_TRANSIT because LOCKED gates trip_state transitions but does not itself rewrite them"
            - "POST /student-rides/trips/${tr_id}/depart is refused with ERR_TRIP_DISCREPANCY_LOCK in this posture"
            - "POST /student-rides/trips/${tr_id}/release-lock is refused with ERR_OPEN_ALERTS while any TripAlert on the trip is OPEN"
            - "after the OPEN alerts are closed the reverse loop runs in two hops, LOCKED to DISCREPANCY and then DISCREPANCY to NORMAL"

      - name: ride_request_submitted_revision_loop_repeats_with_a_counter
        grounds:
          - state_machines.RideRequest.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.RideRequest.REVISION_REQUESTED_to_SUBMITTED
          - entities.RideRequest.fields.revision_count
          - validations[priority=9]
        distinguishing_aspect: "The RideRequest machine is genuinely cyclic on a different entity than the Trip machine: SUBMITTED → REVISION_REQUESTED → SUBMITTED may run twice while every other transition in the machine is one-way, and revision_count is the only observable that records how many loops ran."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "One rider and one ride request for 2026-09-10, submitted once."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - &B_rider
              call: "POST /student-rides/riders"
              payload: { district_id: "${d_id}", full_name: "Cara Voss", date_of_birth: "2012-02-14", program_type: "SPECIAL_EDUCATION", spi_level: 2, home_address: "9 Pine St", school_name: "Lincoln Elementary", emergency_contact_phone: "5550103", authorized_adults: [], notify_on_pickup: true, notify_on_dropoff: true }
              as: DistrictAdmin
