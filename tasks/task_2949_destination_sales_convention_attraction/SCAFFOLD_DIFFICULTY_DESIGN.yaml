  - rule_id: non_linear_state_machine
    instances:
      - name: bid_revision_returns_to_draft_then_reenters_submitted_as_round_two
        grounds:
          - state_machines.BidPackage.SUBMITTED_to_DRAFT_on_revision_requested
          - state_machines.BidPackage.DRAFT_to_INCENTIVE_PENDING
          - state_machines.BidPackage.APPROVED_to_SUBMITTED
          - state_machines.Opportunity.sales_stage.BIDDING_to_QUALIFIED
          - entities.BidPackage.fields.round_number
        distinguishing_aspect: |
          The bid package leaves SUBMITTED, re-enters an earlier state DRAFT, and then walks the whole
          DRAFT -> INCENTIVE_PENDING -> APPROVED -> SUBMITTED arc a second time on the SAME row, with
          round_number now 2, a NEW response_due_at and a NEW fund charge; the backward hop also clears
          six previously-populated money fields and drags Opportunity.sales_stage BIDDING -> QUALIFIED,
          so a forward-only implementation either refuses the revision or leaves stale round-1 money behind.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; the full round-1 chain of instance dual_variant_calc/impact_provisional_vs_final_diverge_for_same_opportunity up to and including POST /bid-packages/{id}/submit"
