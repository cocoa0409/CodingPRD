# =============================================================================
# Foundation Scholarship Management — benchmark seed tables (v1)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: "Foundation Scholarship Management: scholarship fund/criteria, applicant eligibility match, recommendation/transcript upload, scoring rubric, committee assignment, award/disbursement to institution, GPA-conditioned renewal, stewardship/thank-you"

domain_name: foundation-scholarship-mgmt
api_prefix: ""    # flat topology: every entity has a top-level collection; FKs resolved via filtered-list GETs

complexity_profile:
  primary_archetype: multi_party_negotiation     # committee scoring + award decision
  secondary_archetype: quota_allocation          # finite endowment committed then disbursed
  complexity_layers:
    - dual_variant_calculation                   # provisional vs final award; both off same applicant data
    - cascading_side_effects                      # award -> fund ledger; disburse settle/return -> fund ledger + award
    - rate_threshold_triggers                     # GPA renewal cutoff; rubric quorum threshold; score floor
    - derived_field_reconciliation                # fund committed_cents / disbursed_cents / available_cents
    - optimistic_concurrency                      # OCC on ScholarshipFund.version for award commit

  entity_topology: flat
  # Every entity is a top-level collection with FK references in the body; FKs are
  # resolved through filtered-list GETs (e.g. GET /applications?fund_id=...).

  state_machine_shape: cyclic
  # Application has a review<->revision loop; Award/RenewalReview cycle term-over-term;
  # CommitteeAssignment branches (decline/complete/revoke).

  relationship_patterns:
    - one_to_many        # Fund -> Application; Application -> RubricScore
    - many_to_many       # Application <-> CommitteeMember via CommitteeAssignment
    - cross_aggregate    # Application -> Applicant; Award -> Fund + Application

  role_model: peer_roles
  # FoundationAdmin (fund/criteria/review/award), Applicant (own application + uploads +
  # stewardship), CommitteeMember (own assignments + scores), DisbursementOfficer (disburse).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ScholarshipFund
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: fund_name, type: string, source: input, description: "Name of the scholarship fund" }
      - { name: endowment_cents, type: integer, source: input, description: "Total endowment available to commit, in cents", constraints: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, description: "Read-only derived: sum of provisional_award_cents over Awards on this fund whose status IN {COMMITTED, ACTIVE, RENEWAL_PENDING}" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Read-only derived: sum of amount_cents over Disbursements on this fund whose status == SETTLED" }
      - { name: available_cents, type: integer, source: computed, description: "Read-only derived = endowment_cents - committed_cents" }
      - { name: award_term, type: enum, source: input, default: "FALL", description: "Disbursement term label", constraints: "FALL | SPRING | SUMMER" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | OPEN | REVIEW | AWARDING | CLOSED" }

  - name: EligibilityCriteria
    parent: ScholarshipFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id; owning fund" }
      - { name: min_gpa, type: number, source: input, description: "Minimum GPA an applicant must meet, 0.00-4.00", constraints: "0.0 <= min_gpa <= 4.0; 2 decimals" }
      - { name: required_residency_state, type: string, source: input, description: "Two-letter residency state the applicant must match exactly, or 'ANY'" }
      - { name: required_field_of_study, type: string, source: input, description: "Field of study the applicant must match exactly, or 'ANY'" }
      - { name: max_award_cents, type: integer, source: input, description: "Maximum award amount any single application may receive from this fund, in cents", constraints: "> 0" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: email, type: string, source: input, description: "Applicant contact email" }
      - { name: self_reported_gpa, type: number, source: input, description: "Self-reported GPA at registration, 0.00-4.00", constraints: "0.0 <= gpa <= 4.0" }
      - { name: residency_state, type: string, source: input, description: "Two-letter residency state code" }
      - { name: field_of_study, type: string, source: input, description: "Declared field of study" }
      - { name: institution_id, type: string, source: input, description: "Identifier of the institution the applicant attends (free-form institution code)" }

  - name: Application
    parent: ScholarshipFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id; fund applied to" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the applying student" }
      - { name: eligibility_matched, type: boolean, source: computed, description: "Read-only: true iff applicant data satisfies the fund's EligibilityCriteria at submission; null before submit" }
      - { name: eligibility_failures, type: array, source: computed, description: "Read-only: failed-criterion codes among {GPA, RESIDENCY, FIELD} computed at submission, in order [GPA, RESIDENCY, FIELD]" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the applicant requests, in cents", constraints: "> 0" }
      - { name: rubric_total, type: number, source: computed, description: "Read-only weighted rubric mean over SUBMITTED RubricScores; null until finalize-scoring" }
      - { name: revision_round, type: integer, source: computed, description: "Read-only count of UNDER_REVIEW -> NEEDS_REVISION cycles, starts at 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | NEEDS_REVISION | SCORED | AWARDED | REJECTED | WITHDRAWN" }

  - name: Recommendation
    parent: Application
    common_fields: false   # immutable upload record: id + created_at only
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application this recommendation supports" }
      - { name: recommender_name, type: string, source: input, description: "Name of the recommender" }
      - { name: document_uri, type: string, source: input, description: "URI of the uploaded recommendation document" }

  - name: Transcript
    parent: Application
    common_fields: false   # immutable upload record: id + created_at only
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application this transcript supports" }
      - { name: document_uri, type: string, source: input, description: "URI of the uploaded transcript document" }
      - { name: verified_gpa, type: number, source: input, description: "Registrar-verified GPA from the transcript, 0.00-4.00", constraints: "0.0 <= gpa <= 4.0; 2 decimals" }

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Committee member full name" }
      - { name: email, type: string, source: input, description: "Committee member contact email" }
      - { name: expertise_field, type: string, source: input, description: "Field of expertise" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Read-only: count of this member's CommitteeAssignments whose status == ASSIGNED" }

  - name: CommitteeAssignment
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application under assignment" }
      - { name: committee_member_id, type: string, source: input, description: "FK -> CommitteeMember.id; assigned reviewer" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "ASSIGNED | DECLINED | COMPLETED | REVOKED" }

  - name: RubricScore
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; scored application" }
      - { name: committee_member_id, type: string, source: input, description: "FK -> CommitteeMember.id; scoring reviewer" }
      - { name: academic_score, type: integer, source: input, description: "Academic merit raw score 0-100", constraints: "0 <= s <= 100" }
      - { name: need_score, type: integer, source: input, description: "Financial need raw score 0-100", constraints: "0 <= s <= 100" }
      - { name: essay_score, type: integer, source: input, description: "Essay raw score 0-100", constraints: "0 <= s <= 100" }
      - { name: weighted_value, type: number, source: computed, description: "Read-only weighted single-reviewer score per calculations.rubric_weighted_value; null until submit" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | SUBMITTED | RETRACTED" }

  - name: Award
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; awarded application" }
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id; funding source" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Read-only amount committed at AWARD time per calculations.provisional_award (forward-looking on rubric_total)" }
      - { name: final_award_cents, type: integer, source: computed, description: "Read-only amount fixed at disbursement per calculations.final_award (chronological on verified GPA); null until disburse" }
      - { name: renewal_gpa_floor, type: number, source: computed, description: "Read-only GPA floor copied from EligibilityCriteria.min_gpa at AWARD time, used by renewal" }
      - { name: term_index, type: integer, source: computed, description: "Read-only renewal counter, starts at 1 at AWARD, +1 per approved renewal" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "COMMITTED | ACTIVE | RENEWAL_PENDING | LAPSED | REVOKED | COMPLETED" }

  - name: Disbursement
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award being paid" }
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id; paying fund" }
      - { name: institution_id, type: string, source: input, description: "Institution receiving the funds (free-form institution code)" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only payment amount = Award.final_award_cents at the time of disbursement" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "PENDING | SETTLED | RETURNED" }

  - name: RenewalReview
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award under renewal" }
      - { name: reported_gpa, type: number, source: input, description: "Latest GPA reported for renewal, 0.00-4.00", constraints: "0.0 <= gpa <= 4.0" }
      - { name: meets_floor, type: boolean, source: computed, description: "Read-only: true iff reported_gpa >= Award.renewal_gpa_floor" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "PENDING | APPROVED | DENIED" }

  - name: StewardshipRecord
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; award being acknowledged" }
      - { name: thank_you_text, type: string, source: input, description: "Recipient thank-you / stewardship message" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | ACKNOWLEDGED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ScholarshipFund
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /scholarship-funds/{fundId}/open"
        actor: FoundationAdmin
        preconditions:
          - "Fund.status == DRAFT (ERR_FUND_STATE_INVALID)"
          - "Fund has exactly one EligibilityCriteria (ERR_CRITERIA_REQUIRED)"
        side_effects: []
      - from: OPEN
        to: REVIEW
        trigger: "POST /scholarship-funds/{fundId}/begin-review"
        actor: FoundationAdmin
        preconditions:
          - "Fund.status == OPEN (ERR_FUND_NOT_OPEN)"
        side_effects: []
      - from: REVIEW
        to: AWARDING
        trigger: "POST /scholarship-funds/{fundId}/begin-awarding"
        actor: FoundationAdmin
        preconditions:
          - "Fund.status == REVIEW (ERR_FUND_NOT_IN_REVIEW)"
        side_effects: []
      - from: AWARDING
        to: CLOSED
        trigger: "POST /scholarship-funds/{fundId}/close"
        actor: FoundationAdmin
        preconditions:
          - "Fund.status == AWARDING (ERR_FUND_NOT_AWARDING)"
          - "No Application with this fund_id in status IN {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, SCORED} (ERR_OPEN_APPLICATIONS_EXIST)"
        side_effects: []

  - entity: Application
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT (ERR_APPLICATION_STATE_INVALID)"
          - "Acting Applicant owns this application: X-User-ID == Application.applicant_id (ERR_NOT_APPLICATION_OWNER)"
          - "Owning Fund.status == OPEN (ERR_FUND_NOT_OPEN)"
          - "Application has >= 1 Recommendation (ERR_RECOMMENDATION_REQUIRED)"
          - "Application has exactly 1 Transcript (ERR_TRANSCRIPT_REQUIRED)"
        side_effects:
          - "Compute eligibility_matched and eligibility_failures against the fund's EligibilityCriteria using Transcript.verified_gpa, Applicant.residency_state, Applicant.field_of_study (calculations.eligibility_match)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{applicationId}/start-review"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == SUBMITTED (ERR_APPLICATION_STATE_INVALID)"
          - "Owning Fund.status == REVIEW (ERR_FUND_NOT_IN_REVIEW)"
          - "Application.eligibility_matched == true (ERR_NOT_ELIGIBLE)"
          - "Application has >= 1 CommitteeAssignment in status ASSIGNED (ERR_NO_COMMITTEE_ASSIGNED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /applications/{applicationId}/request-revision"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == UNDER_REVIEW (ERR_APPLICATION_STATE_INVALID)"
        side_effects:
          - "revision_round += 1"
          - "Every RubricScore on this application in status SUBMITTED -> RETRACTED (compensation: those scores leave the rubric_total pool); rubric_total stays null"
      - from: NEEDS_REVISION
        to: UNDER_REVIEW
        trigger: "POST /applications/{applicationId}/start-review"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == NEEDS_REVISION (ERR_APPLICATION_STATE_INVALID)"
          - "Owning Fund.status == REVIEW (ERR_FUND_NOT_IN_REVIEW)"
          - "revision_round <= MAX_REVISION_ROUNDS (ERR_REVISION_LIMIT_REACHED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: SCORED
        trigger: "POST /applications/{applicationId}/finalize-scoring"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == UNDER_REVIEW (ERR_APPLICATION_STATE_INVALID)"
          - "Count of SUBMITTED RubricScore on this application >= SCORING_QUORUM (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "Compute rubric_total = mean of weighted_value over SUBMITTED RubricScores (calculations.rubric_total)"
          - "Every CommitteeAssignment in status ASSIGNED on this application -> COMPLETED (cascade; decrements each member's active_assignment_count)"
      - from: SCORED
        to: AWARDED
        trigger: "POST /applications/{applicationId}/award"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == SCORED (ERR_APPLICATION_STATE_INVALID)"
          - "Owning Fund.status == AWARDING (ERR_FUND_NOT_AWARDING)"
          - "Application.rubric_total >= AWARD_SCORE_FLOOR (ERR_SCORE_BELOW_FLOOR)"
          - "provisional_award_cents <= ScholarshipFund.available_cents (ERR_FUND_INSUFFICIENT)"
          - "expected_fund_version matches ScholarshipFund.version (ERR_STALE_FUND_VERSION)"
        side_effects:
          - "Create Award (status COMMITTED; provisional_award_cents per calculations.provisional_award; renewal_gpa_floor = criteria.min_gpa; term_index = 1; final_award_cents null)"
          - "ScholarshipFund.committed_cents += Award.provisional_award_cents; available_cents recomputed (ledger sync, calculations.fund_ledger)"
          - "increments ScholarshipFund.version by 1"
      - from: SCORED
        to: REJECTED
        trigger: "POST /applications/{applicationId}/reject"
        actor: FoundationAdmin
        preconditions:
          - "Application.status == SCORED (ERR_APPLICATION_STATE_INVALID)"
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, NEEDS_REVISION} (ERR_APPLICATION_STATE_INVALID)"
          - "Acting Applicant owns this application: X-User-ID == Application.applicant_id (ERR_NOT_APPLICATION_OWNER)"
        side_effects:
          - "Every CommitteeAssignment in status ASSIGNED on this application -> REVOKED (cascade; decrements each member's active_assignment_count)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, NEEDS_REVISION} (ERR_APPLICATION_STATE_INVALID)"
          - "Acting Applicant owns this application: X-User-ID == Application.applicant_id (ERR_NOT_APPLICATION_OWNER)"
        side_effects:
          - "Every CommitteeAssignment in status ASSIGNED on this application -> REVOKED (cascade; decrements each member's active_assignment_count)"
      - from: NEEDS_REVISION
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, NEEDS_REVISION} (ERR_APPLICATION_STATE_INVALID)"
          - "Acting Applicant owns this application: X-User-ID == Application.applicant_id (ERR_NOT_APPLICATION_OWNER)"
        side_effects:
          - "Every CommitteeAssignment in status ASSIGNED on this application -> REVOKED (cascade; decrements each member's active_assignment_count)"

  - entity: CommitteeAssignment
    initial_state: ASSIGNED
    terminal_states: [DECLINED, COMPLETED, REVOKED]
    transitions:
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /committee-assignments/{assignmentId}/decline"
        actor: CommitteeMember
        preconditions:
          - "CommitteeAssignment.status == ASSIGNED (ERR_ASSIGNMENT_STATE_INVALID)"
          - "Acting CommitteeMember owns this assignment: X-User-ID == CommitteeAssignment.committee_member_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects:
          - "Owning CommitteeMember.active_assignment_count recomputed (decrements)"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (automatic on parent Application finalize-scoring)"
        actor: system
        preconditions:
          - "Parent Application transitions UNDER_REVIEW -> SCORED"
        side_effects:
          - "Owning CommitteeMember.active_assignment_count recomputed (decrements)"
      - from: ASSIGNED
        to: REVOKED
        trigger: "system (automatic on parent Application withdraw)"
        actor: system
        preconditions:
          - "Parent Application transitions to WITHDRAWN"
        side_effects:
          - "Owning CommitteeMember.active_assignment_count recomputed (decrements)"

  - entity: RubricScore
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rubric-scores/{scoreId}/submit"
        actor: CommitteeMember
        preconditions:
          - "RubricScore.status == DRAFT (ERR_SCORE_STATE_INVALID)"
          - "Acting CommitteeMember owns this score: X-User-ID == RubricScore.committee_member_id (ERR_NOT_SCORE_OWNER)"
          - "Parent Application.status == UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
        side_effects:
          - "Compute weighted_value (calculations.rubric_weighted_value)"
      - from: SUBMITTED
        to: RETRACTED
        trigger: "system (automatic on parent Application request-revision)"
        actor: system
        preconditions:
          - "Parent Application transitions UNDER_REVIEW -> NEEDS_REVISION"
        side_effects:
          - "Excluded from rubric_total recomputation"

  - entity: Award
    initial_state: COMMITTED
    terminal_states: [REVOKED, COMPLETED]
    transitions:
      - from: COMMITTED
        to: ACTIVE
        trigger: "POST /awards/{awardId}/disburse"
        actor: DisbursementOfficer
        preconditions:
          - "Award.status == COMMITTED (ERR_AWARD_STATE_INVALID)"
          - "Parent Application has exactly 1 StewardshipRecord (on this award) in status ACKNOWLEDGED (ERR_STEWARDSHIP_REQUIRED)"
        side_effects:
          - "Compute Award.final_award_cents (calculations.final_award)"
          - "Create Disbursement (status PENDING; amount_cents = Award.final_award_cents)"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /renewal-reviews"
        actor: FoundationAdmin
        preconditions:
          - "Award.status == ACTIVE (ERR_AWARD_NOT_ACTIVE)"
        side_effects:
          - "Create RenewalReview (status PENDING; meets_floor = reported_gpa >= Award.renewal_gpa_floor, calculations.renewal_floor_check)"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /renewal-reviews/{reviewId}/approve"
        actor: FoundationAdmin
        preconditions:
          - "Award.status == RENEWAL_PENDING (ERR_AWARD_STATE_INVALID)"
          - "RenewalReview.meets_floor == true (ERR_GPA_BELOW_FLOOR)"
          - "ScholarshipFund.available_cents >= Award.provisional_award_cents (ERR_FUND_INSUFFICIENT)"
        side_effects:
          - "RenewalReview.status -> APPROVED"
          - "Award.term_index += 1"
          - "ScholarshipFund.committed_cents += Award.provisional_award_cents; available_cents recomputed (renewal re-commit, ledger sync, calculations.fund_ledger)"
      - from: RENEWAL_PENDING
        to: LAPSED
        trigger: "POST /renewal-reviews/{reviewId}/deny"
        actor: FoundationAdmin
        preconditions:
          - "Award.status == RENEWAL_PENDING (ERR_AWARD_STATE_INVALID)"
        side_effects:
          - "RenewalReview.status -> DENIED"
          - "ScholarshipFund.committed_cents -= Award.provisional_award_cents; available_cents recomputed (release current-term commitment, ledger sync, calculations.fund_ledger)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /awards/{awardId}/complete"
        actor: FoundationAdmin
        preconditions:
          - "Award.status == ACTIVE (ERR_AWARD_STATE_INVALID)"
        side_effects: []
      - from: COMMITTED
        to: REVOKED
        trigger: "POST /awards/{awardId}/revoke"
        actor: FoundationAdmin
        preconditions:
          - "Award.status == COMMITTED (ERR_AWARD_STATE_INVALID)"
          - "No Disbursement on this award in status SETTLED (ERR_AWARD_ALREADY_DISBURSED)"
        side_effects:
          - "ScholarshipFund.committed_cents -= Award.provisional_award_cents; available_cents recomputed (compensation: release commitment, ledger sync, calculations.fund_ledger)"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [SETTLED, RETURNED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /disbursements/{disbursementId}/settle"
        actor: DisbursementOfficer
        preconditions:
          - "Disbursement.status == PENDING (ERR_DISBURSEMENT_STATE_INVALID)"
        side_effects:
          - "ScholarshipFund.disbursed_cents += Disbursement.amount_cents (ledger sync, calculations.fund_ledger)"
      - from: PENDING
        to: RETURNED
        trigger: "POST /disbursements/{disbursementId}/return"
        actor: DisbursementOfficer
        preconditions:
          - "Disbursement.status == PENDING (ERR_DISBURSEMENT_STATE_INVALID)"
        side_effects:
          - "Parent Award.status reverts ACTIVE -> COMMITTED (compensation: undo the disburse transition; commitment unchanged); Award.final_award_cents reset to null"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /disbursements/{disbursementId}/return"
        actor: DisbursementOfficer
        preconditions:
          - "Disbursement.status == SETTLED (ERR_DISBURSEMENT_STATE_INVALID)"
        side_effects:
          - "ScholarshipFund.disbursed_cents -= Disbursement.amount_cents (compensation: reverse settlement, ledger sync)"
          - "ScholarshipFund.committed_cents -= Award.provisional_award_cents; available_cents recomputed (compensation: release commitment, ledger sync, calculations.fund_ledger)"
          - "Parent Award.status -> REVOKED (cascade)"

  - entity: StewardshipRecord
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: ACKNOWLEDGED
        trigger: "POST /stewardship-records/{stewardshipId}/acknowledge"
        actor: Applicant
        preconditions:
          - "StewardshipRecord.status == DRAFT (ERR_STEWARDSHIP_STATE_INVALID)"
          - "Acting Applicant owns the parent Application: X-User-ID == Application.applicant_id (ERR_NOT_APPLICATION_OWNER)"
        side_effects: []

  - entity: RenewalReview
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system (automatic on parent Award renewal approve)"
        actor: system
        preconditions:
          - "Parent Award transitions RENEWAL_PENDING -> ACTIVE"
        side_effects: []
      - from: PENDING
        to: DENIED
        trigger: "system (automatic on parent Award renewal deny)"
        actor: system
        preconditions:
          - "Parent Award transitions RENEWAL_PENDING -> LAPSED"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: award-commit-stale-fund
    parent_entity: ScholarshipFund
    write_endpoint: "POST /applications/{applicationId}/award"
    occ_field: "expected_fund_version"
    description: |
      Awarding an Application debits ScholarshipFund.committed_cents and so
      advances the fund's version. An award request that still carries the fund
      version the client observed before an earlier award committed is rejected
      as stale, because the available_cents it reasoned about no longer reflects
      the committed total. This captures the case where an earlier award
      legitimately consumed budget the current writer assumed was free.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: rubric_weighted_value
    trigger: "RubricScore submit (DRAFT -> SUBMITTED)"
    algorithm: weighted_scoring
    formula: |
      weighted_value = round(
          academic_score * W_ACADEMIC
        + need_score     * W_NEED
        + essay_score    * W_ESSAY, 2)
      Weights sum to 1.0. Each input is an integer 0-100, so weighted_value in [0.00, 100.00].
    input_set: "the single RubricScore being submitted"
    constants:
      W_ACADEMIC: 0.5
      W_NEED: 0.3
      W_ESSAY: 0.2
    precision: "2 decimal places, round_half_up"

  - name: rubric_total
    trigger: "Application finalize-scoring (UNDER_REVIEW -> SCORED)"
    algorithm: aggregation
    formula: |
      Let S = set of RubricScore where application_id == app.id AND status == SUBMITTED.
      rubric_total = round( sum(weighted_value for s in S) / count(S), 2 )
      Evaluation order is sum-then-divide-then-round: a single round at the very end.
      RETRACTED scores are excluded from S. If count(S) == 0 the transition is blocked
      upstream by the quorum precondition, so the divisor is never zero here.
    input_set: "RubricScore where application_id == app.id AND status == SUBMITTED"
    constants:
      SCORING_QUORUM: 2
    precision: "2 decimal places, round_half_up; the division is performed before the single final rounding"

  - name: eligibility_match
    trigger: "Application submit (DRAFT -> SUBMITTED)"
    algorithm: threshold
    formula: |
      Evaluate three independent criteria against the fund's EligibilityCriteria,
      using the registrar Transcript.verified_gpa (NOT Applicant.self_reported_gpa):
        gpa_ok       = (Transcript.verified_gpa >= EligibilityCriteria.min_gpa)   # >= boundary, inclusive
        residency_ok = (criteria.required_residency_state == 'ANY')
                       OR (Applicant.residency_state == criteria.required_residency_state)
        field_ok     = (criteria.required_field_of_study == 'ANY')
                       OR (Applicant.field_of_study == criteria.required_field_of_study)
      eligibility_failures = codes among {GPA, RESIDENCY, FIELD} whose *_ok is false,
        appended in the FIXED order [GPA, RESIDENCY, FIELD].
      eligibility_matched = (eligibility_failures is empty)
    input_set: "the application's single Transcript.verified_gpa, owning Applicant fields, fund's single EligibilityCriteria"
    constants: {}
    precision: "GPA comparison at 2 decimal places; >= is inclusive"

  - name: provisional_award
    trigger: "Application award (SCORED -> AWARDED); forward-looking at commitment time"
    algorithm: forward_looking
    formula: |
      Forward-looking: scales the applicant's requested amount by a SCORE-tier multiplier
      (projection of merit from rubric_total), then caps at the fund policy ceiling.
      Computed BEFORE any disbursement.
        tier_mult = MULT_HIGH if rubric_total >= TIER_HIGH
                    MULT_MID  if TIER_MID <= rubric_total < TIER_HIGH
                    MULT_LOW  if AWARD_SCORE_FLOOR <= rubric_total < TIER_MID
        raw = round_half_up(requested_amount_cents * tier_mult)   # integer cents
        provisional_award_cents = min(raw, EligibilityCriteria.max_award_cents)
      The available_cents budget check is a SEPARATE validation (ERR_FUND_INSUFFICIENT),
      not part of this formula.
    input_set: "the application's requested_amount_cents, rubric_total, fund criteria max_award_cents"
    constants:
      AWARD_SCORE_FLOOR: 60
      TIER_HIGH: 90
      TIER_MID: 75
      MULT_HIGH: 1.00
      MULT_MID: 0.80
      MULT_LOW: 0.60
    precision: "integer cents; round_half_up applied before the min() cap"
    variants:
      - name: forward_looking_provisional
        when: "at AWARD time"
        difference: "keys off the rubric_total score tier; verified GPA is not yet consulted"

  - name: final_award
    trigger: "Award disburse (COMMITTED -> ACTIVE); chronological at disbursement time"
    algorithm: chronological
    formula: |
      Chronological: recomputes the award at the moment of disbursement using the
      registrar-VERIFIED GPA on file (Transcript.verified_gpa), applying a GPA factor
      to the already-committed provisional amount, then re-capping at the fund ceiling.
      Differs from provisional_award because it incorporates verified-GPA data that
      only becomes decision-relevant at disbursement time.
        gpa_factor = FACTOR_HIGH if verified_gpa >= GPA_HIGH
                     FACTOR_MID  if GPA_MID <= verified_gpa < GPA_HIGH
                     FACTOR_LOW  if verified_gpa < GPA_MID
        raw = round_half_up(provisional_award_cents * gpa_factor)   # integer cents
        final_award_cents = min(raw, EligibilityCriteria.max_award_cents)
      Same applicant data, two algorithms: provisional keys off rubric_total tiers,
      final keys off verified_gpa factors -> divergent results.
    input_set: "Award.provisional_award_cents, the application's Transcript.verified_gpa, fund criteria max_award_cents"
    constants:
      GPA_HIGH: 3.50
      GPA_MID: 3.00
      FACTOR_HIGH: 1.00
      FACTOR_MID: 0.90
      FACTOR_LOW: 0.80
    precision: "integer cents; round_half_up applied before the min() cap"
    variants:
      - name: chronological_final
        when: "at DISBURSE time"
        difference: "applies the verified-GPA factor to the committed provisional amount"

  - name: fund_ledger
    trigger: "Award commit (award)/revoke, renewal approve/deny, Disbursement settle/return"
    algorithm: aggregation
    formula: |
      committed_cents = sum(Award.provisional_award_cents
                            for Award where fund_id == fund.id
                            AND status IN {COMMITTED, ACTIVE, RENEWAL_PENDING})
      disbursed_cents = sum(Disbursement.amount_cents
                            for Disbursement where fund_id == fund.id
                            AND status == SETTLED)
      available_cents = endowment_cents - committed_cents
      Evaluation order: committed_cents first, then available_cents derives from it.
      Pure sums (no tie-break needed); fully recomputed on each triggering side effect.
      INVARIANT: a forward award then its revoke leaves committed_cents unchanged;
      a settle then its return leaves disbursed_cents AND committed_cents unchanged.
    input_set: "Awards in {COMMITTED, ACTIVE, RENEWAL_PENDING}; Disbursements in {SETTLED}"
    constants: {}
    precision: "integer cents, exact (inputs already integer cents; no rounding)"

  - name: renewal_floor_check
    trigger: "RenewalReview creation (Award ACTIVE -> RENEWAL_PENDING)"
    algorithm: threshold
    formula: |
      meets_floor = (reported_gpa >= Award.renewal_gpa_floor)   # >= boundary, inclusive
      renewal_gpa_floor was copied from EligibilityCriteria.min_gpa at AWARD time and is
      frozen on the Award, so later edits to the fund's criteria do not change it.
    input_set: "RenewalReview.reported_gpa, Award.renewal_gpa_floor"
    constants: {}
    precision: "GPA comparison at 2 decimal places; >= is inclusive"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource id exists (fund, application, award, assignment, score, disbursement, renewal, stewardship), validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND by resource type"
    http_status: 404
    applies_to: "all single-resource and action endpoints"

  - priority: 4
    category: business_referential
    check: "Body foreign keys reference existing rows (fund_id, applicant_id, application_id, award_id, committee_member_id)"
    error_id: "ERR_FUND_NOT_FOUND / ERR_APPLICANT_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_AWARD_NOT_FOUND / ERR_COMMITTEE_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "POST create endpoints carrying FK fields"

  - priority: 5
    category: business_referential
    check: "Ownership: entity_backed acting role owns the target (Applicant owns Application & its uploads/stewardship via applicant_id; CommitteeMember owns own RubricScore/CommitteeAssignment via committee_member_id)"
    error_id: "ERR_NOT_APPLICATION_OWNER / ERR_NOT_SCORE_OWNER / ERR_NOT_ASSIGNMENT_OWNER"
    http_status: 403
    applies_to: "applicant- and committee-member-owned resource transitions"

  - priority: 6
    category: state
    check: "Parent ScholarshipFund is in the correct lifecycle state for the operation"
    error_id: "ERR_FUND_NOT_OPEN / ERR_FUND_NOT_IN_REVIEW / ERR_FUND_NOT_AWARDING / ERR_FUND_STATE_INVALID"
    http_status: 409
    applies_to: "application submit/start-review/award; fund lifecycle transitions"

  - priority: 7
    category: state
    check: "Target resource is in the correct state for the operation"
    error_id: "ERR_APPLICATION_STATE_INVALID / ERR_AWARD_STATE_INVALID / ERR_SCORE_STATE_INVALID / ERR_ASSIGNMENT_STATE_INVALID / ERR_DISBURSEMENT_STATE_INVALID / ERR_STEWARDSHIP_STATE_INVALID / ERR_AWARD_NOT_ACTIVE"
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 8
    category: business_constraint
    check: "submit requires >= 1 Recommendation and exactly 1 Transcript"
    error_id: "ERR_RECOMMENDATION_REQUIRED / ERR_TRANSCRIPT_REQUIRED"
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "start-review requires eligibility_matched == true and >= 1 ASSIGNED CommitteeAssignment"
    error_id: "ERR_NOT_ELIGIBLE / ERR_NO_COMMITTEE_ASSIGNED"
    http_status: 409
    applies_to: "POST /applications/{id}/start-review"

  - priority: 10
    category: business_constraint
    check: "Committee assignment: member must not already be ASSIGNED on this application, and must not exceed MAX_CONCURRENT_ASSIGNMENTS ASSIGNED assignments"
    error_id: "ERR_DUPLICATE_ASSIGNMENT / ERR_MEMBER_OVERLOADED"
    http_status: 409
    applies_to: "POST /committee-assignments"

  - priority: 11
    category: business_constraint
    check: "RubricScore create requires the acting member to hold an ASSIGNED assignment on the application"
    error_id: ERR_NO_ASSIGNMENT_FOR_SCORE
    http_status: 409
    applies_to: "POST /rubric-scores"

  - priority: 12
    category: business_constraint
    check: "finalize-scoring requires count(SUBMITTED RubricScore) >= SCORING_QUORUM"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /applications/{id}/finalize-scoring"

  - priority: 13
    category: business_constraint
    check: "resume to UNDER_REVIEW blocked once revision_round exceeds MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /applications/{id}/start-review from NEEDS_REVISION"

  - priority: 14
    category: business_safety
    check: "award requires rubric_total >= AWARD_SCORE_FLOOR; renewal approve requires RenewalReview.meets_floor == true"
    error_id: "ERR_SCORE_BELOW_FLOOR / ERR_GPA_BELOW_FLOOR"
    http_status: 409
    applies_to: "POST /applications/{id}/award; POST /renewal-reviews/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "disburse requires exactly 1 ACKNOWLEDGED StewardshipRecord on the award"
    error_id: ERR_STEWARDSHIP_REQUIRED
    http_status: 409
    applies_to: "POST /awards/{id}/disburse"

  - priority: 16
    category: business_constraint
    check: "revoke requires no SETTLED Disbursement on the award"
    error_id: ERR_AWARD_ALREADY_DISBURSED
    http_status: 409
    applies_to: "POST /awards/{id}/revoke"

  - priority: 17
    category: state
    check: "close fund requires no Application on the fund in {SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, SCORED}"
    error_id: ERR_OPEN_APPLICATIONS_EXIST
    http_status: 409
    applies_to: "POST /scholarship-funds/{id}/close"

  - priority: 18
    category: business_constraint
    check: "open fund requires exactly one EligibilityCriteria; at most one criteria may be attached per fund"
    error_id: "ERR_CRITERIA_REQUIRED / ERR_DUPLICATE_CRITERIA"
    http_status: 409
    applies_to: "POST /scholarship-funds/{id}/open; POST /eligibility-criteria"

  - priority: 19
    category: business_fiscal
    check: "award provisional_award_cents <= fund available_cents; renewal re-commit provisional_award_cents <= fund available_cents"
    error_id: ERR_FUND_INSUFFICIENT
    http_status: 409
    applies_to: "POST /applications/{id}/award; POST /renewal-reviews/{id}/approve"

  - priority: 20
    category: state
    check: "OCC: expected_fund_version on award must equal current ScholarshipFund.version"
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/award"

  - priority: 21
    category: business_constraint
    check: "Field-level input validation: numeric ranges (GPA 0-4, rubric scores 0-100, amounts > 0), enum membership, required fields present, pagination params in range"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_PAGINATION"
    http_status: 400
    applies_to: "all create endpoints and list endpoints"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- ScholarshipFund ---
  - method: POST
    path: "/scholarship-funds"
    description: "Create a scholarship fund"
    roles: [FoundationAdmin]
    code: 201
    input: ["fund_name", "endowment_cents", "award_term?"]
    output: ScholarshipFund
    side_effects:
      - "status = DRAFT; committed_cents = 0; disbursed_cents = 0; available_cents = endowment_cents; version = 1"

  - method: GET
    path: "/scholarship-funds"
    description: "List scholarship funds"
    roles: [FoundationAdmin, Applicant, CommitteeMember, DisbursementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ScholarshipFund[]
    side_effects: []

  - method: GET
    path: "/scholarship-funds/{fundId}"
    description: "Get a scholarship fund"
    roles: [FoundationAdmin, Applicant, CommitteeMember, DisbursementOfficer]
    code: 200
    input: []
    output: ScholarshipFund
    side_effects: []

  - method: POST
    path: "/scholarship-funds/{fundId}/open"
    description: "Open fund for applications (DRAFT -> OPEN)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: ScholarshipFund
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/scholarship-funds/{fundId}/begin-review"
    description: "Move fund to REVIEW (OPEN -> REVIEW)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: ScholarshipFund
    side_effects: ["status -> REVIEW"]

  - method: POST
    path: "/scholarship-funds/{fundId}/begin-awarding"
    description: "Move fund to AWARDING (REVIEW -> AWARDING)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: ScholarshipFund
    side_effects: ["status -> AWARDING"]

  - method: POST
    path: "/scholarship-funds/{fundId}/close"
    description: "Close fund (AWARDING -> CLOSED)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: ScholarshipFund
    side_effects: ["status -> CLOSED"]

  # --- EligibilityCriteria ---
  - method: POST
    path: "/eligibility-criteria"
    description: "Attach eligibility criteria to a fund (fund must be DRAFT; at most one per fund)"
    roles: [FoundationAdmin]
    code: 201
    input: ["fund_id", "min_gpa", "required_residency_state", "required_field_of_study", "max_award_cents"]
    output: EligibilityCriteria
    side_effects: ["second criteria on same fund -> ERR_DUPLICATE_CRITERIA"]

  - method: GET
    path: "/eligibility-criteria"
    description: "List eligibility criteria (filter by fund_id)"
    roles: [FoundationAdmin, Applicant, CommitteeMember, DisbursementOfficer]
    code: 200
    input: ["fund_id?", "limit?", "offset?"]
    output: EligibilityCriteria[]
    side_effects: []

  - method: GET
    path: "/eligibility-criteria/{criteriaId}"
    description: "Get an eligibility criteria"
    roles: [FoundationAdmin, Applicant, CommitteeMember, DisbursementOfficer]
    code: 200
    input: []
    output: EligibilityCriteria
    side_effects: []

  # --- Applicant ---
  - method: POST
    path: "/applicants"
    description: "Register an applicant"
    roles: [FoundationAdmin, Applicant]
    code: 201
    input: ["full_name", "email", "self_reported_gpa", "residency_state", "field_of_study", "institution_id"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants"
    description: "List applicants"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: Applicant[]
    side_effects: []

  - method: GET
    path: "/applicants/{applicantId}"
    description: "Get an applicant"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- CommitteeMember ---
  - method: POST
    path: "/committee-members"
    description: "Register a committee member"
    roles: [FoundationAdmin, CommitteeMember]
    code: 201
    input: ["full_name", "email", "expertise_field"]
    output: CommitteeMember
    side_effects: ["active_assignment_count = 0"]

  - method: GET
    path: "/committee-members"
    description: "List committee members"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: CommitteeMember[]
    side_effects: []

  - method: GET
    path: "/committee-members/{memberId}"
    description: "Get a committee member"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/applications"
    description: "Create an application against a fund (fund must be OPEN)"
    roles: [FoundationAdmin, Applicant]
    code: 201
    input: ["fund_id", "applicant_id", "requested_amount_cents"]
    output: Application
    side_effects: ["status = DRAFT; revision_round = 0; eligibility_matched = null until submit"]

  - method: GET
    path: "/applications"
    description: "List applications (filter by fund_id and/or applicant_id)"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: ["fund_id?", "applicant_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/applications/{applicationId}"
    description: "Get an application"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/submit"
    description: "Submit an application (DRAFT -> SUBMITTED)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["Compute eligibility_matched / eligibility_failures (calculations.eligibility_match)"]

  - method: POST
    path: "/applications/{applicationId}/start-review"
    description: "Start/resume review (SUBMITTED|NEEDS_REVISION -> UNDER_REVIEW)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/applications/{applicationId}/request-revision"
    description: "Send application back for revision (UNDER_REVIEW -> NEEDS_REVISION)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Application
    side_effects:
      - "revision_round += 1"
      - "SUBMITTED RubricScores -> RETRACTED; rubric_total stays null (compensation)"

  - method: POST
    path: "/applications/{applicationId}/finalize-scoring"
    description: "Finalize scoring (UNDER_REVIEW -> SCORED)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Compute rubric_total (calculations.rubric_total)"
      - "ASSIGNED CommitteeAssignments -> COMPLETED (cascade)"

  - method: POST
    path: "/applications/{applicationId}/award"
    description: "Award the application (SCORED -> AWARDED); creates an Award and debits the fund"
    roles: [FoundationAdmin]
    code: 201
    input: ["expected_fund_version"]
    output: Award
    side_effects:
      - "Create Award (COMMITTED); compute provisional_award_cents (calculations.provisional_award)"
      - "ScholarshipFund.committed_cents += provisional_award_cents; available_cents recomputed (calculations.fund_ledger)"
      - "increments ScholarshipFund.version by 1"

  - method: POST
    path: "/applications/{applicationId}/reject"
    description: "Reject the application (SCORED -> REJECTED)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/applications/{applicationId}/withdraw"
    description: "Withdraw an application (DRAFT|SUBMITTED|NEEDS_REVISION -> WITHDRAWN)"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["ASSIGNED CommitteeAssignments -> REVOKED (cascade)"]

  # --- Recommendation (immutable upload) ---
  - method: POST
    path: "/recommendations"
    description: "Upload a recommendation (parent application must be DRAFT)"
    roles: [FoundationAdmin, Applicant]
    code: 201
    input: ["application_id", "recommender_name", "document_uri"]
    output: Recommendation
    side_effects: []

  - method: GET
    path: "/recommendations"
    description: "List recommendations (filter by application_id)"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Recommendation[]
    side_effects: []

  - method: GET
    path: "/recommendations/{recommendationId}"
    description: "Get a recommendation"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: []
    output: Recommendation
    side_effects: []

  # --- Transcript (immutable upload) ---
  - method: POST
    path: "/transcripts"
    description: "Upload a transcript (parent application must be DRAFT; at most one)"
    roles: [FoundationAdmin, Applicant]
    code: 201
    input: ["application_id", "document_uri", "verified_gpa"]
    output: Transcript
    side_effects: ["second transcript on same application -> ERR_DUPLICATE_TRANSCRIPT"]

  - method: GET
    path: "/transcripts"
    description: "List transcripts (filter by application_id)"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Transcript[]
    side_effects: []

  - method: GET
    path: "/transcripts/{transcriptId}"
    description: "Get a transcript"
    roles: [FoundationAdmin, Applicant, CommitteeMember]
    code: 200
    input: []
    output: Transcript
    side_effects: []

  # --- CommitteeAssignment ---
  - method: POST
    path: "/committee-assignments"
    description: "Assign a committee member to an application"
    roles: [FoundationAdmin]
    code: 201
    input: ["application_id", "committee_member_id"]
    output: CommitteeAssignment
    side_effects: ["status = ASSIGNED; CommitteeMember.active_assignment_count recomputed (increments)"]

  - method: GET
    path: "/committee-assignments"
    description: "List committee assignments (filter by application_id and/or committee_member_id)"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: ["application_id?", "committee_member_id?", "limit?", "offset?"]
    output: CommitteeAssignment[]
    side_effects: []

  - method: GET
    path: "/committee-assignments/{assignmentId}"
    description: "Get a committee assignment"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: []
    output: CommitteeAssignment
    side_effects: []

  - method: POST
    path: "/committee-assignments/{assignmentId}/decline"
    description: "Committee member declines an assignment (ASSIGNED -> DECLINED)"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: CommitteeAssignment
    side_effects: ["CommitteeMember.active_assignment_count recomputed (decrements)"]

  # --- RubricScore ---
  - method: POST
    path: "/rubric-scores"
    description: "Create a draft rubric score (acting member must hold an ASSIGNED assignment on the application)"
    roles: [CommitteeMember]
    code: 201
    input: ["application_id", "committee_member_id", "academic_score", "need_score", "essay_score"]
    output: RubricScore
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/rubric-scores"
    description: "List rubric scores (filter by application_id and/or committee_member_id)"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: ["application_id?", "committee_member_id?", "limit?", "offset?"]
    output: RubricScore[]
    side_effects: []

  - method: GET
    path: "/rubric-scores/{scoreId}"
    description: "Get a rubric score"
    roles: [FoundationAdmin, CommitteeMember]
    code: 200
    input: []
    output: RubricScore
    side_effects: []

  - method: POST
    path: "/rubric-scores/{scoreId}/submit"
    description: "Submit a rubric score (DRAFT -> SUBMITTED)"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: RubricScore
    side_effects: ["Compute weighted_value (calculations.rubric_weighted_value)"]

  # --- Award ---
  - method: GET
    path: "/awards"
    description: "List awards (filter by fund_id and/or application_id)"
    roles: [FoundationAdmin, Applicant, DisbursementOfficer]
    code: 200
    input: ["fund_id?", "application_id?", "limit?", "offset?"]
    output: Award[]
    side_effects: []

  - method: GET
    path: "/awards/{awardId}"
    description: "Get an award"
    roles: [FoundationAdmin, Applicant, DisbursementOfficer]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: POST
    path: "/awards/{awardId}/disburse"
    description: "Disburse an award (COMMITTED -> ACTIVE); creates a PENDING Disbursement"
    roles: [DisbursementOfficer]
    code: 201
    input: ["institution_id"]
    output: Disbursement
    side_effects:
      - "Compute Award.final_award_cents (calculations.final_award)"
      - "Create Disbursement (PENDING, amount_cents = final_award_cents); Award -> ACTIVE"

  - method: POST
    path: "/awards/{awardId}/complete"
    description: "Mark award complete (ACTIVE -> COMPLETED)"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Award
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/awards/{awardId}/revoke"
    description: "Revoke a committed award (COMMITTED -> REVOKED); releases commitment"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: Award
    side_effects:
      - "ScholarshipFund.committed_cents -= provisional_award_cents; available_cents recomputed (compensation)"

  # --- Disbursement ---
  - method: GET
    path: "/disbursements"
    description: "List disbursements (filter by award_id and/or fund_id)"
    roles: [FoundationAdmin, DisbursementOfficer]
    code: 200
    input: ["award_id?", "fund_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: GET
    path: "/disbursements/{disbursementId}"
    description: "Get a disbursement"
    roles: [FoundationAdmin, DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/disbursements/{disbursementId}/settle"
    description: "Settle a disbursement (PENDING -> SETTLED)"
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["ScholarshipFund.disbursed_cents += amount_cents (ledger sync)"]

  - method: POST
    path: "/disbursements/{disbursementId}/return"
    description: "Return a disbursement (PENDING|SETTLED -> RETURNED); reverses ledgers"
    roles: [DisbursementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "From SETTLED: disbursed_cents -= amount_cents AND committed_cents -= provisional_award_cents; Award -> REVOKED (compensation cascade)"
      - "From PENDING: Award reverts ACTIVE -> COMMITTED; final_award_cents reset null (compensation)"

  # --- RenewalReview ---
  - method: POST
    path: "/renewal-reviews"
    description: "Open a GPA-conditioned renewal review (Award ACTIVE -> RENEWAL_PENDING)"
    roles: [FoundationAdmin]
    code: 201
    input: ["award_id", "reported_gpa"]
    output: RenewalReview
    side_effects:
      - "Create RenewalReview (PENDING); compute meets_floor (calculations.renewal_floor_check); Award -> RENEWAL_PENDING"

  - method: GET
    path: "/renewal-reviews"
    description: "List renewal reviews (filter by award_id)"
    roles: [FoundationAdmin, Applicant]
    code: 200
    input: ["award_id?", "limit?", "offset?"]
    output: RenewalReview[]
    side_effects: []

  - method: GET
    path: "/renewal-reviews/{reviewId}"
    description: "Get a renewal review"
    roles: [FoundationAdmin, Applicant]
    code: 200
    input: []
    output: RenewalReview
    side_effects: []

  - method: POST
    path: "/renewal-reviews/{reviewId}/approve"
    description: "Approve renewal (Award RENEWAL_PENDING -> ACTIVE); re-commits a term"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: RenewalReview
    side_effects:
      - "RenewalReview -> APPROVED; Award.term_index += 1"
      - "ScholarshipFund.committed_cents += provisional_award_cents; available_cents recomputed (ledger sync)"

  - method: POST
    path: "/renewal-reviews/{reviewId}/deny"
    description: "Deny renewal (Award RENEWAL_PENDING -> LAPSED); releases commitment"
    roles: [FoundationAdmin]
    code: 200
    input: []
    output: RenewalReview
    side_effects:
      - "RenewalReview -> DENIED; committed_cents -= provisional_award_cents; available_cents recomputed (ledger sync)"

  # --- StewardshipRecord ---
  - method: POST
    path: "/stewardship-records"
    description: "Create a stewardship / thank-you record for an award"
    roles: [FoundationAdmin, Applicant]
    code: 201
    input: ["award_id", "thank_you_text"]
    output: StewardshipRecord
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/stewardship-records"
    description: "List stewardship records (filter by award_id)"
    roles: [FoundationAdmin, Applicant, DisbursementOfficer]
    code: 200
    input: ["award_id?", "limit?", "offset?"]
    output: StewardshipRecord[]
    side_effects: []

  - method: GET
    path: "/stewardship-records/{stewardshipId}"
    description: "Get a stewardship record"
    roles: [FoundationAdmin, Applicant, DisbursementOfficer]
    code: 200
    input: []
    output: StewardshipRecord
    side_effects: []

  - method: POST
    path: "/stewardship-records/{stewardshipId}/acknowledge"
    description: "Acknowledge a stewardship record (DRAFT -> ACKNOWLEDGED)"
    roles: [Applicant]
    code: 200
    input: []
    output: StewardshipRecord
    side_effects: ["status -> ACKNOWLEDGED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }

  # --- Ownership ---
  - { id: ERR_NOT_APPLICATION_OWNER, http: 403, condition: "Acting Applicant does not own the target application or its child resource" }
  - { id: ERR_NOT_SCORE_OWNER, http: 403, condition: "Acting CommitteeMember does not own the target rubric score" }
  - { id: ERR_NOT_ASSIGNMENT_OWNER, http: 403, condition: "Acting CommitteeMember does not own the target committee assignment" }

  # --- Not found ---
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "ScholarshipFund id (path or body fund_id) does not exist" }
  - { id: ERR_CRITERIA_NOT_FOUND, http: 404, condition: "EligibilityCriteria id does not exist" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant id (path or body applicant_id) does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id (path or body application_id) does not exist" }
  - { id: ERR_COMMITTEE_MEMBER_NOT_FOUND, http: 404, condition: "CommitteeMember id (path or body committee_member_id) does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CommitteeAssignment id does not exist" }
  - { id: ERR_SCORE_NOT_FOUND, http: 404, condition: "RubricScore id does not exist" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "Award id (path or body award_id) does not exist" }
  - { id: ERR_DISBURSEMENT_NOT_FOUND, http: 404, condition: "Disbursement id does not exist" }
  - { id: ERR_RENEWAL_NOT_FOUND, http: 404, condition: "RenewalReview id does not exist" }
  - { id: ERR_STEWARDSHIP_NOT_FOUND, http: 404, condition: "StewardshipRecord id does not exist" }

  # --- Fund state ---
  - { id: ERR_FUND_NOT_OPEN, http: 409, condition: "Operation requires fund status == OPEN" }
  - { id: ERR_FUND_NOT_IN_REVIEW, http: 409, condition: "Operation requires fund status == REVIEW" }
  - { id: ERR_FUND_NOT_AWARDING, http: 409, condition: "Operation requires fund status == AWARDING" }
  - { id: ERR_FUND_STATE_INVALID, http: 409, condition: "Fund lifecycle transition invalid for current state" }
  - { id: ERR_CRITERIA_REQUIRED, http: 409, condition: "open requires exactly one EligibilityCriteria attached" }
  - { id: ERR_DUPLICATE_CRITERIA, http: 409, condition: "Fund already has an EligibilityCriteria" }
  - { id: ERR_OPEN_APPLICATIONS_EXIST, http: 409, condition: "close blocked by applications in SUBMITTED/UNDER_REVIEW/NEEDS_REVISION/SCORED" }

  # --- Application state / constraints ---
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "Application transition invalid for current state" }
  - { id: ERR_RECOMMENDATION_REQUIRED, http: 409, condition: "submit requires >= 1 Recommendation" }
  - { id: ERR_TRANSCRIPT_REQUIRED, http: 409, condition: "submit requires exactly 1 Transcript" }
  - { id: ERR_DUPLICATE_TRANSCRIPT, http: 409, condition: "Application already has a Transcript" }
  - { id: ERR_NOT_ELIGIBLE, http: 409, condition: "start-review requires eligibility_matched == true" }
  - { id: ERR_NO_COMMITTEE_ASSIGNED, http: 409, condition: "start-review requires >= 1 ASSIGNED CommitteeAssignment" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "revision_round exceeds MAX_REVISION_ROUNDS on resume to UNDER_REVIEW" }

  # --- Committee / scoring ---
  - { id: ERR_ASSIGNMENT_STATE_INVALID, http: 409, condition: "CommitteeAssignment transition invalid for current state" }
  - { id: ERR_MEMBER_OVERLOADED, http: 409, condition: "CommitteeMember already holds MAX_CONCURRENT_ASSIGNMENTS ASSIGNED assignments" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "CommitteeMember already ASSIGNED on this application" }
  - { id: ERR_SCORE_STATE_INVALID, http: 409, condition: "RubricScore transition invalid for current state" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "RubricScore submit requires parent application status == UNDER_REVIEW" }
  - { id: ERR_NO_ASSIGNMENT_FOR_SCORE, http: 409, condition: "RubricScore create requires acting member to hold an ASSIGNED assignment on the application" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "finalize-scoring requires >= SCORING_QUORUM SUBMITTED rubric scores" }

  # --- Award / disbursement / renewal / stewardship ---
  - { id: ERR_SCORE_BELOW_FLOOR, http: 409, condition: "award requires rubric_total >= AWARD_SCORE_FLOOR" }
  - { id: ERR_AWARD_STATE_INVALID, http: 409, condition: "Award transition invalid for current state" }
  - { id: ERR_AWARD_NOT_ACTIVE, http: 409, condition: "Operation requires award status == ACTIVE" }
  - { id: ERR_AWARD_ALREADY_DISBURSED, http: 409, condition: "revoke blocked by an existing SETTLED Disbursement" }
  - { id: ERR_STEWARDSHIP_REQUIRED, http: 409, condition: "disburse requires exactly 1 ACKNOWLEDGED StewardshipRecord" }
  - { id: ERR_STEWARDSHIP_STATE_INVALID, http: 409, condition: "StewardshipRecord transition invalid for current state" }
  - { id: ERR_DISBURSEMENT_STATE_INVALID, http: 409, condition: "Disbursement transition invalid for current state" }
  - { id: ERR_GPA_BELOW_FLOOR, http: 409, condition: "renewal approve requires reported_gpa >= renewal_gpa_floor (meets_floor)" }

  # --- Fiscal / concurrency ---
  - { id: ERR_FUND_INSUFFICIENT, http: 409, condition: "award/renewal would exceed fund available_cents" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_fund_version does not match current ScholarshipFund.version" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, out-of-range numeric, or invalid enum value" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "Pagination limit/offset out of allowed range" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FoundationAdmin
    description: "Foundation operator: manages funds, criteria, the application review lifecycle, awards, renewals"
    identity: "opaque"
    exclusive_operations:
      - "POST /scholarship-funds — create fund"
      - "POST /scholarship-funds/{id}/open|begin-review|begin-awarding|close — fund lifecycle"
      - "POST /eligibility-criteria — attach criteria"
      - "POST /committee-assignments — assign reviewer"
      - "POST /applications/{id}/start-review|request-revision|finalize-scoring|award|reject — review/award lifecycle"
      - "POST /awards/{id}/complete|revoke — award lifecycle"
      - "POST /renewal-reviews and /renewal-reviews/{id}/approve|deny — renewal lifecycle"
    shared_operations:
      - "POST /applicants, /committee-members — register actors"
      - "POST /applications, /recommendations, /transcripts, /stewardship-records — create on behalf"
      - "GET (all read/list endpoints)"

  - name: Applicant
    description: "Student applicant acting on their own applications, uploads, and stewardship records"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applications/{id}/submit — submit own application"
      - "POST /applications/{id}/withdraw — withdraw own application"
      - "POST /stewardship-records/{id}/acknowledge — acknowledge own thank-you"
    shared_operations:
      - "POST /applicants — self register"
      - "POST /applications, /recommendations, /transcripts, /stewardship-records — own application"
      - "GET funds/criteria/applications/awards/renewal/stewardship"

  - name: CommitteeMember
    description: "Reviewer who scores assigned applications via the rubric"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /rubric-scores — create own draft score"
      - "POST /rubric-scores/{id}/submit — submit own score"
      - "POST /committee-assignments/{id}/decline — decline own assignment"
    shared_operations:
      - "POST /committee-members — self register"
      - "GET applicants/applications/assignments/scores"

  - name: DisbursementOfficer
    description: "Finance operator: disburses awards to institutions and settles/returns payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /awards/{id}/disburse — create disbursement"
      - "POST /disbursements/{id}/settle — settle payment"
      - "POST /disbursements/{id}/return — return payment"
    shared_operations:
      - "GET funds/applications/awards/disbursements/stewardship"
