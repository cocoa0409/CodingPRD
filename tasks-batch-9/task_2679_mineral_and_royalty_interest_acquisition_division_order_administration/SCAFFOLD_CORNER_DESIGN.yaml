  - name: funding_amount_and_curative_period_open_errors
    claim_type: Triggerability
    grounds:
    - errors[ERR_FUNDING_AMOUNT_MISMATCH]
    - errors[ERR_CURATIVE_PERIOD_OPEN]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / fund_with_open_curative_and_wrong_wire_amount_yields_state_error_first
      rationale: "Both codes are triggered by the named §1.8 instance, which violates the two rules together and then repairs them one at a time."

  - name: offer_above_max_bid_and_segregation_of_duties_errors
    claim_type: Triggerability
    grounds:
    - errors[ERR_OFFER_ABOVE_MAX_BID]
    - errors[ERR_SEGREGATION_OF_DUTIES]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / offer_by_valuation_approver_above_max_bid_yields_segregation_error_first
      rationale: "The named §1.8 instance triggers the segregation error first and then the bid-band error once the user id is switched."

  - name: counter_rounds_exhausted_error
    claim_type: Triggerability
    grounds:
    - errors[ERR_COUNTER_ROUNDS_EXHAUSTED]
    excluded_because:
      difficulty_instance: non_linear_state_machine / offer_letter_counter_revise_negotiation_cycle_bounded_at_three_rounds
      rationale: "The named §1.8 instance walks the negotiation loop to its bound and asserts the fourth counter is rejected with this code."

  - name: psa_window_conflict_error
    claim_type: Triggerability
    grounds:
    - errors[ERR_PSA_WINDOW_CONFLICT]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / psa_tract_occupancy_closed_window_with_buffer_rejects_touching_endpoints
      rationale: "The named §1.8 instance probes the closed occupancy window on both endpoints and asserts this code at the touching boundaries."

  - name: owner_unlocatable_error
    claim_type: Triggerability
    grounds:
    - errors[ERR_OWNER_UNLOCATABLE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / suspense_release_blocked_by_unlocatable_royalty_owner
      rationale: "The named §1.8 instance blocks a release on the owner's contact_status and asserts this code, then unblocks it with a PATCH."

  - name: allocation_not_active_error
    claim_type: Triggerability
    grounds:
    - errors[ERR_ALLOCATION_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / division_order_creation_blocked_by_terminated_unit_tract_allocation
      rationale: "The named §1.8 instance shows the interval-first, status-second selector returning this code for a TERMINATED covering allocation."

  - name: allocation_interval_overlap_error_at_the_adjacency_boundary
    claim_type: Triggerability
    grounds:
    - errors[ERR_ALLOCATION_INTERVAL_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / unit_tract_allocation_half_open_intervals_allow_adjacency_reject_overlap
      rationale: "The named §1.8 instance asserts the half-open interval semantics: adjacency accepted, one-day overlap rejected with this code."

# ===========================================================================
# 7. RBAC
# ===========================================================================
- section: rbac
  instances:

  - name: title_analyst_cannot_create_a_mineral_interest_returns_403
    claim_type: Role denial
    grounds:
    - roles.TitleAnalyst
    - roles.AcquisitionManager.exclusive_operations
    - validations[priority=3]
    - errors[ERR_UNAUTHORIZED]
    distinguishing_aspect: "Peer roles do not inherit each other's exclusive operations: a TitleAnalyst posting a MineralInterest gets ERR_UNAUTHORIZED (403) even though the same actor certified the tract the interest would hang off, and no interest row is created."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a CERTIFIED tract and a registered owner"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { r1t: $.data.id }
      - call: "POST /tracts/${r1t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${r1t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { r1o: $.data.id }
      trigger:
      - call: "POST /mineral-interests"
        payload: { tract_id: "${r1t}", seller_owner_id: "${r1o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      assert:
      - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
      - "GET /mineral-interests?tract_id=${r1t} as AcquisitionManager returns total_count == 0"
      - "the identical body sent as AcquisitionManager returns HTTP 201, so only the role differed"

  - name: division_order_admin_cannot_certify_title_returns_403
    claim_type: Role denial
    grounds:
    - roles.DivisionOrderAdmin
    - roles.TitleAnalyst.exclusive_operations
    - validations[priority=3]
    - errors[ERR_UNAUTHORIZED]
    distinguishing_aspect: "The revenue-side role has no title authority: certify-title as DivisionOrderAdmin returns ERR_UNAUTHORIZED (403) and leaves title_status RESEARCH with the certified figures null, so the 403 is checked before the chain-completeness rule at priority 21."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a RESEARCH tract with an empty chain - deliberately also in violation of priority 21"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { r2t: $.data.id }
      trigger:
      - call: "POST /tracts/${r2t}/certify-title"
        payload: {}
        as: DivisionOrderAdmin
        captures: { err: $.data.error_id }
      assert:
      - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED, not the 409 ERR_TITLE_CHAIN_INCOMPLETE the empty chain also earns"
      - "Tract.${r2t}.title_status is still RESEARCH and chain_entry_count == 0"
      - "Tract.${r2t}.version is unchanged from its creation value"

  - name: royalty_owner_cannot_accept_another_owners_offer_returns_403
    claim_type: Resource ownership
    grounds:
    - roles.RoyaltyOwner.identity_notes
    - validations[priority=4]
    - errors[ERR_NOT_RESOURCE_OWNER]
    distinguishing_aspect: "The RoyaltyOwner role is entity_backed, so authorisation is per row: owner B presenting a valid RoyaltyOwner role on owner A's offer letter gets ERR_NOT_RESOURCE_OWNER (403), not ERR_UNAUTHORIZED, and the letter stays SENT until A accepts it."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "two registered owners and an OPEN offer letter on an interest owned by the first"
