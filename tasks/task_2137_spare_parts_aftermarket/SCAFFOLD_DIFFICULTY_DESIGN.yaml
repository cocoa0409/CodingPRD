            - "a PLATINUM dealer with credit_hold false"
            - "a LastTimeBuyCampaign SUBMITTED by planner-1 and APPROVED by ctrl-1 with approved_qty 100, so remaining_qty == 100"
            - "one PENDING AllocationRequest from that dealer for 60 units"
            - "an allocation run that granted all 60 units (fair share floor(100*0.50/1) == 50, waterfall adds 10)"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
