              as_user_id: "${sd}"
            - call: "GET /jobs/${jb}"
              as: Dispatcher
              captures: { jvb: $.data.version }
            - call: "POST /jobs/${jb}/scope-items"
              payload: { kind: "BOARD", opening_count: 1, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jvb}" }
              as: Dispatcher
              captures: { sib: $.data.id }
            - call: "POST /scope-items/${sib}/install"
              payload: { opening_count: 1, width_in: 48, height_in: 36, door_count: 0 }
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs/${jb}/complete-securing"
              payload: {}
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P1" }
              as: Dispatcher
