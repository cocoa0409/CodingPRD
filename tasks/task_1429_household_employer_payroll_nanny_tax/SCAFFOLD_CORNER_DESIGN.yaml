  - section: rbac
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role / X-User-ID headers at all -> 401 ERR_UNAUTHENTICATED before any other check (priority 1)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Anon", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, captures: { err: "$.data.error_id" } }
          assert:
            - "401 with error_id == ERR_UNAUTHENTICATED (request sent without auth headers)"
      - name: household_client_cannot_create_rule_pack
        claim_type: rbac_denial
        grounds: ["roles.PayrollAdmin.exclusive_operations", "errors[ERR_FORBIDDEN]"]
