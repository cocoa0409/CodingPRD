# =============================================================================
# SCAFFOLD.yaml — Annuity 1035 Exchange & Replacement Review
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files.
# =============================================================================

scenario: |
  Annuity 1035 Exchange & Replacement Review (annuity carrier suitability desk):
  replacement disclosure & suitability documentation, surrender charge & benefit
  loss comparison analysis, exchange paperwork & carrier-to-carrier funds
  transfer, partial exchange rules & tax basis allocation, in-force illustration
  comparison, supervisory review & principal approval, free-look period &
  rescission, tracking of exchange activity by producer

domain_name: annuity-1035-exchange-review
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert
  entity_count: 9
  endpoint_count: 35
  error_code_count: 21
  calculation_count: 7
  state_machine_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# Topology: flat — peer entities joined by foreign keys; no nested creation.
# All money is integer cents; all percentages are integer basis points (bps).
# =============================================================================
entities:
  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: license_number, type: string, source: input, description: "Producer license number; unique across all producers" }
      - { name: full_name, type: string, source: input, description: "Producer legal name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter state of primary appointment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FLAGGED | SUSPENDED", constraints: "initial ACTIVE; FLAGGED set/cleared automatically by producer_churn_metrics; SUSPENDED/ACTIVE via ComplianceOfficer" }
      - { name: submitted_case_count_12m, type: integer, source: computed, description: "Count of ActivityEvent CASE_SUBMITTED for this producer with event_at in the half-open window (now-365d, now]" }
      - { name: completed_exchange_count_12m, type: integer, source: computed, description: "Count of ActivityEvent EXCHANGE_COMPLETED for this producer with event_at in (now-365d, now]" }
      - { name: rescinded_exchange_count_12m, type: integer, source: computed, description: "Count of ActivityEvent EXCHANGE_RESCINDED for this producer with event_at in (now-365d, now]" }
      - { name: rescission_rate_completed_bps, type: integer, source: computed, description: "floor(10000 * rescinded / completed); 0 when completed == 0 (completed-basis variant)" }
      - { name: rescission_rate_submitted_bps, type: integer, source: computed, description: "floor(10000 * rescinded / submitted); 0 when submitted == 0 (submitted-basis variant)" }
      - { name: last_churn_eval_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent churn evaluation; null until first evaluation" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Annuitant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: state_code, type: string, source: input, description: "Two-letter residence state" }
      - { name: age_years, type: integer, source: computed, description: "Whole years between date_of_birth and the logical clock date" }
      - { name: is_senior, type: boolean, source: computed, description: "true when age_years >= SENIOR_AGE (65); drives the 30-day free look" }
      - { name: last_rescinded_at, type: datetime, source: system, description: "Logical-clock timestamp of this client's most recent case rescission; null when never rescinded" }

  - name: ExistingContract
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning annuitant" }
      - { name: carrier_name, type: string, source: input, description: "Ceding carrier name" }
      - { name: contract_number, type: string, source: input, description: "Ceding contract number; unique together with carrier_name (case-insensitive pair)" }
      - { name: issue_date, type: string, source: input, description: "ISO date YYYY-MM-DD the contract was issued" }
      - { name: account_value_cents, type: integer, source: input, description: "Current accumulation value in cents (mutable by system on surrender/restore)" }
      - { name: tax_basis_cents, type: integer, source: input, description: "Cost basis in cents (mutable by system on surrender/restore)" }
      - { name: surrender_schedule, type: array, source: input, description: "Ordered list of { contract_year: integer >= 1, pct_bps: integer 0..10000 }; entry for year Y applies to surrenders inside contract year Y" }
      - { name: living_benefit_rider, type: boolean, source: input, description: "Whether a living-benefit rider is attached" }
      - { name: rider_benefit_base_cents, type: integer, source: input, default: 0, description: "Rider benefit base in cents (0 when no rider)" }
      - { name: rider_annual_fee_bps, type: integer, source: input, default: 0, description: "Rider annual fee in basis points of benefit base (0 when no rider)" }
      - { name: last_exchange_completed_at, type: datetime, source: input, description: "Timestamp this contract was itself acquired via a completed 1035 exchange; null when never exchanged into; ALSO system-stamped on the old contract record when an exchange completes (anti-churn marker)" }
      - { name: status, type: enum, source: system, description: "IN_FORCE | SURRENDER_PENDING | EXCHANGED", constraints: "initial IN_FORCE" }

  - name: ExchangeCase
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; writing producer; must equal X-User-ID when caller role is Producer" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: existing_contract_id, type: string, source: input, description: "FK -> ExistingContract.id; contract being replaced" }
      - { name: exchange_type, type: enum, source: input, description: "FULL | PARTIAL" }
      - { name: exchange_amount_cents, type: integer, source: input, description: "Gross amount to exchange; required for PARTIAL; ignored (system-set to account_value_cents) for FULL" }
      - { name: new_product_code, type: string, source: input, description: "Product code of the replacement annuity applied for" }
      - { name: new_product_surrender_years, type: integer, source: input, description: "Length of the new product's surrender schedule in years" }
      - { name: new_product_bonus_bps, type: integer, source: input, default: 0, description: "Up-front bonus credited by the new product, bps of amount received" }
      - { name: new_product_annual_fee_bps, type: integer, source: input, default: 0, description: "New product annual fee in bps" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SUITABILITY_REVIEW | INFO_REQUESTED | PENDING_PRINCIPAL | APPROVED | FUNDS_REQUESTED | FUNDS_RECEIVED | IN_FREE_LOOK | COMPLETED | REJECTED | WITHDRAWN | RESCINDED", constraints: "initial DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; null while DRAFT" }
      - { name: reviewed_by_id, type: string, source: system, description: "X-User-ID of the SuitabilityReviewer whose recommend moved the case to PENDING_PRINCIPAL" }
      - { name: approved_by_id, type: string, source: system, description: "X-User-ID of the Principal who approved" }
      - { name: free_look_started_at, type: datetime, source: system, description: "Logical-clock timestamp of confirm_delivery; null until then" }
      - { name: free_look_deadline_date, type: string, source: computed, description: "ISO date = date(free_look_started_at) + free_look_days (30 senior / 20 standard); null until delivery" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: rescinded_at, type: datetime, source: system, description: "Logical-clock timestamp of rescission; null until RESCINDED" }

  - name: CaseDocument
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ExchangeCase.id" }
      - { name: doc_type, type: enum, source: input, description: "REPLACEMENT_DISCLOSURE | SUITABILITY_FORM | IN_FORCE_ILLUSTRATION" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED", constraints: "initial SUBMITTED; REJECTED -> SUBMITTED via resubmission (revision += 1)" }
      - { name: revision, type: integer, source: system, description: "Starts at 1; increments by 1 on each resubmission after REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at rejection; cleared on resubmission" }

  - name: ComparisonAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ExchangeCase.id" }
      - { name: assumed_old_growth_bps, type: integer, source: input, description: "Illustrated annual growth of the existing contract, bps" }
      - { name: assumed_new_growth_bps, type: integer, source: input, description: "Illustrated annual growth of the replacement product, bps" }
      - { name: analysis_date, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: exchange_base_cents, type: integer, source: computed, description: "Gross base the surrender charge applies to: account_value_cents (FULL) or exchange_amount_cents (PARTIAL)" }
      - { name: surrender_pct_bps_today, type: integer, source: computed, description: "Schedule pct at analysis_date (chronological variant)" }
      - { name: surrender_charge_today_cents, type: integer, source: computed, description: "floor(exchange_base_cents * surrender_pct_bps_today / 10000)" }
      - { name: surrender_pct_bps_at_settlement, type: integer, source: computed, description: "Schedule pct at analysis_date + SETTLEMENT_LAG_DAYS (forward-looking variant)" }
      - { name: surrender_charge_at_settlement_cents, type: integer, source: computed, description: "floor(exchange_base_cents * surrender_pct_bps_at_settlement / 10000)" }
      - { name: amount_received_cents, type: integer, source: computed, description: "exchange_base_cents - surrender_charge_at_settlement_cents" }
      - { name: bonus_credit_cents, type: integer, source: computed, description: "floor(amount_received_cents * new_product_bonus_bps / 10000)" }
      - { name: benefit_loss_cents, type: integer, source: computed, description: "max(0, min(rider_benefit_base_cents - account_value_cents, RIDER_LOSS_CAP_CENTS)); 0 when no rider" }
      - { name: net_replacement_cost_cents, type: integer, source: computed, description: "surrender_charge_at_settlement_cents + benefit_loss_cents - bonus_credit_cents (pinned evaluation order)" }
      - { name: break_even_years, type: integer, source: computed, description: "First year y in 1..MAX_PROJECTION_YEARS where projected new value >= projected old value; 99 when none" }
      - { name: basis_transferred_cents, type: integer, source: computed, description: "FULL: tax_basis_cents; PARTIAL: floor(tax_basis_cents * exchange_amount_cents / account_value_cents)" }
      - { name: basis_remaining_cents, type: integer, source: computed, description: "tax_basis_cents - basis_transferred_cents" }
      - { name: status, type: enum, source: system, description: "FINAL | SUPERSEDED", constraints: "initial FINAL; creating a newer analysis on the same case flips the prior FINAL to SUPERSEDED" }
      - { name: supersedes_analysis_id, type: string, source: system, description: "Id of the analysis this one supersedes; null for the first" }

  - name: FundsTransfer
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ExchangeCase.id" }
      - { name: amount_cents, type: integer, source: computed, description: "Cash the ceding carrier remits: exchange_base - surrender_charge (at-settlement variant at request time)" }
      - { name: surrender_charge_cents, type: integer, source: computed, description: "Charge withheld at surrender (at-settlement variant at request time)" }
      - { name: basis_transferred_cents, type: integer, source: computed, description: "Tax basis carried to the replacement contract per tax_basis_allocation" }
      - { name: pre_exchange_value_cents, type: integer, source: system, description: "Snapshot of contract account_value_cents taken at request_funds; used verbatim on rescission restore" }
      - { name: pre_exchange_basis_cents, type: integer, source: system, description: "Snapshot of contract tax_basis_cents taken at request_funds; used verbatim on rescission restore" }
      - { name: status, type: enum, source: system, description: "REQUESTED | RECEIVED | FAILED | RETURNED", constraints: "initial REQUESTED" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock timestamp of request_funds" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of mark_received; null until then" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of the rescission-triggered return; null until then" }

  - name: ReviewDecision
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ExchangeCase.id" }
      - { name: stage, type: enum, source: system, description: "SUITABILITY | PRINCIPAL" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the deciding reviewer/principal" }
      - { name: decision, type: enum, source: system, description: "APPROVE | REJECT | REQUEST_INFO", constraints: "REQUEST_INFO only at SUITABILITY stage" }
      - { name: rationale, type: string, source: input, description: "Free-text rationale supplied with the decision" }

  - name: ActivityEvent
    parent: null
    common_fields: false
    fields:
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id" }
      - { name: case_id, type: string, source: input, description: "FK -> ExchangeCase.id; null for producer-level events (PRODUCER_FLAGGED, PRODUCER_UNFLAGGED, PRODUCER_SUSPENDED, PRODUCER_REINSTATED)" }
      - { name: event_type, type: enum, source: system, description: "CASE_SUBMITTED | CASE_WITHDRAWN | CASE_REJECTED | EXCHANGE_COMPLETED | EXCHANGE_RESCINDED | PRODUCER_FLAGGED | PRODUCER_UNFLAGGED | PRODUCER_SUSPENDED | PRODUCER_REINSTATED" }
      - { name: event_at, type: datetime, source: system, description: "Logical-clock timestamp at which the event fired" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ExchangeCase
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, WITHDRAWN, RESCINDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cases/{id}/submit"
        actor: Producer
        preconditions:
          - "Caller owns the case (X-User-ID == case.producer_id) else ERR_CASE_NOT_OWNED_BY_PRODUCER"
          - "Producer.status != SUSPENDED else ERR_PRODUCER_SUSPENDED"
          - "ExistingContract.status == IN_FORCE else ERR_CONTRACT_NOT_IN_FORCE"
          - "Client cooling-off: client.last_rescinded_at is null OR now >= last_rescinded_at + COOLING_OFF_DAYS_AFTER_RESCISSION else ERR_COOLING_OFF_ACTIVE"
          - "Anti-churn: contract.last_exchange_completed_at is null OR now >= last_exchange_completed_at + ANTI_CHURN_WINDOW_DAYS else ERR_CONTRACT_EXCHANGED_WITHIN_12M"
          - "Occupation: no other ExchangeCase with existing_contract_id == this contract and status NOT IN {COMPLETED, REJECTED, WITHDRAWN, RESCINDED} else ERR_CONTRACT_EXCHANGE_IN_PROGRESS"
          - "PARTIAL: MIN_PARTIAL_CENTS <= exchange_amount_cents < contract.account_value_cents else ERR_PARTIAL_BELOW_MINIMUM / ERR_PARTIAL_AMOUNT_INVALID"
        side_effects:
          - "submitted_at = logical clock now; case.version += 1"
          - "Append ActivityEvent(CASE_SUBMITTED) for the producer"
          - "Recompute producer 12m counters; run producer_churn_metrics evaluation"

      - from: SUBMITTED
        to: SUITABILITY_REVIEW
        trigger: "POST /cases/{id}/start_review"
        actor: SuitabilityReviewer
        preconditions: []
        side_effects: ["case.version += 1"]

      - from: SUITABILITY_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cases/{id}/request_info"
        actor: SuitabilityReviewer
        preconditions: []
        side_effects:
          - "Append ReviewDecision(stage=SUITABILITY, decision=REQUEST_INFO)"
          - "case.version += 1"

      - from: INFO_REQUESTED
        to: SUITABILITY_REVIEW
        trigger: "POST /cases/{id}/documents (document resubmission returns the case to review)"
        actor: Producer
        preconditions:
          - "Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"
        side_effects: ["case.version += 1"]
        note: "The producer's channel for answering an info request is (re)submitting a document."

      - from: SUITABILITY_REVIEW
        to: PENDING_PRINCIPAL
        trigger: "POST /cases/{id}/recommend"
        actor: SuitabilityReviewer
        preconditions:
          - "All three required doc types (REPLACEMENT_DISCLOSURE, SUITABILITY_FORM, IN_FORCE_ILLUSTRATION) have a CaseDocument in VERIFIED status else ERR_REQUIRED_DOCUMENTS_INCOMPLETE"
          - "A ComparisonAnalysis with status == FINAL exists for the case else ERR_ANALYSIS_MISSING"
        side_effects:
          - "Append ReviewDecision(stage=SUITABILITY, decision=APPROVE); case.reviewed_by_id = caller X-User-ID"
          - "case.version += 1"

      - from: SUITABILITY_REVIEW
        to: REJECTED
        trigger: "POST /cases/{id}/reject"
        actor: SuitabilityReviewer
        preconditions: []
        side_effects:
          - "Append ReviewDecision(stage=SUITABILITY, decision=REJECT)"
          - "Append ActivityEvent(CASE_REJECTED) for the producer"
          - "case.version += 1"

      - from: PENDING_PRINCIPAL
        to: APPROVED
        trigger: "POST /cases/{id}/approve"
        actor: Principal
        preconditions:
          - "Segregation of duties: caller X-User-ID != case.reviewed_by_id else ERR_DUTY_SEGREGATION_VIOLATION"
        side_effects:
          - "Append ReviewDecision(stage=PRINCIPAL, decision=APPROVE); case.approved_by_id = caller X-User-ID"
          - "case.version += 1"

      - from: PENDING_PRINCIPAL
        to: REJECTED
        trigger: "POST /cases/{id}/reject"
        actor: Principal
        preconditions: []
        side_effects:
          - "Append ReviewDecision(stage=PRINCIPAL, decision=REJECT)"
          - "Append ActivityEvent(CASE_REJECTED) for the producer"
          - "case.version += 1"

      - from: APPROVED
        to: FUNDS_REQUESTED
        trigger: "POST /cases/{id}/request_funds"
        actor: OperationsDesk
        preconditions: []
        side_effects:
          - "Create FundsTransfer: status REQUESTED; amount_cents, surrender_charge_cents, basis_transferred_cents computed via surrender_charge_schedule (at_settlement variant at logical clock now) and tax_basis_allocation; pre_exchange_value_cents / pre_exchange_basis_cents snapshot the contract"
          - "ExistingContract.status IN_FORCE -> SURRENDER_PENDING; contract.version += 1"
          - "case.version += 1"

      - from: FUNDS_REQUESTED
        to: FUNDS_RECEIVED
        trigger: "POST /transfers/{id}/mark_received (transfer REQUESTED -> RECEIVED itself triggers this case transition)"
        actor: OperationsDesk
        preconditions:
          - "The case's FundsTransfer.status == REQUESTED else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "FundsTransfer.status -> RECEIVED; received_at = now; transfer.version += 1"
          - "The transfer's receipt triggers ExistingContract.status SURRENDER_PENDING -> EXCHANGED; for FULL contract.account_value_cents = 0 and tax_basis_cents = 0; for PARTIAL account_value_cents -= exchange_amount_cents and tax_basis_cents -= transfer.basis_transferred_cents; contract.version += 1"
          - "case.version += 1"
        note: "Transitive chain: mark_received mutates the transfer; the transfer's receipt mutates the case; the case's receipt mutation surrenders the contract."

      - from: FUNDS_REQUESTED
        to: APPROVED
        trigger: "POST /transfers/{id}/mark_failed (transfer REQUESTED -> FAILED reverts the case)"
        actor: OperationsDesk
        preconditions:
          - "The case's FundsTransfer.status == REQUESTED else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "FundsTransfer.status -> FAILED; transfer.version += 1"
          - "The transfer's failure reverts ExistingContract.status SURRENDER_PENDING -> IN_FORCE; contract.version += 1"
          - "case.version += 1"
        note: "Compensation path: the case may request funds again from APPROVED."

      - from: FUNDS_RECEIVED
        to: IN_FREE_LOOK
        trigger: "POST /cases/{id}/confirm_delivery"
        actor: OperationsDesk
        preconditions: []
        side_effects:
          - "free_look_started_at = now; free_look_deadline_date computed via free_look_deadline (30 days senior / 20 standard)"
          - "case.version += 1"

      - from: IN_FREE_LOOK
        to: COMPLETED
        trigger: "POST /cases/{id}/complete"
        actor: OperationsDesk
        preconditions:
          - "date(now) > free_look_deadline_date else ERR_FREE_LOOK_STILL_ACTIVE"
        side_effects:
          - "completed_at = now; case.version += 1"
          - "ExistingContract.last_exchange_completed_at = now (anti-churn marker); contract.version += 1"
          - "Append ActivityEvent(EXCHANGE_COMPLETED) for the producer"
          - "Recompute producer 12m counters; run producer_churn_metrics evaluation (may set or clear FLAGGED)"

      - from: IN_FREE_LOOK
        to: RESCINDED
        trigger: "POST /cases/{id}/rescind"
        actor: Producer | CarrierAdmin
        preconditions:
          - "If caller role is Producer: caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"
          - "date(now) <= free_look_deadline_date (inclusive) else ERR_FREE_LOOK_EXPIRED"
        side_effects:
          - "rescinded_at = now; case.version += 1"
          - "FundsTransfer.status RECEIVED -> RETURNED; returned_at = now; transfer.version += 1"
          - "The transfer's return restores the contract: ExistingContract.status EXCHANGED -> IN_FORCE, account_value_cents = transfer.pre_exchange_value_cents, tax_basis_cents = transfer.pre_exchange_basis_cents; contract.version += 1"
          - "The contract restore triggers Client.last_rescinded_at = now; client.version += 1"
          - "Append ActivityEvent(EXCHANGE_RESCINDED) for the producer"
          - "Recompute producer 12m counters; run producer_churn_metrics evaluation"
        note: "Transitive chain: rescission mutates the case; the case's rescission returns the transfer; the transfer's return restores the contract; the restore stamps the client and re-evaluates the producer."

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1 (no ActivityEvent: the case was never submitted)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1; append ActivityEvent(CASE_WITHDRAWN); recompute producer counters"

      - from: SUITABILITY_REVIEW
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1; append ActivityEvent(CASE_WITHDRAWN); recompute producer counters"

      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1; append ActivityEvent(CASE_WITHDRAWN); recompute producer counters"

      - from: PENDING_PRINCIPAL
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1; append ActivityEvent(CASE_WITHDRAWN); recompute producer counters"

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the case else ERR_CASE_NOT_OWNED_BY_PRODUCER"]
        side_effects:
          - "case.version += 1; append ActivityEvent(CASE_WITHDRAWN); recompute producer counters"

  - entity: CaseDocument
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /documents/{id}/verify"
        actor: SuitabilityReviewer
        preconditions:
          - "Parent case status IN {SUITABILITY_REVIEW, INFO_REQUESTED} else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["document.version += 1"]

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /documents/{id}/reject"
        actor: SuitabilityReviewer
        preconditions:
          - "Parent case status IN {SUITABILITY_REVIEW, INFO_REQUESTED} else ERR_INVALID_STATE_TRANSITION"
        side_effects: ["rejection_reason = request rationale; document.version += 1"]

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /cases/{id}/documents with the same doc_type (resubmission)"
        actor: Producer
        preconditions:
          - "Caller owns the parent case else ERR_CASE_NOT_OWNED_BY_PRODUCER"
        side_effects: ["revision += 1; rejection_reason cleared; document.version += 1"]
        note: "Cyclic revision loop: a rejected document can be corrected and resubmitted any number of times."

  - entity: FundsTransfer
    initial_state: REQUESTED
    terminal_states: [FAILED, RETURNED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /transfers/{id}/mark_received"
        actor: OperationsDesk
        preconditions: []
        side_effects: ["received_at = now; cascades: case FUNDS_REQUESTED -> FUNDS_RECEIVED; contract SURRENDER_PENDING -> EXCHANGED with value/basis reduction"]

      - from: REQUESTED
        to: FAILED
        trigger: "POST /transfers/{id}/mark_failed"
        actor: OperationsDesk
        preconditions: []
        side_effects: ["cascades: case FUNDS_REQUESTED -> APPROVED; contract SURRENDER_PENDING -> IN_FORCE"]

      - from: RECEIVED
        to: RETURNED
        trigger: "system (synchronous cascade of POST /cases/{id}/rescind)"
        actor: system
        preconditions: ["Parent case transitioned IN_FREE_LOOK -> RESCINDED in the same request"]
        side_effects: ["returned_at = now; cascades: contract EXCHANGED -> IN_FORCE with snapshot restore of value and basis"]

  - entity: ExistingContract
    initial_state: IN_FORCE
    terminal_states: []
    transitions:
      - from: IN_FORCE
        to: SURRENDER_PENDING
        trigger: "system (cascade of POST /cases/{id}/request_funds)"
        actor: system
        preconditions: ["Parent case transitioned APPROVED -> FUNDS_REQUESTED in the same request"]
        side_effects: ["contract.version += 1"]

      - from: SURRENDER_PENDING
        to: EXCHANGED
        trigger: "system (cascade of POST /transfers/{id}/mark_received)"
        actor: system
        preconditions: []
        side_effects: ["Value/basis reduction per exchange_type; contract.version += 1"]

      - from: SURRENDER_PENDING
        to: IN_FORCE
        trigger: "system (cascade of POST /transfers/{id}/mark_failed — compensation)"
        actor: system
        preconditions: []
        side_effects: ["contract.version += 1"]

      - from: EXCHANGED
        to: IN_FORCE
        trigger: "system (cascade of rescission: transfer RETURNED)"
        actor: system
        preconditions: []
        side_effects: ["account_value_cents / tax_basis_cents restored from the transfer's pre_exchange snapshots; contract.version += 1"]

  - entity: Producer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FLAGGED
        trigger: "system (producer_churn_metrics evaluation after a case event or clock advance)"
        actor: system
        preconditions:
          - "completed_exchange_count_12m >= CHURN_FLAG_MIN_COMPLETED_12M AND rescission_rate_completed_bps >= RESCISSION_FLAG_BPS"
        side_effects: ["Append ActivityEvent(PRODUCER_FLAGGED); producer.version += 1"]

      - from: FLAGGED
        to: ACTIVE
        trigger: "system (producer_churn_metrics evaluation: thresholds no longer met — automatic clear)"
        actor: system
        preconditions:
          - "completed_exchange_count_12m < CHURN_FLAG_MIN_COMPLETED_12M OR rescission_rate_completed_bps < RESCISSION_FLAG_BPS"
        side_effects: ["Append ActivityEvent(PRODUCER_UNFLAGGED); producer.version += 1"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /producers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Append ActivityEvent(PRODUCER_SUSPENDED); producer.version += 1"]

      - from: FLAGGED
        to: SUSPENDED
        trigger: "POST /producers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Append ActivityEvent(PRODUCER_SUSPENDED); producer.version += 1"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /producers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Append ActivityEvent(PRODUCER_REINSTATED); producer.version += 1"
          - "Run producer_churn_metrics evaluation (producer may land on FLAGGED instead of ACTIVE if thresholds are still met)"
        note: "Reinstate targets ACTIVE, but the mandatory churn re-evaluation in the same request can immediately re-flag the producer."

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: analysis-create-stale-case
    parent_entity: ExchangeCase
    write_endpoint: "POST /cases/{id}/comparison-analyses"
    occ_field: expected_case_version
    description: |
      Creating a ComparisonAnalysis against an ExchangeCase whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created an analysis (which legitimately
      supersedes the prior FINAL analysis) or otherwise mutated the case, and
      the current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: surrender_charge_schedule
    trigger: "ComparisonAnalysis creation (both variants) and POST /cases/{id}/request_funds (at_settlement variant actualizes the withheld charge)"
    algorithm: threshold
    formula: |
      completed_years(as_of) = max k >= 0 such that issue_date + k years <= date(as_of)
        (anniversary arithmetic is inclusive: on the exact anniversary date, the year counts as completed)
      year_index = completed_years + 1
      pct_bps = surrender_schedule entry whose contract_year == year_index; 0 when year_index exceeds the schedule length
      exchange_base_cents = account_value_cents when case.exchange_type == FULL else case.exchange_amount_cents
      surrender_charge_cents = floor(exchange_base_cents * pct_bps / 10000)   # integer arithmetic, divide once
    input_set: "The case's ExistingContract (any status); schedule entries are the contract's own surrender_schedule"
    constants:
      SETTLEMENT_LAG_DAYS: 45
    precision: "integer cents, floor division, divide exactly once after the bps multiply"
    variants:
      - name: as_of_today
        when: "as_of = analysis_date (logical clock at analysis creation)"
        difference: "Chronological lookup: uses only anniversaries already completed at analysis time"
      - name: at_settlement
        when: "as_of = analysis_date + SETTLEMENT_LAG_DAYS (45 days)"
        difference: "Forward-looking projection to the estimated carrier settlement date; an anniversary falling inside the 45-day lag drops the charge into the next (lower) schedule band, so this variant yields a smaller charge than as_of_today whenever an anniversary intervenes"

  - name: tax_basis_allocation
    trigger: "ComparisonAnalysis creation (illustration) and POST /cases/{id}/request_funds (actualization onto FundsTransfer and, at mark_received, onto the contract)"
    algorithm: waterfall_allocation
    formula: |
      FULL:  basis_transferred_cents = tax_basis_cents;  basis_remaining_cents = 0
      PARTIAL: basis_transferred_cents = floor(tax_basis_cents * exchange_amount_cents / account_value_cents)
               basis_remaining_cents   = tax_basis_cents - basis_transferred_cents
      Rounding order is PINNED: integer multiply first, then one floor division.
      Never round the ratio exchange_amount/account_value to a decimal first —
      rounding the ratio to 4 decimal places before multiplying produces
      different cents (e.g. 8,000,000 x 3,333,333 / 10,000,000 = 2,666,666
      vs ratio-first 0.3333 x 8,000,000 = 2,666,400).
    input_set: "The case's ExistingContract (account_value_cents, tax_basis_cents) and case.exchange_amount_cents"
    constants:
      MIN_PARTIAL_CENTS: 100000
    precision: "integer cents, floor, multiply-then-divide"
    variants:
      - name: full_exchange
        when: "case.exchange_type == FULL"
        difference: "Entire basis carries over; old contract basis becomes 0"
      - name: partial_exchange
        when: "case.exchange_type == PARTIAL"
        difference: "Pro-rata basis allocation; remainder stays with the old contract"

  - name: benefit_loss_estimate
    trigger: "ComparisonAnalysis creation"
    algorithm: threshold
    formula: |
      if living_benefit_rider == false: benefit_loss_cents = 0
      else:
        in_the_money_cents = rider_benefit_base_cents - account_value_cents
        benefit_loss_cents = max(0, min(in_the_money_cents, RIDER_LOSS_CAP_CENTS))
    input_set: "The case's ExistingContract rider fields and account_value_cents"
    constants:
      RIDER_LOSS_CAP_CENTS: 2000000
    precision: "integer cents, no rounding needed"
    variants: []

  - name: net_replacement_cost
    trigger: "ComparisonAnalysis creation"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency pinned to this exact evaluation order:
        1. surrender_charge  = surrender_charge_schedule[at_settlement] on exchange_base_cents
        2. amount_received   = exchange_base_cents - surrender_charge          (bonus base depends on step 1)
        3. bonus_credit      = floor(amount_received * new_product_bonus_bps / 10000)
        4. benefit_loss      = benefit_loss_estimate
        5. net_replacement_cost_cents = surrender_charge + benefit_loss - bonus_credit
      Computing the bonus on the GROSS base (skipping step 1's subtraction) is a
      different, wrong number; the order above is the contract.
    input_set: "The case, its ExistingContract, and new_product_bonus_bps"
    constants: {}
    precision: "integer cents, floor division at step 3 only"
    variants: []

  - name: break_even_years
    trigger: "ComparisonAnalysis creation"
    algorithm: forward_looking
    formula: |
      net_old_bps = assumed_old_growth_bps - (rider_annual_fee_bps if living_benefit_rider else 0)
      net_new_bps = assumed_new_growth_bps - new_product_annual_fee_bps
      old_0 = account_value_cents
      new_0 = amount_received_cents + bonus_credit_cents
      for y in 1..MAX_PROJECTION_YEARS:
        old_y = floor(old_{y-1} * (10000 + net_old_bps) / 10000)
        new_y = floor(new_{y-1} * (10000 + net_new_bps) / 10000)
        if new_y >= old_y: return y
      return 99   # sentinel: does not break even inside the projection horizon
    input_set: "The case's ExistingContract, the analysis's own amount_received_cents and bonus_credit_cents, and both assumed growth inputs"
    constants:
      MAX_PROJECTION_YEARS: 30
    precision: "integer cents, floor once per annual step (year-by-year compounding, not closed-form)"
    variants: []

  - name: free_look_deadline
    trigger: "POST /cases/{id}/confirm_delivery (computes free_look_deadline_date); POST /cases/{id}/rescind and POST /cases/{id}/complete (evaluate the boundary)"
    algorithm: threshold
    formula: |
      free_look_days = FREE_LOOK_DAYS_SENIOR when client.is_senior (age_years >= 65 at delivery) else FREE_LOOK_DAYS_STANDARD
      free_look_deadline_date = date(free_look_started_at) + free_look_days
      rescission allowed when date(now) <= free_look_deadline_date   (INCLUSIVE boundary)
      completion allowed when date(now) >  free_look_deadline_date
    input_set: "The case's Client (age at delivery date) and free_look_started_at"
    constants:
      FREE_LOOK_DAYS_STANDARD: 20
      FREE_LOOK_DAYS_SENIOR: 30
      SENIOR_AGE: 65
    precision: "whole UTC dates; the delivery date itself is day 0"
    variants: []

  - name: producer_churn_metrics
    trigger: "After every producer case event (submit, complete, rescind, reject, withdraw) and after every logical-clock set"
    algorithm: aggregation
    formula: |
      Window W = { ActivityEvent of this producer with event_at > now - 365 days AND event_at <= now }
        (half-open: an event exactly 365 days old is EXCLUDED; an event at exactly now is INCLUDED)
      submitted_12m = count of CASE_SUBMITTED in W
      completed_12m = count of EXCHANGE_COMPLETED in W
      rescinded_12m = count of EXCHANGE_RESCINDED in W
      rescission_rate_completed_bps = completed_12m == 0 ? 0 : floor(10000 * rescinded_12m / completed_12m)
      rescission_rate_submitted_bps = submitted_12m == 0 ? 0 : floor(10000 * rescinded_12m / submitted_12m)
      FLAGGED set when:  completed_12m >= CHURN_FLAG_MIN_COMPLETED_12M AND rescission_rate_completed_bps >= RESCISSION_FLAG_BPS
      FLAGGED cleared (back to ACTIVE) when an evaluation finds the condition no longer holds
      Both >= comparisons are INCLUSIVE at the threshold.
    input_set: "ActivityEvent rows for the producer; both producer-level and case-level events carry producer_id"
    constants:
      CHURN_FLAG_MIN_COMPLETED_12M: 2
      RESCISSION_FLAG_BPS: 5000
      ANTI_CHURN_WINDOW_DAYS: 365
      COOLING_OFF_DAYS_AFTER_RESCISSION: 30
    precision: "integer bps, floor division"
    variants:
      - name: completed_basis
        when: "Denominator = completed_exchange_count_12m"
        difference: "Rate of completed exchanges that later rescinded; this variant drives the FLAGGED threshold"
      - name: submitted_basis
        when: "Denominator = submitted_case_count_12m"
        difference: "Rate of all submitted cases that later rescinded; smaller whenever some submitted cases never completed — a different number for identical event data"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty; role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every id in the path (and body FKs: client_id, existing_contract_id, producer_id) resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: auth
    check: "Producer-role callers may only mutate cases whose producer_id equals their X-User-ID"
    error_id: ERR_CASE_NOT_OWNED_BY_PRODUCER
    http_status: 403
    applies_to: "POST /cases/{id}/submit, /withdraw, /rescind, /documents (producer callers only)"

  - priority: 5
    category: business_constraint
    check: "Request body shape: required fields present, enums in their declared sets, integers positive where required, surrender_schedule years strictly ascending from 1; for PARTIAL cases exchange_amount_cents must be present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 6
    category: state
    check: "Target entity in a state from which the transition is declared; for ExchangeCase submit this includes ExistingContract.status == IN_FORCE"
    error_id: "ERR_INVALID_STATE_TRANSITION (or ERR_CONTRACT_NOT_IN_FORCE for the contract precondition on submit)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_case_version equals the case's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/comparison-analyses"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the approving Principal's X-User-ID must differ from case.reviewed_by_id"
    error_id: ERR_DUTY_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /cases/{id}/approve"

  - priority: 9
    category: business_safety
    check: "Producer.status != SUSPENDED when submitting a case"
    error_id: ERR_PRODUCER_SUSPENDED
    http_status: 409
    applies_to: "POST /cases/{id}/submit"

  - priority: 10
    category: business_safety
    check: "All three required doc types have a VERIFIED CaseDocument before recommend"
    error_id: ERR_REQUIRED_DOCUMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /cases/{id}/recommend"

  - priority: 11
    category: business_safety
    check: "A ComparisonAnalysis with status FINAL exists before recommend"
    error_id: ERR_ANALYSIS_MISSING
    http_status: 409
    applies_to: "POST /cases/{id}/recommend"

  - priority: 12
    category: business_temporal
    check: "Client cooling-off: now >= last_rescinded_at + 30 days (or never rescinded)"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    applies_to: "POST /cases/{id}/submit"

  - priority: 13
    category: business_temporal
    check: "Anti-churn: now >= contract.last_exchange_completed_at + 365 days (or null)"
    error_id: ERR_CONTRACT_EXCHANGED_WITHIN_12M
    http_status: 409
    applies_to: "POST /cases/{id}/submit"

  - priority: 14
    category: business_referential
    check: "Contract occupation: no other ExchangeCase on the same contract with status NOT IN {COMPLETED, REJECTED, WITHDRAWN, RESCINDED}"
    error_id: ERR_CONTRACT_EXCHANGE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /cases/{id}/submit"

  - priority: 15
    category: business_referential
    check: "Contract uniqueness: (carrier_name, contract_number) pair, case-insensitive, unique across all ExistingContract rows"
    error_id: ERR_DUPLICATE_CONTRACT_NUMBER
    http_status: 409
    applies_to: "POST /contracts"

  - priority: 16
    category: business_constraint
    check: "A VERIFIED document's doc_type cannot be resubmitted (documents are locked once verified)"
    error_id: ERR_DOCUMENT_LOCKED
    http_status: 409
    applies_to: "POST /cases/{id}/documents"

  - priority: 17
    category: business_fiscal
    check: "PARTIAL amount bounds: exchange_amount_cents >= MIN_PARTIAL_CENTS and strictly < account_value_cents"
    error_id: "ERR_PARTIAL_BELOW_MINIMUM (amount < 100000) / ERR_PARTIAL_AMOUNT_INVALID (amount >= account value)"
    http_status: 409
    applies_to: "POST /cases/{id}/submit"

  - priority: 18
    category: business_fiscal
    check: "Free-look window: rescind requires date(now) <= free_look_deadline_date; complete requires date(now) > free_look_deadline_date"
    error_id: "ERR_FREE_LOOK_EXPIRED (rescind) / ERR_FREE_LOOK_STILL_ACTIVE (complete)"
    http_status: 409
    applies_to: "POST /cases/{id}/rescind, POST /cases/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: every resource is top-level; children are reached via
# sub-resource GETs or filtered lists. "ALL" in roles means every declared
# role: CarrierAdmin, Producer, SuitabilityReviewer, Principal,
# ComplianceOfficer, OperationsDesk.
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. Side effect: re-run producer_churn_metrics for every producer (window membership may shift)."
    roles: [CarrierAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["producer churn re-evaluation for all producers"]

  # --- Producer ---
  - method: POST
    path: "/producers"
    description: "Register a producer"
    roles: [CarrierAdmin]
    code: 201
    input: [license_number, full_name, home_state_code]
    output: Producer
    side_effects: ["status=ACTIVE; all 12m counters 0"]

  - method: GET
    path: "/producers/{id}"
    description: "Get a producer including computed churn counters"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: []
    output: Producer
    side_effects: []

  - method: POST
    path: "/producers/{id}/suspend"
    description: "Suspend a producer (from ACTIVE or FLAGGED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Producer
    side_effects: ["status -> SUSPENDED; ActivityEvent(PRODUCER_SUSPENDED); version += 1"]

  - method: POST
    path: "/producers/{id}/reinstate"
    description: "Reinstate a suspended producer"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Producer
    side_effects: ["status -> ACTIVE (or FLAGGED if churn evaluation still trips); ActivityEvent(PRODUCER_REINSTATED); version += 1"]

  - method: GET
    path: "/producers/{id}/activity-events"
    description: "List a producer's exchange activity events (churning audit trail)"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "ActivityEvent[]"
    side_effects: []

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Register an annuitant client"
    roles: [Producer, CarrierAdmin]
    code: 201
    input: [full_name, date_of_birth, state_code]
    output: Client
    side_effects: ["age_years / is_senior computed from logical clock"]

  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}/contracts"
    description: "List a client's existing contracts"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExistingContract[]"
    side_effects: []

  # --- ExistingContract ---
  - method: POST
    path: "/contracts"
    description: "Register an in-force contract that a case may replace"
    roles: [Producer, CarrierAdmin]
    code: 201
    input: [client_id, carrier_name, contract_number, issue_date, account_value_cents, tax_basis_cents, surrender_schedule, living_benefit_rider, "rider_benefit_base_cents?", "rider_annual_fee_bps?", "last_exchange_completed_at?"]
    output: ExistingContract
    side_effects: ["status=IN_FORCE; ERR_DUPLICATE_CONTRACT_NUMBER on (carrier_name, contract_number) collision"]

  # --- ExchangeCase ---
  - method: POST
    path: "/cases"
    description: "Create a DRAFT exchange/replacement case"
    roles: [Producer]
    code: 201
    input: [producer_id, client_id, existing_contract_id, exchange_type, "exchange_amount_cents?", new_product_code, new_product_surrender_years, "new_product_bonus_bps?", "new_product_annual_fee_bps?"]
    output: ExchangeCase
    side_effects: ["status=DRAFT; for FULL exchange_amount_cents is system-set to the contract's account_value_cents"]

  - method: GET
    path: "/cases/{id}"
    description: "Get a case"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases with filters and pagination"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["producer_id?", "client_id?", "existing_contract_id?", "status?", "limit?", "offset?"]
    output: "ExchangeCase[]"
    side_effects: []

  - method: POST
    path: "/cases/{id}/submit"
    description: "Submit a DRAFT case for review; runs all business gates (producer standing, contract status, cooling-off, anti-churn, occupation, partial bounds)"
    roles: [Producer]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> SUBMITTED; submitted_at set; ActivityEvent(CASE_SUBMITTED); counters + churn evaluation; version += 1"]

  - method: POST
    path: "/cases/{id}/withdraw"
    description: "Producer withdraws a case any time before funds are requested"
    roles: [Producer]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> WITHDRAWN; ActivityEvent(CASE_WITHDRAWN) when previously submitted; version += 1"]

  - method: POST
    path: "/cases/{id}/start_review"
    description: "Suitability reviewer takes a SUBMITTED case into review"
    roles: [SuitabilityReviewer]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> SUITABILITY_REVIEW; version += 1"]

  - method: POST
    path: "/cases/{id}/request_info"
    description: "Reviewer requests corrected/additional documentation"
    roles: [SuitabilityReviewer]
    code: 200
    input: [rationale]
    output: ExchangeCase
    side_effects: ["status -> INFO_REQUESTED; ReviewDecision(REQUEST_INFO); version += 1"]

  - method: POST
    path: "/cases/{id}/recommend"
    description: "Reviewer recommends approval; requires all three doc types VERIFIED and a FINAL analysis"
    roles: [SuitabilityReviewer]
    code: 200
    input: [rationale]
    output: ExchangeCase
    side_effects: ["status -> PENDING_PRINCIPAL; ReviewDecision(SUITABILITY/APPROVE); reviewed_by_id set; version += 1"]

  - method: POST
    path: "/cases/{id}/reject"
    description: "Reviewer or principal rejects the case (terminal)"
    roles: [SuitabilityReviewer, Principal]
    code: 200
    input: [rationale]
    output: ExchangeCase
    side_effects: ["status -> REJECTED; ReviewDecision(stage by role, REJECT); ActivityEvent(CASE_REJECTED); version += 1"]

  - method: POST
    path: "/cases/{id}/approve"
    description: "Principal approves; the approver must not be the recommending reviewer"
    roles: [Principal]
    code: 200
    input: [rationale]
    output: ExchangeCase
    side_effects: ["status -> APPROVED; ReviewDecision(PRINCIPAL/APPROVE); approved_by_id set; version += 1"]

  - method: POST
    path: "/cases/{id}/request_funds"
    description: "Request carrier-to-carrier funds transfer; computes charge/basis at the at_settlement variant and snapshots the contract"
    roles: [OperationsDesk]
    code: 201
    input: []
    output: FundsTransfer
    side_effects: ["case -> FUNDS_REQUESTED; contract -> SURRENDER_PENDING; FundsTransfer created REQUESTED"]

  - method: POST
    path: "/cases/{id}/confirm_delivery"
    description: "Confirm policy delivery to the client; starts the free-look period"
    roles: [OperationsDesk]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> IN_FREE_LOOK; free_look_started_at and free_look_deadline_date set; version += 1"]

  - method: POST
    path: "/cases/{id}/complete"
    description: "Close the case after the free-look deadline has passed"
    roles: [OperationsDesk]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> COMPLETED; completed_at set; contract.last_exchange_completed_at stamped; ActivityEvent(EXCHANGE_COMPLETED); counters + churn evaluation; version += 1"]

  - method: POST
    path: "/cases/{id}/rescind"
    description: "Client rescinds inside the free-look window; synchronously returns the transfer and restores the contract"
    roles: [Producer, CarrierAdmin]
    code: 200
    input: []
    output: ExchangeCase
    side_effects: ["status -> RESCINDED; transfer -> RETURNED; contract -> IN_FORCE with snapshot restore; client.last_rescinded_at set; ActivityEvent(EXCHANGE_RESCINDED); counters + churn evaluation; version += 1"]

  # --- CaseDocument ---
  - method: POST
    path: "/cases/{id}/documents"
    description: "Submit a disclosure/suitability document; resubmitting a REJECTED doc_type bumps its revision and (when the case is INFO_REQUESTED) returns the case to SUITABILITY_REVIEW"
    roles: [Producer]
    code: 201
    input: [doc_type]
    output: CaseDocument
    side_effects: ["Case allowed in DRAFT/SUBMITTED/SUITABILITY_REVIEW/INFO_REQUESTED else ERR_INVALID_STATE_TRANSITION; ERR_DOCUMENT_LOCKED when that doc_type already VERIFIED; INFO_REQUESTED case -> SUITABILITY_REVIEW (version += 1)"]

  - method: GET
    path: "/cases/{id}/documents"
    description: "List a case's documents"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["doc_type?", "status?", "limit?", "offset?"]
    output: "CaseDocument[]"
    side_effects: []

  - method: POST
    path: "/documents/{id}/verify"
    description: "Verify a submitted document"
    roles: [SuitabilityReviewer]
    code: 200
    input: []
    output: CaseDocument
    side_effects: ["status -> VERIFIED; version += 1"]

  - method: POST
    path: "/documents/{id}/reject"
    description: "Reject a submitted document"
    roles: [SuitabilityReviewer]
    code: 200
    input: [rationale]
    output: CaseDocument
    side_effects: ["status -> REJECTED; rejection_reason set; version += 1"]

  # --- ComparisonAnalysis ---
  - method: POST
    path: "/cases/{id}/comparison-analyses"
    description: "Create the surrender-charge / benefit-loss / break-even analysis; supersedes the prior FINAL analysis; OCC-guarded on the case version"
    roles: [SuitabilityReviewer]
    code: 201
    input: [expected_case_version, assumed_old_growth_bps, assumed_new_growth_bps]
    output: ComparisonAnalysis
    side_effects: ["Case must be SUITABILITY_REVIEW or INFO_REQUESTED else ERR_INVALID_STATE_TRANSITION; prior FINAL analysis -> SUPERSEDED (supersedes_analysis_id set); increments ExchangeCase.version by 1; all computed fields populated per §1.3"]

  - method: GET
    path: "/cases/{id}/comparison-analyses"
    description: "List a case's analyses (FINAL and SUPERSEDED)"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ComparisonAnalysis[]"
    side_effects: []

  # --- FundsTransfer ---
  - method: GET
    path: "/cases/{id}/funds-transfers"
    description: "List a case's funds transfers"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FundsTransfer[]"
    side_effects: []

  - method: POST
    path: "/transfers/{id}/mark_received"
    description: "Record receipt of carrier-to-carrier funds; cascades case -> FUNDS_RECEIVED and contract -> EXCHANGED"
    roles: [OperationsDesk]
    code: 200
    input: []
    output: FundsTransfer
    side_effects: ["status -> RECEIVED; received_at set; case and contract cascade per §1.2"]

  - method: POST
    path: "/transfers/{id}/mark_failed"
    description: "Record transfer failure; compensates case -> APPROVED and contract -> IN_FORCE"
    roles: [OperationsDesk]
    code: 200
    input: []
    output: FundsTransfer
    side_effects: ["status -> FAILED; case and contract revert per §1.2"]

  # --- ReviewDecision (append-only audit) ---
  - method: GET
    path: "/cases/{id}/activity-events"
    description: "List activity events attached to a case (case-scoped slice of the producer audit trail)"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "ActivityEvent[]"
    side_effects: []

  - method: GET
    path: "/cases/{id}/review-decisions"
    description: "List a case's review/approval decision records"
    roles: [CarrierAdmin, Producer, SuitabilityReviewer, Principal, ComplianceOfficer, OperationsDesk]
    code: 200
    input: ["stage?", "limit?", "offset?"]
    output: "ReviewDecision[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or an undeclared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK does not resolve to an existing resource" }
  - { id: ERR_CASE_NOT_OWNED_BY_PRODUCER, http: 403, condition: "Producer-role caller attempts to mutate a case whose producer_id differs from X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive amount, or malformed surrender_schedule" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target entity is not in a state from which the requested transition is declared" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the case's current version (OCC)" }
  - { id: ERR_CONTRACT_NOT_IN_FORCE, http: 409, condition: "Case submit requires the ExistingContract to be IN_FORCE" }
  - { id: ERR_DUTY_SEGREGATION_VIOLATION, http: 409, condition: "Approving principal's X-User-ID equals the recommending reviewer's id" }
  - { id: ERR_PRODUCER_SUSPENDED, http: 409, condition: "SUSPENDED producer attempts to submit a case" }
  - { id: ERR_REQUIRED_DOCUMENTS_INCOMPLETE, http: 409, condition: "Recommend attempted without all three required doc types VERIFIED" }
  - { id: ERR_ANALYSIS_MISSING, http: 409, condition: "Recommend attempted without a FINAL ComparisonAnalysis" }
  - { id: ERR_COOLING_OFF_ACTIVE, http: 409, condition: "Client's most recent rescission is fewer than 30 days before the new submission" }
  - { id: ERR_CONTRACT_EXCHANGED_WITHIN_12M, http: 409, condition: "Contract was itself acquired via a completed exchange fewer than 365 days before the new submission" }
  - { id: ERR_CONTRACT_EXCHANGE_IN_PROGRESS, http: 409, condition: "Another non-terminal ExchangeCase already occupies the contract" }
  - { id: ERR_DUPLICATE_CONTRACT_NUMBER, http: 409, condition: "(carrier_name, contract_number) pair already registered" }
  - { id: ERR_DOCUMENT_LOCKED, http: 409, condition: "Resubmitting a doc_type that already has a VERIFIED document" }
  - { id: ERR_PARTIAL_BELOW_MINIMUM, http: 409, condition: "PARTIAL exchange_amount_cents below MIN_PARTIAL_CENTS (100000)" }
  - { id: ERR_PARTIAL_AMOUNT_INVALID, http: 409, condition: "PARTIAL exchange_amount_cents >= contract account_value_cents" }
  - { id: ERR_FREE_LOOK_EXPIRED, http: 409, condition: "Rescind attempted after free_look_deadline_date" }
  - { id: ERR_FREE_LOOK_STILL_ACTIVE, http: 409, condition: "Complete attempted on or before free_look_deadline_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAdmin
    description: "Carrier platform administrator: registers producers, may act as rescission backstop, operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /producers — register producer"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /clients, POST /contracts — register client/contract (shared with Producer)"
      - "POST /cases/{id}/rescind — rescind (shared with owning Producer)"
      - "All GET endpoints"

  - name: Producer
    description: "Licensed writing agent who originates exchange cases and submits disclosure documents"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /cases — create case"
      - "POST /cases/{id}/submit, /withdraw — case lifecycle (own cases only)"
      - "POST /cases/{id}/documents — submit/resubmit documents (own cases only)"
    shared_operations:
      - "POST /clients, POST /contracts (shared with CarrierAdmin)"
      - "POST /cases/{id}/rescind (shared with CarrierAdmin; own cases only)"
      - "All GET endpoints"

  - name: SuitabilityReviewer
    description: "Suitability desk reviewer: runs the comparison analysis, verifies documents, recommends or rejects"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/start_review, /request_info, /recommend"
      - "POST /documents/{id}/verify, /reject"
      - "POST /cases/{id}/comparison-analyses"
    shared_operations:
      - "POST /cases/{id}/reject (shared with Principal)"
      - "All GET endpoints"

  - name: Principal
    description: "Supervisory principal: final approval authority; may not approve a case they reviewed (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/approve"
    shared_operations:
      - "POST /cases/{id}/reject (shared with SuitabilityReviewer)"
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance officer: producer discipline (suspend/reinstate); churn flags themselves are system-set"
    identity: opaque
    exclusive_operations:
      - "POST /producers/{id}/suspend"
      - "POST /producers/{id}/reinstate"
    shared_operations:
      - "All GET endpoints"

  - name: OperationsDesk
    description: "Transfer/operations desk: funds requests, transfer receipt/failure, delivery confirmation, completion"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/request_funds, /confirm_delivery, /complete"
      - "POST /transfers/{id}/mark_received, /mark_failed"
    shared_operations:
      - "All GET endpoints"
