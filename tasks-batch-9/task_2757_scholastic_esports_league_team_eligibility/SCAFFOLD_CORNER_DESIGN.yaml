      - name: the_logical_clock_refuses_to_move_backwards_but_accepts_its_own_value
        claim_type: temporal_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_CLOCK_REWIND_FORBIDDEN]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The rule is `current_utc >= present value`, so a re-set to the SAME instant must
          succeed while one millisecond earlier is refused, and a refused rewind must leave
          the clock where it was — proved by the created_at of a district written straight
          afterwards.
        test_recipe:
          setup:
            - "Empty database; the clock is at its 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: LeagueAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59.999Z" }
              as: LeagueAdmin
              captures: { e_rewind: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: LeagueAdmin
            - call: "POST /districts"
              payload: { name: "Clock Witness District", state_code: "OR" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
          assert:
            - "trigger 1 returns 200"
            - "trigger 2 returns 409 with data.error_id == ERR_CLOCK_REWIND_FORBIDDEN"
            - "trigger 3 returns 200 — setting the clock to its current value is not a rewind"
            - "District.${d_id}.created_at == 2026-09-01T00:00:00.000Z, which proves the refused rewind did not move the clock"

      - name: broadcast_actions_are_refused_from_every_illegal_broadcast_state_and_for_a_foreign_school
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - validations[priority=41]
          - errors[ERR_INVALID_BROADCAST_STATE]
          - errors[ERR_BROADCAST_SCHOOL_MISMATCH]
          - state_machines.Match.broadcast_status_transitions
        distinguishing_aspect: |
          The broadcast dimension has its own from-state error, distinct from
          ERR_INVALID_MATCH_STATE: END and RESUME are refused while broadcast_status is
          NONE or SCHEDULED, and a second REGISTER on an already-SCHEDULED broadcast is
          refused too. Priority 41 additionally pins the channel to the requesting coach's
          OWN school — naming the opponent's school is ERR_BROADCAST_SCHOOL_MISMATCH even
          though that school genuinely participates in the match.
        test_recipe:
          setup:
            - "One district with two schools, one coach per school, one title, one season, one team per school and one match North Alpha (home) versus South Bravo (away); every team stays DRAFT"
            - "Both schools keep the default concurrent_broadcast_capacity 1, so no channel conflict can arise from the single broadcast used here"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "South High", nces_code: "NCES-002" }
              as: LeagueAdmin
              captures: { s_b_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_a_id}", full_name: "Dana Reed", email: "dana@north.k12" }
              as: LeagueAdmin
              captures: { c_a_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_b_id}", full_name: "Ivo Park", email: "ivo@south.k12" }
              as: LeagueAdmin
              captures: { c_b_id: $.data.id }
            - call: "POST /coaches/${c_a_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_a_id}"
            - call: "POST /coaches/${c_b_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_b_id}"
            - call: "POST /titles"
              payload: { name: "Rocket Clash", publisher: "Astro Interactive", age_rating: "E10", min_player_age: 13, server_pool_id: "POOL-A", server_pool_capacity: 1, match_duration_minutes: 60 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_a_id}", title_id: "${t_id}", coach_id: "${c_a_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_b_id}", title_id: "${t_id}", coach_id: "${c_b_id}", name: "South Bravo" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /matches"
              payload: { season_id: "${se_id}", home_team_id: "${tm_a_id}", away_team_id: "${tm_b_id}", scheduled_start_at: "2026-10-01T18:00:00.000Z" }
              as: LeagueAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /matches/${m_id}/broadcast"
              payload: { action: "END" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { e_end_from_none: $.data.error_id }
            - call: "POST /matches/${m_id}/broadcast"
              payload: { action: "REGISTER", broadcast_school_id: "${s_b_id}", broadcast_start_at: "2026-10-01T18:00:00.000Z", broadcast_end_at: "2026-10-01T19:00:00.000Z" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { e_school: $.data.error_id }
            - call: "POST /matches/${m_id}/broadcast"
              payload: { action: "REGISTER", broadcast_school_id: "${s_a_id}", broadcast_start_at: "2026-10-01T18:00:00.000Z", broadcast_end_at: "2026-10-01T19:00:00.000Z" }
              as: Coach
