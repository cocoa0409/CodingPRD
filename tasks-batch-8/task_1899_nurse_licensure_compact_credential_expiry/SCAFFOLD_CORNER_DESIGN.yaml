            - "Second adjudicate (co-2) succeeds: status == 'ADJUDICATED', adjudicated_by_user_id == 'co-2'"
            - "REPRIMAND: Nurse.${n_id}.credential_posture unchanged (no encumbrance cascade for record-only actions) and license stays ACTIVE"

      - name: nurse_manager_cannot_create_audit_run
        claim_type: violation_to_error
        grounds:
