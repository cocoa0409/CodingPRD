  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: appliance_load_occ_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appliance-load-update-stale]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /appliance-loads/{id}]"]
        distinguishing_aspect: "Two strictly sequential PATCHes carrying the same observed version: the first succeeds (version 1→2), the second — still presenting version 1 — fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["builder + DRAFT application; load at version 1"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /appliance-loads"
              payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { load_id: $.data.id, load_v: $.data.version }
          trigger:
            - { call: "PATCH /appliance-loads/${load_id}", payload: { expected_load_version: "${load_v}", quantity: 2 }, as: Builder, as_user_id: "${b_id}" }
            - call: "PATCH /appliance-loads/${load_id}"
              payload: { expected_load_version: "${load_v}", btuh_input_rating: 90000 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds: version 1 → 2, counted_load_cfph == 160.0"
            - "second PATCH (still version 1) → HTTP 412 ERR_STALE_VERSION"
            - "ApplianceLoad.${load_id}.btuh_input_rating remains 80000 (stale write discarded)"

      - name: application_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[application-patch-stale]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /service-applications/{id}]"]
        distinguishing_aspect: "Same OCC pattern one level up on the ServiceApplication aggregate root: a second writer presenting the pre-edit version is rejected with 412."
        test_recipe:
          setup: ["builder + DRAFT application at version 1"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
