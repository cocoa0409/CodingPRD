scaffold_corner_design:
  - section: entities
    instances:
      - name: create_talent_missing_email_returns_invalid_request
        claim_type: required_field_violation
        grounds:
          - "entities.Talent.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /marketplace/talents without email must fail 400 ERR_INVALID_REQUEST before any state is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "No Email", legal_name: "No Email Legal" }
              as: Talent
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"
      - name: create_talent_duplicate_stage_name_rejected
        claim_type: type_constraint
        grounds:
          - "entities.Talent.fields.stage_name"
          - "errors[ERR_DUPLICATE_UNIQUE_FIELD]"
          - "validations[priority=20]"
        distinguishing_aspect: "Second talent whose stage_name differs only by case from an existing one must be rejected 409 ERR_DUPLICATE_UNIQUE_FIELD (case-insensitive uniqueness)."
        test_recipe:
          setup: ["one talent registered with stage_name 'Case Star'"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Case Star", legal_name: "Case Star Legal", email: "case1@x.com", identity_document_ref: "d1" }
              as: Talent
              captures: { tc_id: $.data.id }
          trigger:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "case star", legal_name: "Other Legal", email: "case2@x.com", identity_document_ref: "d2" }
              as: Talent
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_UNIQUE_FIELD (http 409)"
      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET with a random UUID that matches no order must return 404 ERR_NOT_FOUND, not a 500 or empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /marketplace/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"
      - name: talent_computed_balances_start_at_zero
        claim_type: computed_field
        grounds:
          - "entities.Talent.fields.pending_balance_cents"
          - "entities.Talent.fields.trailing_gmv_cents"
        distinguishing_aspect: "Freshly registered talent has pending_balance_cents == 0, paid_out_balance_cents == 0, trailing_gmv_cents == 0, commission_tier == STANDARD, availability == BOOKABLE, status == PENDING_VERIFICATION; client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Zero Bal", legal_name: "Zero Bal Legal", email: "zb@x.com", identity_document_ref: "dz" }
              as: Talent
              captures: { tz_id: $.data.id, tz_pending: $.data.pending_balance_cents, tz_tier: $.data.commission_tier }
          trigger:
            - call: "GET /marketplace/talents/${tz_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Talent.${tz_id}.pending_balance_cents == 0"
            - "Talent.${tz_id}.paid_out_balance_cents == 0"
            - "Talent.${tz_id}.trailing_gmv_cents == 0"
            - "Talent.${tz_id}.commission_tier == STANDARD"
            - "Talent.${tz_id}.status == PENDING_VERIFICATION"
      - name: order_freezes_gross_at_creation_from_use_type_rate
        claim_type: computed_field
        grounds:
          - "entities.Order.fields.gross_amount_cents"
          - "entities.Order.fields.use_type"
        distinguishing_aspect: "gross_amount_cents is frozen at creation from the talent's rate for the order's use_type; a later rate change must not alter an existing order's gross."
        test_recipe:
          setup: ["ACTIVE talent personal 10000; order created at gross 10000"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Freeze Star", legal_name: "Freeze Legal", email: "fz@x.com", identity_document_ref: "dfz" }
              as: Talent
              captures: { tf_id: $.data.id, tf_ver: $.data.version }
            - call: "POST /marketplace/talents/${tf_id}/identity/submit"
              payload: { identity_document_ref: "dfz" }
              as: Talent
              as_user_id: "${tf_id}"
            - call: "POST /marketplace/talents/${tf_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9001" }
              as: Talent
              as_user_id: "${tf_id}"
              captures: { tdf_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdf_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${tf_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${tf_ver}" }
              as: Talent
              as_user_id: "${tf_id}"
              captures: { tf_ver2: $.data.version }
            - call: "POST /marketplace/admin/talents/${tf_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "bf@x.com", display_name: "Buyer F", is_business_account: false }
              as: Buyer
              captures: { bf_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${tf_id}", buyer_id: "${bf_id}", use_type: "PERSONAL", occasion: "hi", script_instructions: "hello", recipient_name: "R" }
              as: Buyer
              as_user_id: "${bf_id}"
              captures: { of_id: $.data.id, of_gross: $.data.gross_amount_cents }
            - call: "GET /marketplace/talents/${tf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { tf_ver3: $.data.version }
          trigger:
            - call: "POST /marketplace/talents/${tf_id}/rates"
              payload: { personal_rate_cents: 20000, business_rate_cents: 80000, advertising_rate_cents: 160000, turnaround_hours: 72, expected_talent_version: "${tf_ver3}" }
              as: Talent
              as_user_id: "${tf_id}"
          assert:
            - "Order.${of_id}.gross_amount_cents == 10000 even after the talent's personal rate changed to 20000"
      - name: list_orders_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints"
          - "response_envelope"
        distinguishing_aspect: "GET /marketplace/orders returns response_type array with pagination fields limit/offset/total_count/has_more; default limit is 10."
        test_recipe:
          setup: ["one buyer and one ACTIVE talent with 1 order created"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Page Star", legal_name: "Page Legal", email: "pg@x.com", identity_document_ref: "dpg" }
              as: Talent
              captures: { tp_id: $.data.id, tp_ver: $.data.version }
            - call: "POST /marketplace/talents/${tp_id}/identity/submit"
              payload: { identity_document_ref: "dpg" }
              as: Talent
              as_user_id: "${tp_id}"
            - call: "POST /marketplace/talents/${tp_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9002" }
              as: Talent
              as_user_id: "${tp_id}"
              captures: { tdp_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdp_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${tp_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${tp_ver}" }
              as: Talent
              as_user_id: "${tp_id}"
            - call: "POST /marketplace/admin/talents/${tp_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "bp@x.com", display_name: "Buyer P", is_business_account: false }
              as: Buyer
              captures: { bp_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${tp_id}", buyer_id: "${bp_id}", use_type: "PERSONAL", occasion: "pg", script_instructions: "page test", recipient_name: "Pg" }
              as: Buyer
              as_user_id: "${bp_id}"
          trigger:
            - call: "GET /marketplace/orders"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response envelope response_type == 'array' and data is a list of length 1"
            - "meta contains api_request_id and api_request_timestamp"
            - "pagination block present with limit == 10, offset == 0, total_count == 1, has_more == false"

  - section: state_machines
    instances:
      - name: accept_from_screening_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Order.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Accepting an order still in SCREENING (not yet attested) must fail 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["order in SCREENING"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "State Star", legal_name: "State Legal", email: "st@x.com", identity_document_ref: "dst" }
              as: Talent
              captures: { tst_id: $.data.id, tst_ver: $.data.version }
            - call: "POST /marketplace/talents/${tst_id}/identity/submit"
              payload: { identity_document_ref: "dst" }
              as: Talent
              as_user_id: "${tst_id}"
            - call: "POST /marketplace/talents/${tst_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9003" }
              as: Talent
              as_user_id: "${tst_id}"
              captures: { tdst_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdst_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${tst_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${tst_ver}" }
              as: Talent
              as_user_id: "${tst_id}"
            - call: "POST /marketplace/admin/talents/${tst_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "bst@x.com", display_name: "Buyer ST", is_business_account: false }
              as: Buyer
              captures: { bst_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${tst_id}", buyer_id: "${bst_id}", use_type: "PERSONAL", occasion: "s", script_instructions: "s", recipient_name: "S" }
              as: Buyer
              as_user_id: "${bst_id}"
              captures: { ost_id: $.data.id }
          trigger:
            - call: "POST /marketplace/orders/${ost_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${tst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Order.${ost_id}.status remains SCREENING"
      - name: terminal_declined_order_rejects_confirm
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Order"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DECLINED order is terminal: confirm (and every other transition) from DECLINED must fail 409."
        test_recipe:
          setup: ["order DECLINED by talent decline"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Term Star", legal_name: "Term Legal", email: "tm@x.com", identity_document_ref: "dtm" }
              as: Talent
              captures: { ttm_id: $.data.id, ttm_ver: $.data.version }
            - call: "POST /marketplace/talents/${ttm_id}/identity/submit"
              payload: { identity_document_ref: "dtm" }
              as: Talent
              as_user_id: "${ttm_id}"
            - call: "POST /marketplace/talents/${ttm_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9004" }
              as: Talent
              as_user_id: "${ttm_id}"
              captures: { tdtm_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdtm_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${ttm_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${ttm_ver}" }
              as: Talent
              as_user_id: "${ttm_id}"
            - call: "POST /marketplace/admin/talents/${ttm_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "btm@x.com", display_name: "Buyer TM", is_business_account: false }
              as: Buyer
              captures: { btm_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${ttm_id}", buyer_id: "${btm_id}", use_type: "PERSONAL", occasion: "t", script_instructions: "t", recipient_name: "T" }
              as: Buyer
              as_user_id: "${btm_id}"
              captures: { otm_id: $.data.id, otm_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${otm_id}/screening-attest"
              payload: { screening_token: "${otm_tok}" }
              as: Buyer
              as_user_id: "${btm_id}"
            - call: "POST /marketplace/orders/${otm_id}/decline"
              payload: {}
              as: Talent
              as_user_id: "${ttm_id}"
          trigger:
            - call: "POST /marketplace/orders/${otm_id}/confirm"
              payload: {}
              as: Buyer
              as_user_id: "${btm_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Buyer.${btm_id}.wallet_credit_cents == 10000 from the decline refund"
      - name: video_double_moderation_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Video"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Moderating a video already CLEARED must fail 409 — terminal lockdown on the Video machine."
        test_recipe:
          setup: ["order DELIVERED with its video already CLEARED"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Vid Star", legal_name: "Vid Legal", email: "vd@x.com", identity_document_ref: "dvd" }
              as: Talent
              captures: { tvd_id: $.data.id, tvd_ver: $.data.version }
            - call: "POST /marketplace/talents/${tvd_id}/identity/submit"
              payload: { identity_document_ref: "dvd" }
              as: Talent
              as_user_id: "${tvd_id}"
            - call: "POST /marketplace/talents/${tvd_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9005" }
              as: Talent
              as_user_id: "${tvd_id}"
              captures: { tdvd_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdvd_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${tvd_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${tvd_ver}" }
              as: Talent
              as_user_id: "${tvd_id}"
            - call: "POST /marketplace/admin/talents/${tvd_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "bvd@x.com", display_name: "Buyer VD", is_business_account: false }
              as: Buyer
              captures: { bvd_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${tvd_id}", buyer_id: "${bvd_id}", use_type: "PERSONAL", occasion: "v", script_instructions: "v", recipient_name: "V" }
              as: Buyer
              as_user_id: "${bvd_id}"
              captures: { ovd_id: $.data.id, ovd_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${ovd_id}/screening-attest"
              payload: { screening_token: "${ovd_tok}" }
              as: Buyer
              as_user_id: "${bvd_id}"
            - call: "POST /marketplace/orders/${ovd_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${tvd_id}"
            - call: "POST /marketplace/orders/${ovd_id}/videos"
              payload: { content_url: "https://cdn.x/vd.mp4", duration_seconds: 30 }
              as: Talent
              as_user_id: "${tvd_id}"
              captures: { vvd_id: $.data.id }
            - call: "POST /marketplace/admin/videos/${vvd_id}/moderate"
              payload: { decision: "CLEAR" }
              as: Moderator
          trigger:
            - call: "POST /marketplace/admin/videos/${vvd_id}/moderate"
              payload: { decision: "FLAG", flagged_reason: "late flag" }
              as: Moderator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
      - name: moderation_flag_forks_delivered_order_to_rerecord
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Video.PENDING_REVIEW_to_FLAGGED"
        distinguishing_aspect: "FLAG on the video of a DELIVERED order moves the order to RE_RECORD_REQUESTED, creates an OPEN ReRecordRequest whose notes equal flagged_reason, and increments re_record_count."
        test_recipe:
          setup: ["order DELIVERED, video PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Flag Star", legal_name: "Flag Legal", email: "fl@x.com", identity_document_ref: "dfl" }
              as: Talent
              captures: { tfl_id: $.data.id, tfl_ver: $.data.version }
            - call: "POST /marketplace/talents/${tfl_id}/identity/submit"
              payload: { identity_document_ref: "dfl" }
              as: Talent
              as_user_id: "${tfl_id}"
            - call: "POST /marketplace/talents/${tfl_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "9006" }
              as: Talent
              as_user_id: "${tfl_id}"
              captures: { tdfl_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${tdfl_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${tfl_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${tfl_ver}" }
              as: Talent
              as_user_id: "${tfl_id}"
            - call: "POST /marketplace/admin/talents/${tfl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "bfl@x.com", display_name: "Buyer FL", is_business_account: false }
              as: Buyer
              captures: { bfl_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${tfl_id}", buyer_id: "${bfl_id}", use_type: "PERSONAL", occasion: "f", script_instructions: "f", recipient_name: "F" }
              as: Buyer
              as_user_id: "${bfl_id}"
              captures: { ofl_id: $.data.id, ofl_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${ofl_id}/screening-attest"
              payload: { screening_token: "${ofl_tok}" }
              as: Buyer
              as_user_id: "${bfl_id}"
            - call: "POST /marketplace/orders/${ofl_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${tfl_id}"
            - call: "POST /marketplace/orders/${ofl_id}/videos"
              payload: { content_url: "https://cdn.x/fl.mp4", duration_seconds: 30 }
              as: Talent
              as_user_id: "${tfl_id}"
              captures: { vfl_id: $.data.id }
          trigger:
            - call: "POST /marketplace/admin/videos/${vfl_id}/moderate"
              payload: { decision: "FLAG", flagged_reason: "off-brand remark" }
              as: PlatformAdmin
          assert:
            - "Video.${vfl_id}.moderation_status == FLAGGED and flagged_reason == 'off-brand remark'"
            - "Order.${ofl_id}.status == RE_RECORD_REQUESTED and re_record_count == 1"
            - "GET /marketplace/orders/${ofl_id}/re-record-requests returns one OPEN request with notes == 'off-brand remark'"
      - name: initial_state_of_new_entities
        claim_type: initial_state
        grounds:
          - "state_machines.Order"
          - "state_machines.Talent"
          - "state_machines.Dispute"
        distinguishing_aspect: "New Order starts SCREENING; new Talent starts PENDING_VERIFICATION; new TaxDocument starts SUBMITTED; new Dispute starts OPEN."
        test_recipe:
          setup: ["registered talent (unverified)"]
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Init Star", legal_name: "Init Legal", email: "in@x.com", identity_document_ref: "din" }
              as: Talent
              captures: { tin_id: $.data.id, tin_status: $.data.status }
            - call: "POST /marketplace/talents/${tin_id}/tax-documents"
              payload: { doc_type: "W8BEN", tax_id_last4: "9007" }
              as: Talent
              as_user_id: "${tin_id}"
              captures: { tdin_status: $.data.status }
          trigger:
            - call: "GET /marketplace/talents/${tin_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Talent.${tin_id}.status == PENDING_VERIFICATION at creation"
            - "new TaxDocument status == SUBMITTED at creation"

  - section: calculations
    instances:
      - name: commission_uses_tier_at_confirm_not_delivery
        grounds:
          - "calculations.payout_computation"
        excluded_because:
          difficulty_instance: provisional_vs_final_commission_on_order
          rationale: "Variant selection and divergence asserted there."
      - name: licensing_fee_constants_applied
        grounds:
          - "calculations.licensing_fee"
        excluded_because:
          difficulty_instance: licensing_fee_tiered_marginal_discount
          rationale: "Fee constants (base 150000, channel factors, territory multiplier, 90-day tier) asserted with a computed literal there."
      - name: partial_split_rounding
        grounds:
          - "calculations.dispute_refund_split"
        excluded_because:
          difficulty_instance: commission_round_half_up_and_partial_split
          rationale: "round_half_up on odd gross asserted with literals there."
      - name: payout_sweep_skips_below_minimum_and_orders_by_created_at
        claim_type: input_set_filtering
        grounds:
          - "calculations.payout_sweep"
          - "entities.Payout.fields.total_cents"
        distinguishing_aspect: "A talent whose UNSETTLED lines total 1500 cents (< 2500 minimum) gets NO payout in the sweep while another talent at exactly 2500 gets one; sweep output is ordered by talent.created_at ASC."
        test_recipe:
          setup:
            - "talent A with one confirmed order gross 6000 (net 4500) -> qualifies"
            - "talent B with one confirmed order gross 2000 (net 1500) -> below minimum"
            - "wait: A net 4500 >= 2500 qualifies; B net 1500 < 2500 skipped"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Sweep A", legal_name: "Sweep A Legal", email: "swa@x.com", identity_document_ref: "dswa" }
              as: Talent
              captures: { tsa_id: $.data.id, tsa_ver: $.data.version }
