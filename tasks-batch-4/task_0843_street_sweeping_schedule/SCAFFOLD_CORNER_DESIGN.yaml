scaffold_corner_design:
  # ===================================================================
  - section: entities
    instances:
      - name: create_route_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Route", "endpoints.POST_/api/routes"]
        distinguishing_aspect: "POST /api/routes with required fields returns 201; status defaults to ACTIVE, completed_block_count to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/routes"
              payload: { name: "Elm Loop", zone_code: "Z2", sweep_weekday: "WED" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Route.${route_id}.status == ACTIVE"
            - "Route.${route_id}.completed_block_count == 0"
            - "Route.${route_id}.version == 1"

      - name: get_block_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Block", "errors[ERR_BLOCK_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/blocks/{id} with an unknown UUID returns ERR_BLOCK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/blocks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BLOCK_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_block_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Block", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/blocks without restriction_end_local is rejected ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A route exists."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "X", side: "BOTH", restriction_start_local: "08:00", linear_feet: 100 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: create_block_with_missing_route_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Block.route_id", "errors[ERR_ROUTE_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/blocks with an unknown route_id returns ERR_ROUTE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/blocks"
              payload: { route_id: "00000000-0000-0000-0000-000000000000", block_label: "X", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 100 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROUTE_NOT_FOUND"

      - name: citation_computed_amount_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds: ["entities.Citation.amount_due_cents", "calculations.citation_fine"]
        distinguishing_aspect: "amount_due_cents is server-computed; the create payload has no such field, so the provisional 6000 is applied regardless."
        test_recipe:
          setup: ["Block VERIFIED sign; clock in window; plate with no priors."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "CMP001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
          assert:
            - "Citation.${cit_id}.amount_due_cents == 6000"
            - "Citation.${cit_id}.status == ISSUED"

      - name: list_blocks_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Block", "endpoints.GET_/api/blocks"]
        distinguishing_aspect: "GET /api/blocks returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["One route, one block."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
          trigger:
            - call: "GET /api/blocks?route_id=${route_id}&limit=10&offset=0"
              payload: {}
              as: RouteDispatcher
          assert:
            - "response.response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

  # ===================================================================
  - section: state_machines
    instances:
      - name: verify_sign_from_unposted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Block.POSTED_to_VERIFIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify-sign on a block whose sign_status is UNPOSTED (never posted) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Route + block, sign never posted."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
          trigger:
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: void_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SweepEvent.SWEPT_to_VOIDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "void on a still-SCHEDULED (never completed) sweep fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Route + block + one SCHEDULED sweep."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/void"
              payload: {}
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: miss_creates_makeup_event
        claim_type: Side Effect Execution
        grounds: ["state_machines.SweepEvent.SCHEDULED_to_MISSED", "entities.SweepEvent.original_event_id", "entities.SweepEvent.is_makeup"]
        distinguishing_aspect: "miss transitions the event to MISSED and auto-creates a makeup event with is_makeup==true and original_event_id pointing back."
        test_recipe:
          setup: ["Route + block + one SCHEDULED sweep; clock at 2026-03-10."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/miss"
              payload: { reason: "breakdown" }
              as: RouteDispatcher
            - call: "GET /api/sweep-events?original_event_id=${ev_id}"
              payload: {}
              as: RouteDispatcher
          assert:
            - "SweepEvent.${ev_id}.status == MISSED"
            - "the list contains one SweepEvent with is_makeup == true and original_event_id == ${ev_id}"
            - "the makeup SweepEvent.scheduled_date == 2026-03-17"

      - name: terminal_paid_citation_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Citation", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Contesting an already-PAID citation (terminal) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PAID citation for plate PAY001."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "PAY001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/citations/${cit_id}/pay"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/citations/${cit_id}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: shift_close_sets_equipment_available
        claim_type: Side Effect Execution
        grounds: ["state_machines.Shift.IN_PROGRESS_to_CLOSED", "state_machines.Equipment.IN_SERVICE_to_AVAILABLE"]
        distinguishing_aspect: "Closing an IN_PROGRESS shift sets its equipment back to AVAILABLE."
        test_recipe:
          setup: ["Equipment + started shift."]
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-9", type: "MECHANICAL", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Zoe", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
          trigger:
            - call: "POST /api/shifts/${shift_id}/close"
              payload: {}
              as: RouteDispatcher
            - call: "GET /api/equipment/${eq_id}"
              payload: {}
              as: RouteDispatcher
          assert:
            - "Shift.${shift_id}.status == CLOSED"
            - "Equipment.${eq_id}.status == AVAILABLE"

  # ===================================================================
  - section: validations
    instances:
      - name: error_sweep_suspended_on_citation_issue
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_SWEEP_SUSPENDED]"]
        distinguishing_aspect: "Issuing a citation on a VERIFIED-sign block covered by an ACTIVE suspension (window OK) fails ERR_SWEEP_SUSPENDED (409); isolates the temporal rule from signage."
        test_recipe:
          setup: ["Block VERIFIED sign; ACTIVE ROUTE suspension over 2026-03-10; clock inside window."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /api/suspensions"
              payload: { reason: "LEAF_SEASON", scope: "ROUTE", route_id: "${route_id}", start_date: "2026-03-10", end_date: "2026-03-10" }
              as: PublicWorksAdmin
              captures: { sus_id: $.data.id }
            - call: "POST /api/suspensions/${sus_id}/activate"
              payload: {}
              as: PublicWorksAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "SUP001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SWEEP_SUSPENDED"
            - "HTTP status == 409"

      - name: suspension_scope_route_without_route_id_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=3]", "errors[ERR_SUSPENSION_SCOPE_INVALID]"]
        distinguishing_aspect: "Creating a ROUTE-scoped suspension without route_id fails ERR_SUSPENSION_SCOPE_INVALID (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/suspensions"
              payload: { reason: "HOLIDAY", scope: "ROUTE", start_date: "2026-03-10", end_date: "2026-03-11" }
              as: PublicWorksAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUSPENSION_SCOPE_INVALID"
            - "HTTP status == 422"

      - name: citation_window_start_boundary_included_succeeds
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=10]", "entities.Block.restriction_start_local"]
        distinguishing_aspect: "A scan at exactly 08:00:00 (window start) is INSIDE the half-open window and the citation is issued (201)."
        test_recipe:
          setup: ["Block VERIFIED sign, window 08:00-10:00; no suspension."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "STA001", scanned_at_utc: "2026-03-10T08:00:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Citation.${cit_id}.status == ISSUED"

      - name: sweep_event_adjacent_window_allowed
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=11]", "entities.SweepEvent.window_end_utc"]
        distinguishing_aspect: "A second sweep [10:00,12:00) on the same block adjacent to [08:00,10:00) is allowed (half-open, end==start touch) -> 201."
        test_recipe:
          setup: ["Block with one SCHEDULED sweep [08:00,10:00) on 2026-03-10."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "14:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T08:00:00Z", window_end_utc: "2026-03-10T10:00:00Z" }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T10:00:00Z", window_end_utc: "2026-03-10T12:00:00Z" }
              as: RouteDispatcher
              captures: { ev2: $.data.id }
          assert:
            - "HTTP status == 201"
            - "SweepEvent.${ev2}.status == SCHEDULED"

  # ===================================================================
  - section: rbac
    instances:
      - name: enforcement_officer_cannot_create_route
        claim_type: cannot_perform_exclusive
        grounds: ["roles.EnforcementOfficer", "roles.RouteDispatcher", "endpoints.POST_/api/routes"]
        distinguishing_aspect: "EnforcementOfficer calling POST /api/routes (a RouteDispatcher-exclusive op) fails ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: missing_role_header_returns_401
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role is rejected ERR_UNAUTHENTICATED (401) before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: resident_cannot_reopen_others_complaint
        claim_type: cannot_perform_exclusive
        grounds: ["roles.Resident", "state_machines.Complaint.RESOLVED_to_REOPENED", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A resident whose X-User-ID != complaint.resident_id cannot reopen it -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Two residents on a block; a resolved complaint owned by resident A."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/residents"
              payload: { email: "a@x.com", full_name: "A", home_block_id: "${block_id}" }
              as: RouteDispatcher
              captures: { res_a: $.data.id }
            - call: "POST /api/residents"
              payload: { email: "b@x.com", full_name: "B", home_block_id: "${block_id}" }
              as: RouteDispatcher
              captures: { res_b: $.data.id }
            - call: "POST /api/complaints"
              payload: { resident_id: "${res_a}", block_id: "${block_id}", category: "OTHER" }
              as: Resident
              as_user_id: "${res_a}"
              captures: { comp_id: $.data.id }
            - call: "POST /api/complaints/${comp_id}/resolve"
              payload: { resolution_note: "done" }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/complaints/${comp_id}/reopen"
              payload: {}
              as: Resident
              as_user_id: "${res_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

  # ===================================================================
  - section: state_machines
    instances:
      - name: adjudicate_by_issuing_officer_returns_sod_error
        claim_type: precondition_enforcement
        grounds: ["state_machines.Citation.CONTESTED_to_UPHELD", "validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Adjudicating with X-User-ID equal to issuing_officer_id fails ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["A CONTESTED citation issued by officer-1."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "SOD001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/citations/${cit_id}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/citations/${cit_id}/adjudicate"
              payload: { decision: "UPHOLD" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"

      - name: uphold_then_pay_final_amount
        claim_type: valid_transition
        grounds: ["state_machines.Citation.CONTESTED_to_UPHELD", "state_machines.Citation.UPHELD_to_PAID", "calculations.citation_fine"]
        distinguishing_aspect: "An UPHELD citation can still be paid; paid 0 days after uphold (issued 2026-03-10, paid same day) -> final 6000 (no late fee, no priors)."
        test_recipe:
          setup: ["A citation issued 2026-03-10 by officer-1, contested, upheld by officer-2."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "UPH001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/citations/${cit_id}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
            - call: "POST /api/citations/${cit_id}/adjudicate"
              payload: { decision: "UPHOLD" }
              as: EnforcementOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /api/citations/${cit_id}/pay"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-2"
          assert:
            - "Citation.${cit_id}.status == PAID"
            - "Citation.${cit_id}.paid_amount_cents == 6000"
            - "Citation.${cit_id}.days_late == 0"

  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_block_version_on_repost
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sign-repost-stale-block]", "errors[ERR_STALE_BLOCK_VERSION]"]
        distinguishing_aspect: "A second post-sign carrying the pre-first-post block version (stale) is rejected ERR_STALE_BLOCK_VERSION (412); version advanced by the first post."
        test_recipe:
          setup: ["A block created (version 1); one post-sign already applied (version -> 2)."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v0: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v0}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
          trigger:
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v0}", sign_expires_at: "2026-11-30T00:00:00Z" }
              as: SignageInspector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_BLOCK_VERSION"
            - "HTTP status == 412"

      - name: occ_correct_block_version_repost_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sign-repost-stale-block]", "entities.Block.version"]
        distinguishing_aspect: "Re-posting with the current (post-first) block version succeeds and bumps version again."
        test_recipe:
          setup: ["A block with one post-sign applied; the caller re-reads the current version."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v0: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v0}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
              captures: { block_v1: $.data.version }
          trigger:
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v1}", sign_expires_at: "2026-11-30T00:00:00Z" }
              as: SignageInspector
              captures: { block_v2: $.data.version }
          assert:
            - "HTTP status == 200"
            - "Block.${block_id}.version == 3"
            - "Block.${block_id}.sign_status == POSTED"

      - name: notify_counts_optin_residents_on_block
        claim_type: derived_field_reconciliation
        grounds: ["endpoints.POST_/api/sweep-events/{id}/notify", "entities.SweepEvent.notified_resident_count", "entities.Resident.notify_opt_in"]
        distinguishing_aspect: "notify sets notified_resident_count to the number of opted-in residents on the event's block (1 opted-in of 2 residents)."
        test_recipe:
          setup: ["Block with two residents (one opted-in, one opted-out); a scheduled sweep."]
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/residents"
              payload: { email: "in@x.com", full_name: "In", home_block_id: "${block_id}", notify_opt_in: true }
              as: RouteDispatcher
            - call: "POST /api/residents"
              payload: { email: "out@x.com", full_name: "Out", home_block_id: "${block_id}", notify_opt_in: false }
              as: RouteDispatcher
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/notify"
              payload: { channel: "EMAIL" }
              as: RouteDispatcher
          assert:
            - "SweepEvent.${ev_id}.notified_resident_count == 1"

