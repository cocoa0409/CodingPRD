      - name: corner_threshold_algorithm_boundary_on_the_gold_stability_bar
        claim_type: threshold
        excluded_because:
          difficulty_instance: gold_crash_free_threshold_at_99_49_versus_exactly_99_50
          rationale: "That §1.8 boundary_precision_check instance already tests threshold-epsilon, threshold-exact and the surrounding pass/fail flip on the GOLD crash-free bar, which is the threshold-algorithm boundary claim in full."

      - name: corner_tiered_pricing_boundaries_of_the_holdback_ladder
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: holdback_tier_selected_after_overrun_deduction_pinned_step_order
          rationale: "That §1.8 combinatorial_formula (mode c) instance walks the holdback tier boundaries with the tier selected from the post-overrun gross, so it covers tier-boundary selection and marginal-versus-average rate confusion."

      - name: corner_waterfall_allocation_fills_recoupment_before_royalty
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: royalty_statement_with_empty_revenue_lines_and_uncapped_cost_claim
          rationale: "That §1.8 boundary_precision_check instance exercises the degenerate ends of the waterfall (empty revenue lines, a cost claim above the cap, a zero royalty base), and the paired dual-variant instance covers the ordinary fill order, so a separate waterfall corner would duplicate both."

      - name: corner_interval_merge_adjacency_rules
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: reviewer_window_half_open_overlap_blocks_but_adjacency_is_legal
          rationale: "The two §1.8 resource_temporal_overlap instances cover both interval flavours: half-open reviewer windows where adjacency is legal, and closed vendor-cooldown intervals where adjacency is illegal until end_date + 4."

      - name: corner_dual_variant_divergence_of_the_royalty_settlement
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: royalty_provisional_period_basis_vs_final_life_to_date_basis
          rationale: "That §1.8 dual_variant_calc instance feeds identical revenue data through PROVISIONAL and FINAL and asserts both results plus the one-cent delta they differ by, which is the divergence claim."

      - name: corner_dual_variant_selection_of_the_contractor_budget_basis
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: contractor_budget_committed_basis_vs_incurred_basis
          rationale: "That §1.8 dual_variant_calc instance shows the COMMITTED basis chosen at engagement admission and the INCURRED basis chosen at payment authorization from the same fixture, which is the variant-selection claim."

      - name: corner_dual_variant_reconciliation_into_the_agreement_ledger
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: royalty_provisional_period_basis_vs_final_life_to_date_basis
          rationale: "The same instance asserts the ledger writes at the PROVISIONAL -> FINAL switch (advance_recouped_cents, unrecouped_advance_cents, recoupment_state and royalties_paid_to_date_cents), which is exactly the reconciliation claim; the provisional figure is kept unchanged for comparison."

