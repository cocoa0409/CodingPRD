        grounds:
          - state_machines.RepairOrder
          - entities.RepairCrew.fields.open_order_count
        distinguishing_aspect: |
          Conserved quantity: RepairCrew.open_order_count. Forward action
          (dispatch RepairOrder) increments count by 1. Compensating action
          (cancel RepairOrder) decrements count by 1. Invariant: after a
          dispatch-then-cancel sequence, crew.open_order_count returns to the
          pre-dispatch value. Drift = failed compensation.
