# =============================================================================
# Task 1201: Tank Cleaning & Terminal Services — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 difficulty rules x >=2 instances (19 total).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: sludge_estimate_provisional_vs_final_basis
        grounds:
          - calculations.sludge_mass_estimate
          - entities.CleaningJob.fields.sludge_estimate_provisional_kg
          - entities.CleaningJob.fields.expected_solids_kg
          - state_machines.CleaningJob.TANK_OOS_to_HEEL_REMOVED
        distinguishing_aspect: |
          Two valid volume sources for the same job produce different solids kg:
          PROVISIONAL uses the sounding tape (2000 L -> 2540 kg), FINAL_BASIS uses
          the pump-out meter (2100 L -> 2542 kg); both values persist side by side
          on the same CleaningJob and the mass-balance gate uses only FINAL_BASIS.
        test_recipe:
          setup:
            - "terminal T1 (tolerance 2.0), products GAS89 (GASOLINE/LOW/GAS) and DSL10 (DISTILLATE/MEDIUM/DIST), tank 5000 m3 in GAS89 service, contractor QUALIFIED, job created with sounding 2000 L and lines_included=true"
            - "job scheduled against an ACTIVE window, tank taken out of service"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000, safety_score_threshold: 85.0, score_variant: "ROLLING_12MO", mass_balance_tolerance_pct: 2.0 }
              as: TerminalAdmin
              captures: { d1_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { d1_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { d1_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${d1_term}", tank_number: "T-101", capacity_m3: 5000, current_product_id: "${d1_gas}" }
              as: TerminalAdmin
              captures: { d1_tank: $.data.id, d1_tank_v: $.data.version }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { d1_ctr: $.data.id }
            - { call: "POST /ops/contractors/${d1_ctr}/qualify", payload: { terminal_id: "${d1_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${d1_term}", tank_id: "${d1_tank}", contractor_id: "${d1_ctr}", from_product_id: "${d1_gas}", to_product_id: "${d1_dist}", heel_volume_liters_sounding: 2000, base_service_fee_cents: 500000, lines_included: true }
              as: TerminalOperator
              captures: { d1_job: $.data.id, d1_prov: $.data.sludge_estimate_provisional_kg }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${d1_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${d1_tank_v}" }
              as: TerminalOperator
              captures: { d1_win: $.data.id }
            - { call: "POST /ops/cleaning-jobs/${d1_job}/schedule", payload: { window_id: "${d1_win}" }, as: TerminalOperator }
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T06:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ops/service-windows/${d1_win}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /ops/cleaning-jobs/${d1_job}/take-out-of-service", payload: {}, as: TerminalOperator }
          trigger:
            - call: "POST /ops/cleaning-jobs/${d1_job}/record-heel-removal"
              payload: { metered_liters: 2100 }
              as: ContractorSupervisor
              as_user_id: "${d1_ctr}"
              captures: { d1_exp: $.data.expected_solids_kg, d1_prov_after: $.data.sludge_estimate_provisional_kg }
          assert:
            - "CleaningJob.${d1_job}.sludge_estimate_provisional_kg == 2540 (2000 * 0.02 + 5000 * 0.5, round_half_up)"
            - "CleaningJob.${d1_job}.expected_solids_kg == 2542 (2100 * 0.02 + 5000 * 0.5, round_half_up)"
            - "d1_prov != d1_exp: identical tank/product constants, only the volume source differs"
            - "CleaningJob.${d1_job}.status == HEEL_REMOVED"
      - name: contractor_score_rolling_vs_lifetime
        grounds:
          - calculations.contractor_safety_score
          - entities.Contractor.fields.safety_score
          - entities.Terminal.fields.score_variant
        distinguishing_aspect: |
          Identical SafetyEvent history yields 97.00 under ROLLING_12MO (old
          INCIDENT excluded) and 87.00 under LIFETIME; with threshold 90 the same
          contractor qualifies at one terminal and is rejected at the other.
        test_recipe:
          setup:
            - "clock at 2026-05-01T00:00:00Z; terminal ROLLING (threshold 90) and terminal LIFE (threshold 90, LIFETIME)"
            - "contractor with VIOLATION w=3 on 2026-04-25 (inside window) and INCIDENT w=5 on 2025-03-15 (outside: now-365d = 2025-05-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "ROLLING", wastewater_daily_capacity_liters: 100000, safety_score_threshold: 90.0, score_variant: "ROLLING_12MO" }
              as: TerminalAdmin
              captures: { d2_term_r: $.data.id }
            - call: "POST /ops/terminals"
              payload: { name: "LIFE", wastewater_daily_capacity_liters: 100000, safety_score_threshold: 90.0, score_variant: "LIFETIME" }
              as: TerminalAdmin
              captures: { d2_term_l: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "ScoreCo" }
              as: TerminalAdmin
              captures: { d2_ctr: $.data.id }
            - { call: "POST /ops/safety-events", payload: { contractor_id: "${d2_ctr}", kind: "VIOLATION", severity_weight: 3, occurred_at: "2026-04-25T00:00:00Z" }, as: EHSOfficer, as_user_id: "ehs-1" }
            - { call: "POST /ops/safety-events", payload: { contractor_id: "${d2_ctr}", kind: "INCIDENT", severity_weight: 5, occurred_at: "2025-03-15T00:00:00Z" }, as: EHSOfficer, as_user_id: "ehs-1" }
          trigger:
            - call: "POST /ops/contractors/${d2_ctr}/qualify"
              payload: { terminal_id: "${d2_term_r}" }
              as: TerminalAdmin
              captures: { d2_score_rolling: $.data.safety_score }
            - call: "POST /ops/contractors/${d2_ctr}/qualify"
              payload: { terminal_id: "${d2_term_l}" }
              as: TerminalAdmin
              captures: { d2_err: $.data.error_id }
          assert:
            - "first trigger succeeds: Contractor.${d2_ctr}.status == QUALIFIED and d2_score_rolling == 97.00"
            - "second trigger rejected: d2_err == ERR_CONTRACTOR_NOT_QUALIFIED (LIFETIME score 87.00 < 90.0)"
            - "same two SafetyEvents produce both scores — only the terminal's score_variant differs"
# ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: flush_volume_nested_min_max_tiers
        grounds:
          - calculations.flush_volume_liters
          - calculations.changeover_compatibility
          - entities.CleaningJob.fields.flush_volume_liters
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — tiered
          viscosity factor x compatibility-class multiplier, conditional lines
          allowance, then nested min/max clamping. Three jobs prove three
          branches: unclamped REQUIRES_FLUSH (105000), MAX-capped (200000),
          COMPATIBLE_DIRECT 0.5x branch without lines (50000).
        test_recipe:
          setup:
            - "terminal, four products (GAS89 GASOLINE/LOW/GAS, DSL10 DISTILLATE/MEDIUM/DIST, CRD01 CRUDE/HIGH/CRUDE, GAS92 GASOLINE/LOW/GAS), one tank 5000 m3, contractor (unused), three DRAFT jobs on the tank"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { f1_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { f1_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { f1_dist: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "CRD01", family: "CRUDE", viscosity_class: "HIGH", compatibility_group: "CRUDE", flash_point_c: 20 }
              as: TerminalAdmin
              captures: { f1_crude: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS92", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -38 }
              as: TerminalAdmin
              captures: { f1_gas2: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${f1_term}", tank_number: "T-201", capacity_m3: 5000, current_product_id: "${f1_gas}" }
              as: TerminalAdmin
              captures: { f1_tank: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { f1_ctr: $.data.id }
          trigger:
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${f1_term}", tank_id: "${f1_tank}", contractor_id: "${f1_ctr}", from_product_id: "${f1_gas}", to_product_id: "${f1_dist}", heel_volume_liters_sounding: 1000, base_service_fee_cents: 100000, lines_included: true }
              as: TerminalOperator
              captures: { f1_j1_flush: $.data.flush_volume_liters, f1_j1_class: $.data.changeover_class }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${f1_term}", tank_id: "${f1_tank}", contractor_id: "${f1_ctr}", from_product_id: "${f1_crude}", to_product_id: "${f1_dist}", heel_volume_liters_sounding: 1000, base_service_fee_cents: 100000, lines_included: true }
              as: TerminalOperator
              captures: { f1_j2_flush: $.data.flush_volume_liters, f1_j2_class: $.data.changeover_class }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${f1_term}", tank_id: "${f1_tank}", contractor_id: "${f1_ctr}", from_product_id: "${f1_gas}", to_product_id: "${f1_gas2}", heel_volume_liters_sounding: 1000, base_service_fee_cents: 100000, lines_included: false }
              as: TerminalOperator
              captures: { f1_j3_flush: $.data.flush_volume_liters, f1_j3_class: $.data.changeover_class }
          assert:
            - "f1_j1_class == REQUIRES_FLUSH and f1_j1_flush == 105000 (5000*1000*0.02*1.0 + 5000)"
            - "f1_j2_class == REQUIRES_FLUSH and f1_j2_flush == 200000 (raw 255000 capped by MAX_FLUSH_L)"
            - "f1_j3_class == COMPATIBLE_DIRECT and f1_j3_flush == 50000 (5000*1000*0.02*0.5, no lines allowance)"
      - name: waste_cost_per_line_rounding_pinned
        grounds:
          - calculations.waste_disposal_cost_cents
          - entities.WasteShipment.fields.disposal_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each line to whole
          cents half-up THEN sum. Chosen lines give per-line fractions 37.4 and
          41.4: per-line-then-sum = 78, sum-then-round = 79; the contract is 78.
        test_recipe:
          setup:
            - "terminal/products/tank/qualified contractor; DRAFT job; APPROVED NON_HAZARDOUS waste profile"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { f2_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { f2_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { f2_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${f2_term}", tank_number: "T-101", capacity_m3: 5000, current_product_id: "${f2_gas}" }
              as: TerminalAdmin
              captures: { f2_tank: $.data.id }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { f2_ctr: $.data.id }
            - { call: "POST /ops/contractors/${f2_ctr}/qualify", payload: { terminal_id: "${f2_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${f2_term}", tank_id: "${f2_tank}", contractor_id: "${f2_ctr}", from_product_id: "${f2_gas}", to_product_id: "${f2_dist}", heel_volume_liters_sounding: 2000, base_service_fee_cents: 500000 }
              as: TerminalOperator
              captures: { f2_job: $.data.id }
            - call: "POST /ops/waste-profiles"
              payload: { job_id: "${f2_job}", waste_code: "K051", hazard_class: "NON_HAZARDOUS", lab_flash_point_c: 70, lab_tph_mg_l: 120 }
              as: ContractorSupervisor
              as_user_id: "${f2_ctr}"
              captures: { f2_prof: $.data.id }
            - { call: "POST /ops/waste-profiles/${f2_prof}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${f2_ctr}" }
            - { call: "POST /ops/waste-profiles/${f2_prof}/approve", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
          trigger:
            - call: "POST /ops/waste-shipments"
              payload: { job_id: "${f2_job}", profile_id: "${f2_prof}", lines: [{ material: "SLUDGE", kg: 17, rate_cents_per_kg: 2.2 }, { material: "WASH_WATER", kg: 23, rate_cents_per_kg: 1.8 }] }
              as: ContractorSupervisor
              as_user_id: "${f2_ctr}"
              captures: { f2_cost: $.data.disposal_cost_cents, f2_kg: $.data.manifested_kg }
          assert:
            - "WasteShipment.disposal_cost_cents == 78 (round_half_up(17*2.2*1.0)=37 + round_half_up(23*1.8*1.0)=41)"
            - "disposal_cost_cents != 79 (the sum-then-round alternative 78.8 -> 79 is NOT the contract)"
            - "WasteShipment.manifested_kg == 40"
      - name: job_invoice_circular_tier_pinned
        grounds:
          - calculations.job_invoice_total_cents
          - entities.CleaningJob.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to an explicit evaluation
          order — the discount tier is keyed on the PRE-discount total which
          itself includes waste and flush charges; discount then applies only to
          the base fee. pre_total 715056 -> tier 5% -> invoice 690056.
        test_recipe:
          setup:
            - "job fully executed to FLUSH_VERIFIED: metered heel 2100 L, one RECONCILED shipment (2542 kg, cost 5056), flush verified at 105000 L, base fee 500000"
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000, mass_balance_tolerance_pct: 2.0 }
              as: TerminalAdmin
              captures: { f3_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { f3_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { f3_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${f3_term}", tank_number: "T-101", capacity_m3: 5000, current_product_id: "${f3_gas}" }
              as: TerminalAdmin
              captures: { f3_tank: $.data.id, f3_tank_v: $.data.version }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { f3_ctr: $.data.id }
            - { call: "POST /ops/contractors/${f3_ctr}/qualify", payload: { terminal_id: "${f3_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${f3_term}", tank_id: "${f3_tank}", contractor_id: "${f3_ctr}", from_product_id: "${f3_gas}", to_product_id: "${f3_dist}", heel_volume_liters_sounding: 2000, base_service_fee_cents: 500000, lines_included: true }
              as: TerminalOperator
              captures: { f3_job: $.data.id }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${f3_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${f3_tank_v}" }
              as: TerminalOperator
              captures: { f3_win: $.data.id }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/schedule", payload: { window_id: "${f3_win}" }, as: TerminalOperator }
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T06:00:00Z" }, as: TerminalAdmin }
            - { call: "POST /ops/service-windows/${f3_win}/activate", payload: {}, as: TerminalOperator }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/take-out-of-service", payload: {}, as: TerminalOperator }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/record-heel-removal", payload: { metered_liters: 2100 }, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - call: "POST /ops/waste-profiles"
              payload: { job_id: "${f3_job}", waste_code: "K051", hazard_class: "NON_HAZARDOUS", lab_flash_point_c: 70, lab_tph_mg_l: 120 }
              as: ContractorSupervisor
              as_user_id: "${f3_ctr}"
              captures: { f3_prof: $.data.id }
            - { call: "POST /ops/waste-profiles/${f3_prof}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/waste-profiles/${f3_prof}/approve", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - call: "POST /ops/waste-shipments"
              payload: { job_id: "${f3_job}", profile_id: "${f3_prof}", lines: [{ material: "SLUDGE", kg: 1200, rate_cents_per_kg: 2.2 }, { material: "WASH_WATER", kg: 1342, rate_cents_per_kg: 1.8 }] }
              as: ContractorSupervisor
              as_user_id: "${f3_ctr}"
              captures: { f3_ship: $.data.id }
            - { call: "POST /ops/waste-shipments/${f3_ship}/dispatch", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/waste-shipments/${f3_ship}/deliver", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/waste-shipments/${f3_ship}/reconcile", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/record-sludge-removal", payload: { residual_sludge_kg: 0 }, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/request-gas-free", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - call: "POST /ops/gas-free-certificates"
              payload: { job_id: "${f3_job}", lel_pct: 5.0, o2_pct: 20.9, h2s_ppm: 2.0, benzene_ppm: 0.2 }
              as: MarineChemist
              as_user_id: "chemist-1"
              captures: { f3_cert: $.data.id }
            - call: "POST /ops/entry-permits"
              payload: { job_id: "${f3_job}", cert_id: "${f3_cert}", max_entrants: 4 }
              as: ContractorSupervisor
              as_user_id: "${f3_ctr}"
              captures: { f3_perm: $.data.id }
            - { call: "POST /ops/entry-permits/${f3_perm}/issue", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - { call: "POST /ops/entry-permits/${f3_perm}/activate", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/begin-entry", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/entry-permits/${f3_perm}/close", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/complete-entry", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - call: "POST /ops/inspectors"
              payload: { name: "InspA", certification_level: "API653" }
              as: TerminalAdmin
              captures: { f3_insp: $.data.id, f3_insp_v: $.data.version }
            - call: "POST /ops/inspections"
              payload: { job_id: "${f3_job}", inspector_id: "${f3_insp}", scheduled_start: "2026-05-03T00:00:00Z", scheduled_end: "2026-05-03T08:00:00Z", expected_inspector_version: "${f3_insp_v}" }
              as: TerminalOperator
              captures: { f3_ins: $.data.id }
            - { call: "POST /ops/inspections/${f3_ins}/start", payload: {}, as: API653Inspector, as_user_id: "${f3_insp}" }
            - { call: "POST /ops/inspections/${f3_ins}/report", payload: {}, as: API653Inspector, as_user_id: "${f3_insp}" }
            - { call: "POST /ops/inspections/${f3_ins}/accept", payload: {}, as: TerminalOperator, as_user_id: "op-1" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/begin-flush", payload: {}, as: ContractorSupervisor, as_user_id: "${f3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${f3_job}/verify-flush", payload: { actual_flush_liters: 105000 }, as: EHSOfficer, as_user_id: "ehs-1" }
          trigger:
            - call: "POST /ops/cleaning-jobs/${f3_job}/request-rts"
              payload: {}
              as: TerminalOperator
              captures: { f3_invoice: $.data.invoice_total_cents }
          assert:
            - "CleaningJob.${f3_job}.status == RTS_PENDING"
            - "waste == 5056 and flush_charge == 210000 so pre_total == 715056 (>= 500000 -> tier 5%)"
            - "invoice_total_cents == 690056 (715056 - round_half_up(500000*0.05))"
