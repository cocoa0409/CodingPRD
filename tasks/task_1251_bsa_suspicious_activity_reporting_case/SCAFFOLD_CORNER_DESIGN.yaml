  - section: validations
    instances:
      - name: sar_decision_missing_field_beats_state_error
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A sar-decision call that is BOTH malformed (missing decision) AND state-invalid (case only ASSIGNED) returns 400 ERR_INVALID_REQUEST — request validation (priority 1) precedes state (priority 6)."
        test_recipe:
          setup: ["Case assigned (ASSIGNED) to an1, never started"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { k1: $.data.id, k1_v: $.data.version } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
          trigger:
            - { call: "POST /cases/${k1}/sar-decision", payload: { decision_rationale: "Missing decision field", expected_case_version: "${k1_v}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 400 ERR_INVALID_REQUEST — not 409 ERR_INVALID_STATE, although the case is also in the wrong state (ASSIGNED)"

      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Authorization (priority 3) precedes existence (priority 5): a BSAAnalyst posting a transaction to a NON-EXISTENT account gets 403 ERR_FORBIDDEN_ROLE, never learning whether the id exists."
        test_recipe:
          setup: ["One analyst exists; the account id in the path does not exist"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transactions", payload: { amount_cents: 1000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-01T00:00:00Z", channel: "BRANCH" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 403 ERR_FORBIDDEN_ROLE — not 404 ERR_NOT_FOUND"

