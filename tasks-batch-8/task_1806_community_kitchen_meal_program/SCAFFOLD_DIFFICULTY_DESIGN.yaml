              payload: { result: "FAILED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${batch_id}/reject"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
          trigger:
