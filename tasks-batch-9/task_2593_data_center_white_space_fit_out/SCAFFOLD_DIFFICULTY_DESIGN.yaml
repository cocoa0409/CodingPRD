              as: CommissioningAgent
              captures: { pkg1_id: $.data.id }
            - call: "POST /commissioning-packages/${pkg1_id}/approve-script"
              payload: { script_revision: 1 }
              as: CommissioningAgent
              as_user_id: "u-ca-1"
            - call: "POST /commissioning-packages/${pkg1_id}/execute-script"
              payload: {}
              as: CommissioningAgent
              as_user_id: "u-ca-1"
            - call: "POST /commissioning-packages/${pkg1_id}/witness"
              payload: { decision: "REJECTED", witness_note: "Torque values not recorded on sheet 3." }
              as: WitnessAuthority
