# =============================================================================
# Example: academic-journal benchmark seed tables (v1)
# =============================================================================

scenario: |
  Academic journal peer-review system. Manages the full lifecycle of scholarly
  manuscript evaluation: journal creation, manuscript submission, review
  assignment creation, reviewer invitation, peer review management, conflict of
  interest tracking, and publication finalization. Considerations: role-based
  access, prestige budget ledger, desk-reject risk ledger, revision cycle
  penalties, reviewer concurrency limits, fast-track risk penalties, extra
  revision risk penalties, and compliance-floor enforcement.

domain_name: academic-journal
api_prefix: /journals

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Journal
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: journal_name, type: string, source: input, description: "Name of the journal" }
      - { name: total_prestige, type: number, source: input, description: "Total prestige budget allocated to this journal" }
      - { name: prestige_balance, type: number, source: computed, description: "Read-only derived field = total_prestige - provisional_costs - finalized_costs" }
      - { name: desk_reject_risk_score, type: number, source: computed, description: "Read-only derived risk score, starts at 0, increases with problematic patterns" }
      - { name: status, type: enum, source: system, description: "ACCEPTING_SUBMISSIONS → IN_REVIEW → PUBLICATION_PENDING → ARCHIVED" }

  - name: PrestigeBudgetLedger
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: provisional_costs, type: number, source: computed, description: "Sum of prestige costs for reviews currently in progress" }
      - { name: finalized_costs, type: number, source: computed, description: "Sum of prestige costs for completed and published reviews" }

  - name: DeskRejectRiskLedger
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: risk_score, type: number, source: computed, description: "Accumulating risk metric, starts at 0" }

  - name: Manuscript
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: title, type: string, source: input, description: "Manuscript title" }
      - { name: submission_date, type: integer, source: input, description: "Unix timestamp (seconds since epoch)" }
      - { name: is_fast_track_submission, type: boolean, source: input, default: false, description: "Whether this is a fast-track submission" }
      - { name: status, type: enum, source: system, description: "DRAFT → PENDING_REVIEW → IN_REVISION → ACCEPTED / REJECTED" }

  - name: ReviewAssignment
    parent: Manuscript
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: manuscript_id, type: string, source: system, description: "Associated manuscript ID" }
      - { name: required_expertise, type: string, source: input, description: "Domain knowledge required for review" }
      - { name: required_anonymity_level, type: enum, source: input, default: "DOUBLE_BLIND", description: "SINGLE_BLIND | DOUBLE_BLIND | OPEN_PEER_REVIEW" }
      - { name: due_date, type: integer, source: input, description: "Unix timestamp for review deadline" }
      - { name: revision_cycle, type: integer, source: computed, description: "Read-only, derived from total number of assignments for the manuscript" }
      - { name: status, type: enum, source: system, description: "PENDING_ASSIGNMENT → INVITED → ASSIGNED → CANCELLED" }

  - name: ReviewerProfile
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: full_name, type: string, source: input, description: "Reviewer's full name" }
      - { name: institution, type: string, source: input, description: "Reviewer's affiliated institution" }
      - { name: expertise_areas, type: array, source: input, description: "List of expertise area strings" }
      - { name: certifications, type: array, source: system, description: "List of certifications, each with id, name (PhD|MD|JD), granted_date" }

  - name: Review
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: assignment_id, type: string, source: input, description: "Associated review assignment ID" }
      - { name: reviewer_id, type: string, source: input, description: "Associated reviewer profile ID" }
      - { name: provisional_prestige_cost, type: number, source: computed, description: "Provisional cost debited from prestige balance" }
      - { name: final_prestige_cost, type: number, source: computed, description: "Final cost calculated at publication finalization" }
      - { name: in_extra_revision_cycle, type: boolean, source: computed, description: "Whether this review is part of an extra revision cycle" }
      - { name: status, type: enum, source: system, description: "INVITED → ACCEPTED → SUBMITTED → PUBLISHED / DECLINED / CANCELLED" }

  - name: ConflictOfInterest
    parent: Journal
    common_fields: true
    fields:
      - { name: journal_id, type: string, source: system, description: "Associated journal ID" }
      - { name: entity_1_id, type: string, source: input, description: "First entity in the conflict" }
      - { name: entity_2_id, type: string, source: input, description: "Second entity in the conflict" }
      - { name: conflict_type, type: enum, source: input, description: "INSTITUTIONAL | PRIOR_COLLABORATION" }
      - { name: reason, type: string, source: input, required: false, description: "Optional description of the conflict" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Journal
    initial_state: ACCEPTING_SUBMISSIONS
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACCEPTING_SUBMISSIONS
        to: IN_REVIEW
        trigger: POST /journals/{journalId}/begin-review
        actor: JournalEditor
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: PUBLICATION_PENDING
        trigger: POST /journals/{journalId}/initiate-publication
        actor: JournalEditor
        preconditions:
          - "No unresolved reviews (not in INVITED, ACCEPTED, or SUBMITTED state) — ERR_UNRESOLVED_REVIEWS_EXIST"
        side_effects: []

      - from: PUBLICATION_PENDING
        to: ARCHIVED
        trigger: POST /journals/{journalId}/finalize-publication
        actor: ManagingEditor
        preconditions:
          - "Journal must be in PUBLICATION_PENDING state (ERR_JOURNAL_NOT_PENDING_PUBLICATION)"
        side_effects:
          - "All SUBMITTED reviews → PUBLISHED"
          - "Calculate final_prestige_cost for each published review"
          - "Move final costs from provisional to finalized on PrestigeBudgetLedger"
          - "Journal prestige_balance finalized"

  - entity: Manuscript
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions:
          - "At least one review assignment must exist (ERR_NO_ASSIGNMENTS)"
        side_effects:
          - "Prestige cost deducted: 10 * base review invitation cost (10 prestige points)"

      - from: PENDING_REVIEW
        to: IN_REVISION
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions: []
        side_effects: []

      - from: IN_REVISION
        to: PENDING_REVIEW
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions: []
        side_effects: []

      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions: []
        side_effects: []

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions: []
        side_effects:
          - "All non-terminal reviews (INVITED, ACCEPTED, SUBMITTED) → CANCELLED"
          - "Restore provisional prestige costs for cancelled reviews"
          - "Reverse risk penalties from cancelled reviews"
          - "If is_fast_track_submission, reverse the 5-point risk penalty"

      - from: DRAFT
        to: REJECTED
        trigger: PUT /journals/{journalId}/manuscripts/{manuscriptId}
        actor: JournalEditor
        preconditions: []
        side_effects:
          - "Desk rejection — direct reject from DRAFT"
          - "If is_fast_track_submission, reverse the 5-point risk penalty"

  - entity: ReviewAssignment
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ASSIGNMENT
        to: INVITED
        trigger: "system (automatic when a review invitation is created)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVITED
        to: ASSIGNED
        trigger: "system (automatic when the review is accepted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVITED
        to: PENDING_ASSIGNMENT
        trigger: "system (automatic when the review is declined or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: PENDING_ASSIGNMENT
        trigger: "system (automatic when the review is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_ASSIGNMENT
        to: CANCELLED
        trigger: POST .../review-assignments/{assignmentId}/cancel
        actor: SectionEditor
        preconditions:
          - "Assignment must be in PENDING_ASSIGNMENT state (ERR_ASSIGNMENT_NOT_PENDING_FOR_CANCEL)"
        side_effects: []

  - entity: Review
    initial_state: INVITED
    terminal_states: [PUBLISHED, DECLINED, CANCELLED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/accept
        actor: JournalEditor
        preconditions:
          - "Review must be in INVITED state (ERR_REVIEW_LIFECYCLE_STATE_INVALID)"
        side_effects:
          - "Assignment status → ASSIGNED"

      - from: INVITED
        to: DECLINED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/decline
        actor: JournalEditor
        preconditions:
          - "Review must be in INVITED state (ERR_REVIEW_LIFECYCLE_STATE_INVALID)"
        side_effects:
          - "Assignment reverts to PENDING_ASSIGNMENT"
          - "Restore provisional prestige cost"
          - "Reverse risk penalties if in extra revision cycle"

      - from: ACCEPTED
        to: SUBMITTED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/submit
        actor: JournalEditor
        preconditions:
          - "Review must be in ACCEPTED state (ERR_REVIEW_LIFECYCLE_STATE_INVALID)"
        side_effects: []

      - from: INVITED
        to: CANCELLED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/cancel
        actor: JournalEditor
        preconditions: []
        side_effects:
          - "Assignment reverts to PENDING_ASSIGNMENT"
          - "Restore provisional prestige cost"
          - "Reverse risk penalties if in extra revision cycle"

      - from: ACCEPTED
        to: CANCELLED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/cancel
        actor: JournalEditor
        preconditions: []
        side_effects:
          - "Assignment reverts to PENDING_ASSIGNMENT"
          - "Restore provisional prestige cost"
          - "Reverse risk penalties if in extra revision cycle"

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /journals/{journalId}/reviews/{reviewId}/cancel
        actor: JournalEditor
        preconditions: []
        side_effects:
          - "Assignment reverts to PENDING_ASSIGNMENT"
          - "Restore provisional prestige cost"
          - "Reverse risk penalties if in extra revision cycle"

      - from: SUBMITTED
        to: PUBLISHED
        trigger: "system (automatic during finalize-publication)"
        actor: system
        preconditions: []
        side_effects:
          - "Calculate final_prestige_cost"
          - "Move cost from provisional to finalized"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: revision_cycle
    trigger: "review assignment creation"
    algorithm: count
    formula: |
      revision_cycle = total number of review assignments created for the manuscript
      (auto-increments as each assignment is created)

  - name: in_extra_revision_cycle
    trigger: "review invitation creation"
    algorithm: threshold
    formula: |
      Standard revision quota = 3 assignments per manuscript.
      If the assignment's revision_cycle > 3:
        in_extra_revision_cycle = true
      else:
        in_extra_revision_cycle = false
    constants:
      STANDARD_REVISION_QUOTA: 3

  - name: provisional_prestige_cost
    trigger: "review invitation creation"
    algorithm: cost_calculation
    formula: |
      base_cost = 1 (prestige point for issuing an invitation)
      if in_extra_revision_cycle:
        provisional_prestige_cost = base_cost * REVISION_PENALTY_MULTIPLIER
      else:
        provisional_prestige_cost = base_cost
    constants:
      BASE_COST: 1
      REVISION_PENALTY_MULTIPLIER: 1.5

  - name: final_prestige_cost
    trigger: "journal finalization (finalize-publication)"
    algorithm: cost_calculation
    formula: |
      Same formula as provisional_prestige_cost.
      May differ if circumstances changed during the review process.

  - name: prestige_balance
    trigger: "review create, decline, cancel, manuscript transition to PENDING_REVIEW, finalize-publication"
    algorithm: aggregation
    formula: |
      prestige_balance = total_prestige - provisional_costs - finalized_costs
      Create review: provisional_costs += provisional_prestige_cost
      Decline/Cancel review: provisional_costs -= provisional_prestige_cost
      Manuscript → PENDING_REVIEW: provisional_costs += 10 (submission prestige cost = 10 * base_cost)
      Finalize publication: provisional_costs → finalized_costs for SUBMITTED reviews
    constants:
      SUBMISSION_PRESTIGE_COST: 10  # 10 * base review cost of 1

  - name: desk_reject_risk_score
    trigger: "manuscript creation (fast-track), review invitation (extra revision), decline/cancel, manuscript rejection"
    algorithm: aggregation
    formula: |
      Fast-track submission: risk_score += 5
      Extra revision review invitation: risk_score += 20
      Review decline/cancel (extra revision): risk_score -= 20
      Manuscript rejection (fast-track): risk_score -= 5
    constants:
      FAST_TRACK_PENALTY: 5
      EXTRA_REVISION_PENALTY: 20
      RISK_THRESHOLD: 100  # submission lock threshold

  - name: reviewer_concurrency_check
    trigger: "review invitation"
    algorithm: count
    formula: |
      Count reviewer's active reviews (INVITED or ACCEPTED status).
      If count >= MAX_CONCURRENT_REVIEWS:
        reject with ERR_REVIEWER_OVERLOADED
    constants:
      MAX_CONCURRENT_REVIEWS: 5

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Journal must be in the correct lifecycle state for the operation"
    error_id: "ERR_JOURNAL_NOT_ACCEPTING_SUBMISSIONS / ERR_JOURNAL_NOT_IN_REVIEW / ERR_JOURNAL_LIFECYCLE_STATE_INVALID / ERR_JOURNAL_NOT_PENDING_PUBLICATION"
    http_status: 409
    applies_to: "Journal lifecycle transitions, manuscript creation, assignment creation, review invitation"

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for the operation"
    error_id: "ERR_ASSIGNMENT_NOT_PENDING / ERR_REVIEW_LIFECYCLE_STATE_INVALID / ERR_MANUSCRIPT_LIFECYCLE_STATE_INVALID"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_integrity
    check: "Reviewer expertise must match assignment required_expertise"
    error_id: ERR_EXPERTISE_MISMATCH
    http_status: 400
    applies_to: "POST /reviews (invitation)"

  - priority: 7
    category: business_integrity
    check: "Reviewer must not exceed concurrent review limit (5 active reviews)"
    error_id: ERR_REVIEWER_OVERLOADED
    http_status: 409
    applies_to: "POST /reviews (invitation)"

  - priority: 8
    category: business_integrity
    check: "No conflict of interest (INSTITUTIONAL or PRIOR_COLLABORATION) between reviewer and assignment"
    error_id: "ERR_INSTITUTIONAL_CONFLICT / ERR_PRIOR_COLLABORATION"
    http_status: 409
    applies_to: "POST /reviews (invitation)"

  - priority: 9
    category: business_risk
    check: "For extra revision cycle invitations: projected risk score must not breach threshold (100 points)"
    error_id: ERR_RISK_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /reviews (invitation)"

  - priority: 10
    category: business_fiscal
    check: "Provisional prestige cost must not exceed available prestige balance"
    error_id: ERR_INSUFFICIENT_PRESTIGE
    http_status: 402
    applies_to: "POST /reviews (invitation)"

  - priority: 11
    category: business_risk
    check: "Journal risk score must not have reached submission lock threshold (100) for manuscript submission"
    error_id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 403
    applies_to: "POST /manuscripts"

  - priority: 12
    category: business_integrity
    check: "entity_1_id must not equal entity_2_id for conflict of interest"
    error_id: ERR_SELF_CONFLICT
    http_status: 400
    applies_to: "POST /conflicts-of-interest"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Journal ---
  - method: POST
    path: "/journals"
    description: "Create a new Journal"
    roles: [JournalEditor]
    code: 201
    input: [journal_name, total_prestige]
    output: Journal
    side_effects:
      - "status = ACCEPTING_SUBMISSIONS"
      - "prestige_balance initialized to total_prestige"
      - "desk_reject_risk_score initialized to 0"
      - "PrestigeBudgetLedger initialized (provisional_costs=0, finalized_costs=0)"
      - "DeskRejectRiskLedger initialized (risk_score=0)"

  - method: GET
    path: "/journals"
    description: "List all Journals"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Journal[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}"
    description: "Get a specific Journal"
    roles: [Any]
    code: 200
    input: []
    output: Journal
    side_effects: []

  - method: POST
    path: "/journals/{journalId}/begin-review"
    description: "Move journal to IN_REVIEW state"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Journal
    side_effects: ["status → IN_REVIEW"]

  - method: POST
    path: "/journals/{journalId}/initiate-publication"
    description: "Move journal to PUBLICATION_PENDING state"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Journal
    side_effects:
      - "status → PUBLICATION_PENDING"
      - "Precondition: no unresolved reviews (ERR_UNRESOLVED_REVIEWS_EXIST)"

  - method: POST
    path: "/journals/{journalId}/finalize-publication"
    description: "Finalize prestige costs, publish reviews, archive journal"
    roles: [ManagingEditor]
    code: 200
    input: []
    output: Journal
    side_effects:
      - "status → ARCHIVED"
      - "All SUBMITTED reviews → PUBLISHED with final_prestige_cost calculated"
      - "Provisional costs moved to finalized costs"
      - "prestige_balance finalized"

  # --- Manuscript ---
  - method: POST
    path: "/journals/{journalId}/manuscripts"
    description: "Create a new Manuscript"
    roles: [SectionEditor]
    code: 201
    input: ["title, submission_date, is_fast_track_submission?"]
    output: Manuscript
    side_effects:
      - "status = DRAFT"
      - "If is_fast_track_submission: risk_score += 5"

  - method: GET
    path: "/journals/{journalId}/manuscripts"
    description: "List Manuscripts for a Journal"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Manuscript[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/manuscripts/{manuscriptId}"
    description: "Get a specific Manuscript"
    roles: [Any]
    code: 200
    input: []
    output: Manuscript
    side_effects: []

  - method: PUT
    path: "/journals/{journalId}/manuscripts/{manuscriptId}"
    description: "Update a Manuscript's status"
    roles: [JournalEditor]
    code: 200
    input: [status]
    output: Manuscript
    side_effects:
      - "State transitions as per Manuscript state machine"
      - "DRAFT → PENDING_REVIEW: deduct 10 prestige points (submission cost)"
      - "→ REJECTED: cancel all non-terminal reviews, reverse prestige/risk"

  # --- ReviewAssignment ---
  - method: POST
    path: "/journals/{journalId}/manuscripts/{manuscriptId}/review-assignments"
    description: "Create a new Review Assignment"
    roles: [SectionEditor]
    code: 201
    input: ["required_expertise, required_anonymity_level?, due_date"]
    output: ReviewAssignment
    side_effects:
      - "revision_cycle auto-calculated"
      - "status = PENDING_ASSIGNMENT"

  - method: GET
    path: "/journals/{journalId}/manuscripts/{manuscriptId}/review-assignments"
    description: "List Review Assignments for a Manuscript"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ReviewAssignment[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/manuscripts/{manuscriptId}/review-assignments/{assignmentId}"
    description: "Get a specific Review Assignment"
    roles: [Any]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []

  - method: POST
    path: "/journals/{journalId}/manuscripts/{manuscriptId}/review-assignments/{assignmentId}/cancel"
    description: "Cancel a Review Assignment"
    roles: [SectionEditor]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects:
      - "status → CANCELLED (only from PENDING_ASSIGNMENT, ERR_ASSIGNMENT_NOT_PENDING_FOR_CANCEL)"

  # --- ReviewerProfile ---
  - method: POST
    path: "/journals/{journalId}/reviewer-profiles"
    description: "Create a new Reviewer Profile"
    roles: [SectionEditor]
    code: 201
    input: ["full_name, institution, expertise_areas"]
    output: ReviewerProfile
    side_effects: ["certifications initialized to empty array"]

  - method: GET
    path: "/journals/{journalId}/reviewer-profiles"
    description: "List Reviewer Profiles for a Journal"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ReviewerProfile[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/reviewer-profiles/{reviewerId}"
    description: "Get a specific Reviewer Profile"
    roles: [Any]
    code: 200
    input: []
    output: ReviewerProfile
    side_effects: []

  - method: POST
    path: "/journals/{journalId}/reviewer-profiles/{reviewerId}/certifications"
    description: "Add a certification to a Reviewer Profile"
    roles: [SectionEditor]
    code: 200
    input: ["name (PhD | MD | JD), granted_date"]
    output: ReviewerProfile
    side_effects: ["Certification added to certifications array"]

  # --- Review ---
  - method: POST
    path: "/journals/{journalId}/reviews"
    description: "Invite a Reviewer for a Review Assignment"
    roles: [SectionEditor]
    code: 201
    input: ["assignment_id, reviewer_id"]
    output: Review
    side_effects:
      - "Calculate provisional_prestige_cost"
      - "Debit prestige_balance"
      - "Determine in_extra_revision_cycle"
      - "If extra revision: risk_score += 20"
      - "Assignment status → INVITED"
      - "Trigger full validation chain (expertise, concurrency, conflict, risk, prestige)"

  - method: GET
    path: "/journals/{journalId}/reviews"
    description: "List all Reviews for a Journal"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Review[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/reviews/{reviewId}"
    description: "Get a specific Review"
    roles: [Any]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: POST
    path: "/journals/{journalId}/reviews/{reviewId}/accept"
    description: "Accept an invited Review"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Review
    side_effects:
      - "status → ACCEPTED"
      - "Assignment status → ASSIGNED"

  - method: POST
    path: "/journals/{journalId}/reviews/{reviewId}/submit"
    description: "Submit an accepted Review"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Review
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/journals/{journalId}/reviews/{reviewId}/decline"
    description: "Decline an invited Review"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Review
    side_effects:
      - "status → DECLINED"
      - "Assignment reverts to PENDING_ASSIGNMENT"
      - "Restore provisional prestige cost"
      - "Reverse risk penalties if extra revision"

  - method: POST
    path: "/journals/{journalId}/reviews/{reviewId}/cancel"
    description: "Cancel a Review"
    roles: [JournalEditor]
    code: 200
    input: []
    output: Review
    side_effects:
      - "status → CANCELLED (from INVITED, ACCEPTED, or SUBMITTED)"
      - "Assignment reverts to PENDING_ASSIGNMENT"
      - "Restore provisional prestige cost"
      - "Reverse risk penalties if extra revision"

  # --- ConflictOfInterest ---
  - method: POST
    path: "/journals/{journalId}/conflicts-of-interest"
    description: "Create a Conflict of Interest"
    roles: [JournalEditor]
    code: 201
    input: ["entity_1_id, entity_2_id, conflict_type, reason?"]
    output: ConflictOfInterest
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/conflicts-of-interest"
    description: "List Conflicts of Interest for a Journal"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ConflictOfInterest[]"
    side_effects: []

  - method: GET
    path: "/journals/{journalId}/conflicts-of-interest/{conflictId}"
    description: "Get a specific Conflict of Interest"
    roles: [Any]
    code: 200
    input: []
    output: ConflictOfInterest
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Resource Not Found ---
  - id: ERR_JOURNAL_NOT_FOUND
    http: 404
    condition: "Journal with given journalId does not exist"

  - id: ERR_MANUSCRIPT_NOT_FOUND
    http: 404
    condition: "Manuscript with given manuscriptId does not exist"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Review assignment with given assignmentId does not exist"

  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "Reviewer profile with given reviewerId does not exist"

  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "Review with given reviewId does not exist"

  # --- State Constraints ---
  - id: ERR_JOURNAL_LIFECYCLE_STATE_INVALID
    http: 409
    condition: "Journal lifecycle transition is invalid for current state"

  - id: ERR_JOURNAL_NOT_ACCEPTING_SUBMISSIONS
    http: 409
    condition: "Manuscript creation requires journal to be in ACCEPTING_SUBMISSIONS state"

  - id: ERR_JOURNAL_NOT_IN_REVIEW
    http: 409
    condition: "Operation requires journal to be in IN_REVIEW state"

  - id: ERR_JOURNAL_NOT_PENDING_PUBLICATION
    http: 409
    condition: "finalize-publication requires journal to be in PUBLICATION_PENDING state"

  - id: ERR_MANUSCRIPT_LIFECYCLE_STATE_INVALID
    http: 409
    condition: "Manuscript status transition is invalid for current state"

  - id: ERR_REVIEW_LIFECYCLE_STATE_INVALID
    http: 409
    condition: "Review lifecycle transition is invalid for current state"

  - id: ERR_ASSIGNMENT_NOT_PENDING
    http: 409
    condition: "Review invitation requires assignment to be in PENDING_ASSIGNMENT state"

  - id: ERR_ASSIGNMENT_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "Assignment cancellation requires PENDING_ASSIGNMENT state"

  - id: ERR_UNRESOLVED_REVIEWS_EXIST
    http: 409
    condition: "Unresolved reviews exist (INVITED, ACCEPTED, or SUBMITTED) when initiating publication"

  - id: ERR_NO_ASSIGNMENTS
    http: 409
    condition: "No review assignments exist when transitioning manuscript to PENDING_REVIEW"

  # --- Business Validation ---
  - id: ERR_EXPERTISE_MISMATCH
    http: 400
    condition: "Reviewer expertise does not match assignment required_expertise"

  - id: ERR_REVIEWER_OVERLOADED
    http: 409
    condition: "Reviewer has reached maximum concurrent review limit (5)"

  - id: ERR_INSTITUTIONAL_CONFLICT
    http: 409
    condition: "Institutional conflict of interest exists between reviewer and assignment"

  - id: ERR_PRIOR_COLLABORATION
    http: 409
    condition: "Prior collaboration conflict of interest exists between reviewer and assignment"

  - id: ERR_SELF_CONFLICT
    http: 400
    condition: "Cannot create a conflict where both entities are identical"

  # --- Risk & Financial ---
  - id: ERR_RISK_SCORE_TOO_HIGH
    http: 403
    condition: "Journal risk score has reached submission lock threshold (100), blocking new manuscripts"

  - id: ERR_RISK_THRESHOLD_BREACHED
    http: 403
    condition: "Extra revision invitation would cause risk score to reach/exceed threshold (100)"

  - id: ERR_INSUFFICIENT_PRESTIGE
    http: 402
    condition: "Provisional prestige cost exceeds available prestige balance"

  # --- Pagination ---
  - id: ERR_INVALID_PAGINATION_PARAMETERS
    http: 400
    condition: "Pagination parameters are invalid (limit out of range, offset negative)"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: JournalEditor
    description: "Journal editor, responsible for journal lifecycle, manuscript status transitions, review acceptance/submission/decline/cancel"
    exclusive_operations:
      - "POST /journals — Create journal"
      - "POST .../begin-review — Begin review process"
      - "POST .../initiate-publication — Initiate publication"
      - "PUT .../manuscripts/{id} — Update manuscript status"
      - "POST .../reviews/{id}/accept — Accept review"
      - "POST .../reviews/{id}/submit — Submit review"
      - "POST .../reviews/{id}/decline — Decline review"
      - "POST .../reviews/{id}/cancel — Cancel review"
      - "POST .../conflicts-of-interest — Create conflict of interest"

  - name: SectionEditor
    description: "Section editor, responsible for manuscript submission, reviewer profiles, review assignments, and review invitations"
    exclusive_operations:
      - "POST .../manuscripts — Create manuscript"
      - "POST .../review-assignments — Create review assignment"
      - "POST .../review-assignments/{id}/cancel — Cancel assignment"
      - "POST .../reviewer-profiles — Create reviewer profile"
      - "POST .../reviewer-profiles/{id}/certifications — Add certification"
      - "POST .../reviews — Invite reviewer (create review)"

  - name: ManagingEditor
    description: "Managing editor, responsible for final publication"
    exclusive_operations:
      - "POST .../finalize-publication — Finalize publication and archive"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /journals — List journals"
      - "GET /journals/{journalId} — Get journal details"
      - "GET .../manuscripts — List manuscripts"
      - "GET .../manuscripts/{id} — Get manuscript details"
      - "GET .../review-assignments — List assignments"
      - "GET .../review-assignments/{id} — Get assignment details"
      - "GET .../reviewer-profiles — List reviewer profiles"
      - "GET .../reviewer-profiles/{id} — Get reviewer profile details"
      - "GET .../reviews — List reviews"
      - "GET .../reviews/{id} — Get review details"
      - "GET .../conflicts-of-interest — List conflicts"
      - "GET .../conflicts-of-interest/{id} — Get conflict details"
