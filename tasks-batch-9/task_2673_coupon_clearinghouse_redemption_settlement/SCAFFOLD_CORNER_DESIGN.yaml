            - "trigger call 2, the s3://img/4.jpg item: status \"REJECTED_DUPLICATE\", reject_code \"DUPLICATE_SERIAL\", duplicate_of_item_id == the s3://img/1.jpg item's id — step 3 wins over the missing pos_transaction_ref that step 4 would have punished"
