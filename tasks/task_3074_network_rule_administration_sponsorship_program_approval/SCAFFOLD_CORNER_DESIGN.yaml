          - errors[ERR_SETTLEMENT_INVALID]
        distinguishing_aspect: "A settlement line whose from_member_id equals to_member_id is rejected with ERR_SETTLEMENT_INVALID (422) at draft creation."
        test_recipe:
          setup: ["Member M ACTIVE; window W created"]
