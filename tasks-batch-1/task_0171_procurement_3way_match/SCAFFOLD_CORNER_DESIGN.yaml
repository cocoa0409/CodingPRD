        claim_type: Correct Result
        grounds:
          - calculations.approval_matrix
          - entities.Requisition.fields.required_levels
          - endpoints[POST /procurement/requisitions/{id}/submit]
        distinguishing_aspect: "estimated_total_cents == approval_threshold_cents + 1 (500001) crosses the strict > boundary so required_levels becomes 2 and a DIRECTOR ApprovalStep is added."
