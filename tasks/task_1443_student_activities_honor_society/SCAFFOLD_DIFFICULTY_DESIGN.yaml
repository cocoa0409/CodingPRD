  # ============================================================
  # Rule 8: resource_temporal_overlap (≥2 instances, different interval semantics)
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: athletics_block_adjacent_intervals_no_conflict
        grounds:
          - calculations.athletics_conflict_overlap
          - entities.AthleticsCalendarBlock
        distinguishing_aspect: |
          Interval semantics: half-open [start, end). Two blocks where one
          ends exactly when another begins do NOT conflict. This is on the
          AthleticsCalendarBlock resource (member's time), half-open
          semantics.
        test_recipe:
          setup:
            - "Chapter ACTIVE; Member PROSPECTIVE"
            - "Two athletics blocks: Block1 [2026-08-30, 2026-09-01), Block2 [2026-09-01, 2026-09-05) — adjacent, not overlapping"
            - "Cycle induction_date 2026-09-05T12:00 — falls inside Block2 only"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Adjacent High", charter_number: "NHS-015", advisor_user_id: "adv_015", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S1501", full_name: "Athlete", email: "a@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { m_id: $.data.id }
            - call: "POST /chapters/${ch_id}/athletics-blocks"
              payload: { member_id: "${m_id}", block_start: "2026-08-30T00:00:00Z", block_end: "2026-09-01T00:00:00Z", sport: "Soccer", priority: "PRACTICE" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/athletics-blocks"
              payload: { member_id: "${m_id}", block_start: "2026-09-01T00:00:00Z", block_end: "2026-09-05T00:00:00Z", sport: "Soccer", priority: "GAME" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-FALL", academic_year: "2026-2027", semester: "FALL", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { cy_id: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/open-nominations"
              payload: {}
              as: Advisor
          trigger:
            # Nomination at induction_date 2026-09-01T00:00 falls inside Block2 [09-01, 09-05)
            # but Block1 ends exactly at 09-01 (half-open: not overlapping).
            # Nomination should FAIL because Block2 overlaps, demonstrating that
            # adjacency is not overlap (Block1 doesn't trigger but Block2 does).
            - call: "POST /chapters/${ch_id}/members/${m_id}/nominate"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "POST nominate returns ERR_ATHLETICS_CONFLICT (due to Block2 overlapping induction_date)"
            - "Adjacency semantics: Block1 end == Block2 start does NOT count as overlap with Block1"

      - name: athletics_block_priority_overrides_on_conflict
        grounds:
          - calculations.athletics_conflict_overlap
          - entities.AthleticsCalendarBlock.fields.priority
        distinguishing_aspect: |
          Aggregate-capacity semantics: when multiple blocks overlap the same
          induction_date, the HIGHEST-priority block governs the conflict
          (TOURNAMENT > GAME > PRACTICE). Distinct interval semantics from
          the half-open adjacency instance: this one is about ordering over
          an overlapping set, not about boundaries.
        test_recipe:
          setup:
            - "Chapter ACTIVE; Member PROSPECTIVE"
            - "Three overlapping athletics blocks all covering induction_date: PRACTICE, GAME, TOURNAMENT"
            - "Nomination should be blocked and the conflict attributed to the TOURNAMENT block"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Priority High", charter_number: "NHS-016", advisor_user_id: "adv_016", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S1601", full_name: "Multi Athlete", email: "ma@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { m_id: $.data.id }
            - call: "POST /chapters/${ch_id}/athletics-blocks"
              payload: { member_id: "${m_id}", block_start: "2026-08-28T00:00:00Z", block_end: "2026-09-05T00:00:00Z", sport: "Soccer", priority: "PRACTICE" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/athletics-blocks"
              payload: { member_id: "${m_id}", block_start: "2026-08-30T00:00:00Z", block_end: "2026-09-03T00:00:00Z", sport: "Soccer", priority: "GAME" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/athletics-blocks"
              payload: { member_id: "${m_id}", block_start: "2026-09-01T00:00:00Z", block_end: "2026-09-02T00:00:00Z", sport: "Soccer", priority: "TOURNAMENT" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-FALL", academic_year: "2026-2027", semester: "FALL", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { cy_id: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/open-nominations"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /chapters/${ch_id}/members/${m_id}/nominate"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "POST nominate returns ERR_ATHLETICS_CONFLICT"
            - "The conflict attribution identifies the TOURNAMENT block as governing (highest priority wins)"

  # ============================================================
  # Rule 9: compensating_invariant (≥2 instances, different conserved quantities)
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: fund_balance_conserved_across_dues_remit_refund
        grounds:
          - calculations.fund_balance_rollup
          - calculations.dues_arrears_rollup
          - state_machines.DuesPayment.PENDING_REMITTANCE_to_REMITTED
          - state_machines.DuesPayment.REMITTED_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: Chapter.fund_balance_cents. Forward action
          (dues remit) creates NATIONAL_DUES_PAYMENT entry with negative
          amount; compensating action (refund) creates ADJUSTMENT entry with
          positive amount. Net: fund_balance_cents unchanged after remit+refund
          pair. Conserved quantity = integer cents in the chapter fund.
        test_recipe:
          setup:
            - "Chapter ACTIVE with fund_balance_cents = X"
            - "Member ACTIVE; DuesPayment recorded and remitted"
          setup_api_calls:
