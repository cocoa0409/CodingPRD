            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "COVENANT_DEFAULT" }, as: AgentBank, captures: { dc: $.data.id } }
            - { call: "POST /api/default_cases/${dc}/votes", payload: { vote: "WAIVE" }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/default_cases/${dc}/waive", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id, ipool: $.data.interest_pool_cents } }
          assert:
            - "DefaultCase.${dc}.status == WAIVED; Facility.${f_id}.status == ACTIVE; Borrower.${b_id}.status == ACTIVE"
            - "DistributionRun.${run_id}.interest_pool_cents == 39999 (26,666 base 8/1-8/21 + 13,333 base 8/21-8/31; addon fully removed retroactively)"
            - "interest pool strictly below the never-defaulted single-segment value of 40,000 (per-segment floor evidence)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: priority_pair_state_vs_fiscal
        claim_type: priority_ordering
        grounds: ['validations[priority=7]', 'validations[priority=13]']
        excluded_because:
          difficulty_instance: transfer_default_posture_beats_commitment_overflow
          rationale: "Priority conflict asserted by the named §1.8 instance."

      - name: priority_pair_referential_vs_temporal
        claim_type: priority_ordering
        grounds: ['validations[priority=11]', 'validations[priority=12]']
        excluded_because:
          difficulty_instance: exited_participant_vote_beats_voting_window_close
          rationale: "Priority conflict asserted by the named §1.8 instance."

      - name: oversubscription_commit_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10]', 'errors[ERR_COMMITMENT_EXCEEDS_TOTAL]']
        distinguishing_aspect: "Aggregate validation: P1's 7,000,000 commit succeeds, P2's 4,000,000 would take committed past the 10,000,000 total -> ERR_COMMITMENT_EXCEEDS_TOTAL."
        test_recipe:
          setup: ["facility total 10,000,000; P1 7,000,000 committed; P2 PROPOSED with 4,000,000"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Over B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Over", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 7000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 4000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COMMITMENT_EXCEEDS_TOTAL, HTTP 409 (7,000,000 + 4,000,000 > 10,000,000)"

      - name: transfer_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=13]', 'errors[ERR_TRANSFER_BELOW_MINIMUM]']
        distinguishing_aspect: "transfer_amount_cents 999,999 is one cent below the 1,000,000 minimum -> ERR_TRANSFER_BELOW_MINIMUM."
        test_recipe:
          setup: ["facility 5,000,000 with P1 5,000,000 COMMITTED (min_transfer_cents default 1,000,000)"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Min B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Min", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "MP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 999999, settlement_date: "2026-08-20", transferee_name: "Buyer" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_BELOW_MINIMUM, HTTP 409"

      - name: transfer_stub_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=13]', 'errors[ERR_TRANSFER_STUB_BELOW_MINIMUM]']
        distinguishing_aspect: "Partial transfer of 600,000 from a 1,500,000 commitment leaves a 900,000 stub (< 1,000,000 min) -> ERR_TRANSFER_STUB_BELOW_MINIMUM, even though the amount itself clears the minimum."
        test_recipe:
          setup: ["facility 5,000,000; participant SP with 1,500,000 COMMITTED (facility not fully subscribed so no bubble issues)"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Stub B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Stub", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "SP", commitment_cents: 1500000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 600000, settlement_date: "2026-08-20", transferee_name: "Buyer" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_STUB_BELOW_MINIMUM, HTTP 409 (stub 900,000 < min 1,000,000)"

      - name: transfer_ambiguous_target_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=5]', 'errors[ERR_TRANSFER_TARGET_AMBIGUOUS]']
        distinguishing_aspect: "Providing BOTH transferee_participant_id and transferee_name -> 400 ERR_TRANSFER_TARGET_AMBIGUOUS (exactly one allowed)."
        test_recipe:
          setup: ["facility 5,000,000 with P1 3,000,000 and P2 2,000,000 COMMITTED"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Amb B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Amb", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 3000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 2000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-20", transferee_participant_id: "${p2_id}", transferee_name: "Also Named" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSFER_TARGET_AMBIGUOUS, HTTP 400"

      - name: self_transfer_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10]', 'errors[ERR_SELF_TRANSFER]']
        distinguishing_aspect: "transferee_participant_id equal to the caller's own participant id -> ERR_SELF_TRANSFER."
        test_recipe:
          setup: ["facility 5,000,000 with P1 5,000,000 COMMITTED"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Self B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Self", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "SP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-20", transferee_participant_id: "${p_id}" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_TRANSFER, HTTP 409"

      - name: transfer_settlement_blackout_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=12]', 'errors[ERR_SETTLEMENT_IN_BLACKOUT]']
        distinguishing_aspect: "A payment valued 2026-08-20 closes settlement dates [2026-08-18, 2026-08-22] inclusive; settlement_date 2026-08-19 is rejected while 2026-08-17 (one day outside) succeeds."
        test_recipe:
          setup: ["funded facility (P1 3,000,000 / P2 2,000,000) with a RECEIVED payment value_date 2026-08-20"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Black B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Black", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 3000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 2000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 400000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 50000, value_date: "2026-08-20" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id } }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-19", transferee_name: "Buyer" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-17", transferee_name: "Buyer" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { t_id: $.data.id } }
          assert:
            - "first transfer: error_id == ERR_SETTLEMENT_IN_BLACKOUT, HTTP 409 (inside closed [2026-08-18, 2026-08-22])"
            - "second transfer created with 201 (settlement_date 2026-08-17 outside the window)"

      - name: buyback_not_funded_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=11]', 'errors[ERR_BUYBACK_NOT_FUNDED]']
        distinguishing_aspect: "A merely COMMITTED participant (no confirmed funding) cannot demand buyback -> ERR_BUYBACK_NOT_FUNDED."
        test_recipe:
          setup: ["facility 5,000,000 with P1 COMMITTED; no draw exists so P1 is not FUNDED"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "NF B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac NF", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "NP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "MISREPRESENTATION" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BUYBACK_NOT_FUNDED, HTTP 409"

      - name: buyback_duplicate_pending_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10]', 'errors[ERR_BUYBACK_ALREADY_PENDING]']
        distinguishing_aspect: "One open demand per participant per facility; a second while the first is DEMANDED -> ERR_BUYBACK_ALREADY_PENDING."
        test_recipe:
          setup: ["funded facility; P1 already has a DEMANDED buyback"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Dup2 B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Dup2", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "DP", commitment_cents: 5000000 }, as: AgentBank, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "MISREPRESENTATION" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { bd: $.data.id } }
          trigger:
            - { call: "POST /api/buyback_demands", payload: { facility_id: "${f_id}", breach_type: "SERVICING_BREACH" }, as: ParticipantLender, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BUYBACK_ALREADY_PENDING, HTTP 409"

      - name: duplicate_statement_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10]', 'errors[ERR_DUPLICATE_STATEMENT]']
        distinguishing_aspect: "Same (facility, QUARTERLY, period_end 2026-06-30) twice -> ERR_DUPLICATE_STATEMENT on the second."
        test_recipe:
          setup: ["facility exists; one QUARTERLY statement for 2026-06-30 registered"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "DS B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac DS", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/financial_statements", payload: { facility_id: "${f_id}", statement_type: "QUARTERLY", period_end_date: "2026-06-30", document_ref: "s3://a.pdf" }, as: Borrower, as_user_id: "${b_id}", captures: { st1: $.data.id } }
          trigger:
            - { call: "POST /api/financial_statements", payload: { facility_id: "${f_id}", statement_type: "QUARTERLY", period_end_date: "2026-06-30", document_ref: "s3://b.pdf" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_STATEMENT, HTTP 409"

      - name: modification_terms_incomplete_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=5]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "RATE_CHANGE without terms.new_interest_rate_bps -> 400 ERR_INVALID_REQUEST (type-keyed terms completeness)."
        test_recipe:
          setup: ["facility exists"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "TI B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac TI", total_commitment_cents: 5000000, currency: "USD", interest_rate_bps: 900, day_count_basis: "ACT_360", servicing_fee_bps: 10, default_interest_addon_bps: 300, maturity_date: "2030-01-01" }, as: AgentBank, captures: { f_id: $.data.id } }
          trigger:
            - { call: "POST /api/modification_requests", payload: { facility_id: "${f_id}", modification_type: "RATE_CHANGE", terms: {} }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: writedown_exceeds_outstanding_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ModificationRequest.PASSED_to_IMPLEMENTED, 'errors[ERR_WRITEDOWN_EXCEEDS_OUTSTANDING]']
        distinguishing_aspect: "A UNANIMOUS PRINCIPAL_WRITE_DOWN that passes all three votes still fails at implement when write_down_cents 6,000,000 > outstanding 5,000,000 -> ERR_WRITEDOWN_EXCEEDS_OUTSTANDING."
        test_recipe:
          setup: ["facility 10,000,000 (P1 6M / P2 3M / P3 1M funded); draw 5,000,000 SETTLED; unanimous-approved write-down of 6,000,000 in PASSED"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "WD B", sector: "INDUSTRIAL", risk_rating: "DISTRESSED" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac WD", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 5000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
