          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (HTTP 409); dispute remains WITHDRAWN"

      - name: assignment_end_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.RepAssignment.ACTIVE_to_ENDED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Ending an ENDED assignment is rejected, not silently idempotent."
        test_recipe:
          setup: ["Plan OPEN; ACTIVE territory T with rep R assigned (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
