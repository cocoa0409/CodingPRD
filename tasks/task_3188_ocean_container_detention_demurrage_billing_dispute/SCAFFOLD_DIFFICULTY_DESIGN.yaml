  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: free_day_zero_and_return_on_last_free_day_zero_charge
        grounds:
          - calculations.free_time_window
          - calculations.detention_accrual
          - entities.ServiceContract.fields.demurrage_free_days
        distinguishing_aspect: |
          Metric: billable-day COUNT at the zero boundary on the container
          gate-out/return endpoints — a contract with demurrage_free_days=0
          makes the day after availability billable (3 days -> 45000), while
          an empty return executed exactly ON the last detention free day
          yields exactly 0 billable days and a 0-cent detention accrual row.
        test_recipe:
          setup:
            - "ACCT-K ACTIVE; CTR-K0 (dem free=0) and CTR-K5 (det free=5, sat=false) both ACTIVE"
            - "CNTR-K0 on CTR-K0: avail 2026-09-01, gate-out 2026-09-04"
            - "CNTR-K5 on CTR-K5: gate-out 2026-09-09, return exactly 2026-09-16 (last free day)"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-K", legal_name: "Kelp Traders" }
              as: ContractManager
