# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design (breadth coverage index for task 2563,
# Assortment Planning & Open-to-Buy). Every instance below is a testable claim
# that SCAFFOLD.yaml's 1.1-1.7 surface declares and that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8) does not already assert; corners that
# 1.8 already asserts appear as excluded_because stubs naming the covering
# instance. Sections and claim_type values come from
# references/claim-extraction-guide.md.
# ---------------------------------------------------------------------------
scaffold_corner_design:
  - section: entities
    instances:
      - name: department_create_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.Department
          - endpoints[POST /otb/departments]
        distinguishing_aspect: "A create returns 201 with every declared input field echoed and the four common fields present; a handler that persists but returns a bare id, or that drops turn_target_x100, fails."
        test_recipe:
          setup:
            - "empty database, MerchOpsAdmin acting"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object"
            - "data.name == 'Womens Apparel', data.code == 'WAPP', data.fiscal_year == 2027, data.sales_target_cents == 500000000, data.margin_target_bps == 5600, data.turn_target_x100 == 320"
            - "data.id is a non-empty string, data.version == 1, and data.created_at and data.updated_at are both present ISO 8601 timestamps"
            - "GET /otb/departments/${dept_id} returns the identical field values"

      - name: plan_month_get_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.PlanMonth
          - endpoints[GET /otb/plan-months/{id}]
        distinguishing_aspect: "A freshly created PlanMonth reads back with its input fields intact and every computed OTB field at its declared default 0 with active_basis PLANNED_BASIS - not null, and not yet the approved values."
        test_recipe:
          setup:
            - "Department, Category and a DRAFT CategoryPlan exist; one PlanMonth created and never approved"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: MerchandisePlanner
          assert:
            - "HTTP 200 with data.id == ${m1_id} and data.category_plan_id == ${plan_id}"
            - "data.month_index == 1, data.fiscal_month_label == '2027-03', data.bom_inventory_cents == 20000000, data.planned_sales_cents == 30000000, data.planned_markdown_cents == 2000000, data.planned_eom_cents == 22000000"
            - "data.status == DRAFT and data.active_basis == PLANNED_BASIS"
            - "data.provisional_sell_through_bps == 0, data.reserve_rate_bps == 0, data.markdown_reserve_cents == 0, data.otb_planned_cents == 0, data.otb_committed_cents == 0, data.otb_received_cents == 0, data.otb_open_cents == 0 - the month carries no budget until an approval locks it"

      - name: assortment_item_list_filters_paginate_and_reject_bad_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /otb/assortment-items]
          - validations[priority=4].ERR_INVALID_PAGINATION
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filtering by lifecycle_stage and paging with limit/offset compose: the filter is applied before the page window, so total_count reflects the filtered set, not the table. limit 0 is out of the declared 1..100 range and is refused."
        test_recipe:
          setup:
            - "one OptionPlan with three PROPOSED AssortmentItems: two CARRYOVER and one NEW"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-A1", color_code: "NAVY", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_a1: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-A2", color_code: "BLACK", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 6800 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_a2: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-A3", color_code: "CORAL", lifecycle_stage: "NEW", unit_cost_cents: 2500, retail_price_cents: 7500 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_a3: $.data.id }
          trigger:
            - call: "GET /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", lifecycle_stage: "CARRYOVER" }
              as: MerchandisePlanner
              captures: { first_listed: "$.data[0].id" }
            - call: "GET /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", lifecycle_stage: "CARRYOVER", limit: 1, offset: 1 }
              as: MerchandisePlanner
            - call: "GET /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", limit: 0 }
              as: MerchandisePlanner
              captures: { pagination_error: $.data.error_id }
          assert:
            - "the filtered list returns HTTP 200 with response_type array, exactly 2 rows (${item_a1} and ${item_a2}), total_count == 2 and has_more == false - the NEW item ${item_a3} is excluded by the lifecycle_stage filter"
            - "the paged call returns exactly 1 row with limit == 1, offset == 1, total_count == 2 and has_more == false; total_count still counts the FILTERED set, not all three items"
            - "the paged row is the second row of the unpaged filtered list and is not ${first_listed}"
            - "the limit 0 call returns HTTP 400 with ${pagination_error} == ERR_INVALID_PAGINATION, because limit must be an integer in 1..100"

      - name: category_plan_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5].ERR_CATEGORY_PLAN_NOT_FOUND
          - errors.ERR_CATEGORY_PLAN_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown path id yields the entity-specific 404 error id, not a generic 404 and not an empty 200 body."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "GET /otb/category-plans/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: MerchandisePlanner
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP 404 with response_type error and ${nf_error} == ERR_CATEGORY_PLAN_NOT_FOUND"
            - "data.message is a non-empty string and no data.id is returned"

      - name: store_cluster_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3].ERR_INVALID_REQUEST
          - entities.StoreCluster.fields.volume_tier
        distinguishing_aspect: "volume_tier has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST at priority 3 - the row must not be created with a guessed tier."
        test_recipe:
          setup:
            - "empty database, MerchOpsAdmin acting"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { missing_field_error: $.data.error_id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
          assert:
            - "the first call returns HTTP 400 with ${missing_field_error} == ERR_INVALID_REQUEST"
            - "GET /otb/store-clusters returns total_count == 1 afterwards, proving the rejected call persisted nothing"
            - "the second call with volume_tier present returns HTTP 201 and data.volume_tier == 'A'"

      - name: vendor_and_authorization_and_item_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Vendor.fields.status
          - entities.VendorAuthorization.fields.status
          - entities.AssortmentItem.fields.prior_season_sell_through_bps
        distinguishing_aspect: "Three declared defaults land without being supplied: a new Vendor is PENDING (not AUTHORIZED, so it cannot be committed against yet), a new VendorAuthorization is ACTIVE, and an omitted prior_season_sell_through_bps is 0 rather than null."
        test_recipe:
          setup:
            - "Department and Category exist"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
          trigger:
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-D1", color_code: "CORAL", lifecycle_stage: "NEW", unit_cost_cents: 2500, retail_price_cents: 7500 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_id: $.data.id }
          assert:
            - "the vendor create returns HTTP 201 with data.status == PENDING even though status was not supplied - PENDING is the declared default and the vendor is not yet usable for a commit"
            - "the authorization create returns HTTP 201 with data.status == ACTIVE, data.vendor_id == ${vendor_id} and data.max_open_units == 40000"
            - "the item create returns HTTP 201 with data.prior_season_sell_through_bps == 0 (declared default, not null), data.status == PROPOSED, data.effective_overlay_multiplier_bps == 10000, data.sell_through_bps == null, data.sell_through_basis == null and data.planned_units == null"

      - name: commitment_computed_money_fields_are_not_inputs
        claim_type: computed_fields
        grounds:
          - entities.ReceiptCommitment.fields.cost_cents
          - validations[priority=3].ERR_INVALID_REQUEST
          - entities.ReceiptCommitment.fields.open_cost_cents
          - endpoints[POST /otb/receipt-commitments]
        distinguishing_aspect: "cost_cents, open_cost_cents and received_cost_cents have source computed and are not in the endpoint's input list, so supplying one is an unknown body field and is rejected outright at priority 3 rather than silently ignored; the accepted call derives them from units * unit_cost_cents."
        test_recipe:
          setup:
            - "the canonical spine with CategoryPlan SPRING 2027 APPROVED, PlanMonth M1 LOCKED_PLAN (otb_open_cents 18,200,000) and one CARRYOVER item at 2500 cents"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "OS", size_sort_order: 1, pct_bps: 10000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-C1", color_code: "NAVY", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_id: $.data.id }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              captures: { m1_v: $.data.version }
          trigger:
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2500, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}", cost_cents: 1 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { unknown_field_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments"
              payload: { plan_month_id: "${m1_id}", assortment_item_id: "${item_id}", vendor_id: "${vendor_id}", units: 400, unit_cost_cents: 2500, ship_window_start: "2027-03-05T00:00:00Z", ship_window_end: "2027-03-19T00:00:00Z", expected_plan_month_version: "${m1_v}" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_id: $.data.id }
          assert:
            - "the first call returns HTTP 400 with ${unknown_field_error} == ERR_INVALID_REQUEST: cost_cents is a computed field and therefore an unknown body field for this endpoint, and a smuggled 1-cent cost must never be honoured"
            - "the first call created nothing: GET /otb/receipt-commitments filtered by plan_month_id ${m1_id} returns total_count == 0, and PlanMonth.${m1_id}.version is still ${m1_v}"
            - "the second call returns HTTP 201 with data.cost_cents == 1000000 (400 * 2500), data.open_cost_cents == 1000000 and data.received_cost_cents == 0 - all three derived server-side"
            - "the computed values are stable on re-read: GET /otb/receipt-commitments/${rc_id} returns the same three numbers"

      - name: system_fields_are_server_generated_and_rejected_as_input
        claim_type: system_fields
        grounds:
          - entities.Category
          - validations[priority=3].ERR_INVALID_REQUEST
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: they appear on every response but are unknown body fields on input, so a client-chosen id is a 400 rather than an accepted override."
        test_recipe:
          setup:
            - "one Department exists"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000, id: "22222222-2222-4222-8222-222222222222" }
              as: MerchOpsAdmin
              captures: { forced_id_error: $.data.error_id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000, version: 7 }
              as: MerchOpsAdmin
              captures: { forced_version_error: $.data.error_id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
          assert:
            - "${forced_id_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "${forced_version_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "the clean create returns HTTP 201 with data.version == 1 and ${cat_id} != '22222222-2222-4222-8222-222222222222'"
            - "GET /otb/categories/22222222-2222-4222-8222-222222222222 returns HTTP 404 ERR_CATEGORY_NOT_FOUND, proving the client-supplied id never became a key"
            - "GET /otb/categories returns total_count == 1"

      - name: category_enum_and_integer_range_constraints_enforced
        claim_type: type_constraints
        grounds:
          - entities.Category.fields.role
          - entities.Category.fields.sales_share_bps
          - entities.StoreCluster.fields.demographic_index_bps
          - validations[priority=3].ERR_INVALID_REQUEST
        distinguishing_aspect: "Priority 3 covers three distinct shapes in one rule: an undeclared enum member, an integer below its declared minimum and an integer above its declared maximum. Each is a 400 before any business rule runs, and the accepted values immediately either side of the range prove the bounds are inclusive."
        test_recipe:
          setup:
            - "one Department exists"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "FLAGSHIP", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { bad_enum_error: $.data.error_id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 0 }
              as: MerchOpsAdmin
              captures: { below_min_error: $.data.error_id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 10001 }
              as: MerchOpsAdmin
              captures: { above_max_error: $.data.error_id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 10000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Edge", climate_zone: "TEMPERATE", demographic_index_bps: 4999, volume_tier: "C", store_count: 1, sales_index_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cluster_below_floor_error: $.data.error_id }
          assert:
            - "${bad_enum_error} == ERR_INVALID_REQUEST (HTTP 400): FLAGSHIP is not one of TRAFFIC_DRIVER, DESTINATION, CONVENIENCE, SEASONAL, OCCASIONAL"
            - "${below_min_error} == ERR_INVALID_REQUEST (HTTP 400): sales_share_bps is declared 1..10000 so 0 is out of range"
            - "${above_max_error} == ERR_INVALID_REQUEST (HTTP 400): 10001 is one above the declared maximum"
            - "the sales_share_bps 10000 create returns HTTP 201 with data.sales_share_bps == 10000, proving the upper bound is inclusive"
            - "${cluster_below_floor_error} == ERR_INVALID_REQUEST (HTTP 400): demographic_index_bps is declared 5000..20000 and 4999 is one below the floor; sales_index_bps 3000 and store_count 1 are both at their inclusive minima and are not the cause"
            - "GET /otb/categories returns total_count == 1 and GET /otb/store-clusters returns total_count == 0"

      - name: size_curve_cell_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.SizeCurveCell
          - entities.SizeCurveCell.fields.allocated_units
          - endpoints[PUT /otb/option-plans/{id}/size-curve]
          - endpoints[GET /otb/option-plans/{id}/size-curve-cells]
        distinguishing_aspect: "SizeCurveCell declares common_fields false, so a cell row carries no id, created_at, updated_at or version, and §1.5 offers no per-cell POST, PATCH or DELETE: the only write path is the wholesale PUT that deletes the whole set for the OptionPlan and persists the submitted set in its place, so a second PUT with fewer cells leaves exactly the new cells and nothing from the old set."
        test_recipe:
          setup:
            - "one department, category, store cluster (store_count 40, sales_index_bps 11500) and a DRAFT category plan with one OPEN OptionPlan (tier BETTER, depth_units_per_option 6)"
            - "the option plan already carries a five-cell size curve"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
