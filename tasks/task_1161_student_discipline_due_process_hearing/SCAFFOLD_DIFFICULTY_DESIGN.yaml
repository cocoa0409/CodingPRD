              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/refer-expulsion", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", hearing_officer_id: "ho_1", scheduled_start: "2026-05-05T10:00:00Z", scheduled_end: "2026-05-05T11:00:00Z" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { h_id: $.data.id }
            - call: "POST /hearings/${h_id}/evidence"
              payload: { item_type: "OTHER", description: "photo" }
