          assert:
            - "hop 1: FieldWalkout.${wo2_id}.status == REJECTED, review_round == 1, rejection_reason == 'obstruction sketch missing stationing, re-walk required'"
            - "hop 2: RouteSegment.${seg_id}.engineering_status == DRAFT"
            - "hop 3: RouteSegment.${seg_id}.construction_method == null, moratorium_class == NONE, restoration_cost_cents == 0, preliminary_cost_cents == null, bid_ready_cost_cents == null"
