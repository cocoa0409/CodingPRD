scaffold_corner_design:
  # =======================================================================
  # Section: entities
  # =======================================================================
  - section: entities
    instances:
      - name: project_creation_applies_defaults
        claim_type: defaults_applied
        grounds:
          - entities.ConstructionProject.fields.float_ownership_policy
          - entities.ConstructionProject.fields.notice_window_days
          - entities.ConstructionProject.fields.status
        distinguishing_aspect: "Omitting float_ownership_policy and notice_window_days applies defaults CONTRACTOR_OWNS and 21; status initialized to PRECONSTRUCTION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /construction-projects"
              payload: { project_name: "DP", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, fop: $.data.float_ownership_policy, nwd: $.data.notice_window_days, st: $.data.status }
          assert:
            - "ConstructionProject.${pid}.float_ownership_policy == 'CONTRACTOR_OWNS'"
            - "ConstructionProject.${pid}.notice_window_days == 21"
            - "ConstructionProject.${pid}.status == 'PRECONSTRUCTION'"
            - "ConstructionProject.${pid}.version == 1"

      - name: activity_relationship_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.ActivityRelationship
        distinguishing_aspect: "ActivityRelationship has common_fields=false; no PUT/PATCH endpoint exists for it; only create + list."
        test_recipe:
          setup: ["Project + schedule + 2 activities + 1 relationship"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { a: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "B", description: "b", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { b: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${a}", successor_activity_id: "${b}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              as: ProjectControlsEngineer
          assert:
            - "ActivityRelationship response exposes id and created_at but no updated_at/version (common_fields=false)"

      - name: get_project_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /construction-projects/{pid}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /construction-projects/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http == 404"

      - name: activity_remaining_duration_defaults_to_original
        claim_type: defaults_applied
        grounds:
          - endpoints."POST /construction-projects/{pid}/schedule-versions/{vid}/activities"
          - entities.Activity.fields.remaining_duration_days
        distinguishing_aspect: "Omitting remaining_duration_days on Activity create defaults to original_duration_days."
        test_recipe:
          setup: ["Project + DRAFT BASELINE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "X", description: "x", original_duration_days: 7 }
              as: ContractorScheduler
              captures: { aid: $.data.id, rd: $.data.remaining_duration_days }
          assert:
            - "Activity.${aid}.remaining_duration_days == 7 (defaulted from original_duration_days)"

  # =======================================================================
  # Section: state_machines
  # =======================================================================
  - section: state_machines
    instances:
      - name: schedule_submit_from_accepted_fails_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ScheduleVersion.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting an already-ACCEPTED schedule version fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project with ACCEPTED BASELINE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv}" }
              as: ProjectControlsEngineer
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: lda_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LiquidatedDamagesAssessment
        distinguishing_aspect: "Once LDA reaches UPHELD, no further transitions allowed."
        test_recipe:
          setup: ["LDA pushed PROPOSED → ASSESSED → APPEALED → UPHELD"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 5000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/ld-assessments"
              payload: { assessment_period_start: "2026-05-02T00:00:00Z", assessment_period_end: "2026-05-05T00:00:00Z" }
              as: OwnerRepresentative
              captures: { lid: $.data.id }
            - call: "POST /construction-projects/${pid}/ld-assessments/${lid}/assess"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/ld-assessments/${lid}/appeal"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/ld-assessments/${lid}/uphold"
              payload: {}
              as: OwnerRepresentative
          trigger:
            - call: "POST /construction-projects/${pid}/ld-assessments/${lid}/waive"
              payload: {}
              as: OwnerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (UPHELD is terminal)"

      - name: progress_update_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.ProgressUpdate
        distinguishing_aspect: "Newly created ProgressUpdate starts in DRAFT."
        test_recipe:
          setup: ["Project with ACCEPTED UPDATE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv}" }
              as: ProjectControlsEngineer
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "UPDATE", data_date: "2026-05-08T00:00:00Z", supersedes_version_id: "${bv}" }
              as: ContractorScheduler
              captures: { u1: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "GET /construction-projects/${pid}"
              as: ProjectControlsEngineer
              captures: { pv1: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/accept"
              payload: { expected_project_version: "${pv1}" }
              as: ProjectControlsEngineer
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${u1}/progress-updates"
              payload: { reporting_period_end: "2026-05-08T00:00:00Z", submitted_by_contractor_user_id: "u1" }
              as: ContractorScheduler
              captures: { pu: $.data.id, st: $.data.status }
          assert:
            - "ProgressUpdate.${pu}.status == DRAFT"

      - name: eot_appeal_limit_blocks_fourth_submission
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TimeExtensionRequest.DENIED_to_SUBMITTED
          - errors[ERR_APPEAL_LIMIT_REACHED]
          - validations[priority=15]
        distinguishing_aspect: "After 3 submissions (initial + 2 appeals), further appeal is rejected with ERR_APPEAL_LIMIT_REACHED."
        test_recipe:
          setup: ["EOT pushed through 3 denial rounds (submission_round == 3, status DENIED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events"
              payload: { title: "D", causation: "FORCE_MAJEURE", event_start_date: "2026-05-10T00:00:00Z" }
              as: ContractorScheduler
              captures: { de: $.data.id }
            - call: "POST /construction-projects/${pid}/delay-events/${de}/notice"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 5 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/deny"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/appeal"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/deny"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/appeal"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/deny"
              payload: {}
              as: OwnerRepresentative
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/appeal"
              payload: {}
              as: ContractorScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPEAL_LIMIT_REACHED (submission_round already 3)"

      - name: acceleration_negotiate_only_from_disputed
        claim_type: invalid_transition
        grounds:
          - state_machines.AccelerationDirective.DISPUTED_to_UNDER_NEGOTIATION
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Negotiate endpoint rejects when directive is ISSUED (not DISPUTED)."
        test_recipe:
          setup: ["AccelerationDirective in ISSUED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-08-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/acceleration-directives"
              payload: { directive_reference: "ACC-1", directed_completion_date: "2026-07-01T00:00:00Z" }
              as: OwnerRepresentative
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/acceleration-directives/${aid}/negotiate"
              payload: {}
              as: OwnerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # =======================================================================
  # Section: calculations
  # =======================================================================
  - section: calculations
    instances:
      - name: cpm_forward_pass_linear_chain
        claim_type: correct_result
        grounds:
          - calculations.cpm_forward_backward_pass
          - entities.Activity.fields.early_start
          - entities.Activity.fields.early_finish
        distinguishing_aspect: "Linear A(5d)→B(7d) FS chain from data_date 2026-05-01: A ES=2026-05-01, EF=2026-05-06; B ES=2026-05-06, EF=2026-05-13; total_float_days=0 for both."
        test_recipe:
          setup: ["Project + DRAFT BASELINE with A(5d) → B(7d) FS"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { a: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "B", description: "b", original_duration_days: 7 }
              as: ContractorScheduler
              captures: { b: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${a}", successor_activity_id: "${b}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          assert:
            - "Activity.${a}.total_float_days == 0"
            - "Activity.${b}.total_float_days == 0"
            - "ScheduleVersion.${bv}.projected_finish_date == 2026-05-13T00:00:00Z (data_date + 5 + 7 days)"
            - "ScheduleVersion.${bv}.critical_path_activity_count == 2"

      - name: cpm_float_on_parallel_paths
        claim_type: correct_result
        grounds:
          - calculations.cpm_forward_backward_pass
          - calculations.critical_path_identification
        distinguishing_aspect: "Parallel A(10d) and B(5d) from same start to same finish milestone M(0d): B has 5 days total float, A critical."
        test_recipe:
          setup: ["Project + DRAFT BASELINE with parallel A(10d), B(5d) converging to M(1d)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 10 }
              as: ContractorScheduler
              captures: { a: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "B", description: "b", original_duration_days: 5 }
              as: ContractorScheduler
              captures: { b: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "M", description: "milestone", original_duration_days: 1 }
              as: ContractorScheduler
              captures: { m: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${a}", successor_activity_id: "${m}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/relationships"
              payload: { predecessor_activity_id: "${b}", successor_activity_id: "${m}", relationship_type: "FS", lag_days: 0 }
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          assert:
            - "Activity.${a}.total_float_days == 0 AND Activity.${a}.is_critical == true"
            - "Activity.${b}.total_float_days == 5 AND Activity.${b}.is_critical == false"
            - "Activity.${m}.total_float_days == 0 AND Activity.${m}.is_critical == true"
            - "ScheduleVersion.${bv}.critical_path_activity_count == 2"

      - name: lda_gross_ld_uses_daily_rate
        claim_type: constants_applied
        grounds:
          - calculations.liquidated_damages_exposure
          - entities.LiquidatedDamagesAssessment.fields.gross_ld_cents
        distinguishing_aspect: "gross_ld_cents = culpable_days × project.liquidated_damages_daily_rate_cents; verify 5 days × 100000 = 500000."
        test_recipe:
          setup: ["Project with daily rate 100000; LDA drafted for 5-day window"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 10000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /construction-projects/${pid}/ld-assessments"
              payload: { assessment_period_start: "2026-05-02T00:00:00Z", assessment_period_end: "2026-05-06T00:00:00Z" }
              as: OwnerRepresentative
              captures: { lid: $.data.id, gross: $.data.gross_ld_cents }
          assert:
            - "LiquidatedDamagesAssessment.${lid}.culpable_days == 5"
            - "LiquidatedDamagesAssessment.${lid}.gross_ld_cents == 500000 (5 × 100000)"

      - name: ld_cap_applied_at_assess
        claim_type: precision
        grounds:
          - calculations.liquidated_damages_exposure
          - entities.LiquidatedDamagesAssessment.fields.assessed_ld_cents
        distinguishing_aspect: "When gross_ld_cents > ld_cap_cents, assessed = ld_cap_cents (capped, not clamped to zero)."
        test_recipe:
          setup: ["Project with ld_cap_cents = 300000; LDA with gross = 500000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-04-01T00:00:00Z", contract_completion_date: "2026-05-01T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 300000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id }
