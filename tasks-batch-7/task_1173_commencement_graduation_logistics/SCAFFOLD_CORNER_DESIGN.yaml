  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type object, and data."
        test_recipe:
          setup: ["One ceremony exists"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
          trigger:
            - call: "GET /api/ceremonies/${c}"
              payload: {}
              as: CommitteeChair
          assert:
            - "response envelope: meta.api_request_id present (req_*), meta.api_request_timestamp ISO8601, response_type == 'object'"
            - "data.id == ${c} and data.version == 1"

      - name: response_envelope_error_shape
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Every error response carries response_type error and data.{error_id, message}."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/ceremonies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CommitteeChair
              captures: { err: $.data.error_id }
          assert:
            - "response envelope: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"
            - "HTTP status 404"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_ticket_cap_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TICKET_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / ticket_request_exact_cap_boundary"
          rationale: "Asserted as the failure path of the named §1.8 instance (requested_count == entitlement + 1)."
      - name: error_request_window_closed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUEST_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / ticket_request_deadline_beats_cap_conflict"
          rationale: "Asserted as the winning error of the named §1.8 dual-failure instance."
      - name: error_venue_time_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENUE_TIME_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rehearsal_half_open_adjacency"
          rationale: "Asserted on the overlapping S3 trigger of the named §1.8 instance."
      - name: error_vendor_coverage_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_COVERAGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / vendor_buffered_closed_overlap"
          rationale: "Asserted on the second LIVESTREAM contract trigger of the named §1.8 instance."
      - name: error_graduate_not_eligible_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRADUATE_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ticket_request_requires_eligible_graduate"
          rationale: "Asserted as the rejection of the PENDING_AUDIT graduate's ticket request."
      - name: error_ceremony_posture_forbids_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CEREMONY_POSTURE_FORBIDS]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / batch_release_requires_audit_locked"
          rationale: "Asserted as the batch-release rejection in AUDIT_OPEN posture (also exercised by corner diploma_issue_requires_commenced_posture)."
      - name: error_invalid_state_via_pay_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / regalia_pay_state_beats_fiscal"
          rationale: "ERR_INVALID_STATE asserted as the winning error; other triggers covered by withdraw-twice / commence-after-complete / double-approve corners."

  # ===========================================================================
  - section: rbac
    instances:
      - name: registrar_cannot_run_waterfall_returns_unauthorized
        claim_type: violation_to_error
        grounds: ["roles[CommitteeChair]", "roles[RegistrarOfficer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Peer-role separation: run-ticket-waterfall is exclusive to CommitteeChair; RegistrarOfficer is denied."
        test_recipe:
          setup: ["Ceremony AUDIT_LOCKED (zero graduates needed)"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/ceremonies/${c}/run-ticket-waterfall"
              payload: {}
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.TicketAllocation.fields.provisional_granted_count]
        distinguishing_aspect: "Immediate consistency: the request response itself carries the mutated requested_count and recomputed provisional estimate — no re-read needed."
        test_recipe:
          setup: ["Ceremony AUDIT_OPEN (pool 10); eligible graduate with allocation at version 1"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Imm Irene", email: "irene@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, credits_completed: 120, credits_required: 120 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${g}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { a: "$.data[0].id", av: "$.data[0].version" }
          trigger:
            - call: "POST /api/ticket-allocations/${a}/request"
              payload: { requested_count: 3, expected_ticket_allocation_version: "${av}" }
              as: Graduate
              as_user_id: "${g}"
              captures: { req: $.data.requested_count, prov: $.data.provisional_granted_count, ver: $.data.version }
          assert:
            - "response carries requested_count == 3, provisional_granted_count == 3 (SUMMA entitlement 6, pool 10), version == 2 — all in the same response"
