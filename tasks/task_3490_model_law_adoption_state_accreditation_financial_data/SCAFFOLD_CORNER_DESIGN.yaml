  - section: cross_cutting_layers
    instances:
      - name: occ_filing_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-refile-stale-insurer]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first filing create bumps the insurer version, a second create for the same period carrying the previously observed version is rejected 412."
        test_recipe:
          setup: ["State CA; insurer 90092 (version captured at creation); standard VM-87 v1 ACTIVE; one 2026 ANNUAL filing already created (insurer version advanced)"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff }
            - { call: "POST /naic/insurers", payload: { naic_code: "90092", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-87", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-87", reported_surplus_cents: 1000, asset_risk_cents: 100, underwriting_risk_cents: 0, other_risk_cents: 0, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-87", reported_surplus_cents: 2000, asset_risk_cents: 100, underwriting_risk_cents: 0, other_risk_cents: 0, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412): expected_insurer_version is the pre-first-create value"
            - "FinancialFiling.${f1} remains the only non-SUPERSEDED filing for the period"
      - name: occ_adoption_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adoption-supersede-stale-state]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first adoption create bumps the state version, a second adoption create carrying the previously observed state version is rejected 412 (OCC fires before the duplicate-adoption constraint)."
        test_recipe:
          setup: ["State CA (version captured); act MDL-860 v1 PUBLISHED; one PENDING adoption exists (state version advanced)"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id, s_ca_v: $.data.version } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-860", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c" }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/publish", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${act_id}", state_code: "CA", adopted_citation: "CIC 860", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { ad1: $.data.id } }
          trigger:
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${act_id}", state_code: "CA", adopted_citation: "CIC 860b", enacted_on: "2026-12-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412): expected_state_version is the pre-first-create value"
      - name: stale_pinned_standard_rejected_at_validate
        claim_type: version_pinning_on_approval
        grounds:
          - "validations[priority=30]"
          - state_machines.ValuationStandard
          - errors[ERR_VALUATION_STANDARD_NOT_ACTIVE]
        distinguishing_aspect: "A filing created while VM-88 v1 was ACTIVE pins v1; once v2 activates (retiring v1), validate of the pinned filing fails — stale reference detected at approval time."
        test_recipe:
          setup: ["State CA; insurer 90093; VM-88 v1 ACTIVE; filing pinned to v1 SUBMITTED; then VM-88 v2 created and activated (v1 RETIRED)"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff }
            - { call: "POST /naic/insurers", payload: { naic_code: "90093", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-88", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std1: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std1}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-88", reported_surplus_cents: 1000, asset_risk_cents: 100, underwriting_risk_cents: 0, other_risk_cents: 0, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id, f_pin: $.data.valuation_standard_version_label } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-88", version_label: "v2", guidance_text: "g2" }, as: Actuary, as_user_id: "actuary-1", captures: { std2: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std2}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
          trigger:
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "filing pinned valuation_standard_version_label == v1 at creation"
            - "validate after v2 activation -> ERR_VALUATION_STANDARD_NOT_ACTIVE (422); filing stays SUBMITTED, no RBCReport created"
      - name: coverage_cascade_skips_rejected_adoptions
        claim_type: conditional_cascade
        grounds:
          - state_machines.ModelAct.ADOPTED_to_PUBLISHED
          - state_machines.StateAdoption
        distinguishing_aspect: "The publish supersede cascade touches only PENDING_CERTIFICATION / CERTIFIED_* adoptions; a REJECTED_NOT_SIMILAR adoption is left untouched and its state gets no AUTO_COVERAGE review."
        test_recipe:
          setup: ["State CA; core act MDL-861 v1 PUBLISHED; CA's adoption certified NOT_SIMILAR (REJECTED_NOT_SIMILAR); core act MDL-861 v2 ADOPTED"]
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id, s_ca_v: $.data.version } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-861", version_label: "v1", title: "t", act_type: "MODEL_LAW", committee_name: "c", is_core: true }, as: AssociationStaff, captures: { a1: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${a1}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a1}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${a1}/close-ballot", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a1}/publish", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${a1}", state_code: "CA", adopted_citation: "CIC 861", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { ad1: $.data.id } }
            - { call: "POST /naic/adoptions/${ad1}/certify", payload: { variation_class: "NOT_SIMILAR" }, as: AssociationStaff, captures: { ad1_st: $.data.status } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-861", version_label: "v2", title: "t2", act_type: "MODEL_LAW", committee_name: "c", is_core: true }, as: AssociationStaff, captures: { a2: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${a2}", comment_window_start: "2026-11-01T00:00:00Z", comment_window_end: "2026-12-01T00:00:00Z" }, as: AssociationStaff, captures: { d2: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d2}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a2}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${a2}/close-ballot", payload: {}, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/model-acts/${a2}/publish", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/model-acts/${a1}/adoptions", payload: {}, as: AssociationStaff, captures: { ad1_after: "$.data[0].status" } }
            - { call: "GET /naic/states/${s_ca_id}/reviews", payload: {}, as: AssociationStaff }
          assert:
            - "StateAdoption.${ad1}.status == REJECTED_NOT_SIMILAR before publish and remains REJECTED_NOT_SIMILAR after (cascade skips terminal rejections)"
            - "ModelAct.${a1} is SUPERSEDED after v2 publishes"
            - "GET /naic/states/${s_ca_id}/reviews returns an empty list (no AUTO_COVERAGE review because hop 2 touched no CA adoption)"
      - name: version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.State.fields.version
        distinguishing_aspect: "A finalize-driven accreditation transition increments State.version by exactly 1 (1 -> 2) and refreshes updated_at."
        test_recipe:
          setup: ["State CA created (version 1); SCHEDULED review led by lead-1"]
