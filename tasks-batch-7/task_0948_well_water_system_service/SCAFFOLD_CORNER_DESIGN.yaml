              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /water-service/water-tests"
              payload: { well_profile_id: "${well2_id}", collected_by_technician_id: "${tech_id}", panel_type: "CHEMICAL", sample_datetime: "2026-06-01T00:00:00Z" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { hard_id: $.data.id }
            - call: "POST /water-service/water-tests/${hard_id}/lab-result"
              payload: { analyzed_at: "2026-06-01T06:00:00Z", nitrate_mg_l: 1.0, arsenic_mg_l: 0.001, lead_mg_l: 0.001, iron_mg_l: 0.10, hardness_gpg: 20.0 }
