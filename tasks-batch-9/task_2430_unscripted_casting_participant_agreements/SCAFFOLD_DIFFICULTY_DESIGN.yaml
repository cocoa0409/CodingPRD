              captures: { call_touch_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "OPEN_CALL", min_age: 18, max_age: 60, exclusivity_window_days: 0, venue_location_id: "${loc_c_id}", open_call_window_start_utc: "2026-08-11T00:00:00Z", open_call_window_end_utc: "2026-08-15T00:00:00Z", expected_attendance: 250 }
              as: CastingDirector
