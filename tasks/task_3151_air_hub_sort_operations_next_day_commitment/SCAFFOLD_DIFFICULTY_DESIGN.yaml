              as: SortOperator
            - call: "POST /airhub/packages/${pkg_q1}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_q1_v: $.data.version }
            - call: "POST /airhub/packages/${pkg_q2}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_q2}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
