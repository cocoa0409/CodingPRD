      - name: finalize_below_quorum_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_QUORUM_NOT_MET]
          - validations[priority=27]
          - calculations.committee_quorum_tally
          - state_machines.CompensationOffer.COMMITTEE_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Quorum is a CEIL over a snapshot: with eligible_voter_count 5 the floor is
          CEIL(0.60 * 5) == 3, so two unanimous APPROVE ballots are not enough even though
          100% of the cast votes favour the offer — a tally that confuses approval share
          with quorum passes this fixture wrongly. Adding a single third ballot flips the
          identical finalize request to APPROVED, so the boundary is pinned from both sides
          and the candidate only reaches OFFER_OUT on the second attempt.
