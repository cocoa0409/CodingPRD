          Category pair state x business_safety: the re-deliver attempt violates BOTH the p6 state
          precondition (session already DELIVERED -> ERR_SESSION_NOT_SCHEDULED) and the p8 safety
          gate (fractions_since_chart_review == 5 -> ERR_CHART_REVIEW_OVERDUE); the state error at
          priority 6 must win over the safety error at priority 8.
        test_recipe:
          setup:
            - "IMRT course 2000/10, plan approved; 6 fractions booked on weekdays 2026-08-03..10"
            - "f1..f5 delivered -> course.fractions_since_chart_review == 5 (gate armed)"
