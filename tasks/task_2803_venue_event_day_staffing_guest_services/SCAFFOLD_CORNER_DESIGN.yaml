              captures: { plan_id: $.data.id, base_empty: $.data.base_labor_cost_cents, proj_empty: $.data.projected_labor_cost_cents, hc_empty: $.data.total_required_headcount }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id, slot_cost: $.data.slot_labor_cost_cents }
            - call: "GET /staffing-plans/${plan_id}"
              as: StaffingCoordinator
              captures: { base_after_slot: $.data.base_labor_cost_cents, proj_after_slot: $.data.projected_labor_cost_cents, hc_after_slot: $.data.total_required_headcount }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Double charge at gate 4" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_1: $.data.id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_1}/refund-request"
              payload: { refund_requested_cents: 2000 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { requested: $.data.refund_requested_cents }
            - call: "GET /events/${ev_id}"
              as: GuestExperienceDirector
              captures: { remaining_after_ask: $.data.refund_budget_remaining_cents }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "sup-2"
              captures: { decided_status: $.data.refund_status, decided_cents: $.data.refund_approved_cents }
            - call: "GET /events/${ev_id}"
              as: GuestExperienceDirector
              captures: { remaining_after_decision: $.data.refund_budget_remaining_cents, approved_after_decision: $.data.refund_approved_total_cents }
          assert:
            - "${remaining_start} == 100000 and ${approved_start} == 0 at creation, and ${base_empty} == 0, ${proj_empty} == 0, ${hc_empty} == 0 for the slotless plan"
            - "${slot_cost} == 16333 (2 heads * 2000 cents/h * 245 min / 60 = 16333.33, ROUND_HALF_UP to the cent) is present in the creation response itself"
            - "${base_after_slot} == 16333, ${proj_after_slot} == 16333 and ${hc_after_slot} == 2 in the read that immediately follows the slot creation - the parent aggregate is not recomputed lazily on some later request"
            - "${requested} == 2000 while ${remaining_after_ask} == 100000 - filing an ask is deliberately not a ledger event, so 'immediate' does not mean 'eager'"
            - "${decided_status} == 'APPROVED' and ${decided_cents} == 2000 in the decision's own response body"
            - "${remaining_after_decision} == 98000 and ${approved_after_decision} == 2000 in the immediately following read - the grandparent ledger moved inside the same request that approved the refund"
            - "the ledger invariant 98000 + 2000 == 100000 holds at every observation point, so no intermediate read can ever see a torn total"
