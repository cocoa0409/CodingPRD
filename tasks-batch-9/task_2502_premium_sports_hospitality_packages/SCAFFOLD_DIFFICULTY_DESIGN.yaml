# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2502 — Premium Sports Hospitality Packages
#
# §1.8 difficulty design. Nine §0.5 rule_ids, two differentiated instances each
# = 18 instances. Every instance is grounded in SCAFFOLD.yaml §1.1–§1.6 and
# carries a test_recipe whose setup_api_calls / trigger are structured call
# objects. All ${vars} are bound by an earlier `captures:` in the same recipe.
# Every formula-derived assert is a literal that was computed by running the
# pinned formulas, not a re-statement of the formula.
#
# Shared fixture vocabulary used across the recipes (each recipe is
# self-contained and repeats what it needs):
#   logical clock start          2026-08-01T00:00:00Z (service default)
#   canonical event_date         2027-02-01T15:00:00.000Z  => days_to_event 184
#   canonical GOLD package       tickets_per_package 2, hotel_nights 4,
#                                transport_included true, min_margin_pct 0.1000
#     component set (sequence_no ASC):
#       1 TICKET     qty 2 unit_cost 24990 markup 0.1750 -> line_cost  49980, line_price 58727
#       2 HOTEL      qty 4 unit_cost 13745 markup 0.0750 -> line_cost  54980, line_price 59104
#       3 TRANSPORT  qty 1 unit_cost  7772 markup 0.1250 -> line_cost   7772, line_price  8744
#       4 EXPERIENCE qty 1 unit_cost 12340 markup 0.2250 -> line_cost  12340, line_price 15117
#     base_cost_cents 125072, component_price_subtotal_cents 141692,
#     list_price_cents 177115 (GOLD x1.25), margin_pct 0.2938
#   canonical booking net prices at list_price_cents 177115:
#     units  5 CORPORATE       no surcharge ->  824647   schedule [247394, 329859, 247394]
#     units 10 CORPORATE       no surcharge -> 1580574   schedule [474172, 632230, 474172]
#     units 10 CORPORATE       surcharge    -> 1637605
#     units 12 TRAVEL_PARTNER  surcharge    -> 1828252
#     units 15 TRAVEL_PARTNER  surcharge    -> 2285315
#   operator identities: u_ops (OperationsManager), u_rights (RightsManager),
#     u_pricer (CommercialManager), u_director (CommercialDirector),
#     u_csa (ClientServiceAgent), u_fin (FinanceController).
#     u_pricer != u_director is mandatory — validations[priority=51]
#     ERR_SEGREGATION_OF_DUTIES rejects a publish by the pricing operator.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations that each carry two named variants selected by state, not
  # by a request flag. Instance A is an aggregation read model over a whole
  # Event; instance B is a per-Booking settlement write. Different calculations,
  # different entities, different selectors.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: margin_report_provisional_vs_final_same_event
        grounds: >-
          calculations.event_margin_report with variants PROVISIONAL and FINAL;
          endpoints "GET /events/{id}/margin-report" (input variant?, inline output
          revenue_cents / cost_cents / unsold_units / unsold_exposure_cents /
          margin_cents / net_margin_cents / margin_pct);
          constants SALVAGE_RECOVERY_PCT = 0.35;
          entities.Booking.fulfillment_status and entities.Booking.cancellation_fee_cents;
          entities.RightsDeal.minimum_liability_cents; entities.HospitalityBuild.total_cost_cents;
          state_machines.Event SCHEDULED -> COMPLETED (which flips the default variant).
        distinguishing_aspect: >-
          Both variants are read off ONE frozen event, so nothing but the variant
          rule can explain the difference. PROVISIONAL recognises every live
          booking (fulfillment_status IN {RESERVED, ALLOCATED, CREDENTIALED,
          DELIVERED, REBOOK_PENDING}) and carries unsold released units at 100%
          of acquisition cost; FINAL recognises only DELIVERED net price plus
          retained CANCELLED cancellation fees and writes unsold units down by
          SALVAGE_RECOVERY_PCT. On this fixture revenue is 1580574 vs 1663039
          (the 82465 retained fee appears only in FINAL) and unsold exposure is
          320000 vs 208000, while cost_cents (700000) and unsold_units (40) are
          byte-identical in both responses. net_margin_cents therefore differs by
          exactly 194465 and margin_pct is 0.3547 vs 0.4540. An implementation
          with one revenue rule, or one that applies the salvage write-down in
          both branches, cannot match both responses.
        test_recipe:
          setup: >-
            One event with a single fully released ticket deal, one CORPORATE
            allocation block, one credentialed booking of 10 units and one
            cancelled booking of 5 units, one approved-and-ready hospitality
            build, then the clock advanced past the fixture and the event
            completed so that the booking mix contains exactly one DELIVERED and
            exactly one CANCELLED booking.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /allocation-blocks"
              payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { blk_id: "$.data.id" }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            # deal.version is read AFTER the tranche insert, because creating a
            # tranche re-runs rights_deal_minimum_liability and bumps the parent.
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - call: "POST /release-tranches/${tr_id}/confirm"
              payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }
              as: RightsManager
              as_user_id: u_rights
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b1_id: "$.data.id" }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - call: "POST /bookings/${b1_id}/allocate"
              payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }
              as: ClientServiceAgent
              as_user_id: u_csa
            - call: "POST /hospitality-builds"
              payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 40, catering_covers: 24, staff_count: 6, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }
              as: OperationsManager
              as_user_id: u_ops
              captures: { hb_id: "$.data.id" }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin }
            - { call: "POST /hospitality-builds/${hb_id}/ready", payload: {}, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b1_id}/issue-credentials", payload: {}, as: ClientServiceAgent, as_user_id: u_csa }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b2_id: "$.data.id" }
            # b2 is cancelled while the event is still SCHEDULED and 184 days
            # out, so it retains a TIER_SCHEDULE fee of round_half_up(824647 * 0.10).
            - { call: "POST /bookings/${b2_id}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2_fee: "$.data.cancellation_fee_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-02-01T18:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights }
          trigger:
            - call: "GET /events/${ev_id}/margin-report"
              payload: { variant: "PROVISIONAL" }
              as: FinanceController
              as_user_id: u_fin
              captures: { p_rev: "$.data.revenue_cents", p_expo: "$.data.unsold_exposure_cents", p_net: "$.data.net_margin_cents", p_pct: "$.data.margin_pct" }
            - call: "GET /events/${ev_id}/margin-report"
              payload: { variant: "FINAL" }
              as: FinanceController
              as_user_id: u_fin
              captures: { f_rev: "$.data.revenue_cents", f_expo: "$.data.unsold_exposure_cents", f_net: "$.data.net_margin_cents", f_pct: "$.data.margin_pct" }
          assert: >-
            The PROVISIONAL response has variant == "PROVISIONAL",
            revenue_cents == 1580574, rights_cost_cents == 480000,
            build_cost_cents == 220000, cost_cents == 700000, unsold_units == 40,
            unsold_exposure_cents == 320000, margin_cents == 880574,
            net_margin_cents == 560574 and margin_pct == 0.3547.
            The FINAL response has variant == "FINAL",
            revenue_cents == 1663039, the SAME rights_cost_cents == 480000,
            build_cost_cents == 220000, cost_cents == 700000 and
            unsold_units == 40, but unsold_exposure_cents == 208000,
            margin_cents == 963039, net_margin_cents == 755039 and
            margin_pct == 0.4540.
            ${p_rev} != ${f_rev} and ${p_expo} != ${f_expo} and
            ${p_net} != ${f_net} and ${p_pct} != ${f_pct}.
            ${b2_fee} == 82465 and that 82465 is exactly f_rev - p_rev, proving
            the retained cancellation fee enters FINAL only.
            f_expo == 208000 is exactly round_half_up(320000 * (1 - 0.35)),
            proving the salvage write-down is applied in FINAL only.
            GET /bookings?package_product_id=${pkg_id} shows b1 with
            fulfillment_status == "DELIVERED" and net_price_cents == 1580574 and
            b2 with fulfillment_status == "CANCELLED" and net_price_cents == 824647,
            so the two revenue figures are drawn from the same two rows.

      - name: cancellation_fee_tier_schedule_vs_cost_recovery_same_booking_shape
        grounds: >-
          calculations.booking_cancellation_settlement with variants TIER_SCHEDULE
          and COST_RECOVERY; constants TIER_SCHEDULE_PCT and
          NON_TICKET_IRRECOVERABLE_PCT = 0.20;
          endpoints "POST /bookings/{id}/cancel" and "POST /events/{id}/postpone";
          entities.Booking.settlement_variant / cancellation_fee_cents /
          refund_cents / balance_due_cents / payment_status;
          entities.PackageProduct.base_cost_cents;
          state_machines.Event SCHEDULED -> POSTPONED;
          state_machines.Booking RESERVED -> CANCELLED and REBOOK_PENDING -> CANCELLED;
          calculations.client_credit_exposure (CANCELLED + SETTLEMENT_DUE bookings
          contribute balance_due_cents).
        distinguishing_aspect: >-
          The two bookings are created in the same request shape against the same
          package on the same day — identical units (5), identical
          net_price_cents (824647), identical paid_cents (0). The ONLY difference
          at cancel time is Event.status, which is the variant selector, and it is
          a field of a different entity than the one being settled. TIER_SCHEDULE
          scales the fee off net_price_cents and days_to_event (184 days => the
          0.10 band => 82465); COST_RECOVERY ignores both and caps the fee at
          min(net_price_cents, ticket_cost + non_ticket_cost) where the booking
          was never allocated so ticket_cost is 0 and non_ticket_cost is
          round_half_up(125072 * 5 * 0.20) = 125072. The cost-recovery fee is
          therefore LARGER (125072 > 82465) than the most generous tier band, so
          an implementation that models one variant as a discount of the other, or
          that takes min/max of the two, gets a different number for at least one
          of the two bookings.
        test_recipe:
          setup: >-
            One event with a fully released ticket deal and no allocation blocks
            (so neither booking can be allocated and the cost-recovery ticket leg
            is provably zero), the canonical GOLD package published, and two
            CORPORATE bookings of 5 units each created back to back on the same
            logical day.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /rights-deals"
              payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 60, guaranteed_minimum_units: 40, unit_cost_cents: 8000 }
              as: RightsManager
              as_user_id: u_rights
              captures: { deal_id: "$.data.id" }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /release-tranches"
              payload: { rights_deal_id: "${deal_id}", promised_units: 60, promised_release_at: "2026-10-01T00:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { tr_id: "$.data.id" }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            # released_units 60 == contracted_units 60 => FULLY_RELEASED, so the
            # deal is NOT in the exposure set and neither booking carries a
            # guarantee surcharge. Both nets are exactly 824647.
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 60, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
              as_user_id: u_pricer
              captures: { pkg_id: "$.data.id" }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET",     descriptor: "Category 1 seat pair",       quantity: 2, unit_cost_cents: 24990, markup_pct: 0.1750, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "HOTEL",      descriptor: "Five-star room night",      quantity: 4, unit_cost_cents: 13745, markup_pct: 0.0750, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TRANSPORT",  descriptor: "Chauffeured transfer",      quantity: 1, unit_cost_cents:  7772, markup_pct: 0.1250, sequence_no: 3 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitch-side pre-match access", quantity: 1, unit_cost_cents: 12340, markup_pct: 0.2250, sequence_no: 4 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version", base_cost: "$.data.base_cost_cents" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - call: "POST /clients"
              payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { cl_id: "$.data.id" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b1_id: "$.data.id", b1_net: "$.data.net_price_cents" }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { b2_id: "$.data.id", b2_net: "$.data.net_price_cents" }
          trigger:
            - call: "POST /bookings/${b1_id}/cancel"
              payload: {}
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { v1: "$.data.settlement_variant", fee1: "$.data.cancellation_fee_cents", bal1: "$.data.balance_due_cents" }
            - { call: "POST /events/${ev_id}/postpone", payload: {}, as: RightsManager, as_user_id: u_rights }
            - call: "POST /bookings/${b2_id}/cancel"
              payload: {}
              as: ClientServiceAgent
              as_user_id: u_csa
              captures: { v2: "$.data.settlement_variant", fee2: "$.data.cancellation_fee_cents", bal2: "$.data.balance_due_cents" }
          assert: >-
            ${b1_net} == 824647 and ${b2_net} == 824647 and ${base_cost} == 125072,
            establishing that the two bookings are numerically identical before
            the triggers.
            b1: ${v1} == "TIER_SCHEDULE", ${fee1} == 82465, refund_cents == 0,
            ${bal1} == 82465, payment_status == "SETTLEMENT_DUE",
            fulfillment_status == "CANCELLED".
            b2: ${v2} == "COST_RECOVERY", ${fee2} == 125072, refund_cents == 0,
            ${bal2} == 125072, payment_status == "SETTLEMENT_DUE",
            fulfillment_status == "CANCELLED", and allocation_block_id == null
            (which is why the ticket leg of the cost-recovery fee is 0 and the
            whole fee is the non-ticket leg round_half_up(125072 * 5 * 0.20)).
            ${fee2} > ${fee1} by exactly 42607.
            GET /events/${ev_id} shows status == "POSTPONED" and
            postponement_count == 1, i.e. the only thing that changed between the
            two cancels was the Event, not the Bookings.
            GET /clients/${cl_id} shows outstanding_cents == 207537
            (= 82465 + 125072, the two settlement balances) and
            client_status == "ACTIVE".
            GET /payment-installments?booking_id=${b1_id}&installment_kind=SETTLEMENT
            returns exactly one line with amount_cents == 82465, and the same
            query for ${b2_id} returns exactly one line with amount_cents == 125072.

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Instance A is mode (b): the same operands with the rounding boundary moved.
  # Instance B is mode (c): the same operands with the percentage BASE moved.
  # (calculations.event_fulfillment_risk_score is a third, mode-(a), example —
  #  nested min/max over four independent inputs — exercised by rule 4.)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: component_line_rounding_before_summation_not_after
        grounds: >-
          calculations.package_component_line_pricing (line_price_cents =
          round_half_up(line_cost_cents * (1 + markup_pct)) per component in
          sequence_no ASC order, THEN summed);
          calculations.package_list_pricing (list_price_cents =
          round_half_up(component_price_subtotal_cents * TIER_MULTIPLIER[tier]),
          GOLD = 1.25, margin_pct = round_half_up_4((list - base) / list));
          entities.PackageComponent.line_cost_cents / line_price_cents;
          entities.PackageProduct.base_cost_cents /
          component_price_subtotal_cents / list_price_cents / margin_pct;
          endpoints "POST /package-components" and "POST /package-products/{id}/price";
          state_machines.PackageProduct DRAFT -> PRICED.
        distinguishing_aspect: >-
          Mode (b): identical operands, the rounding boundary moved by one step.
          Every one of the four component lines has a raw price ending in exactly
          .5 cents (58726.5, 59103.5, 8743.5, 15116.5), so round-half-up per line
          adds exactly 0.5 four times. Rounding each line first and then summing
          gives component_price_subtotal_cents == 141692; summing the raw line
          prices and rounding once gives 141690 — a 2-cent divergence that then
          propagates through the GOLD 1.25 multiplier as 177115 vs
          round_half_up(177112.5) == 177113. The per-component line_price_cents
          values are also asserted individually, so an implementation that stores
          unrounded line prices and only rounds the subtotal is caught twice: at
          the component rows and at the package totals.
        test_recipe:
          setup: >-
            One SCHEDULED event and one DRAFT package with exactly the four
            canonical components, chosen so that each raw line price lands
            precisely on a half cent. No rights deal is needed because pricing
            (unlike publishing) does not require one.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - call: "POST /events"
              payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }
              as: RightsManager
              as_user_id: u_rights
              captures: { ev_id: "$.data.id" }
            - call: "POST /package-products"
              payload: { event_id: "${ev_id}", name: "Gold Hospitality", tier: "GOLD", tickets_per_package: 2, hotel_nights: 4, transport_included: true, min_margin_pct: 0.1000 }
              as: CommercialManager
