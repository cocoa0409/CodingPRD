        test_recipe:
          setup:
            - "The authorized store."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
