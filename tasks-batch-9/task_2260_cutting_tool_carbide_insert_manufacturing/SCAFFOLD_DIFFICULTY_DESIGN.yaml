              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${crun_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", coating_recipe_id: "${recipe_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial1_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial1_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 6, vb_um: 150 }, { minutes: 12, vb_um: 225 }, { minutes: 18, vb_um: 290 }, { minutes: 24, vb_um: 320 }, { minutes: 30, vb_um: 340 }], measured_surface_ra_um: 1.20 }
              as: ApplicationEngineer
              as_user_id: "op-1"
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-2", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 20, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { trial2_id: $.data.id }
            - call: "POST /tooling/machining-trials/${trial2_id}/complete"
              payload: { wear_measurements: [{ minutes: 0, vb_um: 0 }, { minutes: 8, vb_um: 160 }, { minutes: 16, vb_um: 250 }, { minutes: 24, vb_um: 305 }, { minutes: 32, vb_um: 330 }], measured_surface_ra_um: 1.50 }
              as: ApplicationEngineer
              as_user_id: "op-2"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/submit"
              as: ApplicationEngineer
              as_user_id: "ae-7"
            - call: "POST /tooling/qualification-dossiers/${dossier_id}/approve"
              payload: { decision_note: "Qualified on P and M" }
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              as_user_id: "qa-3"
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-1", name: "Acme Machining", tier: "PREFERRED", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-1", quantity: 100, expedite_requested: false, expected_product_version: "${p_ver}" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /tooling/tool-orders/${order_id}/submit"
              as: ApplicationEngineer
          trigger:
            - call: "POST /tooling/tool-orders/${order_id}/confirm"
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades/${grade_id}/revise"
              payload: { co_binder_pct: 6.5, wc_grain_um: 1.1, hardness_hv: 1620, trs_mpa: 2150, revision_note: "Finer WC grain for edge-line stability" }
              as: MetallurgyEngineer
            - call: "POST /tooling/tool-orders/${order_id}/confirm"
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "after the first confirm, ToolOrder.${order_id}.status == CONFIRMED"
            - "after the grade revision, ToolOrder.${order_id}.status == ENGINEERING_REVIEW"
            - "${err} == ERR_GRADE_NOT_QUALIFIED"
            - "HTTP status == 409 for the second confirm"
            - "${err} != ERR_PINNED_REVISION_STALE (priority 18 pre-empts the priority 21 pin check even though the pin is also stale)"
            - "ToolOrder.${order_id}.status == ENGINEERING_REVIEW (unchanged by the rejected confirm)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: coating_chamber_aggregate_area_within_overlap
        grounds:
          - validations[priority=27]
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
          - entities.CoatingRun.fields.loaded_area_cm2
          - entities.CoatingRun.fields.chamber_id
        distinguishing_aspect: |
          Resource: the deposition chamber, with HALF-OPEN [start, end) interval semantics and a
          shareable 4000.00 cm2 area capacity — several runs may overlap as long as the instantaneous
          sum fits, exactly 4000.00 is accepted, and a run that starts precisely when another ends does
          not overlap at all, so two back-to-back fully-loaded batches are legal.
        test_recipe:
          setup:
            - "Validated-or-not PVD recipe PVD-TIALN-3 (recipe validation is irrelevant to scheduling)"
            - "One SCHEDULED run in chamber CH1 over [2026-08-10T06:00Z, 12:00Z) carrying 2500.00 cm2"
            - "Logical clock left at its 2026-08-01T00:00:00Z default so every window is in the future"
          setup_api_calls:
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T16:00:00Z", loaded_area_cm2: 1600.00 }
              as: CoatingEngineer
              captures: { err: $.data.error_id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T16:00:00Z", loaded_area_cm2: 1500.00 }
              as: CoatingEngineer
              captures: { run2_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-10T16:00:00Z", window_end: "2026-08-10T22:00:00Z", loaded_area_cm2: 4000.00 }
              as: CoatingEngineer
              captures: { run3_id: $.data.id }
          assert:
            - "${err} == ERR_CHAMBER_CAPACITY_EXCEEDED"
            - "HTTP status == 409 for the 1600.00 cm2 attempt (2500.00 + 1600.00 = 4100.00 over [10:00, 12:00))"
            - "CoatingRun.${run2_id}.status == SCHEDULED (2500.00 + 1500.00 = 4000.00 exactly at capacity is accepted)"
            - "CoatingRun.${run3_id}.status == SCHEDULED (starts exactly when run2 ends, so a full 4000.00 cm2 load is legal)"
            - "CoatingRun.${run1_id}.loaded_area_cm2 == 2500.00 (unchanged)"
            - "exactly three CoatingRun rows exist for chamber CH1"

      - name: grinding_cell_exclusive_with_setup_buffer
        grounds:
          - validations[priority=28]
          - validations[priority=29]
          - errors.ERR_CELL_DOUBLE_BOOKED
          - errors.ERR_CELL_BUFFER_CONFLICT
          - entities.GrindingRun.fields.cell_id
        distinguishing_aspect: |
          A different resource entity (the grinding cell, not the coating chamber) with the opposite
          interval semantics: CLOSED [start, end] and exclusive occupancy, so touching endpoints DO
          collide, and beyond the collision the cell also enforces a 45-minute changeover gap — 44
          minutes is refused, exactly 45 is accepted, and a different cell never interacts.
        test_recipe:
          setup:
            - "GrindingWheel WH-1 with initial_life_units 100000 so no dressing threshold interferes"
            - "A solid-carbide end mill product EM-10-1 with grind_units_per_tool 20"
            - "One SCHEDULED run in CELL_A over the closed window [2026-08-12T06:00Z, 10:00Z]"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { em_product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-1", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T10:00:00Z", planned_units: 10 }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T10:00:00Z", window_end: "2026-08-12T12:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { err_touch: $.data.error_id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T10:44:00Z", window_end: "2026-08-12T12:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { err_buffer: $.data.error_id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T10:45:00Z", window_end: "2026-08-12T12:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { run_ok_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_B", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T10:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { run_other_cell_id: $.data.id }
          assert:
            - "${err_touch} == ERR_CELL_DOUBLE_BOOKED"
            - "HTTP status == 409 for the touching-endpoint attempt (closed intervals collide at 10:00)"
            - "${err_buffer} == ERR_CELL_BUFFER_CONFLICT"
            - "HTTP status == 409 for the 44-minute gap"
            - "GrindingRun.${run_ok_id}.status == SCHEDULED (a gap of exactly 45 minutes is accepted)"
            - "GrindingRun.${run_other_cell_id}.status == SCHEDULED (CELL_B is a separate resource and the identical window is free)"
            - "GrindingWheel.${wheel_id}.consumed_life_units == 0 (scheduling charges no life)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: wheel_life_conserved_across_complete_and_void
        grounds:
          - calculations.wheel_life_consumption
          - state_machines.GrindingRun.COMPLETED_to_VOIDED
          - state_machines.GrindingWheel.DRESSING_to_AVAILABLE
          - entities.GrindingWheel.fields.consumed_life_units
          - entities.GrindingWheel.fields.remaining_life_units
        distinguishing_aspect: |
          Conserved quantity: abrasive wheel life units. consumed_life_units + remaining_life_units must
          equal initial_life_units (1000) at every checkpoint; voiding the completed run must subtract
          exactly the stored per-run charge (860), zero the run's own charge, walk the wheel back
          DRESSING -> AVAILABLE and leave dress_count untouched, with no drift and no double reversal.
        test_recipe:
          setup:
            - "GrindingWheel WH-1 with initial_life_units 1000 and DRESS_THRESHOLD_UNITS 150"
            - "Product EM-10-1 with grind_units_per_tool 20"
            - "A run in CELL_A over [2026-08-12T06:00Z, 10:00Z] with planned_units 43, completed at the clock instant 10:00 with produced 40 / scrap 3 and a 4.5 um diameter deviation"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { em_product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-1", spec_code: "D64-C100", initial_life_units: 1000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T10:00:00Z", planned_units: 43 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T10:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-runs/${run_id}/complete"
              payload: { produced_units: 40, scrap_units: 3, measured_diameter_dev_um: 4.5 }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/grinding-runs/${run_id}/void"
              payload: { void_reason: "Metrology dispute; the deviation record is not traceable" }
              as: QualityApprover
              as_user_id: "qa-3"
          assert:
            - "before the void: GrindingRun.${run_id}.consumed_life_units == 860 and tolerance_class == IT6"
            - "before the void: GrindingWheel.${wheel_id}.consumed_life_units == 860, remaining_life_units == 140, status == DRESSING"
            - "before the void: consumed_life_units + remaining_life_units == 1000"
            - "after the void: GrindingRun.${run_id}.status == VOIDED, consumed_life_units == 0, produced_units == 0, scrap_units == 0, tolerance_class == null"
            - "after the void: GrindingWheel.${wheel_id}.consumed_life_units == 0 and remaining_life_units == 1000"
            - "after the void: consumed_life_units + remaining_life_units == 1000 (invariant restored exactly, no drift)"
            - "after the void: GrindingWheel.${wheel_id}.status == AVAILABLE and dress_count == 0 (the reversal is not a dressing event)"

      - name: regrind_credit_conserved_across_intake_and_scrap
        grounds:
          - state_machines.ReconditionJob.INSPECTED_to_SCRAPPED
          - calculations.recondition_life_extension
          - entities.Customer.fields.regrind_credit_cents
          - entities.Customer.fields.reserved_credit_cents
          - entities.ReconditionJob.fields.reserved_credit_cents
        distinguishing_aspect: |
          A different conserved quantity — customer reconditioning credit in cents:
          regrind_credit_cents + reserved_credit_cents must stay at the opening 50000 through intake
          (which moves 18500 from available to reserved) and through scrapping (which releases the
          reservation back rather than paying a rebate), so the compensation is a release, not a payment,
          and rebate_cents must stay 0.
        test_recipe:
          setup:
            - "Product EM-10-1 with nominal_length_mm 100.0, min_regrind_length_mm 70.0, regrind_step_mm 2.5"
            - "Customer CU-1 with an opening regrind_credit_cents of 50000"
            - "First-pass ReconditionJob RJ-1 for 10 tools, inspected at a measured length of 68.0 mm (below the 70.0 mm floor)"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { em_product_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-1", name: "Acme Machining", tier: "PREFERRED", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id, cust_ver: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${em_product_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${cust_ver}" }
              as: ProductionPlanner
              captures: { job_id: $.data.id }
            - call: "POST /tooling/recondition-jobs/${job_id}/inspect"
              payload: { units_inspected: 10, measured_length_mm: 68.0, measured_corner_wear_um: 400 }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/recondition-jobs/${job_id}/scrap"
              payload: { scrap_reason: "Measured length is below the minimum regrind length" }
              as: QualityApprover
              as_user_id: "qa-3"
          assert:
            - "at intake: ReconditionJob.${job_id}.reserved_credit_cents == 18500"
            - "at intake: Customer.${customer_id}.regrind_credit_cents == 31500 and reserved_credit_cents == 18500 (sum 50000)"
            - "after inspect: ReconditionJob.${job_id}.remaining_regrinds == 0, life_extension_pct == 0.0, scrap_recommended == true"
            - "after inspect: ReconditionJob.${job_id}.warranted_life_extension_pct == 35.0 (the pass-history variant is measurement-blind)"
            - "after scrap: ReconditionJob.${job_id}.status == SCRAPPED, reserved_credit_cents == 0, units_returned == 0, rebate_cents == 0"
            - "after scrap: Customer.${customer_id}.regrind_credit_cents == 50000 and reserved_credit_cents == 0 (sum 50000, invariant restored)"
            - "after scrap: Customer.${customer_id}.regrind_credit_cents != 59000 (a release is not a rebate payment)"
