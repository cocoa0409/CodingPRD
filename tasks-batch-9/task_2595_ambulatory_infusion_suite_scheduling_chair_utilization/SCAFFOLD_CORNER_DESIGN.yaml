      - name: a_second_daily_sweep_at_the_same_clock_reports_all_zero_counters
        claim_type: idempotency
        grounds:
          - calculations.daily_sweep_run
          - endpoints[POST /infusion-centers/{id}/daily-sweep]
          - state_machines[DrugLot].transitions[AVAILABLE -> EXPIRED]
        distinguishing_aspect: |
          The ops-run checkpoint is idempotent at a fixed clock: the first sweep flips
          one lot to EXPIRED and reports expired_lot_count 1, the immediately repeated
          sweep reports every one of the four counters as 0 while the lot stays EXPIRED
          — the step-1 selector reads status IN {AVAILABLE, DEPLETED}, so an already
          EXPIRED row is invisible on the second pass and is not double-counted.
        test_recipe:
          setup:
            - "One center and one drug. The clock is rewound to 2026-07-20T00:00:00Z, lot LOT-A is received with expires_on 2026-07-31T00:00:00Z, and the clock is then advanced to 2026-08-02T00:00:00Z."
            - "No appointments exist, so step 4 has nothing to sweep on either pass."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-20T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-A", units_received: 10, expires_on: "2026-07-31T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: Scheduler
          trigger:
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-02" }
              as: Scheduler
              captures: { first_lots: $.data.expired_lot_count }
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-02" }
              as: Scheduler
              captures: { second_lots: $.data.expired_lot_count, second_auths: $.data.expired_authorization_count, second_preps: $.data.wasted_preparation_count, second_no_shows: $.data.no_show_count }
          assert:
            - "First sweep HTTP status == 200 and ${first_lots} == 1"
            - "First sweep also reports expired_authorization_count == 0, wasted_preparation_count == 0 and no_show_count == 0"
            - "DrugLot.${lot1}.status == 'EXPIRED' after the first sweep"
            - "${second_lots} == 0 and ${second_auths} == 0 and ${second_preps} == 0 and ${second_no_shows} == 0"
            - "DrugLot.${lot1}.status == 'EXPIRED' still, with units_available unchanged at 10"
            - "Both responses echo center_id == ${ctr} and service_date == '2026-08-02'"

