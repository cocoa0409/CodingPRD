          - errors[ERR_MERCHANT_NOT_ACTIVE]
          - entities.FraudCase.fields.merchant_id
        distinguishing_aspect: |
          FraudCase -> Merchant dependency (a different entity pair than Participant -> Member): confirming
          a reported fraud case is rejected with ERR_MERCHANT_NOT_ACTIVE when the merchant was TERMINATED
          via the participant-termination cascade, and succeeds for the twin case whose merchant is still
          ACTIVE.
        test_recipe:
          setup:
            - "Acquirer A ACTIVE; participant P ACTIVE under A; merchants Mc1 (under P) and Mc2 (directly under A) both ACTIVE"
            - "Fraud cases F1 on Mc1 and F2 on Mc2 both REPORTED"
            - "P suspended then terminated -> Mc1 cascaded to TERMINATED; Mc2 remains ACTIVE"
