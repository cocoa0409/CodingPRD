      setup:
      - ACTIVE program, RESIDENTIAL district (cap 3000), crew; MUNICIPAL pole 250W audit-accepted; CCT_WAIVER approved (5000K, valid_until 2026-08-10); route 2026-08-03..2026-08-08 with the pole, RELEASED
