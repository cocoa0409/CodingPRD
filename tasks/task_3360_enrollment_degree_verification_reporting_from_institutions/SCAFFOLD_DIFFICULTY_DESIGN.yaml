            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Boundary Below", date_of_birth: "2004-02-01", career_level: "UNDERGRAD", credit_hours: 11.99, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S2", full_name: "Boundary Exact", date_of_birth: "2004-02-02", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
