  - section: calculations
    instances:
      - name: stratification_recency_factor_full_at_exactly_ninety_days
        claim_type: constants_applied
        grounds: ["calculations.risk_stratification_score", "entities.RiskStratification.fields.utilization_points"]
        distinguishing_aspect: "RECENCY_FULL_DAYS is inclusive: an ED visit dated exactly 90 days before the clock (2026-05-03 against 2026-08-01) contributes the full 8 points, while one dated 91 days back contributes 4."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Member A has one CLOSED ED visit on 2026-05-03T00:00:00Z; member B has one CLOSED ED visit on 2026-05-02T00:00:00Z. Both have chronic_condition_count 0 and no enrollments."
          setup_api_calls:
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5201", full_name: "Edge A", birth_date: "1970-01-01", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-5202", full_name: "Edge B", birth_date: "1970-01-02", state_code: "CA", chronic_condition_count: 0 }
              as: ProgramAdmin
              captures: { m_b: $.data.id }
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_a}", event_type: "ED_VISIT", occurred_at: "2026-05-03T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_b}", event_type: "ED_VISIT", occurred_at: "2026-05-02T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /care-management/members/${m_a}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { a_util: $.data.utilization_points, a_score: $.data.score }
            - call: "POST /care-management/members/${m_b}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { b_util: $.data.utilization_points, b_score: $.data.score }
          assert:
            - "${a_util} == 8.0 and ${a_score} == 8"
            - "${b_util} == 4.0 and ${b_score} == 4"
            - "both stratifications report tier == LOW and included_event_count == 1"

