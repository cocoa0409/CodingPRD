            - "response.error.code == \"ERR_COMPLAINT_NOT_FOUND\""

      - name: change_notification_get_with_an_unminted_id_returns_notification_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /gfco/change-notifications/{notificationId}"
          - validations.priority_4
          - errors.ERR_CHANGE_NOTIFICATION_NOT_FOUND
        distinguishing_aspect: |
          The change-notification read completes the thirteen-code 404 family; its path
          parameter is {notificationId} while its error code is spelled
          ERR_CHANGE_NOTIFICATION_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /gfco/change-notifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "adm-1"
          assert:
            - "response.status == 404"
            - "response.error.code == \"ERR_CHANGE_NOTIFICATION_NOT_FOUND\""

  - section: state_machines
    instances:
      - name: audit_creation_starts_in_scheduled_with_zeroed_finding_counters
        claim_type: initial_state
        grounds:
          - state_machines.Audit.initial_state
          - endpoints."POST /gfco/audits"
          - entities.Audit.fields.status
          - entities.Audit.fields.finding_count
          - entities.Audit.fields.provisional_score
        distinguishing_aspect: |
          A newly scheduled audit occupies the machine's initial state with both finding
          counters at zero and BOTH score fields null - the provisional score is not
          computed until the close, so an implementation that eagerly scores an empty audit
          at 100 fails here. lead_auditor_user_id is also still null because the auditor is
          only bound at start, not at scheduling.
        test_recipe:
          setup:
            - "One applicant with one facility; no audits exist."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 201"
            - "response.data.facility_id == ${fac_id}"
            - "response.data.audit_type == \"INITIAL\""
            - "response.data.status == \"SCHEDULED\""
            - "response.data.finding_count == 0"
            - "response.data.critical_finding_count == 0"
            - "response.data.provisional_score == null"
            - "response.data.final_score == null"
            - "response.data.lead_auditor_user_id == null"
            - "response.data.closed_by_user_id == null"
            - "response.data.closed_on == null"
            - "response.data.version == 1"
            - "Facility.${fac_id}.last_closed_audit_outcome == \"NONE\""

      - name: audit_start_moves_scheduled_to_in_progress_and_binds_the_lead_auditor
        claim_type: valid_transition
        grounds:
          - state_machines.Audit.transitions.SCHEDULED_to_IN_PROGRESS
          - endpoints."POST /gfco/audits/{auditId}/start"
          - entities.Audit.fields.lead_auditor_user_id
        distinguishing_aspect: |
          The start transition is legal only once the clock has reached onsite_start_at, and
          its single side effect is to bind lead_auditor_user_id to the calling auditor's
          X-User-ID. The scores must still be null - starting an audit computes nothing -
          and the facility's last_closed_audit_outcome must stay NONE because no audit has
          closed.
        test_recipe:
          setup:
            - "One applicant with one facility and one SCHEDULED INITIAL audit over [2026-08-10T09:00Z, 2026-08-10T17:00Z)."
            - "The clock is then advanced to exactly the audit's onsite_start_at."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id, aud_v: $.data.version }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 200"
            - "response.data.id == ${aud_id}"
            - "response.data.status == \"IN_PROGRESS\""
            - "response.data.lead_auditor_user_id == \"aud-1\""
            - "response.data.provisional_score == null"
            - "response.data.final_score == null"
            - "response.data.closed_on == null"
            - "Facility.${fac_id}.last_closed_audit_outcome == \"NONE\""
            - "GET /gfco/audits with facility_id=${fac_id} and status=IN_PROGRESS returns total_count == 1"

      - name: audit_start_before_the_onsite_window_opens_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Audit.transitions.SCHEDULED_to_IN_PROGRESS.preconditions
          - validations.priority_11
          - errors.ERR_INVALID_AUDIT_STATE
          - endpoints."POST /gfco/_clock/set_current_utc"
        distinguishing_aspect: |
          The start transition carries a temporal precondition as well as a status one: with
          the clock one second before onsite_start_at the audit is in the right state and
          still cannot start. The audit must remain SCHEDULED with lead_auditor_user_id null,
          proving the rejection happened before any side effect ran.
        test_recipe:
          setup:
            - "One applicant with one facility and one SCHEDULED audit over [2026-08-10T09:00Z, 2026-08-10T17:00Z)."
            - "The clock is advanced to 2026-08-10T08:59:59Z, one second before the window opens."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:59:59Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_INVALID_AUDIT_STATE\""
            - "Audit.${aud_id}.status == \"SCHEDULED\""
            - "Audit.${aud_id}.lead_auditor_user_id == null"
            - "Audit.${aud_id}.version == 1"

      - name: audit_close_from_scheduled_without_starting_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Audit.transitions.IN_PROGRESS_to_CLOSED_PASS.preconditions
          - validations.priority_11
          - errors.ERR_INVALID_AUDIT_STATE
          - endpoints."POST /gfco/audits/{auditId}/close"
        distinguishing_aspect: |
          close is not in SCHEDULED's transition list, so it must be refused even when the
          clock is past onsite_end_at and every attestation in the payload is true: the
          machine has no SCHEDULED -> CLOSED_* edge. No score may be written and the
          facility's audit summary must stay NONE.
        test_recipe:
          setup:
            - "One applicant with one facility whose sanitation validation is VALIDATED, so the close's other preconditions are satisfied."
            - "One SCHEDULED audit over [2026-08-10T09:00Z, 2026-08-10T17:00Z) that was never started."
            - "The clock is advanced to 2026-08-11T00:00:00Z, past the audit's onsite_end_at."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /gfco/facilities/${fac_id}/sanitation-validation"
              payload: { swab_ppm: 3.0, method: "G12_ELISA", validated_on: "2026-08-01T00:00:00Z" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_INVALID_AUDIT_STATE\""
            - "Audit.${aud_id}.status == \"SCHEDULED\""
            - "Audit.${aud_id}.provisional_score == null"
            - "Audit.${aud_id}.final_score == null"
            - "Audit.${aud_id}.closed_by_user_id == null"
            - "Facility.${fac_id}.last_closed_audit_outcome == \"NONE\""

      - name: audit_close_without_a_validated_sanitation_dimension_is_rejected
        claim_type: guarded_transitions
        grounds:
          - state_machines.Audit.transitions.IN_PROGRESS_to_CLOSED_PASS.preconditions
          - validations.priority_19
          - errors.ERR_FACILITY_SANITATION_NOT_VALIDATED
          - state_machines.Facility.initial_state
        distinguishing_aspect: |
          The close transition is guarded by a DIFFERENT entity's state dimension: the
          facility's sanitation_validation_status must read VALIDATED at the moment of the
          call. With an UNVALIDATED facility the audit is in the right state, the clock is
          past onsite_end_at and the auditor attests sanitation_validation_reviewed = true -
          and the attestation cannot substitute for the facility's own record, so the close
          is refused and the audit stays IN_PROGRESS, still closable after validation.
        test_recipe:
          setup:
            - "One applicant with one facility that has never had a sanitation validation recorded, so sanitation_validation_status is UNVALIDATED."
            - "One audit over [2026-08-10T09:00Z, 2026-08-10T17:00Z) that has been started and is IN_PROGRESS."
            - "The clock is advanced to 2026-08-10T17:00:00Z, exactly the audit's onsite_end_at."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/facilities"
              payload: { applicant_id: "${app_id}", site_name: "Plant 4", air_handling_class: "FILTERED_ZONED", shared_equipment_present: true, gluten_containing_operations: "ADJACENT_LINES" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { fac_id: $.data.id, fac_san: $.data.sanitation_validation_status }
            - call: "POST /gfco/audits"
              payload: { facility_id: "${fac_id}", audit_type: "INITIAL", onsite_start_at: "2026-08-10T09:00:00Z", onsite_end_at: "2026-08-10T17:00:00Z" }
              as: FieldAuditor
              as_user_id: "aud-1"
              captures: { aud_id: $.data.id }
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/audits/${aud_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "aud-1"
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /gfco/audits/${aud_id}/close"
              payload: { shared_equipment_verified: true, air_handling_verified: true, sanitation_validation_reviewed: true }
              as: FieldAuditor
              as_user_id: "aud-1"
          assert:
            - "response.status == 422"
            - "response.error.code == \"ERR_FACILITY_SANITATION_NOT_VALIDATED\""
            - "${fac_san} == \"UNVALIDATED\""
            - "Audit.${aud_id}.status == \"IN_PROGRESS\""
            - "Audit.${aud_id}.provisional_score == null"
            - "Audit.${aud_id}.closed_on == null"
            - "Facility.${fac_id}.sanitation_validation_status == \"UNVALIDATED\""
            - "Facility.${fac_id}.last_closed_audit_outcome == \"NONE\""

      - name: supplier_document_verified_twice_is_rejected_as_already_decided
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SupplierDocument.terminal_states
          - validations.priority_8
          - errors.ERR_DOCUMENT_ALREADY_DECIDED
          - endpoints."POST /gfco/supplier-documents/{documentId}/verification"
        distinguishing_aspect: |
          REJECTED is a terminal state of the document machine: there is no REJECTED ->
          VERIFIED edge, so a reviewer cannot quietly reverse a rejection by re-posting the
          verification with APPROVE. The rejection_reason recorded by the first decision must
          survive, and the supplier's verified_document_count must stay 0.
        test_recipe:
          setup:
            - "One applicant, one supplier and one DRAFT GF_PROCESSED ingredient."
            - "One PROCESS_FLOW document for that ingredient which reviewer rev-1 has already REJECTED with the reason ILLEGIBLE_SCAN, putting it in a terminal state."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/applicants"
              payload: { legal_name: "Northgate Bakehouse Ltd", contact_email: "qa@northgate.example", country_code: "US" }
              as: ProgramAdministrator
              captures: { app_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Modified Corn Starch", risk_class: "GF_PROCESSED" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/supplier-documents"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", doc_type: "PROCESS_FLOW", issued_on: "2026-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "REJECT", rejection_reason: "ILLEGIBLE_SCAN" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { doc_status: $.data.status, doc_v: $.data.version }
          trigger:
            - call: "POST /gfco/supplier-documents/${doc_id}/verification"
              payload: { decision: "APPROVE" }
              as: CertificationReviewer
              as_user_id: "rev-2"
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_DOCUMENT_ALREADY_DECIDED\""
            - "${doc_status} == \"REJECTED\""
            - "SupplierDocument.${doc_id}.status == \"REJECTED\""
            - "SupplierDocument.${doc_id}.rejection_reason == \"ILLEGIBLE_SCAN\""
            - "SupplierDocument.${doc_id}.verified_by_user_id == null"
            - "SupplierDocument.${doc_id}.verified_on == null"
            - "SupplierDocument.${doc_id}.version == ${doc_v}"
            - "Supplier.${sup_id}.verified_document_count == 0"
            - "Ingredient.${ing_id}.verified_doc_types == []"

      - name: supplier_status_reposted_at_its_current_value_is_rejected
        claim_type: idempotency
        grounds:
          - validations.priority_17
          - errors.ERR_SUPPLIER_STATUS_UNCHANGED
          - endpoints."POST /gfco/suppliers/{supplierId}/status"
          - state_machines.Supplier.transitions
        distinguishing_aspect: |
          The supplier status endpoint is explicitly NOT idempotent: every declared
          transition requires a from-state different from the target, so replaying the same
          UNDER_REVIEW request must 409 rather than return 200 unchanged. This matters
          because the ACTIVE -> SUSPENDED edge carries a five-hop cascade that must never run
          twice; the version must not advance on the rejected replay.
        test_recipe:
          setup:
            - "One supplier that the administrator has already moved ACTIVE -> UNDER_REVIEW, so its version is 2."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/suppliers/${sup_id}/status"
              payload: { status: "UNDER_REVIEW" }
              as: ProgramAdministrator
              captures: { sup_v: $.data.version, sup_status: $.data.status }
          trigger:
            - call: "POST /gfco/suppliers/${sup_id}/status"
              payload: { status: "UNDER_REVIEW" }
              as: ProgramAdministrator
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_SUPPLIER_STATUS_UNCHANGED\""
            - "${sup_status} == \"UNDER_REVIEW\""
            - "${sup_v} == 2"
            - "Supplier.${sup_id}.status == \"UNDER_REVIEW\""
            - "Supplier.${sup_id}.version == ${sup_v}"

      - name: for_cause_retest_supersedes_the_earlier_lot_test_of_the_same_lot_code
        claim_type: side_effect_execution
        grounds:
          - state_machines.LotTest.transitions.RECORDED_to_SUPERSEDED_BY_RETEST
          - endpoints."POST /gfco/lot-tests"
          - calculations.lot_test_verdict
          - calculations.threshold_standard_selection
          - calculations.lot_sampling_frequency
          - entities.LotTest.fields.in_recall_scope
          - entities.Product.fields.last_scheduled_sample_on
        distinguishing_aspect: |
          The supersede edge is driven entirely by a matching (product_id, lot_code) on a
          FOR_CAUSE record - not by any explicit endpoint - and it is selective: the earlier
          row keeps its own verdict and snapshotted threshold while its in_recall_scope drops
          to false. The product's last_scheduled_sample_on must NOT move, because only
          SCHEDULED lots update it, so a FOR_CAUSE retest cannot silently reset the sampling
          exclusion window. With a single INHERENTLY_GF line at STANDARD tier in a facility
          with no shared equipment and no gluten operations every cap is 20, so
          threshold_ppm is 20, the sampling plan is the 2-lot floor and both 12.0 and 18.0
          ppm results PASS.
