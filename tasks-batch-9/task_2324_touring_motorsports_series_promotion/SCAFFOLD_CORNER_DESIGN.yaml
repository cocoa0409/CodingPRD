      - name: corner_endpoint_sales_action_preconditions_on_close_and_resume
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/tour-stops/{id}/close-sales
          - endpoints.POST_/tour-stops/{id}/resume-sales
          - state_machines.TourStop.sales_state
          - validations[order=11]
        distinguishing_aspect: "close-sales is declared from ON_SALE and SALES_HALTED only, and resume-sales only from SALES_HALTED. A fully ready stop that has never opened therefore cannot be closed, and a closed stop can neither be resumed nor re-opened — SALES_CLOSED is a one-way door short of settlement, even though readiness_posture is still OPEN."
