  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_blocked_until_contract_reaches_active
        grounds:
          - validations[priority=41]
          - state_machines.StudentApplication.DRAFT_to_SUBMITTED
          - state_machines.AgentContract.PENDING_COMPLIANCE_REVIEW_to_ACTIVE
          - errors[ERR_INVALID_CONTRACT_STATE]
          - entities.StudentApplication.fields.pinned_contract_id
        distinguishing_aspect: |
          A StudentApplication transition is gated on a different aggregate's state: with the
          contract still PENDING_COMPLIANCE_REVIEW the submit is refused with
          ERR_INVALID_CONTRACT_STATE even though every application-local precondition is met,
          and the identical call succeeds and pins the contract once COMPLIANCE_APPROVE lands.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED / GOOD_STANDING with both training certifications and an ACTIVE EXCLUSIVE IN territory on contract c1."
            - "Contract c1 has one rate card and has been signed by the agency, so it sits in PENDING_COMPLIANCE_REVIEW with disclosure_template_version 1."
            - "Application a1 has a VERIFIED PASSPORT and an ACKNOWLEDGED disclosure pinned at template version 1; integrity_hold is false."
