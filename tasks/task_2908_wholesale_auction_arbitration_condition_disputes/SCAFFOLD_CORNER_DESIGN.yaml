        distinguishing_aspect: "2000 bps of 1450000 is 290000; an offer of 290001 is refused with 422 ERR_ALLOWANCE_EXCEEDS_CAP while 290000 opens the round, so the cap is inclusive and is computed from the sale price rather than from the repair estimate."
        test_recipe:
          setup: ["A MECHANICAL case UNDER_REVIEW on a 1450000-cent sale under a 2000 bps policy."]
          setup_api_calls:
