          Remanding the second of three chargeable incidents must leave the site exactly as if that
          incident had never been counted: chargeable_count_window falls 3 -> 2, the surviving indices are
          exactly {1, 2} (the third incident renumbered down and re-priced 30000 -> 20000 with its invoice
