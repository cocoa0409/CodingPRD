              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_clock_2806
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-06-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_sweep_2806
              call: "POST /compliance-sweeps"
              payload: { as_of_date: "2028-06-10", site_id: "${site_id}" }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "after the five obligation creates: LiabilityProtection.${prot_id}.obligation_state == CURRENT and inquiry_state == AAI_COMPLETE and obligations_total_weight == 20 and current_weight == 20 and compliance_pct == 1.0000"
            - "bfpp_status == NOT_ESTABLISHED at that point because Site.acquisition_status is still UNDER_CONTRACT, even though compliance_pct is 1.0000 and inquiry_state is AAI_COMPLETE"
            - "the 2027-07-21 sweep response has stale_inquiry_count == 1 and at_risk_count == 0 and lapsed_count == 0"
            - "after the 2027-07-21 sweep: LiabilityProtection.${prot_id}.inquiry_state == AAI_STALE, obligation_state == CURRENT, compliance_pct == 1.0000, bfpp_status == NOT_ESTABLISHED"
            - "the 2028-06-10 sweep response has at_risk_count == 5 and lapsed_count == 0 and stale_inquiry_count == 0"
            - "after the 2028-06-10 sweep: inquiry_state == AAI_STALE (unchanged), obligation_state == AT_RISK, at_risk_weight == 20, current_weight == 0, compliance_pct == 0.5000"
            - "ContinuingObligation.${ob3b_rs_id}.status == AT_RISK and ContinuingObligation.${ob3b_nt_id}.status == AT_RISK"
            - "obligations_total_weight == 20 in every snapshot above"

      - name: remedial_action_plan_fork_join_branches_advance_independently
        grounds:
          - state_machines.RemedialActionPlan.SUBMITTED_to_UNDER_TECHNICAL_REVIEW
          - state_machines.RemedialActionPlan.UNDER_TECHNICAL_REVIEW_to_PUBLIC_COMMENT
          - state_machines.RemedialActionPlan.PUBLIC_COMMENT_to_PUBLIC_COMMENT
          - state_machines.RemedialActionPlan.PUBLIC_COMMENT_to_APPROVED
          - entities.RemedialActionPlan.fields.technical_review_state
          - entities.RemedialActionPlan.fields.public_comment_state
        distinguishing_aspect: |
          Non-linearity dimension = FORK-JOIN. One submit forks two branch
          dimensions (technical_review_state, public_comment_state); each branch
          advances on its own trigger and touches only its own fields (the
          technical PASS leaves public_comment_count at 0, the comment close
          leaves technical_review_state at PASSED and every cost field
          unchanged); approval is gated on the join of both branches and fans out
          three cascades at once, including withdrawing the sibling DRAFT plan.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment."
            - "Plan A with the six pinned cost lines plus one PROPOSED VAPOR_MITIGATION control, and a sibling DRAFT plan B on the same enrollment."
