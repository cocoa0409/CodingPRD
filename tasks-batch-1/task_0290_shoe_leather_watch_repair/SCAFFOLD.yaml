# =============================================================================
# PRD Benchmark Scaffold — Shoe / Leather & Watch Repair
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Shoe / Leather & Watch Repair: intake ticket & item condition, service-type
  pricing, estimate/approval, parts ordering, ready-by SLA & rush, status
  notification, pickup & unclaimed-item policy, repair warranty

domain_name: shoe-leather-watch-repair
# Flat topology: every entity is a top-level collection; FKs are query filters on
# the child collection. api_prefix is the API root so all collections sit under it.
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by FK references. Customer, ServiceType, Technician are
  # top-level catalogs; RepairTicket is the aggregate root; TicketItem,
  # ServiceLine, Estimate, PartsOrder, WarrantyClaim, Payment, Notification are
  # all top-level collections referencing their parents by FK query filters
  # (no deep URL nesting).

  state_machine_shape: cyclic
  # RepairTicket.repair_status carries a cyclic estimate-revision loop
  # (AWAITING_APPROVAL -> REVISION_REQUESTED -> AWAITING_APPROVAL). RepairTicket
  # additionally carries a PARALLEL second dimension (notify_status) that evolves
  # independently of repair_status. Estimate carries a branching approve/reject
  # shape. PartsOrder is a linear pipeline. WarrantyClaim is branching.

  relationship_patterns:
    - one_to_many       # RepairTicket -> TicketItem, ServiceLine, PartsOrder, Notification
    - cross_aggregate   # ServiceLine -> ServiceType (catalog); WarrantyClaim -> RepairTicket
    - self_referential  # Estimate.supersedes_estimate_id -> Estimate.id (revision chain)

  role_model: peer_roles
  # FrontDeskClerk (intake, pickup, notifications), RepairTechnician (estimates,
  # parts, repair work), ShopManager (catalog, cancellations, unclaimed disposal,
  # warranty rulings), Customer (entity-backed; approves/rejects estimates, files
  # warranty claims). Segregation flavor: the technician who authored a ticket's
  # approved estimate cannot rule on a warranty claim against that same ticket.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Catalog / configuration ---
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across Customers" }
      - { name: phone, type: string, source: input, description: "Contact phone for SMS notifications" }
      - { name: notify_channel, type: enum, source: input, default: "EMAIL", description: "Preferred channel", constraints: "one of {EMAIL, SMS}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Lifecycle", constraints: "one of {ACTIVE, ARCHIVED}; ARCHIVED set by archive action" }

  - name: ServiceType
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: code, type: string, source: input, description: "Short catalog code; unique across ServiceTypes" }
      - { name: name, type: string, source: input, description: "Display name (e.g., 'Sole Replacement', 'Watch Battery')" }
      - { name: item_category, type: enum, source: input, description: "Item family this service applies to", constraints: "one of {SHOE, LEATHER, WATCH}" }
      - { name: base_price_cents, type: integer, source: input, description: "Standard labor price in cents", constraints: ">= 0" }
      - { name: standard_turnaround_days, type: integer, source: input, description: "Business days to complete at standard priority", constraints: ">= 1" }
      - { name: rush_eligible, type: boolean, source: input, default: true, description: "Whether RUSH priority may be applied to a ticket containing this service" }
      - { name: warranty_days, type: integer, source: input, description: "Warranty coverage window in days from pickup for this service", constraints: ">= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "False once retired; retired types may not be added to new ServiceLines" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: display_name, type: string, source: input, description: "Technician name" }
      - { name: skills, type: array, source: input, description: "Item categories this technician can service; subset of {SHOE, LEATHER, WATCH}" }
      - { name: active, type: boolean, source: system, default: true, description: "False once deactivated" }

  # --- Aggregate root ---
  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the ticket owner" }
      - { name: drop_off_at, type: datetime, source: system, description: "Server clock at intake (ISO 8601 UTC)" }
      - { name: priority, type: enum, source: input, default: "STANDARD", description: "Service priority", constraints: "one of {STANDARD, RUSH}; RUSH applies a surcharge and shortens ready_by" }
      - { name: repair_status, type: enum, source: system, default: "INTAKE", description: "Primary lifecycle dimension", constraints: "one of {INTAKE, AWAITING_APPROVAL, REVISION_REQUESTED, APPROVED, AWAITING_PARTS, IN_REPAIR, READY_FOR_PICKUP, PICKED_UP, UNCLAIMED, DISPOSED, CANCELLED}" }
      - { name: notify_status, type: enum, source: system, default: "NONE", description: "Parallel notification dimension, evolves independently of repair_status", constraints: "one of {NONE, READY_NOTIFIED, UNCLAIMED_WARNED}" }
      - { name: ready_by, type: datetime, source: computed, description: "Promised ready timestamp = drop_off_at + SLA days (computed at approval); null before approval" }
      - { name: ready_at, type: datetime, source: system, description: "Server clock when ticket entered READY_FOR_PICKUP; null otherwise" }
      - { name: sla_breached, type: boolean, source: computed, description: "True when ready_at > ready_by (set at READY_FOR_PICKUP); false otherwise" }
      - { name: approved_estimate_id, type: string, source: system, description: "FK -> Estimate.id; the approved estimate, null until approval" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Finalized total billed at mark-ready; null until READY_FOR_PICKUP" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of CAPTURED Payment.amount_cents for this ticket; starts 0" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "Latest warranty expiry = picked_up_at + max(ServiceType.warranty_days over completed lines); null until PICKED_UP" }
      - { name: picked_up_at, type: datetime, source: system, description: "Server clock at pickup; null otherwise" }
      - { name: assigned_technician_id, type: string, source: input, description: "FK -> Technician.id; technician who owns the repair work; null at intake" }

  - name: TicketItem
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; owning ticket" }
      - { name: item_category, type: enum, source: input, description: "Item family", constraints: "one of {SHOE, LEATHER, WATCH}" }
      - { name: description, type: string, source: input, description: "Free-text item description (e.g., 'brown leather Oxford, size 10')" }
      - { name: condition_grade, type: enum, source: input, description: "Intake condition grade", constraints: "one of {EXCELLENT, GOOD, FAIR, POOR}" }
      - { name: condition_notes, type: string, source: input, default: "", description: "Documented pre-existing damage at intake" }

  - name: ServiceLine
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; owning ticket" }
      - { name: ticket_item_id, type: string, source: input, description: "FK -> TicketItem.id; the item this service is performed on" }
      - { name: service_type_id, type: string, source: input, description: "FK -> ServiceType.id; the catalog service" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Price snapshot from ServiceType.base_price_cents at line creation" }
      - { name: adjusted_price_cents, type: integer, source: input, description: "Technician override applied during repair; null means use quoted_price_cents", constraints: ">= 0 when present" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "Line lifecycle", constraints: "one of {QUOTED, COMPLETED, VOIDED}" }

  - name: Estimate
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; owning ticket" }
      - { name: supersedes_estimate_id, type: string, source: input, description: "FK -> Estimate.id; the prior estimate this revision replaces; null for first estimate" }
      - { name: revision_number, type: integer, source: computed, description: "1 for first estimate; prior.revision_number + 1 for a revision" }
      - { name: authored_by_technician_id, type: string, source: input, description: "FK -> Technician.id; technician who built the estimate" }
      - { name: labor_subtotal_cents, type: integer, source: computed, description: "Sum of quoted_price_cents over the ticket's non-VOIDED ServiceLines at estimate time" }
      - { name: parts_subtotal_cents, type: integer, source: computed, description: "Sum of marked-up PartsOrder line costs included in this estimate" }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "Rush surcharge applied when ticket.priority == RUSH; 0 otherwise" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "labor_subtotal + parts_subtotal + rush_surcharge (PROVISIONAL variant)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Estimate lifecycle", constraints: "one of {DRAFT, PRESENTED, APPROVED, REJECTED, SUPERSEDED}" }

  - name: PartsOrder
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; owning ticket" }
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id; the line that needs the part" }
      - { name: part_name, type: string, source: input, description: "Part description (e.g., 'Vibram half-sole')" }
      - { name: supplier_cost_cents, type: integer, source: input, description: "Wholesale cost from supplier in cents", constraints: ">= 0" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units ordered", constraints: ">= 1" }
      - { name: marked_up_cost_cents, type: integer, source: computed, description: "Customer-facing cost = round_half_up(supplier_cost_cents * quantity * MARKUP_MULTIPLIER)" }
      - { name: lead_time_days, type: integer, source: input, description: "Supplier lead time in days; extends the SLA", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "Parts lifecycle", constraints: "one of {REQUESTED, ORDERED, RECEIVED, CANCELLED}" }

  - name: Payment
    parent: RepairTicket
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; the ticket being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "Tender", constraints: "one of {CASH, CARD, STORE_CREDIT}" }
      - { name: state, type: enum, source: system, default: "CAPTURED", description: "Payment state; CAPTURED on success, REFUNDED on reversal", constraints: "one of {CAPTURED, REFUNDED}" }

  - name: WarrantyClaim
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; the original repaired ticket" }
      - { name: service_line_id, type: string, source: input, description: "FK -> ServiceLine.id; the service alleged to have failed" }
      - { name: reported_by_customer_id, type: string, source: input, description: "FK -> Customer.id; claimant; must equal ticket.customer_id" }
      - { name: defect_description, type: string, source: input, description: "Description of the alleged repair failure" }
      - { name: ruled_by_technician_id, type: string, source: input, description: "FK -> Technician.id; technician who adjudicates; must differ from the approved estimate's author (segregation of duties)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "Claim lifecycle", constraints: "one of {FILED, APPROVED, DENIED}" }
      - { name: redo_ticket_id, type: string, source: system, description: "FK -> RepairTicket.id; new no-charge ticket spawned when claim APPROVED; null otherwise" }

  - name: Notification
    parent: RepairTicket
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only)" }
      - { name: ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; the ticket this notification concerns" }
      - { name: kind, type: enum, source: input, description: "Notification kind", constraints: "one of {READY_FOR_PICKUP, UNCLAIMED_WARNING, ESTIMATE_PRESENTED}" }
      - { name: channel, type: enum, source: computed, description: "Resolved from Customer.notify_channel at send time", constraints: "one of {EMAIL, SMS}" }
      - { name: body, type: string, source: input, description: "Message text" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- RepairTicket.repair_status : cyclic (revision loop) + parallel notify_status ---
  - entity: RepairTicket
    field: repair_status
    initial_state: INTAKE
    terminal_states: [PICKED_UP, DISPOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: AWAITING_APPROVAL
        trigger: "POST /estimates/{id}/present"
        actor: RepairTechnician
        preconditions:
          - "ticket.repair_status == INTAKE"
          - "Estimate.status == DRAFT and Estimate.ticket_id == ticket.id"
          - "At least one non-VOIDED ServiceLine exists on the ticket (ERR_NO_SERVICE_LINES)"
        side_effects:
          - "Estimate.status DRAFT -> PRESENTED"
          - "Estimate totals recomputed via estimate_total (PROVISIONAL variant)"
          - "Append Notification(kind=ESTIMATE_PRESENTED)"
          - "increments RepairTicket.version by 1"

      - from: AWAITING_APPROVAL
        to: APPROVED
        trigger: "POST /estimates/{id}/approve"
        actor: Customer
        preconditions:
          - "ticket.repair_status == AWAITING_APPROVAL"
          - "Estimate.status == PRESENTED"
          - "acting Customer.id == ticket.customer_id (ERR_NOT_TICKET_OWNER)"
        side_effects:
          - "Estimate.status PRESENTED -> APPROVED"
          - "RepairTicket.approved_estimate_id = estimate.id"
          - "Compute ready_by via ready_by_sla (cascade hop 1)"
          - "If any PartsOrder in {REQUESTED, ORDERED}: repair_status set to AWAITING_PARTS instead of APPROVED (see note)"
          - "increments RepairTicket.version by 1"
        note: "Effective target is APPROVED only when no outstanding parts; otherwise the same approve call lands in AWAITING_PARTS. ready_by is computed once here from the parts lead times known at approval."

      - from: AWAITING_APPROVAL
        to: REVISION_REQUESTED
        trigger: "POST /estimates/{id}/reject"
        actor: Customer
        preconditions:
          - "ticket.repair_status == AWAITING_APPROVAL"
          - "Estimate.status == PRESENTED"
          - "acting Customer.id == ticket.customer_id (ERR_NOT_TICKET_OWNER)"
        side_effects:
          - "Estimate.status PRESENTED -> REJECTED"
          - "increments RepairTicket.version by 1"
        note: "Cyclic loop entry: a rejected estimate sends the ticket back to REVISION_REQUESTED, from which a new estimate is presented."

      - from: REVISION_REQUESTED
        to: AWAITING_APPROVAL
        trigger: "POST /estimates/{id}/present"
        actor: RepairTechnician
        preconditions:
          - "ticket.repair_status == REVISION_REQUESTED"
          - "Estimate.status == DRAFT and Estimate.supersedes_estimate_id == the most recent REJECTED estimate (ERR_BAD_REVISION_CHAIN)"
        side_effects:
          - "Prior REJECTED estimate.status -> SUPERSEDED"
          - "New Estimate.status DRAFT -> PRESENTED, revision_number = prior.revision_number + 1"
          - "Estimate totals recomputed via estimate_total (PROVISIONAL variant)"
          - "Append Notification(kind=ESTIMATE_PRESENTED)"
          - "increments RepairTicket.version by 1"
        note: "Closes the cycle REVISION_REQUESTED -> AWAITING_APPROVAL -> REVISION_REQUESTED."

      - from: AWAITING_PARTS
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/start-repair"
        actor: RepairTechnician
        preconditions:
          - "ticket.repair_status == AWAITING_PARTS"
          - "Every PartsOrder for this ticket is in {RECEIVED, CANCELLED} (ERR_PARTS_NOT_READY)"
          - "ticket.assigned_technician_id is set and that Technician.active == true (ERR_NO_TECHNICIAN)"
        side_effects:
          - "increments RepairTicket.version by 1"

      - from: APPROVED
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{id}/start-repair"
        actor: RepairTechnician
        preconditions:
          - "ticket.repair_status == APPROVED"
          - "ticket.assigned_technician_id is set and that Technician.active == true (ERR_NO_TECHNICIAN)"
        side_effects:
          - "increments RepairTicket.version by 1"

      - from: IN_REPAIR
        to: READY_FOR_PICKUP
        trigger: "POST /repair-tickets/{id}/mark-ready"
        actor: RepairTechnician
        preconditions:
          - "ticket.repair_status == IN_REPAIR"
          - "Every non-VOIDED ServiceLine on the ticket is COMPLETED (ERR_LINES_NOT_COMPLETED)"
        side_effects:
          - "RepairTicket.ready_at = clock_now"
          - "Compute final_charge_cents via estimate_total (FINAL variant) -> RepairTicket.final_charge_cents"
          - "Compute sla_breached = (ready_at > ready_by)"
          - "increments RepairTicket.version by 1"

      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /repair-tickets/{id}/pickup"
        actor: FrontDeskClerk
        preconditions:
          - "ticket.repair_status == READY_FOR_PICKUP"
          - "amount_paid_cents >= final_charge_cents (ERR_BALANCE_DUE)"
        side_effects:
          - "RepairTicket.picked_up_at = clock_now"
          - "Compute warranty_expires_at via warranty_window (cascade on ServiceType.warranty_days)"
          - "increments RepairTicket.version by 1"

      - from: READY_FOR_PICKUP
        to: UNCLAIMED
        trigger: "POST /repair-tickets/{id}/flag-unclaimed"
        actor: FrontDeskClerk
        preconditions:
          - "ticket.repair_status == READY_FOR_PICKUP"
          - "clock_now >= ready_at + UNCLAIMED_GRACE_DAYS days (ERR_UNCLAIMED_TOO_EARLY)"
        side_effects:
          - "notify_status -> UNCLAIMED_WARNED (parallel dimension)"
          - "Append Notification(kind=UNCLAIMED_WARNING)"
          - "increments RepairTicket.version by 1"

      - from: UNCLAIMED
        to: PICKED_UP
        trigger: "POST /repair-tickets/{id}/pickup"
        actor: FrontDeskClerk
        preconditions:
          - "ticket.repair_status == UNCLAIMED"
          - "amount_paid_cents >= final_charge_cents (ERR_BALANCE_DUE)"
        side_effects:
          - "RepairTicket.picked_up_at = clock_now"
          - "Compute warranty_expires_at via warranty_window"
          - "increments RepairTicket.version by 1"

      - from: UNCLAIMED
        to: DISPOSED
        trigger: "POST /repair-tickets/{id}/dispose"
        actor: ShopManager
        preconditions:
          - "ticket.repair_status == UNCLAIMED"
          - "notify_status == UNCLAIMED_WARNED (ERR_UNCLAIMED_NOT_WARNED)"
          - "clock_now >= ready_at + DISPOSAL_DAYS days (ERR_DISPOSAL_TOO_EARLY)"
        side_effects:
          - "All non-VOIDED ServiceLines -> VOIDED"
          - "increments RepairTicket.version by 1"

      - from: [INTAKE, AWAITING_APPROVAL, REVISION_REQUESTED, APPROVED, AWAITING_PARTS]
        to: CANCELLED
        trigger: "POST /repair-tickets/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "ticket.repair_status in {INTAKE, AWAITING_APPROVAL, REVISION_REQUESTED, APPROVED, AWAITING_PARTS} (ERR_NOT_CANCELLABLE)"
        side_effects:
          - "TRANSITIVE CASCADE (depth 3) hop 1: every non-RECEIVED PartsOrder of the ticket transitions to CANCELLED."
          - "hop 2: each PartsOrder entering CANCELLED transitions its owning ServiceLine (service_line_id) to VOIDED (see PartsOrder CANCELLED side_effects)."
          - "hop 3: each ServiceLine entering VOIDED rejects the ticket's open Estimate (DRAFT/PRESENTED) -> REJECTED, since the line set backing the quote changed (see ServiceLine VOIDED side_effects)."
          - "Mop-up (not part of the graded chain): any remaining non-VOIDED ServiceLine with no backing part is also VOIDED, and any still-open Estimate is REJECTED."
          - "increments RepairTicket.version by 1"
        note: "The graded transitive chain is cancel -> PartsOrder.CANCELLED -> ServiceLine.VOIDED -> Estimate.REJECTED, each hop caused by the prior hop's mutation, not by the cancel directly."

  # --- Estimate : branching approve/reject + supersede ---
  - entity: Estimate
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /estimates/{id}/present"
        actor: RepairTechnician
        preconditions:
          - "Estimate.status == DRAFT"
          - "owning ticket.repair_status in {INTAKE, REVISION_REQUESTED}"
        side_effects:
          - "estimate_total recomputed (PROVISIONAL)"
          - "ticket.repair_status -> AWAITING_APPROVAL"
      - from: PRESENTED
        to: APPROVED
        trigger: "POST /estimates/{id}/approve"
        actor: Customer
        preconditions:
          - "Estimate.status == PRESENTED"
        side_effects:
          - "ticket.approved_estimate_id = this estimate.id"
      - from: PRESENTED
        to: REJECTED
        trigger: "POST /estimates/{id}/reject"
        actor: Customer
        preconditions:
          - "Estimate.status == PRESENTED"
        side_effects:
          - "ticket.repair_status -> REVISION_REQUESTED"
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system (a later revision is presented that supersedes this one)"
        actor: system
        preconditions:
          - "A new Estimate with supersedes_estimate_id == this.id is presented"
        side_effects: []
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (a revision presented citing this rejected estimate)"
        actor: system
        preconditions:
          - "A new Estimate with supersedes_estimate_id == this.id transitions to PRESENTED"
        side_effects: []

  # --- PartsOrder : linear pipeline with cancel branch ---
  - entity: PartsOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ORDERED
        trigger: "POST /parts-orders/{id}/order"
        actor: RepairTechnician
        preconditions:
          - "PartsOrder.status == REQUESTED"
          - "owning ticket.repair_status in {AWAITING_APPROVAL, REVISION_REQUESTED, APPROVED, AWAITING_PARTS}"
        side_effects:
          - "increments RepairTicket.version by 1"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /parts-orders/{id}/receive"
        actor: RepairTechnician
        preconditions:
          - "PartsOrder.status == ORDERED"
        side_effects:
          - "If ticket.repair_status == AWAITING_PARTS and every PartsOrder now in {RECEIVED, CANCELLED}: ticket becomes eligible for start-repair (no auto-transition; technician calls start-repair)"
          - "increments RepairTicket.version by 1"
      - from: [REQUESTED, ORDERED]
        to: CANCELLED
        trigger: "POST /parts-orders/{id}/cancel ; or system (cancel-cascade hop 1 from ticket cancel)"
        actor: RepairTechnician
        preconditions:
          - "PartsOrder.status in {REQUESTED, ORDERED}"
        side_effects:
          - "marked_up_cost_cents excluded from any subsequently presented estimate"
          - "CASCADE hop 2 (only when this CANCELLED was caused by the ticket-cancel cascade): the owning ServiceLine (service_line_id) transitions QUOTED/COMPLETED -> VOIDED"
          - "increments RepairTicket.version by 1"
        note: "When a technician cancels a single part directly, the owning line is NOT auto-voided; the hop-2 line-void fires only as a continuation of the ticket-cancel cascade."

  # --- Payment : capture -> refund (compensating pair) ---
  - entity: Payment
    field: state
    initial_state: CAPTURED
    terminal_states: [REFUNDED]
    transitions:
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund"
        actor: ShopManager
        preconditions:
          - "Payment.state == CAPTURED (ERR_INVALID_PARTS_STATE is NOT used here; use ERR_INVALID_TICKET_STATE family -> ERR_PAYMENT_NOT_REFUNDABLE)"
        side_effects:
          - "amount_paid_cents on the ticket recomputed via amount_paid (refunded excluded)"
          - "increments RepairTicket.version by 1"
        note: "Compensating action for capture: amount_paid_cents returns to its pre-capture value (conserved quantity invariant)."

  # --- ServiceLine : QUOTED -> COMPLETED, with VOIDED branch (cascade target) ---
  - entity: ServiceLine
    field: status
    initial_state: QUOTED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: QUOTED
        to: COMPLETED
        trigger: "PATCH /service-lines/{id} with status=COMPLETED"
        actor: RepairTechnician
        preconditions:
          - "ServiceLine.status == QUOTED"
          - "owning ticket.repair_status == IN_REPAIR (ERR_INVALID_TICKET_STATE)"
        side_effects:
          - "If adjusted_price_cents supplied, it overrides quoted_price_cents in the FINAL estimate"
          - "increments RepairTicket.version by 1"
      - from: [QUOTED, COMPLETED]
        to: VOIDED
        trigger: "system (cancel-cascade hop 2 from a PartsOrder cancellation; or dispose; or direct cancel mop-up)"
        actor: system
        preconditions:
          - "ServiceLine.status in {QUOTED, COMPLETED}"
        side_effects:
          - "CASCADE hop 3 (only as a continuation of the ticket-cancel cascade): the ticket's open Estimate (status in {DRAFT, PRESENTED}) transitions to REJECTED because the line set backing the quote changed."
          - "VOIDED lines drop out of estimate_total FINAL scope and warranty_window scope."

  # --- WarrantyClaim : branching adjudication (approve = transitive cascade) ---
  - entity: WarrantyClaim
    field: status
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == FILED"
          - "ruled_by_technician_id != the authored_by_technician_id of the ticket's approved Estimate (ERR_SEGREGATION_VIOLATION)"
          - "original ticket.repair_status == PICKED_UP and clock_now <= original ticket.warranty_expires_at (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "TRANSITIVE CASCADE (depth 2) hop 1: spawn a new no-charge redo RepairTicket (repair_status=APPROVED, priority=RUSH, final_charge_cents=0, customer_id copied from the original ticket); set this claim's redo_ticket_id."
          - "hop 2: the redo RepairTicket's creation copies the failed ServiceLine onto the redo ticket as a no-charge QUOTED line (quoted_price_cents=0), caused by the ticket spawn, not by the claim directly."
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == FILED"
          - "ruled_by_technician_id != the authored_by_technician_id of the ticket's approved Estimate (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "No side effects (divergent branch from APPROVE: no redo ticket, no line copy)."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-present-stale-ticket
    parent_entity: RepairTicket
    write_endpoint: "POST /estimates/{id}/present"
    occ_field: "expected_ticket_version"
    description: |
      Presenting an estimate against a RepairTicket whose version has advanced
      since the technician last observed it is rejected with a stale-version
      error. This captures the case where another revision has already been
      presented (legitimately moving the ticket INTAKE/REVISION_REQUESTED ->
      AWAITING_APPROVAL and bumping the ticket version), so the current
      technician's view of the ticket is stale and the second present must not
      land a competing estimate.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412

  - rule_id: payment-capture-stale-ticket
    parent_entity: RepairTicket
    write_endpoint: "POST /payments"
    occ_field: "expected_ticket_version"
    description: |
      Capturing a Payment against a RepairTicket whose version has advanced
      since the clerk last observed it is rejected with a stale-version error.
      This captures the case where final_charge_cents was refreshed by a
      mark-ready (FINAL recompute) after the clerk read the ticket, so a payment
      sized to the pre-recompute charge is taken against a stale view.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_total
    trigger: "estimate present (PROVISIONAL); ticket mark-ready (FINAL)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (a): >=3 inputs with non-linear interaction.
      # Evaluation order is PINNED:
      #   1. labor_subtotal = sum over lines in scope of line_price(line)
      #   2. parts_subtotal = sum over parts in scope of marked_up_cost_cents
      #   3. pre_rush = labor_subtotal + parts_subtotal
      #   4. rush_surcharge = rush_surcharge(pre_rush, ticket.priority)   # depends on pre_rush tier
      #   5. estimate_total = pre_rush + rush_surcharge
      #
      # line_price(line) and the in-scope sets differ by variant:
      #   PROVISIONAL: line_price = quoted_price_cents;
      #                lines in scope = ServiceLines with status == QUOTED;
      #                parts in scope = PartsOrders with status in {REQUESTED, ORDERED, RECEIVED}.
      #   FINAL:       line_price = adjusted_price_cents if not null else quoted_price_cents;
      #                lines in scope = ServiceLines with status == COMPLETED;
      #                parts in scope = PartsOrders with status == RECEIVED.
    input_set: |
      PROVISIONAL: QUOTED ServiceLines + {REQUESTED,ORDERED,RECEIVED} PartsOrders of the ticket.
      FINAL: COMPLETED ServiceLines + RECEIVED PartsOrders of the ticket.
    constants: {}
    precision: "integer cents; no fractional cents; see rush_surcharge / parts_markup for their own rounding"
    variants:
      - name: PROVISIONAL
        when: "estimate present (AWAITING_APPROVAL)"
        difference: "Uses quoted_price_cents and QUOTED lines + all non-CANCELLED parts; written to Estimate.estimate_total_cents."
      - name: FINAL
        when: "ticket mark-ready (READY_FOR_PICKUP)"
        difference: "Uses adjusted_price_cents fallback to quoted, COMPLETED lines + RECEIVED parts only; written to RepairTicket.final_charge_cents. A line VOIDED or a part CANCELLED after the estimate drops out of FINAL, so PROVISIONAL and FINAL diverge."

  - name: rush_surcharge
    trigger: "inside estimate_total (both variants), step 4"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b)+(c): tier selection on the running pre_rush total,
      # with an explicit circular-looking dependency resolved by the PINNED order
      # in estimate_total (rush_surcharge is computed AFTER pre_rush is known).
      if ticket.priority != RUSH: return 0
      # marginal tiered surcharge on pre_rush (cents):
      #   tier 1: portion of pre_rush in [0, RUSH_TIER1_CAP)        @ RUSH_RATE_1
      #   tier 2: portion in [RUSH_TIER1_CAP, RUSH_TIER2_CAP)       @ RUSH_RATE_2
      #   tier 3: portion >= RUSH_TIER2_CAP                          @ RUSH_RATE_3
      # surcharge_raw = tier1_portion*RATE1 + tier2_portion*RATE2 + tier3_portion*RATE3
      # rush_surcharge = max(RUSH_FLOOR_CENTS, round_half_up(surcharge_raw))
      # Tier boundaries are HALF-OPEN: a pre_rush of exactly RUSH_TIER1_CAP puts
      # the full RUSH_TIER1_CAP in tier 1 and 0 in tier 2.
    input_set: "pre_rush (labor_subtotal + parts_subtotal), ticket.priority"
    constants:
      RUSH_TIER1_CAP: 5000
      RUSH_TIER2_CAP: 20000
      RUSH_RATE_1: 0.30
      RUSH_RATE_2: 0.20
      RUSH_RATE_3: 0.10
      RUSH_FLOOR_CENTS: 1500
    precision: "round_half_up to integer cents AFTER summing tier portions (sum-then-round, pinned)"
    note: "Boundary precision: pre_rush == RUSH_TIER1_CAP (5000) allocates exactly 5000 to tier 1 and 0 to tier 2; surcharge_raw = 1500, floored to 1500."

  - name: parts_markup
    trigger: "PartsOrder create"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding order pinned to multiply-the-full-product-then-round-once.
      # multiplier = MARKUP_MULTIPLIER (RETAIL) when the part's ticket.final_charge is billed;
      #              AT_COST_MULTIPLIER (WARRANTY_REDO) when the part's owning ticket is a
      #              warranty-redo ticket (it was spawned by a WarrantyClaim approval, i.e. it
      #              is referenced by some WarrantyClaim.redo_ticket_id).
      # marked_up_cost_cents = round_half_up(supplier_cost_cents * quantity * multiplier)
      # (Rounding per-unit then multiplying by quantity would drift — e.g. supplier 333, qty 3:
      #  pinned = round(333*3*1.35)=round(1348.65)=1349; per-unit-first = round(333*1.35)*3 = 450*3 = 1350.)
    input_set: "single PartsOrder's supplier_cost_cents, quantity; owning ticket's redo status"
    constants:
      MARKUP_MULTIPLIER: 1.35
      AT_COST_MULTIPLIER: 1.0
    precision: "round_half_up to integer cents, exactly one rounding after the full product"
    variants:
      - name: RETAIL
        when: "PartsOrder on a normal (non-redo) ticket"
        difference: "Applies MARKUP_MULTIPLIER (1.35); the marked-up cost flows into the customer-billed estimate/final charge."
      - name: WARRANTY_REDO
        when: "PartsOrder on a ticket that is referenced by a WarrantyClaim.redo_ticket_id"
        difference: "Applies AT_COST_MULTIPLIER (1.0); the redo is no-charge so parts are passed at wholesale. Same supplier_cost_cents and quantity yield a different marked_up_cost_cents than RETAIL."

  - name: ready_by_sla
    trigger: "ticket estimate approve (-> APPROVED / AWAITING_PARTS)"
    algorithm: threshold
    formula: |
      # base SLA in business days from the approved estimate's service mix.
      base_days = max over the ticket's non-VOIDED ServiceLines of
                  their ServiceType.standard_turnaround_days
      parts_days = max over the ticket's non-CANCELLED PartsOrders of lead_time_days
                   (0 if no parts)
      sla_days = base_days + parts_days
      if ticket.priority == RUSH:
        sla_days = max(RUSH_MIN_DAYS, ceil(sla_days * RUSH_SLA_FACTOR))
      ready_by = drop_off_at + sla_days calendar days   # whole-day add, UTC
    input_set: "ticket's non-VOIDED ServiceLines' ServiceTypes; non-CANCELLED PartsOrders"
    constants:
      RUSH_SLA_FACTOR: 0.5
      RUSH_MIN_DAYS: 1
    precision: "sla_days is integer days; ceil applied after multiply for RUSH"
    note: "Boundary precision: ceil(sla_days * 0.5); e.g. 5 business days RUSH -> ceil(2.5)=3, floored at RUSH_MIN_DAYS=1."

  - name: warranty_window
    trigger: "ticket pickup (-> PICKED_UP)"
    algorithm: aggregation
    formula: |
      # max over the ticket's COMPLETED ServiceLines of their ServiceType.warranty_days
      cover_days = max(ServiceType.warranty_days for sl in COMPLETED ServiceLines)
      warranty_expires_at = picked_up_at + cover_days calendar days
      if no COMPLETED ServiceLines: warranty_expires_at = picked_up_at (cover_days = 0)
    input_set: "COMPLETED ServiceLines of the ticket and their ServiceTypes"
    constants: {}
    precision: "whole calendar days, UTC"

  - name: amount_paid
    trigger: "Payment capture / refund; read on ticket"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(Payment.amount_cents for Payments of the ticket with state == CAPTURED)
      # REFUNDED payments are excluded.
    input_set: "CAPTURED Payments of the ticket"
    constants: {}
    precision: "integer cents"

  - name: unclaimed_policy
    trigger: "flag-unclaimed and dispose eligibility checks"
    algorithm: threshold
    formula: |
      # Both thresholds are measured from RepairTicket.ready_at (whole calendar days, UTC).
      unclaimed_eligible  := clock_now >= ready_at + UNCLAIMED_GRACE_DAYS days
      disposal_eligible   := clock_now >= ready_at + DISPOSAL_DAYS days
      # Boundary precision: eligibility uses >= (clock exactly at the boundary is eligible).
    input_set: "RepairTicket.ready_at, server clock"
    constants:
      UNCLAIMED_GRACE_DAYS: 30
      DISPOSAL_DAYS: 90
    precision: "whole calendar days, UTC; comparison is >= (inclusive boundary)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist (ticketId / estimateId / partsOrderId / serviceLineId / claimId)"
    error_id: "ERR_TICKET_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_PARTS_ORDER_NOT_FOUND / ERR_SERVICE_LINE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_SERVICE_TYPE_NOT_FOUND / ERR_TICKET_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: business_referential
    check: "Body FK references resolve (customer_id, service_type_id, ticket_item_id, service_line_id, assigned_technician_id, authored_by_technician_id) and belong to the same ticket where applicable"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST create endpoints with body FK fields"

  - priority: 5
    category: business_constraint
    check: "Uniqueness: Customer.email unique; ServiceType.code unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /customers, POST /service-types"

  - priority: 6
    category: business_constraint
    check: "Enum/type/range valid; a new ServiceLine's ServiceType must have active == true and item_category matching the TicketItem.item_category"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create / action endpoints with typed body"

  - priority: 7
    category: state
    check: "OCC: expected_ticket_version must equal RepairTicket.version on endpoints that require it"
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
    applies_to: "POST /estimates/{id}/present, POST /payments"

  - priority: 8
    category: state
    check: "Target resource is in the correct state for the requested transition (per §1.2)"
    error_id: "ERR_INVALID_TICKET_STATE / ERR_INVALID_ESTIMATE_STATE / ERR_INVALID_PARTS_STATE / ERR_INVALID_CLAIM_STATE / ERR_NO_SERVICE_LINES / ERR_BAD_REVISION_CHAIN / ERR_PARTS_NOT_READY / ERR_NO_TECHNICIAN / ERR_LINES_NOT_COMPLETED / ERR_NOT_CANCELLABLE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 9
    category: business_safety
    check: "Segregation of duties: WarrantyClaim.ruled_by_technician_id must differ from the approved estimate's authored_by_technician_id"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/approve, POST /warranty-claims/{id}/deny"

  - priority: 10
    category: business_temporal
    check: "Warranty window: a WarrantyClaim may be filed only while clock_now <= original ticket.warranty_expires_at and the ticket is PICKED_UP"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 11
    category: business_temporal
    check: "Unclaimed timing: flag-unclaimed requires clock_now >= ready_at + UNCLAIMED_GRACE_DAYS; dispose requires clock_now >= ready_at + DISPOSAL_DAYS and notify_status == UNCLAIMED_WARNED"
    error_id: "ERR_UNCLAIMED_TOO_EARLY / ERR_DISPOSAL_TOO_EARLY / ERR_UNCLAIMED_NOT_WARNED"
    http_status: 409
    applies_to: "POST /repair-tickets/{id}/flag-unclaimed, POST /repair-tickets/{id}/dispose"

  - priority: 12
    category: business_fiscal
    check: "Balance due: pickup requires amount_paid_cents >= final_charge_cents"
    error_id: ERR_BALANCE_DUE
    http_status: 402
    applies_to: "POST /repair-tickets/{id}/pickup"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology; FKs are query filters on child lists)
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["Subsequent server-stamped timestamps use this clock"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [FrontDeskClerk, ShopManager]
    code: 201
    input: [full_name, email, phone, "notify_channel?"]
    output: Customer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/customers"
    description: "List Customers"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a Customer"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- ServiceType ----
  - method: POST
    path: "/service-types"
    description: "Create a ServiceType catalog entry"
    roles: [ShopManager]
    code: 201
    input: [code, name, item_category, base_price_cents, standard_turnaround_days, "rush_eligible?", warranty_days]
    output: ServiceType
    side_effects: ["active=true"]

  - method: GET
    path: "/service-types"
    description: "List ServiceTypes"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: ["item_category?", "limit?", "offset?"]
    output: "ServiceType[]"
    side_effects: []

  - method: GET
    path: "/service-types/{id}"
    description: "Get a ServiceType"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: []
    output: ServiceType
    side_effects: []

  - method: POST
    path: "/service-types/{id}/retire"
    description: "Retire a ServiceType (active=false)"
    roles: [ShopManager]
    code: 200
    input: []
    output: ServiceType
    side_effects: ["active=false; type may no longer be added to new ServiceLines"]

  # ---- Technician ----
  - method: POST
    path: "/technicians"
    description: "Create a Technician"
    roles: [ShopManager]
    code: 201
    input: [display_name, skills]
    output: Technician
    side_effects: ["active=true"]

  - method: GET
    path: "/technicians"
    description: "List Technicians"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Get a Technician"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # ---- RepairTicket ----
  - method: POST
    path: "/repair-tickets"
    description: "Create (intake) a RepairTicket"
    roles: [FrontDeskClerk]
    code: 201
    input: [customer_id, "priority?", "assigned_technician_id?"]
    output: RepairTicket
    side_effects: ["repair_status=INTAKE, notify_status=NONE, drop_off_at=clock_now, amount_paid_cents=0"]

  - method: GET
    path: "/repair-tickets"
    description: "List RepairTickets (filters cover customer_id, approved_estimate_id, assigned_technician_id FKs)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: ["customer_id?", "approved_estimate_id?", "assigned_technician_id?", "repair_status?", "limit?", "offset?"]
    output: "RepairTicket[]"
    side_effects: []

  - method: GET
    path: "/repair-tickets/{id}"
    description: "Get a RepairTicket"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: PATCH
    path: "/repair-tickets/{id}"
    description: "Assign technician / update priority before approval"
    roles: [FrontDeskClerk, ShopManager]
    code: 200
    input: ["assigned_technician_id?", "priority?"]
    output: RepairTicket
    side_effects: ["increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/start-repair"
    description: "Begin repair (APPROVED/AWAITING_PARTS -> IN_REPAIR)"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->IN_REPAIR; increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/mark-ready"
    description: "Mark repair complete and ready (IN_REPAIR -> READY_FOR_PICKUP)"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->READY_FOR_PICKUP; ready_at set; final_charge_cents computed FINAL; sla_breached computed; increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/notify-ready"
    description: "Send the ready-for-pickup notification (parallel notify dimension)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["notify_status NONE->READY_NOTIFIED; Notification(kind=READY_FOR_PICKUP) appended; increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/pickup"
    description: "Customer pickup (READY_FOR_PICKUP/UNCLAIMED -> PICKED_UP)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->PICKED_UP; picked_up_at set; warranty_expires_at computed; increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/flag-unclaimed"
    description: "Flag an uncollected ticket as UNCLAIMED and warn (READY_FOR_PICKUP -> UNCLAIMED)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->UNCLAIMED; notify_status->UNCLAIMED_WARNED; Notification(kind=UNCLAIMED_WARNING); increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/dispose"
    description: "Dispose an unclaimed item after the disposal window (UNCLAIMED -> DISPOSED)"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->DISPOSED; all non-VOIDED ServiceLines->VOIDED; increments RepairTicket.version by 1"]

  - method: POST
    path: "/repair-tickets/{id}/cancel"
    description: "Cancel a ticket before repair completion"
    roles: [ShopManager]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["repair_status->CANCELLED; cascade cancel parts -> void lines -> reject open estimate; increments RepairTicket.version by 1"]

  # ---- TicketItem (top-level; ticket_id filter) ----
  - method: POST
    path: "/ticket-items"
    description: "Add a TicketItem with intake condition"
    roles: [FrontDeskClerk]
    code: 201
    input: [ticket_id, item_category, description, condition_grade, "condition_notes?"]
    output: TicketItem
    side_effects: []

  - method: GET
    path: "/ticket-items"
    description: "List TicketItems (FK reverse-reachability for TicketItem.ticket_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: "TicketItem[]"
    side_effects: []

  - method: GET
    path: "/ticket-items/{id}"
    description: "Get a TicketItem"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: TicketItem
    side_effects: []

  # ---- ServiceLine (top-level; ticket_id / ticket_item_id / service_type_id filters) ----
  - method: POST
    path: "/service-lines"
    description: "Add a ServiceLine (service applied to an item)"
    roles: [FrontDeskClerk, RepairTechnician]
    code: 201
    input: [ticket_id, ticket_item_id, service_type_id]
    output: ServiceLine
    side_effects: ["status=QUOTED; quoted_price_cents snapshot from ServiceType.base_price_cents"]

  - method: GET
    path: "/service-lines"
    description: "List ServiceLines (FK reverse-reachability for ServiceLine.ticket_id, .ticket_item_id, .service_type_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: ["ticket_id?", "ticket_item_id?", "service_type_id?", "limit?", "offset?"]
    output: "ServiceLine[]"
    side_effects: []

  - method: GET
    path: "/service-lines/{id}"
    description: "Get a ServiceLine"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: ServiceLine
    side_effects: []

  - method: PATCH
    path: "/service-lines/{id}"
    description: "Technician adjusts a line price and/or completes it during repair"
    roles: [RepairTechnician]
    code: 200
    input: ["adjusted_price_cents?", "status?"]
    output: ServiceLine
    side_effects: ["status QUOTED->COMPLETED when status=COMPLETED supplied and ticket.repair_status==IN_REPAIR; increments RepairTicket.version by 1"]

  # ---- Estimate (top-level; ticket_id / supersedes_estimate_id / authored_by_technician_id filters) ----
  - method: POST
    path: "/estimates"
    description: "Create a DRAFT Estimate (first estimate or a revision)"
    roles: [RepairTechnician]
    code: 201
    input: [ticket_id, authored_by_technician_id, "supersedes_estimate_id?"]
    output: Estimate
    side_effects: ["status=DRAFT; revision_number computed; totals computed PROVISIONAL"]

  - method: GET
    path: "/estimates"
    description: "List Estimates (FK reverse-reachability for Estimate.ticket_id, .supersedes_estimate_id, .authored_by_technician_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: ["ticket_id?", "supersedes_estimate_id?", "authored_by_technician_id?", "limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []

  - method: GET
    path: "/estimates/{id}"
    description: "Get an Estimate"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: POST
    path: "/estimates/{id}/present"
    description: "Present a DRAFT estimate to the customer (OCC-guarded on the ticket)"
    roles: [RepairTechnician]
    code: 200
    input: [expected_ticket_version]
    output: Estimate
    side_effects: ["Estimate DRAFT->PRESENTED; ticket->AWAITING_APPROVAL; prior REJECTED estimate->SUPERSEDED on revision; Notification appended; increments RepairTicket.version by 1"]

  - method: POST
    path: "/estimates/{id}/approve"
    description: "Customer approves the presented estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate PRESENTED->APPROVED; ticket->APPROVED or AWAITING_PARTS; ready_by computed; increments RepairTicket.version by 1"]

  - method: POST
    path: "/estimates/{id}/reject"
    description: "Customer rejects the presented estimate"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate PRESENTED->REJECTED; ticket->REVISION_REQUESTED; increments RepairTicket.version by 1"]

  # ---- PartsOrder (top-level; ticket_id / service_line_id filters) ----
  - method: POST
    path: "/parts-orders"
    description: "Request a PartsOrder against a ServiceLine"
    roles: [RepairTechnician]
    code: 201
    input: [ticket_id, service_line_id, part_name, supplier_cost_cents, "quantity?", lead_time_days]
    output: PartsOrder
    side_effects: ["status=REQUESTED; marked_up_cost_cents computed via parts_markup"]

  - method: GET
    path: "/parts-orders"
    description: "List PartsOrders (FK reverse-reachability for PartsOrder.ticket_id, .service_line_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: ["ticket_id?", "service_line_id?", "limit?", "offset?"]
    output: "PartsOrder[]"
    side_effects: []

  - method: GET
    path: "/parts-orders/{id}"
    description: "Get a PartsOrder"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician]
    code: 200
    input: []
    output: PartsOrder
    side_effects: []

  - method: POST
    path: "/parts-orders/{id}/order"
    description: "Place the parts order (REQUESTED->ORDERED)"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: PartsOrder
    side_effects: ["status->ORDERED; increments RepairTicket.version by 1"]

  - method: POST
    path: "/parts-orders/{id}/receive"
    description: "Receive the part (ORDERED->RECEIVED)"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: PartsOrder
    side_effects: ["status->RECEIVED; increments RepairTicket.version by 1"]

  - method: POST
    path: "/parts-orders/{id}/cancel"
    description: "Cancel the parts order"
    roles: [RepairTechnician]
    code: 200
    input: []
    output: PartsOrder
    side_effects: ["status->CANCELLED; marked_up_cost excluded from future estimates; increments RepairTicket.version by 1"]

  # ---- Payment (top-level; ticket_id filter; OCC-guarded) ----
  - method: POST
    path: "/payments"
    description: "Capture a Payment against a ticket (OCC-guarded on the ticket)"
    roles: [FrontDeskClerk]
    code: 201
    input: [ticket_id, amount_cents, method, expected_ticket_version]
    output: Payment
    side_effects: ["Payment state=CAPTURED; amount_paid_cents recomputed; increments RepairTicket.version by 1"]

  - method: GET
    path: "/payments"
    description: "List Payments (FK reverse-reachability for Payment.ticket_id)"
    roles: [FrontDeskClerk, ShopManager]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/payments/{id}"
    description: "Get a Payment"
    roles: [FrontDeskClerk, ShopManager]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/payments/{id}/refund"
    description: "Refund a captured payment (compensating action)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["Payment state CAPTURED->REFUNDED; amount_paid_cents recomputed (excludes refunded); increments RepairTicket.version by 1"]

  # ---- Notification (top-level; ticket_id filter) ----
  - method: GET
    path: "/notifications"
    description: "List Notifications (FK reverse-reachability for Notification.ticket_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: ["ticket_id?", "kind?", "limit?", "offset?"]
    output: "Notification[]"
    side_effects: []

  - method: GET
    path: "/notifications/{id}"
    description: "Get a Notification"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: Notification
    side_effects: []

  # ---- WarrantyClaim (top-level) ----
  - method: POST
    path: "/warranty-claims"
    description: "File a WarrantyClaim against a picked-up ticket's service line"
    roles: [Customer]
    code: 201
    input: [ticket_id, service_line_id, reported_by_customer_id, defect_description]
    output: WarrantyClaim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/warranty-claims"
    description: "List WarrantyClaims (FK reverse-reachability for WarrantyClaim.ticket_id, .service_line_id, .reported_by_customer_id, .ruled_by_technician_id, .redo_ticket_id)"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: ["ticket_id?", "service_line_id?", "reported_by_customer_id?", "ruled_by_technician_id?", "redo_ticket_id?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get a WarrantyClaim"
    roles: [FrontDeskClerk, ShopManager, RepairTechnician, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Manager approves a claim; spawns a no-charge redo ticket"
    roles: [ShopManager]
    code: 200
    input: [ruled_by_technician_id]
    output: WarrantyClaim
    side_effects: ["status->APPROVED; spawn redo RepairTicket; set redo_ticket_id; segregation check vs estimate author"]

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Manager denies a claim"
    roles: [ShopManager]
    code: 200
    input: [ruled_by_technician_id]
    output: WarrantyClaim
    side_effects: ["status->DENIED; segregation check vs estimate author"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_TICKET_OWNER, http: 403, condition: "Acting Customer is not the owner of the ticket (X-User-ID != ticket.customer_id) on approve/reject" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 403, condition: "WarrantyClaim ruling technician equals the approved estimate's author" }

  # --- Not found ---
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "RepairTicket with given id does not exist" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "Estimate with given id does not exist" }
  - { id: ERR_PARTS_ORDER_NOT_FOUND, http: 404, condition: "PartsOrder with given id does not exist" }
  - { id: ERR_SERVICE_LINE_NOT_FOUND, http: 404, condition: "ServiceLine with given id does not exist" }
  - { id: ERR_TICKET_ITEM_NOT_FOUND, http: 404, condition: "TicketItem with given id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim with given id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer with given id does not exist" }
  - { id: ERR_SERVICE_TYPE_NOT_FOUND, http: 404, condition: "ServiceType with given id does not exist" }

  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum/type/range, retired ServiceType, or item_category mismatch between ServiceType and TicketItem" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A body foreign-key reference does not resolve or belongs to a different ticket" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Customer.email or ServiceType.code already exists" }

  # --- State ---
  - { id: ERR_INVALID_TICKET_STATE, http: 409, condition: "RepairTicket not in a valid state for the requested transition" }
  - { id: ERR_INVALID_ESTIMATE_STATE, http: 409, condition: "Estimate not in a valid state for present/approve/reject" }
  - { id: ERR_INVALID_PARTS_STATE, http: 409, condition: "PartsOrder not in a valid state for order/receive/cancel" }
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "WarrantyClaim not in FILED state for approve/deny" }
  - { id: ERR_STALE_TICKET_VERSION, http: 412, condition: "expected_ticket_version does not match RepairTicket.version (OCC)" }
  - { id: ERR_NO_SERVICE_LINES, http: 409, condition: "Present requires at least one non-VOIDED ServiceLine on the ticket" }
  - { id: ERR_BAD_REVISION_CHAIN, http: 409, condition: "Revision estimate does not supersede the most recent REJECTED estimate" }
  - { id: ERR_PARTS_NOT_READY, http: 409, condition: "start-repair from AWAITING_PARTS requires all PartsOrders in {RECEIVED, CANCELLED}" }
  - { id: ERR_NO_TECHNICIAN, http: 409, condition: "start-repair requires an assigned active Technician" }
  - { id: ERR_LINES_NOT_COMPLETED, http: 409, condition: "mark-ready requires every non-VOIDED ServiceLine to be COMPLETED" }
  - { id: ERR_NOT_CANCELLABLE, http: 409, condition: "Ticket not in a cancellable state (IN_REPAIR/READY_FOR_PICKUP/PICKED_UP/UNCLAIMED/DISPOSED/CANCELLED)" }
  - { id: ERR_PAYMENT_NOT_REFUNDABLE, http: 409, condition: "refund attempted on a Payment that is not CAPTURED" }

  # --- Temporal / unclaimed / warranty ---
  - { id: ERR_UNCLAIMED_TOO_EARLY, http: 409, condition: "flag-unclaimed before ready_at + UNCLAIMED_GRACE_DAYS" }
  - { id: ERR_DISPOSAL_TOO_EARLY, http: 409, condition: "dispose before ready_at + DISPOSAL_DAYS" }
  - { id: ERR_UNCLAIMED_NOT_WARNED, http: 409, condition: "dispose requires notify_status == UNCLAIMED_WARNED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "WarrantyClaim filed after warranty_expires_at or ticket not PICKED_UP" }

  # --- Fiscal ---
  - { id: ERR_BALANCE_DUE, http: 402, condition: "pickup attempted while amount_paid_cents < final_charge_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FrontDeskClerk
    description: "Handles intake, items, pickup, payments, ready/unclaimed notifications"
    identity: opaque
    exclusive_operations:
      - "POST /repair-tickets — intake a ticket"
      - "POST /ticket-items — add item"
      - "POST /repair-tickets/{id}/notify-ready — send ready notification"
      - "POST /payments — capture payment"
      - "POST /repair-tickets/{id}/pickup — release item at pickup"
      - "POST /repair-tickets/{id}/flag-unclaimed — flag unclaimed"
    shared_operations:
      - "POST /customers — create customer (with ShopManager)"
      - "POST /service-lines — add service line (with RepairTechnician)"
      - "PATCH /repair-tickets/{id} — assign technician / priority (with ShopManager)"
      - "GET reads across customers, tickets, items, lines, estimates, parts, notifications, payments"

  - name: RepairTechnician
    description: "Builds estimates, orders parts, performs and completes repair work"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /estimates — create draft estimate"
      - "POST /estimates/{id}/present — present estimate (OCC)"
      - "POST /parts-orders (+ /order, /receive, /cancel) — manage parts"
      - "PATCH /service-lines/{id} — adjust price / complete line"
      - "POST /repair-tickets/{id}/start-repair — begin repair"
      - "POST /repair-tickets/{id}/mark-ready — mark ready"
    shared_operations:
      - "POST /service-lines — add service line (with FrontDeskClerk)"
      - "GET reads across catalog, tickets, lines, estimates, parts"

  - name: ShopManager
    description: "Owns catalog, technicians, cancellations, unclaimed disposal, and warranty rulings"
    identity: opaque
    exclusive_operations:
      - "POST /service-types (+ /retire) — manage catalog"
      - "POST /technicians — manage technicians"
      - "POST /repair-tickets/{id}/cancel — cancel ticket"
      - "POST /repair-tickets/{id}/dispose — dispose unclaimed"
      - "POST /warranty-claims/{id}/approve|deny — adjudicate warranty"
      - "POST /_clock/set — set test clock"
    shared_operations:
      - "POST /customers — create customer (with FrontDeskClerk)"
      - "PATCH /repair-tickets/{id} — assign technician / priority (with FrontDeskClerk)"
      - "GET reads across all resources"

  - name: Customer
    description: "Ticket owner; approves/rejects estimates and files warranty claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /estimates/{id}/approve — approve estimate (owner only)"
      - "POST /estimates/{id}/reject — reject estimate (owner only)"
      - "POST /warranty-claims — file warranty claim (owner only)"
    shared_operations:
      - "GET reads of own ticket, items, lines, estimates, notifications, claims"
