          trigger:
            - { call: "POST /compliance/employees", payload: { employee_no: "E-DEF8", full_name: "Def8 Emp", hired_at: "2026-01-15T00:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a_assigned: "$.data[0].assigned_at", a_due: "$.data[0].base_due_at" } }
          assert:
