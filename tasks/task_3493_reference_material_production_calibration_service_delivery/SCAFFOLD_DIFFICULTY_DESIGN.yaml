# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Reference Material Production & Calibration Service Delivery
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: weighted_vs_unweighted_certified_value
        grounds:
          - calculations.certified_value_assignment
          - entities.CertificateOfAnalysis.fields.certified_value
          - entities.CertificateOfAnalysis.fields.characterization_uncertainty
        distinguishing_aspect: |
          Same two ACCEPTED methods (mean 100.0 u 2.0; mean 104.0 u 1.0) on two
          identical lots produce certified_value 103.2 under WEIGHTED_MEAN but
          102.0 under UNWEIGHTED_MEAN — the variant choice changes the published
          value on the MaterialLot/Certificate entity domain.
        test_recipe:
          setup:
            - "program P; lots LA and LB each driven SOURCING -> HOMOGENEITY_TESTING(PASS, u_hom 0) -> VALUE_ASSIGNMENT"
            - "each lot has ACCEPTED methods M1 (100.0, 2.0, analyst met-1) and M2 (104.0, 1.0, analyst met-2)"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-01", name: "RM Program", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog1: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog1}", material_code: "SRM-A", matrix_description: "matrix A", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_a: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog1}", material_code: "SRM-B", matrix_description: "matrix B", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_b: $.data.id }
            - call: "POST /metrology/material-lots/${lot_a}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_a_v: $.data.version }
            - call: "POST /metrology/material-lots/${lot_b}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_b_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_a}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_a1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_a}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_a2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_a1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_a2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_b}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_b1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_b}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_b2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_b1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_b2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
          trigger:
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_a}", certificate_code: "CERT-A", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [{ label: "stability", std_uncertainty: 0.5 }], validity_days: 30, expected_lot_version: "${lot_a_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_a_val: $.data.certified_value, cert_a_uchar: $.data.characterization_uncertainty, cert_a_uc: $.data.combined_standard_uncertainty, cert_a_u: $.data.expanded_uncertainty }
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_b}", certificate_code: "CERT-B", value_assignment_variant: UNWEIGHTED_MEAN, uncertainty_components: [], validity_days: 30, expected_lot_version: "${lot_b_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_b_val: $.data.certified_value, cert_b_uchar: $.data.characterization_uncertainty, cert_b_uc: $.data.combined_standard_uncertainty, cert_b_u: $.data.expanded_uncertainty }
          assert:
            - "cert_a_val == 103.2"
            - "cert_a_uchar == 0.894427"
            - "cert_a_uc == 1.024695"
            - "cert_a_u == 2.04939"
            - "cert_b_val == 102.0"
            - "cert_b_uchar == 2.0"
            - "cert_b_uc == 2.0"
            - "cert_b_u == 4.0"
            - "cert_a_val != cert_b_val"

      - name: order_date_vs_ship_date_unit_pricing
        grounds:
          - calculations.order_pricing
          - entities.SalesOrder.fields.quoted_unit_price_cents
          - entities.SalesOrder.fields.final_unit_price_cents
        distinguishing_aspect: |
          A pricing-update between creation and fulfillment leaves
          quoted_unit_price_cents at 900 (ORDER_DATE variant) while
          final_unit_price_cents is recomputed to 1080 (SHIP_DATE variant) on
          the SalesOrder entity domain — two valid valuation times diverge by 180.
        test_recipe:
          setup:
            - "program P with material_unit_price_cents 1000 and ACCREDITED_LAB discount 10%; customer C (ACCREDITED_LAB)"
            - "lot L driven to IN_DISTRIBUTION (flat homogeneity, 2 accepted methods, WEIGHTED_MEAN cert published, validity 365)"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-02", name: "RM Program 2", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog2: $.data.id, prog2_v: $.data.version }
            - call: "POST /metrology/customers"
              payload: { name: "Accredited Lab Co", tier: ACCREDITED_LAB, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { cust_acc: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog2}", material_code: "SRM-C", matrix_description: "matrix C", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_c: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_c_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_c1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_c}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_c2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_c1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_c2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_c}", certificate_code: "CERT-C", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_c_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_c: $.data.id }
            - call: "POST /metrology/certificates/${cert_c}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_c}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
          trigger:
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_c}", quantity: 5 }
              as: Customer
              as_user_id: "${cust_acc}"
              captures: { ord: $.data.id, ord_quoted: $.data.quoted_unit_price_cents }
            - call: "POST /metrology/programs/${prog2}/pricing-update"
              payload: { expected_program_version: "${prog2_v}", material_unit_price_cents: 1200 }
              as: ProgramAdmin
            - call: "POST /metrology/sales-orders/${ord}/transitions"
              payload: { to: FULFILLED }
              as: InventoryManager
              captures: { ord_final: $.data.final_unit_price_cents, ord_sub: $.data.invoice_subtotal_cents, ord_fee: $.data.handling_fee_cents, ord_total: $.data.invoice_total_cents }
          assert:
            - "ord_quoted == 900"
            - "ord_final == 1080"
            - "ord_sub == 5400"
            - "ord_fee == 500"
            - "ord_total == 5900"
            - "ord_final != ord_quoted"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pro_rata_allocation_waterfall
        grounds:
          - calculations.shortage_allocation
          - entities.MaterialLot.fields.allocation_policy
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear waterfall — floor(pool * w_i * open_i / S)
          capped at open_i, then leftover units redistributed one at a time by
          tier weight DESC / created_at ASC — yields O_F 4, O_A 3, O_G 1, O_BIG 0
          for a pool of 7 across three eligible backorders (the released order
          O_BIG is excluded from its own release-triggered sweep).
        test_recipe:
          setup:
            - "program P; lot L allocation_policy PRO_RATA, total 8, driven to IN_DISTRIBUTION with flat homogeneity consuming 0 qc units (bottle_means are virtual here: use 4 bottles so qc = 4, total 12 -> usable 8)"
            - "O_BIG (GENERAL) qty 7 -> allocated 7; O_F (FEDERAL) qty 4 -> allocated 1 open 3; O_A (ACCREDITED_LAB) qty 4 -> 0/4; O_G (GENERAL) qty 4 -> 0/4"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-03", name: "RM Program 3", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog3: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "Big General", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_big: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "Fed Agency", tier: FEDERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_f: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "Acc Lab", tier: ACCREDITED_LAB, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_a: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "Small General", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_g: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog3}", material_code: "SRM-D", matrix_description: "matrix D", total_units_produced: 12, allocation_policy: PRO_RATA }
              as: ProgramAdmin
              captures: { lot_d: $.data.id }
            - call: "POST /metrology/material-lots/${lot_d}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_d_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_d}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_d1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_d}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_d2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_d1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_d2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_d}", certificate_code: "CERT-D", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_d_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_d: $.data.id }
            - call: "POST /metrology/certificates/${cert_d}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_d}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_d}", quantity: 7 }
              as: Customer
              as_user_id: "${c_big}"
              captures: { o_big: $.data.id }
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_d}", quantity: 4 }
              as: Customer
              as_user_id: "${c_f}"
              captures: { o_f: $.data.id }
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_d}", quantity: 4 }
              as: Customer
              as_user_id: "${c_a}"
              captures: { o_a: $.data.id }
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_d}", quantity: 4 }
              as: Customer
              as_user_id: "${c_g}"
              captures: { o_g: $.data.id }
          trigger:
            - call: "POST /metrology/sales-orders/${o_big}/transitions"
              payload: { to: BACKORDERED }
              as: Customer
              as_user_id: "${c_big}"
          assert:
            - "GET /sales-orders/${o_f}: allocated_quantity == 4 and status == ALLOCATED (1 prior + 2 floor share + 1 leftover unit at weight 3)"
            - "GET /sales-orders/${o_a}: allocated_quantity == 3 and status == BACKORDERED (floor share 2, plus the 1 leftover unit at weight 2 after O_F is full)"
            - "GET /sales-orders/${o_g}: allocated_quantity == 1 and status == BACKORDERED"
            - "GET /sales-orders/${o_big}: allocated_quantity == 0 and status == BACKORDERED (excluded from its own release sweep)"
            - "GET /material-lots/${lot_d}: units_reserved == 8 and units_available == 0"

      - name: per_unit_then_multiply_price_rounding
        grounds:
          - calculations.order_pricing
          - entities.SalesOrder.fields.invoice_subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — per-unit price rounded to
          integer cents BEFORE multiplying: round_half_up(995*0.9)=896 then x2 =
          1792, where the forbidden multiply-then-round order gives 1791.
        test_recipe:
          setup:
            - "program P with material_unit_price_cents 995, GENERAL discount 10, threshold 10000, flat fee 500"
            - "customer C (GENERAL); lot L in IN_DISTRIBUTION, 20 units"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-04", name: "RM Program 4", material_unit_price_cents: 995, discount_pct_federal: 0, discount_pct_accredited_lab: 0, discount_pct_general: 10, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog4: $.data.id }
            - call: "POST /metrology/customers"
              payload: { name: "Gen Cust", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_gen: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog4}", material_code: "SRM-E", matrix_description: "matrix E", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_e: $.data.id }
            - call: "POST /metrology/material-lots/${lot_e}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { lot_e_v: $.data.version }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_e}", method_code: "ID-ICP-MS", method_mean: 100.0, method_std_uncertainty: 2.0 }
              as: Metrologist
              as_user_id: met-1
              captures: { m_e1: $.data.id }
            - call: "POST /metrology/value-assignment-methods"
              payload: { lot_id: "${lot_e}", method_code: "GRAV", method_mean: 104.0, method_std_uncertainty: 1.0 }
              as: Metrologist
              as_user_id: met-2
              captures: { m_e2: $.data.id }
            - call: "POST /metrology/value-assignment-methods/${m_e1}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/value-assignment-methods/${m_e2}/transitions"
              payload: { to: ACCEPTED }
              as: CertificationOfficer
              as_user_id: co-1
            - call: "POST /metrology/certificates"
              payload: { lot_id: "${lot_e}", certificate_code: "CERT-E", value_assignment_variant: WEIGHTED_MEAN, uncertainty_components: [], validity_days: 365, expected_lot_version: "${lot_e_v}" }
              as: CertificationOfficer
              as_user_id: co-1
              captures: { cert_e: $.data.id }
            - call: "POST /metrology/certificates/${cert_e}/transitions"
              payload: { to: PUBLISHED }
              as: CertificationOfficer
              as_user_id: co-2
            - call: "POST /metrology/material-lots/${lot_e}/transitions"
              payload: { to: IN_DISTRIBUTION }
              as: InventoryManager
          trigger:
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_e}", quantity: 2 }
              as: Customer
              as_user_id: "${c_gen}"
              captures: { ord_e: $.data.id, ord_e_quoted: $.data.quoted_unit_price_cents }
            - call: "POST /metrology/sales-orders/${ord_e}/transitions"
              payload: { to: FULFILLED }
              as: InventoryManager
              captures: { ord_e_sub: $.data.invoice_subtotal_cents, ord_e_fee: $.data.handling_fee_cents, ord_e_total: $.data.invoice_total_cents }
          assert:
            - "ord_e_quoted == 896"
            - "ord_e_sub == 1792"
            - "ord_e_fee == 500"
            - "ord_e_total == 2292"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_value_assignment_retest_cycle
        grounds:
          - state_machines.MaterialLot.VALUE_ASSIGNMENT_to_HOMOGENEITY_TESTING
          - state_machines.MaterialLot.HOMOGENEITY_TESTING_to_HOMOGENEITY_TESTING
          - calculations.homogeneity_assessment
        distinguishing_aspect: |
          MaterialLot supports a cyclic shape — VALUE_ASSIGNMENT -> HOMOGENEITY_TESTING
          (retest) plus a FAIL self-loop — and each pass overwrites homogeneity
          stats while accumulating qc_units_consumed (16 after four 4-bottle tests).
        test_recipe:
          setup:
            - "program P; lot L total 20 in SOURCING"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-05", name: "RM Program 5", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog5: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog5}", material_code: "SRM-F", matrix_description: "matrix F", total_units_produced: 20 }
              as: ProgramAdmin
              captures: { lot_f: $.data.id }
          trigger:
            - call: "POST /metrology/material-lots/${lot_f}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [7.0, 7.0, 13.0, 13.0], within_bottle_std: 1.0, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { r1_status: $.data.status, r1_verdict: $.data.homogeneity_verdict, r1_f: $.data.homogeneity_f_ratio }
            - call: "POST /metrology/material-lots/${lot_f}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { r2_status: $.data.status }
            - call: "POST /metrology/material-lots/${lot_f}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [7.0, 7.0, 13.0, 13.0], within_bottle_std: 1.0, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { r3_status: $.data.status }
            - call: "POST /metrology/material-lots/${lot_f}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { r4_status: $.data.status, r4_f: $.data.homogeneity_f_ratio, r4_qc: $.data.qc_units_consumed, r4_avail: $.data.units_available }
          assert:
            - "r1_status == HOMOGENEITY_TESTING and r1_verdict == FAIL and r1_f == 12.0"
            - "r2_status == VALUE_ASSIGNMENT (PASS auto-advance from the self-loop retest)"
            - "r3_status == HOMOGENEITY_TESTING (VALUE_ASSIGNMENT -> HOMOGENEITY_TESTING cycle with FAIL verdict)"
            - "r4_status == VALUE_ASSIGNMENT and r4_f == 0.0"
            - "r4_qc == 16 and r4_avail == 4"

      - name: calibration_measurement_hold_cycle
        grounds:
          - state_machines.CalibrationOrder.IN_MEASUREMENT_to_MEASUREMENT_HOLD
          - state_machines.CalibrationOrder.MEASUREMENT_HOLD_to_IN_MEASUREMENT
          - calculations.calibration_fee
        distinguishing_aspect: |
          CalibrationOrder supports a non-linear hold/resume cycle
          (IN_MEASUREMENT -> MEASUREMENT_HOLD -> IN_MEASUREMENT) before COMPLETED,
          on a different entity than the MaterialLot retest cycle; the standard
          (non-expedite) fee branch leaves final_fee_cents == quoted_fee_cents == 26000.
        test_recipe:
          setup:
            - "program P (capacity 480, expedite_multiplier_pct 150); service S (base 20000, per-point 1500); valid traceability link L"
            - "customer C; calibration order O with measurement_points 4, expedite_requested false -> quoted 26000"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-06", name: "RM Program 6", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog6: $.data.id }
            - call: "POST /metrology/calibration-services"
              payload: { service_code: "DCV-1", measurand: "DC voltage", base_fee_cents: 20000, per_point_fee_cents: 1500, standard_turnaround_days: 5 }
              as: ProgramAdmin
              captures: { svc: $.data.id }
