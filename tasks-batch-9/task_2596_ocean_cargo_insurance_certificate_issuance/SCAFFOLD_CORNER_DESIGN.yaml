        distinguishing_aspect: |
          A second appointment whose travel-buffered window touches an existing
          one must return 409 ERR_SURVEYOR_WINDOW_CONFLICT.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / surveyor_calendar_closed_interval_with_travel_buffer"
          rationale: |
            The §1.8 instance already triggers this error at the exact buffered
            boundary (a request starting 45 minutes after the previous window
            ends is refused because the intervals are CLOSED, while 46 minutes
            later is accepted), so a §1.9 triggerability test would be strictly
            weaker than what already exists.

  - section: rbac
    instances:
      - name: assured_cannot_issue_and_underwriter_cannot_declare_a_shipment
        claim_type: role_permission_denial
        grounds:
          - roles.Assured.exclusive_operations
          - roles.Underwriter.exclusive_operations
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Declaring and issuing are exclusive to opposite sides of the contract and
          neither side may cross: the Assured that created the certificate cannot
          issue it, and the Underwriter that will issue it cannot declare one.
          The pair matters because both act on the SAME resource — a naive
          implementation that authorises the whole /certificates subtree per role
          passes one leg and fails the other. PlatformAdmin, who reads everything,
          also cannot issue.
        test_recipe:
          setup:
            - "an ACTIVE policy with one DRAFT certificate created by its Assured"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
