# ============================================================================
# SCAFFOLD — Recipe Costing, Menu Engineering & Plate Cost Management
# §1.0 Response Envelope .. §1.7 RBAC Matrix
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# ============================================================================

scenario: "2989. Recipe Costing, Menu Engineering & Plate Cost Management (multi-unit restaurant culinary team): recipe tree with sub-recipes, yields and shrink factors, ingredient cost feeds from distributors with regional price variance, plate cost and theoretical food cost versus actual variance analysis, menu mix and contribution margin classification for engineering decisions, price change modeling with elasticity assumptions and market caps, allergen and nutrition roll-up from the recipe tree, LTO costing and post-promotion profitability review, specification changes propagating to prep guides and inventory counts"

domain_name: "recipe-costing-menu-engineering"
api_prefix: "/culinary"

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # The recipe tree is a self-referential DAG: RecipeComponent is a junction row
  # that points at either an Ingredient (leaf) or another Recipe (sub-recipe),
  # so Recipe->Recipe edges form a many-to-many acyclic graph. Every other
  # entity is a flat peer joined by foreign keys (no nesting in URL paths beyond
  # a single collection segment under the api_prefix).

  state_machine_shape: cyclic
  # PriceChangeProposal cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED with a
  # bounded revision counter; Recipe cycles ACTIVE -> UNDER_REVIEW -> ACTIVE after a
  # specification change; SpecChangeOrder carries two independent state dimensions
  # (approval_status x propagation_status); LTOCampaign branches CLOSED -> {RENEWED, RETIRED}
  # with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The operator that submits a SpecChangeOrder or a PriceChangeProposal is
  # recorded in submitted_by_user_id and is forbidden from approving it, even
  # when that operator legitimately holds the CulinaryDirector role.

  consistency_model: immediate
  # Every mutation, cascade hop and derived-field invalidation is visible in the
  # same request's response. Costs are never silently recomputed: a mutation that
  # invalidates a cost marks cost_state = STALE and an explicit roll-up call
  # recomputes it.

  difficulty_level: expert_plus
  entity_count: 14
  endpoint_count: 63
  error_code_count: 48
  calculation_count: 9
  state_machine_count: 8
  validation_row_count: 49
  role_count: 5

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Human-readable store code, unique across all units"
        constraints: "^[A-Z0-9-]{3,12}$; unique"
      - name: name
        type: string
        source: input
        description: "Store display name"
        constraints: "1..80 chars"
      - name: region_code
        type: enum
        source: input
        description: "Pricing region the unit buys in; drives freight uplift and market caps"
        constraints: "one of NE, SE, MW, WEST"

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Distributor-independent purchasing SKU, unique across ingredients"
        constraints: "^[A-Z0-9-]{3,20}$; unique"
      - name: name
        type: string
        source: input
        description: "Ingredient display name"
        constraints: "1..80 chars"
      - name: base_uom
        type: enum
        source: input
        description: "Base unit of measure every quantity for this ingredient is expressed in"
        constraints: "one of GRAM, MILLILITER, EACH"
      - name: pack_base_units
        type: integer
        source: input
        description: "Number of base units in one purchased pack; the divisor that turns a pack cost into a per-base-unit cost"
        constraints: ">= 1"
      - name: trim_yield_bps
        type: integer
        source: input
        description: "Trim/butchery yield in basis points: edible-portion units recovered per 10000 as-purchased units"
        constraints: "1..10000"
      - name: cook_shrink_bps
        type: integer
        source: input
        description: "Cooking shrink in basis points lost during cooking, applied on top of trim yield"
        constraints: "0..9999"
      - name: net_yield_bps
        type: integer
        source: computed
        description: "floor(trim_yield_bps * (10000 - cook_shrink_bps) / 10000) — combined yield used to convert an EP spec quantity into an AP purchase quantity"
        constraints: ">= 1"
      - name: allergen_mask
        type: integer
        source: input
        description: "Bitmask of allergens present: MILK=1, EGG=2, GLUTEN=4, PEANUT=8, SOY=16, FISH=32, SHELLFISH=64, TREE_NUT=128"
        constraints: "0..255"
      - name: kcal_per_base_unit_micros
        type: integer
        source: input
        description: "Energy in micro-kcal per base unit (1 kcal = 1000000)"
        constraints: ">= 0"
      - name: sodium_mcg_per_base_unit
        type: integer
        source: input
        description: "Sodium in micrograms per base unit"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Purchasing status; RETIRED ingredients may not be added to recipes and block recipe activation"
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant the ingredient was retired; null while ACTIVE"

  - name: PriceFeed
    parent: null
    common_fields: true
    fields:
      - name: distributor_code
        type: enum
        source: input
        description: "Distributor that submitted the feed"
        constraints: "one of BROADLINE, PRODUCE, PROTEIN"
      - name: region_code
        type: enum
        source: input
        description: "Region every price line in this feed applies to"
        constraints: "one of NE, SE, MW, WEST"
      - name: feed_date
        type: datetime
        source: input
        description: "Distributor-stated publication date of the feed (ISO 8601 UTC, three fractional digits)"
      - name: status
        type: enum
        source: system
        description: "DRAFT while lines are being loaded; PUBLISHED once the feed's prices become effective"
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED"
      - name: line_count
        type: integer
        source: computed
        description: "Count of IngredientPrice rows whose price_feed_id equals this feed's id"
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while DRAFT"
      - name: superseded_price_count
        type: integer
        source: computed
        description: "Number of previously PUBLISHED IngredientPrice rows flipped to SUPERSEDED by this feed's publication"
        default: 0
      - name: affected_recipe_count
        type: integer
        source: computed
        description: "Number of distinct Recipe rows whose cost_state was flipped FRESH -> STALE by this feed's publication, including transitive parents"
        default: 0
      - name: affected_menu_item_count
        type: integer
        source: computed
        description: "Number of distinct MenuItem rows whose plate_cost_state was flipped FRESH -> STALE by this feed's publication"
        default: 0

  - name: IngredientPrice
    parent: PriceFeed
    common_fields: true
    fields:
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the ingredient this price quotes"
      - name: price_feed_id
        type: string
        source: system
        description: "FK -> PriceFeed.id; the feed this line was loaded under, taken from the path"
      - name: region_code
        type: enum
        source: system
        description: "Copied from the parent feed's region_code at line creation"
        constraints: "one of NE, SE, MW, WEST"
      - name: distributor_code
        type: enum
        source: system
        description: "Copied from the parent feed's distributor_code at line creation"
        constraints: "one of BROADLINE, PRODUCE, PROTEIN"
      - name: pack_cost_micros
        type: integer
        source: input
        description: "Delivered cost of one pack in micro-dollars (1 USD = 1000000 micros)"
        constraints: ">= 1"
      - name: pack_base_units_snapshot
        type: integer
        source: system
        description: "Ingredient.pack_base_units frozen at line creation; the divisor used by every roll-up that reads this price"
        constraints: ">= 1"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the price window (ISO 8601 UTC, three fractional digits)"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the price window; null means open-ended"
      - name: status
        type: enum
        source: system
        description: "PENDING until the parent feed publishes, then PUBLISHED; flipped to SUPERSEDED when a later publication covers the same ingredient+region window"
        default: PENDING
        constraints: "one of PENDING, PUBLISHED, SUPERSEDED"

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Recipe code, unique across recipes"
        constraints: "^[A-Z0-9-]{3,20}$; unique"
      - name: name
        type: string
        source: input
        description: "Recipe display name"
        constraints: "1..80 chars"
      - name: recipe_type
        type: enum
        source: input
        description: "SUB_RECIPE rows may be referenced as components of other recipes; PLATED rows may back a MenuItem"
        constraints: "one of SUB_RECIPE, PLATED"
      - name: base_uom
        type: enum
        source: input
        description: "Base unit of measure of this recipe's batch yield; a SUB_RECIPE is consumed by its parent in this UOM"
        constraints: "one of GRAM, MILLILITER, EACH"
      - name: batch_yield_base_units
        type: integer
        source: input
        description: "Base units of finished product one batch yields; divisor for sub-recipe component costing"
        constraints: ">= 1"
      - name: portions_per_batch
        type: integer
        source: input
        description: "Number of portions one batch yields; divisor for portion cost and nutrition per portion"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; components are mutable only in DRAFT and UNDER_REVIEW"
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, ACTIVE, RETIRED"
      - name: cost_state
        type: enum
        source: system
        description: "FRESH only immediately after a successful cost roll-up; any component, price or sub-recipe cost change flips it to STALE"
        default: STALE
        constraints: "one of STALE, FRESH"
      - name: cost_basis
        type: enum
        source: system
        description: "Pricing basis used by the roll-up that produced the current cost figures; null before the first roll-up"
        constraints: "one of LATEST_PUBLISHED, WEIGHTED_AVG_90D, or null"
      - name: batch_cost_micros
        type: integer
        source: computed
        description: "Sum of extended_cost_micros over ACTIVE components of this recipe"
        default: 0
      - name: portion_cost_micros
        type: integer
        source: computed
        description: "round_half_up(batch_cost_micros / portions_per_batch)"
        default: 0
      - name: allergen_mask
        type: integer
        source: computed
        description: "Bitwise OR of allergen_mask over the transitive closure of ACTIVE components (ingredient leaves and sub-recipes)"
        default: 0
      - name: kcal_per_portion_micros
        type: integer
        source: computed
        description: "Transitive energy roll-up divided by portions_per_batch, rounded half-up to whole micro-kcal"
        default: 0
      - name: sodium_mcg_per_portion
        type: integer
        source: computed
        description: "Transitive sodium roll-up divided by portions_per_batch, rounded half-up to whole micrograms"
        default: 0
      - name: depth
        type: integer
        source: computed
        description: "0 for a recipe with no ACTIVE SUB_RECIPE component (all ingredient leaves); otherwise 1 + max(depth of the ACTIVE SUB_RECIPE components' children), exactly as calculations.allergen_nutrition_rollup computes it"
        default: 0
      - name: component_count
        type: integer
        source: computed
        description: "Count of RecipeComponent rows with recipe_id = this recipe and status = ACTIVE"
        default: 0
      - name: open_spec_change_count
        type: integer
        source: computed
        description: "Count of SpecChangeOrder rows with recipe_id = this recipe whose approval_status is in {DRAFT, PENDING}; every open/close of a spec change order mutates this counter and therefore advances Recipe.version"
        default: 0
      - name: last_rollup_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful cost roll-up; null before the first roll-up"

  - name: RecipeComponent
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: system
        description: "FK -> Recipe.id; the owning recipe, taken from the path"
      - name: component_type
        type: enum
        source: input
        description: "INGREDIENT lines carry ingredient_id; SUB_RECIPE lines carry child_recipe_id"
        constraints: "one of INGREDIENT, SUB_RECIPE"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; required when component_type = INGREDIENT, must be null otherwise"
      - name: child_recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; required when component_type = SUB_RECIPE, must be null otherwise"
      - name: ep_quantity_base_units
        type: integer
        source: input
        description: "Edible-portion quantity this recipe's specification calls for, in the referenced ingredient's or sub-recipe's base_uom"
        constraints: ">= 1"
      - name: ap_quantity_base_units
        type: integer
        source: computed
        description: "As-purchased quantity that must be bought to deliver ep_quantity_base_units: ceil(ep_quantity_base_units * 10000 / Ingredient.net_yield_bps) for INGREDIENT lines; equal to ep_quantity_base_units for SUB_RECIPE lines"
        default: 0
      - name: unit_cost_micros_used
        type: integer
        source: computed
        description: "The pack_cost_micros of the IngredientPrice selected by the last roll-up (INGREDIENT lines) or the child recipe's batch_cost_micros (SUB_RECIPE lines); 0 before the first roll-up"
        default: 0
      - name: extended_cost_micros
        type: integer
        source: computed
        description: "This line's contribution to the owning recipe's batch cost, rounded half-up to whole micros by the roll-up"
        default: 0
      - name: sequence_no
        type: integer
        source: input
        description: "Deterministic evaluation order of components inside a recipe; ties broken by created_at ASC"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "ACTIVE lines participate in every roll-up; REMOVED lines are retained for audit and excluded from every roll-up"
        default: ACTIVE
        constraints: "one of ACTIVE, REMOVED"
      - name: removed_at
        type: datetime
        source: system
        description: "Logical-clock instant the line was removed; null while ACTIVE"

  - name: PrepGuide
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: system
        description: "FK -> Recipe.id; the recipe this prep guide documents"
      - name: revision_no
        type: integer
        source: system
        description: "1 for the guide minted on first activation; incremented by one on each successful PREP_GUIDE propagation"
        default: 1
      - name: sync_state
        type: enum
        source: system
        description: "CURRENT when the guide matches the recipe specification; OUT_OF_DATE once an approved SpecChangeOrder changed the recipe"
        default: CURRENT
        constraints: "one of CURRENT, OUT_OF_DATE"
      - name: batch_yield_base_units_snapshot
        type: integer
        source: computed
        description: "Recipe.batch_yield_base_units as of the last sync"
      - name: portions_per_batch_snapshot
        type: integer
        source: computed
        description: "Recipe.portions_per_batch as of the last sync"
      - name: component_count_snapshot
        type: integer
        source: computed
        description: "Recipe.component_count as of the last sync"
      - name: synced_spec_version
        type: integer
        source: computed
        description: "Recipe.version as of the last sync; the value a propagation writes back"

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Menu item code, unique across menu items"
        constraints: "^[A-Z0-9-]{3,20}$; unique"
      - name: name
        type: string
        source: input
        description: "Menu item display name"
        constraints: "1..80 chars"
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; must reference a recipe whose recipe_type = PLATED"
      - name: region_code
        type: enum
        source: input
        description: "Region this menu item is sold in; selects freight uplift, competitor index and market cap multiplier"
        constraints: "one of NE, SE, MW, WEST"
      - name: current_price_cents
        type: integer
        source: input
        description: "Menu price in whole cents currently charged"
        constraints: ">= 1"
      - name: target_food_cost_bps
        type: integer
        source: input
        description: "Target food cost as basis points of menu price used by price-change cap relief"
        constraints: "500..9000"
      - name: declared_allergen_mask
        type: integer
        source: input
        description: "Allergen bitmask printed on the menu; must be a superset of the recipe roll-up mask at activation"
        constraints: "0..255"
      - name: is_kids_menu
        type: boolean
        source: input
        description: "When true the sodium-per-portion cap is enforced at activation"
        default: false
      - name: is_lto
        type: boolean
        source: system
        description: "True while at least one LTOCampaign for this menu item is in status LAUNCHED"
        default: false
      - name: open_lto_count
        type: integer
        source: computed
        description: "Count of LTOCampaign rows for this menu item whose status is in {PLANNED, COSTED, LAUNCHED}"
        default: 0
      - name: plate_cost_micros
        type: integer
        source: computed
        description: "Plate cost in micro-dollars produced by the last plate-cost run"
        default: 0
      - name: plate_cost_cents
        type: integer
        source: computed
        description: "round_half_up(plate_cost_micros / 10000)"
        default: 0
      - name: food_cost_bps
        type: integer
        source: computed
        description: "round_half_up(plate_cost_cents * 10000 / current_price_cents)"
        default: 0
      - name: contribution_margin_cents
        type: integer
        source: computed
        description: "current_price_cents - plate_cost_cents"
        default: 0
      - name: plate_cost_state
        type: enum
        source: system
        description: "FRESH only immediately after a successful plate-cost run; a recipe cost change, price change or spec change flips it to STALE"
        default: STALE
        constraints: "one of STALE, FRESH"
      - name: cost_basis
        type: enum
        source: system
        description: "Basis of the last plate-cost run; null before the first run"
        constraints: "one of LATEST_PUBLISHED, WEIGHTED_AVG_90D, or null"
      - name: allergen_mask
        type: integer
        source: computed
        description: "Copy of the backing recipe's transitive allergen_mask refreshed by every plate-cost run and by every allergen-affecting cascade"
        default: 0
      - name: sodium_mcg_per_portion
        type: integer
        source: computed
        description: "Copy of the backing recipe's sodium_mcg_per_portion refreshed by every plate-cost run"
        default: 0
      - name: margin_class
        type: enum
        source: computed
        description: "Menu-engineering class assigned by the most recent period classification; reset to UNCLASSIFIED whenever price or plate cost changes"
        default: UNCLASSIFIED
        constraints: "one of STAR, PLOWHORSE, PUZZLE, DOG, UNCLASSIFIED"
      - name: status
        type: enum
        source: system
        description: "DRAFT until activated; SUSPENDED when a promotion is retired; RETIRED is terminal"
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, SUSPENDED, RETIRED"
      - name: last_price_change_at
        type: datetime
        source: system
        description: "Logical-clock instant the last approved price change was applied; null when no change has been applied"

  - name: PriceChangeProposal
    parent: MenuItem
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item whose price the proposal changes"
      - name: proposed_price_cents
        type: integer
        source: input
        description: "Proposed new menu price in whole cents"
        constraints: ">= 1"
      - name: effective_from
        type: datetime
        source: input
        description: "Earliest logical-clock instant the approved price may be applied (ISO 8601 UTC, three fractional digits)"
      - name: elasticity_bps
        type: integer
        source: input
        description: "Assumed own-price elasticity as a POSITIVE magnitude in basis points: the basis points of unit decline per 10000 basis points of price increase. Units always move against price, so the sign is supplied by calculations.price_change_projection STEP 2, never by this field"
        constraints: "0..50000"
      - name: status
        type: enum
        source: system
        description: "Proposal lifecycle; the SUBMITTED -> REVISION_REQUESTED -> SUBMITTED loop is bounded by MAX_REVISION_ROUNDS"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, EFFECTIVE, REJECTED"
      - name: revision_round
        type: integer
        source: system
        description: "0 on creation; incremented by one each time a revision is requested"
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator that most recently submitted the proposal; compared against the approver for segregation of duties"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator that approved the proposal; null until approval"
      - name: last_revision_reason
        type: string
        source: system
        description: "Reason text supplied with the most recent revision request; null before the first request"
      - name: baseline_units
        type: integer
        source: computed
        description: "units_sold of the MenuMixLine selected from the latest CLOSED MenuPeriodReview for this menu item, or DEFAULT_BASELINE_UNITS when no such line exists"
        default: 0
      - name: price_delta_bps
        type: integer
        source: computed
        description: "sign(proposed_price_cents - MenuItem.current_price_cents) * round_half_up(abs(proposed_price_cents - MenuItem.current_price_cents) * 10000 / MenuItem.current_price_cents) — the magnitude is always rounded half up away from zero"
        default: 0
      - name: projected_unit_delta_bps
        type: integer
        source: computed
        description: "-sign(price_delta_bps) * round_half_up(abs(price_delta_bps) * elasticity_bps / 10000) — units always move against price, so a price increase yields a negative value here"
        default: 0
      - name: projected_units
        type: integer
        source: computed
        description: "max(0, round_half_up(baseline_units * (10000 + projected_unit_delta_bps) / 10000))"
        default: 0
      - name: projected_food_cost_bps
        type: integer
        source: computed
        description: "round_half_up(MenuItem.plate_cost_cents * 10000 / proposed_price_cents) — always evaluated against the proposed price, never against a capped price"
        default: 0
      - name: market_cap_price_cents
        type: integer
        source: computed
        description: "min(index cap, step cap) as defined by calculations.price_change_projection step 3"
        default: 0
      - name: effective_cap_price_cents
        type: integer
        source: computed
        description: "market_cap_price_cents inflated by CAP_RELIEF_BPS when projected_food_cost_bps > MenuItem.target_food_cost_bps, otherwise equal to market_cap_price_cents"
        default: 0
      - name: projected_contribution_delta_cents
        type: integer
        source: computed
        description: "projected_units * (proposed_price_cents - MenuItem.plate_cost_cents) - baseline_units * (MenuItem.current_price_cents - MenuItem.plate_cost_cents)"
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant the approved price was applied; null until status EFFECTIVE"

  - name: SpecChangeOrder
    parent: Recipe
    common_fields: true
    fields:
      - name: recipe_id
        type: string
        source: input
        description: "FK -> Recipe.id; the recipe whose specification the order changes"
      - name: change_type
        type: enum
        source: input
        description: "COMPONENT_QTY re-quantifies an existing line; COMPONENT_ADD appends an ingredient line; COMPONENT_REMOVE retires an existing line"
        constraints: "one of COMPONENT_QTY, COMPONENT_ADD, COMPONENT_REMOVE"
      - name: target_component_id
        type: string
        source: input
        description: "FK -> RecipeComponent.id; required for COMPONENT_QTY and COMPONENT_REMOVE, must be null for COMPONENT_ADD"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; required for COMPONENT_ADD, must be null otherwise"
      - name: new_ep_quantity_base_units
        type: integer
        source: input
        description: "Target EP quantity for COMPONENT_QTY and COMPONENT_ADD; must be null for COMPONENT_REMOVE"
        constraints: ">= 1 when present"
      - name: approval_status
        type: enum
        source: system
        description: "First state dimension: the approval track of the order"
        default: DRAFT
        constraints: "one of DRAFT, PENDING, APPROVED, REJECTED, ROLLED_BACK"
      - name: propagation_status
        type: enum
        source: system
        description: "Second, independent state dimension: how far the approved change has been pushed into prep guides and count sheets"
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, PREP_GUIDE_SYNCED, COUNTS_SYNCED, FULLY_PROPAGATED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator that submitted the order; compared against the approver for segregation of duties"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator that approved the order; null until approval"
      - name: rejection_reason
        type: string
        source: system
        description: "Reason text supplied with a rejection; null unless approval_status = REJECTED"
      - name: created_component_id
        type: string
        source: system
        description: "Id of the RecipeComponent minted by an approved COMPONENT_ADD, retained so a rollback can retire exactly that line; null otherwise"
      - name: pre_change_ep_quantity_base_units
        type: integer
        source: system
        description: "target_component_id's ep_quantity_base_units captured at approval, so a rollback can restore it exactly; null for COMPONENT_ADD"
      - name: pre_change_batch_cost_micros
        type: integer
        source: system
        description: "Recipe.batch_cost_micros captured at approval; the conserved cost basis a rollback must restore"
        default: 0
      - name: pre_change_allergen_mask
        type: integer
        source: system
        description: "Recipe.allergen_mask captured at approval; the conserved allergen bitmask a rollback must restore"
        default: 0
      - name: pre_change_recipe_version
        type: integer
        source: system
        description: "Recipe.version captured at approval, for audit of the propagation window"
        default: 0
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of approval; null until approved"

  - name: MenuPeriodReview
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the store whose period is being reviewed"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the review period (ISO 8601 UTC, three fractional digits)"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the review period; must be strictly after period_start"
      - name: basis
        type: enum
        source: input
        description: "Which theoretical-food-cost algorithm the close run applies"
        constraints: "one of SALES_MIX_BASED, USAGE_BASED"
      - name: status
        type: enum
        source: system
        description: "OPEN until the first mix line lands; CLASSIFIED after menu-engineering classification; CLOSED is terminal"
        default: OPEN
        constraints: "one of OPEN, MIX_LOADED, CLASSIFIED, CLOSED"
      - name: total_units_sold
        type: integer
        source: computed
        description: "Sum of units_sold over MenuMixLine rows whose period_review_id equals this review"
        default: 0
      - name: total_gross_sales_cents
        type: integer
        source: computed
        description: "Sum of gross_sales_cents over MenuMixLine rows whose period_review_id equals this review"
        default: 0
      - name: popularity_threshold_bps
        type: integer
        source: computed
        description: "round_half_up(POPULARITY_FACTOR_BPS / mix_line_count) — the mix share at or above which a line counts as popular"
        default: 0
      - name: margin_threshold_cents
        type: integer
        source: computed
        description: "Units-weighted average contribution margin per unit across the review's mix lines"
        default: 0
      - name: theoretical_food_cost_cents
        type: integer
        source: computed
        description: "Theoretical cost of goods for the period under the review's basis"
        default: 0
      - name: actual_food_cost_cents
        type: integer
        source: computed
        description: "Actual cost of goods derived from count sheet lines: opening + received - counted, valued per line then summed"
        default: 0
      - name: variance_bps
        type: integer
        source: computed
        description: "round_half_up((actual_food_cost_cents - theoretical_food_cost_cents) * 10000 / theoretical_food_cost_cents), or 0 when theoretical_food_cost_cents = 0"
        default: 0
      - name: variance_flag
        type: enum
        source: computed
        description: "NO_BASIS when theoretical_food_cost_cents = 0; OVER_TOLERANCE when variance_bps > VARIANCE_TOLERANCE_BPS; WITHIN_TOLERANCE otherwise"
        default: WITHIN_TOLERANCE
        constraints: "one of WITHIN_TOLERANCE, OVER_TOLERANCE, NO_BASIS"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the review closed; null until CLOSED"

  - name: MenuMixLine
    parent: MenuPeriodReview
    common_fields: true
    fields:
      - name: period_review_id
        type: string
        source: system
        description: "FK -> MenuPeriodReview.id; the review this sales line belongs to, taken from the path"
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item sold"
      - name: units_sold
        type: integer
        source: input
        description: "Units of this item sold during the period"
        constraints: ">= 0"
      - name: gross_sales_cents
        type: integer
        source: input
        description: "Gross sales for this item during the period, in whole cents"
        constraints: ">= 0"
      - name: plate_cost_cents_snapshot
        type: integer
        source: computed
        description: "MenuItem.plate_cost_cents frozen at line creation; every classification and close run values this line with the snapshot, never with the item's live plate cost"
        default: 0
      - name: mix_pct_bps
        type: integer
        source: computed
        description: "round_half_up(units_sold * 10000 / MenuPeriodReview.total_units_sold) written by the classification run"
        default: 0
      - name: cm_per_unit_cents
        type: integer
        source: computed
        description: "round_half_up(gross_sales_cents / units_sold) - plate_cost_cents_snapshot; 0 when units_sold = 0"
        default: 0
      - name: margin_class
        type: enum
        source: computed
        description: "Menu-engineering quadrant assigned by the classification run"
        default: UNCLASSIFIED
        constraints: "one of STAR, PLOWHORSE, PUZZLE, DOG, UNCLASSIFIED"

  - name: CountSheetLine
    parent: MenuPeriodReview
    common_fields: true
    fields:
      - name: period_review_id
        type: string
        source: system
        description: "FK -> MenuPeriodReview.id; the review this physical count belongs to, taken from the path"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the counted ingredient"
      - name: opening_base_units
        type: integer
        source: input
        description: "Base units on hand at period_start"
        constraints: ">= 0"
      - name: received_base_units
        type: integer
        source: input
        description: "Base units received during the period"
        constraints: ">= 0"
      - name: counted_base_units
        type: integer
        source: input
        description: "Base units physically counted at period_end"
        constraints: ">= 0"
      - name: used_base_units
        type: integer
        source: computed
        description: "max(0, opening_base_units + received_base_units - counted_base_units)"
        default: 0
      - name: expected_base_units
        type: integer
        source: computed
        description: "Theoretical AP base units the period's mix should have consumed for this ingredient, written by the count-line creation and refreshed by every COUNT_SHEETS propagation"
        default: 0
      - name: variance_base_units
        type: integer
        source: computed
        description: "used_base_units - expected_base_units"
        default: 0
      - name: valued_usage_micros
        type: integer
        source: computed
        description: "round_half_up(used_base_units * pack_cost_micros / pack_base_units_snapshot) of the price row selected by the review's basis"
        default: 0
      - name: sync_state
        type: enum
        source: system
        description: "CURRENT while expected_base_units matches the recipe specification; OUT_OF_DATE once an approved SpecChangeOrder changed a recipe that consumes this ingredient"
        default: CURRENT
        constraints: "one of CURRENT, OUT_OF_DATE"
      - name: synced_spec_version
        type: integer
        source: computed
        description: "Recipe.version of the changed recipe as of the last COUNT_SHEETS propagation; 0 before any propagation"
        default: 0

  - name: LTOCampaign
    parent: MenuItem
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the item promoted by this limited-time offer"
      - name: region_code
        type: enum
        source: system
        description: "Copied from the menu item's region_code at creation; the region whose concurrent-promotion capacity this campaign occupies"
        constraints: "one of NE, SE, MW, WEST"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the promotion window (ISO 8601 UTC, three fractional digits)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the promotion window; must be strictly after window_start"
      - name: promo_price_cents
        type: integer
        source: input
        description: "Promotional menu price in whole cents"
        constraints: ">= 1"
      - name: forecast_units
        type: integer
        source: input
        description: "Forecast units for the whole window; the denominator of forecast attainment"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "PLANNED -> COSTED -> LAUNCHED -> CLOSED, then branching to RENEWED or RETIRED"
        default: PLANNED
        constraints: "one of PLANNED, COSTED, LAUNCHED, CLOSED, RENEWED, RETIRED"
      - name: promo_plate_cost_cents
        type: integer
        source: computed
        description: "MenuItem.plate_cost_cents frozen by the costing run"
        default: 0
      - name: promo_food_cost_bps
        type: integer
        source: computed
        description: "round_half_up(promo_plate_cost_cents * 10000 / promo_price_cents)"
        default: 0
      - name: forecast_contribution_cents
        type: integer
        source: computed
        description: "forecast_units * (promo_price_cents - promo_plate_cost_cents) written by the costing run"
        default: 0
      - name: actual_units
        type: integer
        source: input
        description: "Units actually sold in the window, supplied by the post-promotion review"
        constraints: ">= 0"
      - name: actual_gross_sales_cents
        type: integer
        source: input
        description: "Gross sales in the window, supplied by the post-promotion review"
        constraints: ">= 0"
      - name: promo_support_cost_cents
        type: integer
        source: computed
        description: "round_half_up(actual_gross_sales_cents * LTO_SUPPORT_BPS / 10000)"
        default: 0
      - name: promo_contribution_cents
        type: integer
        source: computed
        description: "actual_gross_sales_cents - actual_units * promo_plate_cost_cents - promo_support_cost_cents"
        default: 0
      - name: forecast_attainment_bps
        type: integer
        source: computed
        description: "round_half_up(actual_units * 10000 / forecast_units)"
        default: 0
      - name: verdict
        type: enum
        source: computed
        description: "PENDING until the post-promotion review runs; then PROFITABLE or UNPROFITABLE per calculations.lto_post_promo_profitability"
        default: PENDING
        constraints: "one of PENDING, PROFITABLE, UNPROFITABLE"
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant the post-promotion review ran; null before"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Ingredient
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /culinary/ingredients/{ingredient_id}/retire"
        actor: CulinaryDirector
        preconditions:
          - "Ingredient.status == ACTIVE (else ERR_INGREDIENT_RETIRED, priority 31 — RETIRED is terminal and a second retire is rejected)"
        side_effects:
          - "sets Ingredient.retired_at to the current logical clock instant"
          - "increments Ingredient.version by 1"
          - "does NOT invalidate any recipe cost: neither the specification nor the last published price changed, so every Recipe.cost_state and MenuItem.plate_cost_state is left exactly as it was"
        note: "Retirement is a purchasing decision. It blocks future component additions, blocks recipe activation and blocks price-feed publication, but never rewrites cost figures."

  - entity: PriceFeed
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /culinary/price-feeds/{price_feed_id}/publish"
        actor: CostAnalyst
        preconditions:
          - "PriceFeed.status == DRAFT"
          - "PriceFeed.line_count >= 1"
          - "every IngredientPrice with price_feed_id = this feed references an Ingredient whose status == ACTIVE (else ERR_INGREDIENT_RETIRED, priority 31)"
          - "no line's [effective_from, effective_to) window collides with an existing PUBLISHED window for the same (ingredient_id, region_code) under the exclusive half-open semantics of validations priority 45 (else ERR_PRICE_WINDOW_OVERLAP)"
        side_effects:
          - "HOP 1: sets PriceFeed.status = PUBLISHED, published_at = current logical clock; flips every IngredientPrice of this feed from PENDING to PUBLISHED"
          - "HOP 1 (same hop): for each newly PUBLISHED line, any existing PUBLISHED row for the same (ingredient_id, region_code) whose effective_to is null and whose effective_from < the new line's effective_from is truncated — effective_to := new line's effective_from — and flipped to SUPERSEDED; PriceFeed.superseded_price_count counts those rows"
          - "HOP 2 (caused by HOP 1): because a price line for ingredient I became PUBLISHED, every Recipe holding an ACTIVE INGREDIENT component with ingredient_id = I and cost_state = FRESH flips cost_state to STALE; cost figures are left at their last-roll-up values"
          - "HOP 3 (caused by HOP 2): because those recipes went STALE, every Recipe holding an ACTIVE SUB_RECIPE component whose child_recipe_id is a newly STALE recipe flips cost_state to STALE, repeated transitively up the recipe DAG until no further parent changes; PriceFeed.affected_recipe_count counts every distinct recipe flipped in HOP 2 and HOP 3"
          - "HOP 4 (caused by HOP 3): because a PLATED recipe went STALE, every MenuItem whose recipe_id is that recipe and whose plate_cost_state = FRESH flips plate_cost_state to STALE; PriceFeed.affected_menu_item_count counts them"
          - "HOP 5 (caused by HOP 4): because those menu items' plate costs went STALE, each of them has margin_class reset to UNCLASSIFIED"
          - "increments version on every entity touched by HOP 1..HOP 5"
        note: "The five hops are strictly sequential: each hop's inputs are the rows the previous hop changed. A recipe already STALE stops the chain at that node."

  - entity: Recipe
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /culinary/recipes/{recipe_id}/submit-review"
        actor: RecipeDeveloper
        preconditions:
          - "Recipe.status == DRAFT"
          - "Recipe.component_count >= 1 (else ERR_RECIPE_INVALID_STATE, priority 18 — an empty component set is not a reviewable specification, and that gate outranks the freshness gate at priority 26)"
          - "Recipe.cost_state == FRESH (else ERR_COST_STALE)"
          - "Recipe.depth <= MAX_RECIPE_DEPTH"
        side_effects:
          - "increments Recipe.version by 1"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /culinary/recipes/{recipe_id}/submit-review"
        actor: RecipeDeveloper
        preconditions:
          - "Recipe.status == ACTIVE"
          - "Recipe.component_count >= 1 (else ERR_RECIPE_INVALID_STATE, priority 18 — an empty component set is not a reviewable specification, and that gate outranks the freshness gate at priority 26)"
          - "Recipe.cost_state == FRESH (else ERR_COST_STALE)"
          - "Recipe.depth <= MAX_RECIPE_DEPTH"
        side_effects:
          - "increments Recipe.version by 1"
        note: "Re-review after a specification change closes the ACTIVE -> UNDER_REVIEW -> ACTIVE cycle; components become mutable again while UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /culinary/recipes/{recipe_id}/activate"
        actor: CulinaryDirector
        preconditions:
          - "Recipe.status == UNDER_REVIEW"
          - "Recipe.cost_state == FRESH (else ERR_COST_STALE)"
          - "no ACTIVE INGREDIENT component of this recipe references an Ingredient whose status == RETIRED (else ERR_INGREDIENT_RETIRED)"
          - "every ACTIVE SUB_RECIPE component's child Recipe has status == ACTIVE (else ERR_SUBRECIPE_NOT_ACTIVE)"
          - "Recipe.depth <= MAX_RECIPE_DEPTH (else ERR_RECIPE_DEPTH_EXCEEDED)"
        side_effects:
          - "when no PrepGuide exists with recipe_id = this recipe, mints one with revision_no = 1, sync_state = CURRENT, snapshots of batch_yield_base_units / portions_per_batch / component_count, and synced_spec_version = Recipe.version after this transition's increment"
          - "when a PrepGuide already exists it is left untouched, including its sync_state — re-activation never silently syncs a prep guide"
          - "increments Recipe.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /culinary/recipes/{recipe_id}/retire"
        actor: CulinaryDirector
        preconditions:
          - "Recipe.status == ACTIVE"
          - "no MenuItem with recipe_id = this recipe has status in {DRAFT, ACTIVE} (else ERR_MENU_ITEM_INVALID_STATE)"
          - "no ACTIVE RecipeComponent with child_recipe_id = this recipe belongs to a Recipe whose status is in {DRAFT, UNDER_REVIEW, ACTIVE} (else ERR_RECIPE_INVALID_STATE)"
        side_effects:
          - "freezes all cost figures; sets cost_state = STALE"
          - "increments Recipe.version by 1"

  - entity: SpecChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, ROLLED_BACK]
    transitions:
      - from: "approval_status = DRAFT"
        to: "approval_status = PENDING"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/submit"
        actor: RecipeDeveloper
        preconditions:
          - "SpecChangeOrder.approval_status == DRAFT"
          - "the target RecipeComponent (when change_type is COMPONENT_QTY or COMPONENT_REMOVE) has status == ACTIVE (else ERR_COMPONENT_ALREADY_REMOVED)"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID of this request"
          - "increments SpecChangeOrder.version by 1"
      - from: "approval_status = PENDING"
        to: "approval_status = REJECTED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/reject"
        actor: CulinaryDirector
        preconditions:
          - "SpecChangeOrder.approval_status == PENDING"
        side_effects:
          - "sets rejection_reason from the request body"
          - "decrements Recipe.open_spec_change_count by 1 and increments Recipe.version by 1"
          - "leaves propagation_status at NOT_STARTED and leaves the recipe specification untouched"
      - from: "approval_status = PENDING"
        to: "approval_status = APPROVED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/approve"
        actor: CulinaryDirector
        preconditions:
          - "SpecChangeOrder.approval_status == PENDING"
          - "the owning Recipe.status == ACTIVE (else ERR_RECIPE_INVALID_STATE, priority 18) — checked BEFORE the segregation-of-duties comparison at priority 27"
          - "X-User-ID != SpecChangeOrder.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES, priority 27)"
          - "the target RecipeComponent (COMPONENT_QTY / COMPONENT_REMOVE) has status == ACTIVE (else ERR_COMPONENT_ALREADY_REMOVED)"
          - "for COMPONENT_ADD, the referenced Ingredient.status == ACTIVE (else ERR_INGREDIENT_RETIRED)"
        side_effects:
          - "captures pre_change_batch_cost_micros = Recipe.batch_cost_micros, pre_change_allergen_mask = Recipe.allergen_mask, pre_change_recipe_version = Recipe.version and pre_change_ep_quantity_base_units = target component's ep_quantity_base_units (null for COMPONENT_ADD); sets approved_by_user_id and approved_at"
          - "HOP 1: applies the specification edit — COMPONENT_QTY sets the target component's ep_quantity_base_units and ap_quantity_base_units to the new quantity's values; COMPONENT_ADD mints a RecipeComponent (component_type = INGREDIENT, sequence_no = Recipe.component_count + 1, extended_cost_micros = 0) and records its id in created_component_id; COMPONENT_REMOVE sets the target component's status = REMOVED and removed_at. No cost figure is recomputed by this transition: extended_cost_micros of existing lines and Recipe.batch_cost_micros are left exactly as the last roll-up wrote them"
          - "HOP 2 (caused by HOP 1): because the component set changed, the owning Recipe recomputes component_count, allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion and depth from the new component set, flips cost_state to STALE, decrements open_spec_change_count by 1 and increments version by 1; then, because a child recipe's cost went stale, every Recipe holding an ACTIVE SUB_RECIPE component whose child_recipe_id is a recipe just flipped to STALE also flips cost_state to STALE and increments version by 1, repeated transitively up the recipe DAG until no further parent changes — those parents' own component sets did not change, so their allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion, depth and component_count are left exactly as they were"
          - "HOP 3 (caused by HOP 2): because the recipe's allergen roll-up and cost state changed, every MenuItem with recipe_id = this recipe copies the recipe's new allergen_mask and sodium_mcg_per_portion, flips plate_cost_state to STALE, resets margin_class to UNCLASSIFIED and increments version by 1; every MenuItem backed by one of the transitively staled parent recipes flips plate_cost_state to STALE, resets margin_class to UNCLASSIFIED and increments version by 1 but keeps its allergen_mask and sodium_mcg_per_portion, since those roll-ups did not move"
          - "HOP 4 (caused by HOP 3): because those menu items' plate costs went STALE, every LTOCampaign for them with status = COSTED reverts to status = PLANNED and clears promo_plate_cost_cents, promo_food_cost_bps and forecast_contribution_cents to 0"
          - "HOP 2 also flips the recipe's PrepGuide.sync_state to OUT_OF_DATE and flips sync_state to OUT_OF_DATE on every CountSheetLine that belongs to a MenuPeriodReview whose status != CLOSED and whose ingredient_id is consumed by an ACTIVE component of this recipe"
        note: "HOP 1 -> HOP 2 -> HOP 3 -> HOP 4 is the transitive chain. The prep-guide and count-sheet invalidations are the propagation queue the /propagate endpoint drains."
      - from: "approval_status = APPROVED"
        to: "approval_status = ROLLED_BACK"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/rollback"
        actor: CulinaryDirector
        preconditions:
          - "SpecChangeOrder.approval_status == APPROVED"
        side_effects:
          - "restores the specification exactly: COMPONENT_QTY writes pre_change_ep_quantity_base_units back onto the target component and recomputes its ap_quantity_base_units from it; COMPONENT_ADD sets created_component_id's status = REMOVED; COMPONENT_REMOVE sets the target component's status = ACTIVE and clears removed_at"
          - "restores Recipe.batch_cost_micros = pre_change_batch_cost_micros and Recipe.allergen_mask = pre_change_allergen_mask, recomputes component_count / kcal_per_portion_micros / sodium_mcg_per_portion / depth from the restored component set, sets cost_state = STALE and increments Recipe.version by 1; every Recipe that reaches this recipe through ACTIVE SUB_RECIPE components also flips cost_state = STALE and increments version by 1, transitively up the DAG, with their own roll-up figures untouched"
          - "restores every MenuItem of that recipe: allergen_mask and sodium_mcg_per_portion copied back from the recipe, plate_cost_state = STALE, margin_class = UNCLASSIFIED, version + 1; every MenuItem of a transitively staled parent recipe flips plate_cost_state = STALE and margin_class = UNCLASSIFIED and increments version by 1 without touching its allergen or sodium copies"
          - "resets propagation_status to NOT_STARTED, flips the recipe's PrepGuide.sync_state to OUT_OF_DATE and flips every non-CLOSED review's affected CountSheetLine.sync_state to OUT_OF_DATE"
        note: "Compensating action for approve. Because approve never rewrote extended_cost_micros, restoring the component rows and the two snapshots leaves the conserved identity Recipe.batch_cost_micros == sum of extended_cost_micros over ACTIVE components intact."
      - from: "propagation_status = NOT_STARTED"
        to: "propagation_status = PREP_GUIDE_SYNCED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate with target = PREP_GUIDE"
        actor: CostAnalyst
        preconditions:
          - "SpecChangeOrder.approval_status == APPROVED (else ERR_SCO_INVALID_STATE)"
          - "SpecChangeOrder.propagation_status == NOT_STARTED (else ERR_PROPAGATION_ALREADY_SYNCED when it already includes PREP_GUIDE)"
        side_effects:
          - "sets the recipe's PrepGuide.sync_state = CURRENT, increments its revision_no by 1, refreshes its three snapshots and sets synced_spec_version = Recipe.version"
          - "increments PrepGuide.version and SpecChangeOrder.version by 1"
      - from: "propagation_status = NOT_STARTED"
        to: "propagation_status = COUNTS_SYNCED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate with target = COUNT_SHEETS"
        actor: CostAnalyst
        preconditions:
          - "SpecChangeOrder.approval_status == APPROVED (else ERR_SCO_INVALID_STATE)"
          - "SpecChangeOrder.propagation_status == NOT_STARTED (else ERR_PROPAGATION_ALREADY_SYNCED when it already includes COUNT_SHEETS)"
        side_effects:
          - "recomputes expected_base_units per calculations.count_sheet_expected_usage for every CountSheetLine with sync_state = OUT_OF_DATE belonging to a MenuPeriodReview whose status != CLOSED, sets each one's sync_state = CURRENT, variance_base_units = used_base_units - expected_base_units and synced_spec_version = Recipe.version"
          - "increments the version of every touched CountSheetLine and of SpecChangeOrder by 1"
      - from: "propagation_status = PREP_GUIDE_SYNCED"
        to: "propagation_status = FULLY_PROPAGATED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate with target = COUNT_SHEETS"
        actor: CostAnalyst
        preconditions:
          - "SpecChangeOrder.approval_status == APPROVED"
          - "SpecChangeOrder.propagation_status == PREP_GUIDE_SYNCED"
        side_effects:
          - "same count-sheet refresh as the NOT_STARTED -> COUNTS_SYNCED transition"
      - from: "propagation_status = COUNTS_SYNCED"
        to: "propagation_status = FULLY_PROPAGATED"
        trigger: "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate with target = PREP_GUIDE"
        actor: CostAnalyst
        preconditions:
          - "SpecChangeOrder.approval_status == APPROVED"
          - "SpecChangeOrder.propagation_status == COUNTS_SYNCED"
        side_effects:
          - "same prep-guide refresh as the NOT_STARTED -> PREP_GUIDE_SYNCED transition"
        note: "approval_status and propagation_status are independent dimensions on the same row: the propagation axis only advances while approval_status == APPROVED, and a rollback resets the propagation axis to NOT_STARTED without touching the approval axis's terminal value."

  - entity: MenuItem
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /culinary/menu-items/{menu_item_id}/activate"
        actor: CulinaryDirector
        preconditions:
          - "MenuItem.status == DRAFT"
          - "the backing Recipe.status == ACTIVE (else ERR_RECIPE_INVALID_STATE)"
          - "MenuItem.plate_cost_state == FRESH (else ERR_COST_STALE)"
          - "(MenuItem.declared_allergen_mask AND Recipe.allergen_mask) == Recipe.allergen_mask (else ERR_ALLERGEN_UNDECLARED)"
          - "when MenuItem.is_kids_menu is true, Recipe.sodium_mcg_per_portion <= KIDS_MENU_SODIUM_CAP_MCG (else ERR_NUTRITION_LIMIT_EXCEEDED)"
        side_effects:
          - "increments MenuItem.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /culinary/menu-items/{menu_item_id}/activate"
        actor: CulinaryDirector
        preconditions:
          - "MenuItem.status == SUSPENDED"
          - "the backing Recipe.status == ACTIVE (else ERR_RECIPE_INVALID_STATE)"
          - "MenuItem.plate_cost_state == FRESH (else ERR_COST_STALE)"
          - "(MenuItem.declared_allergen_mask AND Recipe.allergen_mask) == Recipe.allergen_mask (else ERR_ALLERGEN_UNDECLARED)"
          - "when MenuItem.is_kids_menu is true, Recipe.sodium_mcg_per_portion <= KIDS_MENU_SODIUM_CAP_MCG (else ERR_NUTRITION_LIMIT_EXCEEDED)"
        side_effects:
          - "increments MenuItem.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle after a retired promotion."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, cascaded from POST /culinary/lto-campaigns/{lto_campaign_id}/decide with decision = RETIRE"
        actor: system
        preconditions:
          - "the deciding LTOCampaign.status == CLOSED and the requested decision is RETIRE — the suspension follows the RETIRE arm itself and does not consult the verdict, so a PROFITABLE campaign that is retired anyway still suspends the item"
        side_effects:
          - "sets MenuItem.status = SUSPENDED, margin_class = UNCLASSIFIED, is_lto = false and increments version by 1"

  - entity: PriceChangeProposal
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/submit"
        actor: RecipeDeveloper
        preconditions:
          - "PriceChangeProposal.status == DRAFT"
          - "the target MenuItem.status == ACTIVE (else ERR_MENU_ITEM_INVALID_STATE)"
          - "MenuItem.plate_cost_state == FRESH (else ERR_COST_STALE, priority 26)"
          - "effective_from >= MenuItem.last_price_change_at + COOLING_OFF_DAYS when last_price_change_at is not null (else ERR_PRICE_CHANGE_COOLING_OFF, priority 42)"
          - "proposed_price_cents <= effective_cap_price_cents computed by calculations.price_change_projection (else ERR_MARKET_CAP_EXCEEDED, priority 47)"
          - "proposed_price_cents - MenuItem.plate_cost_cents >= MARGIN_FLOOR_CENTS (else ERR_MARGIN_FLOOR_BREACH, priority 48)"
        side_effects:
          - "writes every projection field per calculations.price_change_projection: baseline_units, price_delta_bps, projected_unit_delta_bps, projected_units, projected_food_cost_bps, market_cap_price_cents, effective_cap_price_cents, projected_contribution_delta_cents"
          - "sets submitted_by_user_id = X-User-ID of this request"
          - "increments PriceChangeProposal.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/request-revision"
        actor: CulinaryDirector
        preconditions:
          - "PriceChangeProposal.status == SUBMITTED"
          - "PriceChangeProposal.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments revision_round by 1, stores last_revision_reason, increments version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/request-revision when revision_round == MAX_REVISION_ROUNDS"
        actor: CulinaryDirector
        preconditions:
          - "PriceChangeProposal.status == SUBMITTED"
          - "PriceChangeProposal.revision_round == MAX_REVISION_ROUNDS"
        side_effects:
          - "stores last_revision_reason, leaves revision_round unchanged, increments version by 1"
        note: "Conditional branch on the same trigger: the revision loop is bounded, and the MAX_REVISION_ROUNDS-th revision request terminates the proposal instead of reopening it."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/submit"
        actor: RecipeDeveloper
        preconditions:
          - "PriceChangeProposal.status == REVISION_REQUESTED"
          - "same five preconditions as the DRAFT -> SUBMITTED transition, re-evaluated against the patched proposal and the item's current state"
        side_effects:
          - "recomputes every projection field from the patched values and re-stamps submitted_by_user_id"
          - "increments version by 1"
        note: "Closes the SUBMITTED -> REVISION_REQUESTED -> SUBMITTED cycle."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/approve"
        actor: CulinaryDirector
        preconditions:
          - "PriceChangeProposal.status == SUBMITTED"
          - "MenuItem.plate_cost_state == FRESH (else ERR_COST_STALE, priority 26) — a plate-cost invalidation since submission voids the projection"
          - "X-User-ID != PriceChangeProposal.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES, priority 27)"
        side_effects:
          - "sets approved_by_user_id = X-User-ID, increments version by 1"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /culinary/price-change-proposals/{proposal_id}/apply"
        actor: CostAnalyst
        preconditions:
          - "PriceChangeProposal.status == APPROVED"
          - "current logical clock >= effective_from (else ERR_EFFECTIVE_DATE_NOT_REACHED, priority 44)"
        side_effects:
          - "sets applied_at to the current logical clock and status = EFFECTIVE"
          - "sets MenuItem.current_price_cents = proposed_price_cents and MenuItem.last_price_change_at = current logical clock"
          - "recomputes MenuItem.food_cost_bps and contribution_margin_cents from the unchanged plate_cost_cents and the new price; plate_cost_state stays FRESH because the plate cost itself did not move"
          - "resets MenuItem.margin_class to UNCLASSIFIED and increments MenuItem.version by 1"

  - entity: MenuPeriodReview
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: MIX_LOADED
        trigger: "POST /culinary/menu-period-reviews/{id}/mix-lines (first line)"
        actor: CostAnalyst
        preconditions:
          - "MenuPeriodReview.status == OPEN"
          - "the referenced MenuItem exists and its status is in {ACTIVE, SUSPENDED}"
        side_effects:
          - "mints the MenuMixLine with plate_cost_cents_snapshot = MenuItem.plate_cost_cents"
          - "recomputes total_units_sold and total_gross_sales_cents and auto-advances status to MIX_LOADED"
          - "increments MenuPeriodReview.version by 1"
        note: "Automatic transition: the review advances itself on its first mix line; later mix lines keep it in MIX_LOADED."
      - from: MIX_LOADED
        to: CLASSIFIED
        trigger: "POST /culinary/menu-period-reviews/{period_review_id}/classify"
        actor: CostAnalyst
        preconditions:
          - "MenuPeriodReview.status is in {OPEN, MIX_LOADED}"
          - "the review has at least one MenuMixLine (else ERR_EMPTY_MIX, priority 40)"
        side_effects:
          - "writes popularity_threshold_bps and margin_threshold_cents on the review and mix_pct_bps, cm_per_unit_cents and margin_class on every mix line per calculations.menu_mix_classification"
          - "copies each line's margin_class onto its MenuItem.margin_class and increments each MenuItem.version by 1"
          - "increments MenuPeriodReview.version by 1"
      - from: CLASSIFIED
        to: CLOSED
        trigger: "POST /culinary/menu-period-reviews/{period_review_id}/close"
        actor: CostAnalyst
        preconditions:
          - "MenuPeriodReview.status == CLASSIFIED"
          - "the review has at least one CountSheetLine (else ERR_EMPTY_COUNT_SHEET, priority 41)"
          - "every CountSheetLine of this review has sync_state == CURRENT (else ERR_COUNT_SHEET_OUT_OF_DATE, priority 25)"
        side_effects:
          - "writes theoretical_food_cost_cents, actual_food_cost_cents, variance_bps and variance_flag per calculations.theoretical_vs_actual_variance under the review's basis"
          - "writes valued_usage_micros on every CountSheetLine of the review"
          - "sets closed_at and status = CLOSED; increments version by 1"

  - entity: LTOCampaign
    initial_state: PLANNED
    terminal_states: [RENEWED, RETIRED]
    transitions:
      - from: PLANNED
        to: COSTED
        trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/cost"
        actor: CostAnalyst
        preconditions:
          - "LTOCampaign.status == PLANNED"
          - "the target MenuItem.status == ACTIVE (else ERR_MENU_ITEM_INVALID_STATE)"
          - "MenuItem.plate_cost_state == FRESH (else ERR_COST_STALE)"
        side_effects:
          - "writes promo_plate_cost_cents = MenuItem.plate_cost_cents, promo_food_cost_bps and forecast_contribution_cents per calculations.lto_costing"
          - "increments LTOCampaign.version by 1"
      - from: COSTED
        to: PLANNED
        trigger: "system, cascaded from any transition that flips the backing MenuItem.plate_cost_state to STALE"
        actor: system
        preconditions:
          - "LTOCampaign.status == COSTED"
        side_effects:
          - "clears promo_plate_cost_cents, promo_food_cost_bps and forecast_contribution_cents to 0 and increments version by 1"
        note: "Reverse edge of PLANNED -> COSTED; a stale plate cost de-costs the campaign so it cannot be launched on figures nobody recomputed."
      - from: COSTED
        to: LAUNCHED
        trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/launch"
        actor: CulinaryDirector
        preconditions:
          - "LTOCampaign.status == COSTED"
          - "current logical clock < window_end (else ERR_LTO_INVALID_STATE)"
          - "the number of LTOCampaign rows with status = LAUNCHED, the same region_code and a window intersecting [window_start, window_end) is < MAX_CONCURRENT_LTO_PER_REGION (else ERR_LTO_WINDOW_CAPACITY, priority 43)"
        side_effects:
          - "sets MenuItem.is_lto = true and increments MenuItem.version by 1"
          - "increments LTOCampaign.version by 1"
      - from: LAUNCHED
        to: CLOSED
        trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/close-review"
        actor: CostAnalyst
        preconditions:
          - "LTOCampaign.status == LAUNCHED"
          - "current logical clock >= window_end (else ERR_EFFECTIVE_DATE_NOT_REACHED)"
        side_effects:
          - "stores actual_units and actual_gross_sales_cents from the request body and writes promo_support_cost_cents, promo_contribution_cents, forecast_attainment_bps and verdict per calculations.lto_post_promo_profitability"
          - "sets reviewed_at, sets MenuItem.is_lto = false, decrements MenuItem.open_lto_count by 1 and increments MenuItem.version by 1"
          - "increments LTOCampaign.version by 1"
      - from: CLOSED
        to: RENEWED
        trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/decide with decision = RENEW"
        actor: CulinaryDirector
        preconditions:
          - "LTOCampaign.status == CLOSED"
          - "LTOCampaign.verdict == PROFITABLE (else ERR_LTO_INVALID_STATE)"
        side_effects:
          - "mints a successor LTOCampaign for the same menu_item_id with status = PLANNED, window_start = this campaign's window_end, window_end = window_end + (window_end - window_start), the same promo_price_cents, forecast_units = this campaign's actual_units and region_code copied from the menu item"
          - "increments MenuItem.open_lto_count by 1 and MenuItem.version by 1; the menu item stays ACTIVE"
      - from: CLOSED
        to: RETIRED
        trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/decide with decision = RETIRE"
        actor: CulinaryDirector
        preconditions:
          - "LTOCampaign.status == CLOSED"
        side_effects:
          - "mints no successor campaign"
          - "sets the MenuItem.status = SUSPENDED, margin_class = UNCLASSIFIED, is_lto = false and increments MenuItem.version by 1"
        note: "Branch fork from CLOSED: the RENEW arm mints a successor and leaves the item sellable, the RETIRE arm mints nothing and suspends the item. The two arms share no side effect other than the version bump."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: component-add-stale-recipe
    parent_entity: Recipe
    write_endpoint: "POST /culinary/recipes/{recipe_id}/components"
    occ_field: "expected_recipe_version"
    description: |
      Adding a component to a Recipe whose version has advanced since the client
      last read it is rejected. Appending a second, different component is
      legitimate product behaviour, so the system cannot fall back on a state
      precondition: the only thing that distinguishes an informed write from an
      uninformed one is whether the client's expected_recipe_version still
      matches the stored Recipe.version.
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412

  - rule_id: component-remove-stale-recipe
    parent_entity: Recipe
    write_endpoint: "DELETE /culinary/recipe-components/{recipe_component_id}"
    occ_field: "expected_recipe_version"
    description: |
      Removing a component from a Recipe whose version has advanced since the
      client last read it is rejected. Removing a second, different component is
      legitimate, so a stale-version check is the only way to detect that the
      caller decided against a specification it no longer sees.
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412

  - rule_id: spec-change-order-create-stale-recipe
    parent_entity: Recipe
    write_endpoint: "POST /culinary/spec-change-orders"
    occ_field: "expected_recipe_version"
    description: |
      Opening a SpecChangeOrder against a Recipe whose version has advanced since
      the client last read it is rejected. A second, sequential spec change order
      on the same recipe is legitimate once the first one is resolved, so the
      stale expected_recipe_version is the only signal that the requested edit was
      authored against a specification that no longer exists.
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412

  - rule_id: lto-create-stale-menu-item
    parent_entity: MenuItem
    write_endpoint: "POST /culinary/lto-campaigns"
    occ_field: "expected_menu_item_version"
    description: |
      Creating an LTOCampaign against a MenuItem whose version has advanced since
      the client last read it is rejected. A menu item may legitimately carry
      several campaigns with disjoint windows, so the create cannot be gated by a
      state precondition; the stale expected_menu_item_version is what proves the
      promotion was planned against an obsolete price or plate cost.
    error_id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money is integer micro-dollars (1 cent = 10000 micros) or integer cents.
# All ratios are integer basis points (1% = 100 bps). Energy is micro-kcal,
# sodium is micrograms. There is no floating point anywhere in this domain.
# `round_half_up(a / b)` means: q, r = divmod(a, b); result = q + (1 if 2*r >= b else 0)
# for a >= 0, and the sign-symmetric equivalent (round the magnitude, restore the
# sign) for a < 0.
# ---------------------------------------------------------------------------
calculations:

  - name: recipe_cost_rollup
    trigger: "POST /culinary/recipes/{recipe_id}/cost-rollup"
    algorithm_type: topological
    rounding: round_half_up
    precision: "integer micro-dollars"
    variants:
      - name: LATEST_PUBLISHED
        description: |
          For each INGREDIENT component, the unit cost is taken from the single
          IngredientPrice row selected by: status == PUBLISHED, ingredient_id ==
          the component's ingredient, region_code == REFERENCE_REGION_CODE,
          effective_from <= current logical clock, and (effective_to is null OR
          current logical clock < effective_to). Candidates are ranked by
          effective_from DESC then created_at ASC and the first row wins. The
          component's unit_cost_micros_used is that row's pack_cost_micros and its
          pack_base_units_snapshot is that row's pack_base_units_snapshot.
      - name: WEIGHTED_AVG_90D
        description: |
          The unit cost is a duration-weighted average of every PUBLISHED
          IngredientPrice row for (ingredient, REFERENCE_REGION_CODE) whose
          [effective_from, effective_to) window intersects the window
          [current logical clock - WEIGHTED_AVG_WINDOW_DAYS, current logical clock).
          Each candidate's weight is the number of whole 24-hour days of
          intersection (integer, truncated; a candidate with zero whole days of
          intersection is dropped). unit_cost_micros_used =
          round_half_up(sum(weight_i * per_base_unit_micros_i) / sum(weight_i))
          where per_base_unit_micros_i = round_half_up(pack_cost_micros_i * 1000000
          / pack_base_units_snapshot_i), and pack_base_units_snapshot is set to
          1000000 so the per-component formula below is unchanged. When every
          candidate is dropped the variant falls back to LATEST_PUBLISHED, and when
          that also selects nothing the roll-up fails with ERR_NO_PUBLISHED_PRICE.
    formula: |
      basis = request body `basis` (default LATEST_PUBLISHED) -> stored on Recipe.cost_basis.

      STEP 1 — children first. Order the recipe's ACTIVE components topologically:
        every SUB_RECIPE component's child recipe must already have cost_state ==
        FRESH and a cost_basis equal to this roll-up's basis; otherwise the call
        fails with ERR_COST_STALE. Children are never recomputed implicitly.

      STEP 2 — per component extended cost, rounded to whole micros individually
        (see the combinatorial note below):
          INGREDIENT component:
            ap_quantity_base_units = ceil(ep_quantity_base_units * 10000 / ingredient.net_yield_bps)
            extended_cost_micros   = round_half_up(ap_quantity_base_units * unit_cost_micros_used
                                                   / pack_base_units_snapshot)
          SUB_RECIPE component:
            ap_quantity_base_units = ep_quantity_base_units   (a sub-recipe batch has no trim or shrink of its own)
            unit_cost_micros_used  = child.batch_cost_micros
            pack_base_units_snapshot = child.batch_yield_base_units
            extended_cost_micros   = round_half_up(ep_quantity_base_units * child.batch_cost_micros
                                                   / child.batch_yield_base_units)

      STEP 3 — batch and portion:
          batch_cost_micros   = sum of extended_cost_micros over ACTIVE components
          portion_cost_micros = round_half_up(batch_cost_micros / portions_per_batch)

      STEP 4 — sets cost_state = FRESH, last_rollup_at = current logical clock and
        increments Recipe.version by 1. Components with status = REMOVED keep their
        historical extended_cost_micros and contribute nothing.
    input_set: "RecipeComponent rows with recipe_id = the target recipe and status = ACTIVE"
    combinatorial_note: |
      ROUNDING ORDER IS PINNED TO round-then-sum. Each component's extended cost is
      rounded to whole micros in STEP 2 and the rounded values are added in STEP 3.
      The alternative order — accumulating the exact rational products and rounding
      once at the end — is explicitly NOT used and produces a different
      batch_cost_micros whenever two or more components have fractional
      remainders. Worked example: TOMATO-SAUCE at ap 2000 with pack cost 9500000
      over pack 3785 rounds 5019815.06 -> 5019815 and PEANUT-OIL at ap 100 with
      pack cost 12000000 over pack 946 rounds 1268498.94 -> 1268499, giving
      batch_cost_micros = 6288314 for the SUB-SAUCE sub-recipe — a pair whose two
      remainders happen to leave both orders in agreement. The three-component
      PLATE-MELT recipe (BEEF-CHUCK ep 1000, CHEDDAR ep 100, SUB-SAUCE ep 500)
      separates them: BEEF-CHUCK at ap 1471 has the exact product 12485339.506...
      -> 12485340, CHEDDAR at ap 100 has 970017.637... -> 970018 and the SUB-SAUCE
      component at ep 500 over the child's 2000-base-unit batch has exactly
      1572078.5 -> 1572079, so round-then-sum yields batch_cost_micros = 15027437
      while the exact rational sum 15027435.642..., rounded once at the end, would
      yield 15027436.
    constants_used: [REFERENCE_REGION_CODE, WEIGHTED_AVG_WINDOW_DAYS]
    edge_cases:
      - "portions_per_batch is always >= 1 so the portion division never divides by zero"
      - "a recipe with zero ACTIVE components rolls up to batch_cost_micros = 0 and portion_cost_micros = 0 and is still marked FRESH"
      - "an ingredient whose status is RETIRED is still priced normally: retirement does not remove published prices"

  - name: plate_cost_and_food_cost
    trigger: "POST /culinary/menu-items/{menu_item_id}/plate-cost"
    algorithm_type: aggregation
    rounding: round_half_up
    precision: "integer micro-dollars for the plate cost, integer cents for the reported figures"
    formula: |
      Requires the backing Recipe.cost_state == FRESH (else ERR_COST_STALE) and
      copies its basis into MenuItem.cost_basis.

      s1 = round_half_up(recipe.portion_cost_micros * (10000 + REGION_FREIGHT_UPLIFT_BPS[menu_item.region_code]) / 10000)
      s2 = round_half_up(s1 * (10000 + PLATE_WASTE_BPS) / 10000)
      garnish_micros = max(GARNISH_FLOOR_MICROS, round_half_up(s2 * GARNISH_BPS / 10000))
      plate_cost_micros = s2 + garnish_micros
      plate_cost_cents  = round_half_up(plate_cost_micros / 10000)
      food_cost_bps     = round_half_up(plate_cost_cents * 10000 / current_price_cents)
      contribution_margin_cents = current_price_cents - plate_cost_cents

      Also copies recipe.allergen_mask into MenuItem.allergen_mask and
      recipe.sodium_mcg_per_portion into MenuItem.sodium_mcg_per_portion, sets
      plate_cost_state = FRESH and increments MenuItem.version by 1. margin_class
      is left untouched by this calculation.
    input_set: "the single backing Recipe plus the region constants for MenuItem.region_code"
    combinatorial_note: |
      THREE INTERACTING INPUTS, NON-LINEAR IN THE PORTION COST. The uplift and the
      waste factor are applied sequentially with an intermediate rounding after
      each step, and the garnish allowance is clamped from below by
      GARNISH_FLOOR_MICROS. The clamp makes the plate cost a non-linear function of
      the portion cost: below a portion cost of roughly 521000 micros the garnish
      contributes the flat floor and above it the proportional term, so scaling the
      recipe cost does not scale the plate cost. Collapsing the two sequential
      factors into a single (10000 + REGION_FREIGHT_UPLIFT_BPS + PLATE_WASTE_BPS)
      multiplier is a different (and wrong) result.
    constants_used: [REGION_FREIGHT_UPLIFT_BPS, PLATE_WASTE_BPS, GARNISH_BPS, GARNISH_FLOOR_MICROS]
    edge_cases:
      - "PLATE-BURGER portion_cost_micros 2695590 in region NE: s1 = 2857325, s2 = 2914472, garnish = 43717, plate_cost_micros = 2958189, plate_cost_cents = 296"
      - "the same recipe in region MW (uplift 0 bps): s1 = 2695590, s2 = 2749502, garnish = 41243, plate_cost_micros = 2790745, plate_cost_cents = 279"
      - "a plate cost above the current price yields a negative contribution_margin_cents; the calculation does not clamp it"

  - name: allergen_nutrition_rollup
    trigger: "POST /culinary/recipes/{recipe_id}/cost-rollup and GET /culinary/recipes/{recipe_id}/allergen-nutrition"
    algorithm_type: topological
    rounding: round_half_up
    precision: "integer micro-kcal and integer micrograms per portion"
    formula: |
      Walks the ACTIVE component set depth-first from the target recipe.

      allergen_mask = bitwise OR over every ACTIVE INGREDIENT component's
        ingredient.allergen_mask and every ACTIVE SUB_RECIPE component's
        child.allergen_mask.

      batch_kcal_micros = sum over ACTIVE components of:
          INGREDIENT: ap_quantity_base_units * ingredient.kcal_per_base_unit_micros
          SUB_RECIPE: round_half_up(ep_quantity_base_units * child_batch_kcal_micros
                                    / child.batch_yield_base_units)
      batch_sodium_mcg is computed identically from sodium_mcg_per_base_unit.

      kcal_per_portion_micros = round_half_up(batch_kcal_micros / portions_per_batch)
      sodium_mcg_per_portion  = round_half_up(batch_sodium_mcg / portions_per_batch)

      depth = 0 for a recipe with no ACTIVE SUB_RECIPE component, otherwise
              1 + max(depth of each ACTIVE SUB_RECIPE component's child).
      A component whose child_recipe_id is the target recipe itself, or any
      component that would close a cycle in the recipe DAG, is rejected at
      component-creation time with ERR_RECIPE_CYCLE; the walk therefore always
      terminates and never needs a visited-set escape hatch.
    input_set: "the transitive closure of ACTIVE RecipeComponent rows reachable from the target recipe"
    constants_used: [MAX_RECIPE_DEPTH]
    edge_cases:
      - "PLATE-BURGER carries allergen_mask 15 (MILK|EGG|GLUTEN|PEANUT): MILK from CHEDDAR, EGG|GLUTEN from BRIOCHE-BUN and PEANUT inherited from the SUB-SAUCE sub-recipe's PEANUT-OIL, which the plated recipe never references directly"
      - "PLATE-BURGER kcal_per_portion_micros = 968500000 and sodium_mcg_per_portion = 740420 at depth 1"
      - "an ingredient with allergen_mask 0 leaves the parent's mask unchanged, so removing it does not necessarily change the mask"

  - name: count_sheet_expected_usage
    trigger: "POST /culinary/menu-period-reviews/{id}/count-lines, POST /culinary/menu-period-reviews/{period_review_id}/close and POST /culinary/spec-change-orders/{spec_change_order_id}/propagate with target = COUNT_SHEETS"
    algorithm_type: constraint_propagation
    rounding: floor
    precision: "integer base units"
    formula: |
      For a CountSheetLine on ingredient I in review R:

      ap_base_units_per_portion_micros(recipe, I) is accumulated over the recipe's
      ACTIVE components:
        INGREDIENT component on I:  round_half_up(ap_quantity_base_units * 1000000 / portions_per_batch)
        SUB_RECIPE component:       round_half_up(ep_quantity_base_units
                                        * ap_base_units_per_batch(child, I)
                                        / (child.batch_yield_base_units * portions_per_batch)
                                        * 1000000)  -- evaluated as a single integer
                                        expression: round_half_up(ep_quantity_base_units
                                        * ap_base_units_per_batch(child, I) * 1000000
                                        / (child.batch_yield_base_units * portions_per_batch))
      where ap_base_units_per_batch(child, I) is the same accumulation on the child
      without the portions divisor.

      expected_base_units = floor( sum over MenuMixLine m of R of
            ( m.units_sold * ap_base_units_per_portion_micros(m.menu_item.recipe, I) )
          / 1000000 )
      used_base_units     = opening_base_units + received_base_units - counted_base_units
      variance_base_units = used_base_units - expected_base_units
      valued_usage_micros = round_half_up(used_base_units * unit_cost_micros_used(I)
                                          / pack_base_units_snapshot(I))
      where the unit cost is selected exactly as in recipe_cost_rollup under the
      review's own basis mapping (SALES_MIX_BASED and USAGE_BASED both use
      LATEST_PUBLISHED prices).
    input_set: "every MenuMixLine of the review, exploded through the ACTIVE component graph of each mix line's menu item's recipe"
    constants_used: [REFERENCE_REGION_CODE]
    edge_cases:
      - "with 2000 units sold of recipes backed by PLATE-BURGER: BEEF-CHUCK expected_base_units = 441200, CHEDDAR = 60000, BRIOCHE-BUN = 2000, TOMATO-SAUCE = 100000 and PEANUT-OIL = 5000 — the last two arrive only through the sub-recipe"
      - "an ingredient that no mix line's recipe consumes has expected_base_units = 0 and variance_base_units = used_base_units"
      - "a review with no mix lines yields expected_base_units = 0 for every count line"

  - name: theoretical_vs_actual_variance
    trigger: "POST /culinary/menu-period-reviews/{period_review_id}/close"
    algorithm_type: aggregation
    rounding: round_half_up
    precision: "integer cents for the reported figures, integer basis points for the variance"
    variants:
      - name: SALES_MIX_BASED
        description: |
          theoretical_food_cost_cents = sum over MenuMixLine m of
            m.units_sold * m.plate_cost_cents_snapshot.
          This basis therefore inherits the region freight uplift, the plate waste
          factor and the garnish allowance that plate_cost_and_food_cost baked into
          each snapshot, and it uses the plate cost as of the moment each mix line
          was loaded rather than today's prices.
      - name: USAGE_BASED
        description: |
          theoretical_food_cost_cents = round_half_up( sum over CountSheetLine l of
            round_half_up(l.expected_base_units * unit_cost_micros_used(l.ingredient_id)
                          / pack_base_units_snapshot(l.ingredient_id)) / 10000 ).
          This basis values the exploded ingredient quantities at today's published
          prices and contains no uplift, no waste factor and no garnish allowance,
          so it is structurally lower than SALES_MIX_BASED for the same mix.
    formula: |
      actual_food_cost_cents = round_half_up( sum over CountSheetLine l of
                                              l.valued_usage_micros / 10000 )
      When theoretical_food_cost_cents == 0: variance_bps = 0 and
        variance_flag = NO_BASIS.
      Otherwise, with d = actual_food_cost_cents - theoretical_food_cost_cents:
        variance_bps = sign(d) * round_half_up(abs(d) * 10000 / theoretical_food_cost_cents)
        variance_flag = OVER_TOLERANCE when abs(variance_bps) > VARIANCE_TOLERANCE_BPS,
                        else WITHIN_TOLERANCE
      Both an overrun and an underrun of the same magnitude are out of tolerance:
      an unexplained favourable variance means the count is wrong, not that the
      kitchen is efficient.
    input_set: "every MenuMixLine and every CountSheetLine of the review"
    constants_used: [VARIANCE_TOLERANCE_BPS]
    edge_cases:
      - "identical data, both bases: theoretical 539118 (USAGE_BASED) versus 592000 (SALES_MIX_BASED) against actual 555075 gives variance_bps 296 -> WITHIN_TOLERANCE and -624 -> OVER_TOLERANCE respectively"
      - "count lines exactly at expected under USAGE_BASED give variance_bps 0 and WITHIN_TOLERANCE"
      - "a review whose count lines all value to zero yields actual_food_cost_cents = 0 and a variance of -10000 bps"

  - name: menu_mix_classification
    trigger: "POST /culinary/menu-period-reviews/{period_review_id}/classify"
    algorithm_type: threshold
    rounding: round_half_up
    precision: "integer basis points and integer cents"
    formula: |
      mix_line_count = number of MenuMixLine rows of the review (>= 1, else ERR_EMPTY_MIX)
      total_units_sold = sum of units_sold over the mix lines
      popularity_threshold_bps = round_half_up(POPULARITY_FACTOR_BPS / mix_line_count)

      per line:
        mix_pct_bps      = round_half_up(units_sold * 10000 / total_units_sold)
        cm_per_unit_cents = round_half_up(gross_sales_cents / units_sold) - plate_cost_cents_snapshot

      margin_threshold_cents = round_half_up( sum(units_sold * cm_per_unit_cents)
                                              / total_units_sold )

      popular      = mix_pct_bps >= popularity_threshold_bps
      high_margin  = cm_per_unit_cents >= margin_threshold_cents
      margin_class = STAR      when popular and high_margin
                     PLOWHORSE when popular and not high_margin
                     PUZZLE    when not popular and high_margin
                     DOG       when neither
      Both comparisons are inclusive: a line sitting exactly on a threshold is on
      the favourable side of it.
    input_set: "every MenuMixLine of the review"
    constants_used: [POPULARITY_FACTOR_BPS]
    edge_cases:
      - "two lines, 1300 and 700 units of 2000: popularity_threshold_bps = 3500 and the 700-unit line's mix_pct_bps is exactly 3500, so it counts as popular; with cm 803 and 689 the margin_threshold_cents is 763, making the lines STAR and PLOWHORSE (not DOG)"
      - "a single-line review has popularity_threshold_bps = 7000 and mix_pct_bps = 10000, and its cm always equals the weighted average, so the only line is always a STAR"
      - "a line with units_sold = 0 is rejected at mix-line creation, so the cm division never divides by zero"

  - name: price_change_projection
    trigger: "POST /culinary/price-change-proposals/{proposal_id}/submit"
    algorithm_type: forward_looking
    rounding: round_half_up
    precision: "integer cents and integer basis points"
    formula: |
      Evaluated in exactly this order; every step consumes only the outputs of the
      steps above it.

      STEP 1  price_delta_bps = sign(proposed_price_cents - menu_item.current_price_cents)
                * round_half_up(abs(proposed_price_cents - menu_item.current_price_cents)
                                * 10000 / menu_item.current_price_cents)

      STEP 2  projected_unit_delta_bps = -sign(price_delta_bps)
                * round_half_up(abs(price_delta_bps) * proposal.elasticity_bps / 10000)
              (elasticity_bps is a positive magnitude: units always move against price)

      STEP 3  market_cap_price_cents = min(
                  round_half_up(REGION_COMPETITOR_INDEX_CENTS[menu_item.region_code]
                                * REGION_CAP_MULTIPLIER_BPS[menu_item.region_code] / 10000),
                  round_half_up(menu_item.current_price_cents * (10000 + MAX_SINGLE_INCREASE_BPS) / 10000))

      STEP 4  baseline_units = the units_sold of the MenuMixLine belonging to the most
                recent CLOSED MenuPeriodReview that contains a line for this menu item,
                ranked period_end DESC then created_at ASC, first row wins; when no such
                line exists, DEFAULT_BASELINE_UNITS.
              projected_units = max(0, round_half_up(baseline_units
                                * (10000 + projected_unit_delta_bps) / 10000))
              (the clamp only bites when projected_unit_delta_bps < -10000, which a
               large price increase under a high elasticity can produce)

      STEP 5  projected_food_cost_bps = round_half_up(menu_item.plate_cost_cents * 10000
                                                     / proposal.proposed_price_cents)
              — computed from the PROPOSED price, never from the capped price.

      STEP 6  relief_bps = CAP_RELIEF_BPS when projected_food_cost_bps > menu_item.target_food_cost_bps, else 0
              effective_cap_price_cents = round_half_up(market_cap_price_cents
                                                        * (10000 + relief_bps) / 10000)

      STEP 7  projected_contribution_delta_cents =
                  projected_units * (proposed_price_cents - menu_item.plate_cost_cents)
                - baseline_units  * (menu_item.current_price_cents - menu_item.plate_cost_cents)

      The submit-time gates then read these stored values:
        proposed_price_cents > effective_cap_price_cents -> ERR_MARKET_CAP_EXCEEDED (priority 47)
        proposed_price_cents - plate_cost_cents < MARGIN_FLOOR_CENTS -> ERR_MARGIN_FLOOR_BREACH (priority 48)
    input_set: "the target MenuItem, its region constants and the baseline MenuMixLine selected in STEP 4"
    combinatorial_note: |
      THE DEPENDENCY LOOKS CIRCULAR AND THE ORDER IS PINNED. The cap relief depends
      on the projected food cost, which depends on the proposed price, which is what
      the cap constrains. The loop is broken by evaluating the food cost against the
      raw proposed price in STEP 5 and only then widening the cap in STEP 6 — the
      cap is never fed back into STEP 5, and the cap comparison is never made
      against the un-relieved cap. Worked example on a 1099-cent item with a
      296-cent plate cost in region NE: market_cap_price_cents = 1231 (the
      MAX_SINGLE_INCREASE_BPS arm beats the competitor-index arm's 2013). A proposal
      at 1250 on an item with target_food_cost_bps 2000 yields
      projected_food_cost_bps 2368 > 2000, so relief applies and
      effective_cap_price_cents = 1268 and the proposal is accepted; the same
      proposal on an item with target_food_cost_bps 3000 yields no relief, an
      effective cap of 1231 and ERR_MARKET_CAP_EXCEEDED. Re-ordering STEP 5 after
      STEP 6 (testing the food cost against the capped price) flips both outcomes.
    constants_used: [REGION_COMPETITOR_INDEX_CENTS, REGION_CAP_MULTIPLIER_BPS, MAX_SINGLE_INCREASE_BPS, CAP_RELIEF_BPS, DEFAULT_BASELINE_UNITS, MARGIN_FLOOR_CENTS]
    edge_cases:
      - "1099 -> 1199, elasticity 12000, baseline 1000: price_delta_bps 910, projected_unit_delta_bps -1092, projected_units 891, projected_food_cost_bps 2469, market cap and effective cap both 1231, projected_contribution_delta_cents +1573"
      - "1099 -> 1250 with target_food_cost_bps 2000: price_delta_bps 1374, projected_unit_delta_bps -1649, projected_units 835, projected_food_cost_bps 2368, effective_cap_price_cents 1268, projected_contribution_delta_cents -6410 (a price rise that loses money)"
      - "a price cut inverts STEP 2: 1099 -> 500 gives price_delta_bps -5450 and projected_unit_delta_bps +6540 for projected_units 1654"

  - name: lto_costing
    trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/cost"
    algorithm_type: aggregation
    rounding: round_half_up
    precision: "integer cents and integer basis points"
    formula: |
      promo_plate_cost_cents      = menu_item.plate_cost_cents (snapshotted, requires plate_cost_state == FRESH)
      promo_food_cost_bps         = round_half_up(promo_plate_cost_cents * 10000 / promo_price_cents)
      forecast_contribution_cents = forecast_units * (promo_price_cents - promo_plate_cost_cents)
    input_set: "the single backing MenuItem"
    constants_used: []
    edge_cases:
      - "promo price 899 against a 296-cent plate cost with forecast 500 units: promo_food_cost_bps 3293 and forecast_contribution_cents 301500"
      - "a promo price below the plate cost yields a negative forecast_contribution_cents and a promo_food_cost_bps above 10000; costing still succeeds"

  - name: lto_post_promo_profitability
    trigger: "POST /culinary/lto-campaigns/{lto_campaign_id}/close-review"
    algorithm_type: threshold
    rounding: round_half_up
    precision: "integer cents and integer basis points"
    formula: |
      promo_support_cost_cents = round_half_up(actual_gross_sales_cents * LTO_SUPPORT_BPS / 10000)
      promo_contribution_cents = actual_gross_sales_cents
                                 - actual_units * promo_plate_cost_cents
                                 - promo_support_cost_cents
      forecast_attainment_bps  = round_half_up(actual_units * 10000 / forecast_units)
      verdict = PROFITABLE when promo_contribution_cents >= LTO_MIN_CONTRIBUTION_CENTS
                             AND forecast_attainment_bps >= LTO_MIN_ATTAINMENT_BPS
                else UNPROFITABLE
      Both conditions must hold: a promotion that made money on a fraction of the
      forecast volume cannibalised the base menu and is not renewed.
    input_set: "the campaign's own snapshotted promo_plate_cost_cents and forecast_units plus the reported actuals"
    constants_used: [LTO_SUPPORT_BPS, LTO_MIN_CONTRIBUTION_CENTS, LTO_MIN_ATTAINMENT_BPS]
    edge_cases:
      - "actual_units 420, actual_gross_sales_cents 377580, promo_plate_cost_cents 296, forecast_units 500: promo_support_cost_cents 11327, promo_contribution_cents 241933, forecast_attainment_bps 8400 -> PROFITABLE"
      - "actual_units 0 and actual_gross_sales_cents 0: promo_support_cost_cents 0 and promo_contribution_cents 0, which satisfies the contribution floor exactly, but forecast_attainment_bps 0 < 8000 -> UNPROFITABLE"
      - "forecast_units is required to be >= 1 at creation so the attainment division never divides by zero"

constants:
  REGION_FREIGHT_UPLIFT_BPS:
    NE: 600
    SE: 250
    MW: 0
    WEST: 450
  REGION_CAP_MULTIPLIER_BPS:
    NE: 11500
    SE: 10500
    MW: 11000
    WEST: 12000
  REGION_COMPETITOR_INDEX_CENTS:
    NE: 1750
    SE: 1450
    MW: 1500
    WEST: 1900
  REFERENCE_REGION_CODE: "MW"
  PLATE_WASTE_BPS: 200
  GARNISH_BPS: 150
  GARNISH_FLOOR_MICROS: 8000
  MAX_SINGLE_INCREASE_BPS: 1200
  CAP_RELIEF_BPS: 300
  MARGIN_FLOOR_CENTS: 300
  DEFAULT_BASELINE_UNITS: 1000
  MAX_RECIPE_DEPTH: 4
  MAX_REVISION_ROUNDS: 2
  POPULARITY_FACTOR_BPS: 7000
  COOLING_OFF_DAYS: 14
  VARIANCE_TOLERANCE_BPS: 300
  WEIGHTED_AVG_WINDOW_DAYS: 90
  KIDS_MENU_SODIUM_CAP_MCG: 640000
  LTO_SUPPORT_BPS: 300
  LTO_MIN_CONTRIBUTION_CENTS: 0
  LTO_MIN_ATTAINMENT_BPS: 8000
  MAX_CONCURRENT_LTO_PER_REGION: 2
  ALLERGEN_BITS:
    MILK: 1
    EGG: 2
    GLUTEN: 4
    PEANUT: 8
    SOY: 16
    FISH: 32
    SHELLFISH: 64
    TREE_NUT: 128

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated row wins and no later row is evaluated)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: schema
    check: "request body and query parameters parse, every required field is present, every field has the declared type, every enum value is a declared member, every integer respects its declared range, every ISO-8601 instant is well formed, limit is within 1..100 and offset is >= 0, and period_start < period_end / window_start < window_end where both are present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "the unit_id in the path or body identifies an existing Unit"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /culinary/units/{unit_id}, POST /culinary/menu-period-reviews"

  - priority: 5
    category: existence
    check: "the ingredient_id in the path or body identifies an existing Ingredient"
    error_id: ERR_INGREDIENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking ingredient_id in the path or body"

  - priority: 6
    category: existence
    check: "the price_feed_id in the path identifies an existing PriceFeed"
    error_id: ERR_PRICE_FEED_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/price-feeds/{price_feed_id} endpoints"

  - priority: 7
    category: existence
    check: "the recipe_id in the path or body identifies an existing Recipe, including the child_recipe_id of a SUB_RECIPE component"
    error_id: ERR_RECIPE_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/recipes/{recipe_id} endpoints, POST /culinary/menu-items, POST /culinary/spec-change-orders, POST /culinary/recipes/{recipe_id}/components"

  - priority: 8
    category: existence
    check: "the recipe_component_id in the path, or target_component_id in the body, identifies an existing RecipeComponent"
    error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /culinary/recipe-components/{recipe_component_id}, DELETE /culinary/recipe-components/{recipe_component_id}, POST /culinary/spec-change-orders"

  - priority: 9
    category: existence
    check: "the menu_item_id in the path or body identifies an existing MenuItem"
    error_id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/menu-items/{menu_item_id} endpoints, POST /culinary/price-change-proposals, POST /culinary/lto-campaigns, POST /culinary/menu-period-reviews/{id}/mix-lines"

  - priority: 10
    category: existence
    check: "the proposal_id in the path identifies an existing PriceChangeProposal"
    error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/price-change-proposals/{proposal_id} endpoints"

  - priority: 11
    category: existence
    check: "the spec_change_order_id in the path identifies an existing SpecChangeOrder"
    error_id: ERR_SPEC_CHANGE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/spec-change-orders/{spec_change_order_id} endpoints"

  - priority: 12
    category: existence
    check: "the period_review_id in the path identifies an existing MenuPeriodReview"
    error_id: ERR_PERIOD_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/menu-period-reviews/{period_review_id} endpoints"

  - priority: 13
    category: existence
    check: "the lto_campaign_id in the path identifies an existing LTOCampaign"
    error_id: ERR_LTO_NOT_FOUND
    http_status: 404
    applies_to: "all /culinary/lto-campaigns/{lto_campaign_id} endpoints"

  - priority: 14
    category: auth
    check: "when X-User-Role is UnitManager, X-User-ID equals the unit_id of the MenuPeriodReview being written to"
    error_id: ERR_UNIT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /culinary/menu-period-reviews/{id}/count-lines"

  - priority: 15
    category: state
    check: "expected_recipe_version equals the stored Recipe.version"
    error_id: ERR_STALE_RECIPE_VERSION
    http_status: 412
    applies_to: "POST /culinary/recipes/{recipe_id}/components, DELETE /culinary/recipe-components/{recipe_component_id}, POST /culinary/spec-change-orders"

  - priority: 16
    category: state
    check: "expected_menu_item_version equals the stored MenuItem.version"
    error_id: ERR_STALE_MENU_ITEM_VERSION
    http_status: 412
    applies_to: "POST /culinary/lto-campaigns"

  - priority: 17
    category: state
    check: "the target Recipe.status is DRAFT or UNDER_REVIEW, the only states in which its component set may be edited directly"
    error_id: ERR_RECIPE_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /culinary/recipes/{recipe_id}/components, DELETE /culinary/recipe-components/{recipe_component_id}"

  - priority: 18
    category: state
    check: "the Recipe referenced by this operation is in a status the operation allows: ACTIVE for menu-item activation, spec-change-order creation and spec-change-order approval; DRAFT or ACTIVE for submit-review; UNDER_REVIEW for activate; ACTIVE for retire; and no ACTIVE parent component may reference a recipe being retired. The same gate also rejects a submit-review on a recipe whose component_count is 0, because an empty specification is not reviewable in any status"
    error_id: ERR_RECIPE_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/recipes/{recipe_id}/submit-review, POST /culinary/recipes/{recipe_id}/activate, POST /culinary/recipes/{recipe_id}/retire, POST /culinary/menu-items/{menu_item_id}/activate, POST /culinary/spec-change-orders, POST /culinary/spec-change-orders/{spec_change_order_id}/approve"

  - priority: 19
    category: state
    check: "the target PriceFeed.status is DRAFT, and it has at least one line before publication"
    error_id: ERR_FEED_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /culinary/price-feeds/{id}/lines, POST /culinary/price-feeds/{price_feed_id}/publish"

  - priority: 20
    category: state
    check: "the MenuItem is in a status the operation allows: DRAFT or SUSPENDED for activate; ACTIVE for proposal submission and for LTO costing; ACTIVE or SUSPENDED for mix-line loading, because a period review may load any item that was on the menu during the period, including one a retired promotion has since suspended; and no MenuItem in DRAFT or ACTIVE may back a recipe being retired. Plate-cost recomputation is the one write deliberately NOT gated on the item's status — a DRAFT item must be able to obtain a FRESH plate cost before it can be activated at all. Proposal CREATION is likewise ungated: only the submission is, so a proposal may be drafted against a DRAFT item and will fail at submit"
    error_id: ERR_MENU_ITEM_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/menu-items/{menu_item_id}/activate, POST /culinary/price-change-proposals/{proposal_id}/submit, POST /culinary/lto-campaigns/{lto_campaign_id}/cost, POST /culinary/recipes/{recipe_id}/retire, POST /culinary/menu-period-reviews/{id}/mix-lines"

  - priority: 21
    category: state
    check: "the PriceChangeProposal is in a status the operation allows: DRAFT or REVISION_REQUESTED for PATCH and submit; SUBMITTED for request-revision and approve; APPROVED for apply"
    error_id: ERR_PROPOSAL_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /culinary/price-change-proposals/{proposal_id}, POST /culinary/price-change-proposals/{proposal_id}/submit, POST /culinary/price-change-proposals/{proposal_id}/request-revision, POST /culinary/price-change-proposals/{proposal_id}/approve, POST /culinary/price-change-proposals/{proposal_id}/apply"

  - priority: 22
    category: state
    check: "the SpecChangeOrder is in an approval_status the operation allows: DRAFT for submit; PENDING for approve and reject; APPROVED for propagate and rollback"
    error_id: ERR_SCO_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/spec-change-orders/{spec_change_order_id}/submit, POST /culinary/spec-change-orders/{spec_change_order_id}/approve, POST /culinary/spec-change-orders/{spec_change_order_id}/reject, POST /culinary/spec-change-orders/{spec_change_order_id}/propagate, POST /culinary/spec-change-orders/{spec_change_order_id}/rollback"

  - priority: 23
    category: state
    check: "the MenuPeriodReview is in a status the operation allows: OPEN or MIX_LOADED for mix-line and count-line loading and for classify; CLASSIFIED for close"
    error_id: ERR_REVIEW_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/menu-period-reviews/{id}/mix-lines, POST /culinary/menu-period-reviews/{id}/count-lines, POST /culinary/menu-period-reviews/{period_review_id}/classify, POST /culinary/menu-period-reviews/{period_review_id}/close"

  - priority: 24
    category: state
    check: "the LTOCampaign is in a status the operation allows: PLANNED for cost; COSTED for launch (and the current clock must be before window_end); LAUNCHED for close-review (and the current clock must be at or after window_end); CLOSED for decide, with verdict PROFITABLE required for decision RENEW"
    error_id: ERR_LTO_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/lto-campaigns/{lto_campaign_id}/cost, POST /culinary/lto-campaigns/{lto_campaign_id}/launch, POST /culinary/lto-campaigns/{lto_campaign_id}/close-review, POST /culinary/lto-campaigns/{lto_campaign_id}/decide"

  - priority: 25
    category: state
    check: "every CountSheetLine of the review has sync_state = CURRENT"
    error_id: ERR_COUNT_SHEET_OUT_OF_DATE
    http_status: 409
    applies_to: "POST /culinary/menu-period-reviews/{period_review_id}/close"

  - priority: 26
    category: state
    check: "the cost figures the operation consumes are not stale: Recipe.cost_state = FRESH for submit-review, activate and plate-cost; every ACTIVE SUB_RECIPE child's cost_state = FRESH and cost_basis equal to the requested basis for cost-rollup; MenuItem.plate_cost_state = FRESH for menu-item activation, proposal submission, proposal approval and LTO costing"
    error_id: ERR_COST_STALE
    http_status: 409
    applies_to: "POST /culinary/recipes/{recipe_id}/cost-rollup, POST /culinary/recipes/{recipe_id}/submit-review, POST /culinary/recipes/{recipe_id}/activate, POST /culinary/menu-items/{menu_item_id}/plate-cost, POST /culinary/menu-items/{menu_item_id}/activate, POST /culinary/price-change-proposals/{proposal_id}/submit, POST /culinary/price-change-proposals/{proposal_id}/approve, POST /culinary/lto-campaigns/{lto_campaign_id}/cost"

  - priority: 27
    category: auth
    check: "X-User-ID differs from the submitted_by_user_id recorded on the record being approved — deliberately ranked BELOW the state checks so that approving a record in the wrong state, or one whose recipe left ACTIVE, reports the state error even when the approver is also the submitter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/approve, POST /culinary/spec-change-orders/{spec_change_order_id}/approve"

  - priority: 28
    category: state
    check: "the RecipeComponent targeted by this operation has status = ACTIVE"
    error_id: ERR_COMPONENT_ALREADY_REMOVED
    http_status: 409
    applies_to: "DELETE /culinary/recipe-components/{recipe_component_id}, POST /culinary/spec-change-orders, POST /culinary/spec-change-orders/{spec_change_order_id}/submit, POST /culinary/spec-change-orders/{spec_change_order_id}/approve"

  - priority: 29
    category: state
    check: "the requested propagation target is not already reflected in propagation_status (PREP_GUIDE when it is PREP_GUIDE_SYNCED or FULLY_PROPAGATED; COUNT_SHEETS when it is COUNTS_SYNCED or FULLY_PROPAGATED)"
    error_id: ERR_PROPAGATION_ALREADY_SYNCED
    http_status: 409
    applies_to: "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate"

  - priority: 30
    category: business_referential
    check: "every ACTIVE SUB_RECIPE component of the recipe being activated points at a child Recipe whose status = ACTIVE"
    error_id: ERR_SUBRECIPE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /culinary/recipes/{recipe_id}/activate"

  - priority: 31
    category: business_referential
    check: "no Ingredient the operation depends on has status = RETIRED: the ingredient of a component being added, every ingredient of a recipe being activated, the ingredient of a COMPONENT_ADD spec change order being approved, the ingredient of every line of a price feed being published, and the ingredient being retired itself, so a second retire of an already RETIRED ingredient is rejected rather than silently repeated"
    error_id: ERR_INGREDIENT_RETIRED
    http_status: 422
    applies_to: "POST /culinary/ingredients/{ingredient_id}/retire, POST /culinary/recipes/{recipe_id}/components, POST /culinary/recipes/{recipe_id}/activate, POST /culinary/spec-change-orders/{spec_change_order_id}/approve, POST /culinary/price-feeds/{price_feed_id}/publish"

  - priority: 32
    category: business_safety
    check: "(MenuItem.declared_allergen_mask AND Recipe.allergen_mask) == Recipe.allergen_mask — every allergen the recipe rolls up, including ones inherited only through sub-recipes, is declared on the menu item"
    error_id: ERR_ALLERGEN_UNDECLARED
    http_status: 422
    applies_to: "POST /culinary/menu-items/{menu_item_id}/activate"

  - priority: 33
    category: business_safety
    check: "when MenuItem.is_kids_menu is true, the backing Recipe.sodium_mcg_per_portion is at most KIDS_MENU_SODIUM_CAP_MCG"
    error_id: ERR_NUTRITION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /culinary/menu-items/{menu_item_id}/activate"

  - priority: 34
    category: business_constraint
    check: "a SUB_RECIPE component's child_recipe_id is neither the owning recipe itself nor any recipe that already reaches the owning recipe through ACTIVE components — the recipe graph stays acyclic"
    error_id: ERR_RECIPE_CYCLE
    http_status: 422
    applies_to: "POST /culinary/recipes/{recipe_id}/components"

  - priority: 35
    category: business_constraint
    check: "the resulting depth of the owning recipe, and of every recipe that transitively contains it, stays at or below MAX_RECIPE_DEPTH"
    error_id: ERR_RECIPE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /culinary/recipes/{recipe_id}/components, POST /culinary/recipes/{recipe_id}/activate"

  - priority: 36
    category: business_constraint
    check: "the submitted Ingredient.sku is not already used by another Ingredient"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /culinary/ingredients"

  - priority: 37
    category: business_constraint
    check: "the submitted code is not already used by another entity of the same type (Unit.code, Recipe.code, MenuItem.code)"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /culinary/units, POST /culinary/recipes, POST /culinary/menu-items"

  - priority: 38
    category: business_constraint
    check: "the target MenuItem has no other PriceChangeProposal whose status is in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED} — at most one live proposal per item"
    error_id: ERR_PROPOSAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /culinary/price-change-proposals"

  - priority: 39
    category: business_constraint
    check: "the revision cycle terminates instead of raising a fiscal error: while revision_round is below MAX_REVISION_ROUNDS a revision request reopens the proposal, at exactly MAX_REVISION_ROUNDS the same call rejects it outright, and any further request-revision on the now-REJECTED proposal is a state violation reported by the status gate at priority 21"
    error_id: ERR_PROPOSAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/request-revision"

  - priority: 40
    category: business_constraint
    check: "the review has at least one MenuMixLine before classification"
    error_id: ERR_EMPTY_MIX
    http_status: 422
    applies_to: "POST /culinary/menu-period-reviews/{period_review_id}/classify"

  - priority: 41
    category: business_constraint
    check: "the review has at least one CountSheetLine before closing"
    error_id: ERR_EMPTY_COUNT_SHEET
    http_status: 422
    applies_to: "POST /culinary/menu-period-reviews/{period_review_id}/close"

  - priority: 42
    category: business_temporal
    check: "when MenuItem.last_price_change_at is not null, the proposal's effective_from is at least COOLING_OFF_DAYS whole days after it"
    error_id: ERR_PRICE_CHANGE_COOLING_OFF
    http_status: 409
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/submit"

  - priority: 43
    category: business_temporal
    check: "fewer than MAX_CONCURRENT_LTO_PER_REGION LAUNCHED campaigns in the same region_code have a [window_start, window_end) window intersecting this campaign's window"
    error_id: ERR_LTO_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /culinary/lto-campaigns/{lto_campaign_id}/launch"

  - priority: 44
    category: business_temporal
    check: "the current logical clock has reached the instant the operation waits for: proposal.effective_from for apply, campaign.window_end for close-review"
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/apply, POST /culinary/lto-campaigns/{lto_campaign_id}/close-review"

  - priority: 45
    category: business_temporal
    check: "no line's [effective_from, effective_to) window intersects an existing PUBLISHED window for the same (ingredient_id, region_code). Windows are half-open: a new line whose effective_from equals an existing bounded row's effective_to is adjacent, not overlapping, and is accepted. A new line whose effective_from is strictly after an open-ended PUBLISHED row's effective_from truncates that row instead of colliding with it. A new line whose effective_from is at or before an existing row's effective_from, or falls strictly inside a bounded existing window, is a collision"
    error_id: ERR_PRICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /culinary/price-feeds/{price_feed_id}/publish"

  - priority: 46
    category: business_temporal
    check: "the requested clock instant is at or after the current logical clock — the logical clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /culinary/_clock/set_current_utc"

  - priority: 47
    category: business_fiscal
    check: "proposed_price_cents is at most effective_cap_price_cents as computed by calculations.price_change_projection STEP 6, which is the market cap widened by CAP_RELIEF_BPS only when the projected food cost computed from the proposed price exceeds the item's target_food_cost_bps"
    error_id: ERR_MARKET_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/submit"

  - priority: 48
    category: business_fiscal
    check: "proposed_price_cents minus MenuItem.plate_cost_cents is at least MARGIN_FLOOR_CENTS"
    error_id: ERR_MARGIN_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /culinary/price-change-proposals/{proposal_id}/submit"

  - priority: 49
    category: business_fiscal
    check: "every INGREDIENT component of the recipe being rolled up resolves to a unit cost under the requested basis, after the WEIGHTED_AVG_90D fallback to LATEST_PUBLISHED has been attempted"
    error_id: ERR_NO_PUBLISHED_PRICE
    http_status: 422
    applies_to: "POST /culinary/recipes/{recipe_id}/cost-rollup"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (63 endpoints, every resource exactly one collection
# segment below the api_prefix). Every list endpoint is paginated: it accepts
# limit? and offset? and returns the pagination envelope fields.
# ---------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/culinary/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock, which every window, cooling-off and effective-date rule in this domain reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time. The clock is monotonic: an instant earlier than the current one is rejected with ERR_CLOCK_NOT_MONOTONIC."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock to to_iso8601; no entity is modified and no cascade fires"]

  - method: POST
    path: "/culinary/units"
    description: "Registers a store. The unit's region_code is what a UnitManager's count sheets are scoped by."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, region_code]
    output: Unit
    side_effects: []

  - method: GET
    path: "/culinary/units/{unit_id}"
    description: "Reads one store."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/culinary/ingredients"
    description: "Registers a purchasable ingredient. net_yield_bps is computed from trim_yield_bps and cook_shrink_bps and any client-supplied value is ignored."
    roles: [RecipeDeveloper, PlatformAdmin]
    code: 201
    input: [sku, name, base_uom, pack_base_units, trim_yield_bps, cook_shrink_bps, allergen_mask, kcal_per_base_unit_micros, sodium_mcg_per_base_unit]
    output: Ingredient
    side_effects: ["computes net_yield_bps = floor(trim_yield_bps * (10000 - cook_shrink_bps) / 10000)"]

  - method: GET
    path: "/culinary/ingredients/{ingredient_id}"
    description: "Reads one ingredient including its computed net yield and allergen bitmask."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  - method: POST
    path: "/culinary/ingredients/{ingredient_id}/retire"
    description: "Retires an ingredient from the purchasing catalogue. Deliberately does NOT invalidate any recipe or plate cost: no specification and no published price changed."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["sets status = RETIRED and retired_at = current logical clock", "increments version by 1"]

  - method: GET
    path: "/culinary/ingredients/{id}/prices"
    description: "Lists every IngredientPrice row quoted for this ingredient across feeds and regions, in effective_from ASC then created_at ASC order. The only way to observe the PUBLISHED / SUPERSEDED truncation a feed publication performs."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["status?", "region_code?", "limit?", "offset?"]
    output: IngredientPrice[]
    side_effects: []

  - method: GET
    path: "/culinary/ingredients/{id}/count-lines"
    description: "Lists every CountSheetLine recorded for this ingredient across period reviews, newest review first. The only way to observe the count-sheet invalidation a spec change order cascades."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["sync_state?", "limit?", "offset?"]
    output: CountSheetLine[]
    side_effects: []

  - method: POST
    path: "/culinary/price-feeds"
    description: "Opens a DRAFT distributor price feed for one region. Lines are added separately and nothing takes effect until publication."
    roles: [CostAnalyst]
    code: 201
    input: [distributor_code, region_code, feed_date]
    output: PriceFeed
    side_effects: []

  - method: GET
    path: "/culinary/price-feeds/{price_feed_id}"
    description: "Reads one feed including its line count and, after publication, how many rows it superseded and how many recipes and menu items it invalidated."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: PriceFeed
    side_effects: []

  - method: POST
    path: "/culinary/price-feeds/{id}/lines"
    description: "Adds a PENDING price line to a DRAFT feed. region_code and distributor_code are copied from the feed and pack_base_units_snapshot is frozen from the ingredient; client-supplied values for those three fields are ignored."
    roles: [CostAnalyst]
    code: 201
    input: [ingredient_id, pack_cost_micros, effective_from, "effective_to?"]
    output: IngredientPrice
    side_effects: ["increments PriceFeed.line_count and PriceFeed.version by 1", "freezes pack_base_units_snapshot from Ingredient.pack_base_units"]

  - method: GET
    path: "/culinary/price-feeds/{id}/lines"
    description: "Lists the price lines of one feed in created_at ASC order."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IngredientPrice[]
    side_effects: []

  - method: POST
    path: "/culinary/price-feeds/{price_feed_id}/publish"
    description: "Publishes a DRAFT feed. Fires the five-hop invalidation cascade described in the PriceFeed state machine: lines PUBLISHED and older open-ended rows truncated, then consuming recipes STALE, then their parent recipes STALE transitively, then the plated recipes' menu items STALE, then those menu items' margin_class cleared."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: PriceFeed
    side_effects:
      - "sets status = PUBLISHED and published_at; flips every PENDING line of the feed to PUBLISHED"
      - "truncates each superseded open-ended row (effective_to := the new line's effective_from, status := SUPERSEDED) and counts them in superseded_price_count"
      - "flips every consuming Recipe and, transitively, every parent Recipe to cost_state = STALE and counts them in affected_recipe_count"
      - "flips every affected MenuItem to plate_cost_state = STALE with margin_class = UNCLASSIFIED and counts them in affected_menu_item_count"
      - "increments the version of every entity it touches"

  - method: POST
    path: "/culinary/recipes"
    description: "Creates a DRAFT recipe. recipe_type SUB_RECIPE recipes may be consumed as components; PLATED recipes may back menu items. cost_state starts STALE, so a roll-up is required before the recipe can be reviewed."
    roles: [RecipeDeveloper]
    code: 201
    input: [code, name, recipe_type, base_uom, batch_yield_base_units, portions_per_batch]
    output: Recipe
    side_effects: []

  - method: GET
    path: "/culinary/recipes/{recipe_id}"
    description: "Reads one recipe including its cost state, cost basis, rolled-up costs, allergen bitmask, nutrition per portion, depth and open spec-change counter."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: POST
    path: "/culinary/recipes/{recipe_id}/components"
    description: "Adds a component to a DRAFT or UNDER_REVIEW recipe. component_type INGREDIENT requires ingredient_id and computes ap_quantity_base_units from the ingredient's net yield; SUB_RECIPE requires child_recipe_id and is rejected when it would close a cycle or push any containing recipe past MAX_RECIPE_DEPTH. Requires expected_recipe_version."
    roles: [RecipeDeveloper]
    code: 201
    input: [component_type, "ingredient_id?", "child_recipe_id?", ep_quantity_base_units, sequence_no, expected_recipe_version]
    output: RecipeComponent
    side_effects:
      - "computes ap_quantity_base_units = ceil(ep_quantity_base_units * 10000 / ingredient.net_yield_bps) for INGREDIENT components, or copies ep_quantity_base_units for SUB_RECIPE components"
      - "recomputes Recipe.component_count, allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion and depth, sets Recipe.cost_state = STALE and increments Recipe.version by 1"
      - "flips every MenuItem of the recipe to plate_cost_state = STALE with margin_class = UNCLASSIFIED"

  - method: GET
    path: "/culinary/recipe-components/{recipe_component_id}"
    description: "Reads one component including the unit cost and pack divisor the last roll-up used and its extended cost."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: RecipeComponent
    side_effects: []

  - method: GET
    path: "/culinary/recipe-components"
    description: "Lists components filtered by owning recipe, by child recipe (which recipes consume this sub-recipe), by ingredient (which recipes consume this ingredient) and by status, ordered sequence_no ASC then created_at ASC."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["recipe_id?", "child_recipe_id?", "ingredient_id?", "status?", "limit?", "offset?"]
    output: RecipeComponent[]
    side_effects: []

  - method: DELETE
    path: "/culinary/recipe-components/{recipe_component_id}"
    description: "Soft-removes a component from a DRAFT or UNDER_REVIEW recipe, returning the removed row. Requires expected_recipe_version. The row keeps its historical extended_cost_micros and stops contributing to the recipe."
    roles: [RecipeDeveloper]
    code: 200
    input: [expected_recipe_version]
    output: RecipeComponent
    side_effects:
      - "sets status = REMOVED and removed_at = current logical clock"
      - "recomputes Recipe.component_count, allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion and depth from the remaining ACTIVE components, sets Recipe.cost_state = STALE and increments Recipe.version by 1"
      - "flips every MenuItem of the recipe to plate_cost_state = STALE with margin_class = UNCLASSIFIED"

  - method: POST
    path: "/culinary/recipes/{recipe_id}/cost-rollup"
    description: "Recomputes the recipe's batch and portion cost under the requested basis (default LATEST_PUBLISHED) per calculations.recipe_cost_rollup, and refreshes the allergen and nutrition roll-up. Sub-recipe children are never recomputed implicitly: a child that is STALE, or FRESH under a different basis, fails the call with ERR_COST_STALE."
    roles: [CostAnalyst]
    code: 200
    input: ["basis?"]
    output: Recipe
    side_effects:
      - "writes unit_cost_micros_used, pack_base_units_snapshot and extended_cost_micros on every ACTIVE component"
      - "writes batch_cost_micros, portion_cost_micros, cost_basis, allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion, depth, cost_state = FRESH and last_rollup_at on the recipe"
      - "increments Recipe.version and every touched RecipeComponent.version by 1"

  - method: GET
    path: "/culinary/recipes/{recipe_id}/allergen-nutrition"
    description: "Computed read: recomputes the allergen bitmask, per-portion energy and sodium, depth and component count from the live ACTIVE component graph and returns them in the Recipe shape. Persists nothing and works even when cost_state is STALE, so a test can distinguish the live roll-up from the last persisted one."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: POST
    path: "/culinary/recipes/{recipe_id}/submit-review"
    description: "Sends a DRAFT recipe, or an ACTIVE recipe whose specification changed, into UNDER_REVIEW. Requires at least one ACTIVE component (else ERR_RECIPE_INVALID_STATE) and a FRESH cost (else ERR_COST_STALE)."
    roles: [RecipeDeveloper]
    code: 200
    input: []
    output: Recipe
    side_effects: ["sets status = UNDER_REVIEW and increments version by 1"]

  - method: POST
    path: "/culinary/recipes/{recipe_id}/activate"
    description: "Activates an UNDER_REVIEW recipe. Requires a FRESH cost, no RETIRED ingredient, every sub-recipe child ACTIVE and a depth within MAX_RECIPE_DEPTH. Mints revision 1 of the prep guide on the first activation only."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: Recipe
    side_effects: ["sets status = ACTIVE and increments version by 1", "mints PrepGuide revision 1 with sync_state = CURRENT when none exists; leaves an existing prep guide, including its sync_state, untouched"]

  - method: POST
    path: "/culinary/recipes/{recipe_id}/retire"
    description: "Retires an ACTIVE recipe. Blocked while any menu item on it is DRAFT or ACTIVE, or while any live recipe consumes it as a sub-recipe."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: Recipe
    side_effects: ["sets status = RETIRED, cost_state = STALE and increments version by 1"]

  - method: GET
    path: "/culinary/recipes/{id}/prep-guides"
    description: "Lists the prep guides of a recipe (zero or one row). The only way to observe the prep guide a recipe activation mints and the OUT_OF_DATE flag a spec change order sets."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PrepGuide[]
    side_effects: []

  - method: POST
    path: "/culinary/menu-items"
    description: "Creates a DRAFT menu item on a PLATED recipe at a stated regional price. plate_cost_state starts STALE and margin_class starts UNCLASSIFIED."
    roles: [RecipeDeveloper]
    code: 201
    input: [code, name, recipe_id, region_code, current_price_cents, target_food_cost_bps, declared_allergen_mask, "is_kids_menu?"]
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/culinary/menu-items/{menu_item_id}"
    description: "Reads one menu item including its plate cost, food cost in basis points, contribution margin, margin class and allergen bitmask."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/culinary/menu-items"
    description: "Lists menu items filtered by backing recipe, region, status and margin class, ordered created_at ASC."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["recipe_id?", "region_code?", "status?", "margin_class?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  - method: POST
    path: "/culinary/menu-items/{menu_item_id}/plate-cost"
    description: "Recomputes the plate cost, food cost basis points and contribution margin per calculations.plate_cost_and_food_cost and copies the recipe's allergen and sodium roll-up onto the item. Requires the backing recipe's cost to be FRESH."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: MenuItem
    side_effects:
      - "writes plate_cost_micros, plate_cost_cents, food_cost_bps, contribution_margin_cents, cost_basis, allergen_mask, sodium_mcg_per_portion and plate_cost_state = FRESH"
      - "increments version by 1; margin_class is left untouched"

  - method: POST
    path: "/culinary/menu-items/{menu_item_id}/activate"
    description: "Activates a DRAFT or SUSPENDED menu item. Requires the backing recipe ACTIVE, a FRESH plate cost, every rolled-up allergen declared on the item and, for kids-menu items, sodium within KIDS_MENU_SODIUM_CAP_MCG."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["sets status = ACTIVE and increments version by 1"]

  - method: GET
    path: "/culinary/menu-items/{id}/mix-lines"
    description: "Lists every MenuMixLine recorded for this item across period reviews, newest review first. The channel through which a price-change projection's baseline units can be verified."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["limit?", "offset?"]
    output: MenuMixLine[]
    side_effects: []

  - method: POST
    path: "/culinary/price-change-proposals"
    description: "Opens a DRAFT price change proposal for an ACTIVE menu item. At most one live proposal per item. No projection is computed until submission, and there is deliberately no OCC field here: the conflict this create guards against is a second live proposal, which is a state precondition, not a stale read."
    roles: [RecipeDeveloper]
    code: 201
    input: [menu_item_id, proposed_price_cents, effective_from, elasticity_bps]
    output: PriceChangeProposal
    side_effects: []

  - method: GET
    path: "/culinary/price-change-proposals/{proposal_id}"
    description: "Reads one proposal including every projection field, the revision round and the submitter and approver ids."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: PriceChangeProposal
    side_effects: []

  - method: GET
    path: "/culinary/price-change-proposals"
    description: "Lists proposals filtered by menu item and status, ordered created_at ASC."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["menu_item_id?", "status?", "limit?", "offset?"]
    output: PriceChangeProposal[]
    side_effects: []

  - method: PATCH
    path: "/culinary/price-change-proposals/{proposal_id}"
    description: "Edits a DRAFT or REVISION_REQUESTED proposal. Every projection field stays as the last submission left it until the proposal is submitted again."
    roles: [RecipeDeveloper]
    code: 200
    input: ["proposed_price_cents?", "effective_from?", "elasticity_bps?"]
    output: PriceChangeProposal
    side_effects: ["increments version by 1"]

  - method: POST
    path: "/culinary/price-change-proposals/{proposal_id}/submit"
    description: "Submits a DRAFT or REVISION_REQUESTED proposal for approval, computing every projection field per calculations.price_change_projection and enforcing the cooling-off, market-cap and margin-floor gates in that order. Records the caller as submitted_by_user_id."
    roles: [RecipeDeveloper]
    code: 200
    input: []
    output: PriceChangeProposal
    side_effects:
      - "writes baseline_units, price_delta_bps, projected_unit_delta_bps, projected_units, projected_food_cost_bps, market_cap_price_cents, effective_cap_price_cents and projected_contribution_delta_cents"
      - "sets status = SUBMITTED, submitted_by_user_id = X-User-ID and increments version by 1"

  - method: POST
    path: "/culinary/price-change-proposals/{proposal_id}/request-revision"
    description: "Sends a SUBMITTED proposal back for revision, incrementing revision_round. At revision_round == MAX_REVISION_ROUNDS the same call rejects the proposal outright instead of reopening it."
    roles: [CulinaryDirector]
    code: 200
    input: [last_revision_reason]
    output: PriceChangeProposal
    side_effects:
      - "below the limit: sets status = REVISION_REQUESTED and increments revision_round by 1"
      - "at the limit: sets status = REJECTED and leaves revision_round unchanged"
      - "stores last_revision_reason and increments version by 1"

  - method: POST
    path: "/culinary/price-change-proposals/{proposal_id}/approve"
    description: "Approves a SUBMITTED proposal. Requires the item's plate cost to still be FRESH, checked BEFORE the segregation-of-duties comparison, and forbids the submitter from approving their own proposal."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: PriceChangeProposal
    side_effects: ["sets status = APPROVED, approved_by_user_id = X-User-ID and increments version by 1"]

  - method: POST
    path: "/culinary/price-change-proposals/{proposal_id}/apply"
    description: "Applies an APPROVED proposal once the logical clock reaches effective_from, writing the new price onto the menu item and re-deriving its food cost and contribution margin from the unchanged plate cost."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: PriceChangeProposal
    side_effects:
      - "sets status = EFFECTIVE and applied_at = current logical clock"
      - "sets MenuItem.current_price_cents = proposed_price_cents, last_price_change_at = current logical clock, recomputes food_cost_bps and contribution_margin_cents, resets margin_class = UNCLASSIFIED and increments MenuItem.version by 1"
      - "leaves MenuItem.plate_cost_state = FRESH: the plate cost itself did not move"

  - method: POST
    path: "/culinary/spec-change-orders"
    description: "Opens a DRAFT specification change order against an ACTIVE recipe: change the quantity of a component, add an ingredient component, or remove a component. Requires expected_recipe_version, and bumps the recipe's open_spec_change_count (and therefore its version) so a second order authored against the old read is rejected."
    roles: [RecipeDeveloper]
    code: 201
    input: [recipe_id, change_type, "target_component_id?", "ingredient_id?", "new_ep_quantity_base_units?", expected_recipe_version]
    output: SpecChangeOrder
    side_effects: ["increments Recipe.open_spec_change_count and Recipe.version by 1"]

  - method: GET
    path: "/culinary/spec-change-orders/{spec_change_order_id}"
    description: "Reads one order including both state dimensions, every pre-change snapshot and the component id a COMPONENT_ADD created."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: SpecChangeOrder
    side_effects: []

  - method: GET
    path: "/culinary/spec-change-orders"
    description: "Lists orders filtered by recipe, by target component, by ingredient and by either state dimension, ordered created_at ASC."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["recipe_id?", "target_component_id?", "ingredient_id?", "approval_status?", "propagation_status?", "limit?", "offset?"]
    output: SpecChangeOrder[]
    side_effects: []

  - method: POST
    path: "/culinary/spec-change-orders/{spec_change_order_id}/submit"
    description: "Submits a DRAFT order for approval and records the caller as submitted_by_user_id."
    roles: [RecipeDeveloper]
    code: 200
    input: []
    output: SpecChangeOrder
    side_effects: ["sets approval_status = PENDING, submitted_by_user_id = X-User-ID and increments version by 1"]

  - method: POST
    path: "/culinary/spec-change-orders/{spec_change_order_id}/approve"
    description: "Approves a PENDING order and applies the specification edit, firing the four-hop cascade described in the SpecChangeOrder state machine. Snapshots the pre-change quantity, batch cost, allergen mask and recipe version first so a rollback can restore them exactly. Deliberately does NOT recompute any cost figure: it flips the recipe to STALE and leaves the arithmetic to an explicit roll-up."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: SpecChangeOrder
    side_effects:
      - "writes pre_change_ep_quantity_base_units, pre_change_batch_cost_micros, pre_change_allergen_mask, pre_change_recipe_version, approved_by_user_id and approved_at"
      - "applies the component edit (quantity rewritten, component minted with created_component_id set, or component flipped to REMOVED)"
      - "recomputes Recipe.component_count, allergen_mask, kcal_per_portion_micros, sodium_mcg_per_portion and depth, sets cost_state = STALE, decrements open_spec_change_count and increments Recipe.version by 1"
      - "refreshes each MenuItem's allergen_mask and sodium_mcg_per_portion, flips plate_cost_state = STALE, resets margin_class = UNCLASSIFIED and increments MenuItem.version by 1"
      - "reverts every COSTED LTOCampaign of those menu items to PLANNED with its costing figures cleared to 0"
      - "flips the recipe's PrepGuide to sync_state = OUT_OF_DATE and every affected CountSheetLine of a non-CLOSED review to sync_state = OUT_OF_DATE"

  - method: POST
    path: "/culinary/spec-change-orders/{spec_change_order_id}/reject"
    description: "Rejects a PENDING order. The specification is untouched and the recipe's cost state is left exactly as it was."
    roles: [CulinaryDirector]
    code: 200
    input: [rejection_reason]
    output: SpecChangeOrder
    side_effects: ["sets approval_status = REJECTED and stores rejection_reason", "decrements Recipe.open_spec_change_count and increments Recipe.version by 1"]

  - method: POST
    path: "/culinary/spec-change-orders/{spec_change_order_id}/propagate"
    description: "Drains one propagation target of an APPROVED order: PREP_GUIDE re-issues the prep guide at the recipe's current version, COUNT_SHEETS recomputes expected usage and variance on every OUT_OF_DATE count line of a non-CLOSED review. The two targets advance the propagation dimension independently of the approval dimension and each may be drained once."
    roles: [CostAnalyst]
    code: 200
    input: [target]
    output: SpecChangeOrder
    side_effects:
      - "PREP_GUIDE: sets PrepGuide.sync_state = CURRENT, increments revision_no, refreshes the three snapshots and sets synced_spec_version = Recipe.version"
      - "COUNT_SHEETS: recomputes expected_base_units and variance_base_units, sets sync_state = CURRENT and synced_spec_version = Recipe.version on every affected CountSheetLine"
      - "advances propagation_status to PREP_GUIDE_SYNCED, COUNTS_SYNCED or FULLY_PROPAGATED and increments SpecChangeOrder.version by 1"

  - method: POST
    path: "/culinary/spec-change-orders/{spec_change_order_id}/rollback"
    description: "Compensating action for an APPROVED order: restores the component set, the recipe's batch cost and allergen mask from the pre-change snapshots, resets the propagation dimension to NOT_STARTED and re-marks the prep guide and count lines OUT_OF_DATE."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: SpecChangeOrder
    side_effects:
      - "restores the target component (quantity, ACTIVE status, or REMOVED for a component this order created)"
      - "restores Recipe.batch_cost_micros and Recipe.allergen_mask from the snapshots, recomputes the derived counters, sets cost_state = STALE and increments Recipe.version by 1"
      - "restores each MenuItem's allergen_mask and sodium_mcg_per_portion, flips plate_cost_state = STALE, resets margin_class = UNCLASSIFIED and increments version by 1"
      - "sets approval_status = ROLLED_BACK and propagation_status = NOT_STARTED and increments version by 1"

  - method: POST
    path: "/culinary/menu-period-reviews"
    description: "Opens an OPEN menu period review for one store over a closed-open date window under a stated variance basis. The basis is fixed at creation and decides which theoretical food cost the close computes."
    roles: [CostAnalyst]
    code: 201
    input: [unit_id, period_start, period_end, basis]
    output: MenuPeriodReview
    side_effects: []

  - method: GET
    path: "/culinary/menu-period-reviews/{period_review_id}"
    description: "Reads one review including its totals, both thresholds, the theoretical and actual food cost, the variance and its tolerance flag."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: MenuPeriodReview
    side_effects: []

  - method: GET
    path: "/culinary/menu-period-reviews"
    description: "Lists reviews filtered by unit, status and basis, ordered period_end DESC then created_at ASC — the same ranking the price-change projection uses to pick its baseline."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["unit_id?", "status?", "basis?", "limit?", "offset?"]
    output: MenuPeriodReview[]
    side_effects: []

  - method: POST
    path: "/culinary/menu-period-reviews/{id}/mix-lines"
    description: "Loads one item's sales into the review, snapshotting the item's current plate cost. The first line auto-advances the review from OPEN to MIX_LOADED."
    roles: [CostAnalyst]
    code: 201
    input: [menu_item_id, units_sold, gross_sales_cents]
    output: MenuMixLine
    side_effects:
      - "snapshots plate_cost_cents_snapshot from MenuItem.plate_cost_cents and sets margin_class = UNCLASSIFIED"
      - "recomputes MenuPeriodReview.total_units_sold and total_gross_sales_cents, advances status to MIX_LOADED on the first line and increments MenuPeriodReview.version by 1"

  - method: GET
    path: "/culinary/menu-period-reviews/{id}/mix-lines"
    description: "Lists the review's mix lines in created_at ASC order, with the mix percentage, unit contribution margin and margin class a classification wrote."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["limit?", "offset?"]
    output: MenuMixLine[]
    side_effects: []

  - method: POST
    path: "/culinary/menu-period-reviews/{id}/count-lines"
    description: "Records one ingredient's physical count for the review and derives the expected usage from the loaded mix. A UnitManager may only write to a review of their own unit."
    roles: [UnitManager, CostAnalyst]
    code: 201
    input: [ingredient_id, opening_base_units, received_base_units, counted_base_units]
    output: CountSheetLine
    side_effects:
      - "computes used_base_units, expected_base_units per calculations.count_sheet_expected_usage and variance_base_units, and sets sync_state = CURRENT with synced_spec_version copied from the consuming recipe's version"
      - "increments MenuPeriodReview.version by 1"

  - method: GET
    path: "/culinary/menu-period-reviews/{id}/count-lines"
    description: "Lists the review's count lines in created_at ASC order, including each line's sync state and valued usage."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["sync_state?", "limit?", "offset?"]
    output: CountSheetLine[]
    side_effects: []

  - method: POST
    path: "/culinary/menu-period-reviews/{period_review_id}/classify"
    description: "Classifies the loaded mix per calculations.menu_mix_classification and copies each line's class onto its menu item. Allowed from OPEN and MIX_LOADED, but an OPEN review has no lines and therefore always fails with ERR_EMPTY_MIX."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: MenuPeriodReview
    side_effects:
      - "writes popularity_threshold_bps and margin_threshold_cents on the review and mix_pct_bps, cm_per_unit_cents and margin_class on every mix line"
      - "copies each line's margin_class onto its MenuItem and increments each MenuItem.version by 1"
      - "sets status = CLASSIFIED and increments version by 1"

  - method: POST
    path: "/culinary/menu-period-reviews/{period_review_id}/close"
    description: "Closes a CLASSIFIED review, computing the theoretical and actual food cost and the variance under the review's basis. Requires at least one count line and every count line CURRENT."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: MenuPeriodReview
    side_effects:
      - "writes valued_usage_micros on every count line"
      - "writes theoretical_food_cost_cents, actual_food_cost_cents, variance_bps and variance_flag"
      - "sets status = CLOSED, closed_at and increments version by 1"

  - method: POST
    path: "/culinary/lto-campaigns"
    description: "Plans a limited-time offer on a menu item over a closed-open window at a promo price. Requires expected_menu_item_version: several campaigns with disjoint windows are legitimate, so only a stale read is rejected."
    roles: [RecipeDeveloper]
    code: 201
    input: [menu_item_id, window_start, window_end, promo_price_cents, forecast_units, expected_menu_item_version]
    output: LTOCampaign
    side_effects: ["copies region_code from the menu item", "increments MenuItem.open_lto_count and MenuItem.version by 1"]

  - method: GET
    path: "/culinary/lto-campaigns/{lto_campaign_id}"
    description: "Reads one campaign including its costing figures, its actuals and its post-promotion verdict."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: []
    output: LTOCampaign
    side_effects: []

  - method: GET
    path: "/culinary/lto-campaigns"
    description: "Lists campaigns filtered by menu item, region and status, ordered window_start ASC then created_at ASC — the ordering the launch capacity check walks."
    roles: [PlatformAdmin, CulinaryDirector, RecipeDeveloper, CostAnalyst, UnitManager]
    code: 200
    input: ["menu_item_id?", "region_code?", "status?", "limit?", "offset?"]
    output: LTOCampaign[]
    side_effects: []

  - method: POST
    path: "/culinary/lto-campaigns/{lto_campaign_id}/cost"
    description: "Costs a PLANNED campaign against the item's current plate cost per calculations.lto_costing. Requires the item ACTIVE with a FRESH plate cost."
    roles: [CostAnalyst]
    code: 200
    input: []
    output: LTOCampaign
    side_effects: ["writes promo_plate_cost_cents, promo_food_cost_bps and forecast_contribution_cents, sets status = COSTED and increments version by 1"]

  - method: POST
    path: "/culinary/lto-campaigns/{lto_campaign_id}/launch"
    description: "Launches a COSTED campaign before its window closes, subject to the per-region cap on overlapping LAUNCHED campaigns."
    roles: [CulinaryDirector]
    code: 200
    input: []
    output: LTOCampaign
    side_effects: ["sets status = LAUNCHED and increments version by 1", "sets MenuItem.is_lto = true and increments MenuItem.version by 1"]

  - method: POST
    path: "/culinary/lto-campaigns/{lto_campaign_id}/close-review"
    description: "Closes a LAUNCHED campaign once the logical clock reaches window_end and computes the post-promotion profitability and verdict per calculations.lto_post_promo_profitability."
    roles: [CostAnalyst]
    code: 200
    input: [actual_units, actual_gross_sales_cents]
    output: LTOCampaign
    side_effects:
      - "stores the actuals and writes promo_support_cost_cents, promo_contribution_cents, forecast_attainment_bps and verdict"
      - "sets status = CLOSED, reviewed_at and increments version by 1"
      - "sets MenuItem.is_lto = false, decrements MenuItem.open_lto_count and increments MenuItem.version by 1"

  - method: POST
    path: "/culinary/lto-campaigns/{lto_campaign_id}/decide"
    description: "Decides the fate of a CLOSED campaign. RENEW requires a PROFITABLE verdict and mints a successor campaign in the next equal-length window at the same promo price with the achieved units as its forecast. RETIRE mints nothing and suspends the menu item."
    roles: [CulinaryDirector]
    code: 200
    input: [decision]
    output: LTOCampaign
    side_effects:
      - "RENEW: sets status = RENEWED, mints a PLANNED successor campaign and increments MenuItem.open_lto_count and MenuItem.version by 1"
      - "RETIRE: sets status = RETIRED and sets the MenuItem to SUSPENDED with margin_class = UNCLASSIFIED, is_lto = false and version incremented by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (49 codes, one per §1.4 row)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing or empty on any request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not listed on the target endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, unknown enum member, out-of-range integer, malformed instant, limit outside 1..100, negative offset, or a window whose start is not before its end"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "the unit_id in the path or body matches no Unit"
  - id: ERR_INGREDIENT_NOT_FOUND
    http: 404
    condition: "the ingredient_id in the path or body matches no Ingredient"
  - id: ERR_PRICE_FEED_NOT_FOUND
    http: 404
    condition: "the price_feed_id in the path matches no PriceFeed"
  - id: ERR_RECIPE_NOT_FOUND
    http: 404
    condition: "the recipe_id or child_recipe_id in the path or body matches no Recipe"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "the recipe_component_id or target_component_id matches no RecipeComponent"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "the menu_item_id in the path or body matches no MenuItem"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "the proposal_id in the path matches no PriceChangeProposal"
  - id: ERR_SPEC_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "the spec_change_order_id in the path matches no SpecChangeOrder"
  - id: ERR_PERIOD_REVIEW_NOT_FOUND
    http: 404
    condition: "the period_review_id in the path matches no MenuPeriodReview"
  - id: ERR_LTO_NOT_FOUND
    http: 404
    condition: "the lto_campaign_id in the path matches no LTOCampaign"
  - id: ERR_UNIT_SCOPE_VIOLATION
    http: 403
    condition: "a UnitManager writes a count line to a MenuPeriodReview whose unit_id differs from the caller's X-User-ID"
  - id: ERR_STALE_RECIPE_VERSION
    http: 412
    condition: "expected_recipe_version does not match the stored Recipe.version on a component add, a component removal or a spec-change-order creation"
  - id: ERR_STALE_MENU_ITEM_VERSION
    http: 412
    condition: "expected_menu_item_version does not match the stored MenuItem.version on an LTO campaign creation"
  - id: ERR_RECIPE_NOT_MUTABLE
    http: 409
    condition: "a component is added to or removed from a recipe whose status is ACTIVE or RETIRED"
  - id: ERR_RECIPE_INVALID_STATE
    http: 409
    condition: "the recipe is not in the status the operation requires, or a live parent component still consumes a recipe being retired"
  - id: ERR_FEED_ALREADY_PUBLISHED
    http: 409
    condition: "a line is added to, or publication is attempted twice on, a feed that is already PUBLISHED"
  - id: ERR_MENU_ITEM_INVALID_STATE
    http: 409
    condition: "the menu item is not in the status the operation requires, or a DRAFT/ACTIVE menu item still backs a recipe being retired"
  - id: ERR_PROPOSAL_INVALID_STATE
    http: 409
    condition: "the proposal is not in the status the operation requires"
  - id: ERR_SCO_INVALID_STATE
    http: 409
    condition: "the spec change order's approval_status is not the one the operation requires"
  - id: ERR_REVIEW_INVALID_STATE
    http: 409
    condition: "the period review is not in the status the operation requires"
  - id: ERR_LTO_INVALID_STATE
    http: 409
    condition: "the campaign is not in the status the operation requires, its window has already closed at launch time, or RENEW was requested on a campaign whose verdict is UNPROFITABLE"
  - id: ERR_COUNT_SHEET_OUT_OF_DATE
    http: 409
    condition: "a review is closed while at least one of its count lines has sync_state = OUT_OF_DATE"
  - id: ERR_COST_STALE
    http: 409
    condition: "an operation consumes a cost figure that has been invalidated: a STALE recipe cost, a sub-recipe child that is STALE or FRESH under a different basis, or a STALE menu-item plate cost"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caller's X-User-ID equals the submitted_by_user_id of the proposal or spec change order they are approving"
  - id: ERR_COMPONENT_ALREADY_REMOVED
    http: 409
    condition: "the targeted RecipeComponent already has status = REMOVED"
  - id: ERR_PROPAGATION_ALREADY_SYNCED
    http: 409
    condition: "the requested propagation target is already reflected in the order's propagation_status"
  - id: ERR_SUBRECIPE_NOT_ACTIVE
    http: 409
    condition: "a recipe is activated while one of its ACTIVE sub-recipe children is not ACTIVE"
  - id: ERR_INGREDIENT_RETIRED
    http: 422
    condition: "an operation depends on an Ingredient whose status is RETIRED: adding it as a component, activating a recipe that uses it, approving a COMPONENT_ADD for it, publishing a feed that quotes it, or retiring it a second time"
  - id: ERR_ALLERGEN_UNDECLARED
    http: 422
    condition: "a menu item is activated while its declared_allergen_mask omits at least one bit of the backing recipe's rolled-up allergen_mask"
  - id: ERR_NUTRITION_LIMIT_EXCEEDED
    http: 422
    condition: "a kids-menu item is activated while the backing recipe's sodium_mcg_per_portion exceeds KIDS_MENU_SODIUM_CAP_MCG"
  - id: ERR_RECIPE_CYCLE
    http: 422
    condition: "a sub-recipe component would make the recipe graph cyclic, including a recipe referencing itself"
  - id: ERR_RECIPE_DEPTH_EXCEEDED
    http: 422
    condition: "a sub-recipe component would push the owning recipe, or any recipe that transitively contains it, past MAX_RECIPE_DEPTH"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "the submitted Ingredient.sku already exists"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "the submitted Unit.code, Recipe.code or MenuItem.code already exists on another entity of the same type"
  - id: ERR_PROPOSAL_ALREADY_OPEN
    http: 409
    condition: "the menu item already has a proposal in DRAFT, SUBMITTED, REVISION_REQUESTED or APPROVED"
  - id: ERR_EMPTY_MIX
    http: 422
    condition: "classification is attempted on a review with no mix lines, which is every review still in OPEN"
  - id: ERR_EMPTY_COUNT_SHEET
    http: 422
    condition: "a review is closed with no count lines at all"
  - id: ERR_PRICE_CHANGE_COOLING_OFF
    http: 409
    condition: "a proposal's effective_from is less than COOLING_OFF_DAYS whole days after the item's last_price_change_at"
  - id: ERR_LTO_WINDOW_CAPACITY
    http: 409
    condition: "launching would make MAX_CONCURRENT_LTO_PER_REGION + 1 LAUNCHED campaigns overlap in the same region"
  - id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http: 409
    condition: "an approved proposal is applied before its effective_from, or a campaign is close-reviewed before its window_end"
  - id: ERR_PRICE_WINDOW_OVERLAP
    http: 409
    condition: "a published line's half-open window intersects an existing PUBLISHED window for the same ingredient and region; adjacency at a window boundary and truncation of an open-ended predecessor are not intersections"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested logical-clock instant is earlier than the current one"
  - id: ERR_MARKET_CAP_EXCEEDED
    http: 422
    condition: "the proposed price exceeds the effective cap price, which is the market cap widened by CAP_RELIEF_BPS only when the projected food cost computed from the proposed price exceeds the item's target"
  - id: ERR_MARGIN_FLOOR_BREACH
    http: 422
    condition: "the proposed price leaves less than MARGIN_FLOOR_CENTS of contribution over the plate cost"
  - id: ERR_NO_PUBLISHED_PRICE
    http: 422
    condition: "a roll-up finds no usable price for an ingredient component under the requested basis, after the weighted-average fallback to the latest published price has been attempted"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties: the operator who submits a record may
# never approve it, whatever role they hold)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Platform operator. Owns the store registry, the ingredient catalogue's creation surface and the logical clock. Cannot touch recipes, costs, menus or approvals."
    identity: "opaque"
    exclusive_operations:
      - "POST /culinary/_clock/set_current_utc"
      - "POST /culinary/units"
    shared_operations:
      - "POST /culinary/ingredients (shared with RecipeDeveloper)"
      - "every GET endpoint"

  - name: RecipeDeveloper
    description: "Culinary R&D. Authors recipes, their component graphs, menu items, price change proposals, specification change orders and LTO plans. Submits work for approval but can never approve it."
    identity: "opaque"
    exclusive_operations:
      - "POST /culinary/recipes"
      - "POST /culinary/recipes/{recipe_id}/components"
      - "DELETE /culinary/recipe-components/{recipe_component_id}"
      - "POST /culinary/recipes/{recipe_id}/submit-review"
      - "POST /culinary/menu-items"
      - "POST /culinary/price-change-proposals"
      - "PATCH /culinary/price-change-proposals/{proposal_id}"
      - "POST /culinary/price-change-proposals/{proposal_id}/submit"
      - "POST /culinary/spec-change-orders"
      - "POST /culinary/spec-change-orders/{spec_change_order_id}/submit"
      - "POST /culinary/lto-campaigns"
    shared_operations:
      - "POST /culinary/ingredients (shared with PlatformAdmin)"
      - "every GET endpoint"

  - name: CulinaryDirector
    description: "Approval authority. Activates and retires recipes, ingredients and menu items, approves or rejects price change proposals and specification change orders, rolls specification changes back, and launches and decides promotions. Never authors the records it approves — and, by the segregation-of-duties rule, may not approve a record it happened to submit itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /culinary/ingredients/{ingredient_id}/retire"
      - "POST /culinary/recipes/{recipe_id}/activate"
      - "POST /culinary/recipes/{recipe_id}/retire"
      - "POST /culinary/menu-items/{menu_item_id}/activate"
      - "POST /culinary/price-change-proposals/{proposal_id}/request-revision"
      - "POST /culinary/price-change-proposals/{proposal_id}/approve"
      - "POST /culinary/spec-change-orders/{spec_change_order_id}/approve"
      - "POST /culinary/spec-change-orders/{spec_change_order_id}/reject"
      - "POST /culinary/spec-change-orders/{spec_change_order_id}/rollback"
      - "POST /culinary/lto-campaigns/{lto_campaign_id}/launch"
      - "POST /culinary/lto-campaigns/{lto_campaign_id}/decide"
    shared_operations:
      - "every GET endpoint"

  - name: CostAnalyst
    description: "Cost and menu engineering. Loads distributor feeds, runs every roll-up and plate-cost recomputation, applies approved price changes, drains specification propagation, and owns the period review lifecycle and LTO costing and post-promotion review."
    identity: "opaque"
    exclusive_operations:
      - "POST /culinary/price-feeds"
      - "POST /culinary/price-feeds/{id}/lines"
      - "POST /culinary/price-feeds/{price_feed_id}/publish"
      - "POST /culinary/recipes/{recipe_id}/cost-rollup"
      - "POST /culinary/menu-items/{menu_item_id}/plate-cost"
      - "POST /culinary/price-change-proposals/{proposal_id}/apply"
      - "POST /culinary/spec-change-orders/{spec_change_order_id}/propagate"
      - "POST /culinary/menu-period-reviews"
      - "POST /culinary/menu-period-reviews/{id}/mix-lines"
      - "POST /culinary/menu-period-reviews/{period_review_id}/classify"
      - "POST /culinary/menu-period-reviews/{period_review_id}/close"
      - "POST /culinary/lto-campaigns/{lto_campaign_id}/cost"
      - "POST /culinary/lto-campaigns/{lto_campaign_id}/close-review"
    shared_operations:
      - "POST /culinary/menu-period-reviews/{id}/count-lines (shared with UnitManager, without the unit scope restriction)"
      - "every GET endpoint"

  - name: UnitManager
    description: "Store manager. Records physical inventory counts for their own store's period reviews only. X-User-ID is the id of the Unit the manager runs, so the server compares it directly against MenuPeriodReview.unit_id."
    identity: "entity_backed:Unit"
    exclusive_operations: []
    shared_operations:
      - "POST /culinary/menu-period-reviews/{id}/count-lines (shared with CostAnalyst; a UnitManager is additionally restricted to reviews whose unit_id equals X-User-ID)"
      - "every GET endpoint"
