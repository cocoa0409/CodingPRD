              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_bond_b_id: $.data.id }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c3a: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_small_id}", outgoing_fund_id: "${fund_small_id}", incoming_fund_id: "${fund_small_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Supersedes the earlier small-cap draft with a cleaner cost basis and no revenue share.", expected_plan_version: "${plan_v_c3a}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_small2_id: $.data.id }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c3b: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_intl_id}", outgoing_fund_id: "${fund_intl_id}", incoming_fund_id: "${fund_intl_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "International developed sleeve has trailed for three years on a rising expense line.", expected_plan_version: "${plan_v_c3b}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_intl_id: $.data.id }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c3c: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_bond_id}", outgoing_fund_id: "${fund_bond_a_id}", incoming_fund_id: "${fund_bond_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Pure share-class arbitrage on a healthy incumbent: same index, three basis points cheaper.", expected_plan_version: "${plan_v_c3c}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_bond_id: $.data.id }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { draft_count_pre_c3: $.data.draft_proposal_count }
          trigger:
            - *b_finalize_q0
            - call: "GET /governance/fund-replacements?plan_id=${plan_id}&status=BLOCKED&limit=10&offset=0"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "draft_count_pre_c3 == 3: the four proposals created across chain_breach and this setup are ${prop_small_id} (WITHDRAWN by the supersede, out of the counted set), ${prop_small2_id}, ${prop_intl_id} and ${prop_bond_id}"
            - "the finalize returned 200 and hop 3 landed on Plan.at_risk_slot_ratio == 0.4000 with menu_posture RESTRICTED — 2 of the 5 counted slots are AT_RISK, and 0.4000 is >= 0.2500 and < 0.5000"
            - "hop 4 blocked exactly two proposals: FundReplacementProposal.${prop_small2_id}.status == BLOCKED with pre_block_status == DRAFT, and FundReplacementProposal.${prop_intl_id}.status == BLOCKED with pre_block_status == DRAFT"
            - "the status filter held: FundReplacementProposal.${prop_small_id} is still WITHDRAWN with pre_block_status null and superseded_by_proposal_id == ${prop_small2_id} — a terminal proposal on an AT_RISK slot is never dragged into BLOCKED, because §1.3 declares BLOCKED reachable only from DRAFT, UNDER_REVIEW and REVISION_REQUESTED"
            - "the slot filter held: FundReplacementProposal.${prop_bond_id}.status == DRAFT with pre_block_status null, because AssetClassSlot.${slot_bond_id}.status == ACTIVE (BNDIX stayed CLEAR) and the posture is RESTRICTED rather than FROZEN, so the disjunct 'posture == FROZEN OR slot.status == AT_RISK' is false for it"
            - "the ordering held: trigger call 2 returns the two blocked rows ordered by their slots' slot_index ASC — ${prop_small2_id} on slot_index 3 first, then ${prop_intl_id} on slot_index 4 — with total_count 2 and has_more false"
            - "trigger call 3 shows Plan.draft_proposal_count is still 3 after the cascade: BLOCKED is inside the §1.1 counted set {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED}, so a hop that changes three statuses moves the counter by zero — the derived field is a definition, not a running tally"
            - "no hop touched the untouched dimension: Fund.${fund_bond_a_id}.menu_status == ACTIVE and watch_status == CLEAR, and AssetClassSlot.${slot_bond_id}.status_before_last_review is null because hop 2 only snapshots slots it actually moves"

      - name: the_ratio_one_notch_below_the_ladder_halts_the_cascade_at_hop_three_and_the_recompute_path_never_blocks
        claim_type: cascading_side_effects
        grounds:
          - state_machines.QuarterlyReview.PENDING_MINUTES_to_FINALIZED
          - calculations.menu_posture
          - endpoints.POST_governance_plans_menu_posture_recompute
          - endpoints.POST_governance_asset_class_slots_retire
        distinguishing_aspect: "Hop 4's precondition is not 'the posture is restrictive' but 'the posture BECAME FROZEN or RESTRICTED in hop 3 of this finalize'. With one breach in five slots the ratio is 0.2000, hop 3 leaves the posture OPEN and the cascade stops one hop short even though a slot is genuinely AT_RISK. Retiring an unrelated healthy slot then shrinks the denominator to 4 and the standalone recompute endpoint moves the posture to RESTRICTED at exactly 0.2500 — yet that path has no blocking side effect at all, so the plan sits in a RESTRICTED posture with a live DRAFT proposal on an AT_RISK slot. Only a second finalize can block it."
        test_recipe:
          setup:
            - "chain_l3, plus the spare small-cap candidate and a DRAFT proposal on the small-cap slot."
            - "A quarter-0 review scoring all five seated funds with exactly one breach: SMLVX at 40.00 -> WATCH, and LCGRA, BNDIX, INTDX and TIPSX all comfortably CLEAR."
            - "The review is presented into a convened meeting which is then adjourned with approved minutes."
          setup_api_calls:
            - *chain_l3
            - *b_fund_small_b
            - *b_plan_v_read2
            - *b_prop_small
            - *b_review_q0
            - *b_sc_lc
            - *b_review_v1
            - *b_sc_bond
            - *b_review_v2
            - *b_sc_small_breach
            - *b_review_v3
            - *b_sc_intl
            - *b_review_v4
            - *b_sc_tips
            - *b_meet2
            - *b_meet2_convene
            - *b_review_present
            - *b_meet2_adjourn
            - *b_meet2_minutes
          trigger:
            - *b_finalize_q0
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/asset-class-slots/${slot_tips_id}/retire"
              payload: { reason: "TIPS sleeve consolidated into the multi-sector bond mandate" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/fund-replacements/${prop_small_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "the finalize returned 200: hop 0 wrote the scores, hop 1 moved Fund.${fund_small_id}.watch_status CLEAR -> WATCH with watch_additions_count == 1, hop 2 moved AssetClassSlot.${slot_small_id}.status ACTIVE -> AT_RISK with status_before_last_review == ACTIVE"
            - "hop 3 ran but changed nothing: Plan.at_risk_slot_ratio == 0.2000 (1 of 5 counted slots) and menu_posture is still OPEN, because 0.2000 < 0.2500"
            - "hop 4 did not run: FundReplacementProposal.${prop_small_id}.status is still DRAFT with pre_block_status null, even though its slot is AT_RISK — the precondition requires the posture to have MOVED to FROZEN or RESTRICTED in hop 3, and an AT_RISK slot alone is not enough"
            - "trigger call 3 returned 200 and retired a healthy slot: AssetClassSlot.${slot_tips_id}.status == RETIRED, which removes it from the ratio denominator per calculations.menu_posture. Only the menu dimension of its fund moved — Fund.${fund_tips_id}.menu_status ACTIVE -> PENDING_REMOVAL while watch_status is untouched at CLEAR — and the capacity triple became occupied 4 / reserved 0 / available 2"
            - "retire recomputes the posture inline, so it is trigger call 3 and not the explicit recompute that flips it: the AssetClassSlot returned by call 3 is accompanied by Plan.at_risk_slot_ratio == 0.2500 (1 of the 4 remaining counted slots) and menu_posture OPEN -> RESTRICTED, the inclusive boundary"
            - "trigger call 4, the standalone recompute, returned 200 and is idempotent: at_risk_slot_ratio is still 0.2500 and menu_posture still RESTRICTED, and the only thing it changed is Plan.version"
            - "trigger call 5 shows the asymmetry: FundReplacementProposal.${prop_small_id}.status is STILL DRAFT under a RESTRICTED posture on an AT_RISK slot. The recompute endpoint's only proposal-facing side effect is the release of BLOCKED proposals when the posture relaxes to OPEN; it has no blocking arm, so the transition into BLOCKED is reachable exclusively through quarterly-review finalize hop 4"
            - "the release arm was a no-op here for the right reason: there was no BLOCKED proposal to restore, so no pre_block_status was read and Plan.draft_proposal_count is still 1"
            - "SPEC NOTE — this pair of results is a reachability constraint on the whole BLOCKED subgraph: a plan that never finalizes a review while a live proposal exists can never see a BLOCKED proposal, no matter how impaired its menu becomes. Any test that wants a BLOCKED proposal must sequence proposal-create BEFORE review-finalize, as the previous instance does."

      - name: the_same_two_scorecard_rows_cure_under_one_variant_and_escalate_under_the_other
        claim_type: dual_variant_calculation
        grounds:
          - calculations.fund_composite_score
          - calculations.watch_recommendation
