  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_window_inclusive_boundary
        grounds:
          - state_machines.Invoice.status.PAID_to_REFUNDED
          - validations[priority=9]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Temporal boundary on the refund endpoint: refund allowed when clock_now <= paid_at +
          refund_window_days (inclusive). Paid 2026-03-01, window 14 -> deadline 2026-03-15T00:00:00Z;
          at exactly the deadline the refund SUCCEEDS. Metric: temporal window, via POST /invoices/{id}/refund.
        test_recipe:
          setup:
            - "Clock 2026-03-01; ONE_TIME 20000 enrollment paid 2026-03-01; refund_window 14; clock set to exactly 2026-03-15T00:00:00Z"
          setup_api_calls:
