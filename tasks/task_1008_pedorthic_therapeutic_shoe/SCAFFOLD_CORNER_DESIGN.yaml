scaffold_corner_design:
  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: create_customer_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with full_name + date_of_birth returns 201, a server-minted id, version==1, and is_pediatric computed (adult DOB -> false)."
        test_recipe:
          setup: ["Empty DB, clock default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Al Adult", date_of_birth: "1980-01-01" }
              as: StoreManager
              captures: { cust_id: $.data.id }
          assert:
            - "response code == 201"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.is_pediatric == false"

      - name: customer_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Customer", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: create_product_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Product", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products missing base_price_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "No Price", brand: "X", category: "REGULAR" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_product_invalid_category_enum_returns_422
        claim_type: Type Constraints
        grounds: ["entities.Product.fields.category", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products with category outside the enum returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Bad Cat", brand: "X", category: "SANDAL", base_price_cents: 5000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: inventory_quantity_available_is_computed
        claim_type: Computed Fields
        grounds: [entities.InventoryItem.fields.quantity_available]
        distinguishing_aspect: "A fresh inventory item with on_hand 4 and no reservations reports quantity_available == 4 (input ignored / derived)."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Avail Shoe", brand: "X", category: "REGULAR", base_price_cents: 5000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "AV", quantity_on_hand: 4 }
              as: StoreManager
              captures: { inv_id: $.data.id }
          assert:
            - "InventoryItem.${inv_id}.quantity_available == 4"
            - "InventoryItem.${inv_id}.quantity_reserved == 0"
            - "InventoryItem.${inv_id}.status == AVAILABLE"

      - name: pediatric_recommended_mondo_computed
        claim_type: Computed Fields
        grounds: [entities.FootMeasurement.fields.recommended_mondo_mm, calculations.pediatric_recommended_mondo]
        distinguishing_aspect: "Pediatric customer (age<13), lengths 176/178mm -> max 178 + 14 = 192 -> ceil(192/5)*5 = 195mm."
        test_recipe:
          setup: ["Clock 2026-07-01; a pediatric customer born 2016-01-01 (age 10)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Kid K", date_of_birth: "2016-01-01" }
              as: StoreManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/measurements"
              payload: { foot_length_mm_left: 176, foot_length_mm_right: 178, foot_width_mm_left: 70, foot_width_mm_right: 71 }
              as: Fitter
              captures: { meas_id: $.data.id }
          assert:
            - "FootMeasurement.${meas_id}.recommended_mondo_mm == 195"
            - "FootMeasurement.${meas_id}.length_change_mm_from_prior == 0"

      - name: measurement_growth_delta_from_prior
        claim_type: Computed Fields
        grounds: [entities.FootMeasurement.fields.length_change_mm_from_prior]
        distinguishing_aspect: "Second measurement max length 190 minus first max 178 -> length_change_mm_from_prior == 12."
        test_recipe:
          setup: ["Clock 2026-07-01; a pediatric customer with one prior measurement (max 178)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Grow G", date_of_birth: "2015-01-01" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurements"
              payload: { foot_length_mm_left: 175, foot_length_mm_right: 178, foot_width_mm_left: 70, foot_width_mm_right: 71 }
              as: Fitter
          trigger:
            - call: "POST /customers/${cust_id}/measurements"
              payload: { foot_length_mm_left: 188, foot_length_mm_right: 190, foot_width_mm_left: 72, foot_width_mm_right: 73 }
              as: Fitter
              captures: { meas2_id: $.data.id }
          assert:
            - "FootMeasurement.${meas2_id}.length_change_mm_from_prior == 12"

  # ---------------- State machines ----------------
  - section: state_machines
    instances:
      - name: appointment_check_in_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Appointment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking in an appointment already COMPLETED returns ERR_INVALID_STATE (409); terminal lockdown."
        test_recipe:
          setup: ["A COMPLETED appointment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Ap Cust", date_of_birth: "1980-02-02" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Ap Fit" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${f_id}", appointment_type: "FITTING", start_time: "2026-07-03T09:00:00Z", end_time: "2026-07-03T09:30:00Z" }
              as: Fitter
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/complete"
              payload: { recommended_mondo_mm: 260 }
              as: Fitter
          trigger:
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Fitter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: special_order_receive_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SpecialOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Receiving a DRAFT (not yet ORDERED) special order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT special order."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "SO Shoe", brand: "X", category: "REGULAR", base_price_cents: 7000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "SO Cust", date_of_birth: "1981-01-01" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", requested_size: 10.0, requested_width: "D", deposit_cents: 2000 }
              as: StoreManager
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/receive"
              payload: { lot_number: "X1", quantity_on_hand: 1 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: refund_on_exchange_type_returns_mismatch
        claim_type: Invalid Transitions
        grounds: ["state_machines.ReturnRequest.APPROVED_to_REFUNDED", "errors[ERR_EXCHANGE_TYPE_MISMATCH]"]
        distinguishing_aspect: "Calling refund on an APPROVED return whose return_type==EXCHANGE returns ERR_EXCHANGE_TYPE_MISMATCH (409)."
        test_recipe:
          setup: ["A fulfilled one-line sale; an EXCHANGE return approved on that line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Ex Shoe", brand: "X", category: "REGULAR", base_price_cents: 9000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "E1", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ex Cust", date_of_birth: "1979-09-09" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Ex Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
              captures: { line_id: $.data.id }
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /returns"
              payload: { sale_id: "${sale_id}", sale_line_id: "${line_id}", return_type: "EXCHANGE" }
              as: StoreManager
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${ret_id}/refund"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EXCHANGE_TYPE_MISMATCH"

      - name: appointment_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.Appointment, entities.Appointment.fields.status]
        distinguishing_aspect: "A newly booked appointment starts in status SCHEDULED."
        test_recipe:
          setup: ["A customer and a fitter."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Init Cust", date_of_birth: "1982-02-02" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Init Fit" }
              as: StoreManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${f_id}", appointment_type: "FITTING", start_time: "2026-07-04T09:00:00Z", end_time: "2026-07-04T09:30:00Z" }
              as: Fitter
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.status == SCHEDULED"

      - name: exchange_swaps_inventory_and_computes_price_difference
        claim_type: Side Effect Execution
        grounds: [state_machines.ReturnRequest.APPROVED_to_EXCHANGED, entities.ReturnRequest.fields.price_difference_cents]
        distinguishing_aspect: "Exchanging a 9000 line for a 11000 replacement sets price_difference_cents == 2000, flips SaleLine to EXCHANGED, decrements the replacement's on_hand 2->1."
        test_recipe:
          setup: ["A fulfilled one-line sale (original price 9000) approved for EXCHANGE; a replacement inventory item (product price 11000, on_hand 2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Orig 9000", brand: "X", category: "REGULAR", base_price_cents: 9000 }
              as: StoreManager
              captures: { prodO_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Repl 11000", brand: "X", category: "REGULAR", base_price_cents: 11000 }
              as: StoreManager
              captures: { prodR_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodO_id}", size: 9.0, width: "D", lot_number: "O1", quantity_on_hand: 3 }
              as: StoreManager
              captures: { invO_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodR_id}", size: 9.5, width: "E", lot_number: "R1", quantity_on_hand: 2 }
              as: StoreManager
              captures: { invR_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Sw Cust", date_of_birth: "1977-07-07" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Sw Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${invO_id}", quantity: 1 }
              as: Fitter
              captures: { line_id: $.data.id }
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /returns"
              payload: { sale_id: "${sale_id}", sale_line_id: "${line_id}", return_type: "EXCHANGE" }
              as: StoreManager
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${ret_id}/exchange"
              payload: { replacement_inventory_item_id: "${invR_id}" }
              as: StoreManager
          assert:
            - "ReturnRequest.${ret_id}.price_difference_cents == 2000"
            - "SaleLine.${line_id}.status == EXCHANGED"
            - "InventoryItem.${invR_id}.quantity_on_hand == 1"

      - name: certification_visit_expired_returns_422
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=15]", "errors[ERR_CERTIFICATION_VISIT_EXPIRED]"]
        distinguishing_aspect: "in_person_visit_date 2025-11-15 is more than 6 calendar months before clock 2026-07-01 -> ERR_CERTIFICATION_VISIT_EXPIRED (422)."
        test_recipe:
          setup: ["Clock 2026-07-01; a Medicare customer at version 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Exp Cust", date_of_birth: "1945-05-05", medicare_beneficiary_id: "8OP1AN2TR40" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
          trigger:
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "1010101010", prescribing_practitioner_npi: "2020202020", statement_date: "2026-06-01", in_person_visit_date: "2025-11-15", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CERTIFICATION_VISIT_EXPIRED"

      - name: appointment_invalid_time_range_returns_422
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "Appointment with end_time <= start_time returns ERR_INVALID_TIME_RANGE (422)."
        test_recipe:
          setup: ["A customer and fitter."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "Tr Cust", date_of_birth: "1983-03-03" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Tr Fit" }
              as: StoreManager
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${f_id}", appointment_type: "FITTING", start_time: "2026-07-05T11:00:00Z", end_time: "2026-07-05T10:00:00Z" }
              as: Fitter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TIME_RANGE"

      - name: fulfill_quarantined_item_returns_item_quarantined
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=11]", "errors[ERR_ITEM_QUARANTINED]", "state_machines.Sale.fulfillment_PENDING_to_FULFILLED"]
        distinguishing_aspect: "Fulfilling a sale whose line item was QUARANTINED by an issued recall (after the line was added) returns ERR_ITEM_QUARANTINED (409)."
        test_recipe:
          setup: ["A PENDING sale with one ACTIVE line on item X; then a recall on X's product is issued (X -> QUARANTINED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Q Shoe", brand: "X", category: "THERAPEUTIC", base_price_cents: 8000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "QQ", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Q Cust", date_of_birth: "1974-04-04" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Q Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
            - call: "POST /recalls"
              payload: { product_id: "${prod_id}", reason: "sole separation" }
              as: StoreManager
              captures: { recall_id: $.data.id }
            - call: "POST /recalls/${recall_id}/issue"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ITEM_QUARANTINED"

      - name: special_order_place_recalled_product_returns_item_quarantined
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SpecialOrder.DRAFT_to_ORDERED", "errors[ERR_ITEM_QUARANTINED]"]
        distinguishing_aspect: "Placing a DRAFT special order whose product is_recalled==true returns ERR_ITEM_QUARANTINED (409)."
        test_recipe:
          setup: ["A DRAFT special order for a product that has an ISSUED recall."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "RC Shoe", brand: "X", category: "REGULAR", base_price_cents: 6000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "RC Cust", date_of_birth: "1985-05-05" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", requested_size: 9.0, requested_width: "D", deposit_cents: 1000 }
              as: StoreManager
              captures: { so_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod_id}", reason: "recall" }
              as: StoreManager
              captures: { recall_id: $.data.id }
            - call: "POST /recalls/${recall_id}/issue"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /special-orders/${so_id}/place"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ITEM_QUARANTINED"

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: return_restocking_fee_outside_window
        claim_type: Constants Applied
        grounds: [calculations.return_refund_amount, entities.ReturnRequest.fields.restocking_fee_cents]
        distinguishing_aspect: "A 10000 line refunded 40 days after sale (clock advanced past RETURN_WINDOW_DAYS=30) applies restocking_fee = round(10000*0.15)=1500 -> refund 8500."
        test_recipe:
          setup: ["Sale created at 2026-07-01, fulfilled; clock advanced to 2026-08-10 (40 days); RETURN on the 10000 line approved."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Fee Shoe", brand: "X", category: "REGULAR", base_price_cents: 10000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "F1", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Fee Cust", date_of_birth: "1970-10-10" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Fee Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
