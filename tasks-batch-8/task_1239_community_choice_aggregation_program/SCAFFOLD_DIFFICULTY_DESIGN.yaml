            - call: "POST /cca/rec-retirements"
              payload: { compliance_filing_id: "${filing_f1}", supply_contract_id: "${contract_c1}", retired_mwh: 100, retirement_serial: "WREGIS-0003" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /cca/compliance-filings/${filing_f0}/prepare"
              payload: {}
              as: ComplianceOfficer
              captures: { err_f0: $.data.error_id }
            - call: "POST /cca/compliance-filings/${filing_f1}/prepare"
