  - rule_id: boundary_precision_check
    instances:
      - name: container_payload_exact_max_allowed
        grounds:
          - validations[priority=34]
          - calculations.freight_classification
          - entities.Container.fields.max_payload_kg
        distinguishing_aspect: |
          Metric = payload kilograms on POST load-crate: a 40FT container with
          dunnage 10000 has exactly 16780 kg headroom; a crate with gross exactly
          16780.0 kg is ACCEPTED (inclusive <=), while adding a further 98.6 kg
          crate crosses to 26878.6 > 26780 and is REJECTED — exact-boundary
          precision, not approximate.
        test_recipe:
          setup:
            - "Two sealed crates: big crate from item 200x200x200 / 16229.2 kg (bf 306, tare 550.8, gross exactly 16780.0); small crate from item 50x50x50 / 50 kg (bf 27, tare 48.6, gross 98.6); 40FT container with dunnage 10000 (max 26780)"
