              as: AccessoryTechnician
              captures: { awo_id: $.data.id }
            - call: "POST /vpc/accessory-work-orders/${awo_id}/kit"
              payload: {}
              as: AccessoryTechnician
              as_user_id: "u-tech-1"
            - call: "POST /vpc/accessory-work-orders/${awo_id}/install"
              payload: {}
              as: AccessoryTechnician
              as_user_id: "u-tech-1"
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: QualityInspector
              captures: { status_after_install: $.data.processing_status, damage_after_install: $.data.damage_status }
            - call: "POST /vpc/vehicles/${veh_id}/repair-orders"
              payload: { description: "Panel and glass", estimate_cents: 60000 }
              as: DamageSurveyor
              captures: { ro_id: $.data.id }
            - call: "POST /vpc/repair-orders/${ro_id}/complete"
              payload: { actual_cost_cents: 58000 }
              as: DamageSurveyor
            - call: "GET /vpc/vehicles/${veh_id}"
              payload: {}
              as: QualityInspector
              captures: { status_after_repair: $.data.processing_status, damage_after_repair: $.data.damage_status }
            - call: "POST /vpc/vehicles/${veh_id}/quality-inspections"
              payload: {}
              as: QualityInspector
              as_user_id: "u-qc-1"
