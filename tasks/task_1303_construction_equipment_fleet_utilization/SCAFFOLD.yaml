  - method: POST
    path: "/fleet/damage-reports/{id}/confirm"
    description: "Confirm an ASSESSED report; posts chargeback to project ledger (budget-gated)"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status -> CONFIRMED", "confirmed_charge_cents = assessed_charge_cents", "project.billed_total_cents += confirmed_charge_cents"]

  - method: POST
    path: "/fleet/damage-reports/{id}/void"
    description: "Void a FILED or ASSESSED report (never posts to ledger)"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: DamageReport
    side_effects: ["status -> VOIDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource does not exist" }
  - { id: ERR_REF_NOT_FOUND, http: 422, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, bad date, out-of-range number, or structural constraint violated" }
  - { id: ERR_OWNERSHIP_FIELD_MISMATCH, http: 422, condition: "ownership==OWNED requires acquisition_cost_cents>0 and useful_life_months>0; ownership==RENTED requires acquisition_cost_cents==0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_EQUIPMENT_NOT_AVAILABLE, http: 409, condition: "Equipment availability_status does not permit the operation" }
  - { id: ERR_SERVICE_DUE, http: 409, condition: "Equipment maintenance_status is SERVICE_DUE or IN_SERVICE; cannot commit unit to a project" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Half-open assignment window collides with a non-terminal assignment on the same equipment" }
  - { id: ERR_TRANSPORT_CONFLICT, http: 409, condition: "Buffered closed transport interval collides with another job on the lowboy, or equipment not physically at from_project_id" }
  - { id: ERR_PROJECT_MISMATCH, http: 422, condition: "Damage report project_id != equipment.current_project_id at filing" }
  - { id: ERR_NOT_ASSIGNED_MECHANIC, http: 403, condition: "Acting mechanic (X-User-ID) is not the work order's dispatched mechanic" }
  - { id: ERR_MECHANIC_UNAVAILABLE, http: 409, condition: "Mechanic not AVAILABLE or already at 2 active work orders" }
  - { id: ERR_RENTED_UNIT, http: 422, condition: "Dispose requires ownership == OWNED" }
  - { id: ERR_OPEN_WORK, http: 409, condition: "Dispose blocked by open work order, planned transport, or unresolved damage report" }
  - { id: ERR_TRANSPORT_PENDING, http: 409, condition: "Assignment close blocked by PLANNED/EN_ROUTE transport referencing it" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Project budget guard: billed_total_cents + charge would exceed equipment_budget_cents (inclusive cap allows exact equality)" }
  - { id: ERR_PROJECT_NOT_OPEN, http: 409, condition: "Project not OPEN for activation or damage confirm" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_READING, http: 409, condition: "An ACCEPTED reading already exists for (equipment_id, recorded_date)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Equipment division administrator: owns classes, equipment registry, projects, assignments, work-order lifecycle gating, damage assessment, telematics ingest, disposal"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/equipment-classes"
      - "POST /fleet/equipment, POST /fleet/equipment/{id}/mark-down, POST /fleet/equipment/{id}/dispose"
      - "POST /fleet/projects and project lifecycle actions"
      - "POST /fleet/assignments and assignment activate/close/cancel"
      - "POST /fleet/work-orders, dispatch, cancel"
      - "POST /fleet/mechanics, off-duty/on-duty"
      - "POST /fleet/equipment/{id}/readings, POST /fleet/readings/{id}/void"
      - "POST /fleet/damage-reports, assess, reassess, confirm, void"
      - "POST /fleet/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
  - name: ProjectManager
    description: "Project-side manager: views fleet state, disputes damage charges against own projects"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/damage-reports/{id}/dispute"
    shared_operations:
      - "GET endpoints across all resources"
      - "GET /fleet/equipment/{id}/redeployment-score, GET /fleet/equipment/{id}/fuel-summary"
  - name: Mechanic
    description: "Field mechanic: starts and completes dispatched work orders (identity-backed by Mechanic entity)"
    identity: "entity_backed:Mechanic"
    exclusive_operations:
      - "POST /fleet/work-orders/{id}/start"
      - "POST /fleet/work-orders/{id}/complete"
    shared_operations:
      - "GET endpoints across all resources"
  - name: Dispatcher
    description: "Transport coordinator: owns lowboys and haul scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/lowboys, out-of-service, return-to-service"
      - "POST /fleet/transport-jobs, depart, deliver, cancel"
    shared_operations:
      - "GET endpoints across all resources"
