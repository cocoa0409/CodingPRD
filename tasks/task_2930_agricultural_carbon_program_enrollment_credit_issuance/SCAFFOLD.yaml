# Task 2930 — Agricultural Carbon Program Enrollment & Credit Issuance
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  2930. Agricultural Carbon Program Enrollment & Credit Issuance (agricultural
  carbon program administrator): grower enrollment with field boundary mapping,
  historical practice documentation and additionality screening, eligible
  practice definitions across cover cropping, reduced tillage and nutrient
  management with adoption verification, baseline establishment through
  historical data and modeling with uncertainty deductions, data collection from
  farm records, equipment telemetry and remote sensing with quality control,
  quantification through modeling or measurement with third-party verification,
  credit issuance, registry listing and buffer pool contributions for reversal
  risk, grower payment structure with per-acre or per-credit models and
  multi-year commitments, permanence obligations, reversal handling and contract
  exit provisions

domain_name: agricultural-carbon-program
# Every business path is a top-level collection under "/" (flat/graph topology,
# no single owning aggregate root); `/` keeps §1.5 paths and §1.1 collection
# segments in one namespace.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Growers/Fields/Standards/VerificationBodies are peers joined by FK edges;
  # Enrollment is a 3-way junction (Field x PracticeStandard x Grower);
  # CreditBatch.supersedes_batch_id is self-referential; ReversalEvent and
  # GrowerPayment reference across the Enrollment/CreditBatch aggregate boundary.

  state_machine_shape: parallel
  # DataPacket carries two independent axes (qc_status x completeness_status) and
  # CreditBatch carries two more (issuance_status x registry_status). Enrollment
  # is cyclic (SCREENING <-> INFO_REQUESTED, ACTIVE <-> SUSPENDED),
  # QuantificationRun is cyclic (REJECTED -> DRAFT) and Verification is cyclic
  # (QUALIFIED -> PENDING); Verification and decide-exit are branching.

  relationship_patterns:
    - one_to_many
    - many_to_many          # Field <-> PracticeStandard through Enrollment
    - self_referential      # CreditBatch.supersedes_batch_id -> CreditBatch.id
    - cross_aggregate       # GrowerPayment/ReversalEvent span Enrollment + CreditBatch

  role_model: segregation_of_duties
  # The ProgramAdmin who screened an Enrollment may not approve its Baseline;
  # the ProgramAdmin who reported a ReversalEvent may not assess it. Verifier
  # (third party) and RegistryOfficer own disjoint terminal steps.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities / 69 endpoints / 53 error codes / 7 calculations (4 with
  # variants) / 8 state machines / 3 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the farm operator
        constraints: non-empty, max 200 chars
      - name: operator_type
        type: enum
        source: input
        description: legal form of the operation
        constraints: "one of {SOLE_PROPRIETOR, LLC, PARTNERSHIP, CORPORATION, TRUST}"
      - name: tax_id
        type: string
        source: input
        description: taxpayer identifier used on payment remittances
        constraints: non-empty, unique across Growers
      - name: mailing_state
        type: string
        source: input
        description: two-letter US state code for correspondence
        constraints: exactly 2 upper-case letters
      - name: status
        type: enum
        source: system
        description: program standing of the grower; SUSPENDED blocks all grower-initiated writes
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        description: free-text reason recorded by the last suspend action; null while ACTIVE
        default: null
      - name: total_enrolled_acres
        type: number
        source: computed
        description: "cross-entity aggregate: sum of Field.mapped_acres over this grower's Fields whose status IN {ENROLLED, SUSPENDED}; 2 decimals"
        default: 0.00
      - name: lifetime_credits_issued
        type: integer
        source: computed
        description: running total of CreditBatch.issued_credits over every batch ever issued to this grower, including batches later CANCELLED
        default: 0
      - name: net_paid_cents
        type: integer
        source: computed
        description: sum of GrowerPayment.net_amount_cents over this grower's payments whose status == PAID
        default: 0
      - name: outstanding_clawback_cents
        type: integer
        source: computed
        description: sum of ReversalEvent.grower_clawback_cents over this grower's reversal events whose status IN {ASSESSED, RESOLVED}; this is the assessed unbacked liability and is booked once per reversal event, never once per clawed-back payment
        default: 0
      - name: reversal_count
        type: integer
        source: computed
        description: count of ReversalEvent rows for this grower's enrollments whose status IN {ASSESSED, RESOLVED}
        default: 0

  - name: Field
    parent: Grower
    common_fields: true
    fields:
      - name: grower_id
        type: string
        source: input
        description: FK -> Grower.id; owning grower, taken from the path on create
      - name: field_name
        type: string
        source: input
        description: grower-assigned field label
        constraints: non-empty, unique per grower_id
      - name: boundary_min_x
        type: integer
        source: input
        description: west edge of the mapped boundary rectangle, in program grid units (metres)
        constraints: 0 <= boundary_min_x < boundary_max_x
      - name: boundary_min_y
        type: integer
        source: input
        description: south edge of the mapped boundary rectangle, in program grid units (metres)
        constraints: 0 <= boundary_min_y < boundary_max_y
      - name: boundary_max_x
        type: integer
        source: input
        description: east edge of the mapped boundary rectangle, in program grid units (metres)
        constraints: strictly greater than boundary_min_x
      - name: boundary_max_y
        type: integer
        source: input
        description: north edge of the mapped boundary rectangle, in program grid units (metres)
        constraints: strictly greater than boundary_min_y
      - name: gross_acres
        type: number
        source: input
        description: grower-declared gross acreage from the farm plan, recorded for reconciliation against mapped_acres
        constraints: "> 0"
      - name: mapped_acres
        type: number
        source: computed
        description: "acreage derived from the boundary rectangle by calculations.field_mapped_acres; 2 decimals"
      - name: soil_group
        type: enum
        source: input
        description: dominant soil group, drives the modeled baseline soil factor
        constraints: "one of {LOAM, CLAY, SAND}"
      - name: county_code
        type: string
        source: input
        description: county identifier used for registry listing metadata
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: mapping/enrollment lifecycle of the field
        default: DRAFT
        constraints: "one of {DRAFT, MAPPED, ENROLLED, SUSPENDED}"
      - name: surveyor_reference
        type: string
        source: system
        description: survey document reference captured when the boundary is confirmed; null while DRAFT
        default: null

  - name: PracticeStandard
    parent: null
    common_fields: true
    fields:
      - name: practice_code
        type: enum
        source: input
        description: eligible practice this standard governs
        constraints: "one of {COVER_CROP, REDUCED_TILLAGE, NUTRIENT_MANAGEMENT}"
      - name: standard_version
        type: integer
        source: input
        description: methodology version number; pinned onto Enrollment at creation
        constraints: ">= 1, unique per practice_code"
      - name: additionality_lookback_years
        type: integer
        source: input
        description: number of crop years before start_crop_year examined for prior adoption
        constraints: 3..10
      - name: max_prior_adoption_pct
        type: number
        source: input
        description: inclusive ceiling on prior_adoption_pct for the enrollment to remain additional
        constraints: 0..100, 2 decimals
      - name: min_documented_years
        type: integer
        source: input
        description: minimum count of distinct documented crop years in the lookback window
        constraints: ">= 1"
      - name: min_adoption_years
        type: integer
        source: input
        description: minimum Enrollment.commitment_years accepted for this practice
        constraints: ">= 1"
      - name: uncertainty_base_pct
        type: number
        source: input
        description: base uncertainty percentage before the per-year data reduction
        constraints: 0..100, 2 decimals
      - name: sequestration_rate_per_acre
        type: number
        source: input
        description: modelled removals in tCO2e per acre per crop year, used by the MODEL quantification variant
        constraints: "> 0, 4 decimals"
      - name: modeled_baseline_rate_per_acre
        type: number
        source: input
        description: modelled counterfactual emissions in tCO2e per acre, used by the MODELED baseline variant
        constraints: "> 0, 4 decimals"
      - name: buffer_base_pct
        type: number
        source: input
        description: base buffer-pool contribution percentage before risk adders
        constraints: 0..25, 2 decimals
      - name: telemetry_required
        type: boolean
        source: input
        description: when true, quantification requires at least one PASSED EQUIPMENT_TELEMETRY data packet and additionality applies the telemetry gap penalty
        default: false
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) from which this standard may be pinned
      - name: status
        type: enum
        source: system
        description: availability of the standard for new enrollments
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: PracticeHistory
    parent: Field
    common_fields: false
    fields:
      - name: field_id
        type: string
        source: input
        description: FK -> Field.id; field this historical crop-year record describes, taken from the path
      - name: crop_year
        type: integer
        source: input
        description: calendar crop year the record covers
        constraints: 2000..2100
      - name: practice_code
        type: enum
        source: input
        description: practice the record documents
        constraints: "one of {COVER_CROP, REDUCED_TILLAGE, NUTRIENT_MANAGEMENT}"
      - name: adopted
        type: boolean
        source: input
        description: whether the practice was in place on this field that crop year
      - name: evidence_source
        type: enum
        source: input
        description: provenance of the documentation; drives the additionality weight and the baseline qualifying filter
        constraints: "one of {FARM_RECORD, EQUIPMENT_TELEMETRY, REMOTE_SENSING, ATTESTATION}"
      - name: acres
        type: number
        source: input
        description: acres under the practice that crop year; 0 when adopted is false
        constraints: ">= 0, 2 decimals"
      - name: observed_emissions_per_acre
        type: number
        source: input
        description: measured or recorded counterfactual emissions in tCO2e per acre for that crop year
        constraints: ">= 0, 4 decimals"

  - name: Enrollment
    parent: Grower
    common_fields: true
    fields:
      - name: grower_id
        type: string
        source: computed
        description: FK -> Grower.id; derived from the referenced Field's grower_id
      - name: field_id
        type: string
        source: input
        description: FK -> Field.id; field being enrolled, must be status == MAPPED at creation
      - name: practice_standard_id
        type: string
        source: input
        description: FK -> PracticeStandard.id; methodology pinned for the whole commitment
      - name: practice_code
        type: enum
        source: computed
        description: copied from PracticeStandard.practice_code at creation
        constraints: "one of {COVER_CROP, REDUCED_TILLAGE, NUTRIENT_MANAGEMENT}"
      - name: pinned_standard_version
        type: integer
        source: computed
        description: copied from PracticeStandard.standard_version at creation; later standard rows never change this enrollment
      - name: commitment_years
        type: integer
        source: input
        description: length of the practice commitment in crop years
        constraints: ">= PracticeStandard.min_adoption_years, <= 12"
      - name: start_crop_year
        type: integer
        source: input
        description: first crop year of the commitment
        constraints: "must equal current_crop_year or current_crop_year + 1"
      - name: enrolled_acres
        type: number
        source: input
        description: acres committed under the practice; payable base for the PER_ACRE model
        constraints: "> 0, <= Field.mapped_acres, 2 decimals"
      - name: payment_model
        type: enum
        source: input
        description: how the grower is compensated
        constraints: "one of {PER_ACRE, PER_CREDIT}"
      - name: per_acre_rate_cents
        type: number
        source: input
        description: cents per payable acre before band multipliers; required when payment_model == PER_ACRE, must be omitted otherwise
        default: null
        constraints: "> 0, 2 decimals"
      - name: per_credit_share_pct
        type: number
        source: input
        description: grower share of credit revenue in percent; required when payment_model == PER_CREDIT, must be omitted otherwise
        default: null
        constraints: 0..100, 2 decimals
      - name: prior_adoption_pct
        type: number
        source: computed
        description: "weighted prior adoption from calculations.additionality_screening; recomputed on every submit/resubmit; 2 decimals"
        default: null
      - name: additionality_score
        type: number
        source: computed
        description: "0..100 screening score from calculations.additionality_screening; recomputed on every submit/resubmit"
        default: null
      - name: documented_years
        type: integer
        source: computed
        description: count of distinct crop years inside the lookback window that carry at least one PracticeHistory row for this field and practice_code
        default: null
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SCREENING, INFO_REQUESTED, ACCEPTED, REJECTED, ACTIVE, SUSPENDED, EXIT_REQUESTED, EXITED, TERMINATED}"
      - name: permanence_status
        type: enum
        source: system
        description: permanence obligation standing; independent of status, flips to BREACHED when a CreditBatch of this enrollment is registry-suspended
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_COMPLIANCE, BREACHED}"
      - name: screening_decision_admin_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who screened the enrollment; segregation-of-duties input for baseline approval
        default: null
      - name: baseline_approval_admin_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who approved the governing Baseline
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded by a REJECT screening decision or a denied exit
        default: null
      - name: missing_items
        type: array
        source: system
        description: list of documentation item labels recorded by the last request-info call
        default: null
      - name: exit_reason
        type: enum
        source: system
        description: reason submitted with the exit request
        default: null
        constraints: "one of {VOLUNTARY, LAND_SALE, FORCE_MAJEURE}"
      - name: requested_exit_year
        type: integer
        source: system
        description: crop year from which the grower asked to exit
        default: null
      - name: exit_fee_cents
        type: integer
        source: computed
        description: "early-termination fee from calculations.contract_exit_fee; 0 when the commitment was fully served or the reason is FORCE_MAJEURE"
        default: null
      - name: terminated_effective_year
        type: integer
        source: system
        description: crop year the termination took effect; seeds the practice cooldown window for later enrollments on the same field and practice
        default: null
      - name: accrued_payment_cents
        type: integer
        source: computed
        description: sum of GrowerPayment.net_amount_cents for this enrollment whose status IN {ACCRUED, PAID}
        default: 0
      - name: credits_issued_total
        type: integer
        source: computed
        description: sum of CreditBatch.issued_credits for this enrollment over batches whose issuance_status == ISSUED
        default: 0

  - name: Baseline
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; enrollment this baseline quantifies, taken from the path
      - name: method
        type: enum
        source: input
        description: baseline establishment approach
        constraints: "one of {HISTORICAL_DATA, MODELED}"
      - name: qualifying_years
        type: integer
        source: computed
        description: count of distinct crop years in the lookback window holding at least one PracticeHistory row whose evidence_source IN {FARM_RECORD, EQUIPMENT_TELEMETRY}
      - name: historical_mean_rate
        type: number
        source: computed
        description: mean observed_emissions_per_acre over qualifying rows, 4 decimals; null when method == MODELED
        default: null
      - name: baseline_emissions_t
        type: number
        source: computed
        description: "counterfactual emissions in tCO2e from calculations.baseline_establishment; 3 decimals"
      - name: uncertainty_pct
        type: number
        source: computed
        description: "uncertainty deduction percentage from calculations.baseline_establishment; 2 decimals"
      - name: status
        type: enum
        source: system
        description: baseline review lifecycle
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, REJECTED, SUPERSEDED}"
      - name: approved_by_admin_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who approved this baseline
        default: null
      - name: rejection_note
        type: string
        source: system
        description: note recorded when the baseline is rejected
        default: null

  - name: DataPacket
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; enrollment the observation belongs to, taken from the path
      - name: crop_year
        type: integer
        source: input
        description: crop year the observation covers
        constraints: 2000..2100
      - name: source
        type: enum
        source: input
        description: data collection channel
        constraints: "one of {FARM_RECORD, EQUIPMENT_TELEMETRY, REMOTE_SENSING}"
      - name: reported_acres
        type: number
        source: input
        description: acres the packet reports as under the practice
        constraints: "> 0, 2 decimals"
      - name: measured_value
        type: number
        source: input
        description: observed stock change in tCO2e per acre for the reported acres; used only by the MEASUREMENT quantification variant
        constraints: ">= 0, 4 decimals"
      - name: coverage_pct
        type: number
        source: input
        description: percentage of enrolled acres the packet actually covers
        constraints: 0..100, 2 decimals
      - name: qc_score
        type: number
        source: computed
        description: "0..100 weighted quality score from calculations.data_packet_qc_score; recomputed on create and on every correction"
      - name: qc_status
        type: enum
        source: system
        description: quality-control axis; independent of completeness_status
        default: PENDING
        constraints: "one of {PENDING, PASSED, FLAGGED, REJECTED}"
      - name: completeness_status
        type: enum
        source: computed
        description: coverage axis; COMPLETE when coverage_pct >= COMPLETENESS_MIN_PCT, else PARTIAL; recomputed on create and on every correction, never changed by qc actions
        default: PARTIAL
        constraints: "one of {PARTIAL, COMPLETE}"
      - name: flag_reason
        type: string
        source: system
        description: reason recorded when QC flags the packet
        default: null
      - name: correction_count
        type: integer
        source: computed
        description: number of times the grower has corrected this packet
        default: 0

  - name: QuantificationRun
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; enrollment being quantified
      - name: baseline_id
        type: string
        source: input
        description: FK -> Baseline.id; approved baseline the run deducts against
      - name: crop_year
        type: integer
        source: input
        description: crop year quantified by this run
        constraints: within the commitment window and <= current_crop_year
      - name: method
        type: enum
        source: input
        description: quantification approach
        constraints: "one of {MODEL, MEASUREMENT}"
      - name: verified_acres
        type: number
        source: computed
        description: "acre base after the PASSED-packet filter, from calculations.net_removals_quantification; 2 decimals"
      - name: mean_coverage_pct
        type: number
        source: computed
        description: mean coverage_pct over the packets included by the selected method; 2 decimals
      - name: adoption_factor
        type: number
        source: computed
        description: coverage-derived adoption factor, 4 decimals; null when method == MEASUREMENT
        default: null
      - name: sampling_uncertainty_pct
        type: number
        source: computed
        description: coverage-derived sampling uncertainty percentage, 2 decimals; null when method == MODEL
        default: null
      - name: gross_removals_t
        type: number
        source: computed
        description: "gross removals in tCO2e from calculations.net_removals_quantification; 3 decimals"
      - name: uncertainty_deduction_t
        type: number
        source: computed
        description: "uncertainty deduction in tCO2e; 3 decimals"
      - name: net_removals_t
        type: number
        source: computed
        description: "gross_removals_t - uncertainty_deduction_t, floored at 0; 3 decimals"
      - name: packet_count
        type: integer
        source: computed
        description: number of PASSED DataPackets included by the selected method for this crop_year
      - name: status
        type: enum
        source: system
        description: quantification lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, VERIFIED, REJECTED, ISSUED}"
      - name: revision_count
        type: integer
        source: computed
        description: number of times this run has been sent back to DRAFT after rejection
        default: 0

  - name: VerificationBody
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: accredited third-party verification body name
        constraints: non-empty
      - name: accreditation_id
        type: string
        source: input
        description: accreditation registry identifier
        constraints: non-empty, unique
      - name: accredited_practices
        type: array
        source: input
        description: practice codes this body may verify
        constraints: "non-empty array of {COVER_CROP, REDUCED_TILLAGE, NUTRIENT_MANAGEMENT}"
      - name: max_concurrent_visits
        type: integer
        source: input
        description: maximum number of PENDING verifications whose site-visit windows may cover any one calendar day
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: accreditation standing
        default: ACCREDITED
        constraints: "one of {ACCREDITED, SUSPENDED}"

  - name: Verification
    parent: QuantificationRun
    common_fields: true
    fields:
      - name: quantification_run_id
        type: string
        source: input
        description: FK -> QuantificationRun.id; run under verification, taken from the path
      - name: verification_body_id
        type: string
        source: input
        description: FK -> VerificationBody.id; assigned third-party body
      - name: sample_pct
        type: number
        source: input
        description: share of enrolled acres physically sampled
        constraints: "> 0, <= 100, 2 decimals"
      - name: site_visit_start
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the first site-visit day, inclusive
      - name: site_visit_end
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD) of the last site-visit day, inclusive; must be >= site_visit_start
      - name: opinion
        type: enum
        source: system
        description: verification opinion axis
        default: PENDING
        constraints: "one of {PENDING, POSITIVE, QUALIFIED, ADVERSE}"
      - name: restated_removals_t
        type: number
        source: input
        description: net removals the verifier restates on opine; 3 decimals
        default: null
      - name: material_discrepancy_pct
        type: number
        source: computed
        description: "percentage gap between restated_removals_t and the run's net_removals_t from calculations.verification_discrepancy; 2 decimals"
        default: null
      - name: findings_note
        type: string
        source: input
        description: verifier findings text recorded on opine
        default: null
      - name: resample_count
        type: integer
        source: computed
        description: number of times this verification has been reopened for resampling
        default: 0

  - name: CreditBatch
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: computed
        description: FK -> Enrollment.id; copied from the issuing QuantificationRun
      - name: quantification_run_id
        type: string
        source: computed
        description: FK -> QuantificationRun.id; run this batch was minted from, taken from the issue path
      - name: supersedes_batch_id
        type: string
        source: input
        description: FK -> CreditBatch.id; optional pointer to the CANCELLED batch this re-issuance replaces
        default: null
      - name: vintage_year
        type: integer
        source: input
        description: registry vintage year stamped on the credits
        constraints: must equal the run's crop_year
      - name: gross_credits
        type: integer
        source: computed
        description: "integer credits before the buffer split, from calculations.credit_issuance_split"
      - name: buffer_pct
        type: number
        source: computed
        description: "buffer contribution percentage actually applied; 2 decimals"
      - name: buffer_credits
        type: integer
        source: computed
        description: credits contributed to the program buffer pool for reversal risk
      - name: issued_credits
        type: integer
        source: computed
        description: "gross_credits - buffer_credits; the tradable quantity"
      - name: risk_tier
        type: enum
        source: computed
        description: reversal-risk tier selected from the grower's cumulative issuance
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: serial_start
        type: integer
        source: computed
        description: first program-wide serial number assigned to this batch, inclusive
      - name: serial_end
        type: integer
        source: computed
        description: "last serial number assigned, inclusive; equals serial_start + issued_credits - 1"
      - name: issuance_status
        type: enum
        source: system
        description: issuance axis; independent of registry_status
        default: ISSUED
        constraints: "one of {ISSUED, CANCELLED}"
      - name: registry_status
        type: enum
        source: system
        description: registry listing axis; independent of issuance_status
        default: UNLISTED
        constraints: "one of {UNLISTED, LISTED, SUSPENDED, RETIRED}"
      - name: registry_account_ref
        type: string
        source: input
        description: buyer-facing registry account reference recorded on listing
        default: null
      - name: retirement_beneficiary
        type: string
        source: input
        description: beneficiary named on retirement
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: reason recorded when the batch is cancelled
        default: null

  - name: BufferAccount
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: system
        description: stable identifier of the pool; the server seeds exactly one row with pool_code == "PROGRAM_BUFFER" at startup
      - name: balance_credits
        type: integer
        source: computed
        description: "contributed_total - drawn_total - released_total"
        default: 0
      - name: contributed_total
        type: integer
        source: computed
        description: lifetime credits contributed by issuances
        default: 0
      - name: drawn_total
        type: integer
        source: computed
        description: lifetime credits drawn to cover assessed reversals
        default: 0
      - name: released_total
        type: integer
        source: computed
        description: lifetime credits released back out of the pool when a batch is cancelled
        default: 0
      - name: unbacked_reversal_credits
        type: integer
        source: computed
        description: lifetime assessed reversal credits the pool could not cover
        default: 0
      - name: outstanding_issued_credits
        type: integer
        source: computed
        description: sum of CreditBatch.issued_credits over batches whose issuance_status == ISSUED
        default: 0
      - name: min_reserve_ratio
        type: number
        source: system
        description: required reserve as a fraction of outstanding_issued_credits; seeded at 0.05
        default: 0.05
      - name: required_reserve_credits
        type: integer
        source: computed
        description: "round_half_up(min_reserve_ratio * outstanding_issued_credits) as an integer"
        default: 0
      - name: next_serial_number
        type: integer
        source: computed
        description: next serial number to hand out; advances by issued_credits on every issuance and never rolls back
        default: 1
      - name: pool_status
        type: enum
        source: computed
        description: HEALTHY when balance_credits >= required_reserve_credits, else DEFICIT
        default: HEALTHY
        constraints: "one of {HEALTHY, DEFICIT}"

  - name: ReversalEvent
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: computed
        description: FK -> Enrollment.id; copied from the referenced CreditBatch
      - name: credit_batch_id
        type: string
        source: input
        description: FK -> CreditBatch.id; batch whose credits were reversed
      - name: reversal_type
        type: enum
        source: input
        description: INTENTIONAL reversals are clawed back from the grower in full; UNINTENTIONAL reversals draw the buffer pool first
        constraints: "one of {INTENTIONAL, UNINTENTIONAL}"
      - name: affected_acres
        type: number
        source: input
        description: acres on which the sequestered carbon was lost
        constraints: "> 0, <= Enrollment.enrolled_acres, 2 decimals"
      - name: detected_crop_year
        type: integer
        source: input
        description: crop year in which the reversal was detected
        constraints: ">= the batch's vintage_year"
      - name: affected_credits
        type: integer
        source: computed
        description: "credits deemed reversed, from calculations.reversal_assessment; 0 until assessed"
        default: 0
      - name: buffer_draw_credits
        type: integer
        source: computed
        description: credits drawn from the buffer pool to cover the reversal
        default: 0
      - name: unbacked_credits
        type: integer
        source: computed
        description: "affected_credits - buffer_draw_credits"
        default: 0
      - name: grower_clawback_cents
        type: integer
        source: computed
        description: cash clawback assessed against the grower for the unbacked credits
        default: 0
      - name: status
        type: enum
        source: system
        description: reversal handling lifecycle
        default: REPORTED
        constraints: "one of {REPORTED, ASSESSED, RESOLVED}"
      - name: reported_by_admin_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who reported the reversal; segregation-of-duties input for assessment
      - name: assessed_by_admin_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who assessed the reversal
        default: null
      - name: resolution_note
        type: string
        source: input
        description: closing note recorded on resolution
        default: null

  - name: GrowerPayment
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: computed
        description: FK -> Enrollment.id; enrollment the payment settles
      - name: credit_batch_id
        type: string
        source: computed
        description: FK -> CreditBatch.id; batch that triggered a PER_CREDIT accrual; null for PER_ACRE accruals
        default: null
      - name: crop_year
        type: integer
        source: input
        description: crop year the payment covers
      - name: payment_model
        type: enum
        source: computed
        description: copied from Enrollment.payment_model at accrual
        constraints: "one of {PER_ACRE, PER_CREDIT}"
      - name: payable_acres
        type: number
        source: computed
        description: acre base used by the PER_ACRE band waterfall; null for PER_CREDIT accruals
        default: null
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "gross payment in cents from calculations.grower_payment_amount"
      - name: holdback_pct
        type: number
        source: computed
        description: permanence holdback percentage applied at accrual; 2 decimals
      - name: holdback_cents
        type: integer
        source: computed
        description: cents withheld against permanence obligations
      - name: net_amount_cents
        type: integer
        source: computed
        description: "gross_amount_cents - holdback_cents"
      - name: status
        type: enum
        source: system
        description: payment lifecycle
        default: ACCRUED
        constraints: "one of {ACCRUED, PAID, CLAWED_BACK, VOID}"
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant the payment was released; null until PAID
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Grower
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /growers/{grower_id}/suspend"
        actor: ProgramAdmin
        preconditions: ["Grower.status == ACTIVE"]
        side_effects:
          - "sets Grower.suspension_reason from the request"
          - "CASCADE hop 1: every Enrollment of this grower whose status == ACTIVE moves to SUSPENDED"
          - "CASCADE hop 2: because those enrollments became SUSPENDED, each of their Fields whose status == ENROLLED moves to SUSPENDED"
          - "Grower.total_enrolled_acres is unchanged — the acreage aggregate counts Field.status IN {ENROLLED, SUSPENDED}"
        note: "cyclic pair with reinstate; the acreage invariant is deliberately insensitive to suspension"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /growers/{grower_id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["Grower.status == SUSPENDED"]
        side_effects:
          - "clears Grower.suspension_reason to null"
          - "COMPENSATION hop 1: every Enrollment of this grower whose status == SUSPENDED returns to ACTIVE"
          - "COMPENSATION hop 2: because those enrollments returned to ACTIVE, each of their Fields whose status == SUSPENDED returns to ENROLLED"
          - "Grower.total_enrolled_acres is unchanged"

  - entity: Field
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: MAPPED
        trigger: "POST /fields/{field_id}/map-confirm"
        actor: ProgramAdmin
        preconditions:
          - "Field.status == DRAFT"
          - "Grower.status == ACTIVE"
        side_effects: ["stores Field.surveyor_reference", "refreshes Field.updated_at and increments Field.version"]
      - from: MAPPED
        to: ENROLLED
        trigger: "system: Baseline APPROVED cascade (POST /baselines/{baseline_id}/approve)"
        actor: system
        preconditions: ["Field.status == MAPPED", "the approving Baseline's Enrollment.field_id == Field.id"]
        side_effects:
          - "CASCADE hop 3 of baseline approval: because the field became ENROLLED, Grower.total_enrolled_acres increases by Field.mapped_acres"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "system: Grower ACTIVE->SUSPENDED cascade"
        actor: system
        preconditions: ["Field.status == ENROLLED"]
        side_effects: ["none beyond the status change"]
      - from: SUSPENDED
        to: ENROLLED
        trigger: "system: Grower SUSPENDED->ACTIVE cascade"
        actor: system
        preconditions: ["Field.status == SUSPENDED"]
        side_effects: ["none beyond the status change"]
      - from: ENROLLED
        to: MAPPED
        trigger: "system: Enrollment exit cascade (POST /enrollments/{enrollment_id}/decide-exit with decision APPROVE)"
        actor: system
        preconditions: ["Field.status == ENROLLED", "no other Enrollment on this field has status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "COMPENSATION: Grower.total_enrolled_acres decreases by Field.mapped_acres"

  - entity: PracticeStandard
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /practice-standards/{practice_standard_id}/retire"
        actor: ProgramAdmin
        preconditions: ["PracticeStandard.status == ACTIVE"]
        side_effects:
          - "no existing Enrollment changes — each already carries pinned_standard_version, so retirement only closes the standard to new enrollments"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /practice-standards/{practice_standard_id}/revise"
        actor: ProgramAdmin
        note: "self-loop: a methodology revision keeps the row ACTIVE but advances standard_version, stranding every Enrollment still pinned to the superseded version"
        preconditions: ["PracticeStandard.status == ACTIVE"]
        side_effects:
          - "PracticeStandard.standard_version += 1; no Enrollment is rewritten, so an enrollment pinned to the old version now disagrees with its standard"
          - "quantification and issuance for those enrollments are refused with ERR_STANDARD_VERSION_MISMATCH (§1.4 priority 13)"

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [REJECTED, EXITED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /enrollments/{enrollment_id}/submit"
        actor: "Grower or ProgramAdmin"
        preconditions:
          - "Enrollment.status == DRAFT"
          - "Grower.status == ACTIVE"
          - "when the acting role is Grower, X-User-ID == Enrollment.grower_id (§1.4 priority 4); a ProgramAdmin caller is not ownership-bound"
          - "documented_years >= PracticeStandard.min_documented_years (else ERR_INSUFFICIENT_PRACTICE_HISTORY)"
          - "prior_adoption_pct <= PracticeStandard.max_prior_adoption_pct (else ERR_ADDITIONALITY_FAILED)"
        side_effects:
          - "runs calculations.additionality_screening and writes Enrollment.prior_adoption_pct, Enrollment.additionality_score, Enrollment.documented_years"
      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /enrollments/{enrollment_id}/request-info"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == SCREENING"]
        side_effects: ["stores Enrollment.missing_items from the request"]
      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /enrollments/{enrollment_id}/resubmit"
        actor: "Grower or ProgramAdmin"
        preconditions:
          - "Enrollment.status == INFO_REQUESTED"
          - "Grower.status == ACTIVE"
          - "when the acting role is Grower, X-User-ID == Enrollment.grower_id (§1.4 priority 4); a ProgramAdmin caller is not ownership-bound"
          - "documented_years >= PracticeStandard.min_documented_years"
          - "prior_adoption_pct <= PracticeStandard.max_prior_adoption_pct"
        side_effects:
          - "re-runs calculations.additionality_screening over the PracticeHistory rows as they now stand, overwriting prior_adoption_pct, additionality_score and documented_years"
          - "clears Enrollment.missing_items to null"
        note: "cycle: SCREENING -> INFO_REQUESTED -> SCREENING may repeat without limit"
      - from: SCREENING
        to: ACCEPTED
        trigger: "POST /enrollments/{enrollment_id}/screen with decision == ACCEPT"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == SCREENING"]
        side_effects: ["records Enrollment.screening_decision_admin_id = acting X-User-ID"]
        note: "branch A of the screening fork"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /enrollments/{enrollment_id}/screen with decision == REJECT"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == SCREENING", "rejection_reason present in the request"]
        side_effects:
          - "records Enrollment.screening_decision_admin_id = acting X-User-ID and Enrollment.rejection_reason"
          - "the Field stays MAPPED; no acreage is added"
        note: "branch B of the screening fork — divergent side-effect set from branch A"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "system: Baseline PROPOSED->APPROVED cascade (POST /baselines/{baseline_id}/approve)"
        actor: system
        preconditions: ["Enrollment.status == ACCEPTED", "the approved Baseline.enrollment_id == Enrollment.id"]
        side_effects:
          - "CASCADE hop 1 of baseline approval: Enrollment.status becomes ACTIVE and Enrollment.permanence_status becomes IN_COMPLIANCE"
          - "records Enrollment.baseline_approval_admin_id = acting X-User-ID"
          - "CASCADE hop 2: because the enrollment became ACTIVE, its Field moves MAPPED -> ENROLLED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Grower ACTIVE->SUSPENDED cascade"
        actor: system
        preconditions: ["Enrollment.status == ACTIVE"]
        side_effects: ["cascades on to the Field (ENROLLED -> SUSPENDED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: Grower SUSPENDED->ACTIVE cascade"
        actor: system
        preconditions: ["Enrollment.status == SUSPENDED"]
        side_effects: ["cascades on to the Field (SUSPENDED -> ENROLLED)"]
      - from: ACTIVE
        to: EXIT_REQUESTED
        trigger: "POST /enrollments/{enrollment_id}/request-exit"
        actor: "Grower or ProgramAdmin"
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "Grower.status == ACTIVE"
          - "when the acting role is Grower, X-User-ID == Enrollment.grower_id (§1.4 priority 4); a ProgramAdmin caller is not ownership-bound"
          - "current_crop_year - Enrollment.start_crop_year >= EXIT_NOTICE_MIN_YEARS (else ERR_EXIT_WINDOW_NOT_OPEN)"
        side_effects: ["stores Enrollment.exit_reason and Enrollment.requested_exit_year"]
      - from: EXIT_REQUESTED
        to: EXITED
        trigger: "POST /enrollments/{enrollment_id}/decide-exit with decision == APPROVE and elapsed_years >= commitment_years"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == EXIT_REQUESTED"]
        side_effects:
          - "runs calculations.contract_exit_fee; Enrollment.exit_fee_cents == 0 because the commitment was fully served"
          - "CASCADE: the Field moves ENROLLED -> MAPPED, which decreases Grower.total_enrolled_acres by Field.mapped_acres"
          - "every GrowerPayment of this enrollment whose status == ACCRUED moves to PAID (final settlement)"
        note: "branch A of the exit fork — clean exit after the commitment"
      - from: EXIT_REQUESTED
        to: TERMINATED
        trigger: "POST /enrollments/{enrollment_id}/decide-exit with decision == APPROVE and elapsed_years < commitment_years"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == EXIT_REQUESTED"]
        side_effects:
          - "runs calculations.contract_exit_fee; Enrollment.exit_fee_cents > 0 unless exit_reason == FORCE_MAJEURE"
          - "sets Enrollment.terminated_effective_year = current_crop_year, opening the practice cooldown window on this field and practice_code"
          - "CASCADE: the Field moves ENROLLED -> MAPPED, which decreases Grower.total_enrolled_acres by Field.mapped_acres"
          - "every GrowerPayment of this enrollment whose status == ACCRUED moves to VOID"
        note: "branch B of the exit fork — divergent side-effect set from branch A (fee charged, cooldown opened, accruals voided instead of paid)"
      - from: EXIT_REQUESTED
        to: ACTIVE
        trigger: "POST /enrollments/{enrollment_id}/decide-exit with decision == DENY"
        actor: ProgramAdmin
        preconditions: ["Enrollment.status == EXIT_REQUESTED", "rejection_reason present in the request"]
        side_effects:
          - "stores Enrollment.rejection_reason, clears Enrollment.exit_reason and Enrollment.requested_exit_year to null"
        note: "cycle back into ACTIVE — the grower may request an exit again later"

  - entity: Baseline
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: POST /enrollments/{enrollment_id}/baselines creating a newer proposal"
        actor: system
        preconditions: ["Baseline.status == PROPOSED"]
        side_effects: ["the new Baseline row becomes the only PROPOSED baseline for the enrollment"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /baselines/{baseline_id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "Baseline.status == PROPOSED"
          - "Enrollment.status == ACCEPTED"
          - "acting X-User-ID != Enrollment.screening_decision_admin_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "records Baseline.approved_by_admin_id"
          - "CASCADE hop 1: Enrollment ACCEPTED -> ACTIVE and Enrollment.permanence_status -> IN_COMPLIANCE"
          - "CASCADE hop 2: because the enrollment became ACTIVE, Field MAPPED -> ENROLLED"
          - "CASCADE hop 3: because the field became ENROLLED, Grower.total_enrolled_acres += Field.mapped_acres"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /baselines/{baseline_id}/reject"
        actor: ProgramAdmin
        preconditions: ["Baseline.status == PROPOSED"]
        side_effects:
          - "stores Baseline.rejection_note"
          - "the Enrollment stays ACCEPTED so a new baseline can be proposed; no acreage cascade fires"

  - entity: DataPacket
    initial_state: "qc_status = PENDING x completeness_status = f(coverage_pct)"
    terminal_states: [REJECTED]
    transitions:
      - from: "qc_status: PENDING"
        to: "qc_status: PASSED"
        trigger: "POST /data-packets/{data_packet_id}/qc with decision == PASS"
        actor: ProgramAdmin
        preconditions:
          - "DataPacket.qc_status == PENDING"
          - "DataPacket.qc_score >= QC_PASS_MIN_SCORE (else ERR_QC_SCORE_BELOW_THRESHOLD)"
        side_effects: ["completeness_status is NOT touched — the two axes evolve independently"]
      - from: "qc_status: PENDING"
        to: "qc_status: FLAGGED"
        trigger: "POST /data-packets/{data_packet_id}/qc with decision == FLAG"
        actor: ProgramAdmin
        preconditions: ["DataPacket.qc_status == PENDING", "flag_reason present in the request"]
        side_effects: ["stores DataPacket.flag_reason", "completeness_status is NOT touched"]
      - from: "qc_status: FLAGGED"
        to: "qc_status: PENDING"
        trigger: "POST /data-packets/{data_packet_id}/correct"
        actor: "Grower or ProgramAdmin"
        preconditions:
          - "DataPacket.qc_status == FLAGGED"
          - "Enrollment.status == ACTIVE"
          - "when the acting role is Grower, X-User-ID == Enrollment.grower_id (§1.4 priority 4); a ProgramAdmin caller is not ownership-bound"
        side_effects:
          - "overwrites the supplied reported_acres / measured_value / coverage_pct"
          - "recomputes DataPacket.qc_score and re-derives DataPacket.completeness_status from the new coverage_pct"
          - "increments DataPacket.correction_count, clears flag_reason to null"
        note: "cycle: PENDING -> FLAGGED -> PENDING may repeat"
      - from: "qc_status: FLAGGED"
        to: "qc_status: REJECTED"
        trigger: "POST /data-packets/{data_packet_id}/reject"
        actor: ProgramAdmin
        preconditions: ["DataPacket.qc_status == FLAGGED"]
        side_effects: ["the packet is permanently excluded from every quantification input set"]
      - from: "completeness_status: PARTIAL"
        to: "completeness_status: COMPLETE"
        trigger: "system: on create and on every POST /data-packets/{data_packet_id}/correct, when coverage_pct >= COMPLETENESS_MIN_PCT"
        actor: system
        preconditions: ["coverage_pct >= COMPLETENESS_MIN_PCT"]
        side_effects: ["qc_status is NOT touched — a PASSED packet may still be PARTIAL and a PENDING packet may already be COMPLETE"]
      - from: "completeness_status: COMPLETE"
        to: "completeness_status: PARTIAL"
        trigger: "system: on POST /data-packets/{data_packet_id}/correct, when the corrected coverage_pct < COMPLETENESS_MIN_PCT"
        actor: system
        preconditions: ["coverage_pct < COMPLETENESS_MIN_PCT"]
        side_effects: ["qc_status is NOT touched"]

  - entity: QuantificationRun
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /quantification-runs/{quantification_run_id}/submit"
        actor: ProgramAdmin
        preconditions: ["QuantificationRun.status == DRAFT"]
        side_effects: ["the run's computed removals freeze; later DataPacket corrections no longer change them"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "system: POST /verifications/{verification_id}/opine with opinion == POSITIVE"
        actor: system
        preconditions: ["QuantificationRun.status == SUBMITTED", "the opining Verification.quantification_run_id == QuantificationRun.id"]
        side_effects: ["none beyond the status change"]
        note: "branch A of the verification fork"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: POST /verifications/{verification_id}/opine with opinion == ADVERSE"
        actor: system
        preconditions: ["QuantificationRun.status == SUBMITTED"]
        side_effects: ["the run can only re-enter the pipeline through revise"]
        note: "branch B of the verification fork — divergent side-effect set from branch A"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "system: POST /verifications/{verification_id}/opine with opinion == QUALIFIED"
        actor: system
        preconditions: ["QuantificationRun.status == SUBMITTED"]
        side_effects: ["the run stays SUBMITTED awaiting a resample; issuance remains blocked"]
        note: "branch C of the verification fork — a self-loop with no state change"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /quantification-runs/{quantification_run_id}/revise"
        actor: ProgramAdmin
        preconditions: ["QuantificationRun.status == REJECTED"]
        side_effects:
          - "increments QuantificationRun.revision_count"
          - "re-runs calculations.net_removals_quantification against the current PASSED packet set, optionally with the newly supplied method"
        note: "cycle: DRAFT -> SUBMITTED -> REJECTED -> DRAFT"
      - from: VERIFIED
        to: ISSUED
        trigger: "POST /quantification-runs/{quantification_run_id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "QuantificationRun.status == VERIFIED"
          - "BufferAccount(PROGRAM_BUFFER).pool_status == HEALTHY (else ERR_BUFFER_POOL_DEFICIT)"
          - "no Verification of this run has opinion == ADVERSE"
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "CASCADE hop 1: mints a CreditBatch via calculations.credit_issuance_split (gross_credits, buffer_pct, buffer_credits, issued_credits, risk_tier, serial_start, serial_end)"
          - "CASCADE hop 2: because that batch exists, BufferAccount.contributed_total += batch.buffer_credits, BufferAccount.balance_credits += batch.buffer_credits, BufferAccount.outstanding_issued_credits += batch.issued_credits, BufferAccount.next_serial_number += batch.issued_credits, and required_reserve_credits / pool_status are re-derived"
          - "CASCADE hop 3: because that batch exists and Enrollment.payment_model == PER_CREDIT, a GrowerPayment (status ACCRUED, credit_batch_id set) is accrued via calculations.grower_payment_amount"
          - "CASCADE hop 4: because that payment exists, Enrollment.accrued_payment_cents += payment.net_amount_cents"
          - "Enrollment.credits_issued_total += batch.issued_credits and Grower.lifetime_credits_issued += batch.issued_credits"
          - "increments Enrollment.version by 1"

  - entity: Verification
    initial_state: PENDING
    terminal_states: [POSITIVE, ADVERSE]
    transitions:
      - from: PENDING
        to: POSITIVE
        trigger: "POST /verifications/{verification_id}/opine with opinion == POSITIVE"
        actor: Verifier
        preconditions:
          - "Verification.opinion == PENDING"
          - "VerificationBody.status == ACCREDITED"
          - "acting X-User-ID == Verification.verification_body_id"
          - "material_discrepancy_pct <= MATERIAL_DISCREPANCY_MAX_PCT (else ERR_MATERIAL_DISCREPANCY_EXCEEDED)"
        side_effects:
          - "writes Verification.material_discrepancy_pct and Verification.findings_note"
          - "CASCADE: QuantificationRun SUBMITTED -> VERIFIED"
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /verifications/{verification_id}/opine with opinion == QUALIFIED"
        actor: Verifier
        preconditions: ["Verification.opinion == PENDING", "VerificationBody.status == ACCREDITED", "acting X-User-ID == Verification.verification_body_id"]
        side_effects: ["writes Verification.material_discrepancy_pct", "the QuantificationRun stays SUBMITTED"]
      - from: PENDING
        to: ADVERSE
        trigger: "POST /verifications/{verification_id}/opine with opinion == ADVERSE"
        actor: Verifier
        preconditions: ["Verification.opinion == PENDING", "VerificationBody.status == ACCREDITED", "acting X-User-ID == Verification.verification_body_id"]
        side_effects: ["writes Verification.material_discrepancy_pct", "CASCADE: QuantificationRun SUBMITTED -> REJECTED"]
      - from: QUALIFIED
        to: PENDING
        trigger: "POST /verifications/{verification_id}/resample"
        actor: Verifier
        preconditions:
          - "Verification.opinion == QUALIFIED"
          - "the new site-visit window passes the VerificationBody concurrency check"
        side_effects:
          - "overwrites sample_pct, site_visit_start, site_visit_end"
          - "increments Verification.resample_count and clears restated_removals_t / material_discrepancy_pct to null"
        note: "cycle: PENDING -> QUALIFIED -> PENDING may repeat"

  - entity: CreditBatch
    initial_state: "issuance_status = ISSUED x registry_status = UNLISTED"
    terminal_states: [CANCELLED, RETIRED]
    transitions:
      - from: "registry_status: UNLISTED"
        to: "registry_status: LISTED"
        trigger: "POST /credit-batches/{credit_batch_id}/list"
        actor: RegistryOfficer
        preconditions: ["CreditBatch.registry_status == UNLISTED", "CreditBatch.issuance_status == ISSUED"]
        side_effects: ["stores CreditBatch.registry_account_ref", "issuance_status is NOT touched"]
      - from: "registry_status: LISTED"
        to: "registry_status: RETIRED"
        trigger: "POST /credit-batches/{credit_batch_id}/retire"
        actor: RegistryOfficer
        preconditions: ["CreditBatch.registry_status == LISTED", "CreditBatch.issuance_status == ISSUED"]
        side_effects: ["stores CreditBatch.retirement_beneficiary", "the batch's buffer contribution stays in the pool permanently"]
      - from: "registry_status: LISTED"
        to: "registry_status: SUSPENDED"
        trigger: "system: reversal assessment cascade (POST /reversal-events/{reversal_event_id}/assess)"
        actor: system
        preconditions: ["CreditBatch.registry_status == LISTED"]
        side_effects:
          - "CASCADE: because this batch became registry-SUSPENDED, its Enrollment.permanence_status moves to BREACHED"
      - from: "registry_status: SUSPENDED"
        to: "registry_status: LISTED"
        trigger: "system: POST /reversal-events/{reversal_event_id}/resolve"
        actor: system
        preconditions: ["CreditBatch.registry_status == SUSPENDED", "the resolving ReversalEvent.credit_batch_id == CreditBatch.id"]
        side_effects:
          - "COMPENSATION: the Enrollment returns to permanence_status IN_COMPLIANCE when no other SUSPENDED batch remains on it"
        note: "cycle: LISTED -> SUSPENDED -> LISTED"
      - from: "issuance_status: ISSUED"
        to: "issuance_status: CANCELLED"
        trigger: "POST /credit-batches/{credit_batch_id}/cancel"
        actor: RegistryOfficer
        preconditions:
          - "CreditBatch.issuance_status == ISSUED"
          - "CreditBatch.registry_status != RETIRED"
          - "expected_credit_batch_version matches CreditBatch.version (else ERR_STALE_BATCH_VERSION)"
        side_effects:
          - "stores CreditBatch.cancellation_reason and increments CreditBatch.version by 1"
          - "COMPENSATION hop 1: BufferAccount.released_total += batch.buffer_credits and BufferAccount.balance_credits -= batch.buffer_credits"
          - "COMPENSATION hop 2: BufferAccount.outstanding_issued_credits -= batch.issued_credits, then required_reserve_credits and pool_status are re-derived"
          - "COMPENSATION hop 3: Enrollment.credits_issued_total -= batch.issued_credits; every GrowerPayment whose credit_batch_id == batch.id and status == ACCRUED moves to VOID and Enrollment.accrued_payment_cents decreases by its net_amount_cents"
          - "BufferAccount.next_serial_number is NOT rolled back — serial numbers are never reused"
          - "registry_status is NOT touched"
      - from: "registry_status: UNLISTED"
        to: "registry_status: LISTED (re-issuance)"
        trigger: "POST /credit-batches/{credit_batch_id}/list on a batch that carries supersedes_batch_id"
        actor: RegistryOfficer
        note: "guarded variant of the ordinary listing edge; a re-issued batch starts UNLISTED like any other and cannot reach the registry until its predecessor is cancelled"
        preconditions:
          - "CreditBatch.registry_status == UNLISTED and CreditBatch.issuance_status == ISSUED"
          - "the batch named by supersedes_batch_id has issuance_status == CANCELLED (else ERR_SUPERSEDED_BATCH_NOT_CANCELLED)"
        side_effects: ["stores CreditBatch.registry_account_ref; the superseded batch is untouched"]
        note: "self-referential edge; the new batch still starts UNLISTED and must be listed explicitly"

  - entity: ReversalEvent
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /reversal-events/{reversal_event_id}/assess"
        actor: ProgramAdmin
        preconditions:
          - "ReversalEvent.status == REPORTED"
          - "acting X-User-ID != ReversalEvent.reported_by_admin_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE hop 1: runs calculations.reversal_assessment and writes affected_credits, buffer_draw_credits, unbacked_credits, grower_clawback_cents, assessed_by_admin_id; increments Grower.reversal_count"
          - "CASCADE hop 2: because buffer_draw_credits > 0 (UNINTENTIONAL only), BufferAccount.drawn_total += buffer_draw_credits and BufferAccount.balance_credits -= buffer_draw_credits; BufferAccount.unbacked_reversal_credits += unbacked_credits"
          - "CASCADE hop 3: because BufferAccount.balance_credits fell below required_reserve_credits, BufferAccount.pool_status becomes DEFICIT"
          - "CASCADE hop 4: because the pool entered DEFICIT, every CreditBatch with registry_status == LISTED moves to registry_status SUSPENDED (program-wide listing freeze)"
          - "CASCADE hop 5: because those batches became registry-SUSPENDED, each of their Enrollments moves permanence_status -> BREACHED"
          - "CASCADE hop 6: because those enrollments became BREACHED, each of their GrowerPayment rows with status == ACCRUED moves to CLAWED_BACK and Enrollment.accrued_payment_cents decreases by that payment's net_amount_cents; Grower.outstanding_clawback_cents += ReversalEvent.grower_clawback_cents, booked once per reversal event and NOT once per payment"
          - "CASCADE hop 7: because Grower.outstanding_clawback_cents reached CLAWBACK_SUSPENSION_THRESHOLD_CENTS (250000 cents), the Grower moves ACTIVE -> SUSPENDED (which itself suspends that grower's ACTIVE enrollments and their ENROLLED fields)"
          - "for reversal_type == INTENTIONAL the divergent branch applies: no buffer draw and no pool-status change, but the reversal's own CreditBatch moves registry_status LISTED -> SUSPENDED directly and hops 5-7 follow from there"
      - from: ASSESSED
        to: RESOLVED
        trigger: "POST /reversal-events/{reversal_event_id}/resolve"
        actor: ProgramAdmin
        preconditions: ["ReversalEvent.status == ASSESSED"]
        side_effects:
          - "stores ReversalEvent.resolution_note"
          - "the reversal's CreditBatch returns registry_status SUSPENDED -> LISTED"
          - "the Enrollment returns permanence_status BREACHED -> IN_COMPLIANCE when no other SUSPENDED batch remains on it"
          - "clawed-back GrowerPayment rows are NOT restored — the cash clawback is permanent"

  - entity: GrowerPayment
    initial_state: ACCRUED
    terminal_states: [PAID, CLAWED_BACK, VOID]
    transitions:
      - from: ACCRUED
        to: PAID
        trigger: "POST /grower-payments/{grower_payment_id}/pay"
        actor: ProgramAdmin
        preconditions:
          - "GrowerPayment.status == ACCRUED"
          - "Enrollment.permanence_status != BREACHED"
          - "Grower.status == ACTIVE"
        side_effects:
          - "stamps GrowerPayment.paid_at with the logical clock"
          - "Grower.net_paid_cents += GrowerPayment.net_amount_cents"
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "system: reversal assessment cascade hop 6"
        actor: system
        preconditions: ["GrowerPayment.status == ACCRUED", "the owning Enrollment.permanence_status became BREACHED"]
        side_effects:
          - "Grower.outstanding_clawback_cents += the driving ReversalEvent.grower_clawback_cents (booked once per reversal event, not once per payment)"
          - "Enrollment.accrued_payment_cents -= GrowerPayment.net_amount_cents"
      - from: ACCRUED
        to: VOID
        trigger: "system: Enrollment EXIT_REQUESTED->TERMINATED cascade, or CreditBatch cancel compensation hop 3"
        actor: system
        preconditions: ["GrowerPayment.status == ACCRUED"]
        side_effects: ["Enrollment.accrued_payment_cents -= GrowerPayment.net_amount_cents; no cash moves in either direction"]

  - entity: VerificationBody
    initial_state: ACCREDITED
    terminal_states: []
    transitions:
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /verification-bodies/{verification_body_id}/suspend"
        actor: ProgramAdmin
        preconditions: ["VerificationBody.status == ACCREDITED"]
        side_effects:
          - "opinions already issued by this body stand; no Verification row is modified"
          - "every subsequent verification write naming this body is refused with ERR_VERIFICATION_BODY_SUSPENDED while it stays suspended"
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /verification-bodies/{verification_body_id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["VerificationBody.status == SUSPENDED"]
        side_effects:
          - "the body's PENDING verifications become actionable again with their original site-visit windows intact"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: baseline-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{enrollment_id}/baselines"
    occ_field: "expected_enrollment_version"
    description: |
      Proposing a Baseline against an Enrollment whose version has advanced since
      the client last read it is rejected. A second baseline proposal is
      legitimate on its own terms — the newer proposal supersedes the prior
      PROPOSED row under §1.2 — so nothing in the state machine stops it; the
      stale-version check is what protects a client that is still looking at the
      screening-era view of the enrollment.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: run-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /quantification-runs"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a QuantificationRun against an Enrollment whose version has
      advanced since the client last read it is rejected. Repeat DRAFT runs for
      the same enrollment and crop year are permitted by the product (each new
      DRAFT is quantified independently), so a strictly later request observing
      the same state would itself succeed; the version check is the only thing
      that distinguishes a client working from a stale enrollment snapshot.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: batch-cancel-stale-batch
    parent_entity: CreditBatch
    write_endpoint: "POST /credit-batches/{credit_batch_id}/cancel"
    occ_field: "expected_credit_batch_version"
    description: |
      Cancelling a CreditBatch whose version has advanced since the client last
      read it is rejected. Listing, retirement and reversal cascades all bump the
      batch's version without moving issuance_status, so a cancel request built
      on an older snapshot would otherwise silently release buffer credits from a
      batch whose registry position has since changed.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: field_mapped_acres
    trigger: "on POST /growers/{grower_id}/fields (Field creation)"
    algorithm: aggregation
    formula: |
      width  = boundary_max_x - boundary_min_x            # integer grid units
      height = boundary_max_y - boundary_min_y            # integer grid units
      mapped_acres = round_half_up(width * height / SQUARE_UNITS_PER_ACRE, 2)
    input_set: "the four boundary_* integers supplied on the create request; no other entity participates"
    constants:
      SQUARE_UNITS_PER_ACRE: 4000
    precision: "2 decimal places, round_half_up"

  - name: additionality_screening
    trigger: "on POST /enrollments/{enrollment_id}/submit and on POST /enrollments/{enrollment_id}/resubmit"
    algorithm: weighted_scoring
    formula: |
      std = the PracticeStandard pinned on the Enrollment
      L   = std.additionality_lookback_years
      window = crop years from (Enrollment.start_crop_year - L) through
               (Enrollment.start_crop_year - 1), BOTH ENDS INCLUSIVE
               (start_crop_year itself is excluded)

      rows = PracticeHistory rows where
               field_id == Enrollment.field_id
               AND practice_code == Enrollment.practice_code
               AND crop_year IN window

      weighted_adopted_acres = sum over rows with adopted == true of
                                 (row.acres * EVIDENCE_WEIGHT[row.evidence_source])
      denominator = Field.mapped_acres * L
      prior_adoption_pct = round_half_up(100 * weighted_adopted_acres / denominator, 2)

      documented_years = count of DISTINCT row.crop_year over rows (adopted true or false)

      telemetry_gap_flag = 1 if (std.telemetry_required == true
                                 AND no row has evidence_source == EQUIPMENT_TELEMETRY)
                           else 0

      raw_score = 100
                  - 1.5 * prior_adoption_pct
                  - 20 * telemetry_gap_flag
                  + 2 * min(documented_years, L)
      additionality_score = max(0, min(100, round_half_up(raw_score, 2)))

      GATE 1 (checked first): documented_years >= std.min_documented_years
             else ERR_INSUFFICIENT_PRACTICE_HISTORY
      GATE 2: prior_adoption_pct <= std.max_prior_adoption_pct
             else ERR_ADDITIONALITY_FAILED
             (equality PASSES — the ceiling is inclusive)
    input_set: "PracticeHistory rows for the enrolled field and the enrolled practice_code whose crop_year lies in the inclusive lookback window; rows outside the window, rows for other practices and rows for other fields are excluded regardless of evidence_source"
    constants:
      EVIDENCE_WEIGHT: { FARM_RECORD: 1.0, EQUIPMENT_TELEMETRY: 1.0, REMOTE_SENSING: 0.8, ATTESTATION: 0.5 }
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "prior_adoption_pct and additionality_score to 2 decimal places, round_half_up; the min/max clamp is applied AFTER rounding"

  - name: baseline_establishment
    trigger: "on POST /enrollments/{enrollment_id}/baselines (Baseline creation)"
    algorithm: forward_looking
    formula: |
      std = the PracticeStandard pinned on the Enrollment
      L   = std.additionality_lookback_years
      window = (start_crop_year - L) .. (start_crop_year - 1), both ends inclusive

      qualifying_rows = PracticeHistory rows where
                          field_id == Enrollment.field_id
                          AND practice_code == Enrollment.practice_code
                          AND crop_year IN window
                          AND evidence_source IN {FARM_RECORD, EQUIPMENT_TELEMETRY}
      qualifying_years = count of DISTINCT crop_year over qualifying_rows

      # NOTE the deliberate filter difference against additionality_screening:
      # REMOTE_SENSING and ATTESTATION rows count toward documented_years there
      # but are NOT admissible baseline evidence here.

      variant HISTORICAL_DATA:
        historical_mean_rate = round_half_up(
            sum(row.observed_emissions_per_acre over qualifying_rows) / qualifying_years, 4)
        baseline_emissions_t = round_half_up(Field.mapped_acres * historical_mean_rate, 3)
        uncertainty_pct      = max(HISTORICAL_UNCERTAINTY_FLOOR_PCT,
                                   round_half_up(std.uncertainty_base_pct
                                                 - HISTORICAL_PER_YEAR_REDUCTION_PCT * qualifying_years, 2))

      variant MODELED:
        historical_mean_rate = null
        baseline_emissions_t = round_half_up(Field.mapped_acres
                                             * std.modeled_baseline_rate_per_acre
                                             * SOIL_FACTOR[Field.soil_group], 3)
        uncertainty_pct      = max(MODELED_UNCERTAINTY_FLOOR_PCT,
                                   round_half_up(std.uncertainty_base_pct
                                                 + MODELED_UNCERTAINTY_ADDER_PCT
                                                 - MODELED_PER_YEAR_REDUCTION_PCT * qualifying_years, 2))

      GATE: qualifying_years >= 1 else ERR_INSUFFICIENT_PRACTICE_HISTORY
    input_set: "PracticeHistory rows in the inclusive lookback window for the enrolled field and practice whose evidence_source IN {FARM_RECORD, EQUIPMENT_TELEMETRY}; both variants read the same row set but MODELED uses only its cardinality (qualifying_years), never the observed values"
    constants:
      SOIL_FACTOR: { LOAM: 1.00, CLAY: 0.90, SAND: 1.15 }
      HISTORICAL_UNCERTAINTY_FLOOR_PCT: 5.00
      HISTORICAL_PER_YEAR_REDUCTION_PCT: 2.0
      MODELED_UNCERTAINTY_ADDER_PCT: 10.0
      MODELED_PER_YEAR_REDUCTION_PCT: 1.5
      MODELED_UNCERTAINTY_FLOOR_PCT: 12.00
    precision: "historical_mean_rate 4 decimals, baseline_emissions_t 3 decimals, uncertainty_pct 2 decimals, all round_half_up; the floor clamp is applied AFTER rounding"
    variants:
      - name: HISTORICAL_DATA
        when: "Baseline.method == HISTORICAL_DATA — the grower's own farm records carry the counterfactual"
        difference: "baseline_emissions_t is driven by the observed per-acre mean and uncertainty falls 2.0 pct per qualifying year down to a 5.00 floor"
      - name: MODELED
        when: "Baseline.method == MODELED — the program's process model supplies the counterfactual"
        difference: "baseline_emissions_t ignores the observed values entirely and uses std.modeled_baseline_rate_per_acre scaled by the soil factor; uncertainty starts 10.0 pct higher, falls only 1.5 pct per qualifying year and floors at 12.00"

  - name: net_removals_quantification
    trigger: "on POST /quantification-runs (creation) and re-run on POST /quantification-runs/{quantification_run_id}/revise"
    algorithm: dual_variant_measurement
    formula: |
      packets = DataPacket rows where
                  enrollment_id == run.enrollment_id
                  AND crop_year == run.crop_year
                  AND qc_status == PASSED
                  # PENDING, FLAGGED and REJECTED packets are excluded; a packet's
                  # completeness_status is NOT part of this filter
      GATE: packets is non-empty else ERR_NO_QUALIFYING_DATA
      GATE: if std.telemetry_required and no packet has source == EQUIPMENT_TELEMETRY
            then ERR_TELEMETRY_EVIDENCE_REQUIRED

      variant MODEL:
        included = packets                              # every PASSED packet
        verified_acres    = min(Enrollment.enrolled_acres,
                                sum(p.reported_acres over included))
        mean_coverage_pct = round_half_up(sum(p.coverage_pct over included) / count(included), 2)
        adoption_factor   = min(1.0000, round_half_up(mean_coverage_pct / 100, 4))
        gross_removals_t  = round_half_up(std.sequestration_rate_per_acre
                                          * verified_acres * adoption_factor, 3)
        uncertainty_deduction_t = round_half_up(gross_removals_t
                                    * (baseline.uncertainty_pct + MODEL_UNCERTAINTY_ADDER_PCT) / 100, 3)
        sampling_uncertainty_pct = null

      variant MEASUREMENT:
        included = packets with source IN {EQUIPMENT_TELEMETRY, REMOTE_SENSING}
                   # FARM_RECORD packets are inadmissible as measurement evidence
        GATE: included is non-empty else ERR_NO_QUALIFYING_DATA
        verified_acres    = min(Enrollment.enrolled_acres,
                                sum(p.reported_acres over included))
        mean_coverage_pct = round_half_up(sum(p.coverage_pct over included) / count(included), 2)
        GATE: mean_coverage_pct >= MEASUREMENT_MIN_COVERAGE_PCT else ERR_COVERAGE_BELOW_MINIMUM
        measured_stock_change_t = round_half_up(
            sum(p.measured_value * p.reported_acres over included), 3)
        gross_removals_t  = max(0.000, round_half_up(measured_stock_change_t
                                                     - baseline.baseline_emissions_t, 3))
        sampling_uncertainty_pct = max(SAMPLING_UNCERTAINTY_FLOOR_PCT,
            round_half_up(SAMPLING_UNCERTAINTY_INTERCEPT_PCT
                          - SAMPLING_COVERAGE_SLOPE * mean_coverage_pct, 2))
        uncertainty_deduction_t = round_half_up(gross_removals_t * sampling_uncertainty_pct / 100, 3)
        adoption_factor = null

      net_removals_t = max(0.000, round_half_up(gross_removals_t - uncertainty_deduction_t, 3))
      packet_count   = count(included)
    input_set: "PASSED DataPackets for the run's enrollment and crop_year; MODEL includes every source, MEASUREMENT includes only EQUIPMENT_TELEMETRY and REMOTE_SENSING. The same packet set therefore yields two different net_removals_t values depending on Baseline/run method."
    constants:
      MODEL_UNCERTAINTY_ADDER_PCT: 5.00
      SAMPLING_UNCERTAINTY_INTERCEPT_PCT: 30.0
      SAMPLING_COVERAGE_SLOPE: 0.25
      SAMPLING_UNCERTAINTY_FLOOR_PCT: 5.00
      MEASUREMENT_MIN_COVERAGE_PCT: 60.00
    precision: "acres 2 decimals, factors 4 decimals, percentages 2 decimals, tonnage 3 decimals, all round_half_up; each tonnage term is rounded before it feeds the next line"
    variants:
      - name: MODEL
        when: "QuantificationRun.method == MODEL"
        difference: "removals are the standard's per-acre rate scaled by verified acres and the coverage-derived adoption factor; the deduction percentage is the baseline's uncertainty plus a flat 5.00 model adder, and the baseline tonnage itself never enters the arithmetic"
      - name: MEASUREMENT
        when: "QuantificationRun.method == MEASUREMENT"
        difference: "removals are the measured stock change minus baseline_emissions_t (so the baseline tonnage is subtracted directly), FARM_RECORD packets drop out of the input set, and the deduction percentage is derived from coverage by a declining sampling curve instead of the baseline uncertainty"

  - name: data_packet_qc_score
    trigger: "on POST /enrollments/{enrollment_id}/data-packets and on POST /data-packets/{data_packet_id}/correct"
    algorithm: weighted_scoring
    formula: |
      completeness_ratio = min(1.0000, round_half_up(coverage_pct / 100, 4))
      acre_gap_ratio     = min(1.0000, round_half_up(
                                abs(reported_acres - Enrollment.enrolled_acres)
                                / Enrollment.enrolled_acres, 4))
      plausibility_ratio = round_half_up(1 - acre_gap_ratio, 4)
      qc_score = round_half_up(100 * (  W_COMPLETENESS * completeness_ratio
                                      + W_PLAUSIBILITY * plausibility_ratio
                                      + W_SOURCE       * SOURCE_WEIGHT[source]), 2)

      completeness_status = COMPLETE if coverage_pct >= COMPLETENESS_MIN_PCT else PARTIAL
      # the coverage axis is derived here on every create/correct and is never
      # touched by the qc decision endpoints

      PASS GATE (on POST /data-packets/{data_packet_id}/qc with decision PASS):
        qc_score >= QC_PASS_MIN_SCORE else ERR_QC_SCORE_BELOW_THRESHOLD
        (equality PASSES)
    input_set: "the packet's own coverage_pct / reported_acres / source plus Enrollment.enrolled_acres; no sibling packet participates"
    constants:
      W_COMPLETENESS: 0.5
      W_PLAUSIBILITY: 0.3
      W_SOURCE: 0.2
      SOURCE_WEIGHT: { FARM_RECORD: 0.6, EQUIPMENT_TELEMETRY: 1.0, REMOTE_SENSING: 0.8 }
      QC_PASS_MIN_SCORE: 70.00
      COMPLETENESS_MIN_PCT: 85.00
    precision: "ratios 4 decimals, qc_score 2 decimals, round_half_up"

  - name: verification_discrepancy
    trigger: "on POST /verifications/{verification_id}/opine"
    algorithm: threshold
    formula: |
      run = the Verification's QuantificationRun
      if restated_removals_t is omitted:
          material_discrepancy_pct = 0.00
      else if run.net_removals_t == 0.000:
          material_discrepancy_pct = 100.00 if restated_removals_t > 0 else 0.00
      else:
          material_discrepancy_pct = round_half_up(
              100 * abs(restated_removals_t - run.net_removals_t) / run.net_removals_t, 2)

      GATE (POSITIVE opinions only): material_discrepancy_pct <= MATERIAL_DISCREPANCY_MAX_PCT
            else ERR_MATERIAL_DISCREPANCY_EXCEEDED
            (equality PASSES; QUALIFIED and ADVERSE opinions are never gated)
    input_set: "the verifier's restated tonnage against the frozen run tonnage"
    constants:
      MATERIAL_DISCREPANCY_MAX_PCT: 5.00
    precision: "2 decimal places, round_half_up"

  - name: credit_issuance_split
    trigger: "on POST /quantification-runs/{quantification_run_id}/issue (CreditBatch creation)"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The tier basis looks circular — the risk tier
      # scales the buffer percentage, the buffer percentage decides how many
      # credits are actually issued, and issued credits feed the grower's
      # cumulative issuance which is what tiers are keyed on. The order below
      # breaks the loop and MUST NOT be re-entered:
      #
      #   step 1  gross_credits
      #   step 2  tier_basis      <- uses gross_credits, NOT issued_credits
      #   step 3  risk_tier, buffer_pct
      #   step 4  buffer_credits
      #   step 5  issued_credits
      #   step 6  serials, then Grower.lifetime_credits_issued += issued_credits
      #
      # Step 6 never re-triggers step 2 for this batch.

      step 1: gross_credits = floor(run.net_removals_t)          # 1 credit == 1 tCO2e

      step 2: tier_basis = Grower.lifetime_credits_issued + gross_credits
              # Grower.lifetime_credits_issued is read BEFORE step 6 updates it

      step 3: risk_tier = LOW    if tier_basis >= TIER_LOW_MIN_CREDITS
                          MEDIUM if tier_basis >= TIER_MEDIUM_MIN_CREDITS
                          HIGH   otherwise
              reversal_history_adder = REVERSAL_HISTORY_ADDER_PCT if Grower.reversal_count >= 1 else 0.0
              buffer_pct = min(BUFFER_PCT_CEILING,
                               round_half_up(std.buffer_base_pct
                                             + TIER_ADDER_PCT[risk_tier]
                                             + reversal_history_adder, 2))

      step 4: buffer_credits = ceil(gross_credits * buffer_pct / 100)

      step 5: issued_credits = gross_credits - buffer_credits
              # INVARIANT: gross_credits == buffer_credits + issued_credits, always

      step 6: serial_start = BufferAccount.next_serial_number
              serial_end   = serial_start + issued_credits - 1
              BufferAccount.next_serial_number += issued_credits
    input_set: "the run's frozen net_removals_t, the pinned PracticeStandard's buffer_base_pct, the grower's lifetime_credits_issued and reversal_count as they stand immediately before this issuance, and the buffer account's next_serial_number"
    constants:
      TIER_LOW_MIN_CREDITS: 5000
      TIER_MEDIUM_MIN_CREDITS: 1000
      TIER_ADDER_PCT: { LOW: 2.0, MEDIUM: 4.0, HIGH: 8.0 }
      REVERSAL_HISTORY_ADDER_PCT: 5.0
      BUFFER_PCT_CEILING: 25.00
    precision: "buffer_pct 2 decimals round_half_up; gross_credits uses floor; buffer_credits uses ceil; issued_credits is exact integer subtraction"

  - name: grower_payment_amount
    trigger: "on POST /enrollments/{enrollment_id}/accrue-payment (PER_ACRE) and on the CreditBatch creation cascade of POST /quantification-runs/{quantification_run_id}/issue (PER_CREDIT)"
    algorithm: waterfall_allocation
    formula: |
      elapsed_years   = current_crop_year - Enrollment.start_crop_year
      remaining_years = Enrollment.commitment_years - elapsed_years
      holdback_pct = HOLDBACK_LONG_PCT  if remaining_years >= HOLDBACK_LONG_MIN_YEARS
                     HOLDBACK_SHORT_PCT if remaining_years >= 1
                     0.00               otherwise

      variant PER_ACRE:
        payable_acres = Enrollment.enrolled_acres
        band_1_acres = min(payable_acres, BAND_1_CAP_ACRES)
        band_2_acres = max(0, min(payable_acres, BAND_2_CAP_ACRES) - BAND_1_CAP_ACRES)
        band_3_acres = max(0, payable_acres - BAND_2_CAP_ACRES)
        # ROUNDING ORDER IS PINNED: round EACH band line to whole cents FIRST,
        # THEN sum the rounded lines. Summing the raw products and rounding once
        # gives a different total and is WRONG.
        line_1 = round_half_up(band_1_acres * Enrollment.per_acre_rate_cents * BAND_1_MULTIPLIER, 0)
        line_2 = round_half_up(band_2_acres * Enrollment.per_acre_rate_cents * BAND_2_MULTIPLIER, 0)
        line_3 = round_half_up(band_3_acres * Enrollment.per_acre_rate_cents * BAND_3_MULTIPLIER, 0)
        gross_amount_cents = line_1 + line_2 + line_3

      variant PER_CREDIT:
        payable_acres = null
        gross_amount_cents = round_half_up(batch.issued_credits
                                           * Enrollment.per_credit_share_pct / 100
                                           * CREDIT_PRICE_CENTS, 0)

      holdback_cents   = round_half_up(gross_amount_cents * holdback_pct / 100, 0)
      net_amount_cents = gross_amount_cents - holdback_cents
    input_set: "for PER_ACRE, the enrollment's own enrolled_acres and per_acre_rate_cents plus the logical clock's crop year; for PER_CREDIT, the freshly minted batch's issued_credits and the enrollment's per_credit_share_pct"
    constants:
      BAND_1_CAP_ACRES: 500.00
      BAND_2_CAP_ACRES: 2000.00
      BAND_1_MULTIPLIER: 1.000
      BAND_2_MULTIPLIER: 0.925
      BAND_3_MULTIPLIER: 0.850
      CREDIT_PRICE_CENTS: 2750
      HOLDBACK_LONG_PCT: 20.00
      HOLDBACK_SHORT_PCT: 10.00
      HOLDBACK_LONG_MIN_YEARS: 3
    precision: "whole cents, round_half_up, applied per band line before summation"
    variants:
      - name: PER_ACRE
        when: "Enrollment.payment_model == PER_ACRE; accrued once per crop year by explicit admin action"
        difference: "amount is a three-band acreage waterfall independent of any credit issuance, and payable_acres is recorded on the payment"
      - name: PER_CREDIT
        when: "Enrollment.payment_model == PER_CREDIT; accrued automatically as a side effect of issuance"
        difference: "amount is a share of the batch's issued_credits at the fixed program credit price, payable_acres stays null, and credit_batch_id is populated"

  - name: reversal_assessment
    trigger: "on POST /reversal-events/{reversal_event_id}/assess"
    algorithm: waterfall_allocation
    formula: |
      batch = the ReversalEvent's CreditBatch
      enr   = batch's Enrollment
      affected_credits = min(batch.issued_credits,
                             ceil(batch.issued_credits * ReversalEvent.affected_acres
                                  / enr.enrolled_acres))

      if ReversalEvent.reversal_type == UNINTENTIONAL:
          buffer_draw_credits = min(BufferAccount.balance_credits, affected_credits)
      else:                                  # INTENTIONAL
          buffer_draw_credits = 0

      unbacked_credits = affected_credits - buffer_draw_credits
      grower_clawback_cents = round_half_up(unbacked_credits * CREDIT_PRICE_CENTS
                                            * clawback_share / 100, 0)
        where clawback_share = enr.per_credit_share_pct when enr.payment_model == PER_CREDIT
                               else FULL_CLAWBACK_SHARE_PCT
    input_set: "the batch's issued_credits, the enrollment's enrolled_acres and payment terms, and the buffer pool balance as it stands at assessment time"
    constants:
      CREDIT_PRICE_CENTS: 2750
      FULL_CLAWBACK_SHARE_PCT: 100.00
      CLAWBACK_SUSPENSION_THRESHOLD_CENTS: 250000
    precision: "affected_credits and buffer_draw_credits are integers (ceil then min); clawback in whole cents, round_half_up"
    variants:
      - name: UNINTENTIONAL
        when: "ReversalEvent.reversal_type == UNINTENTIONAL — fire, drought, flood"
        difference: "the buffer pool absorbs the loss up to its balance and the grower is only charged for the unbacked remainder"
      - name: INTENTIONAL
        when: "ReversalEvent.reversal_type == INTENTIONAL — the grower tilled the field or terminated the practice"
        difference: "the buffer pool is not touched at all, every affected credit is unbacked, and the whole quantity is clawed back from the grower"

  - name: contract_exit_fee
    trigger: "on POST /enrollments/{enrollment_id}/decide-exit with decision == APPROVE"
    algorithm: decay_function
    formula: |
      elapsed_years  = current_crop_year - Enrollment.start_crop_year
      served_ratio   = min(1, elapsed_years / Enrollment.commitment_years)
      settled_cents  = sum of GrowerPayment.net_amount_cents for this enrollment
                       over rows whose status == PAID
                       (ACCRUED, CLAWED_BACK and VOID rows are excluded)

      if Enrollment.exit_reason == FORCE_MAJEURE:
          exit_fee_cents = 0
      else if elapsed_years >= Enrollment.commitment_years:
          exit_fee_cents = 0
      else:
          exit_fee_cents = round_half_up(settled_cents * (1 - served_ratio), 0)
    input_set: "PAID payments on this enrollment only; the logical clock's crop year decides elapsed_years"
    constants:
      EXIT_NOTICE_MIN_YEARS: 1
    precision: "whole cents, round_half_up"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order;
#      the FIRST violated rule decides the response and no later rule runs)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (an empty-string header counts as absent); X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "every path-parameter resource exists, resolved strictly left-to-right; the leftmost missing segment decides the error (e.g. POST /growers/{grower_id}/fields with an unknown grower_id yields ERR_GROWER_NOT_FOUND even when the body is also malformed)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_GROWER_NOT_FOUND, ERR_FIELD_NOT_FOUND, ERR_PRACTICE_STANDARD_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_BASELINE_NOT_FOUND, ERR_DATA_PACKET_NOT_FOUND, ERR_QUANTIFICATION_RUN_NOT_FOUND, ERR_VERIFICATION_BODY_NOT_FOUND, ERR_VERIFICATION_NOT_FOUND, ERR_CREDIT_BATCH_NOT_FOUND, ERR_REVERSAL_EVENT_NOT_FOUND, ERR_GROWER_PAYMENT_NOT_FOUND, ERR_BUFFER_ACCOUNT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: auth
    check: "resource ownership. When the acting role is Grower, X-User-ID must equal the Grower.id that owns the addressed resource (transitively through Field / Enrollment / CreditBatch / GrowerPayment). When the acting role is Verifier, X-User-ID must equal the VerificationBody.id recorded on the addressed Verification. Ownership is checked AFTER existence so a Grower probing another grower's ids learns 403, not the resource's absence — and BEFORE state, so a Grower touching a foreign SUSPENDED enrollment still gets 403."
    error_id: ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "all Grower-accessible and Verifier-accessible endpoints"

  - priority: 5
    category: business_constraint
    check: "request body is well-formed: every required field present and non-null; enum fields carry a declared member; decimal fields are numbers within their declared scale; acreage, tonnage, percentage and cents fields are non-negative; percentage fields lie in [0, 100]; crop_year is an integer in [2000, 2100]; boundary_* are integers with boundary_max_x > boundary_min_x and boundary_max_y > boundary_min_y; instants are ISO-8601 UTC with a trailing Z"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST / PATCH endpoints"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row (practice_standard_id, field_id, baseline_id, quantification_run_id, verification_body_id, credit_batch_id, supersedes_batch_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /enrollments, POST /quantification-runs, POST /verifications, POST /reversal-events, POST /growers/{grower_id}/fields"

  - priority: 7
    category: state
    check: "the owning Grower is not SUSPENDED. A suspended grower may still read, but every write on that grower's fields, enrollments, data packets and exit requests is refused."
    error_id: ERR_GROWER_SUSPENDED
    http_status: 409
    applies_to: "all grower-scoped write endpoints"

  - priority: 8
    category: state
    check: "the acting VerificationBody is ACCREDITED (not SUSPENDED) at the moment of the write"
    error_id: ERR_VERIFICATION_BODY_SUSPENDED
    http_status: 409
    applies_to: "POST /verifications, POST /verifications/{verification_id}/start-visit, POST /verifications/{verification_id}/opine, POST /verifications/{verification_id}/resample"

  - priority: 9
    category: state
    check: "the addressed resource is in a state from which the requested transition is declared in §1.2, and the transition's own state preconditions on OTHER entities hold (e.g. quantification requires Enrollment.status == ACTIVE; issuance requires Verification.opinion == POSITIVE; listing requires issuance_status == ISSUED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: state
    check: "when the endpoint declares an expected_<parent>_version field (§1.2.1), the supplied value equals the parent's current version"
    error_id: "ERR_STALE_ENROLLMENT_VERSION | ERR_STALE_BATCH_VERSION"
    http_status: 412
    applies_to: "POST /enrollments/{enrollment_id}/baselines, POST /quantification-runs, POST /credit-batches/{credit_batch_id}/cancel"

  - priority: 11
    category: business_safety
    check: "segregation of duties. The ProgramAdmin X-User-ID that screened an enrollment must NOT be the one that approves its baseline, and the admin who reported a reversal event must NOT be the one who assesses it. Evaluated after the state precondition, so re-approving an already-APPROVED baseline yields ERR_INVALID_STATE_TRANSITION rather than the duties error even when the same admin repeats the call."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /baselines/{baseline_id}/approve, POST /reversal-events/{reversal_event_id}/assess"

  - priority: 12
    category: business_safety
    check: "the PracticeStandard pinned on the enrollment is ACTIVE (not RETIRED) and its effective_from crop year is <= Enrollment.start_crop_year"
    error_id: ERR_PRACTICE_STANDARD_RETIRED
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{enrollment_id}/submit, POST /enrollments/{enrollment_id}/resubmit"

  - priority: 13
    category: business_safety
    check: "the standard_version pinned on the enrollment still equals the referenced PracticeStandard.standard_version; a standard revised through POST /practice-standards/{practice_standard_id}/revise after enrollment blocks that enrollment's quantification and issuance for good (there is no re-pin action — the grower must re-enroll under the current version)"
    error_id: ERR_STANDARD_VERSION_MISMATCH
    http_status: 409
    applies_to: "POST /quantification-runs, POST /quantification-runs/{quantification_run_id}/issue"

  - priority: 14
    category: business_safety
    check: "additionality gates, evaluated in this cascading order — (a) documented_years >= PracticeStandard.min_documented_years, then (b) prior_adoption_pct <= PracticeStandard.max_prior_adoption_pct. Check (b) consumes the score produced while evaluating (a), so a field with too little history reports the history error even when its computed prior adoption would also have breached the ceiling."
    error_id: "ERR_INSUFFICIENT_PRACTICE_HISTORY | ERR_ADDITIONALITY_FAILED"
    http_status: 422
    applies_to: "POST /enrollments/{enrollment_id}/submit, POST /enrollments/{enrollment_id}/resubmit, POST /enrollments/{enrollment_id}/baselines"

  - priority: 15
    category: business_safety
    check: "commitment_years >= PracticeStandard.min_adoption_years and commitment_years <= MAX_COMMITMENT_YEARS (12); enrolled_acres <= Field.mapped_acres; enrolled_acres > 0"
    error_id: ERR_COMMITMENT_TERMS_INVALID
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 16
    category: business_temporal
    check: "the new Field's boundary rectangle must not overlap any existing non-SUSPENDED Field of the SAME grower with positive area. Touching edges and touching corners are permitted (zero-area intersection is not an overlap); a one-unit interior intrusion is."
    error_id: ERR_FIELD_BOUNDARY_OVERLAP
    http_status: 409
    applies_to: "POST /growers/{grower_id}/fields"

  - priority: 17
    category: business_temporal
    check: "commitment periods on one field must not overlap. The occupied interval of an enrollment is the half-open crop-year range [start_crop_year, start_crop_year + commitment_years); a new enrollment on the same field whose interval intersects a non-terminal enrollment's interval is refused, while an interval that begins exactly at the incumbent's end year is accepted. Evaluated BEFORE the cooldown rule at priority 18."
    error_id: ERR_COMMITMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 18
    category: business_temporal
    check: "after a TERMINATED enrollment, the same field may not be re-enrolled in the SAME practice_code until PRACTICE_COOLDOWN_YEARS (2) crop years have elapsed past terminated_effective_year; start_crop_year >= terminated_effective_year + 2 is required. A different practice_code is unaffected."
    error_id: ERR_PRACTICE_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 19
    category: business_temporal
    check: "verification workload. Counting only Verifications of this VerificationBody whose opinion is PENDING, the number whose closed site-visit interval [site_visit_start, site_visit_end] intersects the requested interval must be < max_concurrent_visits. Each visit is individually admissible; the aggregate is what fails. Shared endpoints count as intersecting."
    error_id: ERR_VERIFIER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /verifications, POST /verifications/{verification_id}/resample"

  - priority: 20
    category: business_referential
    check: "cross-entity linkage coherence: the baseline named on a quantification run belongs to the same enrollment and is APPROVED; the verification body's accredited_practices contains the enrollment's practice_code; a batch that names supersedes_batch_id must reference a batch of the same enrollment. Runs after the temporal rules, so a capacity-blocked verification by a non-accredited body reports the capacity error."
    error_id: "ERR_BASELINE_NOT_APPROVED | ERR_BASELINE_ENROLLMENT_MISMATCH | ERR_PRACTICE_NOT_ACCREDITED | ERR_SUPERSEDED_BATCH_MISMATCH"
    http_status: 422
    applies_to: "POST /quantification-runs, POST /verifications, POST /quantification-runs/{quantification_run_id}/issue"

  - priority: 21
    category: business_constraint
    check: "data sufficiency and quality thresholds: at least one PASSED DataPacket for the run's crop_year (ERR_NO_QUALIFYING_DATA); EQUIPMENT_TELEMETRY evidence present when the standard requires it (ERR_TELEMETRY_EVIDENCE_REQUIRED); MEASUREMENT mean_coverage_pct >= 60.00 (ERR_COVERAGE_BELOW_MINIMUM); qc_score >= 70.00 on a PASS decision (ERR_QC_SCORE_BELOW_THRESHOLD); material_discrepancy_pct <= 5.00 on a POSITIVE opinion (ERR_MATERIAL_DISCREPANCY_EXCEEDED); sample_pct >= PracticeStandard-independent floor of 5.00 (ERR_SAMPLE_TOO_SMALL)"
    error_id: "ERR_NO_QUALIFYING_DATA | ERR_TELEMETRY_EVIDENCE_REQUIRED | ERR_COVERAGE_BELOW_MINIMUM | ERR_QC_SCORE_BELOW_THRESHOLD | ERR_MATERIAL_DISCREPANCY_EXCEEDED | ERR_SAMPLE_TOO_SMALL"
    http_status: 422
    applies_to: "POST /quantification-runs, POST /data-packets/{data_packet_id}/qc, POST /verifications, POST /verifications/{verification_id}/opine"

  - priority: 22
    category: business_constraint
    check: "uniqueness: PracticeStandard.practice_code + standard_version is unique; one non-terminal Enrollment per (field_id, practice_code); one DataPacket per (enrollment_id, crop_year, source) that is not REJECTED; one QuantificationRun per (enrollment_id, crop_year) that is not REJECTED; at most one PROPOSED Baseline per (enrollment_id, method) — a proposal naming a DIFFERENT method supersedes the incumbent per §1.2 while a repeat of the same method is a duplicate; one PENDING Verification per quantification run; one ACCRUED GrowerPayment per (enrollment_id, crop_year, payment_model)"
    error_id: "ERR_DUPLICATE_STANDARD_VERSION | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_DATA_PACKET | ERR_DUPLICATE_QUANTIFICATION_RUN | ERR_DUPLICATE_BASELINE | ERR_DUPLICATE_VERIFICATION | ERR_DUPLICATE_PAYMENT"
    http_status: 409
    applies_to: "POST /practice-standards, POST /enrollments, POST /enrollments/{enrollment_id}/data-packets, POST /quantification-runs, POST /enrollments/{enrollment_id}/baselines, POST /verifications, POST /enrollments/{enrollment_id}/accrue-payment"

  - priority: 23
    category: business_temporal
    check: "exit notice window, both clauses carrying the same error_id: (a) requested_exit_year >= current crop year + EXIT_NOTICE_MIN_YEARS (1), so a mid-year request naming the current crop year is refused, and (b) current crop year - Enrollment.start_crop_year >= EXIT_NOTICE_MIN_YEARS (1), so an enrollment cannot file an exit inside its own first crop year"
    error_id: ERR_EXIT_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /enrollments/{enrollment_id}/request-exit"

  - priority: 24
    category: business_fiscal
    check: "buffer pool solvency: an issuance whose buffer contribution would leave balance_credits below required_reserve_credits (min_reserve_ratio * outstanding_issued_credits, rounded up) is refused; a pool already in DEFICIT refuses every issuance"
    error_id: ERR_BUFFER_POOL_DEFICIT
    http_status: 409
    applies_to: "POST /quantification-runs/{quantification_run_id}/issue"

  - priority: 25
    category: business_fiscal
    check: "settlement preconditions: a payment may only be marked PAID from ACCRUED; a grower with outstanding_clawback_cents > 0 cannot receive new payouts (ERR_CLAWBACK_OUTSTANDING); a batch may not be retired while a REPORTED or ASSESSED ReversalEvent references it (ERR_UNRESOLVED_REVERSAL); a superseding batch may not be listed while the superseded batch is still ISSUED (ERR_SUPERSEDED_BATCH_NOT_CANCELLED)"
    error_id: "ERR_CLAWBACK_OUTSTANDING | ERR_UNRESOLVED_REVERSAL | ERR_SUPERSEDED_BATCH_NOT_CANCELLED"
    http_status: 409
    applies_to: "POST /grower-payments/{grower_payment_id}/pay, POST /credit-batches/{credit_batch_id}/retire, POST /credit-batches/{credit_batch_id}/list"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   Path style: flat top-level collections under api_prefix "/". Every child
#   entity is discoverable from its parent through a filtered list endpoint
#   (`GET /<children>` carrying the FK as an optional query field), which is
#   the only discovery channel for cascade-created rows such as CreditBatch,
#   GrowerPayment and the auto-superseded Baseline.
# ---------------------------------------------------------------------------

endpoints:
  # --- test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every crop-year, deadline and site-visit comparison in this API reads instead of the wall clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (mandatory startup default); it never falls back to real wall-clock time. Crop year is derived as the calendar year of the logical clock instant."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, current_crop_year: integer }"
    side_effects: ["repositions the logical clock; no stored entity is mutated and no recalculation is triggered"]

  # --- growers ------------------------------------------------------------
  - method: POST
    path: "/growers"
    description: "Registers a grower. All five aggregate counters start at zero and status starts ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, operator_type, tax_id, mailing_state]
    output: Grower
    side_effects: ["initialises total_enrolled_acres 0.00, lifetime_credits_issued 0, net_paid_cents 0, outstanding_clawback_cents 0, reversal_count 0"]

  - method: GET
    path: "/growers"
    description: "Lists growers with optional filters and pagination."
    roles: [ProgramAdmin, RegistryOfficer]
    code: 200
    input: ["status?", "mailing_state?", "limit?", "offset?"]
    output: Grower[]
    side_effects: []

  - method: GET
    path: "/growers/{grower_id}"
    description: "Reads one grower including its live aggregate counters."
    roles: [ProgramAdmin, Grower, RegistryOfficer]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: GET
    path: "/growers/{grower_id}/ledger-summary"
    description: |
      Computed read reconciling the grower's credit and cash ledgers against the buffer pool.
      Every figure is derived at read time from rows that exist right now, so it is a
      cross-check on the stored aggregates rather than a copy of them:
        - lifetime_credits_issued  = Grower.lifetime_credits_issued as stored (cancelled batches
          have already been subtracted from it by the cancel compensation)
        - buffer_contributed_credits = sum of CreditBatch.buffer_credits over this grower's
          batches whose issuance_status == ISSUED (CANCELLED batches drop out)
        - accrued_total_cents      = sum of GrowerPayment.net_amount_cents over this grower's
          payments whose status == ACCRUED
        - paid_total_cents         = sum over status == PAID, which must equal Grower.net_paid_cents
        - clawed_back_total_cents  = sum over status == CLAWED_BACK
        - outstanding_clawback_cents = Grower.outstanding_clawback_cents as stored
      VOID payments are counted nowhere.
    roles: [ProgramAdmin, RegistryOfficer]
    code: 200
    input: []
    output: "{ grower_id: string, lifetime_credits_issued: integer, buffer_contributed_credits: integer, accrued_total_cents: integer, paid_total_cents: integer, clawed_back_total_cents: integer, outstanding_clawback_cents: integer }"
    side_effects: []

  - method: POST
    path: "/growers/{grower_id}/suspend"
    description: "Suspends a grower for programme non-compliance and cascades the suspension down to that grower's active enrollments and enrolled fields."
    roles: [ProgramAdmin]
    code: 200
    input: [suspension_reason]
    output: Grower
    side_effects:
      - "Grower.status ACTIVE -> SUSPENDED, suspension_reason stored"
      - "cascade hop 1: every Enrollment of this grower with status == ACTIVE moves to SUSPENDED"
      - "cascade hop 2: every Field carrying one of those enrollments moves ENROLLED -> SUSPENDED"
      - "increments Grower.version by 1"

  - method: POST
    path: "/growers/{grower_id}/reinstate"
    description: "Reinstates a suspended grower and restores exactly the enrollments and fields that its suspension moved, leaving terminal rows untouched."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Grower
    side_effects:
      - "Grower.status SUSPENDED -> ACTIVE, suspension_reason cleared to null"
      - "cascade hop 1: every SUSPENDED Enrollment of this grower returns to ACTIVE (EXITED / TERMINATED / REJECTED enrollments are NOT touched)"
      - "cascade hop 2: every SUSPENDED Field of this grower returns to ENROLLED"
      - "increments Grower.version by 1"

  # --- fields -------------------------------------------------------------
  - method: POST
    path: "/growers/{grower_id}/fields"
    description: "Registers a field under a grower from its integer boundary rectangle; mapped_acres is derived from the rectangle and the submitted gross_acres is retained only as the grower's own claim."
    roles: [ProgramAdmin, Grower]
    code: 201
    input: [field_name, boundary_min_x, boundary_min_y, boundary_max_x, boundary_max_y, gross_acres, soil_group, "county_code?"]
    output: Field
    side_effects:
      - "runs calculations.field_mapped_acres to derive mapped_acres"
      - "status starts DRAFT; surveyor_reference stays null"
      - "rejects a rectangle whose positive-area intersection with another non-SUSPENDED field of the same grower is non-empty (ERR_FIELD_BOUNDARY_OVERLAP)"

  - method: GET
    path: "/fields"
    description: "Lists fields, filterable by owning grower — the reverse-reachability channel for Field.grower_id."
    roles: [ProgramAdmin, Grower, RegistryOfficer]
    code: 200
    input: ["grower_id?", "status?", "soil_group?", "county_code?", "limit?", "offset?"]
    output: Field[]
    side_effects: []

  - method: GET
    path: "/fields/{field_id}"
    description: "Reads one field including derived mapped_acres."
    roles: [ProgramAdmin, Grower, RegistryOfficer]
    code: 200
    input: []
    output: Field
    side_effects: []

  - method: POST
    path: "/fields/{field_id}/map-confirm"
    description: "Confirms the surveyed boundary so the field becomes eligible for enrollment."
    roles: [ProgramAdmin]
    code: 200
    input: [surveyor_reference]
    output: Field
    side_effects:
      - "Field.status DRAFT -> MAPPED, surveyor_reference stored"
      - "increments Field.version by 1"

  # --- practice history ---------------------------------------------------
  - method: POST
    path: "/fields/{field_id}/practice-history"
    description: "Files one immutable historical crop-year practice record for a field. These rows are the sole evidence base for additionality screening and for HISTORICAL_DATA baselines."
    roles: [ProgramAdmin, Grower]
    code: 201
    input: [crop_year, practice_code, adopted, evidence_source, acres, "observed_emissions_per_acre?"]
    output: PracticeHistory
    side_effects: ["none — PracticeHistory is immutable and carries no version; it is read by calculations.additionality_screening and calculations.baseline_establishment"]

  - method: GET
    path: "/practice-history"
    description: "Lists historical practice records, filterable by field — the reverse-reachability channel for PracticeHistory.field_id."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: ["field_id?", "crop_year?", "practice_code?", "evidence_source?", "limit?", "offset?"]
    output: PracticeHistory[]
    side_effects: []

  - method: GET
    path: "/practice-history/{practice_history_id}"
    description: "Reads one historical practice record."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: []
    output: PracticeHistory
    side_effects: []

  # --- practice standards -------------------------------------------------
  - method: POST
    path: "/practice-standards"
    description: "Publishes a versioned methodology for one eligible practice (cover cropping, reduced tillage or nutrient management)."
    roles: [ProgramAdmin]
    code: 201
    input: [practice_code, standard_version, additionality_lookback_years, max_prior_adoption_pct, min_documented_years, min_adoption_years, uncertainty_base_pct, sequestration_rate_per_acre, modeled_baseline_rate_per_acre, buffer_base_pct, telemetry_required, effective_from]
    output: PracticeStandard
    side_effects: ["status starts ACTIVE", "rejects a duplicate practice_code + standard_version pair (ERR_DUPLICATE_STANDARD_VERSION)"]

  - method: GET
    path: "/practice-standards"
    description: "Lists published methodologies."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: ["practice_code?", "status?", "limit?", "offset?"]
    output: PracticeStandard[]
    side_effects: []

  - method: GET
    path: "/practice-standards/{practice_standard_id}"
    description: "Reads one methodology."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: PracticeStandard
    side_effects: []

  - method: POST
    path: "/practice-standards/{practice_standard_id}/retire"
    description: "Retires a methodology. Enrollments that already pinned it keep their pinned_standard_version and continue, but no new enrollment may cite it."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PracticeStandard
    side_effects:
      - "PracticeStandard.status ACTIVE -> RETIRED (terminal)"
      - "no Enrollment is modified — pinning is what protects in-flight enrollments"
      - "increments PracticeStandard.version by 1"

  - method: POST
    path: "/practice-standards/{practice_standard_id}/revise"
    description: "Publishes a methodology revision: the row stays ACTIVE and its standard_version advances by one. Enrollments keep the version they pinned, so their quantification and issuance are refused until they re-enroll under the current version."
    roles: [ProgramAdmin]
    code: 200
    input: [revision_note]
    output: PracticeStandard
    side_effects:
      - "PracticeStandard.standard_version += 1; status stays ACTIVE and every rate/threshold field is left untouched"
      - "no Enrollment row is rewritten — Enrollment.pinned_standard_version keeps its screening-era value"
      - "POST /quantification-runs and POST /quantification-runs/{quantification_run_id}/issue for enrollments pinned to the superseded version now fail with ERR_STANDARD_VERSION_MISMATCH"
      - "increments PracticeStandard.version by 1"

  # --- enrollments --------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Enrolls a MAPPED field in a practice standard under a multi-year commitment and a payment model. practice_code and pinned_standard_version are copied from the standard at this moment and never re-read."
    roles: [ProgramAdmin, Grower]
    code: 201
    input: [field_id, practice_standard_id, commitment_years, start_crop_year, enrolled_acres, payment_model, "per_acre_rate_cents?", "per_credit_share_pct?"]
    output: Enrollment
    side_effects:
      - "status starts DRAFT, permanence_status starts NOT_STARTED"
      - "grower_id, practice_code and pinned_standard_version are copied from the Field and the PracticeStandard"
      - "rejects a commitment-year interval [start_crop_year, start_crop_year + commitment_years) intersecting a non-terminal enrollment of the same field (ERR_COMMITMENT_PERIOD_OVERLAP)"
      - "rejects re-enrollment of the same practice_code inside the 2-crop-year cooldown after a TERMINATED enrollment (ERR_PRACTICE_COOLDOWN_ACTIVE)"

  - method: GET
    path: "/enrollments"
    description: "Lists enrollments, filterable by grower, field or standard — the reverse-reachability channel for Enrollment.grower_id, Enrollment.field_id and Enrollment.practice_standard_id."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: ["grower_id?", "field_id?", "practice_standard_id?", "status?", "permanence_status?", "payment_model?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{enrollment_id}"
    description: "Reads one enrollment including its screening scores and accrued payment total."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{enrollment_id}/submit"
    description: "Submits a draft enrollment for additionality screening. Screening arithmetic runs here, so a submission that fails either additionality gate never reaches SCREENING."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "runs calculations.additionality_screening, storing prior_adoption_pct, additionality_score and documented_years"
      - "Enrollment.status DRAFT -> SCREENING"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/request-info"
    description: "Returns a screening enrollment to the grower with a list of missing documentation items."
    roles: [ProgramAdmin]
    code: 200
    input: [missing_items]
    output: Enrollment
    side_effects:
      - "Enrollment.status SCREENING -> INFO_REQUESTED, missing_items stored"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/resubmit"
    description: "Resubmits an enrollment after the grower filed additional practice-history rows; screening arithmetic is recomputed over the enlarged evidence base."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "re-runs calculations.additionality_screening, overwriting prior_adoption_pct, additionality_score and documented_years"
      - "Enrollment.status INFO_REQUESTED -> SCREENING, missing_items cleared to null"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/screen"
    description: "Records the screening adjudication. The deciding ProgramAdmin's X-User-ID is retained and later bars that same admin from approving this enrollment's baseline."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Enrollment
    side_effects:
      - "decision ACCEPT: status SCREENING -> ACCEPTED"
      - "decision REJECT: status SCREENING -> REJECTED (terminal), rejection_reason stored"
      - "screening_decision_admin_id := X-User-ID"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/request-exit"
    description: "Files a contract exit request naming the intended exit crop year and the reason."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: [exit_reason, requested_exit_year]
    output: Enrollment
    side_effects:
      - "Enrollment.status ACTIVE -> EXIT_REQUESTED, exit_reason and requested_exit_year stored"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/decide-exit"
    description: "Adjudicates an exit request. An enrollment that has served its full commitment exits cleanly; one that has not is terminated with an exit fee, unenrolls its field and voids unpaid accruals. A DENY must carry rejection_reason."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Enrollment
    side_effects:
      - "decision DENY: status EXIT_REQUESTED -> ACTIVE, exit_reason and requested_exit_year cleared"
      - "decision APPROVE with elapsed_years >= commitment_years: status -> EXITED (terminal), exit_fee_cents 0, permanence_status stays IN_COMPLIANCE"
      - "decision APPROVE with elapsed_years < commitment_years: runs calculations.contract_exit_fee, status -> TERMINATED (terminal), permanence_status -> BREACHED, terminated_effective_year := current crop year"
      - "cascade hop 1: Field.status ENROLLED -> MAPPED and Grower.total_enrolled_acres -= Field.mapped_acres (both exit outcomes)"
      - "cascade hop 2: every ACCRUED GrowerPayment of this enrollment moves to VOID (TERMINATED only)"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{enrollment_id}/accrue-payment"
    description: "Accrues the PER_ACRE annual incentive for one crop year. PER_CREDIT enrollments never use this endpoint — their payments are accrued by the issuance cascade."
    roles: [ProgramAdmin]
    code: 201
    input: [crop_year]
    output: GrowerPayment
    side_effects:
      - "runs calculations.grower_payment_amount variant PER_ACRE"
      - "creates GrowerPayment with status ACCRUED, credit_batch_id null, payable_acres set"
      - "Enrollment.accrued_payment_cents += net_amount_cents"
      - "rejects a second ACCRUED payment for the same enrollment, crop_year and payment_model (ERR_DUPLICATE_PAYMENT)"

  # --- baselines ----------------------------------------------------------
  - method: POST
    path: "/enrollments/{enrollment_id}/baselines"
    description: "Proposes a baseline for an accepted enrollment, by either the grower's historical records or the programme model. A newer proposal supersedes any still-PROPOSED predecessor, so the caller must present the enrollment version it last observed."
    roles: [ProgramAdmin]
    code: 201
    input: [method, expected_enrollment_version]
    output: Baseline
    side_effects:
      - "runs calculations.baseline_establishment under the requested method variant"
      - "creates Baseline with status PROPOSED"
      - "any other PROPOSED Baseline on this enrollment (necessarily of the other method) moves to SUPERSEDED"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/baselines"
    description: "Lists baselines, filterable by enrollment — the reverse-reachability channel for Baseline.enrollment_id and the only way to observe an auto-SUPERSEDED proposal."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: ["enrollment_id?", "method?", "status?", "limit?", "offset?"]
    output: Baseline[]
    side_effects: []

  - method: GET
    path: "/baselines/{baseline_id}"
    description: "Reads one baseline including its uncertainty percentage."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: []
    output: Baseline
    side_effects: []

  - method: POST
    path: "/baselines/{baseline_id}/approve"
    description: "Approves a proposed baseline, which activates the enrollment, marks the field as enrolled and rolls the grower's enrolled acreage. The approving admin must not be the admin who screened the enrollment."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Baseline
    side_effects:
      - "Baseline.status PROPOSED -> APPROVED (terminal), approved_by_admin_id := X-User-ID"
      - "cascade hop 1: Enrollment.status ACCEPTED -> ACTIVE and permanence_status NOT_STARTED -> IN_COMPLIANCE"
      - "cascade hop 2: Field.status MAPPED -> ENROLLED"
      - "cascade hop 3: Grower.total_enrolled_acres += Field.mapped_acres"
      - "increments Baseline.version by 1"

  - method: POST
    path: "/baselines/{baseline_id}/reject"
    description: "Rejects a proposed baseline; the enrollment stays ACCEPTED and awaits a fresh proposal."
    roles: [ProgramAdmin]
    code: 200
    input: [rejection_note]
    output: Baseline
    side_effects:
      - "Baseline.status PROPOSED -> REJECTED (terminal), rejection_note stored"
      - "no cascade — the Enrollment, Field and Grower are untouched"
      - "increments Baseline.version by 1"

  # --- data packets -------------------------------------------------------
  - method: POST
    path: "/enrollments/{enrollment_id}/data-packets"
    description: "Files one crop-year observation from farm records, equipment telemetry or remote sensing. The quality score and the completeness axis are both derived on arrival."
    roles: [ProgramAdmin, Grower]
    code: 201
    input: [crop_year, source, reported_acres, coverage_pct, "measured_value?"]
    output: DataPacket
    side_effects:
      - "runs calculations.data_packet_qc_score, storing qc_score and completeness_status"
      - "qc_status starts PENDING, correction_count starts 0"

  - method: GET
    path: "/data-packets"
    description: "Lists data packets, filterable by enrollment — the reverse-reachability channel for DataPacket.enrollment_id."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: ["enrollment_id?", "crop_year?", "source?", "qc_status?", "completeness_status?", "limit?", "offset?"]
    output: DataPacket[]
    side_effects: []

  - method: GET
    path: "/data-packets/{data_packet_id}"
    description: "Reads one data packet with both of its independent status axes."
    roles: [ProgramAdmin, Grower, Verifier]
    code: 200
    input: []
    output: DataPacket
    side_effects: []

  - method: POST
    path: "/data-packets/{data_packet_id}/qc"
    description: "Records the quality-control decision on a pending packet. Only the qc axis moves; the completeness axis derived from coverage is left exactly as it stands."
    roles: [ProgramAdmin]
    code: 200
    input: [decision, "flag_reason?"]
    output: DataPacket
    side_effects:
      - "decision PASS: qc_status PENDING -> PASSED, gated on qc_score >= 70.00"
      - "decision FLAG: qc_status PENDING -> FLAGGED, flag_reason stored"
      - "completeness_status is NOT recomputed and NOT changed"
      - "increments DataPacket.version by 1"

  - method: POST
    path: "/data-packets/{data_packet_id}/correct"
    description: "Corrects a flagged packet's figures and returns it to the QC queue; the quality score and the completeness axis are both recomputed from the corrected values."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: ["reported_acres?", "coverage_pct?", "measured_value?"]
    output: DataPacket
    side_effects:
      - "re-runs calculations.data_packet_qc_score over the corrected values"
      - "qc_status FLAGGED -> PENDING, flag_reason cleared, correction_count += 1"
      - "completeness_status is re-derived and may move in either direction"
      - "increments DataPacket.version by 1"

  - method: POST
    path: "/data-packets/{data_packet_id}/reject"
    description: "Rejects a flagged packet permanently, removing it from every quantification input set."
    roles: [ProgramAdmin]
    code: 200
    input: ["flag_reason?"]
    output: DataPacket
    side_effects:
      - "qc_status FLAGGED -> REJECTED (terminal)"
      - "increments DataPacket.version by 1"

  # --- quantification runs ------------------------------------------------
  - method: POST
    path: "/quantification-runs"
    description: "Quantifies one crop year of an active enrollment against its approved baseline, by model or by measurement. A run freezes the tonnage figures it computes, so the caller must present the enrollment version it last observed."
    roles: [ProgramAdmin]
    code: 201
    input: [enrollment_id, baseline_id, crop_year, method, expected_enrollment_version]
    output: QuantificationRun
    side_effects:
      - "runs calculations.net_removals_quantification under the requested method variant, storing verified_acres, mean_coverage_pct, adoption_factor, sampling_uncertainty_pct, gross_removals_t, uncertainty_deduction_t, net_removals_t and packet_count"
      - "status starts DRAFT, revision_count starts 0"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/quantification-runs"
    description: "Lists quantification runs, filterable by enrollment or baseline — the reverse-reachability channel for QuantificationRun.enrollment_id and QuantificationRun.baseline_id."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: ["enrollment_id?", "baseline_id?", "crop_year?", "method?", "status?", "limit?", "offset?"]
    output: QuantificationRun[]
    side_effects: []

  - method: GET
    path: "/quantification-runs/{quantification_run_id}"
    description: "Reads one quantification run with its frozen tonnage figures."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: QuantificationRun
    side_effects: []

  - method: POST
    path: "/quantification-runs/{quantification_run_id}/submit"
    description: "Submits a draft run for third-party verification."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: QuantificationRun
    side_effects:
      - "QuantificationRun.status DRAFT -> SUBMITTED"
      - "increments QuantificationRun.version by 1"

  - method: POST
    path: "/quantification-runs/{quantification_run_id}/revise"
    description: "Reopens a run rejected by an adverse verification opinion and recomputes it over the data packets as they now stand."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: QuantificationRun
    side_effects:
      - "re-runs calculations.net_removals_quantification over the current PASSED packet set"
      - "QuantificationRun.status REJECTED -> DRAFT, revision_count += 1"
      - "increments QuantificationRun.version by 1"

  - method: POST
    path: "/quantification-runs/{quantification_run_id}/issue"
    description: "Mints a credit batch from a positively verified run, splitting the gross credits between the programme buffer pool and the grower's issued credits. May optionally supersede a cancelled batch of the same enrollment."
    roles: [ProgramAdmin]
    code: 201
    input: [vintage_year, "supersedes_batch_id?", "registry_account_ref?"]
    output: CreditBatch
    side_effects:
      - "runs calculations.credit_issuance_split in its pinned evaluation order, storing gross_credits, buffer_pct, buffer_credits, issued_credits, risk_tier, serial_start and serial_end"
      - "QuantificationRun.status VERIFIED -> ISSUED (terminal); CreditBatch starts issuance_status ISSUED x registry_status UNLISTED"
      - "cascade hop 1: BufferAccount.contributed_total += buffer_credits, balance_credits += buffer_credits, outstanding_issued_credits += issued_credits, next_serial_number += issued_credits, required_reserve_credits re-derived"
      - "cascade hop 2: Grower.lifetime_credits_issued += issued_credits (read BEFORE this hop by the tier basis) and Enrollment.credits_issued_total += issued_credits"
      - "cascade hop 3: for a PER_CREDIT enrollment, runs calculations.grower_payment_amount variant PER_CREDIT and creates an ACCRUED GrowerPayment naming this batch"
      - "cascade hop 4: Enrollment.accrued_payment_cents += that payment's net_amount_cents (PER_CREDIT only)"
      - "when supersedes_batch_id is supplied it must name a batch of the SAME enrollment (else ERR_SUPERSEDED_BATCH_MISMATCH); the new batch still starts UNLISTED and its later listing is what enforces ERR_SUPERSEDED_BATCH_NOT_CANCELLED"

  # --- verification bodies ------------------------------------------------
  - method: POST
    path: "/verification-bodies"
    description: "Accredits a third-party verification body for a set of practice codes with a concurrent site-visit ceiling."
    roles: [ProgramAdmin]
    code: 201
    input: [name, accreditation_id, accredited_practices, max_concurrent_visits]
    output: VerificationBody
    side_effects: ["status starts ACCREDITED"]

  - method: GET
    path: "/verification-bodies"
    description: "Lists accredited verification bodies."
    roles: [ProgramAdmin, Verifier, RegistryOfficer]
    code: 200
    input: ["status?", "practice_code?", "limit?", "offset?"]
    output: VerificationBody[]
    side_effects: []

  - method: GET
    path: "/verification-bodies/{verification_body_id}"
    description: "Reads one verification body."
    roles: [ProgramAdmin, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: VerificationBody
    side_effects: []

  - method: POST
    path: "/verification-bodies/{verification_body_id}/suspend"
    description: "Suspends a verification body's accreditation. Opinions already issued stand; no new verification work may be started."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: VerificationBody
    side_effects:
      - "VerificationBody.status ACCREDITED -> SUSPENDED"
      - "PENDING Verifications already assigned to this body are NOT cancelled, but every write on them is refused while the body is suspended"
      - "increments VerificationBody.version by 1"

  - method: POST
    path: "/verification-bodies/{verification_body_id}/reinstate"
    description: "Restores a suspended verification body's accreditation."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: VerificationBody
    side_effects:
      - "VerificationBody.status SUSPENDED -> ACCREDITED"
      - "increments VerificationBody.version by 1"

  # --- verifications ------------------------------------------------------
  - method: POST
    path: "/verifications"
    description: "Assigns a submitted run to an accredited verification body for a closed site-visit window. The body's concurrent-visit ceiling is enforced across its overlapping pending visits."
    roles: [ProgramAdmin]
    code: 201
    input: [quantification_run_id, verification_body_id, sample_pct, site_visit_start, site_visit_end]
    output: Verification
    side_effects:
      - "opinion starts PENDING, resample_count starts 0, material_discrepancy_pct starts 0.00"
      - "rejects a body whose accredited_practices lacks the enrollment's practice_code (ERR_PRACTICE_NOT_ACCREDITED)"
      - "rejects an assignment whose visit window intersects max_concurrent_visits or more PENDING visits of the same body (ERR_VERIFIER_CAPACITY_EXCEEDED)"

  - method: GET
    path: "/verifications"
    description: "Lists verifications, filterable by run or body — the reverse-reachability channel for Verification.quantification_run_id and Verification.verification_body_id."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: ["quantification_run_id?", "verification_body_id?", "opinion?", "limit?", "offset?"]
    output: Verification[]
    side_effects: []

  - method: GET
    path: "/verifications/{verification_id}"
    description: "Reads one verification including its computed material discrepancy."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: Verification
    side_effects: []

  - method: POST
    path: "/verifications/{verification_id}/start-visit"
    description: "Records the verifier's arrival on site by resetting site_visit_start to the current logical clock instant. The opinion axis does not move."
    roles: [Verifier]
    code: 200
    input: []
    output: Verification
    side_effects:
      - "site_visit_start := current logical clock instant; opinion stays PENDING"
      - "increments Verification.version by 1"

  - method: POST
    path: "/verifications/{verification_id}/opine"
    description: "Issues the verification opinion. A positive opinion is gated on the restated tonnage being within the material-discrepancy tolerance of the run's frozen figure; a qualified opinion sends the verification back for resampling; an adverse opinion rejects the run."
    roles: [Verifier]
    code: 200
    input: [opinion, "restated_removals_t?", "findings_note?"]
    output: Verification
    side_effects:
      - "runs calculations.verification_discrepancy, storing material_discrepancy_pct and restated_removals_t"
      - "opinion PENDING -> POSITIVE / QUALIFIED / ADVERSE, findings_note stored"
      - "cascade: POSITIVE moves QuantificationRun SUBMITTED -> VERIFIED; ADVERSE moves it SUBMITTED -> REJECTED; QUALIFIED leaves it SUBMITTED"
      - "increments Verification.version by 1"

  - method: POST
    path: "/verifications/{verification_id}/resample"
    description: "Reopens a qualified verification for a larger sample and a new site-visit window."
    roles: [Verifier]
    code: 200
    input: [sample_pct, site_visit_start, site_visit_end]
    output: Verification
    side_effects:
      - "opinion QUALIFIED -> PENDING, resample_count += 1, restated_removals_t and findings_note cleared, material_discrepancy_pct reset to 0.00"
      - "the new window is re-checked against the body's concurrent-visit ceiling"
      - "increments Verification.version by 1"

  # --- credit batches and registry ---------------------------------------
  - method: GET
    path: "/credit-batches"
    description: "Lists credit batches, filterable by enrollment, run or superseded predecessor — the reverse-reachability channel for CreditBatch.enrollment_id, CreditBatch.quantification_run_id and the self-referential CreditBatch.supersedes_batch_id, and the only discovery channel for a batch minted by the issuance cascade."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: ["enrollment_id?", "quantification_run_id?", "supersedes_batch_id?", "vintage_year?", "issuance_status?", "registry_status?", "risk_tier?", "limit?", "offset?"]
    output: CreditBatch[]
    side_effects: []

  - method: GET
    path: "/credit-batches/{credit_batch_id}"
    description: "Reads one credit batch with its serial range and both status axes."
    roles: [ProgramAdmin, Grower, Verifier, RegistryOfficer]
    code: 200
    input: []
    output: CreditBatch
    side_effects: []

  - method: POST
    path: "/credit-batches/{credit_batch_id}/list"
    description: "Lists an issued batch on the public registry under a registry account. Only the registry axis moves."
    roles: [RegistryOfficer]
    code: 200
    input: [registry_account_ref]
    output: CreditBatch
    side_effects:
      - "registry_status UNLISTED -> LISTED, registry_account_ref stored; issuance_status is NOT touched"
      - "refuses to list a superseding batch while its superseded predecessor is still issuance_status ISSUED (ERR_SUPERSEDED_BATCH_NOT_CANCELLED)"
      - "increments CreditBatch.version by 1"

  - method: POST
    path: "/credit-batches/{credit_batch_id}/retire"
    description: "Retires a listed batch on behalf of a named beneficiary, permanently removing the credits from circulation."
    roles: [RegistryOfficer]
    code: 200
    input: [retirement_beneficiary]
    output: CreditBatch
    side_effects:
      - "registry_status LISTED -> RETIRED (terminal), retirement_beneficiary stored; issuance_status stays ISSUED"
      - "BufferAccount.outstanding_issued_credits -= issued_credits and required_reserve_credits re-derived"
      - "refuses retirement while a REPORTED or ASSESSED ReversalEvent references the batch (ERR_UNRESOLVED_REVERSAL)"
      - "increments CreditBatch.version by 1"

  - method: POST
    path: "/credit-batches/{credit_batch_id}/cancel"
    description: "Cancels an issued batch and compensates every effect of its issuance except the serial counter. The caller must present the batch version it last observed."
    roles: [RegistryOfficer]
    code: 200
    input: [cancellation_reason, expected_credit_batch_version]
    output: CreditBatch
    side_effects:
      - "issuance_status ISSUED -> CANCELLED (terminal), cancellation_reason stored; the registry axis is left exactly where it was"
      - "compensation hop 1: BufferAccount.balance_credits -= buffer_credits, contributed_total -= buffer_credits, released_total += buffer_credits, outstanding_issued_credits -= issued_credits"
      - "compensation hop 2: Grower.lifetime_credits_issued -= issued_credits and Enrollment.credits_issued_total -= issued_credits"
      - "compensation hop 3: any ACCRUED GrowerPayment naming this batch moves to VOID and Enrollment.accrued_payment_cents -= its net_amount_cents"
      - "BufferAccount.next_serial_number is NOT rolled back — serials are never reused"
      - "increments CreditBatch.version by 1"

  # --- buffer pool --------------------------------------------------------
  - method: GET
    path: "/buffer-accounts"
    description: "Lists buffer pools. Exactly one pool, pool_code PROGRAM_BUFFER, is seeded at startup."
    roles: [ProgramAdmin, RegistryOfficer]
    code: 200
    input: ["pool_code?", "pool_status?", "limit?", "offset?"]
    output: BufferAccount[]
    side_effects: []

  - method: GET
    path: "/buffer-accounts/{buffer_account_id}"
    description: "Reads the buffer pool's balance, reserve requirement and serial counter."
    roles: [ProgramAdmin, RegistryOfficer]
    code: 200
    input: []
    output: BufferAccount
    side_effects: []

  # --- reversals ----------------------------------------------------------
  - method: POST
    path: "/reversal-events"
    description: "Reports a permanence reversal on an issued batch — intentional (practice abandoned) or unintentional (fire, drought, flood). Reporting computes nothing; assessment does."
    roles: [ProgramAdmin]
    code: 201
    input: [credit_batch_id, reversal_type, affected_acres, detected_crop_year]
    output: ReversalEvent
    side_effects:
      - "status starts REPORTED, reported_by_admin_id := X-User-ID, enrollment_id copied from the batch"
      - "affected_credits, buffer_draw_credits, unbacked_credits and grower_clawback_cents stay null until assessment"

  - method: GET
    path: "/reversal-events"
    description: "Lists reversal events, filterable by enrollment or batch — the reverse-reachability channel for ReversalEvent.enrollment_id and ReversalEvent.credit_batch_id."
    roles: [ProgramAdmin, Grower, RegistryOfficer]
    code: 200
    input: ["enrollment_id?", "credit_batch_id?", "reversal_type?", "status?", "limit?", "offset?"]
    output: ReversalEvent[]
    side_effects: []

  - method: GET
    path: "/reversal-events/{reversal_event_id}"
    description: "Reads one reversal event with its assessed quantities."
    roles: [ProgramAdmin, Grower, RegistryOfficer]
    code: 200
    input: []
    output: ReversalEvent
    side_effects: []

  - method: POST
    path: "/reversal-events/{reversal_event_id}/assess"
    description: "Assesses a reported reversal: sizes the loss in credits, draws the buffer pool for unintentional reversals only, suspends registry listings when the pool falls into deficit, breaches permanence and claws back unpaid accruals. The assessing admin must not be the admin who reported the event."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ReversalEvent
    side_effects:
      - "cascade hop 1: runs calculations.reversal_assessment; status REPORTED -> ASSESSED, assessed_by_admin_id := X-User-ID, Grower.reversal_count += 1"
      - "cascade hop 2: BufferAccount.balance_credits -= buffer_draw_credits, drawn_total += buffer_draw_credits, unbacked_reversal_credits += unbacked_credits"
      - "cascade hop 3: BufferAccount.pool_status becomes DEFICIT when balance_credits < required_reserve_credits"
      - "cascade hop 4: when the pool is in DEFICIT, EVERY batch programme-wide with registry_status LISTED moves to SUSPENDED — not only this grower's"
      - "cascade hop 5: every enrollment owning a newly registry-SUSPENDED batch moves permanence_status -> BREACHED"
      - "cascade hop 6: every ACCRUED GrowerPayment of those BREACHED enrollments moves to CLAWED_BACK, its Enrollment.accrued_payment_cents decreases by that payment's net_amount_cents, and Grower.outstanding_clawback_cents += ReversalEvent.grower_clawback_cents (booked once per reversal event, not once per payment)"
      - "cascade hop 7: Grower.status ACTIVE -> SUSPENDED when outstanding_clawback_cents >= CLAWBACK_SUSPENSION_THRESHOLD_CENTS (250000), which itself cascades to that grower's active enrollments and enrolled fields"
      - "increments ReversalEvent.version by 1"

  - method: POST
    path: "/reversal-events/{reversal_event_id}/resolve"
    description: "Closes an assessed reversal once remediation is documented, returning suspended listings to the registry when the pool is healthy again."
    roles: [ProgramAdmin]
    code: 200
    input: [resolution_note]
    output: ReversalEvent
    side_effects:
      - "status ASSESSED -> RESOLVED (terminal), resolution_note stored"
      - "every batch with registry_status SUSPENDED returns to LISTED only when BufferAccount.pool_status is HEALTHY; the reversed batch itself stays SUSPENDED"
      - "increments ReversalEvent.version by 1"

  # --- grower payments ----------------------------------------------------
  - method: GET
    path: "/grower-payments"
    description: "Lists grower payments, filterable by enrollment or batch — the reverse-reachability channel for GrowerPayment.enrollment_id and GrowerPayment.credit_batch_id, and the only discovery channel for a payment accrued by the issuance cascade."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: ["enrollment_id?", "credit_batch_id?", "crop_year?", "status?", "payment_model?", "limit?", "offset?"]
    output: GrowerPayment[]
    side_effects: []

  - method: GET
    path: "/grower-payments/{grower_payment_id}"
    description: "Reads one payment with its holdback breakdown."
    roles: [ProgramAdmin, Grower]
    code: 200
    input: []
    output: GrowerPayment
    side_effects: []

  - method: POST
    path: "/grower-payments/{grower_payment_id}/pay"
    description: "Settles an accrued payment. Refused while the grower carries an outstanding clawback balance."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: GrowerPayment
    side_effects:
      - "status ACCRUED -> PAID (terminal), paid_at := current logical clock instant"
      - "Grower.net_paid_cents += net_amount_cents"
      - "refused when Grower.outstanding_clawback_cents > 0 (ERR_CLAWBACK_OUTSTANDING)"
      - "increments GrowerPayment.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # --- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty or carrying an unrecognised role name"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint (e.g. a Grower calling POST /baselines/{baseline_id}/approve, a Verifier calling POST /credit-batches/{credit_batch_id}/list, a RegistryOfficer calling POST /reversal-events)"
  - id: ERR_RESOURCE_NOT_OWNED
    http: 403
    condition: "an acting Grower addresses a resource belonging to another grower, or an acting Verifier addresses a Verification assigned to another verification body"

  # --- existence ---------------------------------------------------------
  - id: ERR_GROWER_NOT_FOUND
    http: 404
    condition: "grower_id in the path or body matches no grower"
  - id: ERR_FIELD_NOT_FOUND
    http: 404
    condition: "field_id in the path or body matches no field"
  - id: ERR_PRACTICE_HISTORY_NOT_FOUND
    http: 404
    condition: "practice_history_id in the path matches no historical practice record"
  - id: ERR_PRACTICE_STANDARD_NOT_FOUND
    http: 404
    condition: "practice_standard_id in the path or body matches no methodology"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id in the path or body matches no enrollment"
  - id: ERR_BASELINE_NOT_FOUND
    http: 404
    condition: "baseline_id in the path or body matches no baseline"
  - id: ERR_DATA_PACKET_NOT_FOUND
    http: 404
    condition: "data_packet_id in the path matches no data packet"
  - id: ERR_QUANTIFICATION_RUN_NOT_FOUND
    http: 404
    condition: "quantification_run_id in the path or body matches no quantification run"
  - id: ERR_VERIFICATION_BODY_NOT_FOUND
    http: 404
    condition: "verification_body_id in the path or body matches no verification body"
  - id: ERR_VERIFICATION_NOT_FOUND
    http: 404
    condition: "verification_id in the path matches no verification"
  - id: ERR_CREDIT_BATCH_NOT_FOUND
    http: 404
    condition: "credit_batch_id in the path or body (including supersedes_batch_id) matches no credit batch"
  - id: ERR_BUFFER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "buffer_account_id in the path matches no buffer pool"
  - id: ERR_REVERSAL_EVENT_NOT_FOUND
    http: 404
    condition: "reversal_event_id in the path matches no reversal event"
  - id: ERR_GROWER_PAYMENT_NOT_FOUND
    http: 404
    condition: "grower_payment_id in the path matches no payment"

  # --- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or null, an enum field carries an undeclared member, a numeric field is negative or out of its declared range, a percentage exceeds 100, a boundary rectangle is degenerate or inverted, or an instant is not ISO-8601 UTC"

  # --- state / concurrency ----------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the resource's current state — repeating a completed action, acting on a terminal row, mapping an already-MAPPED field, quantifying a non-ACTIVE enrollment, issuing from a run that is not VERIFIED, listing an UNLISTED-only action twice, correcting a packet that is not FLAGGED, resampling a verification that is not QUALIFIED"
  - id: ERR_GROWER_SUSPENDED
    http: 409
    condition: "a write is attempted on a resource whose owning grower is SUSPENDED"
  - id: ERR_VERIFICATION_BODY_SUSPENDED
    http: 409
    condition: "a verification write is attempted while the assigned verification body's accreditation is SUSPENDED"
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not equal the enrollment's current version on POST /enrollments/{enrollment_id}/baselines or POST /quantification-runs"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_credit_batch_version does not equal the batch's current version on POST /credit-batches/{credit_batch_id}/cancel"

  # --- programme safety / compliance ------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting ProgramAdmin's X-User-ID equals the enrollment's screening_decision_admin_id on baseline approval, or the reversal event's reported_by_admin_id on assessment"
  - id: ERR_PRACTICE_STANDARD_RETIRED
    http: 409
    condition: "the enrollment cites a RETIRED methodology, or one whose effective_from crop year is later than start_crop_year"
  - id: ERR_STANDARD_VERSION_MISMATCH
    http: 409
    condition: "the enrollment's pinned_standard_version no longer equals the referenced PracticeStandard.standard_version at quantification or issuance time"
  - id: ERR_INSUFFICIENT_PRACTICE_HISTORY
    http: 422
    condition: "documented_years is below PracticeStandard.min_documented_years at screening, or no admissible FARM_RECORD / EQUIPMENT_TELEMETRY row exists in the lookback window at baseline creation"
  - id: ERR_ADDITIONALITY_FAILED
    http: 422
    condition: "prior_adoption_pct strictly exceeds PracticeStandard.max_prior_adoption_pct — the practice was already business-as-usual on this field"
  - id: ERR_COMMITMENT_TERMS_INVALID
    http: 422
    condition: "commitment_years below the methodology's min_adoption_years or above 12, enrolled_acres above the field's mapped_acres, or enrolled_acres not positive"

  # --- temporal / capacity ----------------------------------------------
  - id: ERR_FIELD_BOUNDARY_OVERLAP
    http: 409
    condition: "the new field's boundary rectangle shares positive area with another non-SUSPENDED field of the same grower (touching edges and corners are permitted)"
  - id: ERR_COMMITMENT_PERIOD_OVERLAP
    http: 409
    condition: "the new enrollment's half-open crop-year interval intersects a non-terminal enrollment's interval on the same field"
  - id: ERR_PRACTICE_COOLDOWN_ACTIVE
    http: 409
    condition: "the field is re-enrolled in the same practice_code fewer than 2 crop years after a TERMINATED enrollment's terminated_effective_year"
  - id: ERR_VERIFIER_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested site-visit window intersects max_concurrent_visits or more PENDING visits already booked with the same verification body"
  - id: ERR_EXIT_WINDOW_NOT_OPEN
    http: 422
    condition: "requested_exit_year is earlier than the current crop year plus the one-year notice period"

  # --- referential coherence --------------------------------------------
  - id: ERR_BASELINE_NOT_APPROVED
    http: 422
    condition: "the baseline named on a quantification run is PROPOSED, REJECTED or SUPERSEDED rather than APPROVED"
  - id: ERR_BASELINE_ENROLLMENT_MISMATCH
    http: 422
    condition: "the baseline named on a quantification run belongs to a different enrollment"
  - id: ERR_PRACTICE_NOT_ACCREDITED
    http: 422
    condition: "the verification body's accredited_practices does not contain the enrollment's practice_code"
  - id: ERR_SUPERSEDED_BATCH_MISMATCH
    http: 422
    condition: "supersedes_batch_id names a batch belonging to a different enrollment"
  - id: ERR_SUPERSEDED_BATCH_NOT_CANCELLED
    http: 409
    condition: "a superseding batch is listed on the registry while its superseded predecessor still has issuance_status ISSUED"

  # --- data sufficiency / quality ---------------------------------------
  - id: ERR_NO_QUALIFYING_DATA
    http: 422
    condition: "no PASSED DataPacket exists for the run's enrollment and crop_year, or under the MEASUREMENT variant no PASSED packet carries an admissible EQUIPMENT_TELEMETRY / REMOTE_SENSING source"
  - id: ERR_TELEMETRY_EVIDENCE_REQUIRED
    http: 422
    condition: "the methodology sets telemetry_required but the qualifying packet set contains no EQUIPMENT_TELEMETRY source"
  - id: ERR_COVERAGE_BELOW_MINIMUM
    http: 422
    condition: "a MEASUREMENT run's mean_coverage_pct is below 60.00"
  - id: ERR_QC_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "a PASS quality decision is attempted on a packet whose qc_score is below 70.00"
  - id: ERR_SAMPLE_TOO_SMALL
    http: 422
    condition: "sample_pct below 5.00 on verification assignment or resampling"
  - id: ERR_MATERIAL_DISCREPANCY_EXCEEDED
    http: 422
    condition: "a POSITIVE opinion restates the run's net removals by more than 5.00 percent"

  # --- uniqueness --------------------------------------------------------
  - id: ERR_DUPLICATE_STANDARD_VERSION
    http: 409
    condition: "a methodology with the same practice_code and standard_version already exists"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "a non-terminal enrollment for the same field and practice_code already exists"
  - id: ERR_DUPLICATE_DATA_PACKET
    http: 409
    condition: "a non-REJECTED packet for the same enrollment, crop_year and source already exists"
  - id: ERR_DUPLICATE_QUANTIFICATION_RUN
    http: 409
    condition: "a non-REJECTED quantification run for the same enrollment and crop_year already exists"
  - id: ERR_DUPLICATE_BASELINE
    http: 409
    condition: "a PROPOSED Baseline naming the SAME method already exists on this enrollment; a proposal naming the other method is a legitimate supersede, not a duplicate"
  - id: ERR_DUPLICATE_VERIFICATION
    http: 409
    condition: "a PENDING verification for the same quantification run already exists"
  - id: ERR_DUPLICATE_PAYMENT
    http: 409
    condition: "an ACCRUED payment for the same enrollment, crop_year and payment_model already exists"

  # --- fiscal / settlement ----------------------------------------------
  - id: ERR_BUFFER_POOL_DEFICIT
    http: 409
    condition: "issuance would leave BufferAccount.balance_credits below required_reserve_credits, or the pool is already in DEFICIT"
  - id: ERR_CLAWBACK_OUTSTANDING
    http: 409
    condition: "a payment is settled while the grower's outstanding_clawback_cents is above zero"
  - id: ERR_UNRESOLVED_REVERSAL
    http: 409
    condition: "a batch is retired while a REPORTED or ASSESSED reversal event references it"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
#   The programme separates who screens from who approves, who reports a
#   reversal from who assesses it, and keeps registry custody (listing,
#   retirement, cancellation) out of the hands of the programme staff who
#   mint the credits.
# ---------------------------------------------------------------------------

roles:
  - name: ProgramAdmin
    description: "Programme administration staff: registry of growers and methodologies, screening, baseline adjudication, quality control, quantification, verification assignment, reversal handling and payment settlement. Two distinct X-User-ID values are required to walk one enrollment from screening to baseline approval, and two more to report and then assess a reversal."
    identity: "opaque"
    exclusive_operations:
      - "POST /growers"
      - "POST /growers/{grower_id}/suspend"
      - "POST /growers/{grower_id}/reinstate"
      - "POST /fields/{field_id}/map-confirm"
      - "POST /practice-standards"
      - "POST /practice-standards/{practice_standard_id}/retire"
      - "POST /practice-standards/{practice_standard_id}/revise"
      - "POST /enrollments/{enrollment_id}/screen"
      - "POST /enrollments/{enrollment_id}/request-info"
      - "POST /enrollments/{enrollment_id}/decide-exit"
      - "POST /enrollments/{enrollment_id}/accrue-payment"
      - "POST /enrollments/{enrollment_id}/baselines"
      - "POST /baselines/{baseline_id}/approve"
      - "POST /baselines/{baseline_id}/reject"
      - "POST /data-packets/{data_packet_id}/qc"
      - "POST /data-packets/{data_packet_id}/reject"
      - "POST /quantification-runs"
      - "POST /quantification-runs/{quantification_run_id}/submit"
      - "POST /quantification-runs/{quantification_run_id}/revise"
      - "POST /quantification-runs/{quantification_run_id}/issue"
      - "POST /verification-bodies"
      - "POST /verification-bodies/{verification_body_id}/suspend"
      - "POST /verification-bodies/{verification_body_id}/reinstate"
      - "POST /verifications"
      - "POST /reversal-events"
      - "POST /reversal-events/{reversal_event_id}/assess"
      - "POST /reversal-events/{reversal_event_id}/resolve"
      - "POST /grower-payments/{grower_payment_id}/pay"
      - "GET /growers/{grower_id}/ledger-summary"
    shared_operations:
      - "POST /growers/{grower_id}/fields"
      - "POST /fields/{field_id}/practice-history"
      - "POST /enrollments"
      - "POST /enrollments/{enrollment_id}/submit"
      - "POST /enrollments/{enrollment_id}/resubmit"
      - "POST /enrollments/{enrollment_id}/request-exit"
      - "POST /enrollments/{enrollment_id}/data-packets"
      - "POST /data-packets/{data_packet_id}/correct"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: Grower
    description: "The enrolled agricultural operator. Acts only on its own fields, enrollments, data packets and payments; X-User-ID is the Grower row's id. May file evidence and request an exit but may never screen, approve, quality-control, quantify or settle."
    identity: "entity_backed:Grower"
    exclusive_operations: []
    shared_operations:
      - "POST /growers/{grower_id}/fields"
      - "POST /fields/{field_id}/practice-history"
      - "POST /enrollments"
      - "POST /enrollments/{enrollment_id}/submit"
      - "POST /enrollments/{enrollment_id}/resubmit"
      - "POST /enrollments/{enrollment_id}/request-exit"
      - "POST /enrollments/{enrollment_id}/data-packets"
      - "POST /data-packets/{data_packet_id}/correct"
      - "POST /_clock/set_current_utc"
      - "GET on its own growers, fields, practice-history, enrollments, baselines, data-packets, quantification-runs, verifications, credit-batches, reversal-events and grower-payments"

  - name: Verifier
    description: "An accredited third-party verification body. X-User-ID is the VerificationBody row's id. Conducts site visits and issues the opinion that gates issuance; cannot assign itself work, quantify, issue or touch the registry."
    identity: "entity_backed:VerificationBody"
    exclusive_operations:
      - "POST /verifications/{verification_id}/start-visit"
      - "POST /verifications/{verification_id}/opine"
      - "POST /verifications/{verification_id}/resample"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /practice-history"
      - "GET /practice-standards"
      - "GET /enrollments"
      - "GET /baselines"
      - "GET /data-packets"
      - "GET /quantification-runs"
      - "GET /verifications"
      - "GET /verification-bodies"
      - "GET /credit-batches"

  - name: RegistryOfficer
    description: "Registry custodian, organisationally separate from programme administration. Holds sole custody of listing, retirement and cancellation of issued batches and reads the buffer pool; may not mint credits, screen enrollments or settle payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /credit-batches/{credit_batch_id}/list"
      - "POST /credit-batches/{credit_batch_id}/retire"
      - "POST /credit-batches/{credit_batch_id}/cancel"
    shared_operations:
      - "POST /_clock/set_current_utc"
