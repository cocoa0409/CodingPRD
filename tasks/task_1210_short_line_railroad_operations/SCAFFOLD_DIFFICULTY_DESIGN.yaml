            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Rustbelt Siding", capacity_cars: 8, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/industry-sidings/${sid_id}/suspend"
              payload: {}
              as: SystemAdmin
            - call: "PATCH /rail/customers/${cust_id}"
              payload: { credit_status: SUSPENDED }
              as: SystemAdmin
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 2, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
