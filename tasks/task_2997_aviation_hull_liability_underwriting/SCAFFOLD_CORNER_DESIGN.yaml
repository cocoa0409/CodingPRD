            - "Trigger call 5 returns 409 with data.error_id == 'ERR_DECLARATION_NOT_SUBMITTED' — ACCEPTED is terminal in both directions, so a reject cannot chase an accept"
            - "Trigger call 6 returns 422 with data.error_id == 'ERR_DECLARATION_PERIOD_INVALID' — period_to 2027-09-05 falls outside the policy term even though the period does not overlap any existing declaration"
            - "Trigger call 7 returns 201 with status == 'SUBMITTED' — 2026-10-01 to 2026-10-31 neither touches D1's period nor escapes the term, which is the positive control for both halves of the rule"
            - "Trigger call 8 shows written_premium_cents == 1183377: none of the four refusals moved the ledger and the newly submitted D2 has not either"
      - name: corner_perils_scope_not_offered_by_the_market_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_PERILS_NOT_OFFERED]
          - calculations.war_risk_premium
          - calculations.market_line_occupancy
        distinguishing_aspect: "Peril appetite is a property of the market row, not of the policy or of the peril hierarchy: a market that offers WAR_ONLY refuses WAR_HIJACK even though hijacking is the strictly wider cover the insured would pay more for, and the identical request is accepted against a second market whose perils_offered list contains it — so the check is list membership, never subsumption."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z. One operator and one DRAFT FLEET policy, WORLDWIDE, term 2026-09-01 to 2027-09-01 (a war slip is the single write a DRAFT policy accepts under validations[priority=12])."
            - "Market M1 'Lime Street War Syndicate 4412' with aggregate_line_cents 1000000000 and perils_offered exactly ['WAR_ONLY']."
            - "Market M2 'Zurich Political Violence Pool' with aggregate_line_cents 1000000000 and perils_offered ['WAR_ONLY', 'WAR_HIJACK']."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Cascade Charter Group", operator_type: "CHARTER", home_base_icao: "KPDX" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/war-markets"
              payload: { market_name: "Lime Street War Syndicate 4412", aggregate_line_cents: 1000000000, perils_offered: ["WAR_ONLY"] }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { m1_id: $.data.id }
            - call: "POST /aviation/war-markets"
              payload: { market_name: "Zurich Political Violence Pool", aggregate_line_cents: 1000000000, perils_offered: ["WAR_ONLY", "WAR_HIJACK"] }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { m2_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, permitted_use_classes: ["PRIVATE", "BUSINESS"] }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
          trigger:
            - call: "POST /aviation/war-placements"
              payload: { policy_id: "${pol_id}", market_id: "${m1_id}", war_hull_line_cents: 200000000, perils_scope: "WAR_HIJACK", coverage_from: "2026-09-01T00:00:00Z", coverage_to: "2026-10-01T00:00:00Z", expected_policy_version: "${pol_v0}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { err_hijack_not_offered: $.data.error_id }
            - call: "POST /aviation/war-placements"
              payload: { policy_id: "${pol_id}", market_id: "${m1_id}", war_hull_line_cents: 200000000, perils_scope: "WAR_HIJACK_TERRORISM", coverage_from: "2026-09-01T00:00:00Z", coverage_to: "2026-10-01T00:00:00Z", expected_policy_version: "${pol_v0}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { err_terrorism_not_offered: $.data.error_id }
            - call: "POST /aviation/war-placements"
              payload: { policy_id: "${pol_id}", market_id: "${m1_id}", war_hull_line_cents: 200000000, perils_scope: "WAR_ONLY", coverage_from: "2026-09-01T00:00:00Z", coverage_to: "2026-10-01T00:00:00Z", expected_policy_version: "${pol_v0}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pl1_id: $.data.id }
            - call: "GET /aviation/policies/${pol_id}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_v1: $.data.version }
            - call: "POST /aviation/war-placements"
              payload: { policy_id: "${pol_id}", market_id: "${m2_id}", war_hull_line_cents: 500000000, perils_scope: "WAR_HIJACK", coverage_from: "2026-10-02T00:00:00Z", coverage_to: "2027-09-01T00:00:00Z", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pl2_id: $.data.id }
            - call: "GET /aviation/war-markets/${m1_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /aviation/war-markets/${m2_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Trigger call 1 returns 422 with data.error_id == 'ERR_PERILS_NOT_OFFERED' — 'WAR_HIJACK' is not a member of M1.perils_offered, and the fact that WAR_HIJACK is a superset of WAR_ONLY buys no admission"
            - "Trigger call 2 returns 422 with data.error_id == 'ERR_PERILS_NOT_OFFERED'"
            - "After trigger calls 1 and 2: WarRiskMarket.${m1_id}.committed_line_cents == 0 and available_line_cents == 1000000000, Policy.${pol_id}.written_premium_cents == 0 and Policy.${pol_id}.version == ${pol_v0} — a refused placement neither reserves capacity nor bumps the version that the next attempt must quote"
            - "Trigger call 3 returns 201 with status == 'BOUND' and premium_cents == 375000: floor(200000000 * 1500 / 1000000) == 300000 then ceil(300000 * 1250000 / 1000000) == 375000"
            - "Trigger call 4 shows Policy.${pol_id}.status still == 'DRAFT' with written_premium_cents == 375000 and version == ${pol_v0} + 1 — the war slip is the one write a DRAFT policy accepts"
            - "Trigger call 5 returns 201 with premium_cents == 1500000: floor(500000000 * 2400 / 1000000) == 1200000 then ceil(1200000 * 1250000 / 1000000) == 1500000. The very perils_scope refused in trigger call 1 succeeds here because M2 offers it, and its closed window 2026-10-02 to 2027-09-01 neither touches nor overlaps ${pl1_id}'s closed [2026-09-01, 2026-10-01], so validations[priority=29] does not fire"
            - "Trigger call 6 shows M1 committed_line_cents == 200000000 and available_line_cents == 800000000; trigger call 7 shows M2 committed_line_cents == 500000000 and available_line_cents == 500000000 — each market's occupancy counts only its own placements"
            - "Policy.${pol_id}.written_premium_cents == 1875000 (375000 + 1500000) after trigger call 5, so both WAR_RISK_PREMIUM rows are on the one policy ledger even though they sit in two different markets"

