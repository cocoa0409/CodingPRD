            - call: "POST /tower-colo/modification-projects/${op_proj_id}/allocate-cost-shares"
              payload: {}
              as: StructuralEngineer
              as_user_id: "eng-1"
              captures: { op_pv1: $.data.version }
          trigger:
            - call: "POST /tower-colo/modification-projects/${op_proj_id}/reallocate-cost-shares"
              payload: { expected_modification_project_version: "${op_pv1}", allocation_basis: "EQUAL_SHARE" }
              as: StructuralEngineer
              as_user_id: "eng-1"
            - call: "POST /tower-colo/modification-projects/${op_proj_id}/reallocate-cost-shares"
              payload: { expected_modification_project_version: "${op_pv1}", allocation_basis: "PRO_RATA_LOAD" }
              as: StructuralEngineer
              as_user_id: "eng-1"
          assert:
            - "trigger call 1 returns 200 with allocation_basis == EQUAL_SHARE and allocated_cents == 1120000"
            - "trigger call 2 returns 412 with error_id == ERR_STALE_PROJECT_VERSION"
            - "ModificationProject.${op_proj_id}.allocation_basis == EQUAL_SHARE"
            - "ModificationProject.${op_proj_id}.status == COST_ALLOCATED"
            - "GET /tower-colo/cost-shares with modification_project_id ${op_proj_id} and status PENDING returns total_count == 1"
            - "GET /tower-colo/cost-shares with modification_project_id ${op_proj_id} and status VOIDED returns total_count == 1"

      - name: tower_version_increments_on_every_declared_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Tower.fields.version
          - endpoints.POST_/tower-colo/ground-leases
          - endpoints.POST_/tower-colo/structural-analyses
          - endpoints.POST_/tower-colo/site-amendments/{id}/execute
        distinguishing_aspect: |
          Only the writes that declare the side effect move the counter: the tower is created at
          version 1, the ground lease takes it to 2, the analysis to 3 and the amendment execution to
          4, while application submit and amendment creation — which touch no tower field — leave it
          untouched.
        test_recipe:
          setup:
            - "Tower VRS is created first and observed after each write in the chain."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Version Rise Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { vr_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Version Ridge Land", remit_contact_email: "ap@versionridge.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { vr_ll_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Version Rise Radio", carrier_code: "VRS" }
              as: PortfolioAdmin
              captures: { vr_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${vr_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { vr_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${vr_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "GET /tower-colo/towers/${vr_t_id}"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${vr_t_id}", landlord_id: "${vr_ll_id}", base_monthly_rent_cents: 300000, escalator_pct: 2.0, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 9000000 }
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${vr_t_id}", master_lease_agreement_id: "${vr_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 300 }
              as: Tenant
              as_user_id: "${vr_ten_id}"
              captures: { vr_app_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${vr_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "VR-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${vr_ten_id}"
            - call: "POST /tower-colo/colocation-applications/${vr_app_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${vr_ten_id}"
            - call: "GET /tower-colo/towers/${vr_t_id}"
              payload: {}
              as: PortfolioAdmin
              captures: { vr_v2: $.data.version }
            - call: "POST /tower-colo/structural-analyses"
              payload: { colocation_application_id: "${vr_app_id}", variant: "PRELIMINARY", expected_tower_version: "${vr_v2}" }
              as: StructuralEngineer
              as_user_id: "eng-1"
            - call: "POST /tower-colo/colocation-applications/${vr_app_id}/approve"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/site-amendments"
              payload: { master_lease_agreement_id: "${vr_mla_id}", tower_id: "${vr_t_id}", colocation_application_id: "${vr_app_id}", effective_date: "2026-08-01", term_end_date: "2031-05-31", base_monthly_rent_cents: 200000, escalator_pct: 3.0 }
              as: PortfolioAdmin
              captures: { vr_am_id: $.data.id }
            - call: "GET /tower-colo/towers/${vr_t_id}"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/site-amendments/${vr_am_id}/execute"
              payload: { signature_received: true }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers/${vr_t_id}"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns version == 1"
            - "trigger call 6 returns version == 2 (ground lease created; submit did not move it)"
            - "trigger call 10 returns version == 3 (analysis created; amendment creation did not move it)"
            - "trigger call 12 returns version == 4 and reserved_load_units == 500.0"

      - name: application_total_load_reconciles_after_line_add_and_delete
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ColocationApplication.fields.total_load_units
          - calculations.equipment_line_load_units
        distinguishing_aspect: |
          The rollup is recomputed on every child mutation, not accumulated: 500.0 after the first
          line, 562.5 after adding a 62.5-unit line at 100 ft, 500.0 again after deleting it, and
          575.0 after adding a 75.0-unit line at 200 ft — an append-only sum would report 637.5.
        test_recipe:
          setup:
            - "Tenant RCN holds an ACTIVE master lease and a DRAFT application spanning 80..240 ft on tower RCN."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Reconcile Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { rc_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Reconcile Radio", carrier_code: "RCN" }
              as: PortfolioAdmin
              captures: { rc_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${rc_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { rc_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${rc_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${rc_t_id}", master_lease_agreement_id: "${rc_mla_id}", requested_elevation_bottom_ft: 80, requested_elevation_top_ft: 240, requested_ground_space_sqft: 300 }
              as: Tenant
              as_user_id: "${rc_ten_id}"
              captures: { rc_app_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/colocation-applications/${rc_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "RC-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${rc_ten_id}"
            - call: "POST /tower-colo/colocation-applications/${rc_app_id}/equipment-lines"
              payload: { equipment_type: "TMA", model_code: "RC-50", quantity: 1, unit_weight_lbs: 50, wind_area_sqft: 0, mount_elevation_ft: 100 }
              as: Tenant
              as_user_id: "${rc_ten_id}"
              captures: { rc_line2_id: $.data.id }
            - call: "GET /tower-colo/colocation-applications/${rc_app_id}"
              payload: {}
              as: PortfolioAdmin
            - call: "DELETE /tower-colo/equipment-lines/${rc_line2_id}"
              payload: {}
              as: Tenant
              as_user_id: "${rc_ten_id}"
            - call: "POST /tower-colo/colocation-applications/${rc_app_id}/equipment-lines"
              payload: { equipment_type: "TMA", model_code: "RC-50H", quantity: 1, unit_weight_lbs: 50, wind_area_sqft: 0, mount_elevation_ft: 200 }
              as: Tenant
              as_user_id: "${rc_ten_id}"
            - call: "GET /tower-colo/colocation-applications/${rc_app_id}"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns load_units == 500.0"
            - "trigger call 2 returns load_units == 62.5"
            - "trigger call 3 returns total_load_units == 562.5"
            - "trigger call 4 returns 204"
            - "trigger call 5 returns load_units == 75.0"
            - "trigger call 6 returns total_load_units == 575.0 and status == DRAFT"
            - "Tower.${rc_t_id}.reserved_load_units == 0.0"

      - name: corner_cascading_side_effects_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: audit_finalization_cascade_depth_four
          rationale: "The §1.8 instance walks the four-level chain finalize -> findings billed -> tenant balance/credit status -> master lease privilege -> application push-back end to end."

      - name: corner_dual_variant_calculation_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: structural_analysis_preliminary_vs_detailed_divergence_on_tower
          rationale: "The §1.8 instance asserts both variants and the exact delta on the switch for one application."

      - name: corner_derived_field_reconciliation_on_source_removal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        excluded_because:
          difficulty_instance: tower_capacity_conserved_across_execute_and_decommission
          rationale: "The §1.8 instance asserts the tower's derived capacity counters after the source amendment is decommissioned."

