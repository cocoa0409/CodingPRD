# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
scaffold_corner_design:
- section: entities
  instances:
  - name: facility_create_returns_every_declared_field_and_opens_unlicensed
    claim_type: Creation
    grounds:
    - entities.Facility
    - endpoints.POST_/treatment-network/facilities
    - response_envelope.success
    distinguishing_aspect: A facility posted with only name and state_code comes back 201 with licensed
      false, as_level_max ASAM_1_0, facility_posture OPEN, compliance_risk_points 0, ops_epoch 0, version
      1 and server-stamped id / created_at / updated_at.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - Facility.${mew_fac}.name == "Cascade Ridge Recovery Center" and state_code == "MN"
      - Facility.${mew_fac}.licensed == false
      - Facility.${mew_fac}.as_level_max == ASAM_1_0
      - Facility.${mew_fac}.facility_posture == OPEN and compliance_risk_points == 0 and ops_epoch ==
        0
      - Facility.${mew_fac}.version == 1 and last_ops_run_at is null
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: episode_get_round_trips_the_stored_row_unchanged
    claim_type: Retrieval
    grounds:
    - entities.TreatmentEpisode
    - endpoints.GET_/treatment-network/facilities/{id}/treatment-episodes/{id}
    distinguishing_aspect: Every stored field of an admitted episode round-trips through the nested GET
      identically, including the null discharged_at and revcap snapshots before any step-down.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One admitted ASAM_3_5 episode.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/clinicians
        payload:
          full_name: Dr. Astrid Lindqvist
          credential_tier: TIER_4_INDEPENDENT
          is_medical_provider: true
        as: PlatformAdmin
        captures:
          mew_clin_A: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-01
          level_of_care: ASAM_3_5
          cleaning_turnaround_hours: 24
        as: PlatformAdmin
        captures:
          mew_bed_35: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-02
          level_of_care: ASAM_3_1
          cleaning_turnaround_hours: 48
        as: PlatformAdmin
        captures:
          mew_bed_31: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/beds
        payload:
          unit_name: North Wing
          bed_label: MN-B-03
          level_of_care: ASAM_2_1
          cleaning_turnaround_hours: 0
        as: PlatformAdmin
        captures:
          mew_bed_21: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: RES_GROUP
          level_of_care: ASAM_3_5
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
        as: PlatformAdmin
        captures:
          mew_svc_g: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/service-offerings
        payload:
          service_code: IOP_GROUP
          level_of_care: ASAM_3_1
          required_min_credential_tier: TIER_3_LICENSED
          requires_medical_provider: false
        as: PlatformAdmin
        captures:
          mew_svc_i: $.data.id
      - call: POST /treatment-network/clinicians/${mew_clin_A}/facility-credentials
        payload:
          facility_id: ${mew_fac}
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_cred: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: ACCREDITATION_BODY
          granting_body: CARF
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_acc_body: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      - call: POST /treatment-network/payers
        payload:
          name: Northlight Health Plan
          initial_authorized_days_by_loc:
            ASAM_3_5: 14
            ASAM_3_1: 10
            ASAM_2_1: 8
          step_down_coverage_map:
            ASAM_3_5:
            - ASAM_3_1
            - ASAM_2_1
            - ASAM_1_0
            ASAM_3_1:
            - ASAM_2_1
            - ASAM_1_0
            ASAM_2_1:
            - ASAM_1_0
            ASAM_1_0: []
          concurrent_review_interval_days: 7
          credential_min_tier_by_loc:
            ASAM_3_5: TIER_3_LICENSED
            ASAM_3_1: TIER_3_LICENSED
            ASAM_2_1: TIER_2_COUNSELOR
            ASAM_1_0: TIER_1_SUPPORT
        as: PlatformAdmin
        captures:
          mew_payer_P: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes
        payload:
          patient_ref: PT-8001
        as: AdmissionsIntakeNurse
        captures:
          mew_ep: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/assessments
        payload:
          assessor_clinician_id: ${mew_clin_A}
          dimension_scores: &id001
            withdrawal_risk: 3
            biomedical_conditions: 2
            emotional_behavioral: 2
            readiness_to_change: 2
            relapse_potential: 4
            recovery_environment: 2
        as: AdmissionsIntakeNurse
        captures:
          mew_asmt_1: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/assessments/${mew_asmt_1}/complete
        payload: {}
        as: Clinician
        as_user_id: ${mew_clin_A}
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/authorizations
        payload:
          payer_id: ${mew_payer_P}
          requested_level: ASAM_3_5
          bed_id: ${mew_bed_35}
        as: UtilizationReviewer
        as_user_id: ur-dana
        captures:
          mew_auth_1: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/authorizations/${mew_auth_1}/approve
        payload: {}
        as: UtilizationReviewer
        as_user_id: ur-dana
      - call: GET /treatment-network/treatment-episodes/${mew_ep}
        payload: {}
        as: Any
        as_user_id: ur-dana
        captures:
          mew_epv: $.data.version
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/treatment-plans
        payload:
          author_clinician_id: ${mew_clin_A}
          cosign_rationale_code: ASAM-PLAN-V1
          expected_treatment_episode_version: ${mew_epv}
        as: Clinician
        as_user_id: ${mew_clin_A}
        captures:
          mew_plan_1: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-plans/${mew_plan_1}/submit-for-cosign
        payload: {}
        as: ClinicalDirector
        as_user_id: cd-ray
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/withdrawal-management
        payload:
          protocol: ALCOHOL_TAPER
          ciwa_score: 12
          dose_records:
          - medication_code: THIAMINE
            dose_mg: 100
            given_at: '2026-09-02T08:00:00Z'
            given_by_clinician_id: ${mew_clin_A}
        as: Clinician
        as_user_id: ${mew_clin_A}
        captures:
          mew_wd: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/medical-clearances
        payload:
          clearance_type: MEDICAL
        as: AdmissionsIntakeNurse
        captures:
          mew_clr_m: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/medical-clearances/${mew_clr_m}/clear
        payload: {}
        as: Clinician
        as_user_id: ${mew_clin_A}
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/medical-clearances
        payload:
          clearance_type: TB_SCREEN
        as: AdmissionsIntakeNurse
        captures:
          mew_clr_t: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/medical-clearances/${mew_clr_t}/clear
        payload: {}
        as: Clinician
        as_user_id: ${mew_clin_A}
      - call: PUT /treatment-network/facilities/${mew_fac}/withdrawal-management/${mew_wd}
        payload:
          status: MEDICALLY_STABLE
        as: Clinician
        as_user_id: ${mew_clin_A}
      - call: POST /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}/admit
        payload: {}
        as: AdmissionsIntakeNurse
        captures:
          mew_epva: $.data.version
      trigger:
      - call: GET /treatment-network/facilities/${mew_fac}/treatment-episodes/${mew_ep}
        payload: {}
        as: Any
        as_user_id: ur-dana
      assert:
      - the response status is 200
      - TreatmentEpisode.${mew_ep}.patient_ref == "PT-8001" and assigned_level == ASAM_3_5
      - TreatmentEpisode.${mew_ep}.clinical_status == IN_TREATMENT and care_level_status == ACTIVE
      - TreatmentEpisode.${mew_ep}.discharged_at is null
      - TreatmentEpisode.${mew_ep}.revcap_pre_step_down_cents is null and revcap_post_step_down_cents
        is null
      - TreatmentEpisode.${mew_ep}.step_down_count == 0 and therapy_revenue_cents == 0
  - name: episodes_list_paginates_and_reports_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/treatment-network/facilities/{id}/treatment-episodes
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three episodes on file, limit 2 offset 0 returns two rows with total_count
      3 and has_more true, and offset 2 returns the remaining row with has_more false — total_count counts
      the filtered set, not the page.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One licensed facility with three episodes, all in AWAITING_ASSESSMENT.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
