              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_RETURN_NOT_FILED"

      - name: return_referential_beats_temporal_on_certificate
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CERTIFICATE_OWNER_MISMATCH]
          - errors[ERR_CERTIFICATE_EXPIRED]
        distinguishing_aspect: |
          business_referential (ERR_CERTIFICATE_OWNER_MISMATCH, priority 7) outranks
          business_temporal (ERR_CERTIFICATE_EXPIRED, priority 8): a return citing a
          certificate that belongs to another taxpayer AND is expired returns the owner-mismatch error.
        test_recipe:
          setup:
            - "Two ACTIVE taxpayers tp1, tp2; tp2 owns a RESALE certificate valid only [2025-01-01, 2025-06-01) (expired for a 2026-Q1 period); tp1 files a return citing tp2's certificate."
