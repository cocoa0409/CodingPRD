              as_user_id: "user-u1"
              captures: { v1: "$.data.id" }
            - call: "POST /sharing-cases"
              payload: { season_pass_id: "${pass_a}", evidence_visit_ids: ["${v1}"], note: "Two different faces on one pass" }
              as: GateAgent
              as_user_id: "user-u1"
              captures: { case_1: "$.data.id" }
            - call: "POST /sharing-cases/${case_1}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-u1"
          trigger:
            - call: "POST /sharing-cases/${case_1}/decide"
              payload: { decision: "SUBSTANTIATED", rationale: "My own case" }
              as: ComplianceOfficer
              as_user_id: "user-u1"
              captures: { err: "$.data.error_id" }
            - call: "POST /sharing-cases/${case_1}/decide"
              payload: { decision: "SUBSTANTIATED", rationale: "Independent review upholds the finding" }
              as: ComplianceOfficer
              as_user_id: "user-u2"
          assert:
            - "the two decide attempts differ only in X-User-ID; before them the case is UNDER_REVIEW with data.opened_by_user_id == 'user-u1' (reviewing is not restricted by the segregation rule)"
            - "first trigger: HTTP 403 with data.error_id == 'ERR_SEGREGATION_OF_DUTIES' and GET /sharing-cases/${case_1} → data.case_status == 'UNDER_REVIEW'"
            - "second trigger: HTTP 200 with data.case_status == 'SUBSTANTIATED', data.decided_by_user_id == 'user-u2', data.review_round == 1"
            - "GET /season-passes/${pass_a} → data.pass_status == 'REVOKED' (the second officer's decision took effect)"

  # ===========================================================================
  # Cross-cutting complexity layers
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: stale_expected_season_pass_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.plan-create-stale-pass
          - validations[priority=30]
          - errors[ERR_STALE_PASS_VERSION]
          - endpoints[POST /season-passes/{pass_id}/payment-plans]
        distinguishing_aspect: "The §1.2.1 rule for plan creation: the version captured at sale is already stale once processing has written to the pass, so it yields 412 ERR_STALE_PASS_VERSION, while the version read after processing succeeds and the write bumps the counter again."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE (12000)."
            - "A pass bought PAYMENT_PLAN; its version is captured at sale (v_sale) and again after processing (v_processed)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id", v_sale: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { v_processed: "$.data.version" }
          trigger:
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${v_sale}" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${v_processed}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
          assert:
            - "first trigger: HTTP 412 with data.error_id == 'ERR_STALE_PASS_VERSION'"
            - "after the refusal GET /payment-plans?season_pass_id=${pass_a} → data.total_count == 0 and GET /season-passes/${pass_a} → data.version == ${v_processed} (a rejected write does not bump the version)"
            - "second trigger: HTTP 201 with data.plan_status == 'ACTIVE' and data.installment_amount_cents == 2625"
            - "GET /season-passes/${pass_a} → data.version == ${v_processed} + 1 (every accepted write increments it)"
            - "replaying the second call with the now-stale ${v_processed} returns 412 again"

      - name: stale_expected_park_day_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.blockout-create-stale-park-day
          - validations[priority=31]
          - errors[ERR_STALE_PARK_DAY_VERSION]
          - endpoints[POST /blockout-assignments]
        distinguishing_aspect: "The §1.2.1 rule for blockout creation: a forecast update between reading the day and writing the blockout invalidates the captured version, so the blockout is refused with 412 rather than being written against a day whose posture has changed."
        test_recipe:
          setup:
            - "Program in DESIGN with a BRONZE tier and a park day 2026-09-01 (1000 / 100); the version is captured at creation (v_created)."
            - "A forecast update to 900 then bumps the day's version and flips it to PEAK; the new version is captured (v_forecast)."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id", v_created: "$.data.version" }
            - call: "POST /park-days/${day_901}/forecast"
              payload: { forecast_attendance: 900 }
              as: ProgramAdmin
              captures: { v_forecast: "$.data.version" }
          trigger:
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_901}", expected_park_day_version: "${v_created}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_901}", expected_park_day_version: "${v_forecast}" }
              as: ProgramAdmin
              captures: { blk: "$.data.id" }
          assert:
            - "the forecast update returned data.forecast_utilization_pct == 0.9000 and data.day_class == 'PEAK'"
            - "first trigger: HTTP 412 with data.error_id == 'ERR_STALE_PARK_DAY_VERSION' and GET /blockout-assignments?park_day_id=${day_901} → data.total_count == 0"
            - "second trigger: HTTP 201 with data.status == 'ACTIVE' and data.assignment_source == 'MANUAL'"
            - "GET /park-days/${day_901} → data.version == ${v_forecast} + 1"

      - name: rolling_window_sharing_score_resets_when_entries_age_out
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.pass_sharing_risk_score
          - entities.Passholder.fields.sharing_risk_score
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The ROLLING_WINDOW variant is a rate trigger with a trailing 7-day window measured from the logical clock: five entries inside the window score 15 * (5 - 3) == 30, and after the clock advances nine days a single fresh entry sees window_entries 1 and the score falls back to 0."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and STANDARD park days 2026-09-01 .. 2026-09-05 and 2026-09-14 (each 1000 / 100)."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL."
            - "The logical clock is set to 2026-09-05T23:00:00Z before the five entries are recorded, so all five fall inside the trailing window."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d1: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-02", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d2: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-03", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d3: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-04", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d4: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d5: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-14", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { d6: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T23:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d1}", entry_at: "2026-09-01T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d2}", entry_at: "2026-09-02T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d3}", entry_at: "2026-09-03T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d4}", entry_at: "2026-09-04T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d5}", entry_at: "2026-09-05T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { v5: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${d6}", entry_at: "2026-09-14T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { v6: "$.data.id" }
          assert:
            - "before the trigger GET /passholders/${holder_a} → data.sharing_risk_score == 30 (15 * max(0, 5 - 3) + 35 * 0), which is below the auto-open score of 65"
            - "GET /sharing-cases?season_pass_id=${pass_a} → data.total_count == 0 at that point"
            - "after the trigger GET /passholders/${holder_a} → data.sharing_risk_score == 0 (only the 2026-09-14 entry is inside the trailing 7 days, so max(0, 1 - 3) == 0)"
            - "GET /season-passes/${pass_a} → data.visit_count == 6 (the history is retained; only the window moved)"
            - "GET /sharing-cases?season_pass_id=${pass_a} → data.total_count == 0 (the reset prevents an auto-open)"

      - name: cascading_side_effects_end_to_end_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SeasonPass.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / billing_run_missed_to_delinquent_to_suspension_to_reservation_release
          rationale: "The four-level chain from installment to ParkDay counter, with ordering sensitivity, is asserted end-to-end there."

      - name: dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - calculations.upgrade_credit
        excluded_because:
          difficulty_instance: dual_variant_calc / upgrade_credit_paid_to_date_vs_prorated_diverge
          rationale: "Both variants and the exact delta between the two settlement totals are asserted there."

  # ===========================================================================
  # Consistency model
  # ===========================================================================
  - section: consistency model
    instances:
      - name: derived_fields_are_current_in_the_same_response
        claim_type: immediate
        grounds:
          - endpoints[POST /reservations]
          - endpoints[POST /visits/{visit_id}/close]
          - endpoints[GET /pass-programs/{program_id}/revenue-summary]
          - calculations.program_revenue_analysis
        distinguishing_aspect: "Consistency is immediate: the write's own response already carries every derived value, and the reads that follow in the same sequence agree with it without any retry, re-read delay or background job."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE (in_park_discount_pct 0.05) and a STANDARD park day 2026-09-01 (1000 / 100)."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_901}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_a: "$.data.id" }
            - call: "GET /park-days/${day_901}"
              as: ProgramAdmin
              captures: { reserved: "$.data.reserved_count" }
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_901}", entry_at: "2026-09-01T09:30:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { v1: "$.data.id" }
            - call: "POST /visits/${v1}/close"
              payload: { spend_cents: 3000 }
              as: GateAgent
            - call: "GET /pass-programs/${prog}/revenue-summary"
              as: ProgramAdmin
              captures: { spend: "$.data.total_in_park_spend_cents" }
          assert:
            - "the POST /reservations response itself carries data.status == 'CONFIRMED' — no follow-up read is needed to learn the outcome"
            - "the immediately following GET /park-days/${day_901} → data.reserved_count == 1 and data.remaining_slot_count == 99 (no lag)"
            - "the POST /visits response carries data.reservation_id == '${res_a}' and the day's data.redeemed_count == 1 is visible on the next read"
            - "the POST /visits/${v1}/close response carries data.spend_cents == 3000 and data.discount_applied_pct == 0.05"
            - "the immediately following GET /pass-programs/${prog}/revenue-summary → data.total_in_park_spend_cents == 3000, data.spend_per_visit_cents == 3000, data.total_visit_count == 1, data.visits_per_active_pass == 1.00"
