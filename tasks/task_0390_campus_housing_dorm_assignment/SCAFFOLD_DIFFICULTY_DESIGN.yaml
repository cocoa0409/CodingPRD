  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: swap_confirm_conserves_total_beds_over_two_rooms
        grounds:
          - state_machines.Assignment.ACTIVE_to_SWAP_PENDING
          - state_machines.Assignment.SWAP_PENDING_to_ACTIVE
          - calculations.building_occupancy_rollup
          - entities.Room.fields.occupied_bed_count
        distinguishing_aspect: |
          Conserved quantity = total occupied beds over the two swapped rooms:
          before propose, room A and room B each hold 1; after confirm-swap
          (students exchange rooms) each still holds exactly 1, so
          (roomA.occupied_bed_count + roomB.occupied_bed_count) is invariant at 2
          across the forward+compensating room exchange.
        test_recipe:
          setup:
            - "Two ACTIVE single-occupant assignments in two ALL_GENDER SINGLE rooms; a confirmed swap exchanges their rooms"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Conserve A", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 150 }
              as: HousingOfficer
              captures: { ca_id: $.data.id }
            - call: "POST /students"
