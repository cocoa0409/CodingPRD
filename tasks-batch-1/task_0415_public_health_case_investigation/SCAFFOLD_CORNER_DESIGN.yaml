        claim_type: Jurisdiction Scope Denial
        grounds:
          - validations[priority=5]
          - errors[ERR_JURISDICTION_SCOPE_VIOLATION]
          - roles.CaseInvestigator
        distinguishing_aspect: |
          Operational-role jurisdiction scoping: a CaseInvestigator scoped to J2 (X-User-ID=J2)
          attempting to interview a case owned by J1 returns 403 ERR_JURISDICTION_SCOPE_VIOLATION
