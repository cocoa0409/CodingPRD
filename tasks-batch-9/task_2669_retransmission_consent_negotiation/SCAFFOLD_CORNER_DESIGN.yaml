  # =========================================================================
  - section: calculations
    instances:
      - name: corner_notice_window_constants_differ_by_distributor_type
        claim_type: Constants Applied
        grounds:
          - calculations.blackout_notice_deadline
          - entities.Distributor.fields.required_blackout_notice_days
          - entities.Negotiation.fields.blackout_notice_deadline_utc
        distinguishing_aspect: "MVPD_NOTICE_DAYS 30 and VMVPD_NOTICE_DAYS 14 are selected off distributor_type, so the same incumbent_expiry_utc of 2027-01-01 yields deadline 2026-12-02 for a CABLE distributor and 2026-12-18 for a VMVPD."
        test_recipe:
          setup:
            - "One CBS station with an ACTIVE affiliation"
            - "One CABLE distributor and one VMVPD distributor"
            - "One filed RETRANS_CONSENT election per distributor, both with incumbent_expiry_utc 2027-01-01"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
            - call: "POST /retrans/stations/${st_id}/affiliation-agreements"
              payload: { network_name: "CBS", term_end_utc: "2032-01-01T00:00:00Z", reverse_comp_floor_per_sub_cents: 90, split_premium_bp: 500, permitted_tiers: ["BROADCAST_BASIC", "EXPANDED_BASIC"], digital_rights_grantable: true, ooh_rights_grantable: false, streaming_rights_grantable: true }
