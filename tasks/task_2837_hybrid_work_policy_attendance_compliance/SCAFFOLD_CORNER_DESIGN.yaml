            - "Call 1: HTTP 201 with seat_allocation_id == ${alloc_anchor} and desk_index == 1 - the selector took the ANCHOR neighborhood despite its higher utilization, because anchor match is rank 1, and then the lowest desk index in the band 1..13"
            - "Call 1: assignment_mode == 'AUTO' (not MANUAL), status == 'ASSIGNED', start_date and end_date echo the request"
            - "Call 2: desk_index == 2 in the same allocation - desk 1 is occupied over an overlapping interval, so the next-lowest index wins; the selector still does not switch to the emptier N-OTHER"
