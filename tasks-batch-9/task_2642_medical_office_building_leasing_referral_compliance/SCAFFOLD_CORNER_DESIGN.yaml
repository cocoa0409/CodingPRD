        distinguishing_aspect: "The floor is inclusive and one cent wide: 23.99 psf on a STANDARD_EXAM suite is refused with ERR_RENT_BELOW_FMV_FLOOR while 24.00 — exactly 0.80 x the 30.00 published rate — certifies, which is the below-FMV limb that a ceiling-only implementation misses entirely."
