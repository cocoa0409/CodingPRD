              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 90000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id", bk_ver_stale: "$.data.version" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 30000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 2, flight_number: "ZQ520", origin_iata: "DFW", destination_iata: "LAX", is_international: false, scheduled_departure_utc: "2026-08-10T16:00:00Z", scheduled_arrival_utc: "2026-08-10T18:00:00Z", segment_fare_cents: 60000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg2_id: "$.data.id" }
            - call: "GET /compliance/bookings/${bk_id}"
              payload: {}
              as: ComplianceOfficer
