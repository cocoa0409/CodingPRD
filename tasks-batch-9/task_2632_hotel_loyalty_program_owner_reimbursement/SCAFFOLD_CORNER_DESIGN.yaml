# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2632 - Hotel Loyalty Program & Owner Reimbursement
# The nine sections of references/claim-extraction-guide.md walked against
# SCAFFOLD.yaml §1.1-§1.7. Every instance either carries an executable
# test_recipe (empty-DB -> precondition using only §1.5 endpoints) or an
# excluded_because stub naming the §1.8 instance that already asserts it.
# Logical clock starts at 2026-08-01T00:00:00Z unless a recipe moves it.
# Every name here is distinct from every name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: hotel_create_returns_201_with_onboarding_status_and_zero_counters
        claim_type: creation
        grounds:
          - entities.Hotel
          - endpoints.POST /loyalty/hotels
          - state_machines.Hotel.initial_state
        distinguishing_aspect: |
          A create with all seven declared required inputs returns 201 and a body in which every
          computed counter is 0, status is ONBOARDING and termination_reason is null - the property
          carries no fee ledger, no reimbursement owing and no blackout consumption before it trades.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty/hotels"
              payload: { name: "Northgate Plaza", brand_code: "NGP", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 180, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, h_v: $.data.version }
          assert:
            - "response code 201 and response_type == \"object\""
            - "Hotel.${h_id}.name == \"Northgate Plaza\", brand_code == \"NGP\", market_tier == URBAN"
            - "Hotel.${h_id}.program_fee_pct == 0.05, rooms_count == 180, trailing_12m_occupancy_pct == 0.82, trailing_12m_adr_cents == 30000"
            - "Hotel.${h_id}.status == ONBOARDING"
            - "Hotel.${h_id}.fee_ledger_balance_cents == 0, reimbursement_owed_cents == 0, benefit_recovery_owed_cents == 0, benefit_denial_count == 0, blackout_days_used_current_year == 0"
            - "Hotel.${h_id}.termination_reason == null and Hotel.${h_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are both present on the envelope"

      - name: member_read_returns_the_stored_enrollment_row
        claim_type: retrieval
        grounds:
          - entities.Member
          - endpoints.GET /loyalty/members/{memberId}
        distinguishing_aspect: |
          GET /loyalty/members/{memberId} returns exactly the row POST /loyalty/members stored:
          same email, full_name and enrollment_date, elite_tier BASE, and all five counters at 0.
        test_recipe:
          setup:
            - "One member enrolled on 2026-01-05 with no stay, purchase or adjustment history."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "rt1@example.com", full_name: "Ines Vidal", enrollment_date: "2026-01-05" }
              as: MemberCareAgent
              as_user_id: "care-rt-01"
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response code 200 and Member.${m_id}.email == \"rt1@example.com\""
            - "Member.${m_id}.full_name == \"Ines Vidal\" and Member.${m_id}.enrollment_date == \"2026-01-05\""
            - "Member.${m_id}.elite_tier == BASE"
            - "Member.${m_id}.qualifying_nights_ytd == 0, qualifying_revenue_cents_ytd == 0, point_balance == 0, lifetime_points_earned == 0, points_purchased_current_year == 0"
            - "Member.${m_id}.version == 1 and created_at / updated_at are both present"

      - name: hotel_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /loyalty/hotels
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three ONBOARDING properties stored, limit 2 / offset 0 returns 2 rows with
          total_count 3 and has_more true, while limit 2 / offset 2 returns 1 row with has_more
          false - and the status filter narrows the same collection without changing total_count.
        test_recipe:
          setup:
            - "Three properties created and left in ONBOARDING; no other entity exists."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Alpha House", brand_code: "ALP", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.80, trailing_12m_adr_cents: 20000 }
              as: ProgramAdministrator
              captures: { h1_id: $.data.id }
            - call: "POST /loyalty/hotels"
              payload: { name: "Bravo Lodge", brand_code: "BRV", market_tier: "RESORT", program_fee_pct: 0.06, rooms_count: 120, trailing_12m_occupancy_pct: 0.81, trailing_12m_adr_cents: 25000 }
              as: ProgramAdministrator
              captures: { h2_id: $.data.id }
            - call: "POST /loyalty/hotels"
              payload: { name: "Charlie Inn", brand_code: "CHR", market_tier: "SELECT", program_fee_pct: 0.04, rooms_count: 80, trailing_12m_occupancy_pct: 0.79, trailing_12m_adr_cents: 15000 }
              as: ProgramAdministrator
              captures: { h3_id: $.data.id }
          trigger:
            - call: "GET /loyalty/hotels"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdministrator
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /loyalty/hotels"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdministrator
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /loyalty/hotels"
              payload: { status: "ONBOARDING", market_tier: "RESORT" }
              as: ProgramAuditor
              captures: { f_first: "$.data[0].id" }
          assert:
            - "first call: response code 200, response_type == \"array\", exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "third call: exactly 1 row and ${f_first} == ${h2_id} (the only RESORT property), total_count == 1"
            - "the third call returns limit == 10, the declared pagination default, because no limit was supplied"

      - name: unknown_identifiers_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations.priority_10_ERR_HOTEL_NOT_FOUND
          - validations.priority_11_ERR_RATE_PLAN_NOT_FOUND
          - validations.priority_12_ERR_MEMBER_NOT_FOUND
          - validations.priority_13_ERR_STAY_NOT_FOUND
          - validations.priority_14_ERR_REDEMPTION_NOT_FOUND
          - validations.priority_15_ERR_DELIVERY_NOT_FOUND
          - validations.priority_16_ERR_BATCH_NOT_FOUND
          - validations.priority_17_ERR_BLACKOUT_WINDOW_NOT_FOUND
          - validations.priority_18_ERR_PARTNER_NOT_FOUND
          - validations.priority_19_ERR_PURCHASE_NOT_FOUND
          - validations.priority_20_ERR_COMPLAINT_NOT_FOUND
          - validations.priority_21_ERR_PRICING_ROW_NOT_FOUND
        distinguishing_aspect: |
          Every one of the twelve single-resource reads answers an unknown identifier with its own
          entity-specific 404 error_id rather than a shared generic one, so the caller can tell
          which of a request's references failed to resolve.
        test_recipe:
          setup:
            - "Empty database; the identifier 00000000-0000-4000-8000-000000000000 exists in no collection."
          setup_api_calls: []
          trigger:
            - call: "GET /loyalty/hotels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_hotel: $.data.error_id }
            - call: "GET /loyalty/rate-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_rate_plan: $.data.error_id }
            - call: "GET /loyalty/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_member: $.data.error_id }
            - call: "GET /loyalty/stays/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_stay: $.data.error_id }
            - call: "GET /loyalty/redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_redemption: $.data.error_id }
            - call: "GET /loyalty/elite-benefit-deliveries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_delivery: $.data.error_id }
            - call: "GET /loyalty/reimbursement-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_batch: $.data.error_id }
            - call: "GET /loyalty/blackout-windows/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_window: $.data.error_id }
            - call: "GET /loyalty/partners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_partner: $.data.error_id }
            - call: "GET /loyalty/point-purchases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_purchase: $.data.error_id }
            - call: "GET /loyalty/member-complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_complaint: $.data.error_id }
            - call: "GET /loyalty/redemption-pricing/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { e_pricing: $.data.error_id }
          assert:
            - "all twelve calls return http 404 with response_type == \"error\""
            - "${e_hotel} == ERR_HOTEL_NOT_FOUND, ${e_rate_plan} == ERR_RATE_PLAN_NOT_FOUND, ${e_member} == ERR_MEMBER_NOT_FOUND"
            - "${e_stay} == ERR_STAY_NOT_FOUND, ${e_redemption} == ERR_REDEMPTION_NOT_FOUND, ${e_delivery} == ERR_DELIVERY_NOT_FOUND"
            - "${e_batch} == ERR_BATCH_NOT_FOUND, ${e_window} == ERR_BLACKOUT_WINDOW_NOT_FOUND, ${e_partner} == ERR_PARTNER_NOT_FOUND"
            - "${e_purchase} == ERR_PURCHASE_NOT_FOUND, ${e_complaint} == ERR_COMPLAINT_NOT_FOUND, ${e_pricing} == ERR_PRICING_ROW_NOT_FOUND"
            - "every error body carries both data.error_id and data.message"

      - name: hotel_create_missing_program_fee_pct_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_22_ERR_INVALID_REQUEST
          - endpoints.POST /loyalty/hotels
          - entities.Hotel.fields.program_fee_pct
        distinguishing_aspect: |
          program_fee_pct has source input and no default, so omitting it is a 400
          ERR_INVALID_REQUEST from validation priority 22 - not a silent fallback to 0.0 - and no
          Hotel row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty/hotels"
              payload: { name: "Missing Fee House", brand_code: "MFH", market_tier: "URBAN", rooms_count: 90, trailing_12m_occupancy_pct: 0.80, trailing_12m_adr_cents: 20000 }
              as: ProgramAdministrator
              captures: { e_missing: $.data.error_id }
            - call: "POST /loyalty/members"
              payload: { full_name: "No Email Person", enrollment_date: "2026-02-02" }
              as: ProgramAdministrator
              captures: { e_missing_email: $.data.error_id }
          assert:
            - "both calls return http 400 with ${e_missing} == ERR_INVALID_REQUEST and ${e_missing_email} == ERR_INVALID_REQUEST"
            - "GET /loyalty/hotels returns total_count == 0 - no partially populated Hotel row was persisted"
            - "GET /loyalty/members returns total_count == 0"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Member.fields.enrollment_date
          - entities.Stay.fields.incidental_revenue_cents
          - entities.PointPurchase.fields.partner_id
          - entities.ProgramFund.fields.breakage_rate_pct
        distinguishing_aspect: |
          With the logical clock at 2026-08-05T09:30:00Z, a member created without enrollment_date
          stores "2026-08-05"; a stay created without incidental_revenue_cents stores 0; a
          DIRECT_PURCHASE created without partner_id stores null; and the untouched program fund
          reports breakage_rate_pct 0.2.
        test_recipe:
          setup:
            - "Logical clock moved to 2026-08-05T09:30:00Z."
            - "One ACTIVE property with a TRANSIENT rate plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels"
              payload: { name: "Defaults Court", brand_code: "DFC", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 110, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /loyalty/members"
              payload: { email: "df1@example.com", full_name: "Kaia Berg" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id, m_enrolled: $.data.enrollment_date }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 50000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id, s_incidental: $.data.incidental_revenue_cents }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id, pp_partner: $.data.partner_id }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { fund_breakage: $.data.breakage_rate_pct }
          assert:
            - "${m_enrolled} == \"2026-08-05\" - the date part of the logical clock, not a null and not the wall clock"
            - "${s_incidental} == 0 and Stay.${s_id}.room_revenue_cents == 50000"
            - "${pp_partner} == null and PointPurchase.${pp_id}.channel == DIRECT_PURCHASE"
            - "${fund_breakage} == 0.2"
            - "Member.${m_id}.created_at == \"2026-08-05T09:30:00Z\""

      - name: stay_nights_and_tier_at_checkin_are_computed_from_the_request_and_the_member
        claim_type: computed_fields
        grounds:
          - entities.Stay.fields.nights
          - entities.Stay.fields.tier_at_checkin
          - endpoints.POST /loyalty/stays
          - calculations.elite_tier_recompute
        distinguishing_aspect: |
          nights is derived from the two supplied dates (2026-07-12 to 2026-07-15 gives exactly 3)
          and tier_at_checkin is snapshotted from the member's live elite_tier at row creation
          (SILVER, after a 10-night qualifying stay), while every award field stays 0 until the
          stay is posted.
        test_recipe:
          setup:
            - "One ACTIVE urban property with program_fee_pct 0.05 and a TRANSIENT rate plan earning 10 points per dollar."
            - "One member lifted to SILVER by a posted 10-night qualifying stay (base 10000 points, fee 5000 cents)."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Computed Arms", brand_code: "CMP", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 140, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "cf9@example.com", full_name: "Rasmus Holm", enrollment_date: "2026-01-05" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-11", room_revenue_cents: 100000 }
              as: ProgramAdministrator
              captures: { s1_id: $.data.id, s1_nights: $.data.nights, s1_tier: $.data.tier_at_checkin }
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-12", checkout_date: "2026-07-15", room_revenue_cents: 60000 }
              as: ProgramAdministrator
              captures: { s2_id: $.data.id, s2_nights: $.data.nights, s2_tier: $.data.tier_at_checkin }
          assert:
            - "response code 201, ${s2_nights} == 3 and ${s2_tier} == SILVER"
            - "${s1_nights} == 10 and ${s1_tier} == BASE - the first stay was created before the tier moved"
            - "Member.${m_id}.elite_tier == SILVER and Member.${m_id}.qualifying_nights_ytd == 10"
            - "Stay.${s2_id}.base_points_awarded == 0, bonus_points_awarded == 0, program_fee_assessed_cents == 0, bonus_multiplier_applied == 0.0 - creation awards nothing"
            - "Hotel.${h_id}.fee_ledger_balance_cents == 5000, unchanged by the second stay's creation"

      - name: stay_identifiers_and_timestamps_are_stamped_by_the_server
        claim_type: system_fields
        grounds:
          - entities.Stay.fields.status
          - entities.Stay.fields.dispute_reason
          - entities.Stay.fields.void_reason
          - endpoints.POST /loyalty/stays
        distinguishing_aspect: |
          The client supplies no id, timestamp, version or status on POST /loyalty/stays, yet the
          created row carries a server-minted id, created_at and updated_at equal to the logical
          clock instant 2026-08-04T08:00:00Z, version 1, status PENDING_POSTING and both narrative
          fields null.
        test_recipe:
          setup:
            - "Logical clock moved to 2026-08-04T08:00:00Z."
            - "One ACTIVE property with a TRANSIENT rate plan and one BASE member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels"
              payload: { name: "Stamped Suites", brand_code: "STS", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 95, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "sf1@example.com", full_name: "Teodor Marek", enrollment_date: "2026-03-03" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-20", checkout_date: "2026-07-22", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id, s_created: $.data.created_at, s_version: $.data.version }
          assert:
            - "response code 201 and ${s_id} is a server-generated identifier the request never carried"
            - "${s_created} == \"2026-08-04T08:00:00Z\" and Stay.${s_id}.updated_at == \"2026-08-04T08:00:00Z\""
            - "${s_version} == 1"
            - "Stay.${s_id}.status == PENDING_POSTING, dispute_reason == null, void_reason == null"

      - name: enum_range_and_date_order_constraints_are_refused_at_their_own_priorities
        claim_type: type_constraints
        grounds:
          - validations.priority_22_ERR_INVALID_REQUEST
          - validations.priority_23_ERR_INVALID_DATE_RANGE
          - validations.priority_24_ERR_AMOUNT_OUT_OF_RANGE
          - entities.RatePlan.fields.rate_category
          - entities.Hotel.fields.program_fee_pct
        distinguishing_aspect: |
          Three shape failures land on three different error_ids: an off-enum rate_category is a
          400 ERR_INVALID_REQUEST, a program_fee_pct of 0.25 above the 0.20 ceiling is a 422
          ERR_AMOUNT_OUT_OF_RANGE, and a checkout_date before the checkin_date is a 422
          ERR_INVALID_DATE_RANGE.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan and one BASE member."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Constraint Hall", brand_code: "CNH", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 130, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "tc1@example.com", full_name: "Nour Bakri", enrollment_date: "2026-04-04" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "PKG", rate_category: "PACKAGE" }
              as: ProgramAdministrator
              captures: { e_enum: $.data.error_id }
            - call: "POST /loyalty/hotels"
              payload: { name: "Overpriced Fee Inn", brand_code: "OFI", market_tier: "URBAN", program_fee_pct: 0.25, rooms_count: 100, trailing_12m_occupancy_pct: 0.80, trailing_12m_adr_cents: 20000 }
              as: ProgramAdministrator
              captures: { e_range: $.data.error_id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-10", checkout_date: "2026-07-05", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_dates: $.data.error_id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-10", checkout_date: "2026-07-12", room_revenue_cents: -500 }
              as: ProgramAdministrator
              captures: { e_negative: $.data.error_id }
          assert:
            - "${e_enum} == ERR_INVALID_REQUEST with http 400 - PACKAGE is outside {TRANSIENT, CORPORATE_NEGOTIATED, GROUP, OPAQUE_WHOLESALE, EMPLOYEE_COMP, AWARD}"
            - "${e_range} == ERR_AMOUNT_OUT_OF_RANGE with http 422"
            - "${e_dates} == ERR_INVALID_DATE_RANGE with http 422"
            - "${e_negative} == ERR_AMOUNT_OUT_OF_RANGE with http 422 - room_revenue_cents must be >= 0"
            - "GET /loyalty/rate-plans filtered by hotel_id ${h_id} still returns total_count == 1"

      - name: point_ledger_entry_exposes_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.PointLedgerEntry
          - endpoints.GET /loyalty/point-ledger-entries
          - endpoints.GET /loyalty/point-ledger-entries/{entryId}
        distinguishing_aspect: |
          PointLedgerEntry declares common_fields false, so its rows carry id and created_at but no
          version and no updated_at, and §1.5 exposes only the two GETs - the ledger is corrected by
          writing a compensating REVERSAL row, never by mutating an existing one.
        test_recipe:
          setup:
            - "One member funded by a settled 20000-point DIRECT_PURCHASE (cash_due 25000 cents), producing exactly one PURCHASE ledger entry."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "im1@example.com", full_name: "Bea Lindqvist", enrollment_date: "2026-01-15" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /loyalty/point-ledger-entries"
              payload: { member_id: "${m_id}" }
              as: ProgramAuditor
              captures: { le_id: "$.data[0].id", le_points: "$.data[0].points" }
          assert:
            - "response code 200 with exactly 1 row and total_count == 1"
            - "${le_points} == 20000 and the row's entry_type == PURCHASE"
            - "the row carries source_purchase_id == ${pp_id}, source_stay_id == null, source_redemption_id == null, reversal_of_entry_id == null"
            - "the row carries liability_unit_cost_cents_per_1000 == 600"
            - "the row's JSON has an id and a created_at but no version key and no updated_at key"
            - "GET /loyalty/point-ledger-entries/${le_id} returns the same body, and §1.5 declares no PUT, PATCH or DELETE on either point-ledger-entries path"

      - name: stay_create_with_unknown_body_foreign_keys_is_refused
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - validations.priority_11_ERR_RATE_PLAN_NOT_FOUND
          - validations.priority_12_ERR_MEMBER_NOT_FOUND
          - entities.Stay.fields.member_id
          - entities.Stay.fields.rate_plan_id
        distinguishing_aspect: |
          The topology is flat, so a Stay's three references are validated as body foreign keys
          rather than URL ancestry: an unknown member_id is a 404 ERR_MEMBER_NOT_FOUND and an
          unknown rate_plan_id is a 404 ERR_RATE_PLAN_NOT_FOUND, with the lower-priority rate-plan
          check winning when both are unknown.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan and one enrolled member."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Flatkey Court", brand_code: "FKC", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 105, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "fk1@example.com", full_name: "Sanna Aalto", enrollment_date: "2026-02-10" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /loyalty/stays"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_member: $.data.error_id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "00000000-0000-4000-8000-000000000000", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_rate_plan: $.data.error_id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", hotel_id: "${h_id}", rate_plan_id: "00000000-0000-4000-8000-000000000000", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
