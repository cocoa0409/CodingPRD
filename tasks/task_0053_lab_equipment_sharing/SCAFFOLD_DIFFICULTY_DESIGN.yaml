# =============================================================================
# Task 0053 — Laboratory Equipment Sharing Platform (v1)
# Scaffold Difficulty Design / Test Targeting Index
# =============================================================================
# Cross-references every difficulty feature claimed by SCAFFOLD.yaml against
# the nine Difficulty Rules (§0.5 of the scaffold-generator skill).
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every `assert:` value below was computed against the formulas in §1.3 of
# SCAFFOLD.yaml (see the comment header inside each instance for the inputs).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_fee_estimated_vs_final
        grounds:
          - calculations.estimated_fee
          - calculations.final_fee
          - entities.Reservation.fields.estimated_fee_cents
          - entities.Reservation.fields.final_fee_cents
          - entities.Reservation.fields.billing_rule_id_pinned
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          The two calculations operate on the SAME Reservation row but on different entity domains of input:
          estimated_fee is forward-looking on the BillingRule + declared inputs (requested_sample_count, [start_at,end_at) duration),
          while final_fee is chronological on the UsageLog (actual_sample_count, ceil(actual_minutes/60.0)) — divergent results for
          identical declared inputs whenever actual usage differs (e.g., over-run or fewer samples).
        test_recipe:
          # Inputs:
          # Equipment.slot_granularity=HOUR, lead_time_hours=0, single_user_duration_limit_hours=8,
          # peak_window_start_hour=22, peak_window_end_hour=23 (so a 09:00-11:00 reservation never overlaps peak)
          # Lab.revenue_share_bps=8000
          # BillingRule v1 PUBLISHED: mode=BY_TIME, internal_rate_per_hour_cents=10000,
          #   peak_multiplier_bps=12500, platform_fee_bps=1000, consumables_flat_cents=500
          # User.affiliation=WITHIN_SCHOOL, identity_verified=true
          # Authorization APPROVED on (equipment,user)
          # Reservation [09:00, 11:00), requested_sample_count=0 -> 2h
          # At check-out, actual usage = [09:00, 11:01) = 121 minutes -> ceil(121/60.0)=3 billed hours
          setup:
            - "Create Lab L with revenue_share_bps=8000"
            - "Create LabOwner user O linked to L (contact_user_id)"
            - "Create User U with affiliation=WITHIN_SCHOOL, training_certificates=['T1']"
            - "POST /_events/identity-verified for U.external_user_id"
            - "Create Equipment E (lab_id=L, slot_granularity=HOUR, lead_time_hours=0, single_user_duration_limit_hours=8, value_tier=STANDARD, sharing_scope=WITHIN_SCHOOL, peak_window_start_hour=22, peak_window_end_hour=23, required_training_codes=['T1'], allowed_sample_types=['S'], valid certs)"
            - "Draft BillingRule on E with mode=BY_TIME, internal_rate_per_hour_cents=10000, peak_multiplier_bps=12500, platform_fee_bps=1000, consumables_flat_cents=500 (other rates set to plausible non-zero values)"
            - "Publish that BillingRule"
            - "Authorization on (E, U) sample_type=S, urgency=NORMAL → approve as O (STANDARD, direct APPROVED)"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
          trigger:
            - "POST /equipment/{E}/reservations as U with start_at=2026-05-12T09:00:00Z, end_at=2026-05-12T11:00:00Z, requested_sample_count=0"
            - "POST /_clock/advance to 2026-05-12T09:00:00Z"
            - "POST /reservations/{R}/check-in as U"
            - "POST /_clock/advance to 2026-05-12T11:01:00Z"
            - "POST /reservations/{R}/check-out as U with actual_sample_count=0, status_handover=NORMAL"
          assert:
            - "Reservation.estimated_fee_cents == 22500"
            - "Reservation.estimated_owner_share_cents == 16000"
            - "Reservation.final_fee_cents == 33500"
            - "Reservation.final_owner_share_cents == 24000"
            - "Reservation.final_fee_cents != Reservation.estimated_fee_cents"
            - "Lab.settlement_balance_cents == 24000 (16000 accrued at confirm + 8000 delta at complete)"

      - name: lab_settlement_balance_aggregation_vs_lifetime
        grounds:
          - calculations.lab_settlement_balance
          - entities.Lab.fields.settlement_balance_cents
          - entities.Lab.fields.lifetime_settled_cents
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - endpoints[POST /labs/{lab_id}/settle]
        distinguishing_aspect: |
          This dual-variant case operates on the Lab entity domain (NOT on Reservation): settlement_balance_cents is an
          ongoing aggregation that nets debits (cancellation refunds) against credits (estimated and final owner shares),
          while lifetime_settled_cents is a chronological log-of-payouts that NEVER decreases. Two identical reservation
          sequences ending in the same final state yield identical lifetime_settled_cents but DIFFERENT settlement_balance_cents
          depending on whether /labs/{id}/settle was called between them — divergent results from the same data on a
          different entity than dual_variant_calc instance #1.
        test_recipe:
          # Inputs identical to instance #1 except: complete the reservation, then call /labs/{id}/settle,
          # then create a second reservation that is CANCELLED with 50% refund.
          # After instance #1's complete: balance=24000, lifetime=0.
          # After /labs/{id}/settle: lifetime=24000, balance=0.
          # Second reservation est_fee=22500 with owner_share=16000 -> balance += 16000.
          # Cancel @ 23h pre-start -> refund_bps=5000, debit balance by round_half_up(16000 * 0.5) = 8000.
          # Final: balance=8000, lifetime=24000.
          setup:
            - "Run instance #1 setup + trigger through check-out (balance=24000)"
          trigger:
            - "POST /labs/{L}/settle as PlatformAdmin"
            - "POST /_clock/advance to 2026-05-13T00:00:00Z"
            - "POST /equipment/{E}/reservations as U with start_at=2026-05-13T23:00:00Z, end_at=2026-05-14T01:00:00Z, requested_sample_count=0"
            - "POST /_clock/advance to 2026-05-13T00:00:01Z (still 22h59min before start)"
            - "POST /reservations/{R2}/cancel as U"
          assert:
            - "Lab.lifetime_settled_cents == 24000"
            - "Lab.settlement_balance_cents == 8000"
            - "Reservation R2.cancellation_refund_bps == 5000"
            - "Reservation R2.status == 'CANCELLED'"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hybrid_fee_three_input_conditional
        grounds:
          - calculations.estimated_fee
          - calculations.peak_overlap_minutes
          - entities.BillingRule.fields.mode
          - entities.BillingRule.fields.peak_multiplier_bps
          - entities.User.fields.affiliation
        distinguishing_aspect: |
          Mode (a) — non-linear formula with ≥3 inputs (BillingRule.mode, user.affiliation, peak_overlap_minutes > 0)
          where the equipment-fee branch depends on a conditional on mode (case BY_TIME/BY_SAMPLE/HYBRID), a tiered rate
          selection (internal/inter_school/external per affiliation), and a threshold trigger (peak multiplier ONLY when
          peak_overlap_minutes > 0, strictly). Each input is from a different field — combinatorial along three axes.
        test_recipe:
          # Inputs:
          # Equipment E2 same as E except slot_granularity=HOUR, peak_window 22-23 NEXT_DAY adjusted as below.
          # BillingRule v1 on E2: mode=HYBRID, internal_rate_per_hour_cents=10000, internal_rate_per_sample_cents=337,
          #   peak_multiplier_bps=12500, platform_fee_bps=1000, consumables_flat_cents=500
          # User V with affiliation=WITHIN_SCHOOL
          # Reservation [22:00, 23:00) -> 1h ENTIRELY within peak window (60 minutes overlap > 0 -> multiplier applies)
          # requested_sample_count=3
          # time_raw = 1 * 10000 = 10000 -> *1.25 = 12500
          # sample_raw = 3 * 337 = 1011
          # equipment_fee = round_half_up(12500 + 1011) = 13511
          # platform_fee = round_half_up(13511 * 0.10) = 1351
          # estimated_fee = 13511 + 1351 + 500 = 15362
          # estimated_owner_share = round_half_up(13511 * 0.80) = 10809
          setup:
            - "Create Lab L2 with revenue_share_bps=8000"
            - "Create User V with affiliation=WITHIN_SCHOOL, training_certificates=['T1'], identity_verified=true via /_events/identity-verified"
            - "Create Equipment E2 (slot_granularity=HOUR, peak_window_start_hour=22, peak_window_end_hour=23, value_tier=STANDARD, sharing_scope=WITHIN_SCHOOL, certs valid)"
            - "Publish BillingRule on E2 with mode=HYBRID, internal_rate_per_hour_cents=10000, internal_rate_per_sample_cents=337, peak_multiplier_bps=12500, platform_fee_bps=1000, consumables_flat_cents=500, owner=L2 share 8000 bps"
            - "Authorization on (E2, V) approved"
            - "POST /_clock/advance to 2026-05-12T20:00:00Z"
          trigger:
            - "POST /equipment/{E2}/reservations as V with start_at=2026-05-12T22:00:00Z, end_at=2026-05-12T23:00:00Z, requested_sample_count=3"
          assert:
            - "Reservation.estimated_fee_cents == 15362"
            - "Reservation.estimated_owner_share_cents == 10809"
            - "Reservation.estimated_platform_fee_cents == 1351"
            - "Reservation.priority_tier == 'PEAK'"

      - name: cancellation_refund_threshold_boundary
        grounds:
          - calculations.cancellation_refund_policy
          - entities.Reservation.fields.cancellation_refund_bps
          - state_machines.Reservation.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Mode (b/c hybrid — using mode (c)) — the cancellation refund formula has a circular-looking dependency between
          three fields: cancellation_refund_bps is derived from (start_at - now), then refund_cents = round(estimated_fee_cents * bps),
          then Lab.settlement_balance_cents is decremented by round(estimated_owner_share_cents * bps / 10000) — the SAME bps
          drives BOTH the refund and the balance debit, and the evaluation order is pinned: classify bps first, compute refund
          from estimated_fee_cents, compute balance debit from estimated_owner_share_cents (NOT from refund_cents). A different
          pinned order (e.g., balance_debit = estimated_owner_share * refund_cents / estimated_fee_cents) would yield different
          cents due to compounded rounding. Combinatorial axis = nested rounding order, distinct from instance #1's "conditional
          branch on mode" axis.
        test_recipe:
          # Inputs (reuse instance #1's setup A): estimated_fee_cents=22500, estimated_owner_share_cents=16000.
          # Cancel exactly 23h before start_at:
          #   delta_minutes = 23*60 = 1380 < 24*60 = 1440 -> bps=5000
          #   refund_cents = round_half_up(22500 * 5000 / 10000) = 11250
          #   balance_debit = round_half_up(16000 * 5000 / 10000) = 8000
          # Cancel exactly 24h before start_at (boundary):
          #   delta_minutes = 1440 >= 1440 -> bps=10000
          #   refund_cents = 22500; balance_debit = 16000
          # These two assertions live on different reservations to keep them independent.
          setup:
            - "Run instance #1 setup (Lab L, User U, Equipment E, BillingRule, Authorization) but DO NOT create the instance #1 reservation"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
            - "POST /equipment/{E}/reservations as U with start_at=2026-05-13T08:00:00Z, end_at=2026-05-13T10:00:00Z, requested_sample_count=0 -> R_a"
            - "POST /equipment/{E}/reservations as U with start_at=2026-05-13T09:00:00Z, end_at=2026-05-13T11:00:00Z, requested_sample_count=0 -> R_b (non-overlapping after we test boundary first; in practice run as two independent setups)"
          trigger:
            - "POST /_clock/advance to 2026-05-12T09:00:00Z (exactly 23h before R_a.start_at)"
            - "POST /reservations/{R_a}/cancel as U"
            - "POST /_clock/advance to 2026-05-12T09:00:00Z (24h before R_b.start_at = 2026-05-13T09:00:00Z)"
            - "POST /reservations/{R_b}/cancel as U"
          assert:
            - "R_a.cancellation_refund_bps == 5000"
            - "R_b.cancellation_refund_bps == 10000"
            - "Refund event payload for R_a contains refund_cents=11250 and Lab balance debit=8000"
            - "Refund event payload for R_b contains refund_cents=22500 and Lab balance debit=16000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: authorization_branching_owner_vs_platform_step
        grounds:
          - state_machines.Authorization
          - state_machines.Authorization.PENDING_OWNER_to_PENDING_PLATFORM
          - state_machines.Authorization.PENDING_OWNER_to_APPROVED
          - state_machines.Authorization.PENDING_PLATFORM_to_APPROVED
          - entities.Equipment.fields.value_tier
          - entities.Authorization.fields.urgency
        distinguishing_aspect: |
          Authorization is a branching (fork-join) state machine on the Authorization entity. From PENDING_OWNER an /approve
          call FORKS to either PENDING_PLATFORM (HIGH_VALUE & NORMAL urgency) or directly to APPROVED (STANDARD OR URGENT
          HIGH_VALUE). The branch is selected by reading two different fields (Equipment.value_tier and Authorization.urgency).
          Divergent side-effect sets per branch: only the direct-APPROVED branch writes expires_at on owner step; the
          PENDING_PLATFORM branch defers expires_at to the platform step.
        test_recipe:
          setup:
            - "Lab L_A with LabOwner O_A; PlatformAdmin PA"
            - "User Ux (affiliation=WITHIN_SCHOOL, identity_verified=true, training=['T1'])"
            - "Equipment E_high (value_tier=HIGH_VALUE, required_training_codes=['T1'], allowed_sample_types=['S']) under L_A"
            - "Equipment E_std (value_tier=STANDARD, same other fields) under L_A"
          trigger:
            - "POST /equipment/{E_high}/authorizations as Ux (urgency=NORMAL) -> A1"
            - "POST /authorizations/{A1}/approve as O_A"
            - "POST /authorizations/{A1}/approve as PA"
            - "POST /equipment/{E_high}/authorizations as Ux (urgency=URGENT) -> A2"
            - "POST /authorizations/{A2}/approve as O_A"
            - "POST /equipment/{E_std}/authorizations as Ux (urgency=NORMAL) -> A3"
            - "POST /authorizations/{A3}/approve as O_A"
          assert:
            - "A1 status sequence: PENDING_OWNER -> PENDING_PLATFORM -> APPROVED"
            - "A2 status sequence: PENDING_OWNER -> APPROVED (single hop, platform step skipped)"
            - "A3 status sequence: PENDING_OWNER -> APPROVED (single hop, STANDARD)"
            - "A1.owner_decision_user_id == O_A.id AND A1.platform_decision_user_id == PA.id"
            - "A2.platform_decision_user_id IS NULL"
            - "A3.platform_decision_user_id IS NULL"

      - name: equipment_cycle_available_maintenance_available
        grounds:
          - state_machines.Equipment.AVAILABLE_to_MAINTENANCE
          - state_machines.Equipment.MAINTENANCE_to_AVAILABLE
          - state_machines.MaintenanceWindow
          - state_machines.MaintenanceWindow.AWAITING_ACCEPTANCE_to_ACCEPTED
        distinguishing_aspect: |
          Equipment.status is a CYCLE on a different entity than Authorization: AVAILABLE -> MAINTENANCE -> AVAILABLE
          via MaintenanceWindow ACCEPTED. Repeated maintenance cycles are allowed within a single Equipment lifetime,
          unlike a linear pipeline. Different entity, different non-linear shape (cycle vs branching) — satisfies the
          differentiation clause.
        test_recipe:
          setup:
            - "Equipment E (status=AVAILABLE) created"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
          trigger:
            - "POST /equipment/{E}/maintenance-windows kind=PERIODIC start_at=2026-05-12T09:00:00Z end_at=2026-05-12T10:00:00Z -> MW1"
            - "POST /_clock/advance to 2026-05-12T09:00:00Z (MW1 SCHEDULED->IN_PROGRESS, E -> MAINTENANCE)"
            - "POST /_clock/advance to 2026-05-12T10:00:00Z (MW1 IN_PROGRESS->AWAITING_ACCEPTANCE)"
            - "POST /maintenance-windows/{MW1}/accept (E -> AVAILABLE)"
            - "POST /equipment/{E}/maintenance-windows kind=PERIODIC start_at=2026-05-12T12:00:00Z end_at=2026-05-12T13:00:00Z -> MW2"
            - "POST /_clock/advance to 2026-05-12T12:00:00Z (E -> MAINTENANCE again)"
            - "POST /_clock/advance to 2026-05-12T13:00:00Z"
            - "POST /maintenance-windows/{MW2}/accept (E -> AVAILABLE again)"
          assert:
            - "Equipment.status sequence is AVAILABLE -> MAINTENANCE -> AVAILABLE -> MAINTENANCE -> AVAILABLE"
            - "MW1.status == 'ACCEPTED' AND MW2.status == 'ACCEPTED'"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: revoke_authorization_chain
        grounds:
          - state_machines.Authorization.APPROVED_to_REVOKED
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - calculations.lab_settlement_balance
          - entities.Lab.fields.settlement_balance_cents
          - entities.AuditEvent
        distinguishing_aspect: |
          Depth-3 cascade originating from Authorization /revoke: (1) /revoke mutates Authorization.status to REVOKED;
          (2) the REVOKED transition's side_effects mutate each downstream future-dated Reservation BOOKED->CANCELLED with
          cancellation_refund_bps=10000 — caused by (1), not by the original request; (3) each cascaded Reservation cancellation
          itself mutates Lab.settlement_balance_cents (debit) and writes an AuditEvent row — caused by (2), not by (1). Each link
          is caused by the previous one (not a fan-out), as required by §0.5.
        test_recipe:
          setup:
            - "Run instance dual_variant_calc#1 setup through Authorization APPROVED"
            - "Create two future-dated reservations R_x (start 2026-05-15T09:00) and R_y (start 2026-05-15T11:00), each 1h, requested_sample_count=0, estimated_fee_cents=11250 each, estimated_owner_share_cents=8000 each"
          trigger:
            - "POST /authorizations/{A}/revoke as LabOwner O"
          assert:
            - "Authorization.status == 'REVOKED'"
            - "R_x.status == 'CANCELLED' AND R_x.cancellation_refund_bps == 10000"
            - "R_y.status == 'CANCELLED' AND R_y.cancellation_refund_bps == 10000"
            - "Lab.settlement_balance_cents decreased by 16000 (8000 per cancelled reservation)"
            - "AuditEvent rows exist for: REVOKE (subject_type=AUTHORIZATION), CANCEL R_x, CANCEL R_y (all three present)"

      - name: maintenance_window_in_progress_chain
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS
          - state_machines.Equipment.AVAILABLE_to_MAINTENANCE
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - calculations.lab_settlement_balance
        distinguishing_aspect: |
          Depth ≥ 2 cascade originating from a DIFFERENT trigger (system clock advance, not user /revoke). Chain:
          (1) clock advance triggers MaintenanceWindow SCHEDULED->IN_PROGRESS; (2) that transition mutates Equipment.status
          AVAILABLE -> MAINTENANCE — caused by (1); (3) the Equipment status change cascades overlapping BOOKED reservations
          to CANCELLED with full refund — caused by (2). Different originating transition than instance #1 (system clock vs user
          /revoke), different cascade pattern (clock-driven vs user-driven).
        test_recipe:
          setup:
            - "Equipment E (AVAILABLE), User U with APPROVED Authorization"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
            - "Create Reservation R_overlap with start_at=2026-05-12T09:30:00Z, end_at=2026-05-12T10:30:00Z"
            - "Create MaintenanceWindow MW kind=PERIODIC start_at=2026-05-12T10:00:00Z end_at=2026-05-12T11:00:00Z (overlapping)"
            - "Note: at MW creation time, MW.status=SCHEDULED, E.status=AVAILABLE, R_overlap.status=BOOKED"
          trigger:
            - "POST /_clock/advance to 2026-05-12T10:00:00Z"
          assert:
            - "MW.status == 'IN_PROGRESS'"
            - "Equipment.status == 'MAINTENANCE'"
            - "R_overlap.status == 'CANCELLED'"
            - "R_overlap.cancellation_refund_bps == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
        distinguishing_aspect: |
          Category pair (state) vs (business_temporal). When a client POSTs a reservation whose [start_at,end_at) collides
          with an existing BOOKED reservation AND the existing reservation is also CHECKED_IN (so any /check-in attempt would
          be invalid-state on the existing row), the response MUST surface ERR_RESERVATION_OVERLAP (priority 15) because the
          /reservations create endpoint hits priority 15 before priority 5. The priority order is the difference.
        test_recipe:
          setup:
            - "Equipment E, User U with APPROVED Authorization, BillingRule PUBLISHED"
            - "Create Reservation R1 [09:00,11:00) for U"
            - "POST /_clock/advance to 2026-05-12T09:00:00Z"
            - "POST /reservations/{R1}/check-in"
          trigger:
            - "POST /equipment/{E}/reservations as a second user U2 (also APPROVED) with start_at=2026-05-12T10:00:00Z, end_at=2026-05-12T12:00:00Z"
          assert:
            - "HTTP status == 409"
            - "Response error_id == 'ERR_RESERVATION_OVERLAP'"
            - "Response error_id != 'ERR_INVALID_STATE'"

      - name: business_safety_cert_vs_business_referential_auth
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - entities.Equipment.fields.calibration_expires_at
          - entities.Authorization.fields.expires_at
        distinguishing_aspect: |
          Category pair (business_referential) vs (business_safety). At /reservations create time, the order priority 7
          (Authorization referential) precedes priority 8 (Equipment certificate safety). If BOTH the authorization is
          EXPIRED AND the equipment calibration is expired, the response MUST be ERR_AUTHORIZATION_INVALID, NOT
          ERR_CERTIFICATE_EXPIRED. Different pair from instance #1 (state-vs-temporal vs referential-vs-safety).
        test_recipe:
          setup:
            - "Equipment E with calibration_expires_at=2026-05-12T00:00:00Z, safety_expires_at=2030-01-01T00:00:00Z"
            - "User U with APPROVED Authorization (expires_at=2026-05-11T00:00:00Z)"
            - "POST /_clock/advance to 2026-05-12T10:00:00Z (both auth and cert now expired)"
          trigger:
            - "POST /equipment/{E}/reservations as U with start_at=2026-05-12T11:00:00Z, end_at=2026-05-12T12:00:00Z"
          assert:
            - "HTTP status == 422"
            - "Response error_id == 'ERR_AUTHORIZATION_INVALID'"
            - "Response error_id != 'ERR_CERTIFICATE_EXPIRED'"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_refund_24h_boundary
        grounds:
          - calculations.cancellation_refund_policy
          - entities.Reservation.fields.cancellation_refund_bps
          - endpoints[POST /reservations/{reservation_id}/cancel]
        distinguishing_aspect: |
          Numeric threshold boundary on a time-delta metric (minutes-until-start), reachable through
          POST /reservations/{id}/cancel. Boundary: delta_minutes >= 1440 (exactly 24h) yields 10000 bps;
          delta_minutes == 1439 yields 5000 bps. Boundary uses '>=' so EXACTLY 24h MUST refund 100%.
        test_recipe:
          setup:
            - "Equipment E + APPROVED Authorization + Reservation R with start_at=2026-05-13T09:00:00Z, estimated_fee_cents=22500"
          trigger:
            - "POST /_clock/advance to 2026-05-12T09:00:00Z (exactly 1440 minutes before start_at)"
            - "POST /reservations/{R}/cancel as U"
          assert:
            - "R.cancellation_refund_bps == 10000"

      - name: peak_overlap_strict_positive_minutes
        grounds:
          - calculations.peak_overlap_minutes
          - calculations.estimated_fee
          - entities.Equipment.fields.peak_window_start_hour
          - entities.Equipment.fields.peak_window_end_hour
          - endpoints[POST /equipment/{equipment_id}/reservations]
        distinguishing_aspect: |
          A different metric (integer-minutes-of-overlap with a half-open window) on a DIFFERENT endpoint (reservation create).
          Boundary: peak window is [start_hour, end_hour), so a reservation whose end_at equals peak_window_start_hour has
          ZERO overlap minutes (no multiplier applied), but a reservation whose start_at equals peak_window_start_hour has
          exactly 60 minutes of overlap for a 1h reservation (multiplier applies). The strict '>' check vs '>= 1 minute'
          is the precision distinction.
        test_recipe:
          setup:
            - "Equipment E2 peak_window_start_hour=22, peak_window_end_hour=23, mode=BY_TIME, internal_rate=10000, peak_multiplier_bps=12500, platform_fee_bps=1000, consumables=500"
            - "User V with APPROVED Authorization"
          trigger:
            - "POST /equipment/{E2}/reservations [21:00, 22:00) -> R_off (end_at == peak start; 0 overlap)"
            - "POST /equipment/{E2}/reservations [23:00, 24:00) -> R_off2 (start_at == peak end; 0 overlap)"
            - "POST /equipment/{E2}/reservations [22:00, 23:00) -> R_peak (full overlap)"
          assert:
            - "R_off.priority_tier == 'OFF_PEAK' AND R_off.estimated_fee_cents == 11500  # 10000 + 1000 + 500"
            - "R_off2.priority_tier == 'OFF_PEAK' AND R_off2.estimated_fee_cents == 11500"
            - "R_peak.priority_tier == 'PEAK' AND R_peak.estimated_fee_cents == 14000  # 12500 + 1250 + 500"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_create_depends_on_equipment_status
        grounds:
          - validations[priority=6]
          - entities.Equipment.fields.status
          - state_machines.Equipment
          - endpoints[POST /equipment/{equipment_id}/reservations]
        distinguishing_aspect: |
          Reservation BOOKED creation is gated on Equipment.status == AVAILABLE. Entity pair (Reservation, Equipment).
          When Equipment.status == MAINTENANCE, creating a Reservation MUST fail with ERR_EQUIPMENT_UNAVAILABLE regardless
          of slot availability or authorization validity.
        test_recipe:
          setup:
            - "Equipment E + APPROVED Authorization for U"
            - "Create AD_HOC MaintenanceWindow at current time so Equipment.status -> MAINTENANCE"
          trigger:
            - "POST /equipment/{E}/reservations as U with valid window"
          assert:
            - "HTTP status == 409"
            - "Response error_id == 'ERR_EQUIPMENT_UNAVAILABLE'"

      - name: check_in_depends_on_authorization_status
        grounds:
          - validations[priority=7]
          - entities.Authorization.fields.status
          - entities.Authorization.fields.expires_at
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
        distinguishing_aspect: |
          Reservation BOOKED -> CHECKED_IN is gated on Authorization.status == APPROVED and Authorization.expires_at > now.
          DIFFERENT entity pair (Reservation, Authorization), not (Reservation, Equipment). Two distinct cross-entity
          relationships are exercised in this scaffold.
        test_recipe:
          setup:
            - "Equipment E + Reservation R with valid window"
            - "Authorization A used to create R; A is APPROVED at creation"
            - "POST /_clock/advance past A.expires_at so that system EXPIRES A and cascades-cancel future-dated R"
            - "If R was created within auth's validity but is BOOKED at time of expiry, the cascade in APPROVED->EXPIRED transition cancels R"
          trigger:
            - "Attempt POST /reservations/{R}/check-in as U"
          assert:
            - "HTTP status == 409"
            - "Response error_id == 'ERR_INVALID_STATE'  # R was already cascaded to CANCELLED"
            - "Authorization.status == 'EXPIRED' AND Reservation.status == 'CANCELLED' (precondition of the assert above)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_overlap
        grounds:
          - validations[priority=15]
          - concurrency_rules[Two users POST /reservations]
          - state_machines.Reservation
          - endpoints[POST /equipment/{equipment_id}/reservations]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start_at, end_at) overlap on Reservation rows for the SAME Equipment. Two
          back-to-back reservations [09:00,10:00) and [10:00,11:00) MUST NOT collide (touching endpoints are allowed —
          adjacency, no buffer). Two reservations [09:00,10:00) and [09:30,10:30) MUST collide.
        test_recipe:
          setup:
            - "Equipment E + two APPROVED Authorizations for U1 and U2"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
            - "POST /equipment/{E}/reservations as U1 [09:00,10:00) -> R1 succeeds"
          trigger:
            - "POST /equipment/{E}/reservations as U2 [10:00,11:00) -> R2 (adjacent)"
            - "POST /equipment/{E}/reservations as U2 [09:30,10:30) -> R3 (overlapping)"
          assert:
            - "R2 is created with HTTP 201"
            - "R3 fails with HTTP 409 and error_id == 'ERR_RESERVATION_OVERLAP'"

      - name: maintenance_window_overlap_blocking
        grounds:
          - validations[priority=14]
          - entities.MaintenanceWindow.fields.start_at
          - entities.MaintenanceWindow.fields.end_at
          - state_machines.MaintenanceWindow
          - endpoints[POST /equipment/{equipment_id}/reservations]
        distinguishing_aspect: |
          DIFFERENT interval semantics: aggregate-capacity blocking — ANY non-zero intersection between a candidate
          reservation [a,b) and any MaintenanceWindow in {SCHEDULED, IN_PROGRESS} rejects the reservation, including
          maintenance windows entirely contained inside the reservation AND maintenance windows entirely containing
          the reservation. The interval geometry differs from instance #1 (reservation vs reservation = peer overlap)
          because here a MaintenanceWindow can fully contain a smaller candidate reservation and still block it.
          Different resource entity (MaintenanceWindow vs Reservation), different geometry.
        test_recipe:
          setup:
            - "Equipment E + APPROVED Authorization"
            - "Create MaintenanceWindow MW SCHEDULED [10:00, 12:00)"
          trigger:
            - "POST /equipment/{E}/reservations [10:30, 11:00)  (entirely inside MW)"
            - "POST /equipment/{E}/reservations [09:00, 13:00)  (entirely contains MW)"
            - "POST /equipment/{E}/reservations [12:00, 13:00)  (adjacent, end of MW)"
          assert:
            - "First call -> HTTP 409 ERR_MAINTENANCE_BLOCK"
            - "Second call -> HTTP 409 ERR_MAINTENANCE_BLOCK"
            - "Third call -> HTTP 201 (adjacency allowed under half-open semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settlement_balance_round_trip_invariant
        grounds:
          - calculations.lab_settlement_balance
          - entities.Lab.fields.settlement_balance_cents
          - entities.Lab.fields.lifetime_settled_cents
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity #1 — global revenue identity for owner-lab:
          (settlement_balance_cents + lifetime_settled_cents) MUST equal
          sum over all COMPLETED reservations of final_owner_share_cents
          MINUS sum over all CANCELLED reservations of round_half_up(estimated_owner_share_cents * cancellation_refund_bps / 10000.0).
          A reservation that is fully confirmed and then fully cancelled with 100% refund leaves this quantity unchanged.
        test_recipe:
          setup:
            - "Lab L, Equipment E, User U, APPROVED Authorization, balance_before=Lab.settlement_balance_cents"
          trigger:
            - "POST /equipment/{E}/reservations [09:00, 11:00) (BOOKED, estimated_owner_share_cents=16000) — balance += 16000"
            - "POST /_clock/advance to 25h before start_at (full refund window)"
            - "POST /reservations/{R}/cancel  — balance -= 16000"
          assert:
            - "Lab.settlement_balance_cents == balance_before"
            - "Lab.lifetime_settled_cents unchanged"
            - "(settlement_balance_cents + lifetime_settled_cents) unchanged from initial value"

      - name: equipment_status_round_trip_invariant
        grounds:
          - state_machines.Equipment.AVAILABLE_to_MAINTENANCE
          - state_machines.Equipment.MAINTENANCE_to_AVAILABLE
          - state_machines.MaintenanceWindow
          - entities.Equipment.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 — DIFFERENT type of conserved quantity: a categorical-equality invariant on
          Equipment.status. A maintenance cycle (AVAILABLE -> MAINTENANCE on MW start, MAINTENANCE -> AVAILABLE on MW accept)
          MUST leave Equipment.status equal to its pre-cycle value (AVAILABLE), and MUST leave no MaintenanceWindow rows
          for this equipment in {SCHEDULED, IN_PROGRESS, AWAITING_ACCEPTANCE}. This is a state-equality invariant
          distinct from instance #1's numeric-sum invariant on Lab balances.
        test_recipe:
          setup:
            - "Equipment E with status=AVAILABLE; no maintenance windows"
            - "POST /_clock/advance to 2026-05-12T08:00:00Z"
          trigger:
            - "POST /equipment/{E}/maintenance-windows kind=PERIODIC [09:00, 10:00) -> MW"
            - "POST /_clock/advance to 09:00 (MW IN_PROGRESS, E MAINTENANCE)"
            - "POST /_clock/advance to 10:00 (MW AWAITING_ACCEPTANCE)"
            - "POST /maintenance-windows/{MW}/accept (MW ACCEPTED, E AVAILABLE)"
          assert:
            - "Equipment.status == 'AVAILABLE'"
            - "No MaintenanceWindow with status in {SCHEDULED, IN_PROGRESS, AWAITING_ACCEPTANCE} for E"
            - "Exactly one MaintenanceWindow row for E with status='ACCEPTED'"
