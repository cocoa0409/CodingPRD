            - "GET /wbl/worksites/${ws_id}/supervisors returns exactly one row whose id == ${sup_id}"

      - name: employer_partner_list_with_limit_over_the_maximum_rejected
        claim_type: Standard CRUD
        grounds:
          - validations[priority=8]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Pagination limits are validated, not clamped: limit 101 exceeds the declared maximum of 100
          and must return 400 ERR_INVALID_REQUEST rather than silently serving 100 rows.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z with one partner stored"
