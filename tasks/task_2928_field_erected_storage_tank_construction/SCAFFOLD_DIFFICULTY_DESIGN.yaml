  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: weld_log_gate_reads_welder_qualification_status
        grounds:
          - validations.priority_25_ERR_WELDER_NOT_QUALIFIED
          - state_machines.Welder.QUALIFIED_to_REVOKED
          - state_machines.Welder.QUALIFIED_to_QUALIFIED_continuity_refresh
          - state_machines.WeldSeam.FIT_READY_to_WELDED
          - endpoints.POST_weld_seams_weld_log
        distinguishing_aspect: |
          Entity pair WeldSeam <- Welder. The gated entity's own state is legal throughout
          (the seam never leaves FIT_READY on the failing call); what blocks the write is
          the qualification_status of a *different* entity that the payload merely
          references. The same seam, same course, same tank and same request shape then
          succeed the moment a different Welder row supplies a QUALIFIED status, proving
          the gate is read from the Welder and not from the seam or the tank.
        test_recipe:
          setup:
