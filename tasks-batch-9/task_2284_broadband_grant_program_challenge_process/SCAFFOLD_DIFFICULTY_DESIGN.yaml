      - name: location_parallel_eligibility_and_service_axes
        grounds:
          - state_machines.EligibleLocation.eligibility_state
          - state_machines.EligibleLocation.service_state
          - entities.EligibleLocation.fields.awarded_award_id
          - state_machines.Award
        distinguishing_aspect: |
          EligibleLocation carries two independent state axes, so a single terminate call moves
