# =============================================================================
# §1.9 Scaffold Corner Design — task 1915 transit bus maintenance
# Breadth coverage of every §1.1-§1.7 claim not already probed by §1.8.
# Clock default 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: bus_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Bus
        distinguishing_aspect: "POST /fleet/buses returns 201 with server-minted id, version 1, service_status ACTIVE, availability_status AVAILABLE, odometer_miles copied from initial_odometer_miles, and empty hold_reasons."
        test_recipe:
          setup: ["Empty DB, clock default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/buses", payload: { fleet_number: "D1", vin: "VIND1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 12345, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, v: $.data.version, ss: $.data.service_status, av: $.data.availability_status, odo: $.data.odometer_miles } }
          assert:
            - "201; id is a UUID; version == 1; service_status == ACTIVE; availability_status == AVAILABLE; odometer_miles == 12345; hold_reasons == []"

      - name: bus_create_missing_required_fleet_number_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Bus.fields.fleet_number
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required input fleet_number yields ERR_VALIDATION (400) and no Bus is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/buses", payload: { vin: "VINX", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_VALIDATION", "HTTP 400"]

      - name: defect_create_invalid_severity_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DefectReport.fields.severity
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "severity outside {SAFETY_CRITICAL, MAJOR, MINOR} is rejected with ERR_VALIDATION before any state change."
        test_recipe:
          setup: ["One ACTIVE bus"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "D2", vin: "VIND2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "CATASTROPHIC", defect_code: "ENGINE", description: "bad enum", odometer_at_report: 100 }, as: Operator, captures: { err: $.data.error_id } }
          assert: ["err == ERR_VALIDATION", "HTTP 400", "No defect persisted (GET /fleet/buses/${b}/defect-reports returns empty array)"]

      - name: part_computed_fields_derive_from_stock_inputs
        claim_type: computed_fields
        grounds:
          - entities.Part.fields.quantity_available
          - entities.Part.fields.stock_status
        distinguishing_aspect: "quantity_available and stock_status are computed: creating a part with on_hand 7 and reorder_point 2 yields available 7 and NORMAL without any client-supplied values."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/parts", payload: { sku: "P-CMP", description: "Computed check", part_class: "CONSUMABLE", unit_cost_cents: 1000, reorder_point: 2, initial_on_hand: 7, warranty_eligible: false }, as: PartsClerk, captures: { av: $.data.quantity_available, st: $.data.stock_status, oh: $.data.quantity_on_hand, rs: $.data.quantity_reserved } }
          assert: ["quantity_on_hand == 7", "quantity_reserved == 0", "quantity_available == 7", "stock_status == NORMAL (7 > reorder_point 2)"]

      - name: bus_get_nonexistent_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fleet/buses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FleetManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND", "HTTP 404"]

      - name: bus_list_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Default pagination is limit 10 / offset 0: with 12 buses the first read reports total_count 12 and has_more true; limit=5&offset=10 returns the final 2 with has_more false."
        test_recipe:
          setup: ["Twelve ACTIVE buses"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "L01", vin: "VINL01", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L02", vin: "VINL02", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L03", vin: "VINL03", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L04", vin: "VINL04", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L05", vin: "VINL05", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L06", vin: "VINL06", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L07", vin: "VINL07", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L08", vin: "VINL08", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L09", vin: "VINL09", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L10", vin: "VINL10", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L11", vin: "VINL11", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "L12", vin: "VINL12", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
          trigger:
            - { call: "GET /fleet/buses", payload: {}, as: FleetManager, captures: { page1: $.data } }
            - { call: "GET /fleet/buses?limit=5&offset=10", payload: {}, as: FleetManager, captures: { page2: $.data } }
          assert:
            - "First read: 10 items (default limit), total_count == 12, has_more == true"
            - "Second read: 2 items, has_more == false"

  # -------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: wo_submit_qa_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SUBMIT_QA is only defined from IN_PROGRESS; from DRAFT it is rejected with ERR_INVALID_STATE (409) and no side effects fire."
        test_recipe:
          setup: ["One DRAFT CORRECTIVE work order"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T1", vin: "VINT1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "00000000-0000-4000-8000-0000000000aa", captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE", "HTTP 409", "WO remains DRAFT"]

      - name: wo_cancel_on_closed_returns_already_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.WorkOrder
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CLOSED is terminal: a subsequent CANCEL is rejected with ERR_ALREADY_TERMINAL and no compensation side effects fire."
        test_recipe:
          setup: ["One CLOSED CORRECTIVE WO (lead m1, QA m2 with QA_AUTHORITY)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T2", vin: "VINT2", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "T2A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "T2B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "CANCEL", cancel_reason: "too late" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert: ["err == ERR_ALREADY_TERMINAL", "HTTP 409", "WO remains CLOSED"]

      - name: work_order_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.WorkOrder
        distinguishing_aspect: "A created work order starts in DRAFT with odometer_at_open and opened_date snapshotted and all cost counters zero."
        test_recipe:
          setup: ["One ACTIVE bus with odometer 43210"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T3", vin: "VINT3", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 43210, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ELECTIVE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { st: $.data.status, odo: $.data.odometer_at_open, od: $.data.opened_date, lt: $.data.labor_total_cents, pt: $.data.parts_total_cents } }
          assert: ["status == DRAFT", "odometer_at_open == 43210", "opened_date == 2026-08-01 (logical clock default)", "labor_total_cents == 0 and parts_total_cents == 0"]

      - name: wo_cancel_releases_reserved_parts_and_unlinks_defect
        claim_type: side_effect_execution
        grounds:
          - state_machines.WorkOrder
          - state_machines.WorkOrderPartLine.RESERVED_to_RELEASED
        distinguishing_aspect: "CANCEL of a SCHEDULED WO with a RESERVED line and a linked defect releases the reservation (Part.quantity_reserved back to 0, line RELEASED) and reverts the defect to SHOP_QUEUED with linked_work_order_id cleared."
        test_recipe:
          setup:
            - "MINOR defect triaged to SHOP_QUEUED; CORRECTIVE WO citing it SCHEDULED (defect WO_LINKED); part line qty 2 RESERVED (part on_hand 5)"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T4", vin: "VINT4", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/parts", payload: { sku: "P-T4", description: "Hose", part_class: "CONSUMABLE", unit_cost_cents: 1200, reorder_point: 0, initial_on_hand: 5, warranty_eligible: false }, as: PartsClerk, captures: { p: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MINOR", defect_code: "HVAC", description: "rattle", odometer_at_report: 100 }, as: Operator, captures: { d: $.data.id } }
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "TRIAGE", disposition: "SHOP" }, as: MaintenanceSupervisor }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: MaintenanceSupervisor, captures: { bv: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", defect_report_id: "${d}", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 2400, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p}", qty: 2 }, as: PartsClerk, captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "CANCEL", cancel_reason: "duplicate report" }, as: MaintenanceSupervisor, captures: { wst: $.data.status } }
            - { call: "GET /fleet/part-lines/${ln}", payload: {}, as: PartsClerk, captures: { lst: $.data.issue_status } }
            - { call: "GET /fleet/parts/${p}", payload: {}, as: PartsClerk, captures: { oh: $.data.quantity_on_hand, rs: $.data.quantity_reserved } }
            - { call: "GET /fleet/defect-reports/${d}", payload: {}, as: MaintenanceSupervisor, captures: { dst: $.data.status, dlink: $.data.linked_work_order_id } }
          assert:
            - "WO status == CANCELLED; line issue_status == RELEASED"
            - "Part quantity_on_hand == 5 and quantity_reserved == 0 (reservation fully compensated)"
            - "Defect status == SHOP_QUEUED with linked_work_order_id null"

      - name: bus_parallel_dimensions_overhaul_hold_vs_availability
        claim_type: shape_parallel
        grounds:
          - state_machines.Bus
        distinguishing_aspect: "Bus carries two independent dimensions: starting an OVERHAUL WO flips service_status ACTIVE->OVERHAUL_HOLD while availability moves AVAILABLE->IN_SHOP; closing restores both independently (ACTIVE + AVAILABLE) and stamps last_overhaul_miles."
        test_recipe:
          setup: ["Bus odometer 100000 (warranty-ineligible); OVERHAUL WO estimated 5000000c <= cap 12000000c; lead m1 holds ENGINE cert; QA m2"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T5", vin: "VINT5", model_year: 2019, in_service_date: "2020-01-01", initial_odometer_miles: 100000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2022-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "T5A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "ENGINE", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "T5B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "OVERHAUL", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-20", estimated_labor_hours: 40, estimated_cost_cents: 5000000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { ss1: $.data.service_status, av1: $.data.availability_status } }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-05", shift_type: "DAY", hours: 8 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { ss2: $.data.service_status, av2: $.data.availability_status, lo: $.data.last_overhaul_miles } }
          assert:
            - "After START: service_status == OVERHAUL_HOLD and availability_status == IN_SHOP"
            - "After QA_CERTIFY close: service_status == ACTIVE, availability_status == AVAILABLE, last_overhaul_miles == 100000"

      - name: defect_deferral_epoch_reopen_cycle
        claim_type: cyclic
        grounds:
          - state_machines.DefectReport.DEFERRED_to_OPEN
        distinguishing_aspect: "DEFERRED is not sticky: a MAJOR defect deferred to 2026-08-05 (within the 7-day window) reopens to OPEN via run_epoch once the clock passes the defer date — a deferral-lapse cycle."
        test_recipe:
          setup: ["MAJOR defect on a bus; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "T6", vin: "VINT6", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MAJOR", defect_code: "ENGINE", description: "oil leak", odometer_at_report: 100 }, as: Operator, captures: { d: $.data.id } }
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "TRIAGE", disposition: "DEFER", defer_until_date: "2026-08-05", defer_justification: "parts on order" }, as: MaintenanceSupervisor, captures: { st1: $.data.status, dc: $.data.defer_count } }
          trigger:
            - { call: "POST /fleet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: FleetManager }
            - { call: "POST /fleet/run_epoch", payload: {}, as: FleetManager, captures: { reopened: $.data.defects_reopened } }
            - { call: "GET /fleet/defect-reports/${d}", payload: {}, as: MaintenanceSupervisor, captures: { st2: $.data.status } }
          assert:
            - "After TRIAGE(DEFER): status == DEFERRED, defer_count == 1"
            - "run_epoch reports defects_reopened == 1"
            - "Defect status == OPEN again (cycle), disposition cleared"

      - name: awaiting_parts_auto_resume_when_last_line_issued
        claim_type: side_effect_execution
        grounds:
          - state_machines.WorkOrder.AWAITING_PARTS_to_IN_PROGRESS
        distinguishing_aspect: "System auto-transition: a WO in AWAITING_PARTS returns to IN_PROGRESS the moment its last RESERVED part line leaves RESERVED (here via ISSUE) — no explicit RESUME_WORK call."
        test_recipe:
          setup: ["IN_PROGRESS CORRECTIVE WO (lead m1); part on_hand 3"]
          setup_api_calls:
