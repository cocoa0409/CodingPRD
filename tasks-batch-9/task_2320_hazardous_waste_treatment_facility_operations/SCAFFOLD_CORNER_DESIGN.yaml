      - name: sample_recorder_cannot_sign_the_same_profiles_decision_forbidden
        claim_type: segregation_of_duties
        grounds:
          - rbac.segregation_of_duties[0]
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Both callers hold the same role, so the check cannot be role-based: it compares X-User-ID with
