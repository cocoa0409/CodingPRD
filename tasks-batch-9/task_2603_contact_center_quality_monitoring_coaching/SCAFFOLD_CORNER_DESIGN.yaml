            - "trigger 9 -> SamplePlan.${pl2}.pinned_form_guidance_version == 2, captured at open time from the bumped form"
            - "trigger 12 -> HTTP 201: Evaluation.${e2}.pinned_guidance_version == 2 and review_status == DRAFT -- the same evaluator, agent and interaction now pass, so the refusal was about the pinned number and nothing else"
      - name: validation_escalation_waits_for_the_due_date_to_the_second
        claim_type: temporal_validation
        grounds:
          - validations[priority=25]
          - validations[priority=49]
          - calculations.coaching_requirement
          - endpoints[POST /coaching-plans/{id}/escalate]
        distinguishing_aspect: "A T1 plan created at 2026-08-05T09:00:00Z is due exactly 30 days later, and the agent carries 0 open findings, so the alternative immediate route (>= ESCALATION_FINDING_THRESHOLD 2) is closed. Escalation is therefore ERR_ESCALATION_NOT_DUE at creation time and one second before due_at, and legal at due_at itself -- and the successful escalation rewrites escalation_tier to T3 while leaving required_session_count and due_at exactly as coaching_requirement computed them."
        test_recipe:
          setup:
            - "canonical prelude through one submitted evaluation at 82.00 (PASS, 0 findings), then a coaching plan with target_score 85.00 -> deficit 3.00, tier T1, required_session_count 2, due_at 2026-09-04T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, max_points: 5, compliance_critical: true, auto_fail_on_violation: true, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 20.00, max_points: 5, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 35.00, max_points: 5, guidance_text: "Resolve or set a next step." }, { code: "SURVEY", label: "Survey", weight_pct: 15.00, max_points: 5, allows_not_applicable: true, guidance_text: "Invite to the survey." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 100, targeted_pct: 0, customer_flagged_pct: 0 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 3, SURVEY: 5 } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "GET /agents/${ag1}"
              payload: {}
              as: Supervisor
              captures: { agv: $.data.version }
            - call: "POST /coaching-plans"
              payload: { agent_id: "${ag1}", source_evaluation_id: "${e1}", assigned_supervisor_id: "SUP-1", target_score: 85.00, expected_agent_version: "${agv}" }
              as: Supervisor
              captures: { cp1: $.data.id }
          trigger:
            - call: "POST /coaching-plans/${cp1}/escalate"
              payload: { escalation_note: "Escalating on day one." }
              as: QualityManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T08:59:59Z" }
              as: QualityManager
            - call: "POST /coaching-plans/${cp1}/escalate"
              payload: { escalation_note: "One second early." }
              as: QualityManager
            - call: "POST /_clock/set_current_utc"
