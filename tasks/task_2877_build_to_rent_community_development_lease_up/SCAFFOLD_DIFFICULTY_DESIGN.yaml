# §1.8 Scaffold Difficulty Design — Test Targeting Index for task 2877
# Build-to-Rent Community Development & Lease-Up.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. All numeric asserts were
# produced by executing the §1.3 formulas with Decimal/ROUND_HALF_UP.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: concession_straight_line_versus_upfront_from_identical_lease_inputs
        grounds:
          - calculations.concession_amortization
          - entities.ConcessionProgram.fields.amortization_mode
          - entities.Lease.fields.concession_schedule
          - entities.Lease.fields.first_period_charge_cents
          - entities.Lease.fields.net_effective_rent_cents
          - state_machines.Lease.concession.NONE_to_REQUESTED
        distinguishing_aspect: |
          Two leases with byte-identical pricing inputs (gross_monthly_charge_cents 298050,
          term_months 12, free_weeks 6) diverge purely on ConcessionProgram.amortization_mode:
          STRAIGHT_LINE_NET_EFFECTIVE yields a 12-period schedule whose first credit is 34390 and
          first_period_charge_cents 263660, while UPFRONT_FREE_RENT yields a 2-period schedule whose
          first credit is 298050 and first_period_charge_cents 0 — yet total_concession_cents (412685)
          and net_effective_rent_cents (263660) are identical under both modes.
        test_recipe:
          setup:
            - "Community 'Aster Ridge' with total_planned_units 2, product_mix {DETACHED: 2, COTTAGE: 0, TOWNHOME: 0}, concession_budget_cents 5000000, plat_status APPROVED, posture OPEN, lifecycle_status LEASE_UP."
            - "One PUBLISHED DETACHED MarketRentSchedule at asking_rent_cents 285000 effective 2026-08-01T00:00:00Z."
            - "Housing phase in status SECTIONS_RELEASED with two AVAILABLE DETACHED homesites."
            - "ConcessionProgram CP-SL (STRAIGHT_LINE_NET_EFFECTIVE, free_weeks 6) requested on lease L1 while it was ACTIVE, then superseded by ConcessionProgram CP-UP (UPFRONT_FREE_RENT, free_weeks 6)."
            - "Lease L1 on homesite 1 and Lease L2 on homesite 2, both DRAFT, both base_rent_cents 285000 / community_services_fee_cents 13050 / gross_monthly_charge_cents 298050, term_months 12."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Aster Ridge", market_code: "TX-DFW", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 5000000, facility_commitment_cents: 80000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c1: $.data.id }
            - call: "POST /communities/${c1}/plat-submissions"
              payload: { plat_package_reference: "PLAT-AR-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c1}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c1}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { c1_v1: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c1}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${c1_v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { sch1: $.data.id }
            - call: "POST /phases"
              payload: { community_id: "${c1}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 2, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph1: $.data.id }
            - call: "POST /phases/${ph1}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph1}", lot_number: "L1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs1: $.data.id }
            - call: "POST /homesites"
              payload: { phase_id: "${ph1}", lot_number: "L2", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs2: $.data.id }
            - call: "POST /homesites/${hs1}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-AR-L1", issued_at: "2026-08-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites/${hs2}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-AR-L2", issued_at: "2026-08-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /phases/${ph1}/section-releases"
              payload: { homesite_ids: ["${hs1}", "${hs2}"] }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "GET /communities/${c1}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { c1_v2: $.data.version }
            - call: "POST /concession-programs"
              payload: { community_id: "${c1}", program_code: "CP-SL", tier: "AGGRESSIVE", free_weeks: 6, amortization_mode: "STRAIGHT_LINE_NET_EFFECTIVE", eligible_product_types: ["DETACHED"], restricted_posture_eligible: false, max_budget_cents: 2000000, expected_community_version: "${c1_v2}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { cp_sl: $.data.id }
            - call: "POST /households"
              payload: { primary_applicant_name: "Ann Reyes", email: "ann@example.com", household_size: 4, monthly_income_cents: 1200000, credit_tier: "A" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { hh1: $.data.id }
            - call: "POST /households"
              payload: { primary_applicant_name: "Ben Ortiz", email: "ben@example.com", household_size: 3, monthly_income_cents: 1200000, credit_tier: "A" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { hh2: $.data.id }
            - call: "POST /leases"
              payload: { homesite_id: "${hs1}", household_id: "${hh1}", term_months: 12, start_date: "2026-08-01T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { l1: $.data.id }
            - call: "POST /leases"
              payload: { homesite_id: "${hs2}", household_id: "${hh2}", term_months: 12, start_date: "2026-08-01T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { l2: $.data.id }
            - call: "POST /leases/${l1}/concession-requests"
              payload: { concession_program_id: "${cp_sl}" }
              as: LeasingAgent
              as_user_id: "u_la_1"
            - call: "GET /communities/${c1}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { c1_v3: $.data.version }
            - call: "POST /concession-programs"
              payload: { community_id: "${c1}", program_code: "CP-UP", tier: "AGGRESSIVE", free_weeks: 6, amortization_mode: "UPFRONT_FREE_RENT", eligible_product_types: ["DETACHED"], restricted_posture_eligible: false, max_budget_cents: 2000000, expected_community_version: "${c1_v3}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { cp_up: $.data.id }
          trigger:
            - call: "POST /leases/${l2}/concession-requests"
              payload: { concession_program_id: "${cp_up}" }
              as: LeasingAgent
              as_user_id: "u_la_1"
          assert:
            - "Lease.${l1}.total_concession_cents == 412685"
            - "Lease.${l2}.total_concession_cents == 412685"
            - "Lease.${l1}.concession_schedule has length 12 and concession_schedule[0].credit_cents == 34390"
            - "Lease.${l1}.concession_schedule[11].credit_cents == 34395"
            - "sum of Lease.${l1}.concession_schedule[*].credit_cents == 412685"
            - "Lease.${l2}.concession_schedule has length 2 with credit_cents [298050, 114635]"
            - "Lease.${l1}.monthly_concession_credit_cents == 34390"
            - "Lease.${l2}.monthly_concession_credit_cents == 298050"
            - "Lease.${l1}.first_period_charge_cents == 263660"
            - "Lease.${l2}.first_period_charge_cents == 0"
            - "Lease.${l1}.net_effective_rent_cents == 263660"
            - "Lease.${l2}.net_effective_rent_cents == 263660"
            - "Lease.${l1}.concession_remaining_cents == 412685 and Lease.${l2}.concession_remaining_cents == 412685"
            - "ConcessionProgram.${cp_sl}.status == SUPERSEDED and ConcessionProgram.${cp_up}.status == ACTIVE"

      - name: stabilized_valuation_trailing_actual_versus_forward_stabilized_same_state
        grounds:
          - calculations.stabilized_valuation
          - entities.Community.fields.facility_commitment_cents
          - entities.Community.fields.total_planned_units
          - entities.Lease.fields.gross_monthly_charge_cents
          - validations[priority=82]
        distinguishing_aspect: |
          Read against one unchanged community with exactly one ACTIVE lease, TRAILING_ACTUAL counts
          only the in-place 298050 and applies no vacancy deduction (value_cents 44962971,
          loan_to_value_bps 17792, covenant_satisfied false) while FORWARD_STABILIZED adds pro-forma
          rent for the three unleased planned units and a 500 bps vacancy deduction (value_cents
          165248533, loan_to_value_bps 4841, covenant_satisfied true) — a 3.67x value divergence from
          identical stored data, with the covenant verdict flipping between the two bases.
        test_recipe:
          setup:
            - "Community 'Bluff Commons' with total_planned_units 4, product_mix {DETACHED: 4, COTTAGE: 0, TOWNHOME: 0}, facility_commitment_cents 80000000, plat APPROVED, posture OPEN, lifecycle_status LEASE_UP, facility_status ADVANCE_ELIGIBLE, construction_impact_credit_cents 0."
            - "One PUBLISHED DETACHED schedule at 285000; one released AVAILABLE-then-LEASED homesite."
            - "Exactly one lease in lease_status ACTIVE with gross_monthly_charge_cents 298050, concession_status NONE and monthly_concession_credit_cents 0; occupancy_ratio 0.2500."
