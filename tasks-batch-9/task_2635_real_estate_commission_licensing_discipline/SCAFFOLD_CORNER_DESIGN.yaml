      - name: twenty_five_individually_legal_affiliations_close_the_brokerage_to_the_twenty_sixth
        claim_type: aggregate_validation
        grounds:
          - validations[priority=31]
          - errors.ERR_SUPERVISION_RATIO_EXCEEDED
          - calculations.brokerage_supervision_posture
        distinguishing_aspect: |
          Every one of the 25 affiliations is individually valid; only the collective count trips the
          rule, and the count is COMPUTED (ACTIVE affiliates only), so parking one licence with
          GO_INACTIVE immediately re-opens the seat for the licensee who was just refused. The cap is
          also checked BEFORE the affiliation is applied, so the boundary is 25 seated, not 26.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising, so affiliated_licensee_count == 1"
            - "salespersons Sales 02 and Sales 03 are created, examined and affiliated below, taking the count to 3"
