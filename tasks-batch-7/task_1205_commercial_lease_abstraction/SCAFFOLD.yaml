  - method: POST
    path: "/lease-admin/leases/{lease_id}/tenant-challenges"
    description: "Open a TenantChallenge against a Reconciliation (and optionally one RecoveryBilling)"
    roles: [PropertyManager]
    code: 201
    input: [reconciliation_id, "recovery_billing_id?", reason_code, claimed_overbilling_cents]
    output: TenantChallenge
    side_effects: ["status=OPEN, round_index=0", "Reconciliation APPROVED -> CHALLENGED", "if recovery_billing_id: RecoveryBilling ISSUED -> DISPUTED", "Lease.billing_posture recomputed"]

  - method: GET
    path: "/lease-admin/leases/{lease_id}/tenant-challenges"
    description: "List TenantChallenges for a Lease"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TenantChallenge[]
    side_effects: []

  - method: GET
    path: "/lease-admin/tenant-challenges/{challenge_id}"
    description: "Get one TenantChallenge"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant]
    code: 200
    input: []
    output: TenantChallenge
    side_effects: []

  - method: POST
    path: "/lease-admin/tenant-challenges/{challenge_id}/start-review"
    description: "OPEN -> UNDER_REVIEW"
    roles: [LeaseAccountant]
    code: 200
    input: []
    output: TenantChallenge
    side_effects: []

  - method: POST
    path: "/lease-admin/tenant-challenges/{challenge_id}/reopen"
    description: "UNDER_REVIEW -> OPEN (negotiation round)"
    roles: [LeaseAccountant]
    code: 200
    input: []
    output: TenantChallenge
    side_effects: ["round_index += 1"]

  - method: POST
    path: "/lease-admin/tenant-challenges/{challenge_id}/resolve"
    description: "UNDER_REVIEW -> RESOLVED_ACCEPTED or RESOLVED_REJECTED"
    roles: [PortfolioManager]
    code: 200
    input: [outcome, resolution_delta_cents]
    output: TenantChallenge
    side_effects: ["status=RESOLVED_ACCEPTED or RESOLVED_REJECTED", "Reconciliation.true_up_cents adjusted if accepted", "linked RecoveryBilling DISPUTED -> ISSUED"]

  - method: POST
    path: "/lease-admin/tenant-challenges/{challenge_id}/escalate"
    description: "UNDER_REVIEW -> ESCALATED"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TenantChallenge
    side_effects: ["starts 30-day audit invocation deadline"]

  - method: POST
    path: "/lease-admin/tenant-challenges/{challenge_id}/withdraw"
    description: "OPEN -> WITHDRAWN"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TenantChallenge
    side_effects: ["linked RecoveryBilling DISPUTED -> ISSUED", "Reconciliation CHALLENGED -> APPROVED if no other open challenges"]

