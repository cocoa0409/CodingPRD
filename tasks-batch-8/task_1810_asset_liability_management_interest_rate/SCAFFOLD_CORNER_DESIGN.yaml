      - name: book_activation_requires_asset_and_liability
        claim_type: conditional_action
        grounds: [state_machines.AlmBook.DRAFT_to_ACTIVE, "errors[ERR_BOOK_ACTIVATION_INCOMPLETE]"]
        distinguishing_aspect: "A book with only an asset position cannot activate; adding a liability position then succeeds."
        test_recipe:
          setup: ["book with one LOAN position only"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
