      - name: strategy_decision_on_a_draft_strategy_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.DeRiskingStrategy.transitions
          - errors.ERR_STRATEGY_STATE_INVALID
        distinguishing_aspect: |
          The decision trigger is only defined from UNDER_EVALUATION. Firing it on a
          DRAFT strategy must be a 409 on the machine's own state — not a 403, and
          not a silent approval — and the strategy must remain DRAFT with
          decided_by_user_id still null so no partial write leaks.
        test_recipe:
          setup:
            - "one PensionPlan with one DRAFT strategy that has never been submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
