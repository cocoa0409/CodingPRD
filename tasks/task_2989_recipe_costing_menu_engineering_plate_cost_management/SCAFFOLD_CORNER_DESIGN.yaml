            - call: "POST /culinary/recipes"
              payload: { code: "SR1", name: "Level One", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sr1: $.data.id, sr1_v0: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "SR2", name: "Level Two", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sr2: $.data.id, sr2_v0: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "SR3", name: "Level Three", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sr3: $.data.id, sr3_v0: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "SR4", name: "Level Four", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sr4: $.data.id, sr4_v0: $.data.version }
            - call: "POST /culinary/recipes"
              payload: { code: "SR5", name: "Level Five", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { sr5: $.data.id, sr5_v0: $.data.version }
            - call: "POST /culinary/recipes/${sr2}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr1}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr2_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sr3}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr2}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr3_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sr4}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr3}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr4_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sr5}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr4}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr5_v0}" }
              as: RecipeDeveloper
              captures: { sr5_depth: $.data.recipe_id }
            - call: "GET /culinary/recipes/${sr5}"
              as: RecipeDeveloper
              captures: { d5: $.data.depth }
            - call: "GET /culinary/recipes/${sr4}"
              as: RecipeDeveloper
              captures: { d4: $.data.depth, sr4_v1: $.data.version }
          trigger:
            - call: "POST /culinary/recipes/${sr1}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr1}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr1_v0}" }
              as: RecipeDeveloper
              captures: { e_self: $.data.error_id }
            - call: "POST /culinary/recipes/${sr1}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr5}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr1_v0}" }
              as: RecipeDeveloper
              captures: { e_cycle: $.data.error_id }
            - call: "POST /culinary/recipes/${sr1}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr0}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sr1_v0}" }
              as: RecipeDeveloper
              captures: { e_depth: $.data.error_id }
            - call: "GET /culinary/recipes/${sr1}"
              as: RecipeDeveloper
              captures: { sr1_count: $.data.component_count, sr1_v_after: $.data.version, sr1_depth: $.data.depth }
            - call: "POST /culinary/recipes/${sr4}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sr0}", ep_quantity_base_units: 100, sequence_no: 2, expected_recipe_version: "${sr4_v1}" }
              as: RecipeDeveloper
              captures: { ok_id: $.data.id }
            - call: "GET /culinary/recipes/${sr5}"
              as: RecipeDeveloper
              captures: { d5_after: $.data.depth }
          assert:
            - "${d5} == 4 == MAX_RECIPE_DEPTH and ${d4} == 3 — the chain starts exactly at the limit"
            - "${e_self} == ERR_RECIPE_CYCLE (422) — a self-referential component is the degenerate cycle"
            - "${e_cycle} == ERR_RECIPE_CYCLE (422), NOT ERR_RECIPE_DEPTH_EXCEEDED: adding SR5 under SR1 violates both rules and priority 34 outranks 35"
            - "${e_depth} == ERR_RECIPE_DEPTH_EXCEEDED (422) — SR0 closes no cycle, but SR1 becoming depth 1 makes SR5 depth 5, so the error is raised on behalf of a recipe absent from the request"
            - "${sr1_count} == 0, ${sr1_depth} == 0 and ${sr1_v_after} == ${sr1_v0} — all three rejections wrote nothing"
            - "${ok_id} is minted and ${d5_after} == 4 — SR4 already had depth 3 from SR3, so attaching a depth-0 child leaves max() unchanged; the limit is a max over children, not a sum"

      - name: an_approved_spec_change_blocks_the_review_close_until_the_counts_are_drained
        claim_type: violation_to_error
        grounds:
          - validations[priority 25] ERR_COUNT_SHEET_OUT_OF_DATE
          - state_machines[SpecChangeOrder] approval_status PENDING -> APPROVED
          - state_machines[MenuPeriodReview] CLASSIFIED -> CLOSED
        distinguishing_aspect: "Cascading validation across three aggregates: an approved COMPONENT_QTY order on the recipe flips the review's count line to OUT_OF_DATE, and the close then fails with ERR_COUNT_SHEET_OUT_OF_DATE even though the review itself is untouched and CLASSIFIED. Draining the COUNT_SHEETS propagation recomputes expected_base_units from 10000 to 12500 and re-arms the close. The close is NOT gated on the recipe's cost_state, which the same approval also flipped to STALE — only the count sheet's sync_state matters."
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00.000Z. GRILL WORLD complete (CHEDDAR at ep 400, portions 4, MI-GRILL-MW ACTIVE at plate 100)."
            - "One SALES_MIX_BASED review on STORE-001 for [2026-07-01, 2026-08-01) loaded in the only order the state machine permits: mix line (100 units, 40000 cents) -> count line (opening 10500, received 0, counted 300) -> classify. The count line reads expected 10000, used 10200, variance 200, sync_state CURRENT."
          setup_api_calls:
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              captures: { comp_id: $.data.id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 100, gross_sales_cents: 40000 }
              as: CostAnalyst
            - call: "POST /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { ingredient_id: "${ched_id}", opening_base_units: 10500, received_base_units: 0, counted_base_units: 300 }
              as: CostAnalyst
              captures: { cl_id: $.data.id, cl_exp: $.data.expected_base_units, cl_used: $.data.used_base_units, cl_var: $.data.variance_base_units, cl_sync: $.data.sync_state }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/classify"
              as: CostAnalyst
              captures: { rev_st: $.data.status }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { rv: $.data.version }
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${grill_id}", change_type: "COMPONENT_QTY", target_component_id: "${comp_id}", new_ep_quantity_base_units: 500, expected_recipe_version: "${rv}" }
              as: RecipeDeveloper
              captures: { sco_id: $.data.id }
            - call: "POST /culinary/spec-change-orders/${sco_id}/submit"
              as: RecipeDeveloper
              as_user_id: "user-dev-1"
            - call: "POST /culinary/spec-change-orders/${sco_id}/approve"
              as: CulinaryDirector
              as_user_id: "user-dir-1"
              captures: { sco_appr: $.data.approval_status, sco_prop: $.data.propagation_status }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/close"
              as: CostAnalyst
              captures: { e_close: $.data.error_id }
            - call: "GET /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { s1: "$.data[0].sync_state", e1: "$.data[0].expected_base_units", v1: "$.data[0].variance_base_units" }
            - call: "POST /culinary/spec-change-orders/${sco_id}/propagate"
              payload: { target: "COUNT_SHEETS" }
              as: CostAnalyst
              captures: { prop_after: $.data.propagation_status }
            - call: "GET /culinary/menu-period-reviews/${rev_id}/count-lines"
              payload: { limit: 10, offset: 0 }
              as: CostAnalyst
              captures: { s2: "$.data[0].sync_state", e2: "$.data[0].expected_base_units", v2: "$.data[0].variance_base_units", sv2: "$.data[0].synced_spec_version" }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/close"
              as: CostAnalyst
              captures: { r_st: $.data.status, theo: $.data.theoretical_food_cost_cents, act: $.data.actual_food_cost_cents, vb: $.data.variance_bps, vf: $.data.variance_flag }
          assert:
            - "${cl_exp} == 10000 == floor(100 * round_half_up(400*1000000/4) / 1000000), ${cl_used} == 10200, ${cl_var} == 200 and ${cl_sync} == CURRENT; ${rev_st} == CLASSIFIED"
            - "${sco_appr} == APPROVED and ${sco_prop} == NOT_STARTED — the approval dimension moved, the propagation dimension did not"
            - "${e_close} == ERR_COUNT_SHEET_OUT_OF_DATE (409) — raised by a cascade the review never participated in"
            - "${s1} == OUT_OF_DATE with ${e1} == 10000 and ${v1} == 200 still holding the pre-change figures: the invalidation flags, it does not recompute"
            - "${prop_after} == COUNTS_SYNCED"
            - "${s2} == CURRENT, ${e2} == 12500 == floor(100 * round_half_up(500*1000000/4) / 1000000), ${v2} == -2300 == 10200 - 12500 and ${sv2} == the recipe version the approval left behind"
            - "${r_st} == CLOSED with ${theo} == 10000 == 100 * the 100-cent snapshot, ${act} == 9894 == round_half_up(round_half_up(10200*22000000/2268)/10000) and ${vb} == -106"
            - "${vf} == WITHIN_TOLERANCE — abs(-106) <= VARIANCE_TOLERANCE_BPS 300; the close succeeded while the recipe's own cost_state was STALE, because no gate reads it"

      - name: cooling_off_and_one_live_proposal_per_item_interlock
        claim_type: violation_to_error
        grounds:
          - validations[priority 38] ERR_PROPOSAL_ALREADY_OPEN
          - validations[priority 42] ERR_PRICE_CHANGE_COOLING_OFF
          - constants.COOLING_OFF_DAYS
        distinguishing_aspect: "Temporal validation plus a business-constraint interlock. last_price_change_at is null on a virgin item, so the first proposal submits with no cooling-off check at all; once it applies, a second proposal effective 8 days later is refused, AND the refused proposal stays DRAFT and therefore still counts as live, so a third proposal cannot even be created. Patching the blocked proposal's effective_from to exactly last_price_change_at + 14 days submits successfully, pinning the boundary as at-or-after rather than strictly-after."
        test_recipe:
          setup:
            - "GRILL WORLD in MW: CHEDDAR-BLOCK PUBLISHED at 22000000 micros / 2268 base units, PLATE-GRILL ACTIVE with CHEDDAR at ep 400 over 4 portions, MI-GRILL-MW ACTIVE at 400 cents with target_food_cost_bps 3000 and plate_cost_cents 100, plate_cost_state FRESH."
