            - "Call 2: HTTP 422 ERR_INVALID_INTERVAL for an inverted window even with a CURRENT version, which isolates the shape rule from the concurrency rule"
            - "Call 3: HTTP 422 ERR_INVALID_INTERVAL - the CLOSED desk interval is checked before the band-64 coverage and band-74 changeover rules, so no ERR_ASSIGNMENT_OUTSIDE_WINDOW appears"
