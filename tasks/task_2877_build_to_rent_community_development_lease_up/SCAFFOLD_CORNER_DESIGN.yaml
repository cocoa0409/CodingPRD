              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-09-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
