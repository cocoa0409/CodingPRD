      # ---- corners already owned by the depth probe (§1.8) ----
      - name: screening_threshold_probed_on_both_sides_of_equality
        claim_type: threshold
        grounds:
          - calculations.prospectus_requirement_determination
          - calculations.noncompliance_point_accumulation
        excluded_because:
          difficulty_instance: screening_service_day_equality_boundary
          rationale: |
            The §1.8 boundary instance screens applications at avail-1, exactly avail and avail+1 on the
            same area and asserts the DIRECT / DIRECT / PROSPECTUS split, and
            noncompliance_point_threshold_twelve_boundary does the same at 11, 12 and 13 points. Both
            threshold rules are already probed on both sides of their pinned comparison.

      - name: aggregate_running_total_survives_an_add_and_a_reversal
        claim_type: aggregation
        grounds:
          - calculations.use_area_service_day_availability
          - calculations.allocatable_service_day_conservation
          - calculations.guide_capacity_conservation
        excluded_because:
          difficulty_instance: service_day_conservation_across_hold_and_release
          rationale: |
            The §1.8 conservation instance adds and reverses holds across screen, withdraw, deny and
            issuance while asserting the identity after each write, and
            guide_capacity_total_conservation_across_revoke_cycle does the same for the capacity sum.
            A corner-level running-total claim would be a strict subset.

      - name: fee_brackets_tested_at_each_tier_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.permit_fee_assessment
        excluded_because:
          difficulty_instance: fee_tier_one_ceiling_inclusivity_boundary
          rationale: |
            The §1.8 instance sits an adjusted gross revenue exactly on TIER_1_CEILING_CENTS and one
            cent above it, proving the <= inclusivity of the first bracket and the straddle behaviour
            of the FINAL_AGGREGATE variant. The remaining boundary work is inseparable from the
            variant comparison, which is also a §1.8 instance.

      - name: weighted_scores_use_the_declared_weights_without_rounding_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.performance_weighted_rating
          - calculations.prospectus_evaluation_score
          - calculations.guide_client_capacity
        excluded_because:
          difficulty_instance: performance_band_before_penalty_pinned_order
          rationale: |
            The §1.8 instance pins all six steps of performance_weighted_rating with the weights
            0.35/0.25/0.20/0.20, the band-before-penalty ordering and the PENALTY_CAP;
            prospectus_scoring_preliminary_versus_final_rank_flip pins the 0.30/0.30/0.20/0.20 pool
            score, and guide_client_capacity_four_input_min_interaction pins the capacity formula.
            Every weighted rule is already characterised at depth.

      - name: compliance_derivation_reaches_a_fixed_point_after_each_driver_change
        claim_type: constraint_propagation
        grounds:
          - calculations.permit_compliance_derivation
        excluded_because:
          difficulty_instance: permit_compliance_cycle_probation_and_back
          rationale: |
            The §1.8 instance drives compliance_status COMPLIANT -> PROBATION -> NONCOMPLIANT ->
            PROBATION -> COMPLIANT by moving one driver at a time and asserts the first-match-wins
            ladder plus the one-way suspension propagation at every step.

      - name: the_two_fee_variants_disagree_on_identical_reports
        claim_type: variant_divergence
        grounds:
          - calculations.permit_fee_assessment.variants
        excluded_because:
          difficulty_instance: fee_assessment_provisional_per_report_versus_final_aggregate
          rationale: |
            The §1.8 instance computes both variants over the same three accepted reports and asserts
            the exact cent delta between PROVISIONAL_PER_REPORT and FINAL_AGGREGATE, which is the
            divergence claim with the arithmetic spelled out.

      - name: each_variant_is_selected_in_its_declared_context
        claim_type: variant_selection
        grounds:
          - calculations.permit_fee_assessment.variants
          - calculations.prospectus_evaluation_score.variants
        excluded_because:
          difficulty_instance: prospectus_scoring_preliminary_versus_final_rank_flip
          rationale: |
            The §1.8 instance shows PRELIMINARY written at close-submissions and FINAL written at
            award — and the ranking flipping between them — while the §1.8 fee instance shows
            PROVISIONAL_PER_REPORT at accept and FINAL_AGGREGATE at finalize. Selection context is
            covered for both dual-variant rules.

      - name: switching_variant_moves_the_delta_onto_the_ledger
        claim_type: reconciliation
        grounds:
          - calculations.permit_fee_assessment.variants
          - calculations.fee_obligation_conservation
        excluded_because:
          difficulty_instance: fee_money_identity_across_amend_and_reversal
          rationale: |
            The §1.8 instance finalizes, pays, amends and re-amends one assessment, asserting
            assessed_fee_cents, paid_to_date_cents, balance_due_cents and credit_balance_cents after
            each step, which is exactly the provisional-to-final reconciliation claim.

  # ===========================================================================
  # §1.4 Validation Rules  (64 rules over 12 priority tiers; the pinned
  # priority-conflict outcomes and the two intra-tier orderings are §1.4 text)
  # ===========================================================================
  - section: validations
    instances:

      - name: every_severity_action_type_pair_is_checked_against_the_matrix
        claim_type: violation_to_error
        grounds:
          - validations[ERR_ACTION_TYPE_NOT_ALLOWED]
          - validations[ERR_INVALID_REQUEST]
          - calculations.noncompliance_point_accumulation.constants
        distinguishing_aspect: |
          The severity-to-action_type matrix is a conditional table, not a flat enum check: WARNING is
          legal for MINOR and MODERATE but not MAJOR, SUSPENSION is legal for MODERATE and MAJOR but
          not MINOR, and REVOCATION is legal only for MAJOR. All three rejected pairs use values that
          are individually valid enum members, so an implementation that validates the two fields
          independently passes them. The tail also separates the tiers: an action_type that is not an
          enum member at all is a priority-3 ERR_INVALID_REQUEST, not the priority-11 matrix error.
        test_recipe:
          setup:
            - "the canonical BRW-01 chain to an ISSUED 200-day permit ${p_id}; no actions exist yet"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
