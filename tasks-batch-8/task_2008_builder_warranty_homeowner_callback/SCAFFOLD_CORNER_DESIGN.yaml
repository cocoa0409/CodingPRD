      - name: reserve_alert_threshold_boundary
        claim_type: constants_applied
        grounds:
          - calculations.reserve_trend_alert
        distinguishing_aspect: "ELEVATED triggers strictly below round_half_up(expected x 0.20) = 40000: balance exactly 40000 stays NORMAL; balance 39999 is ELEVATED."
        test_recipe:
          setup: ["home price 40000000 (expected 200000, alert threshold 40000); reserve at balance 0, version 1"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-921", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_v: "$.data[0].version" }
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: 40000, expected_reserve_version: "${res_v}", note: "Seed balance to threshold" }
              as: FinanceAdmin
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { alert_at: "$.data.alert_status", bal_at: "$.data.balance_cents", res_v2: "$.data.version" }
          trigger:
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: -1, expected_reserve_version: "${res_v2}", note: "One cent below threshold" }
              as: FinanceAdmin
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { alert_below: "$.data.alert_status", bal_below: "$.data.balance_cents" }
          assert:
            - "bal_at == 40000 and alert_at == NORMAL (== threshold is NOT elevated)"
            - "bal_below == 39999 and alert_below == ELEVATED (strictly-below trigger)"
      - name: chargeback_reduced_amount_rules
        claim_type: correct_result
        grounds:
          - state_machines.Chargeback.CONTESTED_to_REDUCED
          - calculations.chargeback_amount
        distinguishing_aspect: "REDUCED requires 0 < reduced < payable: reducing to the full payable 93500 is a 400 shape error; reducing to 50000 overwrites final_amount_cents, flips basis to FINAL, and payment of 50000 settles PAID with a 50000 reserve RECOVERY."
        test_recipe:
          setup: ["approved request; tp; wo estimated 110000 SUBCONTRACTOR; cb ISSUED 93500 and contested"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-922", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 110000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id }
            - call: "POST /chargebacks/${cb_id}/contest"
              payload: { contest_reason: "Partially our scope" }
              as: TradePartner
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /chargebacks/${cb_id}/resolve"
              payload: { outcome: "REDUCED", reduced_amount_cents: 93500, resolution_notes: "Trying full amount" }
              as: WarrantyManager
              captures: { err: $.data.error_id }
            - call: "POST /chargebacks/${cb_id}/resolve"
              payload: { outcome: "REDUCED", reduced_amount_cents: 50000, resolution_notes: "Shared fault" }
              as: WarrantyManager
              captures: { st: $.data.status, fin: $.data.final_amount_cents, basis: $.data.amount_basis, out: $.data.outstanding_cents }
            - call: "POST /chargebacks/${cb_id}/payments"
              payload: { amount_cents: 50000 }
              as: FinanceAdmin
              captures: { st2: $.data.status }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { rec: "$.data[0].recovered_to_date_cents" }
          assert:
            - "err == ERR_INVALID_REQUEST, HTTP 400 (reduced must be strictly below payable)"
            - "st == REDUCED and fin == 50000 and basis == FINAL and out == 50000"
            - "st2 == PAID and rec == 50000 (recovery equals the reduced amount, not the original 93500)"

