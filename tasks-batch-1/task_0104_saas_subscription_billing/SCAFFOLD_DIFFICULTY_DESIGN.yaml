  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overage_at_included_boundary_zero_vs_one_unit
        grounds:
          - calculations.usage_overage_charge
          - entities.Plan.fields.included_usage_units
          - endpoints["POST /_billing/run-renewals"]
        distinguishing_aspect: |
          Numeric threshold crossing reached via run-renewals: total_units == included (1000) gives an
          OVERAGE line of 0 (or no line), total_units == 1001 gives exactly 2 cents — the >= vs >
          edge on included_usage_units.
        test_recipe:
          setup:
            - "Clock 2026-06-01; US-CA; PRO plan included 1000, tiers [4000@2,...]; account converted ACTIVE"
            - "Exactly 1001 usage units recorded in-period; renewal at 2026-07-01"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /tax-jurisdictions"
              payload: { region_code: "US-CA", tax_rate_bps: 875 }
              as: BillingAdmin
            - call: "POST /plans"
              payload: { tier: "PRO", monthly_fee_cents: 9000, included_usage_units: 1000, overage_tiers: [{ up_to_units: 4000, rate_cents_per_unit: 2 }, { up_to_units: 19000, rate_cents_per_unit: 1 }, { up_to_units: null, rate_cents_per_unit: 3 }], trial_days: 14 }
