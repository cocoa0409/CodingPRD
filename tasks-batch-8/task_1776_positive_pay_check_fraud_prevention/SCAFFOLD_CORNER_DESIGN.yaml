  - section: complexity_layers
    instances:
      - name: occ_enrollment_patch_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-config-patch-stale]"]
        distinguishing_aspect: "A second PATCH carrying the pre-first-patch version is rejected 412; the current version succeeds."
        test_recipe:
          setup: ["Enrollment created (version 1)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OccCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "PATCH /treasury/enrollments/${enr}", payload: { expected_enrollment_version: "${v1}", decision_window_hours: 30 }, as: BankTreasuryManager, captures: { v2: $.data.version } }
            - { call: "PATCH /treasury/enrollments/${enr}", payload: { expected_enrollment_version: "${v1}", decision_window_hours: 36 }, as: BankTreasuryManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /treasury/enrollments/${enr}", payload: { expected_enrollment_version: "${v2}", decision_window_hours: 36 }, as: BankTreasuryManager, captures: { v3: $.data.version, wh: $.data.decision_window_hours } }
          assert:
            - "v2 == 2; stale retry: err == ERR_STALE_VERSION (412)"
            - "Current version succeeds: v3 == 3 and wh == 36"

      - name: occ_ach_rule_patch_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ach-rule-patch-stale]"]
        distinguishing_aspect: "Same OCC discipline on AchDebitRule: a stale expected_ach_rule_version on a window edit is rejected 412 before overlap re-validation."
        test_recipe:
          setup: ["ACTIVE POSITIVE_PAY enrollment; ACTIVE FILTER rule (version 1)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OccRCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
