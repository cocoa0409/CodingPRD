  - section: endpoints
    instances:
      - name: employee_role_change_leaves_existing_assignments_untouched
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /awareness/employees/{id}/role]
          - entities.Employee.fields.role_code
          - validations[priority 19]
        distinguishing_aspect: "The role PATCH is forward-looking only: it bumps Employee.version and changes future eligibility, but the already-created assignment keeps its module even though the employee no longer holds the role that module targets."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One FINANCE_APPROVER employee holding a ROLE_SPECIFIC assignment restricted to FINANCE_APPROVER."
            - "One PUBLISHED ROLE_SPECIFIC module restricted to IT_ADMIN."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "rowan.role@corp.example", full_name: "Rowan Role", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2016-06-06" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "FIN-ONLY", title: "Finance Only Module", module_type: "ROLE_SPECIFIC", applies_to_role_codes: ["FINANCE_APPROVER"] }, as: ProgramAdmin, captures: { m_fin: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_fin}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules", payload: { code: "IT-ONLY", title: "IT Only Module", module_type: "ROLE_SPECIFIC", applies_to_role_codes: ["IT_ADMIN"] }, as: ProgramAdmin, captures: { m_it: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_it}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m_fin}", assignment_reason: "ROLE_CHANGE", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
          trigger:
            - { call: "PATCH /awareness/employees/${e}/role", payload: { role_code: "IT_ADMIN" }, as: ProgramAdmin, captures: { new_v: "$.data.version" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m_it}", assignment_reason: "ROLE_CHANGE", expected_employee_version: "${new_v}" }, as: ProgramAdmin, captures: { a2: "$.data.id" } }
          assert:
            - "HTTP 200 with Employee.${e}.role_code == IT_ADMIN and version == ${new_v}"
            - "CurriculumAssignment.${a}.module_id == ${m_fin} and state == ASSIGNED: the existing assignment is untouched"
            - "the IT_ADMIN-only module now assigns successfully (HTTP 201) as ${a2}"
            - "a repeat of the PATCH with role_code FINANCE_APPROVER would again make ${m_it} ineligible for future assignments while leaving ${a2} intact"

      - name: compliance_sweep_on_an_empty_estate_reports_all_zero_counters
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /awareness/compliance-sweeps]
          - calculations.reminder_cadence_schedule
          - calculations.escalation_ladder
        distinguishing_aspect: "The sweep is a pure scan with no assignments to touch: every counter in its response object is 0 and swept_at echoes the logical clock, which pins the response shape independently of any state change."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one employee registered, no modules and no assignments."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "zoe.zero@corp.example", full_name: "Zoe Zero", department: "HR", role_code: "IC", hire_date: "2019-11-11" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { scanned: "$.data.assignments_scanned", swept: "$.data.swept_at" } }
          assert:
            - "HTTP 200 with assignments_scanned == 0, reminders_sent_count == 0, overdue_count == 0, escalations_created_count == 0, consequences_applied_count == 0"
            - "swept_at == 2026-08-01T00:00:00Z"
            - "Employee.${e}.compliance_state == COMPLIANT, access_posture == NONE and version unchanged by the sweep"
            - "the escalation-notice and access-consequence listings are both empty"

      - name: compliance_sweep_treats_each_assignment_independently
        claim_type: bulk_action
        grounds:
          - endpoints[POST /awareness/compliance-sweeps]
          - calculations.escalation_ladder
          - calculations.reminder_cadence_schedule
        distinguishing_aspect: "One sweep call is a bulk action over the whole estate with per-assignment outcomes: the overdue REMEDIAL assignment gets both a reminder and an L1 notice while the far-future ANNUAL assignment is scanned and left alone, so the counters are not a single per-sweep flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employee A holds a REMEDIAL assignment due 2026-08-08T00:00:00Z; employee B holds an ANNUAL assignment due 2026-08-31T00:00:00Z."
            - "The clock is advanced to 2026-08-09T00:00:00Z, making A one day overdue while B is still outside its earliest reminder offset (2026-08-24)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "abe.bulk@corp.example", full_name: "Abe Bulk", department: "IT", role_code: "IT_ADMIN", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { ea: "$.data.id", ea_v: "$.data.version" } }
            - { call: "POST /awareness/employees", payload: { email: "bea.bulk@corp.example", full_name: "Bea Bulk", department: "IT", role_code: "IT_ADMIN", hire_date: "2018-02-02" }, as: ProgramAdmin, captures: { eb: "$.data.id", eb_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "BULK-REM", title: "Bulk Remedial", module_type: "REMEDIAL" }, as: ProgramAdmin, captures: { m_rem: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_rem}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules", payload: { code: "BULK-ANN", title: "Bulk Annual", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m_ann: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m_ann}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${ea}", module_id: "${m_rem}", assignment_reason: "REMEDIAL", expected_employee_version: "${ea_v}" }, as: ProgramAdmin, captures: { aa: "$.data.id" } }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${eb}", module_id: "${m_ann}", assignment_reason: "ANNUAL", expected_employee_version: "${eb_v}" }, as: ProgramAdmin, captures: { ab: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { overdue: "$.data.overdue_count", esc: "$.data.escalations_created_count" } }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${aa}" }, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${ab}" }, as: ProgramAdmin }
          assert:
            - "assignments_scanned == 2, overdue_count == 1, escalations_created_count == 1, consequences_applied_count == 0"
            - "reminders_sent_count == 1: only the overdue assignment ${aa} had a due reminder offset"
            - "the notice list for ${aa} holds exactly one SENT notice at level 1; the list for ${ab} is empty"
            - "Employee.${ea}.compliance_state == AT_RISK with access_posture NONE; Employee.${eb}.compliance_state == COMPLIANT"
            - "CurriculumAssignment.${ab}.reminders_sent == 0 and next_reminder_due_at == 2026-08-24T00:00:00Z"

      - name: escalation_notice_acknowledgement_is_not_remediation
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /awareness/escalation-notices/{id}/acknowledge]
          - state_machines.EscalationNotice.SENT_to_ACKNOWLEDGED
          - errors[ERR_NOTICE_STATE_INVALID]
        distinguishing_aspect: "Acknowledgement records the manager's action plan and nothing else: the assignment stays overdue, the employee's compliance_state does not improve, and a second acknowledge on the now-terminal notice returns ERR_NOTICE_STATE_INVALID (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-09T00:00:00Z."
            - "A manager and a direct report; the report holds a REMEDIAL assignment due 2026-08-08T00:00:00Z."
            - "One sweep at 2026-08-09T00:00:00Z produces a SENT level-1 notice addressed to the manager."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mgr.ack@corp.example", full_name: "Ada Manager", department: "IT", role_code: "MANAGER", hire_date: "2010-10-10" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep.ack@corp.example", full_name: "Ray Report", department: "IT", role_code: "IT_ADMIN", hire_date: "2020-05-05", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ACK-REM", title: "Ack Probe Remedial", module_type: "REMEDIAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "REMEDIAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}", state: "SENT" }, as: ProgramAdmin, captures: { n: "$.data[0].id" } }
          trigger:
            - { call: "POST /awareness/escalation-notices/${n}/acknowledge", payload: { action_plan_note: "Booked a 1:1 for 2026-08-10 and set a completion deadline." }, as: Manager, as_user_id: "${mgr}", captures: { n_state: "$.data.state" } }
            - { call: "POST /awareness/escalation-notices/${n}/acknowledge", payload: { action_plan_note: "Second attempt." }, as: Manager, as_user_id: "${mgr}" }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "the first acknowledge returns HTTP 200 with state ACKNOWLEDGED, acknowledged_at == 2026-08-09T00:00:00Z and the stored action_plan_note"
            - "the second acknowledge returns HTTP 409 with error_id ERR_NOTICE_STATE_INVALID and the note is not overwritten"
            - "CurriculumAssignment.${a}.escalation_level == 1 and state == ASSIGNED: acknowledgement did not reset the ladder"
            - "Employee.${e}.compliance_state == AT_RISK and access_posture == NONE (no consequence to lift at level 1)"

      - name: access_consequence_lifted_twice_returns_409_already_lifted
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /awareness/access-consequences/{id}/lift]
          - errors[ERR_CONSEQUENCE_ALREADY_LIFTED]
          - state_machines.AccessConsequence.ACTIVE_to_LIFTED
        distinguishing_aspect: "LIFTED is terminal, so the second lift returns ERR_CONSEQUENCE_ALREADY_LIFTED (409) and does not re-run the posture recomputation - lifted_at and lift_reason_code keep their first values."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One employee carrying one manually created ACTIVE consequence."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "lena.lift@corp.example", full_name: "Lena Lift", department: "SALES", role_code: "IC", hire_date: "2019-04-04" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "POLICY_BREACH_INVESTIGATION", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { ac: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/access-consequences/${ac}/lift", payload: { lift_reason_code: "MANUAL_LIFT" }, as: ProgramAdmin, captures: { lifted_at: "$.data.lifted_at" } }
            - { call: "POST /awareness/access-consequences/${ac}/lift", payload: { lift_reason_code: "MANUAL_LIFT" }, as: ProgramAdmin }
            - { call: "GET /awareness/access-consequences/${ac}", payload: {}, as: ProgramAdmin }
          assert:
            - "the first lift returns HTTP 200 with state LIFTED, lifted_at == 2026-08-03T00:00:00Z and lift_reason_code MANUAL_LIFT"
            - "the second lift returns HTTP 409 with error_id ERR_CONSEQUENCE_ALREADY_LIFTED"
            - "AccessConsequence.${ac}.lifted_at is still 2026-08-03T00:00:00Z and version advanced exactly once"
            - "Employee.${e}.access_posture == NONE and active_suspension_count == 0"

      - name: blocked_template_prevents_campaign_approval
        claim_type: conditional_action
        grounds:
          - endpoints[POST /awareness/phishing-templates/{id}/block]
          - validations[priority 15]
          - errors[ERR_TEMPLATE_NOT_APPROVED]
        distinguishing_aspect: "Blocking is retroactive over campaigns already under review: a template that was APPROVED_FOR_USE when the campaign was built becomes BLOCKED, and the pending approve then fails with ERR_TEMPLATE_NOT_APPROVED (409) even though the campaign itself is faultless."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An APPROVED_FOR_USE template; a campaign built on it and submitted for review; the template is then blocked."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Block Probe Template", pretext_category: "INVOICE_APPROVAL", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["AUTHORITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Blocked Template Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          trigger:
            - { call: "POST /awareness/phishing-templates/${tpl}/block", payload: { blocked_reason: "Pretext retired after a real BEC wave used the same invoice lure." }, as: ProgramAdmin, captures: { rs: "$.data.review_state" } }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "GET /awareness/campaigns/${c}", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
          assert:
            - "the block returns HTTP 200 with review_state BLOCKED and the stored blocked_reason"
            - "the approve returns HTTP 409 with error_id ERR_TEMPLATE_NOT_APPROVED"
            - "PhishingCampaign.${c}.state is still IN_REVIEW with reviewer_user_id == null"
            - "a reject on the same campaign still succeeds, because priority 15 guards only the approve path"

      - name: campaign_reject_then_resubmit_returns_to_review
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /awareness/campaigns/{id}/reject]
          - state_machines.PhishingCampaign.IN_REVIEW_to_REJECTED
          - state_machines.PhishingCampaign.REJECTED_to_IN_REVIEW
        distinguishing_aspect: "REJECTED is a re-enterable waypoint, not a terminal state: reject records reviewer_user_id and rejection_reason, and the author's resubmission moves the same campaign back to IN_REVIEW with the rejection_reason still on the row as history."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An APPROVED_FOR_USE template and a campaign in IN_REVIEW."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Reject Probe Template", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Reject Cycle Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/reject", payload: { rejection_reason: "Send window overlaps the quarterly close; pick another week." }, as: CampaignApprover, as_user_id: "approver-1", captures: { rej_state: "$.data.state", reviewer: "$.data.reviewer_user_id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1", captures: { back_state: "$.data.state" } }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { appr_state: "$.data.state" } }
          assert:
            - "the reject returns HTTP 200 with state REJECTED, reviewer_user_id == approver-1 and the stored rejection_reason"
            - "the resubmission returns HTTP 200 with state IN_REVIEW and rejection_reason still populated"
            - "the second approve returns HTTP 200 with state APPROVED"
            - "PhishingCampaign.${c}.version advanced by exactly 3 across the three transitions"

      - name: communication_windows_created_and_listed_by_type
        claim_type: standard_crud
        grounds:
          - endpoints[POST /awareness/communication-windows]
          - endpoints[GET /awareness/communication-windows]
          - entities.CommunicationWindow.fields.window_type
        distinguishing_aspect: "Both window types coexist and the listing filter separates them: a SIMULATION_BLACKOUT scoped to FINANCE and an org-wide QUIET_HOURS window are both stored, and filtering by window_type returns exactly one row each while scope_department null means org-wide."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no communication windows exist."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/communication-windows", payload: { window_type: "SIMULATION_BLACKOUT", start_at: "2026-09-28T00:00:00Z", end_at: "2026-10-02T23:59:59Z", reason: "Quarterly close for the finance organisation.", scope_department: "FINANCE" }, as: ProgramAdmin, captures: { w_black: "$.data.id" } }
            - { call: "POST /awareness/communication-windows", payload: { window_type: "QUIET_HOURS", start_at: "2026-12-24T00:00:00Z", end_at: "2026-12-26T00:00:00Z", reason: "Company-wide holiday shutdown." }, as: ProgramAdmin, captures: { w_quiet: "$.data.id" } }
            - { call: "GET /awareness/communication-windows", payload: { window_type: "SIMULATION_BLACKOUT" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "GET /awareness/communication-windows", payload: { scope_department: "FINANCE" }, as: ProgramAdmin }
