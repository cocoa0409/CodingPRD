              payload: { client_account_id: "${acct_id}", policy_number: "P-RA", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 100000 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "GET /claims/${claim_id}"
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /reserve-changes"
              payload: { claim_id: "${claim_id}", reserve_type: "INDEMNITY", delta_cents: 200000, reason: "big", expected_claim_version: "${v1}" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_RESERVE_AUTHORITY_EXCEEDED"

      - name: assignee_mismatch_adjuster_without_id
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_ASSIGNEE_MISMATCH]"]
        distinguishing_aspect: "assignee_type=ADJUSTER with no adjuster_id in the body is rejected ERR_ASSIGNEE_MISMATCH (422)."
        test_recipe:
          setup: ["One INTAKE claim."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-AM", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-AM", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: ClaimsManager
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /assignments"
              payload: { claim_id: "${claim_id}", assignee_type: "ADJUSTER", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T11:00:00Z" }
              as: ClaimsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ASSIGNEE_MISMATCH"

      - name: policy_inactive_on_claim_intake
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", entities.Policy.fields.status]
        distinguishing_aspect: "With the clock advanced past expiration_date, the policy computes EXPIRED and claim intake is rejected ERR_POLICY_INACTIVE (409)."
        test_recipe:
          setup: ["Account + policy (expiration 2030-01-01); clock advanced to 2031-06-01 so the policy is EXPIRED."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-PI", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-PI", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-06-01T00:00:00Z" }
              as: ClaimsManager
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "CN", description: "d" }
              as: Adjuster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_POLICY_INACTIVE"

      - name: missing_auth_header_returns_401
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid user role (Anonymous) is rejected ERR_UNAUTHENTICATED (401) before any resource lookup."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-0000-0000-000000000000"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: adjuster_capacity_exceeded_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_ADJUSTER_CAPACITY]"]
        distinguishing_aspect: "An adjuster with max_open_claims=1 already assigned to one open claim cannot be assigned to a second: ERR_ADJUSTER_CAPACITY (409)."
        test_recipe:
          setup: ["Adjuster max_open_claims=1; claim1 already ADJUSTER-assigned (open); claim2 INTAKE."]
          setup_api_calls:
            - call: "POST /client-accounts"
              payload: { name: "Acme", account_code: "C-CAP", reserve_authority_default_cents: 100000000 }
              as: ClaimsManager
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { client_account_id: "${acct_id}", policy_number: "P-CAP", coverage_limit_cents: 100000000, deductible_cents: 0, per_claim_expense_limit_cents: 5000000, effective_date: "2020-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: ClaimsManager
              captures: { policy_id: $.data.id }
            - call: "POST /adjusters"
              payload: { name: "Ada", email: "ada@x.com", authority_limit_cents: 5000000, max_open_claims: 1 }
              as: ClaimsManager
              captures: { adj_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "A", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim1: $.data.id }
            - call: "POST /assignments"
              payload: { claim_id: "${claim1}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T09:00:00Z", inspection_end: "2026-06-16T10:00:00Z" }
              as: Adjuster
              as_user_id: "${adj_id}"
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", coverage_type: "PROPERTY", loss_date: "2026-06-01T00:00:00Z", reported_date: "2026-06-15T00:00:00Z", claimant_name: "B", description: "d" }
              as: Adjuster
              as_user_id: "${adj_id}"
              captures: { claim2: $.data.id }
          trigger:
            - call: "POST /assignments"
              payload: { claim_id: "${claim2}", assignee_type: "ADJUSTER", adjuster_id: "${adj_id}", scope: "FIELD_INSPECTION", inspection_start: "2026-06-16T13:00:00Z", inspection_end: "2026-06-16T14:00:00Z" }
              as: Adjuster
