# §1.9 Scaffold Corner Design - breadth probe for
# task_2701_warewashing_chemical_dish_machine_service_program
#
# Every instance below is a corner of the §1.1-§1.7 surface that the nine §0.5
# difficulty rules do NOT already probe; corners that ARE probed there carry an
# `excluded_because:` stub naming the §1.8 instance instead of a test_recipe.
# Sections and claim_type values come verbatim from
# references/claim-extraction-guide.md.
#
# Shared fixture vocabulary used by the recipes below (each recipe builds its own
# rows from an empty database; codes may therefore repeat across instances):
#   DET-100  DETERGENT  target 1200 ppm, spec dose 8.00 ml/rack, 20000 ml unit, 9600 cents
#   SAN-200  SANITIZER  target 200 ppm, window 150..250 ppm, 7 s contact, 10000 ml unit, 4200 cents
#   DT-88    DOOR_TYPE  60 racks/h, 0.74 L and 0.41 kWh per rack, min rinse temp 180 F,
#                       min wash temp 150 F, rinse pressure 15..25 psi, 480000 cents,
#                       20000 cycles between calibrations
#   Site     NW region, operating window 600..1320 (10:00-22:00 UTC), baseline 1.20 L and
#                       0.62 kWh per rack, 480 cents/1000 L, 14 cents/kWh
#   Agreement start 2026-08-01, minimum_term_months 36 -> term_end_date 2029-08-01
#   The logical clock's startup default is 2026-08-01T00:00:00Z.

scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_returns_envelope_with_declared_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST_/warewashing/customers
          - entities.Customer.fields.billing_status
          - entities.Customer.fields.equipment_on_placement_value_cents
          - response_envelope.success
        distinguishing_aspect: |
          A create with only the two required fields must return 201 with the whole entity inside the
          §1.0 success envelope, and every field the client did not send must be the value §1.1
          declares - billing_status CURRENT, both computed ledgers 0, version 1 - not null and not
          absent from the payload.
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id, billing: $.data.billing_status, ledger: $.data.equipment_on_placement_value_cents, agr_count: $.data.active_agreement_count, ver: $.data.version }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "${billing} == CURRENT (the declared default), ${ledger} == 0, ${agr_count} == 0"
            - "${ver} == 1 and ${cust_id} is a non-empty server-generated string"
            - "data.name == Harbor Grill Group and data.sustainability_goal_water_l == 500000"
            - "data.created_at == data.updated_at at creation"

      - name: placement_read_back_matches_the_stored_representation
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/warewashing/machine-placements/{placement_id}
          - entities.MachinePlacement.fields.placement_status
          - entities.MachinePlacement.fields.installed_at
        distinguishing_aspect: |
          A GET on a placement returns exactly what creation stamped - PENDING_INSTALL on the lifecycle
          axis, UP on the health axis, installed_at still null and last_cycle_count seeded from
          initial_cycle_count - so the read path is not recomputing or re-defaulting anything.
        test_recipe:
          setup:
            - "One ACTIVE agreement covering DET-100 and one DT-88 placement created with initial_cycle_count 250 and never installed."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", initial_cycle_count: 250, expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
          trigger:
            - call: "GET /warewashing/machine-placements/${pl_id}"
              payload: {}
              as: ServiceTechnician
              captures: { st: $.data.placement_status, op: $.data.operational_status, inst: $.data.installed_at, last: $.data.last_cycle_count, since: $.data.cycles_since_calibration, tag: $.data.asset_tag }
          assert:
            - "HTTP 200 with response_type == object"
            - "${st} == PENDING_INSTALL and ${op} == UP and ${inst} == null"
            - "${last} == 250 (seeded from initial_cycle_count) and ${since} == 0"
            - "${tag} == AT-C01 and data.site_id == ${site_id} and data.agreement_id == ${agr_id}"

      - name: placement_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/warewashing/machine-placements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three placements on one site, limit 2 / offset 0 must return 2 rows with
          total_count 3 and has_more true, and offset 2 must return the single remaining row with
          has_more false - total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "One ACTIVE agreement and three PENDING_INSTALL placements AT-C01, AT-C02, AT-C03 on the same site."
            - "Each placement creation bumps ServiceAgreement.version, so the agreement is re-read before every create."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v1: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v1}" }
              as: AccountManager
              captures: { pl_1: $.data.id }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v2: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C02", expected_agreement_version: "${agr_v2}" }
              as: AccountManager
              captures: { pl_2: $.data.id }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v3: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C03", expected_agreement_version: "${agr_v3}" }
              as: AccountManager
              captures: { pl_3: $.data.id }
          trigger:
            - call: "GET /warewashing/machine-placements"
              payload: { site_id: "${site_id}", limit: 2, offset: 0 }
              as: AccountManager
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
            - call: "GET /warewashing/machine-placements"
              payload: { site_id: "${site_id}", limit: 2, offset: 2 }
              as: AccountManager
              captures: { third_id: "$.data[0].id" }
            - call: "GET /warewashing/machine-placements"
              payload: { site_id: "${site_id}", placement_status: "INSTALLED" }
              as: AccountManager
              captures: { none: $.data }
          assert:
            - "page 1: response_type == array with exactly 2 rows, meta/total_count == 3 and has_more == true"
            - "page 2: exactly 1 row (${third_id} == ${pl_3}) with total_count == 3 and has_more == false"
            - "${first_id} == ${pl_1} and ${second_id} == ${pl_2} - default ordering is created_at ASC, never by id"
            - "the placement_status == INSTALLED filter returns 0 rows with total_count == 0 and has_more == false"

      - name: get_customer_with_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - validations.path_resource_exists
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: |
          Two shapes of the same rule: a well-formed but unknown UUID, and an id that belongs to a
          DIFFERENT entity type (a Site id used in the customers path). Both are 404
          ERR_RESOURCE_NOT_FOUND - a wrong-type id must never be treated as a hit.
        test_recipe:
          setup:
            - "One customer and one site exist, so the site id used in the second trigger is real but of the wrong type."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /warewashing/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err_1: $.data.error_id }
            - call: "GET /warewashing/customers/${site_id}"
              payload: {}
              as: AccountManager
              captures: { err_2: $.data.error_id }
          assert:
            - "${err_1} == ERR_RESOURCE_NOT_FOUND with HTTP 404 and response_type == error"
            - "${err_2} == ERR_RESOURCE_NOT_FOUND with HTTP 404 - a real Site id is not a Customer"
            - "both bodies carry data.message and no entity fields"

      - name: site_creation_missing_required_region_code_is_rejected
        claim_type: Required Fields
        grounds:
          - validations.request_shape_valid
          - errors[ERR_INVALID_REQUEST]
          - entities.Site.fields.region_code
        distinguishing_aspect: |
          region_code has source input and no default, so omitting it is ERR_INVALID_REQUEST (400) and
          no Site row is created - the request must not fall back to a blank or inferred region, which
          would silently corrupt dispatch eligibility later.
        test_recipe:
          setup:
            - "One customer exists; no site has been created yet."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /warewashing/sites"
              payload: { customer_id: "${cust_id}" }
              as: AccountManager
              captures: { rows: $.data }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "the follow-up list returns 0 rows with total_count == 0 - the rejected create persisted nothing"

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ChemicalProduct.fields.concentration_tolerance_pct
          - entities.ChemicalProduct.fields.min_contact_seconds
          - entities.ServiceAgreement.fields.renewal_notice_days
          - entities.Site.fields.priority_tier
        distinguishing_aspect: |
          Four defaults across three entities in one pass: tolerance 10.00, min_contact_seconds 7,
          renewal_notice_days 60 with auto_renew false, and priority_tier STANDARD with status ACTIVE.
          A default of 0 or null instead of these values silently changes drift verdicts, renewal
          windows and dispatch scoring.
        test_recipe:
          setup:
            - "Empty database; every create below omits every optional field."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id, tol: $.data.concentration_tolerance_pct, contact: $.data.min_contact_seconds, smin: $.data.sanitizer_min_ppm }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { tier: $.data.priority_tier, sstatus: $.data.status, posture: $.data.service_posture, sopen: $.data.open_ticket_count }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { notice: $.data.renewal_notice_days, auto: $.data.auto_renew, ast: $.data.status, rc: $.data.renewal_count, pc: $.data.placement_count, fee: $.data.early_termination_fee_cents, term_end: $.data.term_end_date }
          assert:
            - "${tol} == 10.0 and ${contact} == 7 and ${smin} == null on a DETERGENT product"
            - "${tier} == STANDARD, ${sstatus} == ACTIVE, ${posture} == NORMAL, ${sopen} == 0"
            - "${notice} == 60 and ${auto} == false"
            - "${ast} == DRAFT, ${rc} == 0, ${pc} == 0, ${fee} == null"
            - "${term_end} == null on a DRAFT agreement - term_end_date is computed by activation, not by creation"

      - name: delivery_quantity_and_amount_are_computed_not_supplied
        claim_type: Computed Fields
        grounds:
          - calculations.delivery_amount
          - entities.ChemicalDelivery.fields.quantity_ml
          - entities.ChemicalDelivery.fields.amount_cents
        distinguishing_aspect: |
          The client sends only unit_count 12; quantity_ml (12 x 20000 = 240000) and amount_cents come
          from delivery_amount with the tier-1 5% discount applied to the UNIT price first:
          round_half_up(9600 x 0.95) = 9120, then 9120 x 12 = 109440. Discounting the line total
          instead would give 109440 too at this price, so the fixture also pins the 9-unit case where
          no discount applies (9600 x 9 = 86400) to prove the tier boundary is read from unit_count.
        test_recipe:
          setup:
            - "One ACTIVE agreement covering DET-100 on a site with no placements; two deliveries are recorded."
            - "Each delivery bumps Site.version, so the site is re-read before the second one."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id, site_v1: $.data.version }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 12, expected_site_version: "${site_v1}" }
              as: AccountManager
              captures: { d1: $.data.id, q1: $.data.quantity_ml, a1: $.data.amount_cents, ds1: $.data.status }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { site_v2: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-01T00:00:00Z", unit_count: 9, expected_site_version: "${site_v2}" }
              as: AccountManager
              captures: { d2: $.data.id, q2: $.data.quantity_ml, a2: $.data.amount_cents }
          assert:
            - "${q1} == 240000 and ${a1} == 109440 (unit price 9120 after the 5% tier-1 discount, times 12)"
            - "${ds1} == DELIVERED"
            - "${q2} == 180000 and ${a2} == 86400 - 9 units are below TIER_1_MIN_UNITS so no discount applies"
            - "${site_v2} == ${site_v1} + 1 - recording a delivery bumps Site.version"

      - name: system_fields_are_server_generated_and_version_advances_on_write
        claim_type: System Fields
        grounds:
          - entities.Technician.fields.open_ticket_count
          - endpoints.PATCH_/warewashing/technicians/{technician_id}
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          id, created_at, updated_at and version are stamped by the server: version starts at 1,
          created_at == updated_at at creation, and a PATCH bumps version to 2 while created_at stays
          frozen and updated_at moves. The computed counters stay 0 because a PATCH is not a dispatch.
        test_recipe:
          setup:
            - "One AVAILABLE L2 technician in region NW; the logical clock is advanced once between the create and the PATCH."
          setup_api_calls:
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id, v1: $.data.version, created: $.data.created_at, updated: $.data.updated_at, st: $.data.status, load: $.data.open_ticket_count, flags: $.data.quality_flag_count }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /warewashing/technicians/${tech_id}"
              payload: { status: "OFF_DUTY" }
              as: PlatformAdmin
              captures: { v2: $.data.version, created2: $.data.created_at, updated2: $.data.updated_at, st2: $.data.status, cert2: $.data.certification_level, load2: $.data.open_ticket_count }
          assert:
            - "${v1} == 1, ${st} == AVAILABLE (default), ${load} == 0, ${flags} == 0 and ${created} == ${updated}"
            - "${v2} == 2 and ${st2} == OFF_DUTY"
            - "${created2} == ${created} - created_at is immutable"
            - "${updated2} == 2026-08-01T09:00:00Z - updated_at is read from the logical clock, not wall time"
            - "${cert2} == L2 - a field absent from the PATCH body is left alone"
            - "${load2} == 0 - computed counters are not writable through the PATCH"

      - name: invalid_enum_and_inverted_interval_payloads_are_rejected
        claim_type: Type Constraints
        grounds:
          - validations.request_shape_valid
          - entities.ChemicalProduct.fields.product_type
          - entities.MachineModel.fields.max_rinse_pressure_psi
        distinguishing_aspect: |
          Three distinct shape failures all land on ERR_INVALID_REQUEST (400): an enum value outside the
          declared member set, a numeric interval whose ends are inverted (min_rinse_pressure_psi >=
          max_rinse_pressure_psi), and a negative money field. None of them is silently coerced.
        test_recipe:
          setup:
            - "Empty database; nothing must be persisted by any of the three rejected creates."
          setup_api_calls: []
          trigger:
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "BLEACH-1", product_type: "BLEACH", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { err_1: $.data.error_id }
            - call: "POST /warewashing/machine-models"
