        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / order_not_cleared_beats_carrier_not_enrolled
          rationale: "The named \u00a71.8 instance drives a shipment request that violates both priority 30 and priority 70 and pins 30's error, with a follow-up call proving 70 would otherwise fire."
      - name: permit_period_exclusivity_treats_a_shared_endpoint_as_overlap
        claim_type: temporal_validation
        grounds:
          - validations.priority_66
          - errors[ERR_PERMIT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / permit_closed_interval_treats_a_shared_endpoint_as_overlap
          rationale: "The named \u00a71.8 instance walks the closed-interval boundary for permits \u2014 a new permit starting exactly on an incumbent's expiration_date collides, one day later does not \u2014 which is the temporal-conflict claim for priority 66."
      - name: empty_period_filing_depends_on_zero_filing_required
        claim_type: conditional_validation
        grounds:
          - validations.priority_90
          - errors[ERR_NOTHING_TO_REMIT]
          - entities.StateRule.fields.zero_filing_required
        excluded_because:
          difficulty_instance: boundary_precision_check / remittance_zero_shipment_period_at_the_filing_threshold
          rationale: "The named \u00a71.8 instance files a shipment_count 0 period under a zero_filing_required true rule and a zero_filing_required false rule, which is exactly the with/without conditional claim for priority 90."
      - name: weather_hold_spacing_uses_the_three_day_buffer
        claim_type: temporal_validation
        grounds:
          - validations.priority_69
          - errors[ERR_HOLD_WINDOW_CONFLICT]
          - calculations.club_run_selection.constants.HOLD_BUFFER_DAYS
        excluded_because:
          difficulty_instance: resource_temporal_overlap / weather_hold_three_day_buffer_measured_from_the_last_release
          rationale: "The named \u00a71.8 instance places a second hold at last_hold_release_date + 2 days and then + 3 days, asserting the refusal and the acceptance, so the buffer boundary is already covered."

