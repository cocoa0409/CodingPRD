              as_user_id: "hm-1"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "GET /api/houses/${house_id}/rooms"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/families/${fam_id}/stay-requests"
              payload: {}
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "GET /api/stays/${stay_id}/contribution-requests"
              payload: {}
              as: FamilyContact
              as_user_id: "${fam_id}"
          assert:
