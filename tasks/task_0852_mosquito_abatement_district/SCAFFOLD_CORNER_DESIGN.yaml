              captures: { pool_id: $.data.id, initial_status: $.data.status }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "INVALID" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "DISCARD" }
              as: LabAnalyst
          trigger:
            - call: "POST /lab-pools/${pool_id}/transitions"
