scenario: "2301. Pension Risk Transfer & Annuity Buyout (defined benefit plan sponsor): de-risking strategy evaluation across lump-sum windows, annuity purchase and liability-driven investing, participant data cleansing with address search, mortality verification and benefit calculation audits, insurer selection under fiduciary safest-available-annuity standards with independent expert engagement, quote process, pricing lock and asset transfer in kind versus cash, plan amendment, participant notice and election administration for lump sums, settlement accounting recognition and funded status impact, post-transfer participant complaints and correction responsibility, residual plan management or termination filings"
domain_name: "pension-risk-transfer"
api_prefix: "/prt"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: hybrid
  # PensionPlan is the aggregate root of a shallow tree (strategies, participants,
  # windows, tranches, experts, settlement entries), but the settlement path is a
  # graph: BuyoutTranche <-> AnnuityQuote <-> Insurer, ParticipantElection joins
  # LumpSumWindow x ParticipantRecord, ParticipantComplaint joins
  # ParticipantRecord x BuyoutTranche, and ParticipantRecord.tranche_id points
  # sideways across the tree into BuyoutTranche.

  state_machine_shape: parallel
  # ParticipantRecord carries THREE independent state dimensions on one row
  # (participant_status x mortality_status x address_status). Layered on top:
  # cyclic machines (DeRiskingStrategy revision loop, PensionPlan filing-deficiency
  # loop, ParticipantElection revocation loop, BenefitAudit reopen loop,
  # ParticipantComplaint re-triage loop, BuyoutTranche selection-reset loop),
  # branching machines (AnnuityQuote, AssetTransfer, BenefitAudit variance fork),
  # and compound bubble-up (PensionPlan -> RESIDUAL derived from window/tranche
  # child states).

  relationship_patterns:
    - one_to_many          # PensionPlan -> strategies / participants / windows / tranches / experts
    - many_to_many         # ParticipantElection joins LumpSumWindow x ParticipantRecord; AnnuityQuote joins BuyoutTranche x Insurer
    - cross_aggregate      # ParticipantRecord.tranche_id, BuyoutTranche.selected_quote_id, SettlementEntry.window_id / .tranche_id
    - polymorphic          # SettlementEntry.entry_type selects which of window_id / tranche_id / complaint source is populated

  role_model: segregation_of_duties
  # The fiduciary who decides a DeRiskingStrategy may not be the actuary who
  # submitted it; the fiduciary who clears an IndependentExpert's independence
  # review may not be the sponsor user who proposed that expert. Layered on top of
  # peer ownership (InsurerRep owns its own quotes/asset-transfer reviews,
  # Participant owns its own elections/complaints, Regulator owns filing review).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: PensionPlan
    parent: null
    common_fields: true
    fields:
      - name: sponsor_name
        type: string
        source: input
        description: legal name of the defined benefit plan sponsor
        constraints: "1..200 chars"
      - name: plan_name
        type: string
        source: input
        description: name of the defined benefit plan
        constraints: "1..200 chars"
      - name: plan_ein
        type: string
        source: input
        description: sponsor employer identification number, unique across PensionPlan
        constraints: "exactly 9 digits; unique"
      - name: plan_status
        type: enum
        source: computed
        description: plan lifecycle state; see state_machines.PensionPlan.plan_status
        default: ONGOING
        constraints: "ONGOING | SETTLEMENT_AUTHORIZED | RESIDUAL | TERMINATION_FILED | FILING_DEFICIENT | TERMINATED"
      - name: total_liability_cents
        type: integer
        source: input
        description: sponsor-reported projected benefit obligation on the accounting basis; reduced by window and tranche settlements
        constraints: ">= 0"
      - name: plan_assets_cents
        type: integer
        source: input
        description: fair value of plan assets; reduced by lump-sum payments, asset transfers and sponsor remediation
        constraints: ">= 0"
      - name: service_cost_cents
        type: integer
        source: input
        description: current-period service cost, left operand of the settlement recognition threshold
        constraints: ">= 0"
      - name: interest_cost_cents
        type: integer
        source: input
        description: current-period interest cost, right operand of the settlement recognition threshold
        constraints: ">= 0"
      - name: unrecognized_actuarial_loss_cents
        type: integer
        source: input
        description: accumulated other comprehensive income balance available for pro-rata settlement recognition
        constraints: ">= 0"
      - name: discount_rate_bps
        type: integer
        source: input
        description: accounting discount rate in basis points, recorded for audit of valuation updates
        constraints: "1..2000"
      - name: accounting_funded_status_bp
        type: integer
        source: computed
        description: "computed by calculations.funded_status_measurement; plan_assets_cents / total_liability_cents in basis points"
      - name: participant_liability_total_cents
        type: integer
        source: computed
        description: "computed by calculations.participant_accounting_liability; sum of accounting_liability_cents over this plan's ParticipantRecord rows with participant_status IN {IN_PLAN, ASSIGNED}"
      - name: amendment_scope
        type: enum
        source: computed
        description: scope authorized by the adopted settlement amendment; null while no amendment is in force
        default: null
        constraints: "null | LUMP_SUM_ONLY | BUYOUT_ONLY | BOTH"
      - name: amendment_adopted_at
        type: datetime
        source: system
        description: logical-clock instant the settlement amendment was adopted; cleared on rescission
        default: null
      - name: amendment_effective_date
        type: datetime
        source: input
        description: effective date declared on the settlement amendment; cleared on rescission
        default: null
      - name: cumulative_settlement_charge_cents
        type: integer
        source: computed
        description: "running total of SettlementEntry.amount_cents for this plan; conserved quantity of compensating_invariant / complaint_retriage_reverses_remediation_ledger"
        default: 0
      - name: deferred_settlement_charge_cents
        type: integer
        source: computed
        description: running total of SettlementEntry.deferred_amount_cents for this plan (charges held in AOCI because the settlement threshold was not exceeded)
        default: 0
      - name: filing_reference
        type: string
        source: input
        description: regulator filing reference recorded on the standard termination filing; overwritten on re-filing
        default: null
      - name: filing_submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent termination filing
        default: null
      - name: filing_deficiency_reason
        type: string
        source: input
        description: reason recorded by the Regulator when a filing is returned as deficient; cleared on re-filing
        default: null
      - name: residual_effective_at
        type: datetime
        source: system
        description: logical-clock instant the plan auto-transitioned to RESIDUAL
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: logical-clock instant the Regulator approved the termination filing
        default: null

  - name: DeRiskingStrategy
    parent: PensionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PensionPlan.id; owning plan, supplied by the path"
      - name: strategy_type
        type: enum
        source: input
        description: de-risking lever being evaluated
        constraints: "LUMP_SUM_WINDOW | ANNUITY_BUYOUT | LDI_GLIDEPATH | HYBRID_WINDOW_AND_BUYOUT"
      - name: strategy_label
        type: string
        source: input
        description: short human label for the evaluated option
        constraints: "1..120 chars"
      - name: ldi_hedge_ratio_bp
        type: integer
        source: input
        description: target liability-driven-investing hedge ratio in basis points, recorded for LDI_GLIDEPATH and HYBRID options
        default: 0
        constraints: "0..10000"
      - name: strategy_status
        type: enum
        source: computed
        description: evaluation state; see state_machines.DeRiskingStrategy.strategy_status
        default: DRAFT
        constraints: "DRAFT | UNDER_EVALUATION | APPROVED | REJECTED | EXECUTED"
      - name: projected_accounting_cost_cents
        type: integer
        source: computed
        description: "computed by calculations.strategy_projected_settlement_cost variant ACCOUNTING_BASIS; null until submission, cleared on RETURN_FOR_REVISION"
        default: null
      - name: projected_settlement_cost_cents
        type: integer
        source: computed
        description: "computed by calculations.strategy_projected_settlement_cost variant SETTLEMENT_BASIS; null until submission, cleared on RETURN_FOR_REVISION"
        default: null
      - name: projected_basis_gap_cents
        type: integer
        source: computed
        description: projected_settlement_cost_cents minus projected_accounting_cost_cents; the de-risking premium the sponsor must fund
        default: null
      - name: in_scope_participant_count
        type: integer
        source: computed
        description: number of ParticipantRecord rows in the projection input set at submission time
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the Actuary who submitted the strategy for evaluation; segregation-of-duties operand
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanFiduciary who recorded the evaluation decision
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of completed RETURN_FOR_REVISION rounds
        default: 0
      - name: decision_rationale
        type: string
        source: input
        description: fiduciary rationale recorded with the most recent decision
        default: null

  - name: ParticipantRecord
    parent: PensionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PensionPlan.id; owning plan, supplied by the path"
      - name: tranche_id
        type: string
        source: computed
        description: "FK -> BuyoutTranche.id; set by tranche participant assignment, cleared on tranche abandonment and on lump-sum settlement"
        default: null
      - name: participant_reference
        type: string
        source: input
        description: sponsor recordkeeping reference, unique within the plan
        constraints: "1..40 chars; unique per plan_id"
      - name: cohort
        type: enum
        source: input
        description: actuarial cohort driving annuity and lump-sum factors
        constraints: "RETIREE_IN_PAY | DEFERRED_VESTED"
      - name: date_of_birth
        type: datetime
        source: input
        description: participant date of birth; absence costs 15 data-confidence points
        default: null
      - name: ssn_last4
        type: string
        source: input
        description: last four digits of the participant tax identifier; absence costs 15 data-confidence points
        default: null
        constraints: "exactly 4 digits when present"
      - name: stated_monthly_benefit_cents
        type: integer
        source: input
        description: monthly benefit as stated in the sponsor's records, the audited operand's baseline
        constraints: ">= 1"
      - name: final_average_monthly_earnings_cents
        type: integer
        source: input
        description: final average monthly earnings, input to benefit recomputation
        constraints: ">= 1"
      - name: credited_service_months
        type: integer
        source: input
        description: credited service in months, input to benefit recomputation
        constraints: "1..600"
      - name: audited_monthly_benefit_cents
        type: integer
        source: computed
        description: "monthly benefit used by every downstream calculation; initialised to stated_monthly_benefit_cents at creation and overwritten by calculations.benefit_recomputation when a BenefitAudit is CORRECTED"
      - name: participant_status
        type: enum
        source: computed
        description: settlement disposition dimension; see state_machines.ParticipantRecord.participant_status
        default: IN_PLAN
        constraints: "IN_PLAN | ASSIGNED | TRANSFERRED_TO_INSURER | SETTLED_LUMP_SUM | RESIDUAL_ANNUITY_PURCHASED"
      - name: mortality_status
        type: enum
        source: computed
        description: mortality verification dimension; see state_machines.ParticipantRecord.mortality_status
        default: UNVERIFIED
        constraints: "UNVERIFIED | ALIVE_CONFIRMED | DECEASED_CONFIRMED | DEATH_DISPUTED"
      - name: address_status
        type: enum
        source: computed
        description: address cleansing dimension; see state_machines.ParticipantRecord.address_status
        default: UNCONFIRMED
        constraints: "UNCONFIRMED | CONFIRMED | UNLOCATABLE"
      - name: address_search_tier
        type: enum
        source: computed
        description: tier of the most recent commercial locator search
        default: NONE
        constraints: "NONE | TIER_1 | TIER_2 | TIER_3"
      - name: address_search_attempts
        type: integer
        source: computed
        description: count of recorded locator searches; capped by ADDRESS_SEARCH_MAX_TIERS
        default: 0
      - name: confirmed_address_line1
        type: string
        source: computed
        description: address line recorded by the locator search that produced CONFIRMED_MATCH
        default: null
      - name: confirmed_postal_code
        type: string
        source: computed
        description: postal code recorded by the locator search that produced CONFIRMED_MATCH
        default: null
      - name: date_of_death
        type: datetime
        source: input
        description: date of death recorded by a DEATH_MATCH mortality check
        default: null
      - name: benefit_audit_status
        type: enum
        source: computed
        description: derived mirror of the participant's latest non-SUPERSEDED BenefitAudit.audit_status
        default: NOT_AUDITED
        constraints: "NOT_AUDITED | AUDIT_OPEN | CORRECTION_REQUIRED | PASSED_CLOSED | CORRECTED | REOPENED"
      - name: data_confidence_score
        type: integer
        source: computed
        description: "computed by calculations.data_confidence_score; recomputed on every mutation of address_status, mortality_status, benefit_audit_status, date_of_birth or ssn_last4"
        default: 20
        constraints: "0..100"
      - name: data_status
        type: enum
        source: computed
        description: "CLEAN when data_confidence_score >= DATA_CONFIDENCE_CLEAN_MIN, else NEEDS_REVIEW"
        default: NEEDS_REVIEW
        constraints: "CLEAN | NEEDS_REVIEW"
      - name: accounting_liability_cents
        type: integer
        source: computed
        description: "computed by calculations.participant_accounting_liability from audited_monthly_benefit_cents and cohort"
      - name: settlement_liability_cents
        type: integer
        source: computed
        description: "computed by calculations.participant_settlement_liability from audited_monthly_benefit_cents and cohort"

  - name: BenefitAudit
    parent: ParticipantRecord
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> ParticipantRecord.id; audited participant, supplied by the path"
      - name: audit_basis
        type: enum
        source: input
        description: source document the recomputation was performed against
        default: PLAN_DOCUMENT
        constraints: "PLAN_DOCUMENT | COLLECTIVE_AGREEMENT | PRIOR_ADMINISTRATOR_FILE"
      - name: audit_sequence
        type: integer
        source: computed
        description: 1-based ordinal of this audit within the participant, used as the deterministic latest-audit tie-break
      - name: stated_monthly_benefit_cents
        type: integer
        source: computed
        description: snapshot of ParticipantRecord.stated_monthly_benefit_cents at audit creation
      - name: recomputed_monthly_benefit_cents
        type: integer
        source: computed
        description: "computed by calculations.benefit_recomputation at audit creation"
      - name: variance_cents
        type: integer
        source: computed
        description: recomputed_monthly_benefit_cents minus stated_monthly_benefit_cents; may be negative
      - name: audit_status
        type: enum
        source: computed
        description: audit state; see state_machines.BenefitAudit.audit_status
        default: OPEN
        constraints: "OPEN | PASSED | CORRECTION_REQUIRED | PASSED_CLOSED | CORRECTED | REOPENED | SUPERSEDED"
      - name: resolution
        type: enum
        source: input
        description: resolution recorded by the actuary
        default: null
        constraints: "null | APPLY_CORRECTION | ACCEPT_AS_IS"
      - name: override_rationale
        type: string
        source: input
        description: mandatory rationale when ACCEPT_AS_IS is applied to a CORRECTION_REQUIRED or REOPENED audit
        default: null
      - name: reopened_by_complaint_id
        type: string
        source: computed
        description: identifier of the ParticipantComplaint whose triage reopened this audit; informational, no reverse traversal required
        default: null

  - name: LumpSumWindow
    parent: PensionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PensionPlan.id; owning plan, supplied by the path"
      - name: window_label
        type: string
        source: input
        description: sponsor label for the election window
        constraints: "1..120 chars"
      - name: opens_at
        type: datetime
        source: input
        description: inclusive start of the half-open election interval
      - name: closes_at
        type: datetime
        source: input
        description: exclusive end of the half-open election interval
        constraints: "strictly after opens_at"
      - name: eligibility_max_lump_sum_cents
        type: integer
        source: input
        description: notice eligibility ceiling; participants whose estimated raw present value exceeds it receive no notice
        constraints: ">= 1"
      - name: lump_sum_cap_cents
        type: integer
        source: input
        description: aggregate cash the sponsor will release through this window; enforced by the cap waterfall at closing
        constraints: ">= 1"
      - name: window_status
        type: enum
        source: computed
        description: window state; see state_machines.LumpSumWindow.window_status
        default: PLANNED
        constraints: "PLANNED | OPEN | CLOSED | SETTLED | VOIDED"
      - name: notice_count
        type: integer
        source: computed
        description: number of ParticipantElection rows created by the notice fan-out at opening
        default: 0
      - name: approved_lump_sum_total_cents
        type: integer
        source: computed
        description: "computed by calculations.window_cap_waterfall at closing; sum of net_lump_sum_cents over elections the cap honoured"
        default: 0
      - name: paid_lump_sum_total_cents
        type: integer
        source: computed
        description: cash actually disbursed at settlement
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the window opened
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the window closed
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant the window settled
        default: null

  - name: ParticipantElection
    parent: LumpSumWindow
    common_fields: true
    fields:
      - name: window_id
        type: string
        source: computed
        description: "FK -> LumpSumWindow.id; window whose notice fan-out created this election"
      - name: participant_id
        type: string
        source: computed
        description: "FK -> ParticipantRecord.id; noticed participant"
      - name: election_status
        type: enum
        source: computed
        description: election state; see state_machines.ParticipantElection.election_status
        default: NOTICE_SENT
        constraints: "NOTICE_SENT | ELECTED_LUMP_SUM | ELECTED_ANNUITY | CAP_DEFERRED | DEFAULTED_NO_RESPONSE | PAID | VOIDED"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant the notice was generated
      - name: notice_estimated_lump_sum_cents
        type: integer
        source: computed
        description: "raw present value computed at notice time by calculations.lump_sum_present_value step 1; the eligibility operand"
      - name: election_choice
        type: enum
        source: input
        description: participant's recorded choice
        default: null
        constraints: "null | LUMP_SUM | ANNUITY"
      - name: elected_at
        type: datetime
        source: system
        description: logical-clock instant of the current election; cleared on revocation; primary sort key of the cap waterfall
        default: null
      - name: raw_pv_cents
        type: integer
        source: computed
        description: "computed by calculations.lump_sum_present_value at election time; the admin-fee tier key"
        default: null
      - name: admin_fee_bp
        type: integer
        source: computed
        description: fee tier in basis points selected from raw_pv_cents
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "computed by calculations.lump_sum_present_value; capped at ADMIN_FEE_CAP_CENTS"
        default: null
      - name: net_lump_sum_cents
        type: integer
        source: computed
        description: raw_pv_cents minus admin_fee_cents; the cap-waterfall and disbursement amount
        default: null
      - name: revocation_count
        type: integer
        source: computed
        description: number of completed revocations; capped by REVOCATION_MAX
        default: 0
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant the election was paid at window settlement
        default: null
      - name: paid_amount_cents
        type: integer
        source: computed
        description: cash disbursed for this election
        default: null

  - name: BuyoutTranche
    parent: PensionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PensionPlan.id; owning plan, supplied by the path"
      - name: tranche_label
        type: string
        source: input
        description: sponsor label for the buyout tranche
        constraints: "1..120 chars"
      - name: target_cohort
        type: enum
        source: input
        description: cohort the tranche is scoped to; assignment rejects participants of another cohort
        constraints: "RETIREE_IN_PAY | DEFERRED_VESTED"
      - name: tranche_status
        type: enum
        source: computed
        description: tranche state; see state_machines.BuyoutTranche.tranche_status
        default: DRAFT
        constraints: "DRAFT | QUOTING | INSURER_SELECTED | PRICING_LOCKED | ASSETS_TRANSFERRED | SETTLED | ABANDONED"
      - name: assigned_participant_count
        type: integer
        source: computed
        description: number of ParticipantRecord rows with tranche_id equal to this tranche and participant_status IN {ASSIGNED, TRANSFERRED_TO_INSURER}
        default: 0
      - name: accounting_liability_cents
        type: integer
        source: computed
        description: "computed by calculations.tranche_liability variant ACCOUNTING_BASIS over assigned participants; the settlement recognition PBO operand"
        default: 0
      - name: settlement_liability_cents
        type: integer
        source: computed
        description: "computed by calculations.tranche_liability variant SETTLEMENT_BASIS over assigned participants"
        default: 0
      - name: data_readiness_flag
        type: enum
        source: computed
        description: READY while every assigned participant has data_status CLEAN and mortality_status ALIVE_CONFIRMED, else BLOCKED
        default: READY
        constraints: "READY | BLOCKED"
      - name: selection_basis
        type: enum
        source: input
        description: weight set the fiduciary directed for the safest-available-annuity ranking
        default: null
        constraints: "null | SAFETY_WEIGHTED | PRICE_WEIGHTED"
      - name: selected_quote_id
        type: string
        source: computed
        description: "FK -> AnnuityQuote.id; quote chosen by calculations.insurer_safest_available_score; cleared on selection reset and abandonment"
        default: null
      - name: selected_insurer_id
        type: string
        source: computed
        description: "FK -> Insurer.id; insurer of the selected quote; cleared on selection reset and abandonment"
        default: null
      - name: selection_score_bp
        type: integer
        source: computed
        description: winning composite score in basis points
        default: null
      - name: locked_premium_cents
        type: integer
        source: computed
        description: premium locked at pricing lock; the insurer capacity consumption and settlement-cost operand
        default: null
      - name: lock_start_at
        type: datetime
        source: system
        description: inclusive start of the closed pricing-lock interval
        default: null
      - name: lock_expires_at
        type: datetime
        source: system
        description: inclusive end of the closed pricing-lock interval
        default: null
      - name: transfer_expense_cents
        type: integer
        source: computed
        description: gross transfer value minus credited value on the settled AssetTransfer; second settlement-cost operand
        default: 0
      - name: settlement_gain_loss_cents
        type: integer
        source: computed
        description: "computed by calculations.settlement_recognition; positive is a loss"
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant the tranche settled
        default: null
      - name: abandoned_at
        type: datetime
        source: system
        description: logical-clock instant the tranche was abandoned
        default: null
      - name: abandonment_reason
        type: string
        source: input
        description: fiduciary reason recorded on abandonment
        default: null

  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - name: insurer_name
        type: string
        source: input
        description: legal name of the candidate annuity provider
        constraints: "1..200 chars; unique"
      - name: rating_grade
        type: enum
        source: input
        description: current financial strength rating; maps to RATING_POINTS
        constraints: "AAA | AA_PLUS | AA | AA_MINUS | A_PLUS | A | BBB"
      - name: capital_ratio_bp
        type: integer
        source: input
        description: risk-based capital ratio in basis points; maps to capital points
        constraints: "0..20000"
      - name: state_guaranty_coverage_cents
        type: integer
        source: input
        description: per-participant state guaranty association coverage recorded for the fiduciary record
        constraints: ">= 0"
      - name: capacity_cents
        type: integer
        source: input
        description: total premium the insurer will write; conserved quantity of compensating_invariant / abandonment_restores_insurer_capacity
        constraints: ">= 1"
      - name: committed_capacity_cents
        type: integer
        source: computed
        description: "computed by calculations.insurer_committed_capacity over unexpired and settled pricing locks"
        default: 0
      - name: available_capacity_cents
        type: integer
        source: computed
        description: capacity_cents minus committed_capacity_cents
      - name: insurer_status
        type: enum
        source: input
        description: "registry standing of the carrier; only an ACTIVE carrier may be solicited for a quote or hold a pricing lock; moved only by regulator rating actions"
        default: ACTIVE
        constraints: "ACTIVE | UNDER_REVIEW | WITHDRAWN"
      - name: rating_changed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent rating change
        default: null

  - name: AnnuityQuote
    parent: BuyoutTranche
    common_fields: true
    fields:
      - name: tranche_id
        type: string
        source: input
        description: "FK -> BuyoutTranche.id; tranche being quoted, supplied by the path"
      - name: insurer_id
        type: string
        source: input
        description: "FK -> Insurer.id; quoting insurer"
      - name: quote_status
        type: enum
        source: computed
        description: quote state; see state_machines.AnnuityQuote.quote_status
        default: REQUESTED
        constraints: "REQUESTED | SUBMITTED | SHORTLISTED | LOCKED | BOUND | DECLINED | INELIGIBLE | EXPIRED"
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the fiduciary requested the quote
      - name: premium_cents
        type: integer
        source: input
        description: single premium quoted for the tranche
        default: null
        constraints: ">= 1 when submitted"
      - name: lock_days
        type: integer
        source: input
        description: number of days the insurer will hold pricing once locked
        default: null
        constraints: "1..365 when submitted"
      - name: quote_valid_days
        type: integer
        source: input
        description: number of days the submitted quote remains selectable
        default: null
        constraints: "1..365 when submitted"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: submitted_at plus quote_valid_days; selection and pricing lock require strictly greater than the clock
        default: null
      - name: rating_at_submission
        type: enum
        source: computed
        description: snapshot of Insurer.rating_grade at submission, retained for the fiduciary record
        default: null
      - name: composite_score_bp
        type: integer
        source: computed
        description: "computed by calculations.insurer_safest_available_score during the most recent selection this quote participated in"
        default: null
      - name: decline_reason
        type: string
        source: input
        description: reason recorded when the insurer declines to quote
        default: null

  - name: IndependentExpert
    parent: PensionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PensionPlan.id; engaging plan, supplied by the path"
      - name: expert_firm_name
        type: string
        source: input
        description: name of the independent fiduciary or expert firm
        constraints: "1..200 chars"
      - name: conflict_disclosed
        type: boolean
        source: input
        description: whether the expert disclosed a relationship with any candidate insurer
        default: false
      - name: expert_status
        type: enum
        source: computed
        description: engagement state; see state_machines.IndependentExpert.expert_status
        default: INDEPENDENCE_REVIEW
        constraints: "INDEPENDENCE_REVIEW | ENGAGED | DISQUALIFIED | OPINION_ISSUED"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanSponsor user who proposed the expert; segregation-of-duties operand
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanFiduciary who cleared or disqualified the expert
        default: null
      - name: safest_available_opinion
        type: enum
        source: input
        description: opinion issued on the safest-available-annuity standard
        default: null
        constraints: "null | AFFIRMATIVE | QUALIFIED | ADVERSE"
      - name: opinion_issued_at
        type: datetime
        source: system
        description: logical-clock instant the opinion was issued
        default: null

  - name: AssetTransfer
    parent: BuyoutTranche
    common_fields: true
    fields:
      - name: tranche_id
        type: string
        source: input
        description: "FK -> BuyoutTranche.id; tranche being funded, supplied by the path"
      - name: transfer_mode
        type: enum
        source: input
        description: whether the premium is funded with securities or cash
        constraints: "IN_KIND | CASH"
      - name: in_kind_market_value_cents
        type: integer
        source: input
        description: gross market value of the securities offered; required when transfer_mode is IN_KIND
        default: null
        constraints: ">= 1 when IN_KIND"
      - name: in_kind_lot_count
        type: integer
        source: input
        description: number of security lots offered; required when transfer_mode is IN_KIND
        default: null
        constraints: "1..500 when IN_KIND"
      - name: cash_amount_cents
        type: integer
        source: input
        description: gross cash offered; required when transfer_mode is CASH
        default: null
        constraints: ">= 1 when CASH"
      - name: gross_value_cents
        type: integer
        source: computed
        description: in_kind_market_value_cents for IN_KIND, cash_amount_cents for CASH
      - name: credited_value_cents
        type: integer
        source: computed
        description: "computed by calculations.transfer_credited_value; the value the insurer credits against the locked premium"
      - name: transfer_expense_cents
        type: integer
        source: computed
        description: gross_value_cents minus credited_value_cents
      - name: shortfall_cents
        type: integer
        source: computed
        description: locked_premium_cents minus credited_value_cents; must be <= 0 for the transfer to be accepted at creation
      - name: transfer_status
        type: enum
        source: computed
        description: transfer state; see state_machines.AssetTransfer.transfer_status
        default: INITIATED
        constraints: "INITIATED | SETTLED | REJECTED | SUPERSEDED"
      - name: insurer_decision
        type: enum
        source: input
        description: insurer's review outcome
        default: null
        constraints: "null | ACCEPT | REJECT"
      - name: rejection_reason
        type: string
        source: input
        description: reason recorded when the insurer rejects the composition
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant the transfer settled
        default: null

  - name: SettlementEntry
    parent: PensionPlan
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: computed
        description: "FK -> PensionPlan.id; plan whose accounting the entry charges"
      - name: tranche_id
        type: string
        source: computed
        description: "FK -> BuyoutTranche.id; populated for BUYOUT_RECOGNITION entries, null otherwise"
        default: null
      - name: window_id
        type: string
        source: computed
        description: "FK -> LumpSumWindow.id; populated for LUMP_SUM_RECOGNITION entries, null otherwise"
        default: null
      - name: entry_type
        type: enum
        source: computed
        description: accounting event the entry records
        constraints: "BUYOUT_RECOGNITION | LUMP_SUM_RECOGNITION | REMEDIATION | REMEDIATION_REVERSAL | PLAN_TERMINATION"
      - name: amount_cents
        type: integer
        source: computed
        description: charge recognised immediately in earnings; negative for REMEDIATION_REVERSAL; summed into PensionPlan.cumulative_settlement_charge_cents
      - name: deferred_amount_cents
        type: integer
        source: computed
        description: charge held in AOCI because the settlement threshold was not exceeded; summed into PensionPlan.deferred_settlement_charge_cents
        default: 0
      - name: gain_loss_cents
        type: integer
        source: computed
        description: settlement cost minus PBO settled for recognition entries; 0 for REMEDIATION and PLAN_TERMINATION entries
        default: 0
      - name: pbo_settled_cents
        type: integer
        source: computed
        description: projected benefit obligation extinguished by the event
        default: 0
      - name: source_reference
        type: string
        source: computed
        description: human-readable provenance string naming the triggering transition and, for remediation entries, the complaint reference
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the entry was appended; entries are append-only and never mutated

  - name: ParticipantComplaint
    parent: ParticipantRecord
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> ParticipantRecord.id; complaining participant, supplied by the path"
      - name: tranche_id
        type: string
        source: computed
        description: "FK -> BuyoutTranche.id; snapshot of the participant's tranche_id at filing, null for lump-sum and residual participants"
        default: null
      - name: complaint_reference
        type: string
        source: computed
        description: server-minted sequential reference within the plan, used in SettlementEntry.source_reference
      - name: complaint_category
        type: enum
        source: input
        description: nature of the post-transfer complaint
        constraints: "BENEFIT_AMOUNT | MISSING_PAYMENT | ADDRESS_OR_IDENTITY | ANNUITY_FORM"
      - name: complaint_detail
        type: string
        source: input
        description: participant's narrative
        constraints: "1..1000 chars"
      - name: complaint_status
        type: enum
        source: computed
        description: complaint state; see state_machines.ParticipantComplaint.complaint_status
        default: OPEN
        constraints: "OPEN | TRIAGED | RESOLVED | CLOSED_FINAL"
      - name: responsibility_determination
        type: enum
        source: input
        description: correction responsibility recorded at triage
        default: null
        constraints: "null | SPONSOR_RESPONSIBLE | INSURER_RESPONSIBLE | NO_ERROR"
      - name: determination_rationale
        type: string
        source: input
        description: rationale recorded with the current determination
        default: null
      - name: remediation_amount_cents
        type: integer
        source: input
        description: sponsor-funded remediation recorded at resolution; must be 0 unless responsibility is SPONSOR_RESPONSIBLE
        default: 0
      - name: reversed_amount_cents
        type: integer
        source: computed
        description: remediation reversed by a subsequent re-triage to NO_ERROR
        default: 0
      - name: triage_count
        type: integer
        source: computed
        description: number of completed triage rounds, including re-triage after resolution
        default: 0
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent resolution
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: PensionPlan
    state_field: plan_status
    initial_state: ONGOING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONGOING
        to: SETTLEMENT_AUTHORIZED
        trigger: "POST /prt/plans/{id}/settlement-amendment with amendment_action=ADOPT"
        actor: PlanSponsor
        preconditions:
          - "plan_status == ONGOING"
          - "at least one DeRiskingStrategy exists with plan_id == this plan AND strategy_status == APPROVED AND strategy_type IN AMENDMENT_SCOPE_MAP[amendment_action payload amendment_scope] where AMENDMENT_SCOPE_MAP = { LUMP_SUM_ONLY: {LUMP_SUM_WINDOW, HYBRID_WINDOW_AND_BUYOUT}, BUYOUT_ONLY: {ANNUITY_BUYOUT, HYBRID_WINDOW_AND_BUYOUT}, BOTH: {HYBRID_WINDOW_AND_BUYOUT} }; else ERR_STRATEGY_NOT_APPROVED"
          - "amendment_effective_date >= the logical clock; else ERR_INVALID_INTERVAL"
        side_effects:
          - "set amendment_scope, amendment_effective_date from the payload and amendment_adopted_at to the logical clock"
          - "increments PensionPlan.version by 1"
      - from: SETTLEMENT_AUTHORIZED
        to: ONGOING
        trigger: "POST /prt/plans/{id}/settlement-amendment with amendment_action=RESCIND"
        actor: PlanSponsor
        preconditions:
          - "plan_status == SETTLEMENT_AUTHORIZED"
          - "no LumpSumWindow of this plan has window_status IN {OPEN, CLOSED}; else ERR_WINDOW_STATE_INVALID"
          - "no BuyoutTranche of this plan has tranche_status IN {QUOTING, INSURER_SELECTED, PRICING_LOCKED, ASSETS_TRANSFERRED}; else ERR_TRANCHE_STATE_INVALID"
        side_effects:
          - "clear amendment_scope, amendment_adopted_at and amendment_effective_date"
          - "cascade: every LumpSumWindow of this plan with window_status == PLANNED transitions to VOIDED"
          - "cascade: every BuyoutTranche of this plan with tranche_status == DRAFT transitions to ABANDONED, which itself unassigns its participants (ASSIGNED -> IN_PLAN, tranche_id cleared) and recomputes each participant's data_confidence_score"
          - "increments PensionPlan.version by 1"
        note: "cycle ONGOING <-> SETTLEMENT_AUTHORIZED; rescission is only reachable while no settlement is in flight"
      - from: SETTLEMENT_AUTHORIZED
        to: RESIDUAL
        trigger: "system, evaluated at the end of POST /prt/lump-sum-windows/{id}/settlement and POST /prt/tranches/{id}/settlement"
        actor: system
        preconditions:
          - "every LumpSumWindow of this plan has window_status IN {SETTLED, VOIDED}"
          - "every BuyoutTranche of this plan has tranche_status IN {SETTLED, ABANDONED}"
          - "at least one LumpSumWindow has window_status == SETTLED OR at least one BuyoutTranche has tranche_status == SETTLED"
        side_effects:
          - "set residual_effective_at to the logical clock"
          - "recompute accounting_funded_status_bp and participant_liability_total_cents"
          - "cascade: every DeRiskingStrategy of this plan with strategy_status == APPROVED transitions to EXECUTED"
          - "increments PensionPlan.version by 1"
        note: "compound bubble-up: the parent's state is derived from the aggregate state of its window and tranche children"
      - from: RESIDUAL
        to: TERMINATION_FILED
        trigger: "POST /prt/plans/{id}/termination-filing"
        actor: PlanSponsor
        preconditions:
          - "plan_status IN {RESIDUAL, FILING_DEFICIENT}"
          - "count of ParticipantComplaint rows whose participant_id belongs to this plan and whose complaint_status IN {OPEN, TRIAGED} == 0; else ERR_COMPLAINT_STATE_INVALID"
        side_effects:
          - "set filing_reference from the payload and filing_submitted_at to the logical clock"
          - "clear filing_deficiency_reason"
          - "increments PensionPlan.version by 1"
      - from: FILING_DEFICIENT
        to: TERMINATION_FILED
        trigger: "POST /prt/plans/{id}/termination-filing with deficiency_response present"
        actor: PlanSponsor
        preconditions:
          - "plan_status == FILING_DEFICIENT"
          - "deficiency_response is present and non-empty; else ERR_INVALID_REQUEST"
          - "count of ParticipantComplaint rows whose participant_id belongs to this plan and whose complaint_status IN {OPEN, TRIAGED} == 0; else ERR_COMPLAINT_STATE_INVALID"
        side_effects:
          - "overwrite filing_reference, refresh filing_submitted_at, clear filing_deficiency_reason"
          - "increments PensionPlan.version by 1"
        note: "cycle TERMINATION_FILED <-> FILING_DEFICIENT; the sponsor may re-file any number of times"
      - from: TERMINATION_FILED
        to: FILING_DEFICIENT
        trigger: "POST /prt/plans/{id}/filing-review with review_decision=RETURN_DEFICIENT"
        actor: Regulator
        preconditions:
          - "plan_status == TERMINATION_FILED"
          - "filing_deficiency_reason payload field is present and non-empty; else ERR_INVALID_REQUEST"
        side_effects:
          - "set filing_deficiency_reason"
          - "increments PensionPlan.version by 1"
      - from: TERMINATION_FILED
        to: TERMINATED
        trigger: "POST /prt/plans/{id}/filing-review with review_decision=APPROVE"
        actor: Regulator
        preconditions:
          - "plan_status == TERMINATION_FILED"
          - "accounting_funded_status_bp >= 10000; else ERR_PLAN_ASSETS_INSUFFICIENT"
        side_effects:
          - "set terminated_at to the logical clock"
          - "cascade: every ParticipantRecord of this plan with participant_status == IN_PLAN transitions to RESIDUAL_ANNUITY_PURCHASED"
          - "cascade: every ParticipantComplaint of this plan's participants with complaint_status == RESOLVED transitions to CLOSED_FINAL"
          - "append one SettlementEntry with entry_type = PLAN_TERMINATION, amount_cents = 0, pbo_settled_cents = participant_liability_total_cents measured before the cascade"
          - "increments PensionPlan.version by 1"

  - entity: DeRiskingStrategy
    state_field: strategy_status
    initial_state: DRAFT
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: DRAFT
        to: UNDER_EVALUATION
        trigger: "POST /prt/strategies/{id}/submission"
        actor: Actuary
        preconditions:
          - "strategy_status == DRAFT"
          - "plan.plan_status IN {ONGOING, SETTLEMENT_AUTHORIZED}; else ERR_PLAN_STATE_INVALID"
        side_effects:
          - "run calculations.strategy_projected_settlement_cost for BOTH variants and store projected_accounting_cost_cents, projected_settlement_cost_cents, projected_basis_gap_cents and in_scope_participant_count"
          - "set submitted_by_user_id to X-User-ID"
          - "increments DeRiskingStrategy.version by 1"
      - from: UNDER_EVALUATION
        to: APPROVED
        trigger: "POST /prt/strategies/{id}/decision with decision=APPROVE"
        actor: PlanFiduciary
        preconditions:
          - "strategy_status == UNDER_EVALUATION"
          - "X-User-ID != submitted_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set decided_by_user_id and decision_rationale"
          - "increments DeRiskingStrategy.version by 1"
      - from: UNDER_EVALUATION
        to: REJECTED
        trigger: "POST /prt/strategies/{id}/decision with decision=REJECT"
        actor: PlanFiduciary
        preconditions:
          - "strategy_status == UNDER_EVALUATION"
          - "X-User-ID != submitted_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set decided_by_user_id and decision_rationale"
          - "increments DeRiskingStrategy.version by 1"
      - from: UNDER_EVALUATION
        to: DRAFT
        trigger: "POST /prt/strategies/{id}/decision with decision=RETURN_FOR_REVISION"
        actor: PlanFiduciary
        preconditions:
          - "strategy_status == UNDER_EVALUATION"
          - "X-User-ID != submitted_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
          - "revision_count < MAX_REVISION_ROUNDS (2); else ERR_STRATEGY_STATE_INVALID"
        side_effects:
          - "increment revision_count by 1"
          - "clear projected_accounting_cost_cents, projected_settlement_cost_cents, projected_basis_gap_cents and set in_scope_participant_count to 0"
          - "clear submitted_by_user_id"
          - "increments DeRiskingStrategy.version by 1"
        note: "revision cycle DRAFT -> UNDER_EVALUATION -> DRAFT, bounded at MAX_REVISION_ROUNDS"
      - from: APPROVED
        to: EXECUTED
        trigger: "system, cascaded from PensionPlan SETTLEMENT_AUTHORIZED -> RESIDUAL"
        actor: system
        preconditions:
          - "strategy_status == APPROVED"
        side_effects:
          - "increments DeRiskingStrategy.version by 1"

  - entity: ParticipantRecord
    state_field: participant_status
    initial_state: IN_PLAN
    terminal_states: [TRANSFERRED_TO_INSURER, SETTLED_LUMP_SUM, RESIDUAL_ANNUITY_PURCHASED]
    transitions:
      - from: IN_PLAN
        to: ASSIGNED
        trigger: "POST /prt/tranches/{id}/participant-assignments"
        actor: PlanAdministrator
        preconditions:
          - "participant_status == IN_PLAN; else ERR_PARTICIPANT_ALREADY_ASSIGNED"
          - "participant.plan_id == tranche.plan_id; else ERR_PARTICIPANT_PLAN_MISMATCH"
          - "participant.cohort == tranche.target_cohort; else ERR_PARTICIPANT_PLAN_MISMATCH"
          - "tranche.tranche_status == DRAFT; else ERR_TRANCHE_STATE_INVALID"
        side_effects:
          - "set tranche_id"
          - "recompute tranche.assigned_participant_count, tranche.accounting_liability_cents, tranche.settlement_liability_cents and tranche.data_readiness_flag"
          - "increments ParticipantRecord.version by 1"
      - from: ASSIGNED
        to: IN_PLAN
        trigger: "system, cascaded from BuyoutTranche -> ABANDONED"
        actor: system
        preconditions:
          - "participant_status == ASSIGNED"
        side_effects:
          - "clear tranche_id"
          - "recompute data_confidence_score and data_status"
          - "increments ParticipantRecord.version by 1"
        note: "cycle IN_PLAN <-> ASSIGNED; abandonment returns the participant to the ongoing plan"
      - from: ASSIGNED
        to: TRANSFERRED_TO_INSURER
        trigger: "system, cascaded from BuyoutTranche ASSETS_TRANSFERRED -> SETTLED"
        actor: system
        preconditions:
          - "participant_status == ASSIGNED"
        side_effects:
          - "increments ParticipantRecord.version by 1"
      - from: IN_PLAN
        to: SETTLED_LUMP_SUM
        trigger: "system, cascaded from LumpSumWindow CLOSED -> SETTLED for each election paid"
        actor: system
        preconditions:
          - "participant_status == IN_PLAN"
          - "the participant's election in the settling window has election_status == ELECTED_LUMP_SUM"
        side_effects:
          - "clear tranche_id"
          - "increments ParticipantRecord.version by 1"
      - from: IN_PLAN
        to: RESIDUAL_ANNUITY_PURCHASED
        trigger: "system, cascaded from PensionPlan TERMINATION_FILED -> TERMINATED"
        actor: system
        preconditions:
          - "participant_status == IN_PLAN"
        side_effects:
          - "increments ParticipantRecord.version by 1"

  - entity: ParticipantRecord
    state_field: mortality_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: ALIVE_CONFIRMED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=NO_MATCH"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status IN {UNVERIFIED, DEATH_DISPUTED}"
        side_effects:
          - "recompute data_confidence_score and data_status"
          - "if tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, recompute tranche.data_readiness_flag"
          - "increments ParticipantRecord.version by 1"
      - from: UNVERIFIED
        to: DECEASED_CONFIRMED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=DEATH_MATCH"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status IN {UNVERIFIED, ALIVE_CONFIRMED, DEATH_DISPUTED}"
          - "date_of_death payload field present; else ERR_INVALID_REQUEST"
        side_effects:
          - "set date_of_death"
          - "cascade: every ParticipantElection of this participant with election_status IN {NOTICE_SENT, ELECTED_LUMP_SUM, ELECTED_ANNUITY} transitions to VOIDED"
          - "recompute data_confidence_score and data_status"
          - "if tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, recompute tranche.accounting_liability_cents, tranche.settlement_liability_cents and set tranche.data_readiness_flag = BLOCKED"
          - "increments ParticipantRecord.version by 1"
      - from: ALIVE_CONFIRMED
        to: DECEASED_CONFIRMED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=DEATH_MATCH"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status == ALIVE_CONFIRMED"
          - "date_of_death payload field present; else ERR_INVALID_REQUEST"
        side_effects:
          - "identical to the UNVERIFIED -> DECEASED_CONFIRMED side-effect set"
      - from: DECEASED_CONFIRMED
        to: DEATH_DISPUTED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=DISPUTE_FILED"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status == DECEASED_CONFIRMED"
          - "dispute_reason payload field present and non-empty; else ERR_INVALID_REQUEST"
        side_effects:
          - "recompute data_confidence_score and data_status"
          - "increments ParticipantRecord.version by 1"
      - from: DEATH_DISPUTED
        to: ALIVE_CONFIRMED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=DISPUTE_RESOLVED_ALIVE"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status == DEATH_DISPUTED"
        side_effects:
          - "clear date_of_death"
          - "recompute accounting_liability_cents and settlement_liability_cents (restoring the non-zero amounts that DECEASED_CONFIRMED had zeroed)"
          - "recompute data_confidence_score and data_status"
          - "if tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, recompute tranche.accounting_liability_cents, tranche.settlement_liability_cents and tranche.data_readiness_flag"
          - "increments ParticipantRecord.version by 1"
        note: "cycle DECEASED_CONFIRMED -> DEATH_DISPUTED -> ALIVE_CONFIRMED; this dimension evolves independently of participant_status and address_status on the same row, and the liability restoration makes the cycle exactly compensating"
      - from: DEATH_DISPUTED
        to: DECEASED_CONFIRMED
        trigger: "POST /prt/participants/{id}/mortality-checks with match_result=DISPUTE_RESOLVED_DECEASED"
        actor: PlanAdministrator
        preconditions:
          - "mortality_status == DEATH_DISPUTED"
        side_effects:
          - "recompute data_confidence_score and data_status"
          - "increments ParticipantRecord.version by 1"

  - entity: ParticipantRecord
    state_field: address_status
    initial_state: UNCONFIRMED
    terminal_states: [CONFIRMED, UNLOCATABLE]
    transitions:
      - from: UNCONFIRMED
        to: UNCONFIRMED
        trigger: "POST /prt/participants/{id}/address-searches with search_result=NO_MATCH while address_search_attempts < 2"
        actor: PlanAdministrator
        preconditions:
          - "address_status == UNCONFIRMED"
          - "address_search_attempts < ADDRESS_SEARCH_MAX_TIERS (3); else ERR_ADDRESS_SEARCH_TIER_EXHAUSTED"
        side_effects:
          - "increment address_search_attempts by 1 and set address_search_tier to TIER_<new attempts count>"
          - "increments ParticipantRecord.version by 1"
        note: "self-loop implementing commercial locator tier escalation TIER_1 -> TIER_2 -> TIER_3"
      - from: UNCONFIRMED
        to: CONFIRMED
        trigger: "POST /prt/participants/{id}/address-searches with search_result=CONFIRMED_MATCH"
        actor: PlanAdministrator
        preconditions:
          - "address_status == UNCONFIRMED"
          - "address_search_attempts < ADDRESS_SEARCH_MAX_TIERS (3); else ERR_ADDRESS_SEARCH_TIER_EXHAUSTED"
          - "confirmed_address_line1 and confirmed_postal_code payload fields present; else ERR_INVALID_REQUEST"
        side_effects:
          - "increment address_search_attempts by 1 and set address_search_tier accordingly"
          - "set confirmed_address_line1 and confirmed_postal_code"
          - "recompute data_confidence_score and data_status"
          - "if tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, recompute tranche.data_readiness_flag"
          - "increments ParticipantRecord.version by 1"
      - from: UNCONFIRMED
        to: UNLOCATABLE
        trigger: "POST /prt/participants/{id}/address-searches with search_result=NO_MATCH while address_search_attempts == 2"
        actor: PlanAdministrator
        preconditions:
          - "address_status == UNCONFIRMED"
          - "address_search_attempts == ADDRESS_SEARCH_MAX_TIERS - 1 (2)"
        side_effects:
          - "increment address_search_attempts to 3 and set address_search_tier = TIER_3"
          - "recompute data_confidence_score and data_status"
          - "increments ParticipantRecord.version by 1"
        note: "the third consecutive NO_MATCH exhausts the tier ladder; a fourth search is rejected with ERR_ADDRESS_SEARCH_TIER_EXHAUSTED"

  - entity: BenefitAudit
    state_field: audit_status
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "system, evaluated inside POST /prt/participants/{id}/benefit-audits when abs(variance_cents) <= AUDIT_VARIANCE_TOLERANCE_CENTS"
        actor: system
        preconditions:
          - "abs(variance_cents) <= AUDIT_VARIANCE_TOLERANCE_CENTS (500)"
        side_effects:
          - "set participant.benefit_audit_status = AUDIT_OPEN then immediately PASSED is mirrored as AUDIT_OPEN until resolution; participant.audited_monthly_benefit_cents is left unchanged"
          - "recompute participant.data_confidence_score and participant.data_status"
        note: "branch A of the variance fork; the boundary is inclusive so a variance of exactly 500 cents passes"
      - from: OPEN
        to: CORRECTION_REQUIRED
        trigger: "system, evaluated inside POST /prt/participants/{id}/benefit-audits when abs(variance_cents) > AUDIT_VARIANCE_TOLERANCE_CENTS"
        actor: system
        preconditions:
          - "abs(variance_cents) > AUDIT_VARIANCE_TOLERANCE_CENTS (500)"
        side_effects:
          - "set participant.benefit_audit_status = CORRECTION_REQUIRED"
          - "recompute participant.data_confidence_score and participant.data_status"
          - "if participant.tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, set tranche.data_readiness_flag = BLOCKED"
        note: "branch B of the variance fork; divergent side-effect set from branch A"
      - from: PASSED
        to: PASSED_CLOSED
        trigger: "POST /prt/benefit-audits/{id}/resolution with resolution=ACCEPT_AS_IS"
        actor: Actuary
        preconditions:
          - "audit_status == PASSED"
        side_effects:
          - "set participant.audited_monthly_benefit_cents = stated_monthly_benefit_cents and participant.benefit_audit_status = PASSED_CLOSED"
          - "recompute participant.accounting_liability_cents, participant.settlement_liability_cents, data_confidence_score and data_status"
          - "increments BenefitAudit.version by 1"
      - from: CORRECTION_REQUIRED
        to: CORRECTED
        trigger: "POST /prt/benefit-audits/{id}/resolution with resolution=APPLY_CORRECTION"
        actor: Actuary
        preconditions:
          - "audit_status IN {CORRECTION_REQUIRED, REOPENED}"
        side_effects:
          - "set participant.audited_monthly_benefit_cents = recomputed_monthly_benefit_cents and participant.benefit_audit_status = CORRECTED"
          - "recompute participant.accounting_liability_cents and participant.settlement_liability_cents"
          - "recompute participant.data_confidence_score and participant.data_status"
          - "if participant.tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED}, recompute tranche.accounting_liability_cents, tranche.settlement_liability_cents and tranche.data_readiness_flag"
          - "increments BenefitAudit.version by 1"
      - from: CORRECTION_REQUIRED
        to: PASSED_CLOSED
        trigger: "POST /prt/benefit-audits/{id}/resolution with resolution=ACCEPT_AS_IS and override_rationale present"
        actor: Actuary
        preconditions:
          - "audit_status IN {CORRECTION_REQUIRED, REOPENED}"
          - "override_rationale present and non-empty; else ERR_INVALID_REQUEST"
        side_effects:
          - "set participant.audited_monthly_benefit_cents = stated_monthly_benefit_cents and participant.benefit_audit_status = PASSED_CLOSED"
          - "recompute participant.accounting_liability_cents, participant.settlement_liability_cents, data_confidence_score and data_status"
          - "increments BenefitAudit.version by 1"
      - from: PASSED_CLOSED
        to: REOPENED
        trigger: "system, cascaded from ParticipantComplaint OPEN -> TRIAGED with responsibility_determination=SPONSOR_RESPONSIBLE"
        actor: system
        preconditions:
          - "this audit is the participant's latest non-SUPERSEDED audit, selected by audit_sequence DESC"
          - "audit_status IN {PASSED, PASSED_CLOSED, CORRECTED, CORRECTION_REQUIRED}"
        side_effects:
          - "set reopened_by_complaint_id"
          - "set participant.benefit_audit_status = REOPENED, then recompute participant.data_confidence_score and participant.data_status"
          - "increments BenefitAudit.version by 1"
      - from: CORRECTED
        to: REOPENED
        trigger: "system, cascaded from ParticipantComplaint OPEN -> TRIAGED with responsibility_determination=SPONSOR_RESPONSIBLE"
        actor: system
        preconditions:
          - "this audit is the participant's latest non-SUPERSEDED audit, selected by audit_sequence DESC"
        side_effects:
          - "identical to the PASSED_CLOSED -> REOPENED side-effect set"
      - from: REOPENED
        to: CORRECTED
        trigger: "POST /prt/benefit-audits/{id}/resolution with resolution=APPLY_CORRECTION"
        actor: Actuary
        preconditions:
          - "audit_status == REOPENED"
        side_effects:
          - "identical to the CORRECTION_REQUIRED -> CORRECTED side-effect set"
        note: "reopen cycle CORRECTED -> REOPENED -> CORRECTED, driven by post-transfer complaint triage"
      - from: PASSED_CLOSED
        to: SUPERSEDED
        trigger: "system, evaluated inside POST /prt/participants/{id}/benefit-audits before the new audit is created"
        actor: system
        preconditions:
          - "audit_status != SUPERSEDED"
        side_effects:
          - "increments BenefitAudit.version by 1"
        note: "every non-SUPERSEDED audit of the participant is superseded when a new audit is created; this is the create-with-supersede pattern the concurrency rule benefit-audit-create-stale-participant guards"

  - entity: LumpSumWindow
    state_field: window_status
    initial_state: PLANNED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /prt/lump-sum-windows/{id}/opening"
        actor: PlanAdministrator
        preconditions:
          - "window_status == PLANNED"
          - "plan.plan_status == SETTLEMENT_AUTHORIZED; else ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED"
          - "plan.amendment_scope IN {LUMP_SUM_ONLY, BOTH}; else ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED"
          - "the logical clock >= opens_at AND the logical clock < closes_at; else ERR_WINDOW_STATE_INVALID"
          - "closes_at minus the logical clock >= NOTICE_PERIOD_DAYS (30) days; else ERR_NOTICE_PERIOD_TOO_SHORT"
        side_effects:
          - "set opened_at to the logical clock"
          - "notice fan-out: for every ParticipantRecord with plan_id == window.plan_id AND participant_status == IN_PLAN AND mortality_status == ALIVE_CONFIRMED AND address_status == CONFIRMED AND notice_estimated_lump_sum_cents <= eligibility_max_lump_sum_cents, create one ParticipantElection in NOTICE_SENT with notice_sent_at = the logical clock and notice_estimated_lump_sum_cents from calculations.lump_sum_present_value step 1; participants failing any predicate are skipped silently"
          - "set notice_count to the number of elections created"
          - "increments LumpSumWindow.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /prt/lump-sum-windows/{id}/closing"
        actor: PlanAdministrator
        preconditions:
          - "window_status == OPEN"
          - "the logical clock >= closes_at; else ERR_WINDOW_STATE_INVALID"
        side_effects:
          - "cascade: every ParticipantElection of this window with election_status == NOTICE_SENT transitions to DEFAULTED_NO_RESPONSE"
          - "run calculations.window_cap_waterfall: elections with election_status == ELECTED_LUMP_SUM are visited in elected_at ASC, tie-broken by participant.created_at ASC; each election whose net_lump_sum_cents would push the running total above lump_sum_cap_cents transitions to CAP_DEFERRED and the walk CONTINUES to the next election"
          - "set approved_lump_sum_total_cents to the running total"
          - "set closed_at to the logical clock"
          - "increments LumpSumWindow.version by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /prt/lump-sum-windows/{id}/settlement"
        actor: PlanSponsor
        preconditions:
          - "window_status == CLOSED"
          - "cap re-verification: re-run calculations.lump_sum_present_value for every ParticipantElection of this window with election_status == ELECTED_LUMP_SUM using each participant's CURRENT audited_monthly_benefit_cents, and require the resulting total <= lump_sum_cap_cents; else ERR_WINDOW_CAP_EXCEEDED (a benefit correction recorded after the window closed can lift an elected participant's net lump sum above the total the waterfall approved at closing)"
          - "plan.plan_assets_cents >= approved_lump_sum_total_cents; else ERR_PLAN_ASSETS_INSUFFICIENT"
        side_effects:
          - "cascade hop 1: every ParticipantElection of this window with election_status == ELECTED_LUMP_SUM transitions to PAID with paid_at = the logical clock and paid_amount_cents = net_lump_sum_cents"
          - "cascade hop 2: because those elections became PAID, each corresponding ParticipantRecord transitions IN_PLAN -> SETTLED_LUMP_SUM and its tranche_id is cleared"
          - "cascade hop 3: because those participants left {IN_PLAN, ASSIGNED}, plan.total_liability_cents is reduced by the sum of their accounting_liability_cents, plan.plan_assets_cents is reduced by paid_lump_sum_total_cents, and plan.participant_liability_total_cents and plan.accounting_funded_status_bp are recomputed"
          - "cascade hop 4: because plan.total_liability_cents changed and every window and tranche of the plan is now terminal, the plan auto-transitions SETTLEMENT_AUTHORIZED -> RESIDUAL when that transition's preconditions hold"
          - "append one SettlementEntry with entry_type = LUMP_SUM_RECOGNITION, window_id set, amount_cents = paid_lump_sum_total_cents minus pbo_settled_cents, pbo_settled_cents = sum of the paid participants' accounting_liability_cents, deferred_amount_cents = 0"
          - "set paid_lump_sum_total_cents, settled_at, and increments LumpSumWindow.version by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "system, cascaded from PensionPlan SETTLEMENT_AUTHORIZED -> ONGOING (amendment rescission)"
        actor: system
        preconditions:
          - "window_status == PLANNED"
        side_effects:
          - "increments LumpSumWindow.version by 1"

  - entity: ParticipantElection
    state_field: election_status
    initial_state: NOTICE_SENT
    terminal_states: [PAID, CAP_DEFERRED, DEFAULTED_NO_RESPONSE, VOIDED]
    transitions:
      - from: NOTICE_SENT
        to: ELECTED_LUMP_SUM
        trigger: "POST /prt/elections/{id}/election with election_choice=LUMP_SUM"
        actor: Participant
        preconditions:
          - "election_status == NOTICE_SENT"
          - "window.window_status == OPEN; else ERR_WINDOW_NOT_OPEN"
          - "the logical clock < window.closes_at; else ERR_WINDOW_NOT_OPEN"
          - "participant.mortality_status == ALIVE_CONFIRMED; else ERR_MORTALITY_NOT_CONFIRMED"
          - "participant.benefit_audit_status IN {PASSED_CLOSED, CORRECTED}; else ERR_PARTICIPANT_DATA_NOT_CLEAN"
        side_effects:
          - "set elected_at to the logical clock and election_choice"
          - "run calculations.lump_sum_present_value and store raw_pv_cents, admin_fee_bp, admin_fee_cents, net_lump_sum_cents"
          - "increments ParticipantElection.version by 1"
      - from: NOTICE_SENT
        to: ELECTED_ANNUITY
        trigger: "POST /prt/elections/{id}/election with election_choice=ANNUITY"
        actor: Participant
        preconditions:
          - "election_status == NOTICE_SENT"
          - "window.window_status == OPEN; else ERR_WINDOW_NOT_OPEN"
          - "the logical clock < window.closes_at; else ERR_WINDOW_NOT_OPEN"
          - "participant.mortality_status == ALIVE_CONFIRMED; else ERR_MORTALITY_NOT_CONFIRMED"
          - "participant.benefit_audit_status IN {PASSED_CLOSED, CORRECTED}; else ERR_PARTICIPANT_DATA_NOT_CLEAN"
        side_effects:
          - "set elected_at to the logical clock and election_choice; raw_pv_cents, admin_fee_bp, admin_fee_cents and net_lump_sum_cents remain null"
          - "increments ParticipantElection.version by 1"
        note: "an annuity election keeps the participant in the plan; it is terminal for the election but not for the participant"
      - from: ELECTED_LUMP_SUM
        to: NOTICE_SENT
        trigger: "POST /prt/elections/{id}/revocation"
        actor: Participant
        preconditions:
          - "election_status IN {ELECTED_LUMP_SUM, ELECTED_ANNUITY}"
          - "window.window_status == OPEN; else ERR_WINDOW_NOT_OPEN"
          - "the logical clock <= elected_at + REVOCATION_PERIOD_DAYS (7) days AND the logical clock < window.closes_at; else ERR_REVOCATION_PERIOD_ELAPSED"
          - "revocation_count < REVOCATION_MAX (1); else ERR_ELECTION_STATE_INVALID"
        side_effects:
          - "clear elected_at, election_choice, raw_pv_cents, admin_fee_bp, admin_fee_cents and net_lump_sum_cents"
          - "increment revocation_count by 1"
          - "increments ParticipantElection.version by 1"
        note: "revocation cycle NOTICE_SENT -> ELECTED_* -> NOTICE_SENT, bounded at REVOCATION_MAX"
      - from: ELECTED_ANNUITY
        to: NOTICE_SENT
        trigger: "POST /prt/elections/{id}/revocation"
        actor: Participant
        preconditions:
          - "identical to the ELECTED_LUMP_SUM -> NOTICE_SENT preconditions"
        side_effects:
          - "identical to the ELECTED_LUMP_SUM -> NOTICE_SENT side-effect set"
      - from: NOTICE_SENT
        to: DEFAULTED_NO_RESPONSE
        trigger: "system, cascaded from LumpSumWindow OPEN -> CLOSED"
        actor: system
        preconditions:
          - "election_status == NOTICE_SENT"
        side_effects:
          - "increments ParticipantElection.version by 1"
      - from: ELECTED_LUMP_SUM
        to: CAP_DEFERRED
        trigger: "system, evaluated by calculations.window_cap_waterfall inside LumpSumWindow OPEN -> CLOSED"
        actor: system
        preconditions:
          - "election_status == ELECTED_LUMP_SUM"
          - "the running honoured total plus net_lump_sum_cents > window.lump_sum_cap_cents"
        side_effects:
          - "increments ParticipantElection.version by 1"
      - from: ELECTED_LUMP_SUM
        to: PAID
        trigger: "system, cascaded from LumpSumWindow CLOSED -> SETTLED"
        actor: system
        preconditions:
          - "election_status == ELECTED_LUMP_SUM"
        side_effects:
          - "set paid_at and paid_amount_cents = net_lump_sum_cents"
          - "increments ParticipantElection.version by 1"
      - from: NOTICE_SENT
        to: VOIDED
        trigger: "system, cascaded from ParticipantRecord mortality_status -> DECEASED_CONFIRMED"
        actor: system
        preconditions:
          - "election_status IN {NOTICE_SENT, ELECTED_LUMP_SUM, ELECTED_ANNUITY}"
        side_effects:
          - "increments ParticipantElection.version by 1"
      - from: ELECTED_LUMP_SUM
        to: VOIDED
        trigger: "system, cascaded from ParticipantRecord mortality_status -> DECEASED_CONFIRMED"
        actor: system
        preconditions:
          - "election_status IN {NOTICE_SENT, ELECTED_LUMP_SUM, ELECTED_ANNUITY}"
        side_effects:
          - "increments ParticipantElection.version by 1"

  - entity: BuyoutTranche
    state_field: tranche_status
    initial_state: DRAFT
    terminal_states: [SETTLED, ABANDONED]
    transitions:
      - from: DRAFT
        to: QUOTING
        trigger: "POST /prt/tranches/{id}/quoting"
        actor: PlanFiduciary
        preconditions:
          - "tranche_status == DRAFT"
          - "plan.plan_status == SETTLEMENT_AUTHORIZED; else ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED"
          - "plan.amendment_scope IN {BUYOUT_ONLY, BOTH}; else ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED"
          - "assigned_participant_count >= 1; else ERR_TRANCHE_EMPTY"
          - "every assigned ParticipantRecord has mortality_status == ALIVE_CONFIRMED; else ERR_MORTALITY_NOT_CONFIRMED"
          - "every assigned ParticipantRecord has data_status == CLEAN; else ERR_PARTICIPANT_DATA_NOT_CLEAN"
          - "at least one IndependentExpert of this plan has expert_status IN {ENGAGED, OPINION_ISSUED}; else ERR_EXPERT_STATE_INVALID"
        side_effects:
          - "recompute accounting_liability_cents and settlement_liability_cents by calculations.tranche_liability over the assigned set"
          - "set data_readiness_flag = READY"
          - "increments BuyoutTranche.version by 1"
      - from: QUOTING
        to: INSURER_SELECTED
        trigger: "POST /prt/tranches/{id}/insurer-selection"
        actor: PlanFiduciary
        preconditions:
          - "tranche_status == QUOTING"
          - "at least one IndependentExpert of this plan has expert_status == OPINION_ISSUED AND safest_available_opinion == AFFIRMATIVE; else ERR_EXPERT_OPINION_REQUIRED"
          - "every assigned ParticipantRecord has benefit_audit_status IN {PASSED_CLOSED, CORRECTED}; else ERR_PARTICIPANT_DATA_NOT_CLEAN"
          - "the candidate pool defined by calculations.insurer_safest_available_score is non-empty; else ERR_NO_ELIGIBLE_QUOTE"
        side_effects:
          - "set selection_basis from the payload, then run calculations.insurer_safest_available_score and store composite_score_bp on every candidate quote"
          - "set selected_quote_id, selected_insurer_id and selection_score_bp from the winner"
          - "the winning AnnuityQuote transitions SUBMITTED -> SHORTLISTED"
          - "every other AnnuityQuote of this tranche with quote_status == SUBMITTED transitions to DECLINED"
          - "increments BuyoutTranche.version by 1"
      - from: INSURER_SELECTED
        to: PRICING_LOCKED
        trigger: "POST /prt/tranches/{id}/pricing-lock"
        actor: PlanFiduciary
        preconditions:
          - "tranche_status == INSURER_SELECTED; else ERR_TRANCHE_NOT_SELECTED"
          - "the selected AnnuityQuote's expires_at > the logical clock; else ERR_QUOTE_EXPIRED"
          - "RATING_POINTS[selected insurer's rating_grade] >= SAFEST_AVAILABLE_MIN_RATING_POINTS (78); else ERR_INSURER_RATING_BELOW_FLOOR"
          - "the selected quote's premium_cents <= insurer.capacity_cents minus calculations.insurer_committed_capacity evaluated over the candidate closed interval [logical clock, logical clock + quote.lock_days days]; else ERR_INSURER_CAPACITY_EXCEEDED"
        side_effects:
          - "set locked_premium_cents = selected quote's premium_cents, lock_start_at = the logical clock, lock_expires_at = lock_start_at + quote.lock_days days"
          - "the selected AnnuityQuote transitions SHORTLISTED -> LOCKED"
          - "recompute insurer.committed_capacity_cents and insurer.available_capacity_cents"
          - "increments BuyoutTranche.version by 1"
      - from: INSURER_SELECTED
        to: QUOTING
        trigger: "system, cascaded from POST /prt/insurers/{id}/rating-changes when the new rating falls below the safest-available floor"
        actor: system
        preconditions:
          - "tranche_status == INSURER_SELECTED"
          - "the tranche's selected AnnuityQuote transitioned SUBMITTED-or-SHORTLISTED -> INELIGIBLE in the same cascade"
        side_effects:
          - "clear selected_quote_id, selected_insurer_id, selection_score_bp and selection_basis"
          - "cascade: because the tranche left INSURER_SELECTED, every assigned ParticipantRecord has data_readiness recomputed and the tranche's data_readiness_flag is set to BLOCKED"
          - "increments BuyoutTranche.version by 1"
        note: "selection-reset cycle QUOTING -> INSURER_SELECTED -> QUOTING"
      - from: PRICING_LOCKED
        to: ASSETS_TRANSFERRED
        trigger: "system, cascaded from AssetTransfer INITIATED -> SETTLED"
        actor: system
        preconditions:
          - "tranche_status == PRICING_LOCKED"
        side_effects:
          - "set transfer_expense_cents from the settled AssetTransfer"
          - "increments BuyoutTranche.version by 1"
      - from: ASSETS_TRANSFERRED
        to: SETTLED
        trigger: "POST /prt/tranches/{id}/settlement"
        actor: PlanSponsor
        preconditions:
          - "tranche_status == ASSETS_TRANSFERRED; else ERR_TRANCHE_NOT_TRANSFERRED"
        side_effects:
          - "run calculations.settlement_recognition and store settlement_gain_loss_cents"
          - "append one SettlementEntry with entry_type = BUYOUT_RECOGNITION, tranche_id set, amount_cents = recognised charge, deferred_amount_cents = deferred charge, gain_loss_cents and pbo_settled_cents populated"
          - "cascade hop 1: plan.cumulative_settlement_charge_cents increases by the entry's amount_cents and plan.deferred_settlement_charge_cents by its deferred_amount_cents"
          - "cascade hop 2: because the tranche settled, every assigned ParticipantRecord transitions ASSIGNED -> TRANSFERRED_TO_INSURER"
          - "cascade hop 3: because those participants left {IN_PLAN, ASSIGNED}, plan.total_liability_cents is reduced by accounting_liability_cents, plan.plan_assets_cents is reduced by the settled AssetTransfer's gross_value_cents, and plan.participant_liability_total_cents and plan.accounting_funded_status_bp are recomputed"
          - "cascade hop 4: because plan.total_liability_cents changed and every window and tranche of the plan is now terminal, the plan auto-transitions SETTLEMENT_AUTHORIZED -> RESIDUAL when that transition's preconditions hold"
          - "the selected AnnuityQuote transitions LOCKED -> BOUND"
          - "set settled_at and increments BuyoutTranche.version by 1"
      - from: PRICING_LOCKED
        to: ABANDONED
        trigger: "POST /prt/tranches/{id}/abandonment"
        actor: PlanFiduciary
        preconditions:
          - "tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED, PRICING_LOCKED}; else ERR_TRANCHE_STATE_INVALID"
        side_effects:
          - "compensation: if locked_premium_cents is set, the selected AnnuityQuote transitions LOCKED -> EXPIRED and insurer.committed_capacity_cents / insurer.available_capacity_cents are recomputed, restoring insurer.capacity_cents == committed + available at its pre-lock values"
          - "compensation: every AnnuityQuote of this tranche with quote_status IN {REQUESTED, SUBMITTED, SHORTLISTED} transitions to EXPIRED"
          - "compensation: every assigned ParticipantRecord transitions ASSIGNED -> IN_PLAN with tranche_id cleared"
          - "clear selected_quote_id, selected_insurer_id, selection_score_bp, locked_premium_cents, lock_start_at, lock_expires_at"
          - "set abandoned_at and abandonment_reason; increments BuyoutTranche.version by 1"
        note: "plan.total_liability_cents is never touched by abandonment because it is only reduced at settlement"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /prt/tranches/{id}/abandonment, or system cascade from PensionPlan SETTLEMENT_AUTHORIZED -> ONGOING"
        actor: PlanFiduciary
        preconditions:
          - "tranche_status == DRAFT"
        side_effects:
          - "identical to the PRICING_LOCKED -> ABANDONED compensation set, restricted to the effects that apply (participant unassignment only)"

  - entity: AnnuityQuote
    state_field: quote_status
    initial_state: REQUESTED
    terminal_states: [BOUND, DECLINED, INELIGIBLE, EXPIRED]
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /prt/quotes/{id}/submission with submission_decision=SUBMIT"
        actor: InsurerRep
        preconditions:
          - "quote_status == REQUESTED; else ERR_QUOTE_NOT_REQUESTED when the quote is still live (SUBMITTED, SHORTLISTED or LOCKED) and ERR_QUOTE_STATE_INVALID when it has already reached a terminal status (DECLINED, INELIGIBLE, EXPIRED, BOUND)"
          - "X-User-ID == insurer_id; else ERR_IDENTITY_MISMATCH"
          - "premium_cents, lock_days and quote_valid_days present; else ERR_INVALID_REQUEST"
        side_effects:
          - "set premium_cents, lock_days, quote_valid_days, submitted_at = the logical clock, expires_at = submitted_at + quote_valid_days days, rating_at_submission = insurer.rating_grade"
          - "increments AnnuityQuote.version by 1"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /prt/quotes/{id}/submission with submission_decision=DECLINE"
        actor: InsurerRep
        preconditions:
          - "quote_status == REQUESTED; else ERR_QUOTE_NOT_REQUESTED when the quote is still live (SUBMITTED, SHORTLISTED or LOCKED) and ERR_QUOTE_STATE_INVALID when it has already reached a terminal status (DECLINED, INELIGIBLE, EXPIRED, BOUND)"
          - "X-User-ID == insurer_id; else ERR_IDENTITY_MISMATCH"
          - "decline_reason present and non-empty; else ERR_INVALID_REQUEST"
        side_effects:
          - "set decline_reason; increments AnnuityQuote.version by 1"
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "system, cascaded from BuyoutTranche QUOTING -> INSURER_SELECTED for the winning quote"
        actor: system
        preconditions:
          - "quote_status == SUBMITTED"
        side_effects:
          - "set composite_score_bp; increments AnnuityQuote.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "system, cascaded from BuyoutTranche QUOTING -> INSURER_SELECTED for every losing quote"
        actor: system
        preconditions:
          - "quote_status == SUBMITTED"
        side_effects:
          - "set composite_score_bp when the quote was in the candidate pool; increments AnnuityQuote.version by 1"
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "system, cascaded from POST /prt/insurers/{id}/rating-changes"
        actor: system
        preconditions:
          - "quote_status IN {SUBMITTED, SHORTLISTED}"
          - "RATING_POINTS[new rating_grade] < SAFEST_AVAILABLE_MIN_RATING_POINTS (78)"
        side_effects:
          - "increments AnnuityQuote.version by 1"
      - from: SHORTLISTED
        to: INELIGIBLE
        trigger: "system, cascaded from POST /prt/insurers/{id}/rating-changes"
        actor: system
        preconditions:
          - "quote_status == SHORTLISTED"
          - "RATING_POINTS[new rating_grade] < SAFEST_AVAILABLE_MIN_RATING_POINTS (78)"
        side_effects:
          - "cascade: because this quote became INELIGIBLE, its tranche transitions INSURER_SELECTED -> QUOTING"
          - "increments AnnuityQuote.version by 1"
      - from: SHORTLISTED
        to: LOCKED
        trigger: "system, cascaded from BuyoutTranche INSURER_SELECTED -> PRICING_LOCKED"
        actor: system
        preconditions:
          - "quote_status == SHORTLISTED"
        side_effects:
          - "increments AnnuityQuote.version by 1"
      - from: LOCKED
        to: BOUND
        trigger: "system, cascaded from BuyoutTranche ASSETS_TRANSFERRED -> SETTLED"
        actor: system
        preconditions:
          - "quote_status == LOCKED"
        side_effects:
          - "increments AnnuityQuote.version by 1"
      - from: LOCKED
        to: EXPIRED
        trigger: "system, cascaded from BuyoutTranche -> ABANDONED"
        actor: system
        preconditions:
          - "quote_status IN {REQUESTED, SUBMITTED, SHORTLISTED, LOCKED}"
        side_effects:
          - "increments AnnuityQuote.version by 1"

  - entity: IndependentExpert
    state_field: expert_status
    initial_state: INDEPENDENCE_REVIEW
    terminal_states: [DISQUALIFIED, OPINION_ISSUED]
    transitions:
      - from: INDEPENDENCE_REVIEW
        to: ENGAGED
        trigger: "POST /prt/independent-experts/{id}/independence-review with review_decision=ENGAGE"
        actor: PlanFiduciary
        preconditions:
          - "expert_status == INDEPENDENCE_REVIEW; else ERR_EXPERT_STATE_INVALID"
          - "conflict_disclosed == false; else ERR_EXPERT_CONFLICT_DISCLOSED"
          - "X-User-ID != proposed_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set reviewed_by_user_id; increments IndependentExpert.version by 1"
      - from: INDEPENDENCE_REVIEW
        to: DISQUALIFIED
        trigger: "POST /prt/independent-experts/{id}/independence-review with review_decision=DISQUALIFY"
        actor: PlanFiduciary
        preconditions:
          - "expert_status == INDEPENDENCE_REVIEW; else ERR_EXPERT_STATE_INVALID"
          - "X-User-ID != proposed_by_user_id; else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set reviewed_by_user_id; increments IndependentExpert.version by 1"
      - from: ENGAGED
        to: OPINION_ISSUED
        trigger: "POST /prt/independent-experts/{id}/opinion"
        actor: IndependentExpertUser
        preconditions:
          - "expert_status == ENGAGED; else ERR_EXPERT_NOT_ENGAGED"
          - "X-User-ID == this expert's id; else ERR_IDENTITY_MISMATCH"
        side_effects:
          - "set safest_available_opinion and opinion_issued_at; increments IndependentExpert.version by 1"

  - entity: AssetTransfer
    state_field: transfer_status
    initial_state: INITIATED
    terminal_states: [SETTLED, REJECTED, SUPERSEDED]
    transitions:
      - from: INITIATED
        to: SETTLED
        trigger: "POST /prt/asset-transfers/{id}/insurer-review with insurer_decision=ACCEPT"
        actor: InsurerRep
        preconditions:
          - "transfer_status == INITIATED; else ERR_TRANSFER_NOT_INITIATED when the transfer was already answered (SETTLED or REJECTED) and ERR_TRANSFER_STATE_INVALID when it was SUPERSEDED by a later delivery"
          - "X-User-ID == tranche.selected_insurer_id; else ERR_IDENTITY_MISMATCH"
          - "the logical clock <= tranche.lock_expires_at; else ERR_QUOTE_EXPIRED"
        side_effects:
          - "set settled_at to the logical clock"
          - "cascade: because this transfer settled, tranche transitions PRICING_LOCKED -> ASSETS_TRANSFERRED and tranche.transfer_expense_cents is set to this transfer's transfer_expense_cents"
          - "increments AssetTransfer.version by 1"
      - from: INITIATED
        to: REJECTED
        trigger: "POST /prt/asset-transfers/{id}/insurer-review with insurer_decision=REJECT"
        actor: InsurerRep
        preconditions:
          - "transfer_status == INITIATED; else ERR_TRANSFER_NOT_INITIATED when the transfer was already answered (SETTLED or REJECTED) and ERR_TRANSFER_STATE_INVALID when it was SUPERSEDED by a later delivery"
          - "X-User-ID == tranche.selected_insurer_id; else ERR_IDENTITY_MISMATCH"
          - "rejection_reason present and non-empty; else ERR_INVALID_REQUEST"
        side_effects:
          - "set rejection_reason; the tranche remains PRICING_LOCKED so the sponsor may initiate a replacement transfer"
          - "increments AssetTransfer.version by 1"
        note: "divergent branch: ACCEPT advances the tranche, REJECT leaves the tranche untouched and consumes no capacity"
      - from: INITIATED
        to: SUPERSEDED
        trigger: "system, evaluated inside POST /prt/tranches/{id}/asset-transfers before the new transfer is created"
        actor: system
        preconditions:
          - "transfer_status == INITIATED"
        side_effects:
          - "increments AssetTransfer.version by 1"
        note: "create-with-supersede pattern guarded by the concurrency rule asset-transfer-create-stale-tranche"

  - entity: ParticipantComplaint
    state_field: complaint_status
    initial_state: OPEN
    terminal_states: [CLOSED_FINAL]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /prt/complaints/{id}/triage"
        actor: PlanAdministrator
        preconditions:
          - "complaint_status IN {OPEN, RESOLVED}; else ERR_COMPLAINT_NOT_TRIAGED"
          - "when complaint_category == BENEFIT_AMOUNT and the participant's latest non-SUPERSEDED BenefitAudit has abs(variance_cents) > AUDIT_VARIANCE_TOLERANCE_CENTS, responsibility_determination MUST be SPONSOR_RESPONSIBLE; else ERR_INVALID_REQUEST"
        side_effects:
          - "set responsibility_determination and determination_rationale; increment triage_count by 1"
          - "cascade hop 1: when responsibility_determination == SPONSOR_RESPONSIBLE, the participant's latest non-SUPERSEDED BenefitAudit (selected by audit_sequence DESC) transitions to REOPENED with reopened_by_complaint_id set"
          - "cascade hop 2: because that audit reopened, participant.benefit_audit_status becomes REOPENED and participant.data_confidence_score / data_status are recomputed"
          - "cascade hop 3: because the participant's data_confidence_score dropped below DATA_CONFIDENCE_CLEAN_MIN, if participant.tranche_id is set and the tranche's tranche_status IN {DRAFT, QUOTING, INSURER_SELECTED} then tranche.data_readiness_flag is set to BLOCKED"
          - "increments ParticipantComplaint.version by 1"
      - from: RESOLVED
        to: TRIAGED
        trigger: "POST /prt/complaints/{id}/triage (re-triage after resolution)"
        actor: PlanAdministrator
        preconditions:
          - "complaint_status == RESOLVED"
          - "the payload responsibility_determination differs from the stored responsibility_determination; else ERR_COMPLAINT_STATE_INVALID"
        side_effects:
          - "compensation: when the stored responsibility_determination == SPONSOR_RESPONSIBLE, remediation_amount_cents > 0 and the new determination == NO_ERROR, append one SettlementEntry with entry_type = REMEDIATION_REVERSAL and amount_cents = negative of remediation_amount_cents, set reversed_amount_cents = remediation_amount_cents, decrease plan.cumulative_settlement_charge_cents by remediation_amount_cents and increase plan.plan_assets_cents by remediation_amount_cents, then recompute plan.accounting_funded_status_bp"
          - "set responsibility_determination and determination_rationale; increment triage_count by 1; clear resolved_at"
          - "increments ParticipantComplaint.version by 1"
        note: "re-triage cycle TRIAGED -> RESOLVED -> TRIAGED; this is the compensating action of compensating_invariant / complaint_retriage_reverses_remediation_ledger"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /prt/complaints/{id}/resolution"
        actor: PlanAdministrator
        preconditions:
          - "complaint_status == TRIAGED; else ERR_COMPLAINT_NOT_TRIAGED"
          - "participant.benefit_audit_status != REOPENED; else ERR_AUDIT_STATE_INVALID"
          - "when responsibility_determination == SPONSOR_RESPONSIBLE, remediation_amount_cents >= 1; when responsibility_determination IN {INSURER_RESPONSIBLE, NO_ERROR}, remediation_amount_cents == 0; else ERR_INVALID_AMOUNT"
          - "when responsibility_determination == SPONSOR_RESPONSIBLE, plan.plan_assets_cents >= remediation_amount_cents; else ERR_PLAN_ASSETS_INSUFFICIENT"
        side_effects:
          - "set remediation_amount_cents and resolved_at"
          - "when responsibility_determination == SPONSOR_RESPONSIBLE, append one SettlementEntry with entry_type = REMEDIATION, amount_cents = remediation_amount_cents, increase plan.cumulative_settlement_charge_cents by that amount, decrease plan.plan_assets_cents by that amount and recompute plan.accounting_funded_status_bp"
          - "increments ParticipantComplaint.version by 1"
      - from: RESOLVED
        to: CLOSED_FINAL
        trigger: "system, cascaded from PensionPlan TERMINATION_FILED -> TERMINATED"
        actor: system
        preconditions:
          - "complaint_status == RESOLVED"
        side_effects:
          - "increments ParticipantComplaint.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
#        write-write conflict mechanism; all other conflicts are state
#        preconditions declared in 1.2 / 1.4)
# =============================================================================

concurrency_rules:
  - rule_id: valuation-update-stale-plan
    parent_entity: PensionPlan
    write_endpoint: "POST /prt/plans/{id}/valuation-updates"
    occ_field: "expected_plan_version"
    description: |
      Recording an actuarial valuation update against a PensionPlan whose
      version has advanced since the client last observed it is rejected. A
      valuation update legitimately supersedes the prior measurement, so a
      writer holding a stale view would silently overwrite liability, asset and
      discount-rate figures produced by an intervening update or by a settlement
      cascade. The stale-version check makes that overwrite observable instead.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: asset-transfer-create-stale-tranche
    parent_entity: BuyoutTranche
    write_endpoint: "POST /prt/tranches/{id}/asset-transfers"
    occ_field: "expected_tranche_version"
    description: |
      Creating an AssetTransfer against a BuyoutTranche whose version has
      advanced since the client last observed it is rejected. A new transfer
      legitimately supersedes any prior INITIATED transfer on the same tranche,
      so a writer working from a stale tranche view would supersede a
      composition it never saw and fund against an out-of-date
      locked_premium_cents.
    error_id: ERR_STALE_TRANCHE_VERSION
    http_status: 412

  - rule_id: benefit-audit-create-stale-participant
    parent_entity: ParticipantRecord
    write_endpoint: "POST /prt/participants/{id}/benefit-audits"
    occ_field: "expected_participant_version"
    description: |
      Opening a BenefitAudit against a ParticipantRecord whose version has
      advanced since the client last observed it is rejected. A new audit
      legitimately supersedes every prior audit of that participant, so a writer
      holding a stale participant view would supersede an audit produced from
      corrected earnings or service data and recompute the variance against
      figures that have already changed.
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
# GLOBAL ARITHMETIC CONTRACT (applies to every rule below)
#   * All money is integer cents. All rates are integer basis points (bp).
#   * round_half_up(n, d) = (n * 2 + d) // (2 * d) for n >= 0 and d > 0, i.e.
#     exact halves round away from zero. No floating point anywhere.
#   * Basis-point application is round_half_up(amount * bp, 10000).
#   * Division by zero never occurs: every rule below pins its zero-denominator
#     fallback explicitly.
# =============================================================================

calculations:
  - name: participant_accounting_liability
    algorithm_type: aggregation
    description: |
      Per-participant projected benefit obligation on the ACCOUNTING basis.
      Stored on ParticipantRecord.accounting_liability_cents and re-derived
      whenever audited_monthly_benefit_cents, cohort or mortality_status change.
    input_set: "the single ParticipantRecord being measured"
    formula: |
      effective_monthly_cents =
        audited_monthly_benefit_cents if audited_monthly_benefit_cents is not null
        else stated_monthly_benefit_cents
      if mortality_status == DECEASED_CONFIRMED: return 0
      annual_cents = effective_monthly_cents * 12
      factor_bp    = ACCOUNTING_FACTOR_BP[cohort]
      accounting_liability_cents = round_half_up(annual_cents * factor_bp, 10000)
    constants:
      ACCOUNTING_FACTOR_BP: "{ RETIREE_IN_PAY: 118000, DEFERRED_VESTED: 95500 }"
    precision: "integer cents, round_half_up"
    worked_example: |
      RETIREE_IN_PAY, effective_monthly_cents = 250001
        annual = 3000012; 3000012 * 118000 = 354001416000
        round_half_up(354001416000, 10000) = 35400142
      DEFERRED_VESTED, effective_monthly_cents = 100000
        annual = 1200000; 1200000 * 95500 = 114600000000 -> 11460000

  - name: participant_settlement_liability
    algorithm_type: aggregation
    description: |
      Per-participant obligation on the SETTLEMENT basis — the insurer-pricing
      view, which loads the accounting factor for insurer profit, adverse
      selection and expenses. Stored on
      ParticipantRecord.settlement_liability_cents.
    input_set: "the single ParticipantRecord being measured"
    formula: |
      effective_monthly_cents = same selection rule as participant_accounting_liability
      if mortality_status == DECEASED_CONFIRMED: return 0
      annual_cents = effective_monthly_cents * 12
      factor_bp    = SETTLEMENT_FACTOR_BP[cohort]
      settlement_liability_cents = round_half_up(annual_cents * factor_bp, 10000)
    constants:
      SETTLEMENT_FACTOR_BP: "{ RETIREE_IN_PAY: 126250, DEFERRED_VESTED: 104500 }"
    precision: "integer cents, round_half_up"
    worked_example: |
      RETIREE_IN_PAY, effective_monthly_cents = 250001
        annual = 3000012; 3000012 * 126250 = 378751515000
        round_half_up(378751515000, 10000): the exact quotient is 37875151.5,
        a true half, so the result is 37875152 (rounds up, never truncates).
      This .5 case is the reason RETIREE_IN_PAY uses 126250 rather than a
      multiple of 1000: it makes the rounding mode observable.

  - name: strategy_projected_settlement_cost
    algorithm_type: aggregation
    description: |
      Projected all-in cost of executing a DeRiskingStrategy, computed on BOTH
      bases at submission time so the fiduciary can see the basis gap. The
      per-participant amount is rounded FIRST and the rounded amounts are then
      summed; summing exact products and rounding once at the end is a different
      number and is explicitly NOT the contract.
    input_set: |
      every ParticipantRecord with plan_id == strategy.plan_id
      AND participant_status IN {IN_PLAN, ASSIGNED}
      AND mortality_status != DECEASED_CONFIRMED
      AND cohort IN STRATEGY_COHORT_MAP[strategy.strategy_type]
      where STRATEGY_COHORT_MAP = {
        LUMP_SUM_WINDOW:          {DEFERRED_VESTED},
        ANNUITY_BUYOUT:           {RETIREE_IN_PAY},
        HYBRID_WINDOW_AND_BUYOUT: {DEFERRED_VESTED, RETIREE_IN_PAY} }
      ordered by created_at ASC (order is irrelevant to the total but pins the
      audit trail); in_scope_participant_count = the size of this set
    formula: |
      STEP 1 (per participant, per basis):
        annual_cents = effective_monthly_cents * 12
        per_participant_cents = round_half_up(annual_cents * factor_bp, 10000)
      STEP 2 (sum of the ROUNDED per-participant amounts):
        base_cents = sum(per_participant_cents over the input set)
        base_cents = 0 when the input set is empty
      STEP 3 (expense load, SETTLEMENT basis only):
        SETTLEMENT: expense_load_cents =
                      round_half_up(base_cents * SETTLEMENT_EXPENSE_LOAD_BP, 10000)
        ACCOUNTING: expense_load_cents = 0
      STEP 4: total_cents = base_cents + expense_load_cents
      STEP 5: projected_basis_gap_cents =
                projected_settlement_cost_cents - projected_accounting_cost_cents
              (may be negative in principle; with these constants it is positive)
    constants:
      ACCOUNTING_FACTOR_BP: "{ RETIREE_IN_PAY: 118000, DEFERRED_VESTED: 95500 }"
      SETTLEMENT_FACTOR_BP: "{ RETIREE_IN_PAY: 126250, DEFERRED_VESTED: 104500 }"
      SETTLEMENT_EXPENSE_LOAD_BP: 350
    variants:
      - variant: ACCOUNTING_BASIS
        applies_when: "always, stored into projected_accounting_cost_cents"
        difference: "factor_bp = ACCOUNTING_FACTOR_BP[cohort]; expense load suppressed (step 3 contributes 0)"
      - variant: SETTLEMENT_BASIS
        applies_when: "always, stored into projected_settlement_cost_cents"
        difference: "factor_bp = SETTLEMENT_FACTOR_BP[cohort]; expense load of 350 bp applied to base_cents in step 3"
    precision: "integer cents, round_half_up, rounded per participant BEFORE summation"
    worked_example: |
      Three RETIREE_IN_PAY participants, effective monthly cents
      [250001, 180003, 99999], strategy_type = ANNUITY_BUYOUT.
      SETTLEMENT basis (factor 126250, i.e. annual x 12.625):
        per participant -> [37875152, 27270455, 15149849]
        base_cents (sum of rounded)   = 80295456
        (sum of exact products = 80295454.5, and rounding that once would give
         80295455 — one cent lower. The contract is 80295456.)
        expense_load = round_half_up(80295456 * 350, 10000) = 2810341
        projected_settlement_cost_cents = 83105797
      ACCOUNTING basis (factor 118000):
        per participant -> [35400142, 25488425, 14159858]
        base_cents = 75048425; expense_load = 0
        projected_accounting_cost_cents = 75048425
      projected_basis_gap_cents = 83105797 - 75048425 = 8057372

  - name: tranche_liability
    algorithm_type: aggregation
    description: |
      Liability carried by a BuyoutTranche on both bases, and the readiness flag
      the QUOTING transition gates on.
    input_set: |
      every ParticipantRecord with tranche_id == tranche.id
      AND participant_status == ASSIGNED
    formula: |
      accounting_liability_cents = sum(participant.accounting_liability_cents)
      settlement_liability_cents = sum(participant.settlement_liability_cents)
      assigned_participant_count = size of the input set
      data_readiness_flag =
        BLOCKED  if the set is empty
        BLOCKED  if any participant has data_status != CLEAN
        BLOCKED  if any participant has mortality_status != ALIVE_CONFIRMED
        BLOCKED  if any participant has benefit_audit_status NOT IN {PASSED_CLOSED, CORRECTED}
        READY    otherwise
      Both sums are 0 when the set is empty.
    constants: {}
    precision: "integer cents; no further rounding — the per-participant amounts are already rounded"

  - name: benefit_recomputation
    algorithm_type: threshold
    description: |
      Independent recomputation of a participant's monthly benefit from final
      average monthly earnings and credited service, and the variance fork that
      decides whether the audit passes or demands a correction.
    input_set: "the ParticipantRecord named in POST /prt/participants/{id}/benefit-audits"
    formula: |
      capped_service_months = min(credited_service_months, MAX_CREDITED_SERVICE_MONTHS)
      recomputed_monthly_benefit_cents =
        round_half_up(final_average_monthly_earnings_cents
                      * BENEFIT_ACCRUAL_RATE_BP
                      * capped_service_months,
                      10000 * 12)
      variance_cents = stated_monthly_benefit_cents - recomputed_monthly_benefit_cents
      audit_status =
        PASSED               if abs(variance_cents) <= AUDIT_VARIANCE_TOLERANCE_CENTS
        CORRECTION_REQUIRED  otherwise
    constants:
      BENEFIT_ACCRUAL_RATE_BP: 150
      MAX_CREDITED_SERVICE_MONTHS: 420
      AUDIT_VARIANCE_TOLERANCE_CENTS: 500
    precision: "integer cents, round_half_up; the divisor is 120000 = 10000 bp x 12 months"
    worked_example: |
      FAME 500000, service 400  -> round_half_up(500000*150*400, 120000) = 250000
      FAME 250000, service 320  -> 100000
      FAME 250125, service 320  -> 100050
      FAME  50000, service 320  ->  20000
      FAME 400000, service 380  -> 190000
        stated 180000 -> variance -10000, abs > 500  -> CORRECTION_REQUIRED
        stated 189500 -> variance   -500, abs == 500 -> PASSED (inclusive bound)
      service 500 is capped to 420 before the multiply.

  - name: lump_sum_present_value
    algorithm_type: tiered_pricing
    description: |
      Present value of a participant's lump-sum offer and the administrative fee
      deducted from it. The fee tier is selected by the PRE-FEE raw present
      value, never by the post-fee net amount — the two selections differ at the
      tier boundaries, and only the pre-fee selection is correct.
    input_set: "the ParticipantElection being elected, and its ParticipantRecord"
    formula: |
      STEP 1 raw present value:
        effective_monthly_cents = participant's audited_monthly_benefit_cents
                                  if not null else stated_monthly_benefit_cents
        annual_cents = effective_monthly_cents * 12
        raw_pv_cents = round_half_up(annual_cents * LS_FACTOR_BP[cohort], 10000)
      STEP 2 fee tier, keyed on raw_pv_cents (the PRE-fee amount):
        raw_pv_cents <=  2400000                        -> admin_fee_bp = 0
        2400000 < raw_pv_cents <= 12000000              -> admin_fee_bp = 75
        raw_pv_cents > 12000000                         -> admin_fee_bp = 40
        (the ladder is deliberately non-monotonic: the top tier charges a LOWER
         rate, so keying off the net amount can select the 75 bp tier for an
         offer that belongs in the 40 bp tier)
      STEP 3 fee, capped:
        uncapped_fee_cents = round_half_up(raw_pv_cents * admin_fee_bp, 10000)
        admin_fee_cents    = min(uncapped_fee_cents, ADMIN_FEE_CAP_CENTS)
      STEP 4 net:
        net_lump_sum_cents = raw_pv_cents - admin_fee_cents
    constants:
      LS_FACTOR_BP: "{ RETIREE_IN_PAY: 121000, DEFERRED_VESTED: 100000 }"
      ADMIN_FEE_TIER_1_MAX_CENTS: 2400000
      ADMIN_FEE_TIER_2_MAX_CENTS: 12000000
      ADMIN_FEE_TIER_1_BP: 0
      ADMIN_FEE_TIER_2_BP: 75
      ADMIN_FEE_TIER_3_BP: 40
      ADMIN_FEE_CAP_CENTS: 500000
    precision: "integer cents, round_half_up"
    worked_example: |
      DEFERRED_VESTED (LS_FACTOR_BP 100000, so raw_pv = monthly * 120):
        monthly 100000 -> raw_pv 12000000 -> exactly the tier-2 ceiling, which is
          INCLUSIVE -> 75 bp -> fee 90000 -> net 11910000
        monthly 100050 -> raw_pv 12006000 -> above the ceiling -> 40 bp
          -> fee 48024 -> net 11957976
          (keying the tier off the net amount instead would land 11957976 in
           tier 2 and charge 90045, netting 11915955 — wrong by 42021 cents)
        monthly  20000 -> raw_pv  2400000 -> tier-1 ceiling, inclusive -> 0 bp
          -> fee 0 -> net 2400000
      RETIREE_IN_PAY (LS_FACTOR_BP 121000):
        monthly 250000 -> annual 3000000 -> raw_pv 36300000 -> 40 bp
          -> uncapped fee 145200 -> under the cap -> net 36154800
        monthly 900000 -> annual 10800000 -> raw_pv 130680000 -> 40 bp
          -> uncapped fee 522720 -> CAPPED to 500000 -> net 130180000

  - name: window_cap_waterfall
    algorithm_type: waterfall_allocation
    description: |
      Allocation of a LumpSumWindow's cash cap across the participants who
      elected a lump sum. Elections are honoured in chronological election order
      until an election would breach the cap; that election is deferred and the
      walk CONTINUES — it does not stop — so a later, smaller election can still
      be honoured out of the remaining headroom.
    input_set: |
      every ParticipantElection with window_id == window.id
      AND election_status == ELECTED_LUMP_SUM
      ordered by elected_at ASC,
        tie-broken by the election's ParticipantRecord.created_at ASC,
        further tie-broken by the election's own created_at ASC
      (id is never used as an ordering key)
    formula: |
      running_total_cents = 0
      for each election in the ordered input set:
        candidate = running_total_cents + election.net_lump_sum_cents
        if candidate <= window.lump_sum_cap_cents:
            running_total_cents = candidate         # election stays ELECTED_LUMP_SUM
        else:
            election -> CAP_DEFERRED                # SKIP AND CONTINUE
      approved_lump_sum_total_cents = running_total_cents
      An empty input set yields approved_lump_sum_total_cents = 0 and the window
      still closes and still settles.
    constants: {}
    precision: "integer cents; no rounding — net_lump_sum_cents is already rounded"
    worked_example: |
      lump_sum_cap_cents = 20000000, ordered net amounts
      [11910000, 11957976, 2400000]:
        e1: 0 + 11910000 = 11910000 <= 20000000 -> honoured, running 11910000
        e2: 11910000 + 11957976 = 23867976 > 20000000 -> CAP_DEFERRED, running unchanged
        e3: 11910000 + 2400000 = 14310000 <= 20000000 -> honoured, running 14310000
      approved_lump_sum_total_cents = 14310000.
      A stop-at-first-breach implementation would leave e3 deferred and report
      11910000 instead.

  - name: insurer_safest_available_score
    algorithm_type: weighted_scoring
    description: |
      Composite score used to pick the winning AnnuityQuote for a tranche under
      the safest-available-annuity standard. Two weighting variants exist; the
      fiduciary declares which one applies at selection time, and they can
      disagree about the winner on identical data.
    input_set: |
      candidate pool = every AnnuityQuote with tranche_id == tranche.id
        AND quote_status == SUBMITTED
        AND expires_at > the logical clock
        AND RATING_POINTS[quote.rating_at_submission] >= SAFEST_AVAILABLE_MIN_RATING_POINTS
        AND insurer.insurer_status == ACTIVE
      An empty pool is not a zero score: the selection is rejected with
      ERR_NO_ELIGIBLE_QUOTE and no state changes.
    formula: |
      min_premium_cents = min(premium_cents over the candidate pool)
      per candidate quote:
        rating_points  = RATING_POINTS[quote.rating_at_submission]        # 0..100
        capital_points = min(100, insurer.capital_ratio_bp // 100)        # floor div
        price_points   = min_premium_cents * 100 // premium_cents         # floor div, 0..100
        composite_score_bp = rating_points  * W_RATING[variant]
                           + capital_points * W_CAPITAL[variant]
                           + price_points   * W_PRICE[variant]
        (each weight is a percentage, so the product is already in basis points
         of a 0..10000 scale; no rounding is performed and none is needed)
      winner = the candidate with the highest composite_score_bp,
        tie-broken by lower premium_cents,
        then by higher rating_points,
        then by earlier submitted_at,
        then by earlier created_at
      selection_score_bp = the winner's composite_score_bp
    constants:
      RATING_POINTS: "{ AAA: 100, AA_PLUS: 92, AA: 85, AA_MINUS: 78, A_PLUS: 70, A: 60, BBB: 40 }"
      SAFEST_AVAILABLE_MIN_RATING_POINTS: 78
      W_RATING: "{ SAFETY_WEIGHTED: 55, PRICE_WEIGHTED: 25 }"
      W_CAPITAL: "{ SAFETY_WEIGHTED: 25, PRICE_WEIGHTED: 15 }"
      W_PRICE: "{ SAFETY_WEIGHTED: 20, PRICE_WEIGHTED: 60 }"
    variants:
      - variant: SAFETY_WEIGHTED
        applies_when: "the insurer-selection payload sets selection_basis = SAFETY_WEIGHTED"
        difference: "weights (rating 55, capital 25, price 20) — claims-paying strength dominates"
      - variant: PRICE_WEIGHTED
        applies_when: "the insurer-selection payload sets selection_basis = PRICE_WEIGHTED"
        difference: "weights (rating 25, capital 15, price 60) — premium dominates, subject to the same rating floor"
    precision: "integer basis points; floor division on capital_points and price_points, no rounding on the weighted sum"
    worked_example: |
      Three submitted quotes on one tranche:
        A: AA_PLUS  (92), capital 4200 bp -> 42 pts, premium 12500000
        B: AA_MINUS (78), capital 3800 bp -> 38 pts, premium 11800000
        C: AAA     (100), capital 5100 bp -> 51 pts, premium 13400000
      min_premium_cents = 11800000
        price_points: A = 11800000*100//12500000 = 94
                      B = 100
                      C = 11800000*100//13400000 = 88
      SAFETY_WEIGHTED (55/25/20):
        A = 92*55 + 42*25 + 94*20 = 5060 + 1050 + 1880 = 7990
        B = 78*55 + 38*25 + 100*20 = 4290 + 950 + 2000 = 7240
        C = 100*55 + 51*25 + 88*20 = 5500 + 1275 + 1760 = 8535  <- winner C
      PRICE_WEIGHTED (25/15/60):
        A = 92*25 + 42*15 + 94*60 = 2300 + 630 + 5640 = 8570  <- winner A
        B = 78*25 + 38*15 + 100*60 = 1950 + 570 + 6000 = 8520
        C = 100*25 + 51*15 + 88*60 = 2500 + 765 + 5280 = 8545
      Identical data, different variant, different winner — and neither winner is
      simply "cheapest" (B is cheapest and wins under neither basis).

  - name: insurer_committed_capacity
    algorithm_type: interval_merge
    description: |
      Capacity an Insurer has already committed over a candidate lock interval.
      Locks are CLOSED intervals [lock_start_at, lock_expires_at]: two locks that
      merely touch at a single instant DO overlap and their premiums are added
      together. Capacity is an aggregate over all intersecting locks, not a
      pairwise check.
    input_set: |
      every BuyoutTranche T with T.selected_insurer_id == insurer.id
      AND T.tranche_status IN {PRICING_LOCKED, ASSETS_TRANSFERRED, SETTLED}
      AND T.lock_start_at <= candidate_end
      AND T.lock_expires_at >= candidate_start
      (the closed-interval intersection test; T itself is excluded when
       re-evaluating an existing lock)
    formula: |
      committed_capacity_cents = sum(T.locked_premium_cents over the input set)
      available_capacity_cents = insurer.capacity_cents - committed_capacity_cents
      A pricing lock of premium P over [candidate_start, candidate_end] is
      admitted only when P <= available_capacity_cents; otherwise
      ERR_INSURER_CAPACITY_EXCEEDED. An empty input set gives
      committed_capacity_cents = 0 and available_capacity_cents =
      insurer.capacity_cents.
    constants: {}
    precision: "integer cents; day arithmetic is exact whole days on the logical clock"
    worked_example: |
      insurer.capacity_cents = 20000000. Tranche T1 locks 12000000 over
      [2026-09-01T00:00:00Z, 2026-11-30T00:00:00Z] (lock_days = 90).
      Candidate T2 with premium 11800000:
        lock starting 2026-11-30T00:00:00Z -> candidate_start == T1's
          lock_expires_at, so the closed intervals intersect at that instant;
          committed = 12000000, available = 8000000, 11800000 > 8000000
          -> ERR_INSURER_CAPACITY_EXCEEDED
        lock starting 2026-12-01T00:00:00Z -> disjoint; committed = 0,
          available = 20000000 -> admitted

  - name: transfer_credited_value
    algorithm_type: threshold
    description: |
      Value the insurer credits against the locked premium when the sponsor funds
      a tranche, and the frictional expense the plan absorbs. In-kind securities
      suffer a valuation haircut plus a per-lot custody fee; cash suffers only a
      wire fee. The transfer is rejected unless the credited value reaches the
      locked premium.
    input_set: "the AssetTransfer being created, plus its BuyoutTranche"
    formula: |
      IN_KIND:
        haircut_cents        = round_half_up(gross_value_cents * IN_KIND_HAIRCUT_BP, 10000)
        custody_fee_cents    = security_lot_count * PER_LOT_CUSTODY_FEE_CENTS
        transfer_expense_cents = haircut_cents + custody_fee_cents
      CASH:
        wire_fee_cents         = round_half_up(gross_value_cents * CASH_WIRE_FEE_BP, 10000)
        transfer_expense_cents = wire_fee_cents
        security_lot_count is ignored and stored as 0
      BOTH:
        credited_value_cents = gross_value_cents - transfer_expense_cents
        shortfall_cents      = max(0, tranche.locked_premium_cents - credited_value_cents)
        shortfall_cents > 0  -> ERR_TRANSFER_VALUE_SHORTFALL and no AssetTransfer
                                is created
    constants:
      IN_KIND_HAIRCUT_BP: 125
      PER_LOT_CUSTODY_FEE_CENTS: 25000
      CASH_WIRE_FEE_BP: 8
    variants:
      - variant: IN_KIND
        applies_when: "transfer_mode == IN_KIND"
        difference: "125 bp valuation haircut plus 25000 cents per security lot; lot count is load-bearing"
      - variant: CASH
        applies_when: "transfer_mode == CASH"
        difference: "8 bp wire fee only; no haircut, no per-lot component"
    precision: "integer cents, round_half_up"
    worked_example: |
      locked_premium_cents = 11800000.
      IN_KIND, gross 12000000, 2 lots:
        haircut = round_half_up(12000000*125, 10000) = 150000
        custody = 2 * 25000 = 50000; expense = 200000
        credited = 11800000; shortfall = 0 -> accepted, exactly at the line
      IN_KIND, gross 12000000, 3 lots:
        expense = 150000 + 75000 = 225000; credited = 11775000
        shortfall = 25000 -> ERR_TRANSFER_VALUE_SHORTFALL
      CASH, gross 12000000:
        wire fee = round_half_up(12000000*8, 10000) = 9600
        expense = 9600; credited = 11990400; shortfall = 0 -> accepted
      Same gross, same tranche, opposite verdict at 3 lots: the mode is what
      decides.

  - name: settlement_recognition
    algorithm_type: threshold
    description: |
      ASC 715-style settlement accounting. A settlement charge is recognised in
      current-period income only when the total settlement cost EXCEEDS the sum
      of service cost and interest cost; at exact equality the entire charge is
      deferred in AOCI. The recognised charge is the pro-rata share of the
      unrecognised actuarial loss.
    input_set: |
      the BuyoutTranche being settled, its settled AssetTransfer, and its
      PensionPlan measured immediately before the settlement cascade
    formula: |
      pbo_settled_cents = sum over the tranche's ASSIGNED participants of
                          participant.accounting_liability_cents
      settlement_cost_cents = tranche.locked_premium_cents
                            + transfer.transfer_expense_cents
      threshold_cents = plan.service_cost_cents + plan.interest_cost_cents
      gain_loss_cents = settlement_cost_cents - pbo_settled_cents
                        (positive = settlement loss, negative = settlement gain)
      pro_rata_loss_cents =
        0 if plan.total_liability_cents == 0
        else round_half_up(plan.unrecognized_actuarial_loss_cents * pbo_settled_cents,
                           plan.total_liability_cents)
      total_charge_cents = gain_loss_cents + pro_rata_loss_cents
      if settlement_cost_cents > threshold_cents:      # STRICT greater-than
          recognized_amount_cents = total_charge_cents
          deferred_amount_cents   = 0
      else:
          recognized_amount_cents = 0
          deferred_amount_cents   = total_charge_cents
      The SettlementEntry records amount_cents = recognized_amount_cents,
      deferred_amount_cents, gain_loss_cents and pbo_settled_cents.
    constants: {}
    precision: "integer cents, round_half_up; the pro-rata denominator is plan.total_liability_cents"
    worked_example: |
      One DEFERRED_VESTED participant, monthly 100000 ->
        pbo_settled_cents = round_half_up(1200000 * 95500, 10000) = 11460000
      locked_premium 11800000, transfer_expense 200000 ->
        settlement_cost_cents = 12000000
      plan service_cost 3000000, interest_cost 9000000 ->
        threshold_cents = 12000000
      12000000 > 12000000 is FALSE -> everything defers.
        gain_loss_cents = 12000000 - 11460000 = 540000
        pro_rata = round_half_up(4000000 * 11460000, 100000000) = 458400
        total_charge = 998400
        recognized_amount_cents = 0, deferred_amount_cents = 998400
      Raise interest_cost to 9000001 and the threshold becomes 12000001, still
      not crossed. Lower it to 8999999 (threshold 11999999) and
      12000000 > 11999999 -> recognized 998400, deferred 0.

  - name: data_confidence_score
    algorithm_type: aggregation
    description: |
      Participant data-cleansing quality score, deducted from a perfect 100 for
      each unresolved defect. Drives ParticipantRecord.data_status, which gates
      tranche quoting and lump-sum notice fan-out.
    input_set: "the single ParticipantRecord being scored"
    formula: |
      score = 100
      if address_status == UNCONFIRMED:  score -= DEDUCT_ADDRESS_UNCONFIRMED (40)
      if address_status == UNLOCATABLE:  score -= DEDUCT_ADDRESS_UNLOCATABLE (25)
      if mortality_status IN {UNVERIFIED, DEATH_DISPUTED}:
                                        score -= DEDUCT_MORTALITY_UNVERIFIED (20)
      if benefit_audit_status IN {NOT_AUDITED, AUDIT_OPEN, CORRECTION_REQUIRED, REOPENED}:
                                        score -= DEDUCT_AUDIT_OPEN (15)
      data_confidence_score = max(0, score)
      data_status = CLEAN if data_confidence_score >= DATA_CONFIDENCE_CLEAN_MIN (80)
                    else NEEDS_REVIEW
      Note that UNCONFIRMED (searchable, 40) is penalised MORE heavily than
      UNLOCATABLE (search exhausted, 25): an exhausted search is a documented
      outcome, an un-started one is not. Consequently a participant whose address
      search is exhausted can still reach 75 while one who has never been
      searched sits at 60.
    constants:
      DEDUCT_ADDRESS_UNCONFIRMED: 40
      DEDUCT_ADDRESS_UNLOCATABLE: 25
      DEDUCT_MORTALITY_UNVERIFIED: 20
      DEDUCT_AUDIT_OPEN: 15
      DATA_CONFIDENCE_CLEAN_MIN: 80
    precision: "integer points 0..100"
    worked_example: |
      CONFIRMED + ALIVE_CONFIRMED + PASSED_CLOSED -> 100 -> CLEAN
      CONFIRMED + ALIVE_CONFIRMED + CORRECTION_REQUIRED -> 85 -> CLEAN
      CONFIRMED + UNVERIFIED + PASSED_CLOSED -> 80 -> exactly the bound -> CLEAN
      CONFIRMED + UNVERIFIED + REOPENED -> 65 -> NEEDS_REVIEW
      UNLOCATABLE + ALIVE_CONFIRMED + PASSED_CLOSED -> 75 -> NEEDS_REVIEW
      UNCONFIRMED + UNVERIFIED + NOT_AUDITED -> 25 -> NEEDS_REVIEW

  - name: funded_status_measurement
    algorithm_type: threshold
    description: |
      Funded status of the plan in basis points on both measurement bases, plus
      the settlement-basis liability used to show the sponsor the cost of full
      de-risking. Exposed by GET /prt/plans/{id}/funded-status.
    input_set: "the PensionPlan, and its ParticipantRecord rows with participant_status IN {IN_PLAN, ASSIGNED}"
    formula: |
      accounting_funded_status_bp =
        0 if total_liability_cents == 0
        else round_half_up(plan_assets_cents * 10000, total_liability_cents)
      settlement_basis_liability_cents =
        round_half_up(total_liability_cents * SETTLEMENT_BASIS_UPLIFT_BP, 10000)
      settlement_funded_status_bp =
        0 if settlement_basis_liability_cents == 0
        else round_half_up(plan_assets_cents * 10000, settlement_basis_liability_cents)
      participant_liability_total_cents =
        sum(accounting_liability_cents over the input set), 0 when empty
      unfunded_settlement_gap_cents =
        max(0, settlement_basis_liability_cents - plan_assets_cents)
    constants:
      SETTLEMENT_BASIS_UPLIFT_BP: 10700
    precision: "integer basis points, round_half_up; a zero liability yields 0 bp rather than an error"
    worked_example: |
      plan_assets 92000000, total_liability 100000000:
        accounting_funded_status_bp = round_half_up(920000000000, 100000000) = 9200
        settlement_basis_liability_cents = round_half_up(100000000*10700, 10000)
                                         = 107000000
        settlement_funded_status_bp = round_half_up(920000000000, 107000000) = 8598
        unfunded_settlement_gap_cents = 107000000 - 92000000 = 15000000
      A fully de-risked plan (total_liability 0) reports
      accounting_funded_status_bp = 0 and settlement_funded_status_bp = 0.

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Lower priority number = evaluated first = its error_id wins when several
# checks are violated by the same request. Domain ordering rationale: fiduciary
# safety and participant-protection checks (business_safety) outrank referential
# tidiness, scheduling constraints, quote timing, and money/capacity limits,
# because under ERISA an imprudent purchase is a worse outcome than an
# overspend. Capacity and asset-sufficiency checks are last.
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight roles in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID matches the owning entity of the target resource: InsurerRep's X-User-ID equals quote.insurer_id (quote submission) or tranche.selected_insurer_id (asset-transfer review); Participant's X-User-ID equals election.participant_id (election, revocation) or the participant_id in the path (complaint filing); IndependentExpertUser's X-User-ID equals the IndependentExpert id in the path"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /prt/quotes/{id}/submission, POST /prt/asset-transfers/{id}/insurer-review, POST /prt/elections/{id}/election, POST /prt/elections/{id}/revocation, POST /prt/participants/{id}/complaints, POST /prt/independent-experts/{id}/opinion"

  - priority: 10
    category: existence
    check: "every id in the path exists, validated left to right; the first missing id decides the error (ERR_PLAN_NOT_FOUND, ERR_STRATEGY_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_ELECTION_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_INSURER_NOT_FOUND, ERR_EXPERT_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_SETTLEMENT_ENTRY_NOT_FOUND)"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing an {id} segment"

  - priority: 12
    category: existence
    check: "every id supplied in a request BODY or query filter exists: insurer_id on quote requests, participant_id on tranche participant assignments, plan_id / tranche_id / window_id / participant_id on list filters"
    error_id: ERR_INSURER_NOT_FOUND
    http_status: 404
    applies_to: "POST /prt/tranches/{id}/quotes, POST /prt/tranches/{id}/participant-assignments, and every filtered list endpoint"

  - priority: 20
    category: existence
    check: "request body schema: every required field present, correct JSON type, enum values drawn from the declared set; unknown fields ignored; fields whose source is system or computed are ignored when supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 22
    category: existence
    check: "numeric range constraints hold: money fields >= 0, rate fields inside their declared bounds, credited_service_months 0..600, capital_ratio_bp 0..20000, lock_days 1..180, quote_valid_days 1..90, plan_ein exactly nine digits, remediation_amount_cents consistent with the responsibility determination"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /prt/plans, POST /prt/plans/{id}/participants, POST /prt/insurers, POST /prt/quotes/{id}/submission, POST /prt/participants/{id}/benefit-audits, POST /prt/complaints/{id}/resolution"

  - priority: 24
    category: business_temporal
    check: "declared intervals are well formed and half-open: LumpSumWindow requires opens_at < closes_at; AnnuityQuote requires lock_days >= 1; amendment_effective_date must not precede the logical clock"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /prt/plans/{id}/lump-sum-windows, POST /prt/plans/{id}/settlement-amendment, POST /prt/quotes/{id}/submission"

  - priority: 26
    category: business_temporal
    check: "a LumpSumWindow being opened must leave participants at least NOTICE_PERIOD_DAYS (30) days between the logical clock and closes_at"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /prt/lump-sum-windows/{id}/opening"

  - priority: 30
    category: state
    check: "when the endpoint declares an OCC field, the supplied expected_<parent>_version equals the parent's current version (see 1.2.1): expected_plan_version, expected_tranche_version, expected_participant_version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /prt/plans/{id}/valuation-updates, POST /prt/tranches/{id}/asset-transfers, POST /prt/participants/{id}/benefit-audits"

  - priority: 40
    category: state
    check: "the target resource's own state field permits the requested transition (see 1.2); the entity-specific error is returned — ERR_PLAN_STATE_INVALID, ERR_STRATEGY_STATE_INVALID, ERR_PARTICIPANT_STATE_INVALID, ERR_AUDIT_STATE_INVALID, ERR_WINDOW_STATE_INVALID, ERR_ELECTION_STATE_INVALID, ERR_TRANCHE_STATE_INVALID, ERR_QUOTE_STATE_INVALID, ERR_EXPERT_STATE_INVALID, ERR_TRANSFER_STATE_INVALID, ERR_COMPLAINT_STATE_INVALID"
    error_id: ERR_TRANCHE_STATE_INVALID
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 41
    category: state
    check: "specialised state precondition errors that name the required state rather than the current one: a pricing lock requires tranche_status == INSURER_SELECTED (ERR_TRANCHE_NOT_SELECTED); a tranche settlement requires ASSETS_TRANSFERRED (ERR_TRANCHE_NOT_TRANSFERRED); a quote submission requires quote_status == REQUESTED (ERR_QUOTE_NOT_REQUESTED); an opinion requires expert_status == ENGAGED (ERR_EXPERT_NOT_ENGAGED); an insurer review requires transfer_status == INITIATED (ERR_TRANSFER_NOT_INITIATED); a complaint resolution requires complaint_status == TRIAGED (ERR_COMPLAINT_NOT_TRIAGED); an election or revocation requires window_status == OPEN and the logical clock before closes_at (ERR_WINDOW_NOT_OPEN)"
    error_id: ERR_TRANCHE_NOT_SELECTED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/pricing-lock, POST /prt/tranches/{id}/settlement, POST /prt/quotes/{id}/submission, POST /prt/independent-experts/{id}/opinion, POST /prt/asset-transfers/{id}/insurer-review, POST /prt/complaints/{id}/resolution, POST /prt/elections/{id}/election, POST /prt/elections/{id}/revocation"

  - priority: 42
    category: state
    check: "cross-entity state dependency: the ANCESTOR or peer entity is in the required state even though the target itself is fine — opening a window or starting quoting requires plan_status == SETTLEMENT_AUTHORIZED with a compatible amendment_scope (ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED); adopting a settlement amendment requires an APPROVED DeRiskingStrategy of a compatible strategy_type (ERR_STRATEGY_NOT_APPROVED); resolving a complaint requires the participant's audit not to be REOPENED (ERR_AUDIT_STATE_INVALID); filing for termination requires zero OPEN or TRIAGED complaints (ERR_COMPLAINT_STATE_INVALID)"
    error_id: ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED
    http_status: 409
    applies_to: "POST /prt/lump-sum-windows/{id}/opening, POST /prt/tranches/{id}/quoting, POST /prt/plans/{id}/settlement-amendment, POST /prt/complaints/{id}/resolution, POST /prt/plans/{id}/termination-filing"

  - priority: 45
    category: business_safety
    check: "segregation of duties: the fiduciary deciding a DeRiskingStrategy must not be the user who submitted it, and the fiduciary clearing an IndependentExpert's independence review must not be the user who proposed that expert"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /prt/strategies/{id}/decision, POST /prt/independent-experts/{id}/independence-review"

  - priority: 50
    category: business_safety
    check: "an insurer selection requires at least one IndependentExpert of the plan in expert_status == OPINION_ISSUED with safest_available_opinion == AFFIRMATIVE"
    error_id: ERR_EXPERT_OPINION_REQUIRED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/insurer-selection"

  - priority: 51
    category: business_safety
    check: "an expert with conflict_disclosed == true cannot be engaged"
    error_id: ERR_EXPERT_CONFLICT_DISCLOSED
    http_status: 409
    applies_to: "POST /prt/independent-experts/{id}/independence-review"

  - priority: 52
    category: business_safety
    check: "an insurer whose live rating_grade maps below SAFEST_AVAILABLE_MIN_RATING_POINTS (78), or whose insurer_status is not ACTIVE, may not be solicited for a quote at all; and the selected insurer's live rating is re-checked at pricing-lock time (against the insurer's current rating_grade rather than the quote's rating_at_submission snapshot)"
    error_id: ERR_INSURER_RATING_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/quotes, POST /prt/tranches/{id}/pricing-lock"

  - priority: 53
    category: business_safety
    check: "every participant in scope has completed data cleansing: data_status == CLEAN for tranche quoting; benefit_audit_status IN {PASSED_CLOSED, CORRECTED} for insurer selection and for a lump-sum election"
    error_id: ERR_PARTICIPANT_DATA_NOT_CLEAN
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/quoting, POST /prt/tranches/{id}/insurer-selection, POST /prt/elections/{id}/election"

  - priority: 54
    category: business_safety
    check: "mortality is affirmatively confirmed (mortality_status == ALIVE_CONFIRMED) for every participant a tranche quotes on, and for the participant making a lump-sum election"
    error_id: ERR_MORTALITY_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/quoting, POST /prt/elections/{id}/election"

  - priority: 55
    category: business_referential
    check: "cross-entity ownership is coherent: a quote's tranche_id matches the tranche in the path (ERR_QUOTE_TRANCHE_MISMATCH); an assigned participant's plan_id equals the tranche's plan_id and its cohort equals the tranche's target_cohort (ERR_PARTICIPANT_PLAN_MISMATCH); a complaint's tranche_id, when supplied, is a tranche the participant was actually assigned to"
    error_id: ERR_QUOTE_TRANCHE_MISMATCH
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/participant-assignments, POST /prt/participants/{id}/complaints, POST /prt/tranches/{id}/insurer-selection"

  - priority: 56
    category: business_referential
    check: "a participant may belong to at most one tranche: participant_status must be IN_PLAN when assigned"
    error_id: ERR_PARTICIPANT_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/participant-assignments"

  - priority: 57
    category: business_referential
    check: "a complaint may only be filed about a participant who has actually left the plan through a settlement: participant_status IN {TRANSFERRED_TO_INSURER, SETTLED_LUMP_SUM, RESIDUAL_ANNUITY_PURCHASED}"
    error_id: ERR_PARTICIPANT_NOT_TRANSFERRED
    http_status: 409
    applies_to: "POST /prt/participants/{id}/complaints"

  - priority: 60
    category: business_constraint
    check: "a new LumpSumWindow's [opens_at, closes_at) half-open interval must not overlap another non-VOIDED window of the same plan, and must additionally clear a QUIET_PERIOD_DAYS (90) buffer after the closes_at of every non-VOIDED window of that plan"
    error_id: ERR_WINDOW_QUIET_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /prt/plans/{id}/lump-sum-windows"

  - priority: 61
    category: business_constraint
    check: "a tranche may not request a second quote from an insurer that already holds a non-terminal quote on that tranche (quote_status IN {REQUESTED, SUBMITTED, SHORTLISTED, LOCKED, BOUND})"
    error_id: ERR_DUPLICATE_QUOTE_REQUEST
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/quotes"

  - priority: 62
    category: business_constraint
    check: "a tranche must hold at least one ASSIGNED participant before quoting begins"
    error_id: ERR_TRANCHE_EMPTY
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/quoting"

  - priority: 63
    category: business_constraint
    check: "the insurer-selection candidate pool computed by calculations.insurer_safest_available_score is non-empty"
    error_id: ERR_NO_ELIGIBLE_QUOTE
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/insurer-selection"

  - priority: 64
    category: business_constraint
    check: "an address search may not be run once the tier ladder is exhausted (address_search_attempts >= ADDRESS_SEARCH_MAX_TIERS, i.e. 3)"
    error_id: ERR_ADDRESS_SEARCH_TIER_EXHAUSTED
    http_status: 409
    applies_to: "POST /prt/participants/{id}/address-searches"

  - priority: 65
    category: business_constraint
    check: "a participant is only eligible for a lump-sum notice or election when the raw present value from calculations.lump_sum_present_value step 1 is at most the window's eligibility_max_lump_sum_cents"
    error_id: ERR_LUMP_SUM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /prt/elections/{id}/election"

  - priority: 66
    category: business_temporal
    check: "the AnnuityQuote selected for a pricing lock has not expired: quote.expires_at > the logical clock; and an asset transfer is reviewed at or before tranche.lock_expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/pricing-lock, POST /prt/asset-transfers/{id}/insurer-review"

  - priority: 67
    category: business_temporal
    check: "an election may be revoked only within REVOCATION_PERIOD_DAYS (7) days of elected_at and only while the window is still open"
    error_id: ERR_REVOCATION_PERIOD_ELAPSED
    http_status: 409
    applies_to: "POST /prt/elections/{id}/revocation"

  - priority: 70
    category: business_fiscal
    check: "the honoured lump-sum total may not exceed the window's lump_sum_cap_cents; individual elections beyond the cap are deferred by calculations.window_cap_waterfall rather than rejected, and this error fires when the settlement's cap re-verification re-prices the elected set from the participants' current audited_monthly_benefit_cents and finds the total above the cap"
    error_id: ERR_WINDOW_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /prt/lump-sum-windows/{id}/settlement"

  - priority: 71
    category: business_fiscal
    check: "the premium being locked fits inside the insurer's remaining capacity over the candidate lock interval, aggregated across every intersecting closed lock interval by calculations.insurer_committed_capacity"
    error_id: ERR_INSURER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/pricing-lock"

  - priority: 72
    category: business_fiscal
    check: "the credited value of an asset transfer, net of haircut, custody and wire fees, reaches the tranche's locked_premium_cents"
    error_id: ERR_TRANSFER_VALUE_SHORTFALL
    http_status: 409
    applies_to: "POST /prt/tranches/{id}/asset-transfers"

  - priority: 73
    category: business_fiscal
    check: "the plan holds enough assets for the disbursement: plan_assets_cents >= approved_lump_sum_total_cents at window settlement, >= remediation_amount_cents at complaint resolution, and accounting_funded_status_bp >= 10000 before a termination filing is approved"
    error_id: ERR_PLAN_ASSETS_INSUFFICIENT
    http_status: 402
    applies_to: "POST /prt/lump-sum-windows/{id}/settlement, POST /prt/complaints/{id}/resolution, POST /prt/plans/{id}/filing-review"

  - priority: 80
    category: existence
    check: "pagination parameters are well formed: limit integer 1..100, offset integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every list endpoint"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Path conventions: every business path is prefixed with the api_prefix /prt.
# An entity's own identifier is always the segment {id}; foreign keys never
# appear as path segments (they are body fields or list filters). Cascade-created
# children (ParticipantElection, SettlementEntry, BenefitAudit supersessions)
# are discoverable only through their reverse-reachability GETs.
# =============================================================================

endpoints:

  # --- reads: plan aggregate -------------------------------------------------
  - method: GET
    path: "/prt/plans/{id}"
    description: "retrieve one pension plan with its status, liability, asset, amendment and settlement-charge fields"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator]
    code: 200
    input: []
    output: PensionPlan
    side_effects: []

  - method: GET
    path: "/prt/plans/{id}/strategies"
    description: "list the de-risking strategies of a plan (reverse reachability for DeRiskingStrategy.plan_id)"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator]
    code: 200
    input: ["strategy_status?", "limit?", "offset?"]
    output: DeRiskingStrategy[]
    side_effects: []

  - method: GET
    path: "/prt/plans/{id}/lump-sum-windows"
    description: "list the lump-sum windows of a plan (reverse reachability for LumpSumWindow.plan_id)"
    roles: [PlanSponsor, PlanFiduciary, PlanAdministrator, Actuary, Regulator]
    code: 200
    input: ["window_status?", "limit?", "offset?"]
    output: LumpSumWindow[]
    side_effects: []

  - method: GET
    path: "/prt/plans/{id}/independent-experts"
    description: "list the independent experts engaged by a plan (reverse reachability for IndependentExpert.plan_id)"
    roles: [PlanSponsor, PlanFiduciary, Regulator, IndependentExpertUser]
    code: 200
    input: ["expert_status?", "limit?", "offset?"]
    output: IndependentExpert[]
    side_effects: []

  - method: GET
    path: "/prt/plans/{id}/funded-status"
    description: "computed read derived from calculations.funded_status_measurement; returns an inline object rather than an entity and persists nothing"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator]
    code: 200
    input: []
    output: { accounting_funded_status_bp: integer, settlement_basis_liability_cents: integer, settlement_funded_status_bp: integer, participant_liability_total_cents: integer, unfunded_settlement_gap_cents: integer, cumulative_settlement_charge_cents: integer, deferred_settlement_charge_cents: integer }
    side_effects: ["runs calculations.funded_status_measurement read-only"]

  # --- reads: participants and audits ---------------------------------------
  - method: GET
    path: "/prt/participants/{id}"
    description: "retrieve one participant record with all three state dimensions, liabilities and data-confidence score"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator, Participant]
    code: 200
    input: []
    output: ParticipantRecord
    side_effects: []

  - method: GET
    path: "/prt/participants"
    description: "filtered list of participant records (reverse reachability for ParticipantRecord.plan_id and ParticipantRecord.tranche_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator]
    code: 200
    input: ["plan_id?", "tranche_id?", "cohort?", "data_status?", "mortality_status?", "address_status?", "participant_status?", "limit?", "offset?"]
    output: ParticipantRecord[]
    side_effects: []

  - method: GET
    path: "/prt/participants/{id}/benefit-audits"
    description: "list every benefit audit of a participant including SUPERSEDED ones, ordered audit_sequence ASC (reverse reachability for BenefitAudit.participant_id)"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator]
    code: 200
    input: ["audit_status?", "limit?", "offset?"]
    output: BenefitAudit[]
    side_effects: []

  # --- reads: elections -----------------------------------------------------
  - method: GET
    path: "/prt/elections/{id}"
    description: "retrieve one participant election with its priced lump-sum amounts"
    roles: [PlanSponsor, PlanFiduciary, PlanAdministrator, Actuary, Regulator, Participant]
    code: 200
    input: []
    output: ParticipantElection
    side_effects: []

  - method: GET
    path: "/prt/elections"
    description: "filtered list of participant elections (reverse reachability for ParticipantElection.window_id and .participant_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, PlanAdministrator, Actuary, Regulator, Participant]
    code: 200
    input: ["window_id?", "participant_id?", "election_status?", "limit?", "offset?"]
    output: ParticipantElection[]
    side_effects: []

  # --- reads: tranches, quotes, transfers, insurers -------------------------
  - method: GET
    path: "/prt/tranches/{id}"
    description: "retrieve one buyout tranche with its liabilities, selection, lock window and readiness flag"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator, InsurerRep]
    code: 200
    input: []
    output: BuyoutTranche
    side_effects: []

  - method: GET
    path: "/prt/tranches"
    description: "filtered list of buyout tranches (reverse reachability for BuyoutTranche.plan_id, .selected_quote_id and .selected_insurer_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator, InsurerRep]
    code: 200
    input: ["plan_id?", "selected_quote_id?", "selected_insurer_id?", "tranche_status?", "limit?", "offset?"]
    output: BuyoutTranche[]
    side_effects: []

  - method: GET
    path: "/prt/tranches/{id}/asset-transfers"
    description: "list every asset transfer initiated against a tranche including SUPERSEDED ones, ordered created_at ASC (reverse reachability for AssetTransfer.tranche_id)"
    roles: [PlanSponsor, PlanFiduciary, Regulator, InsurerRep]
    code: 200
    input: ["transfer_status?", "limit?", "offset?"]
    output: AssetTransfer[]
    side_effects: []

  - method: GET
    path: "/prt/quotes/{id}"
    description: "retrieve one annuity quote with its premium, validity window and composite score"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator, InsurerRep]
    code: 200
    input: []
    output: AnnuityQuote
    side_effects: []

  - method: GET
    path: "/prt/quotes"
    description: "filtered list of annuity quotes (reverse reachability for AnnuityQuote.tranche_id and .insurer_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator, InsurerRep]
    code: 200
    input: ["tranche_id?", "insurer_id?", "quote_status?", "limit?", "offset?"]
    output: AnnuityQuote[]
    side_effects: []

  - method: GET
    path: "/prt/insurers/{id}"
    description: "retrieve one insurer with its rating grade, capital ratio and capacity split"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator, InsurerRep]
    code: 200
    input: []
    output: Insurer
    side_effects: []

  - method: GET
    path: "/prt/independent-experts/{id}"
    description: "retrieve one independent expert engagement with its independence review outcome and opinion"
    roles: [PlanSponsor, PlanFiduciary, Regulator, IndependentExpertUser]
    code: 200
    input: []
    output: IndependentExpert
    side_effects: []

  # --- reads: settlement ledger and complaints ------------------------------
  - method: GET
    path: "/prt/settlement-entries/{id}"
    description: "retrieve one append-only settlement accounting entry"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator]
    code: 200
    input: []
    output: SettlementEntry
    side_effects: []

  - method: GET
    path: "/prt/settlement-entries"
    description: "filtered list of settlement accounting entries (reverse reachability for SettlementEntry.plan_id, .tranche_id and .window_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, Actuary, Regulator]
    code: 200
    input: ["plan_id?", "tranche_id?", "window_id?", "entry_type?", "limit?", "offset?"]
    output: SettlementEntry[]
    side_effects: []

  - method: GET
    path: "/prt/complaints/{id}"
    description: "retrieve one post-transfer participant complaint with its responsibility determination"
    roles: [PlanSponsor, PlanFiduciary, PlanAdministrator, Regulator, Participant]
    code: 200
    input: []
    output: ParticipantComplaint
    side_effects: []

  - method: GET
    path: "/prt/complaints"
    description: "filtered list of participant complaints (reverse reachability for ParticipantComplaint.participant_id and .tranche_id); default ordering created_at ASC"
    roles: [PlanSponsor, PlanFiduciary, PlanAdministrator, Regulator, Participant]
    code: 200
    input: ["participant_id?", "tranche_id?", "complaint_status?", "responsibility_determination?", "limit?", "offset?"]
    output: ParticipantComplaint[]
    side_effects: []

  # --- plan lifecycle -------------------------------------------------------
  - method: POST
    path: "/prt/plans"
    description: "register a defined benefit plan; plan_status starts at ONGOING and accounting_funded_status_bp is derived immediately"
    roles: [PlanSponsor]
    code: 201
    input: [sponsor_name, plan_name, plan_ein, total_liability_cents, plan_assets_cents, service_cost_cents, interest_cost_cents, unrecognized_actuarial_loss_cents, discount_rate_bps]
    output: PensionPlan
    side_effects: ["runs calculations.funded_status_measurement to set accounting_funded_status_bp", "sets participant_liability_total_cents to 0"]

  - method: POST
    path: "/prt/plans/{id}/valuation-updates"
    description: "record a new actuarial valuation on the plan, superseding the prior measurement; guarded by the OCC rule valuation-update-stale-plan"
    roles: [PlanSponsor, Actuary]
    code: 200
    input: [expected_plan_version, total_liability_cents, plan_assets_cents, service_cost_cents, interest_cost_cents, unrecognized_actuarial_loss_cents, discount_rate_bps]
    output: PensionPlan
    side_effects: ["overwrites the six valuation fields", "re-runs calculations.funded_status_measurement", "increments PensionPlan.version"]

  - method: POST
    path: "/prt/plans/{id}/settlement-amendment"
    description: "adopt or rescind the plan amendment that authorizes settlement activity (ONGOING <-> SETTLEMENT_AUTHORIZED)"
    roles: [PlanSponsor]
    code: 200
    input: [amendment_action, "amendment_scope?", "amendment_effective_date?"]
    output: PensionPlan
    side_effects: ["ADOPT sets amendment_scope / amendment_effective_date / amendment_adopted_at", "RESCIND clears them and cascades PLANNED windows to VOIDED and DRAFT tranches to ABANDONED", "increments PensionPlan.version"]

  - method: POST
    path: "/prt/plans/{id}/termination-filing"
    description: "submit (or re-submit after a deficiency) the residual plan's termination filing"
    roles: [PlanSponsor]
    code: 200
    input: [filing_reference, "deficiency_response?"]
    output: PensionPlan
    side_effects: ["sets filing_reference and filing_submitted_at, clears filing_deficiency_reason", "increments PensionPlan.version"]

  - method: POST
    path: "/prt/plans/{id}/filing-review"
    description: "regulator's review of a termination filing: APPROVE terminates the plan, RETURN_DEFICIENT sends it back"
    roles: [Regulator]
    code: 200
    input: [review_decision, "filing_deficiency_reason?"]
    output: PensionPlan
    side_effects: ["APPROVE cascades remaining IN_PLAN participants to RESIDUAL_ANNUITY_PURCHASED, RESOLVED complaints to CLOSED_FINAL, and appends a PLAN_TERMINATION SettlementEntry", "RETURN_DEFICIENT sets filing_deficiency_reason", "increments PensionPlan.version"]

  # --- de-risking strategy --------------------------------------------------
  - method: POST
    path: "/prt/plans/{id}/strategies"
    description: "draft a de-risking strategy for the plan"
    roles: [Actuary]
    code: 201
    input: [strategy_name, strategy_type]
    output: DeRiskingStrategy
    side_effects: ["strategy_status starts at DRAFT with revision_count 0"]

  - method: POST
    path: "/prt/strategies/{id}/submission"
    description: "submit a drafted strategy for fiduciary evaluation, pricing it on both bases"
    roles: [Actuary]
    code: 200
    input: []
    output: DeRiskingStrategy
    side_effects: ["runs calculations.strategy_projected_settlement_cost for BOTH variants", "stores projected_accounting_cost_cents, projected_settlement_cost_cents, projected_basis_gap_cents, in_scope_participant_count", "records submitted_by_user_id", "increments DeRiskingStrategy.version"]

  - method: POST
    path: "/prt/strategies/{id}/decision"
    description: "fiduciary decision on a submitted strategy: APPROVE, REJECT or RETURN_FOR_REVISION; the decider may not be the submitter"
    roles: [PlanFiduciary]
    code: 200
    input: [decision, decision_rationale]
    output: DeRiskingStrategy
    side_effects: ["RETURN_FOR_REVISION increments revision_count and clears the projections", "records decided_by_user_id", "increments DeRiskingStrategy.version"]

  # --- participant data cleansing ------------------------------------------
  - method: POST
    path: "/prt/plans/{id}/participants"
    description: "load a participant into the plan; all three state dimensions start at their initial states and data_confidence_score is derived"
    roles: [PlanAdministrator]
    code: 201
    input: [participant_reference, cohort, stated_monthly_benefit_cents, final_average_monthly_earnings_cents, credited_service_months, date_of_birth]
    output: ParticipantRecord
    side_effects: ["runs calculations.participant_accounting_liability and participant_settlement_liability", "runs calculations.data_confidence_score", "recomputes plan.participant_liability_total_cents"]

  - method: POST
    path: "/prt/participants/{id}/address-searches"
    description: "record one commercial address-locator search attempt, escalating the tier ladder TIER_1 -> TIER_2 -> TIER_3"
    roles: [PlanAdministrator]
    code: 200
    input: [search_result, "confirmed_address_line1?", "confirmed_postal_code?"]
    output: ParticipantRecord
    side_effects: ["increments address_search_attempts and sets address_search_tier", "may move address_status to CONFIRMED or UNLOCATABLE", "re-runs calculations.data_confidence_score", "may recompute the assigned tranche's data_readiness_flag", "increments ParticipantRecord.version"]

  - method: POST
    path: "/prt/participants/{id}/mortality-checks"
    description: "record a mortality-verification outcome against the death master file, or file/resolve a dispute"
    roles: [PlanAdministrator]
    code: 200
    input: [match_result, "date_of_death?", "dispute_reason?"]
    output: ParticipantRecord
    side_effects: ["moves mortality_status along its own dimension", "DEATH_MATCH voids the participant's live elections and zeroes both liabilities", "re-runs calculations.data_confidence_score", "may recompute the assigned tranche's liabilities and data_readiness_flag", "increments ParticipantRecord.version"]

  - method: POST
    path: "/prt/participants/{id}/benefit-audits"
    description: "open a benefit calculation audit, superseding every prior audit of this participant; guarded by the OCC rule benefit-audit-create-stale-participant"
    roles: [Actuary]
    code: 201
    input: [expected_participant_version, "audit_basis?", "final_average_monthly_earnings_cents?", "credited_service_months?"]
    output: BenefitAudit
    side_effects: ["supersedes every non-SUPERSEDED audit of the participant", "runs calculations.benefit_recomputation and forks audit_status to PASSED or CORRECTION_REQUIRED", "sets participant.benefit_audit_status and re-runs calculations.data_confidence_score", "assigns audit_sequence = prior audit count + 1", "increments ParticipantRecord.version"]

  - method: POST
    path: "/prt/benefit-audits/{id}/resolution"
    description: "close an audit by applying the recomputed benefit or accepting the stated benefit as is"
    roles: [Actuary]
    code: 200
    input: [resolution, "override_rationale?"]
    output: BenefitAudit
    side_effects: ["writes participant.audited_monthly_benefit_cents", "re-runs calculations.participant_accounting_liability, participant_settlement_liability and data_confidence_score", "may recompute the assigned tranche's liabilities and data_readiness_flag", "increments BenefitAudit.version"]

  # --- lump-sum windows and elections --------------------------------------
  - method: POST
    path: "/prt/plans/{id}/lump-sum-windows"
    description: "schedule a lump-sum window; the half-open interval must clear the 90-day quiet period after every existing non-VOIDED window of the plan"
    roles: [PlanAdministrator]
    code: 201
    input: [window_name, opens_at, closes_at, lump_sum_cap_cents, eligibility_max_lump_sum_cents]
    output: LumpSumWindow
    side_effects: ["window_status starts at PLANNED with notice_count 0"]

  - method: POST
    path: "/prt/lump-sum-windows/{id}/opening"
    description: "open the window and fan out lump-sum notices to every eligible participant, creating one ParticipantElection each in NOTICE_SENT"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: LumpSumWindow
    side_effects: ["creates one ParticipantElection per eligible participant with notice_estimated_lump_sum_cents priced by calculations.lump_sum_present_value step 1", "sets notice_count and opened_at", "increments LumpSumWindow.version"]

  - method: POST
    path: "/prt/lump-sum-windows/{id}/closing"
    description: "close the window, default every unanswered notice, and run the cap waterfall over the lump-sum elections"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: LumpSumWindow
    side_effects: ["NOTICE_SENT elections cascade to DEFAULTED_NO_RESPONSE", "runs calculations.window_cap_waterfall, deferring over-cap elections to CAP_DEFERRED and continuing the walk", "sets approved_lump_sum_total_cents and closed_at", "increments LumpSumWindow.version"]

  - method: POST
    path: "/prt/lump-sum-windows/{id}/settlement"
    description: "pay the honoured lump-sum elections and recognise the settlement in the plan's accounting"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: LumpSumWindow
    side_effects: ["four-hop cascade: elections to PAID, participants to SETTLED_LUMP_SUM, plan liability / assets / funded status recomputed, plan may bubble up to RESIDUAL", "appends a LUMP_SUM_RECOGNITION SettlementEntry", "sets paid_lump_sum_total_cents and settled_at", "increments LumpSumWindow.version"]

  - method: POST
    path: "/prt/elections/{id}/election"
    description: "participant elects a lump sum or the annuity; a lump-sum election is priced immediately"
    roles: [Participant]
    code: 200
    input: [election_choice]
    output: ParticipantElection
    side_effects: ["runs calculations.lump_sum_present_value for LUMP_SUM, storing raw_pv_cents, admin_fee_bp, admin_fee_cents and net_lump_sum_cents", "sets elected_at", "increments ParticipantElection.version"]

  - method: POST
    path: "/prt/elections/{id}/revocation"
    description: "participant revokes an election inside the 7-day revocation period, returning it to NOTICE_SENT"
    roles: [Participant]
    code: 200
    input: []
    output: ParticipantElection
    side_effects: ["clears elected_at, election_choice and all priced amounts", "increments revocation_count", "increments ParticipantElection.version"]

  # --- buyout tranches, quotes, selection, lock, transfer ------------------
  - method: POST
    path: "/prt/plans/{id}/tranches"
    description: "draft a buyout tranche scoped to one participant cohort"
    roles: [PlanFiduciary]
    code: 201
    input: [tranche_name, target_cohort]
    output: BuyoutTranche
    side_effects: ["tranche_status starts at DRAFT with data_readiness_flag BLOCKED and zero liabilities"]

  - method: POST
    path: "/prt/tranches/{id}/participant-assignments"
    description: "assign one IN_PLAN participant of the matching cohort to a DRAFT tranche"
    roles: [PlanAdministrator]
    code: 200
    input: [participant_id]
    output: BuyoutTranche
    side_effects: ["participant moves IN_PLAN -> ASSIGNED with tranche_id set", "re-runs calculations.tranche_liability, updating assigned_participant_count, both liabilities and data_readiness_flag", "increments both versions"]

  - method: POST
    path: "/prt/tranches/{id}/quoting"
    description: "open the quote process for a tranche once the plan authorizes a buyout and every assigned participant's data is clean"
    roles: [PlanFiduciary]
    code: 200
    input: []
    output: BuyoutTranche
    side_effects: ["re-runs calculations.tranche_liability and sets data_readiness_flag = READY", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/tranches/{id}/quotes"
    description: "request a quote from one insurer on a tranche that is out for quote; an insurer below the safest-available rating floor or not ACTIVE may not be solicited (validation priority 52) and an insurer already holding a non-terminal quote on this tranche may not be solicited twice (ERR_DUPLICATE_QUOTE_REQUEST)"
    roles: [PlanFiduciary]
    code: 201
    input: [insurer_id]
    output: AnnuityQuote
    side_effects: ["quote_status starts at REQUESTED", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/quotes/{id}/submission"
    description: "insurer submits a firm premium or declines to quote; the insurer's current rating is snapshotted onto the quote"
    roles: [InsurerRep]
    code: 200
    input: [submission_decision, "premium_cents?", "lock_days?", "quote_valid_days?", "decline_reason?"]
    output: AnnuityQuote
    side_effects: ["SUBMIT sets premium_cents, lock_days, quote_valid_days, submitted_at, expires_at and rating_at_submission", "DECLINE sets decline_reason", "increments AnnuityQuote.version"]

  - method: POST
    path: "/prt/tranches/{id}/insurer-selection"
    description: "fiduciary selects the winning insurer under the declared weighting basis, requiring an affirmative independent-expert opinion"
    roles: [PlanFiduciary]
    code: 200
    input: [selection_basis]
    output: BuyoutTranche
    side_effects: ["runs calculations.insurer_safest_available_score, scoring every candidate quote", "winner moves SUBMITTED -> SHORTLISTED, losers to DECLINED", "sets selected_quote_id, selected_insurer_id, selection_score_bp, selection_basis", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/tranches/{id}/pricing-lock"
    description: "lock the selected quote's premium for its lock window, consuming insurer capacity over that closed interval"
    roles: [PlanFiduciary]
    code: 200
    input: []
    output: BuyoutTranche
    side_effects: ["runs calculations.insurer_committed_capacity over the candidate closed interval", "sets locked_premium_cents, lock_start_at, lock_expires_at", "selected quote moves SHORTLISTED -> LOCKED", "recomputes insurer.committed_capacity_cents and available_capacity_cents", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/tranches/{id}/asset-transfers"
    description: "initiate funding of a locked tranche in kind or in cash, superseding any prior INITIATED transfer; guarded by the OCC rule asset-transfer-create-stale-tranche"
    roles: [PlanSponsor]
    code: 201
    input: [expected_tranche_version, transfer_mode, gross_value_cents, "security_lot_count?"]
    output: AssetTransfer
    side_effects: ["supersedes any INITIATED transfer on the tranche", "runs calculations.transfer_credited_value, storing transfer_expense_cents and credited_value_cents, and rejects a shortfall", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/asset-transfers/{id}/insurer-review"
    description: "insurer accepts or rejects the delivered assets; acceptance advances the tranche to ASSETS_TRANSFERRED"
    roles: [InsurerRep]
    code: 200
    input: [insurer_decision, "rejection_reason?"]
    output: AssetTransfer
    side_effects: ["ACCEPT sets settled_at and cascades the tranche PRICING_LOCKED -> ASSETS_TRANSFERRED with transfer_expense_cents copied across", "REJECT sets rejection_reason and leaves the tranche untouched", "increments AssetTransfer.version"]

  - method: POST
    path: "/prt/tranches/{id}/settlement"
    description: "recognise the buyout settlement in the plan's accounting and hand the participants to the insurer"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: BuyoutTranche
    side_effects: ["runs calculations.settlement_recognition and appends a BUYOUT_RECOGNITION SettlementEntry", "four-hop cascade: plan charge totals, participants to TRANSFERRED_TO_INSURER, plan liability / assets / funded status, possible bubble-up to RESIDUAL", "selected quote moves LOCKED -> BOUND", "sets settlement_gain_loss_cents and settled_at", "increments BuyoutTranche.version"]

  - method: POST
    path: "/prt/tranches/{id}/abandonment"
    description: "abandon a tranche before settlement, reversing every reservation it made"
    roles: [PlanFiduciary]
    code: 200
    input: [abandonment_reason]
    output: BuyoutTranche
    side_effects: ["releases the insurer capacity consumed by the lock, restoring capacity_cents == committed + available", "expires the tranche's live quotes", "returns assigned participants to IN_PLAN with tranche_id cleared", "clears the selection and lock fields", "increments BuyoutTranche.version"]

  # --- independent expert engagement ---------------------------------------
  - method: POST
    path: "/prt/plans/{id}/independent-experts"
    description: "propose an independent expert to advise on the safest-available-annuity determination"
    roles: [PlanSponsor]
    code: 201
    input: [expert_firm_name, engagement_scope, "conflict_disclosed?"]
    output: IndependentExpert
    side_effects: ["expert_status starts at INDEPENDENCE_REVIEW and proposed_by_user_id records the proposer"]

  - method: POST
    path: "/prt/independent-experts/{id}/independence-review"
    description: "fiduciary clears or disqualifies the proposed expert; the reviewer may not be the proposer and a disclosed conflict is disqualifying"
    roles: [PlanFiduciary]
    code: 200
    input: [review_decision]
    output: IndependentExpert
    side_effects: ["records reviewed_by_user_id", "increments IndependentExpert.version"]

  - method: POST
    path: "/prt/independent-experts/{id}/opinion"
    description: "the engaged expert issues its safest-available-annuity opinion"
    roles: [IndependentExpertUser]
    code: 200
    input: [safest_available_opinion]
    output: IndependentExpert
    side_effects: ["sets safest_available_opinion and opinion_issued_at", "increments IndependentExpert.version"]

  # --- insurer registry ----------------------------------------------------
  - method: POST
    path: "/prt/insurers"
    description: "register an admitted annuity carrier in the regulator's registry with its rating, capital ratio and aggregate capacity"
    roles: [Regulator]
    code: 201
    input: [insurer_name, rating_grade, capital_ratio_bp, capacity_cents]
    output: Insurer
    side_effects: ["insurer_status starts at ACTIVE with committed_capacity_cents 0 and available_capacity_cents = capacity_cents"]

  - method: POST
    path: "/prt/insurers/{id}/rating-changes"
    description: "record a rating action on an insurer; a downgrade below the safest-available floor cascades through its quotes into every tranche that selected it"
    roles: [Regulator]
    code: 200
    input: [rating_grade, "capital_ratio_bp?", "insurer_status?"]
    output: Insurer
    side_effects: ["SUBMITTED and SHORTLISTED quotes of this insurer move to INELIGIBLE when the new rating is below the floor", "tranches whose selected quote became INELIGIBLE fall back INSURER_SELECTED -> QUOTING with the selection cleared and data_readiness_flag BLOCKED", "increments Insurer.version"]

  # --- post-transfer complaints -------------------------------------------
  - method: POST
    path: "/prt/participants/{id}/complaints"
    description: "a settled participant files a complaint about the benefit they now receive"
    roles: [Participant]
    code: 201
    input: [complaint_category, complaint_narrative, "tranche_id?"]
    output: ParticipantComplaint
    side_effects: ["complaint_status starts at OPEN with triage_count 0"]

  - method: POST
    path: "/prt/complaints/{id}/triage"
    description: "administrator determines who owns the correction; a sponsor-responsible determination reopens the participant's latest benefit audit, and a re-triage away from sponsor responsibility reverses any remediation already booked"
    roles: [PlanAdministrator]
    code: 200
    input: [responsibility_determination, determination_rationale]
    output: ParticipantComplaint
    side_effects: ["three-hop cascade on SPONSOR_RESPONSIBLE: latest audit to REOPENED, participant.benefit_audit_status and data_confidence_score, assigned tranche data_readiness_flag", "re-triage away from SPONSOR_RESPONSIBLE appends a REMEDIATION_REVERSAL SettlementEntry and restores plan.cumulative_settlement_charge_cents and plan.plan_assets_cents", "increments triage_count", "increments ParticipantComplaint.version"]

  - method: POST
    path: "/prt/complaints/{id}/resolution"
    description: "close out a triaged complaint, booking sponsor remediation when the sponsor owns the error"
    roles: [PlanAdministrator]
    code: 200
    input: [remediation_amount_cents]
    output: ParticipantComplaint
    side_effects: ["SPONSOR_RESPONSIBLE appends a REMEDIATION SettlementEntry, increases plan.cumulative_settlement_charge_cents, decreases plan.plan_assets_cents and re-runs calculations.funded_status_measurement", "sets resolved_at", "increments ParticipantComplaint.version"]

  # --- test-driving surface (priority-ladder step 3) -----------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock to an explicit UTC instant. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, expiry, quiet period, revocation period and lock interval in this scaffold is measured against this logical clock. No plausible business endpoint exists for moving time, so this is declared under the /_ namespace per the 1.5 priority ladder."
    roles: [PlanSponsor, PlanFiduciary, Actuary, PlanAdministrator, Regulator, InsurerRep, Participant, IndependentExpertUser]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock; no entity state changes and no transitions fire as a side effect of the clock move"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================

errors:
  # --- authentication / authorization / duty segregation --------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not one of the eight declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (insurer rep on another carrier's quote or transfer, participant on another participant's election or complaint, expert user on another engagement)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID both submitted and decided a de-risking strategy, or both proposed and independence-reviewed an expert"

  # --- not found -----------------------------------------------------------
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no PensionPlan with the given id"
  - id: ERR_STRATEGY_NOT_FOUND
    http: 404
    condition: "no DeRiskingStrategy with the given id"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "no ParticipantRecord with the given id, in the path or in a request body"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no BenefitAudit with the given id"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "no LumpSumWindow with the given id"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "no ParticipantElection with the given id"
  - id: ERR_TRANCHE_NOT_FOUND
    http: 404
    condition: "no BuyoutTranche with the given id, in the path or in a request body"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "no AnnuityQuote with the given id"
  - id: ERR_INSURER_NOT_FOUND
    http: 404
    condition: "no Insurer with the given id, in the path or in a quote-request body"
  - id: ERR_EXPERT_NOT_FOUND
    http: 404
    condition: "no IndependentExpert with the given id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no AssetTransfer with the given id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no ParticipantComplaint with the given id"
  - id: ERR_SETTLEMENT_ENTRY_NOT_FOUND
    http: 404
    condition: "no SettlementEntry with the given id"

  # --- request shape and ranges -------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing, has the wrong JSON type, carries an enum value outside the declared set, or a conditionally required field is absent (date_of_death on DEATH_MATCH, dispute_reason on DISPUTE_FILED, decline_reason on DECLINE, rejection_reason on REJECT, filing_deficiency_reason on RETURN_DEFICIENT, override_rationale on an ACCEPT_AS_IS over a correction, amendment_scope on ADOPT)"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "a money, rate or count field is out of range: negative cents, discount_rate_bps outside 1..2000, credited_service_months outside 0..600, capital_ratio_bp outside 0..20000, lock_days outside 1..180, quote_valid_days outside 1..90, plan_ein not exactly nine digits, or remediation_amount_cents inconsistent with the responsibility determination"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "opens_at >= closes_at on a lump-sum window, or amendment_effective_date earlier than the logical clock"
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "opening a window would leave participants fewer than NOTICE_PERIOD_DAYS (30) days before closes_at"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset negative or non-integer"

  # --- optimistic concurrency (1.2.1) --------------------------------------
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the PensionPlan's current version on a valuation update"
  - id: ERR_STALE_TRANCHE_VERSION
    http: 412
    condition: "expected_tranche_version does not equal the BuyoutTranche's current version on an asset-transfer creation"
  - id: ERR_STALE_PARTICIPANT_VERSION
    http: 412
    condition: "expected_participant_version does not equal the ParticipantRecord's current version on a benefit-audit creation"

  # --- own-state preconditions --------------------------------------------
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the plan's plan_status does not permit the requested operation"
  - id: ERR_STRATEGY_STATE_INVALID
    http: 409
    condition: "the strategy's strategy_status does not permit the requested operation, including a RETURN_FOR_REVISION once revision_count has reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_PARTICIPANT_STATE_INVALID
    http: 409
    condition: "the participant's participant_status does not permit the requested operation"
  - id: ERR_AUDIT_STATE_INVALID
    http: 409
    condition: "the audit's audit_status does not permit the requested resolution, or a complaint resolution is attempted while the participant's audit is REOPENED"
  - id: ERR_WINDOW_STATE_INVALID
    http: 409
    condition: "the window's window_status or the logical clock's position relative to opens_at / closes_at does not permit the requested operation"
  - id: ERR_ELECTION_STATE_INVALID
    http: 409
    condition: "the election's election_status does not permit the requested operation, including a second revocation once revocation_count has reached REVOCATION_MAX (1)"
  - id: ERR_TRANCHE_STATE_INVALID
    http: 409
    condition: "the tranche's tranche_status does not permit the requested operation"
  - id: ERR_QUOTE_STATE_INVALID
    http: 409
    condition: "the quote's quote_status does not permit the requested operation because the quote has already reached a terminal status (DECLINED, INELIGIBLE, EXPIRED or BOUND); a submission or decline on a still-live quote returns ERR_QUOTE_NOT_REQUESTED instead"
  - id: ERR_EXPERT_STATE_INVALID
    http: 409
    condition: "the expert's expert_status does not permit the requested operation, or no engaged expert exists on the plan when quoting opens"
  - id: ERR_TRANSFER_STATE_INVALID
    http: 409
    condition: "an insurer review is attempted on a transfer that was SUPERSEDED by a later delivery on the same tranche; a review of an already-answered transfer (SETTLED or REJECTED) returns ERR_TRANSFER_NOT_INITIATED instead"
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "the complaint's complaint_status does not permit the requested operation, a re-triage repeats the stored determination, or a termination filing is attempted while OPEN or TRIAGED complaints remain"

  # --- named-state preconditions (name the required state) -----------------
  - id: ERR_PLAN_NOT_SETTLEMENT_AUTHORIZED
    http: 409
    condition: "opening a lump-sum window or starting a quote process while plan_status != SETTLEMENT_AUTHORIZED, or while amendment_scope does not cover the requested settlement channel"
  - id: ERR_STRATEGY_NOT_APPROVED
    http: 409
    condition: "adopting a settlement amendment with no APPROVED DeRiskingStrategy of a strategy_type compatible with the requested amendment_scope"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "an election or revocation is attempted while the window is not OPEN or the logical clock has reached closes_at"
  - id: ERR_TRANCHE_NOT_SELECTED
    http: 409
    condition: "a pricing lock is attempted while tranche_status != INSURER_SELECTED"
  - id: ERR_TRANCHE_NOT_TRANSFERRED
    http: 409
    condition: "a tranche settlement is attempted while tranche_status != ASSETS_TRANSFERRED"
  - id: ERR_QUOTE_NOT_REQUESTED
    http: 409
    condition: "a quote submission or decline is attempted while the quote is still live but no longer awaiting an answer (quote_status IN {SUBMITTED, SHORTLISTED, LOCKED})"
  - id: ERR_EXPERT_NOT_ENGAGED
    http: 409
    condition: "an opinion is issued while expert_status != ENGAGED"
  - id: ERR_TRANSFER_NOT_INITIATED
    http: 409
    condition: "an insurer review is attempted on a transfer that has already been answered (transfer_status IN {SETTLED, REJECTED})"
  - id: ERR_COMPLAINT_NOT_TRIAGED
    http: 409
    condition: "a resolution is attempted while complaint_status != TRIAGED, or a triage is attempted from a status other than OPEN or RESOLVED"

  # --- fiduciary safety / participant protection ---------------------------
  - id: ERR_EXPERT_OPINION_REQUIRED
    http: 409
    condition: "an insurer selection is attempted with no OPINION_ISSUED expert holding an AFFIRMATIVE safest_available_opinion on the plan"
  - id: ERR_EXPERT_CONFLICT_DISCLOSED
    http: 409
    condition: "an expert with conflict_disclosed == true is put forward for engagement"
  - id: ERR_INSURER_RATING_BELOW_FLOOR
    http: 409
    condition: "a quote is requested from an insurer whose live rating_grade maps below SAFEST_AVAILABLE_MIN_RATING_POINTS (78) or whose insurer_status is not ACTIVE, or at pricing-lock time the selected insurer's live rating_grade maps below that floor"
  - id: ERR_PARTICIPANT_DATA_NOT_CLEAN
    http: 409
    condition: "a participant in scope has data_status != CLEAN, or benefit_audit_status outside {PASSED_CLOSED, CORRECTED} where a closed audit is required"
  - id: ERR_MORTALITY_NOT_CONFIRMED
    http: 409
    condition: "a participant in scope has mortality_status != ALIVE_CONFIRMED"

  # --- referential coherence ----------------------------------------------
  - id: ERR_QUOTE_TRANCHE_MISMATCH
    http: 409
    condition: "a quote referenced during selection belongs to a different tranche, or a complaint's tranche_id is a tranche the participant was never assigned to"
  - id: ERR_PARTICIPANT_PLAN_MISMATCH
    http: 409
    condition: "an assigned participant's plan_id differs from the tranche's plan_id, or its cohort differs from the tranche's target_cohort"
  - id: ERR_PARTICIPANT_ALREADY_ASSIGNED
    http: 409
    condition: "the participant is not IN_PLAN, so it already belongs to a tranche or has already settled"
  - id: ERR_PARTICIPANT_NOT_TRANSFERRED
    http: 409
    condition: "a complaint is filed about a participant who has not yet left the plan through a settlement"

  # --- scheduling and uniqueness constraints ------------------------------
  - id: ERR_WINDOW_QUIET_PERIOD_CONFLICT
    http: 409
    condition: "a new window's [opens_at, closes_at) interval overlaps another non-VOIDED window of the plan, or falls inside the QUIET_PERIOD_DAYS (90) buffer after an existing window's closes_at"
  - id: ERR_DUPLICATE_QUOTE_REQUEST
    http: 409
    condition: "the insurer already holds a non-terminal quote on this tranche"
  - id: ERR_TRANCHE_EMPTY
    http: 409
    condition: "quoting is opened on a tranche with no ASSIGNED participants"
  - id: ERR_NO_ELIGIBLE_QUOTE
    http: 409
    condition: "the insurer-selection candidate pool is empty after applying the status, expiry, rating-floor and insurer-status filters"
  - id: ERR_ADDRESS_SEARCH_TIER_EXHAUSTED
    http: 409
    condition: "an address search is attempted after ADDRESS_SEARCH_MAX_TIERS (3) attempts have already been recorded"
  - id: ERR_LUMP_SUM_NOT_ELIGIBLE
    http: 409
    condition: "the participant's raw lump-sum present value exceeds the window's eligibility_max_lump_sum_cents"

  # --- temporal expiry ----------------------------------------------------
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "the selected quote's expires_at has passed at pricing-lock time, or the tranche's lock_expires_at has passed at insurer-review time"
  - id: ERR_REVOCATION_PERIOD_ELAPSED
    http: 409
    condition: "a revocation is attempted more than REVOCATION_PERIOD_DAYS (7) days after elected_at"

  # --- capacity, cap and asset sufficiency --------------------------------
  - id: ERR_WINDOW_CAP_EXCEEDED
    http: 409
    condition: "a window settlement is attempted while the elections re-priced from the participants' current audited_monthly_benefit_cents total more than lump_sum_cap_cents — typically because a benefit correction was recorded after the window closed"
  - id: ERR_INSURER_CAPACITY_EXCEEDED
    http: 409
    condition: "the premium being locked exceeds the insurer's capacity remaining across every lock interval that intersects the candidate closed interval"
  - id: ERR_TRANSFER_VALUE_SHORTFALL
    http: 409
    condition: "the credited value of the delivered assets, net of haircut, custody and wire fees, falls short of the tranche's locked_premium_cents"
  - id: ERR_PLAN_ASSETS_INSUFFICIENT
    http: 402
    condition: "the plan cannot fund the disbursement: plan_assets_cents below approved_lump_sum_total_cents at window settlement, below remediation_amount_cents at complaint resolution, or accounting_funded_status_bp below 10000 when a termination filing is reviewed"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# Role model: segregation_of_duties layered over peer ownership. The Actuary
# proposes and measures; the PlanFiduciary decides and selects; the PlanSponsor
# commits money; the PlanAdministrator handles participant data and complaints;
# the Regulator keeps the carrier registry and reviews termination filings.
# InsurerRep, Participant and IndependentExpertUser are entity_backed peers who
# may only touch their own resources.
# =============================================================================

roles:
  - name: PlanSponsor
    description: "the plan sponsor's treasury function — registers the plan, adopts and rescinds the settlement amendment, funds settlements, proposes independent experts, and files for termination"
    identity: opaque
    exclusive_operations:
      - "POST /prt/plans"
      - "POST /prt/plans/{id}/settlement-amendment"
      - "POST /prt/plans/{id}/termination-filing"
      - "POST /prt/lump-sum-windows/{id}/settlement"
      - "POST /prt/tranches/{id}/asset-transfers"
      - "POST /prt/tranches/{id}/settlement"
      - "POST /prt/plans/{id}/independent-experts"
    shared_operations:
      - "POST /prt/plans/{id}/valuation-updates (shared with Actuary)"
      - "every GET in 1.5 except /prt/independent-experts/{id} scoped reads it already sees"
      - "POST /_clock/set_current_utc"

  - name: PlanFiduciary
    description: "the named fiduciary committee — decides strategies, clears expert independence, runs the quote process, selects the insurer under the safest-available standard, locks pricing and abandons tranches"
    identity: opaque
    exclusive_operations:
      - "POST /prt/strategies/{id}/decision"
      - "POST /prt/independent-experts/{id}/independence-review"
      - "POST /prt/plans/{id}/tranches"
      - "POST /prt/tranches/{id}/quoting"
      - "POST /prt/tranches/{id}/quotes"
      - "POST /prt/tranches/{id}/insurer-selection"
      - "POST /prt/tranches/{id}/pricing-lock"
      - "POST /prt/tranches/{id}/abandonment"
    shared_operations:
      - "every GET in 1.5"
      - "POST /_clock/set_current_utc"
    constraints:
      - "may not decide a strategy it submitted (ERR_SEGREGATION_OF_DUTIES)"
      - "may not independence-review an expert it proposed (ERR_SEGREGATION_OF_DUTIES)"

  - name: Actuary
    description: "the enrolled actuary — drafts and submits de-risking strategies, opens and resolves benefit calculation audits, and records valuation updates"
    identity: opaque
    exclusive_operations:
      - "POST /prt/plans/{id}/strategies"
      - "POST /prt/strategies/{id}/submission"
      - "POST /prt/participants/{id}/benefit-audits"
      - "POST /prt/benefit-audits/{id}/resolution"
    shared_operations:
      - "POST /prt/plans/{id}/valuation-updates (shared with PlanSponsor)"
      - "every GET in 1.5 except /prt/independent-experts and /prt/tranches/{id}/asset-transfers"
      - "POST /_clock/set_current_utc"

  - name: PlanAdministrator
    description: "the third-party administrator — loads and cleanses participant data, runs address searches and mortality checks, schedules and operates lump-sum windows, assigns participants to tranches, and triages and resolves complaints"
    identity: opaque
    exclusive_operations:
      - "POST /prt/plans/{id}/participants"
      - "POST /prt/participants/{id}/address-searches"
      - "POST /prt/participants/{id}/mortality-checks"
      - "POST /prt/plans/{id}/lump-sum-windows"
      - "POST /prt/lump-sum-windows/{id}/opening"
      - "POST /prt/lump-sum-windows/{id}/closing"
      - "POST /prt/tranches/{id}/participant-assignments"
      - "POST /prt/complaints/{id}/triage"
      - "POST /prt/complaints/{id}/resolution"
    shared_operations:
      - "the participant, election, tranche, window and complaint GETs in 1.5"
      - "POST /_clock/set_current_utc"

  - name: Regulator
    description: "the supervisory authority — maintains the admitted-carrier registry and its rating actions, and reviews termination filings"
    identity: opaque
    exclusive_operations:
      - "POST /prt/insurers"
      - "POST /prt/insurers/{id}/rating-changes"
      - "POST /prt/plans/{id}/filing-review"
    shared_operations:
      - "every GET in 1.5 (read-only supervisory access)"
      - "POST /_clock/set_current_utc"

  - name: InsurerRep
    description: "an annuity carrier's representative — submits or declines quotes on its own tranches and reviews the assets delivered to it"
    identity: "entity_backed:Insurer"
    exclusive_operations:
      - "POST /prt/quotes/{id}/submission"
      - "POST /prt/asset-transfers/{id}/insurer-review"
    shared_operations:
      - "GET /prt/quotes, GET /prt/quotes/{id}, GET /prt/tranches, GET /prt/tranches/{id}, GET /prt/tranches/{id}/asset-transfers, GET /prt/insurers/{id}"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID must equal quote.insurer_id on a submission and tranche.selected_insurer_id on an asset-transfer review (ERR_IDENTITY_MISMATCH)"

  - name: Participant
    description: "a plan participant — makes and revokes lump-sum elections and files post-transfer complaints about its own record"
    identity: "entity_backed:ParticipantRecord"
    exclusive_operations:
      - "POST /prt/elections/{id}/election"
      - "POST /prt/elections/{id}/revocation"
      - "POST /prt/participants/{id}/complaints"
    shared_operations:
      - "GET /prt/participants/{id}, GET /prt/elections, GET /prt/elections/{id}, GET /prt/complaints, GET /prt/complaints/{id}"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID must equal election.participant_id on an election or revocation, and the {id} in the path on a complaint filing (ERR_IDENTITY_MISMATCH)"

  - name: IndependentExpertUser
    description: "the engaged independent expert — issues the safest-available-annuity opinion for its own engagement"
    identity: "entity_backed:IndependentExpert"
    exclusive_operations:
      - "POST /prt/independent-experts/{id}/opinion"
    shared_operations:
      - "GET /prt/plans/{id}/independent-experts, GET /prt/independent-experts/{id}"
      - "POST /_clock/set_current_utc"
    constraints:
      - "X-User-ID must equal the IndependentExpert id in the path (ERR_IDENTITY_MISMATCH)"
