# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Internal Audit Planning & Fieldwork Management
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_weighted_vs_conservative_variants
        grounds:
          - calculations.inherent_risk_score
          - entities.RiskAssessment.fields.scoring_variant
          - entities.AuditableEntity.fields.regulatory_scrutiny
        distinguishing_aspect: |
          Dual variant on the RiskAssessment/AuditableEntity domain: identical
          likelihood=3, impact=4 inputs score 72 under WEIGHTED (8*3+12*4) but 80
          under CONSERVATIVE (20*max(3,4)); the variant is selected by the entity's
          regulatory_scrutiny flag, not by request input.
        test_recipe:
          setup:
            - "Clock at 2026-01-15; a MANAGER auditor; entity A without scrutiny; entity B with regulatory_scrutiny=true"
            - "Both entities receive a RiskAssessment with likelihood 3, impact 4, then finalize"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity A", business_owner: "Owner A" }, as: AuditAdmin, captures: { ent_a: "$.data.id", ent_a_v: "$.data.version" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity B", business_owner: "Owner B", regulatory_scrutiny: true }, as: AuditAdmin, captures: { ent_b: "$.data.id", ent_b_v: "$.data.version" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent_a}", fiscal_year: 2026, likelihood: 3, impact: 4, expected_auditable_entity_version: "${ent_a_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra_a: "$.data.id" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent_b}", fiscal_year: 2026, likelihood: 3, impact: 4, expected_auditable_entity_version: "${ent_b_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra_b: "$.data.id" } }
          trigger:
            - { call: "POST /audit/risk-assessments/${ra_a}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/risk-assessments/${ra_b}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
          assert:
            - "RiskAssessment.${ra_a}.scoring_variant == WEIGHTED and inherent_risk_score == 72"
            - "RiskAssessment.${ra_b}.scoring_variant == CONSERVATIVE and inherent_risk_score == 80"
            - "72 != 80 for identical (likelihood=3, impact=4) inputs"
            - "AuditableEntity.${ent_a}.current_inherent_risk_score == 72 and current_risk_tier == HIGH"
            - "AuditableEntity.${ent_b}.current_inherent_risk_score == 80 and current_risk_tier == HIGH"

      - name: utilization_provisional_vs_final_hours_basis
        grounds:
          - calculations.budget_utilization
          - calculations.engagement_hours_rollup
          - entities.Engagement.fields.utilization_provisional_pct
        distinguishing_aspect: |
          Dual variant on the Engagement domain (distinct from the risk-score
          domain): with 10.0 SIGNED_OFF hours and 20.0 SUBMITTED hours against a
          100-hour budget, the provisional variant reports 30.0% while the final
          variant reports 10.0% on the same data at the same instant.
        test_recipe:
          setup:
            - "Clock 2026-01-15; entity; manager mgr1; staff staff1; plan APPROVED; engagement (budget_hours 100, window 2026-02-01..2026-02-28) in FIELDWORK with LEAD mgr1 and STAFF staff1 assigned"
            - "Workpaper A (10.0h) submitted and signed off; workpaper B (20.0h) submitted only"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity U", business_owner: "Owner U" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng U", scope_summary: "scope", budget_hours: 100, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/begin-fieldwork", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "A-1", title: "WP A", hours_worked: 10 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp_a: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp_a}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp_a}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "B-1", title: "WP B", hours_worked: 20 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp_b: "$.data.id" } }
          trigger:
            - { call: "POST /audit/workpapers/${wp_b}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { act_h: "$.data.actual_hours", prov_h: "$.data.provisional_hours", util_f: "$.data.utilization_final_pct", util_p: "$.data.utilization_provisional_pct" } }
          assert:
            - "Engagement.${eng}.actual_hours == 10.0 and provisional_hours == 30.0"
            - "Engagement.${eng}.utilization_final_pct == 10.0"
            - "Engagement.${eng}.utilization_provisional_pct == 30.0"
            - "utilization_provisional_pct (30.0) != utilization_final_pct (10.0) for identical underlying data"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_tiered_recency_with_cap
        grounds:
          - calculations.engagement_priority_score
          - entities.Engagement.fields.priority_score
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (risk score, recency months tier,
          scrutiny flag) with non-linear interaction (tiered recency breakpoints at
          12/24/36 months plus a min() cap at 100). Entity A at exactly 36 months
          recency (boundary >=) yields 72+30=102 capped to 100; entity B at 35
          months yields 72+20=92 uncapped.
        test_recipe:
          setup:
            - "Clock 2026-01-15; entity A last audited 2023-01-15 (exactly 36 months); entity B last audited 2023-02-15 (35 months); both with FINALIZED risk L=3,I=4 (score 72); plan DRAFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity A", business_owner: "Owner A", last_audit_completed_at: "2023-01-15T00:00:00Z" }, as: AuditAdmin, captures: { ent_a: "$.data.id", ent_a_v: "$.data.version" } }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity B", business_owner: "Owner B", last_audit_completed_at: "2023-02-15T00:00:00Z" }, as: AuditAdmin, captures: { ent_b: "$.data.id", ent_b_v: "$.data.version" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent_a}", fiscal_year: 2026, likelihood: 3, impact: 4, expected_auditable_entity_version: "${ent_a_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra_a: "$.data.id" } }
            - { call: "POST /audit/risk-assessments/${ra_a}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent_b}", fiscal_year: 2026, likelihood: 3, impact: 4, expected_auditable_entity_version: "${ent_b_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra_b: "$.data.id" } }
            - { call: "POST /audit/risk-assessments/${ra_b}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
          trigger:
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent_a}", title: "Eng A", scope_summary: "s", budget_hours: 80, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng_a: "$.data.id", prio_a: "$.data.priority_score" } }
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent_b}", title: "Eng B", scope_summary: "s", budget_hours: 80, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng_b: "$.data.id", prio_b: "$.data.priority_score" } }
          assert:
            - "Engagement.${eng_a}.priority_score == 100 (72 + 30 recency at exactly 36 months, capped by min(100, 102))"
            - "Engagement.${eng_b}.priority_score == 92 (72 + 20 recency at 35 months, below the 36-month tier)"
            - "AuditPlan.${plan}.version == 3 after two engagement creations (OCC-visible mutations)"

      - name: hours_rollup_per_item_rounding_order
        grounds:
          - calculations.engagement_hours_rollup
          - entities.Engagement.fields.actual_hours
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct mode from the tiered-formula
          instance): the scaffold pins round-per-item-then-sum — three workpapers
          of 1.1 hours each yield ceil(1.1*2)/2 = 1.5 per item, summed to 4.5;
          the rejected sum-then-round order would yield 3.5.
        test_recipe:
          setup:
            - "Clock 2026-01-15; plan APPROVED; engagement (budget 1000) in FIELDWORK with LEAD mgr1 and STAFF staff1; three workpapers of 1.1 hours, each submitted and signed off"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity R", business_owner: "Owner R" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng R", scope_summary: "s", budget_hours: 1000, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 100 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 100 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/begin-fieldwork", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
          trigger:
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "W-1", title: "WP1", hours_worked: 1.1 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp1: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp1}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp1}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "W-2", title: "WP2", hours_worked: 1.1 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp2: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp2}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp2}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "W-3", title: "WP3", hours_worked: 1.1 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp3: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp3}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp3}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { act_h: "$.data.actual_hours", cnt: "$.data.signed_off_workpaper_count" } }
          assert:
            - "Engagement.${eng}.actual_hours == 4.5 (1.5 + 1.5 + 1.5; per-item rounding pinned before summation)"
            - "Engagement.${eng}.actual_hours != 3.5 (the sum-then-round alternative is explicitly not used)"
            - "Engagement.${eng}.signed_off_workpaper_count == 3"

  - rule_id: non_linear_state_machine
    instances:
      - name: finding_response_negotiation_cycle
        grounds:
          - state_machines.Finding.REBUTTED_to_UNDER_REVIEW
          - state_machines.Finding.UNDER_REVIEW_to_REBUTTED
          - state_machines.ManagementResponse.SUBMITTED_to_REBUTTED
        distinguishing_aspect: |
          Cyclic machine on Finding: PENDING_RESPONSE -> UNDER_REVIEW -> REBUTTED
          -> (fresh response) -> UNDER_REVIEW -> AGREED, with negotiation_rounds
          incrementing per rebuttal; the cycle is exercised, not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-01-15; ACTIVE rating config (20/12/6); plan APPROVED; engagement in FIELDWORK with LEAD mgr1 and STAFF staff1; finding (L=4,I=5) created by staff1 and issued by mgr2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity N", business_owner: "Owner N" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mike Mgr2", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr2: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/rating-criteria-configs", payload: { name: "std", critical_min: 20, high_min: 12, moderate_min: 6 }, as: AuditAdmin, captures: { cfg: "$.data.id" } }
            - { call: "POST /audit/rating-criteria-configs/${cfg}/activate", payload: {}, as: AuditAdmin }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng N", scope_summary: "s", budget_hours: 100, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/begin-fieldwork", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/findings", payload: { engagement_id: "${eng}", title: "Control gap", likelihood: 4, impact: 5 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { f: "$.data.id" } }
            - { call: "POST /audit/findings/${f}/issue", payload: {}, as: AuditManager, as_user_id: "${mgr2}" }
            - { call: "POST /audit/management-responses", payload: { finding_id: "${f}", response_text: "Will fix by Q3", proposed_due_date: "2026-09-01T00:00:00Z" }, as: ManagementOwner, as_user_id: "mgmt-1", captures: { resp1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/management-responses/${resp1}/rebut", payload: { rebuttal_note: "Insufficient evidence" }, as: AuditManager, as_user_id: "${mgr2}" }
            - { call: "POST /audit/management-responses", payload: { finding_id: "${f}", response_text: "Revised plan attached", proposed_due_date: "2026-08-01T00:00:00Z" }, as: ManagementOwner, as_user_id: "mgmt-1", captures: { resp2: "$.data.id" } }
            - { call: "POST /audit/management-responses/${resp2}/accept", payload: {}, as: AuditManager, as_user_id: "${mgr2}" }
          assert:
            - "ManagementResponse.${resp1}.status == REBUTTED"
            - "Finding.${f}.status == AGREED after the second response is accepted"
            - "Finding.${f}.negotiation_rounds == 1 (exactly one rebuttal traversed the cycle)"
            - "ManagementResponse.${resp2}.status == ACCEPTED"

      - name: workpaper_return_revise_review_loop
        grounds:
          - state_machines.Workpaper.RETURNED_to_DRAFT
          - state_machines.Workpaper.SUBMITTED_to_RETURNED
        distinguishing_aspect: |
          Cyclic machine on Workpaper (different entity than the Finding cycle):
          DRAFT -> SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED -> SIGNED_OFF, with
          the derived signed_off_workpaper_count settling at 1 after the loop.
        test_recipe:
          setup:
            - "Clock 2026-01-15; plan APPROVED; engagement in FIELDWORK with LEAD mgr1 and STAFF staff1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity W", business_owner: "Owner W" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mike Mgr2", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr2: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
