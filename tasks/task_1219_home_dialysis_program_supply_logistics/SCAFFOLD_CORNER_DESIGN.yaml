      - name: maintenance_due_boundary_500_hours
        claim_type: boundary_edge
        grounds: [calculations.maintenance_due, entities.DialysisMachine.fields.maintenance_due, entities.DialysisMachine.fields.total_runtime_hours, "errors[ERR_MACHINE_MAINTENANCE_DUE]"]
        distinguishing_aspect: "Threshold boundary on runtime hours: 49 logs x 600 min = 490.0h leaves maintenance_due false; the 50th log lands exactly on 500.0h and >= makes it due; a due machine cannot be assigned to another patient."
        test_recipe:
          setup:
            - "ACTIVE_HOME patient with assigned machine M1 (no prior maintenance); 49 zero-consumption logs of 600 minutes each on distinct dates 2026-05-01..2026-06-18; clock 2026-06-19T12:00:00Z"
