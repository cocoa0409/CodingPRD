      - name: device_kit_components_subresource_returns_only_that_kits_components
        claim_type: cross_reference_link
        grounds:
          - entities.DeviceComponent.fields.kit_id
          - entities.DeviceKit.fields.component_count
        distinguishing_aspect: "GET /device-kits/{id}/components is the FK reverse-reachability channel for DeviceComponent.kit_id and never leaks components of a sibling kit."
        test_recipe:
          setup:
            - "Two DeviceKits; the first carries two components and the second carries one."
          setup_api_calls:
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-S1" }
              as: ProgramAdmin
              captures: { kit_s1: $.data.id }
            - call: "POST /device-kits"
              payload: { asset_tag: "KIT-S2" }
              as: ProgramAdmin
              captures: { kit_s2: $.data.id }
            - call: "POST /device-kits/${kit_s1}/components"
              payload: { component_type: "TABLET", serial_number: "SN-S1A", replacement_cost_usd: 450.00 }
              as: ProgramAdmin
              captures: { comp_s1a: $.data.id }
            - call: "POST /device-kits/${kit_s1}/components"
              payload: { component_type: "PULSE_OX", serial_number: "SN-S1B", replacement_cost_usd: 65.00 }
              as: ProgramAdmin
              captures: { comp_s1b: $.data.id }
            - call: "POST /device-kits/${kit_s2}/components"
              payload: { component_type: "SCALE", serial_number: "SN-S2A", replacement_cost_usd: 120.00 }
              as: ProgramAdmin
              captures: { comp_s2a: $.data.id }
          trigger:
            - call: "GET /device-kits/${kit_s1}/components"
              payload: {}
              as: ProgramAdmin
            - call: "GET /device-kits/${kit_s2}/components"
              payload: { reconciliation_status: "IN_STOCK" }
              as: ProgramAdmin
          assert:
            - "the first read returns exactly 2 components with total_count == 2 and their ids are ${comp_s1a} and ${comp_s1b}"
            - "the first read does NOT contain ${comp_s2a}"
            - "the second read returns exactly 1 component with total_count == 1"
            - "DeviceKit.${kit_s1}.component_count == 2 and DeviceKit.${kit_s2}.component_count == 1"
            - "DeviceComponent.${comp_s1a}.reconciliation_status == IN_STOCK"

