        claim_type: authentication
        grounds: [validations.priority_10_ERR_UNAUTHENTICATED, roles]
        distinguishing_aspect: "Authentication is evaluated before existence and before role membership, so an absent header, an absent user id and a role string outside the declared seven all return 401 even when the rest of the request is nonsense."
        test_recipe:
