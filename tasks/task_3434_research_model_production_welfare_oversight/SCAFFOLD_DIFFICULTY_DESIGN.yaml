            - call: "POST /api/allocations"
              payload: { order_id: "${ord_id}", cohort_id: "${coh_id}", qty_male: 4, qty_female: 4, expected_order_version: "${o_v2}" }
              as: FacilityManager
              captures: { alloc_id: $.data.id }
