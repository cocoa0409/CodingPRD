scaffold_corner_design:
  # ===================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_draft_defaults
        claim_type: Creation
        grounds: ["entities.Project.fields.status", "endpoints"]
        distinguishing_aspect: "POST /projects with site_name+client_name -> 201; status==DRAFT, version==1, base_contract_amount==0.00, warranty_risk_score==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { site_name: "Fresh", client_name: "Acme" }
              as: Estimator
              captures: { pid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Project.status == DRAFT"
            - "Project.version == 1"
            - "Project.base_contract_amount == 0.00"
            - "Project.warranty_risk_score == 0"

      - name: get_project_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: list_projects_paginated_envelope
        claim_type: Listing
        grounds: ["endpoints", "response_envelope"]
        distinguishing_aspect: "GET /projects returns response_type==array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two projects created."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "L1", client_name: "A" }
              as: Estimator
            - call: "POST /projects"
              payload: { site_name: "L2", client_name: "B" }
              as: Estimator
          trigger:
            - call: "GET /projects"
              payload: { limit: 1, offset: 0 }
              as: Estimator
          assert:
            - "response status == 200"
            - "response_type == array"
            - "data.total_count == 2 and data.has_more == true"

      - name: create_segment_missing_area_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.FlatworkSegment.fields.area_sqft"]
        distinguishing_aspect: "POST /projects/{id}/segments without area_sqft -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A DRAFT project."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Seg X", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", thickness_in: 4 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_segment_zero_area_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "entities.FlatworkSegment.fields.area_sqft"]
        distinguishing_aspect: "area_sqft == 0 violates the >0 constraint -> 422 ERR_INVALID_REQUEST (zero-quantity boundary)."
        test_recipe:
          setup: ["A DRAFT project."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Seg Z", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 0, thickness_in: 4 }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_segment_bad_finish_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "entities.FlatworkSegment.fields.finish_grade"]
        distinguishing_aspect: "finish_grade not in {BROOM, EXPOSED_AGGREGATE, STAMPED} -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A DRAFT project."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Seg E", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 100, thickness_in: 4, finish_grade: "GLOSS" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: segment_finish_defaults_to_broom
        claim_type: Defaults
        grounds: ["entities.FlatworkSegment.fields.finish_grade", "entities.FlatworkSegment.fields.reinforcement"]
        distinguishing_aspect: "Omitting finish_grade and reinforcement applies defaults BROOM and NONE respectively."
        test_recipe:
          setup: ["A DRAFT project."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Seg D", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 100, thickness_in: 4 }
              as: Estimator
              captures: { fg: $.data.finish_grade, rf: $.data.reinforcement }
          assert:
            - "FlatworkSegment.finish_grade == BROOM"
            - "FlatworkSegment.reinforcement == NONE"

      - name: estimate_id_and_computed_fields_are_system_minted
        claim_type: System Fields
        grounds: ["entities.Estimate.fields.estimate_total", "entities.Estimate.fields.provisional_cubic_yards"]
        distinguishing_aspect: "POST /projects/{id}/estimates ignores any client-supplied estimate_total; server recomputes id/created_at and all computed fields."
        test_recipe:
          setup: ["A DRAFT project with one 400@4 BROOM/NONE segment."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Sys", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4 }
              as: Estimator
          trigger:
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { et: $.data.estimate_total }
          assert:
            - "Estimate.estimate_total == 4470.00"
            - "Estimate.id is a server-minted UUID"

      - name: weather_reading_immutable_no_version
        claim_type: Immutability
        grounds: ["entities.WeatherReading"]
        distinguishing_aspect: "WeatherReading has common_fields:false; created reading carries id+created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["A project APPROVED with an ORDERED material order."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "WR", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { eid: $.data.id }
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v0: $.data.version }
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "${eid}", expected_project_version: "${v0}" }
              as: ProjectManager
            - call: "POST /projects/${pid}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-07-01T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo: $.data.id }
          trigger:
            - call: "POST /material-orders/${mo}/weather-readings"
              payload: { reading_at: "2026-07-01T12:30:00Z", temp_f: 70, precip_pct: 5 }
              as: ProjectManager
              captures: { wid: $.data.id }
          assert:
            - "response status == 201"
            - "WeatherReading response has id and created_at, no version field"

  # ===================================================================
  - section: state_machines
    instances:
      - name: approve_estimate_from_draft_project_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Project.transitions.ESTIMATING_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /projects/{id}/approve-estimate while project is DRAFT (no estimate yet) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT project with a segment but no estimate."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "IS", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 100, thickness_in: 4 }
              as: Estimator
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "00000000-0000-4000-8000-000000000001", expected_project_version: "${pv}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: estimate_requires_at_least_one_segment
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Project.transitions.DRAFT_to_ESTIMATING"]
        distinguishing_aspect: "POST /projects/{id}/estimates on a project with zero FlatworkSegments fails the >=1 segment precondition -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT project with NO segments."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "NoSeg", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_project_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.Project.initial_state"]
        distinguishing_aspect: "A freshly created Project starts in DRAFT."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { site_name: "Init", client_name: "A" }
              as: Estimator
              captures: { st: $.data.status }
          assert:
            - "Project.status == DRAFT"

      - name: reject_terminal_lockdown_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Project.transitions.ESTIMATING_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After ESTIMATING->REJECTED, POST /projects/{id}/schedule from REJECTED is rejected ERR_INVALID_STATE (terminal)."
        test_recipe:
          setup: ["A REJECTED project (created, segment, estimate, rejected)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Rej", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 100, thickness_in: 4 }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
            - call: "POST /projects/${pid}/reject"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${pid}/schedule"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: material_order_cancel_then_start_pour_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.MaterialOrder.transitions.ORDERED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED material order cannot be started: POST /material-orders/{id}/start-pour -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A project APPROVED with an ORDERED material order that is then CANCELLED."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Cxl", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { eid: $.data.id }
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v0: $.data.version }
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "${eid}", expected_project_version: "${v0}" }
              as: ProjectManager
            - call: "POST /projects/${pid}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-07-01T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo: $.data.id }
            - call: "POST /material-orders/${mo}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /material-orders/${mo}/start-pour"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_releases_booked_crew_cascade
        claim_type: Side Effect Execution
        grounds: ["state_machines.Project.transitions.CURING_to_COMPLETED", "state_machines.CrewAssignment.transitions.BOOKED_to_RELEASED"]
        distinguishing_aspect: "Project CURING->COMPLETED releases all BOOKED crew assignments to RELEASED (cascade-down)."
        test_recipe:
          setup: ["A CURING project (HIGH_EARLY pour completed) with one BOOKED crew assignment and an ACTIVE warranty; clock past cure_window_end."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Done", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { eid: $.data.id }
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v0: $.data.version }
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "${eid}", expected_project_version: "${v0}" }
              as: ProjectManager
            - call: "POST /projects/${pid}/permits"
              payload: { jurisdiction: "City", permit_number: "P-7" }
              as: ProjectManager
              captures: { perm: $.data.id }
            - call: "POST /permits/${perm}/issue"
              payload: {}
              as: Inspector
            - call: "POST /projects/${pid}/material-orders"
              payload: { mix_type: "HIGH_EARLY", pour_scheduled_start: "2026-06-01T06:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C10", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew: $.data.id }
            - call: "POST /projects/${pid}/crew-assignments"
              payload: { crew_id: "${crew}", window_start: "2026-06-01T06:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ProjectManager
              captures: { ca: $.data.id }
            - call: "POST /projects/${pid}/warranties"
              payload: { term_months: 12 }
              as: ProjectManager
            - call: "POST /projects/${pid}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo}/start-pour"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo}/complete-pour"
              payload: { completed_at: "2026-06-01T10:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${pid}/begin-cure"
              payload: {}
              as: ProjectManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${pid}/complete"
              payload: {}
              as: ProjectManager
            - call: "GET /projects/${pid}/crew-assignments"
              payload: {}
              as: ProjectManager
              captures: { ca_status: "$.data[0].status" }
          assert:
            - "Project.${pid}.status == COMPLETED"
            - "CrewAssignment.${ca}.status == RELEASED"

      - name: depth3_cascade_already_covered
        claim_type: Side Effect Execution
        grounds: ["state_machines.MaterialOrder.transitions.POURING_to_POURED"]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_pour_depth3_cascade
          rationale: "The MaterialOrder->Project->warranty_risk_score depth-3 cascade is asserted by the named §1.8 instance."

  # ===================================================================
  - section: calculations
    instances:
      - name: cure_window_standard_168h
        claim_type: Correct Result
        grounds: ["calculations.cure_window_end", "entities.MaterialOrder.fields.cure_window_end"]
        distinguishing_aspect: "STANDARD mix poured at 2026-06-01T12:00:00Z yields cure_window_end == 2026-06-08T12:00:00Z (168h)."
        test_recipe:
          setup: ["A SCHEDULED project with a STANDARD material order in POURING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /projects"
              payload: { site_name: "Cure168", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4, reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { eid: $.data.id }
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v0: $.data.version }
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "${eid}", expected_project_version: "${v0}" }
              as: ProjectManager
            - call: "POST /projects/${pid}/permits"
              payload: { jurisdiction: "City", permit_number: "P-8" }
              as: ProjectManager
              captures: { perm: $.data.id }
            - call: "POST /permits/${perm}/issue"
              payload: {}
              as: Inspector
            - call: "POST /projects/${pid}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-06-01T06:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
              captures: { mo: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "C11", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew: $.data.id }
            - call: "POST /projects/${pid}/crew-assignments"
              payload: { crew_id: "${crew}", window_start: "2026-06-01T06:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${pid}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /material-orders/${mo}/start-pour"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /material-orders/${mo}/complete-pour"
              payload: { completed_at: "2026-06-01T12:00:00Z" }
              as: ProjectManager
              captures: { cwe: $.data.cure_window_end }
          assert:
            - "MaterialOrder.${mo}.cure_window_end == 2026-06-08T12:00:00Z"

      - name: estimate_exposed_aggregate_finish_multiplier
        claim_type: Constants Applied
        grounds: ["calculations.estimate_total", "entities.FlatworkSegment.fields.finish_grade"]
        distinguishing_aspect: "A single 400@4 EXPOSED_AGGREGATE/MESH segment: labor_subtotal == round(3600*1.20 + 0.60*400,2) == 4560.00; material 870.00; estimate_total == 5430.00."
        test_recipe:
          setup: ["A DRAFT project with one 400@4 EXPOSED_AGGREGATE/MESH segment."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "EA", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "s", area_sqft: 400, thickness_in: 4, finish_grade: "EXPOSED_AGGREGATE", reinforcement: "MESH" }
              as: Estimator
          trigger:
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { ls: $.data.labor_subtotal, ms: $.data.material_subtotal, et: $.data.estimate_total }
          assert:
            - "Estimate.labor_subtotal == 4560.00"
            - "Estimate.material_subtotal == 870.00"
            - "Estimate.estimate_total == 5430.00"

      - name: committed_chronological_order_two_approved
        claim_type: Correct Result
        grounds: ["calculations.committed_contract_value", "entities.Project.fields.committed_contract_value"]
        distinguishing_aspect: "Two APPROVED change orders (+1500.00 created first, +800.50 created second) summed created_at ASC give committed_contract_value == base + 2300.50."
        test_recipe:
          setup: ["An APPROVED project (base 12452.50) with two APPROVED change orders +1500.00 then +800.50, approved by fin_2 (different from any draw releaser)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { site_name: "Chron", client_name: "A" }
              as: Estimator
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/segments"
              payload: { label: "driveway", area_sqft: 600, thickness_in: 4, finish_grade: "BROOM", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/segments"
              payload: { label: "patio", area_sqft: 240, thickness_in: 5, finish_grade: "STAMPED", reinforcement: "REBAR" }
              as: Estimator
            - call: "POST /projects/${pid}/estimates"
              payload: {}
              as: Estimator
              captures: { eid: $.data.id }
            - call: "GET /projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v0: $.data.version }
            - call: "POST /projects/${pid}/approve-estimate"
              payload: { estimate_id: "${eid}", expected_project_version: "${v0}" }
              as: ProjectManager
            - call: "POST /projects/${pid}/change-orders"
              payload: { description: "co1", delta_amount: 1500.00 }
              as: FinanceOfficer
              as_user_id: "fin_2"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/start-review"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_2"
            - call: "GET /projects/${pid}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin_2"
              captures: { v1: $.data.version }
            - call: "POST /change-orders/${co1}/approve"
              payload: { expected_project_version: "${v1}" }
              as: FinanceOfficer
              as_user_id: "fin_2"
            - call: "POST /projects/${pid}/change-orders"
              payload: { description: "co2", delta_amount: 800.50 }
              as: FinanceOfficer
