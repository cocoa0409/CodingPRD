      - name: the_same_user_cannot_record_specimens_and_sign_the_certification
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=59]
          - entities.ThermalTest.fields.recorded_by_user_id
          - entities.ProductLine.fields.certified_by_user_id
          - state_machines[ProductLine.certification_status].transitions[PENDING_CERTIFICATION->CERTIFIED]
        distinguishing_aspect: "The bar is on the HUMAN, not on the role. The X-User-ID that recorded the specimens may hold the CertificationOfficer role as well and still cannot sign the SKU it measured; the identical payload from a different officer is accepted. This is only observable because recorded_by_user_id is stamped from the recording request's header rather than from the requesting role."
