        distinguishing_aspect: "The ops sweep applies the time-driven expiry: memo past valid_until_date -> EXPIRED, and the artist bubbles back IN_NEGOTIATION -> SCOUTED when no other open memo or contract exists."
        test_recipe:
          setup: ["Label; artist; memo PROPOSED with valid_until_date 2026-08-10; clock advanced to 2026-08-11"]
          setup_api_calls:
            - { call: "POST /api/labels", payload: { name: "Label S6" }, as: LabelAdmin, captures: { label_id: $.data.id } }
            - { call: "POST /api/artists", payload: { label_id: "${label_id}", stage_name: "Artist S6", genre: "POP", birth_date: "1995-04-12", monthly_streams: 600000, social_followers: 800000, engagement_rate: 0.5, live_draw_avg: 1000 }, as: AnRManager, captures: { artist_id: $.data.id } }
            - { call: "POST /api/artists/${artist_id}/deal-memos", payload: { advance_cents: 50000, base_royalty_rate_bps: 2000, recoupment_scope: "MASTER_ONLY", promo_costs_recoupable: false, options_total: 0, option_term_months: 12, option_escalation_bps: 0, term_months: 12, valid_until_date: "2026-08-10" }, as: AnRManager, captures: { memo_id: $.data.id } }
