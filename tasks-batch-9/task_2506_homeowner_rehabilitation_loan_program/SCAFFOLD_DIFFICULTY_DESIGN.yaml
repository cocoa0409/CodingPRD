  - rule_id: transitive_cascade
    instances:
      - name: contractor_suspension_cascades_four_hops_to_a_failed_application
        grounds:
          - state_machines.Contractor.APPROVED_to_SUSPENDED
          - state_machines.Bid.RESPONSIVE_to_WITHDRAWN_BY_PROGRAM
          - state_machines.BidSolicitation.TABULATED_to_FAILED
          - state_machines.RehabApplication.BID_OPEN_to_BID_FAILED
          - endpoints.POST_/rehab/contractors/{contractor_id}/status.side_effects
        distinguishing_aspect: |
          Depth-4 chain off a single administrative write, where each hop is caused strictly by the
          previous one: hop 1 sets Contractor.approved_list_status = SUSPENDED, which is the only
          reason the RESPONSIVE Bid moves to WITHDRAWN_BY_PROGRAM (hop 2); that withdrawal is the
          only reason responsive_bid_count falls to 0 and the TABULATED solicitation moves to FAILED
          (hop 3); the solicitation failing is the only reason the RehabApplication leaves BID_OPEN
          for BID_FAILED (hop 4). Trigger endpoint is the contractor status write.
        test_recipe:
          setup:
            - "one APPROVED contractor with exactly one live bid in the system"
