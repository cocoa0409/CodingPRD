      - name: compartment_cap_allows_exactly_half
        claim_type: correct_result
        grounds:
          - calculations.component_coverage
          - errors.ERR_COMPARTMENT_SCOPE_EXCEEDED
        distinguishing_aspect: "The compartmentalization cap is inclusive at half: on a 4-component formulation a manufacturer may hold a 2-component union (2*2 <= 4) but a third component breaches it (3*2 > 4)."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Brand, line, SEALED 4-component formulation; mfr1 and mfr2 QUALIFIED."
          setup_api_calls:
            - *k_brand
            - *k_mfr1
            - *k_mfr1q
            - *k_mfr2
            - *k_mfr2q
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_g1
            - *k_g1g
          trigger:
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C3"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "SECOND_SOURCE" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g_over_id: $.data.id }
            - call: "POST /brand-ops/confidentiality-grants/${g_over_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id: $.data.error_id }
            - *k_g2
            - *k_g2g
          assert:
            - "granting {C1, C2} to mfr1 succeeded: the union of 2 components is exactly half of 4 and is allowed"
            - "granting an additional {C3} to mfr1 fails 422 with error_id == ERR_COMPARTMENT_SCOPE_EXCEEDED (union would be 3 > 2)"
            - "Grant.${g_over_id} remains REQUESTED (the failed grant action did not advance it)"
            - "granting {C3, C4} to mfr2 succeeds (the cap is per manufacturer, not global)"

