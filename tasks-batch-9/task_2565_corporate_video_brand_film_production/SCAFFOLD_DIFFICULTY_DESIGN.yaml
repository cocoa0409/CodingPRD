              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { bk_d: $.data.id }
          assert:
            - "The day B booking returns HTTP 409 with data.error_id == ERR_CREW_DOUBLE_BOOKED, because its 16:00Z start touches the day A booking's 16:00Z wrap on a closed interval"
            - "The day C booking returns HTTP 422 with data.error_id == ERR_CREW_TURNAROUND_VIOLATION: the gap from 2026-09-10T16:00Z to 2026-09-11T00:30Z is 8.5 hours against a 10-hour minimum"
            - "The day D booking returns HTTP 201 with cost_cents == 50000: the gap from 16:00Z to 02:00Z is exactly 10 hours and equality passes"
            - "GET /crew-bookings with crew_member_id ${crew_key} returns total_count == 2, holding only ${bk_a} and ${bk_d}"
            - "Project.${proj}.provisional_cost_cents == 200000 (the 100000 line plus the two 50000 bookings) and committed_cost_cents == 0"

      - name: location_stage_capacity_aggregate_with_touching_days_permitted
        grounds:
          - validations[priority=37]
          - entities.Location.fields.stage_count
          - entities.Location.fields.scheduled_shoot_day_count
        distinguishing_aspect: |
          Capacity is an AGGREGATE count of concurrently overlapping shoot days against stage_count, and
          it is measured on HALF-OPEN [call_time, wrap_time) intervals: two same-window days fit on a
          2-stage location, the third is refused, and a fourth day starting at the exact wrap instant of
          the others is accepted because touching intervals do not overlap under this convention.
        test_recipe:
          setup:
            - "A SCOPED project with a 50000000-cent ceiling"
            - "One location with stage_count 2"
            - "Two PLANNED shoot days already booked on 2026-09-10 from 06:00Z to 16:00Z, filling both stages"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Loomis Dairy", campaign_title: "Morning Route", creative_brief_summary: "Two-unit OLV brand film shot on a two-stage location.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Morning Route 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "LOCATION", description: "Two-stage hold", quantity: 1, unit_rate_cents: 100000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Dairy Barn Stages", address: "9 Creamery Lane, Salem", stage_count: 2, daily_fee_cents: 90000, insurance_minimum_cents: 50000000, permit_authority: "Salem Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day_a: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day_b: $.data.id }
          trigger:
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T12:00:00Z", wrap_time: "2026-09-10T20:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T16:00:00Z", wrap_time: "2026-09-11T02:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day_d: $.data.id }
          assert:
            - "The 12:00Z-20:00Z day returns HTTP 409 with data.error_id == ERR_LOCATION_CAPACITY_EXCEEDED: it overlaps both existing days, so the concurrent count would reach 3 against stage_count 2"
            - "The 16:00Z-2026-09-11T02:00Z day returns HTTP 201, because [16:00, 02:00) only touches [06:00, 16:00) and does not overlap it"
            - "Location.${loc}.scheduled_shoot_day_count == 3, counting ${day_a}, ${day_b} and ${day_d}"
            - "GET /shoot-days with location_id ${loc} returns total_count == 3 with every row in status PLANNED"

  - rule_id: compensating_invariant
    instances:
      - name: crew_booking_release_reverses_the_exact_committed_credit
        grounds:
          - state_machines.CrewBooking.CONFIRMED_to_RELEASED
          - calculations.project_cost_ledger
          - calculations.budget_line_extended_cents
          - entities.ShootDay.fields.confirmed_crew_count
        distinguishing_aspect: |
          Releasing a CONFIRMED booking must debit exactly the cost_cents that confirmation credited, so
          both ledger variants and budget_variance_cents return to their pre-confirmation values with no
          one-cent drift against the awkward 23887-cent baseline, and the shoot day's confirmed_crew_count
          unwinds with them. This is a MONEY-and-count compensation on a booking, distinct from the
          entitlement compensation on a voided change order.
        test_recipe:
          setup:
            - "An IN_PRODUCTION project whose single budget line is quantity 2 at 11110 cents with markup_pct 0.075, so extended_cents is 23887 and approved_budget_cents was snapshotted at 23887"
            - "A budget_ceiling_cents of 100000, so the post-approval allowance of 105000 accommodates the booking"
            - "One location, one PLANNED shoot day on 2026-09-10 from 06:00Z to 16:00Z, and one grip at 5000 cents an hour"
            - "A CONFIRMED 10-hour booking on that day costing 50000 cents"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Alder & Finch", campaign_title: "Small Batch", creative_brief_summary: "One-day OLV brand film with a tiny committed budget.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 100000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Small Batch 45", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 45, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "CREW", description: "Grip day rate, two units", quantity: 2, unit_rate_cents: 11110, markup_pct: 0.075 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { line_1: $.data.id }
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 23887 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /locations"
              payload: { name: "Alder Street Kitchen", address: "22 Alder Street, Eugene", stage_count: 1, daily_fee_cents: 40000, insurance_minimum_cents: 50000000, permit_authority: "Eugene Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Sasha Bell", department: "GRIP_ELECTRIC", hourly_rate_cents: 5000, min_turnaround_hours: 10 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { crew_key: $.data.id }
            - call: "POST /crew-bookings"
              payload: { shoot_day_id: "${day1}", crew_member_id: "${crew_key}", department_role: "Key Grip", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T16:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { bk_1: $.data.id }
            - call: "POST /crew-bookings/${bk_1}/confirm"
              payload: {}
              as: ProductionCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /crew-bookings/${bk_1}/release"
              payload: { release_reason: "Client cut the grip package after the tech scout." }
              as: ProductionCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before the release Project.${proj}.provisional_cost_cents == 73887, committed_cost_cents == 73887 and budget_variance_cents == 50000"
            - "The release returns HTTP 200 and CrewBooking.${bk_1}.status == RELEASED with cost_cents still frozen at 50000"
            - "After the release Project.${proj}.provisional_cost_cents == 23887 and committed_cost_cents == 23887, exactly the pre-confirmation values"
            - "After the release Project.${proj}.budget_variance_cents == 0 against approved_budget_cents 23887, with no one-cent drift from the 0.075 markup"
            - "ShootDay.${day1}.confirmed_crew_count == 0 and compliance_posture == BLOCKED (no permit was ever filed)"
            - "GET /crew-bookings with shoot_day_id ${day1} still returns total_count == 1, so the row was released rather than deleted"

      - name: change_order_void_restores_entitlement_and_reblocks_submission
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - calculations.round_entitlement_balance
          - calculations.project_cost_ledger
          - validations[priority=38]
        distinguishing_aspect: |
          Voiding an APPROVED change order must reverse BOTH conserved quantities it created — the money
          (committed and provisional each fall by amount_cents) and the round entitlement (granted_extra_rounds
          and round_entitlement_balance fall back), and the proof that the entitlement really came back is
          that the next submit is refused again with ERR_REVISION_ROUNDS_EXHAUSTED. Reversal of a granted
          COUNT, not merely of a credited amount.
        test_recipe:
          setup:
            - "A project with contracted_revision_rounds 1, one 2000000-cent post line, scope-locked and budget-approved at 2000000, so it is IN_PRODUCTION"
            - "Deliverable A with one QC_PASSED cut that was submitted (round_index 1) and then sent back with REQUEST_CHANGES by client-1, consuming the single contracted round"
            - "The resulting REVISION_ROUND_EXCEEDED change order for 566400 cents (labor 480000, 122 days to air so rush 0, subtotal 480000 in the 18% band, fee 86400) granting 1 additional round, APPROVED by client-2"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Ferro Steel", campaign_title: "One Pass", creative_brief_summary: "OLV brand film contracted with a single client review round.", channel_scope: ["OLV"], usage_term_months: 12, contracted_revision_rounds: 1, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "One Pass 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv_a: $.data.id, dlv_a_v1: $.data.version }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST_PRODUCTION", description: "Offline and online edit", quantity: 1, unit_rate_cents: 2000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv_a}", expected_deliverable_version: "${dlv_a_v1}", cut_label: "One Pass v1", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.2 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_1: $.data.id }
            - call: "POST /deliverable-versions/${ver_1}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver_1}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver_1}/review-decision"
              payload: { decision: "REQUEST_CHANGES", review_note: "Recut the opening and drop the voiceover." }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "GET /deliverables/${dlv_a}/change-orders"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
              captures: { co_1: "$.data[0].id" }
            - call: "POST /change-orders/${co_1}/decision"
              payload: { decision: "APPROVE", decision_note: "Client buys the extra round." }
              as: ClientApprover
              as_user_id: "client-2"
          trigger:
            - call: "POST /change-orders/${co_1}/decision"
              payload: { decision: "VOID", decision_note: "Client withdrew the extra round before work started." }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "GET /deliverables/${dlv_a}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_a_v2: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv_a}", expected_deliverable_version: "${dlv_a_v2}", cut_label: "One Pass v2", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 9.4, supersedes_version_id: "${ver_1}" }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver_2: $.data.id }
            - call: "POST /deliverable-versions/${ver_2}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver_2}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "Before the void ChangeOrder.${co_1}.amount_cents == 566400 with additional_rounds_granted == 1, Project.${proj}.committed_cost_cents == 2566400 and provisional_cost_cents == 2566400"
            - "Before the void Deliverable.${dlv_a}.granted_extra_rounds == 1, round_entitlement == 2, consumed_review_rounds == 1, and Project.${proj}.round_entitlement_balance == 1"
            - "The void returns HTTP 200 and ChangeOrder.${co_1}.status == VOIDED"
            - "After the void Project.${proj}.committed_cost_cents == 2000000, provisional_cost_cents == 2000000 and budget_variance_cents == 0"
            - "After the void Deliverable.${dlv_a}.granted_extra_rounds == 0, round_entitlement == 1 and Project.${proj}.round_entitlement_balance == 0"
            - "The v2 submit returns HTTP 409 with data.error_id == ERR_REVISION_ROUNDS_EXHAUSTED, because consumed_review_rounds 1 is no longer strictly less than the restored entitlement of 1"
            - "DeliverableVersion.${ver_2}.review_status stays DRAFT and Deliverable.${dlv_a}.status stays CHANGES_REQUESTED"
