          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "period_code is constrained to ^[0-9]{4}Q[1-4]$ and registrant_type to a three-member enum, so '2026Q5' and 'WHOLESALER' are both 400s while negative unit counts also fail the >= 0 constraint."
