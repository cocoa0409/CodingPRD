      - name: damage_claim_dispute_cycle_downgrades_twice_then_locks
        grounds:
          - "1.2 DamageClaim state machine, shape cyclic, ASSESSED to DISPUTED to ASSESSED loop"
          - "1.5 POST /damage-claims/{claim_id}/disputes and POST /damage-claims/{claim_id}/dispute-resolution"
          - "1.1 DamageClaim.dispute_round, severity, gross_fee_cents, net_fee_cents, resolution"
          - "1.4 validation priority 29 ERR_DISPUTE_ROUNDS_EXHAUSTED with MAX_DISPUTE_ROUNDS 2"
          - "1.3 calculation damage_fee_assessment recomputation after a PARTIAL verdict"
        distinguishing_aspect: >-
          The claim leaves ASSESSED and comes back to it twice, and each pass through the loop changes the persisted
          severity, so the loop is not idempotent: net_fee_cents walks 19200, then 9000, then 2500 because the second
          PARTIAL verdict downgrades from the already-downgraded MODERATE rather than from the original SEVERE. The
          cycle is bounded by dispute_round, so the third dispute is refused with ERR_DISPUTE_ROUNDS_EXHAUSTED while
          the claim stays in ASSESSED rather than advancing. An implementation that recomputes the fee from the
          original inspection severity produces 9000 twice, and one that forgets the bound accepts a third dispute.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4, two certified technicians, style AUR-GOWN-01 (retail_price_cents 48000) and one grade-A size-M unit"
            - "member on SIG4 with waiver_active false"
            - "one turn is completed to inbound receipt and inspected NONE soil / SEVERE damage / condition_grade_after B, which opens a DamageClaim with severity SEVERE"
            - "the claim is assessed but never charged, so the dispute window of validation priority 30 does not apply and outstanding_fee_cents stays 0 throughout"
