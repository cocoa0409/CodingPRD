scaffold_corner_design:

  # =====================================================================
  # Section: entities — field constraints, defaults, computed fields, FK integrity
  # =====================================================================
  - section: entities
    instances:
      - name: cycle_create_defaults_draft_status
        claim_type: field_default_applied
        grounds: [entities.ReviewCycle.fields.status]
        distinguishing_aspect: "A freshly created ReviewCycle has status DRAFT, version 1, and merit_committed_total 0 with no client input for those fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles"
              payload: { name: "FY26", cadence: "ANNUAL", merit_budget_pct: 0.04, equity_refresh_pool: 5000, bell_curve_target: { EXCEEDS: 0.2, MEETS: 0.65, BELOW: 0.15 } }
              as: HrAdmin
              captures: { cyc: $.data.id }
          assert:
            - "201; data.status == DRAFT; data.version == 1; data.merit_committed_total == 0"

      - name: cycle_distribution_tolerance_default
        claim_type: field_default_applied
        grounds: [entities.ReviewCycle.fields.distribution_tolerance]
        distinguishing_aspect: "Omitting distribution_tolerance on create defaults it to 0.05."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles"
              payload: { name: "FY26b", cadence: "SEMI_ANNUAL", merit_budget_pct: 0.05, equity_refresh_pool: 0, bell_curve_target: { MEETS: 1.0 } }
              as: HrAdmin
              captures: { cyc2: $.data.id }
          assert:
            - "201; data.distribution_tolerance == 0.05"

      - name: employee_defaults_is_active_true
        claim_type: field_default_applied
        grounds: [entities.Employee.fields.is_active]
        distinguishing_aspect: "Creating an Employee without is_active defaults it to true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Alice", department: "ENG", hire_date: "2019-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { emp: $.data.id }
          assert:
            - "201; data.is_active == true"

      - name: review_fk_employee_invalid
        claim_type: fk_reference_invalid
        grounds: [entities.Review.fields.employee_id]
        distinguishing_aspect: "Creating a Review whose employee_id references a nonexistent Employee is rejected 404."
        test_recipe:
          setup: ["A cycle and a manager employee"]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { name: "C", cadence: "ANNUAL", merit_budget_pct: 0.04, equity_refresh_pool: 0, bell_curve_target: { MEETS: 1.0 } }
              as: HrAdmin
              captures: { cyc: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Mgr", department: "ENG", hire_date: "2018-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { mgr: $.data.id }
          trigger:
            - call: "POST /reviews"
              payload: { cycle_id: "${cyc}", employee_id: "00000000-0000-0000-0000-000000000000", reviewer_id: "${mgr}", base_salary: 100000 }
              as: HrAdmin
          assert:
            - "404 ERR_NOT_FOUND (employee_id FK does not exist)"

      - name: goal_create_defaults_open
        claim_type: field_default_applied
        grounds: [entities.Goal.fields.status]
        distinguishing_aspect: "A new Goal starts in OPEN status."
        test_recipe:
          setup: ["A DRAFT review with a known reviewer manager"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/goals"
              payload: { title: "Ship X", weight: 0.5 }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "201; data.status == OPEN; GET /reviews/${rev}/goals returns it"

      - name: feedback_create_defaults_pending
        claim_type: field_default_applied
        grounds: [entities.FeedbackRequest.fields.status]
        distinguishing_aspect: "A new FeedbackRequest starts in PENDING status."
        test_recipe:
          setup: ["A review and a rater employee"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/feedback-requests"
              payload: { rater_id: "${rater}", relationship: "PEER" }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "201; data.status == PENDING"

      - name: comp_plan_create_computes_merit
        claim_type: computed_field_correct
        grounds: [entities.CompPlan.fields.merit_amount, calculations.compute_merit_amount]
        distinguishing_aspect: "Creating a CompPlan for a CALIBRATED MEETS review (band merit_pct 0.04) base_salary 120000 sets merit_amount to 4800.00."
        test_recipe:
          setup: ["A CALIBRATED MEETS review base_salary 120000 in a COMP_PLANNING cycle; review version captured as ${rev_v}"]
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { ma: $.data.merit_amount }
          assert:
            - "201; data.merit_pct == 0.04; data.merit_amount == 4800.00"

  # =====================================================================
  # Section: state_machines — valid/invalid transitions, terminal states
  # =====================================================================
  - section: state_machines
    instances:
      - name: cycle_full_lifecycle_to_closed
        claim_type: valid_transition
        grounds: [state_machines.ReviewCycle.COMP_PLANNING_to_CLOSED]
        distinguishing_aspect: "A cycle whose plans are all APPROVED/REJECTED closes COMP_PLANNING -> CLOSED."
        test_recipe:
          setup: ["A COMP_PLANNING cycle whose every CompPlan is APPROVED or REJECTED and merit within budget"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles/${cyc}/close"
              payload: {}
              as: HrAdmin
              captures: { st: $.data.status }
          assert:
            - "200; data.status == CLOSED"

      - name: review_self_review_flow
        claim_type: valid_transition
        grounds: [state_machines.Review.DRAFT_to_SELF_REVIEW, state_machines.Review.SELF_REVIEW_to_MANAGER_REVIEW]
        distinguishing_aspect: "An OPEN-cycle review walks DRAFT -> SELF_REVIEW -> MANAGER_REVIEW via begin-self-review then submit-self."
        test_recipe:
          setup: ["An OPEN cycle with band MEETS and a DRAFT review for employee ${emp} reviewer ${mgr}"]
          setup_api_calls:
            - call: "POST /reviews/${rev}/begin-self-review"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
            - call: "PATCH /reviews/${rev}"
              payload: { self_rating: "MEETS" }
              as: Employee
              as_user_id: "${emp}"
          trigger:
            - call: "POST /reviews/${rev}/submit-self"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
              captures: { st: $.data.status }
          assert:
            - "200; data.status == MANAGER_REVIEW"

      - name: goal_open_to_scored
        claim_type: valid_transition
        grounds: [state_machines.Goal.OPEN_to_SCORED]
        distinguishing_aspect: "Scoring an OPEN goal moves it to SCORED and pins attainment_pct."
        test_recipe:
          setup: ["A review with an OPEN goal ${g}, reviewer ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /goals/${g}/score"
              payload: { attainment_pct: 1.0 }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "200; data.status == SCORED; data.attainment_pct == 1.0"

      - name: feedback_pending_to_submitted
        claim_type: valid_transition
        grounds: [state_machines.FeedbackRequest.PENDING_to_SUBMITTED]
        distinguishing_aspect: "Submitting a PENDING feedback request records its score and moves to SUBMITTED."
        test_recipe:
          setup: ["A PENDING feedback request ${fr} for rater ${rater}"]
          setup_api_calls: []
          trigger:
            - call: "POST /feedback-requests/${fr}/submit"
              payload: { score: 4 }
              as: Employee
              as_user_id: "${rater}"
          assert:
            - "200; data.status == SUBMITTED; data.score == 4"

      - name: feedback_pending_to_declined
        claim_type: valid_transition
        grounds: [state_machines.FeedbackRequest.PENDING_to_DECLINED]
        distinguishing_aspect: "Declining a PENDING feedback request moves it to DECLINED."
        test_recipe:
          setup: ["A PENDING feedback request ${fr} for rater ${rater}"]
          setup_api_calls: []
          trigger:
            - call: "POST /feedback-requests/${fr}/decline"
              payload: {}
              as: Employee
              as_user_id: "${rater}"
          assert:
            - "200; data.status == DECLINED"

      - name: calibration_open_to_balanced
        claim_type: valid_transition
        grounds: [state_machines.CalibrationSession.OPEN_to_BALANCED]
        distinguishing_aspect: "An OPEN session within tolerance moves to BALANCED with bell_curve_actual populated."
        test_recipe:
          setup: ["An OPEN session whose in-scope reviews already match target distribution within tolerance"]
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; data.status == BALANCED; data.bell_curve_actual is populated"

      - name: comp_plan_recompute_on_draft
        claim_type: valid_transition
        grounds: [entities.CompPlan.fields.merit_pct, calculations.compute_merit_amount]
        distinguishing_aspect: "Recomputing a DRAFT MERIT_ONLY plan as MERIT_AND_PROMO jump 1 raises merit_pct by the 0.03 promo uplift."
        test_recipe:
          setup: ["A DRAFT MERIT_ONLY comp plan ${plan} on a CALIBRATED MEETS review, manager ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /comp-plans/${plan}/recompute"
              payload: { plan_type: "MERIT_AND_PROMO", promo_band_jump: 1 }
              as: Manager
              as_user_id: "${mgr}"
              captures: { mp: $.data.merit_pct }
          assert:
            - "200; data.merit_pct == band_base + 0.03; version incremented"

      - name: pip_open_to_active_to_cured
        claim_type: valid_transition
        grounds: [state_machines.PipCase.OPEN_to_ACTIVE, state_machines.PipCase.ACTIVE_to_CURED]
        distinguishing_aspect: "An OPEN PipCase activated then assessed with outcome >= target moves to CURED."
        test_recipe:
          setup: ["An OPEN PipCase ${pip}, HRBP ${hrbp}"]
          setup_api_calls:
            - call: "POST /pip-cases/${pip}/activate"
              payload: { duration_days: 30, target_score: 60 }
              as: HrbpPartner
              as_user_id: "${hrbp}"
          trigger:
            - call: "POST /pip-cases/${pip}/assess"
              payload: { outcome_score: 75 }
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; data.status == CURED (75 >= 60)"

      - name: review_submit_from_draft_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Review.MANAGER_REVIEW_to_SUBMITTED]
        distinguishing_aspect: "Submitting a DRAFT review (not in MANAGER_REVIEW) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT review ${rev} whose reviewer is ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "409 ERR_INVALID_STATE"

  # =====================================================================
  # Section: calculations — variant selection, boundary inputs
  # =====================================================================
  - section: calculations
    instances:
      - name: composite_with_feedback_blend
        claim_type: computed_field_correct
        grounds: [calculations.compute_composite_score]
        distinguishing_aspect: "Goal 100 plus two SUBMITTED feedback scores 5 and 1 (avg5=3 -> feedback_score 50) yields composite 0.7*100 + 0.3*50 = 85.00."
        test_recipe:
          setup: ["A MANAGER_REVIEW review: one SCORED goal weight 1.0 attainment 1.0; two SUBMITTED feedback scores 5 and 1; reviewer ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { cs: $.data.composite_score }
          assert:
            - "200; data.composite_score == 85.00"

      - name: assign_final_rating_within_tolerance
        claim_type: variant_selected
        grounds: [calculations.assign_final_rating]
        distinguishing_aspect: "When all bands are within tolerance, finalize sets each final_rating to band_for_score(composite) with zero demotions (within_tolerance_no_shift variant)."
        test_recipe:
          setup: ["A BALANCED session whose reviews already match the target distribution within tolerance"]
          setup_api_calls:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          trigger:
            - call: "POST /calibration-sessions/${sess}/finalize"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; each in-scope review final_rating == band_for_score(composite_score); no demotions"

      - name: equity_pool_constrained_clamp
        claim_type: variant_selected
        grounds: [calculations.compute_equity_refresh]
        distinguishing_aspect: "When remaining pool < raw_target, equity_refresh_units is clamped to the remaining pool (pool_constrained variant)."
        test_recipe:
          setup: ["A COMP_PLANNING cycle with a small equity_refresh_pool so a tenured EXCEEDS employee's raw_target exceeds remaining pool; review version captured as ${rev_v}"]
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { eq: $.data.equity_refresh_units }
          assert:
            - "201; data.equity_refresh_units == remaining pool (clamped below raw_target)"

  # =====================================================================
  # Section: validations — rule triggers and priority ordering
  # =====================================================================
  - section: validations
    instances:
      - name: promo_jump_invalid_for_merit_only
        claim_type: violation_to_error
        grounds: ["validations[priority=14]"]
        distinguishing_aspect: "MERIT_ONLY plan with promo_band_jump 1 is rejected ERR_PROMO_JUMP_INVALID."
        test_recipe:
          setup: ["A CALIBRATED review in a COMP_PLANNING cycle; review version captured as ${rev_v}"]
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_ONLY", promo_band_jump: 1, expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "422 ERR_PROMO_JUMP_INVALID"

      - name: promo_jump_three_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]"]
        distinguishing_aspect: "MERIT_AND_PROMO with promo_band_jump 3 (out of 1..2) is rejected ERR_PROMO_JUMP_INVALID."
        test_recipe:
          setup: ["A CALIBRATED review in a COMP_PLANNING cycle; review version captured as ${rev_v}"]
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_AND_PROMO", promo_band_jump: 3, expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "422 ERR_PROMO_JUMP_INVALID"

      - name: goal_weights_sum_over_one
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "Adding a second goal pushing the review's goal weight sum above 1.0 is rejected ERR_GOAL_WEIGHTS_INVALID."
        test_recipe:
          setup: ["A DRAFT review ${rev} with one goal weight 0.7, manager ${mgr}"]
          setup_api_calls:
            - call: "POST /reviews/${rev}/goals"
              payload: { title: "G1", weight: 0.7 }
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /reviews/${rev}/goals"
              payload: { title: "G2", weight: 0.6 }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "422 ERR_GOAL_WEIGHTS_INVALID (0.7 + 0.6 > 1)"

  # =====================================================================
  # Section: endpoints — CRUD happy paths, pagination, filtering, reverse-reachability
  # =====================================================================
  - section: endpoints
    instances:
      - name: rating_band_create_and_list
        claim_type: crud_round_trip
        grounds: [entities.RatingBand.fields.cycle_id, endpoints]
        distinguishing_aspect: "Adding a RatingBand to a DRAFT cycle and listing via the reverse-reachability sub-resource returns it."
        test_recipe:
          setup: ["A DRAFT cycle"]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { name: "C", cadence: "ANNUAL", merit_budget_pct: 0.04, equity_refresh_pool: 0, bell_curve_target: { MEETS: 1.0 } }
              as: HrAdmin
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/rating-bands"
              payload: { label: "MEETS", min_score: 0, max_score: 100, merit_pct: 0.04 }
              as: HrAdmin
          trigger:
            - call: "GET /cycles/${cyc}/rating-bands"
              payload: {}
              as: HrAdmin
          assert:
            - "200; array length 1; band label MEETS"

      - name: employee_self_referential_manager_read
        claim_type: crud_round_trip
        grounds: [entities.Employee.fields.manager_id]
        distinguishing_aspect: "A report whose manager_id points at a manager resolves the self-referential FK on read."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Mgr", department: "ENG", hire_date: "2018-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Report", manager_id: "${mgr}", department: "ENG", hire_date: "2021-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "GET /employees/${rep}"
              payload: {}
              as: HrAdmin
          assert:
            - "200; data.manager_id == ${mgr}"

      - name: employees_filter_by_manager_id
        claim_type: filtering
        grounds: [entities.Employee.fields.manager_id]
        distinguishing_aspect: "GET /employees?manager_id=<mgr> returns the manager's direct reports (reverse-reachability for the self-FK)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Mgr", department: "ENG", hire_date: "2018-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "R1", manager_id: "${mgr}", department: "ENG", hire_date: "2021-01-01T00:00:00.000Z" }
              as: HrAdmin
            - call: "POST /employees"
              payload: { full_name: "R2", manager_id: "${mgr}", department: "ENG", hire_date: "2021-02-01T00:00:00.000Z" }
              as: HrAdmin
          trigger:
            - call: "GET /employees?manager_id=${mgr}"
              payload: {}
              as: HrAdmin
          assert:
            - "200; array length 2 (both reports)"

      - name: feedback_filter_by_rater_id
        claim_type: filtering
        grounds: [entities.FeedbackRequest.fields.rater_id]
        distinguishing_aspect: "GET /feedback-requests?rater_id=<rater> returns feedback requests assigned to that rater (reverse-reachability)."
        test_recipe:
          setup: ["A review with one feedback request for rater ${rater}"]
          setup_api_calls: []
          trigger:
            - call: "GET /feedback-requests?rater_id=${rater}"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; array length 1; FeedbackRequest.rater_id == ${rater}"

      - name: calibration_filter_by_facilitator_id
        claim_type: filtering
        grounds: [entities.CalibrationSession.fields.facilitator_id]
        distinguishing_aspect: "GET /calibration-sessions?facilitator_id=<hrbp> returns sessions facilitated by that HRBP (reverse-reachability)."
        test_recipe:
          setup: ["A calibration session with facilitator ${hrbp}"]
          setup_api_calls: []
          trigger:
            - call: "GET /calibration-sessions?facilitator_id=${hrbp}"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; array length 1; CalibrationSession.facilitator_id == ${hrbp}"

      - name: comp_plans_filter_by_cycle_id
        claim_type: filtering
        grounds: [entities.CompPlan.fields.cycle_id]
        distinguishing_aspect: "GET /comp-plans?cycle_id=<cyc> returns plans for that cycle (reverse-reachability)."
        test_recipe:
          setup: ["A cycle with two comp plans"]
          setup_api_calls: []
          trigger:
            - call: "GET /comp-plans?cycle_id=${cyc}"
              payload: {}
              as: HrAdmin
          assert:
            - "200; array length 2"

      - name: pip_cases_filter_by_employee_id
        claim_type: filtering
        grounds: [entities.PipCase.fields.employee_id]
        distinguishing_aspect: "GET /pip-cases?employee_id=<emp> returns that employee's PIP cases (reverse-reachability)."
        test_recipe:
          setup: ["An employee with one PipCase"]
          setup_api_calls: []
          trigger:
            - call: "GET /pip-cases?employee_id=${emp}"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "200; array length 1"

      - name: reviews_pagination
        claim_type: pagination
        grounds: [entities.Review.fields.cycle_id]
        distinguishing_aspect: "GET /reviews?cycle_id=<cyc>&limit=10&offset=0 returns 10 of 15, with total_count 15 and has_more true."
        test_recipe:
          setup: ["A cycle with 15 reviews"]
          setup_api_calls: []
          trigger:
            - call: "GET /reviews?cycle_id=${cyc}&limit=10&offset=0"
              payload: {}
              as: HrAdmin
          assert:
            - "200; data array length 10; meta.total_count == 15; meta.has_more == true"

      - name: cycles_filter_by_status
        claim_type: filtering
        grounds: [entities.ReviewCycle.fields.status]
        distinguishing_aspect: "GET /cycles?status=OPEN returns only cycles in OPEN status."
        test_recipe:
          setup: ["Two cycles, one DRAFT and one OPEN"]
          setup_api_calls: []
          trigger:
            - call: "GET /cycles?status=OPEN"
              payload: {}
              as: HrAdmin
          assert:
            - "200; every returned cycle has status OPEN"

  # =====================================================================
  # Section: errors — each error_id trigger condition
  # =====================================================================
  - section: errors
    instances:
      - name: err_not_found_unknown_cycle
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a nonexistent cycle id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cycles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HrAdmin
          assert:
            - "404 ERR_NOT_FOUND"

      - name: err_rating_band_unknown
        claim_type: violation_to_error
        grounds: ["errors[ERR_RATING_BAND_UNKNOWN]", "validations[priority=5]"]
        distinguishing_aspect: "Setting self_rating to a label not present as a RatingBand on the cycle returns 422 ERR_RATING_BAND_UNKNOWN."
        test_recipe:
          setup: ["A SELF_REVIEW review ${rev} on a cycle with only a MEETS band, employee ${emp}"]
          setup_api_calls: []
          trigger:
            - call: "PATCH /reviews/${rev}"
              payload: { self_rating: "STELLAR" }
              as: Employee
              as_user_id: "${emp}"
          assert:
            - "422 ERR_RATING_BAND_UNKNOWN"

      - name: err_band_coverage_invalid_gap
        claim_type: violation_to_error
        grounds: ["errors[ERR_BAND_COVERAGE_INVALID]", "validations[priority=7]"]
        distinguishing_aspect: "Opening a cycle whose bands leave a [50,60) gap returns 422 ERR_BAND_COVERAGE_INVALID."
        test_recipe:
          setup: ["A DRAFT cycle whose two bands cover [0,50) and [60,100], leaving [50,60) uncovered, with matching bell_curve_target keys"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles/${cyc}/open"
              payload: {}
              as: HrAdmin
          assert:
            - "422 ERR_BAND_COVERAGE_INVALID"

      - name: err_distribution_not_normalized
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISTRIBUTION_NOT_NORMALIZED]", "validations[priority=8]"]
        distinguishing_aspect: "Opening a cycle whose bell_curve_target sums to 0.9 returns 422 ERR_DISTRIBUTION_NOT_NORMALIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { name: "Bad", cadence: "ANNUAL", merit_budget_pct: 0.04, equity_refresh_pool: 0, bell_curve_target: { EXCEEDS: 0.3, MEETS: 0.6 } }
              as: HrAdmin
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/rating-bands"
              payload: { label: "MEETS", min_score: 0, max_score: 50, merit_pct: 0.04 }
              as: HrAdmin
            - call: "POST /cycles/${cyc}/rating-bands"
              payload: { label: "EXCEEDS", min_score: 50, max_score: 100, merit_pct: 0.08 }
              as: HrAdmin
          trigger:
            - call: "POST /cycles/${cyc}/open"
              payload: {}
              as: HrAdmin
          assert:
            - "422 ERR_DISTRIBUTION_NOT_NORMALIZED (0.3 + 0.6 != 1.0)"

      - name: err_goal_weights_zero_goals_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_GOAL_WEIGHTS_INVALID]"]
        distinguishing_aspect: "Submitting a MANAGER_REVIEW review with zero goals returns 422 ERR_GOAL_WEIGHTS_INVALID."
        test_recipe:
          setup: ["A MANAGER_REVIEW review ${rev} with zero goals and manager_rating MEETS, reviewer ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "422 ERR_GOAL_WEIGHTS_INVALID"

      - name: err_distribution_out_of_tolerance_balance
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISTRIBUTION_OUT_OF_TOLERANCE]", "validations[priority=10]"]
        distinguishing_aspect: "Balancing an OPEN session whose actual band distribution exceeds tolerance returns 422 ERR_DISTRIBUTION_OUT_OF_TOLERANCE."
        test_recipe:
          setup: ["An OPEN session whose in-scope reviews all land in EXCEEDS (actual 1.0) vs target EXCEEDS 0.20 tolerance 0.05"]
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "422 ERR_DISTRIBUTION_OUT_OF_TOLERANCE"

      - name: err_equity_pool_exceeded_on_approve
        claim_type: violation_to_error
        grounds: ["errors[ERR_EQUITY_POOL_EXCEEDED]", "validations[priority=13]"]
        distinguishing_aspect: "Approving a plan whose equity_refresh_units would push equity_committed_total past equity_refresh_pool returns 422 ERR_EQUITY_POOL_EXCEEDED."
        test_recipe:
          setup: ["A PROPOSED plan ${plan} whose equity grant exceeds the cycle's remaining equity pool; cycle version captured as ${cyc_v}"]
          setup_api_calls:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "422 ERR_EQUITY_POOL_EXCEEDED"

      - name: err_validation_bad_cadence_enum
        claim_type: violation_to_error
        grounds: ["errors[ERR_VALIDATION]", entities.ReviewCycle.fields.cadence]
        distinguishing_aspect: "Creating a cycle with cadence WEEKLY (not in the enum) returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles"
              payload: { name: "C", cadence: "WEEKLY", merit_budget_pct: 0.04, equity_refresh_pool: 0, bell_curve_target: { MEETS: 1.0 } }
              as: HrAdmin
          assert:
            - "400 ERR_VALIDATION (cadence not in ANNUAL/SEMI_ANNUAL)"

      - name: err_tenure_ineligible_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_TENURE_INELIGIBLE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tenure_window_eligibility_overlap
          rationale: "The sub-1-year tenure boundary that drives ERR_TENURE_INELIGIBLE / zero-equity is asserted by the named §1.8 instance."

  # =====================================================================
  # Section: rbac — role-permitted and role-denied per protected operation
  # =====================================================================
  - section: rbac
    instances:
      - name: hradmin_opens_cycle_permitted
        claim_type: role_permitted
        grounds: [roles.HrAdmin]
        distinguishing_aspect: "HrAdmin may open a DRAFT cycle with valid bands (200)."
        test_recipe:
          setup: ["A DRAFT cycle with valid full band coverage and normalized target"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles/${cyc}/open"
              payload: {}
              as: HrAdmin
          assert:
            - "200; data.status == OPEN"

      - name: employee_cannot_open_cycle
        claim_type: role_denied
        grounds: [roles.Employee, roles.HrAdmin]
        distinguishing_aspect: "An Employee calling cycle open is denied 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["A DRAFT cycle with valid bands and an employee ${emp}"]
          setup_api_calls: []
          trigger:
            - call: "POST /cycles/${cyc}/open"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
          assert:
            - "403 ERR_FORBIDDEN_ROLE"

      - name: manager_cannot_begin_self_review
        claim_type: role_denied
        grounds: [roles.Manager, roles.Employee]
        distinguishing_aspect: "begin-self-review is Employee-exclusive; a Manager calling it is denied 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["A DRAFT review ${rev} in an OPEN cycle, reviewer ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /reviews/${rev}/begin-self-review"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "403 ERR_FORBIDDEN_ROLE"

      - name: hrbp_creates_calibration_permitted
        claim_type: role_permitted
        grounds: [roles.HrbpPartner]
        distinguishing_aspect: "HrbpPartner may create a calibration session for a CALIBRATION-phase cycle (201)."
        test_recipe:
          setup: ["A cycle in CALIBRATION and an HRBP facilitator employee ${hrbp}"]
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-sessions"
              payload: { cycle_id: "${cyc}", department: "ENG", facilitator_id: "${hrbp}" }
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "201; data.status == OPEN"

      - name: manager_cannot_approve_comp_plan
        claim_type: role_denied
        grounds: [roles.Manager, roles.CompApprover]
        distinguishing_aspect: "comp-plan approve is CompApprover-exclusive; a Manager calling it is denied 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["A PROPOSED comp plan ${plan}, manager ${mgr}"]
          setup_api_calls: []
          trigger:
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "403 ERR_FORBIDDEN_ROLE"

      - name: missing_headers_unauthenticated
        claim_type: role_denied
        grounds: [roles.HrAdmin, "validations[priority=1]"]
        distinguishing_aspect: "A request missing X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cycles"
              payload: {}
              as: ""
          assert:
            - "401 ERR_UNAUTHENTICATED"

  # =====================================================================
  # Section: cross_cutting — OCC, cascades
  # =====================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_cycle_on_second_approve
        claim_type: occ_conflict
        grounds: ["concurrency_rules[comp-plan-approve-stale-cycle]"]
        distinguishing_aspect: "After approving plan1 (cycle version advances), a second approve carrying the pre-advance cycle version is rejected 412 ERR_STALE_CYCLE_VERSION."
        test_recipe:
          setup: ["A COMP_PLANNING cycle with two PROPOSED plans ${plan1} and ${plan2}, approver ${approver}; cycle version captured before any approve as ${cyc_v}"]
          setup_api_calls:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: CompApprover
              as_user_id: "${approver}"
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan1}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          trigger:
            - call: "POST /comp-plans/${plan2}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "412 ERR_STALE_CYCLE_VERSION (cycle version advanced after first approve)"

      - name: occ_stale_review_on_comp_plan_create
        claim_type: occ_conflict
        grounds: ["concurrency_rules[comp-plan-create-stale-review]"]
        distinguishing_aspect: "Creating a CompPlan against a review with a stale expected_review_version (one less than current) is rejected 412 ERR_STALE_REVIEW_VERSION."
        test_recipe:
          setup: ["A CALIBRATED review ${rev} in a COMP_PLANNING cycle; current review version captured as ${rev_v}"]
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v} - 1" }
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "412 ERR_STALE_REVIEW_VERSION"

      - name: finalize_cascade_excluded
        claim_type: cascade_side_effect
        grounds: [state_machines.CalibrationSession.BALANCED_to_FINALIZED]
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cascade_depth3
          rationale: "The finalize -> CALIBRATED -> PipCase cascade is exercised by the named §1.8 instance."

  # =====================================================================
  # Section: consistency_model — immediate-consistency ledger checks
  # =====================================================================
  - section: consistency_model
    instances:
      - name: ledger_reflects_approve_immediately
        claim_type: immediate_consistency
        grounds: [entities.ReviewCycle.fields.merit_committed_total, state_machines.CompPlan.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Immediately after a successful approve, GET /cycles shows merit_committed_total increased by exactly the plan's merit_amount."
        test_recipe:
          setup: ["A COMP_PLANNING cycle with one PROPOSED plan ${plan} of merit_amount 4800.00 and merit_committed_total 0; approver ${approver}; cycle version captured as ${cyc_v}"]
          setup_api_calls:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          trigger:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { committed: $.data.merit_committed_total }
          assert:
            - "200; data.merit_committed_total == 4800.00 (immediately reflected)"

      - name: reject_leaves_ledger_unchanged
        claim_type: immediate_consistency
        grounds: [state_machines.CompPlan.PROPOSED_to_REJECTED]
        excluded_because:
          difficulty_instance: compensating_invariant / reject_preserves_merit_ledger
          rationale: "That a rejected plan never moves merit_committed_total is asserted by the named §1.8 instance."
