          - calculations.area_eligible_classification
        distinguishing_aspect: |
          MIN_SAMPLES_FOR_DECISION is 5 with a >= comparison, so four ACCEPTED samples block even a
          DOWNGRADE — the data-support rule for upgrades is a separate check, and the sample-count
          floor applies to every decision on the area.
        test_recipe:
          setup:
            - "GrowingArea GA-114 with default configuration."
            - "Four ACCEPTED MPN-200 samples at ST-1 collected 2026-07-01..2026-07-04 at 09:00:00Z, so accepted_sample_count is 4 and eligible_classification is INSUFFICIENT_DATA (the sweep cannot fire below 5 either)."
