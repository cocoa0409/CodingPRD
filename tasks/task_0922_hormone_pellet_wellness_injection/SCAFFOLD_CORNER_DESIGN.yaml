            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ben Sato", provider_type: "PHYSICIAN", npi: "1000000002" }
              as: ClinicAdmin
              captures: { dr2: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so41: $.data.id }
          trigger:
            - call: "POST /clinic/standing-orders/${so41}/revoke"
              payload: { reason: "Not mine to revoke" }
              as: Physician
              as_user_id: "${dr2}"
              captures: { rev_err: $.data.error_id }
          assert:
            - "${rev_err} == ERR_FORBIDDEN_OWNERSHIP with HTTP 403"
            - "StandingOrder.${so41}.status == ACTIVE"

