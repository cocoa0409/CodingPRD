        excluded_because:
          difficulty_instance: non_linear_state_machine / air_block_offer_counter_reoffer_cycle
          rationale: "The OFFERED -> COUNTERED -> OFFERED loop, its negotiation_round increments and the fare bookkeeping across rounds are the subject of the named §1.8 instance."

      - name: pilgrim_status_dimensions_move_independently
        claim_type: parallel
        grounds:
