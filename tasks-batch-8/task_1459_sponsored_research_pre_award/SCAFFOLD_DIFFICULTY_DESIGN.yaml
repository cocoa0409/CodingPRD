  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: create_proposal_requires_opportunity_published
        grounds:
          - validations[priority=7]
          - state_machines.FundingOpportunity.PUBLISHED_to_INTAKE_CLOSED
          - errors[ERR_OPPORTUNITY_CLOSED]
        distinguishing_aspect: |
          Entity pair Proposal -> FundingOpportunity: proposal creation is
          rejected with ERR_OPPORTUNITY_CLOSED once the opportunity's clock
          sweep has moved it to INTAKE_CLOSED, though the same payload was
          accepted while PUBLISHED.
        test_recipe:
          setup:
            - "Opportunity with sponsor_deadline_at 2026-08-10T17:00:00Z; clock advanced to 2026-08-11 (sweep closes intake); eligible PI"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "Early", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-08-10T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Sixteen", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: OSPSystemAdmin }
            - { call: "GET /pre-award/funding-opportunities/${opp_id}", payload: {}, as: OSPDirector, captures: { o_status: $.data.status } }
          trigger:
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "TooLate", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { err: $.data.error_id }
          assert:
            - "o_status == INTAKE_CLOSED"
            - "err == ERR_OPPORTUNITY_CLOSED"

      - name: handoff_ready_requires_reviews_approved
        grounds:
          - state_machines.AwardHandoff.DRAFT_to_READY
          - errors[ERR_COMPLIANCE_REVIEW_PENDING]
        distinguishing_aspect: |
          Entity pair AwardHandoff -> ComplianceReview (different pair than
          Proposal -> FundingOpportunity): mark-ready on an AWARDED proposal
          whose IRB review is still PENDING fails with
          ERR_COMPLIANCE_REVIEW_PENDING even though snapshot, FINAL rate,
          subrecipient and fiscal gates all pass.
        test_recipe:
          setup:
            - "Opportunity (no cost-share), eligible PI, FINAL 54% rate; proposal AWARDED via finalize/route/approve/submit/offer/accept; IRB review PENDING"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Seventeen", department_code: "MED", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01", initial_status: "FINAL" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "G", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-g-1" }, as: OSPDirector }
            - { call: "POST /pre-award/proposals/${prop_id}/compliance-reviews", payload: { review_type: "IRB" }, as: ComplianceOfficer }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_id}/negotiation-offers"
              payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 14000000 }
              as: OSPDirector
              captures: { offer_id: $.data.id }
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector, captures: { handoff_id: "$.data[0].id" } }
          trigger:
            - call: "POST /pre-award/award-handoffs/${handoff_id}/mark-ready"
              payload: {}
              as: OSPDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPLIANCE_REVIEW_PENDING"

      - name: verify_requires_org_risk_ack
        grounds:
          - state_machines.SubrecipientCommitment.DRAFT_to_VERIFIED
          - errors[ERR_SUBREC_HIGH_RISK_NOT_ACKED]
          - calculations.subrecipient_risk_score
        distinguishing_aspect: |
          Entity pair SubrecipientCommitment -> SubrecipientOrg (a third
          distinct pair): verify on a commitment whose org scores 95 (HIGH)
          fails without enhanced_monitoring_acknowledged, and succeeds on an
          identical commitment that carries the acknowledgment.
        test_recipe:
          setup:
            - "Opportunity, eligible PI; org DELINQUENT + 9 findings + foreign -> score 95 HIGH"
            - "Proposal DRAFT with two commitments on that org (docs complete): C1 without ack, C2 with ack"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Eighteen", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /pre-award/subrecipient-orgs"
              payload: { legal_name: "Risky", uei: "UEI-RSK1", single_audit_status: "DELINQUENT", audit_finding_count: 9, is_foreign: true }
              as: SubrecipientManager
              captures: { org_id: $.data.id, org_tier: $.data.risk_tier }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Sub", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 10000000, statement_of_work_received: true, budget_received: true, enhanced_monitoring_acknowledged: false }
              as: PreAwardAnalyst
              captures: { comm_1: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 10000000, statement_of_work_received: true, budget_received: true, enhanced_monitoring_acknowledged: true }
              as: PreAwardAnalyst
              captures: { comm_2: $.data.id }
          trigger:
            - call: "POST /pre-award/subrecipient-commitments/${comm_1}/verify"
              payload: {}
              as: SubrecipientManager
              captures: { err: $.data.error_id }
            - call: "POST /pre-award/subrecipient-commitments/${comm_2}/verify"
              payload: {}
              as: SubrecipientManager
              captures: { st2: $.data.status, mon2: $.data.monitoring_level, snap2: $.data.verified_risk_snapshot_score }
          assert:
            - "org_tier == HIGH"
            - "err == ERR_SUBREC_HIGH_RISK_NOT_ACKED"
            - "st2 == VERIFIED and mon2 == ENHANCED and snap2 == 95"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: final_rate_window_overlap_adjacency
        grounds:
          - state_machines.FaRateAgreement.PROVISIONAL_to_FINAL
          - errors[ERR_FA_RATE_WINDOW_OVERLAP]
          - entities.FaRateAgreement.fields.effective_end_on
        distinguishing_aspect: |
          Resource FaRateAgreement with half-open [start, end) semantics: a
          FINAL window starting exactly at another FINAL's end (2026-01-01 ==
          2026-01-01) is admitted, a FINAL window straddling it
          ([2025-06-01, 2026-06-01)) is rejected, and a PROVISIONAL window may
          overlap FINALs freely.
        test_recipe:
          setup: ["Registry only; no proposals"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/fa-rate-agreements"
              payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 52.00, effective_start_on: "2025-01-01", effective_end_on: "2026-01-01", initial_status: "FINAL" }
              as: OSPDirector
              captures: { ra_id: $.data.id, ra_status: $.data.status }
            - call: "POST /pre-award/fa-rate-agreements"
              payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 53.00, effective_start_on: "2026-01-01", effective_end_on: "2027-01-01", initial_status: "FINAL" }
              as: OSPDirector
              captures: { rb_id: $.data.id, rb_status: $.data.status }
            - call: "POST /pre-award/fa-rate-agreements"
              payload: { rate_type: "OFF_CAMPUS_RESEARCH", rate_pct: 26.00, effective_start_on: "2025-06-01", effective_end_on: "2026-06-01" }
              as: OSPDirector
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /pre-award/fa-rate-agreements"
              payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2025-06-01", effective_end_on: "2026-06-01", initial_status: "FINAL" }
              as: OSPDirector
