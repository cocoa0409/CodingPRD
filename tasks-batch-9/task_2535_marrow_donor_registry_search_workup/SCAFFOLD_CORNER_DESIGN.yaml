          STALLED is only reachable by exhausting the primary's two CT attempts on a search with no backup
          at all: the first expiry leaves the search running, the second excludes the primary and stalls
          the search because the promotion cascade finds nothing. Both candidate-scoped writes must then
          fail on the SEARCH's state (priority 11) rather than on the candidate's (priority 12).
