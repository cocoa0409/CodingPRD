  - rule_id: non_linear_state_machine
    instances:
      - name: sealed_bag_custody_and_count_axes_advance_independently
        grounds:
          - state_machines.SealedBag.VAULT_RECEIVED_to_OPENED
          - state_machines.SealedBag.PENDING_to_COUNTING
          - entities.SealedBag.fields.custody_status
          - entities.SealedBag.fields.count_status
        distinguishing_aspect: |
          Parallel-dimension instance on SealedBag: custody_status and count_status are
          two independent axes on one row. After the OPEN custody hop the bag reads
          custody OPENED / count PENDING, and the subsequent session start moves only
          the count axis to COUNTING while custody_status stays OPENED and the custody
          chain length stays at 3.
