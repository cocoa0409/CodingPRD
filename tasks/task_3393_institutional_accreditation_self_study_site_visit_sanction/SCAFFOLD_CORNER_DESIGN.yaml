            - call: "POST /accreditation/action-outcomes/${out_mon_id}/sanction-transition"
              payload: { action: "OPEN_CURE_REVIEW" }
              as: CommissionStaff
              captures: { snap: $.data.cure_threshold_snapshot }
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2027-01-01", period_end: "2027-12-31" }
              as: CommissionStaff
              captures: { rep2_id: $.data.id }
            - call: "POST /accreditation/indicator-reports/${rep2_id}/submit"
              payload: { primary_reserve_ratio: 0.12, viability_ratio: 0.08, net_operating_ratio: 0.04, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 800 }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - call: "POST /accreditation/indicator-reports/${rep2_id}/evaluate"
              payload: {}
              as: CommissionStaff
            - call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2028-01-01", period_end: "2028-12-31" }
              as: CommissionStaff
              captures: { rep3_id: $.data.id }
            - call: "POST /accreditation/indicator-reports/${rep3_id}/submit"
              payload: { primary_reserve_ratio: 0.12, viability_ratio: 0.08, net_operating_ratio: 0.04, enrollment_change_pct: -9.0, completion_rate: 51.0, retention_rate: 71.0, fte_enrollment: 800 }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - call: "POST /accreditation/indicator-reports/${rep3_id}/evaluate"
              payload: {}
              as: CommissionStaff
          trigger:
            - call: "POST /accreditation/action-outcomes/${out_mon_id}/sanction-transition"
              payload: { action: "CURE" }
              as: CommissionStaff
              captures: { err_id: $.data.error_id }
            - call: "GET /accreditation/institutions/${inst_id}"
              payload: {}
              as: CommissionStaff
              captures: { sanction_after: $.data.sanction_status }
          assert:
            - "snap == 75 and cure score == 50 (2 reports x 25) < 75"
            - "CURE fails with err_id == ERR_CURE_THRESHOLD_NOT_MET (HTTP 422)"
            - "sanction_after == PROBATION and the outcome's cure_status stays UNDER_CURE_REVIEW"

