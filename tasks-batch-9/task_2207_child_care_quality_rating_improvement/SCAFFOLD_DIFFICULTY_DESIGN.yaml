  - rule_id: boundary_precision_check
    instances:
      - name: reliability_pct_inclusive_at_exactly_83_33
        grounds:
          - calculations.inter_rater_reliability_pct
          - calculations.observation_composite_score
          - validations[priority=22]
          - validations[priority=24]
          - entities.ObservationVisit.fields.reliability_pct
          - entities.ObservationVisit.fields.rescore_count
          - state_machines.ObservationVisit.RELIABILITY_CHECK_to_SCORES_ENTERED
        distinguishing_aspect: |
          Boundary metric 1 - the inter-rater reliability threshold on
          POST /observation-visits/{observation_visit_id}/finalize: 4 matched subscales give
          reliability_pct 66.67 and are rejected with ERR_RELIABILITY_BELOW_THRESHOLD, while
          exactly 5 matched subscales give 83.33 which equals IRR_MIN_PCT and PASSES the
          inclusive >= comparison, and the matched test itself is inclusive at
          abs(diff) == TOLERANCE 1.0.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z."
            - "Five StandardDomain rows: LEARNING_ENVIRONMENT (block 1, max 40, min 20, weight 0.30, observation_linked, min_composite_for_block 4.00), STAFF_QUALIFICATIONS (block 1, max 30, min 15, weight 0.25), FAMILY_PARTNERSHIP (block 2, max 20, min 10, weight 0.20), ADMINISTRATION (block 2, max 20, min 6, weight 0.15), CHILD_ASSESSMENT (block 3, max 10, min 5, weight 0.10)."
            - "Provider ENROLLED with active_staff_fte 8.0 and no StaffCredential rows, so credential_compliance_pct == 0.00; the cycle is only taken as far as OBSERVATION_SCHEDULED, never awarded."
            - "ObservationVisit with lead and secondary observers, lead holding six current 5.0 scores so composite == 5.00."
            - "Secondary scores 5.0 / 6.0 / 4.0 / 6.5 / 3.5 / 5.0 against lead 5.0 everywhere: the 6.0 and 4.0 rows sit exactly at TOLERANCE 1.0 and count as matched, the 6.5 and 3.5 rows are 1.5 apart and do not, so matched == 4 and reliability_pct == 66.67."
