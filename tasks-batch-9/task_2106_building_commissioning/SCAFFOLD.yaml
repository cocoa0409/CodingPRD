  - method: POST
    path: "/prefunctional-checklists/{id}/record-item"
    description: "Contractor records PASS / FAIL / NA against one line item"
    roles: [Contractor]
    code: 200
    input: [item_code, result, "note?"]
    output: PrefunctionalChecklist
    side_effects: ["writes result, recorded_by_user_id and recorded_at on the item", "refreshes passed_item_count and failed_item_count"]

  - method: POST
    path: "/prefunctional-checklists/{id}/execute"
    description: "Contractor signs the checklist off as executed"
    roles: [Contractor]
    code: 200
    input: []
    output: PrefunctionalChecklist
    side_effects: ["status = EXECUTED", "executed_by_user_id = X-User-ID"]

  - method: POST
    path: "/prefunctional-checklists/{id}/verify"
    description: "Commissioning authority verifies an executed checklist; the verifier may not be the executor"
    roles: [CxAuthority]
    code: 200
    input: []
    output: PrefunctionalChecklist
    side_effects: ["status = VERIFIED", "EquipmentUnit.verification_status -> PREFUNCTIONAL_VERIFIED", "CxProject.verified_prefunctional_units grows by the unit's weight_units", "recomputes acceptance_completion_score", "increments CxProject.version by 1"]

  - method: POST
    path: "/prefunctional-checklists/{id}/reject"
    description: "Compensating action for verify: sends an executed or verified checklist back to REWORK and unwinds every effect the verification had"
    roles: [CxAuthority]
    code: 200
    input: [reason]
    output: PrefunctionalChecklist
    side_effects: ["status = REWORK, rework_cycle_count incremented, all item results reset to PENDING", "CxProject.verified_prefunctional_units shrinks by the unit's weight_units when the checklist was VERIFIED", "EquipmentUnit.verification_status -> UNVERIFIED, cancelling SCHEDULED tests and staling EQUIPMENT_VERIFICATION evidence", "increments CxProject.version by 1"]

