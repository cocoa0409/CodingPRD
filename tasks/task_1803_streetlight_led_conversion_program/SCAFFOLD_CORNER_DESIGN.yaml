  - name: calc_savings_per_pole_rounding_order
    claim_type: precision
    grounds:
    - calculations.savings_verification_kwh
    distinguishing_aspect: 'Per-pole 3-decimal rounding BEFORE summation is observable: two identical 190W->90W poles converted 2026-02-19 (d_old 18, d_new 10 of 28; Feb burn 380h) each contribute actual_p
      = (190*380*18/28 + 90*380*10/28)/1000 = 58.6285714 -> 58.629 kWh; the pinned order yields actual_kwh == 117.258 and savings_kwh == 27.142, whereas summing raw values first would give 117.257 / 27.143.'
    test_recipe:
      setup:
      - Clock set back to 2026-02-01 at fixture start; ACTIVE program, ARTERIAL district; two UTILITY_OWNED poles attested at 190W; both converted (90W) at clock 2026-02-19T09:00:00Z
