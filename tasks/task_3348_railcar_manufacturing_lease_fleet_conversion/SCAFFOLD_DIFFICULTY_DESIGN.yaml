      against the completed incumbent [2026-09-16, 2026-10-16) even though the two intervals do not

      intersect at all, while [2026-10-18, 2026-11-17) — exactly two days after the incumbent''s

      end_date — is ACCEPTED (201). Adjacency is illegal here, the opposite geometric treatment from

      the sibling shop-line instance, where touching windows are accepted.

