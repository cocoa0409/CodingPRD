            - call: "GET /labeling/assessments"
              payload: { product_id: "${product_id}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /labeling/products/${product_id}/assessments"
              payload: { expected_product_version: "${product_v2}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /labeling/products/${product_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "first response HTTP status is 412 with data.error_id == ERR_STALE_PRODUCT_VERSION"
            - "second response: total_count == 0, so the stale open persisted no assessment"
            - "third response HTTP status is 201 with status == DRAFT, route == SELF_ATTESTATION, deficiency_round == 0 and assessed_spec_revision == 2"
            - "fourth response: version == 3 and spec_revision == 2, so only the accepted open bumped the row"
            - "Product.${product_id}.conformance_currency == STALE, untouched by either open"

