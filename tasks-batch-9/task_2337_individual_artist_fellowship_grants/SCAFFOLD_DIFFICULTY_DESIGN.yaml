# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2337_individual_artist_fellowship_grants
#
# Nine mandatory difficulty rules, each with >= 2 differentiated instances.
# Every call below is a structured object: `call` (a §1.5 endpoint), `payload`
# (a subset of that endpoint's declared `input:`), `as` (a §1.7 role), optional
# `as_user_id`, optional `captures` (jsonpaths into that endpoint's `output:`).
#
# The golden-path chain is written once (rule 1, instance A) with YAML anchors
# and aliased everywhere else, so every instance runs against byte-identical
# fixtures. Named anchors:
#   k_*  — the LITERARY_ARTS FY2027 cycle "CycleMain": 5-seat panel, one
#          application (Ada Rivers / NORTH / tin MISSING), five reviews whose
#          weighted scores are 8.00, 6.60, 7.30, 6.00, 8.50.
#   x_*  — the board/award/installment extension of that chain.
#   m_*  — the second-application overlay (Bo Nakamura / SOUTH / tin ON_FILE)
#          that drives funded_total_cents to exactly the tier-1 ceiling.
#
# All expected values below are pre-computed literals. Their derivations:
#   review_weighted_score: (9,8,7,6)->8.00  (7,7,6,5)->6.60  (8,6,8,7)->7.30
#                          (6,6,6,6)->6.00  (9,8,9,7)->8.50  (9,9,8,7)->8.60
#   PROVISIONAL mean of {8.00,6.60,7.30,6.00,8.50} = 36.40/5 = 7.28
#   FINAL trimmed mean (drop 8.50 hi, 6.00 lo)     = 21.90/3 = 7.30
#   score_spread = 8.50 - 6.00 = 2.50 == SPREAD_REOPEN_THRESHOLD (no reopen)
#   readiness 5/5 seats, 3/3 regions, 0 conflicts, no specialist = 100.00
#   assessment on 1_500_000: tier1 0.085 -> 127_500, committed 1_627_500
#   assessment on 2_000_000: tier1 0.085 -> 170_000, committed 2_170_000
#   installments of 1_500_000: 600_000 / 525_000 / 375_000 at rate 0.2707
#     -> withholding 162_420 / 142_118 / 101_513, sum 406_051
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: composite_score_provisional_mean_vs_final_trimmed_mean
        grounds:
          - calculations.application_composite_score
          - entities.Application.fields.provisional_composite_score
          - entities.Application.fields.final_composite_score
          - state_machines.Panel.SCORING_to_DELIBERATING
        distinguishing_aspect: |
          The same five counted reviews must yield provisional_composite_score 7.28 (plain
          mean of 36.40/5) and final_composite_score 7.30 (trimmed mean of 21.90/3 after
          dropping exactly one 8.50 and one 6.00), so any implementation that reuses one
          variant for both fields, or that trims before computing the provisional value,
          lands on a single number and fails.
        test_recipe:
          setup:
            - "FY2027 LITERARY_ARTS cycle open, one eligible application, a 5-seat panel with full region coverage"
            - "Five reviews submitted in created_at ASC order with weighted scores 8.00, 6.60, 7.30, 6.00, 8.50"
            - "TRIM_MIN_SEATS is 5 and panel.seated_count is exactly 5, so the FINAL variant does trim"
          setup_api_calls:
            - &k_clock_sep { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_cycle
              call: "POST /grants/cycles"
              payload:
                name: "FY2027 Individual Artist Fellowships"
                fiscal_year: 2027
                application_open_at: "2026-08-15T00:00:00Z"
                application_deadline_at: "2026-10-15T23:59:59Z"
                grant_period_start: "2027-01-01T00:00:00Z"
                grant_period_end: "2027-12-31T00:00:00Z"
                total_budget_cents: 6000000
                base_award_cents: 1500000
                min_prorated_award_cents: 500000
                residency_min_months: 24
                award_blackout_years: 3
                proration_policy: PRORATE
                max_review_rounds: 2
                acceptance_window_days: 14
                appeal_window_days: 30
                final_report_due_offset_days: 60
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { cyc: "$.data.id" }
            - &k_disc
              call: "POST /grants/discipline-categories"
              payload:
                cycle_id: "${cyc}"
                code: LITERARY_ARTS
                alias_prefix: "LIT"
                allocation_cents: 2000000
                required_work_sample_count: 2
                allowed_media: [MANUSCRIPT_PAGES, AUDIO]
                required_panel_seats: 5
                required_regions: [NORTH, CENTRAL, SOUTH]
                max_total_duration_seconds: 600
                max_concurrent_panels: 1
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { disc: "$.data.id" }
            - &k_open { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: OPEN }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_art1
              call: "POST /grants/artists"
              payload: { legal_name: "Ada Rivers", email: "ada.rivers@example.org", residency_start_date: "2023-01-10", residency_county: "Lakeshore", region: NORTH, is_enrolled_student: false, tin_status: MISSING }
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { art1: "$.data.id" }
            - &k_app1
              call: "POST /grants/applications"
              payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", artist_id: "${art1}", artist_statement: "I write short fiction about lake towns and the people who leave them.", career_narrative: "Fifteen years of small-press publication, two chapbooks and a residency at the county library." }
              as: Artist
              as_user_id: "${art1}"
              captures: { app1: "$.data.id" }
            - &k_ws1a { call: "POST /grants/work-samples", payload: { application_id: "${app1}", medium: MANUSCRIPT_PAGES, ordinal: 1, page_count: 12, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art1}", captures: { ws1a: "$.data.id" } }
            - &k_ws1b { call: "POST /grants/work-samples", payload: { application_id: "${app1}", medium: MANUSCRIPT_PAGES, ordinal: 2, page_count: 9, contains_identifying_metadata: false }, as: Artist, as_user_id: "${art1}", captures: { ws1b: "$.data.id" } }
            - &k_sub1 { call: "POST /grants/applications/${app1}/submit", payload: {}, as: Artist, as_user_id: "${art1}" }
            - &k_clock_oct16 { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-16T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_close_cycle { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: CLOSED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_elig1 { call: "POST /grants/applications/${app1}/eligibility", payload: { determination: ELIGIBLE }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_panel_review { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: PANEL_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_panel
              call: "POST /grants/panels"
              payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 5, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "officer-1"
              captures: { pan: "$.data.id" }
            - &k_pl1 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "chair.north@example.org", full_name: "Iris Vance", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: true }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl1: "$.data.id" } }
            - &k_pl2 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.central@example.org", full_name: "Omar Diaz", region: CENTRAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl2: "$.data.id" } }
            - &k_pl3 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.south@example.org", full_name: "Neve Okoro", region: SOUTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl3: "$.data.id" } }
            - &k_pl4 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.north2@example.org", full_name: "Piet Halvorsen", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl4: "$.data.id" } }
            - &k_pl5 { call: "POST /grants/panelists", payload: { panel_id: "${pan}", person_email: "reader.coastal@example.org", full_name: "Lena Marsh", region: COASTAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pl5: "$.data.id" } }
            - &k_seat1 { call: "POST /grants/panelists/${pl1}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_seat2 { call: "POST /grants/panelists/${pl2}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_seat3 { call: "POST /grants/panelists/${pl3}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_seat4 { call: "POST /grants/panelists/${pl4}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_seat5 { call: "POST /grants/panelists/${pl5}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_charter { call: "POST /grants/panels/${pan}/charter", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_round1 { call: "POST /grants/panels/${pan}/open-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - &k_rev1 { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl1}", artistic_excellence: 9, work_sample_quality: 8, career_impact: 7, public_value: 6, comments: "Assured voice, uneven middle section." }, as: Panelist, as_user_id: "${pl1}", captures: { rv1: "$.data.id" } }
            - &k_srev1 { call: "POST /grants/reviews/${rv1}/submit", payload: {}, as: Panelist, as_user_id: "${pl1}" }
            - &k_rev2 { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl2}", artistic_excellence: 7, work_sample_quality: 7, career_impact: 6, public_value: 5, comments: "Competent but conventional." }, as: Panelist, as_user_id: "${pl2}", captures: { rv2: "$.data.id" } }
            - &k_srev2 { call: "POST /grants/reviews/${rv2}/submit", payload: {}, as: Panelist, as_user_id: "${pl2}" }
            - &k_rev3 { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl3}", artistic_excellence: 8, work_sample_quality: 6, career_impact: 8, public_value: 7, comments: "Strong career trajectory." }, as: Panelist, as_user_id: "${pl3}", captures: { rv3: "$.data.id" } }
            - &k_srev3 { call: "POST /grants/reviews/${rv3}/submit", payload: {}, as: Panelist, as_user_id: "${pl3}" }
            - &k_rev4 { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl4}", artistic_excellence: 6, work_sample_quality: 6, career_impact: 6, public_value: 6, comments: "Solid across the board." }, as: Panelist, as_user_id: "${pl4}", captures: { rv4: "$.data.id" } }
            - &k_srev4 { call: "POST /grants/reviews/${rv4}/submit", payload: {}, as: Panelist, as_user_id: "${pl4}" }
            - &k_rev5 { call: "POST /grants/reviews", payload: { application_id: "${app1}", panelist_id: "${pl5}", artistic_excellence: 9, work_sample_quality: 8, career_impact: 9, public_value: 7, comments: "The strongest manuscript in the pool." }, as: Panelist, as_user_id: "${pl5}", captures: { rv5: "$.data.id" } }
            - &k_srev5 { call: "POST /grants/reviews/${rv5}/submit", payload: {}, as: Panelist, as_user_id: "${pl5}" }
          trigger:
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { prov_before_close: "$.data.provisional_composite_score" } }
            - &k_close_round { call: "POST /grants/panels/${pan}/close-round", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The first read returns provisional_composite_score == 7.28 and final_composite_score == null (FINAL is only written at close-round)"
            - "valid_review_count == 5 on both reads"
            - "After close-round: provisional_composite_score == 7.28 (unchanged) and final_composite_score == 7.30"
            - "final_composite_score != provisional_composite_score — the trim moved the number by exactly 0.02"
            - "score_spread == 2.50, measured over the counted set and NOT over the trimmed set"
            - "Application.status == SCORED and review_round_number == 1"

      - name: tax_report_cash_basis_vs_accrual_basis_on_one_ledger
        grounds:
          - calculations.award_tax_reportable_amount
          - calculations.installment_payment_schedule
          - entities.PaymentInstallment.fields.paid_at
          - entities.PaymentInstallment.fields.scheduled_date
        distinguishing_aspect: |
          With installments 1 and 2 paid inside 2027 and installment 3 scheduled 2027-08-29
          but paid 2028-01-10, ACCRUAL 2027 must report the whole 1,500,000 over 3 rows while
          CASH 2027 reports only 1,125,000 over 2 rows and CASH 2028 reports 375,000 over 1
          row, so an implementation that keys both variants on the same date column returns
          identical figures for at least one of the four reads and fails.
        test_recipe:
          setup:
            - "CycleMain accepted award of 1,500,000 with tin_status MISSING, so withholding is 0.2707 per installment"
            - "Installments 1 and 2 released and paid while the clock is inside 2027; installment 3 paid on 2028-01-10"
            - "The releasing fiscal officer is fiscal-1, distinct from the approving board member board-1"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *k_close_round
            - &x_board_review { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: BOARD_REVIEW }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &x_get_panel { call: "GET /grants/panels/${pan}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan_v: "$.data.version" } }
            - &x_slate { call: "POST /grants/panels/${pan}/slate", payload: { ranked_application_ids: ["${app1}"], expected_panel_version: "${pan_v}" }, as: Panelist, as_user_id: "${pl1}" }
            - &x_get_slots { call: "GET /grants/recommendation-slots", payload: { panel_id: "${pan}" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { slot1: "$.data[0].id" } }
            - &x_get_cyc { call: "GET /grants/cycles/${cyc}", payload: {}, as: CouncilBoardMember, as_user_id: "board-1", captures: { cyc_v: "$.data.version" } }
            - &x_approve1 { call: "POST /grants/recommendation-slots/${slot1}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - &x_get_awards { call: "GET /grants/awards", payload: { application_id: "${app1}" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { aw1: "$.data[0].id" } }
            - &x_accept { call: "POST /grants/awards/${aw1}/accept", payload: { accept_agreement_version: "FELLOWSHIP-AGREEMENT-2027.1", tax_certification_signed: true }, as: Artist, as_user_id: "${art1}" }
            - &x_cycle_awarded { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: AWARDED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &x_get_inst { call: "GET /grants/payment-installments", payload: { award_id: "${aw1}" }, as: FiscalOfficer, as_user_id: "fiscal-1", captures: { inst1: "$.data[0].id", inst2: "$.data[1].id", inst3: "$.data[2].id" } }
            - &x_clock_jan1 { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &x_rel1 { call: "POST /grants/payment-installments/${inst1}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - &x_pay1 { call: "POST /grants/payment-installments/${inst1}/pay", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/payment-installments/${inst2}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /grants/payment-installments/${inst2}/pay", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-01-10T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/payment-installments/${inst3}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /grants/payment-installments/${inst3}/pay", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
          trigger:
            - { call: "GET /grants/awards/${aw1}/tax-report", payload: { tax_year: 2027, basis: "ACCRUAL" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw1}/tax-report", payload: { tax_year: 2027, basis: "CASH" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw1}/tax-report", payload: { tax_year: 2028, basis: "CASH" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw1}/tax-report", payload: { tax_year: 2028, basis: "ACCRUAL" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
            - "ACCRUAL 2027 -> reportable_gross_cents 1500000, reportable_withholding_cents 406051, reportable_net_cents 1093949, installment_count 3"
            - "CASH 2027 -> reportable_gross_cents 1125000, reportable_withholding_cents 304538, reportable_net_cents 820462, installment_count 2"
            - "CASH 2028 -> reportable_gross_cents 375000, reportable_withholding_cents 101513, reportable_net_cents 273487, installment_count 1"
            - "ACCRUAL 2028 -> all three cent figures 0 and installment_count 0, because every scheduled_date falls in 2027"
            - "CASH 2027 gross + CASH 2028 gross == ACCRUAL 2027 gross == 1500000 (no double counting, no loss)"
            - "Omitting basis defaults to ACCRUAL: GET with tax_year 2027 and no basis matches the ACCRUAL 2027 figures"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # --- mode (a): three-or-more inputs combined multiplicatively -----------
      - name: panel_readiness_seat_region_conflict_and_specialist_bonus_compose
        grounds:
          - calculations.panel_readiness_score
          - state_machines.Panel.FORMING_to_CHARTERED
          - state_machines.Panelist.SEATED_to_RECUSED
          - validations[priority=85]
        distinguishing_aspect: |
          Two panels differ in exactly one input — one seated reader carries TRADITIONAL_ARTS
          alongside LITERARY_ARTS — and both carry 4 of 5 seats, full region coverage and one
          BLOCKING conflict, so readiness must be 73.60 for the plain panel (charter refused)
          and 80.96 for the specialist panel (charter granted); any additive combination, any
          bonus applied before the conflict penalty as an additive term, or any bonus applied
          to the seat ratio alone produces a different pair and flips at least one charter.
        test_recipe:
          setup:
            - "CycleMain in PANEL_REVIEW with one ELIGIBLE application"
            - "Panel A: required_seats 5, required_regions [NORTH, CENTRAL, SOUTH], 4 seated readers all LITERARY_ARTS only"
            - "Panel B: identical shape on a disjoint deliberation window, but reader 4 also carries TRADITIONAL_ARTS"
            - "Both panels receive exactly one DISCRETIONARY conflict screened BLOCKING, so blocking_conflict_count is 1 on each"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 5, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan_a: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan_a}", person_email: "a1.north@example.org", full_name: "Ana Ruiz", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: true }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pa1: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan_a}", person_email: "a2.central@example.org", full_name: "Ben Cole", region: CENTRAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pa2: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan_a}", person_email: "a3.south@example.org", full_name: "Cara Dial", region: SOUTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pa3: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan_a}", person_email: "a4.north@example.org", full_name: "Dov Emet", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pa4: "$.data.id" } }
            - { call: "POST /grants/panelists/${pa1}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists/${pa2}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
