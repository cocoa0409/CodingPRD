  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_slot_half_open_interval_overlap
        grounds:
          - validations[priority=8]
          - entities.BoothSlot.fields.start_at
        distinguishing_aspect: |
          Resource = BoothLocation; semantics = strict half-open interval
          overlap [start_at, end_at): a new slot whose start equals an existing
          slot's end (touching boundary) is ALLOWED, while any interior overlap
          is rejected with ERR_BOOTH_CONFLICT. Instance pins both the touching-
          allowed and overlap-rejected arms.
        test_recipe:
          setup:
            - "Season SELLING; location with permission; existing slot 14:00-16:00"
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2041", name: "S41", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
