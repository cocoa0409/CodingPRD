# =============================================================================
# PRD Benchmark Seed Tables — task_1513_forklift_fleet_sales_rental_service
# =============================================================================

scenario: |
  Forklift Fleet Sales, Rental & Service (Toyota Material Handling dealer): unit
  configuration & attachment quoting, rental fleet utilization & short-term/long-term
  rate, planned maintenance interval by hour meter, breakdown dispatch & mobile van
  inventory, operator training/certification & renewal, battery/charger vs LP fuel
  program, lease-end condition & residual, used-unit reconditioning & resale

domain_name: forklift-fleet
api_prefix: /fleet

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # rental windows + dispatch windows on shared resources
  secondary_archetype: quota_allocation        # credit holds on Customer, van-stock part holds on Technician
  complexity_layers:
    - optimistic_concurrency                   # OCC on Unit.version for rental-contract creation
    - dual_variant_calculation                 # provisional vs final rental billing; battery vs LP fuel cost
    - rate_threshold_triggers                  # hour-meter PM interval crossing
    - cascading_side_effects                   # return -> posture -> auto PM call; settle -> credit hold -> cancel
  entity_topology: flat                        # peer entities joined by foreign keys
  state_machine_shape: parallel                # Unit: availability_status x maintenance_posture; plus cyclic Quote / ServiceCall
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                       # each operational role owns a distinct resource family
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# common_fields: true  -> id, created_at, updated_at, version (version starts 1, +1 per mutation)
# common_fields: false -> id, created_at only
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer organization name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted exposure (outstanding + holds)" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Contract/quote discount fraction, e.g. 0.10 = 10%; 0 <= discount_pct < 1" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Posted charges (quote acceptances, final rental bills, lease settlements)" }
      - { name: credit_holds_cents, type: integer, source: computed, default: 0, description: "Sum of provisional estimates on RESERVED rental contracts" }
      - { name: available_credit_cents, type: integer, source: computed, description: "= credit_limit_cents - outstanding_balance_cents - credit_holds_cents" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CREDIT_HOLD — flips to CREDIT_HOLD when outstanding_balance_cents > credit_limit_cents after a posting", constraints: "values: ACTIVE, CREDIT_HOLD" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number (unique)", constraints: "unique across all units" }
      - { name: model, type: string, source: input, description: "Model code, e.g. 8FGCU25" }
      - { name: power_type, type: enum, source: input, description: "BATTERY | LP", constraints: "values: BATTERY, LP" }
      - { name: fuel_program, type: enum, source: system, description: "Mirrors power_type: BATTERY units use CHARGE/SWAP events, LP units use LP_REFILL", constraints: "values: BATTERY, LP" }
      - { name: disposition, type: enum, source: input, description: "NEW_SALE | RENTAL_FLEET | USED_SALE — gates which contracts may reference the unit; lease return flips disposition to USED_SALE", constraints: "values: NEW_SALE, RENTAL_FLEET, USED_SALE" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental day rate (>= 1)" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Rental 7-day rate" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Rental 28-day rate" }
      - { name: pm_interval_hours, type: integer, source: input, description: "Planned-maintenance interval in hour-meter hours (>= 1)" }
      - { name: hour_meter, type: number, source: computed, default: 0, description: "Current hour-meter reading; only advances via meter readings, rental return, or PM resolution" }
      - { name: last_pm_hours, type: number, source: system, default: 0, description: "hour_meter value at last completed PM service" }
      - { name: next_pm_due_hours, type: number, source: computed, description: "= last_pm_hours + pm_interval_hours" }
      - { name: maintenance_posture, type: enum, source: system, default: PM_OK, description: "PM_OK | PM_DUE — parallel state dimension, independent of availability_status; PM_DUE iff hour_meter >= next_pm_due_hours", constraints: "values: PM_OK, PM_DUE" }
      - { name: availability_status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | ON_RENT | IN_SHOP | IN_RECON | LISTED | SOLD | ON_LEASE", constraints: "values: AVAILABLE, ON_RENT, IN_SHOP, IN_RECON, LISTED, SOLD, ON_LEASE" }
      - { name: resale_price_cents, type: integer, source: system, description: "Listing price set when a reconditioning order completes with QC PASS; null until then", default: null }
      - { name: utilization_pct_90d, type: number, source: computed, default: 0, description: "Rented days within the trailing 90-day window ending at the logical clock, / 90 * 100, 1 decimal place round_half_up (see calculations.fleet_utilization)" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; buyer" }
      - { name: kind, type: enum, source: input, description: "NEW_CONFIG (configure-to-order new unit + attachments) | USED_UNIT_SALE (sell a LISTED used unit)", constraints: "values: NEW_CONFIG, USED_UNIT_SALE" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; required iff kind == USED_UNIT_SALE, must be null otherwise", default: null }
      - { name: valid_until, type: datetime, source: input, description: "Quote validity deadline (ISO date); accept rejected after this date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED | EXPIRED", constraints: "values: DRAFT, SUBMITTED, ACCEPTED, EXPIRED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last submit; null in DRAFT", default: null }
      - { name: revision_count, type: integer, source: system, default: 0, description: "+1 on every revise (SUBMITTED -> DRAFT)" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of QuoteLine.extended_cents" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * tier_pct) — computed ONCE on the subtotal, never per line" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "round_half_up((subtotal_cents - discount_cents) * 0.08)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= subtotal_cents - discount_cents + tax_cents" }

  - name: QuoteLine
    parent: Quote
    common_fields: false
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; parent quote (path parameter)" }
      - { name: description, type: string, source: input, description: "Attachment or configuration line description" }
      - { name: qty, type: integer, source: input, description: "Quantity (>= 1)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price in cents (>= 0)" }
      - { name: extended_cents, type: integer, source: computed, description: "= qty * unit_price_cents (exact integer cents)" }

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; rented unit" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; renter" }
      - { name: start_date, type: datetime, source: input, description: "Rental start date (inclusive), ISO date" }
      - { name: end_date, type: datetime, source: input, description: "Rental end date (exclusive), ISO date; must be > start_date" }
      - { name: scheduled_days, type: integer, source: computed, description: "= (end_date - start_date) in whole days, half-open window [start_date, end_date)" }
      - { name: rate_tier, type: enum, source: computed, description: "DAILY if scheduled_days < 7; WEEKLY if 7 <= scheduled_days < 28; MONTHLY if scheduled_days >= 28", constraints: "values: DAILY, WEEKLY, MONTHLY" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "Forward-looking estimate at creation (see calculations.rental_billing provisional variant); also placed as credit hold" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Chronological actual billing at return; null until RETURNED", default: null }
      - { name: checkout_hours, type: number, source: system, description: "Unit hour_meter captured at checkout; null until ON_RENT", default: null }
      - { name: return_hours, type: number, source: system, description: "Hour-meter reading reported at return; null until RETURNED", default: null }
      - { name: actual_return_date, type: datetime, source: system, description: "Return date; null until RETURNED", default: null }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | ON_RENT | RETURNED | CANCELLED", constraints: "values: RESERVED, ON_RENT, RETURNED, CANCELLED" }

  - name: MeterReading
    parent: Unit
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; parent unit (path parameter)" }
      - { name: reading_hours, type: number, source: input, description: "New hour-meter value; must be strictly greater than the unit's current hour_meter" }
      - { name: note, type: string, source: input, description: "Optional note", default: null }

  - name: FuelEvent
    parent: Unit
    common_fields: false
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; parent unit (path parameter)" }
      - { name: event_type, type: enum, source: input, description: "CHARGE | SWAP (BATTERY program only) | LP_REFILL (LP program only)", constraints: "values: CHARGE, SWAP, LP_REFILL" }
      - { name: kwh, type: number, source: input, default: 0, description: "kWh charged; only for CHARGE/SWAP (>= 0)" }
      - { name: cylinders, type: integer, source: input, default: 0, description: "LP cylinders exchanged; only for LP_REFILL (>= 0)" }
      - { name: cost_cents, type: integer, source: computed, description: "Program-specific cost (see calculations.fuel_event_cost variants)" }

  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit under service" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; service customer" }
      - { name: call_type, type: enum, source: input, description: "BREAKDOWN | PM (planned maintenance)", constraints: "values: BREAKDOWN, PM" }
      - { name: priority, type: enum, source: input, description: "EMERGENCY | STANDARD", constraints: "values: EMERGENCY, STANDARD" }
      - { name: operator_id, type: string, source: input, default: null, description: "FK -> Operator.id; customer operator who will run the unit during repair verification; if present, must hold an ACTIVE certification at dispatch" }
      - { name: technician_id, type: string, source: system, default: null, description: "FK -> Technician.id; assigned at dispatch" }
      - { name: required_parts, type: array, source: input, description: "Array of {part_number: string, qty: integer >= 0}; reserved from the technician's van stock at dispatch" }
      - { name: used_parts, type: array, source: system, default: null, description: "Array of {part_number, qty} actually consumed; set at resolve" }
      - { name: scheduled_start, type: datetime, source: system, default: null, description: "Dispatch window start (set at dispatch)" }
      - { name: scheduled_end, type: datetime, source: system, default: null, description: "Dispatch window end (set at dispatch)" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "true when created automatically by the PM-due cascade" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | DISPATCHED | CLOSED", constraints: "values: OPEN, DISPATCHED, CLOSED" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: home_branch, type: string, source: input, description: "Home branch code" }
      - { name: van_stock, type: array, source: input, default: [], description: "Mobile van inventory: array of {part_number: string, qty: integer >= 0}; dispatch decrements, release/resolve restore" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE (via deactivate)", constraints: "values: ACTIVE, INACTIVE" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; employing organization" }
      - { name: full_name, type: string, source: input, description: "Operator name" }
      - { name: badge_number, type: string, source: input, description: "Badge / employee number" }

  - name: Certification
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; parent operator (path parameter)" }
      - { name: cert_class, type: enum, source: input, description: "SIT_DOWN | STAND_UP | ORDER_PICKER", constraints: "values: SIT_DOWN, STAND_UP, ORDER_PICKER" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; must be after the logical clock at issuance/renewal" }
      - { name: renewed_count, type: integer, source: system, default: 0, description: "+1 on every renew" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | REVOKED", constraints: "values: ACTIVE, EXPIRED, REVOKED" }

  - name: LeaseContract
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; leased unit (disposition NEW_SALE or RENTAL_FLEET)" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; lessee" }
      - { name: start_date, type: datetime, source: input, description: "Lease start date" }
      - { name: end_date, type: datetime, source: input, description: "Lease end date; must be > start_date" }
      - { name: allowed_hours, type: integer, source: input, description: "Contractual hour allowance over the lease term (>= 0)" }
      - { name: excess_hour_rate_cents, type: integer, source: input, description: "Charge per excess hour (>= 0)" }
      - { name: residual_value_cents, type: integer, source: input, description: "Contractual residual value at lease end (>= 0)" }
      - { name: return_date, type: datetime, source: system, default: null, description: "Actual return date" }
      - { name: settlement_total_cents, type: integer, source: computed, default: null, description: "Lease-end settlement (see calculations.lease_settlement); null until SETTLED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETURNED | SETTLED", constraints: "values: ACTIVE, RETURNED, SETTLED" }

  - name: LeaseInspection
    parent: LeaseContract
    common_fields: false
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> LeaseContract.id; parent lease (path parameter)" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | D condition grade at return", constraints: "values: A, B, C, D" }
      - { name: hours_at_return, type: number, source: input, description: "Hour-meter reading at return (>= 0)" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraised market value at return (>= 0)" }
      - { name: wear_charge_cents, type: integer, source: computed, description: "= WEAR_TABLE[condition_grade] (A 0, B 150000, C 400000, D 900000)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED; at most one APPROVED inspection per lease", constraints: "values: SUBMITTED, APPROVED" }

  - name: ReconditioningOrder
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; used unit being reconditioned (disposition USED_SALE)" }
      - { name: notes, type: string, source: input, default: null, description: "Work scope notes" }
      - { name: qc_fail_count, type: integer, source: system, default: 0, description: "+1 each time complete is called with qc_result FAIL" }
      - { name: listing_price_cents, type: integer, source: system, default: null, description: "Resale listing price set on QC PASS" }
      - { name: status, type: enum, source: system, default: IN_PROGRESS, description: "IN_PROGRESS | COMPLETED", constraints: "values: IN_PROGRESS, COMPLETED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleet/quotes/{id}/submit"
        actor: SalesRep
        preconditions:
          - "quote has >= 1 line (ERR_QUOTE_EMPTY)"
        side_effects:
          - "submitted_at = logical clock"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /fleet/quotes/{id}/revise"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "revision_count += 1"
          - "submitted_at = null"
        note: "revision loop — quote may cycle SUBMITTED -> DRAFT -> SUBMITTED any number of times"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /fleet/quotes/{id}/accept"
        actor: SalesRep
        preconditions:
          - "logical clock <= valid_until (ERR_QUOTE_EXPIRED)"
          - "customer has >= 1 Operator holding a Certification with status ACTIVE (ERR_NO_CERTIFIED_OPERATOR)"
          - "if kind == USED_UNIT_SALE: referenced unit availability_status == LISTED (ERR_UNIT_NOT_LISTED)"
          - "total_cents <= customer.available_credit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "customer.outstanding_balance_cents += total_cents"
          - "if kind == USED_UNIT_SALE: unit.availability_status LISTED -> SOLD"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (when the logical clock advances past valid_until via POST /_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "quote is no longer acceptable"

  - entity: RentalContract
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /fleet/rental-contracts (creation)"
        actor: RentalCoordinator
        preconditions:
          - "unit.availability_status in {AVAILABLE, ON_RENT} (ERR_UNIT_NOT_AVAILABLE)"
          - "expected_unit_version == unit.version (ERR_STALE_VERSION)"
          - "unit.disposition == RENTAL_FLEET (ERR_UNIT_DISPOSITION_MISMATCH)"
          - "window [start_date, end_date) does not overlap any other contract on the same unit with status in {RESERVED, ON_RENT}; half-open: adjacency (end == other.start or start == other.end) is allowed (ERR_RENTAL_WINDOW_OVERLAP)"
          - "customer.account_status == ACTIVE (ERR_ACCOUNT_CREDIT_HOLD)"
          - "provisional_estimate_cents <= customer.available_credit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "provisional_estimate_cents computed (provisional variant of calculations.rental_billing)"
          - "customer.credit_holds_cents += provisional_estimate_cents"
          - "increments Unit.version by 1"
      - from: RESERVED
        to: ON_RENT
        trigger: "POST /fleet/rental-contracts/{id}/checkout"
        actor: RentalCoordinator
        preconditions:
          - "unit.availability_status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
          - "unit.maintenance_posture == PM_OK (ERR_PM_OVERDUE)"
          - "customer.account_status == ACTIVE (ERR_ACCOUNT_CREDIT_HOLD)"
        side_effects:
          - "checkout_hours = unit.hour_meter"
          - "unit.availability_status ON_RENT"
      - from: ON_RENT
        to: RETURNED
        trigger: "POST /fleet/rental-contracts/{id}/return"
        actor: RentalCoordinator
        preconditions:
          - "return_hours > unit.hour_meter (ERR_HOUR_METER_REGRESSION)"
        side_effects:
          - "return_hours and actual_return_date recorded"
          - "final_charge_cents computed (final variant of calculations.rental_billing)"
          - "customer.credit_holds_cents -= provisional_estimate_cents"
          - "customer.outstanding_balance_cents += final_charge_cents"
          - "unit.hour_meter = return_hours (link 1 of PM cascade)"
          - "if return_hours >= unit.next_pm_due_hours: unit.maintenance_posture -> PM_DUE (link 2)"
          - "if posture became PM_DUE: auto-create ServiceCall {call_type: PM, customer_id: contract.customer_id, priority: STANDARD, required_parts: [], auto_created: true, status: OPEN} (link 3)"
          - "unit.availability_status = IN_SHOP if posture PM_DUE else AVAILABLE"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fleet/rental-contracts/{id}/cancel, or system (customer flips to CREDIT_HOLD)"
        actor: RentalCoordinator | system
        preconditions: []
        side_effects:
          - "customer.credit_holds_cents -= provisional_estimate_cents"

  - entity: Unit
    initial_state: AVAILABLE
    terminal_states: [SOLD]
    note: "availability_status dimension — parallel to maintenance_posture; the two evolve independently"
    transitions:
      - from: AVAILABLE
        to: ON_RENT
        trigger: "rental checkout"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: AVAILABLE
        trigger: "rental return with posture PM_OK"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_RENT
        to: IN_SHOP
        trigger: "rental return with posture PM_DUE"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: IN_SHOP
        trigger: "dispatch of a BREAKDOWN service call for this unit (dealer-site repair)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SHOP
        to: AVAILABLE
        trigger: "service call resolve, or service call release"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: ON_LEASE
        trigger: "lease contract creation"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_LEASE
        to: AVAILABLE
        trigger: "lease return"
        actor: system
        preconditions: []
        side_effects:
          - "unit.disposition = USED_SALE (off-lease units become used inventory)"
      - from: AVAILABLE
        to: IN_RECON
        trigger: "reconditioning order creation"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_RECON
        to: LISTED
        trigger: "reconditioning order complete with qc_result PASS"
        actor: system
        preconditions: []
        side_effects:
          - "unit.resale_price_cents = listing_price_cents"
      - from: LISTED
        to: SOLD
        trigger: "accept of a USED_UNIT_SALE quote referencing this unit"
        actor: system
        preconditions: []
        side_effects:
          - "unit is no longer referenceable by new contracts; meter readings and fuel events rejected (ERR_INVALID_STATE)"

  - entity: Unit
    initial_state: PM_OK
    terminal_states: []
    note: "maintenance_posture dimension — parallel to availability_status"
    transitions:
      - from: PM_OK
        to: PM_DUE
        trigger: "system (after any hour_meter advance — meter reading, rental return — when hour_meter >= next_pm_due_hours)"
        actor: system
        preconditions: []
        side_effects:
          - "auto-create PM ServiceCall (status OPEN, auto_created: true) — except when the advance came from a PM resolve itself"
      - from: PM_DUE
        to: PM_OK
        trigger: "resolve of a PM-type service call for this unit"
        actor: system
        preconditions: []
        side_effects:
          - "last_pm_hours = hour_meter"
          - "next_pm_due_hours recomputed = last_pm_hours + pm_interval_hours"

  - entity: ServiceCall
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /fleet/service-calls/{id}/dispatch"
        actor: ServiceDispatcher
        preconditions:
          - "if operator_id present: that operator holds >= 1 Certification with status ACTIVE (ERR_OPERATOR_CERT_EXPIRED)"
          - "technician.status == ACTIVE (ERR_TECHNICIAN_INACTIVE)"
          - "for every {part_number, qty} in required_parts: technician.van_stock entry qty >= required qty (ERR_VAN_STOCK_INSUFFICIENT)"
          - "dispatch window [scheduled_start, scheduled_end] expanded by 60 minutes on both sides (closed interval) must not intersect any other DISPATCHED window (same expansion) for the same technician (ERR_DISPATCH_WINDOW_OVERLAP)"
        side_effects:
          - "technician_id, scheduled_start, scheduled_end recorded"
          - "van stock decremented by required_parts (parts loaded onto the job)"
          - "if unit.availability_status == AVAILABLE: unit.availability_status -> IN_SHOP"
      - from: DISPATCHED
        to: OPEN
        trigger: "POST /fleet/service-calls/{id}/release"
        actor: ServiceDispatcher
        preconditions: []
        side_effects:
          - "required_parts quantities returned to technician van stock"
          - "technician_id, scheduled_start, scheduled_end cleared to null"
          - "if this call moved the unit to IN_SHOP: unit.availability_status -> AVAILABLE"
        note: "release/re-dispatch loop — DISPATCHED -> OPEN -> DISPATCHED allowed"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /fleet/service-calls/{id}/resolve"
        actor: Technician
        preconditions:
          - "X-User-ID == service_call.technician_id (ERR_UNAUTHORIZED)"
          - "every used_parts qty <= the dispatched qty for that part (ERR_INVALID_REQUEST)"
        side_effects:
          - "used_parts recorded; (required qty - used qty) returned to van stock per part"
          - "if call_type == PM: unit.last_pm_hours = unit.hour_meter; unit.maintenance_posture -> PM_OK; next_pm_due_hours recomputed"
          - "if this call moved the unit to IN_SHOP: unit.availability_status -> AVAILABLE"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (when the logical clock advances past expires_at via POST /_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fleet/certifications/{id}/renew"
        actor: TrainingRegistrar
        preconditions:
          - "new_expires_at > logical clock (ERR_INVALID_REQUEST)"
        side_effects:
          - "expires_at = new_expires_at"
          - "renewed_count += 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /fleet/certifications/{id}/renew"
        actor: TrainingRegistrar
        preconditions:
          - "new_expires_at > logical clock (ERR_INVALID_REQUEST)"
        side_effects:
          - "expires_at = new_expires_at"
          - "renewed_count += 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /fleet/certifications/{id}/revoke"
        actor: TrainingRegistrar
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /fleet/certifications/{id}/revoke"
        actor: TrainingRegistrar
        preconditions: []
        side_effects: []

  - entity: LeaseContract
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /fleet/lease-contracts (creation)"
        actor: LeaseManager
        preconditions:
          - "unit.availability_status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
          - "unit.disposition in {NEW_SALE, RENTAL_FLEET} (ERR_UNIT_DISPOSITION_MISMATCH)"
        side_effects:
          - "unit.availability_status -> ON_LEASE"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /fleet/lease-contracts/{id}/return"
        actor: LeaseManager
        preconditions: []
        side_effects:
          - "return_date recorded"
          - "unit.availability_status -> AVAILABLE"
          - "unit.disposition -> USED_SALE"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /fleet/lease-contracts/{id}/settle"
        actor: LeaseManager
        preconditions:
          - "exactly one LeaseInspection with status APPROVED exists for this lease (ERR_INSPECTION_NOT_APPROVED)"
        side_effects:
          - "settlement_total_cents computed from the approved inspection (calculations.lease_settlement)"
          - "customer.outstanding_balance_cents += settlement_total_cents (link 1 of credit cascade)"
          - "if customer.outstanding_balance_cents > customer.credit_limit_cents: customer.account_status -> CREDIT_HOLD (link 2)"
          - "on CREDIT_HOLD flip: every RentalContract of this customer with status RESERVED is auto-cancelled (status -> CANCELLED) and its credit hold released (link 3)"

  - entity: LeaseInspection
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fleet/inspections/{id}/approve"
        actor: LeaseManager
        preconditions:
          - "no other APPROVED inspection exists for the same lease (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ReconditioningOrder
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED]
    transitions:
      - from: null
        to: IN_PROGRESS
        trigger: "POST /fleet/reconditioning-orders (creation)"
        actor: FleetManager
        preconditions:
          - "unit.disposition == USED_SALE (ERR_UNIT_DISPOSITION_MISMATCH)"
          - "unit.availability_status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "unit.availability_status -> IN_RECON"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fleet/reconditioning-orders/{id}/complete with qc_result == PASS"
        actor: FleetManager
        preconditions:
          - "listing_price_cents present when qc_result == PASS (ERR_INVALID_REQUEST)"
        side_effects:
          - "listing_price_cents recorded"
          - "unit.availability_status IN_RECON -> LISTED"
          - "unit.resale_price_cents = listing_price_cents"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /fleet/reconditioning-orders/{id}/complete with qc_result == FAIL"
        actor: FleetManager
        preconditions: []
        side_effects:
          - "qc_fail_count += 1"
        note: "QC-fail rework loop"

  - entity: Technician
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /fleet/technicians/{id}/deactivate"
        actor: ServiceDispatcher
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2a: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: rental-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /fleet/rental-contracts"
    occ_field: expected_unit_version
    description: |
      Creating a RentalContract against a Unit whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. Contract creation
      re-derives the unit's reserved windows and utilization, so a create carrying a
      stale expected_unit_version is working from an out-of-date unit view even when
      the requested window itself would otherwise be valid.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "on every QuoteLine creation (recomputes the parent quote); read on GET /fleet/quotes/{id}"
    algorithm: aggregation
    input_set: "all QuoteLine rows of the quote (any quote status; lines only exist while DRAFT mutability applies)"
    constants:
      TAX_RATE: 0.08
      TIER2_THRESHOLD_CENTS: 500000
      TIER2_PCT: 0.10
      TIER1_THRESHOLD_CENTS: 100000
      TIER1_PCT: 0.05
    precision: "integer cents; discount and tax rounded round_half_up to whole cents"
    formula: |
      for each line: extended_cents = qty * unit_price_cents          # exact integer cents
      subtotal_cents = sum(extended_cents)
      tier_pct = 0.10 if subtotal_cents >= 500000
                 else 0.05 if subtotal_cents >= 100000
                 else 0                                              # tier boundary is >=, inclusive
      discount_cents = round_half_up(subtotal_cents * tier_pct)      # computed ONCE on the subtotal
      tax_cents      = round_half_up((subtotal_cents - discount_cents) * 0.08)
      total_cents    = subtotal_cents - discount_cents + tax_cents
      PINNED ROUNDING ORDER: per-line multiply -> sum -> ONE discount rounding at quote
      level -> tax on the net. Rounding the discount per line and summing is a different
      algorithm and is NOT the spec (e.g. lines 99980/10/10 give subtotal-level 5000 vs
      per-line 5001).
    variants: []

  - name: rental_billing
    trigger: "provisional variant on contract creation; final variant on return"
    algorithm: tiered_pricing
    input_set: "the RentalContract (start_date, end_date, actual_return_date), the Unit's rate fields, the Customer's discount_pct"
    constants:
      WEEKLY_MIN_DAYS: 7
      MONTHLY_MIN_DAYS: 28
      MONTH_DAYS: 28
      WEEK_DAYS: 7
      OVERAGE_MULTIPLIER: 1.5
    precision: "integer cents; overage day charge = round_half_up(1.5 * daily_rate_cents) computed once"
    formula: |
      scheduled_days = (end_date - start_date).days                  # half-open [start_date, end_date)
      tier = MONTHLY if scheduled_days >= 28 else WEEKLY if scheduled_days >= 7 else DAILY
      PROVISIONAL (creation/checkout estimate):
        DAILY:   tier_amount = scheduled_days * daily_rate_cents
        WEEKLY:  tier_amount = ceil(scheduled_days / 7) * weekly_rate_cents
        MONTHLY: tier_amount = ceil(scheduled_days / 28) * monthly_rate_cents
        provisional_estimate_cents = max(round_half_up(tier_amount * (1 - discount_pct)), daily_rate_cents)
      FINAL (at return):
        actual_days  = (actual_return_date - start_date).days
        overage_days = max(0, actual_days - scheduled_days)
        DAILY:   tier_final = scheduled_days * daily_rate_cents
        WEEKLY:  tier_final = floor(scheduled_days / 7) * weekly_rate_cents
                              + min((scheduled_days mod 7) * daily_rate_cents, weekly_rate_cents)
        MONTHLY: tier_final = floor(scheduled_days / 28) * monthly_rate_cents
                              + min(ceil((scheduled_days mod 28) / 7) * weekly_rate_cents, monthly_rate_cents)
        final_charge_cents = round_half_up(tier_final * (1 - discount_pct))
                             + overage_days * round_half_up(1.5 * daily_rate_cents)
      Note: the discount applies only to the tier portion; overage days are never discounted.
    variants:
      - name: provisional
        when: "at contract creation (forward-looking estimate, also placed as the credit hold)"
        difference: "WEEKLY tier rounds UP to whole weeks (ceil(days/7) * weekly); ignores actual return"
      - name: final
        when: "at return (chronological actual billing)"
        difference: "WEEKLY tier charges floor(days/7) full weeks plus the remainder days at daily rate capped at one weekly rate; adds undiscounted overage days at 1.5x daily rate. Identical scheduled data therefore yields a different number than provisional (e.g. 10 days: 140000 provisional vs 115000 final at daily 15000 / weekly 70000)"

  - name: fuel_event_cost
    trigger: "on FuelEvent creation"
    algorithm: weighted_scoring
    input_set: "the FuelEvent (event_type, kwh, cylinders) and the unit's fuel_program"
    constants:
      KWH_RATE_CENTS: 12
      SWAP_FEE_CENTS: 2500
      LP_CYLINDER_PRICE_CENTS: 4500
      LP_DELIVERY_FEE_CENTS: 1500
    precision: "integer cents (round_half_up if kwh is fractional)"
    formula: |
      BATTERY program:
        CHARGE:   cost_cents = round_half_up(kwh * 12)
        SWAP:     cost_cents = 2500 + round_half_up(kwh * 12)
      LP program:
        LP_REFILL: cost_cents = cylinders * 4500 + 1500
      Event types not matching the unit's fuel_program are rejected (ERR_FUEL_PROGRAM_MISMATCH).
    variants:
      - name: battery_program
        when: "unit.fuel_program == BATTERY"
        difference: "per-kWh metering plus a flat swap fee; 100 kWh charge costs 1200 cents"
      - name: lp_program
        when: "unit.fuel_program == LP"
        difference: "per-cylinder pricing plus a flat delivery fee; 2 cylinders cost 10500 cents — a different algorithm and a different number for the same replenishment intent"

  - name: pm_due_evaluation
    trigger: "after every hour_meter advance (meter reading, rental return) and after PM resolve"
    algorithm: threshold
    input_set: "unit.hour_meter, unit.last_pm_hours, unit.pm_interval_hours"
    constants: {}
    precision: "hours compared exactly (number)"
    formula: |
      next_pm_due_hours = last_pm_hours + pm_interval_hours
      maintenance_posture = PM_DUE iff hour_meter >= next_pm_due_hours   # boundary is >=, inclusive:
                                                                         # a reading of exactly next_pm_due_hours is DUE
      on PM resolve: last_pm_hours = hour_meter; maintenance_posture = PM_OK; next_pm_due_hours recomputed
    variants: []

  - name: lease_settlement
    trigger: "on POST /fleet/lease-contracts/{id}/settle"
    algorithm: tiered_pricing
    input_set: "the lease (allowed_hours, excess_hour_rate_cents, residual_value_cents) and its single APPROVED inspection (condition_grade, hours_at_return, appraised_value_cents)"
    constants:
      WEAR_A_CENTS: 0
      WEAR_B_CENTS: 150000
      WEAR_C_CENTS: 400000
      WEAR_D_CENTS: 900000
      SETTLE_TIER1_THRESHOLD_CENTS: 200000
      SETTLE_TIER1_PCT: 0.05
      SETTLE_TIER2_THRESHOLD_CENTS: 500000
      SETTLE_TIER2_PCT: 0.10
    precision: "integer cents; final multiplication rounded round_half_up"
    formula: |
      hours_overage_cents       = max(0, hours_at_return - allowed_hours) * excess_hour_rate_cents
      wear_charge_cents         = WEAR_TABLE[condition_grade]            # from the inspection (computed field)
      residual_shortfall_cents  = max(0, residual_value_cents - appraised_value_cents)
      pre_discount_total_cents  = hours_overage_cents + wear_charge_cents + residual_shortfall_cents
      tier_pct = 0.10 if pre_discount_total_cents >= 500000
                 else 0.05 if pre_discount_total_cents >= 200000
                 else 0
      settlement_total_cents = round_half_up(pre_discount_total_cents * (1 - tier_pct))
      PINNED EVALUATION ORDER (circular-looking dependency resolved): the loyalty tier is
      keyed on the PRE-discount total, even though the discounted result can fall back below
      the threshold (e.g. pre 520000 -> 10% tier -> settle 468000; keying the tier on the
      post-discount amount would wrongly give 5% -> 494000). Compute components -> sum ->
      select tier -> apply discount. Never re-derive the tier from the discounted total.
    variants: []

  - name: fleet_utilization
    trigger: "recomputed on read of a Unit and on any rental contract status change for that unit"
    algorithm: aggregation
    input_set: "the unit's RentalContracts with status in {ON_RENT, RETURNED}; the logical clock"
    constants:
      WINDOW_DAYS: 90
    precision: "1 decimal place, round_half_up"
    formula: |
      window = [clock - 90 days, clock] (calendar days, half-open at the right edge)
      rented_days = sum over contracts (status ON_RENT or RETURNED) of:
        RETURNED: max(0, (min(actual_return_date, clock) - max(start_date, window_start)).days)
        ON_RENT:  max(0, (clock - max(start_date, window_start)).days)
      utilization_pct_90d = round_half_up(rented_days / 90 * 100, 1 decimal)
      A unit with no qualifying contracts has utilization_pct_90d = 0.0.
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted for this endpoint; Technician resolving a service call must be the assigned technician (X-User-ID == service_call.technician_id)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "request body shape: required fields present, types correct, enum values valid, qty >= 1, dates parseable, end_date > start_date, expires_at/new_expires_at after the logical clock, listing_price_cents present on QC PASS, used_parts qty <= dispatched qty", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "referenced resources exist, validated left-to-right (path ids first, then body ids such as unit_id / customer_id / technician_id / operator_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "target resource is in a valid state for the requested transition; also: meter readings and fuel events rejected on SOLD units; second inspection approve on a lease that already has an APPROVED inspection", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "lease settle requires the lease to be RETURNED AND to have exactly one APPROVED inspection; ERR_INSPECTION_NOT_APPROVED fires when the lease IS RETURNED but has no APPROVED inspection (a lease not in RETURNED at all fails with ERR_INVALID_STATE first)", error_id: ERR_INSPECTION_NOT_APPROVED, http_status: 409, applies_to: ["POST /fleet/lease-contracts/{id}/settle"] }
  - { priority: 6, category: state, check: "unit availability gate: rental create requires availability in {AVAILABLE, ON_RENT}; rental checkout, lease create, recon order create require availability == AVAILABLE", error_id: ERR_UNIT_NOT_AVAILABLE, http_status: 409, applies_to: ["POST /fleet/rental-contracts", "POST /fleet/rental-contracts/{id}/checkout", "POST /fleet/lease-contracts", "POST /fleet/reconditioning-orders"] }
  - { priority: 7, category: state, check: "OCC: expected_unit_version must equal the unit's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /fleet/rental-contracts"] }
  - { priority: 8, category: business_safety, check: "rental checkout blocked when unit.maintenance_posture == PM_DUE", error_id: ERR_PM_OVERDUE, http_status: 422, applies_to: ["POST /fleet/rental-contracts/{id}/checkout"] }
  - { priority: 9, category: business_safety, check: "quote accept requires the customer to have >= 1 operator holding an ACTIVE certification", error_id: ERR_NO_CERTIFIED_OPERATOR, http_status: 422, applies_to: ["POST /fleet/quotes/{id}/accept"] }
  - { priority: 10, category: business_safety, check: "dispatch with operator_id requires that operator to hold >= 1 ACTIVE certification at dispatch time", error_id: ERR_OPERATOR_CERT_EXPIRED, http_status: 422, applies_to: ["POST /fleet/service-calls/{id}/dispatch"] }
  - { priority: 11, category: business_constraint, check: "unit disposition gate: rental create requires RENTAL_FLEET; lease create requires NEW_SALE or RENTAL_FLEET; reconditioning create requires USED_SALE", error_id: ERR_UNIT_DISPOSITION_MISMATCH, http_status: 422, applies_to: ["POST /fleet/rental-contracts", "POST /fleet/lease-contracts", "POST /fleet/reconditioning-orders"] }
  - { priority: 12, category: business_constraint, check: "dispatch requires technician.status == ACTIVE", error_id: ERR_TECHNICIAN_INACTIVE, http_status: 422, applies_to: ["POST /fleet/service-calls/{id}/dispatch"] }
  - { priority: 13, category: business_constraint, check: "quote submit requires >= 1 line", error_id: ERR_QUOTE_EMPTY, http_status: 422, applies_to: ["POST /fleet/quotes/{id}/submit"] }
  - { priority: 14, category: business_constraint, check: "dispatch requires technician van stock to cover every required_parts entry", error_id: ERR_VAN_STOCK_INSUFFICIENT, http_status: 422, applies_to: ["POST /fleet/service-calls/{id}/dispatch"] }
  - { priority: 15, category: business_constraint, check: "fuel event type must match the unit's fuel program (CHARGE/SWAP only on BATTERY, LP_REFILL only on LP)", error_id: ERR_FUEL_PROGRAM_MISMATCH, http_status: 422, applies_to: ["POST /fleet/units/{id}/fuel-events"] }
  - { priority: 16, category: business_constraint, check: "hour meter monotonicity: reading_hours / return_hours must be strictly greater than the unit's current hour_meter", error_id: ERR_HOUR_METER_REGRESSION, http_status: 422, applies_to: ["POST /fleet/units/{id}/meter-readings", "POST /fleet/rental-contracts/{id}/return"] }
  - { priority: 17, category: business_temporal, check: "rental window overlap on the unit: half-open [start_date, end_date) intersecting any RESERVED/ON_RENT contract window on the same unit; adjacency is allowed; CANCELLED/RETURNED contracts do not block", error_id: ERR_RENTAL_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /fleet/rental-contracts"] }
  - { priority: 18, category: business_temporal, check: "technician dispatch overlap: [scheduled_start - 60min, scheduled_end + 60min] as a CLOSED interval must not intersect any other DISPATCHED call's identically-expanded closed interval for the same technician", error_id: ERR_DISPATCH_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /fleet/service-calls/{id}/dispatch"] }
  - { priority: 19, category: business_temporal, check: "quote accept requires logical clock <= valid_until", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: ["POST /fleet/quotes/{id}/accept"] }
  - { priority: 20, category: business_fiscal, check: "customer account_status must be ACTIVE for rental create and checkout", error_id: ERR_ACCOUNT_CREDIT_HOLD, http_status: 422, applies_to: ["POST /fleet/rental-contracts", "POST /fleet/rental-contracts/{id}/checkout"] }
  - { priority: 21, category: business_fiscal, check: "charge must fit available credit: rental create provisional_estimate_cents <= customer.available_credit_cents; quote accept total_cents <= customer.available_credit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /fleet/rental-contracts", "POST /fleet/quotes/{id}/accept"] }

# =============================================================================
# Table 5: API Endpoint Table
# Logical clock: POST /_clock/set_current_utc. Server startup default (before any
# set call): 2026-08-01T00:00:00Z — never the real wall clock.
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # ---- Customers ----
  - { method: POST, path: "/fleet/customers", description: "Create a customer", roles: [FleetManager, SalesRep], code: 201, input: [name, credit_limit_cents, "discount_pct?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/fleet/customers/{id}", description: "Read a customer including computed credit fields", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/fleet/customers/{id}/operators", description: "List operators of a customer", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "Operator[]", side_effects: [] }

  # ---- Units, meter readings, fuel events ----
  - { method: POST, path: "/fleet/units", description: "Create a forklift unit", roles: [FleetManager], code: 201, input: [serial_number, model, power_type, disposition, daily_rate_cents, weekly_rate_cents, monthly_rate_cents, pm_interval_hours], output: Unit, side_effects: ["fuel_program derived from power_type", "availability_status=AVAILABLE", "maintenance_posture=PM_OK", "hour_meter=0, last_pm_hours=0", "next_pm_due_hours=pm_interval_hours"] }
  - { method: GET, path: "/fleet/units/{id}", description: "Read a unit including computed posture, next_pm_due_hours, utilization_pct_90d", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: POST, path: "/fleet/units/{id}/meter-readings", description: "Record an hour-meter reading (telematics); may cross the PM threshold", roles: [FleetManager], code: 201, input: [reading_hours, "note?"], output: MeterReading, side_effects: ["unit.hour_meter = reading_hours", "pm_due_evaluation", "on PM_DUE flip: auto-create PM ServiceCall (OPEN, auto_created)"] }
  - { method: GET, path: "/fleet/units/{id}/meter-readings", description: "List meter readings of a unit", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "MeterReading[]", side_effects: [] }
  - { method: POST, path: "/fleet/units/{id}/fuel-events", description: "Record a charge / battery swap / LP refill and compute program-specific cost", roles: [FleetManager, Technician], code: 201, input: [event_type, "kwh?", "cylinders?"], output: FuelEvent, side_effects: ["fuel_event_cost"] }
  - { method: GET, path: "/fleet/units/{id}/fuel-events", description: "List fuel events of a unit", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "FuelEvent[]", side_effects: [] }

  # ---- Quotes ----
  - { method: POST, path: "/fleet/quotes", description: "Create a quote (NEW_CONFIG or USED_UNIT_SALE)", roles: [SalesRep], code: 201, input: [customer_id, kind, "unit_id?", valid_until], output: Quote, side_effects: [] }
  - { method: GET, path: "/fleet/quotes/{id}", description: "Read a quote including computed totals", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: Quote, side_effects: [] }
  - { method: GET, path: "/fleet/quotes", description: "List/filter quotes", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["customer_id?", "unit_id?", "status?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: POST, path: "/fleet/quotes/{id}/lines", description: "Add an attachment/configuration line (DRAFT quotes only)", roles: [SalesRep], code: 201, input: [description, qty, unit_price_cents], output: QuoteLine, side_effects: ["quote_pricing recompute on parent quote"] }
  - { method: GET, path: "/fleet/quotes/{id}/lines", description: "List lines of a quote", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "QuoteLine[]", side_effects: [] }
  - { method: POST, path: "/fleet/quotes/{id}/submit", description: "Submit a draft quote", roles: [SalesRep], code: 200, input: [], output: Quote, side_effects: ["status DRAFT -> SUBMITTED", "submitted_at = logical clock"] }
  - { method: POST, path: "/fleet/quotes/{id}/revise", description: "Pull a submitted quote back to DRAFT for revision", roles: [SalesRep], code: 200, input: [], output: Quote, side_effects: ["status SUBMITTED -> DRAFT", "revision_count += 1", "submitted_at = null"] }
  - { method: POST, path: "/fleet/quotes/{id}/accept", description: "Accept a submitted quote", roles: [SalesRep], code: 200, input: [], output: Quote, side_effects: ["status SUBMITTED -> ACCEPTED", "customer.outstanding_balance_cents += total_cents", "USED_UNIT_SALE: unit LISTED -> SOLD"] }

  # ---- Rental contracts ----
  - { method: POST, path: "/fleet/rental-contracts", description: "Create a rental reservation (OCC on unit version)", roles: [RentalCoordinator], code: 201, input: [unit_id, customer_id, start_date, end_date, expected_unit_version], output: RentalContract, side_effects: ["rental_billing provisional variant", "customer.credit_holds_cents += provisional_estimate_cents", "increments Unit.version by 1"] }
  - { method: GET, path: "/fleet/rental-contracts/{id}", description: "Read a rental contract", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: RentalContract, side_effects: [] }
  - { method: GET, path: "/fleet/rental-contracts", description: "List/filter rental contracts", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["unit_id?", "customer_id?", "status?", "limit?", "offset?"], output: "RentalContract[]", side_effects: [] }
  - { method: POST, path: "/fleet/rental-contracts/{id}/checkout", description: "Check out a reserved unit onto rent", roles: [RentalCoordinator], code: 200, input: [], output: RentalContract, side_effects: ["checkout_hours = unit.hour_meter", "unit AVAILABLE -> ON_RENT"] }
  - { method: POST, path: "/fleet/rental-contracts/{id}/return", description: "Return a rented unit; final billing + PM cascade", roles: [RentalCoordinator], code: 200, input: [return_date, return_hours], output: RentalContract, side_effects: ["rental_billing final variant", "hold released, balance += final_charge_cents", "unit.hour_meter = return_hours", "PM cascade: posture -> PM_DUE -> auto PM ServiceCall", "unit -> IN_SHOP if PM_DUE else AVAILABLE"] }
  - { method: POST, path: "/fleet/rental-contracts/{id}/cancel", description: "Cancel a reservation; releases the credit hold", roles: [RentalCoordinator], code: 200, input: [], output: RentalContract, side_effects: ["status RESERVED -> CANCELLED", "customer.credit_holds_cents -= provisional_estimate_cents"] }

  # ---- Service calls & technicians ----
  - { method: POST, path: "/fleet/service-calls", description: "Open a service call (breakdown or PM)", roles: [ServiceDispatcher], code: 201, input: [unit_id, customer_id, call_type, priority, "operator_id?", required_parts], output: ServiceCall, side_effects: [] }
  - { method: GET, path: "/fleet/service-calls/{id}", description: "Read a service call", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: ServiceCall, side_effects: [] }
  - { method: GET, path: "/fleet/service-calls", description: "List/filter service calls", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["unit_id?", "customer_id?", "technician_id?", "operator_id?", "status?", "limit?", "offset?"], output: "ServiceCall[]", side_effects: [] }
  - { method: POST, path: "/fleet/service-calls/{id}/dispatch", description: "Assign a technician and window; loads required parts onto the job", roles: [ServiceDispatcher], code: 200, input: [technician_id, scheduled_start, scheduled_end], output: ServiceCall, side_effects: ["van stock decremented by required_parts", "AVAILABLE unit -> IN_SHOP", "technician window registered with 60-min buffer"] }
  - { method: POST, path: "/fleet/service-calls/{id}/release", description: "Release a dispatched call back to OPEN; parts return to the van", roles: [ServiceDispatcher], code: 200, input: [], output: ServiceCall, side_effects: ["required_parts returned to van stock", "technician assignment and window cleared", "unit IN_SHOP -> AVAILABLE if this call moved it"] }
  - { method: POST, path: "/fleet/service-calls/{id}/resolve", description: "Close a dispatched call; assigned technician only", roles: [Technician], code: 200, input: [used_parts], output: ServiceCall, side_effects: ["unused required parts returned to van stock", "PM call: unit last_pm_hours = hour_meter, posture -> PM_OK, next_pm_due_hours recomputed", "unit IN_SHOP -> AVAILABLE if this call moved it"] }
  - { method: POST, path: "/fleet/technicians", description: "Create a technician with initial van stock", roles: [ServiceDispatcher], code: 201, input: [full_name, home_branch, "van_stock?"], output: Technician, side_effects: [] }
  - { method: GET, path: "/fleet/technicians/{id}", description: "Read a technician including current van stock", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: POST, path: "/fleet/technicians/{id}/van-stock", description: "Restock: add qty to a part on the van (creates the entry if absent)", roles: [ServiceDispatcher], code: 200, input: [part_number, qty], output: Technician, side_effects: ["van_stock[part_number].qty += qty"] }
  - { method: POST, path: "/fleet/technicians/{id}/deactivate", description: "Deactivate a technician", roles: [ServiceDispatcher], code: 200, input: [], output: Technician, side_effects: ["status ACTIVE -> INACTIVE"] }

  # ---- Operators & certifications ----
  - { method: POST, path: "/fleet/operators", description: "Register a customer operator", roles: [TrainingRegistrar], code: 201, input: [customer_id, full_name, badge_number], output: Operator, side_effects: [] }
  - { method: GET, path: "/fleet/operators/{id}", description: "Read an operator", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: Operator, side_effects: [] }
  - { method: POST, path: "/fleet/operators/{id}/certifications", description: "Issue a certification to an operator", roles: [TrainingRegistrar], code: 201, input: [cert_class, expires_at], output: Certification, side_effects: ["issued_at = logical clock"] }
  - { method: GET, path: "/fleet/operators/{id}/certifications", description: "List certifications of an operator", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "Certification[]", side_effects: [] }
  - { method: POST, path: "/fleet/certifications/{id}/renew", description: "Renew a certification (ACTIVE or EXPIRED) to a new expiry", roles: [TrainingRegistrar], code: 200, input: [new_expires_at], output: Certification, side_effects: ["expires_at = new_expires_at", "renewed_count += 1", "status -> ACTIVE"] }
  - { method: POST, path: "/fleet/certifications/{id}/revoke", description: "Revoke a certification", roles: [TrainingRegistrar], code: 200, input: [], output: Certification, side_effects: ["status -> REVOKED"] }

  # ---- Lease contracts & inspections ----
  - { method: POST, path: "/fleet/lease-contracts", description: "Create a lease; unit goes ON_LEASE", roles: [LeaseManager], code: 201, input: [unit_id, customer_id, start_date, end_date, allowed_hours, excess_hour_rate_cents, residual_value_cents], output: LeaseContract, side_effects: ["unit AVAILABLE -> ON_LEASE"] }
  - { method: GET, path: "/fleet/lease-contracts/{id}", description: "Read a lease contract", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: LeaseContract, side_effects: [] }
  - { method: GET, path: "/fleet/lease-contracts", description: "List/filter lease contracts", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["unit_id?", "customer_id?", "status?", "limit?", "offset?"], output: "LeaseContract[]", side_effects: [] }
  - { method: POST, path: "/fleet/lease-contracts/{id}/return", description: "Record lease return; unit becomes USED_SALE inventory", roles: [LeaseManager], code: 200, input: [return_date], output: LeaseContract, side_effects: ["status ACTIVE -> RETURNED", "unit ON_LEASE -> AVAILABLE", "unit.disposition -> USED_SALE"] }
  - { method: POST, path: "/fleet/lease-contracts/{id}/inspections", description: "Record a lease-end condition inspection (lease must be RETURNED)", roles: [LeaseManager], code: 201, input: [condition_grade, hours_at_return, appraised_value_cents], output: LeaseInspection, side_effects: ["wear_charge_cents computed from condition_grade"] }
  - { method: GET, path: "/fleet/lease-contracts/{id}/inspections", description: "List inspections of a lease", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["limit?", "offset?"], output: "LeaseInspection[]", side_effects: [] }
  - { method: POST, path: "/fleet/inspections/{id}/approve", description: "Approve an inspection (at most one APPROVED per lease)", roles: [LeaseManager], code: 200, input: [], output: LeaseInspection, side_effects: ["status SUBMITTED -> APPROVED"] }
  - { method: POST, path: "/fleet/lease-contracts/{id}/settle", description: "Settle a returned lease from its approved inspection; posts charges and may cascade CREDIT_HOLD", roles: [LeaseManager], code: 200, input: [], output: LeaseContract, side_effects: ["lease_settlement", "customer.outstanding_balance_cents += settlement_total_cents", "if balance > credit_limit: account_status -> CREDIT_HOLD and RESERVED rentals auto-cancelled"] }

  # ---- Reconditioning ----
  - { method: POST, path: "/fleet/reconditioning-orders", description: "Open a reconditioning order for a USED_SALE unit", roles: [FleetManager], code: 201, input: [unit_id, "notes?"], output: ReconditioningOrder, side_effects: ["unit AVAILABLE -> IN_RECON"] }
  - { method: GET, path: "/fleet/reconditioning-orders/{id}", description: "Read a reconditioning order", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: [], output: ReconditioningOrder, side_effects: [] }
  - { method: GET, path: "/fleet/reconditioning-orders", description: "List/filter reconditioning orders", roles: [FleetManager, SalesRep, RentalCoordinator, ServiceDispatcher, Technician, TrainingRegistrar, LeaseManager], code: 200, input: ["unit_id?", "status?", "limit?", "offset?"], output: "ReconditioningOrder[]", side_effects: [] }
  - { method: POST, path: "/fleet/reconditioning-orders/{id}/complete", description: "QC disposition: PASS lists the unit for resale; FAIL loops back for rework", roles: [FleetManager], code: 200, input: [qc_result, "listing_price_cents?"], output: ReconditioningOrder, side_effects: ["PASS: status -> COMPLETED, unit IN_RECON -> LISTED, unit.resale_price_cents = listing_price_cents", "FAIL: stays IN_PROGRESS, qc_fail_count += 1"] }

  # ---- Test-driving logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO 8601 UTC). Server startup default before any set call is exactly 2026-08-01T00:00:00Z (never the real wall clock). Advancing the clock fires time-based sweeps: SUBMITTED quotes past valid_until -> EXPIRED; ACTIVE certifications past expires_at -> EXPIRED.", roles: [FleetManager], code: 200, input: [to_iso8601], output: null, side_effects: ["quote expiry sweep", "certification expiry sweep"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or Technician attempting to resolve a service call assigned to a different technician" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body: missing required field, wrong type, invalid enum, end_date <= start_date, expiry not in the future, listing_price_cents missing on QC PASS, used_parts exceeding dispatched qty" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not valid from the resource's current state; meter reading or fuel event on a SOLD unit; second inspection approval for the same lease" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit availability_status does not permit the operation (checkout/lease/recon require AVAILABLE; rental create requires AVAILABLE or ON_RENT)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_unit_version does not match the unit's current version (OCC)" }
  - { id: ERR_PM_OVERDUE, http: 422, condition: "Rental checkout while unit.maintenance_posture == PM_DUE" }
  - { id: ERR_NO_CERTIFIED_OPERATOR, http: 422, condition: "Quote accept when the customer has no operator holding an ACTIVE certification" }
  - { id: ERR_OPERATOR_CERT_EXPIRED, http: 422, condition: "Dispatch naming an operator without an ACTIVE certification" }
  - { id: ERR_UNIT_DISPOSITION_MISMATCH, http: 422, condition: "Unit disposition does not permit the operation (rental requires RENTAL_FLEET; lease requires NEW_SALE or RENTAL_FLEET; reconditioning requires USED_SALE)" }
  - { id: ERR_TECHNICIAN_INACTIVE, http: 422, condition: "Dispatch to a technician with status INACTIVE" }
  - { id: ERR_QUOTE_EMPTY, http: 422, condition: "Quote submit with zero lines" }
  - { id: ERR_VAN_STOCK_INSUFFICIENT, http: 422, condition: "Technician van stock cannot cover required_parts" }
  - { id: ERR_FUEL_PROGRAM_MISMATCH, http: 422, condition: "Fuel event type does not match the unit's fuel program" }
  - { id: ERR_HOUR_METER_REGRESSION, http: 422, condition: "reading_hours / return_hours not strictly greater than the unit's current hour_meter" }
  - { id: ERR_RENTAL_WINDOW_OVERLAP, http: 409, condition: "Rental window [start_date, end_date) overlaps a RESERVED/ON_RENT contract on the same unit (adjacency allowed)" }
  - { id: ERR_DISPATCH_WINDOW_OVERLAP, http: 409, condition: "Technician's buffered dispatch window (closed interval, +/- 60 min) intersects another DISPATCHED call" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Quote accept after valid_until" }
  - { id: ERR_ACCOUNT_CREDIT_HOLD, http: 422, condition: "Customer account_status is CREDIT_HOLD" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Charge exceeds customer.available_credit_cents" }
  - { id: ERR_INSPECTION_NOT_APPROVED, http: 409, condition: "Lease settle without exactly one APPROVED inspection" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FleetManager
    description: "Dealer fleet/asset manager; owns units, hour meter, fuel program, reconditioning, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /fleet/units", "POST /fleet/units/{id}/meter-readings", "POST /fleet/reconditioning-orders", "POST /fleet/reconditioning-orders/{id}/complete", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /fleet/customers", "POST /fleet/units/{id}/fuel-events"]
  - name: SalesRep
    description: "Sales representative; owns customers and the quote lifecycle"
    identity: opaque
    exclusive_operations: ["POST /fleet/quotes", "POST /fleet/quotes/{id}/lines", "POST /fleet/quotes/{id}/submit", "POST /fleet/quotes/{id}/revise", "POST /fleet/quotes/{id}/accept"]
    shared_operations: ["all GET endpoints", "POST /fleet/customers"]
  - name: RentalCoordinator
    description: "Rental desk; owns rental contract lifecycle"
    identity: opaque
    exclusive_operations: ["POST /fleet/rental-contracts", "POST /fleet/rental-contracts/{id}/checkout", "POST /fleet/rental-contracts/{id}/return", "POST /fleet/rental-contracts/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: ServiceDispatcher
    description: "Service dispatcher; owns service calls and technician management"
    identity: opaque
    exclusive_operations: ["POST /fleet/service-calls", "POST /fleet/service-calls/{id}/dispatch", "POST /fleet/service-calls/{id}/release", "POST /fleet/technicians", "POST /fleet/technicians/{id}/van-stock", "POST /fleet/technicians/{id}/deactivate"]
    shared_operations: ["all GET endpoints"]
  - name: Technician
    description: "Field technician; resolves own assigned service calls and logs fuel events"
    identity: entity_backed:Technician
    exclusive_operations: ["POST /fleet/service-calls/{id}/resolve"]
    shared_operations: ["all GET endpoints", "POST /fleet/units/{id}/fuel-events"]
  - name: TrainingRegistrar
    description: "Training coordinator; owns operators and certifications"
    identity: opaque
    exclusive_operations: ["POST /fleet/operators", "POST /fleet/operators/{id}/certifications", "POST /fleet/certifications/{id}/renew", "POST /fleet/certifications/{id}/revoke"]
    shared_operations: ["all GET endpoints"]
  - name: LeaseManager
    description: "Lease administration; owns lease contracts, inspections, settlement"
    identity: opaque
    exclusive_operations: ["POST /fleet/lease-contracts", "POST /fleet/lease-contracts/{id}/return", "POST /fleet/lease-contracts/{id}/inspections", "POST /fleet/inspections/{id}/approve", "POST /fleet/lease-contracts/{id}/settle"]
    shared_operations: ["all GET endpoints"]
