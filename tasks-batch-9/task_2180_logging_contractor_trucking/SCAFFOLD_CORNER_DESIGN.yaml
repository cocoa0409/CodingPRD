          - state_machines.Tract.PLANNED_to_MOBILIZING
        distinguishing_aspect: |
          With an APPROVED plan present the priority-64 plan gate passes, so the priority-65
          crew gate is the only thing left to fail: a tract with zero crew assignments must
          return ERR_NO_ELIGIBLE_CREW and stay PLANNED.
        test_recipe:
          setup:
            - "Tract Section 14 NE is PLANNED with one APPROVED production plan and no crew assignment at all"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
