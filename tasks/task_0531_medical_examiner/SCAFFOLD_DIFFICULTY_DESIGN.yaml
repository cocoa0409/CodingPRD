  - rule_id: compensating_invariant
    instances:
      - name: store_then_release_conserves_cooler_occupancy
        grounds:
          - state_machines.Body.INTAKE_to_STORED
          - state_machines.Body.STORED_to_RELEASED
          - entities.CoolerUnit.fields.occupied_slots
        distinguishing_aspect: |
          Conserved quantity = CoolerUnit.occupied_slots. Store (+1) then release (-1) of the same body
          MUST leave occupied_slots exactly equal to its pre-store value (0); the compensating pair
          leaves zero drift in the slot count.
        test_recipe:
          setup:
            - "Empty cooler slot_capacity 2 (occupied_slots 0); NATURAL case CERTIFIED so the body can be released after storing."
            - "Body STORED then the certificate signed so release_blocked cleared, then body released."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv Q", badge_no: "B-17" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /pathologists"
              payload: { full_name: "ME Q", license_no: "L-17", is_medical_examiner: true }
              as: Admin
              captures: { me_id: $.data.id }
            - call: "POST /cooler-units"
              payload: { label: "COOLER-Q", slot_capacity: 2 }
              as: Admin
              captures: { cooler_id: $.data.id, cooler_v0: $.data.version }
            - call: "POST /cases"
              payload: { decedent_name: "Doe Q", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-17" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { body_id: $.data.id }
            - call: "POST /bodies/${body_id}/store"
              payload: { cooler_unit_id: "${cooler_id}", expected_cooler_version: "${cooler_v0}" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/death-certificate"
              payload: { cause_of_death: "MI", manner_of_death: "NATURAL" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { cert_id: $.data.id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: MedicalExaminer
              as_user_id: "${me_id}"
              captures: { case_v: $.data.version }
            - call: "POST /death-certificates/${cert_id}/sign"
              payload: { expected_case_version: "${case_v}" }
              as: MedicalExaminer
              as_user_id: "${me_id}"
          trigger:
            - call: "POST /bodies/${body_id}/release"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "GET /cooler-units/${cooler_id}"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { occ_after: $.data.occupied_slots }
          assert:
            - "CoolerUnit.${cooler_id}.occupied_slots == 0"
            - "Body.${body_id}.storage_status == RELEASED"

      - name: request_then_deny_conserves_held_property_count
        grounds:
          - state_machines.PropertyRelease.REQUESTED_to_DENIED
          - entities.PropertyItem.fields.item_status
          - entities.PropertyRelease.fields.release_status
        distinguishing_aspect: |
          Conserved quantity = count of PropertyItem in HELD for the Case (a different quantity from
          cooler slots). Requesting a release then denying it MUST leave the HELD item count unchanged
          at 2 — deny fires no property cascade, so no items flip to RELEASED.
        test_recipe:
          setup:
            - "NATURAL case INVESTIGATING with two HELD PropertyItems; one NextOfKin; a PropertyRelease REQUESTED."
          setup_api_calls:
            - call: "POST /investigators"
              payload: { full_name: "Inv R", badge_no: "B-18" }
              as: Admin
              captures: { inv_id: $.data.id }
            - call: "POST /cases"
              payload: { decedent_name: "Doe R", reported_death_at: "2026-05-01T00:00:00Z", death_location_county: "Kings", investigator_user_id: "${inv_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/triage"
              payload: { case_type: "NATURAL" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/bodies"
              payload: { tag_no: "T-18" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "phone", valuation_cents: 20000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /cases/${case_id}/property-items"
              payload: { description: "keys", valuation_cents: 1000 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item2_id: $.data.id }
            - call: "POST /cases/${case_id}/next-of-kin"
              payload: { full_name: "Kin R", relationship: "SPOUSE" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { kin_id: $.data.id }
            - call: "POST /cases/${case_id}/property-releases"
              payload: { next_of_kin_id: "${kin_id}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /property-releases/${rel_id}/deny"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "PropertyRelease.${rel_id}.release_status == DENIED"
            - "PropertyItem.${item1_id}.item_status == HELD"
            - "PropertyItem.${item2_id}.item_status == HELD"
