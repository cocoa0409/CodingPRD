        distinguishing_aspect: "Different resource (StoreInventory) and different interval semantics (aggregate-capacity occupancy rather than time geometry): two reservations may coexist only while their summed quantities fit available_qty; the second reservation that would push reserved_qty past on_hand_qty is rejected with ERR_INSUFFICIENT_INVENTORY."
