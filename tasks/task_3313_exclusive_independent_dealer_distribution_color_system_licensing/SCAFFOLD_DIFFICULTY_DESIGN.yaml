# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3313 — exclusive dealer distribution & color system licensing
# 9 rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and replays from empty-DB via §1.5 endpoints only.
# A completed dealer-onboarding chain (equipment + license + calibration +
# paid INITIAL_STOCK order of 40 units + activate) is the workhorse setup and
# is spelled out per instance (no cross-instance references).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: license_fee_full_vs_prorated_variants
        grounds:
          - calculations.license_fee
          - state_machines.ColorLicense.ACTIVE_to_ACTIVE
          - state_machines.ColorLicense.EXPIRED_to_ACTIVE
        distinguishing_aspect: |
          Two valid fee bases on the SAME license produce different charges:
          renewing from ACTIVE charges the FULL annual fee (2500000 cents),
          whereas letting the license lapse to EXPIRED and renewing then
          applies the PRORATED variant over days remaining under the old
          expiry — 0 cents once expired. The two renewals of the identical
          license diverge by exactly the full annual fee.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, ColorantSystem G25 (annual fee 2500000 cents), Dealer D1 APPROVED, EquipmentUnit installed, ColorLicense L1 ACTIVE after first PASS calibration."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
              captures: { lic_id: $.data.id }
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
          trigger:
            - call: "POST /dealer-network/licenses/${lic_id}/renew"
              payload: {}
              as: RegionManager
              captures: { full_fee: $.data.fee_charged_cents, full_basis: $.data.fee_basis }
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /dealer-network/licenses/${lic_id}"
              as: RegionManager
              captures: { expired_status: $.data.status }
            - call: "POST /dealer-network/licenses/${lic_id}/renew"
              payload: {}
              as: RegionManager
              captures: { prorated_fee: $.data.fee_charged_cents, prorated_basis: $.data.fee_basis }
          assert:
            - "full_basis == \"FULL\" and full_fee == 2500000"
            - "expired_status == \"EXPIRED\" (renewed expiry 2027-09-01 passed before the 2027-10-01 read)"
            - "prorated_basis == \"PRORATED\" and prorated_fee == 0"
            - "the two renewal charges for the same license diverge by exactly 2500000 cents"

      - name: dealer_order_flat_price_vs_contractor_tiered_price
        grounds:
          - calculations.contractor_unit_price
          - entities.DealerOrder.fields.unit_price_cents
          - entities.ContractorPurchase.fields.unit_price_cents
        distinguishing_aspect: |
          Two valid per-unit pricing interpretations of the SAME product line
          diverge: DealerOrder always prices at flat list (1000 cents) while a
          SILVER contractor purchase prices the identical line at
          round_half_up(1000 * 0.95) = 950 cents — a 50-cent-per-unit gap
          driven by tier_at_post, a different entity domain than the license
          fee variants.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, system G25, DEALER_EXCLUSIVE line LX base 1000 cents, Dealer D fully ACTIVE (onboarded), Contractor C enrolled; a 1000-unit seed purchase posts at STANDARD (invoice 1000000) and pushes rolling spend to exactly 1000000 cents, so the NEXT purchase prices at SILVER."
            - "Pricing divergence is asserted on the RESTOCK DealerOrder (flat 1000/unit) vs the SILVER ContractorPurchase (950/unit) below."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "LX", name: "Legacy Exterior", channel_class: "DEALER_EXCLUSIVE", base_price_cents: 1000 }
              as: ColorLabAdmin
              captures: { line_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/fulfill"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/invoice"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/dealers/${dealer_id}/activate"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/contractors"
              payload: { dealer_id: "${dealer_id}", company_name: "Ace Painting LLC" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { contractor_id: $.data.id }
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 1000 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { seed_invoice: $.data.invoice_cents }
          trigger:
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 10, purpose: "RESTOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { dealer_unit_price: $.data.unit_price_cents, dealer_invoice: $.data.invoice_cents }
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 10 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { contractor_unit_price: $.data.unit_price_cents, contractor_invoice: $.data.invoice_cents, contractor_tier_at_post: $.data.tier_at_post }
          assert:
            - "seed_invoice == 1000000"
            - "contractor_tier_at_post == \"SILVER\" (rolling spend reached exactly 1000000 cents before this purchase)"
            - "dealer_unit_price == 1000 and dealer_invoice == 10000"
            - "contractor_unit_price == 950 and contractor_invoice == 9500"
            - "dealer_unit_price - contractor_unit_price == 50 on the identical product line"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: contractor_unit_price_per_unit_rounding_order
        grounds:
          - calculations.contractor_unit_price
          - calculations.contractor_tier_assignment
        distinguishing_aspect: |
          Mode (b) nested rounding: 7 units of a 333-cent line at GOLD pins
          per-unit-then-multiply — round_half_up(333 * 0.90) = 300 per unit,
          invoice 2100 — while the alternative sum-then-round interpretation
          yields round_half_up(7 * 299.7) = 2098; the scaffold pins the
          per-unit rounding order and the 2-cent gap is observable.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, system, SPECIALTY line S7 base 333 cents, ACTIVE dealer, contractor whose rolling spend is exactly 4000000 cents (GOLD) from a prior 12000-unit purchase."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "S7", name: "Specialty Seven", channel_class: "SPECIALTY", base_price_cents: 333 }
              as: ColorLabAdmin
              captures: { line_id: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "S1000", name: "Specialty Thousand", channel_class: "SPECIALTY", base_price_cents: 1000 }
              as: ColorLabAdmin
              captures: { line1000_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/fulfill"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/invoice"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/dealers/${dealer_id}/activate"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/contractors"
              payload: { dealer_id: "${dealer_id}", company_name: "Ace Painting LLC" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { contractor_id: $.data.id }
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line1000_id}", units: 4004 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { seed_spend_invoice: $.data.invoice_cents }
          trigger:
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 7 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { unit_price: $.data.unit_price_cents, invoice: $.data.invoice_cents, tier_at_post: $.data.tier_at_post }
          assert:
            - "seed_spend_invoice == 4004000 (4004 units at STANDARD flat 1000 cents) so rolling spend reaches exactly 4004000 and the seed posts at tier STANDARD"
            - "tier_at_post == \"GOLD\" (rolling spend 4004000 >= 4000000 inclusive boundary, evaluated before this purchase)"
            - "unit_price == 300 and invoice == 2100 (per-unit rounding of 333 * 0.90; the sum-then-round alternative 2098 is the pinned divergence)"

      - name: reward_redemption_evaluation_order
        grounds:
          - calculations.reward_points_redemption
          - calculations.rolling_net_spend
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: tier prices THIS purchase from
          rolling spend evaluated BEFORE this purchase joins the accumulator,
          and point redemption clamps at the gross invoice BEFORE net spend is
          computed — the pinned order invoice -> redemption -> net -> rolling
          makes redeeming 4999 points against a 4750-cent SILVER invoice
          deterministically clamp to 4750 while tier_at_post stays SILVER.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, system, SPECIALTY line S1 base 100 cents, ACTIVE dealer, contractor with rolling spend exactly 1000000 cents (SILVER) from a prior 10000-unit STANDARD-priced purchase."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/product-lines"
              payload: { colorant_system_id: "${system_id}", code: "S1", name: "Specialty One", channel_class: "SPECIALTY", base_price_cents: 100 }
              as: ColorLabAdmin
              captures: { line_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
            - call: "POST /dealer-network/orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", units: 40, purpose: "INITIAL_STOCK" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/fulfill"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/invoice"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/dealers/${dealer_id}/activate"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/contractors"
              payload: { dealer_id: "${dealer_id}", company_name: "Ace Painting LLC" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { contractor_id: $.data.id }
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 10000 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
          trigger:
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 50, reward_points_redeemed: 4999 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { tier_at_post: $.data.tier_at_post, invoice: $.data.invoice_cents, redemption: $.data.reward_points_redemption_cents }
          assert:
            - "tier_at_post == \"SILVER\" (rolling spend 1000000 evaluated BEFORE this purchase)"
            - "invoice == 50 * 95 == 4750 (per-unit SILVER price round_half_up(100 * 0.95) = 95)"
            - "redemption == 4750 (clamped to invoice; 249 requested points silently dropped)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: equipment_calibration_cycle_fail_drop_and_recovery
        grounds:
          - state_machines.EquipmentUnit.CALIBRATED_to_INSTALLED
          - state_machines.EquipmentUnit.INSTALLED_to_CALIBRATED
          - state_machines.ColorLicense.ACTIVE_to_SUSPENDED
          - state_machines.ColorLicense.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          EquipmentUnit runs a true cycle CALIBRATED -> INSTALLED -> CALIBRATED
          via FAIL then PASS calibrations (not a forward-only pipeline), and
          each loop iteration re-fires the license suspension cascade.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Region, system, APPROVED dealer with installed unit and PENDING license."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /dealer-network/colorant-systems"
              payload: { code: "G25", name: "Gen-25 Colorant System", generation: 25, annual_license_fee_cents: 2500000, min_initial_inventory_units: 40 }
              as: ColorLabAdmin
              captures: { system_id: $.data.id }
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Beacon Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", branding_compliant: true, coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { dealer_id: $.data.id }
            - call: "POST /dealer-network/dealers/${dealer_id}/begin-onboarding"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/equipment"
              payload: { dealer_id: "${dealer_id}", serial_no: "SN-100", model: "Corob D600", colorant_system_id: "${system_id}", installed_on: "2026-09-01T00:00:00Z" }
              as: EquipmentTech
              captures: { equip_id: $.data.id }
            - call: "POST /dealer-network/licenses"
              payload: { dealer_id: "${dealer_id}", colorant_system_id: "${system_id}" }
              as: RegionManager
              captures: { lic_id: $.data.id }
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
              captures: { cal_state: $.data.status }
          trigger:
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "FAIL" }
              as: EquipmentTech
              captures: { after_fail_status: $.data.status, after_fail_count: $.data.consecutive_failed_calibrations }
            - call: "GET /dealer-network/licenses/${lic_id}"
              as: RegionManager
              captures: { lic_after_fail: $.data.status }
            - call: "POST /dealer-network/equipment/${equip_id}/calibrations"
              payload: { performed_on: "${clock_now}", result: "PASS" }
              as: EquipmentTech
              captures: { after_pass_status: $.data.status, after_pass_count: $.data.consecutive_failed_calibrations }
            - call: "GET /dealer-network/licenses/${lic_id}"
              as: RegionManager
              captures: { lic_after_pass: $.data.status }
          assert:
            - "cal_state == \"CALIBRATED\""
            - "after_fail_status == \"INSTALLED\" and after_fail_count == 1 (cycle back, not terminal)"
            - "lic_after_fail == \"SUSPENDED\" (last calibrated unit for the system lost)"
            - "after_pass_status == \"CALIBRATED\" and after_pass_count == 0"
            - "lic_after_pass == \"ACTIVE\" (suspension cascade reversed by the PASS)"

      - name: formulation_change_branching_cancel_vs_complete_paths
        grounds:
          - state_machines.FormulationChange.ANNOUNCED_to_CANCELLED
          - state_machines.FormulationChange.ANNOUNCED_to_EFFECTIVE
          - state_machines.FormulationChange.EFFECTIVE_to_COMPLETED
        distinguishing_aspect: |
          FormulationChange forks at ANNOUNCED: the CANCEL branch kills the
          draft with zero side effects, while the EFFECTIVE branch fans out
          RematchTasks and only auto-completes after the last task is DONE —
          two divergent branches with different side-effect sets on one
          machine, a different entity than the equipment cycle.
        test_recipe:
          setup:
