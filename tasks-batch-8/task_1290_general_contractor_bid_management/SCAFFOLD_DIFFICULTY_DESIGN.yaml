          assert:
            - "Addendum.${add1}.number == 1 and BidPackage.${pkg}.issued_addendum_count == 1"
            - "GET /addendums/${add1}/acknowledgments returns exactly 2 rows, both status PENDING (X and Y; DECLINED Z excluded)"
            - "Bid.${bid_x}.addendum_ack_complete == false (link 2: recomputed because the PENDING acknowledgment was created)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bid_create_state_vs_fiscal_priority
        grounds:
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a bid create that
          violates BOTH the package-state gate (BIDDING_CLOSED, priority 5)
          AND bond sufficiency (priority 9) returns the state error
          ERR_PACKAGE_NOT_ACCEPTING_BIDS, not ERR_BID_BOND_INSUFFICIENT.
        test_recipe:
          setup:
            - "Sub fully prequalified, invited, BIDDING; package already BIDDING_CLOSED (clock past due)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Prio One LLC", contact_email: "p1@x.com", license_number: "LIC-P-701" }
              as: Anonymous
              captures: { sub_p: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_p}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_p}"
              captures: { app_p: $.data.id }
            - call: "POST /prequal-applications/${app_p}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Priority Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_p}" }
              as: LeadEstimator
              captures: { inv_p: $.data.id }
            - call: "POST /invitations/${inv_p}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_p}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 2000000, bond_amount_cents: 50000 }
