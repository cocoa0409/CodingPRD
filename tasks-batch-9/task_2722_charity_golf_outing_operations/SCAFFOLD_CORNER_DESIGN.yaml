            - call: "POST /outing-ops/outings"
              payload: { name: "Computed Write", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0, confirmed_player_slots: 8, net_proceeds_cents: 999999 }
              as: TournamentDirector
              captures: { e_computed: $.data.error_id }
          assert:
            - "${e_missing} == 'ERR_INVALID_REQUEST' (HTTP 422) - buyer_name is required and absent"
            - "${e_enum} == 'ERR_INVALID_REQUEST' (HTTP 422) - FOURSOME is not one of TEAM, INDIVIDUAL, SPONSOR"
            - "${e_negative} == 'ERR_INVALID_REQUEST' (HTTP 422) - a _cents field may not be negative"
            - "${e_naive} == 'ERR_INVALID_REQUEST' (HTTP 422) - a timestamp without the trailing Z is not accepted, and no outing is created"
            - "${e_empty} == 'ERR_INVALID_REQUEST' (HTTP 422), NOT ERR_TEAM_SIZE_INVALID - priority 3 outranks priority 31 even though the §1.6 condition for ERR_TEAM_SIZE_INVALID also names the empty array"
