              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "REDYE" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/start-dyeing"
              payload: {}
              as: DyeHouseOperator
              captures: { v3: $.data.version }
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 56.50, measured_lab_a: 14.00, measured_lab_b: -8.00, expected_dye_lot_version: "${v3}" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "REDYE" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "APPROVE" }
              as: DyeHouseOperator
          assert:
            - "after the first measurement, DyeLot.${dl}.delta_e == 3.00 and DyeLot.${dl}.shade_band == OUT"
            - "after the first REDYE disposition, DyeLot.${dl}.status == REDYE_QUEUED and DyeLot.${dl}.parent_dye_lot_id == ${dl}"
            - "after the second start-dyeing, DyeLot.${dl}.status == DYEING, DyeLot.${dl}.redye_count == 1 and DyeLot.${dl}.delta_e is null"
            - "after the second measurement, DyeLot.${dl}.delta_e == 2.50 and DyeLot.${dl}.shade_band == C"
            - "after the third start-dyeing, DyeLot.${dl}.redye_count == 2"
            - "the third REDYE disposition returns HTTP 409 with data.error_id == ERR_REDYE_LIMIT_REACHED"
            - "after the refused REDYE, DyeLot.${dl}.status == MEASURED and DyeLot.${dl}.redye_count == 2 — unchanged"
            - "after the APPROVE disposition, DyeLot.${dl}.status == APPROVED, DyeLot.${dl}.shade_band == C and DyeLot.${dl}.uncommitted_yards == 400.0"

