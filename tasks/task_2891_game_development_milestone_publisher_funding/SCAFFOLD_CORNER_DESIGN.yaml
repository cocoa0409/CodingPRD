              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T10:00:00.000Z", notes: "Alpha accepted" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { v_open: $.data.version }
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m2_id}", build_number: 1, feature_completeness_pct: 76.00, crash_free_sessions_pct: 96.50, content_completeness_pct: 61.00, known_blocker_count: 4, release_notes: "Polish candidate" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b2_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T11:00:00.000Z", review_window_end_at: "2026-08-01T12:00:00.000Z", notes: "Polish accepted" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { v_restricted: $.data.version }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 4, title: "Bonus scope", gate_profile: "BETA", funded_amount_cents: 10000, contractor_budget_cents: 0, acceptance_criteria: ["Added after the trigger"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { restricted_error_id: "$.data.error_id" }
            - call: "POST /change-orders"
              payload: { agreement_id: "${agreement_id}", target_milestone_id: "${m3_id}", order_type: "FUNDING_UPLIFT", requested_amount_cents: 200000, ship_date_delta_days: 0, rationale: "New scope arriving the only legal way", expected_agreement_version: "${v_restricted}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { co_id: $.data.id }
          assert:
            - "trigger call 2 -> HTTP 200 with accepted_value_cents == 3000000 and funding_posture == OPEN (25% of the pool is below the 3000 bps trigger)"
            - "trigger call 4 -> HTTP 201 with Milestone.${m2_id}.status == ACCEPTED"
            - "trigger call 5 -> HTTP 200 with accepted_value_cents == 3600000 and funding_posture == RESTRICTED, the inclusive boundary of round_half_up(12000000 * 3000 / 10000)"
            - "trigger call 6 -> HTTP 409 with data.error_id == ERR_FUNDING_POSTURE_RESTRICTED and committed_cents unchanged at 12000000"
            - "trigger call 7 -> HTTP 201: the RESTRICTED posture redirects new scope into the change-order channel rather than freezing the agreement (only SUSPENDED/TERMINATED produce FROZEN)"
            - "the posture is derived, not stored by hand: it is reported identically by GET /development-agreements/${agreement_id} and by the row inside GET /development-agreements"

  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_every_cascade_is_final_in_the_first_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Milestone.UNDER_REVIEW_to_ACCEPTED
          - calculations.agreement_funding_ledger
          - endpoints.POST_/publisher-reviews
        distinguishing_aspect: "consistency_model is `immediate`, so the single POST that records an acceptance must leave NOTHING for a later reconciliation pass: the response itself and the very next read of every touched aggregate - the accepted milestone, the unlocked dependent milestone, the newly created payment row and the agreement ledger - must already show final values. There is no eventual-consistency escape hatch anywhere in this scaffold: no derived field is allowed to lag by one request, and no second read may change an answer."
        test_recipe:
          setup:
            - "Agreement Twinpeak is ACTIVE (advance 6000000) with M1 ALPHA funded 3600000 (IN_DEVELOPMENT) and M2 BETA funded 2400000 depending on M1 (DEFINED)."
            - "Build 1 on M1 (75.00 / 96.00 / 60.00 / 5 blockers) has passed the ALPHA gate, so M1 is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Twinpeak", advance_total_cents: 6000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-06-30" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 0, acceptance_criteria: ["Core loop playable"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 2, title: "Beta", gate_profile: "BETA", funded_amount_cents: 2400000, contractor_budget_cents: 0, acceptance_criteria: ["Content complete"], depends_on_milestone_id: "${m1_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { v_before: $.data.version }
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 75.00, crash_free_sessions_pct: 96.00, content_completeness_pct: 60.00, known_blocker_count: 5, release_notes: "Alpha candidate" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T10:00:00.000Z", notes: "Alpha accepted" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /milestones/${m1_id}"
              payload: {}
              as: Developer
              as_user_id: "${studio_id}"
            - call: "GET /milestones/${m2_id}"
              payload: {}
              as: Developer
              as_user_id: "${studio_id}"
            - call: "GET /milestone-payments"
              payload: { milestone_id: "${m1_id}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { p1_id: "$.data[0].id" }
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { v_after: $.data.version }
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "trigger call 1 -> HTTP 201 with verdict ACCEPTED, reviewer_user_id == ${reviewer_id} and decided_at set to the logical clock instant"
            - "trigger call 2 -> HTTP 200 with status ACCEPTED and accepted_at already set - not still UNDER_REVIEW pending a sweep"
            - "trigger call 3 -> HTTP 200 with Milestone.${m2_id}.status == IN_DEVELOPMENT: the dependent unlock happened inside the same request"
            - "trigger call 4 -> HTTP 200 with exactly 1 payment row, status PENDING_AUTHORIZATION and scheduled_amount_cents == 3600000; the row exists on the FIRST read after the verdict"
            - "trigger call 5 -> HTTP 200 with accepted_value_cents == 3600000, funding_posture == RESTRICTED (3600000 >= 1800000) and version == ${v_before} + 1"
            - "trigger call 6 returns a byte-identical body to trigger call 5 apart from meta: a second read never changes an answer, so nothing in this scaffold is eventually consistent"
