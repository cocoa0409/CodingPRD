            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v_after_void}", case_entry_points_earned: 20, case_entry_points_possible: 20, key_questions_points_earned: 30, key_questions_points_possible: 30, pre_arrival_points_earned: 3, pre_arrival_points_possible: 3, final_coding_points_earned: 7, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
