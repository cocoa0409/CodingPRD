  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bidspec_addendum_cycle_republishes_with_version_bumps
        grounds:
          - state_machines.BidSpec.PUBLISHED_to_ADDENDUM_ISSUED
          - state_machines.BidSpec.ADDENDUM_ISSUED_to_PUBLISHED
          - entities.BidSpec.fields.spec_version
        distinguishing_aspect: |
          BidSpec's machine is cyclic (PUBLISHED -> ADDENDUM_ISSUED -> PUBLISHED loop): two full
          loop traversals drive spec_version 1 -> 2 -> 3 while status returns to PUBLISHED each
          time — a revision loop on BidSpec, a different entity than the WarrantyClaim appeal loop.
        test_recipe:
          setup:
            - "District D1; spec with one line; published once (PUBLISHED, spec_version 1)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { v1: $.data.spec_version, s1: $.data.status } }
          trigger:
            - { call: "POST /v1/bid-specs/${specA}/issue-addendum", payload: { addendum_note: "clarify glide spec" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { sa1: $.data.status } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { v2: $.data.spec_version, s2: $.data.status } }
            - { call: "POST /v1/bid-specs/${specA}/issue-addendum", payload: { addendum_note: "extend Q&A" }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { v3: $.data.spec_version, s3: $.data.status } }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { s4: $.data.status } }
          assert:
            - "s1 == PUBLISHED and v1 == 1 (first publish does not bump spec_version)"
            - "sa1 == ADDENDUM_ISSUED"
            - "s2 == PUBLISHED and v2 == 2 (re-publish from ADDENDUM_ISSUED bumps spec_version)"
            - "s3 == PUBLISHED and v3 == 3 (second loop traversal)"
            - "s4 == CLOSED (loop exits to CLOSED)"

      - name: warranty_appeal_cycle_reinstates_review_then_approves
        grounds:
          - state_machines.WarrantyClaim.DENIED_to_APPEALED
          - state_machines.WarrantyClaim.APPEALED_to_UNDER_REVIEW
          - entities.WarrantyClaim.fields.appeal_count
        distinguishing_aspect: |
          WarrantyClaim's machine is cyclic via the appeal loop DENIED -> APPEALED -> UNDER_REVIEW
          with appeal_count as the loop bound (max 1): the claim re-enters UNDER_REVIEW after a
          denial and can then be APPROVED — a negotiation-round cycle on WarrantyClaim, a
          different entity than the BidSpec addendum loop.
        test_recipe:
          setup:
            - "District D1 (not enrolled); spec/line/award (flat 11000, warranty 5y); PO line qty 5 delivered and installed 2026-07-08 -> VERIFIED; claim parts_cost 55000 filed in-term (clock 2026-08-01)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 5 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 5, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-12", start_date: "2026-07-06", end_date: "2026-07-08", crew_count: 1 }, as: FulfillmentCoordinator, captures: { task1: $.data.id } }
            - { call: "POST /v1/install-tasks/${task1}/start", payload: {}, as: CrewLead, as_user_id: "${crew1}" }
            - { call: "POST /v1/install-tasks/${task1}/complete", payload: { uncrated: true, debris_removed: true, placed: true }, as: CrewLead, as_user_id: "${crew1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/warranty-claims", payload: { po_line_id: "${l1}", parts_cost_cents: 55000, description: "glide failure" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { claim1: $.data.id } }
            - { call: "POST /v1/warranty-claims/${claim1}/review", payload: {}, as: ServiceAgent }
            - { call: "POST /v1/warranty-claims/${claim1}/deny", payload: { denial_reason: "normal wear" }, as: ServiceAgent, captures: { sd: $.data.status } }
          trigger:
            - { call: "POST /v1/warranty-claims/${claim1}/appeal", payload: { appeal_note: "defect photos attached" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { sa: $.data.status, ac: $.data.appeal_count } }
            - { call: "POST /v1/warranty-claims/${claim1}/review", payload: {}, as: ServiceAgent, captures: { sr: $.data.status } }
            - { call: "POST /v1/warranty-claims/${claim1}/approve", payload: {}, as: ServiceAgent, captures: { sp: $.data.status, cov: $.data.coverage_cents } }
            - { call: "POST /v1/warranty-claims/${claim1}/appeal", payload: { appeal_note: "second appeal attempt" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err2: $.data.error_id } }
          assert:
            - "sd == DENIED before the appeal"
            - "sa == APPEALED and ac == 1 (cycle traversed, loop bound consumed)"
            - "sr == UNDER_REVIEW (appeal reinstates review)"
            - "sp == APPROVED and cov == 55000 (STANDARD_TERM full coverage in-term)"
            - "err2 == ERR_INVALID_STATE (appeal from APPROVED rejected; appeal loop bound appeal_count < 1 also spent)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: damage_approval_cascades_shipment_installtask_crew_ledger
        grounds:
          - state_machines.DamageReport.OPEN_to_REPLACEMENT_ORDERED
          - calculations.crew_booked_days
          - calculations.replacement_window_deadline
        distinguishing_aspect: |
          Depth-3 chain from the approve-replacement trigger: it creates a REPLACEMENT Shipment
          (link 1); that shipment creation itself creates a SCHEDULED InstallTask (link 2); that
          task creation debits Crew.booked_days by crew_days (link 3) — each link caused by the
          previous one, not by the original call, and originating from a different trigger than
          the backorder cascade.
        test_recipe:
          setup:
            - "District D1; spec window 2026-06-15..2026-08-15; flat award (11000); PO line qty 10 fully delivered 2026-07-01 at site; clock at 2026-07-20; damage report for 2 units filed (DELIVERY phase); crew Alpha with booked_days == 0; replacement_deadline = min(2026-08-15+14d, 2026-07-20+21d) = 2026-08-10"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/damage-reports", payload: { po_line_id: "${l1}", damaged_qty: 2, discovered_during: "DELIVERY", fault_type: "TRANSIT", shipment_id: "${ship1}" }, as: CrewLead, as_user_id: "${crew1}", captures: { dr1: $.data.id, dr1_deadline: $.data.replacement_deadline } }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: ContractManager, captures: { crew_days_before: $.data.booked_days } }
          trigger:
            - { call: "POST /v1/damage-reports/${dr1}/approve-replacement", payload: { scheduled_date: "2026-08-01", crew_id: "${crew1}", start_date: "2026-08-03", end_date: "2026-08-05", crew_count: 2, room_label: "W-12" }, as: ContractManager, captures: { dr_status: $.data.status } }
            - { call: "GET /v1/shipments", payload: { damage_report_id: "${dr1}" }, as: ContractManager, captures: { repl_ship : "$.data[0].id", repl_kind : "$.data[0].kind", repl_status : "$.data[0].status" } }
            - { call: "GET /v1/install-tasks", payload: { shipment_id: "${repl_ship}" }, as: ContractManager, captures: { repl_task : "$.data[0].id", repl_task_days : "$.data[0].crew_days", repl_task_status : "$.data[0].status" } }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: ContractManager, captures: { crew_days_after: $.data.booked_days } }
          assert:
            - "dr1_deadline == 2026-08-10 (min(2026-08-15 + 14d, 2026-07-20 + 21d))"
            - "dr_status == REPLACEMENT_ORDERED"
            - "repl_kind == REPLACEMENT and repl_status == SCHEDULED (link 1: shipment created by the approval)"
            - "repl_task_status == SCHEDULED and repl_task_days == 4 (link 2: install task auto-created; crew_count 2 x 2 days in [2026-08-03, 2026-08-05))"
            - "crew_days_before == 0 and crew_days_after == 4 (link 3: task creation debited the crew ledger)"

      - name: backorder_declaration_cascades_notice_count_posture_gate
        grounds:
          - state_machines.POLine.ORDERED_to_BACKORDERED
          - calculations.po_fulfillment_posture
          - entities.PurchaseOrder.fields.open_backorder_count
        distinguishing_aspect: |
          Depth-3 chain from the declare-backorder trigger (different trigger than damage
          approval): line transition creates a BackorderNotice (link 1); notice creation
          increments PurchaseOrder.open_backorder_count (link 2); count crossing the threshold 2
          recomputes posture ON_TRACK -> AT_RISK (link 3), which observably gates shipment
          scheduling with ERR_PO_AT_RISK_BLOCKS_SCHEDULING.
        test_recipe:
          setup:
            - "District D1; coop award accepted; PO with three lines L1 qty 10, L2 qty 8, L3 qty 5 (all ORDERED after accept); site exists; clock 2026-05-10"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
