            - "link 2: Tower.${t1}.tower_status == IDLE (caused by the allocation release)"
            - "link 3: Rack.${rk_1}.occupied_towers == 0 (was 4 before harvest; caused by the tower releases)"
            - "GrowBatch.${b1}.production_status == HARVESTED and harvested_total_lb == 46.00 (40.0 + 6.0; cull excluded)"

