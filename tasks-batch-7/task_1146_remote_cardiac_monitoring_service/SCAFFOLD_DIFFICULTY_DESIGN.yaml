            - "BillingPeriod.${bpa_id}.total_amount_cents == 20040 (TC 18305 + PC 1735)"
            - "Second trigger returns http 422 with error_id ERR_BELOW_MINIMUM_BILLABLE_DAYS (billable_days == 9 < 10)"

      - name: zero_transmission_final_report_gate
        grounds:
          - validations[priority=9] (ERR_EMPTY_MONITORING_DATA)
          - entities.MonitoringEpisode.fields.transmission_count
        distinguishing_aspect: |
          Zero-count edge on metric transmission_count via POST
          /v1/reports/{id}/finalize: FINAL report with transmission_count == 0 and
          no_significant_findings false rejects; flipping the flag true admits the
          same zero-count episode. Different metric and endpoint from the sibling.
        test_recipe:
