              as_user_id: "${emp_e}"
            - call: "GET /eeoc/charges/${chg_e}"
              as: Director
              captures: { inv_e: $.data.investigation_case_id }
            - call: "POST /eeoc/investigation-cases/${inv_e}/assign"
              payload: { investigator_user_id: "inv-006" }
              as: Director
            - call: "POST /eeoc/investigation-cases/${inv_e}/evidence-requests"
              payload: { request_type: "POSITION_STATEMENT" }
              as: Investigator
              as_user_id: "inv-006"
              captures: { erq_e: $.data.id }
            - call: "POST /eeoc/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /eeoc/investigation-cases/${inv_e}/evidence-requests"
