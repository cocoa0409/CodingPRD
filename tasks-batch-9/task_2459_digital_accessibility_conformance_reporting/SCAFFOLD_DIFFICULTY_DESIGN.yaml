        distinguishing_aspect: |
          Dependency 2 of 3 couples a different pair — QuestionnaireResponse to ConformanceReport:
          accuracy attestation is refused while the cited report is merely APPROVED and succeeds
          once that report is PUBLISHED, at which point the 90-day update cadence clock starts at
          2026-10-30T00:00:00Z.
