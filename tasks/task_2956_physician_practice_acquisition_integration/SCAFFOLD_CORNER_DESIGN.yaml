            - "a replacement POST /credentialing-packages for the same physician_id and payer_contract_id is accepted with HTTP 201, because the duplicate guard only looks at DRAFT, SUBMITTED, IN_REVIEW and APPROVED rows"
            - "CredentialingPackage.${pkg_id}.committee_cycle_key == 2026-08-15 and projected_effective_on == 2026-11-01, retained on the withdrawn row"

      - name: staff_offer_extend_after_expiry_date_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StaffTransitionOffer.status.DRAFT_to_EXTENDED
          - state_machines.StaffTransitionOffer.status.EXTENDED_to_EXPIRED
          - calculations.retention_pool_ledger
        distinguishing_aspect: |
          DRAFT -> EXTENDED requires offer_expires_on to be on or after the current
          logical date; with the clock moved past the expiry the transition is refused
          and the retention pool is untouched, and the row can only be rescinded.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with retention_pool_total_cents 3000000."
            - "One BILLER StaffTransitionOffer in status DRAFT expiring 2026-09-15."
            - "The logical clock advanced to 2026-09-16, one day past the expiry."
