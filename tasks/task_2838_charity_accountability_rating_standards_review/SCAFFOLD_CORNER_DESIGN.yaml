              as_user_id: "${org1}"
              captures: { org_v2: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2021, source_kind: "FORM_990", total_expense_cents: 2000000, program_expense_cents: 1400000, fundraising_expense_cents: 400000, admin_expense_cents: 200000, contributions_cents: 1800000, total_revenue_cents: 2100000, net_assets_cents: 900000, total_liabilities_cents: 300000, expected_organization_version: "${org_v2}" }
              as: OrganizationRep
              as_user_id: "${org1}"
              captures: { f_by_org: $.data.id }
          assert:
            - "${r_admin} == ${r_analyst} == ${r_reviewer} == ${r_panel} == ${r_org} == ${r_public} == 83.13: all six roles receive the same final_composite_score with no role-conditional redaction"
            - "Every one of the six reads returns 200 with the identical body, including assigned_analyst_user_id and publishing_reviewer_user_id - the shared read is not narrowed for PublicUser"
            - "${cyc_v} is the same value in all six responses, so no read incremented a version"
            - "${t_public} == 83.13: the public trend roll-up agrees with the cycle a donor can already read"
            - "${f_by_analyst} and ${f_by_org} are both created with 201 and status SUBMITTED: POST /filing-records is genuinely shared, and the organization's own submission is not second-class"
            - "The second filing needed the re-read ${org_v2}, because the analyst's filing had already advanced the Organization's OCC version - a shared write is still a serialised write"
      - name: an_empty_identity_header_is_rejected_before_the_role_is_even_considered
        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - endpoints.GET_/organizations
        distinguishing_aspect: |
          Priority 1 demands both identity headers be present AND non-empty, which
          is a stricter statement than "present": an empty string is the shape a
          proxy or a test harness produces when it forwards an unauthenticated
          request, and it must not be treated as a valid opaque user id. The
          instance separates the three failure modes that a single naive guard would
          conflate - empty user id, empty role, and a syntactically fine role that
          is not one of the six - and shows that only the third is a role error.
        test_recipe:
          setup: []
          trigger:
            - call: "GET /organizations"
              payload: {}
              as: MethodologyAdmin
              as_user_id: ""
              captures: { e_no_user: $.data.error_id }
            - call: "GET /organizations"
              payload: {}
              as: ""
              as_user_id: "admin-1"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /organizations"
              payload: {}
              as: "SUPER_ADMIN"
              as_user_id: "admin-1"
              captures: { e_unknown_role: $.data.error_id }
            - call: "GET /organizations"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
          assert:
            - "${e_no_user} == ERR_UNAUTHENTICATED with HTTP 401: an empty X-User-ID is not a user, even though the role header is impeccable"
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_ROLE_NOT_PERMITTED: an empty X-User-Role is an authentication failure at priority 1, and never reaches the priority-2 membership test"
            - "${e_unknown_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403: SUPER_ADMIN is present and non-empty, so priority 1 passes it through to priority 2, which rejects it for not being one of the six declared roles"
            - "The final identical call with both headers populated returns 200 with total_count == 0, so the three rejections were caused by the headers alone"
      - name: an_organization_rep_is_locked_to_the_organization_its_user_id_names
        claim_type: Peer Resource Isolation
        grounds:
          - validations[priority=4]
          - validations[priority=3]
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_NOT_RESOURCE_OWNER
          - endpoints.GET_/organizations/{organization_id}/filing-records
          - endpoints.GET_/organizations/{organization_id}/rating-trend
          - endpoints.POST_/correction-requests
          - endpoints.POST_/appeals
        distinguishing_aspect: |
          OrganizationRep is the one role whose X-User-ID is not opaque - it IS an
          Organization.id - so priority 4 turns the identity header into a row filter
          on exactly four operations. Two of them reach the owning organization
          directly through the path, and two reach it indirectly through
          RatingCycle.organization_id, which is the harder half: a naive guard that
          only compares the header against ids appearing in the URL would wave the
          correction request and the appeal straight through, because neither URL
          mentions an organization at all. The instance also pins priority 4 between
          its neighbours - a bogus path id still answers 404 from priority 3 above
          it, while a well-owned request that is merely mistimed falls through to the
          priority-8 state gate below it.
        test_recipe:
          setup:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
