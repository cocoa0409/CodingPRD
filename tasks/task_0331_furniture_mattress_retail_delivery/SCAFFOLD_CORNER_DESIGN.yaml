            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${oa_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v0}" }
              as: DeliveryDispatcher
          trigger:
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${ob_id}", window_start_minute: 700, window_end_minute: 760, expected_route_version: "${route_v0}" }
              as: DeliveryDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_order_version_on_financing_apply_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[financing-apply-stale-order]"
          - "errors[ERR_STALE_VERSION]"
          - entities.Order.fields.version
        distinguishing_aspect: "Applying for financing with an expected_order_version observed before a line was added (which bumped order.version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An order observed at version V; a line added after that observation advances order.version past V; financing applies with the stale V."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Occ Buyer", email: "occ@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { o_v_stale: $.data.version }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /financing-plans"
              payload: { order_id: "${o_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o_v_stale}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: financing_principal_snapshot_pinned_at_approval
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.financing_monthly_payment
          - entities.FinancingPlan.fields.financed_principal_cents
          - state_machines.FinancingPlan.PENDING_APPROVAL_to_CURRENT
        distinguishing_aspect: "financed_principal_cents is snapshotted from Order.order_total_cents at approval (116802 for the single-line sofa order), not at application time, and is stable thereafter."
        test_recipe:
          setup: ["A single-line sofa order (order_total 116802) with a PENDING_APPROVAL INSTALLMENT plan."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Snap Buyer", email: "snap@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { o_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o_v}" }
              as: SalesAssociate
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /financing-plans/${fp_id}/approve"
              as: StoreManager
              captures: { principal: $.data.financed_principal_cents }
          assert:
            - "FinancingPlan.${fp_id}.financed_principal_cents == 116802"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: confirm_recomputes_totals_in_same_response
        claim_type: immediate
        grounds:
          - calculations.order_grand_total
          - entities.Order.fields.order_total_cents
        distinguishing_aspect: "The confirm response immediately reflects recomputed merchandise_subtotal, service_total and order_total in the same request (immediate consistency); no re-read lag."
        excluded_because:
          difficulty_instance: combinatorial_formula / order_grand_total_sum_then_round_tax_order
          rationale: "The §1.8 grand-total instance already asserts merchandise_subtotal/service_total/order_total in the confirm response, proving immediate consistency."

      - name: refund_ledger_sync_visible_immediately
        claim_type: immediate
        grounds:
          - entities.Order.fields.amount_refunded_cents
          - state_machines.ReturnRequest.APPROVED_to_REFUNDED
        distinguishing_aspect: "After refund, GET /orders/{id} immediately shows amount_refunded_cents incremented (immediate ledger-sync consistency)."
        excluded_because:
          difficulty_instance: transitive_cascade / refund_cascades_line_returned_then_protection_voided_depth3
          rationale: "The §1.8 depth-3 cascade instance asserts Order.amount_refunded_cents == 85000 immediately after the refund call."
