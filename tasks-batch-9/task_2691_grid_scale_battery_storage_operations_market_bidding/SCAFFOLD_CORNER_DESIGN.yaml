              as: ControlRoomOperator
              as_user_id: "cro_1"
              captures: { ev: $.data.id, ev_imposed: $.data.imposed_safety_state }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { safety_after_alarm: $.data.safety_state, market_after_alarm: $.data.market_state }
          trigger:
            - call: "POST /safety-events/${ev}/close"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { e_bare: $.data.error_id }
            - call: "POST /safety-events/${ev}/close"
              payload: { emergency_response_ack_at: "2026-08-10T01:30:00Z", emergency_ack_agencies: ["Mesa County Fire District 4"], responder_cleared: false }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { e_not_cleared: $.data.error_id }
            - call: "POST /safety-events/${ev}/close"
              payload: { emergency_response_ack_at: "2026-08-10T01:30:00Z", emergency_ack_agencies: [], responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { e_no_agency: $.data.error_id }
            - call: "POST /safety-events/${ev}/close"
              payload: { emergency_response_ack_at: "2026-08-10T01:30:00Z", emergency_ack_agencies: ["Mesa County Fire District 4", "State Utility Commission"], responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { ev_status: $.data.status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { safety_final: $.data.safety_state, market_final: $.data.market_state }
          assert:
            - "${ev_imposed} == \"ALARM\", ${safety_after_alarm} == \"ALARM\" and ${market_after_alarm} == \"SUSPENDED\""
            - "no acknowledgement at all: HTTP 422 with ${e_bare} == \"ERR_EMERGENCY_ACK_REQUIRED\""
            - "acknowledged but responder_cleared false: HTTP 422 with ${e_not_cleared} == \"ERR_EMERGENCY_ACK_REQUIRED\" - the timestamp alone is not enough"
            - "acknowledged and cleared but zero agencies named: HTTP 422 with ${e_no_agency} == \"ERR_EMERGENCY_ACK_REQUIRED\" - the agency list must name at least one coordinating body"
            - "all three parts supplied: HTTP 200, ${ev_status} == \"CLOSED\", ${safety_final} == \"NORMAL\" and ${market_final} == \"AVAILABLE\" - only a complete acknowledgement returns the plant to market"

      - name: interconnection_limit_probes_separate_poi_and_reactive_codes
