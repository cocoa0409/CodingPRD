            - { call: "GET /plants/${plant_id}", as: PlantAdmin, captures: { plant_status: $.data.operating_status } }
          assert:
            - "resolve by creator insp-01 rejected: error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION and HTTP status == 403"
            - "resolve by insp-02 succeeds: status == CLOSED, resolved_by == insp-02"
            - "Plant.operating_status == ACTIVE again (last OPEN CRITICAL NR closed; reverse posture cascade)"

