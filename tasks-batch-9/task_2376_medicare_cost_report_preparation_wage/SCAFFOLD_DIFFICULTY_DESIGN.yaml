  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: resident_daily_fte_capacity_over_half_open_rotation_intervals
        grounds:
          - validations[priority=12]
          - entities.RotationAssignment.fields.end_date
          - entities.Resident.fields.assigned_fte_days
          - calculations.gme_fte_rolling_average
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start_date, end_date) with an AGGREGATE per-day capacity of
          1.0000 FTE on the Resident resource — an assignment starting exactly on another's end_date
          is accepted (adjacency is not overlap) while one sharing a single interior day is rejected
          because 0.6000 + 0.5000 exceeds the daily cap.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with fte_cap 2.00 and a DRAFT CostReport for FY 2025-07-01..2026-06-30 (365 period days)"
            - "cost center 03000 (ROUTINE) on that report as the rotation site"
            - "Resident 'Dana Okafor' (irp_status WITHIN_IRP) with one ACTIVE rotation [2025-07-01, 2026-01-01) at fte_fraction 0.6000, i.e. 184 overlap days and 110.4 fte_days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Okafor", program: "Internal Medicine", irp_status: "WITHIN_IRP" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-07-01", end_date: "2026-01-01", fte_fraction: 0.6000 }
              as: ReimbursementAnalyst
              captures: { rot_first: $.data.id }
          trigger:
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2026-01-01", end_date: "2026-02-01", fte_fraction: 0.5000 }
              as: ReimbursementAnalyst
              captures: { rot_adjacent: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-12-01", end_date: "2026-01-01", fte_fraction: 0.5000 }
              as: ReimbursementAnalyst
          assert:
            - "the first trigger call returns 201: RotationAssignment.${rot_adjacent}.start_date == '2026-01-01' equals RotationAssignment.${rot_first}.end_date, and because end_date is EXCLUSIVE the two share no day"
            - "RotationAssignment.${rot_adjacent}.overlap_days == 31 and fte_days == 15.5000"
            - "the second trigger call returns 409 with $.data.error_id == 'ERR_RESIDENT_DAILY_FTE_EXCEEDED' — [2025-12-01, 2026-01-01) shares 31 interior days with ${rot_first} where the aggregate would be 1.1000 > 1.0000"
            - "GET /rotation-assignments?resident_id=${resident_id} returns total_count == 2 (the rejected request created nothing)"
            - "Resident.${resident_id}.assigned_fte_days == 125.9000"
            - "CostReport.${report_id}.unweighted_fte_days_total == 125.9000 and unweighted_fte_total == 0.34"
            - "RotationAssignment.${rot_first}.overlap_days == 184 and fte_days == 110.4000"

