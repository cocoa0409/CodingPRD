    path: "/yacht/listings/{id}"
    description: "Fetch one listing"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: ListingAgreement
    side_effects: []
  - method: GET
    path: "/yacht/listings"
    description: "List listings with filters and pagination"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: ['status?', 'vessel_id?', 'seller_id?', 'brokerage_id?', 'listing_agent_id?', 'limit?', 'offset?']
    output: ListingAgreement[]
    side_effects: []
  - method: POST
    path: "/yacht/listings/{id}/activate"
    description: "Activate a DRAFT or SUSPENDED listing"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects: ["listing.status = ACTIVE", "increments listing.version by 1"]
  - method: POST
    path: "/yacht/listings/{id}/suspend"
    description: "Suspend an ACTIVE listing (no new offers)"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects: ["listing.status = SUSPENDED", "increments listing.version by 1"]
  - method: POST
