  - rule_id: compensating_invariant
    instances:
      - name: escort_revoke_restores_escort_committed_minutes_ledger_to_zero
        grounds:
          - state_machines.CaseAction.SCHEDULED_to_REVOKED
          - entities.Employee.fields.escort_committed_minutes
          - entities.CaseAction.fields.duration_minutes
          - calculations.protective_coverage_gap_hours
          - endpoints[POST /case-actions/{case_action_id}/revoke]
        distinguishing_aspect: |
          Conserved quantity 1 - a minute-valued ledger: Employee.escort_committed_minutes MUST
          always equal sum(duration_minutes) over that employee's SECURITY_ESCORT CaseActions in
          status SCHEDULED or ACTIVE. Create then revoke returns it to exactly 0 with no residual
          drift, and because protection_status was already GAP before the revoke no compensating
          SAFETY_PLAN_REVIEW is generated.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z (the mandatory default)."
            - "Worksite \"North Plant\" with employee_count 20 and one WorkArea \"Front Desk\" (public_access_flag true, night_shift_flag true, lone_worker_flag false, occupancy_cap 8)."
            - "Eleven ACTIVE Employee rows back the entity_backed roles: Sofia Ortiz (SafetyOfficer), Marcus Reed (SiteManager), Dana Kim (ThreatTeamLead, discipline HR), Ivan Petrov (SECURITY), Grace Liu (OPERATIONS), Nora Bell (CLINICAL), Omar Haddad (LEGAL), Priya Nair (HRPartner), Luis Vega (SecurityCoordinator), Ana Torres (reporter) and Karl Frey (subject)."
            - "TrainingModule ESC-101 (required_for_escort true, job_function_scope [\"SECURITY\"], refresh_interval_days 365, passing_score 80) and one SECURITY-job_function Employee \"Bea Solis\" who completed it at 2026-08-01T00:00:00Z with score 92, so expires_at is 2027-08-01T00:00:00Z and she is the only (employee, module) training pair — training_compliance_pct stays 100.00."
            - "PreventionPlan for the worksite carries one SCREENING HazardAssessment on the only WorkArea, so hazard_coverage_pct is 100.00; no TrainingModule exists, so training_compliance_pct is vacuously 100.00 and the plan reaches ACTIVE."
