            - "After dispute accept: capture_status == \"LOCKED\" (unchanged — unlock happens only on statement void) while credit_status == \"REVERSED\""
            - "GET /comp/physician-agreements/${agr} -> ytd_wrvu_credited == 0.00 after the reversal"
            - "Dispute.${dsp}.status == \"RESOLVED_ACCEPTED\" and resolution == \"ACCEPTED\""

      - name: dispute_correction_cycle
        grounds:
