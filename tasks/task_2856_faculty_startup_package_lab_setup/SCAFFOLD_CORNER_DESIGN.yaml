              as: DeanOffice
              captures: { e4_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${e4_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { e4_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${e4_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { e4_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${e4_fac}", package_kind: "INITIAL", dean_unit_id: "${e4_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { e4_pkg: $.data.id }
            - call: "POST /startup-packages/${e4_pkg}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "BIOL", room_number: "58", net_sq_ft: 800, space_class: "WET", power_kw_capacity: 150.00, chilled_water_available: true, fume_hood_count: 2, floor_load_psf: 300 }
              as: FacilitiesManager
              captures: { e4_space: $.data.id }
            - call: "POST /renovation-projects"
              payload: { package_id: "${e4_pkg}", space_id: "${e4_space}", scope_tier: "MODERATE", estimate_cents: 8000000 }
              as: FacilitiesManager
              captures: { e4_proj: $.data.id }
            - call: "POST /renovation-projects/${e4_proj}/solicit-bids"
              payload: {}
              as: FacilitiesManager
          trigger:
            - call: "POST /renovation-projects/${e4_proj}/rescope"
              payload: { revised_estimate_cents: 15000000, scope_tier: "GUT" }
              as: FacilitiesManager
          assert:
            - "response code is 200 and status went BID -> SCOPING - backwards along the lifecycle"
            - "estimate_cents == 15000000 and scope_tier == GUT: the field is named revised_estimate_cents on the wire but lands in estimate_cents, and the old 8000000 / MODERATE values are gone"
            - "rescope_count == 1 (it was 0) and version == 3 (create 1, solicit-bids 2, rescope 3)"
            - "no SpendTransaction row exists on the package and total_encumbered_cents is still 0 - the estimate is not money until /award runs, so RENOVATION_SUBSIDY_PCT is not applied here even though the tier changed"
            - "LabSpace.${e4_space}.status is still AVAILABLE - only /award moves the room to UNDER_RENOVATION"
            - "a second solicit-bids followed by a second rescope succeeds and leaves rescope_count == 2, so the cycle has no iteration cap"
            - "calling rescope again immediately (from SCOPING) returns 409 ERR_RENOVATION_STATE_INVALID - the backwards edge only exists out of BID"

      - name: corner_ep_space_assignment_links_room_and_package_and_rejects_unknown_room
        claim_type: Cross-reference link
