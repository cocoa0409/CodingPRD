              as: FleetOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_COURIER_BUFFER_CONFLICT ([10:15,11:00] is within the 30-min buffer of [09:00,10:00]; rejected though it would pass half-open vehicle geometry)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_held_equals_applied_plus_refunded
        grounds:
          - calculations.deposit_settlement_waterfall
          - state_machines.ReturnInspection.ASSESSED_to_SETTLED
          - entities.Subscription.fields.deposit_held_cents
        distinguishing_aspect: |
          Conserved monetary quantity: deposit_held_cents == deposit_applied_cents + deposit_refunded_cents
          must hold exactly after settle. With deposit 80000 and outstanding 16500 (damage only),
          applied 16500 + refunded 63500 == 80000. The settle (forward) + waterfall (compensation) leave no drift.
        test_recipe:
          setup:
            - "Returning subscription (deposit_held 80000) with an ASSESSED inspection carrying two damage line items 12000 + 4500 = 16500; no unpaid cycle/early invoices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "CI1", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "CI1-1", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "ci1@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/initiate-return"
              payload: {}
              as: Member
              as_user_id: "${appl_id}"
            - call: "POST /return-inspections"
              payload: { subscription_id: "${sub_id}", vehicle_id: "${veh_id}", reported_odometer_miles: 50 }
              as: FleetOperator
              captures: { insp_id: $.data.id }
            - call: "POST /return-inspections/${insp_id}/damage-line-items"
              payload: { severity: "MODERATE", amount_cents: 12000, note: "bumper" }
              as: FleetOperator
            - call: "POST /return-inspections/${insp_id}/damage-line-items"
              payload: { severity: "MINOR", amount_cents: 4500, note: "scratch" }
              as: FleetOperator
            - call: "POST /return-inspections/${insp_id}/assess"
              payload: {}
              as: FleetOperator
              captures: { dmg: $.data.total_damage_cents }
          trigger:
            - call: "POST /return-inspections/${insp_id}/settle"
              payload: {}
              as: BillingAdmin
              captures: { applied: $.data.deposit_applied_cents, refunded: $.data.deposit_refunded_cents, balance: $.data.balance_due_cents }
          assert:
            - "ReturnInspection.${insp_id}.total_damage_cents == 16500"
            - "ReturnInspection.${insp_id}.deposit_applied_cents == 16500"
            - "ReturnInspection.${insp_id}.deposit_refunded_cents == 63500"
            - "ReturnInspection.${insp_id}.balance_due_cents == 0"
            - "invariant holds: deposit_applied_cents + deposit_refunded_cents == Subscription.deposit_held_cents (16500 + 63500 == 80000)"

      - name: fleet_in_use_count_conservation_swap_approve_then_reject
        grounds:
          - state_machines.SwapRequest.REQUESTED_to_APPROVED
          - state_machines.SwapRequest.APPROVED_to_REJECTED
          - entities.Fleet.fields.in_use_count
        distinguishing_aspect: |
          Conserved count quantity (different from the monetary deposit invariant): approving a swap
          reserves the target (in_use_count 1->2) and rejecting the APPROVED swap compensates it back
          (2->1). Fleet.in_use_count after approve+reject equals the pre-approve value exactly; no drift.
        test_recipe:
          setup:
            - "ACTIVE subscription holding v1 (ASSIGNED) in a fleet; v2 AVAILABLE in the same fleet. in_use_count == 1 before approve. A swap into v2 is REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
