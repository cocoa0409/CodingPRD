  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_and_read
        claim_type: immediate
        grounds: [complexity_profile, entities.CustomerClass.fields.present_revenue_cents, entities.RateCase.fields.present_revenue_total_cents]
        distinguishing_aspect: "Immediate consistency: the class create RESPONSE already carries the computed present_revenue_cents (1,128,000,000), and a subsequent same-instant GET on the parent case shows the recomputed aggregate present_revenue_total_cents with no lag or reconciliation window."
        test_recipe:
          setup: ["Case DRAFT"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /api/v1/customer-classes", payload: { rate_case_id: "${rc}", class_code: "RESIDENTIAL", customer_count: 20000, monthly_kwh_per_customer: 500, annual_kwh: 120000000, coincident_peak_kw: 120000, average_demand_kw: 80000, present_customer_charge_cents: 800, present_tiers: [ { up_to_kwh: 300, rate_mills: 700 }, { up_to_kwh: 600, rate_mills: 900 }, { up_to_kwh: null, rate_mills: 1100 } ] }, as: UtilityFiler, captures: { prev: $.data.present_revenue_cents, alloc: $.data.allocated_cost_cents } }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { total: $.data.present_revenue_total_cents } }
          assert:
            - "${prev} == 1128000000 in the 201 response itself"
            - "${total} == 1128000000 on the immediately-following read (aggregate recomputed synchronously)"

