  - section: cross_cutting_layers
    instances:
      - name: amendment_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-create-stale-contract]
          - validations[priority=6]
        distinguishing_aspect: "OCC on Contract.version: after amendment am1 advances the contract version, a second create carrying the previously observed version is rejected with 412 ERR_STALE_CONTRACT_VERSION and supersedes nothing."
        test_recipe:
          setup: ["ACTIVE contract kO at version 2 (create=1, activate=2); amendment am1 created with the fresh version (bumps to 3)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "OCC Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "OCC Lot", address: "37 Version St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher, captures: { k_v: $.data.version } }
            - { call: "POST /amendments", payload: { contract_id: "${k}", expected_contract_version: "${k_v}", effective_from: "2027-01-01T00:00:00Z", trigger_depth_inches: 2.5 }, as: OpsDispatcher, captures: { am1: $.data.id, am1_status: $.data.status } }
          trigger:
            - { call: "POST /amendments", payload: { contract_id: "${k}", expected_contract_version: "${k_v}", effective_from: "2027-01-15T00:00:00Z", per_push_rate_cents: 50000 }, as: OpsDispatcher, captures: { err: $.data.error_id } }
            - { call: "GET /contracts/${k}/amendments", as: OpsDispatcher }
            - { call: "GET /contracts/${k}", as: OpsDispatcher, captures: { k_ver: $.data.version } }
          assert:
            - "Second create with the stale expected_contract_version (observed before am1): HTTP 412 with error_id == ERR_STALE_CONTRACT_VERSION"
            - "Amendment ${am1} is still PENDING (a rejected create supersedes nothing) and contract version advanced exactly once (2 -> 3)"

