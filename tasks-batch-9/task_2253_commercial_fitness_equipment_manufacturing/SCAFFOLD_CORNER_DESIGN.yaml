- section: calculations
  instances:
  - name: model_lifecycle_rollup_walks_pre_release_active_sunset_obsolete
    claim_type: correct_result
    grounds:
    - calculations.model_lifecycle_rollup
    - entities.EquipmentModel.fields.lifecycle_status
    - entities.EquipmentModel.fields.released_revision_count
    distinguishing_aspect: 'The model''s lifecycle_status is a pure rollup of its revisions and is re-derived on every revision status change: PRE_RELEASE while the only revision is QUALIFIED, ACTIVE once
      it is RELEASED, SUNSET on sunset, OBSOLETE on mark-obsolete — and released_revision_count counts lifetime releases (1), so it does NOT fall back to 0 when the revision leaves RELEASED.'
    test_recipe:
      setup:
      - Model T900 Treadmill has exactly one revision T900-R1, tested to 500000 verified cycles and QUALIFIED.
      - The logical clock starts at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      - call: POST /model-revisions/${r1}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-rigs
        payload: {name: RIG-A, parallel_station_count: 2, supported_duty_classes: [FULL_COMMERCIAL, INSTITUTIONAL]}
        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x1: $.data.id}
      - call: POST /test-runs/${x1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x1}/complete
        payload: {outcome: PASSED, achieved_cycles: 300000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${r1}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {x2: $.data.id}
      - call: POST /test-runs/${x2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${x2}/complete
        payload: {outcome: PASSED, achieved_cycles: 200000}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/qualify
        payload: {}
        as: ProductEngineer
      trigger:
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/release
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions/${r1}/sunset
        payload: {sunset_reason: platform refresh announced to the dealer network}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2031-08-01T00:00:00Z'}
        as: ServiceOpsAdmin
      - call: POST /model-revisions/${r1}/mark-obsolete
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-01
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      assert:
      - 'with the only revision QUALIFIED: EquipmentModel.${m1}.lifecycle_status == PRE_RELEASE and released_revision_count == 0'
      - 'after release: lifecycle_status == ACTIVE and released_revision_count == 1'
      - 'after sunset: lifecycle_status == SUNSET and released_revision_count is still 1'
      - 'after sunset: ModelRevision.${r1}.firmware_support_until == 2031-07-31T00:00:00Z (sunset instant + 1825 days)'
      - 'after mark-obsolete at clock 2031-08-01: lifecycle_status == OBSOLETE and released_revision_count is still 1'
      - ModelRevision.${r1}.status == OBSOLETE and verified_cycle_count is still 500000
