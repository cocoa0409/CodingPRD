  # -------------------------------------------------------------------------
  # Rule 4: transitive_cascade — 2 instances from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: excursion_open_cascades_lot_quarantine_and_site_counter
        grounds:
          - state_machines.TemperatureExcursion
          - state_machines.Lot
          - entities.ProviderSite.fields.excursion_count_open
        distinguishing_aspect: |
          Cascade from temperature-reading trigger (depth 3): a single
          out-of-range TemperatureReading POST mutates (1) TemperatureExcursion
          (create OPEN), (2) every AVAILABLE Lot in the unit (-> QUARANTINED),
          (3) ProviderSite.excursion_count_open (+1). Each link caused by the
          prior: the lot cascade is caused by the excursion creation, not by
          the reading directly.
        test_recipe:
          setup:
            - "Site S; unit U; product P; three lots in U (L1 PRIVATE 5 doses, L2 PRIVATE 3 doses, L3 PRIVATE 2 doses)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-401" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot1: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L2", stock_type: "PRIVATE", quantity_on_hand: 3, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot2: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L3", stock_type: "PRIVATE", quantity_on_hand: 2, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot3: $.data.id }
          trigger:
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { cnt: $.data.excursion_count_open }
            - call: "GET /lots/${lot1}"
              payload: {}
              as: VaccineManager
              captures: { l1_st: $.data.status }
            - call: "GET /lots/${lot2}"
              payload: {}
              as: VaccineManager
              captures: { l2_st: $.data.status }
            - call: "GET /lots/${lot3}"
              payload: {}
              as: VaccineManager
              captures: { l3_st: $.data.status }
            - call: "GET /storage-units/${unit_u}"
              payload: {}
              as: VaccineManager
              captures: { unit_q: $.data.is_quarantined }
          assert:
            - "${l1_st} == QUARANTINED"
            - "${l2_st} == QUARANTINED"
            - "${l3_st} == QUARANTINED"
            - "${unit_q} == true"
            - "${cnt} == 1"

      - name: audit_close_fail_cascades_site_suspend_and_blocks_order_submit
        grounds:
          - state_machines.SiteVisitAudit
          - state_machines.ProviderSite
          - state_machines.VaccineOrder
        distinguishing_aspect: |
          Different trigger than excursion cascade: this cascade originates
          from audit close-fail. Depth 2: close-fail mutates ProviderSite
          (-> SUSPENDED_ORDERING), which then itself blocks VaccineOrder.submit
          via the ERR_SITE_SUSPENDED_ORDERING precondition — a downstream
          consequence that only fires because the site transitioned, not
          because of the audit directly.
        test_recipe:
          setup:
            - "Site S; unit U; product P; one PUBLIC lot via order with 5 doses; patient/screening; one dose administered (creating an accountability gap of 4)"
            - "SiteVisitAudit moved to FINDINGS_ISSUED"
