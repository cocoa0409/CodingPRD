  - method: GET
    path: "/v1/projects/{projectId}/rfis"
    description: "List RFIs of a project"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "RFI[]"
    side_effects: []

  - method: GET
    path: "/v1/rfis"
    description: "Filtered list of RFIs"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: ["project_id?", "spec_section_id?", "submittal_id?", "status?", "is_overdue?", "routed_reviewer_id?", "answered_by_reviewer_id?", "limit?", "offset?"]
    output: "RFI[]"
    side_effects: []

  - method: GET
    path: "/v1/rfis/{rfiId}"
    description: "Get one RFI"
    roles: [PlatformAdmin, ProjectManager, ProjectEngineer, OwnerRep, Reviewer, SubcontractorRep]
    code: 200
    input: []
    output: RFI
    side_effects: []

  - method: POST
    path: "/v1/rfis/{rfiId}/route"
    description: "OPEN -> ROUTED; reviewer_id optional; omitted -> reviewer_selector with rfi.required_discipline"
    roles: [ProjectEngineer]
    code: 200
    input: ["reviewer_id?"]
    output: RFI
    side_effects: ["routed_reviewer_id/routed_date set", "increments RFI.version by 1"]

  - method: POST
    path: "/v1/rfis/{rfiId}/answer"
    description: "ROUTED -> ANSWERED; only the assigned reviewer; conditional requirement of estimate fields; auto-creates ImpactAssessment when cost_impact_flag"
    roles: [Reviewer]
    code: 200
    input: [answer_text, cost_impact_flag, schedule_impact_flag, "estimated_cost_cents?", "estimated_schedule_days?"]
    output: RFI
    side_effects: ["is_late_answer computed (answered_date <= due_date is on time)", "ImpactAssessment ESTIMATED created when cost flag", "increments RFI.version by 1"]

  - method: POST
    path: "/v1/rfis/{rfiId}/reopen"
    description: "ANSWERED -> ROUTED (clarification cycle): clears answer fields, recomputes due_date, auto-waives a lingering ESTIMATED assessment"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: RFI
    side_effects: ["cycle_count += 1", "due_date recomputed from clock date", "is_overdue -> false", "increments RFI.version by 1"]

  - method: POST
    path: "/v1/rfis/{rfiId}/distribute"
    description: "Create QUEUED DistributionRecords (source_type RFI) for the affected set: spec section's responsible sub UNION subs of non-cancelled activities referencing rfi.submittal_id; empty set -> ERR_NO_DISTRIBUTION_TARGETS; repeat distribute -> ERR_ALREADY_DISTRIBUTED"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: "DistributionRecord[]"
    side_effects: ["record creation ordered by Subcontractor.created_at ASC"]

  - method: POST
    path: "/v1/rfis/{rfiId}/close"
    description: "ANSWERED -> CLOSED; requires no non-terminal ImpactAssessment"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: RFI
    side_effects: ["increments RFI.version by 1"]

  - method: POST
    path: "/v1/rfis/{rfiId}/void"
    description: "OPEN/ROUTED/ANSWERED -> VOID"
    roles: [ProjectManager]
    code: 200
    input: ["reason?"]
    output: RFI
    side_effects: ["increments RFI.version by 1"]

  # --- ImpactAssessment ---
