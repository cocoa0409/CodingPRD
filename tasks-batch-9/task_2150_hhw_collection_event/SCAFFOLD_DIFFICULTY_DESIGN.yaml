  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: event_lifecycle_and_containment_axes_advance_independently
        grounds:
          - state_machines.CollectionEvent.lifecycle_status.SITE_CONFIRMED_to_OPEN_FOR_REGISTRATION
          - state_machines.CollectionEvent.containment_status.COMPLIANT_to_DEFICIENT
          - state_machines.CollectionEvent.containment_status.DEFICIENT_to_REMEDIATED
          - entities.CollectionEvent.fields.lifecycle_status
          - entities.CollectionEvent.fields.containment_status
        distinguishing_aspect: |
          CollectionEvent carries two PARALLEL state dimensions on one row: containment_status walks
          PENDING_INSPECTION -> COMPLIANT -> DEFICIENT -> REMEDIATED while lifecycle_status stays pinned
          at OPEN_FOR_REGISTRATION, and lifecycle_status walks PLANNED -> SITE_CONFIRMED ->
          OPEN_FOR_REGISTRATION without ever moving containment_status.
        test_recipe:
          setup:
            - "Program, APPROVED site and one PLANNED CollectionEvent 2026-09-12T08:00Z..20:00Z with containment_status PENDING_INSPECTION"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id, life_0: $.data.lifecycle_status, cont_0: $.data.containment_status }
          trigger:
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
              captures: { life_1: $.data.lifecycle_status, cont_1: $.data.containment_status }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { life_2: $.data.lifecycle_status, cont_2: $.data.containment_status }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
              captures: { life_3: $.data.lifecycle_status, cont_3: $.data.containment_status }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "FAIL", finding_code: "DRAIN-UNCOVERED" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { life_4: $.data.lifecycle_status, cont_4: $.data.containment_status }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "DRAIN-COVERED", remediation_note: "Storm drain mat deployed" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { life_5: $.data.lifecycle_status, cont_5: $.data.containment_status }
          assert:
            - "${life_0} == PLANNED and ${cont_0} == PENDING_INSPECTION"
            - "${life_1} == SITE_CONFIRMED and ${cont_1} == PENDING_INSPECTION"
            - "${life_2} == SITE_CONFIRMED and ${cont_2} == COMPLIANT"
            - "${life_3} == OPEN_FOR_REGISTRATION and ${cont_3} == COMPLIANT"
            - "${life_4} == OPEN_FOR_REGISTRATION and ${cont_4} == DEFICIENT"
            - "${life_5} == OPEN_FOR_REGISTRATION and ${cont_5} == REMEDIATED"
            - "Program.${prog_id}.open_containment_deficiency_count == 0 after the final REMEDIATED inspection"

      - name: manifest_discrepancy_reopen_revision_cycle
        grounds:
          - state_machines.Manifest.SHIPPED_to_DISCREPANCY
          - state_machines.Manifest.DISCREPANCY_to_DRAFT
          - state_machines.PackedContainer.SHIPPED_to_SEALED
          - entities.Manifest.fields.status
          - entities.PackedContainer.fields.discrepancy_flag
        distinguishing_aspect: |
          Manifest is a CYCLIC machine on a different entity from CollectionEvent: it returns to DRAFT
          via DRAFT -> SIGNED -> SHIPPED -> DISCREPANCY -> DRAFT and can then be signed, shipped and
          received a second time, with the same PackedContainer row travelling SEALED -> MANIFESTED ->
          SHIPPED -> SEALED -> MANIFESTED -> SHIPPED -> DISPOSED.
        test_recipe:
          setup:
            - "Full base chain: program, APPROVED site, event driven to IN_PROGRESS with a 12.00 h lane assignment, one COMPLETED appointment with three ACCEPTED latex lines (4.5 kg)"
            - "One TOXIC container DRUM-A1 SEALED with estimated_disposal_cost_cents 699, carried on manifest MAN-0004 which is SIGNED then SHIPPED"
          setup_api_calls:
