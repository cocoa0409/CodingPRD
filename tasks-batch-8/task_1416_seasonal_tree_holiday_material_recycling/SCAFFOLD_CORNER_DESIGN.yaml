        distinguishing_aspect: "Aggregate close guard: an ACTIVE program with a non-CLOSED site and no PUBLISHED report cannot close."
        test_recipe:
          setup: ["Program ACTIVE; one site still PLANNED; no reports"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
