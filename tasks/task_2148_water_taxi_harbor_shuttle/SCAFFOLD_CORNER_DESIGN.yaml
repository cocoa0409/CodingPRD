              as_user_id: "rider-ann"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PASS_NOT_ACTIVE"
            - "HTTP status of the trigger == 409"
            - "RidePass.${pass_id}.status == REFUNDED"
            - "RidePass.${pass_id}.refund_basis == PRO_RATA"
            - "RidePass.${pass_id}.refund_amount_cents == 4000"
