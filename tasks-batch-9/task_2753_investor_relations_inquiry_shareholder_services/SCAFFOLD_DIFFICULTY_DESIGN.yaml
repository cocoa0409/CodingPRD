              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Overlap Holder", email: "ovl@funds.test", shares_held: 20000, nda_on_file: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "CONFERENCE", venue_city: "New York", window_start: "2026-09-01T13:00:00Z", window_end: "2026-09-01T18:00:00Z", slot_minutes: 30, capacity_slots: 5 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ev1_id: "$.data.id" }
            - call: "POST /roadshow-events/${ev1_id}/open-requests"
