            - call: "POST /balance-changes/${bc_id}/comms-notices"
              payload: { channel: "PATCH_NOTES", headline: "Gem sink tuning", body: "Crafting costs rise 5 percent next week." }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { notice_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v2: $.data.version }
            - call: "POST /balance-changes/${bc_id}/advance"
              payload: { to_stage: "CANARY", expected_season_version: "${season_v2}" }
