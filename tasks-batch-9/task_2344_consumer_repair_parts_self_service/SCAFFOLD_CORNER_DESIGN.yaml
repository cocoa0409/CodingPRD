              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/defective-returns/aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa/analysis"
              payload: { root_cause_code: "MANUFACTURING_DEFECT", defect_confirmed: true, analysis_note: "solder void" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e2: $.data.error_id }
            - call: "POST /repair-program/defective-returns/aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa/receive"
              payload: {}
              as: FailureAnalysisEngineer
              as_user_id: "u_fae_1"
              captures: { e3: $.data.error_id }
            - call: "POST /repair-program/defective-returns/aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa/credit-decision"
              payload: { decision: "ISSUE_CREDIT" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e4: $.data.error_id }
            - call: "POST /repair-program/defective-returns/aaaaaaaa-2222-aaaa-2222-aaaaaaaaaaaa/credit-decision"
              payload: { decision: "ISSUE_CREDIT" }
              as: FailureAnalysisEngineer
              as_user_id: "u_fae_1"
              captures: { e5: $.data.error_id }
            - call: "GET /repair-program/defective-returns"
              payload: {}
              as: FailureAnalysisEngineer
              as_user_id: "u_fae_1"
              captures: { n_cases: $.total_count }
          assert:
            - "${e1} == ERR_FORBIDDEN_ROLE and ${e2} == ERR_FORBIDDEN_ROLE with HTTP 403 — analysis is exclusive to FailureAnalysisEngineer"
            - "${e3} == ERR_FORBIDDEN_ROLE — receive is exclusive to ProgramAdmin"
            - "${e4} == ERR_FORBIDDEN_ROLE — the buyer never decides credit"
            - "${e5} == ERR_RETURN_CASE_NOT_FOUND with HTTP 404 — the shared role passes the gate and only then hits the missing row, which is what proves the ordering"
            - "${n_cases} == 0 and the reads are open to the engineer"

      - name: buyer_roles_share_the_order_flow_and_are_forbidden_from_fulfilment_writes
        claim_type: shared_operations
        grounds:
