# =============================================================================
# Task 2334 — §1.9 Scaffold Corner Design (Coverage Index for non-difficulty tests)
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1–§1.7. Sections and claim_type values come from that guide only.
# Anchors (&c01 …) are local to THIS document (YAML anchors do not cross files)
# and replay the canonical chain: project -> study -> alternatives -> routes ->
# publication/comment -> nomination -> application -> hearing -> decision ->
# certificate -> easements -> construction.
# Every numeric literal below was computed with a Decimal/ROUND_HALF_UP script
# against the §1.3 formulas.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: project_creation_returns_full_response_envelope
        claim_type: creation
        grounds:
          - entities.Project
          - endpoints[POST /siting/projects]
          - response_envelope
        distinguishing_aspect: "POST with all four required inputs returns 201, the fixed {data, meta} envelope, and every declared Project field including the four common fields."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - &c01
              call: "POST /siting/projects"
              payload: { name: "Harlan-Boone 345kV Rebuild", voltage_class: "KV_345", jurisdiction_state: "KY", target_energization_at: "2028-04-01T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { proj: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Project.${proj}.name == Harlan-Boone 345kV Rebuild"
            - "Project.${proj}.voltage_class == KV_345"
            - "Project.${proj}.jurisdiction_state == KY"
            - "Project.${proj}.target_energization_at == 2028-04-01T00:00:00Z"
            - "Project.${proj}.version == 1"
            - "Project.${proj}.created_at == 2026-08-01T00:00:00.000Z"

      - name: project_retrieval_returns_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints[GET /siting/projects/{projectId}]
          - entities.Project.fields.stage
        distinguishing_aspect: "GET by id returns the same field values the create response reported, with no recomputation drift on stage or the escrow counters."
        test_recipe:
          setup:
            - "One project created in stage PLANNING"
          setup_api_calls:
            - *c01
          trigger:
            - call: "GET /siting/projects/${proj}"
              payload: {}
              as: CommissionStaff
              as_user_id: "staff-lin"
          assert:
            - "response.status == 200"
            - "response.data.id == ${proj}"
            - "response.data.stage == PLANNING"
            - "response.data.schedule_posture == ON_TRACK"
            - "response.data.version == 1"

      - name: planning_study_defaults_applied_on_creation
        claim_type: defaults
        grounds:
          - endpoints[POST /siting/planning-studies].side_effects
          - entities.PlanningStudy.fields.status
          - entities.PlanningStudy.fields.alternatives_screened_in_count
        distinguishing_aspect: "A study created with only its five required inputs defaults to status DRAFT with alternatives_screened_in_count 0 and every computed need-case field null until certification runs."
        test_recipe:
          setup:
            - "One project in stage PLANNING"
          setup_api_calls:
            - *c01
          trigger:
            - &c02
              call: "POST /siting/planning-studies"
              payload: { project_id: "${proj}", horizon_year: 2032, reliability_deficit_mw: 400, transmission_capex_cents: 80000000000, benefit_pv_cents: 80000000000 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { study: "$.data.id" }
          assert:
            - "response.status == 201"
            - "PlanningStudy.${study}.status == DRAFT"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 0"
            - "PlanningStudy.${study}.need_margin_ratio == null"
            - "PlanningStudy.${study}.selected_nta_alternative_id == null"
            - "PlanningStudy.${study}.authored_by_user_id == dev-nora"

      - name: project_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Project.common_fields
          - endpoints[POST /siting/projects].input
        distinguishing_aspect: "Client-supplied id, created_at, version and stage are ignored: the server mints its own UUID, stamps created_at from the logical clock, starts version at 1 and forces stage PLANNING."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /siting/projects"
              payload: { name: "Spoofed Project", voltage_class: "KV_138", jurisdiction_state: "KY", target_energization_at: "2028-04-01T00:00:00Z", id: "00000000-0000-4000-8000-000000000001", created_at: "2000-01-01T00:00:00.000Z", version: 99, stage: "ENERGIZED" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { proj_spoof: "$.data.id" }
          assert:
            - "response.status == 201"
            - "response.data.id != 00000000-0000-4000-8000-000000000001"
            - "Project.${proj_spoof}.created_at == 2026-08-01T00:00:00.000Z"
            - "Project.${proj_spoof}.version == 1"
            - "Project.${proj_spoof}.stage == PLANNING"

      - name: alternative_missing_required_deliverable_mw_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /siting/alternatives].input
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "deliverable_mw has source input with no default, so omitting it fails shape validation at priority 5 with ERR_INVALID_REQUEST (400) and no Alternative row is written."
        test_recipe:
          setup:
            - "One project with one DRAFT planning study"
          setup_api_calls:
            - *c01
            - *c02
          trigger:
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "TRANSMISSION", description: "New 345kV single-circuit line", capex_cents: 80000000000 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 0"

      - name: alternative_levelized_cost_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.levelized_alternative_cost
          - entities.Alternative.fields.levelized_cost_cents_per_mw
        distinguishing_aspect: "levelized_cost_cents_per_mw is source computed: a client-supplied value is discarded and the frozen result is 80000000000 / 400 = 200000000.00 cents per MW."
        test_recipe:
          setup:
            - "One project with one DRAFT planning study"
          setup_api_calls:
            - *c01
            - *c02
          trigger:
            - &c03
              call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "TRANSMISSION", description: "New 345kV single-circuit line", capex_cents: 80000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt1: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Alternative.${alt1}.levelized_cost_cents_per_mw == 200000000.00"
            - "Alternative.${alt1}.screening_status == SUBMITTED"

      - name: route_segment_rating_above_range_rejected
        claim_type: type_constraints
        grounds:
          - entities.RouteSegment.fields.land_use_rating
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The four criteria ratings are constrained to 0..5 inclusive, so a land_use_rating of 6 is refused with ERR_INVALID_REQUEST and the route's segment_count stays 0."
        test_recipe:
          setup:
            - "One project with one DRAFT route"
          setup_api_calls:
            - *c01
            - &c08
              call: "POST /siting/routes"
              payload: { project_id: "${proj}", label: "Route A - river crossing", kind: "PROPOSED" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { routeA: "$.data.id" }
          trigger:
            - call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 10.0, land_use_rating: 6, environmental_rating: 4, cultural_rating: 2, engineering_rating: 3, county: "Harlan", crew_capacity: 12 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "Route.${routeA}.segment_count == 0"
            - "Route.${routeA}.total_miles == 0.0"

      - name: easement_tract_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /siting/easement-tracts/{tractId}]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "A well-formed UUID that names no row returns ERR_RESOURCE_NOT_FOUND (404) at priority 3, not an empty 200 envelope."
        test_recipe:
          setup:
            - "One project exists; no EasementTract rows exist"
          setup_api_calls:
            - *c01
          trigger:
            - call: "GET /siting/easement-tracts/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: route_segments_listing_filtered_and_paginated
        claim_type: listing
        grounds:
          - endpoints[GET /siting/route-segments]
          - entities.RouteSegment.fields.sequence_index
        distinguishing_aspect: "The filtered list narrows to one route_id and honours limit/offset with meta.total_count reporting the full filtered size (3), not the page size (2)."
        test_recipe:
          setup:
            - "Route A with three segments in sequence_index order 1, 2, 3"
          setup_api_calls:
            - *c01
            - *c08
            - &c09
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 10.0, land_use_rating: 3, environmental_rating: 4, cultural_rating: 2, engineering_rating: 3, county: "Harlan", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: true, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg1: "$.data.id" }
            - &c10
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 2, miles: 6.0, land_use_rating: 2, environmental_rating: 2, cultural_rating: 1, engineering_rating: 4, county: "Boone", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NAVIGABLE_WATERWAY" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg2: "$.data.id" }
            - &c11
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 3, miles: 4.0, land_use_rating: 4, environmental_rating: 5, cultural_rating: 3, engineering_rating: 2, county: "Clay", crew_capacity: 12, survey_status: "DESKTOP", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg3: "$.data.id" }
          trigger:
            - call: "GET /siting/route-segments"
              payload: { route_id: "${routeA}", limit: 2, offset: 0 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { first_seg: "$.data[0].id" }
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 3"
            - "response.data length == 2"
            - "response.data[0].sequence_index == 1"
            - "response.data[1].sequence_index == 2"
            - "Route.${routeA}.segment_count == 3"
            - "Route.${routeA}.total_miles == 20.0"
            - "Route.${routeA}.unsurveyed_segment_count == 1"

      - name: easement_tract_on_segment_of_other_project_rejected
        claim_type: parent_relationships
        grounds:
          - validations[ERR_TRACT_SEGMENT_MISMATCH].check
          - entities.EasementTract.fields.segment_id
        distinguishing_aspect: "Flat topology cross-reference integrity: both FKs resolve, but the segment's route belongs to a different project, so the tract is refused at priority 40 with ERR_TRACT_SEGMENT_MISMATCH (422)."
        test_recipe:
          setup:
            - "Project 1 owns Route A with segment 1"
            - "A second, unrelated project and one landowner exist"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - &c33
              call: "POST /siting/projects"
              payload: { name: "Unrelated Clay Loop", voltage_class: "KV_138", jurisdiction_state: "KY", target_energization_at: "2030-04-01T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { proj_other: "$.data.id" }
            - &c32
              call: "POST /siting/landowners"
              payload: { name: "Ada Wren", email: "ada@example.com", mailing_address: "18 Ridge Rd, Harlan KY" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { lo1: "$.data.id" }
          trigger:
            - call: "POST /siting/easement-tracts"
              payload: { project_id: "${proj_other}", segment_id: "${seg1}", landowner_id: "${lo1}", parcel_number: "H-104-22", acres: 12.35, per_acre_value_cents: 487500, easement_factor: 0.65 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TRACT_SEGMENT_MISMATCH"
            - "EasementTract count for project ${proj_other} == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_route_starts_in_draft_status
        claim_type: initial_state
        grounds:
          - state_machines.Route.initial_state
          - endpoints[POST /siting/routes].side_effects
        distinguishing_aspect: "A freshly created Route is DRAFT with refinement_round 0 and null scores, and the first route on a project advances Project.stage from PLANNING to ROUTING."
        test_recipe:
          setup:
            - "One project in stage PLANNING with no routes"
          setup_api_calls:
            - *c01
          trigger:
            - *c08
          assert:
            - "Route.${routeA}.status == DRAFT"
            - "Route.${routeA}.refinement_round == 0"
            - "Route.${routeA}.constraint_score_certified == null"
            - "Route.${routeA}.open_house_held_count == 0"
            - "Project.${proj}.stage == ROUTING"

      - name: study_certification_below_threshold_marks_insufficient
        claim_type: valid_transition
        grounds:
          - state_machines.PlanningStudy.ALTERNATIVES_ANALYZED_to_INSUFFICIENT
          - calculations.need_justification_margin
        distinguishing_aspect: "With the cheapest screened-in non-transmission portfolio at 45000000000 / 200 MW = 225000000.00 the margin is 1.1250, below 1.1500, so certification records the computed fields but lands the study in INSUFFICIENT instead of CERTIFIED_SUFFICIENT."
        test_recipe:
          setup:
            - "Study with reliability_deficit_mw 400, transmission_capex_cents 80000000000, benefit_pv_cents 80000000000"
            - "Two SCREEN_IN alternatives: TRANSMISSION 80000000000/400 MW and NON_TRANSMISSION 45000000000/200 MW"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - &c04b
              call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Lean storage portfolio", capex_cents: 45000000000, deliverable_mw: 200 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt2b: "$.data.id" }
            - &c05
              call: "POST /siting/alternatives/${alt1}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Meets deficit in full" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &c06b
              call: "POST /siting/alternatives/${alt2b}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Credible non-wires portfolio" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          trigger:
            - call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Independent review of the need case" }
              as: Developer
              as_user_id: "dev-milo"
          assert:
            - "response.status == 201"
            - "Alternative.${alt2b}.levelized_cost_cents_per_mw == 225000000.00"
            - "PlanningStudy.${study}.need_margin_ratio == 1.1250"
            - "PlanningStudy.${study}.status == INSUFFICIENT"
            - "PlanningStudy.${study}.selected_nta_alternative_id == ${alt2b}"

      - name: insufficient_study_returns_to_alternatives_analyzed_on_new_screening
        claim_type: valid_transition
        grounds:
          - state_machines.PlanningStudy.INSUFFICIENT_to_ALTERNATIVES_ANALYZED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Cyclic shape: an INSUFFICIENT study is not terminal — screening in a third alternative returns it to ALTERNATIVES_ANALYZED so certification can be re-attempted, and alternatives_screened_in_count reaches 3."
        test_recipe:
          setup:
            - "Study INSUFFICIENT after a certification attempt at margin 1.1250 with two screened-in alternatives"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c04b
            - *c05
            - *c06b
            - &c07i
              call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "First attempt on the lean portfolio" }
              as: Developer
              as_user_id: "dev-milo"
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "HYBRID", description: "Storage plus reconductoring", capex_cents: 60000000000, deliverable_mw: 200 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt3: "$.data.id" }
          trigger:
            - call: "POST /siting/alternatives/${alt3}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Hybrid portfolio now credible" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          assert:
            - "Alternative.${alt3}.screening_status == SCREENED_IN"
            - "Alternative.${alt3}.levelized_cost_cents_per_mw == 300000000.00"
            - "PlanningStudy.${study}.alternatives_screened_in_count == 3"
            - "PlanningStudy.${study}.status == ALTERNATIVES_ANALYZED"

      - name: route_publication_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Route.CONSTRAINT_MAPPED_to_PUBLISHED_FOR_COMMENT
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Publication exists only from CONSTRAINT_MAPPED; called on a DRAFT route it fails at priority 10 with ERR_INVALID_STATE (409) and comment_window_closes_at stays null."
        test_recipe:
          setup:
            - "Route A in DRAFT with two segments and no constraint mapping run"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
            - *c10
          trigger:
            - call: "POST /siting/routes/${routeA}/publication"
              payload: { comment_window_days: 30 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Route.${routeA}.status == DRAFT"
            - "Route.${routeA}.comment_window_closes_at == null"

      - name: constraint_mapping_with_single_segment_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Route.DRAFT_to_CONSTRAINT_MAPPED.preconditions
          - errors.ERR_SEGMENT_SEQUENCE_GAP
        distinguishing_aspect: "The at-least-two-segments precondition is enforced with ERR_SEGMENT_SEQUENCE_GAP (422); the route stays DRAFT and no scores are written."
        test_recipe:
          setup:
            - "Route A in DRAFT with exactly one segment at sequence_index 1"
          setup_api_calls:
            - *c01
            - *c08
            - *c09
          trigger:
            - call: "POST /siting/routes/${routeA}/constraint-mapping"
              payload: { mapping_note: "Premature mapping attempt" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SEGMENT_SEQUENCE_GAP"
            - "Route.${routeA}.status == DRAFT"
            - "Route.${routeA}.constraint_score_preliminary == null"

      - name: alternate_route_nomination_skips_the_comment_window
        claim_type: valid_transition
        grounds:
          - state_machines.Route.CONSTRAINT_MAPPED_to_NOMINATED
          - entities.Route.fields.kind
        distinguishing_aspect: "An ALTERNATE route nominates straight from CONSTRAINT_MAPPED with only the density test applied — no publication, no open houses, no comment-window wait — and its two fully field-verified segments score 17.48 at density 1.46."
        test_recipe:
          setup:
            - "Project with certified study and a CONSTRAINT_MAPPED ALTERNATE route of 8.0mi (2/1/1/2) and 4.0mi (1/1/1/1)"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - &c04
              call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Battery storage plus demand response portfolio", capex_cents: 46000000000, deliverable_mw: 200 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt2: "$.data.id" }
            - *c05
            - &c06
              call: "POST /siting/alternatives/${alt2}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Credible non-wires portfolio" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &c07
              call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Need case reviewed by independent engineer" }
              as: Developer
              as_user_id: "dev-milo"
            - *c08
            - *c09
            - *c10
            - *c11
            - &c12
              call: "POST /siting/routes/${routeA}/constraint-mapping"
              payload: { mapping_note: "Proposed corridor mapped" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &c13
              call: "POST /siting/routes"
              payload: { project_id: "${proj}", label: "Route B - ridge line", kind: "ALTERNATE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { routeB: "$.data.id" }
            - &c14
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeB}", sequence_index: 1, miles: 8.0, land_use_rating: 2, environmental_rating: 1, cultural_rating: 1, engineering_rating: 2, county: "Boone", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segB1: "$.data.id" }
            - &c15
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeB}", sequence_index: 2, miles: 4.0, land_use_rating: 1, environmental_rating: 1, cultural_rating: 1, engineering_rating: 1, county: "Clay", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segB2: "$.data.id" }
            - &c16
              call: "POST /siting/routes/${routeB}/constraint-mapping"
              payload: { mapping_note: "Alternate fully field verified" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          trigger:
            - &c17
              call: "POST /siting/routes/${routeB}/nomination"
              payload: { nomination_note: "Alternate route for the filing" }
              as: Developer
              as_user_id: "dev-nora"
          assert:
            - "Route.${routeB}.status == NOMINATED"
            - "Route.${routeB}.constraint_score_certified == 17.48"
