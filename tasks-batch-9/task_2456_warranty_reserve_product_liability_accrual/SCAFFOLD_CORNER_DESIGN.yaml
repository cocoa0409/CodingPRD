        grounds:
          - complexity_profile.consistency_model
          - calculations.family_reserve_balance
        distinguishing_aspect: "The post response itself already carries POSTED, and a read issued immediately afterward — with no delay, retry or refresh call — shows the family balance, posture and period rollup at their new values."
