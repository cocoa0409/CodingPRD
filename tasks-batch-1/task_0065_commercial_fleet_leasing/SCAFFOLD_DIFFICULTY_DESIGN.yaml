            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCE20001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "D2", license_number: "LIC-CE2" }
              as: FleetManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /fleet/allocations"
              payload: { lease_id: "${lease_id}", driver_id: "${driver_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z", expected_lease_version: "${lease_v}" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LEASE_NOT_ACTIVE"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: allocation_half_open_overlap_on_vehicle
        grounds:
          - validations[priority=10]
          - entities.Allocation.fields.window_start
          - entities.Allocation.fields.window_end
        distinguishing_aspect: |
          Half-open interval [start,end) on the Vehicle (via Lease): a second ASSIGNED allocation whose
          window [2026-06-05,2026-06-15) overlaps the existing [2026-06-01,2026-06-10) is rejected;
          adjacency at the exact boundary would be allowed. Half-open semantics.
        test_recipe:
          setup:
            - "Lease ACTIVE; an existing ASSIGNED allocation on its vehicle for [2026-06-01,2026-06-10); two VALID drivers."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "TO1 Co", billing_email: "to1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINTO10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "D1", license_number: "LIC-TO1-1" }
              as: FleetManager
              captures: { d1_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "D2", license_number: "LIC-TO1-2" }
              as: FleetManager
              captures: { d2_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
              captures: { lease_v: $.data.version }
            - call: "POST /fleet/allocations"
              payload: { lease_id: "${lease_id}", driver_id: "${d1_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-10T00:00:00Z", expected_lease_version: "${lease_v}" }
              as: FleetManager
              captures: { lease_v2: $.data.version }
          trigger:
            - call: "POST /fleet/allocations"
              payload: { lease_id: "${lease_id}", driver_id: "${d2_id}", window_start: "2026-06-05T00:00:00Z", window_end: "2026-06-15T00:00:00Z", expected_lease_version: "${lease_v2}" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALLOCATION_OVERLAP"

      - name: maintenance_buffer_window_overlap_on_vehicle
        grounds:
          - validations[priority=11]
          - entities.MaintenanceOrder.fields.window_start
          - entities.MaintenanceOrder.fields.window_end
        distinguishing_aspect: |
          Buffer-expanded closed-interval semantics on a different resource (MaintenanceOrder vs
          Allocation): a second SCHEDULED window [12:30,13:00] sits only 30 minutes after an existing
          [10:00,12:00] window — within the 60-minute buffer — so it is rejected, unlike the half-open
          adjacency rule of the allocation instance.
        test_recipe:
          setup:
            - "Vehicle ALLOCATED via active lease; an existing SCHEDULED MaintenanceOrder window [2026-06-01T10:00,12:00]."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "TO2 Co", billing_email: "to2@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINTO20001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/maintenance-orders"
              payload: { vehicle_id: "${veh_id}", kind: "PREVENTIVE", labor_cents: 1000, parts_cents: 1000, window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: FleetManager
              captures: { mo1_id: $.data.id }
          trigger:
            - call: "POST /fleet/maintenance-orders"
              payload: { vehicle_id: "${veh_id}", kind: "CORRECTIVE", labor_cents: 1000, parts_cents: 1000, window_start: "2026-06-01T12:30:00Z", window_end: "2026-06-01T13:00:00Z" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MAINTENANCE_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: repair_assess_then_reject_conserves_open_block_count
        grounds:
          - state_machines.RepairOrder.REPORTED_to_ASSESSED
          - state_machines.RepairOrder.ASSESSED_to_REJECTED
          - entities.Vehicle.fields.open_block_count
        distinguishing_aspect: |
          Conserved quantity #1 = Vehicle.open_block_count. assess (+1) paired with its compensating
          reject (-1) leaves open_block_count == 0, the pre-action value; invariant pinned as
          open_block_count_after == open_block_count_before.
        test_recipe:
          setup:
            - "Vehicle ALLOCATED via active lease, open_block_count=0; a RepairOrder REPORTED then ASSESSED (open_block_count=1)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "CI1 Co", billing_email: "ci1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCI10001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 100000, insurance_cap_cents: 800000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/reject"
              payload: {}
              as: FleetManager
          assert:
            - "Vehicle.${veh_id}.open_block_count == 0"
            - "RepairOrder.${repair_id}.status == REJECTED"
            - "Vehicle.${veh_id}.status == ALLOCATED"

      - name: fuel_post_then_void_conserves_card_gallons
        grounds:
          - state_machines.FuelTransaction.POSTED_to_VOIDED
          - entities.FuelCard.fields.total_gallons_purchased
        distinguishing_aspect: |
          Conserved quantity #2 = FuelCard.total_gallons_purchased (a different conserved quantity than
          open_block_count). posting 120 gallons (+120) paired with its compensating void (-120) leaves
          total_gallons_purchased == 0, pinned as total_gallons_after == total_gallons_before.
        test_recipe:
          setup:
            - "Lease ACTIVE with an ACTIVE fuel card carrying one POSTED 120-gallon transaction (total_gallons_purchased=120)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "CI2 Co", billing_email: "ci2@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCI20001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/fuel-cards"
              payload: { lease_id: "${lease_id}", card_number: "CARD-CI2-1" }
              as: FleetManager
              captures: { card_id: $.data.id }
            - call: "POST /fleet/fuel-transactions"
              payload: { fuel_card_id: "${card_id}", jurisdiction: "CA", gallons: 120, purchased_at: "2026-06-01T00:00:00Z" }
              as: FleetManager
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /fleet/fuel-transactions/${txn_id}/void"
              payload: {}
              as: FleetManager
          assert:
            - "FuelCard.${card_id}.total_gallons_purchased == 0"
            - "FuelTransaction.${txn_id}.status == VOIDED"
