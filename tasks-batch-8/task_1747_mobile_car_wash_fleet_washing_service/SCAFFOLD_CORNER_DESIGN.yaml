            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "C3S", lot_size_sqft: 5000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
