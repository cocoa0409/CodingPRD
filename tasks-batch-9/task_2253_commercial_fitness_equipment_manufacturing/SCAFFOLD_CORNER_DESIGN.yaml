  - name: supersede_chain_depth_cap_rejects_the_sixth_edge
    claim_type: graph
    grounds:
    - entities.EquipmentModel.fields.supersedes_model_id
    - validations[priority=25]
    - errors[ERR_SUPERSEDE_CYCLE]
    - domain_constants.SUPERSEDE_CHAIN_MAX_DEPTH
    distinguishing_aspect: 'The self-referential supersession chain accepts exactly SUPERSEDE_CHAIN_MAX_DEPTH == 5 edges: the model at depth 5 is created (201) and the one that would add a 6th edge is refused
      with 422 ERR_SUPERSEDE_CYCLE.'
    test_recipe:
      setup:
      - 'Five models form a supersession chain: Chain Model A <- B <- C <- D <- E, i.e. four edges.'
      - Chain Model F was then created superseding E, which is the fifth and last permitted edge.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: Chain Model A, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id}
      - call: POST /equipment-models
        payload: {name: Chain Model B, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m1}'}
        as: ProductEngineer
        captures: {m2: $.data.id}
      - call: POST /equipment-models
        payload: {name: Chain Model C, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m2}'}
        as: ProductEngineer
        captures: {m3: $.data.id}
      - call: POST /equipment-models
        payload: {name: Chain Model D, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m3}'}
        as: ProductEngineer
        captures: {m4: $.data.id}
      - call: POST /equipment-models
        payload: {name: Chain Model E, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m4}'}
        as: ProductEngineer
        captures: {m5: $.data.id}
      - call: POST /equipment-models
        payload: {name: Chain Model F, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m5}'}
        as: ProductEngineer
        captures: {m6: $.data.id}
      trigger:
      - call: POST /equipment-models
        payload: {name: Chain Model G, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 300000, shipping_weight_kg: 100.0, allowed_finish_codes: [GRAPHITE], supersedes_model_id: '${m6}'}
        as: ProductEngineer
        captures: {err_depth: $.data.error_id}
      - call: GET /equipment-models
        payload: {supersedes_model_id: '${m6}'}
        as: ProductEngineer
      assert:
      - Chain Model F (the 5th edge) was accepted with 201 and EquipmentModel.${m6}.supersedes_model_id == ${m5}
      - the trigger (a 6th edge) returns 422 with error_id ERR_SUPERSEDE_CYCLE
      - GET /equipment-models?supersedes_model_id=${m6} returns total_count == 0 — no row was persisted
      - GET /equipment-models returns total_count == 6
      - every model in the chain still has lifecycle_status == PRE_RELEASE
