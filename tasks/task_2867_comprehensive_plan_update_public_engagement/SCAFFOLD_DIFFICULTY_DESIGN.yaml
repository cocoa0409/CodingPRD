  # ===========================================================================
  # Rule 4 - transitive cascades of depth >= 3 and >= 2 from DIFFERENT triggers
  #   amendment adoption (depth 5) / state DEFICIENT determination (depth 4) /
  #   activity completion (depth 4)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: amendment_adoption_five_link_consistency_cascade
        grounds:
          - state_machines.Amendment.PROPOSED_to_ADOPTED
          - state_machines.ConsistencyLink.CLEARED_to_STALE
          - state_machines.Hearing.SCHEDULED_to_BLOCKED
          - calculations.compliance_posture
          - validations[priority=61]
        distinguishing_aspect: |
          Trigger is POST /planning/amendments/{id}/adopt and the chain is five links deep,
          each caused by the previous one: policy_delta lands on the target element and stales its
          consistency_status (1) -> every CLEARED ConsistencyLink pointing at that element flips to
          STALE (2) -> each such link's SOURCE element is staled (3) -> the plan's
          open_consistency_link_count rises so compliance_posture becomes CONSISTENCY_HOLD (4) ->
          every SCHEDULED hearing of the plan is BLOCKED (5), which in turn makes the still-open
          hearing unable to record a RECOMMEND outcome.
        test_recipe:
          setup:
            - "A plan certified by the state: four CERTIFIED inventories, an ADOPTED TREND scenario (land_capacity_units 11700), four allocations with zero shortfall, all five elements APPROVED, one completed WORKSHOP giving equity 40.0, a CERTIFIED EIR."
            - "One ConsistencyLink from the TRANSPORTATION element (source) to the LAND_USE element (target) reconciled to CLEARED before submission, so open_consistency_link_count was 0 at state submission."
            - "Two COMMISSION hearings: h1 gavelled OPEN at 2026-09-25T18:00:00.000Z and h2 still SCHEDULED for 2026-10-09."
            - "One PROPOSED amendment moved by clerk-1 against the LAND_USE element with policy_delta 2, pinned to the element version read immediately beforehand."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
