          assert:
            - "HTTP status 409 with data.error_id == ERR_SESSION_NOT_OPEN"
            - "ProgramSession.${sess}.status == CANCELLED and slots_committed == 0"
            - "GET /recreation/enrollments filtered by participant_id ${p1} returns an empty array with total_count 0"

      - name: award_encumber_blocked_by_its_sources_closing_operating_period
        grounds:
          - validations[priority=56]
          - state_machines.OperatingPeriod.OPEN_to_CLOSING
          - state_machines.ScholarshipAward.PROPOSED_to_ENCUMBERED
          - errors[ERR_FUNDING_PERIOD_CLOSED]
        distinguishing_aspect: |
          A different entity pair: ScholarshipAward -> FundingSource -> OperatingPeriod.
