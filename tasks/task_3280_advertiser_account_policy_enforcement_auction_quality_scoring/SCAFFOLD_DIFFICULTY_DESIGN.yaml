            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Resume Corp LLC", registration_number: "RN-8", document_type: "TAX_CERTIFICATE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "K1", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { k1: $.data.id }
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "K2", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { k2: $.data.id }
            - call: "POST /campaigns/${k1}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${k2}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${k2}/pause"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /advertiser-accounts/${acct}/suspend"
              payload: { reason_code: "POLICY_VIOLATION" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts/${acct}/appeals"
              payload: { argument_text: "we fixed the landing page" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /appeals/${ap}/decide"
              payload: { outcome: "OVERTURNED", reviewer_note: "verified fix" }
              as: PlatformAdmin
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { ast: $.data.status }
            - call: "GET /campaigns/${k1}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { k1_st: $.data.status, k1_po: $.data.pause_origin }
            - call: "GET /campaigns/${k2}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { k2_st: $.data.status, k2_po: $.data.pause_origin }
          assert:
            - "ast == ACTIVE (link 2 fired from the appeal outcome)"
            - "k1_st == ACTIVE and k1_po == NONE (link 3: suspension-paused campaign auto-resumed)"
            - "k2_st == PAUSED and k2_po == ADVERTISER (advertiser-paused campaign is NOT touched by the cascade)"

