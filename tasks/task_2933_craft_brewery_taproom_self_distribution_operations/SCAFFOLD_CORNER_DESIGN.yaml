      - name: franchise_guards_reject_a_double_scope_a_bare_withdraw_and_an_early_finalize
        claim_type: Triggerable
        grounds:
          - errors.ERR_DUPLICATE_APPOINTMENT_SCOPE
          - errors.ERR_APPOINTMENT_TRANSITION_INVALID
          - errors.ERR_TERMINATION_NOTICE_NOT_ELAPSED
        distinguishing_aspect: "The franchise chain refuses three different things: a second ALL_BRANDS appointment reaching ACTIVE over an already-covered territory, a WITHDRAW from ACTIVE (legal only from TERMINATION_REQUESTED), and a FINALIZE before the 90-day statutory notice has run. Once the incumbent is TERMINATED the blocked scope frees up and the waiting proposal can be approved."
        test_recipe:
          setup:
            - "Brewery ACTIVE; WA license (WHOLESALER_ONLY, franchise_state true, termination_notice_days 90)."
            - "Appointment A-1 (ALL_BRANDS) proposed by u_admin_1 and approved by u_compliance_1, so it is ACTIVE and active_appointment_count is 1."
            - "The license version is re-read after the approval so the second proposal carries a fresh expected_state_license_version."
            - "Clock starts at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BreweryAdmin
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "WA", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z", termination_notice_days: 90 }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Evergreen Beverage Co", expected_state_license_version: "${lic_v}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { appt1_id: $.data.id }
            - call: "POST /distributor-appointments/${appt1_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /state-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { lic_v2: $.data.version }
          trigger:
            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Rainier Wholesale", expected_state_license_version: "${lic_v2}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { appt2_id: $.data.id }
            - call: "POST /distributor-appointments/${appt2_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
              captures: { err_scope: $.data.error_id }
            - call: "POST /distributor-appointments/${appt1_id}/termination"
              payload: { phase: "WITHDRAW" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
              captures: { err_phase: $.data.error_id }
            - call: "POST /distributor-appointments/${appt1_id}/termination"
              payload: { phase: "REQUEST", good_cause_code: "FAILURE_TO_PAY" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /distributor-appointments/${appt1_id}/termination"
              payload: { phase: "FINALIZE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
              captures: { err_notice: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: BreweryAdmin
            - call: "POST /distributor-appointments/${appt1_id}/termination"
              payload: { phase: "FINALIZE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /distributor-appointments/${appt2_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "Second proposal: HTTP 201, state PROPOSED (proposing is never blocked - only reaching ACTIVE is)"
            - "Approving A-2 while A-1 is ACTIVE: HTTP 409 with error_id == ERR_DUPLICATE_APPOINTMENT_SCOPE; A-2 stays PROPOSED"
            - "WITHDRAW from ACTIVE: HTTP 409 with error_id == ERR_APPOINTMENT_TRANSITION_INVALID"
            - "REQUEST with good cause: HTTP 200, A-1 TERMINATION_REQUESTED, termination_effective_utc == 2026-10-30T00:00:00Z"
            - "FINALIZE at 2026-08-01: HTTP 409 with error_id == ERR_TERMINATION_NOTICE_NOT_ELAPSED"
            - "FINALIZE at exactly 2026-10-30T00:00:00Z: HTTP 200, A-1 TERMINATED with terminated_at_utc set (the comparison is inclusive)"
            - "Re-approving A-2 afterwards: HTTP 200, A-2 ACTIVE"
            - "StateLicense.${lic_id}.active_appointment_count == 1 and Brewery.franchise_locked_state_codes == ['WA']"

      - name: appointment_against_a_lapsed_license_returns_license_expired
        claim_type: Triggerable
        grounds:
          - errors.ERR_LICENSE_EXPIRED
          - validations.priority_41
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
        distinguishing_aspect: "POST /distributor-appointments is checked by priority 41 but NOT by the priority-33 status gate, so a lapsed license yields the window-specific ERR_LICENSE_EXPIRED rather than ERR_LICENSE_NOT_ACTIVE. The version is re-read after the clock moves so the OCC check cannot mask the expiry."
        test_recipe:
          setup:
            - "Brewery ACTIVE; WA license with expires_at_utc 2026-08-10T00:00:00Z and no appointment."
            - "Clock advanced to exactly 2026-08-10T00:00:00Z - the exclusive end, so the license has lapsed."
            - "The license is then re-read, which performs the lazy expiry and yields the current version."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "WA", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2026-08-10T00:00:00Z", termination_notice_days: 90 }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: BreweryAdmin
            - call: "GET /state-licenses/${lic_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { lic_v: $.data.version }
          trigger:
            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Evergreen Beverage Co", expected_state_license_version: "${lic_v}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LICENSE_EXPIRED (not ERR_STALE_LICENSE_VERSION and not ERR_LICENSE_NOT_ACTIVE)"
            - "StateLicense.${lic_id}.status == EXPIRED and active_appointment_count == 0"
            - "GET /distributor-appointments?state_license_id=${lic_id} returns total_count == 0"

      - name: sale_of_an_unapproved_formula_is_refused_and_a_decision_without_a_filing_is_invalid
        claim_type: Triggerable
        grounds:
          - errors.ERR_FORMULA_NOT_APPROVED
          - errors.ERR_FILING_TRANSITION_INVALID
          - state_machines.Beer.registration_state
        distinguishing_aspect: "A beer with requires_formula true may be brewed and packaged but not sold: the TAP movement is refused while registration_state is DRAFT and still refused at FORMULA_PENDING, and only the APPROVED decision unlocks it. A decision on a filing that was never made is a transition error, not a 404."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer 'Barrel Reserve' created with requires_formula true, so registration_state is DRAFT and label_state NO_LABEL."
            - "Batch B-2001 conditioned at 16.000 bbl with a COMPLETED TAPROOM HALF_BBL_KEG run; KEG-0001 cleaned and FILLED."
