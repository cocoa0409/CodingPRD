# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# The logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc);
# every literal below was computed by executing the pinned §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_indicative_vs_underwritten_diverge
        grounds:
          - calculations.governance_risk_assessment
          - entities.Submission.fields.risk_score
          - entities.Submission.fields.risk_band
          - entities.Submission.fields.disclosure_packages_considered
          - entities.Submission.fields.litigation_units
          - state_machines.Submission.DRAFT_to_SCORED
          - state_machines.Submission.SCORED_to_SCORED
        distinguishing_aspect: |
          The two variants of governance_risk_assessment read DIFFERENT INPUT SETS over the same
          stored rows: INDICATIVE reads exactly the latest DisclosurePackage and only securities and
          regulatory litigation under a binary recency factor, while UNDERWRITTEN takes the
          independent maxima of the financial and governance subscores over the three most recent
          packages and every case type under a graded recency factor plus the open-litigation
          surcharge, so the same insured scores 85.80 / ELEVATED against 142.35 / SEVERE.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One Insured, Vantiq Bio Inc, sector BIOTECH (multiplier 1.30), LISTED, entity capacity cap 25,000,000."
            - "Three DisclosurePackages: FY2025 (financial_subscore 24, governance_subscore 22), FY2024 (48 / 26), FY2023 (0 / 6) — the financial maximum and the governance maximum come from DIFFERENT packages."
            - "Three LitigationEvents: SECURITIES_CLASS_ACTION filed 777 days before the clock, MERGER_OBJECTION filed 1,979 days before the clock, EMPLOYMENT_PRACTICES filed 203 days before the clock and still unresolved."
            - "One Submission in DRAFT for a 10,000,000 limit over 2026-09-01 to 2027-09-01."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
              captures: { pkg25_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2024, filed_date: "2025-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 0, going_concern_flag: true, negative_operating_cash_flow_flag: true, debt_to_equity: 2.4, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: false, auditor_change_flag: true }
              as: Underwriter
              captures: { pkg24_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2023, filed_date: "2024-03-01T00:00:00Z", restatement_flag: false, material_weakness_count: 0, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 0.9, independent_director_ratio: 0.60, dual_class_shares_flag: false, staggered_board_flag: true, combined_ceo_chair_flag: false, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "MERGER_OBJECTION", filed_date: "2021-03-01T00:00:00Z", resolved_date: "2021-09-01T00:00:00Z", indemnity_paid_usd: 0, outcome: "DISMISSED" }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "EMPLOYMENT_PRACTICES", filed_date: "2026-01-10T00:00:00Z", indemnity_paid_usd: 0, outcome: "PENDING" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "UNDERWRITTEN" }
              as: Underwriter
          assert:
            - "trigger call 1 returns 200 with data.risk_score == 85.80, data.risk_band == ELEVATED, data.disclosure_packages_considered == 1, data.litigation_units == 20.0, data.score_variant == INDICATIVE, data.status == SCORED"
            - "trigger call 2 returns 200 with data.risk_score == 142.35, data.risk_band == SEVERE, data.disclosure_packages_considered == 3, data.litigation_units == 35.5, data.score_variant == UNDERWRITTEN, data.status == SCORED"
            - "142.35 - 85.80 == 56.55, so the UNDERWRITTEN variant is strictly the more severe of the two on identical stored rows"
            - "the UNDERWRITTEN litigation_units 35.5 decomposes as 20 (SECURITIES_CLASS_ACTION at 777 days, factor 1.0) + 2.5 (MERGER_OBJECTION at 1,979 days, factor 0.5) + 3 (EMPLOYMENT_PRACTICES at 203 days, factor 1.0) + 10 (OPEN_LITIGATION_SURCHARGE, because EMPLOYMENT_PRACTICES has resolved_date null)"
            - "GET /dno/insureds/${insured_id}/disclosure-packages returns pkg25 with financial_subscore == 24.0 and governance_subscore == 22.0, pkg24 with 48.0 and 26.0, pkg23 with 0.0 and 6.0 — the UNDERWRITTEN composite 48 + 26 takes its two maxima from two different packages"
            - "GET /dno/submissions/${sub_id} returns data.version == 3 (created at 1, one increment per score call)"
      - name: defense_allocation_relative_exposure_vs_larger_settlement
        grounds:
          - calculations.defense_cost_allocation
          - calculations.defense_advancement_waterfall
          - entities.DefenseInvoice.fields.covered_allocated_usd
          - entities.DefenseInvoice.fields.advanced_usd
          - entities.Claim.fields.allocation_method
          - state_machines.DefenseInvoice.SUBMITTED_to_ADVANCED
        distinguishing_aspect: |
          The two variants of defense_cost_allocation apply STRUCTURALLY DIFFERENT SHARES to the same
          mixed-matter bucket on byte-identical invoices: RELATIVE_EXPOSURE pro-rates the mixed
          200,000 by the defendant headcount ratio 3/4 and yields covered_allocated_usd 300,000.00,
          while LARGER_SETTLEMENT takes the whole mixed amount and yields 350,000.00, so after the
          same 250,000 retention the advanced amounts differ by exactly 50,000.00.
        test_recipe:
          setup:
            - "One bound Policy of Vantiq Bio Inc: shared aggregate limit 10,000,000, retention 250,000, Side C sublimit 5,000,000, period 2026-09-01 to 2027-09-01, coverage_status INCEPTED, premium_status INVOICED, gross premium 236,468.57."
            - "Logical clock advanced to 2026-09-02T00:00:00Z so notices fall inside the claims-made period."
            - "Two Claims on that policy, both SECURITIES_CLASS_ACTION with retention_remaining_usd 250,000; claim A frozen to RELATIVE_EXPOSURE and claim B frozen to LARGER_SETTLEMENT at their coverage decisions."
            - "One SUBMITTED DefenseInvoice on each claim with identical amounts: billed 400,000 = covered 150,000 + mixed 200,000 + uncovered 50,000, 3 insured-person defendants and 1 entity defendant."
            - "Claim A's invoice has already been allocated; claim B's invoice is still SUBMITTED."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Meridian Pension Fund", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-10T00:00:00Z", alleged_damages_usd: 9000000 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { claim_a_id: "$.data.id" }
            - call: "POST /dno/claims/${claim_a_id}/coverage-decision"
              payload: { decision: "ACCEPT_WITH_ROR", allocation_method: "RELATIVE_EXPOSURE" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_a_v: "$.data.version" }
            - call: "POST /dno/claims/${claim_a_id}/defense-invoices"
              payload: { law_firm_name: "Harlow & Reeve LLP", invoice_reference: "HR-2026-0001", billed_amount_usd: 400000, covered_matter_amount_usd: 150000, uncovered_matter_amount_usd: 50000, mixed_matter_amount_usd: 200000, insured_person_defendant_count: 3, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { inv_a_id: "$.data.id" }
            - call: "POST /dno/defense-invoices/${inv_a_id}/allocate"
              payload: { expected_claim_version: "${claim_a_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Calder Retirement Trust", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-20T00:00:00Z", alleged_damages_usd: 7500000 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { claim_b_id: "$.data.id" }
            - call: "POST /dno/claims/${claim_b_id}/coverage-decision"
              payload: { decision: "ACCEPT_WITH_ROR", allocation_method: "LARGER_SETTLEMENT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_b_v: "$.data.version" }
            - call: "POST /dno/claims/${claim_b_id}/defense-invoices"
              payload: { law_firm_name: "Harlow & Reeve LLP", invoice_reference: "HR-2026-0002", billed_amount_usd: 400000, covered_matter_amount_usd: 150000, uncovered_matter_amount_usd: 50000, mixed_matter_amount_usd: 200000, insured_person_defendant_count: 3, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { inv_b_id: "$.data.id" }
          trigger:
            - call: "POST /dno/defense-invoices/${inv_b_id}/allocate"
              payload: { expected_claim_version: "${claim_b_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-002"
          assert:
            - "GET /dno/claims/${claim_a_id}/defense-invoices returns the RELATIVE_EXPOSURE invoice with covered_allocated_usd == 300000.00, retention_applied_usd == 250000.00, advanced_usd == 50000.00, unfunded_excess_usd == 0.00, allocation_method_applied == RELATIVE_EXPOSURE, status == ADVANCED"
            - "the trigger returns 200 with data.covered_allocated_usd == 350000.00, data.retention_applied_usd == 250000.00, data.advanced_usd == 100000.00, data.unfunded_excess_usd == 0.00, data.allocation_method_applied == LARGER_SETTLEMENT, data.status == ADVANCED"
            - "350000.00 - 300000.00 == 50000.00 == the mixed bucket 200000 times (1 - 3/4), the only structural difference between the two variants"
            - "uncovered_matter_amount_usd 50,000 is advanced under neither variant: 300000.00 < 400000 and 350000.00 < 400000"
            - "GET /dno/claims/${claim_a_id} returns retention_remaining_usd == 0.00, retention_applied_usd == 250000.00, advanced_defense_usd == 50000.00, status == DEFENSE_ADVANCING"
            - "GET /dno/claims/${claim_b_id} returns retention_remaining_usd == 0.00, retention_applied_usd == 250000.00, advanced_defense_usd == 100000.00, status == DEFENSE_ADVANCING"
            - "GET /dno/policies/${policy_id}/coverage-parts returns SIDE_B with eroded_usd == 150000.00 and remaining_limit_usd == 9850000.00, SIDE_A with eroded_usd == 0.00, SIDE_C with eroded_usd == 0.00"
            - "GET /dno/policies/${policy_id} returns total_eroded_usd == 150000.00 and aggregate_remaining_usd == 9850000.00"
  - rule_id: combinatorial_formula
    instances:
      - name: premium_tiered_ilf_bands_and_capped_retention_credit
        grounds:
          - calculations.net_premium_quotation
          - entities.Quote.fields.net_premium_usd
          - entities.Quote.fields.risk_band_at_quote
          - entities.Insured.fields.exchange_listing
          - state_machines.Submission.SCORED_to_QUOTED
        distinguishing_aspect: |
          Mode (a) — multi-branch conditional selection: the same formula selects structurally
          different sub-formulas per input combination. The 20,000,000 limit is decomposed across
          three increased-limit bands (5 at 1.00 + 5 at 0.65 + 10 at 0.45 = 12.75 exposure units,
          never 20.00), while the 4,000,000 retention drives the step credit floor(4,000,000 /
          250,000) x 0.05 = 0.80 into its 0.35 cap; each branch is chosen by the request, not by a
          single arithmetic chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One LISTED BIOTECH Insured with one fresh FY2025 DisclosurePackage and one SECURITIES_CLASS_ACTION LitigationEvent filed 2024-06-15, so every INDICATIVE score lands on 85.80 / ELEVATED and BAND_RATE 22,000 applies."
            - "Two Submissions in SCORED on that insured: submission 1 for a 20,000,000 limit with a 500,000 retention and a 20,000,000 Side C sublimit; submission 2 for a 10,000,000 limit with a 4,000,000 retention and a 5,000,000 Side C sublimit."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 40000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 20000000, requested_retention_usd: 500000, requested_side_c_sublimit_usd: 20000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub1_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub1_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub1_v: "$.data.version" }
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 4000000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 10000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub2_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub2_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub2_v: "$.data.version" }
          trigger:
            - call: "POST /dno/submissions/${sub1_id}/quotes"
              payload: { expected_submission_version: "${sub1_v}", offered_limit_usd: 20000000, offered_retention_usd: 500000, offered_side_c_sublimit_usd: 20000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
            - call: "POST /dno/submissions/${sub2_id}/quotes"
              payload: { expected_submission_version: "${sub2_v}", offered_limit_usd: 10000000, offered_retention_usd: 4000000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
          assert:
            - "trigger call 1 returns 201 with data.risk_band_at_quote == ELEVATED, data.net_premium_usd == 302940.00, data.gross_premium_usd == 346217.14, data.broker_commission_usd == 43277.14, data.premium_tax_usd == 12117.60, data.total_payable_usd == 358334.74"
            - "trigger call 1's 302940.00 proves the ILF banding: 22000 * 12.75 * 1.20 * 0.90 == 302940.00, whereas a flat 20.00 exposure units would give 475200.00"
            - "trigger call 2 returns 201 with data.net_premium_usd == 141570.00, data.gross_premium_usd == 161794.29, data.broker_commission_usd == 20224.29, data.premium_tax_usd == 5662.80, data.total_payable_usd == 167457.09"
            - "trigger call 2's 141570.00 proves the retention credit is capped at 0.35: 22000 * 8.25 * 1.20 * 0.65 == 141570.00, whereas the uncapped 0.80 credit would give 43560.00"
            - "both quotes carry the LISTED Side C load 0.20 because offered_side_c_sublimit_usd > 0; neither is floored (both exceed NET_PREMIUM_FLOOR_USD 25000) nor ceilinged"
            - "GET /dno/submissions/${sub1_id} returns status == QUOTED and GET /dno/submissions/${sub2_id} returns status == QUOTED"
      - name: settlement_split_round_per_part_then_residual
        grounds:
          - calculations.settlement_indemnity_split
          - calculations.hammer_clause_insurer_share
          - entities.CoveragePart.fields.eroded_usd
          - entities.Claim.fields.insurer_share_usd
          - state_machines.Claim.SETTLEMENT_PENDING_to_SETTLED
        distinguishing_aspect: |
          Mode (b) — order-of-operations sensitivity: the pinned order rounds EACH part's share to two
          decimals first and only then assigns the residual, so the three parts read 560,003.17 /
          560,003.16 / 280,001.58 and sum to exactly 1,400,007.91; summing the unrounded shares and
          rounding once at the end yields 560,003.16 / 560,003.16 / 280,001.58 = 1,400,007.90 and
          loses a cent of the insurer's funded indemnity.
        test_recipe:
          setup:
            - "One bound Policy of Vantiq Bio Inc with shared aggregate limit 10,000,000, retention 4,000,000, Side C sublimit 5,000,000, gross premium 161,794.29, coverage_status INCEPTED, premium_status INVOICED, no Layers."
            - "CoverageParts SIDE_A 10,000,000 / SIDE_B 10,000,000 / SIDE_C 5,000,000, all ACTIVE and un-eroded, so the split basis is 25,000,000."
            - "Logical clock at 2026-09-02T00:00:00Z."
            - "One SECURITIES_CLASS_ACTION Claim in SETTLEMENT_PENDING with retention_remaining_usd 4,000,000 and no defense advancement."
            - "Its newest SettlementProposal recommends 6,000,011.30 and the insured has REFUSED consent, so the hammer cap is stored on the proposal."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
