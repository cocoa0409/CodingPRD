scenario: |
  Healthcare Claims Clearinghouse Routing & Payer Enrollment (Availity): provider
  onboarding with tax identification, national provider identifier and submitter
  credential setup, payer enrollment for electronic claims, remittance and
  eligibility with per-payer approval lead times, claim intake validation against
  format and payer-specific edits before forwarding, rejection versus denial
  distinction with clear return of unaccepted claims to the provider, remittance
  advice retrieval and posting file generation, eligibility and benefit inquiry
  routing with real-time response handling, connectivity monitoring per payer
  with outage notification and queueing, transaction volume pricing and
  payer-funded versus provider-funded models

domain_name: healthcare-claims-clearinghouse
api_prefix: /clearinghouse

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - idempotency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal business name on file with IRS" }
      - { name: tax_identification_number, type: string, source: input, description: "TIN — exactly 9 digits, no hyphens" , constraints: "^[0-9]{9}$; unique across all providers" }
      - { name: national_provider_identifier, type: string, source: input, description: "NPI — exactly 10 digits, Luhn-valid", constraints: "^[0-9]{10}$; unique across all providers; Luhn check digit" }
      - { name: billing_model, type: enum, source: input, description: "PROVIDER_FUNDED | PAYER_FUNDED | HYBRID — controls who pays transaction fees" }
      - { name: volume_tier_code, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 — derived from trailing-3-calendar-month billable_claims+eligibility+remittance total" }
      - { name: status, type: enum, source: system, description: "ONBOARDING → ACTIVE ⇄ SUSPENDED → TERMINATED" }
      - { name: activated_at, type: datetime, source: system, description: "When the provider first became ACTIVE" }
      - { name: trailing_billable_units_3m, type: integer, source: computed, description: "Rolling sum of billable_units across the trailing 3 calendar months; recomputed at period roll" }
      - { name: account_balance_cents, type: integer, source: computed, description: "Sum of unpaid usage-invoice amounts minus payments; negative values are credits" }

  - name: SubmitterCredential
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: submitter_id, type: string, source: input, description: "External clearinghouse submitter identifier (e.g. AVAILITY customer id)", constraints: "unique per provider among non-REVOKED credentials" }
      - { name: trading_partner_agreement_ref, type: string, source: input, description: "Reference to the signed trading-partner agreement document" }
      - { name: effective_at, type: datetime, source: input, description: "Earliest moment the credential may be used" }
      - { name: expires_at, type: datetime, source: input, description: "Credential no longer valid after this instant; must be > effective_at" }
      - { name: status, type: enum, source: system, description: "DRAFT → PENDING_ACTIVATION → ACTIVE → REVOKED" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: payer_id_code, type: string, source: input, description: "5-character payer identifier used in X12 envelopes", constraints: "^[A-Z0-9]{5}$; unique" }
      - { name: display_name, type: string, source: input, description: "Human-readable payer name" }
      - { name: claims_lead_time_days, type: integer, source: input, description: "Business days payer commits to acknowledge a forwarded claim" }
      - { name: remittance_lead_time_days, type: integer, source: input, description: "Business days payer commits to deliver an 835 after adjudication" }
      - { name: eligibility_lead_time_seconds, type: integer, source: input, description: "Real-time SLA for 270/271 responses" }
      - { name: pricing_model, type: enum, source: input, description: "PAYER_FUNDED | PROVIDER_FUNDED | SHARED" }
      - { name: shared_provider_pct, type: number, source: input, description: "When pricing_model=SHARED, fraction in [0,1] of fees borne by provider; ignored otherwise" }
      - { name: connectivity_status, type: enum, source: computed, description: "ONLINE | DEGRADED | OFFLINE — derived from the payer's open ConnectivityOutage rows" }
      - { name: monthly_minimum_cents, type: integer, source: input, description: "Provider-funded floors applied to monthly usage fee" , default: 0 }

  - name: PayerPricingTier
    parent: Payer
    common_fields: false
    fields:
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id" }
      - { name: applies_to, type: enum, source: input, description: "CLAIM | ELIGIBILITY | REMITTANCE" }
      - { name: volume_floor, type: integer, source: input, description: "First unit (inclusive) of this tier within the month" }
      - { name: volume_ceiling, type: integer, source: input, description: "Last unit (inclusive) of this tier; null = unbounded" }
      - { name: rate_cents, type: integer, source: input, description: "Per-transaction fee in cents for units in this tier" }

  - name: PayerEditRule
    parent: Payer
    common_fields: false
    fields:
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id" }
      - { name: rule_code, type: string, source: input, description: "Stable identifier, e.g. 'DX_REQUIRED', 'NPI_MATCH'", constraints: "unique per payer among rules with effective_to == null" }
      - { name: applies_to, type: enum, source: input, description: "CLAIM_INTAKE — only claim intake rules are modeled" }
      - { name: severity, type: enum, source: input, description: "ERROR | WARNING" }
      - { name: expression, type: string, source: input, description: "Declarative predicate over claim fields (e.g. 'diagnosis_codes.nonempty', 'subscriber_npi == rendering_npi')" }
      - { name: effective_from, type: datetime, source: input, description: "Rule starts applying at this instant (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Rule stops applying at this instant (exclusive); null = open-ended" }

  - name: PayerEnrollment
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: transaction_type, type: enum, source: input, description: "CLAIMS_837 | REMITTANCE_835 | ELIGIBILITY_270 — one enrollment per transaction type" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → PAYER_REVIEW → APPROVED | REJECTED | CANCELLED ; REJECTED → RE_SUBMITTED → PAYER_REVIEW (cyclic)" }
      - { name: submitted_at, type: datetime, source: system, description: "Last transition into SUBMITTED or RE_SUBMITTED" }
      - { name: payer_decision_due_at, type: datetime, source: computed, description: "submitted_at + payer.lead_time_for(transaction_type), in business days" }
      - { name: approved_at, type: datetime, source: system, description: "When status first became APPROVED" }
      - { name: rejection_reason, type: string, source: input, description: "Free-text reason supplied when payer rejects" }
      - { name: decision_round, type: integer, source: computed, description: "Counts SUBMITTED/RE_SUBMITTED cycles; starts at 1 on first submit" }

  - name: Claim
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: submitter_credential_id, type: string, source: input, description: "FK -> SubmitterCredential.id; must belong to the same provider" }
      - { name: patient_control_number, type: string, source: input, description: "Provider-assigned claim identifier", constraints: "unique per (provider_id, payer_id) among non-REJECTED_CLEARINGHOUSE claims — i.e. a rejected claim frees the PCN for resubmission" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied idempotency key", constraints: "unique per provider among claims" }
      - { name: service_date, type: datetime, source: input, description: "Date of service" }
      - { name: total_charge_cents, type: integer, source: input, description: "Sum of line charges supplied by the submitter; cross-checked against lines" }
      - { name: diagnosis_codes, type: array, source: input, description: "ICD-10 codes" }
      - { name: rendering_npi, type: string, source: input, description: "NPI of the rendering provider" }
      - { name: subscriber_id, type: string, source: input, description: "Member id on the payer's roster" }
      - { name: lines, type: array, source: input, description: "Array of { cpt_code, units, unit_charge_cents }" }
      - { name: acceptance_status, type: enum, source: system, description: "RECEIVED → VALIDATING → ACCEPTED | REJECTED_CLEARINGHOUSE ; ACCEPTED → FORWARDED → ACKNOWLEDGED_BY_PAYER | REJECTED_BY_PAYER" }
      - { name: adjudication_status, type: enum, source: system, description: "NONE → PENDING → PAID | DENIED | PARTIAL — parallel dimension on the same row" }
      - { name: edit_failures, type: array, source: computed, description: "List of { rule_code, severity, message } captured during VALIDATING" }
      - { name: forwarded_at, type: datetime, source: system, description: "When the claim entered FORWARDED" }
      - { name: payer_response_due_at, type: datetime, source: computed, description: "forwarded_at + payer.claims_lead_time_days business days" }
      - { name: rejection_payload, type: object, source: system, description: "When REJECTED_*: structured return package { origin: CLEARINGHOUSE | PAYER, rule_codes, message }" }

  - name: RemittanceAdvice
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: payer_id, type: string, source: computed, description: "FK -> Payer.id; copied from claim.payer_id at ingest" }
      - { name: check_number, type: string, source: input, description: "Payer's payment reference" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Total paid across lines" }
      - { name: adjustment_amount_cents, type: integer, source: input, description: "Contractual adjustments (CARC group CO/PR/OA with positive adjustment)" }
      - { name: patient_responsibility_cents, type: integer, source: input, description: "PR-group adjustment total" }
      - { name: denial_reason_codes, type: array, source: input, description: "CARC/RARC codes; non-empty iff posting resolves the claim to DENIED" }
      - { name: status, type: enum, source: system, description: "RECEIVED → POSTED | FAILED_POSTING ; FAILED_POSTING → POSTED ; POSTED → VOIDED" }

  - name: PostingFile
    parent: RemittanceAdvice
    common_fields: false
    fields:
      - { name: remittance_advice_id, type: string, source: system, description: "FK -> RemittanceAdvice.id" }
      - { name: generated_at, type: datetime, source: system, description: "When the file was rendered" }
      - { name: line_count, type: integer, source: computed, description: "Number of service-line rows in the file" }
      - { name: total_posted_cents, type: integer, source: computed, description: "Sum of paid amounts in the file" }
      - { name: status, type: enum, source: system, description: "GENERATING → READY → DELIVERED | FAILED" }

  - name: EligibilityInquiry
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: subscriber_id, type: string, source: input, description: "Member id being queried" }
      - { name: service_type_code, type: string, source: input, description: "X12 service type, e.g. '30' for general benefits" }
      - { name: idempotency_key, type: string, source: input, description: "Unique per provider" }
      - { name: status, type: enum, source: system, description: "PENDING → RESPONDED | TIMED_OUT ; PENDING → QUEUED_OUTAGE → PENDING (on connectivity recovery, cyclic)" }
      - { name: requested_at, type: datetime, source: system, description: "When the inquiry was accepted" }
      - { name: deadline_at, type: datetime, source: computed, description: "requested_at + payer.eligibility_lead_time_seconds (wall-clock seconds)" }
      - { name: responded_at, type: datetime, source: system, description: "When a 271 was matched to this inquiry" }
      - { name: benefit_summary, type: object, source: system, description: "Parsed 271 response payload" }

  - name: ConnectivityOutage
    parent: Payer
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id" }
      - { name: started_at, type: datetime, source: system, description: "Outage start (logical clock at open)" }
      - { name: ended_at, type: datetime, source: system, description: "Set when status transitions to RESOLVED" }
      - { name: severity, type: enum, source: input, description: "PARTIAL | FULL" }
      - { name: affects_transaction_types, type: array, source: input, description: "Subset of { CLAIMS_837, REMITTANCE_835, ELIGIBILITY_270 }" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RESOLVED" }
      - { name: notified_provider_ids, type: array, source: computed, description: "Providers holding APPROVED enrollments on the affected (payer, transaction_type) at outage start" }

  - name: UsageInvoice
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: period_yyyy_mm, type: string, source: input, description: "Billing period in 'YYYY-MM' format", constraints: "unique per provider; cannot be a future period" }
      - { name: claim_units, type: integer, source: computed, description: "Count of claims FORWARDED during the period" }
      - { name: eligibility_units, type: integer, source: computed, description: "Count of inquiries RESPONDED during the period" }
      - { name: remittance_units, type: integer, source: computed, description: "Count of remittances POSTED during the period" }
      - { name: billable_units, type: integer, source: computed, description: "claim_units + eligibility_units + remittance_units weighted by the payer's pricing_model per transaction" }
      - { name: gross_fee_cents, type: integer, source: computed, description: "Tiered fee before the monthly minimum" }
      - { name: monthly_minimum_applied_cents, type: integer, source: computed, description: "max(0, monthly_minimum - gross_fee) summed across provider-funded payers" }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_fee_cents + monthly_minimum_applied_cents" }
      - { name: status, type: enum, source: system, description: "OPEN → FINALIZED → PAID | VOID" }

  - name: OutageNotification
    parent: ConnectivityOutage
    common_fields: false
    fields:
      - { name: outage_id, type: string, source: system, description: "FK -> ConnectivityOutage.id" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock at dispatch" }
      - { name: channel, type: enum, source: system, description: "WEBHOOK | EMAIL" }
      - { name: payload_summary, type: string, source: computed, description: "First 120 chars of the notification body" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Provider
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /clearinghouse/providers/{id}/activate"
        actor: ClearinghouseOps
        preconditions:
          - "Provider has at least one SubmitterCredential in ACTIVE state"
          - "tax_identification_number and national_provider_identifier pass format checks"
        side_effects:
          - "sets activated_at = now"
          - "increments Provider.version"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clearinghouse/providers/{id}/suspend OR system on account_balance_cents > SUSPENSION_THRESHOLD for 2 consecutive finalized periods"
        actor: ClearinghouseOps | system
        preconditions: []
        side_effects:
          - "all SUBMITTED / PAYER_REVIEW enrollments for this provider transition to CANCELLED with rejection_reason='PROVIDER_SUSPENDED'"
          - "PENDING EligibilityInquiry rows for this provider transition to TIMED_OUT"
          - "increments Provider.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clearinghouse/providers/{id}/reinstate"
        actor: ClearinghouseOps
        preconditions:
          - "account_balance_cents <= REINSTATE_THRESHOLD"
        side_effects:
          - "increments Provider.version"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /clearinghouse/providers/{id}/terminate"
        actor: ClearinghouseOps
        preconditions:
          - "no OPEN or FINALIZED UsageInvoice rows remain (all PAID or VOID)"
          - "no Claim in acceptance_status ∈ {RECEIVED, VALIDATING, ACCEPTED, FORWARDED} for this provider"
        side_effects:
          - "all non-REVOKED SubmitterCredential rows for this provider transition to REVOKED"
          - "all APPROVED PayerEnrollment rows transition to CANCELLED"
          - "increments Provider.version"

  - entity: SubmitterCredential
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: PENDING_ACTIVATION
        trigger: "POST /clearinghouse/providers/{pid}/credentials/{id}/submit"
        actor: ProviderAdmin
        preconditions:
          - "trading_partner_agreement_ref is non-empty"
          - "effective_at < expires_at"
        side_effects:
          - "increments SubmitterCredential.version"
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "system at logical clock reaching effective_at"
        actor: system
        preconditions: []
        side_effects:
          - "increments SubmitterCredential.version"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /clearinghouse/providers/{pid}/credentials/{id}/revoke OR cascade from Provider terminate"
        actor: ProviderAdmin | ClearinghouseOps | system
        preconditions:
          - "no Claim in acceptance_status ∈ {RECEIVED, VALIDATING, ACCEPTED, FORWARDED} references this credential"
        side_effects:
          - "PayerEnrollment rows under the same provider that were created against this credential remain (enrollment is per provider, not per credential)"
          - "increments SubmitterCredential.version"

  - entity: PayerEnrollment
    initial_state: DRAFT
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clearinghouse/providers/{pid}/enrollments/{id}/submit"
        actor: ProviderAdmin
        preconditions:
          - "provider.status == ACTIVE"
          - "no other PayerEnrollment exists for the same (provider_id, payer_id, transaction_type) in status ∈ {DRAFT, SUBMITTED, PAYER_REVIEW, RE_SUBMITTED, APPROVED}"
        side_effects:
          - "sets submitted_at = now; decision_round = 1"
          - "computes payer_decision_due_at = business_day_add(now, payer.lead_time_for(transaction_type))"
          - "increments PayerEnrollment.version"
      - from: SUBMITTED
        to: PAYER_REVIEW
        trigger: "system after intake handoff to payer succeeds"
        actor: system
        preconditions:
          - "payer.connectivity_status != OFFLINE for the enrollment's transaction_type"
        side_effects: []
      - from: PAYER_REVIEW
        to: APPROVED
        trigger: "POST /clearinghouse/enrollments/{id}/payer-decision  with decision=APPROVE"
        actor: PayerOperator
        preconditions:
          - "X-Payer-Code header matches enrollment.payer_id"
          - "provider.status == ACTIVE (if provider has been SUSPENDED since submission the enrollment is already CANCELLED — the precondition fails with ERR_INVALID_STATE)"
        side_effects:
          - "sets approved_at = now"
          - "increments PayerEnrollment.version"
      - from: PAYER_REVIEW
        to: REJECTED
        trigger: "POST /clearinghouse/enrollments/{id}/payer-decision with decision=REJECT"
        actor: PayerOperator
        preconditions:
          - "rejection_reason is non-empty"
          - "X-Payer-Code header matches enrollment.payer_id"
        side_effects:
          - "increments PayerEnrollment.version"
      - from: REJECTED
        to: RE_SUBMITTED
        trigger: "POST /clearinghouse/providers/{pid}/enrollments/{id}/resubmit"
        actor: ProviderAdmin
        preconditions:
          - "provider.status == ACTIVE"
        side_effects:
          - "sets submitted_at = now; increments decision_round by 1"
          - "recomputes payer_decision_due_at"
          - "increments PayerEnrollment.version"
      - from: RE_SUBMITTED
        to: PAYER_REVIEW
        trigger: "system after intake handoff"
        actor: system
        preconditions:
          - "payer.connectivity_status != OFFLINE for the transaction_type"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /clearinghouse/providers/{pid}/enrollments/{id}/cancel OR cascade from Provider suspend/terminate"
        actor: ProviderAdmin | ClearinghouseOps | system
        preconditions: []
        side_effects:
          - "increments PayerEnrollment.version"
      - from: PAYER_REVIEW
        to: CANCELLED
        trigger: "POST /clearinghouse/providers/{pid}/enrollments/{id}/cancel OR cascade from Provider suspend/terminate"
        actor: ProviderAdmin | ClearinghouseOps | system
        preconditions: []
        side_effects:
          - "increments PayerEnrollment.version"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /clearinghouse/providers/{pid}/enrollments/{id}/cancel OR cascade from Provider terminate"
        actor: ProviderAdmin | ClearinghouseOps | system
        preconditions:
          - "when transaction_type == CLAIMS_837: no Claim in acceptance_status ∈ {RECEIVED, VALIDATING, ACCEPTED, FORWARDED} on this (provider_id, payer_id)"
          - "when transaction_type == ELIGIBILITY_270: no EligibilityInquiry in status ∈ {PENDING, QUEUED_OUTAGE} on this (provider_id, payer_id)"
        side_effects:
          - "increments PayerEnrollment.version"

  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [REJECTED_CLEARINGHOUSE, REJECTED_BY_PAYER]
    transitions:
      - from: RECEIVED
        to: VALIDATING
        trigger: "system immediately after intake persistence"
        actor: system
        preconditions: []
        side_effects:
          - "runs payer_edit_rule evaluation; populates edit_failures"
      - from: VALIDATING
        to: REJECTED_CLEARINGHOUSE
        trigger: "system when edit_failures contains at least one severity=ERROR entry"
        actor: system
        preconditions: []
        side_effects:
          - "writes rejection_payload = { origin: CLEARINGHOUSE, rule_codes: [...], message }"
          - "frees (provider_id, payer_id, patient_control_number) uniqueness slot"
      - from: VALIDATING
        to: ACCEPTED
        trigger: "system when edit_failures contains zero severity=ERROR entries"
        actor: system
        preconditions:
          - "PayerEnrollment exists for (provider_id, payer_id, CLAIMS_837) in status APPROVED — otherwise the claim never left VALIDATING and intake rejects with ERR_ENROLLMENT_NOT_APPROVED"
        side_effects: []
      - from: ACCEPTED
        to: FORWARDED
        trigger: "POST /clearinghouse/claims/{id}/forward OR system auto-forward when payer connectivity is ONLINE"
        actor: ClearinghouseOps | system
        preconditions:
          - "payer.connectivity_status == ONLINE for CLAIMS_837 (no ACTIVE ConnectivityOutage whose affects_transaction_types contains CLAIMS_837)"
        side_effects:
          - "sets forwarded_at = now"
          - "computes payer_response_due_at = business_day_add(now, payer.claims_lead_time_days)"
          - "adjudication_status transitions NONE → PENDING"
          - "UsageInvoice.claim_units for the current period increments by 1 (and billable_units recomputed)"
      - from: FORWARDED
        to: ACKNOWLEDGED_BY_PAYER
        trigger: "POST /clearinghouse/claims/{id}/payer-ack"
        actor: PayerOperator
        preconditions:
          - "X-Payer-Code matches claim.payer_id"
        side_effects: []
      - from: FORWARDED
        to: REJECTED_BY_PAYER
        trigger: "POST /clearinghouse/claims/{id}/payer-reject"
        actor: PayerOperator
        preconditions:
          - "X-Payer-Code matches claim.payer_id"
          - "rejection_payload.rule_codes is non-empty"
        side_effects:
          - "adjudication_status transitions PENDING → DENIED"
          - "writes rejection_payload = { origin: PAYER, ... }"
      - from: ACKNOWLEDGED_BY_PAYER
        to: ACKNOWLEDGED_BY_PAYER
        trigger: "RemittanceAdvice POSTED against this claim"
        actor: system
        preconditions: []
        side_effects:
          - "adjudication_status transitions PENDING → PAID | DENIED | PARTIAL based on the remittance outcome (see calculations.remittance_outcome_classification)"
        note: "Acceptance axis remains ACKNOWLEDGED_BY_PAYER; the parallel adjudication axis carries the financial outcome."

  - entity: RemittanceAdvice
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    transitions:
      - from: RECEIVED
        to: POSTED
        trigger: "POST /clearinghouse/remittances/{id}/post"
        actor: ClearinghouseOps
        preconditions:
          - "claim.acceptance_status == ACKNOWLEDGED_BY_PAYER"
          - "claim.adjudication_status == PENDING"
          - "PayerEnrollment exists for (claim.provider_id, claim.payer_id, REMITTANCE_835) in status APPROVED"
          - "paid_amount_cents + adjustment_amount_cents + patient_responsibility_cents == claim.total_charge_cents"
        side_effects:
          - "spawns PostingFile in GENERATING then READY"
          - "claim.adjudication_status transitions to PAID | DENIED | PARTIAL"
          - "UsageInvoice.remittance_units increments by 1"
      - from: RECEIVED
        to: FAILED_POSTING
        trigger: "system when posting preconditions fail"
        actor: system
        preconditions: []
        side_effects:
          - "records failure reason"
      - from: FAILED_POSTING
        to: POSTED
        trigger: "POST /clearinghouse/remittances/{id}/post (retry)"
        actor: ClearinghouseOps
        preconditions:
          - "same as RECEIVED → POSTED"
        side_effects:
          - "same as RECEIVED → POSTED"
      - from: POSTED
        to: VOIDED
        trigger: "POST /clearinghouse/remittances/{id}/void"
        actor: ClearinghouseOps
        preconditions:
          - "no DELIVERED PostingFile exists for this remittance"
        side_effects:
          - "PostingFile transitions READY → FAILED"
          - "claim.adjudication_status transitions back to PENDING"
          - "UsageInvoice.remittance_units decrements by 1"

  - entity: PostingFile
    initial_state: GENERATING
    terminal_states: [DELIVERED, FAILED]
    transitions:
      - from: GENERATING
        to: READY
        trigger: "system on render completion"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: DELIVERED
        trigger: "POST /clearinghouse/posting-files/{id}/deliver"
        actor: ProviderAdmin
        preconditions:
          - "remittance.status == POSTED"
        side_effects: []
      - from: READY
        to: FAILED
        trigger: "cascade from RemittanceAdvice POSTED → VOIDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EligibilityInquiry
    initial_state: PENDING
    terminal_states: [RESPONDED, TIMED_OUT]
    transitions:
      - from: PENDING
        to: RESPONDED
        trigger: "POST /clearinghouse/eligibility/{id}/respond  (271 callback)"
        actor: PayerOperator
        preconditions:
          - "X-Payer-Code matches inquiry.payer_id"
          - "now <= deadline_at"
        side_effects:
          - "sets responded_at, parses benefit_summary"
          - "UsageInvoice.eligibility_units increments by 1"
      - from: PENDING
        to: TIMED_OUT
        trigger: "system when logical clock passes deadline_at without a response"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: QUEUED_OUTAGE
        trigger: "system when a ConnectivityOutage becomes ACTIVE with ELIGIBILITY_270 in affects_transaction_types and inquiry.payer_id matches"
        actor: system
        preconditions: []
        side_effects:
          - "deadline_at is suspended — recomputed on return to PENDING"
      - from: QUEUED_OUTAGE
        to: PENDING
        trigger: "system when the last matching ConnectivityOutage resolves"
        actor: system
        preconditions: []
        side_effects:
          - "deadline_at = now + payer.eligibility_lead_time_seconds (full SLA restarts on recovery)"

  - entity: ConnectivityOutage
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /clearinghouse/outages/{id}/resolve"
        actor: ClearinghouseOps
        preconditions: []
        side_effects:
          - "sets ended_at = now"
          - "payer.connectivity_status recomputed: OFFLINE if any other ACTIVE FULL outage exists for any overlapping transaction type; DEGRADED if any ACTIVE PARTIAL; else ONLINE"
          - "QUEUED_OUTAGE EligibilityInquiry rows whose payer_id matches and no remaining ACTIVE outage affect ELIGIBILITY_270 transition back to PENDING"
          - "ACCEPTED Claims whose forwarding was blocked transition to FORWARDED if their payer is back ONLINE"

  - entity: UsageInvoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /clearinghouse/usage-invoices/{id}/finalize"
        actor: ClearinghouseOps
        preconditions:
          - "logical clock is in a calendar month strictly later than period_yyyy_mm"
        side_effects:
          - "locks unit counts; computes gross_fee_cents, monthly_minimum_applied_cents, amount_due_cents via calculations.monthly_usage_fee"
          - "provider.account_balance_cents += amount_due_cents"
          - "provider.volume_tier_code recomputed (trailing-3-month window)"
      - from: FINALIZED
        to: PAID
        trigger: "POST /clearinghouse/usage-invoices/{id}/record-payment"
        actor: ClearinghouseOps
        preconditions:
          - "payment_amount_cents == amount_due_cents"
        side_effects:
          - "provider.account_balance_cents -= amount_due_cents"
      - from: OPEN
        to: VOID
        trigger: "POST /clearinghouse/usage-invoices/{id}/void"
        actor: ClearinghouseOps
        preconditions:
          - "no claim/eligibility/remittance units have been recorded (gross_fee_cents == 0)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent entity version)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-payer-decision-stale
    parent_entity: PayerEnrollment
    write_endpoint: "POST /clearinghouse/enrollments/{id}/payer-decision"
    occ_field: "expected_enrollment_version"
    description: |
      Recording a payer decision against a PayerEnrollment whose version has
      advanced since the payer operator last observed it is rejected. Captures
      the case where the provider's resubmission moved the enrollment into a
      fresh decision_round and the operator's decision is aimed at a stale
      round.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-forward-stale
    parent_entity: Claim
    write_endpoint: "POST /clearinghouse/claims/{id}/forward"
    occ_field: "expected_claim_version"
    description: |
      Forwarding a claim whose version has advanced since the caller last
      observed it is rejected — typically because a system-driven auto-forward
      already transitioned the claim and bumped version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: usage-invoice-finalize-stale
    parent_entity: UsageInvoice
    write_endpoint: "POST /clearinghouse/usage-invoices/{id}/finalize"
    occ_field: "expected_invoice_version"
    description: |
      Finalizing a UsageInvoice whose version has advanced since the caller
      last observed it is rejected — typically because another claim was
      forwarded in the meantime, incrementing claim_units and version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payer_decision_due_at
    trigger: "PayerEnrollment transitions into SUBMITTED or RE_SUBMITTED"
    algorithm: chronological
    formula: |
      lead_days =
        if transaction_type == CLAIMS_837      then payer.claims_lead_time_days
        if transaction_type == REMITTANCE_835  then payer.remittance_lead_time_days
        if transaction_type == ELIGIBILITY_270 then ceil(payer.eligibility_lead_time_seconds / 86400)
      payer_decision_due_at = business_day_add(submitted_at, lead_days)
      where business_day_add skips Saturdays and Sundays (no holiday calendar).
    constants:
      SECONDS_PER_DAY: 86400
    precision: "datetime, second precision"
    variants:
      - name: business_day
        when: "default; the contractually binding interpretation"
        difference: "skips weekend days"
      - name: calendar_day
        when: "documentation preview only (returned as payer_decision_due_at_calendar field for transparency)"
        difference: "naive date add; produces a strictly earlier or equal due date than business_day variant when the window crosses a weekend"

  - name: payer_response_due_at
    trigger: "Claim transitions into FORWARDED"
    algorithm: chronological
    formula: |
      payer_response_due_at = business_day_add(forwarded_at, payer.claims_lead_time_days)
    precision: "datetime, second precision"
    variants:
      - name: business_day
        when: "default"
        difference: "skips weekends"
      - name: calendar_day
        when: "returned alongside as payer_response_due_at_calendar"
        difference: "raw date add"

  - name: monthly_usage_fee
    trigger: "UsageInvoice OPEN → FINALIZED"
    algorithm: tiered_pricing
    formula: |
      For each transaction_kind in {CLAIM, ELIGIBILITY, REMITTANCE}:
        Let U_kind = unit count for that kind from provider-funded and shared payers.
        Walk the payer's PayerPricingTier rows for applies_to=kind, ordered by
        volume_floor ASC:
          for each tier overlapping [1, U_kind]:
            units_in_tier = min(U_kind, tier.volume_ceiling or U_kind) - tier.volume_floor + 1
            fee_kind_cents += units_in_tier * tier.rate_cents
        For SHARED payers, multiply fee_kind_cents by payer.shared_provider_pct
        (round per transaction-kind, round_half_up).
      gross_fee_cents = sum over kinds of fee_kind_cents
      monthly_minimum_applied_cents = sum over provider-funded payers of
        max(0, payer.monthly_minimum_cents - fee attributable to that payer)
      amount_due_cents = gross_fee_cents + monthly_minimum_applied_cents
    constants:
      ROUNDING: "round_half_up, applied per (transaction_kind, payer) before summing"
    precision: "integer cents; the rounding order — per (kind, payer) line then sum — is part of the contract and the alternative (sum then round) is observable to be different"

  - name: volume_tier_code
    trigger: "UsageInvoice FINALIZED"
    algorithm: threshold
    formula: |
      trailing = sum of billable_units across this period and the two prior FINALIZED periods
      if trailing >= TIER_3_FLOOR: volume_tier_code = TIER_3
      elif trailing >= TIER_2_FLOOR: volume_tier_code = TIER_2
      else: volume_tier_code = TIER_1
      Boundary: the floor is INCLUSIVE (>=), so trailing == TIER_2_FLOOR yields TIER_2.
    constants:
      TIER_2_FLOOR: 10000
      TIER_3_FLOOR: 100000
    precision: "integer"

  - name: remittance_outcome_classification
    trigger: "RemittanceAdvice → POSTED"
    algorithm: constraint_propagation
    formula: |
      balance_check = (paid_amount_cents + adjustment_amount_cents + patient_responsibility_cents == claim.total_charge_cents)
      if not balance_check: refuse to post (FAILED_POSTING with ERR_REMITTANCE_IMBALANCE)
      if denial_reason_codes is non-empty AND paid_amount_cents == 0: outcome = DENIED
      elif paid_amount_cents == claim.total_charge_cents AND adjustment_amount_cents == 0 AND patient_responsibility_cents == 0: outcome = PAID
      else: outcome = PARTIAL
      Boundary: paid_amount_cents == 0 with empty denial_reason_codes is invalid (ERR_REMITTANCE_IMBALANCE — neither paid nor denied is expressible).
    precision: "integer cents"

  - name: claim_intake_edit_evaluation
    trigger: "Claim RECEIVED → VALIDATING"
    algorithm: weighted_scoring
    formula: |
      applicable_rules = payer's PayerEditRule rows where
        effective_from <= now AND (effective_to IS NULL OR now < effective_to)
      For each applicable rule, evaluate expression against the claim payload.
      edit_failures = [ {rule_code, severity, message} for each rule that fails ]
      Acceptance decision: any severity=ERROR failure → REJECTED_CLEARINGHOUSE; warnings are recorded but do not block.
      Tie-break within edit_failures: ordered by rule_code ASC (lexicographic), then created_at ASC.
    precision: "n/a — set-valued"

  - name: connectivity_posture
    trigger: "ConnectivityOutage create / resolve"
    algorithm: aggregation
    formula: |
      For a given (payer, transaction_type):
        if any ACTIVE outage with severity=FULL and transaction_type in affects_transaction_types: posture = OFFLINE
        elif any ACTIVE outage with severity=PARTIAL and transaction_type in affects_transaction_types: posture = DEGRADED
        else: posture = ONLINE
      Payer.connectivity_status = worst posture across the three transaction types
      (OFFLINE > DEGRADED > ONLINE).
    precision: "enum"

  - name: account_balance_aging
    trigger: "UsageInvoice transitions"
    algorithm: aggregation
    formula: |
      account_balance_cents =
        sum(amount_due_cents over FINALIZED invoices) - sum(amount_due_cents over PAID invoices)
      OPEN and VOID invoices contribute zero.
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and (for entity-backed roles) X-User-ID headers are present and well-formed; PayerOperator requests additionally require X-Payer-Code"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-segment ids resolve, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with templated path segments"

  - priority: 4
    category: existence
    check: "Body foreign keys resolve: payer_id, submitter_credential_id, claim_id, etc."
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST/PUT endpoints with body-supplied foreign keys"

  - priority: 5
    category: state
    check: "Target resource is in a state compatible with the requested transition"
    error_id: "ERR_INVALID_STATE or domain-specific (ERR_ENROLLMENT_NOT_APPROVED, ERR_CLAIM_NOT_FORWARDED, ERR_CREDENTIAL_NOT_ACTIVE, etc.)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Parent aggregate state permits the operation (Provider ACTIVE for claim intake and enrollment submit; SubmitterCredential ACTIVE at claim intake)"
    error_id: ERR_PROVIDER_NOT_ACTIVE
    http_status: 409
    applies_to: "claim intake, eligibility intake, enrollment submit/resubmit"

  - priority: 7
    category: business_constraint
    check: "Format and uniqueness: TIN 9-digit, NPI 10-digit Luhn, payer_id_code 5 chars, enum membership, effective_from < effective_to on edit rules, expense date ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST endpoints"

  - priority: 8
    category: business_constraint
    check: "Idempotency-key uniqueness per provider; on replay with matching payload return the original response, on conflicting payload return ERR_IDEMPOTENCY_CONFLICT"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /claims, POST /eligibility"

  - priority: 9
    category: business_referential
    check: "Claim's submitter_credential_id belongs to the same provider as the URL path and is in ACTIVE status at the logical now (effective_at <= now < expires_at)"
    error_id: ERR_CREDENTIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clearinghouse/providers/{pid}/claims"

  - priority: 10
    category: business_referential
    check: "PayerEnrollment exists for (provider, payer, CLAIMS_837) in APPROVED status before claim is persisted"
    error_id: ERR_ENROLLMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /clearinghouse/providers/{pid}/claims"

  - priority: 11
    category: business_referential
    check: "PayerEnrollment exists for (provider, payer, ELIGIBILITY_270) in APPROVED status before eligibility inquiry is persisted"
    error_id: ERR_ENROLLMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /clearinghouse/providers/{pid}/eligibility"

  - priority: 12
    category: business_constraint
    check: "Claim patient_control_number is unique per (provider, payer) among claims whose acceptance_status != REJECTED_CLEARINGHOUSE"
    error_id: ERR_DUPLICATE_PATIENT_CONTROL_NUMBER
    http_status: 409
    applies_to: "POST /clearinghouse/providers/{pid}/claims"

  - priority: 13
    category: business_safety
    check: "Claim total_charge_cents equals the sum of line unit_charge_cents * units"
    error_id: ERR_CLAIM_TOTAL_MISMATCH
    http_status: 422
    applies_to: "POST /clearinghouse/providers/{pid}/claims"

  - priority: 14
    category: business_temporal
    check: "Payer connectivity posture for the relevant transaction type is not OFFLINE (DEGRADED is permitted with a warning header)"
    error_id: ERR_PAYER_OFFLINE
    http_status: 409
    applies_to: "POST /claims/{id}/forward, POST /eligibility"

  - priority: 15
    category: business_temporal
    check: "Eligibility 271 response arrives before deadline_at"
    error_id: ERR_INQUIRY_TIMED_OUT
    http_status: 409
    applies_to: "POST /eligibility/{id}/respond"

  - priority: 16
    category: business_fiscal
    check: "Remittance balance: paid + adjustment + patient_responsibility == claim.total_charge_cents; paid==0 requires non-empty denial_reason_codes"
    error_id: ERR_REMITTANCE_IMBALANCE
    http_status: 422
    applies_to: "POST /remittances, POST /remittances/{id}/post"

  - priority: 17
    category: business_fiscal
    check: "UsageInvoice.finalize: logical clock is strictly after the billing period's last day"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /usage-invoices/{id}/finalize"

  - priority: 18
    category: business_fiscal
    check: "UsageInvoice.record-payment amount matches amount_due_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /usage-invoices/{id}/record-payment"

  - priority: 19
    category: business_temporal
    check: "Payer decision arrives on or before payer_decision_due_at; late decisions still record but flag the enrollment with late_decision=true (warning only, no error)"
    error_id: "n/a — warning only"
    http_status: 200
    applies_to: "POST /enrollments/{id}/payer-decision"

  - priority: 20
    category: state
    check: "OCC: expected_<parent>_version matches the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/payer-decision, POST /claims/{id}/forward, POST /usage-invoices/{id}/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Provider ---
  - method: POST
    path: "/clearinghouse/providers"
    description: "Register a new provider (onboarding)"
    roles: [ClearinghouseOps]
    code: 201
    input: [legal_name, tax_identification_number, national_provider_identifier, billing_model]
    output: Provider
    side_effects: ["initializes status=ONBOARDING, account_balance_cents=0, volume_tier_code=TIER_1"]

  - method: GET
    path: "/clearinghouse/providers"
    description: "List providers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["status?", "billing_model?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}"
    description: "Fetch a provider"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/clearinghouse/providers/{id}/activate"
    description: "Transition ONBOARDING → ACTIVE"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: Provider
    side_effects: ["increments Provider.version", "sets activated_at"]

  - method: POST
    path: "/clearinghouse/providers/{id}/suspend"
    description: "Transition ACTIVE → SUSPENDED"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: Provider
    side_effects: ["cancels in-flight enrollments", "times out pending eligibility inquiries", "increments Provider.version"]

  - method: POST
    path: "/clearinghouse/providers/{id}/reinstate"
    description: "Transition SUSPENDED → ACTIVE"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: Provider
    side_effects: ["increments Provider.version"]

  - method: POST
    path: "/clearinghouse/providers/{id}/terminate"
    description: "Transition ACTIVE → TERMINATED"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: Provider
    side_effects: ["revokes credentials", "cancels enrollments", "increments Provider.version"]

  # --- SubmitterCredential ---
  - method: POST
    path: "/clearinghouse/providers/{id}/credentials"
    description: "Create a SubmitterCredential in DRAFT"
    roles: [ProviderAdmin]
    code: 201
    input: [submitter_id, trading_partner_agreement_ref, effective_at, expires_at]
    output: SubmitterCredential
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}/credentials"
    description: "List credentials for a provider"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SubmitterCredential[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}/credentials/{credentialId}"
    description: "Fetch a credential"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: []
    output: SubmitterCredential
    side_effects: []

  - method: POST
    path: "/clearinghouse/providers/{id}/credentials/{credentialId}/submit"
    description: "Transition DRAFT → PENDING_ACTIVATION"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: SubmitterCredential
    side_effects: ["increments version"]

  - method: POST
    path: "/clearinghouse/providers/{id}/credentials/{credentialId}/revoke"
    description: "Transition ACTIVE → REVOKED"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: []
    output: SubmitterCredential
    side_effects: ["increments version"]

  # --- Payer ---
  - method: POST
    path: "/clearinghouse/payers"
    description: "Register a payer"
    roles: [ClearinghouseOps]
    code: 201
    input: [payer_id_code, display_name, claims_lead_time_days, remittance_lead_time_days, eligibility_lead_time_seconds, pricing_model, "shared_provider_pct?", "monthly_minimum_cents?"]
    output: Payer
    side_effects: ["connectivity_status initialized ONLINE"]

  - method: GET
    path: "/clearinghouse/payers"
    description: "List payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["connectivity_status?", "pricing_model?", "limit?", "offset?"]
    output: "Payer[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/payers/{id}"
    description: "Fetch a payer"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: POST
    path: "/clearinghouse/payers/{id}/pricing-tiers"
    description: "Add a PayerPricingTier row"
    roles: [ClearinghouseOps]
    code: 201
    input: [applies_to, volume_floor, "volume_ceiling?", rate_cents]
    output: PayerPricingTier
    side_effects: []

  - method: GET
    path: "/clearinghouse/payers/{id}/pricing-tiers"
    description: "List pricing tiers for a payer"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["applies_to?", "limit?", "offset?"]
    output: "PayerPricingTier[]"
    side_effects: []

  - method: POST
    path: "/clearinghouse/payers/{id}/edit-rules"
    description: "Add a PayerEditRule"
    roles: [ClearinghouseOps, PayerOperator]
    code: 201
    input: [rule_code, applies_to, severity, expression, effective_from, "effective_to?"]
    output: PayerEditRule
    side_effects: []

  - method: GET
    path: "/clearinghouse/payers/{id}/edit-rules"
    description: "List edit rules for a payer"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["severity?", "limit?", "offset?"]
    output: "PayerEditRule[]"
    side_effects: []

  # --- PayerEnrollment ---
  - method: POST
    path: "/clearinghouse/providers/{id}/enrollments"
    description: "Create a PayerEnrollment in DRAFT"
    roles: [ProviderAdmin]
    code: 201
    input: [payer_id, transaction_type]
    output: PayerEnrollment
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}/enrollments"
    description: "List enrollments for a provider"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: ["payer_id?", "transaction_type?", "status?", "limit?", "offset?"]
    output: "PayerEnrollment[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}/enrollments/{enrollmentId}"
    description: "Fetch an enrollment"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []

  - method: POST
    path: "/clearinghouse/providers/{id}/enrollments/{enrollmentId}/submit"
    description: "Transition DRAFT → SUBMITTED"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["sets submitted_at, decision_round=1, payer_decision_due_at", "increments version", "system transitions SUBMITTED → PAYER_REVIEW if payer is reachable"]

  - method: POST
    path: "/clearinghouse/providers/{id}/enrollments/{enrollmentId}/resubmit"
    description: "Transition REJECTED → RE_SUBMITTED"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["increments decision_round", "recomputes payer_decision_due_at", "increments version"]

  - method: POST
    path: "/clearinghouse/providers/{id}/enrollments/{enrollmentId}/cancel"
    description: "Transition SUBMITTED / PAYER_REVIEW / APPROVED → CANCELLED"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: ["increments version"]

  - method: POST
    path: "/clearinghouse/enrollments/{id}/payer-decision"
    description: "Payer records APPROVE / REJECT on a PAYER_REVIEW enrollment"
    roles: [PayerOperator]
    code: 200
    input: [decision, expected_enrollment_version, "rejection_reason?"]
    output: PayerEnrollment
    side_effects: ["increments PayerEnrollment.version", "sets approved_at on APPROVE"]

  # --- Claim ---
  - method: POST
    path: "/clearinghouse/providers/{id}/claims"
    description: "Submit a new 837 claim"
    roles: [ProviderAdmin]
    code: 201
    input: [payer_id, submitter_credential_id, patient_control_number, idempotency_key, service_date, total_charge_cents, diagnosis_codes, rendering_npi, subscriber_id, lines]
    output: Claim
    side_effects: ["system transitions RECEIVED → VALIDATING → (ACCEPTED | REJECTED_CLEARINGHOUSE)"]

  - method: GET
    path: "/clearinghouse/providers/{id}/claims"
    description: "List claims for a provider"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: ["payer_id?", "acceptance_status?", "adjudication_status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/claims/{id}"
    description: "Fetch a claim"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/clearinghouse/claims/{id}/forward"
    description: "Transition ACCEPTED → FORWARDED (manual)"
    roles: [ClearinghouseOps]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["sets forwarded_at, payer_response_due_at", "adjudication_status NONE → PENDING", "increments Claim.version", "increments UsageInvoice.claim_units"]

  - method: POST
    path: "/clearinghouse/claims/{id}/payer-ack"
    description: "Transition FORWARDED → ACKNOWLEDGED_BY_PAYER"
    roles: [PayerOperator]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/clearinghouse/claims/{id}/payer-reject"
    description: "Transition FORWARDED → REJECTED_BY_PAYER"
    roles: [PayerOperator]
    code: 200
    input: [rule_codes, message]
    output: Claim
    side_effects: ["adjudication_status PENDING → DENIED", "writes rejection_payload"]

  # --- RemittanceAdvice ---
  - method: POST
    path: "/clearinghouse/claims/{id}/remittances"
    description: "Ingest an 835 remittance advice against a claim"
    roles: [PayerOperator]
    code: 201
    input: [check_number, paid_amount_cents, adjustment_amount_cents, patient_responsibility_cents, denial_reason_codes]
    output: RemittanceAdvice
    side_effects: ["initial state RECEIVED"]

  - method: GET
    path: "/clearinghouse/claims/{id}/remittances"
    description: "List remittances for a claim"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RemittanceAdvice[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/remittances/{id}"
    description: "Fetch a remittance"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: []
    output: RemittanceAdvice
    side_effects: []

  - method: POST
    path: "/clearinghouse/remittances/{id}/post"
    description: "Transition RECEIVED | FAILED_POSTING → POSTED"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: RemittanceAdvice
    side_effects: ["spawns PostingFile GENERATING → READY", "claim.adjudication_status updates", "UsageInvoice.remittance_units increments"]

  - method: POST
    path: "/clearinghouse/remittances/{id}/void"
    description: "Transition POSTED → VOIDED"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: RemittanceAdvice
    side_effects: ["PostingFile READY → FAILED", "claim.adjudication_status reverts to PENDING", "UsageInvoice.remittance_units decrements"]

  # --- PostingFile ---
  - method: GET
    path: "/clearinghouse/remittances/{id}/posting-files"
    description: "List posting files for a remittance"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PostingFile[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/posting-files/{id}"
    description: "Fetch a posting file"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: []
    output: PostingFile
    side_effects: []

  - method: POST
    path: "/clearinghouse/posting-files/{id}/deliver"
    description: "Transition READY → DELIVERED"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: PostingFile
    side_effects: []

  # --- EligibilityInquiry ---
  - method: POST
    path: "/clearinghouse/providers/{id}/eligibility"
    description: "Submit a 270 eligibility inquiry"
    roles: [ProviderAdmin]
    code: 201
    input: [payer_id, subscriber_id, service_type_code, idempotency_key]
    output: EligibilityInquiry
    side_effects: ["computes deadline_at", "may immediately transition to QUEUED_OUTAGE if payer has an ACTIVE ELIGIBILITY_270 outage"]

  - method: GET
    path: "/clearinghouse/providers/{id}/eligibility"
    description: "List eligibility inquiries"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: ["payer_id?", "status?", "limit?", "offset?"]
    output: "EligibilityInquiry[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/eligibility/{id}"
    description: "Fetch an inquiry"
    roles: [ProviderAdmin, ClearinghouseOps, PayerOperator]
    code: 200
    input: []
    output: EligibilityInquiry
    side_effects: []

  - method: POST
    path: "/clearinghouse/eligibility/{id}/respond"
    description: "Record a 271 response"
    roles: [PayerOperator]
    code: 200
    input: [benefit_summary]
    output: EligibilityInquiry
    side_effects: ["sets responded_at", "UsageInvoice.eligibility_units increments"]

  # --- ConnectivityOutage ---
  - method: POST
    path: "/clearinghouse/payers/{id}/outages"
    description: "Open a ConnectivityOutage"
    roles: [ClearinghouseOps]
    code: 201
    input: [severity, affects_transaction_types]
    output: ConnectivityOutage
    side_effects: ["recomputes payer.connectivity_status", "transitions matching PENDING EligibilityInquiry rows to QUEUED_OUTAGE", "creates OutageNotification rows for affected providers"]

  - method: GET
    path: "/clearinghouse/payers/{id}/outages"
    description: "List outages for a payer"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConnectivityOutage[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/outages/{id}"
    description: "Fetch an outage"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: []
    output: ConnectivityOutage
    side_effects: []

  - method: POST
    path: "/clearinghouse/outages/{id}/resolve"
    description: "Transition ACTIVE → RESOLVED"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: ConnectivityOutage
    side_effects: ["recomputes payer.connectivity_status", "QUEUED_OUTAGE inquiries return to PENDING with refreshed deadline_at", "blocked ACCEPTED claims transition to FORWARDED"]

  - method: GET
    path: "/clearinghouse/outages/{id}/notifications"
    description: "List notifications for an outage"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "OutageNotification[]"
    side_effects: []

  # --- UsageInvoice ---
  - method: POST
    path: "/clearinghouse/providers/{id}/usage-invoices"
    description: "Open a UsageInvoice for a period"
    roles: [ClearinghouseOps]
    code: 201
    input: [period_yyyy_mm]
    output: UsageInvoice
    side_effects: []

  - method: GET
    path: "/clearinghouse/providers/{id}/usage-invoices"
    description: "List usage invoices"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: ["status?", "period_yyyy_mm?", "limit?", "offset?"]
    output: "UsageInvoice[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/usage-invoices/{id}"
    description: "Fetch a usage invoice"
    roles: [ProviderAdmin, ClearinghouseOps]
    code: 200
    input: []
    output: UsageInvoice
    side_effects: []

  - method: POST
    path: "/clearinghouse/usage-invoices/{id}/finalize"
    description: "Transition OPEN → FINALIZED"
    roles: [ClearinghouseOps]
    code: 200
    input: [expected_invoice_version]
    output: UsageInvoice
    side_effects: ["computes gross_fee_cents, monthly_minimum_applied_cents, amount_due_cents", "updates provider.account_balance_cents and volume_tier_code", "increments UsageInvoice.version"]

  - method: POST
    path: "/clearinghouse/usage-invoices/{id}/record-payment"
    description: "Transition FINALIZED → PAID"
    roles: [ClearinghouseOps]
    code: 200
    input: [payment_amount_cents]
    output: UsageInvoice
    side_effects: ["decrements provider.account_balance_cents"]

  - method: POST
    path: "/clearinghouse/usage-invoices/{id}/void"
    description: "Transition OPEN → VOID"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: UsageInvoice
    side_effects: []

  # --- Test-driving endpoints (/_<name>) ---
  - method: POST
    path: "/clearinghouse/_clock/set_current_utc"
    description: "Set the logical clock. Server starts at 2026-09-01T00:00:00Z by default and never consults wall-clock."
    roles: [ClearinghouseOps]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["advances time-driven transitions (credential activation, inquiry timeout, enrollment PAYER_REVIEW handoff)"]

  - method: POST
    path: "/clearinghouse/_enrollments/{id}/advance-to-review"
    description: "Force SUBMITTED/RE_SUBMITTED → PAYER_REVIEW (used when the system handoff would otherwise be asynchronous)"
    roles: [ClearinghouseOps]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []

  # --- Top-level filtered-list GETs (FK reverse-reachability) ---
  - method: GET
    path: "/clearinghouse/credentials"
    description: "Filtered list of SubmitterCredential across providers"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["provider_id?", "status?", "limit?", "offset?"]
    output: "SubmitterCredential[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/pricing-tiers"
    description: "Filtered list of PayerPricingTier across payers"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["payer_id?", "applies_to?", "limit?", "offset?"]
    output: "PayerPricingTier[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/edit-rules"
    description: "Filtered list of PayerEditRule across payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["payer_id?", "severity?", "limit?", "offset?"]
    output: "PayerEditRule[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/enrollments"
    description: "Filtered list of PayerEnrollment across providers and payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["provider_id?", "payer_id?", "transaction_type?", "status?", "limit?", "offset?"]
    output: "PayerEnrollment[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/claims"
    description: "Filtered list of Claim across providers and payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["provider_id?", "payer_id?", "submitter_credential_id?", "acceptance_status?", "adjudication_status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/remittances"
    description: "Filtered list of RemittanceAdvice across claims and payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["claim_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: "RemittanceAdvice[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/posting-files"
    description: "Filtered list of PostingFile across remittances"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["remittance_advice_id?", "status?", "limit?", "offset?"]
    output: "PostingFile[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/eligibility"
    description: "Filtered list of EligibilityInquiry across providers and payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["provider_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: "EligibilityInquiry[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/outages"
    description: "Filtered list of ConnectivityOutage across payers"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: ["payer_id?", "status?", "limit?", "offset?"]
    output: "ConnectivityOutage[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/usage-invoices"
    description: "Filtered list of UsageInvoice across providers"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["provider_id?", "period_yyyy_mm?", "status?", "limit?", "offset?"]
    output: "UsageInvoice[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/notifications"
    description: "Filtered list of OutageNotification across outages and providers"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: ["outage_id?", "provider_id?", "limit?", "offset?"]
    output: "OutageNotification[]"
    side_effects: []

  - method: GET
    path: "/clearinghouse/enrollments/{id}"
    description: "Fetch a single PayerEnrollment by id (canonical collection anchor)"
    roles: [ClearinghouseOps, ProviderAdmin, PayerOperator]
    code: 200
    input: []
    output: PayerEnrollment
    side_effects: []

  - method: GET
    path: "/clearinghouse/notifications/{id}"
    description: "Fetch a single OutageNotification by id (canonical collection anchor)"
    roles: [ClearinghouseOps, ProviderAdmin]
    code: 200
    input: []
    output: OutageNotification
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-Role / X-User-ID / X-Payer-Code header missing or malformed"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this endpoint"

  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "provider id in path or body does not exist"

  - id: ERR_PAYER_NOT_FOUND
    http: 404
    condition: "payer id does not exist"

  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "submitter credential id does not exist"

  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment id does not exist"

  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id does not exist"

  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "remittance id does not exist"

  - id: ERR_POSTING_FILE_NOT_FOUND
    http: 404
    condition: "posting file id does not exist"

  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "eligibility inquiry id does not exist"

  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "outage id does not exist"

  - id: ERR_USAGE_INVOICE_NOT_FOUND
    http: 404
    condition: "usage invoice id does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema / format / enum violation (TIN shape, NPI Luhn, enum membership, date ordering)"

  - id: ERR_PROVIDER_NOT_ACTIVE
    http: 409
    condition: "Operation requires provider.status == ACTIVE"

  - id: ERR_CREDENTIAL_NOT_ACTIVE
    http: 409
    condition: "Submitter credential is not ACTIVE or not within [effective_at, expires_at)"

  - id: ERR_ENROLLMENT_NOT_APPROVED
    http: 409
    condition: "No APPROVED enrollment exists for (provider, payer, transaction_type)"

  - id: ERR_ENROLLMENT_DUPLICATE_ACTIVE
    http: 409
    condition: "A non-terminal enrollment already exists for this (provider, payer, transaction_type)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined"

  - id: ERR_DUPLICATE_PATIENT_CONTROL_NUMBER
    http: 409
    condition: "patient_control_number collides with another non-REJECTED_CLEARINGHOUSE claim on the same (provider, payer)"

  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "idempotency_key replayed with a different payload"

  - id: ERR_CLAIM_TOTAL_MISMATCH
    http: 422
    condition: "total_charge_cents does not equal the sum of line unit_charge_cents * units"

  - id: ERR_PAYER_OFFLINE
    http: 409
    condition: "Payer connectivity posture is OFFLINE for the relevant transaction type"

  - id: ERR_INQUIRY_TIMED_OUT
    http: 409
    condition: "271 response arrived after deadline_at"

  - id: ERR_REMITTANCE_IMBALANCE
    http: 422
    condition: "paid + adjustment + patient_responsibility != claim.total_charge_cents, OR paid == 0 with empty denial_reason_codes"

  - id: ERR_REMITTANCE_NOT_POSTABLE
    http: 409
    condition: "Remittance is in a state from which post is undefined (e.g. already POSTED or VOIDED)"

  - id: ERR_POSTING_FILE_NOT_DELIVERABLE
    http: 409
    condition: "Posting file is not READY"

  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "Cannot finalize a usage invoice whose billing period has not ended on the logical clock"

  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "record-payment amount != amount_due_cents"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the current parent version"

  - id: ERR_PAYER_CODE_MISMATCH
    http: 403
    condition: "X-Payer-Code header does not match the resource's owning payer"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClearinghouseOps
    description: "Clearinghouse platform operator — owns payer configuration, outage management, invoicing, and provider lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /clearinghouse/providers"
      - "POST /clearinghouse/providers/{id}/activate|suspend|reinstate|terminate"
      - "POST /clearinghouse/payers"
      - "POST /clearinghouse/payers/{id}/pricing-tiers"
      - "POST /clearinghouse/payers/{id}/outages"
      - "POST /clearinghouse/outages/{id}/resolve"
      - "POST /clearinghouse/claims/{id}/forward"
      - "POST /clearinghouse/remittances/{id}/post"
      - "POST /clearinghouse/remittances/{id}/void"
      - "POST /clearinghouse/providers/{id}/usage-invoices"
      - "POST /clearinghouse/usage-invoices/{id}/finalize"
      - "POST /clearinghouse/usage-invoices/{id}/record-payment"
      - "POST /clearinghouse/usage-invoices/{id}/void"
      - "POST /clearinghouse/_clock/set_current_utc"
      - "POST /clearinghouse/_enrollments/{id}/advance-to-review"
    shared_operations:
      - "GET endpoints under /clearinghouse/**"

  - name: ProviderAdmin
    description: "Administrative user on behalf of a single Provider — owns credentials, enrollments, claims, eligibility inquiries"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /clearinghouse/providers/{id}/credentials"
      - "POST /clearinghouse/providers/{id}/credentials/{cid}/submit"
      - "POST /clearinghouse/providers/{id}/credentials/{cid}/revoke"
      - "POST /clearinghouse/providers/{id}/enrollments"
      - "POST /clearinghouse/providers/{id}/enrollments/{eid}/submit"
      - "POST /clearinghouse/providers/{id}/enrollments/{eid}/resubmit"
      - "POST /clearinghouse/providers/{id}/enrollments/{eid}/cancel"
      - "POST /clearinghouse/providers/{id}/claims"
      - "POST /clearinghouse/providers/{id}/eligibility"
      - "POST /clearinghouse/posting-files/{id}/deliver"
    shared_operations:
      - "GET endpoints under /clearinghouse/** scoped to own provider"

  - name: PayerOperator
    description: "Operator acting on behalf of a single Payer — records enrollment decisions, claim acknowledgments/rejections, remittances, and 271 responses"
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /clearinghouse/enrollments/{id}/payer-decision"
      - "POST /clearinghouse/claims/{id}/payer-ack"
      - "POST /clearinghouse/claims/{id}/payer-reject"
      - "POST /clearinghouse/claims/{id}/remittances"
      - "POST /clearinghouse/eligibility/{id}/respond"
    shared_operations:
      - "GET endpoints under /clearinghouse/** scoped to own payer"
