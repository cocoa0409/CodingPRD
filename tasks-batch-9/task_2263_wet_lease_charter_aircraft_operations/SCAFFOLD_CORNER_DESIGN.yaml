          Read and write permissions on the same resource are deliberately asymmetric: four roles may
          LIST legs but only LessorOpsController holds operational control and may schedule one, so the
          billing desk, the customer and even technical control are all 403 on the POST while the
          billing desk's LIST succeeds. Even the customer whose own capacity it is cannot self-schedule.
          
