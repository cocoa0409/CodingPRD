        distinguishing_aspect: |
          Each foreign key resolves against its own catalog entry: a bad lessee_id on lease creation is
          ERR_LESSEE_NOT_FOUND while a bad {id} on a nested mortgage POST is ERR_LEASE_NOT_FOUND. Both
