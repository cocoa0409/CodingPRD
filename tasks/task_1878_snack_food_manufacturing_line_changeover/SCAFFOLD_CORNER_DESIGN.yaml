    instances:
      - name: occ_run_create_stale_line_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[run-create-stale-line-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Create-with-supersede on the line's schedule basis: after run1's creation bumps ProductionLine.version 1 -> 2, a second create carrying expected_line_version 1 fails 412 ERR_STALE_VERSION even though its own payload is independently valid."
        test_recipe:
          setup: ["line created (version 1 captured); run1 created with the observed version (line version now 2)"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v1: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v1}" }
              as: PlantManager
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v1}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "412 ERR_STALE_VERSION (observed version 1, current 2)"
            - "no second run persisted: GET /snack-mfg/production-runs total_count == 1"
            - "ProductionLine.${line_id}.version remains 2 (failed OCC write does not mutate)"

      - name: occ_oil_movement_stale_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[oil-movement-stale-baseline]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Movement volumes are computed from the TPM/gallons baseline the operator read: after a DISCARD bumps FryerOil.version 1 -> 2, a second movement carrying expected_oil_version 1 fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["line created; oil version 1 observed; DISCARD 10 applied (version now 2, gallons 90)"]
          setup_api_calls:
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", oil_v1: "$.data[0].version" }
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: DISCARD, gallons: 10, expected_oil_version: "${oil_v1}" }
              as: LineOperator
          trigger:
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: DISCARD, gallons: 5, expected_oil_version: "${oil_v1}" }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "412 ERR_STALE_VERSION (observed version 1, current 2)"
            - "FryerOil.${oil_id}.current_gallons remains 90 (stale write rejected cleanly)"

      - name: cascading_side_effects_covered
        claim_type: cascade
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: weight_check_tpm_breach_three_link_cascade
          rationale: "Plus display_build_quota_exhaustion_cascade — two multi-hop cascades asserted end-to-end in §1.8."
      - name: dual_variant_layer_covered
        claim_type: variant_divergence
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: giveaway_provisional_vs_final_divergence
          rationale: "Plus freshness_dsd_vs_warehouse_window_divergence — dual variants in two entity domains asserted in §1.8."
      - name: rate_threshold_layer_covered
        claim_type: threshold_crossing
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: tpm_threshold_27_inclusive_boundary
          rationale: "Cumulative TPM threshold crossing asserted at the inclusive boundary in the named §1.8 instance."
      - name: derived_field_reconciliation_covered
        claim_type: derived_field
        grounds:
          - "entities.PromoWindow.fields.quota_remaining_cases"
          - "entities.ProductionLine.fields.posture"
        excluded_because:
          difficulty_instance: promo_quota_build_cancel_conservation
          rationale: "Quota counters reconciled across build/cancel in the named §1.8 instance; posture derivation covered by line_posture_recomputes_across_changeover_lifecycle in this file."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "entities.ProductionLine.fields.version"
        distinguishing_aspect: "Immediate consistency: the version bump from run creation is observable on the very next GET of the line (1 -> 2), and the new run is visible in the filtered list — no lag, no read repair."
        test_recipe:
          setup: ["product and line exist (line version 1)"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v1: $.data.version }
          trigger:
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v1}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
            - call: "GET /snack-mfg/production-runs"
              as: PlantManager
          assert:
            - "GET line immediately after create: version == 2 (create side effect visible)"
            - "GET /snack-mfg/production-runs contains ${run_id} with execution_status == SCHEDULED (total_count 1)"



