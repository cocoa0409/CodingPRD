            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0107", nationality_code: "CN", boarding_pass_barcode: "BP-0107", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_107: $.data.id }
            - call: "POST /itineraries/${it_107}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0107" }
              as: SalesAssociate
            - call: "POST /sales"
