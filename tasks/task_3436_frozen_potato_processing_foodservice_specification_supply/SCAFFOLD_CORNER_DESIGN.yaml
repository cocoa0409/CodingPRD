      - name: shortage_allocation_excludes_suspended_agreements_and_caps_at_contract
        claim_type: Input Set Filtering
        grounds:
          - calculations.shortage_allocation
          - state_machines.SupplyAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Only ACTIVE agreements participate: with B SUSPENDED by credit hold, a PRO_RATA event over a 1000-case pool gives A min(600, floor(1000 x 600/600)) = 600 — the contract cap binds, not the whole pool — and B's stored allocation is untouched."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; chain A ACTIVE agreement 600/wk; chain B agreement 400/wk SUSPENDED via credit hold."
          setup_api_calls:
            - *k_clock
            - *k_chain_a
            - *k_spec_a
            - *k_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 600, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - &k_chain_b
              call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-BETA", legal_name: "Beta Diner Group", priority_tier: "TIER_2_PREFERRED" }
              as: AccountManager
              captures: { chain_b_id: $.data.id }
            - &k_spec_b
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_b_id}", spec_code: "SP-B-1", cut_family: "CRINKLE", cut_size_mm: 10.0, coating_type: "SEASONED", target_color_units: 2.0, max_cook_time_sec: 210 }
              as: ChainCustomer
              as_user_id: "${chain_b_id}"
              captures: { spec_b_id: $.data.id }
            - call: "POST /potato-ops/cut-specifications/${spec_b_id}/validate"
              payload: { panel_score: 7.5 }
              as: QualityAssuranceLead
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 400, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_b_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/customer-chains/${chain_b_id}/set-credit-status"
              payload: { credit_status: "ON_HOLD" }
              as: AccountManager
            - call: "POST /potato-ops/shortage-events"
              payload: { scope_variety: "RUSSET_BURBANK", declared_deficit_cwt: 5000, available_week_cases: 1000, response_mode: "PRO_RATA" }
              as: GrowerRelationsManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/shortage-events/${event_id}/execute-allocation"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { alloc_a: "$.data[0].current_week_allocation_cases" }
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}" }
              as: AccountManager
              captures: { alloc_b: "$.data[0].current_week_allocation_cases", status_b: "$.data[0].status" }
          assert:
            - "agreement A (sole ACTIVE participant) gets current_week_allocation_cases == 600 — the contract cap, not the full 1000-case pool"
            - "SUSPENDED agreement B keeps its stored 400 and is not recomputed"
            - "SupplyAgreement.${agr_b_id}.status == SUSPENDED"

