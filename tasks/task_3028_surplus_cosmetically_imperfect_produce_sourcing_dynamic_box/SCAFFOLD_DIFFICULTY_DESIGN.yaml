      - call: POST /produce/supply-lots/${b_fd1}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${b2v_fd1}
        as: PlatformAdmin
        captures:
          b3v_fd1: $.data.version
      - call: POST /produce/supply-lots/${b_fd2}/award
        payload:
          bidder_quota: 1
