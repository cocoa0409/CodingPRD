              as: PermitApplicant
              as_user_id: "studio-20"
              captures: { p20: $.data.id }
            - call: "POST /refuge/permits/${p19}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
            - call: "POST /refuge/permits/${p19}/resubmit"
              payload: {}
              as: PermitApplicant
              as_user_id: "studio-19"
            - call: "POST /refuge/permits/${p20}/return-for-revision"
              payload: { note: "n" }
              as: PermitOfficer
