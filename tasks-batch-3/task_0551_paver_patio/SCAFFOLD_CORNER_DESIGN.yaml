scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: project_creation_returns_201_with_draft_status
        claim_type: creation
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "POST /projects with required fields returns 201 and a Project in status DRAFT with a server-minted id and version 1."
        test_recipe:
          setup: ["Fresh DB. One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "New Owner", email: "no@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "20 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          assert:
            - "response.status == 201"
            - "Project.${pid}.status == DRAFT"
            - "Project.${pid}.version == 1"

      - name: get_nonexistent_project_returns_not_found
        claim_type: not_found
        grounds: [entities.Project, "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET /projects/{unknown-uuid} returns ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Fresh DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: get_nonexistent_design_revision_returns_not_found
        claim_type: not_found
        grounds: [entities.DesignRevision, "errors[ERR_DESIGN_REVISION_NOT_FOUND]"]
        distinguishing_aspect: "GET /design-revisions/{unknown} returns ERR_DESIGN_REVISION_NOT_FOUND (404); same pattern applies to every per-entity NOT_FOUND."
        test_recipe:
          setup: ["Fresh DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /design-revisions/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_DESIGN_REVISION_NOT_FOUND"

      - name: create_line_item_missing_product_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.LineItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /line-items without the required product_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Fresh DB. One project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner R", email: "or@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "21 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /line-items"
              payload: { project_id: "${pid}", measured_quantity: 100 }
              as: DesignConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_category_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products with category outside {PAVER,WALL_BLOCK,FIRE_PIT,OUTDOOR_KITCHEN} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Fresh DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "BOGUS-1", name: "Bogus", category: "GAZEBO", unit: "EACH", unit_price_cents: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: product_is_feature_is_computed_from_category
        claim_type: computed_fields
        grounds: [entities.Product.fields.is_feature]
        distinguishing_aspect: "Creating a FIRE_PIT product yields is_feature == true; is_feature is computed from category, not client input."
        test_recipe:
          setup: ["Fresh DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "FIRE-KIT", name: "Fire Pit Kit", category: "FIRE_PIT", unit: "EACH", unit_price_cents: 180000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
          assert:
            - "Product.${prod}.is_feature == true"

      - name: line_item_category_denormalized_from_product
        claim_type: computed_fields
        grounds: [entities.LineItem.fields.category]
        distinguishing_aspect: "A LineItem created against a WALL_BLOCK product has category == WALL_BLOCK denormalized at creation."
        test_recipe:
          setup: ["Fresh DB. One project and one WALL_BLOCK product."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner C", email: "oc@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "WALL-STONE", name: "Stone Wall", category: "WALL_BLOCK", unit: "FACE_SQFT", unit_price_cents: 2200, waste_factor: 0.10, coverage_per_pallet_sqft: 30 }
              as: PlatformAdmin
              captures: { p_wall: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "22 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_wall}", measured_quantity: 30 }
              as: DesignConsultant
              captures: { li: $.data.id }
          assert:
            - "LineItem.${li}.category == WALL_BLOCK"

      - name: project_in_hoa_defaults_false
        claim_type: defaults
        grounds: [entities.Project.fields.in_hoa]
        distinguishing_aspect: "Omitting in_hoa on POST /projects yields in_hoa == false."
        test_recipe:
          setup: ["Fresh DB. One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner D", email: "od@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "23 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          assert:
            - "Project.${pid}.in_hoa == false"

      - name: create_project_unknown_customer_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Project.fields.customer_id, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "POST /projects with a customer_id that references no Customer returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Fresh DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "00000000-0000-4000-8000-0000000000aa", site_address: "24 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: create_line_item_unknown_product_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.LineItem.fields.product_id, "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "POST /line-items with a product_id that references no Product returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Fresh DB. One project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner P", email: "op@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "25 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "00000000-0000-4000-8000-0000000000bb", measured_quantity: 100 }
              as: DesignConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PRODUCT_NOT_FOUND"

  # =========================================================================
  - section: state_machines
    instances:
      - name: new_project_starts_in_draft
        claim_type: initial_state
        grounds: [state_machines.Project]
        distinguishing_aspect: "A newly created Project has status == DRAFT (the declared initial_state)."
        test_recipe:
          setup: ["Fresh DB. One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner I", email: "oi@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "26 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          assert:
            - "Project.${pid}.status == DRAFT"

      - name: approve_design_from_drafting_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DesignRevision.IN_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a DesignRevision still in DRAFTING (approve is only legal from IN_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Fresh DB. A project with a DRAFTING design revision."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner V", email: "ov@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "27 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
          trigger:
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: render_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.DesignRevision.DRAFTING_to_RENDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rendering an already-RENDERED design revision (render is only legal from DRAFTING) returns ERR_INVALID_STATE (409) on the second call."
        test_recipe:
          setup: ["Fresh DB. A project with a RENDERED design revision."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner ID", email: "oid@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "28 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
          trigger:
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: terminal_state
        grounds: [state_machines.Project, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a project already in terminal CANCELLED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Fresh DB. A CANCELLED project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner T", email: "ot@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "29 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: permit_deny_branch
        claim_type: valid_transition
        grounds: [state_machines.Permit.SUBMITTED_to_DENIED, entities.Permit.fields.correction_notes]
        distinguishing_aspect: "A SUBMITTED permit can be DENIED by PlatformAdmin, setting correction_notes; DENIED is terminal."
        test_recipe:
          setup: ["Fresh DB. A permit-required project at PENDING_APPROVALS with a SUBMITTED permit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner PD", email: "opd@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "30 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "seat wall", measured_sqft: 100, wall_height_in: 48 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: DesignConsultant
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "GET /projects/${pid}/permits"
              payload: {}
              as: ProjectManager
              captures: { permit: "$.data[0].id" }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /permits/${permit}/deny"
              payload: { correction_notes: "setback too small" }
              as: PlatformAdmin
          assert:
            - "Permit.${permit}.status == DENIED"
            - "Permit.${permit}.correction_notes == 'setback too small'"

      - name: hoa_approve_branch
        claim_type: valid_transition
        grounds: [state_machines.HoaSubmission.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "A SUBMITTED HOA submission can be APPROVED by PlatformAdmin (distinct branch from CONDITIONAL/REJECTED); APPROVED is terminal."
        test_recipe:
          setup: ["Fresh DB. An in-HOA project at PENDING_APPROVALS with a SUBMITTED HoaSubmission."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner HA", email: "oha@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "31 Yard Ln", region_code: "CA", in_hoa: true }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "patio", measured_sqft: 100, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: DesignConsultant
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
            - call: "POST /projects/${pid}/submit-approvals"
              payload: {}
              as: ProjectManager
            - call: "GET /projects/${pid}/hoa-submissions"
              payload: {}
              as: ProjectManager
              captures: { hoa: "$.data[0].id" }
            - call: "POST /hoa-submissions/${hoa}/submit"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /hoa-submissions/${hoa}/decide"
              payload: { outcome: "APPROVED", decision_notes: "ok" }
              as: PlatformAdmin
          assert:
            - "HoaSubmission.${hoa}.status == APPROVED"

      - name: error_permit_not_approved_on_wall_build_schedule
        claim_type: invalid_transition
        grounds: [state_machines.WorkPhase.PLANNED_to_SCHEDULED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / wall_build_schedule_requires_permit_approved
          rationale: "Permit-gate rejection on WALL_BUILD schedule is asserted by that §1.8 instance."

      - name: design_revision_revision_loop
        claim_type: cyclic
        grounds: [state_machines.DesignRevision.REVISION_REQUESTED_to_DRAFTING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / design_revision_revision_cycle
          rationale: "Revision cycle and revision_round increment are asserted there."

      - name: hoa_conditional_branch
        claim_type: branching
        grounds: [state_machines.HoaSubmission.SUBMITTED_to_CONDITIONAL]
        excluded_because:
          difficulty_instance: non_linear_state_machine / hoa_submission_conditional_branch
          rationale: "CONDITIONAL fork is asserted there."

      - name: cascade_down_project_cancel_releases_crew
        claim_type: cascade_down
        grounds: [state_machines.WorkPhase.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / crew_capacity_conservation_schedule_then_cancel
          rationale: "Cancel cascade to phase + crew release is asserted there."

      - name: bubble_up_final_phase_completes_project
        claim_type: bubble_up
        grounds: [state_machines.Project.IN_PRODUCTION_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / final_phase_completion_bubbles_project_and_creates_retention
          rationale: "Bubble-up to COMPLETED + retention draw is asserted there."

  # =========================================================================
  - section: calculations
    instances:
      - name: deposit_valuation_visible_immediately_after_estimate
        claim_type: correct_result
        grounds: [calculations.project_valuation, entities.Project.fields.estimated_total_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / labor_tier_plus_complex_site_multiplier
          rationale: "estimated_total_cents correctness after generate-estimate is asserted there."

      - name: material_pallets_round_per_line
        claim_type: correct_result
        grounds: [calculations.material_order_pallets]
        excluded_because:
          difficulty_instance: combinatorial_formula / material_order_pallet_round_per_line_then_sum
          rationale: "Pallet rounding order is asserted there."

  # =========================================================================
  - section: validations
    instances:
      - name: deposit_exceeds_cap_returns_error
        claim_type: violation_to_error
        grounds: [calculations.deposit_cap, "errors[ERR_DEPOSIT_EXCEEDS_CAP]"]
        distinguishing_aspect: "A DEPOSIT of 17029 on a QUOTED project with contract_value 170279 (cap = min(round(0.10*170279)=17028, 100000) = 17028) is rejected with ERR_DEPOSIT_EXCEEDS_CAP (422)."
        test_recipe:
          setup: ["Fresh DB. A QUOTED CA project, one 100-sqft paver line, contract_value 170279."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner DC", email: "odc@x.com" }
              as: DesignConsultant
              captures: { cust: $.data.id }
            - call: "POST /products"
              payload: { sku: "PAV-HOLLAND", name: "Holland Paver", category: "PAVER", unit: "SQFT", unit_price_cents: 850, waste_factor: 0.10, coverage_per_pallet_sqft: 120 }
              as: PlatformAdmin
              captures: { p_pav: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", site_address: "32 Yard Ln", region_code: "CA", in_hoa: false }
              as: DesignConsultant
              captures: { pid: $.data.id }
            - call: "POST /design-revisions"
              payload: { project_id: "${pid}" }
              as: DesignConsultant
              captures: { dr: $.data.id }
            - call: "POST /design-revisions/${dr}/render"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/submit-review"
              payload: {}
              as: DesignConsultant
            - call: "POST /design-revisions/${dr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cust}"
            - call: "POST /site-measurements"
              payload: { project_id: "${pid}", zone_label: "patio", measured_sqft: 100, wall_height_in: 0 }
              as: DesignConsultant
            - call: "POST /line-items"
              payload: { project_id: "${pid}", product_id: "${p_pav}", measured_quantity: 100 }
              as: DesignConsultant
            - call: "POST /projects/${pid}/generate-estimate"
              payload: {}
              as: DesignConsultant
              captures: { pv_est: $.data.version }
          trigger:
            - call: "POST /draws"
              payload: { project_id: "${pid}", draw_type: "DEPOSIT", amount_cents: 17029, expected_project_version: "${pv_est}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DEPOSIT_EXCEEDS_CAP"

      - name: sign_contract_not_owner_returns_forbidden
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_NOT_PROJECT_OWNER]"]
        distinguishing_aspect: "A Client whose X-User-ID is not Project.customer_id signing the contract is rejected with ERR_NOT_PROJECT_OWNER (403); ownership (priority 5) is checked before the state precondition (priority 6)."
        test_recipe:
          setup: ["Fresh DB. Project owned by customer A; a second customer B exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner A", email: "oa@x.com" }
              as: DesignConsultant
              captures: { custA: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Owner B", email: "ob@x.com" }
              as: DesignConsultant
              captures: { custB: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${custA}", site_address: "33 Yard Ln", region_code: "CA" }
              as: DesignConsultant
              captures: { pid: $.data.id }
          trigger:
