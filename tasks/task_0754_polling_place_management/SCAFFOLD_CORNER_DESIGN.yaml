scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: create_election_success_returns_201
        claim_type: Creation
        grounds: [entities.Election, endpoints]
        distinguishing_aspect: "POST /elections with all required fields returns 201 with a system id, version==1, and unallocated_ballot_stock initialized to initial_ballot_stock."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Election.${el_id}.version == 1"
            - "Election.${el_id}.status == PLANNING"
            - "Election.${el_id}.unallocated_ballot_stock == 10000"

      - name: get_missing_election_returns_not_found
        claim_type: Not Found
        grounds: [entities.Election, endpoints]
        distinguishing_aspect: "GET /elections/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /elections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ElectionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_place_defaults_applied
        claim_type: Defaults
        grounds: [entities.PollingPlace.fields.wheelchair_accessible, entities.PollingPlace.fields.ada_voting_stations, entities.PollingPlace.fields.slots_open]
        distinguishing_aspect: "Creating a place without accessibility fields applies defaults wheelchair_accessible=false, ada_voting_stations=0, posture=SETUP, and slots_open == staffing_capacity."
        test_recipe:
          setup: ["Election created."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
          assert:
            - "PollingPlace.${pp_id}.wheelchair_accessible == false"
            - "PollingPlace.${pp_id}.ada_voting_stations == 0"
            - "PollingPlace.${pp_id}.readiness_posture == SETUP"
            - "PollingPlace.${pp_id}.slots_open == 4"

      - name: list_places_pagination_envelope
        claim_type: Listing
        grounds: [entities.PollingPlace, endpoints]
        distinguishing_aspect: "GET /polling-places?election_id returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Election with two places."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P2", address: "2 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
          trigger:
            - call: "GET /polling-places?election_id=${el_id}"
              payload: {}
              as: ElectionAdmin
          assert:
            - "response.meta pagination total_count == 2"
            - "response.data is an array of length 2"

      - name: error_missing_required_field_create_election_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Election.fields.initial_ballot_stock, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /elections omitting required initial_ballot_stock returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03" }
              as: ElectionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: error_invalid_enum_equipment_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.EquipmentUnit.fields.equipment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /equipment with equipment_type='LASER' (not in the enum) returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /equipment"
              payload: { equipment_type: "LASER", serial_number: "SN-X" }
              as: ElectionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # ---------------- State Machines ----------------
  - section: state_machines
    instances:
      - name: election_close_voting_from_planning_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Election.VOTING_OPEN_to_VOTING_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /elections/{id}/close-voting while status is PLANNING (never opened) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Election in PLANNING."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /elections/${el_id}/close-voting"
              payload: {}
              as: ElectionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: election_reopen_after_close_returns_invalid_state_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Election.PLANNING_to_VOTING_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal VOTING_CLOSED, POST /elections/{id}/open-voting is rejected with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Election opened then closed (VOTING_CLOSED)."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /elections/${el_id}/close-voting"
              payload: {}
              as: ElectionAdmin
          trigger:
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: incident_acknowledge_twice_returns_invalid_state_idempotency
        claim_type: Idempotency
        grounds: [state_machines.Incident.OPEN_to_ACKNOWLEDGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Acknowledging an already-ACKNOWLEDGED incident a second time returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Incident opened at a place, then acknowledged once."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /incidents"
              payload: { polling_place_id: "${pp_id}", category: "STAFFING", description: "short a worker" }
              as: SupportAgent
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: SupportAgent
          trigger:
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: custody_receive_from_prepared_returns_invalid_custody_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.SupplyKit.IN_TRANSIT_to_AT_PLACE, "errors[ERR_INVALID_CUSTODY_TRANSITION]"]
        distinguishing_aspect: "A RECEIVE custody event on a kit still in PREPARED (not IN_TRANSIT) returns 422 ERR_INVALID_CUSTODY_TRANSITION."
        test_recipe:
          setup: ["A PREPARED supply kit."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE" }
              as: CustodyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_CUSTODY_TRANSITION"

  # ---------------- Calculations ----------------
  - section: calculations
    instances:
      - name: reconciliation_balanced_zero_discrepancy
        claim_type: Correct Result
        grounds: [calculations.reconciliation, entities.PollingPlace.fields.reconciliation_status]
        distinguishing_aspect: "With no accepted provisionals, scanner_tally=100 and epollbook_checkins=100 give reconciliation_discrepancy=0 and reconciliation_status=BALANCED."
        test_recipe:
          setup: ["Place opened (staffed, equipped, kit AT_PLACE), no provisionals cast, then CLOSED."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/close"
              payload: {}
              as: PrecinctCaptain
              captures: { ppv: $.data.version }
          trigger:
            - call: "POST /polling-places/${pp_id}/reconcile"
              payload: { scanner_tally: 100, epollbook_checkins: 100, spoiled_count: 0, expected_polling_place_version: "${ppv}" }
              as: PrecinctCaptain
          assert:
            - "PollingPlace.${pp_id}.reconciliation_discrepancy == 0"
            - "PollingPlace.${pp_id}.reconciliation_status == BALANCED"
            - "PollingPlace.${pp_id}.readiness_posture == RECONCILED"

      - name: reconciliation_mismatch_variant_excluded
        claim_type: Variant Divergence
        grounds: [calculations.reconciliation]
        excluded_because:
          difficulty_instance: reconciliation_machine_vs_reconciled_diverge
          rationale: "The machine-only vs reconciled-inclusive divergence and MISMATCH status are asserted by the named §1.8 dual_variant_calc instance."

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: error_insufficient_ballot_stock_on_issue
        claim_type: Violation to Error
        grounds: ["validations[priority=11]", "errors[ERR_INSUFFICIENT_BALLOT_STOCK]"]
        distinguishing_aspect: "Issuing a kit with ballot_count=500 against an election whose unallocated_ballot_stock is only 100 returns 422 ERR_INSUFFICIENT_BALLOT_STOCK."
        test_recipe:
          setup: ["Election initial_ballot_stock=100; a PREPARED kit with ballot_count=500."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 100 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_BALLOT_STOCK"

      - name: error_no_open_slots_on_activate_certified_worker
        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_NO_OPEN_SLOTS]"]
        distinguishing_aspect: "With staffing_capacity=1 already filled, activating a SECOND certified worker returns 422 ERR_NO_OPEN_SLOTS (certification passes; the slot constraint fails) — isolating the constraint from the referential check."
        test_recipe:
          setup: ["Place staffing_capacity=1; first certified worker activated (slots_open=0); second certified worker with a PROPOSED assignment."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 1, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "W1", email: "w1@x.com" }
              as: ElectionAdmin
              captures: { w1: $.data.id }
            - call: "POST /poll-workers/${w1}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w1}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /poll-workers"
              payload: { full_name: "W2", email: "w2@x.com" }
              as: ElectionAdmin
              captures: { w2: $.data.id }
            - call: "POST /poll-workers/${w2}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w2}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /assignments/${a2}/activate"
              payload: {}
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NO_OPEN_SLOTS"

      - name: error_voting_not_open_on_open_place
        claim_type: Violation to Error
        grounds: ["validations[priority=4.5]", "errors[ERR_VOTING_NOT_OPEN]"]
        distinguishing_aspect: "Opening a place whose election is still in PLANNING (open-voting never called) returns 409 ERR_VOTING_NOT_OPEN before any staffing/equipment check."
        test_recipe:
          setup: ["Election in PLANNING; a place under it in SETUP."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VOTING_NOT_OPEN"

      - name: error_provisional_cast_when_place_not_open
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4.5]", "errors[ERR_VOTING_NOT_OPEN]", entities.ProvisionalBallot]
        distinguishing_aspect: "Casting a provisional ballot at a place still in SETUP (never opened) returns 409 ERR_VOTING_NOT_OPEN."
        test_recipe:
          setup: ["Election VOTING_OPEN; a place in SETUP."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V1", reason: "NO_ID" }
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VOTING_NOT_OPEN"

      - name: error_shift_end_before_start_returns_invalid_request
        claim_type: Violation to Error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shifts with scheduled_end <= scheduled_start returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Certified worker on an ACTIVE assignment at a place."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "W1", email: "w1@x.com" }
              as: ElectionAdmin
              captures: { w1: $.data.id }
            - call: "POST /poll-workers/${w1}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w1}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/activate"
              payload: {}
              as: PrecinctCaptain
          trigger:
            - call: "POST /shifts"
              payload: { assignment_id: "${a1}", scheduled_start: "2026-11-03T12:00:00Z", scheduled_end: "2026-11-03T09:00:00Z" }
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

  # ---------------- Errors (remaining triggerability) ----------------
  - section: errors
    instances:
      - name: reconcile_stale_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[reconcile-stale-place]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first reconcile advances PollingPlace.version, a second reconcile carrying the pre-advance expected_polling_place_version is rejected 412 ERR_STALE_VERSION (re-runnable endpoint, OCC-guarded)."
        test_recipe:
          setup: ["Place opened then CLOSED; version captured at close; first reconcile succeeds and advances version."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/close"
              payload: {}
              as: PrecinctCaptain
              captures: { ppv: $.data.version }
            - call: "POST /polling-places/${pp_id}/reconcile"
              payload: { scanner_tally: 100, epollbook_checkins: 100, spoiled_count: 0, expected_polling_place_version: "${ppv}" }
              as: PrecinctCaptain
          trigger:
            - call: "POST /polling-places/${pp_id}/reconcile"
              payload: { scanner_tally: 101, epollbook_checkins: 100, spoiled_count: 0, expected_polling_place_version: "${ppv}" }
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

  # ---------------- RBAC ----------------
  - section: rbac
    instances:
      - name: poll_worker_cannot_create_election_unauthorized
        claim_type: Role Restriction
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A PollWorker calling POST /elections (an ElectionAdmin-exclusive op) is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: PollWorker
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: support_agent_cannot_open_place_unauthorized
        claim_type: Role Restriction
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A SupportAgent calling POST /polling-places/{id}/open (PrecinctCaptain-exclusive) is rejected 403 ERR_UNAUTHORIZED before any state check."
        test_recipe:
          setup: ["An election and a place exist."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: unauthenticated_request_returns_401
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/absent role header (as: Anonymous) is rejected 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ---------------- Endpoints ----------------
  - section: endpoints
    instances:
      - name: custody_events_audit_log_reverse_reachable
        claim_type: Computed read
        grounds: [entities.CustodyEvent, endpoints]
        distinguishing_aspect: "GET /supply-kits/{id}/custody-events returns the append-only chain-of-custody log; after ISSUE, DISPATCH, RECEIVE it contains exactly 3 events."
        test_recipe:
          setup: ["A kit taken PREPARED -> ISSUED -> IN_TRANSIT -> AT_PLACE."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
          trigger:
            - call: "GET /supply-kits/${kit_id}/custody-events"
              payload: {}
              as: CustodyOfficer
          assert:
            - "response.data is an array of length 3"
            - "response.meta pagination total_count == 3"

      - name: provisional_cast_increments_cast_count
        claim_type: Side Effect Execution
        grounds: [entities.PollingPlace.fields.provisional_cast_count, endpoints]
        distinguishing_aspect: "Casting one provisional at an OPEN place increments provisional_cast_count to 1 while provisional_accepted_count stays 0 until adjudication."
        test_recipe:
          setup: ["Place OPEN (staffed, equipped, kit AT_PLACE)."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
          trigger:
            - call: "POST /provisional-ballots"
              payload: { polling_place_id: "${pp_id}", voter_name: "V1", reason: "NO_ID" }
              as: PrecinctCaptain
          assert:
            - "PollingPlace.${pp_id}.provisional_cast_count == 1"
            - "PollingPlace.${pp_id}.provisional_accepted_count == 0"

  # ---------------- Cross-Cutting Layers (stubs already covered by §1.8) ----------------
  - section: cross_cutting
    instances:
      - name: ballot_stock_debit_on_issue_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.Election.fields.unallocated_ballot_stock]
        excluded_because:
          difficulty_instance: ballot_stock_conserved_on_issue_then_void
          rationale: "The ISSUE debit of unallocated_ballot_stock and its VOID_ISSUE credit are asserted by the named §1.8 compensating_invariant instance."
      - name: staffing_slot_fill_on_activate_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.PollingPlace.fields.slots_filled]
        excluded_because:
          difficulty_instance: staffing_slots_conserved_on_activate_then_withdraw
          rationale: "slots_filled/slots_open updates on activate and withdraw are asserted by the named §1.8 compensating_invariant instance."
      - name: overtime_threshold_boundary_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.shift_pay]
        excluded_because:
          difficulty_instance: overtime_gt_eight_hours_boundary
          rationale: "The >8.0h overtime boundary is asserted by the named §1.8 boundary_precision_check instance."
      - name: equipment_cascade_out_of_service_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.EquipmentUnit.OPERATIONAL_to_OUT_OF_SERVICE]
        excluded_because:
          difficulty_instance: incident_escalate_cascades_equipment_place_depth2
          rationale: "Incident escalate -> equipment OUT_OF_SERVICE -> place SUSPENDED is asserted by the named §1.8 transitive_cascade instance."
      - name: place_close_cascade_checkout_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.PollingPlace.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: election_close_cascades_place_shift_payroll_depth3
          rationale: "Place close auto-checking-out shifts and accruing payroll is asserted by the named §1.8 transitive_cascade instance."

  # ---------------- Consistency Model ----------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_slots_visible_in_response
        claim_type: immediate
        grounds: [entities.PollingPlace.fields.slots_filled]
        distinguishing_aspect: "Activating an assignment reflects slots_filled=1 and slots_open decremented immediately in the same place read (no eventual lag)."
        test_recipe:
          setup: ["Place staffing_capacity=4; certified worker with a PROPOSED assignment."]
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "P1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 4, station_capacity: 3 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "W1", email: "w1@x.com" }
              as: ElectionAdmin
              captures: { w1: $.data.id }
            - call: "POST /poll-workers/${w1}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w1}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/activate"
              payload: {}
              as: PrecinctCaptain
          trigger:
            - call: "GET /polling-places/${pp_id}"
              payload: {}
              as: PrecinctCaptain
          assert:
            - "PollingPlace.${pp_id}.slots_filled == 1"
            - "PollingPlace.${pp_id}.slots_open == 3"
