          - errors.ERR_APPOINTMENT_NOT_SCHEDULED
          - errors.ERR_INSPECTION_ALREADY_COMPLETED
          - errors.ERR_INSPECTION_EXPIRED
        distinguishing_aspect: "A copies_requested request over one 40-page ACADEMIC component is assessed 325 cents (round_half_up(40 x 7.5) = 300, then round_half_up(300 x 1.0825) = 325, tier 0 because 325 < 2000): attendance before payment returns ERR_FEE_OUTSTANDING / 422, after payment it completes, a further appointment returns ERR_INSPECTION_ALREADY_COMPLETED, re-attending the ATTENDED appointment returns ERR_APPOINTMENT_NOT_SCHEDULED, and a second student's request swept to EXPIRED returns ERR_INSPECTION_EXPIRED — four distinct 409/422 codes off one lifecycle."
