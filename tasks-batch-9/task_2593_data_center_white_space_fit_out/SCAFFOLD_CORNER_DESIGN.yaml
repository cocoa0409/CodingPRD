          setup: "Multi-tenant hall CX78 in FIT_OUT with full electrical/mechanical topology (both PDUs commissioned, BW-A1/BW-B1 ENERGIZED, zone CA-1 PASS at 5.00 percent, CU-1 200.00 kW / 22000 CFM / 18.0 F IN_SERVICE). Tenant TN78 is contracted for 100.00 kW. Cage CG-1 (perimeter 40.0 m) holds no racks. Cage CG-2 (perimeter 40.0 m) holds rack R-1-2 (design 15.00 kW, two feeds) POWERED but with NO asset_tag and no security devices. A DRAFT packet exists for each cage."
