      - name: usage_record_may_fill_the_reservation_exactly_but_not_exceed_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
          - calculations.feed_session_billing
          - entities.FeedSession.fields.metered_units
          - errors[ERR_SESSION_RESERVATION_EXCEEDED]
        distinguishing_aspect: |
          The reservation ceiling is inclusive and cumulative. Against reserved_units 900, a 1830-second
          sample priced at ceil(20 * 30.5 * 1.50) = 915 is refused; a 1800-second sample priced at exactly
          900 is accepted; and a further 60-second sample worth 30 units is then refused because the
          comparison is metered_units + units_charged, not units_charged alone. Falsified by a per-record
          check or by a strict inequality at equality.
