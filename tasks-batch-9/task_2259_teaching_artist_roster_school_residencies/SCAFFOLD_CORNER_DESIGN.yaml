            - "${e_reviews} == ERR_INSUFFICIENT_PORTFOLIO_REVIEWS with HTTP status 422 (1 < PORTFOLIO_MIN_REVIEWS 2)"
            - "${c2} == 3.40 and ${mean2} == 3.40 with ${count2} == 2"
            - "${e_threshold} == ERR_PORTFOLIO_THRESHOLD_NOT_MET with HTTP status 422 (3.40 < 3.50)"
