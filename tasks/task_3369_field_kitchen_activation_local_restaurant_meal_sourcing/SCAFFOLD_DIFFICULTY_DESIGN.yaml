      - name: distribution_run_reload_cycle_returns_to_en_route
        grounds:
          - state_machines.DistributionRun.DELIVERING_to_EN_ROUTE
          - state_machines.DistributionRun.EN_ROUTE_to_DELIVERING
          - state_machines.DistributionRun.DELIVERING_to_COMPLETED
          - entities.DistributionRun.fields.returned_meals
        distinguishing_aspect: |
          DistributionRun cycles EN_ROUTE -> DELIVERING -> EN_ROUTE -> DELIVERING -> COMPLETED rather than
          running a straight pipeline, and the back edge is guarded: it is legal only while returned_meals
          is above zero and at least one stop is still PENDING, so a run whose stops are all terminal can
          never re-enter EN_ROUTE.
