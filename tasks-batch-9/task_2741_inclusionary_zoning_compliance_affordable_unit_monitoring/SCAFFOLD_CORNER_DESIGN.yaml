      - name: the_comparability_floor_applies_the_eighty_percent_constant
        claim_type: constants_applied
        grounds:
          - calculations.unit_mix_compliance
          - validations.priority_24
          - errors[ERR_COMPARABILITY_STANDARD_FAILED]
        distinguishing_aspect: |
          COMPARABILITY_MIN_BPS is 8000, so the floor for a 1000 sqft market comparable is
          exactly 800 sqft and the comparison is unit.sqft < min_sqft — 800 passes and 799 is
          refused with ERR_COMPARABILITY_STANDARD_FAILED. The floor is recomputed per unit from
          that unit's own market_comparable_sqft, so a 560 sqft unit passes against a 700 sqft
          comparable in the same project while the 799 sqft unit fails against its 1000 sqft one.
