            - call: "POST /pump-checklists/${chk1}/verify"
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/start-bypass"
              as: Perfusionist
              as_user_id: "${p1}"
            - call: "POST /bypass-cases/${case1}/ecmo-runs"
              payload: { mode: "VA" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { run1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: ContractAdmin
          trigger:
            - call: "POST /bypass-cases/${case1}/ecmo-runs"
              payload: { mode: "VV" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { e_breach: $.data.error_id }
          assert:
            - "before the trigger EcmoRun.${run1}.status == RELIEF_PENDING with uninterrupted_minutes == 720 and staffing_breach == true - the clock advance drove RUNNING -> RELIEF_PENDING at the 600-minute warning and the breach flag at 720"
            - "EcmoRun.${run1}.version == 2 - creation wrote version 1 and the clock-driven transition incremented it once"
            - "${e_breach} == ERR_ECMO_STAFFING_BREACH with HTTP 409 - priority 52 outranks nothing here but is reached only because p1 is assigned, the case is ON_BYPASS and p1 is ECMO-privileged"
            - "GET /ecmo-runs returns total_count == 1 - the refused run wrote no row"
            - "EcmoRun.${run1}.primary_perfusionist_id == ${p1} with relief_slot_id == null, decannulated_at == null and ecmo_fee_cents == 0"
            - "BypassCase.${case1}.bypass_status is still ON_BYPASS"

