            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["SIDE"], required_detail_shots: 1, min_on_model_shots: 2, video_required: true, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
