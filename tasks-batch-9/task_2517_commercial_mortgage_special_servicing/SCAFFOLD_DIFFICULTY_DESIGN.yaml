  - rule_id: priority_pair_validation_conflict
    instances:
      - name: loan_state_gate_outranks_deposit_floor_on_request_intake
        grounds:
          - validations[priority=12]
          - validations[priority=26]
          - calculations.request_deposit_floor
          - errors.ERR_LOAN_NOT_IN_SPECIAL_SERVICING
          - errors.ERR_DEPOSIT_BELOW_MINIMUM
        distinguishing_aspect: |
          Category pair: state (priority 12) versus business_fiscal (priority 26). A modification
          request on a loan still with the master servicer AND carrying a 1,000.00 deposit against a
          25,000.00 floor violates both rules; the response must be
          ERR_LOAN_NOT_IN_SPECIAL_SERVICING (409), never ERR_DEPOSIT_BELOW_MINIMUM (402). Both
          single-violation controls are exercised so the ordering cannot be explained by one rule
          simply being unimplemented.
        test_recipe:
          setup:
            - "One trust. Loan M left in servicing_status MASTER_SERVICING; loan S transferred to SPECIAL_SERVICING on a bankruptcy event."
            - "No borrower requests exist yet."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-Q1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-Q0M", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_m_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-Q0S", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_s_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_s_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_s_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
          trigger:
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_m_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 1000, requested_terms_note: "both rules violated at once" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { both_violated_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_m_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "only the loan state is wrong" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { state_only_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_s_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 1000, requested_terms_note: "only the deposit is short" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { deposit_only_error: "$.data.error_id" }
          assert:
            - "Call 1 returns HTTP 409 with error_id ERR_LOAN_NOT_IN_SPECIAL_SERVICING — priority 12 wins over priority 26"
            - "Call 2 returns HTTP 409 with error_id ERR_LOAN_NOT_IN_SPECIAL_SERVICING"
            - "Call 3 returns HTTP 402 with error_id ERR_DEPOSIT_BELOW_MINIMUM, proving the deposit floor is implemented and simply outranked in call 1"
            - "No BorrowerRequest row exists on either loan after the three calls"

      - name: alternative_reference_mismatch_outranks_servicing_standard_on_recommendation
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.WorkoutPlan.SCORED_to_RECOMMENDED
          - errors.ERR_SUBJECT_REFERENCE_MISMATCH
          - errors.ERR_SERVICING_STANDARD_VIOLATION
        distinguishing_aspect: |
          Category pair: business_referential (priority 7) versus business_safety (priority 14).
          Naming another plan's alternative as selected_alternative_id violates both — the alternative
          does not belong to this plan AND it is not this plan's recommended_alternative_id — and the
          response must be ERR_SUBJECT_REFERENCE_MISMATCH (422). The control shows the standalone
          servicing-standard breach: selecting this plan's own rank-2 NOTE_SALE alternative
          (8,220,502.28) instead of its rank-1 MODIFICATION (8,221,266.34) returns
          ERR_SERVICING_STANDARD_VIOLATION.
        test_recipe:
          setup:
            - "One trust with two loans, both transferred to special servicing."
            - "Plan A on loan A with a single MODIFICATION alternative; plan B on loan B with a MODIFICATION alternative and a NOTE_SALE alternative whose NPVs differ by 764.06."
