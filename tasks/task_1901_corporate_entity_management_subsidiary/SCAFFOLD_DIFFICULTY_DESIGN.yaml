              captures: { e2: "$.data.id", e2_v: "$.data.version" }
            - call: "POST /api/entities/${e2}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e2}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { re2: "$.data.id" }
            - call: "POST /api/resolutions/${re2}/submit"
