  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_settle_conserves_outstanding_balance
        grounds:
          - state_machines.FeeCharge.PENDING_to_SETTLED
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - entities.Customer.fields.outstanding_fee_cents
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = money: invariant Customer.outstanding_fee_cents == sum of PENDING
          FeeCharge.amount_cents. A NO_SHOW debits 3000 (outstanding 3000), then SETTLE credits the
          same 3000 back, returning outstanding to 0 — forward + compensating action leaves the named
          money invariant exactly restored.
        test_recipe:
          setup:
            - "A customer with one NO_SHOW FeeCharge of 3000 PENDING; outstanding_fee_cents == 3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-tiers"
              payload: { code: "FULL_GROOM", base_price_cents: 6000, duration_multiplier: 1.00 }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /breeds"
              payload: { name: "Pointer", coat_type: "SMOOTH", size_class: "MEDIUM", base_service_minutes: 50 }
              as: PlatformAdmin
              captures: { breed_id: $.data.id }
            - call: "POST /groomers"
              payload: { email: "g14@x.com", full_name: "G Fourteen", skill_level: "SENIOR", handles_aggressive: true, status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { groomer_id: $.data.id }
            - call: "POST /vans"
              payload: { label: "VAN-12", max_stops: 5 }
              as: PlatformAdmin
              captures: { van_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen", service_zip: "90017" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Jet", weight_lbs: 40 }
              as: Customer
              as_user_id: "${cust_id}"
