          - entities.InventoryLot.fields.quantity_on_hand
          - calculations.fefo_lot_allocation
        distinguishing_aspect: |
          Conserved quantity = physical units: for any lot, received ==
          on_hand + reserved + shipped + dispensed + quarantined; the forward
          action (reserve 10) paired with its compensating action (cancel)
          returns every bucket to its pre-reserve value with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-05-01; program + period; patient approved; lot LOT-INV 100 units @ '100.0000' expiry 2027-01-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Xia Xiong", date_of_birth: "1994-07-07", state_code: "MN" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 3000000, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-x.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dx1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-x.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dx2: $.data.id }
            - call: "POST /pap/documents/${dx1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${dx2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
            - call: "POST /pap/applications"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", screening_id: "${scr_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { app_id: $.data.id }
            - call: "POST /pap/applications/${app_id}/claim"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /pap/applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures: { enr_id: $.data.enrollment_id }
            - call: "POST /pap/inventory-lots"
              payload: { program_id: "${prog_id}", lot_number: "LOT-INV", quantity_received: 100, unit_cost_per_unit: "100.0000", expiry_date: "2027-01-01" }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /pap/shipments"
              payload: { enrollment_id: "${enr_id}", quantity_units: 10, destination: "PATIENT", idempotency_key: "ship-inv1" }
              as: CaseWorker
              captures: { shp_id: $.data.id }
            - call: "GET /pap/inventory-lots/${lot_id}"
              payload: {}
              as: CaseWorker
              captures: { on_mid: $.data.quantity_on_hand, res_mid: $.data.quantity_reserved }
            - call: "POST /pap/shipments/${shp_id}/cancel"
              payload: { reason: "patient declined" }
              as: CaseWorker
            - call: "GET /pap/inventory-lots/${lot_id}"
              payload: {}
              as: CaseWorker
              captures: { on_end: $.data.quantity_on_hand, res_end: $.data.quantity_reserved, ship_end: $.data.quantity_shipped, disp_end: $.data.quantity_dispensed, quar_end: $.data.quantity_quarantined }
            - call: "GET /pap/enrollments/${enr_id}"
              payload: {}
              as: CaseWorker
              captures: { units_end: $.data.remaining_units }
          assert:
            - "after reserve: quantity_on_hand == 90 and quantity_reserved == 10 (sum with shipped/dispensed/quarantined = 100 == received)"
            - "after compensating cancel: quantity_on_hand == 100, quantity_reserved == 0, quantity_shipped == 0, quantity_dispensed == 0, quantity_quarantined == 0 (received == 100 conserved, no drift)"
            - "Enrollment.${enr_id}.remaining_units == 100 after cancel (unit commitment restored)"

