              captures: { bgbf_id: $.data.id }
          trigger:
            - call: "POST /api/v1/background-checks/${bgbf_id}/flag"
              payload: { flagged_reason: "verification failed" }
              as: PlatformAdmin
              captures: { bgbf_status: $.data.status }
            - call: "GET /api/v1/sitters/${sbf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sbf_status_post: $.data.status }
          assert:
            - "BackgroundCheck.${bgbf_id}.status == FLAGGED  # link 1"
            - "Sitter.${sbf_id}.status == SUSPENDED  # link 2 — caused by BG flag, applies because Sitter was BG_CHECK_PENDING"
            - "Sitter.${sbf_id}.suspended_at != null"

