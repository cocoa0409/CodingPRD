              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Aqua Nails", establishment_type: "NAIL_SALON", county_code: "NCC", station_capacity: 6 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "NAIL_TABLE" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER_INDEPENDENT_CONTRACTOR", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 90000, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_id: $.data.id }
            - call: "POST /cosmetology/workstations/${ws_id}/posting"
              payload: { posted_practitioner_id: "${prac_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/booth-rentals/${rental_id}/activation"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/sanitation-logs"
              payload: { workstation_id: "${ws_id}", log_type: "IMPLEMENT_DISINFECTION", performed_at: "2026-08-01T09:00:00Z", contact_minutes: 10, disinfectant_epa_reg_number: "EPA-88494-1", implement_batch_count: 12 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { log_ok_id: $.data.id }
            - call: "POST /cosmetology/sanitation-logs"
              payload: { workstation_id: "${ws_id}", log_type: "IMPLEMENT_DISINFECTION", performed_at: "2026-08-01T11:00:00Z", contact_minutes: 9, disinfectant_epa_reg_number: "EPA-88494-1", implement_batch_count: 12 }
              as: Practitioner
              as_user_id: "${prac_id}"
          assert:
            - "Workstation.${ws_id}.posting_status == COMPLIANT"
            - "the first sanitation-log call returns HTTP 201"
            - "SanitationLog.${log_ok_id}.contact_minutes == 10.00"
            - "SanitationLog.${log_ok_id}.occupancy_end_at == 2026-08-01T09:10:00.000Z"
            - "the second sanitation-log call returns HTTP 422 with data.error_id == ERR_DISINFECTANT_CONTACT_TIME_INSUFFICIENT"
            - "GET /cosmetology/workstations/${ws_id}/sanitation-logs returns total_count == 1"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: booth_rental_activation_gated_on_practitioner_license_status
        grounds:
          - state_machines.BoothRental.PROPOSED_to_ACTIVE
          - state_machines.Practitioner.ACTIVE_to_PROBATION
          - state_machines.Practitioner.PROBATION_to_ACTIVE
          - validations.priority_32.ERR_PRACTITIONER_LICENSE_NOT_ACTIVE
          - calculations.workstation_posting_status
        distinguishing_aspect: |
          Entity pair BoothRental x Practitioner: the rental's own status is a perfectly legal
          PROPOSED throughout, so nothing about the rental explains the refusal - only the
          collaborating Practitioner's license_status does. PROBATION is deliberately chosen because
          it is permitted for termination and finding attribution but NOT for activation, so an
          implementation that treats "not suspended" as "active" wrongly activates. The same call
          then succeeds unchanged after REINSTATE, proving the gate is the other entity's state.
        test_recipe:
          setup:
            - "One school 'Lakeside Institute' with required_clock_hours 16.0."
            - "One practitioner 'Noor Haddad' (COSMETOLOGIST) credited with 16.00 school hours and issued an ACTIVE licence effective 2026-08-01T00:00:00Z."
            - "One establishment 'Cedar Studio' (PENDING_INSPECTION, posture CLEAR) with STYLING_CHAIR workstation number 1."
            - "One PROPOSED booth rental links Noor Haddad to that workstation, and she is its posted practitioner."
            - "Noor Haddad is then placed on PROBATION, which does not touch the PROPOSED rental."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Lakeside Institute", county_code: "NCJ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Noor Haddad", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "THEORY", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "PRACTICAL", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "reg-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
