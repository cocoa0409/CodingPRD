              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${err} == ERR_FORBIDDEN_ROLE"
            - "${err} != ERR_NOT_RESOURCE_OWNER — priority 2 answers before priority 5, even though this Applicant does own the licence"
            - "GET /complaints filtered by license_id ${lic_id} returns total_count 0"
            - "GET /licenses/${lic_id} still reports encumbrance_status CLEAR"

