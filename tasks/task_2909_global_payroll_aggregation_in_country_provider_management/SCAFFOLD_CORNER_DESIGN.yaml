              payload: { cycle_id: "${c1}", status: "PENDING" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { f1: "$.data[0].id" }
          trigger:
            - call: "POST /payroll/filings/${f1}/file"
              payload: { submission_ref: "DE-SUB-0001" }
              as: ProviderUser
              as_user_id: "${prov_p1}"
          assert:
            - "HTTP 200"
            - "StatutoryFiling.${f1}.status == FILED and filed_at == 2026-09-05T10:00:00.000Z"
            - "StatutoryFiling.${f1}.submission_ref == DE-SUB-0001 and penalty_status == NONE"
            - "CountryProfile.${cp_de}.open_filing_obligation_count == 1"
            - "a follow-up POST /payroll/filings/${f1}/confirm with confirmation_ref DE-CONF-0001 leaves open_filing_obligation_count at 1 and sets PayrollCycle.${c1}.filings_confirmed_count == 1"
            - "no CTRL_FILING_CONFIRMATION evidence exists yet because the second filing is still PENDING"

      - name: cyclic_shape_of_the_gross_to_net_run_machine
        claim_type: cyclic
        grounds:
          - state_machines.GrossToNetRun.RETURNED_to_SUBMITTED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: gtn_run_returned_then_resubmitted_reenters_cleared
          rationale: "That §1.8 instance already drives the full loop SUBMITTED -> ESCALATED -> RETURNED -> SUBMITTED -> CLEARED on one run and asserts the recomputed variance on re-entry, which is exactly the cyclic-shape claim."

      - name: parallel_state_dimensions_of_a_statutory_filing
        claim_type: parallel
        grounds:
          - state_machines.StatutoryFiling.status
          - state_machines.StatutoryFiling.penalty_status
        excluded_because:
          difficulty_instance: filing_penalty_dimension_cycles_disputed_back_to_assessed
          rationale: "That §1.8 instance moves the penalty_status dimension ASSESSED -> DISPUTED -> ASSESSED while pinning the status dimension at LATE, which is precisely the independent-dimension claim for this machine."

      - name: guarded_transition_on_engagement_transition_completion
        claim_type: guarded_transitions
        grounds:
          - state_machines.Engagement.TRANSITION_IN_PROGRESS_to_ACTIVE.preconditions
          - errors.ERR_CYCLE_INVALID_STATE
        excluded_because:
          difficulty_instance: transition_completion_gated_by_live_payroll_cycle_state
          rationale: "That §1.8 instance is the cross-entity guard: the engagement is TRANSITION_IN_PROGRESS with knowledge transfer confirmed and is still blocked because a PayrollCycle of the engagement is INPUTS_LOCKED."

      - name: cascade_down_from_provider_health_to_cycles
        claim_type: cascade_down
        grounds:
          - state_machines.Provider.ACTIVE_to_PROBATION.side_effects
          - state_machines.Engagement.ACTIVE_to_REMEDIATION_REQUIRED
        excluded_because:
          difficulty_instance: incident_confirmation_cascades_score_to_provider_engagement_and_cycle
          rationale: "That §1.8 instance already walks the three-level cascade incident -> provider score/status -> engagement -> DRAFT cycle ON_HOLD end to end in one trigger."

      - name: compensation_of_a_released_funding_instruction
        claim_type: compensation
        grounds:
          - state_machines.FundingInstruction.RELEASED_to_RECALLED.side_effects
          - calculations.treasury_commitment_reconciliation
        excluded_because:
          difficulty_instance: funding_recall_restores_engagement_treasury_commitment
          rationale: "That §1.8 instance asserts every reversed side effect of the recall - treasury_committed_minor and funded_total_minor back to 0, the cycle back to RESULTS_APPROVED and the retained dual-authorisation evidence - with no drift."

  - section: calculations
