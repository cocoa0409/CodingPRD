            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
          assert:
            - "201 with status == 'SCHEDULED' (the status axis initial_state) AND compliance_status == 'TRAINING_PENDING' (the compliance axis initial_state) in the same response"
            - "the money axis also starts at its declared origin: stipend_basis == 'PROVISIONAL' and stipend_total_cents == 0, so creating a residency commits nothing"
            - "nothing schedule-derived exists yet: session_start_date, session_end_date, session_length_weeks and actual_weeks_in_residence are all null, and GET /obligations?residency_id=${res} returns total_count == 0"
            - "discipline_code == 'SCULPT' was copied from the named Discipline rather than supplied by the caller"
            - "the domestic applicant yields visa_required == false and tax_form_type == 'W9', and GET /visa-cases?residency_id=${res} returns total_count == 0"
            - "the cycle-side side effect ran: GET /cycles/${cyc} shows slots_filled_count == 1 and slots_open_count == 9, while stipend_committed_cents is still 0"
            - "a residency cannot be created in either forbidden stage: on a DRAFT cycle the same call returns 409 ERR_CYCLE_STAGE_INVALID, and on a CLOSED cycle it returns 409 ERR_CYCLE_STAGE_INVALID"

      - name: completed_residency_refuses_every_further_action_on_both_axes
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Residency.status.terminal_states", "errors[ERR_RESIDENCY_STATE_INVALID]", "validations[priority 27]"]
        distinguishing_aspect: "COMPLETED is terminal on the status axis, and the lockdown must extend to the OTHER axis too: the compliance machine's SUSPEND edge is guarded by 'Residency.status IN {SCHEDULED, IN_RESIDENCE}', so a completed residency also freezes compliance - a parallel-axis machine could plausibly leave the second axis live."
        test_recipe:
