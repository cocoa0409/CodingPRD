          - rbac.roles.CommunityLiaison
          - rbac.roles.MeteorologyAnalyst
          - rbac.roles.FieldPatrolSupervisor
        distinguishing_aspect: "The event lifecycle is split across four roles by design — the duty officer owns every event transition and re-energization, the liaison owns notification and resource centres, the meteorologist alone may call the all-clear, and the patrol supervisor owns assignments and findings — and the whole cycle completes without a single role reaching outside its own list."
