          - entities.Driver.fields.status
        distinguishing_aspect: "On the Driver resource the intervals are half-open, so a block beginning at exactly the instant an assigned trip window ends is ACCEPTED, while a block beginning ten minutes earlier is refused. The identical touching pair is a rejection on the Rider resource below."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, moved to 2026-09-10T06:00:00Z."
            - "A vetted ACTIVE driver holding one accepted trip on 2026-09-11 with a 07:30:00Z-07:50:00Z window, so trip_state reads DRIVER_EN_ROUTE and driver_id is set."
          setup_api_calls:
            - *A_clock
            - *A_dist
