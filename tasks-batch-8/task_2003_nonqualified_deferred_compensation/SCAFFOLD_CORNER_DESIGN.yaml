      - name: trust_funding_target_and_cic_exact_amount
        claim_type: threshold
        grounds: ["calculations.rabbi_trust_funding_requirement", "entities.RabbiTrust.fields.posture", "errors[ERR_CIC_FUNDING_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Trust posture boundaries with exact-equality CIC funding: liability 1000000 -> target 1000000 at 10000 bp; 400000 contributed -> UNDERFUNDED (required 600000); +600000 -> assets == target -> FUNDED (>= inclusive). After CIC verification the target basis jumps to 12500 bp, required_funding becomes exactly 250000, and a CIC_MANDATORY_FUNDING of 249999 is rejected while 250000 is accepted."
        test_recipe:
          setup: ["ACTIVE plan; vested participant (hire 2023-01-02) with 1000000 settled cents; rabbi trust at funding_target_bp 10000"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan TF", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION", "CHANGE_IN_CONTROL"], officer_comp_threshold_cents: 20000000, rabbi_trust_required: true, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-TF", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 1000000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/rabbi-trusts"
              payload: { plan_id: "${plan_id}", funding_target_bp: 10000 }
              as: PlanSponsor
              captures: { trust_id: $.data.id, posture0: $.data.posture }
          trigger:
            - call: "POST /api/rabbi-trusts/${trust_id}/funding-events"
              payload: { event_type: "CONTRIBUTION", amount_cents: 400000 }
              as: TrustOfficer
              captures: { posture1: $.data.posture, required1: $.data.required_funding_cents }
            - call: "POST /api/rabbi-trusts/${trust_id}/funding-events"
              payload: { event_type: "CONTRIBUTION", amount_cents: 600000 }
              as: TrustOfficer
              captures: { posture2: $.data.posture, required2: $.data.required_funding_cents }
            - call: "POST /api/change-in-control-events"
              payload: { plan_id: "${plan_id}", event_type: "OWNERSHIP_CHANGE", effective_date: "2027-02-01", stake_change_bp: 5000 }
              as: PlanSponsor
              captures: { cic_id: $.data.id }
            - call: "POST /api/change-in-control-events/${cic_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "GET /api/rabbi-trusts/${trust_id}"
              as: TrustOfficer
              captures: { required3: $.data.required_funding_cents, cic_flag: $.data.cic_funding_required }
            - call: "POST /api/rabbi-trusts/${trust_id}/funding-events"
              payload: { event_type: "CIC_MANDATORY_FUNDING", amount_cents: 249999 }
              as: TrustOfficer
              captures: { cic_err: $.data.error_id }
            - call: "POST /api/rabbi-trusts/${trust_id}/funding-events"
              payload: { event_type: "CIC_MANDATORY_FUNDING", amount_cents: 250000 }
              as: TrustOfficer
              captures: { assets4: $.data.assets_cents, posture4: $.data.posture, required4: $.data.required_funding_cents }
          assert:
            - "${posture0} == UNFUNDED (assets 0)"
            - "${posture1} == UNDERFUNDED and ${required1} == 600000 (target 1000000 - 400000)"
            - "${posture2} == FUNDED and ${required2} == 0 (assets 1000000 == target, inclusive boundary)"
            - "${cic_flag} == true and ${required3} == 250000 (ceil(1000000*12500/10000) - 1000000)"
            - "${cic_err} == ERR_CIC_FUNDING_AMOUNT_MISMATCH (249999 != 250000; exact equality required)"
            - "${assets4} == 1250000 and ${posture4} == FUNDED and ${required4} == 0"
