              captures: { veh1: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles/${veh1}/begin-diligence"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
            - call: "GET /fof/vehicles/${veh1}/dd-reviews"
              payload: {}
