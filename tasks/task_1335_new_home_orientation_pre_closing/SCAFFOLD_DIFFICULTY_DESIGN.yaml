  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_state_priority_over_fiscal_on_terminal_escrow
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - state_machines.EscrowHoldback.ACTIVE_to_FULLY_RELEASED
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): on a FULLY_RELEASED escrow
          a second release violates BOTH the state gate (terminal, p7) and the
          fiscal gate (releasable == 0, p11); the state error
          ERR_INVALID_STATE must win. Distinct pair from
          scheduling_window_priority_over_rep_conflict
          (business_temporal vs business_constraint).
        test_recipe:
          setup:
            - "Community multiplier 2.0, min 1000; home h1 CLOSED with escrow funded 40000 (one WARRANTABLE 20000 AFTER_CLOSING item)"
            - "Item repaired, reinspected PASS post-close, signed off; first release flushes remaining to 0 -> escrow FULLY_RELEASED"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend", holdback_cost_multiplier: 2.0, holdback_min_cents: 1000, holdback_max_cents: 10000000 }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
