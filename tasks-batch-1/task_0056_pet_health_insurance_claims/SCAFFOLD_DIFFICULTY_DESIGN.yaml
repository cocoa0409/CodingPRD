  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_restores_policy_year_reimbursed
        grounds:
          - state_machines.Claim.APPROVED_to_DENIED
          - entities.PolicyYear.fields.reimbursed_cents
        distinguishing_aspect: |
          Conserved quantity PolicyYear.reimbursed_cents: approving then reversing a single claim must leave
          reimbursed_cents back at 0 (== pre-approval value), with no drift.
        test_recipe:
          setup:
            - "ACTIVE policy, OPEN year. One ILLNESS claim eligible 40000c approved (deductible 25000 met, reimbursed 12000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
