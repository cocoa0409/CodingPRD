            - call: "POST /ipa/downstream-claims/${clm_v11}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 10000 }
              as: ClaimsExaminer
              captures: { clm_v11_status: "$.data.status", clm_v11_allowed: "$.data.allowed_cents" }
          assert:
