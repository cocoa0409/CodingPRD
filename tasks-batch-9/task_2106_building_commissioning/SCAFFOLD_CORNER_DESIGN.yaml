              as_user_id: "u-shared-2"
              captures: { deliverer: $.data.delivered_by_user_id }
          trigger:
            - call: "POST /closeout-deliverables/${d1}/accept"
              payload: { attestation_note: "Self accepted" }
              as: CxAuthority
              as_user_id: "u-shared-2"
              captures: { err: $.data.error_id }
            - call: "POST /closeout-deliverables/${d1}/accept"
