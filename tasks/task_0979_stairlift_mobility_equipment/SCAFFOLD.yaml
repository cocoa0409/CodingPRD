    code: 200
    input: ["limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: POST
    path: "/stairlift-ops/quotes/{id}/issue"
    description: "Issue a DRAFT Quote (DRAFT -> ISSUED)"
