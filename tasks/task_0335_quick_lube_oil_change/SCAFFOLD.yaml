  - method: GET
    path: "/queue-tickets/{id}"
    description: "Get a queue ticket"
    roles: [ShopManager, ServiceAdvisor, Technician]
    code: 200
    input: []
    output: QueueTicket
    side_effects: []
  - method: POST
    path: "/queue-tickets/{id}/assign"
    description: "Assign a WAITING ticket to an OPEN bay (OCC on bay version); creates a DRAFT WorkOrder"
    roles: [ServiceAdvisor]
    code: 200
    input: [bay_id, expected_bay_version]
    output: QueueTicket
    side_effects:
      - "Bay OPEN -> OCCUPIED; shop.open_bay_count -= 1; increments Bay.version by 1"
      - "Create DRAFT WorkOrder; set ticket.work_order_id, ticket.assigned_bay_id; status=ASSIGNED"
  - method: POST
    path: "/queue-tickets/{id}/requeue"
    description: "Return an ASSIGNED ticket to WAITING (cancels its DRAFT order, frees bay)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["DRAFT WorkOrder -> CANCELLED; bay released; status=WAITING"]
  - method: POST
    path: "/queue-tickets/{id}/cancel"
    description: "Cancel a WAITING ticket"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status=CANCELLED"]

  # ---------------- WorkOrder ----------------
  - method: POST
    path: "/work-orders"
    description: "Create a work order directly against an OPEN bay (non-queue path)"
    roles: [ServiceAdvisor]
    code: 201
    input: [shop_id, vehicle_id, bay_id, package_id, odometer_in, "coupon_code?"]
    output: WorkOrder
    side_effects:
      - "Bay OPEN -> OCCUPIED; shop.open_bay_count -= 1"
      - "service_status=DRAFT, payment_status=UNPAID; pricing computed (provisional)"
  - method: GET
    path: "/work-orders"
    description: "List work orders; filter by shop_id, vehicle_id, bay_id, package_id, technician_id, service_status, payment_status"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["shop_id?", "vehicle_id?", "bay_id?", "package_id?", "technician_id?", "service_status?", "payment_status?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order with full pricing + throughput fields"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/claim"
    description: "Technician claims the order (sets technician_id; buffered double-booking check; technician_id must exist else ERR_TECHNICIAN_NOT_FOUND)"
    roles: [Technician]
    code: 200
    input: [technician_id]
    output: WorkOrder
    side_effects: ["technician_id set"]
  - method: POST
    path: "/work-orders/{id}/apply-coupon"
    description: "Apply or replace the coupon on a DRAFT order; re-prices"
    roles: [ServiceAdvisor]
    code: 200
    input: [coupon_code]
    output: WorkOrder
    side_effects: ["coupon_code set; pricing recomputed (provisional)"]
  - method: POST
    path: "/work-orders/{id}/lines"
    description: "Add an upsell inspection line (OCC on work-order version); re-prices"
    roles: [Technician]
    code: 201
    input: [inspection_item_id, expected_work_order_version]
    output: WorkOrderLine
    side_effects: ["WorkOrderLine created (price/labor snapshot); WO pricing recomputed; increments WorkOrder.version by 1"]
  - method: GET
    path: "/work-orders/{id}/lines"
    description: "List a work order's lines (FK reverse-reachability for WorkOrderLine.work_order_id)"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrderLine[]"
    side_effects: []
  - method: DELETE
    path: "/work-orders/{id}/lines/{lineId}"
    description: "Remove an upsell line during INSPECTION; re-prices (lineId must exist on the order else ERR_LINE_NOT_FOUND)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["line removed; WO pricing recomputed"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "DRAFT -> IN_SERVICE (bay/technician capability checks; throughput clock starts)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["service_status=IN_SERVICE; service_start_at set; QueueTicket ASSIGNED -> IN_BAY if linked"]
  - method: POST
    path: "/work-orders/{id}/begin-inspection"
    description: "IN_SERVICE -> INSPECTION"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["service_status=INSPECTION"]
  - method: POST
    path: "/work-orders/{id}/finish-inspection"
    description: "INSPECTION -> IN_SERVICE (re-prices with accepted upsells)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["service_status=IN_SERVICE; pricing recomputed (provisional)"]
  - method: POST
    path: "/work-orders/{id}/mark-ready"
    description: "IN_SERVICE -> READY (FINAL pricing; throughput computed)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["service_status=READY; FINAL total frozen; service_ready_at set; throughput_seconds/throughput_breach computed"]
  - method: POST
    path: "/work-orders/{id}/authorize"
    description: "UNPAID -> AUTHORIZED (creates Payment; fleet credit check)"
    roles: [ServiceAdvisor]
    code: 200
    input: [payment_method]
    output: WorkOrder
    side_effects: ["payment_status=AUTHORIZED; Payment created; fleet reserved_credit recomputed if FLEET_ACCOUNT"]
  - method: POST
    path: "/work-orders/{id}/capture-payment"
    description: "AUTHORIZED -> PAID (captures payment; coupon redeemed_count updated)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["payment_status=PAID; Payment CAPTURED; coupon redeemed_count++/EXHAUSTED; fleet settled_credit recomputed"]
  - method: POST
    path: "/work-orders/{id}/void-payment"
    description: "AUTHORIZED -> VOIDED (compensating; releases fleet reserved credit)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["payment_status=VOIDED; Payment VOIDED; fleet reserved_credit recomputed"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "READY -> COMPLETED (cascade: free bay -> promote queue; print sticker; update vehicle reminders)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "service_status=COMPLETED"
      - "Bay OCCUPIED -> OPEN; open_bay_count += 1; promote lowest queue_seq WAITING ticket if any (re-occupies a bay)"
      - "ServiceSticker created; Vehicle reminder fields recomputed"
      - "Linked QueueTicket IN_BAY -> DONE"
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal order (compensating: void payment, free bay, void lines)"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["service_status=CANCELLED; lines voided; payment voided if AUTHORIZED; bay freed; linked ticket CANCELLED"]
  - method: GET
    path: "/work-orders/{id}/sticker"
    description: "Get the ServiceSticker for an order (FK reverse-reachability for ServiceSticker.work_order_id); returns ERR_STICKER_NOT_FOUND if no sticker exists yet (order not COMPLETED) and the caller requested a single-sticker view"
    roles: [ShopManager, ServiceAdvisor, Technician, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceSticker[]"
    side_effects: []
  - method: GET
    path: "/work-orders/{id}/payments"
    description: "List payments for a work order (FK reverse-reachability for Payment.work_order_id)"
    roles: [ShopManager, ServiceAdvisor, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # ---------------- Test-driving clock ----------------
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server clock to a fixed UTC instant (drives throughput timing and time-interval reminders deterministically)"
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server 'now' fixed to the given instant for all subsequent computed timestamps"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or FleetManager acting outside its own account" }
  - { id: ERR_VALIDATION, http: 400, condition: "Body fails schema: missing required field, bad type, bad enum, or negative amount" }
  # not found
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "Shop id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "ServicePackage id does not exist or not on the shop" }
  - { id: ERR_INSPECTION_ITEM_NOT_FOUND, http: 404, condition: "InspectionItem id does not exist" }
  - { id: ERR_COUPON_NOT_FOUND, http: 404, condition: "coupon_code does not resolve to a Coupon on the shop" }
  - { id: ERR_FLEET_ACCOUNT_NOT_FOUND, http: 404, condition: "FleetAccount id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "Bay id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_QUEUE_TICKET_NOT_FOUND, http: 404, condition: "QueueTicket id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "WorkOrderLine id does not exist on the order" }
  - { id: ERR_STICKER_NOT_FOUND, http: 404, condition: "No ServiceSticker exists for the order (not yet completed)" }
  - { id: ERR_VEHICLE_HAS_NO_FLEET_ACCOUNT, http: 404, condition: "payment_method FLEET_ACCOUNT but vehicle.fleet_account_id is null" }
  # state
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_BAY_NOT_OPEN, http: 409, condition: "Bay is not OPEN when an assignment/creation needs it OPEN" }
  - { id: ERR_BAY_OCCUPIED, http: 409, condition: "Cannot close a bay that is OCCUPIED" }
  - { id: ERR_BAY_NOT_READY, http: 409, condition: "Starting service but the bay is not OCCUPIED by this order" }
  - { id: ERR_TECHNICIAN_NOT_ASSIGNED, http: 409, condition: "Starting service before a technician has claimed the order" }
  - { id: ERR_PAYMENT_NOT_SETTLED, http: 409, condition: "Completing a work order whose payment_status is not PAID" }
  - { id: ERR_FLEET_ACCOUNT_INACTIVE, http: 409, condition: "Authorizing FLEET_ACCOUNT payment while the account is SUSPENDED or CLOSED" }
  - { id: ERR_FLEET_HAS_OPEN_BALANCE, http: 409, condition: "Closing a fleet account with reserved_credit_cents > 0" }
  # concurrency (OCC)
  - { id: ERR_STALE_BAY_VERSION, http: 412, condition: "expected_bay_version does not match the bay's current version" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version does not match the order's current version" }
  # business safety / temporal / constraint
  - { id: ERR_BAY_CAPABILITY_MISMATCH, http: 409, condition: "Synthetic-grade package on a bay that is not synthetic_certified" }
  - { id: ERR_TECHNICIAN_CAPABILITY_MISMATCH, http: 409, condition: "Synthetic-grade package performed by a technician that is not synthetic_certified" }
  - { id: ERR_BAY_TIME_OVERLAP, http: 409, condition: "A new work order's occupancy interval overlaps an existing one on the same bay (half-open [start,end))" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "A technician's job interval plus cleanup_buffer overlaps another of that technician's jobs" }
  - { id: ERR_COUPON_EXPIRED, http: 409, condition: "Coupon.status is EXPIRED (or EXHAUSTED) when applied" }
  - { id: ERR_COUPON_USAGE_EXCEEDED, http: 409, condition: "Coupon redeemed_count >= usage_limit" }
  - { id: ERR_COUPON_MIN_SUBTOTAL_NOT_MET, http: 409, condition: "WorkOrder subtotal_cents < coupon.min_subtotal_cents" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "A vehicle with the same vin already exists for the shop" }
  # fiscal
  - { id: ERR_FLEET_CREDIT_EXCEEDED, http: 402, condition: "reserved_credit_cents + total_cents would exceed credit_limit_cents at authorize" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Operational owner: configures shop, packages, items, coupons, bays, technicians, fleet accounts; manages bay close/reopen and fleet lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /service-packages, POST /service-packages/{id}/retire"
      - "POST /inspection-items"
      - "POST /coupons, POST /coupons/{id}/expire"
      - "POST /fleet-accounts, POST /fleet-accounts/{id}/suspend, .../reactivate, .../close"
      - "POST /bays, POST /bays/{id}/close, POST /bays/{id}/reopen"
      - "POST /technicians"
      - "POST /_clock/set — test-driving clock"
    shared_operations:
      - "All GET reads"

  - name: ServiceAdvisor
    description: "Front desk: drive-in intake/queue, vehicle registration & lookup, direct work-order creation, coupon application, payment authorize/capture/void, completion and cancellation."
    identity: opaque
    exclusive_operations:
      - "POST /queue-tickets, .../assign, .../requeue, .../cancel"
      - "POST /work-orders — create"
      - "POST /work-orders/{id}/apply-coupon"
      - "POST /work-orders/{id}/authorize, .../capture-payment, .../void-payment"
      - "POST /work-orders/{id}/complete, .../cancel"
    shared_operations:
      - "POST /vehicles — register vehicle (shared with ShopManager, FleetManager)"
      - "All GET reads"

  - name: Technician
    description: "Performs the service: claims an order, adds/removes upsell inspection lines, drives the service state machine (start, inspection cycle, mark-ready)."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /work-orders/{id}/claim"
      - "POST /work-orders/{id}/lines, DELETE /work-orders/{id}/lines/{lineId}"
      - "POST /work-orders/{id}/start, .../begin-inspection, .../finish-inspection, .../mark-ready"
    shared_operations:
      - "All GET reads"

  - name: FleetManager
    description: "External corporate user bound to one FleetAccount: registers its fleet vehicles and reads its own account, vehicles, work orders, payments. May not act on other accounts."
    identity: "entity_backed:FleetAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /vehicles — register a vehicle on its own fleet_account_id (shared with ShopManager, ServiceAdvisor)"
      - "GET /fleet-accounts/{id}, GET /fleet-accounts/{id}/vehicles, GET /vehicles, GET /work-orders, GET /work-orders/{id}/payments — scoped to its own account"
