              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_id}", origin_depot_id: "${depot_a}", destination_depot_id: "${depot_b}", mode: "TRUCK", tons: 940, load_window_start: "2026-08-05T08:00:00Z", load_window_end: "2026-08-05T09:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_id: "$.data.id" }
            - call: "POST /salt/shipments/${ship_id}/load"
              payload: {}
              as: DepotManager
              as_user_id: "${depot_a}"
            - call: "POST /salt/shipments/${ship_id}/receive"
              payload: {}
              as: DepotManager
              as_user_id: "${depot_b}"
              captures: { st: "$.data.status", new_lot: "$.data.received_lot_id" }
          trigger:
            - call: "POST /salt/stockpile-lots/${lot_id}/quarantine-state"
              payload: { quarantine: true, quarantine_reason: "audit hold on a drained lot" }
              as: QualityLab
              as_user_id: "ql-checker-1"
          assert:
            - "the receive returned HTTP 200 with ${st} == RECEIVED and a non-null ${new_lot}"
            - "StockpileLot.${lot_id}.tons_on_hand == 0.00 and lot_state == DEPLETED"
            - "HTTP 409 with error code ERR_LOT_STATE_INVALID (not ERR_LOT_QUARANTINED)"
            - "StockpileLot.${lot_id}.quarantine_reason is still null and its lot_state is still DEPLETED"
            - "the destination lot ${new_lot} has tons_on_hand == 940.00, purity_pct_nacl == 96.500 and storage_kind == COVERED"
            - "Depot.${depot_a}.covered_stored_tons == 0.00 and Depot.${depot_b}.covered_stored_tons == 940.00"

      - name: order_and_allocation_state_guards_reject_an_early_deliver_and_a_double_release
        claim_type: triggerability
        grounds:
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_ALLOCATION_NOT_RESERVED]
          - "validations[priority=12]"
          - "validations[priority=18]"
        distinguishing_aspect: |
          Delivering before anything is reserved is a state error, not a silent zero-ton invoice, and
          releasing an already RELEASED line is a state error, not an idempotent second 200. Both are
          driven on one order so the two 409 codes are distinguishable from each other.
        test_recipe:
          setup:
            - "A 940.00 t covered NY HIGHWAY_DEICING lot, an ACTIVE 1000 t NY contract (min_take 80 -> 800.00 floor covered by the lot) and one REQUESTED 500 t order."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${batch_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_id: "$.data[0].id", lot_v: "$.data[0].version" }
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { c_v: "$.data.version" }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 500, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${c_v}" }
              as: LogisticsPlanner
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /salt/delivery-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsPlanner
            - call: "POST /salt/allocations"
              payload: { delivery_order_id: "${order_id}", stockpile_lot_id: "${lot_id}", tons: 500, expected_stockpile_lot_version: "${lot_v}" }
              as: LogisticsPlanner
              captures: { alloc_id: "$.data.id" }
            - call: "POST /salt/allocations/${alloc_id}/release"
              payload: { reason: "load cancelled by the city" }
              as: LogisticsPlanner
              captures: { a_state: "$.data.state" }
            - call: "POST /salt/allocations/${alloc_id}/release"
              payload: { reason: "duplicate cancellation from the depot terminal" }
              as: LogisticsPlanner
          assert:
            - "call 1 -> HTTP 409 ERR_ORDER_INVALID_STATE (deliver requires ALLOCATED or SHORTED; the order is REQUESTED)"
            - "call 2 -> HTTP 201 and the order becomes ALLOCATED (500 == requested_tons)"
            - "call 3 -> HTTP 200 with ${a_state} == RELEASED and the order back to REQUESTED"
            - "call 4 -> HTTP 409 ERR_ALLOCATION_NOT_RESERVED"
            - "StockpileLot.${lot_id}.tons_reserved == 0.00 and tons_available == 940.00 — the refused second release did not double-credit the lot"
            - "DeliveryOrder.${order_id}.allocated_tons == 0.00 and status == REQUESTED"

      - name: activation_with_no_stockpile_returns_preseason_coverage_short
        claim_type: triggerability
        grounds:
          - errors[ERR_PRESEASON_COVERAGE_SHORT]
          - "validations[priority=38]"
          - calculations.contract_fulfillment_ledger
        distinguishing_aspect: |
          With the logical clock still inside the pre-season window, the only thing left to refuse an
          AWARDED contract is the coverage floor: committed 1000 t at min_take 80 needs 800.00 t of
          eligible NY stockpile and there is none, so the error must be
          ERR_PRESEASON_COVERAGE_SHORT rather than ERR_PRESEASON_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "One forecast locked 2026-10-15, one AWARDED 1000 t NY contract with min_take 80, and no depots or lots anywhere."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
          trigger:
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "GET /salt/bid-contracts/${c_id}/ledger"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { cov: "$.data.preseason_coverage_tons", req: "$.data.preseason_coverage_required_tons" }
          assert:
            - "HTTP 409 with error code ERR_PRESEASON_COVERAGE_SHORT"
            - "${cov} == 0.00 and ${req} == 800.00"
            - "BidContract.${c_id}.status is still AWARDED and its version is unchanged"
            - "the default logical clock 2026-08-01T00:00:00Z is before the 2026-10-15 lock, so priority 30 could not have fired"

      - name: stale_bid_contract_version_on_order_create
        claim_type: triggerability
        excluded_because:
          difficulty_instance: shortfall_penalty_per_event_versus_season_aggregate_reconciliation
          rationale: |
            Every order create in that instance re-reads the contract for a fresh
            expected_bid_contract_version, and its companion OCC probe in
            cross_cutting_complexity_layers.order_create_with_stale_bid_contract_version_rejected
            triggers ERR_STALE_BID_CONTRACT_VERSION directly.

      - name: hoist_capacity_exceeded_by_a_concurrent_run
        claim_type: triggerability
        excluded_because:
          difficulty_instance: half_open_hoist_windows_touch_and_aggregate_rate_equals_capacity
          rationale: "ERR_HOIST_CAPACITY_EXCEEDED is triggered there at the exact boundary (one ton over the equality case)."

      - name: take_band_exceeded_by_an_oversized_order
        claim_type: triggerability
        excluded_because:
          difficulty_instance: contract_state_outranks_take_band_fiscal_check_on_order_create
          rationale: "ERR_TAKE_BAND_EXCEEDED is triggered there as the single-violation control, and again in validations.take_band_counts_every_live_order_and_admits_the_one_that_lands_on_the_limit."

      - name: rework_limit_exceeded_on_a_third_rework
        claim_type: triggerability
        excluded_because:
          difficulty_instance: treatment_batch_pending_self_loop_bounded_at_two_reworks
          rationale: "The third REWORK returning ERR_REWORK_LIMIT_EXCEEDED is the terminating assertion of that instance."

      - name: withdrawal_order_blocks_a_new_run
        claim_type: triggerability
        excluded_because:
          difficulty_instance: withdrawal_order_safety_outranks_hoist_capacity_constraint_on_run_create
          rationale: "ERR_MINE_WITHDRAWAL_ORDER_ACTIVE is the expected code there."

      - name: contract_invalid_state_on_a_second_submit
        claim_type: triggerability
        excluded_because:
          difficulty_instance: contract_state_outranks_take_band_fiscal_check_on_order_create
          rationale: "ERR_CONTRACT_INVALID_STATE is the winning code there, and state_machines.resubmitting_a_submitted_bid_contract_returns_contract_invalid_state triggers it on the submit path."

      - name: penalty_not_accrued_on_a_clean_order
        claim_type: triggerability
        excluded_because:
          difficulty_instance: penalty_accrual_then_waiver_restores_contract_ledger_without_refilling_tons
          rationale: "ERR_PENALTY_NOT_ACCRUED is triggered there by waiving a penalty twice."

      - name: no_eligible_stockpile_for_a_routine_order
        claim_type: triggerability
        excluded_because:
          difficulty_instance: routine_order_blocked_while_identical_storm_order_draws_from_surge_depot
          rationale: "ERR_NO_ELIGIBLE_STOCKPILE is the expected code for the ROUTINE half of that A/B pair."

      - name: loadout_bay_conflict_on_a_touching_window
        claim_type: triggerability
        excluded_because:
          difficulty_instance: closed_loadout_windows_collide_across_mode_switch_buffer_by_one_minute
          rationale: "ERR_LOADOUT_BAY_CONFLICT is triggered there one minute inside the buffered edge, and again in endpoints.cancelling_a_planned_shipment_frees_the_loadout_bay_for_the_blocked_one."

      - name: run_scheduling_while_the_shaft_is_down_returns_hoist_unavailable
        claim_type: triggerability
        grounds:
          - errors[ERR_HOIST_UNAVAILABLE]
          - "validations[priority=23]"
          - state_machines.Mine.hoist_state.HOIST_AVAILABLE_to_HOIST_DOWN
          - calculations.mine_effective_hoist_capacity
        distinguishing_aspect: |
          HOIST_DOWN drives effective capacity to 0.00, so a naive implementation reports the
          capacity constraint (priority 31) instead of the shaft guard (priority 23). The code must
          be ERR_HOIST_UNAVAILABLE, and HOIST_DERATED must still be accepted — only HOIST_DOWN is
          refused, which a "hoist_state != HOIST_AVAILABLE" implementation gets wrong.
        test_recipe:
          setup:
            - "Mine rated 24000 t/day with a PRODUCING panel; the shaft is then reported HOIST_DOWN for maintenance."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/mines/${mine_id}/hoist-status"
              payload: { hoist_state: "HOIST_DOWN", note: "skip rope replacement" }
              as: MinePlanner
              captures: { eff_down: "$.data.effective_hoist_tons_per_day" }
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
          trigger:
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
            - call: "POST /salt/mines/${mine_id}/hoist-status"
              payload: { hoist_state: "HOIST_DERATED", note: "one skip back in service" }
              as: MinePlanner
              captures: { eff_derated: "$.data.effective_hoist_tons_per_day" }
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v2: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v2}" }
              as: MinePlanner
              captures: { run_id: "$.data.id", rstate: "$.data.status" }
          assert:
            - "${eff_down} == 0.00 while the shaft is HOIST_DOWN"
            - "call 1 -> HTTP 409 with error code ERR_HOIST_UNAVAILABLE, NOT ERR_HOIST_CAPACITY_EXCEEDED"
            - "no run row is created by call 1 (GET /salt/production-runs?mine_id=${mine_id} -> total_count == 0)"
            - "${eff_derated} == 13200.00 (24000 * 0.55 * 1.00)"
            - "call 4 -> HTTP 201 with ${rstate} == SCHEDULED — HOIST_DERATED is explicitly permitted by priority 23"
            - "ProductionRun.${run_id}.planned_tons_per_hour == 41.6667 and Mine.${mine_id}.scheduled_hoist_tons_open == 1000.00"

      - name: ground_control_defect_open_blocks_production
        claim_type: triggerability
        excluded_because:
          difficulty_instance: panel_producing_suspended_producing_cycle_guarded_by_open_defect
          rationale: "ERR_GROUND_CONTROL_DEFECT_OPEN is the expected code on the guarded start-production attempt there."

      - name: covered_capacity_exceeded_on_a_shipment_receipt
        claim_type: triggerability
        excluded_because:
          difficulty_instance: covered_storage_auto_surge_at_exactly_ninety_percent_of_capacity
          rationale: "ERR_COVERED_CAPACITY_EXCEEDED is triggered there one ton past the pad limit, and again in validations.rework_shrinks_the_batch_until_it_finally_fits_the_covered_pad."

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  #    Section 7 of the guide is a bullet pair per role plus one role-model row.
  #    claim_type values below are the snake_cased bullets
  #    (can_perform_own_operations / cannot_perform_other_roles_exclusive_operations),
  #    the role_model row (segregation_of_duties), and two claims derived from
  #    DepotManager's `identity: entity_backed:Depot` declaration
  #    (entity_backed_identity) plus the unauthenticated row of §1.6.
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_write
        claim_type: can_perform_own_operations
        grounds:
          - roles[MinePlanner].exclusive_operations
          - roles[GroundControlEngineer].exclusive_operations
          - roles[QualityLab].exclusive_operations
          - roles[LogisticsPlanner].exclusive_operations
          - roles[ContractAdministrator].exclusive_operations
          - roles[ComplianceOfficer].exclusive_operations
          - roles[DepotManager].shared_operations
        distinguishing_aspect: |
          One positive probe per declared role, so a global "deny unless MinePlanner" or an
          accidentally permissive matrix is caught in a single test: mine create (MinePlanner),
          inspection create (GroundControlEngineer), batch create (QualityLab), depot create
          (LogisticsPlanner), forecast + contract create (ContractAdministrator), compliance action
          (ComplianceOfficer) and own-depot posture (DepotManager, whose exclusive_operations list is
          empty by design).
        test_recipe:
          setup:
            - "Nothing pre-existing; each role builds the row it owns."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
          trigger:
            - call: "POST /salt/ground-control-inspections"
              payload: { panel_id: "${panel_id}", roof_span_ft: 40, convergence_rate_in_per_day: 0.010, finding: "CLEAR" }
              as: GroundControlEngineer
              as_user_id: "gce-1"
              captures: { insp_id: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CITE", inspection_id: "${insp_id}", note: "MSHA 104(a) roof control citation" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cstate: "$.data.compliance_state" }
            - call: "POST /salt/depots/${depot_a}/posture"
              payload: { depot_state: "SURGE", reason: "lake effect band forecast" }
              as: DepotManager
              as_user_id: "${depot_a}"
              captures: { dstate: "$.data.depot_state", setter: "$.data.storm_state_set_by_user_id" }
          assert:
            - "the mine, panel, run, hoist, inspection, depot, batch, forecast and contract calls all return 201 or 200 for their owning role"
            - "${cstate} == CITED — ComplianceOfficer owns the compliance dimension"
            - "${dstate} == SURGE and ${setter} == ${depot_a} — the DepotManager acted on its own depot"
            - "GroundControlInspection.${insp_id}.inspector_user_id == 'gce-1' and finding == CLEAR"
            - "TreatmentBatch.${batch_id}.created_by_user_id == 'ql-maker-1'"

      - name: logistics_planner_cannot_create_a_production_run_returns_unauthorized
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - roles[MinePlanner].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - "validations[priority=2]"
        distinguishing_aspect: |
          A role that is allowed to write elsewhere in the system (depots, shipments, allocations)
          must still be refused on another role's exclusive operation, and the refusal must be 403
          ERR_UNAUTHORIZED rather than a 404 or a validation error — the request body is completely
          valid, so only the role check can reject it.
        test_recipe:
          setup:
            - "Mine with a PRODUCING panel, created by the MinePlanner."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
          trigger:
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: LogisticsPlanner
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "00000000-0000-0000-0000-0000000000b1", depot_id: "00000000-0000-0000-0000-0000000000b2", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: MinePlanner
          assert:
            - "call 1 -> HTTP 403 with error code ERR_UNAUTHORIZED and no ProductionRun row is created"
            - "call 2 -> HTTP 403 ERR_UNAUTHORIZED as well, proving the role check runs BEFORE the body FK existence check at priority 9 (the ids in it do not exist)"
            - "Mine.${mine_id}.version is unchanged and scheduled_hoist_tons_open == 0"

      - name: request_without_a_user_id_header_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - "validations[priority=1]"
        distinguishing_aspect: |
          Priority 1 outranks priority 2: a request that carries a legitimate X-User-Role but no
          X-User-ID must be 401 ERR_UNAUTHENTICATED, not 403. Sending the same body with both headers
          present succeeds, which isolates the missing identity as the only cause.
        test_recipe:
          setup:
            - "Nothing pre-existing."
          setup_api_calls: []
          trigger:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              as_user_id: null
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              as_user_id: "mp-1"
              captures: { mine_id: "$.data.id" }
          assert:
            - "call 1 (X-User-Role: MinePlanner, X-User-ID omitted) -> HTTP 401 with error code ERR_UNAUTHENTICATED"
            - "no Mine row is created by call 1"
            - "call 2 with both headers -> HTTP 201, so the payload itself was never the problem"
            - "GET /salt/mines returns total_count == 1 and Mine.${mine_id}.hoist_state == HOIST_AVAILABLE"

      - name: depot_manager_cannot_set_posture_on_another_depot_returns_depot_not_owned
        claim_type: entity_backed_identity
        grounds:
          - roles[DepotManager].identity
          - errors[ERR_DEPOT_NOT_OWNED]
          - "validations[priority=4]"
        distinguishing_aspect: |
          DepotManager's X-User-ID *is* a Depot id, so the same endpoint with the same body must
          succeed for its own depot and be refused with 403 ERR_DEPOT_NOT_OWNED for a sibling depot —
          while LogisticsPlanner, whose identity is opaque, may post posture on either. That third
          call is what separates an ownership check from a blanket role restriction.
        test_recipe:
          setup:
            - "Two depots, Syracuse and Rochester."
          setup_api_calls:
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/depots"
              payload: { name: "Rochester Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 400, outbound_freight_rate_per_ton: 8.000 }
              as: LogisticsPlanner
              captures: { depot_b: "$.data.id" }
          trigger:
            - call: "POST /salt/depots/${depot_b}/posture"
              payload: { depot_state: "CLOSED", reason: "not my depot" }
              as: DepotManager
              as_user_id: "${depot_a}"
            - call: "POST /salt/depots/${depot_a}/posture"
              payload: { depot_state: "CLOSED", reason: "conveyor rebuild at my own depot" }
              as: DepotManager
              as_user_id: "${depot_a}"
              captures: { own: "$.data.depot_state" }
            - call: "POST /salt/depots/${depot_b}/posture"
              payload: { depot_state: "SURGE", reason: "network-wide storm staging" }
              as: LogisticsPlanner
              captures: { other: "$.data.depot_state" }
          assert:
            - "call 1 -> HTTP 403 with error code ERR_DEPOT_NOT_OWNED and Depot.${depot_b} is untouched at OPEN with version 1"
            - "call 2 -> HTTP 200 with ${own} == CLOSED and Depot.${depot_a}.version == 2"
            - "call 3 -> HTTP 200 with ${other} == SURGE — the opaque-identity role is not ownership-restricted"
            - "Depot.${depot_b}.storm_state_set_by_user_id is the LogisticsPlanner's X-User-ID, never ${depot_a}"

      - name: depot_manager_loads_the_shipment_leaving_its_own_depot
        claim_type: entity_backed_identity
        grounds:
          - roles[DepotManager].shared_operations
          - state_machines.Shipment.PLANNED_to_LOADED
          - "validations[priority=4]"
        distinguishing_aspect: |
          The positive half of the ownership rule on a two-depot workflow: the origin depot's manager
          may load, and the destination depot's manager may receive, so a correct implementation must
          compare X-User-ID against origin_depot_id for /load and destination_depot_id for /receive —
          not against one fixed field for both.
        test_recipe:
          setup:
