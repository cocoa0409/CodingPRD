      - name: sla_business_hours_across_weekend
        claim_type: Correct Result
        grounds:
          - calculations.sla_tracking
          - entities.ClaimFeedBatch.fields.sla_due_at
        distinguishing_aspect: "A CLAIM_INTAKE batch received Friday 2026-09-25T15:30:00Z has 1.5 business hours left on Friday plus 2.5 on Monday, so sla_due_at == 2026-09-28T11:30:00Z; weekend hours do not accrue, and processing at exactly sla_due_at counts as met (sla_met true)."
        test_recipe:
          setup:
            - "Payer P1 exists; clock set to Friday 2026-09-25T15:30:00Z; CLAIM_INTAKE batch received."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
