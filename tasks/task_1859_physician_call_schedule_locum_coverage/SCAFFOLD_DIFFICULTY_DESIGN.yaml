# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1859: Physician Call Schedule & Locum Coverage
# 9 difficulty rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fairness_points_prospective_vs_actual
        grounds:
          - calculations.fairness_points
          - entities.CallProgram.fields.weekday_call_points
          - entities.CallAssignment.fields.status
        distinguishing_aspect: |
          Fairness domain (scheduling equity points on CallAssignment sets): the prospective
          variant counts {SCHEDULED, ACTIVATED, SERVED} while the actual variant counts only
          {SERVED}, so identical data yields 3.0 vs 1.0 for the same physician — a
          scheduling-domain dual variant, distinct from the pay-domain variant in
          call_pay_projected_vs_actual_backup_activation.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-08..2026-09-13 (Tue..Sun), CARDIOLOGY, 1 primary per weekday and per weekend day, no backups, budget 1000000"
            - "P1 (Dr Alvarez) assigned to slots 2026-09-08 (weekday, 1.0 pts) and 2026-09-12 (Saturday, 2.0 pts); P2 (Dr Becker) assigned to 2026-09-09 (weekday, 1.0 pts)"
            - "P1's 2026-09-08 assignment is SERVED; all others remain SCHEDULED"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Sep W2", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-13", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 1, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Becker", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p2_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_0908: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-09"
              as: SchedulerAdmin
              captures: { slot_0909: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-12"
              as: SchedulerAdmin
              captures: { slot_0912: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0908}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0912}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0909}", physician_id: "${p2_id}" }
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a1_id}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/call-programs/${prog_id}/fairness-report"
              as: SchedulerAdmin
              captures: { tot_pro: $.data.total_prospective_points, tot_act: $.data.total_actual_points }
          assert:
            - "report entry for ${p1_id}: prospective_points == 3.0 (SERVED weekday 1.0 + SCHEDULED Saturday 2.0)"
            - "report entry for ${p1_id}: actual_points == 1.0 (only the SERVED assignment counts)"
            - "report entry for ${p2_id}: prospective_points == 1.0 and actual_points == 0.0"
            - "total_prospective_points == 4.0 and total_actual_points == 1.0 (captured ${tot_pro} == 4.0, ${tot_act} == 1.0)"
            - "mean_prospective_points == 2.0 and mean_actual_points == 0.5 and population_size == 2"

      - name: call_pay_projected_vs_actual_backup_activation
        grounds:
          - calculations.call_pay
          - entities.CallAssignment.fields.projected_pay_cents
          - entities.PayEntry.fields.amount_cents
        distinguishing_aspect: |
          Pay domain (money on PayEntry): the projected variant fixes the activation multiplier
          to 1.0 at creation (20000 cents), while the actual variant at mark-served applies the
          backup_activation_multiplier 2.0 because the backup was ACTIVATED (40000 cents) —
          a pay-domain dual variant, distinct from the scheduling-domain fairness variant.
        test_recipe:
          setup:
            - "PUBLISHED program covering only Tuesday 2026-09-08, CARDIOLOGY, 0 primaries, 1 weekday backup, budget 500000, default backup_rate_cents 20000"
            - "STAFF physician P1 assigned to the single BACKUP slot (projected_pay_cents 20000 = 20000 x 1.0 weekday, no premium: 0 prior served hours < 40)"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Backup Day", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 500000, weekday_primary_required: 0, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 1, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id, proj_pay: $.data.projected_pay_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_id}/activate-backup"
              payload: { reason: "PRIMARY_NO_SHOW" }
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_id}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/pay-entries?assignment_id=${a_id}"
              as: SchedulerAdmin
              captures: { actual_pay: $.data.0.amount_cents, act_flag: $.data.0.activation_applied }
          assert:
            - "CallAssignment.${a_id}.projected_pay_cents == 20000 (captured ${proj_pay}; activation assumed false at creation)"
            - "PayEntry.amount_cents == 40000 (captured ${actual_pay}; 20000 base x 1.0 weekday x 2.0 activated, no premium)"
            - "PayEntry.activation_applied == true and premium_applied == false"
            - "projected 20000 != actual 40000 for the same assignment and slot data"

  - rule_id: combinatorial_formula
    instances:
      - name: assignment_pay_tiered_branching_four_inputs
        grounds:
          - calculations.call_pay
          - entities.CallProgram.fields.moonlight_premium_threshold_hours
        distinguishing_aspect: |
          Mode (a) combinatorial: call_pay's actual variant combines four inputs — base rate by
          call_type, date-type multiplier tier (HOLIDAY 1.5), conditional activation branch (x2.0),
          and a threshold-triggered premium tier (served_hours_before >= 40 -> x1.15) — with nested
          conditional branches; evaluation order base -> date -> activation -> premium is pinned.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-03..2026-09-07, CARDIOLOGY, holiday_dates [2026-09-07] (Labor Day Monday), 1 primary per weekday, 1 backup on holidays, backup_rate_cents 21500, budget 5000000"
            - "P1 (STAFF, default cap 96) assigned to 2026-09-03 and 2026-09-04 primaries and to the 2026-09-07 holiday BACKUP slot"
            - "The two primaries are SERVED (48 rolling served hours >= 40 threshold before 2026-09-07); the backup is ACTIVATED mid-window then SERVED"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Labor Day", service_line: "CARDIOLOGY", period_start: "2026-09-03", period_end: "2026-09-07", holiday_dates: ["2026-09-07"], payroll_budget_cents: 5000000, backup_rate_cents: 21500, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 1 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-03"
              as: SchedulerAdmin
              captures: { slot_0903: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-04"
              as: SchedulerAdmin
              captures: { slot_0904: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-07"
              as: SchedulerAdmin
              captures: { slot_0907: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0903}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0903: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0904}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0904: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0907}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0907: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0903}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0904}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T10:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0907}/activate-backup"
              payload: { reason: "PRIMARY_NO_SHOW" }
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0907}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/pay-entries?assignment_id=${a_0907}"
              as: SchedulerAdmin
              captures: { amt: $.data.0.amount_cents }
          assert:
            - "PayEntry.amount_cents == 74175 (captured ${amt}; 21500 x 1.5 HOLIDAY x 2.0 ACTIVATED x 1.15 premium, single round_half_up at the end)"
            - "PayEntry.date_type == HOLIDAY and activation_applied == true and premium_applied == true"
            - "PayEntry.base_rate_cents == 21500"

      - name: payroll_total_per_entry_rounding_order
        grounds:
          - calculations.program_payroll_total
          - entities.CallProgram.fields.payroll_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each PayEntry rounds to whole cents at serve time
          (30906.25 -> 30906) and the program total sums rounded integers (192718); the forbidden
          sum-then-round order would yield 192719 — the two orders differ by exactly 1 cent over
          three premium weekend-backup entries. Distinct mode from the tiered-branching instance.
        test_recipe:
          setup:
            - "PUBLISHED program 2026-09-08..2026-09-19, CARDIOLOGY, 1 primary per weekday, 1 backup per weekend day (2026-09-12, 09-13, 09-19), backup_rate_cents 21500, budget 5000000"
            - "P1 (STAFF, moonlight_cap_hours 120) assigned to 09-08 and 09-09 primaries plus all three weekend backups; both primaries SERVED (48 served hours -> premium tier for every backup serve)"
            - "Each backup serve: 21500 x 1.25 WEEKEND x 1.15 premium = 30906.25 -> round_half_up per entry = 30906"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Rounding", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-19", payroll_budget_cents: 5000000, backup_rate_cents: 21500, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 1, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF", moonlight_cap_hours: 120 }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_0908: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-09"
              as: SchedulerAdmin
              captures: { slot_0909: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-12&call_type=BACKUP"
              as: SchedulerAdmin
              captures: { slot_0912: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-13&call_type=BACKUP"
              as: SchedulerAdmin
              captures: { slot_0913: $.data.0.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-19&call_type=BACKUP"
              as: SchedulerAdmin
              captures: { slot_0919: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0908}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0908: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0909}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0909: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0912}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0912: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0913}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0913: $.data.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_0919}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_0919: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0908}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0909}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0912}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0913}/mark-served"
              as: SchedulerAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T08:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /api/call-assignments/${a_0919}/mark-served"
              as: SchedulerAdmin
          trigger:
            - call: "GET /api/call-programs/${prog_id}"
              as: SchedulerAdmin
              captures: { accrued: $.data.payroll_accrued_cents }
            - call: "GET /api/pay-entries?assignment_id=${a_0912}"
              as: SchedulerAdmin
              captures: { e1: $.data.0.amount_cents }
          assert:
            - "PayEntry for backup 2026-09-12 amount_cents == 30906 (captured ${e1}; raw 30906.25 rounded per entry)"
            - "PayEntries for backups 2026-09-13 and 2026-09-19 also amount_cents == 30906 each"
            - "PayEntries for the two weekday primaries amount_cents == 50000 each (no premium: served_hours_before 0 and 24 < 40)"
            - "CallProgram.payroll_accrued_cents == 192718 (captured ${accrued}; 2 x 50000 + 3 x 30906; sum-then-round would give 192719 and is forbidden)"

  - rule_id: non_linear_state_machine
    instances:
      - name: swap_request_claim_decline_reclaim_cycle
        grounds:
          - state_machines.SwapRequest.CLAIMED_to_POSTED
          - state_machines.SwapRequest.POSTED_to_CLAIMED
          - state_machines.SwapRequest.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          SwapRequest is cyclic: POSTED -> CLAIMED -> POSTED (ChiefOfStaff decline reopens the
          marketplace) -> CLAIMED (different claimant) -> APPROVED -> EXECUTED — a negotiation
          loop on the swap entity, distinct from the requisition re-open cycle.
        test_recipe:
          setup:
            - "PUBLISHED program covering only 2026-09-08 (Tuesday), 1 weekday primary, budget 1000000; logical clock at the 2026-08-01T00:00:00Z default (well before the 48h cutoff of 2026-09-06T07:00:00Z)"
            - "P1 assigned to the slot and has offered it via swap; P2 and P3 are eligible STAFF cardiologists with no conflicts"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Swap Day", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Alvarez", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Becker", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Chen", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p3_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
            - call: "POST /api/call-assignments"
              payload: { slot_id: "${slot_id}", physician_id: "${p1_id}" }
              as: SchedulerAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/swap-requests"
              payload: { assignment_id: "${a_id}" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /api/swap-requests/${sw_id}/claim"
              as: Physician
              as_user_id: "${p2_id}"
          trigger:
            - call: "POST /api/swap-requests/${sw_id}/decline"
              payload: { decline_reason: "equity review" }
              as: ChiefOfStaff
              captures: { st_after_decline: $.data.status, claimant_after_decline: $.data.claimant_physician_id }
            - call: "POST /api/swap-requests/${sw_id}/claim"
              as: Physician
              as_user_id: "${p3_id}"
              captures: { st_reclaim: $.data.status, claimant_reclaim: $.data.claimant_physician_id }
            - call: "POST /api/swap-requests/${sw_id}/approve"
              as: ChiefOfStaff
            - call: "POST /api/swap-requests/${sw_id}/execute"
              as: SchedulerAdmin
              captures: { st_final: $.data.status }
            - call: "GET /api/call-assignments?source_swap_id=${sw_id}"
              as: SchedulerAdmin
              captures: { repl_phys: $.data.0.physician_id, repl_origin: $.data.0.origin }
          assert:
            - "after decline: status == POSTED and claimant_physician_id == null (captured ${st_after_decline} == POSTED)"
            - "after reclaim by P3: status == CLAIMED and claimant_physician_id == ${p3_id}"
            - "after execute: swap status == EXECUTED (captured ${st_final})"
            - "original CallAssignment.${a_id}.status == SWAPPED"
            - "replacement assignment: physician_id == ${p3_id} and origin == SWAP and source_swap_id == ${sw_id} (captured ${repl_phys}, ${repl_origin})"
            - "CallSlot.${slot_id}.status remains ASSIGNED throughout"

      - name: locum_requisition_credentialing_fail_reopen_cycle
        grounds:
          - state_machines.LocumRequisition.CREDENTIALING_to_OPEN
          - state_machines.CredentialingCase.IN_PROGRESS_to_FAILED
          - state_machines.LocumRequisition.SOURCED_to_CREDENTIALING
        distinguishing_aspect: |
          LocumRequisition is cyclic: OPEN -> SOURCED -> CREDENTIALING -> OPEN (credentialing
          failure reopens the requisition with the candidate cleared) -> SOURCED (second
          candidate) -> CREDENTIALING — a re-open loop on the requisition entity, distinct from
          the swap marketplace cycle.
        test_recipe:
          setup:
            - "PUBLISHED program covering only 2026-09-08, 1 weekday primary, no staff physicians at generation time so the single slot is OPEN with a GENERATION_SHORTFALL gap; credentialing_lead_hours default 120 (clear_by 2026-09-03T07:00:00Z, clock at default 2026-08-01T00:00:00Z)"
            - "LOCUM physicians L1 and L2 (CARDIOLOGY) registered"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Locum Day", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Locum One", specialty: "CARDIOLOGY", employment_type: "LOCUM" }
              as: SchedulerAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /api/physicians"
