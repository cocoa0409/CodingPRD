            - call: "POST /buy-offers/${o7_id}/accept"
              payload: { agreed_unit_price_cents: 8000, acquisition_mode: "CONSIGNMENT" }
              as: BrokerOps
            - call: "POST /buy-offers/${o7_id}/receive"
              payload: {}
              as: BrokerOps
            - call: "POST /buy-offers/${o7_id}/inspect"
              payload: { outcome: "PASS" }
              as: Inspector
            - call: "POST /buy-offers/${o7_id}/convert-to-lot"
              payload: { storage_bin_id: "${bin7_id}" }
              as: BrokerOps
              captures: { lot7_id: $.data.id }
