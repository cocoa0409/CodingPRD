            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Mug", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 2000, quantity: 5 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
