  - section: complexity_layers
    instances:
      - name: occ_stale_report_patch_rejected
        claim_type: stale_version_occ
        grounds:
          - "concurrency_rules[report-edit-stale-version]"
        distinguishing_aspect: "PATCH with the current version succeeds (version 1 -> 2); replaying the same expected_report_version afterwards -> 412 ERR_STALE_VERSION (stale-view update, not a state error)."
        test_recipe:
          setup: ["DRAFT report 2026-Q2 at version 1"]
          setup_api_calls:
            - { call: "POST /noise-program/quarterly-reports", payload: { quarter_label: "2026-Q2" }, as: NoiseAnalyst, captures: { r_id: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "PATCH /noise-program/quarterly-reports/${r_id}", payload: { notes: "v2 notes", expected_report_version: "${r_v}" }, as: NoiseAnalyst, captures: { v2: $.data.version } }
            - { call: "PATCH /noise-program/quarterly-reports/${r_id}", payload: { notes: "stale notes", expected_report_version: "${r_v}" }, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "v2 == 2 after the first PATCH"
            - "err == ERR_STALE_VERSION (http 412) on the replayed stale version"

      - name: occ_stale_correlation_version_rejected
        claim_type: stale_version_occ
        grounds:
          - "concurrency_rules[complaint-correlation-supersede]"
        distinguishing_aspect: "Re-correlation from CORRELATED is legal (supersede semantics), so the ONLY thing rejecting a second correlate carrying the pre-first-correlate version is the OCC check: 412 ERR_STALE_CORRELATION_VERSION."
        test_recipe:
          setup: ["complaint CORRELATED (first correlate consumed version 2 -> 3); two OPERATED flights available"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Occ One", email: "occ1@x.com", address_line: "1 Occ St", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Occ", iata_code: "AOC", contact_email: "ops@airocc.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AOC1", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-15T11:55:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f1: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AOC2", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-15T11:56:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f2: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${f1}", payload: { status: "OPERATED", actual_at: "2026-07-15T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "PATCH /noise-program/flight-operations/${f2}", payload: { status: "OPERATED", actual_at: "2026-07-15T12:01:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { c_v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/correlate", payload: { flight_id: "${f1}", expected_complaint_version: "${c_v}" }, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/correlate", payload: { flight_id: "${f2}", expected_complaint_version: "${c_v}" }, as: NoiseAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_CORRELATION_VERSION (http 412) — the state guard passes (CORRELATED allows re-correlation), only OCC rejects"

      - name: occ_stale_fund_version_on_issue_offer_rejected
        claim_type: stale_version_occ
        grounds:
          - "concurrency_rules[offer-issue-stale-fund]"
        distinguishing_aspect: "Two eligible applications, one fund: issuing the first offer advances fund.version; the second issue-offer carrying the pre-first-offer version -> 412 ERR_STALE_FUND_VERSION even though funds remain."
        test_recipe:
          setup: ["ACTIVE fund 20,000,000; ADOPTED study; parcels P-O1/P-O2 (measured 72.0); applications A1/A2 ELIGIBLE_TIER1 (est 300,000 each)"]
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 20000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Aleph", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-O1", land_use: "RESIDENTIAL", dnl_db_measured: 72.0, dnl_db_modeled: 73.0, zone_code: "Z1" }, as: StudyCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-O2", land_use: "RESIDENTIAL", dnl_db_measured: 72.0, dnl_db_modeled: 73.0, zone_code: "Z1" }, as: StudyCoordinator, captures: { p2: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p1}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 300000 }, as: CommunityLiaison, captures: { a1: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p2}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 300000 }, as: CommunityLiaison, captures: { a2: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${a2}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${a2}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${a2}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fv: $.data.version } }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/issue-offer", payload: { expected_fund_version: "${fv}" }, as: NoiseOfficeAdmin, captures: { a1_fs: $.data.funding_status } }
            - { call: "POST /noise-program/sound-insulation-applications/${a2}/issue-offer", payload: { expected_fund_version: "${fv}" }, as: NoiseOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "a1_fs == OFFER_ISSUED (first offer advanced fund.version)"
            - "err == ERR_STALE_FUND_VERSION (http 412) for the second offer carrying the superseded version"

      - name: layer_cascading_side_effects
        claim_type: cross_cutting_layer
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
        excluded_because:
          difficulty_instance: study_adoption_cascade_parcel_application_fund
          rationale: "N-level cascade verified end-to-end by the §1.8 transitive_cascade instances (adoption depth-3, classification, escalation)."

      - name: layer_rate_threshold_triggers
        claim_type: cross_cutting_layer
        grounds:
          - "complexity_profile.complexity_layers[rate_threshold_triggers]"
        excluded_because:
          difficulty_instance: repeat_standing_threshold_9_vs_10_complaints
          rationale: "Cumulative threshold boundary (9 vs 10) asserted in the §1.8 boundary instance."

      - name: layer_dual_variant_calculation
        claim_type: cross_cutting_layer
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
        excluded_because:
          difficulty_instance: grant_provisional_vs_final_obligation_reconciled
          rationale: "Variant divergence + reconciliation covered by the three §1.8 dual_variant_calc instances."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All mutations are visible in the same request's response and in the immediately following read: complaint create -> complainant open_count == 1 on immediate GET; no lag."
        test_recipe:
          setup: ["one complainant"]
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "IC One", email: "ic1@x.com", address_line: "1 Imm Rd", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
          trigger:
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T09:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_st: $.data.status } }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { o: $.data.open_count, f: $.data.filed_total, c90: $.data.complaints_90d } }
          assert:
            - "c_st == RECEIVED in the create response itself"
            - "o == 1 and f == 1 and c90 == 1 on the immediate read"
