              as: Teacher
              as_user_id: "teacher-1"
              captures: { ev1: $.data.id }
            - call: "POST /sped-staffing/evaluations/${ev1}/submit"
              as: Teacher
              as_user_id: "teacher-1"
            - call: "POST /sped-staffing/evaluations/${ev1}/countersign"
              as: BuildingAdministrator
              as_user_id: "admin-9"
              captures: { ev1_cs: $.data.countersigned_by_user_id }
            - call: "POST /sped-staffing/evaluations"
              payload: { plan_id: "${plan_id}", para_id: "${p1}", period_start: "2026-03-01", period_end: "2026-04-30", professionalism_score: 2, instructional_support_score: 2, comments: "concerns" }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { ev2: $.data.id }
            - call: "POST /sped-staffing/evaluations/${ev2}/submit"
              as: Teacher
              as_user_id: "teacher-1"
            - call: "POST /sped-staffing/evaluations/${ev2}/countersign"
              as: BuildingAdministrator
              as_user_id: "admin-9"
          trigger:
            - call: "POST /sped-staffing/evaluations/${ev1}/acknowledge"
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ev1_st: $.data.status }
            - call: "POST /sped-staffing/evaluations/${ev2}/dispute"
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { ev2_st: $.data.status }
            - call: "POST /sped-staffing/evaluations/${ev2}/resolve"
              payload: { resolution_note: "reviewed with principal; scores stand" }
              as: BuildingAdministrator
              as_user_id: "admin-9"
              captures: { ev2_fin: $.data.status }
          assert:
            - "Evaluation.${ev1}.countersigned_by_user_id == 'admin-9' and status == ACKNOWLEDGED"
            - "Evaluation.${ev2}: after dispute status == DISPUTED; after resolve status == RESOLVED and resolution_note == 'reviewed with principal; scores stand'"

      - name: evaluation_submit_by_other_teacher_returns_not_own
        claim_type: violation_to_error
        grounds: [entities.Evaluation.fields.created_by_user_id]
        distinguishing_aspect: "Only the authoring teacher (created_by_user_id) may submit; another teacher id is rejected."
