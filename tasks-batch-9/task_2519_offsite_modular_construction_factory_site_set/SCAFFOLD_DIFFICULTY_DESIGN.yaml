            - "${blocked} == 'ERR_PLAN_REVIEW_PREREQUISITE' with HTTP 409 — the identical payload is refused purely because of the OTHER entity's state, and the local AHJ approval does not substitute"
            - "GET /modular/projects/${proj} reports permit_posture == 'SITE_CLEARED_ONLY' at that moment"
            - "${sapproved} == 'APPROVED' and ${pinned} == ${pkg} — approval pins the frozen revision"
            - "${allowed} == 'SLOTTED' and ${mins} == 540 — the same request now succeeds with no change to the module itself"
            - "GET /modular/projects/${proj} reports permit_posture == 'STATE_CLEARED_ONLY' after the state approval (bifurcation tie-break: the state track is reported when both are partially cleared)"

