            - call: "POST /members"
              payload: { email: "c17@x.com", full_name: "C Seventeen", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c17: $.data.id, c17_v0: $.data.version }
            - call: "POST /members/${c17}/topup"
              payload: { amount_cents: 5000 }
              as: Member
              as_user_id: "${c17}"
          trigger:
            - call: "POST /lockers"
              payload: { member_id: "${c17}", label: "L3", capacity_liters: 100, used_liters: 10, expected_member_version: "${c17_v0}" }
              as: Member
              as_user_id: "${c17}"
              captures: { err: $.data.error_id }
          assert:
