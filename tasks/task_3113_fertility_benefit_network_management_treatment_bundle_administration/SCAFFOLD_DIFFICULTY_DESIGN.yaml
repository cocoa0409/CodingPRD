# ===========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 instances, different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: clinical_criteria_approval_floor_exactly_seventy
        grounds:
          - calculations.clinical_criteria_gate
          - state_machines.Preauthorization."CLINICAL_REVIEW / UNCONSUMED"_to_"APPROVED / UNCONSUMED"
          - state_machines.Preauthorization."CLINICAL_REVIEW / UNCONSUMED"_to_"DENIED / UNCONSUMED"
          - errors[ERR_CLINICAL_CRITERIA_NOT_MET]
          - endpoints.POST_/preauthorizations/{id}/decide
        distinguishing_aspect: "The numeric threshold boundary at exactly 70: one criteria profile scores 69 and must be DENIED with ERR_CLINICAL_CRITERIA_NOT_MET, an adjacent profile scores 70 and must be APPROVED — a strict-greater-than implementation flips both outcomes, and the two profiles differ by a single penalty band rather than by an arbitrary amount."
