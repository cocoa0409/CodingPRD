      - name: cascading_provider_suspend_also_cascades_to_credentials_via_terminate
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Provider.transitions.ACTIVE_to_TERMINATED
          - state_machines.SubmitterCredential
        distinguishing_aspect: "Provider terminate cascades to credentials (all non-REVOKED → REVOKED) — distinct cascade pattern from the suspend path exercised in §1.8."
        test_recipe:
          setup:
            - "Provider ACTIVE with one ACTIVE credential; no in-flight claims or enrollments; no OPEN/FINALIZED usage invoices."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
