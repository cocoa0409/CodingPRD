              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
          trigger:
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 15 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 15, supersedes_application_id: "${a1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { err_target: $.data.error_id }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "DECLINE", decline_reason_code: "CLTV_LIMIT" }
              as: UnderwritingAnalyst
              as_user_id: "u_ana_1"
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 15, supersedes_application_id: "${a1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a2: $.data.id, a2_status: $.data.status, a2_super: $.data.supersedes_application_id }
          assert:
            - "Violation: 409 err_dup == 'ERR_DUPLICATE_ACTIVE_APPLICATION' — a DRAFT sibling counts as active"
            - "A supersede pointer does not buy an exemption while the target is still live: 422 err_target == 'ERR_INVALID_SUPERSEDE_TARGET' (priority 10 outranks 38 here because the target's status is neither DECLINED nor WITHDRAWN)"
            - "Satisfaction: once Application.${a1}.status == 'DECLINED' the identical request returns 201 with a2_status == 'DRAFT' and a2_super == '${a1}'"
