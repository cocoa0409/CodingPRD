      - name: order_create_on_suspended_blocked_but_receive_allowed
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_AGREEMENT_NOT_ACTIVE]", "state_machines.PrimeVendorAgreement.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "SUSPENDED blocks NEW orders but in-flight fulfillment continues: the pre-existing order receives normally while a fresh order create fails."
        test_recipe:
          setup: ["Facility F; product P1 price 100; agreement committed 95.0; O1 (x200) placed AND O2 (x50) placed before breach; O1 shipped 170 cancel, received -> SUSPENDED; O2 shipped 50 fully"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac VS", health_system_name: "HS VS", facility_type: "ACUTE_CARE", ship_to_address: "37 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "VS-1", name: "Suspend item", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 3, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 200 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-12", lines: [ { product_id: "${p1_id}", ordered_qty: 50 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 170, backorder_cancelled: true } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 50, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-20", lines: [ { product_id: "${p1_id}", ordered_qty: 10 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
              captures: { o2_status: $.data.status }
          assert:
            - "New order on SUSPENDED agreement: HTTP 409 ERR_AGREEMENT_NOT_ACTIVE"
            - "Pre-existing O2 RECEIVED succeeds: status == RECEIVED (rolling (170+50)/(190+50) = 91.67 still < 95.0, agreement stays SUSPENDED)"
      - name: order_create_commitment_exceeded_fires
