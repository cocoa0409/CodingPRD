              as: OutagePlanner
              captures: { b1_constraint_attached: "$.data.constraint_status", b1_path_attached: "$.data.path_length_hours" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { projected_attached: "$.data.projected_duration_hours", risk_attached: "$.data.risk_adjusted_duration_hours", cp_attached: "$.data.critical_path_activity_id" }
            - call: "POST /schedule-activities/${b1_id}/set-predecessor"
