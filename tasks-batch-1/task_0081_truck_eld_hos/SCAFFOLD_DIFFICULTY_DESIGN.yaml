            - "Link 3: exactly 1 HOSViolation violation_type=DRIVING_11H status=OPEN overage_minutes == 1."
      - name: markerror_cascades_clock_recompute_to_violation_dismiss
        grounds:
          - state_machines.DutyStatusEvent.ACTIVE_to_INACTIVE_ERROR
          - state_machines.HOSViolation.OPEN_to_DISMISSED
          - calculations.hos_clocks
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (mark-error on CarrierAdmin): mark-error sets
          record_status INACTIVE_ERROR which removes the interval from hos_clocks -> the recompute
          finds the previously-open DRIVING_11H trigger interval no longer crosses 660 -> that
          HOSViolation auto-transitions OPEN->DISMISSED; the dismiss is caused by the recompute, not
          by the mark-error call directly.
        test_recipe:
          setup:
            - "Driver D drove DRIVING 06:30 -> OFF_DUTY 17:31 (661 min) -> OPEN DRIVING_11H violation; the OFF_DUTY closing event is then marked erroneous, leaving the DRIVING event open (duration null), so no closed interval crosses 660."
