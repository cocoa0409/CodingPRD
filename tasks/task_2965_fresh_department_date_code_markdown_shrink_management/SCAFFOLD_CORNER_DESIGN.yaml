            - "DELI report: revenue_cents == 2495, cogs_cents == 1553 (1552.5 rounded half up per line), shrink_cost_cents == 0, gross_margin_cents == 942, gross_margin_pct == 37.76, shrink_cost_ratio_pct == 0.0"
            - "rollup: department_count == 2, revenue_cents == 8485, cogs_cents == 5900, shrink_cost_cents == 869, donation_cost_cents == 0, gross_margin_cents == 1716"
            - "rollup: gross_margin_pct == 20.22 and shrink_cost_ratio_pct == 12.84"
            - "GET /fresh/departments/${dept_meat} still returns data.shrink_cost_ratio_pct unchanged by the read (the report writes nothing)"

      - name: waiver_is_permitted_only_on_a_multiplier_one_finding
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fresh/audit-findings/{findingId}/remediate]
          - validations[priority 19]
          - errors[ERR_WAIVER_NOT_PERMITTED]
          - calculations.compliance_severity
        distinguishing_aspect: |
          The same endpoint, the same payload and the same role split on one derived number: the
          finding 2 hours past date (inside the department's 4-hour tolerance, multiplier 1) can be
          waived, while the finding 26 hours past date (multiplier 3) answers
          ERR_WAIVER_NOT_PERMITTED (422) and can only be closed by remediation WITHDRAWN.
        test_recipe:
          setup:
            - "Clock 2026-08-08T06:00:00.000Z; the MEAT chain with the default past_date_tolerance_hours 4."
            - "Lot X produced 2026-07-30 (4 units, sell_by 2026-08-09T00:00:00.000Z) created before lot Y produced 2026-07-29 (3 units, sell_by 2026-08-08T00:00:00.000Z)."
            - "Clock moved to 2026-08-09T02:00:00.000Z and one audit opened on [2026-08-09T00:00:00.000Z, 2026-08-10T00:00:00.000Z) and swept, producing finding X (2 h past date, multiplier 1, 4 points) then finding Y (26 h past date, multiplier 3, 9 points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T06:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-07-30", quantity_original: 4 }
              as: FreshClerk
              captures: { lot_x: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-07-29", quantity_original: 3 }
              as: FreshClerk
              captures: { lot_y: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T02:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/compliance-audits"
              payload: { department_id: "${dept_id}", window_start_at: "2026-08-09T00:00:00.000Z", window_end_at: "2026-08-10T00:00:00.000Z" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /fresh/compliance-audits/${audit_id}/sweep"
              payload: {}
              as: ComplianceAuditor
            - call: "GET /fresh/audit-findings?audit_id=${audit_id}&status=OPEN&limit=10&offset=0"
              payload: {}
              as: ComplianceAuditor
              captures: { finding_x: "$.data[0].id", finding_y: "$.data[1].id" }
          trigger:
            - call: "POST /fresh/audit-findings/${finding_y}/remediate"
              payload: { waive: true, resolution_note: "aged out overnight" }
              as: ComplianceAuditor
            - call: "POST /fresh/audit-findings/${finding_x}/remediate"
              payload: { waive: true, resolution_note: "inside tolerance, pulled at open" }
              as: ComplianceAuditor
            - call: "POST /fresh/audit-findings/${finding_y}/remediate"
              payload: { remediation: "WITHDRAWN", resolution_note: "off the shelf" }
              as: ComplianceAuditor
          assert:
            - "sweep: data.past_date_lot_count == 2, data.past_date_units_total == 7, data.severity_points_total == 13, data.severity == 'MAJOR'"
            - "finding list: total_count == 2, row 0 has lot_id == ${lot_x} with hours_past_date == 2, severity_multiplier == 1, severity_points == 4; row 1 has lot_id == ${lot_y} with hours_past_date == 26, severity_multiplier == 3, severity_points == 9"
            - "first remediate: HTTP 422 with data.error_id == 'ERR_WAIVER_NOT_PERMITTED' and AuditFinding.${finding_y}.status still 'OPEN'"
            - "second remediate: HTTP 200 with data.status == 'WAIVED', data.remediation == 'NONE' and data.resolved_by_user_id set"
            - "DateCodeLot.${lot_x}.status == 'FRESH' and quantity_on_hand == 4 (a waiver touches no units)"
            - "third remediate: HTTP 200 with data.status == 'RESOLVED' and data.remediation == 'WITHDRAWN'"
            - "DateCodeLot.${lot_y}.status == 'WITHDRAWN' and quantity_on_hand == 0"
            - "ComplianceAudit.${audit_id}.disposition_status == 'REMEDIATED' (the last open finding closed) with sweep_status still 'SWEPT'"
            - "GET /fresh/departments/${dept_id} returns data.open_finding_count == 0 and data.compliance_status == 'WATCH' (the MAJOR audit is remediated, but the trailing shrink ratio is 100.0 against the 2.5 budget)"

  # =========================================================================
  # errors
  # =========================================================================
  - section: errors
    instances:
      - name: every_read_answers_its_own_entity_specific_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority 4]
          - errors[ERR_STORE_NOT_FOUND]
          - errors[ERR_PARTNER_NOT_FOUND]
          - errors[ERR_LADDER_NOT_FOUND]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
          - errors[ERR_LABEL_NOT_FOUND]
          - errors[ERR_CHECK_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_SHRINK_EVENT_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_FINDING_NOT_FOUND]
          - errors[ERR_RECOMMENDATION_NOT_FOUND]
        distinguishing_aspect: |
          The catalog gives each entity its own 404 code rather than one generic NOT_FOUND, so the
          same syntactically valid UUID produces eleven different error_id values depending only on
          the collection segment it is read from.
        test_recipe:
          setup:
            - "Empty database; only the logical clock is set. No entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
          trigger:
            - call: "GET /fresh/stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/food-bank-partners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/markdown-ladders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/departments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/markdown-labels/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/scan-price-checks/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/donation-assignments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/shrink-events/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/compliance-audits/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/audit-findings/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
            - call: "GET /fresh/order-recommendations/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreOperationsAdmin
          assert:
            - "stores read: HTTP 404 with data.error_id == 'ERR_STORE_NOT_FOUND'"
            - "food-bank-partners read: HTTP 404 with data.error_id == 'ERR_PARTNER_NOT_FOUND'"
            - "markdown-ladders read: HTTP 404 with data.error_id == 'ERR_LADDER_NOT_FOUND'"
            - "departments read: HTTP 404 with data.error_id == 'ERR_DEPARTMENT_NOT_FOUND'"
            - "markdown-labels read: HTTP 404 with data.error_id == 'ERR_LABEL_NOT_FOUND'"
            - "scan-price-checks read: HTTP 404 with data.error_id == 'ERR_CHECK_NOT_FOUND'"
            - "donation-assignments read: HTTP 404 with data.error_id == 'ERR_ASSIGNMENT_NOT_FOUND'"
            - "shrink-events read: HTTP 404 with data.error_id == 'ERR_SHRINK_EVENT_NOT_FOUND'"
            - "compliance-audits read: HTTP 404 with data.error_id == 'ERR_AUDIT_NOT_FOUND'"
            - "audit-findings read: HTTP 404 with data.error_id == 'ERR_FINDING_NOT_FOUND'"
            - "order-recommendations read: HTTP 404 with data.error_id == 'ERR_RECOMMENDATION_NOT_FOUND'"

      - name: registry_uniqueness_conflicts_are_scoped_to_their_declared_keys
        claim_type: violation_to_error
        grounds:
          - validations[priority 40]
          - errors[ERR_STORE_NUMBER_DUPLICATE]
          - errors[ERR_LADDER_NAME_DUPLICATE]
          - errors[ERR_DEPARTMENT_CODE_DUPLICATE]
        distinguishing_aspect: |
          store_number and ladder name are globally unique while a department is unique only on
          (store_id, code): re-registering store_number 0412 or ladder name MEAT-STD-2026 is a 409,
          yet the very same MEAT code is accepted on a second store, which a store-blind uniqueness
          check would refuse.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00.000Z; store 0412 in MID-ATL, an ACTIVE MEAT ladder and a MEAT department on store 0412."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_a: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_a}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
          trigger:
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412 Annex", region_code: "SOUTH-E" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "SEAFOOD", rungs: [{ days_remaining_max: 2, discount_pct: 30, requires_manager_approval: false }] }
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_a}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 8 }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0413", name: "Fresh Market 0413", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_b: $.data.id }
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_b}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_b: $.data.id }
          assert:
            - "store retry: HTTP 409 with data.error_id == 'ERR_STORE_NUMBER_DUPLICATE'"
            - "ladder retry: HTTP 409 with data.error_id == 'ERR_LADDER_NAME_DUPLICATE' (the name collides even though department_code differs)"
            - "department retry on store 0412: HTTP 409 with data.error_id == 'ERR_DEPARTMENT_CODE_DUPLICATE'"
            - "store 0413: HTTP 201"
            - "department MEAT on store 0413: HTTP 201 with data.code == 'MEAT' and data.store_id == ${store_b}"
            - "GET /fresh/stores?region_code=MID-ATL&limit=10&offset=0 returns total_count == 2"

      - name: the_same_lot_cannot_be_manifested_twice_on_one_pickup
        claim_type: violation_to_error
        grounds:
          - validations[priority 36]
          - errors[ERR_DUPLICATE_LOT_ASSIGNMENT]
        distinguishing_aspect: |
          Uniqueness is on (pickup, lot) restricted to lines in ASSIGNED or PICKED_UP: the second
          line for the same lot is a 409 that leaves assignment_count at 1, while a different lot on
          the same pickup is accepted, taking the count to 2.
        test_recipe:
          setup:
            - "Donation-enabled store 0412, a MID-ATL partner accepting PRODUCE, a PRODUCE department, two 10-unit lots produced 2026-08-10 and one SCHEDULED pickup; clock at 2026-08-13T00:00:00.000Z where both donation windows are open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL", dock_door_codes: ["D1"], donation_program_enabled: true }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/food-bank-partners"
              payload: { name: "Mid-Atlantic Food Bank", contact_email: "ops@mafb.example", service_region_code: "MID-ATL", accepted_department_codes: ["PRODUCE"] }
              as: StoreOperationsAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "PRODUCE-STD-2026", department_code: "PRODUCE", rungs: [{ days_remaining_max: 2, discount_pct: 25, requires_manager_approval: false }, { days_remaining_max: 0, discount_pct: 50, requires_manager_approval: true }], max_total_discount_pct: 50 }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "PRODUCE", shelf_life_days_default: 5 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000444555666", description: "Blueberries 6oz", base_retail_cents: 599, unit_cost_cents: 300, daily_forecast_units: 8.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-10", quantity_original: 10 }
              as: FreshClerk
              captures: { lot_one: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-10", quantity_original: 10 }
              as: FreshClerk
              captures: { lot_two: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_id}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T00:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_one}", quantity_units: 4 }
              as: FreshClerk
          trigger:
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_one}", quantity_units: 6 }
              as: FreshClerk
            - call: "POST /fresh/donation-pickups/${pickup_id}/assignments"
              payload: { lot_id: "${lot_two}", quantity_units: 10 }
              as: FreshClerk
          assert:
            - "first call: HTTP 409 with data.error_id == 'ERR_DUPLICATE_LOT_ASSIGNMENT'"
            - "after the refusal: DonationPickup.${pickup_id}.assignment_count == 1 and provisional_value_cents == 2396"
            - "second call: HTTP 201 with data.lot_id == ${lot_two} and data.line_value_cents == 5990"
            - "DonationPickup.${pickup_id}.assignment_count == 2 and provisional_value_cents == 8386"
            - "GET /fresh/donation-assignments?pickup_id=${pickup_id}&limit=10&offset=0 returns total_count == 2"

      - name: registry_reference_gates_reject_before_any_row_is_written
        claim_type: violation_to_error
        grounds:
          - validations[priority 22]
          - validations[priority 24]
          - validations[priority 25]
          - validations[priority 26]
          - errors[ERR_LADDER_DEPARTMENT_MISMATCH]
          - errors[ERR_ITEM_DISCONTINUED]
          - errors[ERR_DONATION_PROGRAM_DISABLED]
          - errors[ERR_DOCK_DOOR_UNKNOWN]
          - errors[ERR_PARTNER_REGION_MISMATCH]
        distinguishing_aspect: |
          Five different referential gates read five different neighbours of the request: the
          ladder's department_code, the item's status, the store's donation flag, the store's
          dock_door_codes list and the partner's service_region_code. Each refusal writes nothing,
          and the final pickup with the MID-ATL partner on dock D1 proves nothing else was wrong.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00.000Z; store 0412 in MID-ATL with dock_door_codes ['D1'] and donation_program_enabled left at its false default."
            - "An ACTIVE DELI ladder, an ACTIVE PRODUCE ladder, a PRODUCE department, one item later switched to DISCONTINUED, a MID-ATL partner and a SOUTH-E partner, both accepting PRODUCE."
