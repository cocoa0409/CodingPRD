              payload: { amount_cents: 300000, note: "Resurfacing assessment" }
              as: Treasurer
              as_user_id: tr-001
              captures: { s_unalloc: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Duties Household", address_line: "371 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/capital-projects"
              payload: { funding_season_id: "${s27_id}", project_kind: "POOL_RESURFACING", title: "Resurface the main tank", budget_cents: 250000 }
              as: Treasurer
              as_user_id: tr-001
              captures: { proj_id: $.data.id, proj_requester: $.data.requested_by_user_id, proj_status_0: $.data.status, proj_approver_0: $.data.approved_by_user_id }
            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_id}", subject_name: "Guest of the household", severity: "MINOR", narrative: "Repeated running on the deck after two warnings." }
              as: BoardPresident
              as_user_id: bp-001
              captures: { case_id: $.data.id, case_reporter: $.data.reported_by_user_id, case_status_0: $.data.status }
            - call: "POST /swim-club/conduct-cases/${case_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { case_status_1: $.data.status }
            - call: "POST /swim-club/inspection-findings"
              payload: { season_id: "${s27_id}", inspected_on: "2027-06-28", inspector_name: "K. Adeyemi", finding_code: "SIGN-02", severity: "MINOR", narrative: "Depth marking faded at the shallow end." }
              as: HealthInspector
              as_user_id: hi-001
              captures: { find_id: $.data.id, find_recorder: $.data.recorded_by_user_id, find_status_0: $.data.status }
            - call: "POST /swim-club/inspection-findings/${find_id}/transitions"
              payload: { to_status: "REMEDIATION_SUBMITTED", remediation_note: "Depth markings repainted on 2027-06-30." }
              as: PoolManager
              captures: { find_status_1: $.data.status }
          trigger:
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Treasurer
              as_user_id: tr-001
              captures: { err_self_approve: $.data.error_id }
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Treasurer
              as_user_id: tr-002
              captures: { err_wrong_office: $.data.error_id }
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: BoardPresident
              as_user_id: bp-002
              captures: { proj_status_1: $.data.status, proj_approver_1: $.data.approved_by_user_id }
            - call: "POST /swim-club/conduct-cases/${case_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "WARNING" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { err_self_sanction: $.data.error_id }
            - call: "POST /swim-club/conduct-cases/${case_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "WARNING" }
              as: BoardPresident
              as_user_id: bp-002
              captures: { case_status_2: $.data.status, case_decider: $.data.decided_by_user_id, case_sanction: $.data.sanction_type }
            - call: "POST /swim-club/inspection-findings/${find_id}/transitions"
              payload: { to_status: "VERIFIED_CLOSED" }
              as: HealthInspector
              as_user_id: hi-001
              captures: { err_self_close: $.data.error_id }
            - call: "POST /swim-club/inspection-findings/${find_id}/transitions"
              payload: { to_status: "VERIFIED_CLOSED" }
              as: HealthInspector
              as_user_id: hi-002
              captures: { find_status_2: $.data.status, find_verifier: $.data.verified_by_user_id }
          assert:
            - "the fixture stamps the creators from the header: ${proj_requester} == tr-001, ${case_reporter} == bp-001 and ${find_recorder} == hi-001, with ${proj_status_0} == PROPOSED, ${proj_approver_0} == null, ${case_status_0} == REPORTED, ${case_status_1} == UNDER_REVIEW, ${find_status_0} == OPEN and ${find_status_1} == REMEDIATION_SUBMITTED"
            - "${err_self_approve} == ERR_SEGREGATION_OF_DUTIES with HTTP 403: Treasurer is in the endpoint's role list, so this is not a 403 from priority 3"
            - "${err_wrong_office} == ERR_SEGREGATION_OF_DUTIES too, and NOT a success: a second Treasurer is a different user but the APPROVED edge is reserved to the BoardPresident, so the two-person rule and the edge actor are both enforced"
            - "${proj_status_1} == APPROVED with ${proj_approver_1} == bp-002, which is a DIFFERENT board user from the one that created the season, proving the rule compares against requested_by_user_id and nothing else"
            - "${err_self_sanction} == ERR_SEGREGATION_OF_DUTIES for bp-001, who reported the case, even though bp-001 is exactly the role the SANCTIONED edge requires"
            - "${case_status_2} == SANCTIONED with ${case_decider} == bp-002 and ${case_sanction} == WARNING: same role, different user, and the decider is recorded"
            - "${err_self_close} == ERR_SEGREGATION_OF_DUTIES for hi-001, who filed the finding, so an inspector may never sign off its own paperwork"
            - "${find_status_2} == VERIFIED_CLOSED with ${find_verifier} == hi-002 and recorded_by_user_id still hi-001, so both halves of the two-person record survive"
            - "${s_unalloc} == 300000 is unchanged by any of these calls: none of the refused decisions moved money, and approval alone draws nothing"

  # ---------------------------------------------------------------------------
  # Complexity layers (§1.0 layer list)
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: optimistic_concurrency_a_stale_household_version_cannot_spend_a_pass_twice
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[guest-visit-record-stale-household]
          - validations[priority=38]
          - endpoints[POST /swim-club/guest-visits]
          - entities.Household.fields.guest_pass_balance
        distinguishing_aspect: |
          The guard is mandatory on this endpoint, so the OCC token is not an optimisation but part of
          the contract, and the failure mode it prevents is concrete: two sign-ins issued from the same
          screenshot of a two-pass household would spend three passes. The refused call is proved inert
          on the ledger AND on the version counter, so an implementation that bumps the version before
          validating is caught. The retry with the refreshed token is then accepted, which shows the
          412 was about staleness and not about the payload.
        test_recipe:
          setup:
            - "One COUPLE category with guest_pass_allotment 2; one OPEN 2027 season with guest_settlement_policy PASS_FIRST."
            - "One household with an invoiced ACTIVE membership, owing nothing, so priority 80 stays silent."
            - "The clock sits at 2027-07-01T09:00Z and every visit is backdated to 2027-06-25T14:00Z, inside the season window and in the past."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Occ Guest Household", address_line: "381 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v0: $.data.version, h_granted_0: $.data.guest_pass_allotment_granted, h_consumed_0: $.data.guest_passes_consumed, h_balance_0: $.data.guest_pass_balance }
          trigger:
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "First Sign In", guest_count: 1, visit_start_iso: "2027-06-25T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { v1_id: $.data.id, v1_passes: $.data.passes_used, v1_fee: $.data.fee_charged_cents, v1_variant: $.data.settlement_variant }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v1: $.data.version, h_consumed_1: $.data.guest_passes_consumed, h_balance_1: $.data.guest_pass_balance }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Second Sign In From A Stale Screen", guest_count: 1, visit_start_iso: "2027-06-25T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { err_stale: $.data.error_id }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v2: $.data.version, h_consumed_2: $.data.guest_passes_consumed }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Second Sign In Retried", guest_count: 1, visit_start_iso: "2027-06-25T14:00:00Z", expected_household_version: "${h_v1}" }
              as: PoolManager
              captures: { v2_id: $.data.id, v2_passes: $.data.passes_used, v2_fee: $.data.fee_charged_cents }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v3: $.data.version, h_consumed_3: $.data.guest_passes_consumed, h_balance_3: $.data.guest_pass_balance, h_owed_3: $.data.guest_fee_owed_cents }
            - call: "GET /swim-club/guest-visits"
              payload: { membership_id: "${m_id}" }
              as: PoolManager
              captures: { visit_list: $.data }
          assert:
            - "${h_granted_0} == 2, ${h_consumed_0} == 0 and ${h_balance_0} == 2 before any visit"
            - "the first visit is HTTP 201 with ${v1_variant} == PASS_FIRST, ${v1_passes} == 1 and ${v1_fee} == 0"
            - "${h_v1} == ${h_v0} + 1 with ${h_consumed_1} == 1 and ${h_balance_1} == 1: recording a visit is a household write"
            - "${err_stale} == ERR_STALE_HOUSEHOLD_VERSION with HTTP 412 for the replay of ${h_v0}, and this is not a 409 or a 422"
            - "${h_v2} == ${h_v1} and ${h_consumed_2} == 1: the refused call bumped nothing, so the version counter is written only after the guard passes"
            - "the retry carrying ${h_v1} is HTTP 201 with ${v2_passes} == 1 and ${v2_fee} == 0, proving the payload was always acceptable"
            - "${h_v3} == ${h_v1} + 1, ${h_consumed_3} == 2, ${h_balance_3} == 0 and ${h_owed_3} == 0: exactly two of the two passes were spent, never three"
            - "${visit_list} holds exactly 2 rows, {${v1_id}, ${v2_id}}: the refused sign-in left no GuestVisit behind"

      - name: optimistic_concurrency_a_stale_project_version_cannot_overdraw_the_reserve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capital-project-fund-stale-project]
          - validations[priority=39]
          - endpoints[POST /swim-club/capital-projects/{id}/fund]
          - calculations.capital_reserve_position
        distinguishing_aspect: |
          The token guards a figure the client cannot see in its own request: funded_cents lives on the
          project while the ceiling it is compared against lives on the season, so two treasurers
          working from the same approved project page would each believe there was room. The instance
          proves the guard is checked BEFORE the money rules by replaying a stale version on a draw
          that would also have breached the budget, and getting the 412 rather than the 422.
        test_recipe:
          setup:
            - "One OPEN 2027 season carrying a single 300000 reserve contribution."
            - "One capital project proposed by tr-001 with budget_cents 250000 and approved by bp-001, so priorities 3 and 5 are satisfied on every later call."
            - "The clock sits at 2027-07-01T09:00Z; nothing in this instance depends on it."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              as_user_id: bp-001
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/seasons/${s27_id}/reserve-contributions"
              payload: { amount_cents: 300000, note: "Resurfacing assessment" }
              as: Treasurer
              as_user_id: tr-001
              captures: { s_res_0: $.data.reserve_contributions_cents, s_unalloc_0: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects"
              payload: { funding_season_id: "${s27_id}", project_kind: "PUMP_REPLACEMENT", title: "Replace the circulation pump", budget_cents: 250000 }
              as: Treasurer
              as_user_id: tr-001
              captures: { proj_id: $.data.id, proj_funded_0: $.data.funded_cents }
            - call: "POST /swim-club/capital-projects/${proj_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: BoardPresident
              as_user_id: bp-002
              captures: { proj_status_0: $.data.status }
            - call: "GET /swim-club/capital-projects/${proj_id}"
              payload: {}
              as: Treasurer
              captures: { proj_v0: $.data.version }
          trigger:
            - call: "POST /swim-club/capital-projects/${proj_id}/fund"
              payload: { draw_amount_cents: 100000, expected_capital_project_version: "${proj_v0}" }
              as: Treasurer
              as_user_id: tr-001
              captures: { proj_status_1: $.data.status, proj_funded_1: $.data.funded_cents, proj_v1: $.data.version }
            - call: "POST /swim-club/capital-projects/${proj_id}/fund"
              payload: { draw_amount_cents: 100000, expected_capital_project_version: "${proj_v0}" }
              as: Treasurer
              as_user_id: tr-002
              captures: { err_stale: $.data.error_id }
            - call: "POST /swim-club/capital-projects/${proj_id}/fund"
              payload: { draw_amount_cents: 200000, expected_capital_project_version: "${proj_v0}" }
              as: Treasurer
              as_user_id: tr-002
              captures: { err_stale_beats_budget: $.data.error_id }
            - call: "GET /swim-club/capital-projects/${proj_id}"
              payload: {}
              as: Treasurer
              captures: { proj_v2: $.data.version, proj_funded_2: $.data.funded_cents }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Treasurer
              captures: { s_unalloc_1: $.data.reserve_unallocated_cents }
            - call: "POST /swim-club/capital-projects/${proj_id}/fund"
              payload: { draw_amount_cents: 100000, expected_capital_project_version: "${proj_v2}" }
              as: Treasurer
              as_user_id: tr-002
              captures: { proj_funded_3: $.data.funded_cents, proj_v3: $.data.version }
            - call: "GET /swim-club/seasons/${s27_id}"
              payload: {}
              as: Treasurer
              captures: { s_res_2: $.data.reserve_contributions_cents, s_unalloc_2: $.data.reserve_unallocated_cents }
          assert:
            - "${s_res_0} == 300000, ${s_unalloc_0} == 300000, ${proj_funded_0} == 0 and ${proj_status_0} == APPROVED before the first draw"
            - "the first draw is HTTP 200 with ${proj_status_1} == FUNDED, ${proj_funded_1} == 100000 and ${proj_v1} == ${proj_v0} + 1"
            - "${err_stale} == ERR_STALE_PROJECT_VERSION with HTTP 412 for the replay of ${proj_v0}, even though 100000 more would have fitted both the reserve and the budget"
            - "${err_stale_beats_budget} == ERR_STALE_PROJECT_VERSION, NOT ERR_DRAW_EXCEEDS_BUDGET: 100000 + 200000 > 250000 would also have failed, so the OCC guard is evaluated first"
            - "${proj_v2} == ${proj_v1} and ${proj_funded_2} == 100000: neither refusal moved the project"
            - "${s_unalloc_1} == 200000 == 300000 - 100000: neither refusal moved the season either, so no phantom draw was booked"
            - "the draw carrying the refreshed ${proj_v2} is HTTP 200 with ${proj_funded_3} == 200000 and ${proj_v3} == ${proj_v2} + 1"
            - "${s_res_2} == 300000 (contributions never fall) and ${s_unalloc_2} == 100000 == 300000 - 200000: the reserve identity survives a 412 in the middle of a funding sequence"

      - name: cascading_side_effects_conduct_suspension_reaches_the_meet_roster
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: conduct_suspension_cascade_to_meet_understaffing
          rationale: |
            The §1.8 instance already walks the four-hop chain - conduct case SANCTIONED with SUSPENSION
            -> household SUSPENDED -> memberships SUSPENDED with registrations REVOKED and future
            parties CANCELLED_BY_SUSPENSION -> volunteer assignments RELEASED and the meet dropping to
            UNDERSTAFFED with a recomputed penalty - and asserts every hop separately. There is nothing
            a corner case could add.

      - name: cascading_side_effects_finding_closure_reaches_membership_settlement
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: critical_finding_closure_cascade_to_membership_settlement
          rationale: |
            The §1.8 instance drives the CRITICAL finding closure cascade end to end: posture CLOSED,
            future parties and guard shifts cancelled with full refunds, the refunds landing as
            household account credit and then auto-applying to open membership balances. It asserts the
            hop-by-hop ordering that a corner case could only restate.

      - name: dual_variant_calculation_seasonal_dues_two_proration_bases
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: seasonal_dues_calendar_day_vs_swim_week_on_membership
          rationale: |
            Variant divergence, variant selection by the season and the strict inequality between the
            CALENDAR_DAY and SWIM_WEEK figures for the same join_date are all asserted by the §1.8
            instance, with the pinned cents for both bases. The corner-design calculations section
            already carries the matching excluded_because stubs.

      - name: dual_variant_calculation_guest_settlement_two_policies
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: guest_visit_pass_first_vs_fee_first_on_weekend
          rationale: |
            The §1.8 instance settles the same weekend visit under both policies from the same pass
            balance, showing PASS_FIRST burning passes while FEE_FIRST_ON_WEEKEND charges the weekend
            rate and preserves them, and reconciles the two on passes and fees.

  # ---------------------------------------------------------------------------
  # Consistency model (§1.0 consistency_model: immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_every_write_is_visible_in_its_own_response_and_the_next_read
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - endpoints[POST /swim-club/memberships/{id}/invoice]
          - endpoints[POST /swim-club/guest-visits]
          - entities.Household.fields.guest_fee_owed_cents
        distinguishing_aspect: |
          There is no eventual consistency anywhere in this API, so a mutating response must already
          carry every derived field it affected - not just the row that was addressed - and a follow-up
          read must be identical rather than merely eventually equal. The fixture deliberately spans
          entities: recording a guest visit changes counters on the HOUSEHOLD, and invoicing changes
          counters on the MEMBERSHIP, and both are asserted to be visible in the very next read with no
          refresh call, no polling and no background job in between.
        test_recipe:
          setup:
            - "One COUPLE category with guest_pass_allotment 2; one OPEN 2027 season with guest_settlement_policy PASS_FIRST."
            - "One household with a membership joined on the open_date, invoiced at clock 2027-07-01T09:00Z, so the totals are the pinned 31050."
            - "Guest visits are backdated to 2027-06-25T14:00Z, a Friday inside the season window."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Immediate Household", address_line: "391 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-05-22", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_id: $.data.id, m_dues_0: $.data.dues_status, m_access_0: $.data.access_status, m_assessed_0: $.data.assessed_dues_cents, m_total_0: $.data.invoice_total_cents }
          trigger:
            - call: "POST /swim-club/memberships/${m_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { w_dues: $.data.dues_status, w_access: $.data.access_status, w_total: $.data.invoice_total_cents, w_penalty: $.data.late_penalty_cents, w_balance: $.data.balance_due_cents, w_invoiced_at: $.data.invoiced_at, w_v: $.data.version }
            - call: "GET /swim-club/memberships/${m_id}"
              payload: {}
              as: Treasurer
              captures: { r_dues: $.data.dues_status, r_access: $.data.access_status, r_total: $.data.invoice_total_cents, r_penalty: $.data.late_penalty_cents, r_balance: $.data.balance_due_cents, r_invoiced_at: $.data.invoiced_at, r_v: $.data.version }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_v0: $.data.version }
            - call: "POST /swim-club/guest-visits"
              payload: { membership_id: "${m_id}", sponsor_name: "Immediate Guest", guest_count: 3, visit_start_iso: "2027-06-25T14:00:00Z", expected_household_version: "${h_v0}" }
              as: PoolManager
              captures: { v_id: $.data.id, v_passes: $.data.passes_used, v_fee: $.data.fee_charged_cents, v_status: $.data.status }
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: PoolManager
              captures: { h_consumed: $.data.guest_passes_consumed, h_balance: $.data.guest_pass_balance, h_owed: $.data.guest_fee_owed_cents, h_v1: $.data.version }
            - call: "GET /swim-club/memberships"
              payload: { household_id: "${h_id}" }
              as: Treasurer
              captures: { m_list: $.data }
            - call: "GET /swim-club/guest-visits/${v_id}"
              payload: {}
              as: PoolManager
              captures: { v_passes_again: $.data.passes_used, v_fee_again: $.data.fee_charged_cents }
          assert:
            - "at creation ${m_dues_0} == UNBILLED, ${m_access_0} == PENDING, ${m_assessed_0} == 30000 (stamped at creation) and ${m_total_0} == 0"
            - "the invoice response already carries every recomputed field: ${w_dues} == INVOICED, ${w_access} == ACTIVE, ${w_penalty} == 1050, ${w_total} == 31050, ${w_balance} == 31050 and ${w_invoiced_at} == 2027-07-01T09:00:00Z"
            - "the immediately following read is field-for-field identical: ${r_dues} == ${w_dues}, ${r_access} == ${w_access}, ${r_total} == ${w_total}, ${r_penalty} == ${w_penalty}, ${r_balance} == ${w_balance}, ${r_invoiced_at} == ${w_invoiced_at} and ${r_v} == ${w_v} - no second call was needed to settle the derived fields"
            - "the guest visit is HTTP 201 with ${v_passes} == 2, ${v_fee} == 500 == (3 - 2) * GUEST_FEE_WEEKDAY_CENTS and ${v_status} == RECORDED, so PASS_FIRST drained the balance and charged only the uncovered guest"
            - "the household read taken immediately afterwards shows ${h_consumed} == 2, ${h_balance} == 0, ${h_owed} == 500 and ${h_v1} == ${h_v0} + 1: a cross-entity computed counter is current on the very next read"
            - "${m_list} returns the membership with the same invoice_total_cents and balance_due_cents as the detail read, so list and detail projections never disagree"
            - "${v_passes_again} == ${v_passes} and ${v_fee_again} == ${v_fee}: re-reading the visit recomputes nothing and drifts nowhere"
            - "no endpoint in this API returns 202, no response carries a pending or eventual marker, and no test in the suite needs a retry loop to observe a write"
