      - name: open_lot_requires_auction_live_and_sequence_next
        grounds:
          - state_machines.Vehicle.LISTED_to_LIVE
          - state_machines.Auction.SCHEDULED_to_LIVE
          - errors.ERR_AUCTION_NOT_LIVE
          - errors.ERR_AUCTION_ITEM_OUT_OF_ORDER
        distinguishing_aspect: |
          Entity pair AuctionItem -> Auction (different pair than Vehicle ->
          TitleRecord): opening a lot is gated on Auction.status == LIVE, and
          once live, only the item whose sequence_number ==
          current_sequence_number + 1 may open — opening item 2 while
          current_sequence_number == 0 fails ERR_AUCTION_ITEM_OUT_OF_ORDER
