              payload: { brand_id: "${brand}", phone_number: "+15550000907", evidence_url: "https://e/907", evidence_text: "web", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000907", body: "hi", carrier_code: "VZW" }
              as: CampaignManager
              captures: { msg: $.data.id }
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /messaging/accounts/${acct}/messages/${msg}/delivery_outcome"
              payload: { outcome: "DELIVERED" }
              as: SystemDriver
            - call: "POST /messaging/accounts/${acct}/feedback_events"
              payload: { campaign_id: "${camp}", kind: "SPAM_COMPLAINT", message_id: "${msg}" }
              as: SystemDriver
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/snapshots"
              payload: { day_utc: "2026-09-01" }
              as: DeliverabilityAnalyst
          assert:
            - "DailySnapshot spam_rate_bps == 10000 (1 spam / 1 attempted)"
            - "Campaign.${camp}.trust_score == 80 (95 - 15 spam penalty; attempted 1 < GOOD_DAY_MIN_ATTEMPTED so no bonus)"
            - "Campaign.${camp}.status == APPROVED (volume gate 1 < 2000 blocks spam-floor suspension despite rate >= 300 bps)"
