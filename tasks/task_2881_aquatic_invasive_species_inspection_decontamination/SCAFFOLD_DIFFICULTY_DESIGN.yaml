  - rule_id: transitive_cascade
    instances:
      - name: detection_acceptance_cascades_four_hops_to_station_hours_staffing
        grounds:
          - state_machines.DetectionReport.SUBMITTED_to_ACCEPTED
          - calculations.water_body_infestation_status
          - entities.WaterBody.fields.live_detection_count
          - entities.InspectionStation.fields.mandatory_inspection
          - entities.StationHours.fields.staffing_level
        distinguishing_aspect: |
          Depth-4 chain across four different entities, each hop conditional on
          the previous hop's OUTCOME rather than on the original request:
          hop 1 DetectionReport SUBMITTED -> ACCEPTED, hop 2 WaterBody
          live_detection_count 1 -> 2 which crosses INFESTATION_CONFIRM_LIVE_THRESHOLD
          and sets infestation_status CONFIRMED_INFESTED with risk_tier HIGH,
          hop 3 InspectionStation.mandatory_inspection false -> true because the
          water body became CONFIRMED_INFESTED, hop 4 StationHours.staffing_level
          SINGLE -> DOUBLE because the station flipped. The identical
          acknowledgement of the FIRST report stops after hop 2 at SUSPECT, so
          the chain length is data-dependent and an implementation that fires
          hops 3-4 on every acceptance is caught by the setup state.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00Z."
            - "WaterBody 'Lake Mary Ronan' risk_tier MODERATE, infestation_status CLEAN, detection_count 0, live_detection_count 0."
            - "InspectionStation 'Mary Ronan Access' guarding that water body, mandatory_inspection FALSE, status OPEN, with one StationHours row at staffing_level SINGLE."
            - "Two watercraft, each with a screened-then-PASSED InspectionRecord whose prior_water_body_id is that water body."
            - "DetectionReport #1 (LIVE_ORGANISM) already SUBMITTED and ACCEPTED, so the water body sits at detection_count 1, live_detection_count 1, infestation_status SUSPECT, risk_tier still MODERATE - hop 2 only."
            - "DetectionReport #2 (LIVE_ORGANISM) SUBMITTED and awaiting the state verdict."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Lake Mary Ronan", state_code: "MT", water_body_class: "LAKE", risk_tier: "MODERATE", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Mary Ronan Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: false, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
              captures: { hrs_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
