            - call: "POST /claims/${claim_t_id}/lines"
              payload: { procedure_code: "99285", quantity_units: 1, unit_charge_cents: 20000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_t_id}/reprice"
              payload: { expected_claim_version: "${claim_t_v} + 1" }
              as: PayerRep
