            - "Loan.${l_id}.missed_payment_count == 0 (window not open at the exact due instant)"

      - name: disclosure_supersession_latest_filed_wins_per_type
        grounds:
          - state_machines.ComplianceDisclosure.FILED_to_SUPERSEDED
          - entities.ComplianceDisclosure.fields.status
          - entities.ComplianceDisclosure.fields.document_type
        distinguishing_aspect: >
          Aggregate single-occupancy semantics on the (loan_id, document_type) slot
          — distinct interval geometry from the half-open period window: filing a
          second SERIES_NOTE_PROSPECTUS for the same loan supersedes the prior FILED
          one so at most one FILED disclosure of a type occupies the slot.
        test_recipe:
          setup:
            - "Loan L exists; two SERIES_NOTE_PROSPECTUS disclosures filed in sequence for it."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { business_name: "DiscSlot", ein: "88-0000002", state_code: "NV" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { disc1_id: $.data.id }
          trigger:
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { disc2_id: $.data.id }
          assert:
            - "ComplianceDisclosure.${disc1_id}.status == SUPERSEDED"
            - "ComplianceDisclosure.${disc2_id}.status == FILED"
            - "GET /loans/${l_id}/compliance-disclosures filtered to document_type=SERIES_NOTE_PROSPECTUS,status=FILED returns exactly 1 row"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: principal_conservation_disbursed_equals_returned_on_payoff
        grounds:
          - state_machines.Loan.REPAYMENT_to_PAID_OFF
          - calculations.distribute_pro_rata
          - entities.RepaymentAllocation.fields.principal_amount_cents
          - entities.Loan.fields.outstanding_principal_cents
        distinguishing_aspect: >
          Conserved quantity = principal cents. Over the loan's life, the sum of
          principal_amount_cents across all RepaymentAllocations equals the principal
          disbursed (1,200,000): full payoff returns exactly the disbursed principal
          to investors with zero drift.
        test_recipe:
          setup:
            - "Loan L funded by X(800000)+Y(400000), disbursed, paid off in one SCHEDULED payment of 1,205,990."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "PrinConserve", ein: "99-0000001", state_code: "CO" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${b_id}", requested_principal_cents: 1200000, term_months: 12, plaid_avg_monthly_revenue_cents: 3000000, plaid_monthly_debt_payment_cents: 1000000, plaid_nsf_count_90d: 0, plaid_account_age_months: 48 }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/score"
              payload: {}
              as: Underwriter
              as_user_id: "uw_scorer"
            - call: "POST /loan-applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_approver"
            - call: "GET /loans?application_id=${app_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_id: $.data.0.id, l_v0: $.data.0.version }
            - call: "POST /compliance-disclosures"
              payload: { loan_id: "${l_id}", document_type: "SERIES_NOTE_PROSPECTUS" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /investors"
              payload: { display_name: "Inv X", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invx_id: $.data.id }
            - call: "POST /investors/${invx_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv Y", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { invy_id: $.data.id }
            - call: "POST /investors/${invy_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investments"
              payload: { investor_id: "${invx_id}", loan_id: "${l_id}", amount_cents: 800000, expected_loan_version: "${l_v0}" }
              as: Investor
              as_user_id: "${invx_id}"
              captures: { invx_inv_id: $.data.id }
            - call: "GET /loans/${l_id}"
              payload: {}
              as: PlatformAdmin
              captures: { l_v1: $.data.version }
            - call: "POST /investments"
              payload: { investor_id: "${invy_id}", loan_id: "${l_id}", amount_cents: 400000, expected_loan_version: "${l_v1}" }
              as: Investor
              as_user_id: "${invy_id}"
              captures: { invy_inv_id: $.data.id }
            - call: "POST /loans/${l_id}/disburse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${l_id}/repayments"
              payload: { loan_id: "${l_id}", amount_cents: 1205990, kind: "SCHEDULED" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "Loan.${l_id}.status == PAID_OFF and Loan.${l_id}.outstanding_principal_cents == 0"
            - "sum of principal_amount_cents over GET /repayments/${rep_id}/allocations == 1200000"
            - "GET /investments/${invx_inv_id}/allocations principal_amount_cents total == 800000"
            - "GET /investments/${invy_inv_id}/allocations principal_amount_cents total == 400000"

      - name: committed_capital_conservation_writeoff_equals_committed_on_chargeoff
        grounds:
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
          - entities.Investor.fields.committed_capital_cents
          - entities.Loan.fields.committed_cents
          - entities.Investment.fields.amount_cents
        distinguishing_aspect: >
          A different conserved quantity = committed_capital cents. The total
          decrement of committed_capital_cents across all investors at charge-off
          equals the loan's committed_cents (1,200,000), so the platform-wide
          committed capital drops by exactly the loan's funded principal — no drift.
        test_recipe:
          setup:
            - "Loan L funded by X(800000)+Y(400000), disbursed, defaulted; X and Y each have only this one investment so committed_capital_cents == their amount."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { business_name: "CapConserve", ein: "99-0000002", state_code: "CO" }
