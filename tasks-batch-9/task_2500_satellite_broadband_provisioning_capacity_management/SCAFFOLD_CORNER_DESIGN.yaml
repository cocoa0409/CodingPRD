        excluded_because:
          difficulty_instance: transitive_cascade / warranty_replacement_install_replaces_terminal_resumes_service_and_reprices_beam
          rationale: "Installing the replacement unit and its four downstream side effects (old terminal REPLACED, subscription re-pointed, service resumed, beam repriced) are asserted hop-by-hop by that §1.8 instance."

  # ===================================================================================
  # SECTION 6 — errors
  # (every code in the §1.6 catalogue is triggered exactly once across §1.8 and §1.9)
  # ===================================================================================
  - section: errors
    instances:

      - name: unknown_ids_return_the_entity_specific_not_found_code_for_every_entity
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - 'errors[ERR_SPECTRUM_LICENSE_NOT_FOUND]'
          - 'errors[ERR_SERVICE_CELL_NOT_FOUND]'
          - 'errors[ERR_SUBSCRIBER_NOT_FOUND]'
          - 'errors[ERR_SERVICE_ORDER_NOT_FOUND]'
          - 'errors[ERR_TERMINAL_NOT_FOUND]'
          - 'errors[ERR_ROAMING_AUTHORIZATION_NOT_FOUND]'
          - 'errors[ERR_OUTAGE_EVENT_NOT_FOUND]'
          - 'errors[ERR_OUTAGE_CREDIT_NOT_FOUND]'
        distinguishing_aspect: "The same nonexistent UUID must produce eight DIFFERENT 404 codes, one per collection — a single generic ERR_NOT_FOUND for all of them fails this claim."
        test_recipe:
          setup:
            - "Only the clock has been set; the database is otherwise empty, so 00000000-0000-0000-0000-000000000000 exists in no collection."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - { call: "GET /satellite-broadband/spectrum-licenses/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e1: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/service-cells/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e2: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/subscribers/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e3: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/service-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e4: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/terminals/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e5: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/roaming-authorizations/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e6: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/outage-events/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e7: "$.data.error_id" } }
            - { call: "GET /satellite-broadband/outage-credits/00000000-0000-0000-0000-000000000000", payload: {}, as: ProvisioningAgent, captures: { e8: "$.data.error_id" } }
          assert:
            - "every one of the eight calls returns HTTP status 404"
            - "call 1: data.error_id == ERR_SPECTRUM_LICENSE_NOT_FOUND"
            - "call 2: data.error_id == ERR_SERVICE_CELL_NOT_FOUND"
            - "call 3: data.error_id == ERR_SUBSCRIBER_NOT_FOUND"
            - "call 4: data.error_id == ERR_SERVICE_ORDER_NOT_FOUND"
            - "call 5: data.error_id == ERR_TERMINAL_NOT_FOUND"
            - "call 6: data.error_id == ERR_ROAMING_AUTHORIZATION_NOT_FOUND"
