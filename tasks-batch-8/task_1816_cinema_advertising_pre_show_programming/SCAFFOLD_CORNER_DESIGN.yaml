        claim_type: variant_divergence
        grounds: ["calculations.attributed_impressions", "entities.Campaign.fields.partial_credit_mode"]
        distinguishing_aspect: "Same data, two variants: a PARTIAL playlog at actual 940 attributes floor(940 x 0.5) == 470 under STRICT but 940 under LENIENT, driving delivered_impressions 470 vs 940 on otherwise identical campaigns."
        test_recipe:
          setup: ["two campaigns (STRICT default; LENIENT explicit) each with one slot on its own showtime; both reels aired; both showtimes report 940 ACCEPTED"]
