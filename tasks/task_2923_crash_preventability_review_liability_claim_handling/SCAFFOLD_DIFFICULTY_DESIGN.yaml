              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_cam_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "ELD_LOG", source_device_id: "ELD-11010", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_eld_id: $.data.id }
            - call: "POST /evidence-items/${e_tel_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923e/tel-11010.json", evidence_hash: "9a8b7c6d5e4f3021" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /review-cases"
              payload: { crash_id: "${c_id}", committee_name: "Jackson Preventability Committee", statement_waiver_reason: "statement waived pending medical clearance" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_id: $.data.id }
            - call: "POST /review-cases/${rc_id}/open-deliberation"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_v1: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v1}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 3, hazard_recognition: 3, vehicle_condition_precheck: 3, regulatory_compliance: 3, evasive_action: 3 }, comment: "preventable on the telematics alone" }
              as: CommitteeMember
              as_user_id: "cm-001"
              captures: { rc_v2: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v2}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 3, hazard_recognition: 3, vehicle_condition_precheck: 3, regulatory_compliance: 3, evasive_action: 3 }, comment: "concur" }
              as: CommitteeMember
              as_user_id: "cm-002"
              captures: { rc_v3: $.data.version }
          trigger:
            - call: "POST /review-cases/${rc_id}/decide"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { err: $.data.error_id }
          assert:
            - "Crash.${c_id}.evidence_posture == PARTIAL and ReviewCase.${rc_id}.active_vote_count == 2"
            - "${err} == ERR_EVIDENCE_POSTURE_INSUFFICIENT with HTTP 409 — the priority-30 business_safety check wins"
            - "${err} != ERR_QUORUM_NOT_MET, even though the priority-60 business_constraint check is also violated (2 ballots against COMMITTEE_QUORUM_MIN 3)"
            - "${err} != ERR_SEGREGATION_OF_DUTIES — sm-001 cast no ballot, so the priority-25 check that sits ABOVE both is satisfied and does not mask the pair under test"
            - "ReviewCase.${rc_id}.status is still DELIBERATION with determination PENDING, decision_basis NOT_APPLICABLE, committee_score null and decided_at null"
            - "Crash.${c_id}.preventability_status is still UNDER_REVIEW"
            - "Driver.${d_id}.preventable_points == 0.0 and Driver.${d_id}.required_action_tier == NONE"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: regulatory_report_at_exact_due_instant_is_filed
        grounds:
          - calculations.crash_recordability
          - state_machines.Crash.PENDING_FILING_to_FILED
          - state_machines.Crash.PENDING_FILING_to_LATE_FILED
          - entities.Crash.fields.report_due_at
          - entities.Crash.fields.reporting_status
          - entities.Terminal.fields.late_filing_count
        distinguishing_aspect: |
          Boundary metric: the temporal instant Crash.report_due_at, reached
          through POST /crashes/{id}/regulatory-report. The comparison is
          inclusive (current_utc <= report_due_at), so filing at exactly
          2026-08-02T14:00:00Z yields FILED while filing one second later yields
          LATE_FILED — a one-second window on a datetime metric, distinct from
          the other instance's one-cent window on a monetary metric reached
          through POST /demands/{id}/settle.
        setup_note: "Two sibling crashes with identical timestamps let the same due instant be probed from both sides without rewinding the clock."
        test_recipe:
          setup:
            - "One Terminal and one Driver."
            - "Two crashes, A and B, both with occurred_at 2026-07-30T14:00:00Z, MODERATE, tow_away true with tow_reason DISABLING_DAMAGE, no hazmat and no injuries, so both are dot_recordable with recordability_codes [DISABLING_TOW] and report_due_at = occurred_at + REPORT_WINDOW_HOURS (72) = 2026-08-02T14:00:00Z."
            - "Both crashes are in reporting_status PENDING_FILING and Terminal.late_filing_count is 0."
            - "Clock starts at 2026-08-01T00:00:00Z and is moved by the trigger."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Kenton Terminal", terminal_code: "KEN01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1201", full_name: "Abe Fontaine", cdl_number: "OH-CDL-1201", hire_date: "2009-07-13" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:30:00Z", location_text: "US-68 at Scioto Marsh Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_a_id: $.data.id, due_a: $.data.report_due_at, codes_a: $.data.recordability_codes, rs_a_before: $.data.reporting_status }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:45:00Z", location_text: "US-68 at Scioto Marsh Rd, second unit", severity: "MODERATE", route_class: "REGIONAL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_b_id: $.data.id, due_b: $.data.report_due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T14:00:00Z" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /crashes/${c_a_id}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-KEN-A" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rs_a: $.data.reporting_status, filed_a: $.data.filed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T14:00:01Z" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /crashes/${c_b_id}/regulatory-report"
              payload: { filing_reference: "FMCSA-2026-KEN-B" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rs_b: $.data.reporting_status, filed_b: $.data.filed_at }
            - call: "GET /terminals/${t_id}"
              payload: {}
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { late_count: $.data.late_filing_count }
          assert:
            - "${codes_a} == [DISABLING_TOW] — tow_away true AND tow_reason DISABLING_DAMAGE is one code, not two, and no other trigger fired"
            - "${due_a} == 2026-08-02T14:00:00Z and ${due_b} == 2026-08-02T14:00:00Z (occurred_at + 72h, the non-hazmat window)"
            - "${rs_a_before} == PENDING_FILING"
            - "${rs_a} == FILED — current_utc equal to report_due_at is inside the window, because the comparison is current_utc <= report_due_at"
            - "${filed_a} == 2026-08-02T14:00:00Z and Crash.${c_a_id}.filing_reference == FMCSA-2026-KEN-A"
            - "${rs_b} == LATE_FILED — one second past the same instant falls out of the window"
            - "${filed_b} == 2026-08-02T14:00:01Z and Crash.${c_b_id}.filing_reference == FMCSA-2026-KEN-B"
            - "${late_count} == 1 — exactly one of the two identical crashes was late"

      - name: settlement_total_exactly_exhausts_policy_capacity
        grounds:
          - calculations.settlement_layer_waterfall
          - validations[priority=70]
          - entities.PolicyLayer.fields.limit_cents
          - entities.PolicyLayer.fields.attachment_point_cents
          - entities.Claim.fields.layer_allocations
          - state_machines.Demand.OFFER_OUTSTANDING_to_SETTLED
        distinguishing_aspect: |
          Boundary metric: monetary cents against total tower capacity, reached
          through POST /demands/{id}/settle. Two claims on the identical
          15,000,000-cent tower settle offers one cent apart — 13,392,857 and
          13,392,858 — which round to the SAME ALAE of 1,607,143, so the totals
          are 15,000,000 (accepted, capacity consumed to the cent) and 15,000,001
          (refused with ERR_COVERAGE_EXHAUSTED). Different metric and different
          endpoint from the datetime boundary instance.
        test_recipe:
          setup:
            - "One Terminal, one Driver and two separate MODERATE crashes on 2026-07-30 (both program year 2026)."
            - "One well-formed 2026 tower shared by both claims: layer_index 1 SIR attachment 0 limit 10,000,000, layer_index 2 PRIMARY attachment 10,000,000 limit 5,000,000, total capacity exactly 15,000,000."
            - "Claim ALPHA on crash A with one THIRD_PARTY_PROPERTY Demand of 20,000,000, a DEMAND_BASED revision setting outstanding_reserve_cents to 20,000,000, and a standing offer of 13,392,857."
            - "Claim BETA on crash B with one THIRD_PARTY_PROPERTY Demand of 20,000,000, a DEMAND_BASED revision setting outstanding_reserve_cents to 20,000,000, and a standing offer of 13,392,858 — exactly one cent higher."
            - "Neither claim has consumed any layer capacity yet. Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Lima Terminal", terminal_code: "LIM01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1301", full_name: "Bess Nkemelu", cdl_number: "OH-CDL-1301", hire_date: "2008-03-02" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /policy-layers"
              payload: { program_year: 2026, layer_index: 1, layer_type: "SIR", attachment_point_cents: 0, limit_cents: 10000000, insurer_name: "Self-Insured Retention" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { pl_sir_id: $.data.id }
            - call: "POST /policy-layers"
              payload: { program_year: 2026, layer_index: 2, layer_type: "PRIMARY", attachment_point_cents: 10000000, limit_cents: 5000000, insurer_name: "Continental Freight Casualty" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { pl_pri_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T10:00:00Z", notified_at: "2026-07-30T10:20:00Z", location_text: "I-75 MM 125 southbound", severity: "MODERATE", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_a_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T18:00:00Z", notified_at: "2026-07-30T18:20:00Z", location_text: "I-75 MM 127 southbound", severity: "MODERATE", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_b_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_a_id}", claimant_notice_date: "2026-07-31", adjuster_note: "claim ALPHA" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_a_id: $.data.id }
            - call: "POST /claims/${cl_a_id}/demands"
              payload: { claimant_name: "Allen County Fleet Services", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 20000000, represented_by_counsel: false, demand_received_at: "2026-07-31T09:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_a_id: $.data.id }
            - call: "GET /claims/${cl_a_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_a_v2: $.data.version }
            - call: "POST /claims/${cl_a_id}/reserve-revisions"
              payload: { expected_claim_version: "${cl_a_v2}", basis: "DEMAND_BASED", revision_note: "reserving ALPHA to the demand" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { out_a: $.data.outstanding_reserve_cents }
            - call: "POST /demands/${dm_a_id}/offers"
              payload: { carrier_offer_cents: 13392857 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { nr_a_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_b_id}", claimant_notice_date: "2026-07-31", adjuster_note: "claim BETA" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_b_id: $.data.id }
            - call: "POST /claims/${cl_b_id}/demands"
              payload: { claimant_name: "Shawnee Logistics Inc", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 20000000, represented_by_counsel: false, demand_received_at: "2026-07-31T09:30:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_b_id: $.data.id }
            - call: "GET /claims/${cl_b_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_b_v2: $.data.version }
            - call: "POST /claims/${cl_b_id}/reserve-revisions"
              payload: { expected_claim_version: "${cl_b_v2}", basis: "DEMAND_BASED", revision_note: "reserving BETA to the demand" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { out_b: $.data.outstanding_reserve_cents }
            - call: "POST /demands/${dm_b_id}/offers"
              payload: { carrier_offer_cents: 13392858 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { nr_b_id: $.data.id }
          trigger:
            - call: "POST /demands/${dm_a_id}/settle"
              payload: { settlement_reference: "SET-2026-LIM-ALPHA" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { a_status: $.data.status, a_alae: $.data.alae_cents, a_total: $.data.settlement_total_cents }
            - call: "POST /demands/${dm_b_id}/settle"
              payload: { settlement_reference: "SET-2026-LIM-BETA" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { b_err: $.data.error_id }
          assert:
            - "${out_a} == 20000000 and ${out_b} == 20000000, so neither settlement can be blocked by the priority-72 reserve check"
            - "${a_alae} == 1607143 — round_half_up(13,392,857 * 0.12) = round_half_up(1,607,142.84)"
            - "${a_total} == 15000000, exactly the tower capacity, and ${a_status} == SETTLED — the comparison is 'fits', not 'fits with room to spare'"
            - "Claim.${cl_a_id}.layer_allocations == [{ policy_layer_id: ${pl_sir_id}, allocated_cents: 10000000 }, { policy_layer_id: ${pl_pri_id}, allocated_cents: 5000000 }], sir_eroded_cents == 10000000, insured_paid_cents == 5000000"
            - "round_half_up(13,392,858 * 0.12) == 1607143 as well — the one-cent-higher indemnity produces the IDENTICAL ALAE, so the only difference is the total"
            - "${b_err} == ERR_COVERAGE_EXHAUSTED with HTTP 422, because 13,392,858 + 1,607,143 == 15,000,001 exceeds capacity by exactly one cent"
            - "Demand.${dm_b_id}.status is still OFFER_OUTSTANDING with settled_amount_cents null, alae_cents null and settlement_total_cents null"
            - "NegotiationRound.${nr_b_id}.outcome is still OPEN"
            - "Claim.${cl_b_id}.layer_allocations is empty, indemnity_paid_cents == 0, alae_paid_cents == 0, outstanding_reserve_cents == 20000000, handling_status == NEGOTIATION"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: decide_blocked_by_crash_evidence_posture_partial
        grounds:
          - validations[priority=30]
          - calculations.crash_evidence_posture
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - state_machines.EvidenceItem.REQUESTED_to_PRESERVED
          - entities.Crash.fields.evidence_posture
          - entities.ReviewCase.fields.determination
        distinguishing_aspect: |
          Entity pair ReviewCase -> Crash: whether ReviewCase may leave
          DELIBERATION depends on a computed field of a DIFFERENT entity
          (Crash.evidence_posture, itself derived from the crash's EvidenceItem
          rows), and the dependency is repaired by writing to a third entity
          (POST /evidence-items/{id}/preserve) without touching the ReviewCase
          at all.
        setup_note: "Quorum is deliberately satisfied (three non-ABSTAIN ballots) so the only thing standing between DELIBERATION and DECIDED is the other entity's posture."
        test_recipe:
          setup:
            - "Terminal MAR01 with annual_miles_millions 4.0 and one Driver hired 2015-06-01."
            - "A SEVERE crash on 2026-07-30T14:00:00Z with mechanical_factor true, so the required evidence kinds are TELEMATICS_SNAPSHOT, FORWARD_CAMERA and ELD_LOG and the criterion denominator is 1.00."
            - "All three evidence items exist with window [2026-07-30T13:00:00Z, 2026-07-30T15:00:00Z) covering the crash instant, but ONLY the TELEMATICS_SNAPSHOT is PRESERVED, so Crash.evidence_posture is PARTIAL."
            - "An attested DriverStatement exists; the ReviewCase is in DELIBERATION with three non-superseded, non-ABSTAIN ballots from cm-001, cm-002 and cm-003, so COMMITTEE_QUORUM_MIN is already met."
            - "Ballots: cm-001 (3,2,2,3,3) -> 2.60 PREVENTABLE, cm-002 (2,3,2,3,2) -> 2.45 PREVENTABLE, cm-003 (4,2,3,2,3) -> 2.85 NON_PREVENTABLE. committee_score = round_half_up(7.90/3, 2) = 2.63."
            - "sm-001 has cast no ballot, so segregation of duties cannot interfere. Clock stays at 2026-08-01T00:00:00Z."
