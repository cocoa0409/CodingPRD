# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Same seven-point per-instance contract as §1.8. excluded_because stubs point
# to §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: guarantee_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /guarantees/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except an authenticated Underwriter."]
          setup_api_calls: []
          trigger:
            - call: "GET /guarantees/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: applicant_missing_required_field_returns_422
        claim_type: required_field
        grounds: [entities.Applicant.fields.employment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applicants without employment_type (an input field with no default) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Authenticated Underwriter."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "R M1", email: "rm1@x.com", annual_income_cents: 12000000, credit_score: 700, monthly_obligations_cents: 100000 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: applicant_invalid_enum_employment_type_returns_422
        claim_type: type_constraint
        grounds: [entities.Applicant.fields.employment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /applicants with employment_type 'FREELANCE' (not in the enum) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Authenticated Underwriter."]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "R E1", email: "re1@x.com", annual_income_cents: 12000000, credit_score: 700, monthly_obligations_cents: 100000, employment_type: "FREELANCE" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: claim_acceleration_requested_defaults_false
        claim_type: default_value
        grounds: [entities.Claim.fields.acceleration_requested, entities.Claim.fields.payout_variant]
        distinguishing_aspect: "Omitting acceleration_requested at claim creation defaults it to false, so the approved payout uses the CHRONOLOGICAL variant (payout 1124995 for 5 missed months)."
        test_recipe:
          setup: ["Active guarantee bound to landlord (per_month_coverage 224999); clock 2026-09-15; claim filed WITHOUT acceleration_requested, reviewed and approved."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book DF1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL DF1", email: "lldf1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R DF1", email: "rdf1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-DF1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-DF1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 5 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          assert:
            - "Claim.${cl_id}.acceleration_requested == false"
            - "Claim.${cl_id}.payout_variant == CHRONOLOGICAL"
            - "Claim.${cl_id}.payout_amount_cents == 1124995"

  - section: state_machines
    instances:
      - name: approve_already_approved_guarantee_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Guarantee.QUOTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling approve on a guarantee already in APPROVED is rejected with ERR_INVALID_STATE (transitions are not idempotent)."
        test_recipe:
          setup: ["Applicant verified tier A; guarantee approved once."]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Book IS1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R IS1", email: "ris1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-IS1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
          trigger:
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: verify_already_verified_applicant_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Applicant.DRAFT_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-verifying an applicant already in VERIFIED is rejected with ERR_INVALID_STATE (verify is not idempotent)."
        test_recipe:
          setup: ["Applicant created and verified once."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "R IS2", email: "ris2@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: cancel_defaulted_guarantee_terminal_lockdown_returns_invalid_state
        claim_type: terminal_state
        grounds: [state_machines.Guarantee.ACTIVE_to_DEFAULTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DEFAULTED guarantee is terminal: cancel is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Active guarantee then defaulted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book TL1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL TL1", email: "lltl1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R TL1", email: "rtl1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-TL1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-TL1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/declare-default"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /guarantees/${g_id}/cancel"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: accelerated_claim_exhausts_guarantee_and_terminates_agreement
        claim_type: side_effect_bubble_up
        grounds: [state_machines.Guarantee.ACTIVE_to_EXHAUSTED, state_machines.LandlordAgreement.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "When an accelerated payout drives remaining_coverage_cents to 0, the guarantee auto-transitions ACTIVE→EXHAUSTED and its ACTIVE agreement cascades to TERMINATED."
        test_recipe:
          setup: ["Active guarantee bound to landlord; accelerated claim consumes all 1349994 coverage."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book EX1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL EX1", email: "llex1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R EX1", email: "rex1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-EX1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-EX1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
              captures: { g_ver: $.data.version }
            - call: "POST /guarantees/${g_id}/claims"
              payload: { expected_guarantee_version: "${g_ver}", default_date: "2026-09-01T00:00:00Z", missed_months: 12, acceleration_requested: true }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          trigger:
            - call: "POST /claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "ca1"
          assert:
            - "Guarantee.${g_id}.status == EXHAUSTED"
            - "LandlordAgreement.${ag_id}.status == TERMINATED"

  - section: calculations
    instances:
      - name: risk_tier_C_boundary_credit_600_dti_055
        claim_type: constants_applied
        grounds: [calculations.applicant_risk_tier, entities.Applicant.fields.risk_tier]
        distinguishing_aspect: "credit_score 600 with dti 0.55 (obligations 275000 on monthly income 500000) lands in tier C, not B (needs credit>=660) or D."
        test_recipe:
          setup: ["Applicant credit 600, annual_income 6000000 (monthly 500000), obligations 275000."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "R RC1", email: "rrc1@x.com", annual_income_cents: 6000000, credit_score: 600, monthly_obligations_cents: 275000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
              captures: { tier: $.data.risk_tier }
          assert:
            - "Applicant.${ap_id}.status == VERIFIED"
            - "Applicant.${ap_id}.risk_tier == C"
            - "Applicant.${ap_id}.debt_to_income == 0.55"

      - name: verify_below_credit_floor_declines
        claim_type: violation_to_error
        grounds: [calculations.applicant_risk_tier, state_machines.Applicant.DRAFT_to_DECLINED]
        distinguishing_aspect: "credit_score 570 (< CREDIT_FLOOR 580) forces the DRAFT→DECLINED branch with risk_tier left null."
        test_recipe:
          setup: ["Applicant credit 570."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "R RD1", email: "rrd1@x.com", annual_income_cents: 6000000, credit_score: 570, monthly_obligations_cents: 100000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
              captures: { st: $.data.status }
          assert:
            - "Applicant.${ap_id}.status == DECLINED"
            - "Applicant.${ap_id}.risk_tier == null"

      - name: fee_max_cap_clamp_tier_D
        claim_type: correct_result
        grounds: [calculations.guarantee_fee, entities.Guarantee.fields.final_fee_cents]
        distinguishing_aspect: "Tier D (rate 0.18) on total_coverage 3600000 with term_factor 1.0 gives raw 648000 which is clamped DOWN to MAX_FEE_CENTS 500000."
        test_recipe:
          setup: ["Applicant verified tier D (credit 600, dti 0.60 → D); guarantee rent 400000, coverage_months 10, term 12. per_month=360000, total_coverage=3600000."]
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Book FX1", exposure_cap_cents: 100000000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R FX1", email: "rfx1@x.com", annual_income_cents: 24000000, credit_score: 600, monthly_obligations_cents: 1200000, employment_type: "SELF_EMPLOYED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-FX1", monthly_rent_cents: 400000, coverage_months: 10, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
              captures: { fee: $.data.final_fee_cents }
          assert:
            - "Applicant.${ap_id}.risk_tier == D"
            - "Guarantee.${g_id}.final_fee_cents == 500000"

      - name: portfolio_posture_restricted_when_weighted_exceeds_cap
        claim_type: correct_result
        grounds: [calculations.portfolio_exposure, entities.Portfolio.fields.posture, entities.Portfolio.fields.risk_weighted_exposure_cents]
        distinguishing_aspect: "With one ACTIVE tier-A guarantee (remaining 1349994, weight 0.5 → risk_weighted 674997) in a portfolio whose exposure_cap_cents is 800000, recompute-risk sets posture RESTRICTED because 674997 >= round(0.80*800000)=640000 (the soft warning band), even though 674997 < 800000 kept the approve gate open."
        test_recipe:
          setup: ["Portfolio cap 800000 (warn threshold 640000); one activated tier-A guarantee (remaining 1349994, risk_weighted 674997); recompute risk."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios"
              payload: { name: "Book PR1", exposure_cap_cents: 800000 }
              as: PlatformAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /landlords"
              payload: { legal_name: "LL PR1", email: "llpr1@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "R PR1", email: "rpr1@x.com", annual_income_cents: 12000000, credit_score: 740, monthly_obligations_cents: 200000, employment_type: "SALARIED" }
              as: Underwriter
              captures: { ap_id: $.data.id }
            - call: "POST /applicants/${ap_id}/verify"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees"
              payload: { portfolio_id: "${pf_id}", applicant_id: "${ap_id}", unit_id: "U-PR1", monthly_rent_cents: 249999, coverage_months: 6, term_months: 12, lease_start_date: "2026-08-01T00:00:00Z", lease_end_date: "2027-08-01T00:00:00Z" }
              as: Underwriter
              captures: { g_id: $.data.id }
            - call: "POST /guarantees/${g_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw1"
            - call: "POST /guarantees/${g_id}/pay-fee"
              payload: { amount_cents: 67500 }
              as: Applicant
              as_user_id: "${ap_id}"
            - call: "POST /agreements"
              payload: { guarantee_id: "${g_id}", landlord_id: "${ll_id}", unit_id: "U-PR1", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-08-01T00:00:00Z", max_coverage_cents: 2000000, notice_period_days: 60 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/sign"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /agreements/${ag_id}/countersign"
              payload: {}
              as: Underwriter
            - call: "POST /guarantees/${g_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /portfolios/${pf_id}/recompute-risk"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co1"
              captures: { posture: $.data.posture }
          assert:
            - "Portfolio.${pf_id}.risk_weighted_exposure_cents == 674997"
            - "Portfolio.${pf_id}.posture == RESTRICTED"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request omitting the X-User-ID / X-User-Role headers returns ERR_UNAUTHENTICATED (401) before any resource logic."
        test_recipe:
          setup: ["No auth headers supplied on the request."]
          setup_api_calls: []
          trigger:
            - call: "POST /portfolios"
              payload: { name: "NoAuth", exposure_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "With X-User-ID and X-User-Role headers removed, response error_id == ERR_UNAUTHENTICATED and http_status == 401"

      - name: forbidden_role_recovery_agent_approves_guarantee_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", roles.RecoveryAgent]
        distinguishing_aspect: "RecoveryAgent is not in the roles for POST /guarantees/{id}/approve; the call returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
