            - "rst == REGISTERED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_goal_plan_stale_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[goal-plan-create-stale-case]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Second plan create carrying the pre-first-create case version is rejected 412 ERR_STALE_VERSION; the first plan remains the only DRAFT (no supersede happened on the loser)."
        test_recipe:
          setup: ["certified coach; participant; case at PLAN_DRAFT (version captured)"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "COCC", email: "cocc@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "POCC", email: "pocc@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${pi}", coach_id: "${co}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { cid: "$.data.id" } }
            - { call: "POST /coaching-cases/${cid}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { cv: "$.data.version" } }
          trigger:
            - { call: "POST /goal-plans", payload: { case_id: "${cid}", monthly_savings_goal_cents: 20000, credit_score_target: 650, expected_case_version: "${cv}" }, as: ProgramAdmin, captures: { pl1: "$.data.id", pl1s: "$.data.status" } }
            - { call: "POST /goal-plans", payload: { case_id: "${cid}", monthly_savings_goal_cents: 30000, credit_score_target: 700, expected_case_version: "${cv}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /goal-plans/${pl1}", payload: {}, as: ProgramAdmin, captures: { pl1_after: "$.data.status" } }
          assert:
            - "pl1s == DRAFT"
            - "err == ERR_STALE_VERSION   # case version advanced when plan 1 was created"
            - "pl1_after == DRAFT   # losing request superseded nothing"

      - name: occ_workshop_patch_stale_version_returns_412_and_version_increments
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[workshop-reschedule-stale-version]
          - entities.Workshop.fields.confirmed_count
        distinguishing_aspect: "PATCH with the creation version succeeds (version 1 -> 2); replaying the same stale version is rejected 412 — and every successful mutation increments Workshop.version by exactly 1."
        test_recipe:
          setup: ["module; certified coach; workshop created (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "VP-100", title: "VP", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CVP", email: "cvp@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { ws: "$.data.id", wv: "$.data.version" } }
          trigger:
            - { call: "PATCH /workshops/${ws}", payload: { capacity: 8, expected_workshop_version: "${wv}" }, as: ProgramAdmin, captures: { wv2: "$.data.version", cap2: "$.data.capacity" } }
            - { call: "PATCH /workshops/${ws}", payload: { capacity: 9, expected_workshop_version: "${wv}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /workshops/${ws}", payload: {}, as: ProgramAdmin, captures: { cap_final: "$.data.capacity" } }
          assert:
            - "wv == 1 and wv2 == 2   # increments by exactly 1"
            - "cap2 == 8"
            - "err == ERR_STALE_VERSION"
            - "cap_final == 8   # rejected patch changed nothing"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: a registration written by POST is fully visible (status, waitlist_position null, incentive 0) in the very next GET — no lag."
        test_recipe:
          setup: ["module; certified coach; workshop 2026-08-10 capacity 5; participant"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "IM-100", title: "IM", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CIM", email: "cim@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PIM", email: "pim@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${pi}" }, as: ProgramAdmin, captures: { rid: "$.data.id" } }
            - { call: "GET /registrations/${rid}", payload: {}, as: ProgramAdmin, captures: { rst: "$.data.status", rinc: "$.data.incentive_earned_cents" } }
            - { call: "GET /workshops/${ws}", payload: {}, as: ProgramAdmin, captures: { conf: "$.data.confirmed_count" } }
          assert:
            - "rst == REGISTERED"
            - "rinc == 0"
            - "conf == 1   # denormalized counter already reconciled in the same request sequence"
