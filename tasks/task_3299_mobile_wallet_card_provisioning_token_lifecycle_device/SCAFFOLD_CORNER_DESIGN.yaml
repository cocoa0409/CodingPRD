              payload: {}
              as: Any
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok_id}", expected_device_version: "${v0}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { v1: $.data.version }
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok_id}", expected_device_version: "${v0}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok_id}", expected_device_version: "${v1}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { v2: $.data.version }
          assert:
            - "v1 == v0 + 1 (mutation bumps version)"
            - "e == ERR_VERSION_CONFLICT (412) for the stale ${v0} retry"
            - "v2 == v1 + 1 — the fresh version succeeds"

      - name: cascading_chain_offboard_reaches_token_events
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / issuer_offboard_cascades_account_close_token_deactivate_event_append
          rationale: "The 3-level chain end-to-end is asserted in §1.8."

      - name: dual_variant_fee_switch_reconciles_on_pending_resolution
        claim_type: dual_variant_calculation
        grounds:
          - calculations.issuer_fee_accrual
        distinguishing_aspect: "When the PENDING auth later resolves APPROVED (issuer decides), the accrual ledger jumps by exactly that auth's fee, closing the gap the projection variant showed earlier."
        test_recipe:
          setup: ["Standard token; no auths yet; issuer agreement fee_bps 150, cap 500, floor 0."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
