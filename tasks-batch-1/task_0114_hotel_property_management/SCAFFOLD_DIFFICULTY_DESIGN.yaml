  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: checkout_cascade_room_dirty_and_corporate_ledger_depth3
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - state_machines.Folio.OPEN_to_CLOSED
          - state_machines.Room.OCCUPIED_to_DIRTY
          - calculations.corporate_outstanding
          - entities.Room.fields.housekeeping_status
          - entities.CorporateAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from the check-out trigger: check-out -> Folio CLOSED ->
          (that CLOSED corporate folio's balance) raises CorporateAccount.outstanding;
          AND check-out -> Room OCCUPIED->DIRTY. The corporate-ledger hop is caused
          by the folio-close hop, not by the check-out directly.
        test_recipe:
          setup:
            - "CORPORATE reservation FLAT+0 base 20000, 2 nights, credit_limit 100000, checked in with minibar 1500 posted"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Casc", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 2, base_rate_cents: 20000 }
              as: RevenueManager
