      - name: clock_set_lapses_windows_and_expires_events
        claim_type: computed_read
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.InterruptibleWindow.SCHEDULED_to_LAPSED
          - state_machines.EnergyEvent.DECLARED_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past a window's end_at (no linked event) flips it LAPSED, and past a DECLARED event's released_at flips it EXPIRED — time-triggered transitions fire on the clock-set call itself."
        test_recipe:
          setup: ["Clock set to 2026-09-10T00:00:00Z. Mill with window [2026-09-10T12:00Z, 2026-09-10T14:00Z] SCHEDULED and event (called 2026-09-10T12:00Z, released 2026-09-10T14:00Z) DECLARED, never activated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
