# =============================================================================
# Task 1937 — School Safety Drill & Emergency Operations Plan
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1937. School Safety Drill & Emergency Operations Plan (school safety office): drill type calendar & statutory frequency, drill execution logging & evacuation timing, accountability/reunification procedure & rosters, after-action review & corrective actions, site plan (floor plan/access) currency, first-responder coordination & site walkthrough, special-needs student drill accommodation, compliance reporting to state

domain_name: school-safety-drills
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FKs; flat URLs, ids in bodies
  state_machine_shape: cyclic      # EOP / AAR / CorrectiveAction / ComplianceReport all have return-or-reopen loops
  relationship_patterns:
    - one_to_many                  # SchoolSite → plans/drills/reports; DrillEvent → RosterEntry; AfterActionReview → CorrectiveAction
    - cross_aggregate              # DrillEvent gates on AccommodationPlan/EOP; ComplianceReport aggregates DrillEvent
  role_model: approval_chain       # Officer drafts → Coordinator approves EOP; Officer submits AAR → Principal decides; Coordinator submits report → StateAuditor decides
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SchoolSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School campus name" }
      - { name: enrollment_count, type: integer, source: input, description: "Enrolled student count (informational; feeds no gate)", constraints: ">= 0" }
      - { name: academic_year_start, type: string, source: input, description: "Academic year start date, YYYY-MM-DD inclusive" }
      - { name: academic_year_end, type: string, source: input, description: "Academic year end date, YYYY-MM-DD inclusive; must be >= academic_year_start" }
      - { name: compliance_posture, type: enum, source: computed, description: "ON_TRACK | AT_RISK | NON_COMPLIANT — derived per calculations.compliance_posture_derivation" }
      - { name: drills_scheduled_count, type: integer, source: computed, description: "Drills at this site with scheduled_date inside the current academic year and status IN {SCHEDULED, IN_PROGRESS}" }
      - { name: drills_completed_count, type: integer, source: computed, description: "Drills at this site with scheduled_date inside the current academic year and status IN {COMPLETED, CLOSED}" }
      - { name: drills_missed_count, type: integer, source: computed, description: "Drills at this site with scheduled_date inside the current academic year and status MISSED" }
      - { name: drills_cancelled_count, type: integer, source: computed, description: "Drills at this site with scheduled_date inside the current academic year and status CANCELLED" }

  - name: DrillTypeRequirement
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; the campus this statutory configuration applies to" }
      - { name: drill_type, type: enum, source: input, description: "FIRE | LOCKDOWN | EVACUATION | SHELTER_IN_PLACE | EARTHQUAKE" }
      - { name: required_per_year, type: integer, source: input, description: "Statutory completed-drill count required per academic year", constraints: ">= 1" }
      - { name: min_spacing_days, type: integer, source: input, description: "Minimum whole calendar days between consecutive completed drills of this type for the strict audit variant", constraints: ">= 0" }
      - { name: target_evac_seconds, type: integer, source: input, description: "Benchmark evacuation/accountability time in seconds", constraints: ">= 1" }
      - { name: notes, type: string, source: input, required: false, description: "Free-text statutory citation or note" }

  - name: EmergencyOperationsPlan
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus covered by this plan" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: plan_version_label, type: string, source: input, description: "Author-assigned version label, e.g. v2026.1" }
      - { name: content_summary, type: string, source: input, description: "Narrative summary of procedures" }
      - { name: review_due_date, type: string, source: input, description: "YYYY-MM-DD; ACTIVE plan auto-expires when the logical date passes this date" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | ACTIVE | SUPERSEDED | EXPIRED" }
      - { name: submitted_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at submit time" }
      - { name: return_reason, type: string, source: system, required: false, description: "Reason recorded when decided RETURN" }
      - { name: activated_at, type: datetime, source: system, required: false, description: "Timestamp when the plan entered ACTIVE" }

  - name: SitePlanDocument
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus the floor-plan document belongs to" }
      - { name: document_title, type: string, source: input, description: "Document title" }
      - { name: issued_on, type: string, source: input, description: "YYYY-MM-DD issue date" }
      - { name: review_by_date, type: string, source: input, description: "YYYY-MM-DD; must be later than the logical today at creation; document EXPIRED when today passes it" }
      - { name: coverage_tags, type: array, source: input, description: "Subset of {FLOOR_PLANS, ACCESS_POINTS, UTILITY_SHUTOFFS, ASSEMBLY_AREAS}; MUST include FLOOR_PLANS and ACCESS_POINTS" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED | EXPIRED" }

  - name: FirstResponderWalkthrough
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus walked" }
      - { name: agency, type: enum, source: input, description: "FIRE | POLICE | EMS" }
      - { name: scheduled_date, type: string, source: input, description: "YYYY-MM-DD; must not equal the scheduled_date of any SCHEDULED or IN_PROGRESS drill at the same site (whole-day exclusion)" }
      - { name: completed_date, type: string, source: input, required: false, description: "YYYY-MM-DD set at completion; >= scheduled_date and <= logical today" }
      - { name: findings_summary, type: string, source: input, required: false, description: "Responder findings narrative" }
      - { name: recommendations_count, type: integer, source: input, required: false, description: "Count of recommendations issued", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED" }

  - name: DrillEvent
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus running the drill" }
      - { name: drill_type, type: enum, source: input, description: "FIRE | LOCKDOWN | EVACUATION | SHELTER_IN_PLACE | EARTHQUAKE; a DrillTypeRequirement must exist for (site_id, drill_type)" }
      - { name: scheduled_date, type: string, source: input, description: "YYYY-MM-DD; must lie inside the site's academic year" }
      - { name: scheduled_start_time, type: string, source: input, description: "HH:MM 24h local start time" }
      - { name: duration_minutes, type: integer, source: input, description: "Planned duration; occupies half-open interval [start, start+duration)", constraints: ">= 1" }
      - { name: announcement_mode, type: enum, source: input, required: false, default: ANNOUNCED, description: "ANNOUNCED | UNANNOUNCED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CLOSED | CANCELLED | MISSED" }
      - { name: conducted_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at start" }
      - { name: actual_start_at, type: datetime, source: system, required: false, description: "Logical timestamp stamped at start" }
      - { name: all_clear_at, type: datetime, source: system, required: false, description: "Logical timestamp stamped at complete" }
      - { name: last_accountability_at, type: datetime, source: computed, required: false, description: "max over roster entries of (released_at if RELEASED else accounted_at); null when roster is empty" }
      - { name: provisional_evac_seconds, type: integer, source: computed, required: false, description: "all_clear_at - actual_start_at in seconds (raw wall time)" }
      - { name: official_evac_seconds, type: integer, source: computed, required: false, description: "last_accountability_at - actual_start_at in seconds; equals provisional when roster is empty" }
      - { name: met_target_standard, type: boolean, source: computed, required: false, description: "official_evac_seconds <= target_evac_seconds" }
      - { name: met_target_adjusted, type: boolean, source: computed, required: false, description: "official_evac_seconds <= ceil-adjusted target when UNANNOUNCED; mirrors met_target_standard when ANNOUNCED" }
      - { name: roster_total, type: integer, source: computed, description: "Count of RosterEntry rows for this drill" }
      - { name: unaccounted_count, type: integer, source: computed, description: "Roster entries in UNACCOUNTED" }
      - { name: accounted_count, type: integer, source: computed, description: "Roster entries in ACCOUNTED" }
      - { name: released_count, type: integer, source: computed, description: "Roster entries in RELEASED" }
      - { name: completion_notes, type: string, source: input, required: false, description: "Operator notes recorded at complete" }

  - name: RosterEntry
    parent: null
    common_fields: true
    fields:
      - { name: drill_event_id, type: string, source: system, description: "FK -> DrillEvent.id; drill this accountability row belongs to (path-bound at creation)" }
      - { name: student_ref, type: string, source: input, description: "Opaque student identifier used by the school; unique per drill" }
      - { name: accommodation_required, type: boolean, source: input, required: false, default: false, description: "True when this student has special-needs drill accommodations; requires an ACTIVE AccommodationPlan for (site, student_ref)" }
      - { name: status, type: enum, source: system, description: "UNACCOUNTED | ACCOUNTED | RELEASED" }
      - { name: accounted_at, type: datetime, source: system, required: false, description: "Logical timestamp when marked ACCOUNTED" }
      - { name: guardian_name, type: string, source: input, required: false, description: "Receiving guardian name at reunification release" }
      - { name: released_to_verified, type: boolean, source: input, required: false, description: "Guardian identity verification flag; must be true to release" }
      - { name: released_at, type: datetime, source: system, required: false, description: "Logical timestamp when released" }

  - name: AfterActionReview
    parent: null
    common_fields: true
    fields:
      - { name: drill_event_id, type: string, source: system, description: "FK -> DrillEvent.id; reviewed drill (path-bound at creation); at most one review per drill" }
      - { name: findings_summary, type: string, source: input, description: "Review findings narrative" }
      - { name: overall_rating, type: enum, source: input, description: "EXCEEDS | MEETS | NEEDS_IMPROVEMENT | UNSATISFACTORY" }
      - { name: evacuation_assessment, type: enum, source: input, description: "MET_STANDARD | MET_ADJUSTED | NOT_MET — reviewer assessment of timing performance" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED | CLOSED" }
      - { name: submitted_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at submit time" }
      - { name: decided_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at decide time; must differ from submitted_by_user_id" }
      - { name: return_reason, type: string, source: system, required: false, description: "Reason recorded when decided RETURN" }
      - { name: ca_total_count, type: integer, source: computed, description: "Corrective actions belonging to this review" }
      - { name: ca_verified_count, type: integer, source: computed, description: "Corrective actions in VERIFIED" }

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: aar_id, type: string, source: system, description: "FK -> AfterActionReview.id; review this action remediates (path-bound at creation)" }
      - { name: description, type: string, source: input, description: "Remediation description" }
      - { name: priority, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: due_date, type: string, source: input, description: "YYYY-MM-DD remediation deadline" }
      - { name: assignee_name, type: string, source: input, description: "Responsible staff member name" }
      - { name: status, type: enum, source: system, description: "OPEN | PENDING_VERIFICATION | REOPENED | VERIFIED" }
      - { name: evidence_note, type: string, source: input, required: false, description: "Evidence narrative recorded at submit-verification" }
      - { name: is_overdue, type: boolean, source: computed, description: "logical today > due_date AND status != VERIFIED" }
      - { name: verified_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at verify time" }

  - name: AccommodationPlan
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus where the accommodation applies" }
      - { name: student_ref, type: string, source: input, description: "Opaque student identifier matching roster entries" }
      - { name: need_type, type: enum, source: input, description: "MOBILITY | VISUAL | AUDITORY | SENSORY | COGNITIVE" }
      - { name: instructions, type: string, source: input, description: "Drill accommodation instructions for staff" }
      - { name: review_by_date, type: string, source: input, description: "YYYY-MM-DD next review date (informational)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; campus reported on" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD inclusive closed-interval period start" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD inclusive closed-interval period end; >= period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | STALE | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: snapshot_generated_at, type: datetime, source: system, description: "Logical timestamp when the snapshot was last computed" }
      - { name: type_attainments, type: array, source: computed, description: "One object per configured DrillTypeRequirement: {drill_type, required_count, completed_count, spacing_compliant, attainment_count_only, attainment_strict}" }
      - { name: overall_compliant_count_only, type: boolean, source: computed, description: "AND of attainment_count_only across configured types" }
      - { name: overall_compliant_strict, type: boolean, source: computed, description: "AND of attainment_strict across configured types" }
      - { name: overall_score_pct, type: number, source: computed, description: "Per calculations.overall_compliance_score; 1 decimal place" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Timestamp of submission to the state" }
      - { name: decided_by_user_id, type: string, source: system, required: false, description: "Auditor X-User-ID recorded at decide time" }
      - { name: auditor_comment, type: string, source: system, required: false, description: "Auditor comment recorded at decide time" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EmergencyOperationsPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /emergency-operations-plans/{id}/submit"
        actor: SchoolSafetyOfficer
        preconditions:
          - "site has a SitePlanDocument with status CURRENT (ERR_SITE_PLAN_REQUIRED)"
          - "site has a FirstResponderWalkthrough with status COMPLETED and completed_date >= logical today - 365 days (ERR_WALKTHROUGH_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID header"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /emergency-operations-plans/{id}/submit"
        actor: SchoolSafetyOfficer
        preconditions:
          - "site has a SitePlanDocument with status CURRENT (ERR_SITE_PLAN_REQUIRED)"
          - "site has a FirstResponderWalkthrough with status COMPLETED and completed_date >= logical today - 365 days (ERR_WALKTHROUGH_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID header"
          - "return_reason cleared"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /emergency-operations-plans/{id}/decide (decision=APPROVE)"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /emergency-operations-plans/{id}/decide (decision=RETURN)"
        actor: DistrictSafetyCoordinator
        preconditions:
          - "return_reason must be present when decision=RETURN (ERR_VALIDATION)"
        side_effects:
          - "return_reason := request return_reason"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /emergency-operations-plans/{id}/activate"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "any other ACTIVE EmergencyOperationsPlan with the same site_id -> SUPERSEDED (that plan's updated_at refreshed, version +1)"
          - "activated_at := logical now"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep: logical today > review_due_date"
        actor: system
        preconditions: []
        side_effects:
          - "drill start gate ERR_NO_ACTIVE_EOP begins applying to this site once no plan remains ACTIVE"

  - entity: SitePlanDocument
    initial_state: CURRENT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system: POST /site-plan-documents creates a newer document for the same site_id"
        actor: system
        preconditions: []
        side_effects:
          - "superseded document updated_at refreshed, version +1"
      - from: CURRENT
        to: EXPIRED
        trigger: "system clock sweep: logical today > review_by_date"
        actor: system
        preconditions: []
        side_effects:
          - "EOP submit gate ERR_SITE_PLAN_REQUIRED begins applying once no CURRENT document remains"

  - entity: FirstResponderWalkthrough
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /walkthroughs/{id}/complete"
        actor: FirstResponder
        preconditions:
          - "completed_date >= scheduled_date (ERR_VALIDATION)"
          - "completed_date <= logical today (ERR_VALIDATION)"
        side_effects: []
      - from: SCHEDULED
        to: MISSED
        trigger: "system clock sweep: logical today > scheduled_date"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrillEvent
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED, MISSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /drill-events/{id}/start"
        actor: SchoolSafetyOfficer
        preconditions:
          - "site has an EmergencyOperationsPlan with status ACTIVE (ERR_NO_ACTIVE_EOP)"
          - "logical today == scheduled_date (ERR_DRILL_NOT_TODAY)"
        side_effects:
          - "actual_start_at := logical now"
          - "conducted_by_user_id := X-User-ID header"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /drill-events/{id}/complete"
        actor: SchoolSafetyOfficer
        preconditions:
          - "every RosterEntry of this drill is in {ACCOUNTED, RELEASED} (ERR_ROSTER_INCOMPLETE); vacuously satisfied when roster_total == 0"
        side_effects:
          - "all_clear_at := logical now"
          - "compute provisional_evac_seconds, official_evac_seconds, met_target_standard, met_target_adjusted per calculations.evacuation_time_assessment"
          - "SchoolSite drill counters recompute (calculations.drill_counter_reconciliation)"
          - "SchoolSite.compliance_posture recompute"
          - "ComplianceReport rows at this site in DRAFT whose [period_start, period_end] contains scheduled_date -> STALE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /drill-events/{id}/cancel"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "SchoolSite drill counters recompute"
          - "ComplianceReport rows at this site in DRAFT whose period contains scheduled_date -> STALE"
      - from: COMPLETED
        to: CLOSED
        trigger: "system: the drill's AfterActionReview auto-transitions ACCEPTED -> CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "SchoolSite drill counters recompute (COMPLETED and CLOSED both feed drills_completed_count)"
      - from: SCHEDULED
        to: MISSED
        trigger: "system clock sweep: logical today > scheduled_date"
        actor: system
        preconditions: []
        side_effects:
          - "SchoolSite drill counters recompute"
          - "SchoolSite.compliance_posture recompute (a MISSED drill in the current academic year forces at least AT_RISK)"
          - "ComplianceReport rows at this site in DRAFT whose period contains scheduled_date -> STALE"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "system clock sweep: logical today > scheduled_date (drill started but never completed)"
        actor: system
        preconditions: []
        side_effects:
          - "same recompute set as SCHEDULED -> MISSED"

  - entity: RosterEntry
    initial_state: UNACCOUNTED
    terminal_states: [RELEASED]
    transitions:
      - from: UNACCOUNTED
        to: ACCOUNTED
        trigger: "POST /roster-entries/{id}/account"
        actor: SchoolSafetyOfficer
        preconditions:
          - "parent DrillEvent status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "accounted_at := logical now"
          - "DrillEvent roster counters recompute (calculations.roster_reconciliation)"
      - from: ACCOUNTED
        to: UNACCOUNTED
        trigger: "POST /roster-entries/{id}/unaccount"
        actor: SchoolSafetyOfficer
        preconditions:
          - "parent DrillEvent status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "accounted_at cleared"
          - "DrillEvent roster counters recompute"
      - from: ACCOUNTED
        to: RELEASED
        trigger: "POST /roster-entries/{id}/release"
        actor: SchoolSafetyOfficer
        preconditions:
          - "parent DrillEvent status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "released_to_verified == true (ERR_PICKUP_NOT_VERIFIED)"
        side_effects:
          - "released_at := logical now"
          - "DrillEvent roster counters recompute"

  - entity: AfterActionReview
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /after-action-reviews/{id}/submit"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "submitted_by_user_id := X-User-ID header"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /after-action-reviews/{id}/submit"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "submitted_by_user_id := X-User-ID header"
          - "return_reason cleared"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /after-action-reviews/{id}/decide (decision=ACCEPT)"
        actor: Principal
        preconditions:
          - "decider X-User-ID != submitted_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "decided_by_user_id := X-User-ID header"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /after-action-reviews/{id}/decide (decision=RETURN)"
        actor: Principal
        preconditions:
          - "decider X-User-ID != submitted_by_user_id (ERR_SELF_APPROVAL_FORBIDDEN)"
          - "return_reason must be present when decision=RETURN (ERR_VALIDATION)"
        side_effects:
          - "decided_by_user_id := X-User-ID header"
          - "return_reason := request return_reason"
      - from: ACCEPTED
        to: CLOSED
        trigger: "system: a CorrectiveAction of this review transitions to VERIFIED and afterwards ca_total_count >= 1 and every CorrectiveAction of this review is VERIFIED"
        actor: system
        preconditions: []
        side_effects:
          - "parent DrillEvent (status COMPLETED) -> CLOSED"
          - "SchoolSite drill counters recompute"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: PENDING_VERIFICATION
        trigger: "POST /corrective-actions/{id}/submit-verification"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "evidence_note := request evidence_note"
      - from: REOPENED
        to: PENDING_VERIFICATION
        trigger: "POST /corrective-actions/{id}/submit-verification"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "evidence_note := request evidence_note"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/verify (decision=VERIFY)"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "verified_by_user_id := X-User-ID header"
          - "AfterActionReview.ca_verified_count recompute; if review is ACCEPTED and all its actions are VERIFIED -> review ACCEPTED -> CLOSED, then its drill COMPLETED -> CLOSED, then SchoolSite counters/posture recompute"
      - from: PENDING_VERIFICATION
        to: REOPENED
        trigger: "POST /corrective-actions/{id}/verify (decision=REOPEN)"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "SchoolSite.compliance_posture recompute (action remains non-VERIFIED and may be overdue)"

  - entity: AccommodationPlan
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /accommodation-plans/{id}/deactivate"
        actor: SchoolSafetyOfficer
        preconditions: []
        side_effects:
          - "roster-entry gate ERR_ACCOMMODATION_MISSING applies to subsequent roster adds for this (site_id, student_ref) once no ACTIVE plan remains"

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/submit"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "submitted_at := logical now"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance-reports/{id}/decide (decision=ACCEPT)"
        actor: StateAuditor
        preconditions: []
        side_effects:
          - "decided_by_user_id := X-User-ID header; auditor_comment recorded"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance-reports/{id}/decide (decision=REJECT)"
        actor: StateAuditor
        preconditions: []
        side_effects:
          - "decided_by_user_id := X-User-ID header; auditor_comment recorded"
      - from: DRAFT
        to: STALE
        trigger: "system: any DrillEvent at the same site whose scheduled_date lies inside [period_start, period_end] is created or changes status after snapshot_generated_at, or any DrillTypeRequirement at the site is created/updated"
        actor: system
        preconditions: []
        side_effects: []
      - from: STALE
        to: DRAFT
        trigger: "POST /compliance-reports/{id}/regenerate"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "snapshot recomputed per calculations.statutory_attainment + overall_compliance_score"
          - "snapshot_generated_at := logical now"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /compliance-reports/{id}/regenerate"
        actor: DistrictSafetyCoordinator
        preconditions: []
        side_effects:
          - "snapshot recomputed; snapshot_generated_at := logical now; auditor_comment and decided_by_user_id cleared"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: requirement-update-stale-version
    parent_entity: DrillTypeRequirement
    write_endpoint: "PUT /drill-requirements/{id}"
    occ_field: expected_requirement_version
    description: |
      Updating a DrillTypeRequirement whose version has advanced since the
      client last observed it is rejected. This captures the lost-update case
      where another writer has just modified the statutory configuration
      (which recomputes posture and marks DRAFT reports STALE) and the current
      writer's view of the requirement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: evacuation_time_assessment
    trigger: "DrillEvent IN_PROGRESS -> COMPLETED"
    algorithm: threshold
    formula: |
      provisional_evac_seconds = seconds(all_clear_at - actual_start_at)
      last_accountability_at = max over RosterEntry of (released_at if status == RELEASED else accounted_at);
                               when roster_total == 0, last_accountability_at := all_clear_at
      official_evac_seconds = seconds(last_accountability_at - actual_start_at)
      base variant (standard):
        met_target_standard = (official_evac_seconds <= target_evac_seconds)
      adjusted variant (unannounced):
        when announcement_mode == UNANNOUNCED:
          allowance = ceil(target_evac_seconds * UNANNOUNCED_ALLOWANCE_PCT)
          met_target_adjusted = (official_evac_seconds <= target_evac_seconds + allowance)
        when announcement_mode == ANNOUNCED:
          met_target_adjusted = met_target_standard
    input_set: "the completing DrillEvent, its RosterEntry rows, and the DrillTypeRequirement matching (site_id, drill_type)"
    constants:
      UNANNOUNCED_ALLOWANCE_PCT: 0.25
    precision: "integer seconds; allowance via ceiling"
    variants:
      - name: standard
        when: "statutory reporting and met_target_standard"
        difference: "compares official seconds against the raw target"
      - name: unannounced_adjusted
        when: "drills run with announcement_mode == UNANNOUNCED (met_target_adjusted)"
        difference: "grants a 25% ceiling-rounded allowance on the target, so an identical official_evac_seconds can be met under the adjusted variant and missed under the standard variant"

  - name: statutory_attainment
    trigger: "ComplianceReport generation and regeneration (POST /compliance-reports, POST /compliance-reports/{id}/regenerate)"
    algorithm: aggregation
    formula: |
      for each DrillTypeRequirement configured for the site:
        completed_count = count of DrillEvent rows with site_id == site, drill_type == requirement.drill_type,
                          status IN {COMPLETED, CLOSED}, and scheduled_date inside [period_start, period_end] inclusive
        count_only variant:      attainment_count_only = (completed_count >= required_per_year)
        count_and_spacing variant:
          order the counted drills by (scheduled_date ASC, created_at ASC);
          spacing_compliant = for every consecutive pair, days_between(scheduled_date) >= min_spacing_days
                              (vacuously true for fewer than 2 drills)
          attainment_strict = (completed_count >= required_per_year) AND spacing_compliant
      overall_compliant_count_only = AND of attainment_count_only over configured types
      overall_compliant_strict = AND of attainment_strict over configured types
    input_set: "DrillEvent rows of the site with status IN {COMPLETED, CLOSED} only (SCHEDULED/IN_PROGRESS/CANCELLED/MISSED are excluded), restricted to the report's closed period"
    constants: {}
    precision: "integer counts; day-granularity gaps"
    variants:
      - name: count_only
        when: "overall_compliant_count_only and attainment_count_only"
        difference: "only the completed count matters; clustered drills satisfy it"
      - name: count_and_spacing
        when: "overall_compliant_strict and attainment_strict"
        difference: "identical drill set can fail when consecutive drills sit closer than min_spacing_days, so the same data yields a different verdict"

  - name: overall_compliance_score
    trigger: "ComplianceReport generation and regeneration"
    algorithm: aggregation
    formula: |
      N = number of DrillTypeRequirement rows configured for the site (N >= 1 enforced by validation)
      for each configured type: ratio_i = min(1.0, completed_count_i / required_per_year_i) rounded to 4 decimal places, round_half_up
      overall_score_pct = round_half_up( (sum(ratio_i) / N) * 100, 1 decimal place )
      PINNED ORDER: per-type ratios MUST be rounded to 4dp BEFORE averaging;
      averaging raw ratios and rounding once at the end is a different, non-compliant result.
    input_set: "the same completed_count_i values produced by calculations.statutory_attainment for this snapshot"
    constants: {}
    precision: "per-type ratio 4 decimal places round_half_up, then average, then x100 rounded to 1 decimal place round_half_up"

  - name: compliance_posture_derivation
    trigger: "drill status transitions, corrective-action verify/reopen/creation, requirement create/update, clock sweep (overdue flips)"
    algorithm: threshold
    formula: |
      overdue_actions = count of CorrectiveAction rows reachable via drills of this site
                        (CorrectiveAction.aar_id -> AfterActionReview.drill_event_id -> DrillEvent.site_id == site)
                        with status != VERIFIED and logical today > due_date
      NON_COMPLIANT if:
        (a) logical today > academic_year_end AND exists a configured requirement whose
            current-academic-year completed count (status IN {COMPLETED, CLOSED}, scheduled_date in
            [academic_year_start, academic_year_end]) < required_per_year, OR
        (b) overdue_actions >= OVERDUE_NONCOMPLIANT_THRESHOLD
      else AT_RISK if:
        (a) any drill at the site has status MISSED and scheduled_date inside the current academic year, OR
        (b) overdue_actions >= 1
      else ON_TRACK
    input_set: "site's drills, configured requirements, and corrective actions reachable through the drill -> review -> action chain"
    constants:
      OVERDUE_NONCOMPLIANT_THRESHOLD: 3
    precision: "integer counts; date comparisons at day granularity"

  - name: drill_counter_reconciliation
    trigger: "drill create, start, complete, cancel, auto-MISSED sweep, drill COMPLETED -> CLOSED"
    algorithm: aggregation
    formula: |
      scope: DrillEvent rows with site_id == site and scheduled_date inside [academic_year_start, academic_year_end]
      drills_scheduled_count = count(status IN {SCHEDULED, IN_PROGRESS})
      drills_completed_count = count(status IN {COMPLETED, CLOSED})
      drills_missed_count    = count(status == MISSED)
      drills_cancelled_count = count(status == CANCELLED)
      INVARIANT: the four counters always sum to the number of DrillEvent rows ever created in scope
      (no delete endpoint exists; scheduling then cancelling moves one unit between buckets without drift)
    input_set: "all DrillEvent rows of the site scoped to the current academic year"
    constants: {}
    precision: "integer counts"

  - name: roster_reconciliation
    trigger: "roster entry create, account, unaccount, release"
    algorithm: aggregation
    formula: |
      roster_total      = count of RosterEntry rows for the drill
      unaccounted_count = count(status == UNACCOUNTED)
      accounted_count   = count(status == ACCOUNTED)
      released_count    = count(status == RELEASED)
      INVARIANT: unaccounted_count + accounted_count + released_count == roster_total at all times;
      an account followed by its compensating unaccount returns every bucket to its prior value
      (accounted_at is cleared, no drift in any count)
    input_set: "RosterEntry rows of the drill"
    constants: {}
    precision: "integer counts"

  - name: walkthrough_currency
    trigger: "EmergencyOperationsPlan submit"
    algorithm: threshold
    formula: |
      eligible = FirstResponderWalkthrough rows with site_id == site, status == COMPLETED,
                 and completed_date >= (logical today - WALKTHROUGH_WINDOW_DAYS days)
      gate passes iff eligible is non-empty
      boundary: a walkthrough completed exactly WALKTHROUGH_WINDOW_DAYS days before today IS eligible (>=)
    input_set: "COMPLETED walkthroughs of the site only (SCHEDULED/MISSED excluded)"
    constants:
      WALKTHROUGH_WINDOW_DAYS: 365
    precision: "day granularity, inclusive trailing window"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role is permitted on this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; body-referenced FKs (site_id on create payloads) must also exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "required fields present, types correct, enum members valid, date/datetime formats valid; unknown top-level fields rejected; conditional requirements: return_reason required when decision=RETURN; review_by_date (site plan) must be later than logical today; completed_date >= scheduled_date and <= logical today (walkthrough); period_end >= period_start; academic_year_end >= academic_year_start; coverage_tags must include FLOOR_PLANS and ACCESS_POINTS (ERR_INCOMPLETE_COVERAGE)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition exists (e.g., drill start requires SCHEDULED, AAR decide requires SUBMITTED, roster account requires parent drill IN_PROGRESS, CA create requires review ACCEPTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "safety gates: drill start requires an ACTIVE EOP (ERR_NO_ACTIVE_EOP); roster add with accommodation_required=true requires an ACTIVE AccommodationPlan for (site, student_ref) (ERR_ACCOMMODATION_MISSING); release requires released_to_verified=true (ERR_PICKUP_NOT_VERIFIED); drill complete requires all roster entries resolved (ERR_ROSTER_INCOMPLETE)"
    error_id: "ERR_NO_ACTIVE_EOP | ERR_ACCOMMODATION_MISSING | ERR_PICKUP_NOT_VERIFIED | ERR_ROSTER_INCOMPLETE"
    http_status: 409
    applies_to: "drill start, roster create/account/release, drill complete"

  - priority: 7
    category: business_temporal
    check: "temporal gates: drill scheduled_date inside academic year (ERR_OUTSIDE_ACADEMIC_YEAR); drill start only on its scheduled_date (ERR_DRILL_NOT_TODAY)"
    error_id: "ERR_OUTSIDE_ACADEMIC_YEAR | ERR_DRILL_NOT_TODAY"
    http_status: 409
    applies_to: "drill create, drill start"

  - priority: 8
    category: business_referential
    check: "referential gates, evaluated in this pinned order within the priority: (8a) EOP submit requires a CURRENT SitePlanDocument (ERR_SITE_PLAN_REQUIRED); (8b) EOP submit requires a COMPLETED walkthrough within the trailing 365 days (ERR_WALKTHROUGH_REQUIRED); (8c) drill create requires a DrillTypeRequirement for (site, drill_type), and report generate requires at least one requirement at the site (ERR_REQUIREMENT_NOT_CONFIGURED)"
    error_id: "ERR_SITE_PLAN_REQUIRED | ERR_WALKTHROUGH_REQUIRED | ERR_REQUIREMENT_NOT_CONFIGURED"
    http_status: 409
    applies_to: "EOP submit, drill create, report generate"

  - priority: 9
    category: business_constraint
    check: "uniqueness and conflict constraints: one requirement per (site, drill_type) (ERR_REQUIREMENT_EXISTS); no half-open time overlap between drills at a site in {SCHEDULED, IN_PROGRESS} (ERR_DRILL_OVERLAP); walkthrough and drill may not share a calendar date at a site (ERR_WALKTHROUGH_DRILL_CONFLICT); one roster entry per (drill, student_ref) (ERR_DUPLICATE_ROSTER_ENTRY); one review per drill (ERR_AAR_EXISTS); report periods may not overlap under closed-interval semantics among reports in {DRAFT, STALE, SUBMITTED, ACCEPTED} (ERR_REPORT_PERIOD_OVERLAP); AAR decider must differ from submitter (ERR_SELF_APPROVAL_FORBIDDEN)"
    error_id: "ERR_REQUIREMENT_EXISTS | ERR_DRILL_OVERLAP | ERR_WALKTHROUGH_DRILL_CONFLICT | ERR_DUPLICATE_ROSTER_ENTRY | ERR_AAR_EXISTS | ERR_REPORT_PERIOD_OVERLAP | ERR_SELF_APPROVAL_FORBIDDEN"
    http_status: 409
    applies_to: "create/transition endpoints as listed"

  - priority: 10
    category: state
    check: "OCC: expected_requirement_version must equal the requirement's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /drill-requirements/{id}"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server logical clock. Default at startup, before any call: 2026-08-01T00:00:00Z. Never falls back to wall-clock time. Fires the system sweep: SCHEDULED/IN_PROGRESS drills and SCHEDULED walkthroughs with scheduled_date < today -> MISSED; CURRENT site plans with review_by_date < today -> EXPIRED; ACTIVE EOPs with review_due_date < today -> EXPIRED; corrective-action is_overdue and site posture recompute."
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["system sweep as described; cascades per state machines"]

  # --- SchoolSite ---
  - method: POST
    path: "/sites"
    description: "Create a school campus"
    roles: [DistrictSafetyCoordinator]
    code: 201
    input: [name, enrollment_count, academic_year_start, academic_year_end]
    output: SchoolSite
    side_effects: ["compliance_posture := ON_TRACK; all drill counters := 0"]

  - method: GET
    path: "/sites/{id}"
    description: "Fetch one site including computed posture and counters"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: []
    output: SchoolSite
    side_effects: []

  # --- DrillTypeRequirement ---
  - method: POST
    path: "/drill-requirements"
    description: "Configure the statutory requirement for one drill type at a site"
    roles: [DistrictSafetyCoordinator]
    code: 201
    input: [site_id, drill_type, required_per_year, min_spacing_days, target_evac_seconds, "notes?"]
    output: DrillTypeRequirement
    side_effects: ["DRAFT ComplianceReports at the site -> STALE", "site posture recompute"]

  - method: GET
    path: "/sites/{id}/drill-requirements"
    description: "List drill requirements configured for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["drill_type?", "limit?", "offset?"]
    output: "DrillTypeRequirement[]"
    side_effects: []

  - method: PUT
    path: "/drill-requirements/{id}"
    description: "Update a drill requirement (OCC-guarded)"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: ["required_per_year?", "min_spacing_days?", "target_evac_seconds?", "notes?", expected_requirement_version]
    output: DrillTypeRequirement
    side_effects:
      - "increments DrillTypeRequirement.version by 1"
      - "site posture recompute"
      - "DRAFT ComplianceReports at the site -> STALE"

  # --- EmergencyOperationsPlan ---
  - method: POST
    path: "/emergency-operations-plans"
    description: "Create a plan in DRAFT"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [site_id, title, plan_version_label, content_summary, review_due_date]
    output: EmergencyOperationsPlan
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/sites/{id}/emergency-operations-plans"
    description: "List plans for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EmergencyOperationsPlan[]"
    side_effects: []

  - method: POST
    path: "/emergency-operations-plans/{id}/submit"
    description: "Submit a DRAFT or RETURNED plan for district approval"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: []
    output: EmergencyOperationsPlan
    side_effects: ["status -> SUBMITTED; submitted_by_user_id recorded"]

  - method: POST
    path: "/emergency-operations-plans/{id}/decide"
    description: "District decision on a SUBMITTED plan"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: [decision, "return_reason?"]
    output: EmergencyOperationsPlan
    side_effects: ["status -> APPROVED | RETURNED"]

  - method: POST
    path: "/emergency-operations-plans/{id}/activate"
    description: "Activate an APPROVED plan; supersedes the site's currently ACTIVE plan"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: []
    output: EmergencyOperationsPlan
    side_effects: ["status -> ACTIVE", "previous ACTIVE plan at the site -> SUPERSEDED", "activated_at stamped"]

  # --- SitePlanDocument ---
  - method: POST
    path: "/site-plan-documents"
    description: "Publish a floor-plan/access document; supersedes the site's CURRENT document"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [site_id, document_title, issued_on, review_by_date, coverage_tags]
    output: SitePlanDocument
    side_effects: ["status := CURRENT", "prior CURRENT document at the site -> SUPERSEDED"]

  - method: GET
    path: "/sites/{id}/site-plan-documents"
    description: "List site plan documents for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SitePlanDocument[]"
    side_effects: []

  # --- FirstResponderWalkthrough ---
  - method: POST
    path: "/walkthroughs"
    description: "Schedule a first-responder site walkthrough; may not share a calendar date with a SCHEDULED/IN_PROGRESS drill at the site"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [site_id, agency, scheduled_date]
    output: FirstResponderWalkthrough
    side_effects: ["status := SCHEDULED"]

  - method: GET
    path: "/sites/{id}/walkthroughs"
    description: "List walkthroughs for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["agency?", "status?", "limit?", "offset?"]
    output: "FirstResponderWalkthrough[]"
    side_effects: []

  - method: POST
    path: "/walkthroughs/{id}/complete"
    description: "Record a completed walkthrough"
    roles: [FirstResponder]
    code: 200
    input: [completed_date, findings_summary, recommendations_count]
    output: FirstResponderWalkthrough
    side_effects: ["status -> COMPLETED; completed_date/findings recorded"]

  # --- DrillEvent ---
  - method: POST
    path: "/drill-events"
    description: "Schedule a drill; occupies half-open interval [scheduled_start_time, +duration_minutes) on scheduled_date"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [site_id, drill_type, scheduled_date, scheduled_start_time, duration_minutes, "announcement_mode?"]
    output: DrillEvent
    side_effects:
      - "status := SCHEDULED; roster counters := 0"
      - "site drill counters recompute"
      - "DRAFT ComplianceReports whose period contains scheduled_date -> STALE"

  - method: GET
    path: "/sites/{id}/drill-events"
    description: "List drills for a site with filters"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "drill_type?", "scheduled_date_from?", "scheduled_date_to?", "limit?", "offset?"]
    output: "DrillEvent[]"
    side_effects: []

  - method: GET
    path: "/drill-events/{id}"
    description: "Fetch one drill including computed timing fields and roster counters"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: []
    output: DrillEvent
    side_effects: []

  - method: POST
    path: "/drill-events/{id}/start"
    description: "Begin execution of a scheduled drill (day-of only, under an ACTIVE EOP)"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: []
    output: DrillEvent
    side_effects: ["status -> IN_PROGRESS", "actual_start_at := logical now", "conducted_by_user_id recorded"]

  - method: POST
    path: "/drill-events/{id}/complete"
    description: "Close out execution: all-clear timestamp + timing assessment"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: ["completion_notes?"]
    output: DrillEvent
    side_effects:
      - "status -> COMPLETED; all_clear_at := logical now"
      - "evacuation_time_assessment computed (provisional/official seconds, met flags)"
      - "site counters + posture recompute; covering DRAFT reports -> STALE"

  - method: POST
    path: "/drill-events/{id}/cancel"
    description: "Cancel a scheduled drill"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: ["reason?"]
    output: DrillEvent
    side_effects: ["status -> CANCELLED", "site counters recompute", "covering DRAFT reports -> STALE"]

  # --- RosterEntry ---
  - method: POST
    path: "/drill-events/{id}/roster-entries"
    description: "Add a student to a drill's accountability roster (drill must be SCHEDULED or IN_PROGRESS)"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [student_ref, "accommodation_required?"]
    output: RosterEntry
    side_effects: ["status := UNACCOUNTED", "drill roster counters recompute"]

  - method: GET
    path: "/drill-events/{id}/roster-entries"
    description: "List roster entries for a drill"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RosterEntry[]"
    side_effects: []

  - method: POST
    path: "/roster-entries/{id}/account"
    description: "Mark a student accounted-for at the assembly area"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: []
    output: RosterEntry
    side_effects: ["status -> ACCOUNTED", "accounted_at := logical now", "drill roster counters recompute"]

  - method: POST
    path: "/roster-entries/{id}/unaccount"
    description: "Undo a mistaken accountability mark"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: ["reason?"]
    output: RosterEntry
    side_effects: ["status -> UNACCOUNTED", "accounted_at cleared", "drill roster counters recompute"]

  - method: POST
    path: "/roster-entries/{id}/release"
    description: "Reunification release to a verified guardian"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: [guardian_name, released_to_verified]
    output: RosterEntry
    side_effects: ["status -> RELEASED", "released_at := logical now", "drill roster counters recompute"]

  # --- AfterActionReview ---
  - method: POST
    path: "/drill-events/{id}/after-action-reviews"
    description: "Open the after-action review for a COMPLETED drill (one per drill)"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [findings_summary, overall_rating, evacuation_assessment]
    output: AfterActionReview
    side_effects: ["status := DRAFT", "ca counters := 0"]

  - method: GET
    path: "/drill-events/{id}/after-action-reviews"
    description: "List reviews for a drill (0 or 1 elements)"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AfterActionReview[]"
    side_effects: []

  - method: GET
    path: "/after-action-reviews/{id}"
    description: "Fetch one review including corrective-action counters"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: []
    output: AfterActionReview
    side_effects: []

  - method: POST
    path: "/after-action-reviews/{id}/submit"
    description: "Submit a DRAFT or RETURNED review to the principal"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: []
    output: AfterActionReview
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id recorded"]

  - method: POST
    path: "/after-action-reviews/{id}/decide"
    description: "Principal accepts or returns a submitted review; decider must differ from submitter"
    roles: [Principal]
    code: 200
    input: [decision, "return_reason?"]
    output: AfterActionReview
    side_effects: ["status -> ACCEPTED | RETURNED", "decided_by_user_id recorded"]

  # --- CorrectiveAction ---
  - method: POST
    path: "/after-action-reviews/{id}/corrective-actions"
    description: "Open a corrective action on an ACCEPTED review"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [description, priority, due_date, assignee_name]
    output: CorrectiveAction
    side_effects: ["status := OPEN", "review ca counters recompute", "site posture recompute"]

  - method: GET
    path: "/after-action-reviews/{id}/corrective-actions"
    description: "List corrective actions for a review"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CorrectiveAction[]"
    side_effects: []

  - method: POST
    path: "/corrective-actions/{id}/submit-verification"
    description: "Mark remediation done and request district verification"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: [evidence_note]
    output: CorrectiveAction
    side_effects: ["status -> PENDING_VERIFICATION"]

  - method: POST
    path: "/corrective-actions/{id}/verify"
    description: "District verifies or reopens a submitted corrective action; final verification cascades review -> CLOSED and drill -> CLOSED"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: [decision, "note?"]
    output: CorrectiveAction
    side_effects:
      - "status -> VERIFIED | REOPENED"
      - "on VERIFY: review counters recompute; if review ACCEPTED with all actions VERIFIED -> review CLOSED -> drill CLOSED -> site counters/posture recompute"

  # --- AccommodationPlan ---
  - method: POST
    path: "/accommodation-plans"
    description: "Create a special-needs drill accommodation plan (starts ACTIVE)"
    roles: [SchoolSafetyOfficer]
    code: 201
    input: [site_id, student_ref, need_type, instructions, review_by_date]
    output: AccommodationPlan
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/sites/{id}/accommodation-plans"
    description: "List accommodation plans for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "student_ref?", "limit?", "offset?"]
    output: "AccommodationPlan[]"
    side_effects: []

  - method: POST
    path: "/accommodation-plans/{id}/deactivate"
    description: "Deactivate an accommodation plan"
    roles: [SchoolSafetyOfficer]
    code: 200
    input: []
    output: AccommodationPlan
    side_effects: ["status -> INACTIVE"]

  # --- ComplianceReport ---
  - method: POST
    path: "/compliance-reports"
    description: "Generate a compliance report snapshot for a closed-interval period; period may not overlap another report in {DRAFT, STALE, SUBMITTED, ACCEPTED} at the site"
    roles: [DistrictSafetyCoordinator]
    code: 201
    input: [site_id, period_start, period_end]
    output: ComplianceReport
    side_effects:
      - "status := DRAFT; snapshot_generated_at := logical now"
      - "statutory_attainment + overall_compliance_score computed into snapshot fields"

  - method: GET
    path: "/sites/{id}/compliance-reports"
    description: "List compliance reports for a site"
    roles: [DistrictSafetyCoordinator, SchoolSafetyOfficer, Principal, FirstResponder, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ComplianceReport[]"
    side_effects: []

  - method: POST
    path: "/compliance-reports/{id}/submit"
    description: "Submit a DRAFT report to the state"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status -> SUBMITTED", "submitted_at := logical now"]

  - method: POST
    path: "/compliance-reports/{id}/decide"
    description: "State auditor accepts or rejects a submitted report"
    roles: [StateAuditor]
    code: 200
    input: [decision, "auditor_comment?"]
    output: ComplianceReport
    side_effects: ["status -> ACCEPTED | REJECTED", "decided_by_user_id + auditor_comment recorded"]

  - method: POST
    path: "/compliance-reports/{id}/regenerate"
    description: "Recompute a STALE or REJECTED report's snapshot back into DRAFT"
    roles: [DistrictSafetyCoordinator]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status -> DRAFT", "snapshot recomputed", "snapshot_generated_at := logical now"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or body-referenced FK does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing/invalid field, bad enum member, malformed date, unknown field, or failed conditional input rule (return_reason on RETURN, walkthrough completed_date range, review_by_date in future, period ordering)" }
  - { id: ERR_INCOMPLETE_COVERAGE, http: 400, condition: "site plan coverage_tags omit FLOOR_PLANS or ACCESS_POINTS" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource not in a state from which the transition exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_requirement_version does not match the requirement's current version" }
  - { id: ERR_NO_ACTIVE_EOP, http: 409, condition: "drill start attempted while the site has no ACTIVE EmergencyOperationsPlan" }
  - { id: ERR_ACCOMMODATION_MISSING, http: 409, condition: "roster entry flagged accommodation_required but no ACTIVE AccommodationPlan exists for (site, student_ref)" }
  - { id: ERR_PICKUP_NOT_VERIFIED, http: 409, condition: "reunification release attempted with released_to_verified != true" }
  - { id: ERR_ROSTER_INCOMPLETE, http: 409, condition: "drill complete attempted with roster entries still UNACCOUNTED" }
  - { id: ERR_OUTSIDE_ACADEMIC_YEAR, http: 409, condition: "drill scheduled_date outside [academic_year_start, academic_year_end]" }
  - { id: ERR_DRILL_NOT_TODAY, http: 409, condition: "drill start attempted when logical today != scheduled_date" }
  - { id: ERR_WALKTHROUGH_REQUIRED, http: 409, condition: "EOP submit without a COMPLETED walkthrough inside the trailing 365-day window" }
  - { id: ERR_SITE_PLAN_REQUIRED, http: 409, condition: "EOP submit without a CURRENT SitePlanDocument at the site" }
  - { id: ERR_REQUIREMENT_NOT_CONFIGURED, http: 409, condition: "drill create for a type with no requirement at the site, or report generate at a site with zero requirements" }
  - { id: ERR_REQUIREMENT_EXISTS, http: 409, condition: "a requirement already exists for (site_id, drill_type)" }
  - { id: ERR_DRILL_OVERLAP, http: 409, condition: "half-open interval [start, start+duration) overlaps another drill at the site in {SCHEDULED, IN_PROGRESS}; touching endpoints do NOT overlap" }
  - { id: ERR_WALKTHROUGH_DRILL_CONFLICT, http: 409, condition: "walkthrough scheduled_date equals the scheduled_date of a SCHEDULED/IN_PROGRESS drill at the same site (whole-day exclusion, checked in both directions)" }
  - { id: ERR_DUPLICATE_ROSTER_ENTRY, http: 409, condition: "student_ref already present on this drill's roster" }
  - { id: ERR_AAR_EXISTS, http: 409, condition: "drill already has an after-action review" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "closed-interval [period_start, period_end] intersects another report at the site in {DRAFT, STALE, SUBMITTED, ACCEPTED}; shared boundary dates DO overlap" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 409, condition: "AAR decider X-User-ID equals submitted_by_user_id" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: DistrictSafetyCoordinator
    description: "District safety office administrator; configures statutory requirements, approves/activates EOPs, verifies corrective actions, owns state reporting and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sites"
      - "POST /drill-requirements"
      - "PUT /drill-requirements/{id}"
      - "POST /emergency-operations-plans/{id}/decide"
      - "POST /emergency-operations-plans/{id}/activate"
      - "POST /corrective-actions/{id}/verify"
      - "POST /compliance-reports (+ submit/decide-na/regenerate)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: SchoolSafetyOfficer
    description: "Site-level safety officer; drafts EOPs, publishes site plans, schedules walkthroughs and drills, executes drills, manages rosters/reunification, drafts reviews, remediates actions, manages accommodation plans"
    identity: opaque
    exclusive_operations:
      - "POST /emergency-operations-plans (+ /submit)"
      - "POST /site-plan-documents"
      - "POST /walkthroughs"
      - "POST /drill-events (+ /start, /complete, /cancel)"
      - "POST /drill-events/{id}/roster-entries; POST /roster-entries/{id}/account|unaccount|release"
      - "POST /drill-events/{id}/after-action-reviews; POST /after-action-reviews/{id}/submit"
      - "POST /after-action-reviews/{id}/corrective-actions; POST /corrective-actions/{id}/submit-verification"
      - "POST /accommodation-plans (+ /deactivate)"
    shared_operations:
      - "all GET endpoints"

  - name: Principal
    description: "School principal; decides submitted after-action reviews (must not be the review's submitter)"
    identity: opaque
    exclusive_operations:
      - "POST /after-action-reviews/{id}/decide"
    shared_operations:
      - "all GET endpoints"

  - name: FirstResponder
    description: "External agency responder (fire/police/EMS); records walkthrough completion"
    identity: opaque
    exclusive_operations:
      - "POST /walkthroughs/{id}/complete"
    shared_operations:
      - "all GET endpoints"

  - name: StateAuditor
    description: "State compliance auditor; accepts or rejects submitted compliance reports"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-reports/{id}/decide"
    shared_operations:
      - "all GET endpoints"
