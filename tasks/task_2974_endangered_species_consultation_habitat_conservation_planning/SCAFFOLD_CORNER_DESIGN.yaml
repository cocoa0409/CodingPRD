      - name: take_unit_decides_whether_density_is_applied
        claim_type: correct_result
        grounds:
          - calculations.incidental_take_authorization
          - entities.Species.fields.take_authorization_unit
          - entities.Species.fields.take_density_per_acre
        distinguishing_aspect: >-
          For INDIVIDUALS and NESTS the take is exposed_acres x
          take_density_per_acre; for ACRES the acreage IS the take and the density
          must NOT be applied even though the species still carries one. The ACRES
          species below has density 0.40, so multiplying anyway yields 5.00
          instead of 12.50 — a 60% understatement of the authorized take.
        test_recipe:
