          rationale: "The supersede cascade (p1 -> ARCHIVED on p2 activation) is asserted directly by that §1.8 instance."

      - name: order_accept_requires_active_store_guard
        claim_type: guarded_transition
        grounds:
          - state_machines.DeliveryOrder.QUOTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / order_accept_requires_active_store"
          rationale: "Guarded transition asserted there, including the negative and positive directions."

  # ===========================================================================
  - section: calculations
    instances:

