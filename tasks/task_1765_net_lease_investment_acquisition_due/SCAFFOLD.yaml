    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups"
    description: "Propose a true-up adjustment"
    roles: [AssetManager]
    code: 201
    input: [line_type, amount_cents, reason]
    output: TrueUpAdjustment
    side_effects: ["status = PROPOSED; approved = false"]

  - method: GET
    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups"
    description: "List true-up adjustments"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, EscrowOfficer, AssetManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TrueUpAdjustment[]"
    side_effects: []

  - method: GET
    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}"
    description: "Get a true-up adjustment"
    roles: [AcquisitionsAnalyst, UnderwritingCommittee, EscrowOfficer, AssetManager, PlatformAdmin]
    code: 200
    input: []
    output: TrueUpAdjustment
    side_effects: []

  - method: POST
    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/escrow-approve"
    description: "Escrow officer approves true-up"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: TrueUpAdjustment
    side_effects: ["status → ESCROW_APPROVED"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/asset-manager-approve"
    description: "Asset manager approves true-up (SoD vs proposer)"
    roles: [AssetManager]
    code: 200
    input: []
    output: TrueUpAdjustment
    side_effects: ["status → FULLY_APPROVED; approved = true"]

  - method: POST
    path: "/acquisition-deals/deals/{id}/closing-statements/{stmtId}/true-ups/{adjId}/reject"
    description: "Reject true-up"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: TrueUpAdjustment
    side_effects: ["status → REJECTED"]

