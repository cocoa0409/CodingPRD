              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, slot_minutes: 15, open_local_minutes: 480, close_local_minutes: 1020, pediatric_capable: true, draw_hold_minutes: 30 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - call: "POST /_scenarios/seed-reference"
