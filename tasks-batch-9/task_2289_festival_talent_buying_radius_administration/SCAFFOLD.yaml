      - "status = DRAFT; submission_count = 0; channel_overage = 0"

  - method: GET
    path: /festival-ops/advance-packets/{id}
    description: "Read one advance packet including its submission counter and audit user ids."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, ProductionManager]
    input: []
    output: AdvancePacket
    success_code: 200
    side_effects: []

  - method: GET
    path: /festival-ops/bookings/{id}/advance-packets
    description: "List the booking's advance packets ordered by created_at ASC."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, ProductionManager]
    input: ["status?", "limit?", "offset?"]
    output: "AdvancePacket[]"
    success_code: 200
    side_effects: []

  - method: POST
    path: /festival-ops/advance-packets/{id}/submit
    description: "Submit the advance for production review; consumes one of three submissions."
    roles: [ArtistRep, ProductionManager]
    input: []
    output: AdvancePacket
    success_code: 200
    side_effects:
      - "validations priority 67 aggregates input_channel_count across every SUBMITTED or APPROVED packet sharing the stage-day against STAGE_CHANNEL_HARD_MAX (112)"
      - "status DRAFT or RETURNED -> SUBMITTED; submission_count += 1; submitted_by_user_id = X-User-Id (overwritten on every submission)"
      - "channel_overage = max(0, stage-day input_channel_count total including this packet - STAGE_CHANNEL_ADVISORY (96))"
      - "the fourth submit attempt is ERR_ADVANCE_SUBMISSIONS_EXHAUSTED"

