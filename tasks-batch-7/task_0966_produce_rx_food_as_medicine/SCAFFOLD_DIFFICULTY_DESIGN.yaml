            - { call: "POST /redemptions", payload: { retailer_id: "${rt}", enrollment_id: "${en}", lines: [ { category: "PRODUCE_ELIGIBLE", amount_cents: 400 } ] }, as: RetailerStaff, as_user_id: "${rt}", captures: { m2: $.data.match_cents } }
