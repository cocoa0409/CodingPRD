      - name: forecast_night_and_weather_multipliers_compose
        claim_type: correct_result
        grounds:
          - calculations.forecast_basket_lift
          - endpoints.GET_/sites/{siteId}/demand-forecast
        distinguishing_aspect: "The projection multiplies the trailing baseline by the night lift AND the weather lift: at a 23:00 UTC read with baseline bucket empty, projected is 0; the composition rule (1 + 0.40) x (1 + prob x 0.25) is applied multiplicatively, not additively."
        test_recipe:
          setup: ["Logical clock 2026-09-10T23:00:00Z (inside the 22:00-04:00 night band). SITE-A with no delivered orders (baseline 0)."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T23:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /mfc/sites/${site_id}/demand-forecast"
              payload: { precipitation_prob: 0.8 }
              as: SiteOps
          assert:
            - "the response status is 200 and hours has 24 entries"
            - "every hour bucket projects 0 when the trailing 7-day same-hour baseline is 0 (multiplicative lifts cannot create demand ex nihilo)"

