  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: carbon_registration_gated_by_property_certification_posture
        grounds:
          - state_machines.CarbonProject.VALIDATION_to_REGISTERED
          - state_machines.CarbonDedication.PENDING_to_ACTIVE
          - "validations[priority=60]"
          - calculations.certification_posture_derivation
          - entities.CarbonProject.fields.buffer_pool_tons
        distinguishing_aspect: |
          Whether a CarbonProject may leave VALIDATION depends on the state of a THIRD
          entity family — the AuditFindings of the property — and not on anything the
          project itself holds. With two open MAJOR findings REGISTER answers
          ERR_CERTIFICATION_SUSPENDED and the 500.00-ton dedication stays PENDING; once
          both findings are CLOSED the identical REGISTER call succeeds, stamps
          permanence_end_date 2056-08-01 (clock + the project's own 30-year permanence
          term, not the 20-year crediting period) and fixes buffer_pool_tons at 90.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Canonical fund and 'Piney Creek Tract' acquired (OWNED, SFI); stand PC-01 cruise-closed at 4647.12 tons."
            - "An ACR carbon project with crediting_period_years 20 and permanence_term_years 30, one PENDING dedication of 500.00 tons, advanced to VALIDATION."
            - "A SURVEILLANCE audit in FIELD_WORK carrying two open MAJOR findings, so certification_posture is SUSPENDED."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: { name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00 }
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: { fund_id: "${fund_id}", name: "Piney Creek Tract", region_code: "SOUTH", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI" }
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: { property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78 }
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: { stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z" }
              as: ForestManager
