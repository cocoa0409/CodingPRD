            - "ArtworkAsset.${asset_1}.version_counter == 1 and ArtworkAsset.${asset_2}.version_counter == 0"

  # ==========================================================================
  # SECTION 2 - state_machines (§1.2 surface)
  # Walks the guide's Table-2 rows: initial state, valid transitions,
  # precondition enforcement, side-effect execution, invalid transitions,
  # terminal-state lockdown and idempotency, plus the `cyclic` shape row and the
  # cascade-pattern rows. Cascade, ledger-sync and compensation patterns are
  # already the subject of §1.8 rules 4 and 9, so those appear as stubs.
  # ==========================================================================
  - section: state_machines
    instances:

      - name: fresh_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Brief.initial_state
          - state_machines.MarketingClaim.initial_state
          - state_machines.ArtworkVersion.initial_state
          - entities.Printer.fields.certification_status
          - entities.Printer.fields.performance_score
          - entities.ArtworkAsset.fields.obsolescence_state
        distinguishing_aspect: |
          Five entities with five different initial postures, asserted from the create
          responses themselves: Brief DRAFT, MarketingClaim DRAFT, ArtworkVersion
          DRAFT, ArtworkAsset ACTIVE, and Printer CERTIFIED with a full 100.0
          performance score. The Printer is the discriminating one - it starts in the
          GOOD state rather than a neutral pending one, so an implementation that
          initialises every enum to its first alphabetical member gets PROBATION.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /marketing-claims"
              payload: {claim_code: "CLM-NAS-01", claim_text: "NO ADDED SUGAR", claim_type: "NUTRIENT_CONTENT", market_code: "US", substantiation_ref: "DOSSIER-NAS-2026-01"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_us: "$.data.id" }
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /printers"
              payload:
                name: "Cascade Print Co"
                color_standard: "G7_MASTER"
                certified_substrates: ["COATED_PAPER", "FILM"]
                recovery_liability_cap_cents: 5000000
              as: PlatformAdmin
              as_user_id: "u_admin"
              captures: { printer_id: "$.data.id" }
          assert:
            - "POST /briefs returns data.status == DRAFT with approved_at null"
            - "POST /marketing-claims returns data.legal_status == DRAFT with cleared_from_utc null, cleared_until_utc null and usage_count 0"
            - "POST /artwork-assets returns data.obsolescence_state == ACTIVE with version_counter 0 and current_approved_version_id null"
            - "POST /artwork-assets/${asset_id}/versions returns data.state == DRAFT with check_run_no 0 and revision_cycle_count 0"
            - "POST /printers returns data.certification_status == CERTIFIED, data.performance_score == 100.0, data.recovery_balance_cents == 0 and data.escape_count == 0"

      - name: brief_decision_records_the_reviewer_and_the_clock_on_both_outcomes
        claim_type: valid_transition
        grounds:
          - state_machines.Brief.DRAFT_to_APPROVED
          - state_machines.Brief.DRAFT_to_REJECTED
          - entities.Brief.fields.approved_by_user_id
          - entities.Brief.fields.approved_at
          - entities.Brief.fields.review_note
          - endpoints[POST /briefs/{id}/decision]
        distinguishing_aspect: |
          One endpoint drives two different transitions off the same DRAFT state, and
          both must persist the audit trio (decider, logical-clock instant, note) - the
          REJECTED path included, which is where implementations tend to record the
          reason but not the reviewer. The clock is advanced before the triggers so
          approved_at cannot accidentally match created_at.
        test_recipe:
          setup:
            - "Two Briefs created at 2026-08-01T00:00:00Z and both left DRAFT: SKU-1001 and SKU-1002."
            - "The logical clock is moved to 2026-08-04T10:30:00Z before either decision."
            - "Both decisions are issued by RegulatoryReviewer with X-User-ID u_reg."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_ok: "$.data.id" }
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1002"
                product_name: "Northgate Cocoa Carton 500g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_no: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-04T10:30:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs/${brief_ok}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /briefs/${brief_no}/decision"
              payload: {decision: "REJECTED", review_note: "Structural spec contradicts the filed dieline."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
          assert:
            - "the APPROVED decision returns 200 with data.status == APPROVED, data.approved_by_user_id == u_reg, data.approved_at == 2026-08-04T10:30:00Z and data.review_note == Scheme and net contents confirmed."
            - "the REJECTED decision returns 200 with data.status == REJECTED, data.approved_by_user_id == u_reg and data.review_note == Structural spec contradicts the filed dieline."
            - "Brief.${brief_ok}.created_at == 2026-08-01T00:00:00Z while updated_at == 2026-08-04T10:30:00Z"
            - "Brief.${brief_ok}.version == 2 and Brief.${brief_no}.version == 2"

      - name: rejected_brief_is_terminal_for_both_edits_and_further_decisions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Brief.terminal_states
          - validations[priority=23]
          - errors[ERR_BRIEF_STATE_INVALID]
          - endpoints[PATCH /briefs/{id}]
        distinguishing_aspect: |
          REJECTED is declared terminal, so the two write paths that DRAFT admits must
          both close: the PATCH edit and the decision endpoint itself. The second probe
          is the interesting one - it re-calls the very endpoint that produced the
          terminal state, so an implementation that only guards `status != DRAFT` on
          edits but re-runs the decision handler unconditionally would resurrect a
          rejected brief into APPROVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 was created and then REJECTED, so status == REJECTED and version == 2."
            - "No ArtworkAsset exists under it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
