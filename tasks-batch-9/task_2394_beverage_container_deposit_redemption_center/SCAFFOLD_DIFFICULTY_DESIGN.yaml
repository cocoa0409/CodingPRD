  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_add_rejected_when_product_registration_suspended
        grounds:
          - validations[priority=22]
          - errors[ERR_PRODUCT_NOT_REGISTERED]
          - state_machines.BeverageProduct.REGISTERED_to_SUSPENDED
          - state_machines.RedemptionVisit.OPEN_to_COUNTING
        distinguishing_aspect: |
          The admissibility of a ContainerLot on an OPEN visit is decided by a state that lives
          on BeverageProduct: with registration_state SUSPENDED the same request that succeeded
          while REGISTERED now returns ERR_PRODUCT_NOT_REGISTERED, and the visit stays OPEN with
          presented_total 0 — the governing entity is the label, not the visit or the center.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center with one PET_PLASTIC machine"
            - "Product previously REGISTERED, then moved to registration_state SUSPENDED by the program"
            - "One CENTER MACHINE_COUNT visit in count_status OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /distributors"
              payload: { legal_name: "Cascade Bottling LLC", state_code: "OR", permit_number: "PERMIT-1001" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /beverage-products"
              payload: { distributor_id: "${dist_id}", brand_name: "Cascade Spring", beverage_type: "WATER", container_material: "PET_PLASTIC", fill_volume_ml: 500, upc: "011110000001", label_state_code: "OR" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUSPEND", reason: "label legend under review" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
              captures: { mach_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "MACHINE_COUNT", center_id: "${center_id}", machine_id: "${mach_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_id: $.data.id, visit_ver: $.data.version }
          trigger:
            - call: "POST /redemption-visits/${visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 40, out_of_state_marked_quantity: 0, contaminated_quantity: 0, expected_visit_version: "${visit_ver}" }
              as: CenterOperator
              as_user_id: "${center_id}"
