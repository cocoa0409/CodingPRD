      - name: endpoint_computed_read_incentive_program_capacity_reflects_the_enrollment_debit
        claim_type: computed_read
        grounds:
          - endpoints[GET /incentive-programs/{id}]
          - entities.IncentiveProgram.fields.uncommitted_capacity_cents
          - entities.IncentiveProgram.fields.enrolled_count
        distinguishing_aspect: "uncommitted_capacity_cents and enrolled_count are derived on read from the ENROLLED and PROBATION rows, so two enrollments of 6000000 and 9000000 against a 20000000 pool must read back as 5000000 remaining and a count of 2 — and the programme flips to CLOSED_FULL because 5000000 is below the 6000000 minimum."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one COMPLIANT US/USD acquirer."
            - "MccDefinition 5411 (GROCERY) plus the STANDARD program."
            - "Two VERIFIED grocery merchants under the same acquirer."
            - "An incentive program admitting 5411 with total_capacity 20000000, min_commitment 6000000, reopen_threshold 6000000, performance_threshold_pct 80.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
              as: NetworkAdmin
              captures: { plat_id: $.data.id }
            - call: "POST /acquirers"
              payload: { name: "Acme Acquiring", bin_prefix: "411111", platform_id: "${plat_id}", country_code: "US", settlement_currency: "USD" }
              as: NetworkAdmin
              captures: { acq_id: $.data.id }
            - call: "POST /mcc-definitions"
              payload: { mcc_code: "5411", description: "Grocery Stores", business_type_key: "GROCERY", program_eligibility: ["SMALL_TICKET"], requires_documentation: false, high_risk: false }
              as: NetworkAdmin
            - call: "POST /rate-programs"
              payload: { program_code: "STANDARD_FALLBACK", name: "Standard", category: "STANDARD", eligible_mcc_codes: ["5411"], base_rate_bps: 254, per_item_fee_cents: 10, requires_data_elements: [], max_clearing_delay_hours: 720 }
              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "Corner Grocer", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_a: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Hilltop Market", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_b: $.data.id }
            - call: "POST /merchants/${mer_a}/verify-category"
              payload: { documentation_ref: "DOC-A" }
