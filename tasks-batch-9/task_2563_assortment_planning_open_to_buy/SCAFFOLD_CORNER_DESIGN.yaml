              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_a: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Knits", code: "KNIT", role: "CONVENIENCE", sales_share_bps: 2000 }
              as: MerchOpsAdmin
              captures: { cat_b: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_a: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Borealis Knitwear", code: "BORE", lead_time_days: 30, weekly_unit_capacity: 9000, min_order_units: 50, cancel_cutoff_days: 7 }
              as: MerchOpsAdmin
              captures: { vendor_b: $.data.id }
            - call: "POST /otb/vendors/${vendor_a}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendors/${vendor_b}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_a}", category_id: "${cat_a}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { auth_aa: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_a}", category_id: "${cat_b}", max_open_units: 15000 }
              as: MerchOpsAdmin
              captures: { auth_ab: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_b}", category_id: "${cat_a}", max_open_units: 8000 }
              as: MerchOpsAdmin
              captures: { auth_ba: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_b}", category_id: "${cat_b}", max_open_units: 6000 }
              as: MerchOpsAdmin
              captures: { auth_bb: $.data.id }
            - call: "GET /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_a}" }
              as: MerchOpsAdmin
              captures: { first_of_vendor_a: "$.data[0].category_id" }
            - call: "GET /otb/vendor-authorizations"
              payload: { category_id: "${cat_b}", status: "ACTIVE" }
              as: MerchOpsAdmin
              captures: { first_of_cat_b: "$.data[0].vendor_id" }
          assert:
            - "all four creates return HTTP 201 with status ACTIVE and version 1, and ${auth_aa}, ${auth_ab}, ${auth_ba}, ${auth_bb} are four distinct ids: the junction stores one row per (vendor, category) pair with its own max_open_units (40000, 15000, 8000, 6000)"
            - "GET /otb/vendor-authorizations?vendor_id=${vendor_a} returns total_count == 2 and ${first_of_vendor_a} is one of ${cat_a} / ${cat_b}: the junction is traversable from the vendor side"
            - "GET /otb/vendor-authorizations?category_id=${cat_b}&status=ACTIVE returns total_count == 2 and ${first_of_cat_b} is one of ${vendor_a} / ${vendor_b}: the same junction is traversable from the category side"
            - "GET /otb/vendor-authorizations returns total_count == 4 unfiltered - neither vendor nor category is addressed through a nested URL path, every link is an explicit FK in the body, which is what §1.0's graph topology claims"
            - "GET /otb/vendor-authorizations/${auth_ba} returns max_open_units == 8000, proving the (vendor_b, cat_a) row is independent of the (vendor_a, cat_a) row's 40000 ceiling"

  # =========================================================================
  # 2. From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Vendor.initial_state
          - state_machines.CategoryPlan.initial_state
          - state_machines.PlanMonth.initial_state
          - state_machines.OptionPlan.initial_state
          - state_machines.AssortmentItem.initial_state
          - state_machines.LocalizationOverlay.initial_state
        distinguishing_aspect: "Six creation endpoints each land their row in the §1.2 initial_state with every computed companion field at its declared default - PENDING vendor, DRAFT plan, DRAFT month, OPEN option plan with null slot counts, PROPOSED item with null sell_through_bps but multiplier 10000, DRAFT overlay - and none of these states can be chosen by the client because status is not in any endpoint's input list."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
          trigger:
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id, vendor_status: $.data.status }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { auth_status: $.data.status }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id, plan_status: $.data.status }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id, month_status: $.data.status, month_basis: $.data.active_basis }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id, op_status: $.data.status, op_assigned: $.data.option_slots_assigned }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op_id}", vendor_id: "${vendor_id}", sku_code: "DR-1001", color_code: "BLK", lifecycle_stage: "NEW", unit_cost_cents: 2600, retail_price_cents: 7900 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_id: $.data.id, item_status: $.data.status, item_mult: $.data.effective_overlay_multiplier_bps }
            - call: "POST /otb/localization-overlays"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "CLIMATE", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-08-31T00:00:00Z", unit_multiplier_bps: 11000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { overlay_id: $.data.id, overlay_status: $.data.status }
          assert:
            - "${vendor_status} == PENDING - Vendor.initial_state, and status is not an input of POST /otb/vendors"
            - "${auth_status} == ACTIVE - VendorAuthorization.status is a system field defaulting to ACTIVE even though its vendor is still PENDING"
            - "${plan_status} == DRAFT with CategoryPlan.${plan_id}.reforecast_round == 0, receipt_budget_cents == null, otb_posture == OPEN, variance_status == ON_PLAN, sales_variance_bps == 0, open_ratio_bps == 10000, submitted_by_user_id == null, approved_by_user_id == null and version == 1"
            - "${month_status} == DRAFT and ${month_basis} == PLANNED_BASIS with PlanMonth.${m1_id}.provisional_sell_through_bps == 0, reserve_rate_bps == 0, markdown_reserve_cents == 0, otb_planned_cents == 0, otb_committed_cents == 0, otb_received_cents == 0 and otb_open_cents == 0"
            - "${op_status} == OPEN and ${op_assigned} == 0 with OptionPlan.${op_id}.option_slots_total == null, option_slots_open == null and target_units_per_option == null - slot capacity exists only after approval"
            - "${item_status} == PROPOSED and ${item_mult} == 10000 with AssortmentItem.${item_id}.sell_through_basis == null, sell_through_bps == null, planned_units == null and prior_season_sell_through_bps == 0 (the omitted optional input took its declared default)"
            - "${overlay_status} == DRAFT - an overlay never starts ACTIVE, so it applies no multiplier until a director activates it"
            - "no create call accepted a status field: §1.5 lists status in no endpoint's input, so all seven initial states are server-chosen"

      - name: vendor_suspend_reinstate_authorization_cycle
        claim_type: cyclic
        grounds:
          - state_machines.Vendor.transitions.AUTHORIZED_to_SUSPENDED
          - state_machines.Vendor.transitions.SUSPENDED_to_AUTHORIZED
          - entities.VendorAuthorization.fields.status
          - endpoints[POST /otb/vendors/{id}/status]
        distinguishing_aspect: "Vendor is the one cyclic machine with no terminal state: AUTHORIZED -> SUSPENDED -> AUTHORIZED can repeat without limit, and each traversal drives the VendorAuthorization cascade in the opposite direction, so after two full laps the two authorizations are ACTIVE again while Vendor.version has reached 6 and each authorization's version has reached 5 - the states loop, the versions do not."
        test_recipe:
          setup:
            - "one department with two categories and one vendor authorized for both"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_a: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Knits", code: "KNIT", role: "CONVENIENCE", sales_share_bps: 2000 }
              as: MerchOpsAdmin
              captures: { cat_b: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_a}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { auth_a: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_b}", max_open_units: 15000 }
              as: MerchOpsAdmin
              captures: { auth_b: $.data.id }
          trigger:
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "SUSPENDED" }
              as: MerchOpsAdmin
              captures: { suspended_status: $.data.status, v_after_suspend: $.data.version }
            - call: "GET /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", status: "REVOKED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
              captures: { reinstated_status: $.data.status }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "SUSPENDED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
              captures: { v_after_two_laps: $.data.version }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
              captures: { repeat_error: $.data.error_id }
          assert:
            - "${suspended_status} == SUSPENDED and ${v_after_suspend} == 3 (create 1, AUTHORIZED 2, SUSPENDED 3)"
            - "immediately after the suspension GET /otb/vendor-authorizations?vendor_id=${vendor_id}&status=REVOKED returns total_count == 2: both ${auth_a} and ${auth_b} were swept to REVOKED by the cascade, and a filter on status ACTIVE returns total_count == 0"
            - "${reinstated_status} == AUTHORIZED and VendorAuthorization.${auth_a}.status == ACTIVE and VendorAuthorization.${auth_b}.status == ACTIVE with max_open_units still 40000 and 15000 - reinstatement restores exactly the rows the suspension revoked, it does not recreate them"
            - "after the second lap ${v_after_two_laps} == 6 while Vendor.status is AUTHORIZED again, VendorAuthorization.${auth_a}.version == 5 and VendorAuthorization.${auth_b}.version == 5 (one bump per cascade direction, four cascades)"
            - "${repeat_error} == ERR_INVALID_STATE with HTTP 409: AUTHORIZED -> AUTHORIZED is not a declared transition, so the cycle only advances through SUSPENDED and Vendor.version stays 6"
            - "Vendor declares terminal_states [] - after four transitions the row is still fully live, which is what makes this machine cyclic rather than linear"

      - name: plan_close_cascade_closes_children_and_abandons_open_cycle
        claim_type: cascade_down
        grounds:
          - state_machines.CategoryPlan.transitions.APPROVED_to_CLOSED
          - state_machines.PlanMonth.transitions.IN_SEASON_to_CLOSED
          - state_machines.OptionPlan.transitions.SLOTTED_to_CLOSED
          - state_machines.ReforecastCycle.transitions.OPEN_to_ABANDONED
          - endpoints[POST /otb/category-plans/{id}/close]
        distinguishing_aspect: "One close call sweeps four child collections at once and each collapsed row proves its full precondition set: months in three different source states (IN_SEASON, LOCKED_PLAN and a DRAFT month added after approval) all land CLOSED, the SLOTTED option plan lands CLOSED, the OPEN reforecast cycle lands ABANDONED and its PROPOSED decision is rejected with approved_units 0 - while the IN_SEASON assortment item, which the cascade does not name, is left untouched."
        test_recipe:
          setup:
            - "an APPROVED spring plan with M1 IN_SEASON, M2 LOCKED_PLAN and a third month added after approval (still DRAFT)"
            - "one SLOTTED option plan, one adopted-and-activated NEW item, and an OPEN director-requested reforecast cycle holding one PROPOSED chase decision"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 2, fiscal_month_label: "2027-04", first_receipt_date: "2027-04-02T00:00:00Z", bom_inventory_cents: 22000000, planned_sales_cents: 36000000, planned_markdown_cents: 3000000, planned_eom_cents: 24000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m2_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "spring build" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "signed off" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/plan-months/${m1_id}/open-season"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 3, fiscal_month_label: "2027-05", first_receipt_date: "2027-05-07T00:00:00Z", bom_inventory_cents: 24000000, planned_sales_cents: 20000000, planned_markdown_cents: 1000000, planned_eom_cents: 20000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m3_id: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op_id}", vendor_id: "${vendor_id}", sku_code: "DR-1001", color_code: "BLK", lifecycle_stage: "NEW", unit_cost_cents: 2600, retail_price_cents: 7900 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_id: $.data.id }
            - call: "POST /otb/assortment-items/${item_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_id}/activate"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "GET /otb/category-plans/${plan_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_v: $.data.version }
            - call: "POST /otb/category-plans/${plan_id}/reforecasts"
              payload: { reason_note: "wholesale re-read of the spring buy", expected_category_plan_version: "${plan_v}" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /otb/chase-cancel-decisions"
              payload: { reforecast_cycle_id: "${cycle_id}", assortment_item_id: "${item_id}", action: "CHASE", requested_units: 500, rationale: "sell-through running ahead of plan" }
              as: MerchandisePlanner
              as_user_id: "planner-2"
              captures: { decision_id: $.data.id }
          trigger:
            - call: "POST /otb/category-plans/${plan_id}/close"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { closed_status: $.data.status }
          assert:
            - "${closed_status} == CLOSED and CategoryPlan.${plan_id} is now in its only terminal state; the close was accepted from REFORECAST_OPEN under the collapsed APPROVED | REFORECAST_OPEN -> CLOSED row"
            - "PlanMonth.${m1_id}.status == CLOSED (from IN_SEASON), PlanMonth.${m2_id}.status == CLOSED (from LOCKED_PLAN) and PlanMonth.${m3_id}.status == CLOSED (from DRAFT) - all three declared source states are swept by one call"
            - "PlanMonth.${m1_id}.otb_planned_cents is still 18200000 and PlanMonth.${m2_id}.otb_planned_cents is still 21970000: closing a month freezes its ledger, it does not zero it (only the reject path resets OTB fields)"
            - "OptionPlan.${op_id}.status == CLOSED with option_slots_total still 14, option_slots_assigned still 1 and option_slots_open still 13 - the slot counters are frozen, not released"
            - "ReforecastCycle.${cycle_id}.status == ABANDONED and ChaseCancelDecision.${decision_id}.status == REJECTED with approved_units == 0"
            - "GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count == 0: the abandoned chase decision never ran calculations.chase_cancel_allocation, so no commitment was created and no month OTB moved"
            - "AssortmentItem.${item_id}.status is still IN_SEASON with planned_units == 276 and sell_through_bps == 6325: the close cascade names PlanMonth, OptionPlan and ReforecastCycle only, so items are deliberately untouched"
            - "CategoryPlan.${plan_id}.receipt_budget_cents is still 60000000 and reforecast_round is still 1 - closing does not unwind governance history"

      - name: closed_plan_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CategoryPlan.terminal_states
          - state_machines.PlanMonth.terminal_states
