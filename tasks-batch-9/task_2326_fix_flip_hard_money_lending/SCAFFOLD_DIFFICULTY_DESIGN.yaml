            - "DrawLineItem for (${d_photo}, ${l_elec}).effective_percent_complete == 0.50 (claimed 0.70 capped by PHOTO_MAX_PCT)"
            - "DrawRequest.${d_insp}.approved_release_cents == 575000"
            - "DrawLineItem for (${d_insp}, ${l_elec}).effective_percent_complete == 0.70 (uncapped on the INSPECTION leg)"
            - "RehabLineItem.${l_elec}.released_cents == 1000000 immediately before the trigger"
            - "Loan.${loan1}.reserved_release_cents == 575000 and Loan.${loan1}.undisbursed_holdback_cents == 3425000 after the trigger"
            - "Loan.${loan1}.commitment_balance_check_cents == 0"

