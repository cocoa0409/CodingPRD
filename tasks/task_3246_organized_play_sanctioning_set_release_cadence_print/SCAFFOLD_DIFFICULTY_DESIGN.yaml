            - call: "POST /op/event-applications/${app_five}/code-redemption"
              payload: { redemption_code: "CHM5-4", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_five}/code-redemption"
              payload: { redemption_code: "CHM5-5", code_kind: "DIGITAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /op/event-applications/${app_four}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_four: $.data.prize_allocation_id }
            - call: "POST /op/event-applications/${app_five}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_five: $.data.prize_allocation_id }
          assert:
            - "PrizeAllocation.${alloc_four}.base_tp == 96"
            - "PrizeAllocation.${alloc_five}.base_tp == 108"
            - "PrizeAllocation.${alloc_five}.base_tp - PrizeAllocation.${alloc_four}.base_tp == 12"
            - "the AVAILABLE invitation code on each application does not enter member_count, so ${alloc_four} sizes on exactly four members"
            - "PrizeAllocation.${alloc_four}.remaining_tp == PrizeAllocation.${alloc_four}.base_tp"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: parallel dimensions on two entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: event_application_parallel_status_and_prizing_dimensions_revert
        grounds:
          - state_machines.EventApplication.status.SUBMITTED_to_APPROVED
          - state_machines.EventApplication.prizing_report_status.NOT_DUE_to_DUE
          - state_machines.EventApplication.prizing_report_status.DUE_to_NOT_DUE
        distinguishing_aspect: "EventApplication.reporting_state and EventApplication.prizing_report_status are two independent axes on one row: the prizing axis loops NOT_DUE -> DUE -> NOT_DUE twice via OPTION_IN / OPTION_OUT while the reporting axis stays APPROVED and never moves."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one set release, one FIXED format; one LOCAL application approved with pool_mode=BUNDLED."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 1, event_space_capacity: 2 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
          trigger:
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "OPTION_IN" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "OPTION_OUT" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "OPTION_IN" }
              as: OpsAdmin
          assert:
            - "after OPTION_IN the application's prizing_report_status == DUE"
            - "after the first OPTION_OUT the application's prizing_report_status == NOT_DUE"
            - "after the second OPTION_IN the application's prizing_report_status == DUE again, so the prizing axis has cycled twice"
            - "EventApplication.${app_id}.status == APPROVED throughout; the reporting axis never moved"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 16 and no allocation counter changed"

      - name: code_redemption_parallel_lifecycle_and_grant_dimensions
        grounds:
          - state_machines.CodeRedemption.status.AVAILABLE_to_REDEEMED
          - state_machines.CodeRedemption.physical_grant_status.RESERVED_to_DISBURSED
        distinguishing_aspect: "CodeRedemption.status and CodeRedemption.physical_grant_status are independent axes: a PHYSICAL card is REDEEMED while its grant is still RESERVED, and the later DISBURSE moves the grant axis alone while the lifecycle axis stays REDEEMED."
        test_recipe:
          setup:
            - "Logical clock at the street date, then advanced past street_date + 7 days so the LOCAL application can be COMPLETED."
            - "One store, one set release, one FIXED format; one LOCAL application approved, its allocation raised to base_tp 166, and one PHYSICAL code card bound to it."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 1, event_space_capacity: 2 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-allocations/${alloc_id}/transition"
              payload: { action: "INCREASE_REPRINT_RUN", additional_tp: 150 }
              as: OpsAdmin
            - call: "POST /op/code-redemptions"
              payload: { redemption_code: "PHY-9", code_kind: "PHYSICAL", event_application_id: "${app_id}" }
              as: OpsAdmin
              captures: { red_id: $.data.id }
          trigger:
            - call: "POST /op/event-applications/${app_id}/code-redemption"
              payload: { redemption_code: "PHY-9", code_kind: "PHYSICAL", action: "REDEEM" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { redeemed_seq: $.data.redemption_seq }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-26T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "COMPLETE" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/code-redemptions/${red_id}/transition"
              payload: { action: "DISBURSE" }
              as: OpsAdmin
          assert:
            - "after the redemption CodeRedemption.${red_id}.status == REDEEMED while CodeRedemption.${red_id}.physical_grant_status == RESERVED, so the two axes disagree"
            - "CodeRedemption.${red_id}.redemption_seq == 1"
            - "after DISBURSE CodeRedemption.${red_id}.physical_grant_status == DISBURSED and CodeRedemption.${red_id}.status is still REDEEMED"
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 40 and PrizeAllocation.${alloc_id}.total_restored_tp == 40"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 166"
  # ===========================================================================
  # Rule 4 — transitive_cascade: depth 4 and depth 3, different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: store_suspension_four_hop_cascade
        grounds:
          - state_machines.Store.status.ACTIVE_to_SUSPENDED
          - state_machines.PrizeAllocation.status.OPEN_to_RELEASED
          - state_machines.PrizeDistribution.status.PASSED_to_VOIDED
          - calculations.prize_pool_remaining
        distinguishing_aspect: "One Store transition of depth 4: SUSPEND re-derives Store.reporting_violation_points and app-derived counters, which denies the store's EventApplications, which releases their OPEN PrizeAllocations, which voids the PASSED PrizeDistributions, whose quantities flow back into total_restored_tp — each hop caused by the previous hop."
        test_recipe:
          setup:
            - "Logical clock at the street date so the set release is RELEASED; one store, one FIXED format, one LOCAL application approved with a BUNDLED pool of base_tp 16."
            - "One prize distribution of 10 points on that allocation, PASSED, so total_drawn_tp is 10 and remaining_tp is 6."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-77", quantity: 10 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/stores/${store_id}/transition"
              payload: { action: "SUSPEND", reason: "Report-handling audit failure" }
              as: OpsAdmin
          assert:
            - "Store.${store_id}.status == SUSPENDED"
            - "EventApplication.${app_id}.status == DENIED"
            - "PrizeAllocation.${alloc_id}.status == RELEASED"
            - "PrizeDistribution.${dist_id}.status == VOIDED"
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 10 and PrizeAllocation.${alloc_id}.total_restored_tp == 10"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 16 so ALLOC_INVARIANT returned to its pre-draw figure"
            - "Store.${store_id}.tp_balance == 16"

      - name: ban_list_denial_three_hop_cascade
        grounds:
          - state_machines.Format.current_epoch.EPOCH_N_to_EPOCH_N
          - state_machines.EventApplication.status.APPROVED_to_DENIED
          - state_machines.PrizeAllocation.status.OPEN_to_CLOSED
        distinguishing_aspect: "A different triggering transition of depth 3: BAN_CARD on a Format denies the APPROVED EventApplications citing it, which closes their OPEN PrizeAllocations, which voids the PASSED PrizeDistributions under them and re-derives the draw-down counters."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format with format_code STD, one QUALIFIER application approved with a BUNDLED pool of base_tp 48."
            - "One prize distribution of 30 points on that allocation, PASSED, so total_drawn_tp is 30 and remaining_tp is 18."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-31", quantity: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/formats/${format_id}/transition"
              payload: { action: "BAN_CARD", card_ref: "TST-118", list_kind: "BANNED" }
              as: OpsAdmin
          assert:
            - "Format.${format_id}.banned_card_refs contains \"TST-118\""
            - "EventApplication.${app_id}.status == DENIED"
            - "PrizeAllocation.${alloc_id}.status == CLOSED"
            - "PrizeDistribution.${dist_id}.status == VOIDED"
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 30 and PrizeAllocation.${alloc_id}.total_restored_tp == 30"
            - "PrizeAllocation.${alloc_id}.remaining_tp == 48"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: released_allocation_outranks_insufficient_pool
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_POOL]
        distinguishing_aspect: "The state category (priority 5) and the business_fiscal category (priority 13) are both violated by one PASS request, and the state error ERR_INVALID_STATE wins because its priority is lower."
        test_recipe:
          setup:
            - "Logical clock at the street date; one store, one FIXED format, one LOCAL application approved with a BUNDLED pool of base_tp 16."
            - "One PROPOSED prize distribution of 99 points on that allocation — larger than remaining_tp 16, so the fiscal check would also fail."
            - "The store is then suspended, which releases the allocation to RELEASED."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "LOCAL", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 12 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/prize-distributions"
              payload: { prize_allocation_id: "${alloc_id}", recipient_ref: "PLAYER-99", quantity: 99 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /op/stores/${store_id}/transition"
              payload: { action: "SUSPEND", reason: "Report-handling audit failure" }
              as: OpsAdmin
          trigger:
            - call: "POST /op/prize-distributions/${dist_id}/transition"
              payload: { action: "PASS" }
              as: OpsAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "the response status is 409 and ${eid} == \"ERR_INVALID_STATE\""
            - "the response is NOT 402 and ${eid} != \"ERR_INSUFFICIENT_POOL\", so the state priority beats the fiscal priority"
            - "PrizeAllocation.${alloc_id}.total_drawn_tp == 0 and PrizeDistribution.${dist_id}.status == PROPOSED"

      - name: unknown_allocation_outranks_already_filed_report
        grounds:
          - validations[priority=4]
          - validations[priority=20]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PRIZE_REPORT_ALREADY_FILED]
        distinguishing_aspect: "The existence category (priority 3) and the business_constraint category (priority 19) are both violated by one report-filing request, and ERR_NOT_FOUND wins — a different error-category pair from the state-vs-fiscal instance."
        test_recipe:
          setup:
            - "Logical clock at the street date, then advanced past street_date + 7 days; one store, one FIXED format, one QUALIFIER application approved, COMPLETED, and already reported once."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
              payload: { name: "Standard", format_code: "STD", rotation_policy: "FIXED" }
              as: OpsAdmin
              captures: { format_id: $.data.id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications"
              payload: { store_id: "${store_id}", set_release_id: "${set_id}", format_id: "${format_id}", format_code: "STD", tier: "QUALIFIER", scheduled_date: "2026-09-26T18:00:00Z", expected_headcount: 30 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { app_id: $.data.id }
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "APPROVE", expected_store_version: "${store_v}", pool_mode: "BUNDLED", pool_variant: "BUNDLED" }
              as: OpsAdmin
              captures: { alloc_id: $.data.prize_allocation_id }
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-26T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/event-applications/${app_id}/transition"
              payload: { action: "COMPLETE" }
              as: StoreOrganizer
              as_user_id: "${store_id}"
            - call: "POST /op/event-applications/${app_id}/prize-reports"
              payload: { prize_allocation_id: "${alloc_id}", unclaimed_tp: 6, reported_headcount: 31 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /op/event-applications/${app_id}/prize-reports"
              payload: { prize_allocation_id: "00000000-0000-4000-8000-000000000000", unclaimed_tp: 6, reported_headcount: 31 }
              as: StoreOrganizer
              as_user_id: "${store_id}"
              captures: { eid2: $.data.error_id }
          assert:
            - "the response status is 404 and ${eid2} == \"ERR_NOT_FOUND\""
            - "the response is NOT 409 and ${eid2} != \"ERR_PRIZE_REPORT_ALREADY_FILED\", so the existence priority beats the business constraint"
            - "PrizeReport.${report_id}.unclaimed_tp == 6 and PrizeAllocation.${alloc_id}.total_restored_tp == 6"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: different metrics and endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: headcount_threshold_inclusive_at_exactly_twenty_four
        grounds:
          - calculations.qualified_headcount_gate
          - errors[ERR_HEADCOUNT_BELOW_THRESHOLD]
        distinguishing_aspect: "A numeric threshold crossing on the qualified_headcount metric via GET /op/event-applications/{id}/prizing-summary: reading 24 clears the gate and reading 23 fails it, so the comparison is pinned as >= not >."
        test_recipe:
          setup:
            - "Logical clock at the street date, then advanced past street_date + 7 days; one store, one FIXED format, two QUALIFIER applications on different calendar days."
            - "Application A is COMPLETED and reported with reported_headcount exactly 24; application B is COMPLETED and reported with reported_headcount exactly 23."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /op/stores"
              payload: { name: "Austin Card House", region_code: "US-SOUTH", daily_event_capacity: 8, event_space_capacity: 8 }
              as: OpsAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /op/set-releases"
              payload: { set_code: "TST", prerelease_start_date: "2026-09-11T00:00:00Z", prerelease_end_date: "2026-09-13T23:59:59Z", street_date: "2026-09-18T00:00:00Z" }
              as: OpsAdmin
              captures: { set_id: $.data.id }
            - call: "POST /op/formats"
