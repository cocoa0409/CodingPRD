# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index) — task_3293
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Instances already exercised by a §1.8 instance are emitted as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_region_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Region.fields.country_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /v1/regions without country_code -> 400 ERR_INVALID_REQUEST; no region persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/regions"
              payload: { name: "NoCountry", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: contributor_duplicate_email_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Contributor.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Second POST /v1/contributors reusing an existing email violates the uniqueness constraint -> 400."
        test_recipe:
          setup:
            - "Region R; contributor with email dup@x.com already registered"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "First", email: "dup@x.com", home_region_id: "${r_id}" }
              as: Anonymous
          trigger:
            - call: "POST /v1/contributors"
              payload: { display_name: "Second", email: "dup@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: listing_prohibited_category_rejected_at_create
        claim_type: type_constraints
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_PROHIBITED_CATEGORY]"
        distinguishing_aspect: "POST /v1/business-listings with category ESCORT -> 422 ERR_PROHIBITED_CATEGORY (prohibited set screened at creation)."
        test_recipe:
          setup: ["Region R exists"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Bad Biz", category: "ESCORT", address_text: "1 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_PROHIBITED_CATEGORY"
            - "HTTP status == 422"
      - name: listing_geo_outside_region_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_GEO_OUT_OF_REGION]"
        distinguishing_aspect: "Listing geo point outside the region bounding box -> 422 ERR_GEO_OUT_OF_REGION (fake-address geofence screen)."
        test_recipe:
          setup: ["Region R with bbox lat [40,41], lng [-88,-87]"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Far Away", category: "RETAIL", address_text: "1 Main St", geo_lat: 50.0, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_GEO_OUT_OF_REGION"
            - "HTTP status == 422"
      - name: get_nonexistent_listing_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a random UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/business-listings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"
      - name: region_default_imagery_capacity_applied
        claim_type: defaults
        grounds:
          - "entities.Region.fields.max_active_imagery_tasks"
        distinguishing_aspect: "Omitting max_active_imagery_tasks at region create -> default 5 applied."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/regions"
              payload: { name: "DefCap", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_cap: $.data.max_active_imagery_tasks }
          assert:
            - "Region.max_active_imagery_tasks == 5"
      - name: contributor_grant_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.ContributorGrant"
        distinguishing_aspect: "ContributorGrant (common_fields false) has no PATCH/PUT endpoint and carries no version field; its lifecycle is POST + revoke only."
        test_recipe:
          setup: ["Region R; contributor C; one ADJUSTMENT grant G"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C", email: "imm@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /v1/contributor-grants"
              payload: { contributor_id: "${c_id}", source_type: "ADJUSTMENT", source_id: "imm-1", base_points: 7, note: "immutability probe" }
              as: PlatformAdmin
              captures: { g_has_version: $.data.version, g_id: $.data.id }
          assert:
            - "Response has no version field (captured value is absent/null)"
            - "GET /v1/contributors/${c_id}/grants lists the grant with status POSTED"
      - name: list_pagination_defaults_applied
        claim_type: listing
        grounds:
          - "response_envelope"
          - "entities.BusinessListing"
        distinguishing_aspect: "GET /v1/business-listings without limit/offset returns pagination fields with default limit 10, offset 0, plus total_count and has_more."
        test_recipe:
          setup: ["Region R with 3 listings"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "P1", category: "RETAIL", address_text: "1 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "P2", category: "RETAIL", address_text: "2 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "P3", category: "RETAIL", address_text: "3 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/business-listings"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "data array length == 3 and total_count == 3, has_more == false (default limit 10, offset 0)"

  - section: state_machines
    instances:
      - name: terminal_permanently_closed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.BusinessListing"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From PERMANENTLY_CLOSED, claim / require-reverify / suspend / new edit are all rejected with ERR_INVALID_STATE or ERR_LISTING_SUSPENDED."
        test_recipe:
          setup:
            - "Region R; listing L verified by owner C, suspended (IMPERSONATION), appeal decided UPHELD -> PERMANENTLY_CLOSED"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "Own", email: "own@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Closed Biz", category: "RETAIL", address_text: "1 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l_id}", method: "RECORDS" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { va_id: $.data.id, va_code: $.data.code }
            - call: "POST /v1/verification-attempts/${va_id}/submit-code"
              payload: { code: "${va_code}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/business-listings/${l_id}/suspend"
              payload: { violation_type: "IMPERSONATION", evidence_notes: "identity mismatch" }
              as: PolicyAnalyst
              as_user_id: "pa-1"
              captures: { sc_id: $.data.id }
            - call: "POST /v1/suspension-cases/${sc_id}/appeal"
              payload: { appeal_text: "This appeal statement is deliberately long enough to pass the fifty character minimum length requirement." }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/suspension-cases/${sc_id}/start-appeal-review"
              payload: {}
              as: PolicyAnalyst
              as_user_id: "pa-2"
            - call: "POST /v1/suspension-cases/${sc_id}/decide"
              payload: { decision: "UPHELD" }
              as: PolicyAnalyst
              as_user_id: "pa-2"
          trigger:
            - call: "POST /v1/business-listings/${l_id}/suspend"
              payload: { violation_type: "FAKE_REVIEWS", evidence_notes: "post-closure probe" }
              as: PolicyAnalyst
              as_user_id: "pa-3"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "BusinessListing.${l_id}.status == PERMANENTLY_CLOSED (unchanged)"
      - name: verification_attempt_expiry_via_sweep
        claim_type: valid_transition
        grounds:
          - "state_machines.VerificationAttempt.ISSUED_to_EXPIRED"
        distinguishing_aspect: "ISSUED attempt with expires_at <= now transitions to EXPIRED only when the sweep runs; before the sweep it remains ISSUED."
        test_recipe:
          setup:
            - "Region R; listing L claimed by C; attempt A issued at 2026-09-01 (expires 2026-09-15); clock advanced to 2026-09-16"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "Own", email: "own2@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Expiring Biz", category: "SERVICE", address_text: "2 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l_id}", method: "POSTCARD" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { va_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/verification-attempts/sweep-expired"
              payload: {}
              as: PlatformAdmin
              captures: { expired_n: $.data.expired_count }
          assert:
            - "expired_count == 1"
            - "VerificationAttempt.${va_id}.status == EXPIRED"
      - name: wrong_code_exhaustion_fails_attempt
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.VerificationAttempt.CODE_SUBMITTED_to_FAILED"
          - "errors[ERR_ATTEMPTS_EXHAUSTED]"
        distinguishing_aspect: "Three wrong codes consume max_attempts: attempt FAILED with failure_reason WRONG_CODE; a fourth submit is rejected ERR_INVALID_STATE (attempt terminal)."
        test_recipe:
          setup: ["Region R; listing L claimed by C; attempt A ISSUED"]
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "Own", email: "own3@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Retry Biz", category: "RETAIL", address_text: "3 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/verification-attempts"
              payload: { listing_id: "${l_id}", method: "PHONE" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { va_id: $.data.id, va_code: $.data.code }
          trigger:
            - call: "POST /v1/verification-attempts/${va_id}/submit-code"
              payload: { code: "000000" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/verification-attempts/${va_id}/submit-code"
              payload: { code: "111111" }
              as: BusinessOwner
              as_user_id: "${c_id}"
            - call: "POST /v1/verification-attempts/${va_id}/submit-code"
              payload: { code: "222222" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { final_status: $.data.status, final_reason: $.data.failure_reason }
            - call: "POST /v1/verification-attempts/${va_id}/submit-code"
              payload: { code: "${va_code}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "After 3rd wrong code: status == FAILED and failure_reason == WRONG_CODE (assuming minted code != 000000/111111/222222)"
            - "4th submit: error_id == ERR_INVALID_STATE (attempt terminal)"
      - name: ticket_resolve_by_non_claimer_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_NOT_TICKET_OWNER]"
        distinguishing_aspect: "A second moderator resolving a ticket claimed by mod-1 -> 403 ERR_NOT_TICKET_OWNER."
        test_recipe:
          setup:
            - "Region R; contributor C; listing L; QUEUED edit E (attribute, no evidence -> 55); ticket claimed by mod-1"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C", email: "t@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Ticket Biz", category: "RETAIL", address_text: "4 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l_id}", contributor_id: "${c_id}", edit_type: "ATTRIBUTE", payload: { attribute: "wifi", value: true }, expected_listing_version: "${l_v0}" }
              as: Contributor
              as_user_id: "${c_id}"
              captures: { e_id: $.data.id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "EDIT_REVIEW", map_edit_id: "${e_id}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /v1/review-tickets/${t_id}/resolve"
              payload: { resolution: "APPROVE" }
              as: Moderator
              as_user_id: "mod-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_TICKET_OWNER"
            - "HTTP status == 403"
            - "MapEdit.${e_id}.status == IN_REVIEW (unchanged)"
      - name: keyword_stuffing_suspend_requires_two_strikes
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_STRIKES_BELOW_THRESHOLD]"
        distinguishing_aspect: "Suspend with violation_type KEYWORD_STUFFING while keyword_stuffing_strikes == 0 -> 409 ERR_STRIKES_BELOW_THRESHOLD; after two stuffing violations (each rejected write records a strike) the suspend succeeds."
        test_recipe:
          setup:
            - "Region R; listing L claimed by C (CLAIM_PENDING)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "Own", email: "own4@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Stuffing Biz", category: "SERVICE", address_text: "5 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /v1/business-listings/${l_id}/suspend"
              payload: { violation_type: "KEYWORD_STUFFING", evidence_notes: "premature suspend attempt" }
              as: PolicyAnalyst
              as_user_id: "pa-1"
              captures: { err_early: $.data.error_id }
            - call: "PATCH /v1/business-listings/${l_id}"
              payload: { name: "BEST CHEAP Stuffing Biz" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { err_ks1: $.data.error_id }
            - call: "PATCH /v1/business-listings/${l_id}"
              payload: { name: "BEST CHEAP Stuffing Biz AGAIN TOP" }
              as: BusinessOwner
              as_user_id: "${c_id}"
              captures: { err_ks2: $.data.error_id }
            - call: "POST /v1/business-listings/${l_id}/suspend"
              payload: { violation_type: "KEYWORD_STUFFING", evidence_notes: "two strikes recorded" }
              as: PolicyAnalyst
              as_user_id: "pa-1"
              captures: { sc_id: $.data.id }
          assert:
            - "First suspend: error_id == ERR_STRIKES_BELOW_THRESHOLD (409)"
            - "Both PATCHes rejected with ERR_KEYWORD_STUFFING and each strike persisted"
            - "Second suspend succeeds: SuspensionCase created with status OPEN and violation_type KEYWORD_STUFFING"
            - "BusinessListing.${l_id}.status == SUSPENDED"
      - name: appeal_after_deadline_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_APPEAL_WINDOW_CLOSED]"
        distinguishing_aspect: "Appeal submitted with logical clock past created_at + 30d -> 409 ERR_APPEAL_WINDOW_CLOSED; appeal exactly at the deadline is admitted (<= boundary)."
        test_recipe:
          setup:
            - "Region R; listing L claimed by C then suspended at 2026-09-01 (appeal_deadline 2026-10-01); clock advanced to 2026-10-02"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "Own", email: "own5@x.com", home_region_id: "${r_id}" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r_id}", name: "Appeal Biz", category: "RETAIL", address_text: "6 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /v1/business-listings/${l_id}/claim"
              payload: { expected_listing_version: "${l_v0}" }
              as: BusinessOwner
              as_user_id: "${c_id}"
