              payload: {}
              as: MOVE_MANAGER
              captures: { e8: "$.data.error_id" }
          assert:
            - "before the trigger, PortalParty.${ppoa}.can_approve_dispositions == true and active_authority_ceiling_cents == 400000"
            - "after the first trigger call, AuthorityRecord.${auth}.status == SUSPENDED and PortalParty.${ppoa}.can_approve_dispositions == false"
            - "after the second trigger call, AuthorityRecord.${auth}.status == ACTIVE and suspend_count == 1 and PortalParty.${ppoa}.can_approve_dispositions == true"
            - "AuthorityRecord.${auth}.status == REVOKED"
            - "the fourth trigger call responds 409 and ${e8} == ERR_ALREADY_TERMINAL"
            - "PortalParty.${ppoa}.can_approve_dispositions == false"
            - "PortalParty.${ppoa}.active_authority_ceiling_cents == 0"

