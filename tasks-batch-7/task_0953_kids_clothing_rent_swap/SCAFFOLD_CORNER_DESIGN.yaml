              captures: { e5_u: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${e5_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { e5_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${e5_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${e5_cyc}" }
              as: WarehouseOperator
              captures: { e5_box: $.data.id }
            - call: "POST /kidswear/boxes/${e5_box}/allocate"
              payload: { unit_id: "${e5_u}" }
              as: WarehouseOperator
              captures: { e5_bi: $.data.id }
            - call: "POST /kidswear/boxes/${e5_box}/pack"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${e5_m}", direction: "OUTBOUND" }
              as: LogisticsCoordinator
              captures: { e5_lo: $.data.id }
            - call: "POST /kidswear/boxes/${e5_box}/ship"
              payload: { label_id: "${e5_lo}" }
              as: LogisticsCoordinator
              captures: { e5_so: $.data.id }
            - call: "POST /kidswear/shipments/${e5_so}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${e5_so}/receive"
              payload: {}
              as: WarehouseOperator
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${e5_m}", direction: "RETURN" }
              as: LogisticsCoordinator
              captures: { e5_lr: $.data.id }
            - call: "POST /kidswear/shipments"
              payload: { member_id: "${e5_m}", label_id: "${e5_lr}", direction: "RETURN", item_count: 1 }
              as: LogisticsCoordinator
              captures: { e5_sr: $.data.id }
            - call: "POST /kidswear/box-items/${e5_bi}/start-return"
              payload: { return_shipment_id: "${e5_sr}" }
              as: Member
              as_user_id: "${e5_m}"
            - call: "POST /kidswear/shipments/${e5_sr}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /kidswear/shipments/${e5_sr}/receive"
              payload: {}
