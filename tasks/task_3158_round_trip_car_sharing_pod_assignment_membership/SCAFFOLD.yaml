    roles: [Member, PodOperator, FleetAdmin]
    code: 200
    input: []
    output: CommunitySignal
    side_effects: []
  - method: GET
    path: "/car-share/community-signals"
    description: "Filtered list of community signals."
    roles: [Member, PodOperator, FleetAdmin]
    code: 200
