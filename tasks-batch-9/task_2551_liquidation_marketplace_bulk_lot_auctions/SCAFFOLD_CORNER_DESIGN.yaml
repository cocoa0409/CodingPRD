          - state_machines.BuyerAccount.PENDING_to_REJECTED
          - validations[priority 9 -> ERR_BUYER_QUALIFICATION_STATE_INVALID]
          - errors[ERR_BUYER_QUALIFICATION_STATE_INVALID]
