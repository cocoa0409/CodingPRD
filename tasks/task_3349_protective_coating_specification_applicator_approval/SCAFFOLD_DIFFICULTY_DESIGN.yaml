# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_3349_protective_coating_specification_applicator_approval
# §1.8 Test Targeting Index — regenerated against SCAFFOLD.yaml (§1.1–§1.7).
# Nine Difficulty Rules (SKILL.md §0.5), exactly 2 instances each (18 total).
# All endpoint paths carry the /coating prefix; all roles come from §1.7.
# ApplicatorRep is entity_backed:Applicator → as_user_id is the applicator id.
# Logical clock: every time-dependent instance begins with
# POST /coating/_clock/set_current_utc to 2026-09-01T00:00:00Z (the clock's
# pre-call default), and all later clock moves stay inside September 2026 so
# the quality_history_score monthly decay sweep never fires.
# =============================================================================

scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: voc_as_supplied_vs_as_applied_diverge
        grounds:
          - calculations.voc_compliance
          - entities.ProjectSpecification.fields.voc_at_issuance_gpl
          - entities.CoatingApplication.fields.applied_voc_gpl
          - entities.CoatingApplication.fields.voc_compliant
        distinguishing_aspect: |
          One and the same CoatingSystem yields voc_at_issuance_gpl == 340.0
          under the AS_SUPPLIED variant at spec issuance yet applied_voc_gpl
          == 316.0 under the AS_APPLIED variant when 10% of a 100 g/L thinner
          is mixed — two valid variants of voc_compliance return different
          values in the environmental-compliance entity domain (vs the
          InspectionReport quality domain of the sibling instance).
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-CA-SCAQMD/SPRAY_AIRLESS limit 340 g/L ACTIVE on [2026-01-01, 2027-01-01)."
            - "CoatingSystem SW-DUAL-100 ACTIVE: base_voc_gpl 340, thinner_voc_gpl 100, max_thinner_pct 0.10, SSPC_SP10_NEAR_WHITE."
            - "Applicator CERTIFIED under a program (min score 300, streak 0, no training/audit) bound to that system."
            - "Project (US-CA-SCAQMD, BRIDGE) holds an ISSUED specification whose voc_at_issuance_gpl was pinned by AS_SUPPLIED."
            - "WorkOrder PREP_APPROVED with the prep hold point released (PASSED prep inspection)."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-DUAL-100", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 340, thinner_voc_gpl: 100, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-DUAL-100", coating_system_id: "${sys_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog_id: "$.data.id" }
            - call: "POST /coating/applicators"
              payload: { company_name: "Acme Coatings", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id", app_v: "$.data.version" }
            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "${prog_id}" }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures: { qual_id: "$.data.id" }
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/certify"
              payload: { expected_applicator_version: "${app_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/projects"
              payload: { project_name: "Harbor Tank Farm", owner_name: "Port Authority", jurisdiction_code: "US-CA-SCAQMD", asset_type: BRIDGE, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sys_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { spec_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
            - call: "POST /coating/projects/${proj_id}/work-orders"
              payload: { specification_id: "${spec_id}", applicator_id: "${app_id}", asset_zone: "DECK-NORTH", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/work-orders/${wo_id}/begin-prep-inspection"
              as: ApplicatorRep
              as_user_id: "${app_id}"
            - call: "POST /coating/work-orders/${wo_id}/prep-inspections"
              payload: { observed_prep_standard: SSPC_SP10_NEAR_WHITE, measured_profile_mils: 3.0, soluble_salt_ug_cm2: 5.0, ambient_dew_point_spread_c: 5.0 }
              as: Inspector
              as_user_id: "inspector-000001"
          trigger:
            - call: "POST /coating/work-orders/${wo_id}/applications"
              payload: { coat_number: 1, applied_at: "2026-09-10T09:00:00Z", thinner_pct_used: 0.10 }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures: { ca_id: "$.data.id" }
          assert:
            - "ProjectSpecification.${spec_id}.voc_at_issuance_gpl == 340.0 (AS_SUPPLIED ignores thinner entirely)"
            - "CoatingApplication.${ca_id}.applied_voc_gpl == 316.0 (AS_APPLIED volume-weighted mix: 340 * 0.9 + 100 * 0.1)"
            - "CoatingApplication.${ca_id}.voc_compliant == true (316.0 <= 340)"
            - "CoatingApplication.${ca_id}.applied_voc_gpl != ProjectSpecification.${spec_id}.voc_at_issuance_gpl (the two variants diverge on the same system)"
      - name: dft_spot_average_vs_gage_80_20_diverge
        grounds:
          - calculations.dft_acceptance
          - entities.InspectionReport.fields.dft_verdict
          - entities.InspectionReport.fields.overall_verdict
          - entities.CoatingSystem.fields.surface_prep_standard
        distinguishing_aspect: |
          Identical readings [5.0, 15.0, 15.0, 15.0, 15.0] on a [8.0, 16.0]
          mil spec FAIL the SPOT_AVERAGE variant (average 13.0 in range but
          the 80% single-spot floor 6.4 rejects the 5.0 spot) yet PASS the
          GAGE_80_20 variant on an SSPC_SP11_POWER_TOOL system (4 of 5 spots
          individually in range >= ceil(0.8 * 5) == 4) — two variants of
          dft_acceptance diverge on the InspectionReport quality-inspection
          domain, a different entity domain from voc_compliance.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 g/L ACTIVE on [2026-01-01, 2027-01-01)."
            - "Two ACTIVE CoatingSystems: SW-DFT-SP10 (SSPC_SP10_NEAR_WHITE) and SW-DFT-SP11 (SSPC_SP11_POWER_TOOL), both with total_dft range [8.0, 16.0] mils."
            - "Two applicators, each CERTIFIED under a per-system program (min score 300, streak 0, no training/audit)."
            - "Two BRIDGE projects in US-FED, each with an ISSUED spec naming its system, each with a work order PREP_APPROVED, one coat applied 2026-09-06T09:00:00Z and CURED."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-DFT-SP10", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 300, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sys10_id: "$.data.id" }
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-DFT-SP11", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP11_POWER_TOOL, min_surface_profile_mils: 1.0, max_surface_profile_mils: 2.5, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 300, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sys11_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-DFT-SP10", coating_system_id: "${sys10_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog10_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-DFT-SP11", coating_system_id: "${sys11_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog11_id: "$.data.id" }
            - call: "POST /coating/applicators"
              payload: { company_name: "Bridge Crew A", contact_email: "crew-a@x.example" }
              as: PlatformAdmin
              captures: { app1_id: "$.data.id", app1_v: "$.data.version" }
            - call: "POST /coating/applicators/${app1_id}/qualifications"
              payload: { program_id: "${prog10_id}" }
              as: ApplicatorRep
              as_user_id: "${app1_id}"
              captures: { qual1_id: "$.data.id" }
            - call: "POST /coating/applicators/${app1_id}/qualifications/${qual1_id}/certify"
              payload: { expected_applicator_version: "${app1_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators"
              payload: { company_name: "Mezzanine Crew B", contact_email: "crew-b@x.example" }
              as: PlatformAdmin
              captures: { app2_id: "$.data.id", app2_v: "$.data.version" }
            - call: "POST /coating/applicators/${app2_id}/qualifications"
              payload: { program_id: "${prog11_id}" }
              as: ApplicatorRep
              as_user_id: "${app2_id}"
              captures: { qual2_id: "$.data.id" }
            - call: "POST /coating/applicators/${app2_id}/qualifications/${qual2_id}/certify"
              payload: { expected_applicator_version: "${app2_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/projects"
              payload: { project_name: "Truss Rehab", owner_name: "State DOT", jurisdiction_code: "US-FED", asset_type: BRIDGE, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /coating/projects/${p1_id}/specifications"
              payload: { coating_system_id: "${sys10_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { s1_id: "$.data.id" }
            - call: "POST /coating/projects/${p1_id}/specifications/${s1_id}/issue"
              payload: { expected_project_version: "${p1_v}" }
              as: ProjectEngineer
            - call: "POST /coating/projects"
              payload: { project_name: "Tank Yard Mezzanine", owner_name: "State DOT", jurisdiction_code: "US-FED", asset_type: BRIDGE, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { p2_id: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /coating/projects/${p2_id}/specifications"
              payload: { coating_system_id: "${sys11_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { s2_id: "$.data.id" }
            - call: "POST /coating/projects/${p2_id}/specifications/${s2_id}/issue"
              payload: { expected_project_version: "${p2_v}" }
              as: ProjectEngineer
            - call: "POST /coating/projects/${p1_id}/work-orders"
              payload: { specification_id: "${s1_id}", applicator_id: "${app1_id}", asset_zone: "GIRDER-A", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo1_id: "$.data.id" }
            - call: "POST /coating/projects/${p1_id}/work-orders/${wo1_id}/begin-prep-inspection"
              as: ApplicatorRep
              as_user_id: "${app1_id}"
            - call: "POST /coating/work-orders/${wo1_id}/prep-inspections"
              payload: { observed_prep_standard: SSPC_SP10_NEAR_WHITE, measured_profile_mils: 3.0, soluble_salt_ug_cm2: 5.0, ambient_dew_point_spread_c: 5.0 }
              as: Inspector
              as_user_id: "inspector-000002"
            - call: "POST /coating/projects/${p2_id}/work-orders"
              payload: { specification_id: "${s2_id}", applicator_id: "${app2_id}", asset_zone: "MEZZ-B", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo2_id: "$.data.id" }
            - call: "POST /coating/projects/${p2_id}/work-orders/${wo2_id}/begin-prep-inspection"
              as: ApplicatorRep
              as_user_id: "${app2_id}"
            - call: "POST /coating/work-orders/${wo2_id}/prep-inspections"
              payload: { observed_prep_standard: SSPC_SP11_POWER_TOOL, measured_profile_mils: 1.5, soluble_salt_ug_cm2: 5.0, ambient_dew_point_spread_c: 5.0 }
              as: Inspector
              as_user_id: "inspector-000003"
            - call: "POST /coating/work-orders/${wo1_id}/applications"
              payload: { coat_number: 1, applied_at: "2026-09-06T09:00:00Z", thinner_pct_used: 0.0 }
              as: ApplicatorRep
              as_user_id: "${app1_id}"
              captures: { ca1_id: "$.data.id" }
            - call: "POST /coating/work-orders/${wo2_id}/applications"
              payload: { coat_number: 1, applied_at: "2026-09-06T09:00:00Z", thinner_pct_used: 0.0 }
              as: ApplicatorRep
              as_user_id: "${app2_id}"
              captures: { ca2_id: "$.data.id" }
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/work-orders/${wo1_id}/applications/${ca1_id}/mark-cured"
              as: ApplicatorRep
              as_user_id: "${app1_id}"
            - call: "POST /coating/work-orders/${wo2_id}/applications/${ca2_id}/mark-cured"
              as: ApplicatorRep
              as_user_id: "${app2_id}"
          trigger:
            - call: "POST /coating/work-orders/${wo1_id}/applications/${ca1_id}/inspection-reports"
              payload:
                spot_dft_readings_mils: [5.0, 15.0, 15.0, 15.0, 15.0]
                adhesion_readings_psi: [600]
                holiday_count: 0
                tested_area_m2: 10.0
              as: Inspector
              as_user_id: "inspector-000002"
              captures: { ir1_id: "$.data.id" }
            - call: "POST /coating/work-orders/${wo2_id}/applications/${ca2_id}/inspection-reports"
              payload:
                spot_dft_readings_mils: [5.0, 15.0, 15.0, 15.0, 15.0]
                adhesion_readings_psi: [600]
                holiday_count: 0
                tested_area_m2: 10.0
              as: Inspector
              as_user_id: "inspector-000003"
              captures: { ir2_id: "$.data.id" }
          assert:
            - "InspectionReport.${ir1_id}.dft_verdict == FAIL (SPOT_AVERAGE: mean 13.0 in [8.0, 16.0] but min spot 5.0 < 0.8 * 8.0 == 6.4)"
            - "InspectionReport.${ir1_id}.overall_verdict == REJECTED"
            - "InspectionReport.${ir2_id}.dft_verdict == PASS (GAGE_80_20: 4 spots in [8.0, 16.0] >= ceil(0.8 * 5) == 4)"
            - "InspectionReport.${ir2_id}.overall_verdict == ACCEPTED"
            - "InspectionReport.${ir1_id}.dft_verdict != InspectionReport.${ir2_id}.dft_verdict for byte-identical spot_dft_readings_mils"

  # =========================================================================
  # Rule 2 — combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: surface_prep_verdict_strict_tank_branch
        grounds:
          - calculations.surface_prep_verdict
          - entities.SurfacePreparationInspection.fields.result
          - entities.SurfacePreparationInspection.fields.failure_reasons
          - entities.Project.fields.asset_type
        distinguishing_aspect: |
          Mode (a) combinatorial formula: surface_prep_verdict combines 4
          checks with a conditional branch on Project.asset_type — the same
          soluble_salt_ug_cm2 == 7.0 reading passes the STANDARD branch
          (limit 10.0) but fails the STRICT_TANK branch (limit 5.0) selected
          by asset_type == TANK_INTERIOR — a different mode from the
          rounding-order mode (b) exercised by the sibling instance.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 g/L ACTIVE on [2026-01-01, 2027-01-01)."
            - "CoatingSystem SW-PREP-TANK ACTIVE (SSPC_SP10_NEAR_WHITE, profile window [2.0, 4.0] mils)."
            - "Applicator CERTIFIED under a program (min score 300, streak 0, no training/audit); starting score 500."
            - "TANK_INTERIOR project in US-FED with an ISSUED spec and a WorkOrder in PREP_INSPECTION."
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: SPRAY_AIRLESS, voc_limit_gpl: 340, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-PREP-TANK", manufacturer_name: "Sherwin-Williams", surface_prep_standard: SSPC_SP10_NEAR_WHITE, min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 1, total_dft_min_mils: 8.0, total_dft_max_mils: 16.0, base_voc_gpl: 300, thinner_voc_gpl: 250, adhesion_min_psi: 500, max_thinner_pct: 0.10 }
              as: TechnicalServiceEngineer
              captures: { sys_id: "$.data.id" }
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-PREP-TANK", coating_system_id: "${sys_id}", min_quality_history_score: 300, min_consecutive_passed_inspections: 0, requires_training: false, requires_equipment_audit: false }
              as: TechnicalServiceEngineer
              captures: { prog_id: "$.data.id" }
            - call: "POST /coating/applicators"
              payload: { company_name: "Tank Liners Inc", contact_email: "ops@tankliners.example" }
              as: PlatformAdmin
              captures: { app_id: "$.data.id", app_v: "$.data.version" }
            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "${prog_id}" }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures: { qual_id: "$.data.id" }
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/certify"
              payload: { expected_applicator_version: "${app_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/projects"
              payload: { project_name: "Harbor Tank Lining", owner_name: "Port Authority", jurisdiction_code: "US-FED", asset_type: TANK_INTERIOR, warranty_budget_cents: 1000000 }
              as: ProjectEngineer
              captures: { proj_id: "$.data.id", proj_v: "$.data.version" }
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${sys_id}", application_method: SPRAY_AIRLESS }
              as: ProjectEngineer
              captures: { spec_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectEngineer
            - call: "POST /coating/projects/${proj_id}/work-orders"
              payload: { specification_id: "${spec_id}", applicator_id: "${app_id}", asset_zone: "TANK-FLOOR", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: ProjectEngineer
              captures: { wo_id: "$.data.id" }
            - call: "POST /coating/projects/${proj_id}/work-orders/${wo_id}/begin-prep-inspection"
              as: ApplicatorRep
              as_user_id: "${app_id}"
          trigger:
            - call: "POST /coating/work-orders/${wo_id}/prep-inspections"
              payload: { observed_prep_standard: SSPC_SP10_NEAR_WHITE, measured_profile_mils: 3.0, soluble_salt_ug_cm2: 7.0, ambient_dew_point_spread_c: 5.0 }
              as: Inspector
              as_user_id: "inspector-000004"
              captures: { pi_id: "$.data.id" }
            - call: "GET /coating/work-orders/${wo_id}"
              as: PlatformAdmin
            - call: "GET /coating/applicators/${app_id}"
              as: TechnicalServiceEngineer
          assert:
            - "SurfacePreparationInspection.${pi_id}.result == FAILED"
            - 'SurfacePreparationInspection.${pi_id}.failure_reasons == ["SALT_EXCEEDED"] (standard matches, profile 3.0 in [2.0, 4.0], dew spread 5.0 >= 3.0 — only the STRICT_TANK salt branch fires)'
            - "WorkOrder.${wo_id}.status == SCHEDULED (FAILED prep reverts PREP_INSPECTION to SCHEDULED)"
            - "Applicator.${app_id}.quality_history_score == 475 (500 - PREP_FAILURE_PENALTY 25)"
      - name: warranty_split_rounding_remainder_absorbs_cent
        grounds:
          - calculations.warranty_liability_split
          - entities.Warranty.fields.material_share_cents
          - entities.Warranty.fields.application_share_cents
          - entities.Warranty.fields.exposure_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula: for the odd exposure 100001,
          independently rounding both 50% shares half-up would yield
          50001 + 50001 == 100002 != exposure_cents; the pinned rounding
          order (round the manufacturer share half-up FIRST, then
          application_share_cents := exposure_cents - material_share_cents)
          yields 50001 + 50000 == 100001 — the order of nested rounding
          changes the cents, and the scaffold pins one order explicitly.
        test_recipe:
