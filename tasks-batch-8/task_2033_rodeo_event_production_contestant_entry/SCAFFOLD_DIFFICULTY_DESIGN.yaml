            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_u}", judge_1_score: 41, judge_2_score: 40, qualified_flag: true }, as: Judge, as_user_id: "${j2}", captures: { rr_u: $.data.id } }
