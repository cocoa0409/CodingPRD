  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_segment_rectangle_overlap_rows_crossed_with_letters
        grounds:
          - validations.priority_39
          - entities.SeatInventorySegment.fields.seat_letters
          - entities.SeatInventorySegment.fields.total_seats
          - errors.ERR_SEAT_SEGMENT_ROW_OVERLAP
        overlap_dimension: "two-dimensional seat rectangle: closed row interval [row_start, row_end] crossed with the seat_letters set"
        distinguishing_aspect: |
          Overlap is NOT a one-dimensional row-range test. Against an existing OPEN segment of
          rows 10..14 x {A,B,C}, a candidate of rows 12..16 x {C,D} overlaps on the 3 shared
          seats 12C, 13C and 14C and must be refused, while rows 12..16 x {D,E} shares the same
          rows and is perfectly legal. An implementation that compares only row intervals
          rejects both; one that compares only letter sets rejects neither.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; SEAT_STANDARD (category SEAT) is ACTIVE"
            - "flight AB900 (cabin_seat_total 180) carries one OPEN MID segment rows 10..14 letters A,B,C (total_seats 15)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true, disclosable_fee: true, product_state: "ACTIVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AB900", origin: "JFK", destination: "LAX", scheduled_departure_utc: "2026-09-15T14:00:00Z", cabin_seat_total: 180 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 10, row_end: 14, seat_letters: ["A", "B", "C"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_base_id: $.data.id }
          trigger:
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "AFT", row_start: 12, row_end: 16, seat_letters: ["C", "D"], base_price_cents: 1800 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
            - call: "POST /seat-segments"
