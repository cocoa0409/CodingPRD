              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2022, measurement_window_start: "2022-01-01T00:00:00Z", measurement_window_end: "2022-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
              as_user_id: "act-001"
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2023, measurement_window_start: "2023-01-01T00:00:00Z", measurement_window_end: "2023-10-01T00:00:00Z", uvb_total_cents: 10000000000, uvb_pool_cents: 1000000000, all_employer_contributions_cents: 2000000000, all_employer_cbu: 2000000, interest_rate_bps: 700, certify_on_create: true }
              as: PlanActuary
