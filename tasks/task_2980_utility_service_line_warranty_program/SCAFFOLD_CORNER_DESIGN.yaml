            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version, count_at_create: $.data.enrolled_premises_count }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_one: $.data.id, premises_one_v1: $.data.version }
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "22 Birch Lane", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_two: $.data.id, premises_two_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_one}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_one_v1}", prepaid_amount_cents: 29988 }
