              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /osup/permits/${p_id}/guide-authorizations"
              payload: { guide_id: "${gc_id}" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oc_id}", use_area_id: "${ua_id}", application_type: "RENEWAL", season_year: 2027, requested_service_days: 100, proposed_activity_type: "RIVER_FLOAT", predecessor_permit_id: "${p_id}" }
