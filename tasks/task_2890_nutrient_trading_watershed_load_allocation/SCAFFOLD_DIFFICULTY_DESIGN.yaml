  - rule_id: boundary_precision_check
    instances:
      - name: allocable_load_exactly_zero_accepted_but_one_cent_negative_rejected
        grounds:
          - calculations.wasteload_allocation_run
          - validations[priority=27]
          - errors[ERR_ALLOCABLE_LOAD_NEGATIVE]
          - entities.AllocationRun.fields.allocable_load_lbs_yr
        distinguishing_aspect: |
          The boundary is a single cent on a derived quantity, not on an input: with loading
          capacity 1000.00 and margin_of_safety_pct 0.1000 the margin is 100.00, so a
          background of 900.00 makes allocable_load_lbs_yr exactly 0.00 and the run is
          ACCEPTED with every allocation 0.00, while a background of 900.01 makes it -0.01 and
          the run is REJECTED with ERR_ALLOCABLE_LOAD_NEGATIVE; treating 0.00 as an error, or
          clamping -0.01 to 0.00, fails one side or the other.
        test_recipe:
          setup:
            - "Watershed BND (OH, TOTAL_PHOSPHORUS, baseline 5000.00, eligible zones Z1/Z2) with reaches B_OUT (Z2, COMPLIANCE_POINT, df 1.0000, outlet) and B_MID (Z2, MAINSTEM, df 0.9000 -> B_OUT)."
            - "TmdlAssessment TMDL-ZERO in DRAFT: loading capacity 1000.00, margin_of_safety_pct 0.1000, background estimate 900.00, so the PROVISIONAL variant yields allocable exactly 0.00."
            - "TmdlAssessment TMDL-NEG in DRAFT: identical except background estimate 900.01, one cent past the boundary."
            - "Each assessment carries one INVENTORIED POINT source (5000.00 lbs) and one INVENTORIED NONPOINT source (3000.00 lbs) on B_MID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Boundary Creek", state_code: "OH", watershed_code: "BND", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 5000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_bnd_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_bnd_id}", reach_code: "B_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { b_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_bnd_id}", reach_code: "B_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${b_out_id}" }
              as: TmdlAnalyst
              captures: { b_mid_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_bnd_id}", assessment_code: "TMDL-ZERO", loading_capacity_lbs_yr: 1000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 900.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_zero_id: $.data.id, t_zero_ver: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_zero_id}", reach_id: "${b_mid_id}", source_name: "Zero Point", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_zero_p_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_zero_id}", reach_id: "${b_mid_id}", source_name: "Zero Nonpoint", source_type: "NONPOINT", existing_load_lbs_yr: 3000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_zero_n_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_bnd_id}", assessment_code: "TMDL-NEG", loading_capacity_lbs_yr: 1000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 900.01, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_neg_id: $.data.id, t_neg_ver: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_neg_id}", reach_id: "${b_mid_id}", source_name: "Neg Point", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_neg_p_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_neg_id}", reach_id: "${b_mid_id}", source_name: "Neg Nonpoint", source_type: "NONPOINT", existing_load_lbs_yr: 3000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
          trigger:
            - call: "POST /tmdl-assessments/${t_zero_id}/allocation-runs"
              payload: { run_label: "RUN-ZERO", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_zero_ver}" }
              as: TmdlAnalyst
              captures: { run_zero_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_neg_id}/allocation-runs"
              payload: { run_label: "RUN-NEG", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_neg_ver}" }
              as: TmdlAnalyst
          assert:
            - "trigger call 1 responds 201"
            - "AllocationRun.${run_zero_id}.margin_of_safety_lbs_yr == 100.00"
            - "AllocationRun.${run_zero_id}.effective_background_lbs_yr == 900.00"
            - "AllocationRun.${run_zero_id}.allocable_load_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.point_pool_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.nonpoint_pool_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.wla_total_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.la_total_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.reserve_allocation_lbs_yr == 0.00"
            - "AllocationRun.${run_zero_id}.included_source_count == 2"
            - "SourceAssessment.${sa_zero_p_id}.allocated_load_lbs_yr == 0.00"
            - "SourceAssessment.${sa_zero_n_id}.allocated_load_lbs_yr == 0.00"
            - "Watershed.${w_bnd_id}.reserve_pool_lbs == 0.00"
            - "trigger call 2 responds 422 with data.error_id == ERR_ALLOCABLE_LOAD_NEGATIVE"
            - "after trigger call 2, SourceAssessment.${sa_neg_p_id}.allocated_load_lbs_yr is null and SourceAssessment.${sa_neg_p_id}.allocation_run_id is null"
            - "after trigger call 2, GET /allocation-runs?tmdl_assessment_id=${t_neg_id} returns meta.total_count == 0"

      - name: adaptive_review_empty_qualifying_set_yields_indeterminate_not_off_track
        grounds:
          - calculations.watershed_response_evaluation
          - entities.AdaptiveReview.fields.verdict
          - entities.AdaptiveReview.fields.sample_count
          - entities.AdaptiveReview.fields.observed_load_lbs_yr
          - entities.MonitoringSample.fields.qa_status
          - state_machines.Watershed.ACTIVE_to_ADAPTIVE_HOLD
        distinguishing_aspect: |
          A different boundary class from the allocable-load cent: here the boundary is
          CARDINALITY plus a millisecond timestamp edge. Three samples exist but each is
          disqualified by exactly one filter (wrong reach_class, qa_status PROVISIONAL, and a
          sample_datetime of 2027-01-01T00:00:00.000Z that lies one millisecond past the
          window's inclusive end of 2026-12-31T23:59:59.999Z), so sample_count is 0,
          observed_load_lbs_yr and achieved_reduction_pct are null, the verdict is
          INDETERMINATE rather than OFF_TRACK, and critically the watershed stays ACTIVE with
          no cascade; a later window containing one qualifying sample returns ON_TRACK with
          achieved_reduction_pct 35.96.
        test_recipe:
          setup:
            - "Watershed SCR ACTIVE via an APPROVED TMDL (LC 60000.00, baseline 120000.00, interim_target_pct 25.00) with reaches R_OUT (COMPLIANCE_POINT) and R_MID (MAINSTEM) and R_UP (HEADWATER)."
            - "Sample S_MID: ACCEPTED, on R_MID (MAINSTEM, wrong reach_class), 2026-07-01T12:00:00Z."
            - "Sample S_PROV: PROVISIONAL, on R_OUT, 2026-07-01T12:00:00Z."
            - "Sample S_EDGE: ACCEPTED, on R_OUT, 2027-01-01T00:00:00.000Z — one millisecond after the first review window's inclusive end."
            - "Sample S_LATE: ACCEPTED, on R_OUT, 2027-03-01T00:00:00Z, 0.0500 mg/L at 1000.00 cfs, computing to 98422.25 lbs/yr."
            - "Two OPEN reviews separated by more than one clear day: AR-EMPTY covering 2026-01-01..2026-12-31 and AR-LATE covering 2027-01-02..2027-12-31."
            - "The clock is advanced to 2028-01-01 before finalizing so both windows are historical."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
