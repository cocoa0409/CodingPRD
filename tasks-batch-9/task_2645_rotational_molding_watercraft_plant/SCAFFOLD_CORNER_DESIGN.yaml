            - "the refused approve wrote nothing: PM-CVY still reads warranty_reserve_cents 50000, warranty_paid_cents 0 and an unchanged version, and CLM-CVY-1 is still UNDER_REVIEW with net_payout_cents null"
            - "POST /customers/${cust}/suspend returns 200 with status SUSPENDED and, by its own cascade, drives CLM-CVY-1 from UNDER_REVIEW to VOIDED with denial_reason APPROVAL_VOIDED and no reserve movement"
