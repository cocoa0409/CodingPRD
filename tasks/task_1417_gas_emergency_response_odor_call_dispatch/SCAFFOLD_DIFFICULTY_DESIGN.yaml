              payload: {}
              as: Supervisor
              captures: { wo_a: "$.data[0].id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Yan", caller_phone: "555-0124", address_line: "6 U St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: true }
              as: Dispatcher
              captures: { inc_b: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_b}/triage"
              payload: { priority: "P3" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_b}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_b: "$.data.id" }
            - call: "POST /gas-ops/dispatches/${disp_b}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_b}/atmospheric-readings"
              payload: { pct_lel: 4.0, co_ppm: 0, reading_context: "OUTSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_b}/make-safe/complete"
              payload: { leak_confirmed: true, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_b}"
              payload: {}
              as: Supervisor
              captures: { inc_b_v: "$.data.version" }
            - call: "POST /gas-ops/incidents/${inc_b}/responsibility-determinations"
              payload: { responsibility: "OUTSIDE_COMPANY", basis: "BARHOLE_SURVEY", expected_incident_version: "${inc_b_v}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { det_b: "$.data.id" }
            - call: "POST /gas-ops/responsibility-determinations/${det_b}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
            - call: "GET /gas-ops/incidents/${inc_b}/repair-work-orders"
              payload: {}
              as: Supervisor
              captures: { wo_b: "$.data[0].id" }
            - call: "GET /gas-ops/territories/${terr_id}"
              payload: {}
              as: Supervisor
              captures: { reserved_0: "$.data.repair_reserved_cents" }
          trigger:
            - call: "POST /gas-ops/repair-work-orders/${wo_a}/schedule"
              payload: { crew_id: "${crew_id}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T09:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_a}/cancel"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_b}/schedule"
              payload: { crew_id: "${crew_id}", window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_b}/start"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_b}/complete"
              payload: { lines: [{ description: "valve", quantity: 2, unit_price_cents: 1000, discount_pct: 0 }], labor_minutes: 15 }
              as: Supervisor
            - call: "GET /gas-ops/territories/${terr_id}"
              payload: {}
              as: Supervisor
          assert:
            - "reserved_0 == 0 (OPEN work orders hold no reservation)"
            - "After WO-A schedule: repair_reserved_cents == 90000; after WO-A cancel: back to 0 (schedule+cancel conserved)"
            - "After WO-B schedule: 45000; after WO-B complete: 0 (release equals the reserved provisional 45000, NOT the final cost)"
            - "RepairWorkOrder.${wo_b}.final_cost_cents == 3500 (2*1000 + ceil(15/15)*15min = 2000 + 1500)"
            - "Final ServiceTerritory.${terr_id}.repair_reserved_cents == 0 == reserved_0"
