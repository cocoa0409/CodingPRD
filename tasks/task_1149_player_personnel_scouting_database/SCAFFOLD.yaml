scenario: |
  generate task hard than expert level! 1149. Player Personnel & Scouting Database (pro team scouting department): prospect profile & scouting report standardization, grading scale & cross-scout normalization, video/tag linkage to report, medical/character flag handling & confidentiality, draft board construction & tier ranking, roster need modeling & fit scoring, free agency target list & budget, post-draft outcome tracking & scout evaluation

domain_name: player-personnel-scouting
api_prefix: /scouting

complexity_profile:
  primary_archetype: access_control_matrix        # medical/character flag confidentiality, role-gated workflows
  secondary_archetype: workflow_orchestration     # report lifecycle, board construction pipeline
  complexity_layers:
    - optimistic_concurrency                      # OCC on DraftBoard.version and Budget.version
    - dual_variant_calculation                    # provisional vs final normalization; RMSE vs hit-rate scout evaluation
    - derived_field_reconciliation                # composite_grade / tier / fit_score / committed_cents recomputed on cascades
    - rate_threshold_triggers                     # tier cutoffs, budget posture threshold
  entity_topology: flat                           # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic                     # ScoutingReport revision loop; DraftBoard freeze/unfreeze revert; Prospect parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties               # medical staff vs scouting staff vs front office; no role spans all steps
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Scout
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Scout display name
      - name: level
        type: enum
        source: input
        description: Scout seniority; gates role identity (AreaScout requires AREA, ScoutingDirector requires DIRECTOR)
        constraints: "one of {AREA, DIRECTOR}"
      - name: weight
        type: number
        source: input
        description: Board weight of this scout's locked grades in composite_prospect_grade; must be > 0
        default: 1.0
      - name: season_grade_mean
        type: number
        source: input
        description: Season-to-date mean of the scout's raw grades; used by the provisional normalization variant
        default: null
        constraints: "nullable; when set must be in [1.00, 9.00]"
      - name: season_grade_stdev
        type: number
        source: input
        description: Season-to-date stdev of the scout's raw grades; used by the provisional normalization variant
        default: null
        constraints: "nullable; when set must be > 0"
      - name: locked_grade_mean
        type: number
        source: input
        description: Offseason-locked full-season mean; presence selects the final normalization variant
        default: null
        constraints: "nullable; when set must be in [1.00, 9.00]"
      - name: locked_grade_stdev
        type: number
        source: input
        description: Offseason-locked full-season stdev; presence (with locked_grade_mean) selects the final normalization variant
        default: null
        constraints: "nullable; when set must be > 0"

  - name: Prospect
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Prospect display name
      - name: position
        type: string
        source: input
        description: Position code, free-form uppercase (e.g. QB, OT, CB)
      - name: college
        type: string
        source: input
        description: College or club team
      - name: evaluation_status
        type: enum
        source: system
        description: "Lifecycle dimension 1 (evaluation pipeline)"
        constraints: "one of {NEW, SCOUTING, EVALUATED, BOARD_READY, DRAFTED, ARCHIVED}"
      - name: flag_status
        type: enum
        source: system
        description: "Lifecycle dimension 2 (confidential-flag posture), evolves independently of evaluation_status"
        constraints: "one of {CLEAR, UNDER_REVIEW, CLEARED, EXCLUDED}"
      - name: composite_grade
        type: number
        source: computed
        description: Weighted composite over LOCKED reports per composite_prospect_grade; null until first LOCKED report
        default: null
      - name: tier
        type: enum
        source: computed
        description: "Tier bucket from tier_assignment over composite_grade; null until composite exists"
        default: null
        constraints: "one of {T1, T2, T3, T4}"

  - name: ScoutingReport
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: "FK -> Prospect.id; report subject"
      - name: scout_id
        type: string
        source: system
        description: "FK -> Scout.id; authoring scout, taken from X-User-ID"
      - name: raw_grade
        type: number
        source: input
        description: Scout's raw grade on the team scale
        constraints: "1.00 <= raw_grade <= 9.00, max 2 decimal places"
      - name: scheme_fit
        type: number
        source: input
        description: Scout's scheme-fit multiplier input to fit_score
        constraints: "0.00 <= scheme_fit <= 1.50, max 2 decimal places"
      - name: notes
        type: string
        source: input
        description: Free-text scouting notes
        default: ""
      - name: status
        type: enum
        source: system
        description: Report lifecycle state
        constraints: "one of {DRAFT, SUBMITTED, RETURNED, LOCKED}"
      - name: normalized_grade
        type: number
        source: computed
        description: Cross-scout normalized grade per normalized_grade calculation; set at lock time, null before
        default: null
      - name: return_reason
        type: string
        source: input
        description: Director's reason when returning a report for revision
        default: ""

  - name: VideoTag
    parent: null
    common_fields: false
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> ScoutingReport.id; report this clip tag supports"
      - name: clip_url
        type: string
        source: input
        description: URL of the video clip
      - name: start_sec
        type: integer
        source: input
        description: Clip start offset in seconds (>= 0)
      - name: end_sec
        type: integer
        source: input
        description: Clip end offset in seconds; must be > start_sec
      - name: tag
        type: enum
        source: input
        description: Tag category
        constraints: "one of {SCHEME, ATHLETICISM, TECHNIQUE, CHARACTER}"

  - name: ConfidentialFlag
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: "FK -> Prospect.id; flagged prospect"
      - name: flag_type
        type: enum
        source: input
        description: "MEDICAL flags may only be created by MedicalStaff; CHARACTER flags by AreaScout or ScoutingDirector"
        constraints: "one of {MEDICAL, CHARACTER}"
      - name: severity
        type: enum
        source: input
        description: Flag severity; HIGH MEDICAL escalation excludes the prospect
        constraints: "one of {LOW, HIGH}"
      - name: detail
        type: string
        source: input
        description: Confidential narrative; redacted to null for roles without medical clearance
      - name: status
        type: enum
        source: system
        description: Flag review lifecycle
        constraints: "one of {OPEN, ACKNOWLEDGED, RESOLVED, ESCALATED}"
      - name: author_role
        type: string
        source: system
        description: X-User-Role of the creator, recorded for audit
      - name: resolution_note
        type: string
        source: input
        description: Note recorded on resolve
        default: ""

  - name: DraftBoard
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: Draft season this board covers
      - name: status
        type: enum
        source: system
        description: Board lifecycle
        constraints: "one of {OPEN, FROZEN, FINALIZED}"
      - name: active_entry_count
        type: integer
        source: computed
        description: Count of entries with active == true; maintained by cascades

  - name: DraftBoardEntry
    parent: null
    common_fields: true
    fields:
      - name: board_id
        type: string
        source: input
        description: "FK -> DraftBoard.id; owning board"
      - name: prospect_id
        type: string
        source: input
        description: "FK -> Prospect.id; ranked prospect"
      - name: rank
        type: integer
        source: system
        description: 1-based ordinal position among active entries per board_rerank
      - name: fit_score
        type: number
        source: computed
        description: Roster-need fit per fit_score calculation; recomputed on entry add and on report-lock cascade
      - name: active
        type: boolean
        source: system
        description: false after the prospect is EXCLUDED by flag escalation; deactivated entries are excluded from rerank
        default: true

  - name: RosterNeed
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: Season the need applies to
      - name: position
        type: string
        source: input
        description: Position code matching Prospect.position / FreeAgentTarget.position
      - name: priority_tier
        type: enum
        source: input
        description: Need priority driving fit_score base
        constraints: "one of {P1, P2, P3, P4}"
      - name: status
        type: enum
        source: system
        description: OPEN needs feed fit scoring and target approval; CLOSED needs do not
        constraints: "one of {OPEN, CLOSED}"

  - name: FreeAgentTarget
    parent: null
    common_fields: true
    fields:
      - name: player_name
        type: string
        source: input
        description: Veteran player name
      - name: position
        type: string
        source: input
        description: Position code
      - name: season_year
        type: integer
        source: input
        description: League year the contract would count against
      - name: base_salary_cents
        type: integer
        source: input
        description: Year-1 base salary in cents (>= 0)
      - name: signing_bonus_cents
        type: integer
        source: input
        description: Signing bonus in cents (>= 0), prorated over contract_years
      - name: contract_years
        type: integer
        source: input
        description: Contract length in years (>= 1)
      - name: status
        type: enum
        source: system
        description: Target pipeline state
        constraints: "one of {IDENTIFIED, EVALUATING, APPROVED, OFFERED, SIGNED, RELEASED, PASSED}"
      - name: annual_cap_hit_cents
        type: integer
        source: computed
        description: Year-1 cap hit per cap_hit_and_budget_posture; computed at creation
      - name: signed_budget_id
        type: string
        source: system
        description: Budget.id this target signed against; null until SIGNED (plain reference, not an integrity FK)
        default: null

  - name: Budget
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: League year of this budget
      - name: base_cap_cents
        type: integer
        source: input
        description: Base salary cap in cents (>= 0)
      - name: rollover_cents
        type: integer
        source: input
        description: Cap rollover from prior year in cents; adjusted by POST adjustments (>= 0)
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of annual_cap_hit_cents over FreeAgentTarget rows with status SIGNED against this budget
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: base_cap_cents + rollover_cents - committed_cents
      - name: posture
        type: enum
        source: computed
        description: "TIGHT iff available_cents < 0.10 * (base_cap_cents + rollover_cents); else HEALTHY"
        constraints: "one of {HEALTHY, TIGHT}"

  - name: InterviewSession
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: "FK -> Prospect.id; interviewed prospect"
      - name: start_at
        type: datetime
        source: input
        description: Interview start (ISO 8601 UTC)
      - name: end_at
        type: datetime
        source: input
        description: Interview end (ISO 8601 UTC); must be > start_at
      - name: location
        type: string
        source: input
        description: Interview location label
      - name: status
        type: enum
        source: system
        description: Only SCHEDULED sessions occupy the prospect's calendar
        constraints: "one of {SCHEDULED, CANCELLED}"

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Facility name
      - name: capacity
        type: integer
        source: input
        description: Room capacity (>= 1)

  - name: FacilityBooking
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; booked facility"
      - name: start_at
        type: datetime
        source: input
        description: Booking start (ISO 8601 UTC)
      - name: end_at
        type: datetime
        source: input
        description: Booking end (ISO 8601 UTC); must be > start_at
      - name: purpose
        type: string
        source: input
        description: Booking purpose label

  - name: OutcomeRecord
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: "FK -> Prospect.id; drafted prospect this outcome belongs to"
      - name: season_year
        type: integer
        source: input
        description: Season the outcome describes
      - name: games_started
        type: integer
        source: input
        description: Games started that season (>= 0)
      - name: pro_bowl
        type: boolean
        source: input
        description: Whether the player made the Pro Bowl that season
      - name: outcome_percentile
        type: integer
        source: input
        description: Analyst-assessed outcome percentile 0..100; /10 maps onto the grade scale

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ScoutingReport
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scouting/reports/{id}/submit"
        actor: AreaScout
        preconditions:
          - "report.status == DRAFT or report.status == RETURNED"
          - "acting scout (X-User-ID) == report.scout_id"
        side_effects:
          - "updated_at refreshed"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /scouting/reports/{id}/submit"
        actor: AreaScout
        preconditions:
          - "report.status == RETURNED"
          - "acting scout == report.scout_id"
        side_effects:
          - "return_reason cleared"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /scouting/reports/{id}/return"
        actor: ScoutingDirector
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "return_reason recorded"
      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /scouting/reports/{id}/lock"
        actor: ScoutingDirector
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "normalized_grade computed via normalized_grade (hop 1)"
          - "prospect composite_grade and tier recomputed via composite_prospect_grade + tier_assignment (hop 2)"
          - "every DraftBoardEntry with prospect_id == report.prospect_id and active == true on a board with status OPEN has fit_score recomputed, then board_rerank runs on that board (hop 3)"
          - "each reranked DraftBoard has version incremented by 1 and updated_at refreshed (hop 4)"

  - entity: Prospect
    initial_state: NEW
    terminal_states: [DRAFTED, ARCHIVED]
    transitions:
      - from: NEW
        to: SCOUTING
        trigger: "system: first ScoutingReport created for the prospect (POST /scouting/prospects/{id}/reports)"
        actor: system
        preconditions: []
        side_effects:
          - "evaluation_status becomes SCOUTING in the same request as report creation"
      - from: SCOUTING
        to: EVALUATED
        trigger: "POST /scouting/prospects/{id}/advance {to_state: EVALUATED}"
        actor: ScoutingDirector
        preconditions:
          - "evaluation_status == SCOUTING"
          - "at least one ScoutingReport for this prospect has status LOCKED"
        side_effects: []
      - from: EVALUATED
        to: BOARD_READY
        trigger: "POST /scouting/prospects/{id}/advance {to_state: BOARD_READY}"
        actor: ScoutingDirector
        preconditions:
          - "evaluation_status == EVALUATED"
          - "at least one ScoutingReport for this prospect has status LOCKED"
        side_effects: []
      - from: EVALUATED
        to: ARCHIVED
        trigger: "POST /scouting/prospects/{id}/advance {to_state: ARCHIVED}"
        actor: ScoutingDirector
        preconditions:
          - "evaluation_status == EVALUATED"
        side_effects: []
      - from: BOARD_READY
        to: ARCHIVED
        trigger: "POST /scouting/prospects/{id}/advance {to_state: ARCHIVED}"
        actor: ScoutingDirector
        preconditions:
          - "evaluation_status == BOARD_READY"
        side_effects: []
      - from: BOARD_READY
        to: DRAFTED
        trigger: "POST /scouting/prospects/{id}/mark-drafted"
        actor: GeneralManager
        preconditions:
          - "evaluation_status == BOARD_READY"
        side_effects: []
      # --- parallel dimension: flag_status (independent of evaluation_status) ---
      - from: CLEAR
        to: UNDER_REVIEW
        trigger: "system: a ConfidentialFlag is created for the prospect (POST /scouting/prospects/{id}/flags)"
        actor: system
        preconditions: []
        side_effects:
          - "flag_status becomes UNDER_REVIEW in the same request as flag creation"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "system: a ConfidentialFlag is resolved (POST /scouting/flags/{id}/resolve) and no other flag of this prospect is in {OPEN, ACKNOWLEDGED, ESCALATED}"
        actor: system
        preconditions: []
        side_effects:
          - "flag_status becomes CLEARED"
      - from: UNDER_REVIEW
        to: EXCLUDED
        trigger: "system: a HIGH MEDICAL ConfidentialFlag is escalated (POST /scouting/flags/{id}/escalate)"
        actor: system
        preconditions: []
        side_effects:
          - "flag_status becomes EXCLUDED (hop 1)"
          - "every DraftBoardEntry with prospect_id == this prospect on a board with status OPEN or FROZEN has active set to false (hop 2)"
          - "board_rerank runs on each affected board; each reranked DraftBoard has version incremented by 1 (hop 3)"
      - from: CLEAR
        to: EXCLUDED
        trigger: "system: a HIGH MEDICAL ConfidentialFlag created while flag_status == CLEAR is escalated; creation moves CLEAR -> UNDER_REVIEW first, so this edge is reached via UNDER_REVIEW"
        actor: system
        preconditions: []
        side_effects: []
        note: "declared for completeness; the physical path always passes through UNDER_REVIEW"
      - from: CLEARED
        to: UNDER_REVIEW
        trigger: "system: a new ConfidentialFlag is created for the prospect"
        actor: system
        preconditions: []
        side_effects:
          - "flag_status becomes UNDER_REVIEW"

  - entity: DraftBoard
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /scouting/draft-boards/{id}/freeze"
        actor: ScoutingDirector
        preconditions:
          - "board.status == OPEN"
        side_effects: []
      - from: FROZEN
        to: OPEN
        trigger: "POST /scouting/draft-boards/{id}/unfreeze"
        actor: ScoutingDirector
        preconditions:
          - "board.status == FROZEN"
        side_effects: []
      - from: FROZEN
        to: FINALIZED
        trigger: "POST /scouting/draft-boards/{id}/finalize"
        actor: ScoutingDirector
        preconditions:
          - "board.status == FROZEN"
          - "active_entry_count >= 1"
        side_effects: []

  - entity: ConfidentialFlag
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /scouting/flags/{id}/acknowledge"
        actor: "MedicalStaff (MEDICAL) or ScoutingDirector (CHARACTER)"
        preconditions:
          - "flag.status == OPEN"
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "POST /scouting/flags/{id}/resolve"
        actor: "MedicalStaff (MEDICAL) or ScoutingDirector (CHARACTER)"
        preconditions:
          - "flag.status in {OPEN, ACKNOWLEDGED, ESCALATED}"
        side_effects:
          - "prospect flag_status recomputed (may move UNDER_REVIEW -> CLEARED)"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /scouting/flags/{id}/resolve"
        actor: "MedicalStaff (MEDICAL) or ScoutingDirector (CHARACTER)"
        preconditions:
          - "flag.status in {OPEN, ACKNOWLEDGED, ESCALATED}"
        side_effects:
          - "prospect flag_status recomputed (may move UNDER_REVIEW -> CLEARED)"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /scouting/flags/{id}/escalate"
        actor: ScoutingDirector
        preconditions:
          - "flag.status in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "if flag_type == MEDICAL and severity == HIGH: prospect flag_status -> EXCLUDED cascade (see Prospect state machine hops 1-3)"
          - "otherwise: prospect flag_status -> UNDER_REVIEW (no board impact)"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /scouting/flags/{id}/escalate"
        actor: ScoutingDirector
        preconditions:
          - "flag.status in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "same escalate cascades as from OPEN"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /scouting/flags/{id}/resolve"
        actor: "MedicalStaff (MEDICAL) or ScoutingDirector (CHARACTER)"
        preconditions:
          - "flag.status in {OPEN, ACKNOWLEDGED, ESCALATED}"
        side_effects:
          - "resolution_note recorded; prospect flag_status stays EXCLUDED if an EXCLUDED-causing escalation occurred (EXCLUDED is not reversed by resolve)"

  - entity: FreeAgentTarget
    initial_state: IDENTIFIED
    terminal_states: [RELEASED, PASSED]
    transitions:
      - from: IDENTIFIED
        to: EVALUATING
        trigger: "POST /scouting/free-agent-targets/{id}/advance {to_state: EVALUATING}"
        actor: GeneralManager
        preconditions:
          - "target.status == IDENTIFIED"
        side_effects: []
      - from: EVALUATING
        to: APPROVED
        trigger: "POST /scouting/free-agent-targets/{id}/advance {to_state: APPROVED}"
        actor: GeneralManager
        preconditions:
          - "target.status == EVALUATING"
          - "a RosterNeed with position == target.position, season_year == target.season_year, status == OPEN exists"
        side_effects: []
      - from: APPROVED
        to: OFFERED
        trigger: "POST /scouting/free-agent-targets/{id}/advance {to_state: OFFERED}"
        actor: GeneralManager
        preconditions:
          - "target.status == APPROVED"
        side_effects: []
      - from: OFFERED
        to: SIGNED
        trigger: "POST /scouting/free-agent-targets/{id}/sign"
        actor: GeneralManager
        preconditions:
          - "target.status == OFFERED"
          - "budget_id exists"
          - "target.annual_cap_hit_cents <= budget.available_cents (equality allowed)"
        side_effects:
          - "target.signed_budget_id = budget_id"
          - "budget.committed_cents recomputed (sum over SIGNED targets), available_cents and posture recomputed via cap_hit_and_budget_posture"
          - "budget.version incremented by 1"
      - from: SIGNED
        to: RELEASED
        trigger: "POST /scouting/free-agent-targets/{id}/release"
        actor: GeneralManager
        preconditions:
          - "target.status == SIGNED"
        side_effects:
          - "budget (signed_budget_id).committed_cents recomputed (target no longer SIGNED), available_cents and posture recomputed"
          - "budget.version incremented by 1"
      - from: IDENTIFIED
        to: PASSED
        trigger: "POST /scouting/free-agent-targets/{id}/pass"
        actor: GeneralManager
        preconditions:
          - "target.status in {IDENTIFIED, EVALUATING, APPROVED, OFFERED}"
        side_effects: []
      - from: EVALUATING
        to: PASSED
        trigger: "POST /scouting/free-agent-targets/{id}/pass"
        actor: GeneralManager
        preconditions:
          - "target.status in {IDENTIFIED, EVALUATING, APPROVED, OFFERED}"
        side_effects: []
      - from: APPROVED
        to: PASSED
        trigger: "POST /scouting/free-agent-targets/{id}/pass"
        actor: GeneralManager
        preconditions:
          - "target.status in {IDENTIFIED, EVALUATING, APPROVED, OFFERED}"
        side_effects: []
      - from: OFFERED
        to: PASSED
        trigger: "POST /scouting/free-agent-targets/{id}/pass"
        actor: GeneralManager
        preconditions:
          - "target.status in {IDENTIFIED, EVALUATING, APPROVED, OFFERED}"
        side_effects: []

  - entity: InterviewSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /scouting/interviews/{id}/cancel"
        actor: "AreaScout or ScoutingDirector"
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "session no longer occupies the prospect's calendar for overlap checks"

  - entity: RosterNeed
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /scouting/roster-needs/{id}/close"
        actor: GeneralManager
        preconditions:
          - "need.status == OPEN"
        side_effects:
          - "need no longer feeds fit_score base selection or target approval"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: board-reorder-stale-version
    parent_entity: DraftBoard
    write_endpoint: "POST /scouting/draft-boards/{id}/entries/reorder"
    occ_field: expected_board_version
    description: |
      Reordering entries on a DraftBoard whose version has advanced beyond the
      version the client last observed is rejected. This captures the case where
      another writer has reordered the board or a report-lock / flag-escalation
      cascade has reranked it since the client read it, making the client's
      rank plan stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-adjust-stale-version
    parent_entity: Budget
    write_endpoint: "POST /scouting/budgets/{id}/adjustments"
    occ_field: expected_budget_version
    description: |
      Posting a rollover adjustment against a Budget whose version has advanced
      beyond the version the client last observed is rejected. This captures the
      case where a sign or release has recomputed committed_cents since the
      client read the budget, so the client's baseline for the adjustment is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: normalized_grade
    trigger: "runs once, at ScoutingReport lock (SUBMITTED -> LOCKED)"
    algorithm: weighted_scoring
    formula: |
      inputs: report.raw_grade, scout stats (variant-selected mean/stdev)
      z = (raw_grade - mean) / stdev
      normalized = CENTER + SCALE * z
      normalized = min(MAX_G, max(MIN_G, round_half_up(normalized, 2)))
      The chosen variant's (mean, stdev) pair is snapshotted into the report at lock time.
    input_set: "the single report being locked, plus its authoring Scout row"
    constants:
      CENTER: 5.0
      SCALE: 1.5
      MIN_G: 1.0
      MAX_G: 9.0
    precision: "2 decimal places, round_half_up, applied before clamping"
    variants:
      - name: provisional
        when: "scout.locked_grade_mean is null (in-season)"
        difference: "uses (scout.season_grade_mean, scout.season_grade_stdev)"
      - name: final
        when: "scout.locked_grade_mean is not null (offseason lock published)"
        difference: "uses (scout.locked_grade_mean, scout.locked_grade_stdev); identical raw_grade yields a different normalized_grade than provisional whenever the two stat pairs differ"

  - name: composite_prospect_grade
    trigger: "after any report for the prospect is locked (lock cascade hop 2), and after any authoring scout's weight changes (POST /scouting/scouts/{id}/weight)"
    algorithm: weighted_scoring
    formula: |
      let R = all ScoutingReport rows with prospect_id == prospect and status == LOCKED
      if R empty: composite_grade = null, tier = null; stop
      total_w = sum over r in R of scout(r).weight
      for each r: w_i = scout(r).weight / total_w
      for each r: contrib_i = round_half_up(w_i * r.normalized_grade, 2)   # ROUND PER REPORT FIRST (pinned order)
      composite_grade = round_half_up(sum of contrib_i, 2)                 # THEN sum and round again
      # Note: summing unrounded products then rounding once is a different, forbidden order.
    input_set: "LOCKED reports only; DRAFT/SUBMITTED/RETURNED reports excluded"
    constants: {}
    precision: "2 decimal places, round_half_up; per-contribution rounding precedes the final sum rounding"

  - name: tier_assignment
    trigger: "immediately after composite_prospect_grade recomputes"
    algorithm: threshold
    formula: |
      if composite_grade is null: tier = null
      elif composite_grade >= 8.00: tier = T1
      elif composite_grade >= 7.00: tier = T2
      elif composite_grade >= 6.00: tier = T3
      else: tier = T4
      # boundaries are inclusive-lower: exactly 7.00 is T2, 6.99 is T3
    input_set: "single prospect's composite_grade"
    constants:
      T1_MIN: 8.00
      T2_MIN: 7.00
      T3_MIN: 6.00
    precision: "comparison against the 2-decimal composite_grade, >= inclusive"

  - name: fit_score
    trigger: "when a DraftBoardEntry is created, and on lock cascade hop 3 for affected entries"
    algorithm: constraint_propagation
    formula: |
      need_set = RosterNeed rows with position == prospect.position,
                 season_year == board.season_year, status == OPEN
      if need_set empty: base_need = DEFAULT_BASE
      else: base_need = BASE_NEED[highest priority_tier in need_set]   # P1 > P2 > P3 > P4; ties broken by created_at ASC
      fit_source = the LOCKED report of this prospect with the highest normalized_grade;
                   ties broken by report.created_at ASC
      scheme = fit_source.scheme_fit
      med_mult = MEDICAL_HIGH_MULT if any ConfidentialFlag of this prospect has
                 flag_type == MEDICAL, severity == HIGH, status == RESOLVED else 1.0
      char_ded = CHAR_DEDUCTION if any ConfidentialFlag of this prospect has
                 flag_type == CHARACTER and status in {OPEN, ACKNOWLEDGED} else 0
      fit_score = round_half_up(min(100.0, max(0.0, base_need * scheme * med_mult - char_ded)), 2)
    input_set: "prospect's LOCKED reports, prospect's flags (any status), OPEN RosterNeed rows matching position + board season"
    constants:
      DEFAULT_BASE: 20.0
      MEDICAL_HIGH_MULT: 0.8
      CHAR_DEDUCTION: 15.0
      BASE_NEED: { P1: 90.0, P2: 70.0, P3: 50.0, P4: 30.0 }
    precision: "2 decimal places, round_half_up"

  - name: cap_hit_and_budget_posture
    trigger: "at FreeAgentTarget creation (hit), and at sign / release / budget adjustment (committed, available, posture)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned to break the apparent cycle (hit -> committed -> available -> posture):
      # 1) hit:      annual_cap_hit_cents = base_salary_cents + round_half_up(signing_bonus_cents / contract_years)
      #              (integer cents; round_half_up on the proration only)
      # 2) committed: committed_cents = sum of annual_cap_hit_cents over FreeAgentTarget rows
      #               with status == SIGNED and signed_budget_id == budget.id
      # 3) available: available_cents = base_cap_cents + rollover_cents - committed_cents
      # 4) posture:   posture = TIGHT if available_cents < POSTURE_FRACTION * (base_cap_cents + rollover_cents)
      #               else HEALTHY   (strictly less-than: exactly 10% is HEALTHY)
      # Sign gate uses step (3) BEFORE applying the new signing: allowed iff hit <= available.
    input_set: "FreeAgentTarget rows with status SIGNED for committed; the candidate target for the sign gate"
    constants:
      POSTURE_FRACTION: 0.10
    precision: "integer cents; round_half_up on bonus proration"

  - name: board_rerank
    trigger: "on DraftBoardEntry creation, on lock cascade hop 3, on flag-exclusion cascade hop 3, and after manual reorder"
    algorithm: topological
    formula: |
      active_entries = entries of the board with active == true
      sort key: prospect.composite_grade DESC (nulls last),
                then entry.fit_score DESC,
                then entry.created_at ASC          # final tie-break; never id
      assign rank = 1..N in that order (compaction after deactivation closes gaps)
      board.active_entry_count = N
    input_set: "active DraftBoardEntry rows of one board"
    constants: {}
    precision: "integer ranks, contiguous from 1"

  - name: scout_evaluation
    trigger: "on read of GET /scouting/scouts/{id}/evaluation (computed on demand)"
    algorithm: aggregation
    formula: |
      eligible = LOCKED reports authored by this scout whose prospect has at least one OutcomeRecord
      for each eligible report: outcome = the prospect's OutcomeRecord with max season_year
      error_i = report.normalized_grade - outcome.outcome_percentile / 10
      RMSE = sqrt(mean(error_i^2))
      rmse_accuracy = max(0, round_half_up(100 - 10 * RMSE, 2))
      predictions = eligible reports with normalized_grade >= 7.00
      hit = prediction whose outcome.outcome_percentile >= 70
      hit_rate_accuracy = round_half_up(100 * hits / count(predictions), 2)
      if eligible is empty: rmse_accuracy = null, hit_rate_accuracy = null, evaluated_report_count = 0
    input_set: "scout's LOCKED reports joined to the subject prospect's OutcomeRecord rows (latest season per prospect)"
    constants:
      HIT_GRADE_MIN: 7.00
      HIT_OUTCOME_MIN: 70
      RMSE_PENALTY: 10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: rmse_accuracy
        when: "always reported"
        difference: "penalizes magnitude of grade error across all eligible reports"
      - name: hit_rate_accuracy
        when: "always reported"
        difference: "binary hit/miss on high-grade predictions only; identical data yields a different accuracy number than rmse_accuracy"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; for entity_backed roles the X-User-ID must resolve to a Scout row whose level matches the role (AreaScout -> AREA, ScoutingDirector -> DIRECTOR)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 2
    category: auth
    check: "report ownership: only the authoring scout (X-User-ID == report.scout_id) may submit the report or add video tags"
    error_id: ERR_REPORT_NOT_OWNED
    http_status: 403
    applies_to: "POST /scouting/reports/{id}/submit, POST /scouting/reports/{id}/video-tags"
  - priority: 2
    category: auth
    check: "flag-type clearance: MEDICAL flags may be created only by MedicalStaff; CHARACTER flags only by AreaScout or ScoutingDirector"
    error_id: ERR_FLAG_ACCESS_DENIED
    http_status: 403
    applies_to: "POST /scouting/prospects/{id}/flags"
  - priority: 3
    category: business_constraint
    check: "request schema: required fields present, types correct, enum values in range, end_sec > start_sec, end_at > start_at, integers non-negative where declared"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "path parameters and body-supplied ids (prospect_id, budget_id, entry_id) reference existing resources, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "generic transition guard: the entity's current state permits the requested transition (submit/return/lock, advance, pass, acknowledge/resolve/escalate, freeze/unfreeze/finalize, cancel, close, mark-drafted, release)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "report creation requires prospect.evaluation_status in {NEW, SCOUTING, EVALUATED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /scouting/prospects/{id}/reports"
  - priority: 5
    category: state
    check: "board mutations (entry add, reorder) require board.status == OPEN"
    error_id: ERR_BOARD_NOT_OPEN
    http_status: 409
    applies_to: "POST /scouting/draft-boards/{id}/entries, POST /scouting/draft-boards/{id}/entries/reorder"
  - priority: 5
    category: state
    check: "entry add requires prospect.evaluation_status == BOARD_READY"
    error_id: ERR_PROSPECT_NOT_BOARD_READY
    http_status: 409
    applies_to: "POST /scouting/draft-boards/{id}/entries"
  - priority: 5
    category: state
    check: "finalize requires active_entry_count >= 1"
    error_id: ERR_BOARD_EMPTY
    http_status: 409
    applies_to: "POST /scouting/draft-boards/{id}/finalize"
  - priority: 5
    category: state
    check: "sign requires target.status == OFFERED"
    error_id: ERR_TARGET_NOT_OFFERED
    http_status: 409
    applies_to: "POST /scouting/free-agent-targets/{id}/sign"
  - priority: 5
    category: state
    check: "advance to APPROVED requires an OPEN RosterNeed matching position + season_year"
    error_id: ERR_NO_ROSTER_NEED
    http_status: 409
    applies_to: "POST /scouting/free-agent-targets/{id}/advance"
  - priority: 5
    category: state
    check: "outcome creation requires prospect.evaluation_status == DRAFTED"
    error_id: ERR_OUTCOME_NOT_DRAFTED
    http_status: 409
    applies_to: "POST /scouting/prospects/{id}/outcomes"
  - priority: 6
    category: business_safety
    check: "interview scheduling is blocked while prospect.flag_status == UNDER_REVIEW (open confidential review)"
    error_id: ERR_FLAG_REVIEW_OPEN
    http_status: 409
    applies_to: "POST /scouting/prospects/{id}/interviews"
  - priority: 6
    category: business_safety
    check: "board entry add is blocked while prospect.flag_status == EXCLUDED"
    error_id: ERR_PROSPECT_EXCLUDED
    http_status: 409
    applies_to: "POST /scouting/draft-boards/{id}/entries"
  - priority: 7
    category: business_constraint
    check: "uniqueness: at most one ScoutingReport per (scout_id, prospect_id)"
    error_id: ERR_DUPLICATE_REPORT
    http_status: 409
    applies_to: "POST /scouting/prospects/{id}/reports"
  - priority: 7
    category: business_constraint
    check: "grade ranges: 1.00 <= raw_grade <= 9.00 and 0.00 <= scheme_fit <= 1.50, max 2 decimal places"
    error_id: ERR_GRADE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /scouting/prospects/{id}/reports"
  - priority: 7
    category: business_constraint
    check: "reorder new_rank within [1, active_entry_count] and entry_id belongs to this board and is active"
    error_id: ERR_RANK_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /scouting/draft-boards/{id}/entries/reorder"
  - priority: 7
    category: business_constraint
    check: "scout weight must be > 0"
    error_id: ERR_WEIGHT_INVALID
    http_status: 422
    applies_to: "POST /scouting/scouts/{id}/weight"
  - priority: 8
    category: business_temporal
    check: "interview overlap: a new session [start_at, end_at) may not overlap any SCHEDULED session of the same prospect; half-open semantics — new.start_at == existing.end_at or new.end_at == existing.start_at is allowed"
    error_id: ERR_INTERVIEW_OVERLAP
    http_status: 409
    applies_to: "POST /scouting/prospects/{id}/interviews"
  - priority: 8
    category: business_temporal
    check: "facility buffer: bookings on the same facility must leave a gap of at least 30 minutes on both sides — new.start_at >= existing.end_at + 30min or new.end_at <= existing.start_at - 30min; a gap of exactly 30 minutes is allowed"
    error_id: ERR_FACILITY_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /scouting/facilities/{id}/bookings"
  - priority: 9
    category: business_fiscal
    check: "sign gate: target.annual_cap_hit_cents <= budget.available_cents (equality allowed); adjustments must keep available_cents >= 0"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /scouting/free-agent-targets/{id}/sign, POST /scouting/budgets/{id}/adjustments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server default before any call is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/scouting/scouts"
    description: "Register a scout"
    roles: [GeneralManager]
    code: 201
    input: [full_name, level, "weight?", "season_grade_mean?", "season_grade_stdev?", "locked_grade_mean?", "locked_grade_stdev?"]
    output: Scout
    side_effects: []

  - method: GET
    path: "/scouting/scouts/{id}"
    description: "Fetch one scout"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: []
    output: Scout
    side_effects: []

  - method: GET
    path: "/scouting/scouts/{id}/evaluation"
    description: "Computed post-draft scout accuracy read (scout_evaluation; both variants)"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: []
    output: { scout_id: string, rmse_accuracy: number, hit_rate_accuracy: number, evaluated_report_count: integer }
    side_effects: []

  - method: POST
    path: "/scouting/scouts/{id}/weight"
    description: "Change a scout's board weight; recomputes composite_grade/tier for every prospect with a LOCKED report by this scout"
    roles: [ScoutingDirector]
    code: 200
    input: [new_weight]
    output: Scout
    side_effects: ["composite_prospect_grade + tier_assignment rerun for affected prospects", "rerank of affected OPEN boards", "scout.version incremented by 1"]

  - method: POST
    path: "/scouting/prospects"
    description: "Create a prospect profile"
    roles: [AreaScout, ScoutingDirector]
    code: 201
    input: [full_name, position, college]
    output: Prospect
    side_effects: []

  - method: GET
    path: "/scouting/prospects"
    description: "List prospects with filters and pagination"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: ["position?", "evaluation_status?", "flag_status?", "limit?", "offset?"]
    output: Prospect[]
    side_effects: []

  - method: GET
    path: "/scouting/prospects/{id}"
    description: "Fetch one prospect"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: []
    output: Prospect
    side_effects: []

  - method: POST
    path: "/scouting/prospects/{id}/advance"
    description: "Advance evaluation_status (EVALUATED | BOARD_READY | ARCHIVED)"
    roles: [ScoutingDirector]
    code: 200
    input: [to_state]
    output: Prospect
    side_effects: []

  - method: POST
    path: "/scouting/prospects/{id}/mark-drafted"
    description: "Mark a BOARD_READY prospect as drafted"
    roles: [GeneralManager]
    code: 200
    input: []
    output: Prospect
    side_effects: []

  - method: GET
    path: "/scouting/prospects/{id}/board-entries"
    description: "List draft board entries referencing this prospect"
    roles: [ScoutingDirector, GeneralManager]
    code: 200
    input: ["limit?", "offset?"]
    output: DraftBoardEntry[]
    side_effects: []

  - method: POST
    path: "/scouting/prospects/{id}/reports"
    description: "Create a scouting report (DRAFT) for a prospect; first report moves prospect NEW -> SCOUTING"
    roles: [AreaScout]
    code: 201
    input: [raw_grade, scheme_fit, "notes?"]
    output: ScoutingReport
    side_effects: ["prospect NEW -> SCOUTING when this is the prospect's first report"]

  - method: GET
    path: "/scouting/reports/{id}"
    description: "Fetch one scouting report"
    roles: [AreaScout, ScoutingDirector, GeneralManager]
    code: 200
    input: []
    output: ScoutingReport
    side_effects: []

  - method: GET
    path: "/scouting/reports"
    description: "List scouting reports with filters and pagination"
    roles: [AreaScout, ScoutingDirector, GeneralManager]
    code: 200
    input: ["scout_id?", "prospect_id?", "status?", "limit?", "offset?"]
    output: ScoutingReport[]
    side_effects: []

  - method: POST
    path: "/scouting/reports/{id}/submit"
    description: "Submit a DRAFT or RETURNED report (authoring scout only)"
    roles: [AreaScout]
    code: 200
    input: []
    output: ScoutingReport
    side_effects: ["report DRAFT|RETURNED -> SUBMITTED"]

  - method: POST
    path: "/scouting/reports/{id}/return"
    description: "Return a SUBMITTED report for revision"
    roles: [ScoutingDirector]
    code: 200
    input: ["return_reason?"]
    output: ScoutingReport
    side_effects: ["report SUBMITTED -> RETURNED"]

  - method: POST
    path: "/scouting/reports/{id}/lock"
    description: "Lock a SUBMITTED report; computes normalized_grade and runs the prospect -> board cascade"
    roles: [ScoutingDirector]
    code: 200
    input: []
    output: ScoutingReport
    side_effects: ["normalized_grade computed", "prospect composite_grade + tier recomputed", "affected OPEN boards reranked and version incremented"]

  - method: POST
    path: "/scouting/reports/{id}/video-tags"
    description: "Attach a video clip tag to a report; only while report is DRAFT or RETURNED, author only"
    roles: [AreaScout]
    code: 201
    input: [clip_url, start_sec, end_sec, tag]
    output: VideoTag
    side_effects: []

  - method: GET
    path: "/scouting/reports/{id}/video-tags"
    description: "List video tags of a report"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: VideoTag[]
    side_effects: []

  - method: POST
    path: "/scouting/prospects/{id}/flags"
    description: "Raise a confidential flag; MEDICAL only by MedicalStaff, CHARACTER only by scouting roles; moves prospect flag_status to UNDER_REVIEW"
    roles: [MedicalStaff, AreaScout, ScoutingDirector]
    code: 201
    input: [flag_type, severity, detail]
    output: ConfidentialFlag
    side_effects: ["prospect flag_status -> UNDER_REVIEW"]

  - method: GET
    path: "/scouting/prospects/{id}/flags"
    description: "List flags of a prospect; MEDICAL flag detail is redacted to null for roles other than MedicalStaff"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: ["flag_type?", "status?", "limit?", "offset?"]
    output: ConfidentialFlag[]
    side_effects: []

  - method: POST
    path: "/scouting/flags/{id}/acknowledge"
    description: "Acknowledge an OPEN flag"
    roles: [MedicalStaff, ScoutingDirector]
    code: 200
    input: []
    output: ConfidentialFlag
    side_effects: ["flag OPEN -> ACKNOWLEDGED"]

  - method: POST
    path: "/scouting/flags/{id}/resolve"
    description: "Resolve a flag; recomputes prospect flag_status (may become CLEARED)"
    roles: [MedicalStaff, ScoutingDirector]
    code: 200
    input: ["resolution_note?"]
    output: ConfidentialFlag
    side_effects: ["flag -> RESOLVED", "prospect flag_status recomputed"]

  - method: POST
    path: "/scouting/flags/{id}/escalate"
    description: "Escalate a flag; HIGH MEDICAL excludes the prospect and deactivates board entries"
    roles: [ScoutingDirector]
    code: 200
    input: []
    output: ConfidentialFlag
    side_effects: ["flag -> ESCALATED", "HIGH MEDICAL: prospect EXCLUDED cascade with entry deactivation and board rerank"]

  - method: POST
    path: "/scouting/draft-boards"
    description: "Create a draft board for a season"
    roles: [ScoutingDirector]
    code: 201
    input: [season_year]
    output: DraftBoard
    side_effects: []

  - method: GET
    path: "/scouting/draft-boards/{id}"
    description: "Fetch one draft board"
    roles: [ScoutingDirector, GeneralManager]
    code: 200
    input: []
    output: DraftBoard
    side_effects: []

  - method: GET
    path: "/scouting/draft-boards/{id}/entries"
    description: "List board entries ordered by rank ASC (active first per rerank invariants)"
    roles: [ScoutingDirector, GeneralManager]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: DraftBoardEntry[]
    side_effects: []

  - method: POST
    path: "/scouting/draft-boards/{id}/entries"
    description: "Add a BOARD_READY, non-EXCLUDED prospect to an OPEN board; computes fit_score and reranks"
    roles: [ScoutingDirector]
    code: 201
    input: [prospect_id]
    output: DraftBoardEntry
    side_effects: ["fit_score computed", "board_rerank runs", "board.version incremented by 1"]

  - method: POST
    path: "/scouting/draft-boards/{id}/entries/reorder"
    description: "Manually move an active entry to new_rank (insert semantics: entry removed, others shift by rank, insert at new_rank); OCC-guarded on board version"
    roles: [ScoutingDirector]
    code: 200
    input: [entry_id, new_rank, expected_board_version]
    output: DraftBoard
    side_effects: ["ranks reassigned contiguously from 1", "board.version incremented by 1"]

  - method: POST
    path: "/scouting/draft-boards/{id}/freeze"
    description: "Freeze an OPEN board"
    roles: [ScoutingDirector]
    code: 200
    input: []
    output: DraftBoard
    side_effects: ["board OPEN -> FROZEN"]

  - method: POST
    path: "/scouting/draft-boards/{id}/unfreeze"
    description: "Reopen a FROZEN board"
    roles: [ScoutingDirector]
    code: 200
    input: []
    output: DraftBoard
    side_effects: ["board FROZEN -> OPEN"]

  - method: POST
    path: "/scouting/draft-boards/{id}/finalize"
    description: "Finalize a FROZEN board with at least one active entry"
    roles: [ScoutingDirector]
    code: 200
    input: []
    output: DraftBoard
    side_effects: ["board FROZEN -> FINALIZED"]

  - method: POST
    path: "/scouting/roster-needs"
    description: "Declare a roster need for a season"
    roles: [GeneralManager]
    code: 201
    input: [season_year, position, priority_tier]
    output: RosterNeed
    side_effects: []

  - method: GET
    path: "/scouting/roster-needs"
    description: "List roster needs with filters"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: ["season_year?", "position?", "status?", "limit?", "offset?"]
    output: RosterNeed[]
    side_effects: []

  - method: GET
    path: "/scouting/roster-needs/{id}"
    description: "Fetch one roster need"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: []
    output: RosterNeed
    side_effects: []

  - method: POST
    path: "/scouting/roster-needs/{id}/close"
    description: "Close an OPEN roster need"
    roles: [GeneralManager]
    code: 200
    input: []
    output: RosterNeed
    side_effects: ["need OPEN -> CLOSED"]

  - method: POST
    path: "/scouting/free-agent-targets"
    description: "Add a free-agency target; annual_cap_hit_cents computed at creation"
    roles: [GeneralManager]
    code: 201
    input: [player_name, position, season_year, base_salary_cents, signing_bonus_cents, contract_years]
    output: FreeAgentTarget
    side_effects: ["annual_cap_hit_cents computed"]

  - method: GET
    path: "/scouting/free-agent-targets"
    description: "List free-agency targets with filters"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: ["status?", "position?", "season_year?", "limit?", "offset?"]
    output: FreeAgentTarget[]
    side_effects: []

  - method: GET
    path: "/scouting/free-agent-targets/{id}"
    description: "Fetch one free-agency target"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: []
    output: FreeAgentTarget
    side_effects: []

  - method: POST
    path: "/scouting/free-agent-targets/{id}/advance"
    description: "Advance target pipeline (EVALUATING | APPROVED | OFFERED); APPROVED requires an OPEN matching RosterNeed"
    roles: [GeneralManager]
    code: 200
    input: [to_state]
    output: FreeAgentTarget
    side_effects: []

  - method: POST
    path: "/scouting/free-agent-targets/{id}/sign"
    description: "Sign an OFFERED target against a budget; fiscal gate on available_cents"
    roles: [GeneralManager]
    code: 200
    input: [budget_id]
    output: FreeAgentTarget
    side_effects: ["target OFFERED -> SIGNED", "budget committed/available/posture recomputed", "budget.version incremented by 1"]

  - method: POST
    path: "/scouting/free-agent-targets/{id}/release"
    description: "Release a SIGNED target; compensating action restoring budget commitment"
    roles: [GeneralManager]
    code: 200
    input: []
    output: FreeAgentTarget
    side_effects: ["target SIGNED -> RELEASED", "budget committed/available/posture recomputed", "budget.version incremented by 1"]

  - method: POST
    path: "/scouting/free-agent-targets/{id}/pass"
    description: "Pass on a non-terminal target"
    roles: [GeneralManager]
    code: 200
    input: []
    output: FreeAgentTarget
    side_effects: ["target -> PASSED"]

  - method: POST
    path: "/scouting/budgets"
    description: "Create a season budget"
    roles: [GeneralManager]
    code: 201
    input: [season_year, base_cap_cents, rollover_cents]
    output: Budget
    side_effects: []

  - method: GET
    path: "/scouting/budgets/{id}"
    description: "Fetch one budget"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: []
    output: Budget
    side_effects: []

  - method: POST
    path: "/scouting/budgets/{id}/adjustments"
    description: "Adjust rollover_cents by a signed delta; OCC-guarded on budget version; result must keep available_cents >= 0"
    roles: [GeneralManager]
    code: 200
    input: [rollover_delta_cents, expected_budget_version]
    output: Budget
    side_effects: ["rollover_cents updated", "available_cents and posture recomputed", "budget.version incremented by 1"]

  - method: POST
    path: "/scouting/prospects/{id}/interviews"
    description: "Schedule an interview; blocked by open flag review (safety) and by half-open overlap with the prospect's SCHEDULED sessions"
    roles: [AreaScout, ScoutingDirector]
    code: 201
    input: [start_at, end_at, location]
    output: InterviewSession
    side_effects: []

  - method: POST
    path: "/scouting/interviews/{id}/cancel"
    description: "Cancel a SCHEDULED interview, freeing the calendar slot"
    roles: [AreaScout, ScoutingDirector]
    code: 200
    input: []
    output: InterviewSession
    side_effects: ["session SCHEDULED -> CANCELLED"]

  - method: GET
    path: "/scouting/prospects/{id}/interviews"
    description: "List interviews of a prospect"
    roles: [GeneralManager, ScoutingDirector, AreaScout, MedicalStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterviewSession[]
    side_effects: []

  - method: POST
    path: "/scouting/facilities"
    description: "Register a facility"
    roles: [GeneralManager]
    code: 201
    input: [name, capacity]
    output: Facility
    side_effects: []

  - method: GET
    path: "/scouting/facilities/{id}"
    description: "Fetch one facility"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/scouting/facilities/{id}/bookings"
    description: "Book a facility; requires a 30-minute buffer against existing bookings on the same facility"
    roles: [GeneralManager, ScoutingDirector]
    code: 201
    input: [start_at, end_at, purpose]
    output: FacilityBooking
    side_effects: []

  - method: GET
    path: "/scouting/facilities/{id}/bookings"
    description: "List bookings of a facility"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: FacilityBooking[]
    side_effects: []

  - method: POST
    path: "/scouting/prospects/{id}/outcomes"
    description: "Record a post-draft outcome season for a DRAFTED prospect"
    roles: [GeneralManager]
    code: 201
    input: [season_year, games_started, pro_bowl, outcome_percentile]
    output: OutcomeRecord
    side_effects: []

  - method: GET
    path: "/scouting/prospects/{id}/outcomes"
    description: "List outcome records of a prospect"
    roles: [GeneralManager, ScoutingDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: OutcomeRecord[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID missing or role undeclared"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted on endpoint, or entity_backed identity scout level mismatch"
  - id: ERR_REPORT_NOT_OWNED
    http: 403
    condition: "Submit / video-tag attempt by a scout other than the report author"
  - id: ERR_FLAG_ACCESS_DENIED
    http: 403
    condition: "MEDICAL flag created by non-MedicalStaff, or CHARACTER flag created by MedicalStaff"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, bad type, bad enum value, or end <= start"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not permitted from the entity's current state"
  - id: ERR_BOARD_NOT_OPEN
    http: 409
    condition: "Entry add / reorder attempted on a FROZEN or FINALIZED board"
  - id: ERR_BOARD_EMPTY
    http: 409
    condition: "Finalize attempted with active_entry_count == 0"
  - id: ERR_TARGET_NOT_OFFERED
    http: 409
    condition: "Sign attempted on a target not in OFFERED state"
  - id: ERR_PROSPECT_NOT_BOARD_READY
    http: 409
    condition: "Entry add attempted for a prospect whose evaluation_status != BOARD_READY"
  - id: ERR_PROSPECT_EXCLUDED
    http: 409
    condition: "Entry add attempted for a prospect whose flag_status == EXCLUDED"
  - id: ERR_NO_ROSTER_NEED
    http: 409
    condition: "Advance to APPROVED without an OPEN RosterNeed matching position + season_year"
  - id: ERR_OUTCOME_NOT_DRAFTED
    http: 409
    condition: "Outcome record attempted for a prospect whose evaluation_status != DRAFTED"
  - id: ERR_FLAG_REVIEW_OPEN
    http: 409
    condition: "Interview scheduling while prospect.flag_status == UNDER_REVIEW"
  - id: ERR_DUPLICATE_REPORT
    http: 409
    condition: "Second ScoutingReport for the same (scout_id, prospect_id)"
  - id: ERR_RANK_OUT_OF_BOUNDS
    http: 422
    condition: "new_rank outside [1, active_entry_count] or entry_id not an active entry of the board"
  - id: ERR_GRADE_OUT_OF_RANGE
    http: 422
    condition: "raw_grade outside [1.00, 9.00] or scheme_fit outside [0.00, 1.50] or more than 2 decimals"
  - id: ERR_WEIGHT_INVALID
    http: 422
    condition: "new_weight <= 0"
  - id: ERR_INTERVIEW_OVERLAP
    http: 409
    condition: "New session overlaps a SCHEDULED session of the same prospect (half-open adjacency allowed)"
  - id: ERR_FACILITY_BUFFER_CONFLICT
    http: 409
    condition: "New booking leaves less than a 30-minute gap against an existing booking on the same facility"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "Sign hit exceeds available_cents, or adjustment would drive available_cents below 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: AreaScout
    description: "Field scout; authors reports and video tags, raises CHARACTER flags, schedules interviews"
    identity: "entity_backed:Scout"
    exclusive_operations:
      - "POST /scouting/prospects/{id}/reports"
      - "POST /scouting/reports/{id}/submit"
      - "POST /scouting/reports/{id}/video-tags"
    shared_operations:
      - "POST /scouting/prospects"
      - "POST /scouting/prospects/{id}/flags (CHARACTER only)"
      - "POST /scouting/prospects/{id}/interviews"
      - "POST /scouting/interviews/{id}/cancel"
      - "GET reads"

  - name: ScoutingDirector
    description: "Director of scouting; reviews/returns/locks reports, owns the draft board, escalates flags, sets weights"
    identity: "entity_backed:Scout"
    exclusive_operations:
      - "POST /scouting/reports/{id}/return"
      - "POST /scouting/reports/{id}/lock"
      - "POST /scouting/draft-boards and all board mutations/freeze/unfreeze/finalize"
      - "POST /scouting/flags/{id}/escalate"
      - "POST /scouting/scouts/{id}/weight"
      - "POST /scouting/prospects/{id}/advance"
    shared_operations:
      - "POST /scouting/prospects"
      - "POST /scouting/prospects/{id}/flags (CHARACTER only)"
      - "POST /scouting/flags/{id}/acknowledge, resolve (CHARACTER)"
      - "POST /scouting/prospects/{id}/interviews"
      - "GET reads"

  - name: MedicalStaff
    description: "Team medical staff; sole owner of MEDICAL flag content"
    identity: "opaque"
    exclusive_operations:
      - "POST /scouting/prospects/{id}/flags (MEDICAL only)"
      - "POST /scouting/flags/{id}/acknowledge, resolve (MEDICAL)"
    shared_operations:
      - "GET reads (sees MEDICAL detail unredacted)"

  - name: GeneralManager
    description: "Front office; owns scouts registry, budgets, free-agency targets, roster needs, facilities, draft/outcome recording"
    identity: "opaque"
    exclusive_operations:
      - "POST /scouting/scouts"
      - "POST /scouting/budgets and adjustments"
      - "POST /scouting/free-agent-targets and all target actions"
      - "POST /scouting/roster-needs and close"
      - "POST /scouting/facilities"
      - "POST /scouting/prospects/{id}/mark-drafted"
      - "POST /scouting/prospects/{id}/outcomes"
    shared_operations:
      - "POST /scouting/facilities/{id}/bookings"
      - "GET reads"
