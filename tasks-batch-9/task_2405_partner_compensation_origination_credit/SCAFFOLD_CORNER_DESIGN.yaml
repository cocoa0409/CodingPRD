            - call: "POST /comp/credit-claims/${cl2}/adjudicate"
              payload: { decision: "ALLOCATE", approved_pct: 40.00, expected_matter_version: "${mv2}" }
              as: CreditArbiter
              as_user_id: "${arb}"
              captures: { s2: "$.data.state" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { pct2: "$.data.origination_pct_assigned" }
          assert:
            - "${s1} == ALLOCATED with HTTP 200 and ${pct1} == 60.00"
            - "${s2} == ALLOCATED with HTTP 200 - the sum reaching exactly 100.00 is accepted"
            - "${pct2} == 100.00"
            - "GET /comp/matters/${m}/credit-allocations with credit_role ORIGINATING returns exactly 2 ACTIVE rows, at 60.00 for ${p1} and 40.00 for ${p2}"
            - "neither adjudication returned ERR_CREDIT_INTERVAL_OVERSUBSCRIBED"

      - name: state_check_outranks_the_occ_check_on_an_already_allocated_claim
        claim_type: Priority Ordering
        grounds:
          - validations[priority=70]
          - validations[priority=80]
          - errors[ERR_CLAIM_NOT_ADJUDICABLE]
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[claim-adjudicate-stale-matter]
        distinguishing_aspect: |
          Replaying an adjudication on an already-ALLOCATED claim with the pre-allocation
          matter version violates both the priority-70 state rule and the priority-80 OCC
          rule; the ladder returns ERR_CLAIM_NOT_ADJUDICABLE 409, not ERR_STALE_VERSION 412,
          and the same stale version against a still-SUBMITTED sibling claim does produce
          412 - proving the ordering rather than a missing OCC check.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE."
            - "Partners P1 and P2 have each filed and submitted a NEW_CLIENT claim on the same OPEN Matter M; the pre-adjudication matter version is captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
