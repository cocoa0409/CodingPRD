          - errors[ERR_CONVERSATION_CLOSED]
          - errors[ERR_NOT_A_PATRON_OF_CREATOR]
        distinguishing_aspect: "A patron with no ACTIVE/PAUSED pledge posts to a CLOSED conversation: state check (priority 7, ERR_CONVERSATION_CLOSED) outranks the messaging-gate safety check (priority 10, ERR_NOT_A_PATRON_OF_CREATOR) — a state vs business_safety pairing."
        test_recipe:
          setup:
