    roles: [ComplianceReviewer]
    code: 201
    input: [completed_at, attendee_count]
    output: Agency
    side_effects: ["training_status = CURRENT; training_expires_at = completed_at + 365 days", "recomputes eligibility_posture and ServiceArea.eligible_agency_count", "increments Agency.version by 1"]

  - method: GET
    path: "/efap/agencies/{agency_id}/allocations"
    description: "Lists every AgencyAllocation held by this agency across cycles."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: AgencyAllocation[]
    side_effects: []

  - method: POST
    path: "/efap/compliance-sweeps"
    description: "Ops-run checkpoint over every agency: expires agreements past agreement_end_date, lapses training at or after training_expires_at, and terminates agreements 90 days past expiry (cancelling that agency's DRAFT and SUBMITTED orders). Returns the agencies it changed."
    roles: [StateAdmin]
    code: 200
    input: []
    output: Agency[]
    side_effects: ["Agency.agreement_status and training_status per §1.2", "recomputes eligibility_posture for every touched agency", "recomputes ServiceArea.eligible_agency_count", "conditional cascade: DRAFT and SUBMITTED CommodityOrders of terminated agencies -> CANCELLED", "increments the version of every touched Agency by 1"]

