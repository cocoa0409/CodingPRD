            - "${staff_fin} == ADEQUATE and ${adults_fin} == 2  (confirmed == required flips to ADEQUATE — inclusive threshold)"
      - name: soft_delete_family_list_filter
        claim_type: soft_delete
        grounds:
          - entities.Family.fields.status
          - "endpoints: GET /vbs/families"
        distinguishing_aspect: "Archived families are soft-deleted: excluded from GET /vbs/families by default, included with include_archived=true, and still directly addressable by id."
        test_recipe:
          setup: ["Families F1 (archived) and F2 (active)"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "F1", primary_contact_name: "P One", email: "f1@example.com", phone: "555-0101" }, as: Anonymous, captures: { f1: $.data.id } }
            - { call: "POST /vbs/families", payload: { household_name: "F2", primary_contact_name: "P Two", email: "f2@example.com", phone: "555-0102" }, as: Anonymous, captures: { f2: $.data.id } }
            - { call: "POST /vbs/families/${f1}/archive", payload: {}, as: RegistrationCoordinator }
          trigger:
            - { call: "GET /vbs/families", payload: {}, as: RegistrationCoordinator }
            - { call: "GET /vbs/families", payload: { include_archived: true }, as: RegistrationCoordinator }
            - { call: "GET /vbs/families/${f1}", payload: {}, as: RegistrationCoordinator, captures: { f1_status: $.data.status } }
          assert:
            - "default list returns exactly 1 row (F2 only)"
            - "include_archived=true returns exactly 2 rows"
            - "${f1_status} == ARCHIVED  (direct GET still resolves the soft-deleted row)"
      - name: offer_expiry_sweep_deferred_action
        claim_type: scheduled_actions
        grounds:
          - state_machines.Registration.OFFERED_to_EXPIRED
          - "endpoints: POST /vbs/programs/{program_id}/sweep-expired-offers"
        distinguishing_aspect: "The deferred expiry fires only when the ops-run sweep executes after the TTL: B's offer (expires 2026-08-03T00:00:00Z) is still OFFERED before the sweep, and the sweep at 2026-08-04 flips it EXPIRED and promotes C with expiry 2026-08-06T00:00:00Z."
        test_recipe:
          setup:
            - "Program Alpha REGISTRATION_OPEN (ttl 48h); Koalas (cap 1): A ENROLLED, B and C WAITLISTED; A cancelled so B is OFFERED expiring 2026-08-03T00:00:00Z; clock advanced to 2026-08-04T00:00:00Z; program version captured"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 1 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_b: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: ProgramDirector }
            - { call: "GET /vbs/registrations/${reg_b}", payload: {}, as: RegistrationCoordinator, captures: { b_pre: $.data.status } }
          trigger:
            - { call: "GET /vbs/programs/${prog_id}", payload: {}, as: RegistrationCoordinator, captures: { prog_v: $.data.version } }
            - { call: "POST /vbs/programs/${prog_id}/sweep-expired-offers", payload: { expected_program_version: "${prog_v}" }, as: RegistrationCoordinator }
            - { call: "GET /vbs/registrations/${reg_b}", payload: {}, as: RegistrationCoordinator, captures: { b_post: $.data.status } }
            - { call: "GET /vbs/registrations/${reg_c}", payload: {}, as: RegistrationCoordinator, captures: { c_post: $.data.status, c_exp: $.data.offer_expires_at } }
          assert:
            - "${b_pre} == OFFERED  (expiry is deferred until the sweep runs, not wall-clock automatic)"
            - "${b_post} == EXPIRED"
            - "${c_post} == OFFERED and ${c_exp} == 2026-08-06T00:00:00Z  (sweep promotes the next head from the sweep's now)"
      - name: derived_enrolled_count_reconciles_after_cancel
