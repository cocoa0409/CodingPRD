        distinguishing_aspect: "The accumulator has a floor of zero: on an asset carrying only a 10000 REVENUE_OFFSET (accumulated -10000 is impossible to reach because the offset itself would have been rejected) — pinned: with accumulated 0, a REVERSAL of 1 cent is the minimal violation; after a 60000 COST, a REVERSAL of 60001 also fails while 60000 succeeds."
