            - call: "POST /efficiency/complaints"
              payload: { customer_id: "${cust_id}", contractor_id: "${ctr_id}", category: "WORKMANSHIP", severity: "HIGH", description: "Bad install" }
              as: ProgramManager
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /efficiency/complaints/${complaint_id}/escalate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/complaints/${complaint_id}/resolve"
              payload: {}
              as: ProgramManager
          assert:
            - "Complaint traversed OPEN -> ESCALATED -> RESOLVED (skipping IN_REVIEW)"
            - "Resolve from ESCALATED is a legal transition (different fork than IN_REVIEW -> RESOLVED)"

  # ===========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_cascades_to_contractor_suspension
        grounds:
          - state_machines.Inspection.SCHEDULED_to_RECORDED
          - state_machines.Project.INSPECTING_to_REMEDIATION
          - state_machines.Contractor.APPROVED_to_SUSPENDED
          - state_machines.Lead.OFFERED_to_EXPIRED
        distinguishing_aspect: |
          Depth-3 cascade triggered by FAIL inspection: Inspection.record(outcome=FAIL)
          -> (link 1) Project transitions INSPECTING -> REMEDIATION AND Contractor.qa_score_bps
          recomputed -> (link 2) because qa_score_bps < QA_SUSPENSION_THRESHOLD_BPS, Contractor
          auto-transitions APPROVED -> SUSPENDED -> (link 3) every OFFERED Lead assigned
          to this contractor cascades to EXPIRED. Each link caused by previous link, not
          the original FAIL.
        test_recipe:
          setup:
            - "Program ACTIVE, contractor APPROVED with HVAC cert, second lead OFFERED to contractor"
            - "First project progressed to INSPECTING with scheduled inspection"
            - "Contractor qa_score_bps seeded low enough that one more FAIL pushes below suspension threshold (use 1 prior FAIL with score_bps 1000)"
          setup_api_calls:
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/programs"
              payload: { code: "P-CAS", name: "Cascade", sector: "RESIDENTIAL", budget_cents: 500000, avoided_kwh_target: 10000, trc_threshold: 1.0 }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /efficiency/programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/contractors"
              payload: { legal_name: "CCas", license_number: "L-CAS", sector: "RESIDENTIAL", service_zip_codes: ["94110"] }
              as: ProgramManager
              captures: { ctr_id: $.data.id }
            - call: "POST /efficiency/certifications"
              payload: { contractor_id: "${ctr_id}", measure_type: "HVAC", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/contractors/${ctr_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /efficiency/customers"
              payload: { full_name: "Cas", email: "cas@x.com", service_zip: "94110", sector: "RESIDENTIAL", utility_account_id: "UA-CAS" }
              as: ProgramManager
              captures: { cust_id: $.data.id }
            - call: "POST /efficiency/leads"
              payload: { customer_id: "${cust_id}", program_id: "${prog_id}", measure_type: "HVAC", estimated_annual_kwh_savings: 1000, source_channel: "WEB" }
              as: ProgramManager
              captures: { lead1_id: $.data.id, lead1_v0: $.data.version }
            - call: "POST /efficiency/leads/${lead1_id}/distribute"
              payload: { expected_lead_version: "${lead1_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/leads/${lead1_id}/accept"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/projects"
              payload: { lead_id: "${lead1_id}", customer_id: "${cust_id}", contractor_id: "${ctr_id}", program_id: "${prog_id}", measure_type: "HVAC", measure_cost_cents: 100000, estimated_annual_kwh_savings: 1000, incentive_recipient: "CONTRACTOR" }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /efficiency/projects/${proj_id}/approve"
              payload: { expected_program_version: "${prog_v0}" }
              as: ProgramManager
            - call: "POST /efficiency/projects/${proj_id}/work_orders"
              payload: { contractor_id: "${ctr_id}", scheduled_on: "2026-08-02T00:00:00Z", duration_hours: 4 }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /efficiency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: ProgramManager
            - call: "POST /efficiency/work_orders/${wo_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspectors"
              payload: { full_name: "ICas", license_number: "I-CAS", excluded_contractor_ids: [] }
              as: ProgramManager
              captures: { insp_id: $.data.id }
            - call: "POST /efficiency/work_orders/${wo_id}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /efficiency/inspections"
              payload: { work_order_id: "${wo_id}", project_id: "${proj_id}", inspector_id: "${insp_id}", scheduled_on: "2026-08-03T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins1_id: $.data.id }
            - call: "POST /efficiency/inspections/${ins1_id}/record"
              payload: { outcome: "FAIL", score_bps: 1000, failure_reasons: ["BAD_SEAL"] }
              as: Inspector
