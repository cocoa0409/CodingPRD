  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: applicability_build_revision_closed_interval_adjacency_allowed
        grounds:
          - validations[priority=15]
          - entities.PartApplicability.fields.effective_from_build_revision
          - entities.PartApplicability.fields.effective_to_build_revision
          - errors[ERR_APPLICABILITY_REVISION_OVERLAP]
        distinguishing_aspect: |
          Interval semantics A, on the EquipmentModel resource: integer CLOSED intervals where
          adjacency is legal. [200,300] collides with the existing [100,200] because 200 is a
          shared endpoint, [201,300] is accepted because closed intervals may touch at
          endpoint+1, and a null upper bound behaves as +infinity so [500,600] collides with
          the open-ended [400,null].
        test_recipe:
          setup:
            - "one equipment model and one part"
            - "one ACTIVE PartApplicability for that pair covering build revisions 100..200 with qty_per_unit 1"
          setup_api_calls:
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-H10", name: "Hauler H10", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "IVL-1", description: "Interval probe part", unit_cost_cents: 1000, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 100, effective_to_build_revision: 200, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa1_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 200, effective_to_build_revision: 300, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err_touch: $.data.error_id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 201, effective_to_build_revision: 300, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa2_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 400, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { pa3_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 500, effective_to_build_revision: 600, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err_open: $.data.error_id }
          assert:
            - "the [200,300] call returns HTTP 409 with data.error_id == ERR_APPLICABILITY_REVISION_OVERLAP"
            - "the [201,300] call returns HTTP 201 and PartApplicability.${pa2_id}.applicability_status == ACTIVE"
            - "the [400,null] call returns HTTP 201 and PartApplicability.${pa3_id}.effective_to_build_revision == null"
            - "the [500,600] call returns HTTP 409 with data.error_id == ERR_APPLICABILITY_REVISION_OVERLAP"
            - "GET /aftermarket/part-applicabilities?part_id=${p_id}&model_id=${m_id} returns total_count == 3"

      - name: ltb_window_half_open_with_symmetric_thirty_day_cooldown
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - entities.LastTimeBuyCampaign.fields.ltb_window_start
          - errors[ERR_LTB_WINDOW_OVERLAP]
          - errors[ERR_LTB_COOLDOWN_VIOLATION]
        distinguishing_aspect: |
          Interval semantics B, on the Part resource and geometrically unlike semantics A:
          datetime HALF-OPEN windows plus a symmetric 30-day buffer, so adjacency is FORBIDDEN.
          [2026-09-15, 2026-10-15) intersects and yields ERR_LTB_WINDOW_OVERLAP;
          [2026-10-25, 2026-11-25) does not intersect but sits inside the buffer and yields
          ERR_LTB_COOLDOWN_VIOLATION; [2026-10-31, 2026-11-30) starts exactly at other_end + 30d
          and is accepted.
        test_recipe:
          setup:
            - "part WNDW-1 in PHASE_OUT with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units (no installed units exist)"
            - "one LastTimeBuyCampaign on that part in status SUBMITTED whose window is [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
            - "no other campaign exists on the part, and rejected creates mutate nothing, so the captured Part.version stays valid across the three trigger calls"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "WNDW-1", description: "Window geometry probe part", unit_cost_cents: 1000, lead_time_days: 30, weight_kg: 1.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v1: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v1}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { cA_id: $.data.id }
            - call: "POST /aftermarket/last-time-buy-campaigns/${cA_id}/submit"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-09-15T00:00:00Z", ltb_window_end: "2026-10-15T00:00:00Z", expected_part_version: "${p_v2}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-10-25T00:00:00Z", ltb_window_end: "2026-11-25T00:00:00Z", expected_part_version: "${p_v2}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err_cooldown: $.data.error_id }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 5, ltb_window_start: "2026-10-31T00:00:00Z", ltb_window_end: "2026-11-30T00:00:00Z", expected_part_version: "${p_v2}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { cB_id: $.data.id }
          assert:
            - "the [2026-09-15, 2026-10-15) call returns HTTP 409 with data.error_id == ERR_LTB_WINDOW_OVERLAP"
            - "the [2026-10-25, 2026-11-25) call returns HTTP 409 with data.error_id == ERR_LTB_COOLDOWN_VIOLATION"
            - "the [2026-10-31, 2026-11-30) call returns HTTP 201 and LastTimeBuyCampaign.${cB_id}.status == DRAFT"
            - "LastTimeBuyCampaign.${cA_id}.status == SUBMITTED throughout (a DRAFT create never supersedes a SUBMITTED campaign)"
            - "GET /aftermarket/last-time-buy-campaigns?part_id=${p_id} returns total_count == 2"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: physical_unit_conservation_consume_then_restock_return
        grounds:
          - state_machines.WorkOrderPartLine.RESERVED_to_CONSUMED
          - state_machines.ReturnAuthorization.RECEIVED_to_CREDITED
          - entities.StockLedgerEntry.fields.delta_units
          - entities.Part.fields.quarantine_units
        distinguishing_aspect: |
          Conserved quantity 1 — PHYSICAL UNITS. The invariant
          Part.on_hand_units + Part.quarantine_units == sum(StockLedgerEntry.delta_units)
          holds after every hop, and the consume/RESTOCK-return pair returns on_hand_units to
          exactly 100 with zero drift and exactly three ledger rows (+100, -7, +7).
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer, one ACTIVE installed unit and an ACTIVE applicability row from build revision 0"
            - "part CONS-1 with 100 units received, one line of qty 7 consumed at 2026-08-01T00:00:00Z"
            - "the logical clock advanced to 2026-08-11T00:00:00Z, and an APPROVED-then-RECEIVED RMA for all 7 units"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "DESIRABLE", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
              as: PricingAnalyst
              as_user_id: "pricing-1"
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-CONS", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/equipment-models"
              payload: { model_code: "EM-I10", name: "Irrigator I10", production_end_date: "2025-01-01T00:00:00Z", support_end_date: "2035-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
            - call: "POST /aftermarket/installed-units"
              payload: { model_id: "${m_id}", dealer_id: "${d_id}", serial_number: "SN-I101", build_revision: 100, commission_date: "2025-06-01T00:00:00Z", region: "NA" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { u_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "CONS-1", description: "Conservation probe part", unit_cost_cents: 1333, lead_time_days: 30, weight_kg: 2.0 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/part-applicabilities"
              payload: { part_id: "${p_id}", model_id: "${m_id}", effective_from_build_revision: 0, qty_per_unit: 1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/replenishment-orders"
              payload: { part_id: "${p_id}", order_type: "STOCK", qty: 100 }
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { ro_id: $.data.id }
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/approve"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/ship"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/replenishment-orders/${ro_id}/receive"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "POST /aftermarket/work-orders"
              payload: { installed_unit_id: "${u_id}", work_type: "SCHEDULED_MAINTENANCE", downtime_priority: "PLANNED" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /aftermarket/work-orders/${wo_id}/part-lines"
              payload: { part_id: "${p_id}", qty_requested: 7 }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { line_id: $.data.id }
            - call: "POST /aftermarket/work-order-part-lines/${line_id}/consume"
              payload: { qty_consumed: 7 }
              as: DealerUser
              as_user_id: "${d_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /aftermarket/return-authorizations"
              payload: { work_order_part_line_id: "${line_id}", qty_returned: 7, return_reason: "UNUSED_SURPLUS" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /aftermarket/return-authorizations/${rma_id}/approve"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/return-authorizations/${rma_id}/receive"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /aftermarket/return-authorizations/${rma_id}/inspect"
              payload: { disposition: "RESTOCK" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "Part.${p_id}.on_hand_units == 100"
            - "Part.${p_id}.quarantine_units == 0"
            - "Part.${p_id}.allocated_units == 0 and Part.${p_id}.available_units == 100"
            - "GET /aftermarket/parts/${p_id}/ledger-entries returns total_count == 3 with delta_units 100, -7, 7 in occurred_at order"
            - "the sum of StockLedgerEntry.delta_units for ${p_id} == 100 == Part.on_hand_units + Part.quarantine_units"
            - "the last ledger row has entry_type RETURN_RECEIPT and balance_after_units == 100"
            - "no StockLedgerEntry was appended by the RESTOCK inspection itself"
            - "ReturnAuthorization.${rma_id}.status == CREDITED and disposition == RESTOCK"

      - name: campaign_entitlement_conservation_grant_then_withdraw
        grounds:
          - calculations.dealer_allocation_waterfall
          - state_machines.AllocationRequest.GRANTED_to_WITHDRAWN
          - entities.LastTimeBuyCampaign.fields.remaining_qty
          - entities.AllocationRequest.fields.granted_units
        distinguishing_aspect: |
          Conserved quantity 2 — ALLOCATION ENTITLEMENT, a different kind of quantity from
          physical stock. The invariant approved_qty == remaining_qty + sum(granted_units over
          GRANTED and PARTIALLY_GRANTED) reads 100 == 40 + 60 after the waterfall and
          100 == 100 + 0 after the compensating withdraw, with zero drift.
        test_recipe:
