              payload: { email: "ana@civic.example", display_name: "Ana Reuser", organization: "Civic Data Lab" }
              as: Anonymous
              captures: { mem_id: "$.data.id" }
            - call: "POST /open-data/quality-issues"
              payload: { dataset_id: "${ds_id}", reporter_member_id: "${mem_id}", severity: "MEDIUM", category: "ACCURACY", description: "Counts for two corridors disagree with the signal logs" }
              as: CommunityMember
              as_user_id: "${mem_id}"
              captures: { iss_id: "$.data.id" }
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/ops-run"
              as: PortalAdmin
