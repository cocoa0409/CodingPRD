  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_preserves_total_outstanding_plus_applied
        grounds:
          - state_machines.Payment.transitions.APPLIED_to_REVERSED
          - entities.Loan.fields.principal_balance_cents
          - entities.Loan.fields.accrued_interest_cents
        distinguishing_aspect: |
          Conserved quantity Q1 — Loan.principal_balance_cents +
          Loan.accrued_interest_cents + sum over APPLIED Payments of
          (principal_applied_cents + interest_applied_cents) is invariant
          within a status window. Applying then reversing a Payment leaves
          Q1 unchanged. (Money-balance conservation; cents.)
        test_recipe:
          setup:
            - "Loan in REPAYMENT, principal=1_000_000 cents, accrued=0"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Inv1", ssn_last4: "0080", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1000000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 50000, payment_date: "2026-06-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /loan-servicing/payments/${pay_id}/apply"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/payments/${pay_id}/reverse"
              payload: {}
              as: LoanServicer
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_bal: $.data.principal_balance_cents, ln_int: $.data.accrued_interest_cents }
          assert:
            - "${ln_bal} == 1000000"
            - "${ln_int} == 0"

      - name: pslf_count_excludes_reversed_payments_invariant
        grounds:
          - calculations.pslf_qualifying_count
          - state_machines.Payment.transitions.APPLIED_to_REVERSED
          - entities.Loan.fields.pslf_qualifying_payment_count
        distinguishing_aspect: |
          Different conserved quantity (Q2 — a counter, not a money sum):
          Loan.pslf_qualifying_payment_count must equal the number of
          APPLIED qualifying payments. Applying a qualifying payment then
          reversing it must return the count to its prior value.
        test_recipe:
          setup:
            - "Borrower with CERTIFIED GOVERNMENT QualifyingEmployment, Loan REPAYMENT with ACTIVE STANDARD plan; pslf_qualifying_payment_count == 0 before payment"
          setup_api_calls:
