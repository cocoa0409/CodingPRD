scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_listing_returns_201_with_defaults_from_brokerage
        claim_type: Creation
        grounds: [entities.Listing, endpoints.POST_/listings]
        distinguishing_aspect: "POST /listings omitting total_commission_pct/coop_split_pct copies the brokerage defaults (0.06, 0.50) and returns 201 with status=DRAFT, offer_posture=NONE."
        test_recipe:
          setup: ["A brokerage with defaults 0.06/0.50 and an ACTIVE listing agent exist."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3001" }
              as: Anonymous
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "100 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
          assert:
            - "Response code 201; status == DRAFT; offer_posture == NONE"
            - "total_commission_pct == 0.06 and coop_split_pct == 0.50 (defaulted from brokerage)"
            - "version == 1, id present"

      - name: get_listing_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Listing, "endpoints.GET_/listings/{listingId}"]
        distinguishing_aspect: "GET /listings/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND (404)"

      - name: create_offer_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Offer, "endpoints.POST_/listings/{listingId}/offers"]
        distinguishing_aspect: "POST /listings/{id}/offers omitting initial_price_cents (required, no default) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["ACTIVE listing and a buyer exist."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3002" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3003" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "101 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB1" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION (422) — initial_price_cents missing"

      - name: buyer_default_prequalified_and_debt_zero
        claim_type: Defaults
        grounds: [entities.Buyer.fields.prequalified_amount_cents, entities.Buyer.fields.monthly_debt_cents, endpoints.POST_/buyers]
        distinguishing_aspect: "POST /buyers omitting prequalified_amount_cents and monthly_debt_cents applies defaults 0 and 0."
        test_recipe:
          setup: ["A buyer agent exists."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3004" }
              as: Anonymous
              captures: { ba_id: $.data.id }
          trigger:
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
          assert:
            - "prequalified_amount_cents == 0 and monthly_debt_cents == 0 (defaults applied)"

      - name: offer_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Offer.fields.current_price_cents, entities.Offer.fields.current_party, entities.Offer.fields.round_count]
        distinguishing_aspect: "On offer creation current_price_cents == initial_price_cents, current_party == SELLER, round_count == 0, regardless of any client-sent values for these computed fields."
        test_recipe:
          setup: ["ACTIVE listing and a buyer exist."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3005" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3006" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "102 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB2" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
          assert:
            - "current_price_cents == 49000000, current_party == SELLER, round_count == 0, status == OPEN"

      - name: agent_license_duplicate_rejected
        claim_type: Type Constraints
        grounds: [entities.Agent.fields.license_no, "validations[priority=12]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "A second POST /agents reusing an existing license_no returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["An agent with license_no 'DUP-1' exists."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "A", license_no: "DUP-1" }
              as: Anonymous
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "B", license_no: "DUP-1" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE (409)"

      - name: parent_brokerage_must_exist_for_agent
        claim_type: Parent Relationships
        grounds: [entities.Agent.fields.brokerage_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /agents with a non-existent brokerage_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /agents"
              payload: { brokerage_id: "00000000-0000-0000-0000-000000000000", full_name: "X", license_no: "C-3007" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND (404)"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: new_listing_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.Listing.initial_state]
        distinguishing_aspect: "A freshly created Listing has status == DRAFT."
        test_recipe:
          setup: ["A brokerage and listing agent exist."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3008" }
              as: Anonymous
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "103 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { st: $.data.status }
          assert:
            - "status == DRAFT"

      - name: activate_without_lockbox_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Listing.transitions.DRAFT_to_ACTIVE, "errors[ERR_NO_LOCKBOX]"]
        distinguishing_aspect: "Activating a DRAFT listing with no INSTALLED lockbox returns ERR_NO_LOCKBOX (409)."
        test_recipe:
          setup: ["A DRAFT listing with no lockbox."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3009" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "104 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
          trigger:
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NO_LOCKBOX (409)"

      - name: counter_on_draft_listing_offer_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Offer.transitions.OPEN_to_SELLER_COUNTERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Countering an offer when the listing is not ACTIVE (precondition Listing.status==ACTIVE) returns ERR_INVALID_STATE; covered here by withdrawing the listing then countering."
        test_recipe:
          setup: ["A listing had an OPEN offer, then the listing was WITHDRAWN (offer auto-REJECTED)."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3010" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3011" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "105 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB5" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /listings/${lst_id}/withdraw"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 50000000, actor_agent_id: "${la_id}" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (409) — offer was auto-REJECTED when listing withdrew"

      - name: closed_listing_is_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Listing.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a CLOSED listing returns ERR_INVALID_STATE (409) — CLOSED is terminal."
        test_recipe:
          setup: ["A CLOSED listing (no-contingency accepted offer, closed)."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3012" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3013" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "106 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB6" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: [] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v4: $.data.version }
            - call: "POST /listings/${lst_id}/close"
              payload: { expected_listing_version: "${v4}" }
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /listings/${lst_id}/withdraw"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (409)"

      - name: disable_lockbox_cancels_requested_showing_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Lockbox.transitions.INSTALLED_to_DISABLED, state_machines.ShowingAppointment.transitions.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Disabling a lockbox with a REQUESTED showing cascades the showing to CANCELLED."
        test_recipe:
          setup: ["ACTIVE listing, lockbox INSTALLED, one REQUESTED showing on it."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3014" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3015" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "107 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB7" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /lockboxes/${lb_id}/showings"
              payload: { buyer_agent_id: "${ba_id}", buyer_id: "${buyer_id}", start_at: "2026-07-01T15:00:00Z", end_at: "2026-07-01T15:30:00Z" }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /lockboxes/${lb_id}/disable"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /showings/${sh_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { st: $.data.status }
          assert:
            - "Showing status == CANCELLED; Lockbox status == DISABLED"

      - name: second_accept_after_under_contract_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Offer.transitions.OPEN_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED offer a second time returns ERR_INVALID_STATE (409) (offer terminal)."
        test_recipe:
          setup: ["A listing with one ACCEPTED no-contingency offer (listing now PENDING)."]
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "C-3016" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "C-3017" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "108 Corner St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "C-LB8" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v2: $.data.version }
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 50000000, earnest_money_cents: 0, requested_contingencies: [] }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${v2}" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { v4: $.data.version }
          trigger:
            - call: "POST /offers/${off_id}/accept"
              payload: { expected_listing_version: "${v4}" }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (409) — offer already ACCEPTED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: offer_posture_two_live_offers_is_multiple
        claim_type: Correct Result
        grounds: [calculations.listing_offer_posture, entities.Listing.fields.offer_posture]
        distinguishing_aspect: "With two OPEN offers on one ACTIVE listing, offer_posture == MULTIPLE; with one, SINGLE."
        test_recipe:
          setup: ["ACTIVE listing with two OPEN offers from two buyer agents."]
          setup_api_calls:
            - call: "POST /brokerages"
