              captures: { store_v2: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v2}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
