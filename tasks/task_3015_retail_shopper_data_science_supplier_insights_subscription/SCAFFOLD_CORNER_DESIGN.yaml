              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-14"
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 1000 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_GRANT_EXPIRED (409): default clock 2026-09-01T00:00:00Z >= valid_until proves the fixed default, not wall-clock time"

      - name: segment_size_reconciled_at_submit
        claim_type: derived_field_reconciliation
        grounds: [calculations.segment_size, state_machines.AudienceSegment.DRAFT_to_PENDING_APPROVAL]
        distinguishing_aspect: "size is a denormalized field: computed at create (3), recomputed at submit after new ingest (5) — the submit-time value reflects the current panel, not the stale create-time value."
        test_recipe:
          setup:
            - "Account with ACTIVE contract, scope SNACKS, 3 SNACKS households, segment created (size 3)"
          setup_api_calls:
