        of a single PLATINUM winner once the Lisbon per-person basis of 431757 is stamped. Ana Reyes is
        reviewed before sourcing opens (so her committed cost is computed against a zero cost basis) while
        Ben Ortiz is created and deliberately left PENDING_REVIEW, keeping him outside the rollup input_set.
        The hotel contract carries a deposit schedule summing to exactly its 2310000-cent value.
