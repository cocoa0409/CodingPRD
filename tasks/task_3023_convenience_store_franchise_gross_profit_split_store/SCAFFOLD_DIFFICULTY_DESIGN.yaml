            - "Settlement.${setE_id}.franchisee_split_cents + Settlement.${setE_id}.franchisor_share_cents == Settlement.${setE_id}.gross_profit_cents after the resolution"
            - "GET /settlements/${setE_id} returns status RECONCILED and version strictly greater than the version observed before the dispute"
            - "POST /settlements/${setE_id}/resolve-dispute again returns 409 ERR_INVALID_STATE because the settlement is no longer DISPUTED"

      - name: store_transfer_denied_then_reopened_cycles_the_transfer_dimension
        grounds:
          - state_machines.Store.NONE_to_PENDING
          - state_machines.Store.PENDING_to_DENIED
          - state_machines.Store.DENIED_to_PENDING
          - entities.Store.fields.transfer_status
          - entities.Store.fields.transfer_target_franchisee_id
        distinguishing_aspect: |
          A second, independent non-linear machine on a different entity: Store.transfer_status runs
          NONE → PENDING → DENIED → PENDING, re-entering PENDING with a MISSING prior entry — DENIED
          is not terminal, unlike every terminal_state in the Store.status dimension, which only ever
          goes ACTIVE → TERMINATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z. One incumbent franchisee with an ACTIVE store and ACTIVE agreement at minimum_net_worth_cents 10000000, plus a separate ACTIVE transferee franchisee holding 30000000 stated cents."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
