          trigger:
            - call: "GET /ill/bib-items"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { p0_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { limit: 10, offset: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 5, offset: 0 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { f0_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 5, offset: 5 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { f1_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { issn: "3300-0001", item_type: "BOOK", limit: 10, offset: 0 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: {}
            - call: "POST /ill/bib-items"
              payload: { title: "Serial paper M", item_type: "ARTICLE", publication_year: 2025, issn: "3300-0001", journal_title: "Annals of Paging", local_holding_status: "NONE" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { a8: $.data.id }
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 5, offset: 5 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { f1b_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 100, offset: 8 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: {}
            - call: "GET /ill/bib-items"
              payload: { limit: 0 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { e_limit_low: $.data.error_id }
            - call: "GET /ill/bib-items"
              payload: { limit: 101 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { e_limit_high: $.data.error_id }
          assert:
            - "The unfiltered first call omits limit and offset and returns 10 rows with total_count 12, has_more true, limit 10 and offset 0 — the declared pagination defaults"
            - "The offset-10 page returns 2 rows with total_count 12 and has_more false; the twelve ids across the two pages are pairwise distinct and their union is exactly {${a1}..${a7}, ${b1}..${b5}}"
            - "With item_type ARTICLE, limit 5, offset 0: 5 rows, total_count 7, has_more true — total_count reports the filtered population and not the twelve rows in the table"
            - "With item_type ARTICLE, limit 5, offset 5: 2 rows, total_count 7, has_more false; every id on both filtered pages is one of ${a1}..${a7} and no BOOK row appears"
            - "The combination issn 3300-0001 with item_type BOOK returns an empty array with total_count 0 and has_more false — the two filters are conjunctive, not alternative"
            - "After ${a8} is created, the same item_type ARTICLE / limit 5 / offset 5 page reports total_count 8 with has_more true and returns 3 rows — the window is recomputed against the mutated filtered population"
            - "item_type ARTICLE with limit 100 and offset 8 returns an empty array with total_count 8 and has_more false — an offset at or past the filtered end is not an error"
            - "${e_limit_low} == ERR_INVALID_REQUEST and ${e_limit_high} == ERR_INVALID_REQUEST, both HTTP 400 — limit must lie in 1..100, and the bound is validated before any row is read"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_fully_visible_to_the_first_read_that_follows_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ill/supply-offers/{id}/accept]
          - entities.IllRequest.fields.net_patron_charge_cents
          - entities.Patron.fields.pending_charge_cents
          - entities.Partner.fields.borrow_payable_cents
          - calculations.patron_charge_assembly
        distinguishing_aspect: "The offer acceptance moves derived fields on three different entities at once, and each is read exactly once, immediately, with no repeat poll and no clock advance in between — including a filtered collection read whose predicate is the field the write had just set. Any lag on a denormalised counter, or any recompute deferred to the ops-run, fails this instance rather than merely delaying it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z and never advanced during the trigger."
            - "One patron, one partner NORTHU quoted at 2000 cents over 4 days, one LOAN rota, one BOOK BibItem not held locally."
            - "The ops-run is never invoked, so nothing below can be attributed to a sweep."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9063", full_name: "Ira Reader", email: "ira@u.edu", patron_type: "FACULTY", department: "HIST", max_open_requests: 5 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${partner_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Cartularies of Cluny", item_type: "BOOK", publication_year: 2011, isbn: "978-0-000-00086-8", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id, s0: $.data.status, net0: $.data.net_patron_charge_cents, attempts0: $.data.attempt_count }
            - call: "GET /ill/patrons/${patron_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { open0: $.data.open_request_count, pend0: $.data.pending_charge_cents }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id, o_seq: $.data.attempt_seq, o_eff: $.data.effective_fee_cents, o_landed: $.data.landed_cost_cents, o_status0: $.data.status }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { s1: $.data.status, attempts1: $.data.attempt_count, days1: $.data.days_available_at_source }
            - call: "POST /ill/supply-offers/${offer_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${partner_id}"
              captures: { o_status1: $.data.status }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { s2: $.data.status, cp: $.data.committed_partner_id, fee2: $.data.committed_fee_cents, period2: $.data.committed_loan_period_days, rush2: $.data.rush_surcharge_cents, gross2: $.data.gross_charge_cents, sub2: $.data.subsidy_cents, net2: $.data.net_patron_charge_cents }
            - call: "GET /ill/patrons/${patron_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { open2: $.data.open_request_count, pend2: $.data.pending_charge_cents }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { bcount2: $.data.borrowed_from_count, bpay2: $.data.borrow_payable_cents, imb2: $.data.net_borrow_imbalance_items }
            - call: "GET /ill/requests"
              payload: { committed_partner_id: "${partner_id}", status: "SUPPLY_COMMITTED" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "${s0} == SOURCING, ${attempts0} == 0 and ${net0} == 0 — the intake response already carries the computed charge fields at their pre-commitment values rather than omitting them"
            - "${open0} == 1 and ${pend0} == 0 — the patron counter reflects the intake on the very next read"
            - "${o_seq} == 1, ${o_eff} == 2000, ${o_landed} == 2000 and ${o_status0} == OFFERED — the sourcing response itself carries the landed cost it was selected on, with no lateness penalty because days_available 8 exceeds the quoted 4"
            - "${s1} == OFFER_PENDING, ${attempts1} == 1 and ${days1} == 8 — the attempt counter and the snapshot are visible immediately, not at the next sweep"
            - "${o_status1} == ACCEPTED"
            - "${s2} == SUPPLY_COMMITTED, ${cp} == ${partner_id}, ${fee2} == 2000, ${period2} == 28 and ${rush2} == 0"
            - "${gross2} == 2000, ${sub2} == 1600 and ${net2} == 400 — the whole charge assembly is settled by the time the first post-accept read returns"
            - "${open2} == 1 and ${pend2} == 400 — Patron.pending_charge_cents already matches the net charge written by the accept in the preceding request"
            - "${bcount2} == 1, ${bpay2} == 2000 and ${imb2} == 1 — all three partner balance fields moved within the accept, and the read that observes them is the first one issued afterwards"
            - "${listed_id} == ${req_id} with total_count 1 — a filtered collection read on committed_partner_id, the field the accept had just set, already matches; no re-read, retry or clock advance appears anywhere in this recipe"
