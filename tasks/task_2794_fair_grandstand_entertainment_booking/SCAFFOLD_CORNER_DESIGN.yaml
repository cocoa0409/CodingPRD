          The REFUNDING -> REFUNDED auto-close is driven by the computed liability, not
          by a separate call: cancelling an ANNOUNCED show that sold nothing yields
          refund_liability_cents 0, so the same request that sets ticketing_status to
          REFUNDING closes it to REFUNDED and leaves
          FairEdition.refund_liability_committed_cents at 0, while the scales still
          land on REFUND_DUE.
