          setup:
            - "Logical clock 2026-01-10T08:00:00Z; terminals TRM1 and TRM2; published NMFC-2026A with profile CP1."
            - "Customers ACME and BETA each with an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "ACME owns shipment PROR030 (origin TRM1, one 400 lb class 70 line, billed); BETA owns shipment PROR031 (origin TRM1, one 400 lb class 70 line, billed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
