        distinguishing_aspect: "WALK_IN with arrival_date != clock date -> ERR_WALKIN_NOT_TODAY, distinct from the RESERVED past-window error."
        test_recipe:
          setup: ["site with 1 first-come stall; clock 2026-08-01T18:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F01", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin }
