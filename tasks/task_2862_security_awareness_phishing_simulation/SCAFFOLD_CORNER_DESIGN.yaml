        distinguishing_aspect: "RATE_DECIMALS is 4 with round_half_up applied once to the quotient, so 2 reports over 3 evaluable deliveries is 0.6667 (not 0.6666 truncated, not 0.67) and the resilience_ratio uses max(1, click count) as its denominator, reading 2.0000 with zero clicks."
