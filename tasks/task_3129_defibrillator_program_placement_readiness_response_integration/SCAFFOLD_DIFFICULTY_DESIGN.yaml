  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: inspection_window_hard_close_at_plus_seven_days
        grounds:
          - state_machines.Inspection.transitions.SCHEDULED_to_PASS
          - validations.priority_9_business_temporal
          - errors.ERR_TEMPORAL_WINDOW_VIOLATION
        distinguishing_aspect: |
          Semantics: closed-ended expiration — submit must satisfy
          completed_at <= scheduled_for + 7 days inclusive. Submit at exactly
          scheduled_for+7d PASSES; submit at scheduled_for+7d+1s REJECTS. The
          resource is the Inspection record itself.
        test_recipe:
          setup:
            - "Device with two scheduled inspections on different days. Clock advanced to scheduled_for+7d for first, +7d+1s for second."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M15", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
              captures: { dm: $.data.id }
            - call: "POST /api/campuses"
              payload: { name: "C15", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-016", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/devices"
              payload: { campus_id: "${campus_id}", device_model_id: "${dm }", serial_number: "SN-015" }
              as: ProgramManager
              captures: { dev: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "Insp", badge_number: "IN-15", responder_role: "INSPECTOR" }
              as: ProgramManager
              captures: { insp: $.data.id }
            - call: "POST /api/inspections"
              payload: { device_id: "${dev}", inspector_id: "${insp }", scheduled_for: "2026-09-01T00:00:00Z" }
              as: Inspector
              as_user_id: "${insp}"
              captures: { insp_a: $.data.id }
            - call: "POST /api/inspections"
              payload: { device_id: "${dev}", inspector_id: "${insp }", scheduled_for: "2026-09-01T00:00:01Z" }
              as: Inspector
              as_user_id: "${insp}"
              captures: { insp_b: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/inspections/${insp_a}/submit"
              payload: { checklist_items: [{item_code: "PADS_OK", result: "PASS"}] }
              as: Inspector
              as_user_id: "${insp}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:02Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/inspections/${insp_b}/submit"
              payload: { checklist_items: [{item_code: "PADS_OK", result: "PASS"}] }
              as: Inspector
              as_user_id: "${insp}"
              captures: { err: $.data.error_id }
          assert:
            - "inspection A submit at exactly scheduled_for+7d SUCCEEDED (boundary inclusive)"
            - "inspection B submit at scheduled_for+7d+1s REJECTED"
            - "error_id == ERR_TEMPORAL_WINDOW_VIOLATION (or ERR_INSPECTION_OVERDUE)"

      - name: training_session_no_overlap_with_completed_session_certification_window
        grounds:
          - state_machines.TrainingSession
          - calculations.certification_extension
        distinguishing_aspect: |
          Semantics: half-open interval arithmetic on certification window —
          certification_extension computes new certified_through as
          max(current certified_through, session.ends_at) + months_granted.
          When two sessions ABUT (first ends_at == second starts_at), the
          second's base is the first's certified_through (already advanced),
          not the second's ends_at — preventing double-counting when sessions
          share a boundary timestamp. Different interval semantics from
          Inspection's closed-end (this is half-open with max-accumulation).
        test_recipe:
          setup:
            - "Responder R with certified_through=null. Two training sessions S1 ends 2026-08-01T04:00:00Z granting 24mo; S2 starts 2026-08-01T04:00:00Z ends 2026-08-01T08:00:00Z granting 12mo. S1 completes first, S2 completes second."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campuses"
              payload: { name: "C16", jurisdiction_code: "CA", jurisdiction_registration_number: "CA-PAD-017", medical_director_id: "md-tbd", response_time_target_seconds: 240 }
              as: PlatformAdmin
              captures: { campus_id: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "MD", badge_number: "MD-16", responder_role: "MEDICAL_DIRECTOR" }
              as: ProgramManager
              captures: { md: $.data.id }
            - call: "POST /api/responders"
              payload: { campus_id: "${campus_id}", full_name: "R", badge_number: "R-16", responder_role: "LAY_RESPONDER" }
              as: ProgramManager
              captures: { resp: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${campus_id}", instructor_id: "${md }", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z", capacity: 5, certification_months_granted: 24 }
              as: ProgramManager
              captures: { ts1: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { campus_id: "${campus_id}", instructor_id: "${md }", starts_at: "2026-08-01T04:00:00Z", ends_at: "2026-08-01T08:00:00Z", capacity: 5, certification_months_granted: 12 }
              as: ProgramManager
              captures: { ts2: $.data.id }
            - call: "POST /api/training-sessions/${ts1}/enroll"
              payload: { responder_id: "${resp}" }
              as: ProgramManager
            - call: "POST /api/training-sessions/${ts2}/enroll"
              payload: { responder_id: "${resp}" }
              as: ProgramManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T05:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/training-sessions/${ts1}/complete"
              payload: { attendee_ids: ["${resp}"] }
              as: ProgramManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/training-sessions/${ts2}/complete"
              payload: { attendee_ids: ["${resp}"] }
              as: ProgramManager
            - call: "GET /api/responders/${resp}"
              payload: {}
              as: ProgramManager
          assert:
            - "After S1 completes: certified_through = 2028-08-01T04:00:00Z (base = max(null, ends_at=2026-08-01T04) → +24mo)"
            - "After S2 completes: certified_through = 2029-08-01T04:00:00Z (base = max(2028-08-01T04, 2026-08-01T08) = 2028-08-01T04 → +12mo)"
            - "S2 did NOT reset the base to its own ends_at — abutting sessions do not double-count"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: install_replace_conserves_active_install_count_per_kind
        grounds:
          - state_machines.Install.transitions.ACTIVE_to_REPLACED
          - state_machines.Install
          - entities.Device.fields.current_pad_install_id
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE Installs of kind K on device D
          MUST be invariant at 1 across a (create new install, supersede old)
          pair. After POST .../installs replaces an existing pad install,
          count(Install where device_id=D AND kind=PAD AND disposition=ACTIVE) == 1.
        test_recipe:
          setup:
            - "Device with pad install I1 (ACTIVE) from lot L1. Second lot L2 with 1 pad."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/device-models"
              payload: { model_code: "M17", manufacturer: "ZOLL", pad_shelf_life_months: 24, battery_shelf_life_months: 48, prescription_required: false }
              as: PlatformAdmin
