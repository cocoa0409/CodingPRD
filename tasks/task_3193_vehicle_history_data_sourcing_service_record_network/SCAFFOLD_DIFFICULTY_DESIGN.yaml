scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (HistoryRecord confidence vs GuaranteeClaim payout).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: accident_confidence_provisional_vs_recomputed_variants
        grounds:
          - calculations.accident_confidence
          - calculations.feed_reliability_decay
          - entities.HistoryRecord.fields.confidence_score
        distinguishing_aspect: |
          Entity domain = HistoryRecord (accident confidence). The provisional
          variant at ingest scores with the source's current reliability
          (floor(40 * 80/100) = 32), while the recomputed variant at the next
          advance_epoch scores the identical record data with the decayed
          reliability 70 (floor(40 * 70/100) = 28) — same record, two valid
          algorithm variants, two different confidence_scores.
        test_recipe:
          setup:
            - "Network at epoch 0; MVA source S active with reliability_score 80"
            - "One ACCIDENT record R submitted by S during epoch 0 (so the epoch-0 sweep counts a submission and does not decay S)"
            - "Epoch advanced once with no further submissions so the epoch-1 sweep decays S to 70 and recomputes R"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${src}/reset_streak"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 4, payload_ref: "mva-1", idempotency_key: "k-acc-1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { rec: $.data.id, prov_score: $.data.confidence_score }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /records/${rec}"
              as: Any
              captures: { recomputed_score: $.data.confidence_score, rec_status: $.data.status }
          assert:
            - "provisional variant: prov_score == 32 (floor(40 * 80/100))"
            - "recomputed variant: recomputed_score == 28 (floor(40 * 70/100)) after decay to 70"
            - "32 != 28 — identical record data, divergent variant outputs"
            - "rec_status == 'VOIDED' (28 < 40 and record is 2 epochs old at the epoch-2 sweep)"

      - name: guarantee_payout_uncapped_vs_capped_variants
        grounds:
          - calculations.guarantee_payout
          - entities.Network.fields.guarantee_payout_cap_cents
          - state_machines.GuaranteeClaim.OPEN_to_APPROVED
        distinguishing_aspect: |
          Entity domain = GuaranteeClaim (buyback payout). For identical listing
          price and brand escalation (SALVAGE over CLEAN => 100%), the uncapped
          variant pays 600,000c on a fresh vehicle while the capped variant pays
          only the 1,400,000c remaining on a second listing over the SAME
          vehicle after a prior 600,000c PAID claim drained the 2,000,000c cap.
        test_recipe:
          setup:
            - "Network cap 2,000,000c; dealer with enrolled listings L1 (600,000c) and L2 (2,000,000c) both on vehicle V1, enrolled at CLEAN"
            - "V1 escalated CLEAN -> SALVAGE via a TX MVA title record"
            - "C1 on L1 approved (uncapped: 600,000c == asking) and PAID via advance_epoch, draining V1's lifetime cap usage"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 2000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { v1: $.data.vehicle_id }
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${v1}", asking_price_cents: 600000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { l1: $.data.id }
            - call: "POST /dealers/${dl}/listings/${l1}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { l1v: $.data.version }
            - call: "POST /dealers/${dl}/listings/${l1}/enroll_guarantee"
              payload: { expected_listing_version: "${l1v}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t1s", idempotency_key: "k-t1s" }
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /claims"
              payload: { listing_id: "${l1}", claimant_name: "Buyer A", claim_reason: "salvage found" }
              as: GuaranteeAdmin
              captures: { c1: $.data.id }
            - call: "POST /claims/${c1}/approve"
              payload: {}
              as: GuaranteeAdmin
              captures: { pay1: $.data.payout_cents }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${v1}", asking_price_cents: 2000000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { l2: $.data.id }
            - call: "POST /dealers/${dl}/listings/${l2}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { l2v: $.data.version }
          trigger:
            - call: "POST /dealers/${dl}/listings/${l2}/enroll_guarantee"
              payload: { expected_listing_version: "${l2v}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /claims"
              payload: { listing_id: "${l2}", claimant_name: "Buyer B", claim_reason: "salvage still on record" }
              as: GuaranteeAdmin
              captures: { c2: $.data.id }
            - call: "POST /claims/${c2}/approve"
              payload: {}
              as: GuaranteeAdmin
              captures: { pay2: $.data.payout_cents, c2_status: $.data.status }
          assert:
            - "uncapped variant: pay1 == 600000 (100% of 600,000c; no prior PAID claims on V1)"
            - "capped variant: pay2 == 1400000 (provisional 100% of 2,000,000c clamped to cap 2,000,000c - 600,000c prior PAID on V1)"
            - "pay2 != 2000000 — the two variants diverge for identical escalation data because of prior cap drain"
            - "GuaranteeClaim.${c1}.status == 'PAID' after the advance_epoch (observed via c2 approval succeeding, which requires C1 terminal under claim-occupancy)"

  # =====================================================================
  # Rule 2 — combinatorial_formula: modes (a) and (c) — different modes.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: accident_confidence_multi_input_nonlinear
        grounds:
          - calculations.accident_confidence
          - entities.DataSource.fields.reliability_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — base 40, same-type
          bonus min(2, count) * 10, cross-type bonus min(2, count) * 20, and a
          multiplicative reliability factor clamped to [0,100]/100, then floor.
          Each new corroborating record re-scores against the corroborators that
          existed at its own ingest: 40, then 60, then 80, then 90 for a fourth
          record with 1 same-type + 2 cross-type corroborators, and the >=85
          HIGH boundary is crossed only by the fourth.
        test_recipe:
          setup:
            - "Three ACTIVE sources: MVA (reliability 100), INSURER (100), AUCTION (100)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "INSURER", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { ins: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "AUCTION", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { auc: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${ins}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${auc}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 5, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { s1: $.data.confidence_score }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${ins}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 5, payload_ref: "a2", idempotency_key: "k-a2" }
              as: SourceOperator
              as_user_id: "${ins}"
              captures: { s2: $.data.confidence_score }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${auc}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 5, payload_ref: "a3", idempotency_key: "k-a3" }
              as: SourceOperator
              as_user_id: "${auc}"
              captures: { s3: $.data.confidence_score }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "ACCIDENT", event_date: "2026-09-02", damage_severity: 3, payload_ref: "a4", idempotency_key: "k-a4" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { s4: $.data.confidence_score, l4: $.data.confidence_level }
          assert:
            - "s1 == 40 (base only, no corroborators at ingest time)"
            - "s2 == 60 (40 + 1 cross-type * 20, reliability 1.0)"
            - "s3 == 80 (40 + 2 cross-type * 20)"
            - "s4 == 90 (same-type count 1 -> +10, cross-type count min(2,2)=2 -> +40; floor(90 * 1.0))"
            - "l4 == 'HIGH' (90 >= 85) while s3's level is 'MEDIUM' (80 in 70..84)"

      - name: report_price_counter_last_evaluation_order
        grounds:
          - calculations.report_price
          - entities.Dealer.fields.period_reports_used
          - entities.Dealer.fields.invoice_balance_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          the overage price depends on period_reports_used, which the purchase
          itself increments; the scaffold pins pricing against the
          PRE-increment counter and increments last. Orders 26..35 (1-based
          overage 1..10) price at 500c each, and order 36 (overage 11) prices
          at 400c, proving the counter was read before increment.
        test_recipe:
          setup:
            - "Network at epoch 0; dealer subscribed STANDARD at epoch 0 (window [0,30), included 25)"
            - "A vehicle exists (created via an MVA title record)"
            - "25 included DEALER_SUBSCRIPTION reports purchased (transcribed as a loop by the unit-test generator), each priced 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/subscribe"
              payload: { tier: "STANDARD" }
              as: DealerAgent
              as_user_id: "${dl}"
            # LOOP x25: the unit-test generator expands the following call 25 times verbatim
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "DEALER_SUBSCRIPTION", buyer_dealer_id: "${dl}" }
              as: DealerAgent
              as_user_id: "${dl}"
          trigger:
            # LOOP x10: expand verbatim; each response price_cents must equal 500
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "DEALER_SUBSCRIPTION", buyer_dealer_id: "${dl}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "DEALER_SUBSCRIPTION", buyer_dealer_id: "${dl}" }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { p36: $.data.price_cents }
            - call: "GET /dealers/${dl}"
              as: Any
              captures: { used: $.data.period_reports_used, owed: $.data.invoice_balance_cents }
          assert:
            - "each of orders 26..35 == 500 (first overage tier, priced against pre-increment counter)"
            - "p36 == 400 (11th overage unit: 500 - 100 * ((11-1) // 10) = 400)"
            - "used == 36 after the trigger sequence"
            - "owed == 5400 (10 * 500 + 1 * 400 debited for the 11 overage orders)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine on different entities.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: datasource_suspension_cycle_with_streak_gate
        grounds:
          - state_machines.DataSource
          - calculations.feed_reliability_decay
        distinguishing_aspect: |
          Cyclic machine on DataSource: ACTIVE -> SUSPENDED -> ACTIVE is a
          loop, and the loop-back edge is gated by BOTH a 1-epoch remediation
          window and a reset of record_rejection_streak, so the cycle cannot be
          traversed without the auxiliary reset action once the streak is 3.
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE"
            - "Three consecutive submissions rejected (future event_date) so record_rejection_streak reaches 3"
            - "advance_epoch auto-suspends the source at epoch 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2027-01-01", damage_severity: 3, payload_ref: "x1", idempotency_key: "k-x1" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2027-01-01", damage_severity: 3, payload_ref: "x2", idempotency_key: "k-x2" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2027-01-01", damage_severity: 3, payload_ref: "x3", idempotency_key: "k-x3" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "GET /sources/${src}"
              as: Any
              captures: { st: $.data.status }
            - call: "POST /sources/${src}/reactivate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${src}/reactivate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${src}/reset_streak"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${src}/reactivate"
              payload: {}
              as: NetworkAdmin
              captures: { st2: $.data.status, rel: $.data.reliability_score }
          assert:
            - "st == 'SUSPENDED' (rejection streak >= 3 auto-suspends during epoch sweep)"
            - "First reactivate at epoch 1 -> ERR_REMEDIATION_TOO_EARLY (window check precedes streak check)"
            - "Second reactivate at epoch 2 (window elapsed, streak still 3) -> ERR_STREAK_NOT_RESET"
            - "Third reactivate after reset_streak -> st2 == 'ACTIVE' and rel == 50 (cycle completed)"

      - name: correction_request_branching_fork_to_terminal
        grounds:
          - state_machines.CorrectionRequest
          - state_machines.HistoryRecord.ACTIVE_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork machine on CorrectionRequest: OPEN forks to
          AWAITING_SOURCE, which branches to VERIFIED (source confirms) or
          REJECTED (source denies) or EXPIRED (system timeout) — three
          divergent branches with different side-effect sets, and only the
          VERIFIED branch joins to the APPLIED terminal via apply.
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE; vehicle V with one ACTIVE TITLE_BRAND record R (CA 'clean')"
            - "Owner account exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id, vv: $.data.version }
            - call: "POST /consumers"
              payload: { email: "owner@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh}/corrections"
              payload: { target_record_id: "${rec}", reason: "brand is wrong", expected_vehicle_version: "${vv}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { cr: $.data.id }
            - call: "POST /corrections/${cr}/source_confirm"
              payload: {}
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /corrections/${cr}/route_to_source"
              payload: {}
              as: NetworkAdmin
            - call: "POST /corrections/${cr}/source_confirm"
              payload: {}
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /corrections/${cr}/apply"
              payload: { resolution_action: "WITHDRAW" }
              as: NetworkAdmin
              captures: { fin: $.data.status }
            - call: "GET /records/${rec}"
              as: Any
              captures: { rec_st: $.data.status }
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { brand: $.data.canonical_brand, cnt: $.data.active_record_count }
          assert:
            - "source_confirm from OPEN -> ERR_INVALID_STATE_TRANSITION (branch requires AWAITING_SOURCE first)"
            - "After route_to_source: CorrectionRequest.${cr}.source_deadline_epoch == 2 (routed at epoch 0)"
            - "After source_confirm + apply: fin == 'APPLIED' (VERIFIED -> APPLIED join)"
            - "rec_st == 'WITHDRAWN' and brand == 'NONE' and cnt == 0 (fork's WITHDRAW branch side effects fired)"

  # =====================================================================
  # Rule 4 — transitive_cascade from different triggers.
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: epoch_cascade_source_to_record_to_vehicle_to_claim
        grounds:
          - state_machines.DataSource.ACTIVE_to_SUSPENDED
          - state_machines.HistoryRecord.ACTIVE_to_WITHDRAWN
          - state_machines.GuaranteeClaim.OPEN_to_DENIED
          - calculations.vehicle_brand_rollup
        distinguishing_aspect: |
          Depth-3 cascade triggered by advance_epoch: epoch sweep suspends the
          MVA source (miss streak) -> source suspension withdraws its ACTIVE
          title record -> withdrawal recomputes the vehicle rollup dropping
          SALVAGE back to CLEAN -> the claim sweep sees the escalation gone and
          auto-DENIES the OPEN claim. Each hop is caused by the previous hop,
          not by advance_epoch directly.
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE; V1 has an MVA TX-salvage title; V2 (dealer's listed vehicle) carries an MVA CA-clean title at enrollment"
            - "Dealer listing on V2 enrolled at CLEAN; V2 then escalates to SALVAGE via an MVA TX title; claim C OPEN"
            - "MVA source then misses 3 consecutive epochs (no submissions)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /records"
              payload: { vin: "2HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
