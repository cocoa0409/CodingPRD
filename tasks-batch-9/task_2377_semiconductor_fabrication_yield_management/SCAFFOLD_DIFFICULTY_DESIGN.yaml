scaffold_difficulty_design:

  # =====================================================================
  # R1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: excursion_severity_provisional_widens_to_final_and_flips_band
        grounds:
          - calculations.excursion_severity_score
          - entities.Excursion.fields.severity_variant
          - entities.Excursion.fields.affected_lot_count
          - state_machines.Excursion.OPEN_to_CONTAINED
          - state_machines.SpcChart.MONITORING_to_SUSPENDED
        distinguishing_aspect: |
          This instance is in the excursion-quality entity domain (Excursion / SpcChart): the
          PROVISIONAL variant counts only lots whose StepRun on the charted step is still OPEN,
          while the FINAL variant also admits already-COMPLETED runs, so the identical
          measurement data yields affected_lot_count 1 -> 2 and severity_score 39.00 -> 42.00,
          crossing MEDIUM_BAND and flipping severity_band from LOW to MEDIUM.
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with three steps: seq 10 LITHO 2.0h, seq 20 ETCH 3.0h metrology-required (rework target seq 10), seq 30 LITHO 2.0h; total_standard_hours 7.0."
            - "SpcChart on step seq 20: target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00, status MONITORING."
            - "One LITHO tool with chamber CH_L1 and one ETCH tool with chamber CH_E1, both QUALIFIED at 2026-08-01T00:00:00Z with a 100-day expiry; logical clock never advanced, so it reads 2026-08-01T00:00:00Z throughout."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "Plan PLAN-A COMMITTED (planned_wafer_starts 50, capacity_budget_hours 500.0, cycle_time_target_days 1.0)."
            - "LOT-002 has already COMPLETED its step-seq-20 run with an IN_CONTROL measurement of 100.00 and sits IN_PROCESS at current_step_seq 20."
            - "LOT-001 has an OPEN step-seq-20 run on CH_E1; its measurement of 106.00 sits exactly on the inclusive UCL and has opened a PROVISIONAL SPC excursion."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: true, rework_target_step_id: "${s10}" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 30, step_name: "LITHO-2", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s30: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/spc-charts"
              payload: { step_id: "${s20}", param_name: "ETCH_DEPTH", target: 100.00, sigma: 2.00, usl: 110.00, lsl: 90.00, ucl: 106.00, lcl: 94.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { chart_e: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment"
              payload: { equipment_code: "ETCH-1", tool_type: "ETCH", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_etch: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_etch}", chamber_code: "CH_E1", qualified_recipe_id: "${r_etch}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_e1: $.data.id }
            - call: "POST /fab/chambers/${ch_e1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 500.0, cycle_time_target_days: 1.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_v1: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 3, priority_class: "STANDARD" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots/${lot1}/release"
              payload: { expected_plan_version: "${plan_v1}" }
              as: FabPlanner
              as_user_id: "u_fp_1"
            - call: "GET /fab/wafer-start-plans/${plan_a}"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_v2: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-002", wafer_count: 3, priority_class: "STANDARD" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot2: $.data.id }
            - call: "POST /fab/lots/${lot2}/release"
              payload: { expected_plan_version: "${plan_v2}" }
              as: FabPlanner
              as_user_id: "u_fp_1"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot2}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr2_10: $.data.id }
            - call: "POST /fab/step-runs/${sr2_10}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot2}", step_id: "${s20}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr2_20: $.data.id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${sr2_20}", spc_chart_id: "${chart_e}", measured_value: 100.00 }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs/${sr2_20}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr1_10: $.data.id }
            - call: "POST /fab/step-runs/${sr1_10}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s20}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr1_20: $.data.id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${sr1_20}", spc_chart_id: "${chart_e}", measured_value: 106.00 }
              as: Operator
              as_user_id: "${op1}"
              captures: { exc_id: $.data.excursion_id, m1_class: $.data.classification }
            - call: "GET /fab/excursions/${exc_id}"
              payload: {}
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { prov_variant: $.data.severity_variant, prov_lots: $.data.affected_lot_count, prov_score: $.data.severity_score, prov_band: $.data.severity_band }
          trigger:
            - call: "POST /fab/excursions/${exc_id}/contain"
              payload: { containment_scope: "SPC_CHART" }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { final_variant: $.data.severity_variant, final_lots: $.data.affected_lot_count, final_score: $.data.severity_score, final_band: $.data.severity_band }
          assert:
            - "${m1_class} == OUT_OF_CONTROL"
            - "${prov_variant} == PROVISIONAL"
            - "${prov_lots} == 1"
            - "${prov_score} == 39.00"
            - "${prov_band} == LOW"
            - "${final_variant} == FINAL"
            - "${final_lots} == 2"
            - "${final_score} == 42.00"
            - "${final_band} == MEDIUM"
            - "Excursion.${exc_id}.status == CONTAINED"
            - "Excursion.${exc_id}.containment_scope == SPC_CHART"
            - "Excursion.${exc_id}.contained_by_user_id == u_qm_1"
            - "SpcChart.${chart_e}.status == SUSPENDED"
            - "SpcChart.${chart_e}.violation_count == 1"
            - "Lot.${lot1}.hold_state == SPC_HOLD"

      - name: lot_cycle_time_projection_vs_chronological_actual
        grounds:
          - calculations.lot_cycle_time_days
          - entities.Lot.fields.actual_cycle_time_days
          - entities.WaferStartPlan.fields.cycle_time_target_days
          - state_machines.Lot.AT_SORT_to_COMPLETED
        distinguishing_aspect: |
          This instance is in the production-planning entity domain (Lot / WaferStartPlan), a
          different domain from the excursion-severity instance: the projection variant adds a
          modelled remainder (5.0 remaining standard hours x QUEUE_FACTOR[STANDARD] 1.60 / 24 =
          0.333 d) on top of 1.000 d elapsed and reports 1.333 d AT_RISK against a 1.0 d target,
          while the chronological variant pins actual_cycle_time_days at exactly 1.000 d from the
          released_at/completed_at stamps alone — a fixed 0.333 d disagreement at the same clock.
        test_recipe:
          setup:
            - "Same FLOW-A / tools / operator / PLAN-A baseline as excursion_severity_provisional_widens_to_final_and_flips_band, with cycle_time_target_days 1.0."
            - "LOT-001 (3 wafers, STANDARD) released at logical clock 2026-08-01T00:00:00Z."
            - "LOT-001 has tracked out step seq 10, so current_step_seq is 10 and 5.0 standard hours (steps 20 and 30) remain."
            - "The logical clock is then advanced to 2026-08-02T00:00:00Z, exactly 1.000 day after release, and stays there for the rest of the chain, so every step run has actual_hours 0.0."
          setup_api_calls:
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-100", tool_type: "LITHO", target_value: 50.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/recipes"
              payload: { recipe_code: "ETCH-100", tool_type: "ETCH", target_value: 100.00, qual_expiry_days: 100 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_etch: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: true, rework_target_step_id: "${s10}" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s20: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 30, step_name: "LITHO-2", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s30: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/spc-charts"
              payload: { step_id: "${s20}", param_name: "ETCH_DEPTH", target: 100.00, sigma: 2.00, usl: 110.00, lsl: 90.00, ucl: 106.00, lcl: 94.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { chart_e: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment"
              payload: { equipment_code: "ETCH-1", tool_type: "ETCH", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_etch: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_etch}", chamber_code: "CH_E1", qualified_recipe_id: "${r_etch}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_e1: $.data.id }
            - call: "POST /fab/chambers/${ch_e1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 50, capacity_budget_hours: 500.0, cycle_time_target_days: 1.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_v1: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 3, priority_class: "STANDARD" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots/${lot1}/release"
              payload: { expected_plan_version: "${plan_v1}" }
              as: FabPlanner
              as_user_id: "u_fp_1"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s10}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr1_10: $.data.id }
            - call: "POST /fab/step-runs/${sr1_10}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FabPlanner
              as_user_id: "u_fp_1"
          trigger:
            - call: "GET /fab/lots/${lot1}/cycle-time-projection"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { rem_hours: $.data.remaining_standard_hours, qf: $.data.queue_factor, proj_rem: $.data.projected_remaining_days, elapsed: $.data.elapsed_days, proj_total: $.data.projected_cycle_time_days, ct_status: $.data.cycle_time_status }
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s20}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr1_20: $.data.id }
            - call: "POST /fab/measurements"
              payload: { step_run_id: "${sr1_20}", spc_chart_id: "${chart_e}", measured_value: 100.00 }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs/${sr1_20}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/step-runs"
              payload: { lot_id: "${lot1}", step_id: "${s30}", operator_id: "${op1}" }
              as: Operator
              as_user_id: "${op1}"
              captures: { sr1_30: $.data.id }
            - call: "POST /fab/step-runs/${sr1_30}/track-out"
              payload: {}
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/die-sort-runs"
              payload: { lot_id: "${lot1}", gross_die_per_wafer: 100, baseline_yield: 0.92, wafer_results: [ { wafer_slot: 1, tested_die: 100, good_die: 90, edge_ring_fails: 7, center_cluster_fails: 1, scratch_line_fails: 0, parametric_shift_fails: 2 }, { wafer_slot: 2, tested_die: 10, good_die: 8, edge_ring_fails: 2, center_cluster_fails: 0, scratch_line_fails: 0, parametric_shift_fails: 0 }, { wafer_slot: 3, tested_die: 50, good_die: 47, edge_ring_fails: 2, center_cluster_fails: 1, scratch_line_fails: 0, parametric_shift_fails: 0 } ] }
              as: YieldEngineer
              as_user_id: "u_ye_1"
              captures: { sort1: $.data.id }
            - call: "POST /fab/die-sort-runs/${sort1}/bin"
              payload: { premium_target_die: 50, standard_target_die: 60 }
              as: YieldEngineer
              as_user_id: "u_ye_1"
          assert:
            - "${rem_hours} == 5.00"
            - "${qf} == 1.60"
            - "${proj_rem} == 0.333"
            - "${elapsed} == 1.000"
            - "${proj_total} == 1.333"
            - "${ct_status} == AT_RISK"
            - "Lot.${lot1}.flow_state == COMPLETED"
            - "Lot.${lot1}.actual_cycle_time_days == 1.000"
            - "Lot.${lot1}.actual_cycle_time_days != ${proj_total}"
            - "${proj_total} - Lot.${lot1}.actual_cycle_time_days == 0.333"

      - name: chamber_dispatch_super_hot_waiver_flips_winning_chamber
        grounds:
          - calculations.chamber_dispatch_score
          - entities.Lot.fields.priority_class
          - entities.StepRun.fields.chamber_id
          - entities.StepRun.fields.dispatch_score
          - entities.Equipment.fields.hours_since_pm
        distinguishing_aspect: |
          This instance is in the equipment-dispatch entity domain (Chamber / Equipment / StepRun),
          distinct from both the Excursion and the Lot-planning instances: with an identical
          two-chamber candidate population, the STANDARD_QUEUE variant scores CH_E_A 75.33 vs
          CH_E_B 80.00 and dispatches to CH_E_B, while the SUPER_HOT_WAIVER variant zeroes pm_term
          and scores CH_E_A 92.00 vs CH_E_B 80.00 and dispatches to CH_E_A — the winner changes on
          Lot.priority_class alone.
        test_recipe:
          setup:
            - "FLOW-A RELEASED as in the baseline (seq 10 LITHO 2.0h, seq 20 ETCH 3.0h metrology-required, seq 30 LITHO 2.0h) with an SPC chart on seq 20."
            - "Two ETCH tools: ETCH-A (pm_interval_hours 168.0, hours_since_pm seeded 140.0) carrying chamber CH_E_A (particle_limit 50.0, particle_count 0.0), and ETCH-B (pm_interval_hours 168.0, hours_since_pm 0.0) carrying chamber CH_E_B (particle_limit 50.0, particle_count driven to 24.0 by a sub-limit particle reading)."
            - "Both ETCH chambers and the single LITHO chamber CH_L1 are QUALIFIED at 2026-08-01T00:00:00Z against a 100-day expiry, so qual_expires_at is 2026-11-09T00:00:00Z."
            - "The logical clock is set to 2026-08-21T00:00:00Z before any track-in, giving every chamber qual_remaining_ratio exactly 0.8."
            - "LOT-001 (STANDARD) and LOT-002 (SUPER_HOT) are both released and have both tracked out step seq 10, so both sit at current_step_seq 10 with hold_state NONE."
          setup_api_calls:
            - call: "POST /fab/recipes"
