              payload: { platform_id: "${pf}", sku: "P-PR1", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
