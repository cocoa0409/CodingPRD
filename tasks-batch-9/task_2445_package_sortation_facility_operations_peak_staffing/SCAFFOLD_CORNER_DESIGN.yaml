              as: FacilityAdmin
              captures: { c85_id: $.data.id }
            - call: "POST /sortation/sort-centers/${c85_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${c85_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 40000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 500000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { p85_id: $.data.id }
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC-84", name: "Tier Below", automation_utilization_pct: 84, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { c84_id: $.data.id }
            - call: "POST /sortation/sort-centers/${c84_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
