# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Campus Card & Meal Plan Management
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: card_holder_creation_defaults_and_duplicate_key_rejected
        claim_type: creation
        grounds: [entities.CardHolder, "errors[ERR_DUPLICATE_NATURAL_KEY]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Create returns 201 with system defaults (status ACTIVE, fraud_strike_count 0, fraud_flag false, version 1); duplicate university_id yields ERR_DUPLICATE_NATURAL_KEY; out-of-enum holder_type yields ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /api/card-holders"
              payload: { university_id: "U90001", full_name: "Ada One", email: "ada@x.edu", holder_type: "FACULTY", housing_status: "OFF_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id", h_status: "$.data.status", h_strikes: "$.data.fraud_strike_count", h_v: "$.data.version" }
          trigger:
            - call: "POST /api/card-holders"
              payload: { university_id: "U90001", full_name: "Ada Two", email: "ada2@x.edu", holder_type: "STAFF", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { err_dup: "$.data.error_id" }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90002", full_name: "Bad Enum", email: "be@x.edu", holder_type: "SUPERUSER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "First create: status == ACTIVE, fraud_strike_count == 0, fraud_flag == false, version == 1"
            - "Duplicate university_id: error_id == ERR_DUPLICATE_NATURAL_KEY (http 409)"
            - "Invalid holder_type enum: error_id == ERR_VALIDATION (http 400)"

      - name: card_issuance_initial_state_and_system_fields
        claim_type: defaults
        grounds: [entities.CampusCard, state_machines.CampusCard.lifecycle_status]
        distinguishing_aspect: "Issued card starts PENDING_PHOTO / NOT_SUBMITTED with is_provisional true, server-minted card_number, version 1."
        test_recipe:
          setup: ["Holder exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90003", full_name: "Cal Issue", email: "cal@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_lc: "$.data.lifecycle_status", c_ps: "$.data.photo_status", c_prov: "$.data.is_provisional", c_num: "$.data.card_number", c_v: "$.data.version" }
          assert:
            - "lifecycle_status == PENDING_PHOTO and photo_status == NOT_SUBMITTED (initial states)"
            - "is_provisional == true; card_number is non-empty and server-minted; version == 1"

      - name: ledger_entry_immutability_and_sequence
        claim_type: immutability
        grounds: [entities.LedgerEntry, calculations.ledger_balance_recompute]
        distinguishing_aspect: "LedgerEntry is append-only (common_fields false: no updated_at/version in contract, no update endpoint exists); entry_sequence is per-account monotonic and running_balance_cents replays correctly."
        test_recipe:
          setup: ["Holder with CAMPUS_CASH account"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90004", full_name: "Dee Ledger", email: "dee@x.edu", holder_type: "STAFF", housing_status: "OFF_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { a_id: "$.data.id" }
            - { call: "POST /api/accounts/${a_id}/funding", payload: { amount_cents: 1000, idempotency_key: "le-1" }, as: BursarOffice }
            - { call: "POST /api/accounts/${a_id}/funding", payload: { amount_cents: 500, idempotency_key: "le-2" }, as: BursarOffice }
          trigger:
            - call: "GET /api/ledger-entries"
              payload: { account_id: "${a_id}" }
              as: BursarOffice
              captures: { e1_seq: "$.data[0].entry_sequence", e1_rb: "$.data[0].running_balance_cents", e2_seq: "$.data[1].entry_sequence", e2_rb: "$.data[1].running_balance_cents" }
          assert:
            - "Entries ordered by entry_sequence 1, 2 with running_balance_cents 1000 then 1500"
            - "Both entries have entry_type == FUND and no update/delete endpoint exists for ledger entries"

      - name: account_balance_is_computed_not_settable
        claim_type: computed_fields
        grounds: [entities.DecliningBalanceAccount.fields.balance_cents]
        distinguishing_aspect: "Account creation input has no balance_cents field; balance starts at 0 and changes only through ledger postings."
        test_recipe:
          setup: ["Holder exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90005", full_name: "Eve Comp", email: "eve@x.edu", holder_type: "STAFF", housing_status: "OFF_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { a_bal: "$.data.balance_cents", a_status: "$.data.status" }
          assert:
            - "New account: balance_cents == 0, status == OPEN, term_id == null for CAMPUS_CASH"

      - name: enrollment_overlap_same_term_rejected
        claim_type: type_constraints
        grounds: [entities.MealPlanEnrollment, "errors[ERR_ENROLLMENT_OVERLAP]"]
        distinguishing_aspect: "One ASSIGNED|ACTIVE enrollment per (holder, term); the second assignment to the same term is rejected."
        test_recipe:
          setup: ["Term OPEN; plan published; holder enrolled once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "T-EO", name: "EO", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { t_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "P-EO", name: "EO plan", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER"] }
              as: DiningServicesManager
              captures: { p_id: "$.data.id" }
            - { call: "POST /api/meal-plans/${p_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${t_id}/open", payload: {}, as: DiningServicesManager }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90006", full_name: "Finn Overlap", email: "finn@x.edu", holder_type: "STUDENT_COMMUTER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - { call: "POST /api/card-holders/${h_id}/enrollments", payload: { plan_id: "${p_id}", term_id: "${t_id}" }, as: DiningServicesManager }
          trigger:
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${p_id}", term_id: "${t_id}" }
              as: DiningServicesManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Second enrollment in the same term: error_id == ERR_ENROLLMENT_OVERLAP (http 409)"

      - name: nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET on a well-formed but unknown card id returns 404 ERR_NOT_FOUND; unknown nested parent likewise."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/cards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CardOfficeAdmin
              captures: { err1: "$.data.error_id" }
            - call: "GET /api/enrollments/00000000-0000-0000-0000-000000000000/change-requests"
              payload: {}
              as: DiningServicesManager
              captures: { err2: "$.data.error_id" }
          assert:
            - "Both responses: error_id == ERR_NOT_FOUND (http 404)"

      - name: dining_account_requires_term_and_campus_cash_forbids_it
        claim_type: required_fields
        grounds: [entities.DecliningBalanceAccount.fields.term_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "DINING_DOLLARS without term_id -> ERR_VALIDATION; CAMPUS_CASH with a term_id -> ERR_VALIDATION."
        test_recipe:
          setup: ["Holder exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90007", full_name: "Gus Term", email: "gus2@x.edu", holder_type: "STAFF", housing_status: "OFF_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "DINING_DOLLARS" }
              as: BursarOffice
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH", term_id: "00000000-0000-0000-0000-000000000000" }
              as: BursarOffice
              captures: { err2: "$.data.error_id" }
          assert:
            - "DINING_DOLLARS missing term_id: ERR_VALIDATION"
            - "CAMPUS_CASH carrying term_id: ERR_VALIDATION"

      - name: photo_submission_resubmission_sequence
        claim_type: creation
        grounds: [entities.PhotoSubmission.fields.submission_sequence, state_machines.CampusCard.photo_status]
        distinguishing_aspect: "After a REJECTED review the holder resubmits (cycle REJECTED -> PENDING_REVIEW); submission_sequence increments 1 -> 2."
        test_recipe:
          setup: ["Holder with issued card"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90008", full_name: "Hana Photo", email: "hana@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /api/cards/${c_id}/photos"
              payload: { image_ref: "img://v1" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { p1: "$.data.id", p1_seq: "$.data.submission_sequence" }
            - { call: "POST /api/photos/${p1}/review", payload: { decision: "REJECTED", rejection_reason: "blurry" }, as: CardOfficeAdmin }
          trigger:
            - call: "POST /api/cards/${c_id}/photos"
              payload: { image_ref: "img://v2" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { p2: "$.data.id", p2_seq: "$.data.submission_sequence", p2_status: "$.data.review_status" }
          assert:
            - "First submission_sequence == 1; resubmission after REJECTED has submission_sequence == 2 and review_status == PENDING_REVIEW"
            - "Card photo_status == PENDING_REVIEW again (cycle)"

      - name: config_entities_reject_duplicate_natural_keys
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_NATURAL_KEY]", entities.Term.fields.term_code, entities.DoorZone.fields.zone_code, entities.Merchant.fields.merchant_code]
        distinguishing_aspect: "term_code, zone_code, and merchant_code are natural keys; second use of each is rejected."
        test_recipe:
          setup: ["One term, one zone, one merchant exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/terms", payload: { term_code: "T-DUP", name: "T", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }, as: DiningServicesManager }
            - { call: "POST /api/door-zones", payload: { zone_code: "Z-DUP", building: "B", security_level: "STANDARD", access_windows: [{ day_of_week: "MON", start_minute: 480, end_minute: 1080 }] }, as: SecurityOfficer }
            - { call: "POST /api/merchants", payload: { merchant_code: "M-DUP", legal_name: "Dup", category: "OTHER", commission_bps: 100, contact_email: "d@x.com" }, as: BursarOffice }
          trigger:
            - call: "POST /api/terms"
              payload: { term_code: "T-DUP", name: "T2", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "DAILY" }
              as: DiningServicesManager
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/door-zones"
              payload: { zone_code: "Z-DUP", building: "B2", security_level: "ELEVATED", access_windows: [{ day_of_week: "TUE", start_minute: 480, end_minute: 1080 }] }
              as: SecurityOfficer
              captures: { err2: "$.data.error_id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-DUP", legal_name: "Dup2", category: "COFFEE", commission_bps: 200, contact_email: "d2@x.com" }
              as: BursarOffice
              captures: { err3: "$.data.error_id" }
          assert:
            - "All three duplicates rejected with ERR_DUPLICATE_NATURAL_KEY (http 409)"

      - name: enrollment_in_scheduled_term_starts_assigned
        claim_type: creation
        grounds: [entities.MealPlanEnrollment.fields.status, state_machines.MealPlanEnrollment]
        distinguishing_aspect: "Assignment while the term is SCHEDULED creates an ASSIGNED enrollment with null charge_cents; nothing is funded until the term opens."
        test_recipe:
          setup: ["Term created but not opened; plan published; holder exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "T-ASG", name: "TA", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { t_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "P-ASG", name: "PA", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER"] }
              as: DiningServicesManager
              captures: { p_id: "$.data.id" }
            - { call: "POST /api/meal-plans/${p_id}/publish", payload: {}, as: DiningServicesManager }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90009", full_name: "Ira Assigned", email: "ira@x.edu", holder_type: "STUDENT_COMMUTER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${p_id}", term_id: "${t_id}" }
              as: DiningServicesManager
              captures: { e_status: "$.data.status", e_charge: "$.data.charge_cents" }
          assert:
            - "Enrollment status == ASSIGNED and charge_cents == null while the term is SCHEDULED"
            - "No DINING_DOLLARS account exists for the holder yet (activation funds it)"

  - section: state_machines
    instances:
      - name: terminal_card_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CampusCard.lifecycle_status, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A REPLACED card is terminal: report-lost, unfreeze, deactivate, and photo submission are all rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Holder; card c1 ACTIVE (provisional) then replaced"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90010", full_name: "Joss Term", email: "joss@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/cards/${c1}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
              captures: { c1_v: "$.data.version" }
            - { call: "POST /api/cards/${c1}/replacement", payload: { reason: "LOST", expected_card_version: "${c1_v}" }, as: CardOfficeAdmin }
          trigger:
            - call: "POST /api/cards/${c1}/report-lost"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/cards/${c1}/deactivate"
              payload: {}
              as: CardOfficeAdmin
              captures: { err2: "$.data.error_id" }
          assert:
            - "report-lost on REPLACED card: ERR_INVALID_STATE_TRANSITION (http 409)"
            - "deactivate on REPLACED card: ERR_INVALID_STATE_TRANSITION (http 409)"

      - name: stolen_card_cannot_unfreeze
        claim_type: invalid_transition
        grounds: [state_machines.CampusCard.lifecycle_status, "errors[ERR_CARD_NOT_RECOVERABLE]"]
        distinguishing_aspect: "Unfreeze is defined only from LOST_FROZEN; a STOLEN_FROZEN card returns ERR_CARD_NOT_RECOVERABLE."
        test_recipe:
          setup: ["Holder with ACTIVE (provisional) card reported stolen"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90011", full_name: "Kai Stolen", email: "kai@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_id: "$.data.id" }
            - { call: "POST /api/cards/${c_id}/activate", payload: { allow_provisional: true }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${c_id}/report-stolen", payload: {}, as: CardHolder, as_user_id: "${h_id}" }
          trigger:
            - call: "POST /api/cards/${c_id}/unfreeze"
              payload: {}
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CARD_NOT_RECOVERABLE (http 409); card remains STOLEN_FROZEN"

      - name: activation_without_photo_and_without_flag_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CampusCard.lifecycle_status, "errors[ERR_PHOTO_NOT_APPROVED]"]
        distinguishing_aspect: "Activate with photo_status != APPROVED and allow_provisional absent/false -> ERR_PHOTO_NOT_APPROVED."
        test_recipe:
          setup: ["Holder with issued card, no photo submitted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90012", full_name: "Liv Photo", email: "liv@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/cards/${c_id}/activate"
              payload: {}
              as: CardOfficeAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PHOTO_NOT_APPROVED (http 409); card remains PENDING_PHOTO"

      - name: photo_rejection_requires_reason
        claim_type: precondition_enforcement
        grounds: [state_machines.PhotoSubmission, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "REJECTED review without rejection_reason -> ERR_VALIDATION; with reason the submission and card mirror REJECTED."
        test_recipe:
          setup: ["Holder with card and one PENDING_REVIEW submission"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U90013", full_name: "Mona Photo", email: "mona@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /api/cards/${c_id}/photos"
              payload: { image_ref: "img://m1" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /api/photos/${p_id}/review"
              payload: { decision: "REJECTED" }
              as: CardOfficeAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_VALIDATION (http 400); submission remains PENDING_REVIEW"

      - name: term_open_before_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Term, "errors[ERR_TERM_NOT_YET_STARTED]"]
        distinguishing_aspect: "Opening a term while the logical clock is before start_date fails with ERR_TERM_NOT_YET_STARTED."
        test_recipe:
