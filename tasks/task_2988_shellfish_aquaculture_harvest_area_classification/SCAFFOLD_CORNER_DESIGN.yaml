      - name: close_authorization_returns_the_unit_to_deployed_and_releases_vessel_capacity
        claim_type: valid_transition
        grounds:
          - state_machines[HarvestAuthorization.status ACTIVE -> CLOSED]
          - state_machines[GrowoutUnit.status HARVESTING -> DEPLOYED]
          - calculations.vessel_concurrent_authorization_load
          - calculations.authorization_area_denormalisation
        distinguishing_aspect: |
          One close call moves four things at once: the authorization to CLOSED with harvest_end_at
          stamped from the logical clock, the deployment back from HARVESTING to DEPLOYED, the
          vessel's active_authorization_count from 1 to 0 and the area's open_authorization_count
          from 1 to 0 — CLOSED is terminal, so the released capacity is permanent.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN; ACTIVE VibrioControlPlan for month 8; APPROVED Lease L-2988-01 held by op-1; SeedLot READY_FOR_PLANTING; one BOTTOM GrowoutUnit with both husbandry logs; LISTED dealer; vessel Miss Pamlico with capacity 2."
            - "One HarvestAuthorization for window 2026-08-10T06:00:00Z..18:00:00Z, ACTIVATED at 2026-08-10T06:00:00Z, so the unit is HARVESTING, the vessel load is 1 and the area's open_authorization_count is 1."
