            - "WarningDetermination.${det_1}.named_chemicals == [\"Cadmium\", \"Bisphenol A\"] - exactly two entries, CANCER group first, and Cadmium beats Benzene inside the CANCER group on the NO_SAFE_HARBOR rank key"
            - "WarningDetermination.${det_1}.symbol_required == true (product_category is not FOOD)"
            - "WarningDetermination.${det_1}.website_url == \"https://www.P65Warnings.ca.gov\" (base form: not OCCUPANCY and not FOOD)"
            - "WarningDetermination.${det_1}.warning_text == \"WARNING: This product can expose you to chemicals including Cadmium, Bisphenol A, which are known to the State of California to cause cancer and birth defects or other reproductive harm. For more information go to https://www.P65Warnings.ca.gov.\""
            - "WarningDetermination.${det_1}.required_channels == [\"LABEL\", \"CATALOG\"] in that pinned order (RETAIL -> LABEL, CATALOG -> CATALOG; no INTERNET_POS, no POSTED_SIGN)"
            - "WarningDetermination.${det_1}.status == DRAFT and prepared_by_user_id == ls_1"

      - name: calc_defense_score_rounds_half_up_partial_evidence_to_63
        claim_type: precision
        grounds:
          - calculations.defense_strength_score
          - endpoints[GET /products/{product_id}/compliance-summary]
        distinguishing_aspect: |
          Half evidence on three of the four pillars produces 40x0.5 + 25x1.0 + 20x0.5 + 15x0.5 =
          62.5 exactly, which round_half_up must resolve to 63 - banker's rounding or truncation
          would return 62. The pillars are independently half-credited for three different reasons:
          the placement is IMPLEMENTED but not VERIFIED, the warranty covers the material class but
          carries no pass-through obligation, and the disclosure is RECEIVED but not VERIFIED.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day; the clock is 2026-08-01T00:00:00Z."
            - "Supplier Northgate has an ACTIVE warranty (scope ALL_MATERIALS, effective_from 2026-01-01, effective_to null) with pass_through_warning_obligation false and indemnity_cap_cents 5000000."
            - "Material RM-100 has disclosure_status RECEIVED (COMPLETE response recorded, never VERIFIED) and declares Bisphenol A at 60.0 ppm."
            - "Product SKU-SCORE (distribution_channels [RETAIL], label_area 10.0) has one ACTIVE component of RM-100 at 0.25 g/unit, contact_factor 0.5, a FINAL assessment at 0.750 ug/day (margin_ratio 1.5000, AT_OR_ABOVE) and an APPROVED WARNING_REQUIRED determination whose single required channel LABEL has an IMPLEMENTED placement effective from 2026-07-01 with no end date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
