            - "HTTP 200 and Supervisor.${sup_id}.training_status == 'TRAINED'"
            - "Supervisor.${sup_id}.quiz_score == 80 and training_attempt_count == 1"
            - "Supervisor.${sup_id}.certified_at == '2026-08-03T09:00:00Z' (the logical clock at the train call)"
            - "Supervisor.${sup_id}.modules_completed == ['TIPS_BOUNDARIES', 'PROHIBITED_CONDUCT', 'SOLICITATION_RULES']"

      - name: supervisor_training_self_loop_counts_failed_attempts
        claim_type: cyclic
        grounds:
          - state_machines.Supervisor.transitions.UNTRAINED_to_UNTRAINED
          - constants.TRAINING_PASS_SCORE
          - entities.Supervisor.fields.training_attempt_count
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The UNTRAINED self-loop must record the attempt while withholding certification, for BOTH
          failure reasons: a 79 quiz with every module and a 95 quiz missing SOLICITATION_RULES each leave
          training_status UNTRAINED with certified_at null, and the third attempt at 80 finally certifies -
          so training_attempt_count reaches 3, not 1.
        test_recipe:
          setup:
            - "petition 07-RC-340103 in SCOPE_ANALYSIS with one UNTRAINED supervisor"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-03T09:00:00Z"}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
