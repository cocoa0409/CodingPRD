            - "Trigger call 2 returns 409 ERR_ROOM_NOT_ACTIVE (wrap requires status ACTIVE)"
            - "Trigger call 5 returns 409 ERR_ROOM_NOT_ACCEPTING_SEATS, not 412: the state gate at priority 30 precedes nothing lower, and the version supplied was current"
            - "Trigger call 6 returns 409 ERR_ROOM_NOT_ACCEPTING_SEATS and WritersRoom.${rm}.filled_seat_count stays 1"
            - "WritersRoom.${rm}.status == ACTIVE and format == IN_PERSON: no refused call changed the room"

      - name: wrapped_rooms_declined_seats_and_locked_episodes_admit_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WritersRoom.terminal_states
          - state_machines.RoomSeat.terminal_states
          - state_machines.Episode.script_readiness.terminal_states
          - errors.ERR_SEAT_NOT_OFFERED
          - errors.ERR_SEAT_NOT_CONFIRMED
          - errors.ERR_EPISODE_ALREADY_LOCKED
        distinguishing_aspect: |
          Three terminal states are probed from three different machines in one fixture: a WRAPPED room
          refuses both wrap and seat offers, a DECLINED seat refuses accept (ERR_SEAT_NOT_OFFERED) and
          release (ERR_SEAT_NOT_CONFIRMED) with two different codes, and a LOCKED episode refuses a second
          lock and any new assignment with ERR_EPISODE_ALREADY_LOCKED.
        test_recipe:
          setup:
            - "Season SE with room RM ACTIVE, W1 CONFIRMED on S1 and W2's seat S2 DECLINED."
