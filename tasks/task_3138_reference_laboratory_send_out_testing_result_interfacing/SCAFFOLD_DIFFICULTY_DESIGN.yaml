            - call: "POST /reference-lab/test-catalog-entries/${t1b_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${c1_id}"
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - &specD2
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c1_id}", courier_run_id: "${cr_id}", accession_number: "ACC-8601", patient_mrn: "MRN-8701", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-08-31T20:00:00Z", received_at: "2026-08-31T20:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
