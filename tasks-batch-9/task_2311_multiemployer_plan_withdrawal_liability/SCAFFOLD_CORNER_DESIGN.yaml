      - name: filtering_assessments_by_collection_status_returns_the_projected_dimension
        claim_type: Computed read
        grounds:
          - "endpoints[GET /liability-assessments]"
          - "response_envelope.meta"
          - "calculations.collection_status_projection"
        distinguishing_aspect: |
          The three status filters address three independent dimensions of the same row, so
          a server that stores one combined status cannot answer them all. The probe also
          pins the fact that a sweep making an installment DUE does NOT move
          collection_status - only the first successful payment does - which is the
          distinction the projection formula draws and a plausible implementation
          conflates.
