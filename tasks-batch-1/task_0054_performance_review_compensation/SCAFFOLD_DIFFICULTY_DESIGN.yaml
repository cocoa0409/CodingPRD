scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: composite_score_no_feedback_vs_with_feedback
        grounds:
          - calculations.compute_composite_score
          - entities.FeedbackRequest.fields.status
          - entities.Review.fields.composite_score
        distinguishing_aspect: |
          This dual variant operates on the Review domain: identical Goals yield a
          different composite_score depending on whether any FeedbackRequest is
          SUBMITTED (no_feedback_fallback collapses feedback_score to goal_score).
        test_recipe:
          setup:
            - "An OPEN cycle with one band MEETS [0,100), one Review in MANAGER_REVIEW with a single SCORED goal (weight 1.0, attainment 0.8) and manager_rating MEETS"
            - "Variant A review has zero SUBMITTED feedback; Variant B review has two SUBMITTED feedback scores 5 and 5"
          setup_api_calls:
            - call: "POST /cycles"
              payload: { name: "FY26", cadence: "ANNUAL", merit_budget_pct: 0.10, equity_refresh_pool: 1000, bell_curve_target: { MEETS: 1.0 } }
              as: HrAdmin
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/rating-bands"
              payload: { label: "MEETS", min_score: 0, max_score: 100, merit_pct: 0.04, pip_eligible: false }
              as: HrAdmin
            - call: "POST /cycles/${cyc}/open"
              payload: {}
              as: HrAdmin
            - call: "POST /employees"
              payload: { full_name: "Mgr", department: "ENG", hire_date: "2019-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "EmpA", manager_id: "${mgr}", department: "ENG", hire_date: "2020-01-01T00:00:00.000Z" }
              as: HrAdmin
              captures: { empA: $.data.id }
            - call: "POST /reviews"
              payload: { cycle_id: "${cyc}", employee_id: "${empA}", reviewer_id: "${mgr}", base_salary: 100000 }
              as: HrAdmin
              captures: { revA: $.data.id }
            - call: "POST /reviews/${revA}/goals"
              payload: { title: "G1", weight: 1.0 }
              as: Manager
              as_user_id: "${mgr}"
              captures: { gA: $.data.id }
            - call: "POST /reviews/${revA}/begin-self-review"
              payload: {}
              as: Employee
              as_user_id: "${empA}"
            - call: "PATCH /reviews/${revA}"
              payload: { self_rating: "MEETS" }
              as: Employee
              as_user_id: "${empA}"
            - call: "POST /reviews/${revA}/submit-self"
              payload: {}
              as: Employee
              as_user_id: "${empA}"
            - call: "PATCH /reviews/${revA}"
              payload: { manager_rating: "MEETS" }
              as: Manager
              as_user_id: "${mgr}"
            - call: "POST /goals/${gA}/score"
              payload: { attainment_pct: 0.8 }
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /reviews/${revA}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { compA: $.data.composite_score }
          assert:
            - "composite_score == 80.00 for the no-feedback fallback (goal_score 80, feedback_score=goal_score, 0.7*80+0.3*80=80.00)"
      - name: equity_tenure_eligible_vs_ineligible
        grounds:
          - calculations.compute_equity_refresh
          - entities.Employee.fields.hire_date
          - entities.CompPlan.fields.equity_refresh_units
        distinguishing_aspect: |
          This dual variant operates on the CompPlan/Employee domain (not Review):
          the same band yields equity_refresh_units > 0 for a >=1yr-tenure employee
          but exactly 0 for a <1yr-tenure employee (tenure_ineligible variant).
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING with band EXCEEDS, two CALIBRATED reviews for two employees: one hired 3 years before cycle.created_at, one hired 100 days before"
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev_senior}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { plan_senior: $.data.id, eq_senior: $.data.equity_refresh_units }
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev_junior}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { plan_junior: $.data.id, eq_junior: $.data.equity_refresh_units }
          trigger:
            - call: "GET /comp-plans/${plan_junior}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "senior plan equity_refresh_units > 0"
            - "junior plan equity_refresh_units == 0 (tenure < 1 year)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes (a)/(b)/(c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: merit_matrix_nonlinear_mode_a
        grounds:
          - calculations.compute_merit_amount
          - entities.CompPlan.fields.plan_type
          - entities.CompPlan.fields.promo_band_jump
        distinguishing_aspect: |
          Mode (a): >=3 inputs (band base merit_pct, plan_type, promo_band_jump)
          with non-linear interaction — promo uplift is added then clamped by
          min(.., MERIT_PCT_CAP), a nested-min branch on entity state.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING; band EXCEEDS base merit_pct 0.24; one CALIBRATED EXCEEDS review base_salary 200000"
          setup_api_calls:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev_ex}", plan_type: "MERIT_AND_PROMO", promo_band_jump: 2, expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { plan_ex: $.data.id, mp: $.data.merit_pct, ma: $.data.merit_amount }
          trigger:
            - call: "GET /comp-plans/${plan_ex}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "merit_pct == 0.25 (0.24 + 0.03*2 = 0.30 clamped to MERIT_PCT_CAP 0.25)"
            - "merit_amount == 50000.00 (0.25 * 200000)"
      - name: merit_round_then_sum_mode_b
        grounds:
          - calculations.compute_merit_amount
          - entities.ReviewCycle.fields.merit_committed_total
          - state_machines.CompPlan.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Mode (b): pinned rounding order — each plan's merit_amount is rounded to
          2dp BEFORE being summed into merit_committed_total (round-then-sum), which
          differs in cents from sum-then-round across multiple approvals.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING, generous merit budget; two PROPOSED plans whose unrounded merit amounts are 1000.005 and 1000.005 (base_salary chosen so band merit_pct * salary = 1000.005)"
          setup_api_calls:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan1}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan2}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          trigger:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { committed: $.data.merit_committed_total }
          assert:
            - "each plan's merit_amount == 1000.01 (round_half_up of 1000.005)"
            - "merit_committed_total == 2000.02 (round-then-sum: 1000.01 + 1000.01), NOT 2000.01"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: review_return_revert_cycle
        grounds:
          - state_machines.Review.SUBMITTED_to_RETURNED
          - state_machines.Review.RETURNED_to_MANAGER_REVIEW
          - state_machines.Review.MANAGER_REVIEW_to_SUBMITTED
        distinguishing_aspect: |
          Review has a cycle/revert: SUBMITTED -> RETURNED -> MANAGER_REVIEW ->
          SUBMITTED, a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A SUBMITTED review in an OPEN cycle, reviewer_id = mgr, an HRBP who is not the reviewer"
          setup_api_calls:
            - call: "POST /reviews/${rev}/return"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
            - call: "POST /reviews/${rev}/reopen"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /reviews/${rev}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { st: $.data.status }
          assert:
            - "review status returns to SUBMITTED after the loop"
      - name: pipcase_branch_cured_vs_failed
        grounds:
          - state_machines.PipCase.ACTIVE_to_CURED
          - state_machines.PipCase.ACTIVE_to_FAILED
          - entities.PipCase.fields.outcome_score
        distinguishing_aspect: |
          PipCase (different entity from Review) branches ACTIVE -> {CURED, FAILED}
          with divergent side-effects (FAILED sets Employee.is_active=false).
        test_recipe:
          setup:
            - "An ACTIVE PipCase with target_score 70 on employee empX (is_active true)"
          setup_api_calls:
            - call: "POST /pip-cases/${pip}/activate"
              payload: { duration_days: 60, target_score: 70 }
              as: HrbpPartner
              as_user_id: "${hrbp}"
          trigger:
            - call: "POST /pip-cases/${pip}/assess"
              payload: { outcome_score: 65 }
              as: HrbpPartner
              as_user_id: "${hrbp}"
              captures: { pst: $.data.status }
          assert:
            - "PipCase status == FAILED (65 < 70)"
            - "Employee empX is_active == false after FAILED branch"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_depth3
        grounds:
          - state_machines.CalibrationSession.BALANCED_to_FINALIZED
          - state_machines.Review.SUBMITTED_to_CALIBRATED
          - entities.PipCase.fields.status
        distinguishing_aspect: |
          Depth-3 chain from calibration finalize: finalize -> Review SUBMITTED->
          CALIBRATED (link 1) -> that CALIBRATED review's pip_eligible final_rating
          causes PipCase creation (link 2 caused by link 1). Each link caused by
          the previous, not the finalize directly.
        test_recipe:
          setup:
            - "A BALANCED calibration session whose single in-scope SUBMITTED review has composite_score landing in a pip_eligible BELOW band"
          setup_api_calls:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          trigger:
            - call: "POST /calibration-sessions/${sess}/finalize"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "the in-scope review status == CALIBRATED and final_rating == BELOW"
            - "GET /reviews/{rev}/pip-cases returns exactly one PipCase in OPEN status (cascade-created)"
      - name: approve_cascade_depth3
        grounds:
          - state_machines.CompPlan.PROPOSED_to_APPROVED
          - state_machines.Review.CALIBRATED_to_FINALIZED
          - state_machines.PipCase.ACTIVE_to_CURED
        distinguishing_aspect: |
          Different trigger (comp-plan approve, not calibration finalize): approve ->
          Review CALIBRATED->FINALIZED (link1) -> finalized review's no-longer-pip-
          eligible band causes its PipCase to be CURED (link2 caused by link1).
        test_recipe:
          setup:
            - "A PROPOSED comp-plan referencing a CALIBRATED review whose final_rating was adjusted up out of the pip_eligible band, with an existing OPEN PipCase for that review; cycle in COMP_PLANNING with budget room"
          setup_api_calls:
            - call: "POST /comp-plans/${plan}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "referenced review status == FINALIZED"
            - "the review's PipCase status == CURED (cured because finalized band no longer pip_eligible)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_vs_fiscal_budget
        grounds:
          - validations[priority=6]
          - validations[priority=12]
        distinguishing_aspect: |
          Pair business_safety (segregation_of_duties, p6) vs business_fiscal
          (merit budget exceeded, p12): a self-approving manager on an over-budget
          plan must surface ERR_SEGREGATION_OF_DUTIES, not ERR_MERIT_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "A PROPOSED comp-plan whose approval would exceed the merit budget, where the acting CompApprover's user id equals the review's reviewer_id"
          setup_api_calls:
            - call: "POST /comp-plans/${plan}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${mgr}"
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (p6 beats p12), http 403"
      - name: state_vs_distribution_tolerance
        grounds:
          - validations[priority=4]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair state (p4) vs business_constraint (distribution out of tolerance, p10):
          balancing an already-FINALIZED session whose distribution is also out of
          tolerance must surface ERR_INVALID_STATE, not ERR_DISTRIBUTION_OUT_OF_TOLERANCE.
        test_recipe:
          setup:
            - "A FINALIZED calibration session whose in-scope reviews violate distribution tolerance"
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "response error_id == ERR_INVALID_STATE (p4 beats p10), http 409"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: merit_budget_exact_equality
        grounds:
          - validations[priority=12]
          - calculations.compute_merit_amount
        distinguishing_aspect: |
          Numeric threshold crossing on POST /comp-plans/{id}/approve: a plan that
          makes merit_committed_total exactly equal merit budget is ALLOWED (<=),
          one cent over is ERR_MERIT_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Cycle merit budget == 10000.00; a PROPOSED plan with merit_amount exactly 10000.00 and committed total 0"
          setup_api_calls:
            - call: "POST /comp-plans/${plan}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: HrAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /comp-plans/${plan}/approve"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "approve succeeds (merit_committed_total == merit budget exactly, <= passes)"
      - name: empty_feedback_set_boundary
        grounds:
          - calculations.compute_composite_score
          - entities.FeedbackRequest.fields.status
        distinguishing_aspect: |
          Empty-collection edge on POST /reviews/{id}/submit (different endpoint and
          metric): zero SUBMITTED feedback triggers the fallback branch rather than
          dividing by zero, distinct from the numeric-threshold boundary above.
        test_recipe:
          setup:
            - "A MANAGER_REVIEW review with one SCORED goal (attainment 1.0) and a feedback request that is DECLINED (so SUBMITTED set is empty)"
          setup_api_calls:
            - call: "POST /feedback-requests/${fr}/decline"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
          trigger:
            - call: "POST /reviews/${rev}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { cs: $.data.composite_score }
          assert:
            - "composite_score == 100.00 (goal 100, empty feedback -> feedback_score=goal_score, no div-by-zero)"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: review_submit_requires_cycle_open
        grounds:
          - state_machines.Review.DRAFT_to_SELF_REVIEW
          - entities.ReviewCycle.fields.status
        distinguishing_aspect: |
          Pair Review->ReviewCycle: a Review can begin-self-review only when its
          parent ReviewCycle.status == OPEN.
        test_recipe:
          setup:
            - "A DRAFT cycle (not yet opened) with a DRAFT review under it"
          setup_api_calls:
            - call: "POST /reviews"
              payload: { cycle_id: "${cyc}", employee_id: "${emp}", reviewer_id: "${mgr}", base_salary: 90000 }
              as: HrAdmin
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /reviews/${rev}/begin-self-review"
              payload: {}
              as: Employee
              as_user_id: "${emp}"
          assert:
            - "error_id == ERR_INVALID_STATE because parent cycle is DRAFT not OPEN"
      - name: compplan_propose_requires_review_calibrated
        grounds:
          - state_machines.CompPlan.DRAFT_to_PROPOSED
          - entities.Review.fields.status
        distinguishing_aspect: |
          Different pair CompPlan->Review: a CompPlan can move DRAFT->PROPOSED only
          when its referenced Review.status == CALIBRATED.
        test_recipe:
          setup:
            - "A DRAFT comp-plan whose referenced review is still SUBMITTED (not CALIBRATED)"
          setup_api_calls: []
          trigger:
            - call: "POST /comp-plans/${plan}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          assert:
            - "error_id == ERR_INVALID_STATE because referenced review is not CALIBRATED"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: distribution_tolerance_capacity_overlap
        grounds:
          - validations[priority=10]
          - calculations.assign_final_rating
          - entities.ReviewCycle.fields.bell_curve_target
        distinguishing_aspect: |
          Aggregate-capacity overlap semantics on CalibrationSession: the bell-curve
          band is a finite-fraction "interval" and balance is rejected when the
          aggregate occupancy of any band overflows target+tolerance (capacity-style
          overlap over the rating distribution), distinct from the point-tenure
          interval in the second instance.
        test_recipe:
          setup:
            - "An OPEN calibration session whose in-scope reviews all land in EXCEEDS (actual 1.0) while target EXCEEDS is 0.20, tolerance 0.05"
          setup_api_calls: []
          trigger:
            - call: "POST /calibration-sessions/${sess}/balance"
              payload: {}
              as: HrbpPartner
              as_user_id: "${hrbp}"
          assert:
            - "error_id == ERR_DISTRIBUTION_OUT_OF_TOLERANCE (EXCEEDS occupancy 1.0 overflows 0.20+0.05)"
      - name: tenure_window_eligibility_overlap
        grounds:
          - validations[priority=11]
          - calculations.compute_equity_refresh
          - entities.Employee.fields.hire_date
        distinguishing_aspect: |
          Half-open tenure-window semantics on CompPlan/Employee: equity eligibility
          tests whether [hire_date, cycle.created_at) spans >= 1 year (a single
          duration interval), a different interval geometry from the band-capacity
          overlap and on a different resource entity.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING; an employee hired exactly 364 days before cycle.created_at with a CALIBRATED EXCEEDS review"
          setup_api_calls: []
          trigger:
            - call: "GET /reviews/${rev}"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
              captures: { rev_v: $.data.version }
            - call: "POST /comp-plans"
              payload: { cycle_id: "${cyc}", review_id: "${rev}", plan_type: "MERIT_ONLY", expected_review_version: "${rev_v}" }
              as: Manager
              as_user_id: "${mgr}"
              captures: { eq: $.data.equity_refresh_units }
          assert:
            - "equity_refresh_units == 0 (floor of 364/365 days = 0 years < 1, just inside the disallowed window)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reject_preserves_merit_ledger
        grounds:
          - state_machines.CompPlan.PROPOSED_to_REJECTED
          - state_machines.CompPlan.PROPOSED_to_APPROVED
          - entities.ReviewCycle.fields.merit_committed_total
        distinguishing_aspect: |
          Conserved quantity: merit dollars. Invariant: merit_committed_total ==
          sum(merit_amount of APPROVED plans). A REJECT (compensating non-approval)
          must leave merit_committed_total identical to before the plan existed.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING with one APPROVED plan (merit 5000) so merit_committed_total==5000, and a second PROPOSED plan (merit 3000)"
          setup_api_calls:
            - call: "POST /comp-plans/${plan2}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /comp-plans/${plan2}/reject"
              payload: {}
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "merit_committed_total remains 5000.00 after reject (rejected plan never touches the ledger)"
      - name: equity_pool_conserved_on_reject
        grounds:
          - state_machines.CompPlan.PROPOSED_to_REJECTED
          - state_machines.CompPlan.PROPOSED_to_APPROVED
          - entities.ReviewCycle.fields.equity_committed_total
        distinguishing_aspect: |
          Different conserved quantity: equity share units. Invariant:
          equity_committed_total == sum(equity_refresh_units of APPROVED plans);
          a reject of an equity-bearing plan leaves equity_committed_total unchanged.
        test_recipe:
          setup:
            - "Cycle in COMP_PLANNING with one APPROVED plan granting 400 equity units so equity_committed_total==400, and a second PROPOSED plan granting 150 units"
          setup_api_calls:
            - call: "POST /comp-plans/${plan2}/propose"
              payload: {}
              as: Manager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /comp-plans/${plan2}/reject"
              payload: {}
              as: CompApprover
              as_user_id: "${approver}"
          assert:
            - "equity_committed_total remains 400.000 after reject"
