              captures: { del_t_w: $.data.version }
            - call: "POST /cpt/content-delivery-orders"
              payload: { license_id: "${lic_t}", distribution_channel: "SITE", format_params: { electronic_format: "NONE", media: "NONE", version_qualifier: "2026.1", payer_identifier_qualifier: "NONE" }, payer_identifier: "PLACEHOLDER", expected_license_version: "${lic_t_v1}" }
