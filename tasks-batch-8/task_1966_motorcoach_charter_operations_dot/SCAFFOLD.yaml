scenario: |
  1966. Motorcoach Charter Operations & DOT Compliance (charter motorcoach operator): quote by mileage/hours & driver overnight, driver hours-of-service & relief driver planning, vehicle assignment & maintenance/inspection status, deposit/cancellation tiers by lead time, group itinerary changes & extra hours billing, safety rating & customer audit requests, breakdown & replacement coach dispatch, insurance certificates for venues

domain_name: motorcoach-charter-operations
api_prefix: /api/v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Legal name of the charter customer organization"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email for quotes and trip documents"
      - name: contact_phone
        type: string
        source: input
        description: "Primary contact phone"
      - name: billing_address
        type: string
        source: input
        description: "Street address for invoicing"
      - name: tax_exempt
        type: boolean
        source: input
        description: "Whether customer is tax-exempt (affects quote pricing)"
        default: false
      - name: credit_status
        type: enum
        source: system
        description: "Derived credit standing based on payment history"
        constraints: "ACTIVE | SUSPENDED | COLLECTIONS"
        default: ACTIVE
      - name: safety_audit_score
        type: number
        source: computed
        description: "Composite safety rating computed from completed trip incident reports and vehicle inspection results; range 0.0–100.0"
      - name: total_completed_trips
        type: integer
        source: computed
        description: "Count of CharterOrder records in COMPLETED status for this customer"
        default: 0
      - name: lifetime_revenue_cents
        type: integer
        source: computed
        description: "Sum of final_invoice_cents on all COMPLETED CharterOrders"
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: unit_number
        type: string
        source: input
        description: "Fleet unit identifier (e.g., 'MC-101')"
        constraints: "Unique across all vehicles"
      - name: make_model
        type: string
        source: input
        description: "Manufacturer and model (e.g., 'Prevost H3-45')"
      - name: year
        type: integer
        source: input
        description: "Model year"
      - name: seating_capacity
        type: integer
        source: input
        description: "Maximum passenger seats"
      - name: ada_accessible
        type: boolean
        source: input
        description: "Whether vehicle has ADA lift"
        default: false
      - name: vehicle_class
        type: enum
        source: input
        description: "Rate class for pricing"
        constraints: "STANDARD | PREMIUM | EXECUTIVE"
        default: STANDARD
      - name: status
        type: enum
        source: system
        description: "Operational status of the vehicle"
        constraints: "AVAILABLE | ASSIGNED | IN_TRIP | IN_MAINTENANCE | OUT_OF_SERVICE"
        default: AVAILABLE
      - name: dot_inspection_expiry
        type: datetime
        source: input
        description: "Date of next required DOT annual inspection"
      - name: last_inspection_date
        type: datetime
        source: system
        description: "Date of most recent completed inspection"
      - name: odometer_miles
        type: integer
        source: system
        description: "Current odometer reading, updated on trip completion"
        default: 0
      - name: maintenance_due_miles
        type: integer
        source: input
        description: "Odometer threshold at which preventive maintenance is due"
      - name: insurance_policy_number
        type: string
        source: input
        description: "Insurance policy reference for this vehicle"
      - name: insurance_expiry
        type: datetime
        source: input
        description: "Expiration date of vehicle insurance policy"

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Driver legal name"
      - name: cdl_number
        type: string
        source: input
        description: "Commercial driver's license number"
        constraints: "Unique across all drivers"
      - name: cdl_class
        type: enum
        source: input
        description: "CDL classification"
        constraints: "CLASS_A | CLASS_B | CLASS_C"
      - name: endorsements
        type: array
        source: input
        description: "Array of endorsement codes (e.g., ['P', 'S'])"
      - name: hire_date
        type: datetime
        source: input
        description: "Date of hire"
      - name: status
        type: enum
        source: system
        description: "Driver availability status"
        constraints: "AVAILABLE | ON_TRIP | ON_DUTY_NOT_DRIVING | OFF_DUTY | SUSPENDED"
        default: AVAILABLE
      - name: hos_cycle_type
        type: enum
        source: input
        description: "DOT hours-of-service cycle: 70hr/8day or 60hr/7day"
        constraints: "CYCLE_70_8 | CYCLE_60_7"
        default: CYCLE_70_8
      - name: current_driving_hours_today
        type: number
        source: computed
        description: "Accumulated driving hours in the current 24-hour period; resets on 10 consecutive hours off-duty"
        default: 0.0
      - name: current_on_duty_hours_today
        type: number
        source: computed
        description: "Accumulated on-duty (driving + non-driving) hours in current 14-hour window"
        default: 0.0
      - name: current_cycle_hours
        type: number
        source: computed
        description: "Accumulated on-duty hours in the current 7/8-day cycle window"
        default: 0.0
      - name: last_rest_start
        type: datetime
        source: system
        description: "Timestamp when current or most recent off-duty period began"
      - name: consecutive_driving_minutes
        type: integer
        source: computed
        description: "Minutes of continuous driving since last 30-minute break; used for mandatory break enforcement"
        default: 0
      - name: safety_score
        type: number
        source: computed
        description: "Composite driver safety score 0.0–100.0; derived from incident reports, inspection violations, and customer complaints on completed trips"
        default: 100.0

  - name: CharterQuote
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> CustomerAccount.id; the customer requesting the quote"
      - name: trip_date
        type: datetime
        source: input
        description: "Requested departure date/time"
      - name: return_date
        type: datetime
        source: input
        description: "Requested return date/time"
      - name: origin
        type: string
        source: input
        description: "Pickup location"
      - name: destination
        type: string
        source: input
        description: "Drop-off location"
      - name: passenger_count
        type: integer
        source: input
        description: "Number of passengers"
      - name: estimated_miles
        type: integer
        source: input
        description: "Estimated total trip mileage"
      - name: estimated_hours
        type: number
        source: input
        description: "Estimated total trip duration in hours (departure to return)"
      - name: requires_overnight
        type: boolean
        source: computed
        description: "Whether trip spans midnight or requires driver overnight stay (estimated_hours > 10 or crosses midnight)"
      - name: requires_relief_driver
        type: boolean
        source: computed
        description: "Whether trip requires a relief driver based on estimated_hours exceeding single-driver HOS limits"
      - name: ada_required
        type: boolean
        source: input
        description: "Whether any passenger requires ADA-accessible vehicle"
        default: false
      - name: vehicle_class_requested
        type: enum
        source: input
        description: "Requested vehicle class"
        constraints: "STANDARD | PREMIUM | EXECUTIVE"
        default: STANDARD
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle status"
        constraints: "DRAFT | QUOTED | ACCEPTED | EXPIRED | CANCELLED"
        default: DRAFT
      - name: mileage_rate_cents
        type: integer
        source: computed
        description: "Per-mile rate in cents based on vehicle class and current pricing tier"
      - name: hourly_rate_cents
        type: integer
        source: computed
        description: "Per-hour rate in cents based on vehicle class"
      - name: overnight_fee_cents
        type: integer
        source: computed
        description: "Flat overnight accommodation fee per night for driver lodging"
      - name: relief_driver_fee_cents
        type: integer
        source: computed
        description: "Additional fee for relief driver when required"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Computed quote subtotal before tax"
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax amount; 0 if customer is tax-exempt"
      - name: total_cents
        type: integer
        source: computed
        description: "Total quoted price including tax"
      - name: deposit_cents
        type: integer
        source: computed
        description: "Required deposit amount based on lead-time tier at time of quote acceptance"
      - name: quote_expiry
        type: datetime
        source: computed
        description: "Quote expiration: 72 hours from creation"
      - name: pricing_variant
        type: enum
        source: system
        description: "Which pricing algorithm variant was used"
        constraints: "MILEAGE_PRIMARY | HOURLY_PRIMARY"
      - name: special_requests
        type: string
        source: input
        description: "Free-text special requests"
        default: ""

  - name: CharterOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> CharterQuote.id; the accepted quote this order is based on"
      - name: customer_id
        type: string
        source: computed
        description: "FK -> CustomerAccount.id; denormalized from quote"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle status"
        constraints: "PENDING_DEPOSIT | CONFIRMED | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED | DISPUTED"
        default: PENDING_DEPOSIT
      - name: assigned_vehicle_id
        type: string
        source: system
        description: "FK -> Vehicle.id; assigned vehicle (null until assignment)"
      - name: assigned_driver_id
        type: string
        source: system
        description: "FK -> Driver.id; primary driver (null until assignment)"
      - name: relief_driver_id
        type: string
        source: system
        description: "FK -> Driver.id; relief driver if required (null otherwise)"
      - name: actual_miles
        type: integer
        source: input
        description: "Actual miles driven, recorded on trip completion"
      - name: actual_hours
        type: number
        source: input
        description: "Actual trip hours, recorded on trip completion"
      - name: extra_hours
        type: number
        source: computed
        description: "Hours beyond the quoted estimate; billed at extra-hour rate"
        default: 0.0
      - name: extra_hours_charge_cents
        type: integer
        source: computed
        description: "Billing for extra hours at 1.5x standard hourly rate"
        default: 0
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        description: "Fuel surcharge computed as percentage of subtotal based on miles driven"
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: system
        description: "Amount of deposit actually received"
        default: 0
      - name: deposit_paid_at
        type: datetime
        source: system
        description: "Timestamp of deposit payment"
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Cancellation fee based on lead time before trip date"
        default: 0
      - name: refund_cents
        type: integer
        source: computed
        description: "Refund amount after cancellation fee deduction"
        default: 0
      - name: final_subtotal_cents
        type: integer
        source: computed
        description: "Final billing subtotal: quoted subtotal + extra hours + fuel surcharge + adjustments"
      - name: final_tax_cents
        type: integer
        source: computed
        description: "Final tax on final_subtotal_cents; 0 if tax-exempt"
      - name: final_invoice_cents
        type: integer
        source: computed
        description: "Final total invoice amount"
      - name: balance_due_cents
        type: integer
        source: computed
        description: "Remaining balance: final_invoice_cents - deposit_paid_cents"
      - name: itinerary_changes
        type: array
        source: system
        description: "Array of itinerary change records, each with timestamp and description"
        default: []
      - name: cancelled_by
        type: enum
        source: system
        description: "Who initiated cancellation"
        constraints: "CUSTOMER | OPERATOR | SYSTEM"
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason for cancellation"
      - name: completed_at
        type: datetime
        source: system
        description: "Timestamp of trip completion"

  - name: TripLog
    parent: CharterOrder
    common_fields: false
    fields:
