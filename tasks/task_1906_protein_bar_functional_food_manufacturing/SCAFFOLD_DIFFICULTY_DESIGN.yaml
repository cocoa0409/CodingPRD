  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_state_on_missing_revision
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair existence vs state: approving a nonexistent revision must answer
          ERR_REVISION_NOT_FOUND (404), while approving an existing DRAFT revision answers
          ERR_INVALID_STATE (409) — proving the existence check is evaluated first.
        test_recipe:
          setup:
            - "customer C1; formula F10; revision R10 in DRAFT"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F10", bar_weight_g: 60 }, as: FormulationScientist, captures: { f10: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f10}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 19 }, as: FormulationScientist, captures: { r10: "$.data.id" } }
          trigger:
            - { call: "POST /mfg/revisions/11111111-2222-3333-4444-555555555555/approve", payload: {}, as: QualityManager, captures: { err_missing: "$.data.error_id" } }
            - { call: "POST /mfg/revisions/${r10}/approve", payload: {}, as: QualityManager, captures: { err_state: "$.data.error_id" } }
          assert:
            - "missing revision returns error_id ERR_REVISION_NOT_FOUND (existence, priority 4) — never reaches the state check"
            - "existing DRAFT revision returns error_id ERR_INVALID_STATE (state, priority 9)"

