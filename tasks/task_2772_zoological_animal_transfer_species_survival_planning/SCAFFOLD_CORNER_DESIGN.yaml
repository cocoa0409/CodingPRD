              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-28", trainer_name: "T Rios", duration_minutes: 25 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_v2: $.data.version }
          trigger:
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "HOLD", subject_animal_id: "${m1_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "HOLD", subject_animal_id: "${m1_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v2}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "The captured ${m1_v1} == 1 and ${m1_v2} == 2"
            - "First call: status 412 with data.error_id == 'ERR_STALE_ANIMAL_VERSION'"
            - "After the first call, GET /population-recommendations returns total_count == 0 and Animal.${m1_id}.pending_recommendation_id == null"
            - "Second call: status 201 with PopulationRecommendation.${rec_id}.status == PROPOSED"
            - "Animal.${m1_id}.pending_recommendation_id == ${rec_id} and version == 3"

      - name: stale_expected_transfer_agreement_version_is_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-agreement]
          - validations[priority=45, error_id=ERR_STALE_AGREEMENT_VERSION]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: "The agreement version observed at acceptance is stale by the time the booking is opened, because execute bumped it: the booking create returns 412 ERR_STALE_AGREEMENT_VERSION, and the retry with the version read after execute is accepted as RESERVED."
        test_recipe:
          setup: ["The canonical agreement is EXECUTED. The version captured at accept time is deliberately reused as expected_transfer_agreement_version, then the post-execute version is read back for the retry."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: {}
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", ownership_disposition: "OWNERSHIP_TRANSFER", offspring_disposition_rule: "SPLIT_50_50", breeding_rights: "FULL", transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
            - call: "POST /transfer-agreements/${ta_id}/offer"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /transfer-agreements/${ta_id}/accept"
              payload: {}
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { ta_v_accept: $.data.version }
            - call: "POST /transfer-agreements/${ta_id}/execute"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_v_exec: $.data.version }
          trigger:
            - call: "POST /shipment-bookings"
              payload: { transfer_agreement_id: "${ta_id}", carrier_code: "AVI-CARGO-7", crate_serial: "CR-CRATE-001", departure_utc: "2026-09-01T08:00:00Z", arrival_utc: "2026-09-01T20:00:00Z", temp_min_c: 10.0, temp_max_c: 24.0, expected_transfer_agreement_version: "${ta_v_accept}" }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /shipment-bookings"
              payload: { transfer_agreement_id: "${ta_id}", carrier_code: "AVI-CARGO-7", crate_serial: "CR-CRATE-001", departure_utc: "2026-09-01T08:00:00Z", arrival_utc: "2026-09-01T20:00:00Z", temp_min_c: 10.0, temp_max_c: 24.0, expected_transfer_agreement_version: "${ta_v_exec}" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "${ta_v_exec} is greater than ${ta_v_accept}, because execute wrote the agreement"
            - "First call: status 412 with data.error_id == 'ERR_STALE_AGREEMENT_VERSION'"
            - "After the first call, GET /shipment-bookings?transfer_agreement_id=${ta_id} returns total_count == 0"
            - "Second call: status 201 with ShipmentBooking.${booking_id}.status == RESERVED"
            - "ShipmentBooking.${booking_id}.carrier_code == 'AVI-CARGO-7' and thermal_excursion_minutes == null"

      - name: compliance_points_threshold_demotes_an_accredited_institution
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.studbook_lateness_assessment
          - state_machines[StudbookSubmission].transitions[SUBMITTED->ACCEPTED].side_effects
          - entities.Institution.fields.compliance_points_balance
        distinguishing_aspect: "A single late submission crosses the cumulative ACCREDITATION_REVIEW_POINTS threshold in one step: reporting_period_end 2026-06-01 gives deadline 2026-07-01, submitted_on 2026-08-01 gives days_late 31, base_points 15.50, tier 0.40, surcharge 6.20 and total 21.70, and posting 21.70 >= 21.00 at review demotes ACCREDITED to PROVISIONAL."
        test_recipe:
          setup: ["Cedar Ridge Zoo (ACCREDITED, compliance_points_balance 0.00) and a species program exist. Clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /studbook-submissions"
              payload: { species_program_id: "${program_id}", institution_id: "${sender_id}", submission_type: "ACQUISITION", reporting_period_end: "2026-06-01" }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /studbook-submissions/${sub_id}/review"
              payload: { outcome: "ACCEPT", review_note: "late but complete" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
          assert:
            - "First call: status 201, StudbookSubmission.${sub_id}.days_late == 31 and base_points == 15.50"
            - "StudbookSubmission.${sub_id}.surcharge_multiplier == 0.40, surcharge_points == 6.20, total_compliance_points == 21.70"
            - "Immediately after filing, Institution.${sender_id}.compliance_points_balance is still 0.00 and accreditation_status is still ACCREDITED"
            - "Second call: status 200 and StudbookSubmission.${sub_id}.status == ACCEPTED"
            - "Institution.${sender_id}.compliance_points_balance == 21.70"
            - "Institution.${sender_id}.accreditation_status == PROVISIONAL, because 21.70 >= ACCREDITATION_REVIEW_POINTS 21.00"

      - name: four_link_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / execute_cascade_four_links_to_cycle_closed
          rationale: "That instance verifies the full four-link chain in one request and asserts every intermediate entity, which is the end-to-end cascade claim for this layer."
      - name: both_credit_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_transfer_credit_points
          rationale: "That instance asserts the provisional value at execute and the final value at deliver on the same agreement, together with the ledger delta between them."

  - section: consistency_model
    instances:
      - name: denormalised_counters_are_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.holding_slot_occupancy
          - entities.Institution.fields.occupied_slots
        distinguishing_aspect: "There is no lag between a write and its derived reads: the accession response already reports crate_training_sessions_count 0 for the new animal, and the institution read taken immediately afterwards already reports occupied_slots 1 without any retry or delay."
        test_recipe:
          setup: ["Cedar Ridge Zoo and a species program exist; the institution reports occupied_slots 0."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /institutions/${sender_id}"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-28", trainer_name: "T Rios", duration_minutes: 25 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "First call: the 201 response body itself reports location_status HELD and crate_training_sessions_count 0"
            - "Second call: Institution.${sender_id}.occupied_slots == 1 on the first read, with no retry"
            - "Third call: the response body itself reports crate_training_sessions_count 1 and last_crate_session_on 2026-07-28"
            - "A repeated GET /animals/${m1_id} returns exactly the values the third call already returned"
