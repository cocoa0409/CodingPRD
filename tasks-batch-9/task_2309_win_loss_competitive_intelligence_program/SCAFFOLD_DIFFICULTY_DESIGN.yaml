              payload: { window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", basis: "INCLUDE_PROVISIONAL" }
              as: ProgramAdmin
          assert:
            - "RATIFIED_ONLY response: data.attribution_count == 1"
