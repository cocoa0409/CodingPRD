# §1.9 Scaffold Corner Design — breadth probe over §1.1–§1.7 of SCAFFOLD.yaml.
# Taxonomy: references/claim-extraction-guide.md (nine sections; per-section claim_type rows).
# YAML anchors below (&b_* single calls, &base_pre / &base_full lists) are expanded by the
# parser into identical structured call objects; they exist only to keep the base chain
# byte-identical across instances. Anchors are document-local, so this file re-declares the
# base chain that SCAFFOLD_DIFFICULTY_DESIGN.yaml declares separately.

scaffold_corner_design:
  - section: entities
    instances:
      - name: receipt_creation_returns_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.WarehouseReceipt
          - endpoints[POST /receipts]
          - calculations.deposit_grade_and_net_bushels
          - calculations.storage_charge_accrual
        distinguishing_aspect: "POST /receipts with all six required inputs returns 201 and every declared WarehouseReceipt field, including the system-stamped warehouse_id/storage_agreement_id/bin_id copied from the ticket and the computed quantity_bushels 949."
        test_recipe:
          setup:
            - "Empty DB. Logical clock pinned to 2026-08-05T08:00:00Z."
            - "Licensed STATE warehouse in KS, 500000 bu capacity, 2500000 bond, 5000000 net worth, 2 loadout lanes, registry participant."
            - "COMMINGLED corn agreement for producer Ada Farms: min_grade US_NO_3, max_moisture 14.0, 350 millicents/bu/day, receiving 6c/bu, loadout 8c/bu, 15 free days, declared value 420c/bu."
            - "One ACCEPTED deposit ticket of 949 net bushels of US_NO_1 corn in bin B1."
          setup_api_calls: &base_pre
            - &b_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StateRegulator
              as_user_id: "reg-001"
            - &b_wh
              call: "POST /warehouses"
              payload:
                name: "Prairie Elevator"
                operator_name: "Prairie Grain Co"
                state_code: "KS"
                license_program: "STATE"
                licensed_capacity_bushels: 500000
                bond_amount_cents: 2500000
                net_worth_cents: 5000000
                loadout_lane_count: 2
                registry_participant: true
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { wh_id: $.data.id }
            - &b_lic
              call: "POST /warehouses/${wh_id}/license-decision"
              payload: { decision: "ISSUE", license_effective_date: "2026-08-01", license_expiry_date: "2027-07-31" }
              as: StateRegulator
              as_user_id: "reg-001"
            - &b_dep
              call: "POST /parties"
              payload: { name: "Ada Farms", party_kind: "PRODUCER_DEPOSITOR", state_code: "KS" }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { dep_id: $.data.id }
            - &b_len
              call: "POST /parties"
              payload: { name: "AgCredit Bank", party_kind: "LENDER", state_code: "KS", credit_line_cents: 50000000 }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { len_id: $.data.id }
            - &b_agr
              call: "POST /storage-agreements"
              payload:
                warehouse_id: "${wh_id}"
                depositor_party_id: "${dep_id}"
                commodity: "CORN"
                storage_kind: "COMMINGLED"
                min_grade: "US_NO_3"
                max_moisture_pct: 14.0
                storage_rate_millicents_per_bushel_day: 350
                receiving_charge_cents_per_bushel: 6
                loadout_charge_cents_per_bushel: 8
                free_storage_days: 15
                declared_value_cents_per_bushel: 420
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { agr_id: $.data.id }
            - &b_bin
              call: "POST /bins"
              payload: { warehouse_id: "${wh_id}", bin_code: "B1", capacity_bushels: 40000, commodity: "CORN", commingling_allowed: true }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_id: $.data.id }
            - &b_tk
              call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_id}"
                gross_bushels: 1005
                test_weight_lbs: 56.5
                moisture_pct: 15.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 4.5
                fill_start_at: "2026-08-05T09:00:00Z"
                fill_end_at: "2026-08-05T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk_id: $.data.id }
            - &b_binv
              call: "GET /bins/${bin_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_v: $.data.version }
            - &b_acc
              call: "POST /deposit-tickets/${tk_id}/accept"
              payload: { expected_bin_version: "${bin_v}" }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - &b_whv
              call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { wh_v: $.data.version }
          trigger:
            - &b_rc
              call: "POST /receipts"
              payload:
                deposit_ticket_id: "${tk_id}"
                holder_party_id: "${dep_id}"
                receipt_number: "WR-0001"
                form: "NEGOTIABLE"
                medium: "ELECTRONIC"
                expected_warehouse_version: "${wh_v}"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { rc_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp, response_type == object"
            - "WarehouseReceipt.${rc_id}.warehouse_id == ${wh_id}"
            - "WarehouseReceipt.${rc_id}.storage_agreement_id == ${agr_id}"
            - "WarehouseReceipt.${rc_id}.bin_id == ${bin_id}"
            - "WarehouseReceipt.${rc_id}.quantity_bushels == 949"
            - "WarehouseReceipt.${rc_id}.grade == US_NO_1"
            - "WarehouseReceipt.${rc_id}.moisture_pct == 15.0"
            - "WarehouseReceipt.${rc_id}.face_price_cents_per_bushel == 420"
            - "WarehouseReceipt.${rc_id}.receiving_charge_cents == 5694"
            - "WarehouseReceipt.${rc_id}.provisional_storage_charge_cents == 332"
            - "WarehouseReceipt.${rc_id}.receipt_state == ISSUED"
            - "WarehouseReceipt.${rc_id}.encumbrance_state == UNENCUMBERED"
            - "WarehouseReceipt.${rc_id}.quality_flag == SOUND"
            - "WarehouseReceipt.${rc_id}.registry_control_party_id == null"
            - "WarehouseReceipt.${rc_id}.transfer_log == []"
            - "WarehouseReceipt.${rc_id}.issued_at == 2026-08-05T08:00:00Z"
            - "WarehouseReceipt.${rc_id}.version == 1"
            - "DepositTicket.${tk_id}.ticket_state == RECEIPTED"

      - name: receipt_retrieval_returns_stored_receipt
        claim_type: retrieval
        grounds: ["entities.WarehouseReceipt", "endpoints[GET /receipts/{receipt_id}]"]
        distinguishing_aspect: "GET /receipts/{receipt_id} returns the same row the POST minted — quantity_bushels 949 and receipt_number WR-0001 — with response_type object and no version bump from the read."
        test_recipe:
          setup:
            - "Base chain complete: receipt WR-0001 ISSUED for 949 bushels of US_NO_1 corn at version 1."
          setup_api_calls: &base_full
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
          trigger:
            - call: "GET /receipts/${rc_id}"
              payload: {}
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 200, response_type == object"
            - "WarehouseReceipt.${rc_id}.receipt_number == WR-0001"
            - "WarehouseReceipt.${rc_id}.quantity_bushels == 949"
            - "WarehouseReceipt.${rc_id}.version == 1 (a read does not bump version)"

      - name: deposit_ticket_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /deposit-tickets]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "Three tickets exist on bin B1; GET /deposit-tickets with limit 2 offset 0 returns exactly 2 rows with total_count 3 and has_more true, and offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Base chain complete (ticket 1 RECEIPTED under WR-0001)."
            - "Two further WEIGHED tickets on the same bin with non-colliding fill windows on 2026-08-06 and 2026-08-07."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_len
            - *b_agr
            - *b_bin
            - *b_tk
            - *b_binv
            - *b_acc
            - *b_whv
            - *b_rc
            - call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_id}"
                gross_bushels: 500
                test_weight_lbs: 56.5
                moisture_pct: 13.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 0.0
                fill_start_at: "2026-08-06T09:00:00Z"
                fill_end_at: "2026-08-06T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk2_id: $.data.id }
            - call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_id}"
                gross_bushels: 600
                test_weight_lbs: 56.5
                moisture_pct: 13.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 0.0
                fill_start_at: "2026-08-07T09:00:00Z"
                fill_end_at: "2026-08-07T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { tk3_id: $.data.id }
          trigger:
            - call: "GET /deposit-tickets"
              payload: { bin_id: "${bin_id}", limit: 2, offset: 0 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
            - call: "GET /deposit-tickets"
              payload: { bin_id: "${bin_id}", limit: 2, offset: 2 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "First call: HTTP 200, response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "DepositTicket.${tk2_id}.ticket_state == WEIGHED and DepositTicket.${tk3_id}.ticket_state == WEIGHED"
            - "Bin.${bin_id}.scheduled_inbound_bushels == 1100 (500 + 600 WEIGHED net bushels)"

      - name: warehouse_not_found_on_unknown_id
        claim_type: not_found
        grounds: ["validations[priority 40]", "errors[ERR_WAREHOUSE_NOT_FOUND]"]
        distinguishing_aspect: "GET /warehouses/{warehouse_id} with a syntactically valid but unused UUID returns 404 ERR_WAREHOUSE_NOT_FOUND, not an empty 200."
        test_recipe:
          setup: ["Empty DB except the clock."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "GET /warehouses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "HTTP 404 with data.error_id == ERR_WAREHOUSE_NOT_FOUND and response_type == error"

      - name: bin_not_found_on_condition_assessment
        claim_type: not_found
        grounds: ["validations[priority 40]", "errors[ERR_BIN_NOT_FOUND]", "endpoints[POST /bins/{bin_id}/condition-assessment]"]
        distinguishing_aspect: "An action endpoint (not just a GET) resolves its path id before any business rule: POST /bins/{unknown}/condition-assessment returns 404 ERR_BIN_NOT_FOUND."
        test_recipe:
          setup: ["Licensed warehouse exists; no bin with the requested id."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
          trigger:
            - call: "POST /bins/00000000-0000-4000-8000-0000000000bb/condition-assessment"
              payload: { moisture_pct: 13.0, temperature_f: 60 }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP 404 with data.error_id == ERR_BIN_NOT_FOUND"

      - name: receipt_not_found_on_delivery_order_creation
        claim_type: not_found
        grounds: ["validations[priority 40]", "errors[ERR_RECEIPT_NOT_FOUND]", "endpoints[POST /delivery-orders]"]
        distinguishing_aspect: "A body-borne FK is existence-checked too: POST /delivery-orders with an unused receipt_id returns 404 ERR_RECEIPT_NOT_FOUND before any quantity check."
        test_recipe:
          setup: ["Base chain complete; the receipt_id supplied in the body does not exist."]
          setup_api_calls: *base_full
          trigger:
            - call: "POST /delivery-orders"
              payload:
                receipt_id: "00000000-0000-4000-8000-0000000000rc"
                requested_bushels: 100
                appointment_start_at: "2026-08-20T09:00:00Z"
                appointment_end_at: "2026-08-20T11:00:00Z"
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 404 with data.error_id == ERR_RECEIPT_NOT_FOUND"

      - name: storage_agreement_missing_free_storage_days_rejected
        claim_type: required_fields
        grounds: ["validations[priority 30]", "errors[ERR_VALIDATION]", "endpoints[POST /storage-agreements]"]
        distinguishing_aspect: "free_storage_days has source input and no default, so omitting it returns 422 ERR_VALIDATION and creates no StorageAgreement row."
        test_recipe:
          setup: ["Licensed warehouse and producer party exist."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
          trigger:
            - call: "POST /storage-agreements"
              payload:
                warehouse_id: "${wh_id}"
                depositor_party_id: "${dep_id}"
                commodity: "CORN"
                storage_kind: "COMMINGLED"
                min_grade: "US_NO_3"
                max_moisture_pct: 14.0
                storage_rate_millicents_per_bushel_day: 350
                receiving_charge_cents_per_bushel: 6
                loadout_charge_cents_per_bushel: 8
                declared_value_cents_per_bushel: 420
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_VALIDATION"
            - "GET /storage-agreements filtered by warehouse_id ${wh_id} returns total_count == 0"

      - name: party_credit_line_defaults_to_zero
        claim_type: defaults
        grounds: ["entities.Party.credit_line_cents", "endpoints[POST /parties]"]
        distinguishing_aspect: "Omitting the optional credit_line_cents on POST /parties yields credit_line_cents 0 and available_credit_cents 0, not null."
        test_recipe:
          setup: ["Empty DB except the clock."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /parties"
              payload: { name: "Ada Farms", party_kind: "PRODUCER_DEPOSITOR", state_code: "KS" }
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Party.${p_id}.credit_line_cents == 0"
            - "Party.${p_id}.committed_advance_cents == 0"
            - "Party.${p_id}.available_credit_cents == 0"
            - "Party.${p_id}.settlement_balance_cents == 0"

      - name: bin_derived_quantities_reconcile_after_accept_and_delivery_hold
        claim_type: computed_fields
        grounds:
          - entities.Bin.stored_bushels
          - entities.Bin.held_bushels
          - entities.Bin.available_bushels
          - entities.Bin.blended_grade
          - calculations.position_reconciliation
        distinguishing_aspect: "After accepting 949 net bushels and holding 400 for a REQUESTED delivery order, Bin.available_bushels is 549 = 949 - 400 and blended_grade is US_NO_1; none of these three is a client input."
        test_recipe:
          setup:
            - "Base chain complete; one REQUESTED delivery order for 400 bushels against WR-0001."
          setup_api_calls: *base_full
          trigger:
            - call: "POST /delivery-orders"
              payload:
                receipt_id: "${rc_id}"
                requested_bushels: 400
                appointment_start_at: "2026-08-20T09:00:00Z"
                appointment_end_at: "2026-08-20T11:00:00Z"
              as: Depositor
              as_user_id: "${dep_id}"
              captures: { do_id: $.data.id }
          assert:
            - "Bin.${bin_id}.stored_bushels == 949"
            - "Bin.${bin_id}.held_bushels == 400"
            - "Bin.${bin_id}.available_bushels == 549"
            - "Bin.${bin_id}.scheduled_inbound_bushels == 0"
            - "Bin.${bin_id}.cumulative_shrink_bushels == 11"
            - "Bin.${bin_id}.blended_grade == US_NO_1"
            - "DeliveryOrder.${do_id}.lane_index == 0"
            - "Warehouse.${wh_id}.system_physical_bushels == 949"

      - name: deposit_ticket_system_fields_are_server_generated
        claim_type: system_fields
        grounds: ["entities.DepositTicket.ticket_state", "entities.DepositTicket.accepted_at", "entities.DepositTicket.settlement_variant"]
        distinguishing_aspect: "A freshly created DepositTicket carries server-set ticket_state WEIGHED, accepted_at null, version 1, created_at == the logical clock, and settlement_variant copied from the agreement's storage_kind — none of which appear in the endpoint's input."
        test_recipe:
          setup: ["Licensed warehouse with a COMMINGLED agreement and bin B1; clock at 2026-08-05T08:00:00Z."]
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - *b_bin
          trigger:
            - *b_tk
          assert:
            - "HTTP 201"
            - "DepositTicket.${tk_id}.ticket_state == WEIGHED"
            - "DepositTicket.${tk_id}.accepted_at == null"
            - "DepositTicket.${tk_id}.rejection_reason == null"
            - "DepositTicket.${tk_id}.settlement_variant == COMMINGLED"
            - "DepositTicket.${tk_id}.created_at == 2026-08-05T08:00:00Z"
            - "DepositTicket.${tk_id}.updated_at == 2026-08-05T08:00:00Z"
            - "DepositTicket.${tk_id}.version == 1"

      - name: warehouse_license_program_rejects_unknown_enum_member
        claim_type: type_constraints
        grounds: ["entities.Warehouse.license_program", "validations[priority 30]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "license_program accepts only STATE or FEDERAL; the value COUNTY returns 422 ERR_VALIDATION and no Warehouse row is created."
        test_recipe:
          setup: ["Empty DB except the clock."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /warehouses"
              payload:
                name: "Prairie Elevator"
                operator_name: "Prairie Grain Co"
                state_code: "KS"
                license_program: "COUNTY"
                licensed_capacity_bushels: 500000
                bond_amount_cents: 2500000
                net_worth_cents: 5000000
                loadout_lane_count: 2
                registry_participant: true
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "HTTP 422 with data.error_id == ERR_VALIDATION"
            - "GET /warehouses returns total_count == 0"

      - name: delivery_order_appointment_end_before_start_rejected
        claim_type: type_constraints
        grounds: ["validations[priority 30]", "errors[ERR_VALIDATION]", "endpoints[POST /delivery-orders]"]
        distinguishing_aspect: "An interval input with appointment_end_at earlier than appointment_start_at is rejected at priority 30 with ERR_VALIDATION, before any lane-capacity search runs."
        test_recipe:
          setup: ["Base chain complete; warehouse has 2 free loadout lanes."]
          setup_api_calls: *base_full
          trigger:
            - call: "POST /delivery-orders"
              payload:
                receipt_id: "${rc_id}"
                requested_bushels: 100
                appointment_start_at: "2026-08-20T11:00:00Z"
                appointment_end_at: "2026-08-20T09:00:00Z"
              as: Depositor
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_VALIDATION"
            - "Bin.${bin_id}.held_bushels == 0"

      - name: bin_commodity_must_match_agreement_commodity
        claim_type: foreign_key_integrity
        grounds: ["validations[priority 45]", "errors[ERR_COMMODITY_MISMATCH]", "entities.Bin.commodity", "entities.StorageAgreement.commodity"]
        distinguishing_aspect: "flat topology: a SOYBEANS bin referenced by a CORN agreement's ticket returns 422 ERR_COMMODITY_MISMATCH at priority 45, before the grade and capacity checks that would also pass."
        test_recipe:
          setup:
            - "Licensed warehouse with a CORN COMMINGLED agreement and a second bin B2 whose commodity is SOYBEANS."
          setup_api_calls:
            - *b_clock
            - *b_wh
            - *b_lic
            - *b_dep
            - *b_agr
            - call: "POST /bins"
              payload: { warehouse_id: "${wh_id}", bin_code: "B2", capacity_bushels: 40000, commodity: "SOYBEANS", commingling_allowed: true }
              as: WarehouseOperator
              as_user_id: "${wh_id}"
              captures: { bin_soy_id: $.data.id }
          trigger:
            - call: "POST /deposit-tickets"
              payload:
                storage_agreement_id: "${agr_id}"
                bin_id: "${bin_soy_id}"
                gross_bushels: 1005
                test_weight_lbs: 56.5
                moisture_pct: 15.0
                damage_pct: 2.0
                foreign_material_pct: 1.0
                dockage_pct: 4.5
                fill_start_at: "2026-08-05T09:00:00Z"
                fill_end_at: "2026-08-05T11:00:00Z"
              as: WarehouseOperator
              as_user_id: "${wh_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_COMMODITY_MISMATCH"
            - "Bin.${bin_soy_id}.scheduled_inbound_bushels == 0"

      - name: lien_lender_slot_rejects_producer_depositor_party
        claim_type: foreign_key_integrity
        grounds: ["validations[priority 45]", "errors[ERR_PARTY_KIND_INVALID]", "entities.Party.party_kind", "endpoints[POST /collateral-liens]"]
        distinguishing_aspect: "The lender_party_id slot demands party_kind LENDER: supplying the PRODUCER_DEPOSITOR party (as itself, so ownership at priority 25 passes) returns 422 ERR_PARTY_KIND_INVALID."
        test_recipe:
          setup:
            - "Base chain complete; receipt WR-0001 ISSUED, NEGOTIABLE, ELECTRONIC."
            - "The caller is the producer party acting under role Lender, so the ownership check at priority 25 is satisfied and only the party_kind check can fail."
          setup_api_calls: *base_full
          trigger:
            - call: "POST /collateral-liens"
              payload:
                receipt_id: "${rc_id}"
                lender_party_id: "${dep_id}"
                principal_cents: 250000
                valuation_basis: "MARK_TO_MARKET"
                mark_price_cents_per_bushel: 450
                perfection_method: "ELECTRONIC_CONTROL"
              as: Lender
              as_user_id: "${dep_id}"
          assert:
            - "HTTP 422 with data.error_id == ERR_PARTY_KIND_INVALID"
            - "GET /collateral-liens filtered by receipt_id ${rc_id} returns total_count == 0"
            - "WarehouseReceipt.${rc_id}.encumbrance_state == UNENCUMBERED"

  - section: state_machines
    instances:
      - name: warehouse_starts_applied_and_solvent_with_derived_requirements
        claim_type: initial_state
