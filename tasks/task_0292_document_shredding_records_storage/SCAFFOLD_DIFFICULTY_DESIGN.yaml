            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1", destroy_after_period: 5 }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /compliance-holds"
              payload: { account_id: "${acct_id}", subject_type: "RETENTION_BOX", subject_id: "${box1}", reason: "AUDIT_HOLD" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /retention-boxes/${box1}/purge"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SUBJECT_ON_HOLD (business_safety priority 6 wins over business_temporal priority 8)"

