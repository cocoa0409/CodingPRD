              captures: { a1: $.data.id }
            - call: "POST /v1/assets/${a1}/liquidate"
              payload: { liquidation_value_cents: 50000 }
              as: Receiver
          trigger:
            - call: "POST /v1/distribution-plans"
              payload: { case_id: "${case_id}", reserve_cents: 60000 }
              as: Receiver
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RESERVE_EXCEEDS_POOL"

      - name: court_approval_above_requested_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_AMOUNT_EXCEEDS_REQUEST]", state_machines.FeeApplication.FILED_to_APPROVED]
        distinguishing_aspect: "The court may haircut but never inflate: approving 25001 against a requested 25000 is rejected with ERR_AMOUNT_EXCEEDS_REQUEST."
        test_recipe:
