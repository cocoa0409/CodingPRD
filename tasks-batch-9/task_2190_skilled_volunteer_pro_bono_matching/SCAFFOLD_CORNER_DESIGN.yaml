      - name: endpoint_clock_set_malformed_timestamp_rejected
        claim_type: action_endpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]", "errors[ERR_VALIDATION]", "errors[ERR_CLOCK_REGRESSION]", "validations[priority=17]", "validations[priority=42]"]
        distinguishing_aspect: "An unparseable to_iso8601 cannot be compared to the current instant, so the priority-17 schema rule answers with 422 ERR_VALIDATION rather than the priority-42 ERR_CLOCK_REGRESSION; the clock is still at its 2026-08-01T00:00:00Z default afterwards."
