  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three DIFFERENT entity pairs; in each case the acted-on row is in a state
  # that permits the action and the rejection comes entirely from a second,
  # untouched entity:
  #   7a: Match  <- Team    (confirm blocked by the away Team's compliance flag)
  #   7b: RatingAppeal <- Section (grant blocked by the section rating epoch)
  #   7c: League <- League  (advance blocked by the PARENT league's capacity)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: match_confirm_blocked_by_opposing_team_compliance_flag_rejected
        grounds:
          - validations[priority=32]
          - entities.Team.fields.roster_compliant
          - entities.Match.fields.schedule_status
          - calculations.strike_weight_ledger
          - entities.League.fields.noncompliant_team_count
        distinguishing_aspect: |
          The Match is SCHEDULED, its league is IN_PLAY and both teams are IN_PLAY, so every
          state on the Match itself admits confirm; the 409 ERR_TEAM_ROSTER_NONCOMPLIANT comes
          only from Team A's roster_compliant flag, which flipped when a strike on a player who
          is not even in the confirming captain's team dropped active_roster_size to 1. The
          Match keeps schedule_status SCHEDULED and its slot, proving no partial write.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with strike_limit 3; SECTION league with min_active_roster_size 2, both teams IN_PLAY with two ACTIVE 4.0 players each."
            - "Match M1 (home Team H, away Team A) is scheduled at fac for 2026-08-15T18:00:00Z with courts_required 3; the clock stays at 2026-08-08T00:00:00Z so the slot is still in the future."
            - "Player a2 then receives one SCORECARD_FALSIFICATION strike (weight 3 == strike_limit): a2 becomes STRIKE_SUSPENDED, its spot goes INELIGIBLE, Team A active_roster_size drops to 1 and roster_compliant becomes false."
            - "Team H is untouched and fully compliant, and the confirming actor is Team H's captain."
