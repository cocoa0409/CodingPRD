# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Military Transition Internship Authorization & Employer Partner Program
# 9 rules x 2 instances. Every literal below was computed against the logical
# clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hiring_rate_cohort_vs_rolling_diverge
        grounds:
          - calculations.employer_hiring_rate
          - entities.InternshipMatch.fields.completed_at
          - entities.ConversionRecord.fields.hired
        distinguishing_aspect: |
          Same employer, same two completed matches, same conversion record:
          the COHORT variant (buckets completions by member separation_date in
          [2027-01-01, 2027-01-31]) yields 50.00 while the ROLLING variant
          (buckets by match completed_at in [2026-12-10, 2027-03-10]) yields
          0.00 — two valid algorithms over identical data produce different
          hiring rates. Entity domain: Employer.
        test_recipe:
          setup:
            - "Employer emp is AUTHORIZED with one REMOTE opening op (capacity 2, required_skills [LOGISTICS])"
            - "Member mA (separation 2027-01-15) completed match mtA [2026-10-01, 2026-10-31) on 2026-10-31"
            - "Member mB (separation 2027-01-20) completed match mtB [2026-11-15, 2026-12-15) on 2026-12-15"
            - "One hired ConversionRecord exists for mtA with conversion_date 2027-02-01"
            - "Logical clock parked at 2027-03-10 (both members auto-SEPARATED; both matches already COMPLETED and unaffected)"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS", "DRIVING"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mA: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-20", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mB: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mA}" }, as: ServiceMember, as_user_id: "${mA}", captures: { appA: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mB}" }, as: ServiceMember, as_user_id: "${mB}", captures: { appB: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${appA}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appB}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 2 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appA}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtA: $.data.id } }
            - { call: "POST /skillbridge/internship-matches/${mtA}/submit-plan", payload: { learning_objectives: [{ objective_code: "O1", description: "Safety basics", weight_hours: 10 }], supervisor_name: "S. Supervisor", weekly_hours: 40 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mtA}/review-plan", payload: { outcome: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/internship-matches/${mtA}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtA}", week_start_date: "2026-10-01", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 1 ok", objectives_achieved: ["O1"] }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtA}", week_start_date: "2026-10-08", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 2 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtA}", week_start_date: "2026-10-15", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 3 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtA}", week_start_date: "2026-10-22", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 4 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/internship-matches/${mtA}/complete", payload: {}, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v_b: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appB}", employer_opening_id: "${op}", start_date: "2026-11-15", end_date: "2026-12-15", expected_employer_opening_version: "${op_v_b}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtB: $.data.id } }
            - { call: "POST /skillbridge/internship-matches/${mtB}/submit-plan", payload: { learning_objectives: [{ objective_code: "O1", description: "Safety basics", weight_hours: 10 }], supervisor_name: "S. Supervisor", weekly_hours: 40 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mtB}/review-plan", payload: { outcome: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/internship-matches/${mtB}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtB}", week_start_date: "2026-11-15", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 1 ok", objectives_achieved: ["O1"] }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtB}", week_start_date: "2026-11-22", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 2 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtB}", week_start_date: "2026-11-29", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 3 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mtB}", week_start_date: "2026-12-06", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "week 4 ok" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-12-15T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/internship-matches/${mtB}/complete", payload: {}, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2027-03-10T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/conversion-records", payload: { internship_match_id: "${mtA}", conversion_date: "2027-02-01", offer_made: true, offer_accepted: true }, as: EmployerRep, as_user_id: "${emp}" }
          trigger:
            - { call: "GET /skillbridge/employers/${emp}/hiring-rate?variant=COHORT&cohort_start_date=2027-01-01&cohort_end_date=2027-01-31", as: ProgramOffice, captures: { cohort_completed: $.data.completed_count, cohort_converted: $.data.converted_count, cohort_rate: $.data.hiring_rate_pct } }
            - { call: "GET /skillbridge/employers/${emp}/hiring-rate?variant=ROLLING", as: ProgramOffice, captures: { rolling_completed: $.data.completed_count, rolling_converted: $.data.converted_count, rolling_rate: $.data.hiring_rate_pct, rolling_start: $.data.window_start_date } }
          assert:
            - "cohort read: completed_count == 2, converted_count == 1, hiring_rate_pct == 50.00 (both separations 2027-01-15 and 2027-01-20 fall in [2027-01-01, 2027-01-31]; only mtA has a hired ConversionRecord)"
            - "rolling read: window_start_date == 2026-12-10, completed_count == 1 (only mtB.completed_at 2026-12-15 lies in [2026-12-10, 2027-03-10]; mtA completed 2026-10-31 is outside), converted_count == 0, hiring_rate_pct == 0.00"
            - "hiring_rate_pct(COHORT) == 50.00 != hiring_rate_pct(ROLLING) == 0.00 for identical underlying match/conversion data"

      - name: training_progress_resolution_vs_mastery_diverge
        grounds:
          - calculations.training_progress_measures
          - entities.InternshipMatch.fields.resolution_ratio
          - entities.InternshipMatch.fields.mastery_ratio
        distinguishing_aspect: |
          Entity domain: InternshipMatch (distinct from the Employer hiring-rate
          variant pair). A fully resolved plan (resolution_ratio 1.00 via 2
          ACHIEVED + 1 EXCUSED objective) still fails completion because the
          hours-weighted mastery_ratio is 0.50 < 0.75 — the two measures
          legitimately diverge on the same plan data.
        test_recipe:
          setup:
            - "ACTIVE match mt on opening op (capacity 1) for member m (separation 2027-01-15) spanning [2026-10-01, 2026-10-31)"
            - "Approved plan: O1 weight 10, O2 weight 10, O3 weight 20 (total 40)"
            - "4 supervision reports filed (weeks 10-01, 10-08, 10-15, 10-22): O1 achieved, O2 achieved, O3 excused"
            - "Clock parked at 2026-10-31 (end_date reached)"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m}" }, as: ServiceMember, as_user_id: "${m}", captures: { app: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${app}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt: $.data.id } }
            - { call: "POST /skillbridge/internship-matches/${mt}/submit-plan", payload: { learning_objectives: [{ objective_code: "O1", description: "Safety basics", weight_hours: 10 }, { objective_code: "O2", description: "Forklift operation", weight_hours: 10 }, { objective_code: "O3", description: "Inventory systems", weight_hours: 20 }], supervisor_name: "S. Supervisor", weekly_hours: 40 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mt}/review-plan", payload: { outcome: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/internship-matches/${mt}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mt}", week_start_date: "2026-10-01", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "w1", objectives_achieved: ["O1"] }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mt}", week_start_date: "2026-10-08", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "w2", objectives_achieved: ["O2"] }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mt}", week_start_date: "2026-10-15", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "w3", objectives_excused: ["O3"] }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/supervision-reports", payload: { internship_match_id: "${mt}", week_start_date: "2026-10-22", hours_supervised: 8, supervisor_name: "S. Supervisor", attestation_text: "w4" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: ProgramOffice }
          trigger:
            - { call: "POST /skillbridge/internship-matches/${mt}/complete", payload: {}, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "GET /skillbridge/internship-matches/${mt}", as: ProgramOffice, captures: { rr: $.data.resolution_ratio, mr: $.data.mastery_ratio, st: $.data.match_status } }
          assert:
            - "complete is rejected with ERR_MASTERY_BELOW_THRESHOLD (409)"
            - "InternshipMatch.${mt}.resolution_ratio == 1.00 (all 3 objectives ACHIEVED or EXCUSED)"
            - "InternshipMatch.${mt}.mastery_ratio == 0.50 (only 20 of 40 weight-hours ACHIEVED)"
            - "InternshipMatch.${mt}.match_status == ACTIVE (rejection leaves state untouched)"

  - rule_id: combinatorial_formula
    instances:
      - name: match_duration_gate_nested_min_branch
        grounds:
          - calculations.match_duration_gate
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): the gate's nested min has two different binding inputs on
          the same endpoint — for member m3 the separation headroom binds
          (min(120, 38) rejects 50 days), for member m2 the per-command policy
          cap binds (min(60, 143) rejects 90 days), and duration exactly equal
          to the policy cap (60 == 60) is accepted (inclusive bound).
        test_recipe:
          setup:
            - "Installation inst2 (Fort Bragg) caps duration at 60 days; installation inst (Fort Liberty) caps at 120"
            - "Member m2 (home inst2, separation 2027-02-28 = exactly 180 days out, window-eligible) has APPROVED application appB"
            - "Member m3 (home inst, separation 2027-01-15) has APPROVED application appC"
            - "Employer emp AUTHORIZED with REMOTE opening op capacity 2 (version 1, no matches yet)"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Bragg", command_code: "FORSCOM", region_code: "R2", max_internship_duration_days: 60, appeal_window_days: 7, requires_tap_complete: false }, as: ProgramOffice, captures: { inst2: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-02-28", skills: ["LOGISTICS"], home_installation_id: "${inst2}" }, as: TransitionCounselor, captures: { m2: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Cara Diaz", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m3: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m2}" }, as: ServiceMember, as_user_id: "${m2}", captures: { appB: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m3}" }, as: ServiceMember, as_user_id: "${m3}", captures: { appC: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${appB}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appC}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 2 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appC}", employer_opening_id: "${op}", start_date: "2026-12-01", end_date: "2027-01-20", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appB}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-12-30", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appB}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-11-30", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt_ok: $.data.id } }
          assert:
            - "m3 proposal (2026-12-01 -> 2027-01-20, 50 days) rejected ERR_DURATION_EXCEEDS_POLICY: separation headroom binds — (2027-01-15 - 2026-12-01) - 7 = 38 < 50"
            - "m2 proposal (2026-10-01 -> 2026-12-30, 90 days) rejected ERR_DURATION_EXCEEDS_POLICY: policy cap binds — min(60, 143) = 60 < 90"
            - "m2 proposal (2026-10-01 -> 2026-11-30, exactly 60 days) accepted: duration 60 <= min(60, 143) = 60 (inclusive bound); match ${mt_ok} created in PROPOSED"
            - "rejected attempts leave EmployerOpening.version == 1 and filled_count == 0 until the success bumps them"

      - name: compliance_score_per_finding_rounding
        grounds:
          - calculations.compliance_score
          - state_machines.ComplianceAudit.OPEN_to_CLOSED_CLEARED
          - state_machines.ComplianceAudit.OPEN_to_CLOSED_SANCTIONED
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from the duration gate's mode (a)):
          deductions are rounded per finding THEN summed THEN clamped — three
          repeated MINORs deduct 5.00 + 7.50 + 10.00 = 22.50 for a score of
          77.50 (CLEARED), while two repeated CRITICALs deduct 45.00 + 67.50 =
          112.50 clamped to 100 for a score of 0.00 (SANCTIONED).
        test_recipe:
          setup:
            - "Employers emp1 and emp2 both AUTHORIZED; audit a1 open on emp1; audit a2 open on emp2"
          setup_api_calls:
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp1: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp1}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "BadActor Staffing", industry_code: "TMP" }, as: ProgramOffice, captures: { emp2: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp2}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/compliance-audits", payload: { employer_id: "${emp1}" }, as: ProgramOffice, captures: { a1: $.data.id } }
            - { call: "POST /skillbridge/compliance-audits", payload: { employer_id: "${emp2}" }, as: ProgramOffice, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /skillbridge/compliance-audits/${a1}/close", payload: { findings: [{ finding_code: "WAGE_PAYMENT_DETECTED", severity: "MINOR", note: "stipend w1" }, { finding_code: "WAGE_PAYMENT_DETECTED", severity: "MINOR", note: "stipend w2" }, { finding_code: "WAGE_PAYMENT_DETECTED", severity: "MINOR", note: "stipend w3" }] }, as: ProgramOffice, captures: { a1_status: $.data.status, a1_score: $.data.compliance_score } }
            - { call: "POST /skillbridge/compliance-audits/${a2}/close", payload: { findings: [{ finding_code: "SUPERVISION_MISSING", severity: "CRITICAL", note: "no supervisor weeks 1-3" }, { finding_code: "SUPERVISION_MISSING", severity: "CRITICAL", note: "repeat: weeks 4-6" }] }, as: ProgramOffice, captures: { a2_status: $.data.status, a2_score: $.data.compliance_score } }
            - { call: "GET /skillbridge/employers/${emp2}", as: ProgramOffice, captures: { emp2_status: $.data.authorization_status } }
          assert:
            - "a1: status == CLOSED_CLEARED, compliance_score == 77.50 (deductions 5.00, 7.50, 10.00 — repeat multiplier 0.5 applied per prior same-code finding, each rounded to 2dp before summing)"
            - "a2: status == CLOSED_SANCTIONED, compliance_score == 0.00 (45.00 + 67.50 = 112.50 clamped at 100 total deduction)"
            - "Employer.${emp2}.authorization_status == REVOKED (sanction cascade link 1)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_appeal_cycle_exhaustion
        grounds:
          - state_machines.InternshipApplication.DENIED_to_UNDER_APPEAL
          - state_machines.InternshipApplication.UNDER_APPEAL_to_DENIED
        distinguishing_aspect: |
          Cyclic machine on InternshipApplication: the DENIED -> UNDER_APPEAL
          -> DENIED loop is traversed twice; the third appeal is rejected by
          the appeal-count budget (ERR_MAX_APPEALS_REACHED at appeal_count ==
          2), proving the cycle terminates by counter, not by a terminal state.
        test_recipe:
          setup:
