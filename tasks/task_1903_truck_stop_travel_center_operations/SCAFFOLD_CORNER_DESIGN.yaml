  # Section: complexity_layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: layer_occ_fuel_price_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fuel-price-supersede-stale-site]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating a price bumps TravelCenterSite.version; a second create carrying the pre-first-create expected_site_version is deterministically rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Site (version observed at creation); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site L1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead, captures: { price_a: "$.data.id" } }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 390, effective_from: "2026-08-20T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead, captures: { err: "$.data.error_id" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { v_now: "$.data.version" } }
          assert:
            - "first create succeeds (site version advances from the captured value)"
            - "second create with the same stale expected_site_version -> ERR_STALE_VERSION (412)"
            - "site version reflects exactly one successful price posting"

      - name: layer_occ_contract_amend_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contract-amend-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Contract amendments are OCC-guarded on FleetContract.version: after activation bumps the version, a PATCH with the pre-activation version is rejected 412; a PATCH with the current version succeeds and bumps it again."
        test_recipe:
          setup: ["Fleet with ACTIVE contract C-1 (T1, discount 0.00); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 5000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_id: "$.data.id", c_v1: "$.data.version" } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: GeneralManager, captures: { c_v2: "$.data.version" } }
          trigger:
            - { call: "PATCH /contracts/${c_id}", payload: { discount_per_gallon_off: 0.01, expected_contract_version: "${c_v1}" }, as: GeneralManager, captures: { err: "$.data.error_id" } }
            - { call: "PATCH /contracts/${c_id}", payload: { discount_per_gallon_off: 0.01, expected_contract_version: "${c_v2}" }, as: GeneralManager, captures: { c_v3: "$.data.version", disc: "$.data.discount_per_gallon_off" } }
          assert:
            - "PATCH with pre-activation version -> ERR_STALE_VERSION (412)"
            - "PATCH with current version -> 200, discount_per_gallon_off == 0.01, version advanced once more"

      - name: layer_future_price_activates_on_clock
        claim_type: scheduled_actions
        grounds:
          - "calculations.retail_quote_cents_per_gallon"
          - "entities.TravelCenterSite.fields.diesel_retail_cents_per_gallon"
        distinguishing_aspect: "A future-effective price is dormant until the logical clock enters its window: quotes before 2026-08-20 use the old price (385), quotes after use the new (399), and the site's diesel mirror recomputes on the same read path; the older price was truncated at 2026-08-20."
        test_recipe:
          setup: ["Site with diesel price A 385 effective 2026-08-01 open-ended, then price B 399 effective 2026-08-20 (A truncated); pump; register; OPEN shift; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site L2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead, captures: { price_a: "$.data.id" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { site_v2: "$.data.version" } }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 399, effective_from: "2026-08-20T00:00:00Z", expected_site_version: "${site_v2}" }, as: FuelDeskLead, captures: { price_b: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale1: "$.data.id", quote1: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /fuel-sales/${sale1}/void", payload: { reason: "quote probe" }, as: ShiftManager, as_user_id: "sm-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote2: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { mirror: "$.data.diesel_retail_cents_per_gallon" } }
            - { call: "GET /fuel-prices/${price_a}", payload: {}, as: FuelDeskLead, captures: { a_to: "$.data.effective_to" } }
          assert:
            - "before 2026-08-20: quote1 == 385"
            - "after clock advance to 2026-08-21: quote2 == 399 and site mirror == 399"
            - "price A effective_to == 2026-08-20T00:00:00Z (truncated, still ACTIVE until then)"

      - name: layer_pagination_filter_interaction
        claim_type: pagination_with_filtering
        grounds:
          - "response_envelope.pagination_fields"
          - "endpoints.GET /sites/{id}/stock-items"
        distinguishing_aspect: "Filter + paginate interact: 3 RETAIL items and 1 SHOP_PART; category=RETAIL&limit=2 returns 2 rows with total_count 3 and has_more true; offset 2 returns the final row with has_more false."
        test_recipe:
          setup: ["Site with stock items R1/R2/R3 (RETAIL) and P1 (SHOP_PART)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site L3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "R1", name: "R1", category: "RETAIL", unit: "ea", unit_price_cents: 100, reorder_point: 0, initial_on_hand_quantity: 5 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "R2", name: "R2", category: "RETAIL", unit: "ea", unit_price_cents: 100, reorder_point: 0, initial_on_hand_quantity: 5 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "R3", name: "R3", category: "RETAIL", unit: "ea", unit_price_cents: 100, reorder_point: 0, initial_on_hand_quantity: 5 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "P1", name: "P1", category: "SHOP_PART", unit: "ea", unit_price_cents: 100, reorder_point: 0, initial_on_hand_quantity: 5 }, as: GeneralManager }
          trigger:
            - { call: "GET /sites/${site_id}/stock-items?category=RETAIL&limit=2&offset=0", payload: {}, as: GeneralManager }
            - { call: "GET /sites/${site_id}/stock-items?category=RETAIL&limit=2&offset=2", payload: {}, as: GeneralManager }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true (SHOP_PART excluded by the filter)"
            - "page 2: 1 row, total_count == 3, has_more == false"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: consistency_immediate_visibility_after_write
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: right after authorize returns 201, GET on the sale shows AUTHORIZED/UNPAID and GET on the pump shows IN_USE - no read lag, no reconciliation delay."
        test_recipe:
          setup: ["Site with diesel price 385, pump, register, OPEN shift; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site M1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
            - { call: "GET /fuel-sales/${sale_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { st: "$.data.status", ps: "$.data.payment_status" } }
            - { call: "GET /pumps/${pump_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { pump_status: "$.data.status" } }
          assert:
            - "sale immediately reads AUTHORIZED / UNPAID"
            - "pump immediately reads IN_USE"
