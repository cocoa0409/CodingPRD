scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances; different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booth_price_repin_on_relocate
        grounds:
          - calculations.booth_quoted_price
          - calculations.booth_quoted_price.variants.at_creation
          - calculations.booth_quoted_price.variants.at_publish_or_relocate
          - state_machines.BoothAllocation.RELOCATING_to_PUBLISHED
          - entities.Booth.fields.base_price_cents
          - entities.BoothAllocation.fields.quoted_price_cents
        distinguishing_aspect: |
          This dual-variant operates on the Booth/BoothAllocation entity domain (booth pricing).
          The at_creation variant computes the catalog price and writes it to Booth.base_price_cents.
          The at_publish_or_relocate variant re-evaluates the SAME formula against the CURRENT booth
          and is pinned into BoothAllocation.quoted_price_cents — when the relocation target is a
          different tier or corner status, the published quoted_price_cents differs from the original
          booth's base_price_cents for identical input data.
        test_recipe:
          setup:
            - "Create Exhibition E (theme_code='GEN', status=DRAFT)"
            - "Create Hall H under E (5x5 grid)"
            - "Create ACTIVE FloorPlanVersion on H with all cells MODULAR power_kw=2 water_lpm=10 network_mbps=100"
            - "Create Booth B1 (tier=STANDARD, cells=[{0,0}], is_corner=true) → base_price_cents = round(200000 * 1.0 * 1.15) + 0 = 230000"
            - "Create Booth B2 (tier=STANDARD, cells=[{2,2}], is_corner=false) → base_price_cents = 200000"
            - "Open intake, submit + qualify ExhibitorApplication A1, create allocation for A1 on B1, publish allocation → quoted_price_cents pinned at 230000"
            - "Exhibitor objects within window; admin starts relocation"
          trigger:
            - "POST /allocations/{id}/relocate with target_booth_id=B2"
          assert:
            - "BoothAllocation.quoted_price_cents == 200000  (re-pinned from B2.base_price_cents)"
            - "Booth.B1.base_price_cents == 230000  (unchanged)"
            - "BoothAllocation.quoted_price_cents != Booth.B1.base_price_cents  (variants diverge)"

      - name: entitlement_score_provisional_vs_final
        grounds:
          - calculations.entitlement_fulfillment_score
          - calculations.entitlement_fulfillment_score.variants.provisional
          - calculations.entitlement_fulfillment_score.variants.final
          - entities.SponsorEntitlement.fields.fulfillment_score
          - state_machines.SponsorEntitlement.IN_PROGRESS_to_MISSED
          - endpoints.GET_exhibitions_id_entitlement_report
        distinguishing_aspect: |
          This dual-variant operates on the SponsorEntitlement entity domain — a different domain
          from booth pricing. Provisional variant (used by GET /entitlement-report pre-CLOSED)
          assumes every IN_PROGRESS entitlement WILL be fulfilled and returns 1.0; the final
          variant pinned at IN_PROGRESS→MISSED gives 0.5 minus a daily-decay penalty. For the same
          IN_PROGRESS entitlement at the same instant, the report returns 1.0 while the row's
          fulfillment_score (after MISSED) is below 0.5.
        test_recipe:
          setup:
            - "Create Exhibition E and SponsorEntitlement SE (sponsor_tier=GOLD, entitlement_code=LOUNGE, deadline=2026-06-01T00:00:00Z)"
            - "Advance clock to 2026-05-20T00:00:00Z (pre-deadline)"
            - "POST /entitlements/{SE.id}/start → status=IN_PROGRESS"
          trigger:
            - "GET /exhibitions/{E.id}/entitlement-report → records provisional score for SE"
            - "POST /_clock/advance to=2026-06-04T00:00:00Z (3 days past deadline)"
            - "POST /entitlements/{SE.id}/mark-missed"
          assert:
            - "Report response from GET /entitlement-report at pre-deadline shows SE provisional fulfillment_score == 1.0"
            - "After mark-missed, SponsorEntitlement.fulfillment_score == 0.2  (= 0.5 - 0.1*3, 3 full days late)"
            - "1.0 != 0.2  (provisional and final variants disagree on the same entitlement)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances; different modes from {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booth_quoted_price_three_input_nonlinear  # mode (a)
        grounds:
          - calculations.booth_quoted_price
          - calculations.booth_quoted_price.formula
          - calculations.booth_quoted_price.constants
          - entities.Booth.fields.tier
          - entities.Booth.fields.is_corner
          - entities.Booth.fields.cells
          - entities.Exhibition.fields.theme_code
        distinguishing_aspect: |
          Mode (a): non-linear formula with 4 inputs (tier, cell_count, is_corner, theme_code prefix)
          and conditional branches (ISLAND-only oversize multiplier; corner-only multiplier;
          theme-prefix-only flat addon). Evaluation order is pinned: cell_multiplier first, then
          corner_multiplier, then theme_addon — different order would produce different rounding.
        test_recipe:
          setup:
            - "Create Exhibition E (theme_code='PRO_TECH')"
            - "Create Hall H + ACTIVE FloorPlanVersion (8x8 grid, all MODULAR)"
          trigger:
            - "POST /halls/{H.id}/booths with tier=ISLAND, cells=[{0,0},{0,1},{1,0},{1,1},{2,0},{2,1}] (6 cells), where the rectangle touches both the row-0 aisle and the col-0 aisle (is_corner=true)"
          assert:
            - "Booth.is_corner == true"
            - "Booth.power_kw_capacity == 12.0  (= 6 cells * 2.0 each)"
            - "Booth.base_price_cents == 878000  (= round(600000 * 1.20 * 1.15) + 50000 = 828000 + 50000)"

      - name: work_order_per_line_then_sum_rounding  # mode (b)
        grounds:
          - calculations.work_order_billing
          - calculations.work_order_billing.formula
          - calculations.work_order_billing.precision
          - state_machines.WorkOrder.DRAFT_to_SUBMITTED
          - entities.WorkOrder.fields.subtotal_cents
          - entities.WorkOrder.fields.tax_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three CLEANING lines each
          (qty=1, unit_price_cents=111) gross=111, discounted=105.45. Per-line round → 105
          subtotal=315 (the pinned order). Sum-first then round would give round(316.35)=316,
          a 1-cent difference. The scaffold pins per-line rounding precedes aggregation.
        test_recipe:
          setup:
            - "Setup CONFIRMED allocation A for exhibitor X on a STANDARD booth in OPEN-equivalent state (SETUP is fine)"
            - "POST /work-orders with allocation_id=A.id and lines = [{CLEANING,1,111},{CLEANING,1,111},{CLEANING,1,111}]"
          trigger:
            - "POST /work-orders/{id}/submit"
          assert:
            - "WorkOrder.subtotal_cents == 315  (per-line round: round(105.45)=105 then 105*3)"
            - "WorkOrder.subtotal_cents != 316  (the sum-then-round alternative is rejected)"
            - "WorkOrder.tax_cents == 19  (= round_half_up(315 * 0.06) = round(18.9))"
            - "WorkOrder.total_cents == 334"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances; different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: allocation_objection_revision_cycle
        grounds:
          - state_machines.BoothAllocation
          - state_machines.BoothAllocation.PUBLISHED_to_OBJECTED
          - state_machines.BoothAllocation.OBJECTED_to_RELOCATING
          - state_machines.BoothAllocation.RELOCATING_to_PUBLISHED
        distinguishing_aspect: |
          BoothAllocation forms a cycle: PUBLISHED → OBJECTED → RELOCATING → PUBLISHED (back to
          PUBLISHED on a new booth). The exhibitor can object again on the re-published allocation,
          driving the cycle a second time. This is structurally distinct from a linear pipeline.
        test_recipe:
          setup:
            - "Setup exhibition with booths B1, B2, B3 all STANDARD AVAILABLE"
            - "Application qualified; allocation created on B1 and PUBLISHED (status=PUBLISHED at booth=B1)"
          trigger:
            - "POST /allocations/{id}/object (status → OBJECTED)"
            - "POST /allocations/{id}/start-relocation (status → RELOCATING, B1 → AVAILABLE)"
            - "POST /allocations/{id}/relocate target=B2 (status → PUBLISHED at booth=B2)"
            - "POST /allocations/{id}/object (status → OBJECTED again — second cycle)"
            - "POST /allocations/{id}/start-relocation"
            - "POST /allocations/{id}/relocate target=B3"
          assert:
            - "BoothAllocation.status == 'PUBLISHED'  (returned to PUBLISHED twice via cycle)"
            - "BoothAllocation.booth_id == B3.id  (state machine permitted A→B→A→B traversal)"
            - "BoothAllocation.relocation_source_booth_id == B2.id"

      - name: work_order_dispute_branch
        grounds:
          - state_machines.WorkOrder
          - state_machines.WorkOrder.EXECUTED_to_BILLED
          - state_machines.WorkOrder.EXECUTED_to_DISPUTED
          - state_machines.WorkOrder.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          WorkOrder exhibits branching fork-join from state EXECUTED: it can fork to either BILLED
          (direct billing path) or DISPUTED→RESOLVED (concession path), with divergent side effects
          (BILLED emits payment sync for total_cents; RESOLVED emits payment sync for
          resolved_total_cents ≤ total_cents). This is a different entity from BoothAllocation and a
          different non-linear shape (branching vs cycle).
        test_recipe:
          setup:
            - "Create two work orders WO1 and WO2 each with lines=[{FURNITURE,1,10000}], both submitted, dispatched, and executed"
          trigger:
            - "POST /work-orders/{WO1.id}/bill   (EXECUTED → BILLED branch)"
            - "POST /work-orders/{WO2.id}/dispute reason='wrong color'  (EXECUTED → DISPUTED branch)"
            - "POST /work-orders/{WO2.id}/resolve resolved_total_cents=6000"
          assert:
            - "WO1.status == 'BILLED' and WO1.resolved_total_cents == WO1.total_cents == 10600  (10000 + 6% tax)"
            - "WO2.status == 'RESOLVED' and WO2.resolved_total_cents == 6000  (< total_cents=10600)"
            - "Both branches reachable from EXECUTED with divergent side effects on resolved_total_cents"

  # =========================================================================
  # Rule 4 — transitive_cascade (≥2 instances; different triggers; depth ≥3 and ≥2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: scan_in_posture_cascade_depth_3
        grounds:
          - state_machines.Ticket.ISSUED_to_SCANNED_IN
          - state_machines.Ticket.SCANNED_IN_to_SCANNED_OUT
          - entities.Exhibition.fields.live_occupancy
          - entities.Exhibition.fields.posture
          - validations[priority=5]
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /tickets/{id}/scan-in:
            (1) Ticket.status: ISSUED → SCANNED_IN
            (2) That mutation causes Exhibition.live_occupancy++ (caused BY the Ticket mutation,
                not directly by the original action)
            (3) That mutation on live_occupancy causes Exhibition.posture: OPEN → RESTRICTED when
                ratio ≥ 95% (caused BY the live_occupancy mutation)
            (4) The posture change then blocks subsequent scan-in attempts via the validation in
                priority 5 — observable by a follow-up scan-in being rejected with ERR_POSTURE_BLOCKED.
        test_recipe:
          setup:
            - "Create Exhibition E with capacity_max=20, advance to status=OPEN, posture=OPEN, live_occupancy=18 (18 tickets pre-scanned)"
            - "Issue tickets T19 and T20 (both ISSUED)"
          trigger:
            - "POST /tickets/{T19.id}/scan-in"
            - "POST /tickets/{T20.id}/scan-in"
          assert:
            - "After T19: Ticket.status='SCANNED_IN', Exhibition.live_occupancy==19, Exhibition.posture=='RESTRICTED'  (19/20 >= 0.95)"
            - "T20 scan-in attempt is rejected with error_id='ERR_POSTURE_BLOCKED'  (posture flip blocks new scans)"

      - name: floor_plan_activation_cascade_depth_2
        grounds:
          - state_machines.FloorPlanVersion.DRAFT_to_ACTIVE
          - state_machines.FloorPlanVersion.ACTIVE_to_SUPERSEDED
          - entities.Booth.fields.status
        distinguishing_aspect: |
          Different trigger (FloorPlanVersion activation, not ticket scan). Depth-2 cascade:
            (1) New FloorPlanVersion FPV2: DRAFT → ACTIVE
            (2) That activation causes the prior ACTIVE FPV1: ACTIVE → SUPERSEDED (caused BY FPV2
                becoming ACTIVE, not by the API call directly)
            (3) The SUPERSEDED transition itself sets Booth.status := BLOCKED for every Booth whose
                floor_plan_version_id == FPV1.id (caused BY the FPV1 supersession, not by the API call).
        test_recipe:
          setup:
            - "Create Exhibition E (DRAFT) with Hall H"
            - "Create FloorPlanVersion FPV1 on H (full grid, MODULAR), activate it → ACTIVE"
            - "Create Booth B1 on FPV1 (status=AVAILABLE)"
            - "Create FloorPlanVersion FPV2 on H (full grid, MODULAR)"
          trigger:
            - "POST /halls/{H.id}/floor-plans/{FPV2.id}/activate"
          assert:
            - "FPV2.status == 'ACTIVE'"
            - "FPV1.status == 'SUPERSEDED'  (caused by FPV2 activation, depth-2 link)"
            - "B1.status == 'BLOCKED'  (caused by FPV1 supersession, depth-3 link from the API call but depth-2 chain since the API call→FPV2 ACTIVE→FPV1 SUPERSEDED→B1 BLOCKED)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances; different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_scan_in
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair: state (priority 4) vs business_safety (priority 5). A scan-in on a
          ticket already in SCANNED_IN at an exhibition whose posture is FROZEN would fail BOTH
          state (Ticket not in ISSUED) and business_safety (posture FROZEN blocks gate ops). The
          scaffold pins state to win (priority 4 < 5), so the response is ERR_INVALID_STATE, not
          ERR_POSTURE_BLOCKED.
        test_recipe:
          setup:
            - "Create Exhibition E with status=DRAFT, posture=FROZEN"
            - "Manually seed a Ticket row T (status=SCANNED_IN, exhibition_id=E.id) and a GateOperator role"
            - "(Alternative — drive via API: progress E to OPEN, scan T in, then close-doors so posture becomes RESTRICTED again, then advance back; simpler: seed directly)"
          trigger:
            - "POST /tickets/{T.id}/scan-in"
          assert:
            - "response.data.error_id == 'ERR_INVALID_STATE'  (state check at priority 4 wins)"
            - "response.data.error_id != 'ERR_POSTURE_BLOCKED'  (priority 5 would have fired had priority 4 passed)"

      - name: business_safety_vs_business_constraint_on_dock_slot
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Different error-category pair: business_safety (priority 7, overnight permit) vs
          business_temporal (priority 12, dock overlap). A POST /dock-slots whose interval crosses
          22:00 without overnight_permit AND overlaps an existing BOOKED slot should report the
          higher-priority business_safety error first (ERR_OVERNIGHT_PERMIT_REQUIRED at p=7),
          not ERR_DOCK_SLOT_OVERLAP at p=12. Distinct from the state-vs-safety pair above.
        test_recipe:
          setup:
            - "Create Exhibition E in SETUP; CONFIRMED allocation A for exhibitor X"
            - "POST /dock-slots existing: dock_code='D1', window_kind=MOVE_IN, start=2026-06-01T21:00Z, end=2026-06-01T23:30Z, overnight_permit=true, allocation_id=A → status=BOOKED"
          trigger:
            - "POST /dock-slots for the SAME exhibitor X (or another allocation) on dock_code='D1', window_kind=MOVE_IN, start=2026-06-01T22:30Z, end=2026-06-02T01:00Z, overnight_permit=false, allocation_id=A"
          assert:
            - "response.data.error_id == 'ERR_OVERNIGHT_PERMIT_REQUIRED'  (priority 7 wins)"
            - "response.data.error_id != 'ERR_DOCK_SLOT_OVERLAP'  (priority 12 would have fired had p=7 passed)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances; different metrics; different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_strict_less_than_boundary
        grounds:
          - validations[priority=14]
          - entities.Exhibition.fields.live_occupancy
          - entities.Exhibition.fields.capacity_max
          - state_machines.Ticket.ISSUED_to_SCANNED_IN
        distinguishing_aspect: |
          Metric: live_occupancy vs capacity_max (numeric threshold). Endpoint: POST
          /tickets/{id}/scan-in. The boundary is STRICT: live_occupancy < capacity_max. So at
          capacity_max=20, the 20th scan-in (the one that would set live_occupancy from 19 to 20)
          succeeds; the 21st (which would set 20→21) fails with ERR_CAPACITY_EXCEEDED. The exact
          inequality is `live_occupancy < capacity_max` evaluated BEFORE the increment.
        test_recipe:
          setup:
            - "Exhibition E (capacity_max=20, status=OPEN, posture=OPEN, live_occupancy=19)"
            - "Issue tickets T20 and T21"
          trigger:
            - "POST /tickets/{T20.id}/scan-in"
            - "POST /tickets/{T21.id}/scan-in"
          assert:
            - "T20 scan-in succeeds (HTTP 200); live_occupancy becomes 20  (boundary 19 < 20, allowed)"
            - "T21 scan-in fails with error_id='ERR_CAPACITY_EXCEEDED'  (20 < 20 is false)"

      - name: group_size_minimum_ten_empty_set_edge
        grounds:
          - validations[priority=15]
          - calculations.ticket_price.constants.GROUP_THRESHOLD
          - entities.Ticket.fields.group_id
          - endpoints.POST_exhibitions_id_tickets
        distinguishing_aspect: |
          Different metric: discrete group-size cardinality (empty-set / count threshold). Different
          endpoint: POST /exhibitions/{id}/tickets. The boundary is >=10: a 9-member group gets no
          discount and pricing matches the no-group base; the 10th member crosses the boundary and
          all members (re-priced lazily or fixed at issuance) are evaluated against >=10 at the
          moment of each ticket's creation. The zero-quantity edge: a single ticket with
          group_id='G1' alone counts as group size 1 < 10, no discount.
        test_recipe:
          setup:
            - "Exhibition E (status=DRAFT → INTAKE_OPEN → ALLOCATION_PUBLISHED → SETUP, prior to OPEN; tickets sellable from DRAFT)"
          trigger:
            - "POST /exhibitions/{E.id}/tickets nine times with kind=STUDENT, channel=ONLINE_PRESALE, group_id='G1'"
            - "POST /exhibitions/{E.id}/tickets a tenth time with kind=STUDENT, channel=ONLINE_PRESALE, group_id='G1'"
          assert:
            - "First 9 tickets each have price_cents == 2500  (no discount, group size still < 10 at each issuance)"
            - "Tenth ticket has price_cents == 2125  (= round_half_up(2500 * 1.0 * 0.85); group size now == 10, discount applies)"
            - "Boundary is >=10 strictly; the 9-vs-10 distinction is observable in the price"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances; different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_doors_requires_safety_inspection
        grounds:
          - state_machines.Exhibition.SETUP_to_OPEN
          - state_machines.Exhibition.SETUP_to_OPEN.preconditions
          - entities.SafetyInspection.fields.kind
          - entities.SafetyInspection.fields.result
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair: Exhibition → SafetyInspection. Exhibition can transition SETUP→OPEN only
          when a SafetyInspection row exists with kind=PRE_OPEN and result=PASS. This crosses
          entities: Exhibition's valid transitions depend on the state of a child SafetyInspection.
        test_recipe:
          setup:
            - "Exhibition E in SETUP with open_date already passed (advance clock)"
            - "No PRE_OPEN inspection yet"
          trigger:
            - "POST /exhibitions/{E.id}/open-doors  (first attempt — should fail)"
            - "POST /exhibitions/{E.id}/safety-inspections kind=PRE_OPEN result=PASS"
            - "POST /exhibitions/{E.id}/open-doors  (second attempt — should succeed)"
          assert:
            - "First attempt: response.data.error_id == 'ERR_SAFETY_INSPECTION_MISSING'"
            - "After PASS inspection, second attempt: Exhibition.status == 'OPEN' and Exhibition.posture == 'OPEN'"

      - name: dock_slot_book_requires_allocation_confirmed
        grounds:
          - state_machines.DockSlot.OPEN_to_BOOKED
          - state_machines.DockSlot.OPEN_to_BOOKED.preconditions
          - entities.BoothAllocation.fields.status
          - state_machines.BoothAllocation
        distinguishing_aspect: |
          Different entity pair: DockSlot → BoothAllocation. A DockSlot creation is allowed only
          when the referenced BoothAllocation.status is CONFIRMED. So DockSlot's valid transitions
          depend on the state of a peer BoothAllocation (cross-aggregate). Distinct from the
          Exhibition→SafetyInspection pair above.
        test_recipe:
          setup:
            - "Setup Exhibition E in SETUP, with allocation A in status=PUBLISHED (NOT CONFIRMED)"
          trigger:
            - "POST /exhibitions/{E.id}/dock-slots with allocation_id=A.id, window_kind=MOVE_IN, valid times"
            - "POST /allocations/{A.id}/confirm  (A → CONFIRMED)"
            - "Retry the same POST /exhibitions/{E.id}/dock-slots"
          assert:
            - "First attempt: response.data.error_id == 'ERR_INVALID_STATE'  (allocation not CONFIRMED)"
            - "After confirm, second attempt succeeds: DockSlot.status == 'BOOKED'"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances; different interval semantics; different resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_half_open_interval_overlap
        grounds:
          - validations[priority=12]
          - entities.DockSlot.fields.dock_code
          - entities.DockSlot.fields.start_at
          - entities.DockSlot.fields.end_at
          - errors.ERR_DOCK_SLOT_OVERLAP
          - concurrency_rules[dock-slot-overlap]
        distinguishing_aspect: |
          Resource: DockSlot. Interval semantics: HALF-OPEN [start_at, end_at). Two slots on the
          same dock_code conflict iff their half-open intervals intersect, which means adjacency at
          a single instant is allowed (slot A ending at 10:00 and slot B starting at 10:00 on the
          same dock are NOT a conflict). Compared to the next instance, this is half-open
          interval arithmetic on a per-dock_code basis.
        test_recipe:
          setup:
            - "Exhibition E in SETUP; confirmed allocations A1, A2 for two exhibitors X1, X2"
            - "POST /dock-slots dock_code=D1 start=10:00 end=11:00 allocation_id=A1 → BOOKED"
          trigger:
            - "POST /dock-slots dock_code=D1 start=11:00 end=12:00 allocation_id=A2  (adjacency — should SUCCEED)"
            - "POST /dock-slots dock_code=D1 start=10:30 end=11:30 allocation_id=A2  (overlap — should FAIL)"
          assert:
            - "Adjacent slot succeeds (HTTP 201; status=BOOKED); [10:00,11:00) ∩ [11:00,12:00) is empty"
            - "Overlapping slot fails with error_id='ERR_DOCK_SLOT_OVERLAP'"

      - name: crane_resource_pointwise_overlap
        grounds:
          - validations[priority=13]
          - entities.DockSlot.fields.crane_required
          - entities.DockSlot.fields.forklift_required
          - errors.ERR_RESOURCE_CONFLICT
        distinguishing_aspect: |
          Different resource (the venue-wide crane, treated as a pooled resource on top of dock
          intervals). Different interval semantics: POINTWISE overlap at start_at instant — at
          most one BOOKED DockSlot with crane_required=true may share an identical start_at
          timestamp across the exhibition (regardless of dock_code). This is single-point
          collision detection, NOT half-open interval geometry. (Forklift is governed by the same
          rule independently.)
        test_recipe:
          setup:
            - "Exhibition E in SETUP; confirmed allocations A1, A2"
            - "POST /dock-slots dock_code=D1 start=09:00 end=11:00 crane_required=true allocation_id=A1 → BOOKED"
          trigger:
            - "POST /dock-slots dock_code=D2 (different dock!) start=09:00 end=10:00 crane_required=true allocation_id=A2"
          assert:
            - "Second slot rejected with error_id='ERR_RESOURCE_CONFLICT'  (pointwise start_at collision on shared crane)"
            - "If the second slot were submitted with crane_required=false, it would succeed at the same start_at  (different resource semantics from Rule 8 instance 1)"

  # =========================================================================
  # Rule 9 — compensating_invariant (≥2 instances; different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: booth_status_count_invariant_on_relocation
        grounds:
          - state_machines.BoothAllocation.OBJECTED_to_RELOCATING
          - state_machines.BoothAllocation.RELOCATING_to_PUBLISHED
          - entities.Booth.fields.status
        distinguishing_aspect: |
          Conserved quantity: COUNT(Booth WHERE status=='ALLOCATED') across the entire exhibition.
          The relocation pair (OBJECTED→RELOCATING frees original; RELOCATING→PUBLISHED locks
          target) must leave that count unchanged: -1 then +1 = 0 net change. Pinned formula:
          count_ALLOCATED(after_relocate) == count_ALLOCATED(before_object).
        test_recipe:
          setup:
            - "Setup as in allocation_objection_revision_cycle: exhibition with B1, B2 STANDARD; allocation A on B1 in PUBLISHED"
            - "Record N0 := count of Booth rows in this exhibition with status='ALLOCATED'  (= 1)"
          trigger:
            - "POST /allocations/{A.id}/object"
            - "POST /allocations/{A.id}/start-relocation  (B1 → AVAILABLE; ALLOCATED count = 0)"
            - "POST /allocations/{A.id}/relocate target=B2  (B2 → ALLOCATED; ALLOCATED count = 1)"
          assert:
            - "After full relocation cycle, count(Booth WHERE status='ALLOCATED') == N0 == 1  (invariant)"
            - "Booth.B1.status == 'AVAILABLE' and Booth.B2.status == 'ALLOCATED'"
            - "BoothAllocation.relocation_source_booth_id == B1.id"

      - name: occupancy_invariant_on_scan_in_then_out
        grounds:
          - state_machines.Ticket.ISSUED_to_SCANNED_IN
          - state_machines.Ticket.SCANNED_IN_to_SCANNED_OUT
          - entities.Exhibition.fields.live_occupancy
        distinguishing_aspect: |
          Different conserved quantity: Exhibition.live_occupancy (a signed integer count).
          The scan-in/scan-out pair on the same ticket must leave live_occupancy unchanged:
          +1 then -1 = 0 net. Pinned formula:
          Exhibition.live_occupancy(after_scan_out) == Exhibition.live_occupancy(before_scan_in).
          Distinct from booth-allocation conservation (different entity, different quantity).
        test_recipe:
          setup:
            - "Exhibition E (status=OPEN, posture=OPEN, capacity_max=10, live_occupancy=3)"
            - "Issue Ticket T (status=ISSUED)"
            - "Record N0 := 3"
          trigger:
            - "POST /tickets/{T.id}/scan-in"
            - "POST /tickets/{T.id}/scan-out"
          assert:
            - "After scan-in: Exhibition.live_occupancy == 4"
            - "After scan-out: Exhibition.live_occupancy == 3 == N0  (invariant holds)"
            - "Ticket.status == 'SCANNED_OUT' and Ticket.scanned_in_at is not null and Ticket.scanned_out_at is not null"
