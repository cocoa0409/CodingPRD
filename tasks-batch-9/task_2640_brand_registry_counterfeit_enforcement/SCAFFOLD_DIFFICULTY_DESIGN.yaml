# =============================================================================
# SCAFFOLD DIFFICULTY DESIGN — task_2640 Brand Registry & Counterfeit Enforcement
# §1.8 test-targeting index: 9 rule_ids, 19 instances, every literal precomputed
# from the §1.3 formulas and the Mon-Fri business-day calendar.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: claim_preliminary_and_full_variants_diverge_on_identical_data
        grounds:
          - calculations.claim_substantiation_score
          - entities.InfringementClaim.fields.preliminary_score
          - entities.InfringementClaim.fields.substantiation_score
          - state_machines.InfringementClaim.DRAFT_to_SUBSTANTIATED
        distinguishing_aspect: |
          The same claim row carries both variants at once: preliminary_score stays
          frozen at 61.38 (0.80 x base, no corroboration bonus ever) while
          substantiation_score reaches 96.72 (undiscounted base + 20.00 test-buy
          bonus) — a 35.34 divergence produced from byte-identical inputs, and only
          the FULL variant can clear the 85.00 threshold.
        test_recipe:
          setup:
            - "Brand Acme Tools with authorized_msrp_cents 10000 and enforcement_budget_cents 500000"
            - "A REGISTERED principal-register trademark in nice class 8, an ACTIVE AMZ enrollment and a designated representative"
            - "Seller with zero strike points, listing priced 3000 screened at image 0.92 / text 0.88 -> match_score 0.8620, FLAGGED, COUNTERFEIT"
            - "A COUNTERFEIT claim scored on the PRELIMINARY variant at creation, then corroborated by an AUTHENTICATED_COUNTERFEIT test buy with an intact chain of custody"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-1" }
              as: BrandAdministrator
              captures: { rep1_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "COUNTERFEIT" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id, prelim: $.data.preliminary_score }
            - call: "POST /brand-protection/claims/${claim_id}/test-buys"
              payload: { order_ref: "TB-1", purchase_price_cents: 4200, shipping_cents: 700, lab_fee_cents: 0 }
              as: EnforcementAnalyst
              captures: { tb_id: $.data.id }
            - call: "POST /brand-protection/test-buys/${tb_id}/receive"
              payload: { lot_code: "LOT-2026-A", chain_of_custody_ref: "COC-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/test-buys/${tb_id}/authenticate"
              payload: { authentication_result: "COUNTERFEIT", lab_ref: "LAB-1" }
              as: EnforcementAnalyst
          trigger:
            - call: "POST /brand-protection/claims/${claim_id}/substantiate"
              as: EnforcementAnalyst
          assert:
            - "MonitoredListing.${listing_id}.match_score == 0.8620"
            - "InfringementClaim.${claim_id}.registration_strength == 1.00"
            - "InfringementClaim.${claim_id}.preliminary_score == 61.38"
            - "InfringementClaim.${claim_id}.substantiation_score == 96.72"
            - "InfringementClaim.${claim_id}.substantiation_score - InfringementClaim.${claim_id}.preliminary_score == 35.34"
            - "InfringementClaim.${claim_id}.status == SUBSTANTIATED"
            - "InfringementClaim.${claim_id}.preliminary_score is unchanged by substantiation (still 61.38, not overwritten with 96.72)"

      - name: seller_standalone_and_cluster_strike_variants_diverge_after_alias_link
        grounds:
          - calculations.seller_strike_points
          - entities.Seller.fields.standalone_strike_points
          - entities.Seller.fields.cluster_strike_points
          - concurrency_rules[alias-link-stale-canonical-seller]
        distinguishing_aspect: |
          After the alias link the alias row reports standalone_strike_points 0.00
          and cluster_strike_points 12.55 simultaneously — the STANDALONE variant
          counts only strikes attributed to that exact row while the CLUSTER variant
          unions the whole alias cluster, so the two variants disagree on the same
          row in the same response.
        test_recipe:
          setup:
            - "The canonical seller has exactly one fresh TAKEDOWN_REMOVAL strike worth 12.55 points, earned through a completed removal"
            - "A second, brand-new seller account (the alias) has never been struck"
            - "The canonical seller's current version is read immediately before the link so the OCC precondition is satisfied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-1" }
              as: BrandAdministrator
              captures: { rep1_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { canon_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${canon_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 0, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 1.00, text_match_score: 1.00 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /brand-protection/claims/${claim_id}/substantiate"
              as: EnforcementAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /brand-protection/evidence-packages"
              payload: { claim_id: "${claim_id}", package_ref: "PKG-1", expected_claim_version: "${claim_v}" }
              as: EnforcementAnalyst
              captures: { pkg_id: $.data.id }
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "LISTING_SCREENSHOT", item_ref: "SS-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "REGISTRATION_CERTIFICATE", item_ref: "CERT-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "MARK_COMPARISON", item_ref: "CMP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "SELLER_PROFILE_SNAPSHOT", item_ref: "SNAP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "PRICE_HISTORY_EXPORT", item_ref: "PRICE-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/seal"
              as: EnforcementAnalyst
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "${enr_id}", claim_id: "${claim_id}", evidence_package_id: "${pkg_id}" }
              as: EnforcementAnalyst
              captures: { td_id: $.data.id }
            - call: "POST /brand-protection/takedowns/${td_id}/submit"
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
            - call: "POST /brand-protection/takedowns/${td_id}/marketplace-decision"
              payload: { decision: "REMOVED", marketplace_case_ref: "MP-1" }
              as: MarketplaceLiaison
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A2ALIAS", legal_name: "Shenzhen Trading Co Store 2", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { alias_id: $.data.id }
            - call: "GET /brand-protection/sellers/${canon_id}"
              as: EnforcementAnalyst
              captures: { canon_v: $.data.version }
          trigger:
            - call: "POST /brand-protection/sellers/${alias_id}/link-alias"
              payload: { canonical_seller_id: "${canon_id}", expected_canonical_seller_version: "${canon_v}" }
              as: EnforcementAnalyst
          assert:
            - "Seller.${alias_id}.canonical_seller_id == ${canon_id}"
            - "Seller.${alias_id}.standalone_strike_points == 0.00"
            - "Seller.${alias_id}.cluster_strike_points == 12.55"
            - "Seller.${canon_id}.standalone_strike_points == 12.55"
            - "Seller.${canon_id}.cluster_strike_points == 12.55"
            - "Seller.${alias_id}.status == ACTIVE"
            - "Seller.${canon_id}.status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: listing_match_score_composes_three_weighted_factors_and_a_risk_boost
        grounds:
          - calculations.listing_match_score
          - entities.MonitoredListing.fields.price_deviation_factor
          - entities.MonitoredListing.fields.match_score
          - entities.MonitoredListing.fields.violation_type
        distinguishing_aspect: |
          match_score cannot be produced by any single input: it is
          0.45*image + 0.35*text + 0.20*price_deviation_factor where the third
          factor is itself derived from (msrp - price)/msrp, and the ordered
          classification ladder then picks COUNTERFEIT over TRADEMARK even though
          both sub-conditions hold — 0.92/0.88 with msrp 10000 and price 3000 gives
          exactly 0.8620 and COUNTERFEIT.
        test_recipe:
          setup:
            - "Brand with authorized_msrp_cents 10000"
            - "Seller ACTIVE with standalone_strike_points 0.00, so the seller-risk boost is 0.00"
            - "Listing priced 3000 cents, never screened (monitor_status NEW, match_score null)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
          assert:
            - "MonitoredListing.${listing_id}.price_deviation_factor == 0.7000"
            - "MonitoredListing.${listing_id}.match_score == 0.8620"
            - "MonitoredListing.${listing_id}.monitor_status == FLAGGED"
            - "MonitoredListing.${listing_id}.violation_type == COUNTERFEIT"
            - "MonitoredListing.${listing_id}.enforcement_status == NONE"
            - "MonitoredListing.${listing_id}.version == 2"

      - name: strike_points_round_each_decayed_contribution_before_summation
        grounds:
          - calculations.seller_strike_points
          - state_machines.TakedownSubmission.SUBMITTED_to_APPROVED_REMOVED
          - state_machines.DiversionInvestigation.EVIDENCE_SUBMITTED_to_DIVERSION_CONFIRMED
          - endpoints["POST /brand-protection/ops/run-enforcement-sweep"]
        distinguishing_aspect: |
          Two strikes of different base weight both cross the 180-day decay line, so
          the correct total is ROUND_HALF_UP(12.55*0.5,2) + ROUND_HALF_UP(25.15*0.5,2)
          = 6.28 + 12.58 = 18.86, whereas summing the raw products first and rounding
          once yields 18.85 — a one-cent divergence that also flips the escalation
          ladder back to ACTIVE.
        test_recipe:
          setup:
            - "Seller holds one TAKEDOWN_REMOVAL strike decided 2026-08-17T09:00:00Z and one SEIZURE_CONFIRMED strike concluded 2026-08-17T09:00:00Z, total 37.70 fresh points, status UNDER_INVESTIGATION"
            - "The customs recordation covering the seizure is RECORDED with a validity interval that outlives the test (2026-08-17 to 2027-12-31)"
            - "The logical clock is then advanced to 2027-02-14T09:00:00Z, exactly 181 days after both effective instants"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-1" }
              as: BrandAdministrator
              captures: { rep1_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 0, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 1.00, text_match_score: 1.00 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /brand-protection/claims/${claim_id}/substantiate"
              as: EnforcementAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /brand-protection/evidence-packages"
              payload: { claim_id: "${claim_id}", package_ref: "PKG-1", expected_claim_version: "${claim_v}" }
              as: EnforcementAnalyst
              captures: { pkg_id: $.data.id }
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "LISTING_SCREENSHOT", item_ref: "SS-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "REGISTRATION_CERTIFICATE", item_ref: "CERT-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "MARK_COMPARISON", item_ref: "CMP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "SELLER_PROFILE_SNAPSHOT", item_ref: "SNAP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "PRICE_HISTORY_EXPORT", item_ref: "PRICE-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/seal"
              as: EnforcementAnalyst
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "${enr_id}", claim_id: "${claim_id}", evidence_package_id: "${pkg_id}" }
              as: EnforcementAnalyst
              captures: { td_id: $.data.id }
            - call: "POST /brand-protection/takedowns/${td_id}/submit"
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
            - call: "POST /brand-protection/takedowns/${td_id}/marketplace-decision"
              payload: { decision: "REMOVED", marketplace_case_ref: "MP-1" }
              as: MarketplaceLiaison
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "US_CBP", nice_class: 8, recorded_on: "2026-08-17", expires_on: "2027-12-31" }
              as: CustomsCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations/${rec_id}/record"
              payload: { recordation_number: "CBP-778899" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/diversion-investigations"
              payload: { brand_id: "${brand_id}", source_kind: "BORDER_SEIZURE", lot_code: "LOT-2026-A", recordation_id: "${rec_id}", seller_id: "${seller_id}", seizure_ref: "SZ-1", port_code: "USLAX", seized_qty: 400, declared_value_cents: 250000 }
              as: CustomsCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /brand-protection/diversion-investigations/${inv_id}/submit-evidence"
              payload: { evidence_ref: "EV-1", suspected_distributor_ref: "DIST-7" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/diversion-investigations/${inv_id}/conclude"
              payload: { outcome: "DIVERSION_CONFIRMED", findings_ref: "FIND-1" }
              as: CustomsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-14T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "POST /brand-protection/ops/run-enforcement-sweep"
              as: MarketplaceLiaison
          assert:
            - "Seller.${seller_id}.standalone_strike_points == 18.86"
            - "Seller.${seller_id}.cluster_strike_points == 18.86"
            - "Seller.${seller_id}.standalone_strike_points != 18.85 (summing raw products before rounding is the wrong order)"
            - "Seller.${seller_id}.status == ACTIVE"
            - "response.data.deescalated_seller_count == 1"
            - "response.data.blocked_seller_count == 0"
            - "response.data.escalated_seller_count == 0"

      - name: test_buy_fee_tier_selected_from_subtotal_not_from_billable_total
        grounds:
          - calculations.test_buy_billable_total
          - entities.TestBuy.fields.service_fee_rate
          - entities.TestBuy.fields.billable_total_cents
          - entities.Brand.fields.enforcement_spend_cents
        distinguishing_aspect: |
          A subtotal of 4900 selects the 0.15 tier and produces billable_total 5635,
          which lands inside the 0.12 band — the rate is NOT revised, so the correct
          answer is 5635 and never 5488, and a 5001 subtotal is 149 cents cheaper in
          total than a 5000 subtotal.
        test_recipe:
          setup:
            - "Brand with enforcement_budget_cents 500000 and enforcement_spend_cents 0"
            - "A DRAFT COUNTERFEIT claim on a FLAGGED listing, with no prior test buy against the seller"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/sellers"
