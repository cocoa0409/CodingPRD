              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Wilhelmina Strachan RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-09-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ottoline Farraday RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-09-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_unattached: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_charge}", role_slot: "CHARGE", shift_start_utc: "2026-08-14T08:00:00Z", shift_end_utc: "2026-08-14T18:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_charge: $.data.id }
            - call: POST /shift-assignments/${sh_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-LADDER-4501", parity: 1, gestational_age_weeks: 40, prior_cesarean: false, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_id: $.data.id }
            - call: POST /bundle-activations
              payload: { encounter_id: "${e_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 1400 }
              as: BedsideNurse
              as_user_id: "${s_charge}"
              captures: { act_id: $.data.id, act_activated_at: $.data.activated_at }
            - call: GET /bundle-activations/${act_id}/checklist-items
