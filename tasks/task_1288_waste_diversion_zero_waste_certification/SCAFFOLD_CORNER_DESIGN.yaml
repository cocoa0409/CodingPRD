            - "both responses carry meta.api_request_id and response_type == 'array'"

      - name: tickets_filter_by_validation_status
        claim_type: listing
        grounds: [endpoints]
        distinguishing_aspect: "The validation_status filter narrows the list: with one VALIDATED and one PENDING ticket, ?validation_status=VALIDATED returns exactly 1 entry."
        test_recipe:
          setup: ["Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 VALIDATED, T2 PENDING"]
