      - name: child_writes_increment_the_row_version_and_only_the_declared_parent_version
        claim_type: optimistic_concurrency
        grounds:
          - entities.Selection.fields.version
          - entities.DutyApplication.fields.version
          - endpoints["POST /selections/{id}/propose"]
          - endpoints["POST /selections/{id}/approve"]
        distinguishing_aspect: |
          Version bumps are declared, not incidental: creating the selection is the only action that
          touches the DutyApplication version, so after propose and approve the Selection reads version 3
          while the duty stays at 2 even though its status changed to SELECTION_LOCKED - an implementation
          that bumps the parent on every cascade would break the OCC contract at priority 10.
