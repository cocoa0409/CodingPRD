            - call: "POST /training-assignments"
              payload: { employee_id: "${w1_id}", module_id: "${mod_adm_id}", due_at: "2026-08-20T00:00:00Z", expected_employee_version: "${w1_id_v}" }
              as: HRPartner
              as_user_id: "${hr_id}"
              captures: { hr_ta_id: $.data.id }
            - call: "POST /training-assignments/${hr_ta_id}/complete"
              payload: { score: 84 }
              as: HRPartner
              as_user_id: "${hr_id}"
            - call: "POST /employees/${w1_id}/separate"
              payload: { separation_reason: "Transferred to another employer." }
              as: HRPartner
