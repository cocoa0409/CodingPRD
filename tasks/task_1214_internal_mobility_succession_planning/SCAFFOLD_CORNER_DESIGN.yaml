            - { call: "POST /talent/retention-assessments/${a}/escalate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ASSESSMENT_INVALID_STATE (state gate runs before the risk-level gate); status remains OPEN"

      - name: escalate_low_risk_returns_risk_not_escalatable
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_RISK_NOT_ESCALATABLE]"]
        distinguishing_aspect: "From ACTION_PLANNED with risk LOW (EXCEPTIONAL rating, no modifiers -> 0.0), escalate fails with ERR_RISK_NOT_ESCALATABLE — the risk gate after the state gate."
        test_recipe:
          setup: ["ACTION_PLANNED assessment for E100 (EXCEPTIONAL, hire 2024-05-01 -> risk 0.0 LOW)"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC100", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E100B", full_name: "Erin Star", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "EXCEPTIONAL" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/employees/${e}/retention-assessments", payload: { assessment_method: "POINT_IN_TIME" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { a: $.data.id, sc: $.data.risk_score } }
            - { call: "POST /talent/retention-assessments/${a}/plan-action", payload: { action_type: "STAY_INTERVIEW", action_deadline: "2026-06-01T00:00:00Z" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/retention-assessments/${a}/escalate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "RetentionAssessment.${a}.risk_score == 0.0 and risk_level == LOW (clamped at the 0 floor)"
            - "error_id == ERR_RISK_NOT_ESCALATABLE; status remains ACTION_PLANNED"

      - name: mitigate_while_risk_still_high_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=32]", "errors[ERR_RISK_STILL_HIGH]"]
        distinguishing_aspect: "Close with outcome=MITIGATED recomputes the risk at close time; with an unchanged HIGH profile (LOW rating -> 80.0) the close is rejected with ERR_RISK_STILL_HIGH and the assessment stays ACTION_PLANNED."
        test_recipe:
          setup: ["ACTION_PLANNED assessment for E101 (LOW rating, hire 2024-05-01 -> risk 80.0 HIGH)"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC101", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E101B", full_name: "Erin Risk", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "LOW" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/employees/${e}/retention-assessments", payload: { assessment_method: "POINT_IN_TIME" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { a: $.data.id } }
            - { call: "POST /talent/retention-assessments/${a}/plan-action", payload: { action_type: "COMP_REVIEW", action_deadline: "2026-06-01T00:00:00Z" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/retention-assessments/${a}/close", payload: { outcome: "MITIGATED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RISK_STILL_HIGH; status remains ACTION_PLANNED"

      - name: fill_after_deadline_returns_fill_window_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_FILL_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The vacancy was created at the default clock 2026-05-01T00:00:00Z (fill_deadline 2026-06-30T00:00:00Z); at 2026-07-01T00:00:00Z the fill is rejected with ERR_FILL_WINDOW_EXPIRED even though an eligible successor exists."
        test_recipe:
          setup: ["vacancy with an ACTIVE READY_NOW successor on the slate; clock advanced past the fill deadline"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC102", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC102", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S102", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 102", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILL_WINDOW_EXPIRED (now 2026-07-01 > fill_deadline 2026-06-30T00:00:00Z)"
            - "Vacancy.${vac} remains OPEN; SuccessorEntry.${es} remains ACTIVE"

      - name: fill_at_exact_deadline_succeeds
        claim_type: satisfaction_pass
        grounds: [calculations.consent_deadline_arithmetic, "validations[priority=12]"]
        distinguishing_aspect: "The fill window is INCLUSIVE: at exactly fill_deadline (2026-06-30T00:00:00Z) the fill succeeds — the opposite inequality from the strict consent window."
        test_recipe:
          setup: ["vacancy with an ACTIVE READY_NOW successor; clock set to exactly the fill deadline"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC103", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC103", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S103", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 103", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T00:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vst: $.data.status } }
          assert:
            - "fill succeeds at the exact deadline: Vacancy.${vac}.status == FILLED and filled_by_employee_id == ${suc}"

      - name: nominate_into_closed_cycle_returns_cycle_invalid_state
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_CYCLE_INVALID_STATE]"]
        distinguishing_aspect: "Nominations require an OPEN cycle; nominating into a CLOSED cycle fails with ERR_CYCLE_INVALID_STATE."
        test_recipe:
          setup: ["cycle closed (empty); employee N104 managed by M104"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "MGR104", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N104", full_name: "Nia Late", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C104", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/close", as: HRAdmin }
          trigger:
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_INVALID_STATE; no nomination created"

      - name: enroll_unendorsed_nomination_returns_nomination_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HiPoNomination.ENDORSED_to_ACTIVE, "errors[ERR_NOMINATION_INVALID_STATE]"]
        distinguishing_aspect: "Enroll is defined only from ENDORSED; a NOMINATED nomination (approval chain step skipped) rejects enroll with ERR_NOMINATION_INVALID_STATE."
        test_recipe:
          setup: ["OPEN cycle capacity 5; N105 nominated but not endorsed"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM105", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR105", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N105", full_name: "Nia Skip", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C105", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom}/enroll", as: TalentManager, as_user_id: "${tm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOMINATION_INVALID_STATE; nomination remains NOMINATED; cycle.enrolled_count == 0"

      - name: revise_by_non_proposer_returns_not_entry_proposer
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NOT_ENTRY_PROPOSER]"]
        distinguishing_aspect: "Only the proposing manager may revise a challenged entry; another manager (who manages other employees) is rejected with ERR_NOT_ENTRY_PROPOSER."
        test_recipe:
          setup: ["IN_PROGRESS session; entry for E106 proposed by M106 and currently CHALLENGED; O106 is another manager"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM106", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR106", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "OTH106", full_name: "Otto Other", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { oth: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E106", full_name: "Erin Subj", department: "ENG", job_level: 5, hire_date: "2023-02-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-106", department_scope: "ENG", scheduled_start: "2026-04-14T09:00:00Z", scheduled_end: "2026-04-14T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s}/entries", payload: { employee_id: "${e}", proposed_rating: "SOLID" }, as: Manager, as_user_id: "${mgr}", captures: { en: $.data.id } }
            - { call: "POST /talent/calibration-entries/${en}/challenge", as: TalentManager, as_user_id: "${tm}" }
          trigger:
            - { call: "POST /talent/calibration-entries/${en}/revise", payload: { proposed_rating: "STRONG" }, as: Manager, as_user_id: "${oth}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_ENTRY_PROPOSER (403); entry remains CHALLENGED with proposed_rating SOLID"

      - name: withdraw_by_other_employee_returns_applicant_not_self
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_APPLICANT_NOT_SELF]"]
        distinguishing_aspect: "Self-service ownership: an employee cannot withdraw another employee's application — ERR_APPLICANT_NOT_SELF (403)."
        test_recipe:
          setup: ["PENDING application owned by E107; O107 is a different employee"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC107", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC107", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E107", full_name: "Erin Own", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "O107", full_name: "Otto Other", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { o: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 107", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Role 107", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /talent/applications/${app}/withdraw", as: Employee, as_user_id: "${o}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICANT_NOT_SELF; application remains CONSENT_GRANTED (E107 has no manager)"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: successor_list_filter_by_status
        claim_type: listing
        grounds: [endpoints.GET_/talent/successors]
        distinguishing_aspect: "The status filter composes with the critical_role_id filter: only ACTIVE entries of the given role are returned, DRAFT entries excluded."
        test_recipe:
          setup: ["ACTIVE role with two entries: E_A ACTIVE, E_B DRAFT"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC110", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC110", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S110A", full_name: "Sue A", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S110B", full_name: "Sue B", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 110", department: "ENG", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
