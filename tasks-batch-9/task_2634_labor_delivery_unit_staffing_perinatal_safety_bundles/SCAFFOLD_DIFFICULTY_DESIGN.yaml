              captures: { drill_measured: $.data.measured_d2i_minutes }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_charge}", role_slot: "CHARGE", shift_start_utc: "2026-08-22T06:00:00Z", shift_end_utc: "2026-08-22T16:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_charge: $.data.id }
            - call: POST /shift-assignments/${sh_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${s_bed}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-22T06:00:00Z", shift_end_utc: "2026-08-22T16:00:00Z" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { sh_bed: $.data.id }
            - call: POST /shift-assignments/${sh_bed}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { bed_capacity: $.data.capacity_units_effective }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-XENT-5150", parity: 0, gestational_age_weeks: 39, prior_cesarean: false, fetus_count: 1, presentation: "VERTEX" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_id: $.data.id }
            - call: POST /labor-encounters/${e_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${e_id}", interpreted_by_staff_id: "${s_charge}", category: "CATEGORY_I", baseline_rate_bpm: 138, variability: "MODERATE", recurrent_decelerations: false, assessed_at: "2026-08-22T07:20:00Z" }
              as: BedsideNurse
              as_user_id: "${s_charge}"
              captures: { fm_id: $.data.id }
            - call: GET /labor-encounters/${e_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_v1: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${e_id}", shift_assignment_id: "${sh_bed}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${e_v1}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { ca_id: $.data.id, ca_debit: $.data.acuity_units_consumed }
            - call: POST /labor-encounters/${e_id}/advance-phase
              payload: { target_phase: "LATENT" }
