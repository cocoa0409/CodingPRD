  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: (state vs business_fiscal) on
  # grant submit, and (business_temporal vs business_constraint) on stay create.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_suspended_client_and_closed_fund_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=22]
          - errors[ERR_CLIENT_NOT_ACTIVE]
          - errors[ERR_FUND_CLOSED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): one submit call violates BOTH the
          client-ACTIVE state gate (client SUSPENDED) and the fund lifecycle fiscal gate
          (fund CLOSED); the state error ERR_CLIENT_NOT_ACTIVE (priority 7) MUST win over
          ERR_FUND_CLOSED (priority 21).
        test_recipe:
          setup:
            - "Client ACTIVE with VERIFIED assessment; GrantFund 100000 exists"
            - "DRAFT application created against the fund (client still ACTIVE, fund OPEN at creation)"
            - "Then the client is SUSPENDED and the fund is CLOSED (DRAFT apps do not block close)"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { alias_name: "ivy", contact_channel: "EMAIL", population_type: "COMMUNITY_RESIDENT" }
              as: Anonymous
