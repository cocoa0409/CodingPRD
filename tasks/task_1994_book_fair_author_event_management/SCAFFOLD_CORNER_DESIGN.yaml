  - section: validations
    instances:
      - name: list_fairs_missing_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_HEADERS]"
        distinguishing_aspect: "Auth header check is priority 1: a request with no X-User-Role/X-User-ID fails before role, existence, or any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fairs", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_MISSING_HEADERS with http 400 (headers stripped by the test harness)"

      - name: publisher_scope_mismatch_on_accept
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_PARTY_SCOPE_MISMATCH]"
        distinguishing_aspect: "Scoped ownership: a PublisherRep whose party is a DIFFERENT publisher than the agreement's publisher_party_id is rejected with 403 even though the role itself is correct."
        test_recipe:
          setup: ["agreement PROPOSED for publisher P1; second publisher P2 exists"]
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub1_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Birch Books", contact_email: "rep@birch.example" }, as: Organizer, captures: { pub2_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub1_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Response error_id == ERR_PARTY_SCOPE_MISMATCH with http 403"
            - "ConsignmentAgreement.${agr_id}.status remains PROPOSED"

      - name: role_party_kind_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_ROLE_PARTY_KIND_MISMATCH]"
        distinguishing_aspect: "Identity-kind binding: X-User-Role PublisherRep with an X-User-ID that resolves to a SCHOOL party fails kind checking before any scope comparison."
        test_recipe:
          setup: ["agreement PROPOSED; only a SCHOOL party id is used with the PublisherRep role"]
          setup_api_calls:
