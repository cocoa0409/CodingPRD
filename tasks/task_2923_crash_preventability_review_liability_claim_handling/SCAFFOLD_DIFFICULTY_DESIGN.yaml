              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T11:00:00Z", notified_at: "2026-07-30T11:30:00Z", location_text: "US-50 at Careytown Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: true }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /policy-layers"
