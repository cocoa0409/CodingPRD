              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { ck_cyc_status: $.data.status, ck_esc: $.data.complaints_escalated_count, ck_reopen: $.data.alerts_reopened_count, ck_frozen_ct: $.data.partners_frozen_count, ck_mkt_exp: $.data.marketing_approvals_expired_count, ck_growth_ct: $.data.growth_breach_partner_count, ck_plans: $.data.plans_completed_count, ck_closed_at: $.data.closed_at }
            - call: "GET /oversight/complaints/${cmp_em_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { ck_cmp_status: $.data.status, ck_cmp_esc: $.data.escalation_count }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { ck_posture2: $.data.oversight_posture, ck_req2: $.data.required_reserve_cents, ck_short2: $.data.reserve_shortfall_cents, ck_cons: $.data.consecutive_shortfall_cycles, ck_rate: $.data.complaint_rate_bps, ck_conc: $.data.concentration_ratio_pct }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { thaw0_status: "$.data[0].status", thaw1_status: "$.data[1].status" }
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-09", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cyc_sep_id: $.data.id, cyc_sep_index: $.data.cycle_index }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}", account_type: "RESERVE" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { ck_res_id2: "$.data[0].id", ck_res_v2: "$.data[0].version" }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", custody_account_id: "${ck_res_id2}", entry_type: "RESERVE_FUND", amount_cents: 50000, effective_at: "2026-09-01T00:00:00Z", expected_custody_account_version: "${ck_res_v2}", memo: "same movement, now that the checkpoint has thawed the account" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { ck_led_amt: $.data.amount_cents, ck_led_seq: $.data.sequence_no }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}", account_type: "RESERVE" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { ck_res_bal3: "$.data[0].balance_cents", ck_res_status3: "$.data[0].status" }
          assert:
            - "frz_total == 2 with both statuses FROZEN — creating the SANCTIONS_HIT alert drove posture FROZEN and cascade link 5 froze both accounts inside an ordinary business write"
            - "ck_alert_disp == CLEARED and ck_sanc == 0, yet ck_res_status is STILL FROZEN — no business write unfreezes custody"
            - "ck_posture1 == HEIGHTENED with ck_req1 == 810000 == floor(405000 * 2.00) and ck_short1 == 303750 == 810000 - 506250 — the dispose pass reads posture_in == FROZEN, so the multiplier is still 2.00 even though the posture it writes is HEIGHTENED"
            - "e_frozen_write == ERR_CUSTODY_ACCOUNT_NOT_ACTIVE (409) — the shortfall cannot be cured while frozen, which is exactly why the checkpoint must be the thawing agent"
            - "ck_cyc_status == CLOSED with ck_closed_at == 2026-09-01T00:00:00Z"
            - "ck_esc == 1 (step 1: the EMAIL complaint's response_due_at 2026-08-24T08:00:00Z is before the clock) and ck_cmp_status == ESCALATED with ck_cmp_esc == 1"
            - "ck_reopen == 0 — step 2 only touches PARTNER_RESPONSE_PENDING alerts, and this one is CLEARED; a SANCTIONS_HIT left in PARTNER_RESPONSE_PENDING would have been reopened and would have kept the posture FROZEN"
            - "ck_req2 == 506250 == floor(405000 * 1.25) and ck_short2 == 0 and ck_cons == 0 and ck_posture2 == OPEN — the multiplier decays one step per pass, so two passes were needed to walk 810000 -> 506250 -> a satisfied requirement with zero cents moved"
            - "ck_rate == 0 (round_half_up(1 * 10000 / 100000) == 0) and ck_conc == 100.00 (Partner A holds the bank's entire FBO float), and neither value changes the posture"
            - "ck_frozen_ct == 0 (step 6 counts partners the checkpoint FROZE, not partners it thawed), ck_mkt_exp == 0, ck_growth_ct == 0 (END_USER_CREDIT sum for August is 0, which is not strictly greater than GROWTH_SEED_ABSOLUTE_CAP_CENTS), ck_plans == 0"
            - "thaw0_status == thaw1_status == ACTIVE — step 4 unfroze both rows because the recomputed posture is no longer FROZEN"
            - "cyc_sep_index == ${cyc_aug_index} + 1, and the replayed ledger entry now returns 201 with ck_led_amt == 50000, after which ck_res_bal3 == 556250 and ck_res_status3 == ACTIVE — same payload, same account, refused before the checkpoint and accepted after it"

  # ===========================================================================
  # §1.0 consistency_model: immediate. Every cascade named in §1.2 / §1.5 is
  # complete before the response is written, so there is no convergence window,
  # no re-read loop and no lagged denormalised field anywhere in the API.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: a_single_alert_completes_the_whole_posture_cascade_before_its_own_response_is_returned
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CustodyAccount.ACTIVE_to_FROZEN
          - calculations.partner_oversight_posture
          - calculations.required_reserve_cents
        distinguishing_aspect: "The alert response is a TransactionMonitoringAlert, yet by the time it is written the Partner posture and BOTH CustodyAccount rows have already moved, so the very first read after the write is final and a second identical read cannot differ. The same instance also pins the no-feedback rule inside that one pass: required_reserve_cents is still computed at the OPEN multiplier even though the pass ends with the posture at FROZEN, so an implementation that iterates to a fixed point reports 500000 instead of 250000."
        test_recipe:
          setup:
            - "Partner A CONTRACTED with an EXECUTED agreement, two ACTIVE custody accounts and a reserve balance of 312500."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { im_posture0: $.data.oversight_posture, im_req0: $.data.required_reserve_cents, im_sanc0: $.data.open_sanctions_alert_count }
          trigger:
            - *q_alert_sanctions
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { im_posture1: $.data.oversight_posture, im_req1: $.data.required_reserve_cents, im_short1: $.data.reserve_shortfall_cents, im_sanc1: $.data.open_sanctions_alert_count, im_v1: $.data.version }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { im_posture2: $.data.oversight_posture, im_req2: $.data.required_reserve_cents, im_v2: $.data.version }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}" }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { im_acc_total: $.total_count, im_acc0_status: "$.data[0].status", im_acc1_status: "$.data[1].status" }
            - call: "GET /oversight/alerts"
              payload: { partner_id: "${pa_id}", alert_type: "SANCTIONS_HIT", disposition: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { im_alerts_total: $.total_count, im_alert_sla: "$.data[0].sla_due_at" }
            - call: "GET /oversight/partners/${pa_id}/oversight-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { im_sum_posture: $.data.oversight_posture, im_sum_req: $.data.required_reserve_cents }
          assert:
            - "im_posture0 == OPEN with im_req0 == 250000 and im_sanc0 == 0 — RESERVE_ABSOLUTE_FLOOR_CENTS is the binding term while the FBO account is empty"
            - "im_posture1 == FROZEN and im_sanc1 == 1 on the FIRST read after the alert — no polling, no delay, no PENDING marker"
            - "im_req1 == 250000, NOT 500000: the pass read posture_in == OPEN, and §1.3 forbids feeding the FROZEN it wrote back into the multiplier; im_short1 == 0 because 250000 <= 312500"
            - "im_posture2 == im_posture1 and im_req2 == im_req1 and im_v2 == im_v1 — a repeated read is byte-identical, so there is no eventual-consistency window to observe"
            - "im_acc_total == 2 with both statuses FROZEN — the cross-entity leg of the cascade landed in the same request as the alert insert"
            - "im_alerts_total == 1 with im_alert_sla == 2026-08-02T00:00:00.000Z == triggered_at + 24h, computed at insert time rather than on read"
            - "im_sum_posture == FROZEN and im_sum_req == 250000 — the computed read endpoint agrees with the stored row, so the summary is derived from the same committed state and not from a stale snapshot"

      - name: the_version_a_client_reads_immediately_after_a_write_is_already_the_post_cascade_version
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.diligence_composite_score
          - state_machines.Partner.DILIGENCE_to_DILIGENCE_PASSED
          - concurrency_rules.agreement-create-stale-partner
        distinguishing_aspect: "Immediate consistency is what makes the OCC contract usable: the Partner fields the decision denormalises (latest_composite_score, capability_tier, status) and the version bump are committed together, so the token read one call later is accepted. If any part of the cascade lagged, either the mirrored score would be stale or the freshly-read version would already be obsolete and the agreement create would 412 — this instance fails in one direction or the other under any non-immediate model."
        test_recipe:
          setup:
            - "Partner A with a SUBMITTED INITIAL diligence review scoring 80 / 80 / 90 / 85."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pre_score: $.data.latest_composite_score, pre_tier: $.data.capability_tier, pre_status: $.data.status, pre_v: $.data.version }
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Composite 84.5 clears the 55.0 pass floor at TIER_2." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { dec_status: $.data.status, dec_score: $.data.composite_score, dec_tier: $.data.tier, dec_eff_hist: $.data.effective_complaint_history_score }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { post_score: $.data.latest_composite_score, post_tier: $.data.capability_tier, post_status: $.data.status, post_v: $.data.version }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${pa_id}", kyc_owner: "BANK", dispute_owner: "PARTNER", marketing_owner: "PARTNER", oversight_rights_level: "ENHANCED", audit_access_notice_days: 10, termination_triggers: ["COMPLAINT_RATE", "RESERVE_SHORTFALL", "SANCTIONS_EVENT", "CONCENTRATION_CAP", "GROWTH_BREACH", "VOLUNTARY"], monthly_growth_cap_pct: 50.00, concentration_cap_pct: 80.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${post_v}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { im_agr_id: $.data.id, im_agr_status: $.data.status }
            - call: "GET /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", status: "PASSED" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { im_dr_total: $.total_count, im_dr_score: "$.data[0].composite_score" }
          assert:
            - "pre_score == null and pre_tier == null and pre_status == DILIGENCE — the mirrored fields are unset until a decision exists"
            - "dec_status == PASSED with dec_score == 84.5 == 16.00 + 20.00 + 31.50 + 17.00 (each component rounded to 2dp first), dec_tier == TIER_2 since 84.5 is below TIER_1_FLOOR 85.0, and dec_eff_hist == 85 because the INITIAL variant uses the submitted complaint_history_score verbatim"
            - "post_score == 84.5 and post_tier == TIER_2 and post_status == DILIGENCE_PASSED on the FIRST read — the Partner mirror is written inside the decision's own transaction"
            - "post_v == ${pre_v} + 1 — exactly one version bump for the whole cascade, not one per denormalised field"
            - "the agreement create with expected_partner_version == post_v returns 201 with im_agr_status == DRAFT — no invisible write happened between the decision and the read, so the token is still valid"
            - "im_dr_total == 1 with im_dr_score == 84.5 — the list projection of the same row agrees with both the write response and the Partner mirror, so no reader sees an intermediate state"
