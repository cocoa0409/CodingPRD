              captures: { self_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-RBAC-REP", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
