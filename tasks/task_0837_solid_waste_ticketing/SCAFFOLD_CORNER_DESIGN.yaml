scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: facility_create_returns_computed_defaults
        claim_type: Creation
        grounds: [entities.Facility.fields.acceptance_posture, entities.Facility.fields.gas_status]
        distinguishing_aspect: "POST /landfill/facilities returns 201 with gas_status NORMAL, acceptance_posture OPEN, consumed_airspace 0 and version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
          assert:
            - "Facility.${fac_id}.gas_status == NORMAL"
            - "Facility.${fac_id}.acceptance_posture == OPEN"
            - "Facility.${fac_id}.consumed_airspace_cubic_yards == 0"
            - "Facility.${fac_id}.version == 1"

      - name: cell_create_defaults_open_zero
        claim_type: Defaults
        grounds: [entities.Cell.fields.status, entities.Cell.fields.consumed_cubic_yards]
        distinguishing_aspect: "A new cell defaults to status OPEN and consumed_cubic_yards 0 with an assigned fill_sequence."
        test_recipe:
          setup: ["A facility."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
          assert:
            - "Cell.${cell_id}.status == OPEN"
            - "Cell.${cell_id}.consumed_cubic_yards == 0"

      - name: facility_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /landfill/facilities/{unknown} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /landfill/facilities/00000000-0000-4000-8000-000000000000"
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: ticket_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Ticket.fields.gross_weight_tons, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /landfill/tickets omitting gross_weight_tons returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A facility and a hauler."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW" }
              as: GateOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: ticket_create_invalid_enum_material_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Ticket.fields.material, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /landfill/tickets with material PLASTIC (not in the enum) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A facility and a hauler."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "PLASTIC", gross_weight_tons: 4.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: gas_reading_is_append_only_no_version
        claim_type: Immutability
        grounds: [entities.GasReading.fields.methane_ppm]
        distinguishing_aspect: "GasReading is common_fields:false (append-only) — it exposes id and created_at but no version and has no update endpoint."
        test_recipe:
          setup: ["A facility."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 120, reading_at: "2026-03-01T06:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { gr_id: $.data.id }
          assert:
            - "GasReading.${gr_id}.resulting_gas_status == NORMAL"

  # =========================================================================
  - section: state_machines
    instances:
      - name: ticket_inspect_before_weighout_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Ticket.WEIGHED_to_INSPECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Inspecting a CREATED (not yet WEIGHED) ticket fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CREATED MSW ticket."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 6.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_waste_decide_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SpecialWasteApproval.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Deciding an already-APPROVED approval again fails ERR_INVALID_STATE (APPROVED is terminal)."
        test_recipe:
          setup: ["An APPROVED special-waste approval."]
          setup_api_calls:
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${hauler_id}", declared_material: "TIRE", declared_weight_tons: 2.0 }
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { man_id: $.data.id }
            - call: "POST /landfill/manifests/${man_id}/special-waste-approvals"
              payload: { waste_type: "TIRE", profile_ref: "PRF-9" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { swa_id: $.data.id }
            - call: "POST /landfill/special-waste-approvals/${swa_id}/decide"
              payload: { decision: "APPROVE" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
          trigger:
            - call: "POST /landfill/special-waste-approvals/${swa_id}/decide"
              payload: { decision: "DENY" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: ticket_initial_state_is_created
        claim_type: Initial State
        grounds: [entities.Ticket.fields.status, state_machines.Ticket.CREATED_to_WEIGHED]
        distinguishing_aspect: "A freshly scaled-in ticket starts in status CREATED with estimated_fee_cents populated and tipping_fee_cents null."
        test_recipe:
          setup: ["A facility and hauler."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 6.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id }
          assert:
            - "Ticket.${tk_id}.status == CREATED"
            - "Ticket.${tk_id}.estimated_fee_cents == 26300"

  # =========================================================================
  - section: calculations
    instances:
      - name: minimum_fee_floor_applies_clean_wood
        claim_type: Correct Result
        grounds: [calculations.tipping_fee, entities.Ticket.fields.tipping_fee_cents]
        distinguishing_aspect: "CLEAN_WOOD net 0.5 tons has weight_fee 900 minus 12% rebate = 792 subtotal, so the MINIMUM_FEE_CENTS floor 2500 applies -> tipping_fee_cents 2500."
        test_recipe:
          setup: ["A CLEAN_WOOD ticket created gross 1.5."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CLEAN_WOOD", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { fee: $.data.tipping_fee_cents }
          assert:
            - "Ticket.${tk_id}.tipping_fee_cents == 2500"
            - "Ticket.${tk_id}.is_diverted == true"

      - name: diverted_load_consumes_no_airspace
        claim_type: Correct Result
        grounds: [calculations.cell_selection, entities.Ticket.fields.posted_airspace_cy, entities.Cell.fields.consumed_cubic_yards]
        distinguishing_aspect: "Posting a GREEN_WASTE (diverted) ticket sets posted_airspace_cy 0 and leaves every cell's consumed_cubic_yards unchanged."
        test_recipe:
          setup: ["A facility with one cell and an INSPECTED GREEN_WASTE ticket net 10.0."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "GREEN_WASTE", gross_weight_tons: 12.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { st: $.data.status }
          assert:
            - "Ticket.${tk_id}.status == POSTED"
            - "Ticket.${tk_id}.posted_airspace_cy == 0"
            - "Cell.${cell_id}.consumed_cubic_yards == 0"

      - name: gas_elevated_boundary_200_inclusive
        claim_type: Constants Applied
        grounds: [calculations.gas_status, entities.GasReading.fields.resulting_gas_status]
        distinguishing_aspect: "methane_ppm exactly 200 classifies ELEVATED (>= inclusive), and the facility stays OPEN (ELEVATED does not close it)."
        test_recipe:
          setup: ["A facility with no prior readings."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 200, reading_at: "2026-03-01T07:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { rgs: $.data.resulting_gas_status }
          assert:
            - "GasReading.resulting_gas_status == ELEVATED"
            - "Facility.${fac_id}.gas_status == ELEVATED"
            - "Facility.${fac_id}.acceptance_posture == OPEN"

  # =========================================================================
  - section: validations
    instances:
      - name: hauler_cannot_create_manifest_for_other_account
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Hauler whose X-User-ID differs from the manifest's hauler_account_id gets ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Two hauler accounts."]
          setup_api_calls:
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { h1: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H2", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${h2}", declared_material: "MSW", declared_weight_tons: 3.0 }
              as: Hauler
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: post_same_user_inspected_returns_segregation
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "When the posting GateOperator X-User-ID equals inspected_by, post fails ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["An INSPECTED ticket inspected by user op_same."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 6.0 }
              as: GateOperator
              as_user_id: "op_same"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_same"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_same"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_same"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_same"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: post_over_credit_limit_returns_fiscal_error
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "A well-formed INSPECTED post whose fee 33900 exceeds the hauler credit_limit 1000 (all earlier checks pass) returns ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["INSPECTED MSW ticket net 8.0 (fee 33900), hauler credit_limit 1000, facility OPEN with airspace."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 1000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: special_waste_post_without_approval_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_SPECIAL_WASTE_NOT_APPROVED]"]
        distinguishing_aspect: "Posting a TIRE ticket whose manifest is not cleared (no APPROVED approval) returns ERR_SPECIAL_WASTE_NOT_APPROVED."
        test_recipe:
          setup: ["INSPECTED TIRE ticket referencing an uncleared manifest; facility OPEN with airspace."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 500 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 100 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              as_user_id: "adm1"
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${hauler_id}", declared_material: "TIRE", declared_weight_tons: 2.0 }
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { man_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "TIRE", gross_weight_tons: 3.0, manifest_id: "${man_id}" }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SPECIAL_WASTE_NOT_APPROVED"

      - name: weighout_tare_exceeds_gross_returns_invalid_weight
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_WEIGHT]"]
        distinguishing_aspect: "Weigh-out with tare 7.0 greater than gross 5.0 returns ERR_INVALID_WEIGHT."
        test_recipe:
          setup: ["A CREATED MSW ticket gross 5.0."]
          setup_api_calls:
            - call: "POST /landfill/facilities"
