  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: program_budget_partition_conserved
        grounds:
          - calculations.program_budget_partition
          - state_machines.Agreement.EXECUTED_to_ACTIVE
          - state_machines.Agreement.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity #1 = program budget partition. Forward (execute) reserves
          50,000,000 into committed (available 950,000,000); compensating (complete on all
          covenants MET) releases it (available back to 1,000,000,000). available+committed+
          disbursed == total_budget_cents(1,000,000,000) holds before and after.
        test_recipe:
          setup:
            - "GRANT program budget 1,000,000,000; agreement (cap 50,000,000) with one JOBS(target 100) covenant; report actual_jobs=100"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "GET /incentive-programs/${pg_id}"
              payload: {}
              as: ProgramDirector
              captures: { avail_after_execute: $.data.available_budget_cents, committed_after_execute: $.data.committed_cents }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_id: $.data.id }
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 100, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
            - call: "GET /incentive-programs/${pg_id}"
              payload: {}
              as: ProgramDirector
              captures: { avail_after_complete: $.data.available_budget_cents, committed_after_complete: $.data.committed_cents, disbursed_after_complete: $.data.disbursed_cents }
          assert:
            - "IncentiveProgram.${pg_id}.committed_cents was 50000000 and available_budget_cents was 950000000 right after execute"
            - "Agreement.${agr_id}.status == COMPLETED"
            - "IncentiveProgram.${pg_id}.committed_cents == 0"
            - "IncentiveProgram.${pg_id}.available_budget_cents == 1000000000"
            - "IncentiveProgram.${pg_id}.disbursed_cents == 0"

      - name: agreement_disbursement_ledger_conserved
        grounds:
          - calculations.agreement_disbursement_ledger
          - state_machines.Disbursement.APPROVED_to_PAID
          - state_machines.Disbursement.PAID_to_CLAWED_BACK
        distinguishing_aspect: |
          Conserved quantity #2 = agreement disbursement ledger. Forward (pay) sets gross=net=
          10,000,000; compensating (clawback on recapture finalize) moves it to net=0,
          clawed_back=10,000,000 while gross stays 10,000,000. gross == net + clawed_back holds
          throughout (a different conserved quantity than the program budget partition).
        test_recipe:
