          assert:
            - "SubscriberAccount.${acct_a_id}.pricing_phase == INTRO (elapsed_months == 0 < 6)"
            - "SubscriberAccount.${acct_b_id}.pricing_phase == POST_PROMO: floor(180 days / 30 days) == 6 and the boundary is exclusive"
            - "SubscriberAccount.${acct_c_id}.pricing_phase == INTRO: floor(179 days / 30 days) == 5, one day inside the promotional period"
            - "LabelDisclosure.${disc_a_id}.disclosed_net_monthly_cents == 3766 and LabelDisclosure.${disc_c_id}.disclosed_net_monthly_cents == 3766"
            - "LabelDisclosure.${disc_b_id}.disclosed_net_monthly_cents == 7628 — the same label row, the post-promotional net"
