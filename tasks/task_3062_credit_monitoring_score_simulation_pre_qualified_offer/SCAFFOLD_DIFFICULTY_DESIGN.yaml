              as: LenderOps
          trigger:
            - call: "POST /credit/consumers/${c_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${c_id}"
            - call: "POST /credit/consumers/${d_id2}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${d_id2}"
            - call: "POST /credit/consumers/${e_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${e_id}"
            - call: "POST /credit/consumers/${e_id}/pre-qualifications"
              payload: { lender_program_id: "00000000-0000-0000-0000-000000000000" }
              as: Consumer
              as_user_id: "${e_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "the snapshot at util 29.99 reports overall_credit_utilization_pct == 29.99 and earns no penalty"
            - "the snapshot at util 30.00 reports overall_credit_utilization_pct == 30.00 and also earns no penalty, because the branch tests utilization > 30.0 strictly"
            - "the snapshot at util 40.01 reports overall_credit_utilization_pct == 40.01 and earns the penalty, giving modeled_odds_pct == 0.91 where the other two give 0.86"
            - "the fourth call targets an empty candidate pool and returns ERR_INVALID_REQUEST with status 400"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: referral_creation_requires_unsealed_consent
        grounds:
          - state_machines.Referral.SENT_to_FUNDED
          - state_machines.ConsentRecord.PENDING_to_SEALED
          - errors.ERR_OFFER_NOT_RENDERED
        distinguishing_aspect: "The Referral -> ConsentRecord pair: the first referral seals the one-time consent, so a second referral on the same rendered offer is refused because the dependent ConsentRecord has left PENDING — the refusal is driven by the consent row's state and not by the referral's."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P with a PREQUALIFIED decision, a rendered offer and a PENDING consent record."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-11" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
          trigger:
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9010", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { rd_id: $.data.id }
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9011", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { err9: $.data.error_id }
          assert:
            - "the first referral is created and Referral.${rd_id}.status == SENT"
            - "the first call seals the consent: ConsentRecord for the decision has status SEALED and lender_routing_netloc non-null"
            - "PreQualificationDecision.${d_id}.decision_status == CONSUMED and the offer is CONSUMED"
            - "the second call returns status 409 with a non-null error_id, because the dependent consent is no longer PENDING"
            - "exactly one Referral row exists for ${o_id}, so no second referral was opened"

      - name: decision_presentation_requires_program_active
        grounds:
          - state_machines.PreQualificationDecision.PREQUALIFIED_to_PREQUALIFIED
          - state_machines.LenderProgram.ACTIVE_to_PAUSED
          - errors.ERR_PRESENTATION_INELIGIBLE
        distinguishing_aspect: "The PreQualificationDecision → LenderProgram pair: pausing the sponsoring program cascades the pinned decision to INELIGIBLE, so a subsequent present against a decision still nominally PREQUALIFIED fails because of the program's state rather than the decision's."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P with a PREQUALIFIED decision on the loan program and a PENDING consent record."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-8" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/lender-programs/${prog_id}/pause"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { ce_v: $.data.version }
          trigger:
            - call: "POST /credit/consumers/${c_id}/consents/${d_id}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${ce_v}" }
              as: Consumer
              as_user_id: "${c_id}"
              captures: { err5: $.data.error_id }
          assert:
            - "LenderProgram.${prog_id}.status == PAUSED after the pause call"
            - "PreQualificationDecision.${d_id}.decision_status == INELIGIBLE and reason == PROGRAM_PAUSED"
            - "the consent call returns 409 ERR_CONSENT_DECISION_NOT_PREQUALIFIED, so the failure is caused by the dependent program's pause"
            - "no ConsentRecord exists for the (${c_id}, ${d_id}) pair"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bureau_pull_cooldown_excludes_the_boundary_hour
        grounds:
          - errors.ERR_PULL_COOLDOWN_ACTIVE
          - calculations.monitoring_window_checks
          - entities.Consumer.fields.score_version
        distinguishing_aspect: "Half-open exclusion on the pull resource: a second pull at exactly pulled_at + 24h is accepted while one at pulled_at + 23h is rejected, because the cooldown compares the prior pull instant with a strict greater-than against clock - 24h."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-09-01T23:00:00Z for the first attempt and to 2026-09-02T00:00:00Z for the second."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T23:00:00Z" }
              as: PlatformAdmin
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cw_v: $.data.version }
            - call: "POST /credit/consumers/${c_id}/bureau-snapshots"
              payload: { score: 670, added_account_count: 0, total_revolving_balance_cents: 470000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${cw_v}" }
              as: BureauConnector
              captures: { err6: $.data.error_id }
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /credit/consumers/${c_id}"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { cx_v: $.data.version }
            - call: "POST /credit/consumers/${c_id}/bureau-snapshots"
              payload: { score: 675, added_account_count: 0, total_revolving_balance_cents: 460000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${cx_v}" }
              as: BureauConnector
              captures: { s_boundary_ord: $.data.snapshot_ordinal }
          assert:
            - "at 2026-09-01T23:00:00Z the pull is refused with 409 ERR_PULL_COOLDOWN_ACTIVE — 23h is inside the 24h half-open window"
            - "consumer.${c_id}.score_version is still 1 after the refusal"
            - "at 2026-09-02T00:00:00Z, exactly 24h after pulled_at, the pull is accepted and score_version becomes 2"
            - "the accepted pull reports snapshot_ordinal == 2 for ${s_boundary_ord} and supersedes the earlier snapshot"

      - name: consent_sealing_quota_drains_in_created_at_order
        grounds:
          - calculations.governance_thresholds
          - state_machines.ConsentRecord.PENDING_to_SEALED
          - entities.ConsentRecord.fields.sealed_at
        distinguishing_aspect: "Fixed-capacity batch window instead of pairwise overlap: one operations run seals at most CONSENT_SEAL_MAX_PER_RUN consents, drained in created_at ASC order with the remainder left PENDING for the next run, and the batch is refused entirely when the run_key is reused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A single consumer with several decisions, each reaching PREQUALIFIED with a PENDING consent record."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-9" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
          trigger:
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seal-batch-1" }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
          assert:
            - "OpsRun.${run_id}.status is COMPLETED or PARTIAL but never left RUNNING"
            - "the PENDING consent record became SEALED with sealed_at == 2026-09-01T00:00:00Z"
            - "a second run with run_key 'seal-batch-1' returns 409 ERR_OPS_RUN_KEY_DUPLICATE, so the batch window cannot be replayed"
            - "a run with a fresh run_key and the clock advanced 366 days archives the record, setting archive_status ARCHIVED while status stays SEALED"
            - "GET /credit/consent-records?archive_status=ARCHIVED returns the record and the unfiltered list also still contains it"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: referral_reversal_restores_zero_net_realized
        grounds:
          - calculations.compute_revenue_recognition_amount
          - state_machines.Referral.FUNDED_to_REVERSED
          - entities.Referral.fields.clawback_rate_bps
        distinguishing_aspect: "The conserved quantity is net realized revenue cents across a reversal: forward funding then compensation must leave the referral's account at exactly gross_share - claw_share with no drift, and the second reversal is refused rather than allowed to dip it lower."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, then 2026-09-10T00:00:00Z for the reversal — inside the program's 90-day clawback window."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - *k_prequal_p
            - *k_qualify
            - *k_content_facet
            - *k_facet_accuracy
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "seed-facet-rollup-10" }
              as: PlatformAdmin
            - *k_present
            - call: "POST /credit/offers/${o_id}/render"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - *k_resync_b
            - *k_consent_record
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9009", channel: "WEB", offer_id: "${o_id}" }
              as: LenderOps
              captures: { rc_id: $.data.id }
            - call: "POST /credit/referrals/${rc_id}/fund"
              payload: { funded_amount_cents: 900000 }
              as: LenderOps
            - call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/referrals/${rc_id}/reverse"
              payload: { reason_code: "LENDER_RETURNED_FUNDS" }
              as: ComplianceOfficer
            - call: "POST /credit/referrals/${rc_id}/reverse"
              payload: { reason_code: "LENDER_RETURNED_FUNDS" }
              as: ComplianceOfficer
              captures: { err7: $.data.error_id }
          assert:
            - "the first reversal succeeds and posts a CLAWBACK entry of -45000"
            - "net realized for ${rc_id} == 90000 - 45000 == 45000, with zero drift in the conserved cents"
            - "the second reversal is refused with 409 ERR_INVALID_STATE_TRANSITION, so the invariant cannot be broken by repetition"
            - "no additional RevenueRecognitionEntry is created by the refused call"
            - "Referral.${rc_id}.reversed_at stays at 2026-09-10T00:00:00Z and is not overwritten"

      - name: monitoring_consent_permanence_across_close_and_reopen
        grounds:
          - state_machines.Consumer.ACTIVE_to_CLOSED
          - state_machines.Consumer.ACTIVE_to_ACTIVE
          - entities.Consumer.fields.monitoring_consent_at
        distinguishing_aspect: "The conserved quantity is the enrollment invariant — once score_version has left zero the monitoring consent can never be re-granted, so the compensating close-and-attempt-to-reopen path must leave score_version and the consent stamp unchanged even though every snapshot was deleted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Consumer P consented with one ACTIVE snapshot, no referrals and no open decisions."
          setup_api_calls:
            - *k_clock
            - *k_consumer_p
            - *k_consent_p
            - *k_resync_a
            - *k_snapshot_p
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "POST /credit/consumers/${c_id}/close"
              payload: {}
              as: DataProtectionOfficer
            - call: "POST /credit/consumers/${c_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
              captures: { err8: $.data.error_id }
          assert:
            - "the close succeeds and Consumer.${c_id}.archive_status == ARCHIVED"
            - "the attempt to re-grant consent returns 409 ERR_PRIOR_BUREAU_SNAPSHOT_EXISTS, preserving the invariant that score_version 1 can never return to 0"
            - "Consumer.${c_id}.score_version == 1 and monitoring_consent_at is unchanged at 2026-09-01T00:00:00Z"
            - "the consumer's bureau snapshots are all SUPERSEDED after the close, yet current_score stays 660 and score_version stays 1 rather than resetting"
