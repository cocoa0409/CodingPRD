# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Nine rule_ids, ≥2 instances each.
# All formula-derived asserts are precomputed literals (see inline derivations).
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: patient_cost_dual_variant_insurance_vs_self_pay_on_visit
        grounds:
          - calculations.patient_cost_estimate
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_INSURANCE
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_SELF_PAY
          - entities.Visit.fields.patient_cost_cents
        distinguishing_aspect: |
          Two identical-list-fee Visits diverge in patient_cost_cents purely on the routing
          branch: the INSURANCE-routed visit costs the payer copay (2500), the SELF_PAY-routed
          visit costs the discounted list fee (8000) — dual-variant on the Visit entity domain.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed+ACTIVE in CA (VIDEO). Payer P covers CA, copay 2500, parity true, allowed 8000."
            - "Patient A has insurance_payer_id = P; Patient B has no payer."
            - "Visit V_ins: patient A, list_fee 10000, CA, VIDEO; cleared then approved -> INSURANCE."
            - "Visit V_self: patient B, list_fee 10000, CA, VIDEO; cleared then approved -> SELF_PAY."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /payers"
              payload: { name: "PlanP", telehealth_parity: true, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_p: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_p}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_ins: $.data.id }
            - call: "POST /visits/${v_ins}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits/${v_ins}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T14:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_self: $.data.id }
            - call: "POST /visits/${v_self}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_self}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { self_routing: $.data.routing, self_cost: $.data.patient_cost_cents }
          assert:
            - "Visit.${v_ins}.routing == INSURANCE"
            - "Visit.${v_ins}.patient_cost_cents == 2500"
            - "Visit.${v_self}.routing == SELF_PAY"
            - "Visit.${v_self}.patient_cost_cents == 8000"

      - name: claim_adjudication_dual_variant_parity_vs_non_parity_on_claim
        grounds:
          - calculations.claim_adjudication
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_INSURANCE
          - entities.Claim.fields.plan_paid_cents
        distinguishing_aspect: |
          Two Claims with identical billed 10000 and allowed 8000 produce different plan_paid_cents
          solely from the payer's telehealth_parity flag: parity payer -> 5500, non-parity payer
          -> 1500 — dual-variant on the Claim entity domain (a different subject than the Visit cost above).
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Payer Parity (parity true) and Payer NoParity (parity false), both copay 2500, allowed 8000, cover CA."
            - "Patient A on Parity, Patient B on NoParity. Two insurance visits cleared+approved, each cascading a Claim that is auto-adjudicated."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /payers"
              payload: { name: "Parity", telehealth_parity: true, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_par: $.data.id }
            - call: "POST /payers"
              payload: { name: "NoParity", telehealth_parity: false, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_np: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_par}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_np}" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_par: $.data.id }
            - call: "POST /visits/${v_par}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits/${v_par}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T14:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_np: $.data.id }
            - call: "POST /visits/${v_np}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_np}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "GET /visits/${v_par}/claims"
              payload: {}
              as: ComplianceOfficer
              captures: { par_claim_plan_paid: "$.data[0].plan_paid_cents" }
            - call: "GET /visits/${v_np}/claims"
              payload: {}
              as: ComplianceOfficer
              captures: { np_claim_plan_paid: "$.data[0].plan_paid_cents" }
          assert:
            - "the single Claim for ${v_par} has allowed_cents == 8000 and plan_paid_cents == 5500"
            - "the single Claim for ${v_np} has allowed_cents == 8000 and plan_paid_cents == 1500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_adjudication_nested_min_max_conditional_mode_a
        grounds:
          - calculations.claim_adjudication
          - entities.Claim.fields.allowed_cents
          - entities.Claim.fields.plan_paid_cents
        distinguishing_aspect: |
          MODE (a): plan_paid = a >=3-input formula with nested min/max and a conditional branch
          on parity — allowed=min(billed 12000, allowed_amount 8000)=8000, non-parity branch
          plan_paid=max(0, round_half_up(8000*0.5) - copay 2500)=1500. Distinct mode from the
          self-pay nested-rounding instance below.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Non-parity payer copay 2500 allowed 8000 covers CA."
            - "Insurance visit with list_fee 12000 (> allowed) cleared+approved; cascaded Claim auto-adjudicated."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /payers"
              payload: { name: "NoParity", telehealth_parity: false, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_np: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_np}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 12000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "GET /visits/${v_id}/claims"
              payload: {}
              as: ComplianceOfficer
              captures: { claim_allowed: "$.data[0].allowed_cents", claim_plan_paid: "$.data[0].plan_paid_cents" }
          assert:
            - "the single Claim for ${v_id} has allowed_cents == 8000 (min(12000, 8000))"
            - "the single Claim for ${v_id} has plan_paid_cents == 1500 (max(0, round_half_up(8000*0.5) - 2500))"

      - name: self_pay_cost_per_component_rounding_order_mode_b
        grounds:
          - calculations.patient_cost_estimate
          - entities.Visit.fields.platform_fee_cents
          - entities.Visit.fields.patient_cost_cents
        distinguishing_aspect: |
          MODE (b): order-dependent nested rounding pinned PER-COMPONENT-THEN-SUM. list_fee 1501
          and platform_fee 1502 at *0.80 -> round_half_up(1200.8)=1201 + round_half_up(1201.6)=1202
          = 2403; sum-then-round would give round_half_up(2402.4)=2402. The pinned order yields 2403.
          Distinct mode from the min/max conditional above.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Patient with NO payer (forces SELF_PAY)."
            - "Visit list_fee 1501, platform_fee 1502, CA, VIDEO; cleared then approved -> SELF_PAY."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 1501, platform_fee_cents: 1502 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { routing: $.data.routing, cost: $.data.patient_cost_cents }
          assert:
            - "Visit.${v_id}.routing == SELF_PAY"
            - "Visit.${v_id}.patient_cost_cents == 2403"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: state_license_cycle_active_suspended_active
        grounds:
          - state_machines.StateLicense.ACTIVE_to_SUSPENDED
          - state_machines.StateLicense.SUSPENDED_to_ACTIVE
          - entities.StateLicense.fields.status
        distinguishing_aspect: |
          CYCLE shape on StateLicense: ACTIVE -> SUSPENDED -> ACTIVE returns the license to ACTIVE
          and restores Physician.active_license_count, proving the machine loops rather than running
          a forward-only pipeline. Distinct entity from the Visit branching instance.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician with one ACTIVE CA license (active_license_count == 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "audit" }
              as: LicensingBoard
          trigger:
            - call: "POST /state-licenses/${lic_ca}/reinstate"
              payload: {}
              as: LicensingBoard
              captures: { lic_status: $.data.status }
          assert:
            - "StateLicense.${lic_ca}.status == ACTIVE"
            - "StateLicense.${lic_ca}.suspension_reason == null"
            - "Physician.${phys_id}.active_license_count == 1"

      - name: visit_branching_cleared_to_insurance_or_self_pay
        grounds:
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_INSURANCE
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_SELF_PAY
          - entities.Visit.fields.routing
        distinguishing_aspect: |
          BRANCHING fork-join shape on Visit: the single COMPLIANCE_CLEARED state forks to two
          targets with divergent side-effect sets — APPROVED_INSURANCE creates a Claim, APPROVED_SELF_PAY
          creates none. Distinct entity from the StateLicense cycle.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Parity payer covers CA. Patient A insured, Patient B cash."
            - "Two cleared visits ready to approve."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /payers"
              payload: { name: "Parity", telehealth_parity: true, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_par: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_par}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_ins: $.data.id }
            - call: "POST /visits/${v_ins}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T14:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_self: $.data.id }
            - call: "POST /visits/${v_self}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_ins}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { ins_status: $.data.status }
            - call: "POST /visits/${v_self}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { self_status: $.data.status }
            - call: "GET /visits/${v_ins}/claims"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /visits/${v_self}/claims"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Visit.${v_ins}.status == APPROVED_INSURANCE"
            - "GET /visits/${v_ins}/claims returns total_count == 1 (one Claim created on the insurance branch)"
            - "Visit.${v_self}.status == APPROVED_SELF_PAY"
            - "GET /visits/${v_self}/claims returns total_count == 0 (no Claim created on the self-pay branch)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspension_cascade_license_visit_prescription_depth3
        grounds:
          - state_machines.StateLicense.ACTIVE_to_SUSPENDED
          - state_machines.Visit.COMPLIANCE_CLEARED_to_VOIDED
          - state_machines.Prescription.ACTIVE_to_VOIDED
          - entities.Prescription.fields.status
        distinguishing_aspect: |
          DEPTH-3 chain from the suspend trigger: suspending the StateLicense (A) voids the
          COMPLIANCE_CLEARED Visit it governs (B), and the Visit VOID in turn voids that visit's
          ACTIVE Prescription (C). Each hop is caused by the prior hop, not by the suspend call directly.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician dea_number set, licensed CA with controlled_substance_authority."
            - "Visit cleared in CA (VIDEO); a controlled-substance (schedule IV) Prescription authored ACTIVE on it."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", dea_number: "BV1234567", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", controlled_substance_authority: true, effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits/${v_id}/prescriptions"
              payload: { drug_name: "Lorazepam", dea_schedule: "IV", days_supply: 30 }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "board action" }
              as: LicensingBoard
            - call: "GET /visits/${v_id}"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { v_status: $.data.status }
            - call: "GET /prescriptions/${rx_id}"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx_status: $.data.status }
          assert:
            - "Visit.${v_id}.status == VOIDED"
            - "Prescription.${rx_id}.status == VOIDED"
            - "StateLicense.${lic_ca}.status == SUSPENDED"

      - name: complete_cascade_visit_followup_depth2
        grounds:
          - state_machines.Visit.APPROVED_SELF_PAY_to_COMPLETED
          - calculations.follow_up_due
          - entities.FollowUp.fields.due_at
        distinguishing_aspect: |
          DEPTH-2 cascade from a DIFFERENT trigger (complete, not suspend): completing the Visit (A)
          itself triggers creation of a FollowUp (B) whose due_at = completion + 30 days. One link
          beyond the direct action, originating from the complete transition.
        test_recipe:
          setup:
            - "Clock 2026-03-01T12:00:00Z. Physician licensed CA. Cash patient. Visit cleared+approved SELF_PAY."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-01T12:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
