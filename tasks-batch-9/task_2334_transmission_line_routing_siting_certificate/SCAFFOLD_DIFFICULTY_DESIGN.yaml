  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: need_margin_at_exact_threshold_certifies_study
        grounds:
          - calculations.need_justification_margin
          - state_machines.PlanningStudy.ALTERNATIVES_ANALYZED_to_CERTIFIED_SUFFICIENT
          - endpoints[POST /siting/planning-studies/{studyId}/sufficiency-certification]
        distinguishing_aspect: |
          Metric = need_justification_margin (a 4-decimal ratio) exactly at its 1.1500 threshold on
          the sufficiency-certification endpoint. The screened-in non-transmission portfolio levelizes
          to 230000000.00 cents/MW against the transmission 200000000.00, giving exactly 1.1500, which
          must CERTIFY (>= is inclusive). A 45000000000-cent portfolio yields 1.1250 and lands in
          INSUFFICIENT, and a 45999000000-cent portfolio yields a raw 1.149975 that ROUNDS to 1.1500
          and still certifies, proving the comparison is made on the rounded value.
        test_recipe:
          setup:
            - "Study with reliability_deficit_mw 400, transmission_capex_cents 80000000000 and benefit_pv_cents 80000000000"
            - "Two SCREEN_IN alternatives: TRANSMISSION 80000000000/400 MW and NON_TRANSMISSION 46000000000/200 MW"
          setup_api_calls:
            - *k01
            - *k02
            - *k03
            - *k04
            - *k05
            - *k06
          trigger:
            - *k07
          assert:
            - "Alternative.${alt1}.levelized_cost_cents_per_mw == 200000000.00"
            - "Alternative.${alt2}.levelized_cost_cents_per_mw == 230000000.00"
            - "PlanningStudy.${study}.benefit_ratio == 1.0000"
            - "PlanningStudy.${study}.need_margin_ratio == 1.1500"
            - "PlanningStudy.${study}.status == CERTIFIED_SUFFICIENT"
            - "PlanningStudy.${study}.certified_by_user_id == dev-milo"

      - name: aggregate_crew_exactly_at_effective_limit_accepted
        grounds:
          - validations[ERR_CREW_CAPACITY_EXCEEDED].check
          - entities.RouteSegment.fields.committed_crew_count
          - endpoints[POST /siting/construction-activities]
        distinguishing_aspect: |
