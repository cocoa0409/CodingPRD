            - "AlarmSite.${site_b}.outstanding_balance_cents == 63000 and renewal_block_active == true"
            - "first renewal -> HTTP 409 with error_id == 'ERR_NO_ACTIVE_FEE_SCHEDULE' (priority 43 wins; S1 is SUPERSEDED and S2 is not effective until 2026-06-01)"
