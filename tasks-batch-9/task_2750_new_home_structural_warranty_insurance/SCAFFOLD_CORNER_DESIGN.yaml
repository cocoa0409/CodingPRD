# §1.9 Scaffold Corner Design (Breadth Coverage Index for Non-Difficulty Tests)
# Task 2750 - New-Home Structural Warranty Insurance
#
# Section values are the nine sections of references/claim-extraction-guide.md; claim_type values
# are that guide's per-section rows. Every formula-derived number below is a pre-computed literal.
#
# Fixture identities (opaque roles carry literal operator ids):
#   uw-officer-001 UnderwritingOfficer | compliance-001 ComplianceOfficer
#   adjuster-001 / adjuster-002 ClaimsAdjuster (segregation of duties)
# BuilderPrincipal and Homeowner are entity_backed, so their as_user_id is always a ${var}.
#
# Canonical fixtures reused across instances:
#   builder "Cedar Ridge Homes" (TX, years_in_business 5, homes_closed_last_year 25,
#     claims_history_score 94, TIER_3) -> risk_score 45.00, risk_class C
#   policy (purchase_price_cents 44500000, TX, closing_date 2026-08-15) -> premium components
#     56871 / 85307 / 217216 + surcharge 4500 = premium_cents 363894; BASE terms
#     2026-08-15..2027-08-14 (WORKMANSHIP, limit 2000000, deductible 100000),
#     2026-08-15..2028-08-14 (SYSTEMS, limit 6000000, deductible 100000),
#     2026-08-15..2036-08-14 (STRUCTURAL, limit 44500000, deductible 250000);
#     builder_obligation_end_date 2028-08-14
#   the unassigned uuid 00000000-0000-4000-8000-000000000000 is used for every not-found probe

scaffold_corner_design:
  - section: "Table 1 Entities"
    instances:
      - name: builder_creation_returns_the_declared_fields_and_every_system_default
        claim_type: Creation
        grounds:
          - endpoints.POST_/warranty/builders
          - entities.Builder.fields.underwriting_status
          - entities.Builder.fields.obligation_period_years
          - entities.Builder.fields.monitoring_posture
        distinguishing_aspect: "A single POST with the six declared underwriting inputs returns 201 and every declared field: the four risk fields are null, obligation_period_years is the program-fixed 2, and the four monitoring fields are 0 / 0 / 0.0000 / OPEN."
        test_recipe:
          setup:
            - "empty database; no clock movement is needed because builder creation reads no date"
          setup_api_calls: []
          trigger:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id, st: $.data.underwriting_status, ver: $.data.version }
          assert:
            - "HTTP 201 and ${st} == \"DRAFT\""
            - "Builder.${b1}.company_name == \"Cedar Ridge Homes\", state_code == \"TX\", years_in_business == 5, homes_closed_last_year == 25, claims_history_score == 94, financial_strength_tier == \"TIER_3\""
            - "Builder.${b1}.risk_score == null, risk_class == null, risk_basis == null, default_declared_at == null"
            - "Builder.${b1}.obligation_period_years == 2"
            - "Builder.${b1}.earned_premium_cents == 0, incurred_loss_cents == 0, loss_ratio == 0.0000, monitoring_posture == \"OPEN\""
            - "${ver} == 1 and the response envelope carries meta.api_request_id and data.created_at / data.updated_at"
      - name: policy_retrieval_returns_the_stored_premium_breakdown_and_coverage_anchors
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/warranty/policies/{id}
          - calculations.policy_premium
          - calculations.coverage_term_schedule
        distinguishing_aspect: "GET /warranty/policies/{id} returns exactly what enrollment computed: the three premium components 56871 / 85307 / 217216, surcharge 4500, premium_cents 363894, coverage_start_date 2026-08-15 and builder_obligation_end_date 2028-08-14 - no field is recomputed on read."
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and its canonical 44500000 TX home enrolled (still PENDING_ENROLLMENT / UNBILLED, which is enough to read the priced row)"
            - "logical clock advanced to 2026-08-15T00:00:00Z before enrollment so closing_date 2026-08-15 is not in the future"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /warranty/policies/${p1}"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { pw: $.data.premium_component_workmanship_cents, ps: $.data.premium_component_systems_cents, pst: $.data.premium_component_structural_cents, sur: $.data.state_surcharge_cents, tot: $.data.premium_cents, csd: $.data.coverage_start_date, boe: $.data.builder_obligation_end_date, rce: $.data.risk_class_at_enrollment }
          assert:
            - "HTTP 200 and ${pw} == 56871, ${ps} == 85307, ${pst} == 217216, ${sur} == 4500, ${tot} == 363894"
            - "${csd} == \"2026-08-15\" and ${boe} == \"2028-08-14\""
            - "${rce} == \"C\" and WarrantyPolicy.${p1}.current_owner_id == ${h1} == initial_owner_id"
            - "WarrantyPolicy.${p1}.coverage_status == \"PENDING_ENROLLMENT\", premium_status == \"UNBILLED\", transfer_count == 0, enrollment_hold == false, pending_transfer_id == null, version == 1"
      - name: coverage_term_listing_paginates_and_orders_base_terms_before_endorsements
        claim_type: Listing
        grounds:
          - endpoints.GET_/warranty/policies/{id}/coverage-terms
          - response_envelope.pagination_fields
          - entities.CoverageTerm.fields.term_kind
        distinguishing_aspect: "With four terms on one policy, limit=2 returns two rows with total_count 4 and has_more true, offset=2 returns the last two with has_more false, and the declared ordering puts the three BASE terms (in mint order WORKMANSHIP, SYSTEMS, STRUCTURAL) ahead of the ENDORSEMENT term."
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and its canonical 44500000 policy ACTIVE and PAID (three BASE terms minted at enrollment)"
            - "one ENDORSEMENT WORKMANSHIP term 2028-09-01..2029-08-31 attached, so the policy carries four terms"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/coverage-terms"
              payload: { coverage_type: "WORKMANSHIP", start_date: "2028-09-01", end_date: "2029-08-31", limit_cents: 1500000, deductible_cents: 100000 }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { et: $.data.id }
          trigger:
            - call: "GET /warranty/policies/${p1}/coverage-terms"
              payload: { limit: 2, offset: 0 }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { first_id: "$.data[0].id", first_type: "$.data[0].coverage_type" }
            - call: "GET /warranty/policies/${p1}/coverage-terms"
              payload: { limit: 2, offset: 2 }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { third_type: "$.data[0].coverage_type", fourth_kind: "$.data[1].term_kind" }
          assert:
            - "the first page returns exactly 2 rows with total_count == 4 and has_more == true"
            - "${first_type} == \"WORKMANSHIP\" and CoverageTerm.${first_id}.term_kind == \"BASE\" - BASE rows sort ahead of the ENDORSEMENT row and the three BASE rows keep their mint order"
            - "the second page returns exactly 2 rows with total_count == 4 and has_more == false"
            - "${third_type} == \"STRUCTURAL\" and ${fourth_kind} == \"ENDORSEMENT\", and the fourth row's id == ${et}"
      - name: reading_a_claim_id_that_does_not_exist_returns_claim_not_found
        claim_type: "Not Found"
        grounds:
          - endpoints.GET_/warranty/claims/{id}
          - validations.priority_10
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "An unassigned uuid in the claim path resolves to nothing, so priority 10 returns ERR_CLAIM_NOT_FOUND with HTTP 404 - not an empty 200 envelope."
        test_recipe:
          setup:
            - "empty database - no claim, policy or builder exists"
          setup_api_calls: []
          trigger:
            - call: "GET /warranty/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 404 and ${eid} == \"ERR_CLAIM_NOT_FOUND\""
            - "the envelope is the declared error shape: response_type == \"error\" and data.message is non-blank"
      - name: policy_enrollment_missing_required_purchase_price_returns_invalid_request
        claim_type: "Required Fields"
        grounds:
          - endpoints.POST_/warranty/policies
          - validations.priority_20
          - errors[ERR_INVALID_REQUEST]
          - entities.WarrantyPolicy.fields.purchase_price_cents
        distinguishing_aspect: "purchase_price_cents is source: input with no default, so omitting it fails priority 20 with ERR_INVALID_REQUEST 422 and no WarrantyPolicy row is created - the premium calculation is never reached."
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED, one Homeowner registered, clock at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          trigger:
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 422 and ${eid} == \"ERR_INVALID_REQUEST\""
            - "GET /warranty/policies with builder_id=${b1} returns total_count == 0"
      - name: transfer_request_omitting_documents_reference_defaults_it_to_null
        claim_type: Defaults
        grounds:
          - entities.WarrantyTransfer.fields.documents_reference
          - entities.WarrantyTransfer.fields.prior_transfer_id
          - calculations.transfer_fee
        distinguishing_aspect: "documents_reference and prior_transfer_id both declare default: null, so a first transfer request that omits the packet is created with both null, status REQUESTED and transfer_fee_cents 7500 (TRANSFER_BASE_FEE_CENTS with transfer_count still 0)."
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and its canonical 44500000 policy ACTIVE and PAID, so WarrantyPolicy.version == 4 after activation"
            - "a second Homeowner registered as the prospective transferee"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Ben Calloway", email: "ben.calloway@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /warranty/policies/${p1}/transfers"
              payload: { new_owner_id: "${h2}", transfer_date: "2026-09-01", expected_policy_version: "${pv}" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { t1: $.data.id, fee: $.data.transfer_fee_cents, docs: $.data.documents_reference, prior: $.data.prior_transfer_id, tstat: $.data.status }
          assert:
            - "HTTP 201, ${pv} == 4 and ${tstat} == \"REQUESTED\""
            - "${docs} == null and ${prior} == null - both declared defaults applied"
            - "${fee} == 7500 - TRANSFER_BASE_FEE_CENTS with WarrantyPolicy.transfer_count still 0"
            - "WarrantyTransfer.${t1}.requested_by_owner_id == ${h1} and WarrantyTransfer.${t1}.decision_reason == null"
            - "WarrantyPolicy.${p1}.pending_transfer_id == ${t1} and WarrantyPolicy.${p1}.version == 5"
      - name: claim_intake_computed_money_fields_input_ignored
        claim_type: "Computed Fields"
        grounds:
          - entities.Claim.fields.net_payable_cents
          - entities.Claim.fields.obligor
          - entities.Claim.fields.reported_date
          - calculations.claim_obligor_assignment
        distinguishing_aspect: "Claim intake declares only five input fields; every money field and both routing fields are source: computed, so a request that also carries net_payable_cents 9999999, reserve_cents 5000000, obligor INSURER and reported_date 2030-01-01 is accepted with all four values discarded and the server's own values written instead."
        test_recipe:
          setup:
            - "the canonical class-C builder APPROVED and its canonical 44500000 policy ACTIVE and PAID"
            - "logical clock at 2026-08-15T00:00:00Z, which is inside the builder-obligation period ending 2028-08-14"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Cedar Ridge Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "declared data accepted" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/homeowners"
              payload: { full_name: "Alice Baird", email: "alice.baird@example.com", state_code: "TX" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
            - call: "POST /warranty/policies/${p1}/premium-payments"
              payload: {}
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/policies/${p1}/activation"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
          trigger:
            - call: "POST /warranty/claims"
              payload: { policy_id: "${p1}", coverage_type: "STRUCTURAL", defect_category: "WATER_INTRUSION", damage_description: "Slab displacement at the north wall", claimed_amount_cents: 2187500, net_payable_cents: 9999999, reserve_cents: 5000000, obligor: "INSURER", reported_date: "2030-01-01" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { c1: $.data.id, net: $.data.net_payable_cents, res: $.data.reserve_cents, obl: $.data.obligor, rep: $.data.reported_date, term: $.data.coverage_term_id }
          assert:
            - "HTTP 201 - the undeclared computed fields are ignored, not rejected"
            - "${net} == 0, ${res} == 0 and Claim.${c1}.gross_adjusted_cents == 0, deductible_applied_cents == 0, betterment_cents == 0, paid_cents == 0, released_cents == 0, incurred_authorized_cents == 0"
            - "${obl} == \"BUILDER\" - calculations.claim_obligor_assignment overwrote the supplied INSURER because reported_date 2026-08-15 <= builder_obligation_end_date 2028-08-14"
            - "${rep} == \"2026-08-15\" - the logical clock date, not the supplied 2030-01-01"
            - "${term} == the id of the BASE STRUCTURAL CoverageTerm of ${p1} (GET /warranty/policies/${p1}/coverage-terms with coverage_type=STRUCTURAL returns total_count == 1 and that id)"
            - "Claim.${c1}.status == \"SUBMITTED\", designated_structural == false, filed_by_owner_id == ${h1}, substantiation_ratio == null, version == 1"
      - name: builder_creation_system_fields_input_ignored
        claim_type: "System Fields"
        grounds:
          - entities.Builder.fields.underwriting_status
          - entities.Builder.fields.obligation_period_years
          - complexity_profile.consistency_model
        distinguishing_aspect: "underwriting_status is source: system with default DRAFT and obligation_period_years is source: system fixed at 2, so a creation request supplying APPROVED and 5 (plus its own id and version) is accepted with DRAFT, 2, a server-minted uuid and version 1."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /warranty/builders"
