        distinguishing_aspect: |
          The same vendor code is re-engaged with calendar dates that do not overlap at all: a start
          on 2026-08-23 (E1.end_date + 3 days) is still 409 ERR_VENDOR_COOLDOWN_CONFLICT because the
          closed interval carries a symmetric 3-day buffer, while 2026-08-24 (end_date + 4) is 201.
          An implementation that only tests raw interval overlap, or that applies the buffer to one
          side, accepts the 08-23 request.
        test_recipe:
          setup:
            - "Agreement Duskharbor: advance_total_cents 1000000, one ALPHA milestone funded 1000000 with contractor_budget_cents 500000, ACTIVE and IN_DEVELOPMENT."
            - "Engagement E1: vendor ONE-VOICE, committed 300000, [2026-08-05, 2026-08-20], born ACTIVE."
            - "Remaining committed headroom is 200000, exactly the amount each follow-up request asks for, so the budget rule at priority 60 is never the reason for a rejection."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Duskharbor Studio", contact_email: "dev@duskharbor.example", country_code: "BR" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Duskharbor", advance_total_cents: 1000000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 1000000, contractor_budget_cents: 500000, acceptance_criteria: ["Prototype loop", "Voice pass"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "ONE-VOICE", scope_summary: "Voice recording block 1", committed_cents: 300000, start_date: "2026-08-05", end_date: "2026-08-20" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "ONE-VOICE", scope_summary: "Voice recording block 2, three days later", committed_cents: 200000, start_date: "2026-08-23", end_date: "2026-09-10" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { cooldown_error_id: "$.data.error_id" }
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "ONE-VOICE", scope_summary: "Voice recording block 2, four days later", committed_cents: 200000, start_date: "2026-08-24", end_date: "2026-09-10" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e2_id: $.data.id }
          assert:
            - "trigger call 1 -> 409 with error_id ERR_VENDOR_COOLDOWN_CONFLICT (2026-08-23 <= 2026-08-20 + 3 days)"
            - "after trigger call 1: GET /contractor-engagements?milestone_id=${m1_id} returns exactly 1 engagement (${e1_id})"
            - "after trigger call 1: GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 300000 and available_committed_cents 200000"
            - "trigger call 2 -> 201; ContractorEngagement.${e2_id}.status == ACTIVE and start_date == 2026-08-24"
            - "after trigger call 2: GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 500000, available_committed_cents 0, overrun_cents 0"
            - "ContractorEngagement.${e1_id}.status == ACTIVE (untouched by both attempts)"

  - rule_id: compensating_invariant
    instances:
      - name: suspend_then_reinstate_restores_payment_withholding_posture_and_engagement_exactly
        grounds:
          - state_machines.DevelopmentAgreement.ACTIVE_to_SUSPENDED
          - state_machines.DevelopmentAgreement.SUSPENDED_to_ACTIVE
          - state_machines.MilestonePayment.PENDING_AUTHORIZATION_to_HELD_PENDING_CURE
          - state_machines.MilestonePayment.HELD_PENDING_CURE_to_PENDING_AUTHORIZATION
          - state_machines.ContractorEngagement.ACTIVE_to_SUSPENDED
          - state_machines.ContractorEngagement.SUSPENDED_to_ACTIVE
          - calculations.agreement_funding_ledger
        distinguishing_aspect: |
          The suspend/reinstate pair must be an exact inverse across three entities: payment
          PENDING_AUTHORIZATION -> HELD_PENDING_CURE -> PENDING_AUTHORIZATION with
          scheduled_amount_cents unchanged at 3600000, withheld_payment_cents 0 -> 3600000 -> 0,
          engagement ACTIVE -> SUSPENDED -> ACTIVE, and funding_posture RESTRICTED -> FROZEN ->
          RESTRICTED (never back to OPEN, because accepted_value_cents did not change). Any drift -
          a payment stuck in HELD, a withheld residue, an engagement left SUSPENDED, or a posture
          reset to OPEN - breaks payment_obligation_conservation.
        test_recipe:
          setup:
            - "Agreement Saltglass: advance_total_cents 3600000, one ALPHA milestone funded 3600000 with contractor_budget_cents 400000, ACTIVE."
            - "Engagement E1 (vendor ANIM-SALT, committed 400000) created after activation, so it is born ACTIVE."
            - "The milestone is accepted on build 1, minting one PENDING_AUTHORIZATION payment with scheduled_amount_cents 3600000; accepted_value_cents 3600000 == 30% of the pool, so funding_posture is RESTRICTED, and E1 is left ACTIVE because its milestone is ACCEPTED."
            - "The payment is deliberately NOT authorized, so it remains suspendable."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Saltglass Studio", contact_email: "dev@saltglass.example", country_code: "NZ" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Saltglass", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 400000, acceptance_criteria: ["Core loop playable", "Animation pass"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "ANIM-SALT", scope_summary: "Character animation", committed_cents: 400000, start_date: "2026-08-05", end_date: "2026-09-05" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /milestone-builds"
              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 75.00, crash_free_sessions_pct: 96.00, content_completeness_pct: 60.00, known_blocker_count: 5, release_notes: "Alpha candidate" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T13:00:00.000Z", notes: "Alpha accepted" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
            - call: "GET /milestone-payments"
              payload: { milestone_id: "${m1_id}" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { p1_id: "$.data[0].id" }
          trigger:
            - call: "POST /development-agreements/${agreement_id}/suspend"
              payload: { reason: "Publisher liquidity review" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /development-agreements/${agreement_id}/reinstate"
              payload: { reason: "Liquidity review cleared" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
          assert:
            - "after trigger call 1: DevelopmentAgreement.${agreement_id}.status == SUSPENDED and funding_posture == FROZEN"
            - "after trigger call 1: MilestonePayment.${p1_id}.status == HELD_PENDING_CURE and scheduled_amount_cents == 3600000"
            - "after trigger call 1: DevelopmentAgreement.${agreement_id}.withheld_payment_cents == 3600000"
            - "after trigger call 1: ContractorEngagement.${e1_id}.status == SUSPENDED"
            - "after trigger call 2: DevelopmentAgreement.${agreement_id}.status == ACTIVE and funding_posture == RESTRICTED (not OPEN)"
            - "after trigger call 2: MilestonePayment.${p1_id}.status == PENDING_AUTHORIZATION and scheduled_amount_cents == 3600000"
            - "after trigger call 2: DevelopmentAgreement.${agreement_id}.withheld_payment_cents == 0"
            - "after trigger call 2: ContractorEngagement.${e1_id}.status == ACTIVE and committed_cents == 400000"
            - "after trigger call 2: DevelopmentAgreement.${agreement_id}.accepted_value_cents == 3600000 and advance_disbursed_cents == 0 and holdback_reserve_cents == 0"
            - "invariant payment_obligation_conservation: sum of MilestonePayment.scheduled_amount_cents == accepted_value_cents == 3600000 before the suspend and after the reinstate"
            - "GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 400000 and available_committed_cents 0 at every step"

      - name: engagement_cancel_returns_contractor_budget_headroom_exactly
        grounds:
          - state_machines.ContractorEngagement.ACTIVE_to_CANCELLED
          - calculations.contractor_budget_utilization.variants.COMMITTED_BASIS
          - validations[priority=60]
          - validations[priority=66]
          - errors.ERR_CONTRACTOR_BUDGET_EXCEEDED
          - entities.Milestone.fields.contractor_budget_cents
        distinguishing_aspect: |
          Cancelling an engagement must return exactly its committed_cents to the milestone's
          COMMITTED basis - no more, no less: 800000 budget, E1 500000 + E2 300000 exhausts it, a
          300000 third engagement is refused with ERR_CONTRACTOR_BUDGET_EXCEEDED, and after E2 is
          cancelled the same 300000 request succeeds and lands committed_basis_cents back on
          exactly 800000. An implementation that keeps CANCELLED engagements on the COMMITTED basis
          refuses the retry; one that over-refunds (or drops the check) would let a fourth
          engagement in.
        test_recipe:
          setup:
            - "Agreement Ashvale: advance_total_cents 3600000, one ALPHA milestone funded 3600000 with contractor_budget_cents 800000, ACTIVE and IN_DEVELOPMENT."
            - "Engagement E1: vendor FX-ALDER, committed 500000, [2026-08-05, 2026-09-05]."
            - "Engagement E2: vendor QA-BIRCH, committed 300000, [2026-08-10, 2026-09-10]; the budget is then exactly exhausted."
            - "Every engagement uses a distinct vendor_code, so the vendor cooldown rule at priority 56 never participates, and no invoice is ever submitted, so cancellation stays admissible under priority 66."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Ashvale Games", contact_email: "dev@ashvale.example", country_code: "AU" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
            - call: "POST /development-agreements"
              payload: { studio_id: "${studio_id}", publisher_id: "${publisher_id}", title: "Ashvale", advance_total_cents: 3600000, royalty_rate_bps: 2500, live_ops_quarterly_funding_cents: 100000, ship_date_original: "2027-03-31", recoupable_cost_cap_bps: 2000, platform_fee_bps: 3000 }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 1, title: "Alpha", gate_profile: "ALPHA", funded_amount_cents: 3600000, contractor_budget_cents: 800000, acceptance_criteria: ["Core loop playable", "Two biomes complete"] }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "FX-ALDER", scope_summary: "Environment FX", committed_cents: 500000, start_date: "2026-08-05", end_date: "2026-09-05" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "QA-BIRCH", scope_summary: "Compatibility QA", committed_cents: 300000, start_date: "2026-08-10", end_date: "2026-09-10" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e2_id: $.data.id }
          trigger:
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "LOC-CEDAR", scope_summary: "Localization", committed_cents: 300000, start_date: "2026-08-15", end_date: "2026-09-15" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { budget_error_id: "$.data.error_id" }
            - call: "POST /contractor-engagements/${e2_id}/cancel"
              payload: { reason: "QA moved in-house" }
              as: Developer
              as_user_id: "${studio_id}"
            - call: "POST /contractor-engagements"
              payload: { milestone_id: "${m1_id}", vendor_code: "LOC-CEDAR", scope_summary: "Localization", committed_cents: 300000, start_date: "2026-08-15", end_date: "2026-09-15" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { e3_id: $.data.id }
          assert:
            - "before the trigger: GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 800000 and available_committed_cents 0"
            - "trigger call 1 -> 422 with error_id ERR_CONTRACTOR_BUDGET_EXCEEDED"
            - "after trigger call 2: ContractorEngagement.${e2_id}.status == CANCELLED and committed_cents is still 300000 on the row"
            - "after trigger call 2: GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 500000 and available_committed_cents 300000 (exactly E2's amount returned)"
            - "trigger call 3 -> 201; ContractorEngagement.${e3_id}.status == ACTIVE and committed_cents == 300000"
            - "after trigger call 3: GET /milestones/${m1_id}/budget-summary reports committed_basis_cents 800000, available_committed_cents 0, incurred_basis_cents 0, overrun_cents 0"
            - "invariant contractor_budget_conservation: available_committed_cents == max(0, contractor_budget_cents - committed_basis_cents) at every step"
            - "GET /contractor-engagements?milestone_id=${m1_id} returns 3 rows (${e1_id} ACTIVE, ${e2_id} CANCELLED, ${e3_id} ACTIVE)"
