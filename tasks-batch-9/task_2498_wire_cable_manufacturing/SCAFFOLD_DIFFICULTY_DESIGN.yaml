              as: CertificationOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
              captures: { cert_dep_error_id: $.data.error_id }
            - call: "POST /listing-certifications/${cert_id}/reinstate"
              payload: {}
              as: CertificationOfficer
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
