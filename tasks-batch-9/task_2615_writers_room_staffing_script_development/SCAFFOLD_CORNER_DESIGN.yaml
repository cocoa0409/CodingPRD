# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2615 - Writers Room Staffing & Script Development
#
# Breadth probe over §1.1-§1.7. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by §1.8 carry an
# `excluded_because:` stub instead of a test_recipe.
#
# Reusable fixture calls are declared once as YAML anchors (&C_*) at their first
# chronological appearance and aliased (*C_*) thereafter, so every chain below is a
# literal replay of the same canonical fixture:
#   AG  = MBA 2026 rate card (anchor &AGP)      SE = season "Nightfall S1", 8 episodes ONE_HOUR
#   SR  = Sloane Reyes, 20 credits, PRODUCER, showrunner-eligible (Season.showrunner_writer_id)
#   W1  = Wanda Cole, 3 credits, STORY_EDITOR   W2 = Bram Ochoa, 3 credits, STORY_EDITOR
#   RM  = IN_PERSON room, seat_capacity 3, 26 weeks, 2026-09-01..2027-03-01
#   S1/S2 = seats for W1/W2 at 600000/week      EP1 = episode 1, UNIT_A, production start 2026-11-02
#   A1  = TELEPLAY assignment for W1 (gross 3500000), A2 = STORY assignment for W2 (gross 1500000)
#   Logical clock stays at its 2026-08-01T00:00:00Z default unless a call moves it.

scaffold_corner_design:
  - section: entities
    instances:
      - name: guild_agreement_creation_echoes_the_whole_rate_card_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.GuildAgreement
          - endpoints.POST_/guild-agreements
          - response_envelope.success
        distinguishing_aspect: |
          The rate card is the root configuration row every later calculation reads, so the create must
          persist all 25 declared fields verbatim (including nested objects) and mint the four common
          fields, with version starting at exactly 1 and the id carrying no type prefix.
        test_recipe:
          setup:
            - "Empty database. No agreement, writer or season exists."
          setup_api_calls: []
          trigger:
            - &C_AG
              call: "POST /guild-agreements"
              payload: &AGP
                mba_year: 2026
                min_weekly_cents_by_level: { STAFF_WRITER: 450000, STORY_EDITOR: 600000, EXEC_STORY_EDITOR: 700000, CO_PRODUCER: 850000, PRODUCER: 1000000 }
                script_fee_cents_by_length: { HALF_HOUR: 2500000, ONE_HOUR: 5000000 }
                type_share_pct_by_assignment_type: { STORY: 0.30, TELEPLAY: 0.70, STORY_AND_TELEPLAY: 1.00, REWRITE: 0.35, PRODUCTION_POLISH: 0.175 }
                guarantee_offset_pct_by_level: { STAFF_WRITER: 0.0, STORY_EDITOR: 0.5, EXEC_STORY_EDITOR: 0.5, CO_PRODUCER: 1.0, PRODUCER: 1.0 }
                level_credit_thresholds: { STORY_EDITOR: 2, EXEC_STORY_EDITOR: 4, CO_PRODUCER: 7, PRODUCER: 12 }
                diversity_subsidy_pct: 0.5
                diversity_subsidy_cap_weekly_cents: 250000
                mini_room_floor_multiplier: 1.2
                short_commitment_weeks_threshold: 20
                short_commitment_uplift_pct: 0.1
                facility_fee_tiers: { TIER_1: 200000, TIER_2: 350000, TIER_3: 500000 }
                facility_tier_subtotal_bounds: { TIER_1_MAX: 1500000, TIER_2_MAX: 3000000 }
                format_surcharge_pct: { IN_PERSON: 1.0, REMOTE: 0.4, MINI_ROOM: 0.6 }
                max_free_revision_rounds: 2
                credit_share_threshold_pct: 33
                arbitration_concurrence_pct: 0.667
                arbitration_concurrence_band_pct: 10
                outline_lead_days: 42
                first_draft_lead_days: 28
                second_draft_lead_days: 14
                polish_lead_days: 3
                turnaround_buffer_days: 2
                clearance_item_weights: { NAME: 5, TRADEMARK: 15, DEPICTION: 25 }
                clearance_escalation_score: 30
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "GET /guild-agreements/${ag}"
              payload: {}
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns 201 with response_type == \"object\" and meta.api_request_id present"
            - "GuildAgreement.${ag}.mba_year == 2026 and version == 1"
            - "GuildAgreement.${ag}.min_weekly_cents_by_level == { STAFF_WRITER: 450000, STORY_EDITOR: 600000, EXEC_STORY_EDITOR: 700000, CO_PRODUCER: 850000, PRODUCER: 1000000 }"
            - "GuildAgreement.${ag}.script_fee_cents_by_length == { HALF_HOUR: 2500000, ONE_HOUR: 5000000 } and clearance_item_weights == { NAME: 5, TRADEMARK: 15, DEPICTION: 25 }"
            - "GuildAgreement.${ag}.id is a bare UUID with no type prefix and created_at == updated_at"
            - "Trigger call 2 returns 200 with a body whose data block is field-for-field identical to trigger call 1's data block"

      - name: writer_creation_runs_level_determination_and_zeroes_the_derived_counters
        claim_type: creation
        grounds:
          - entities.Writer
          - entities.Writer.fields.determined_level
          - entities.Writer.fields.level_determination_agreement_id
          - calculations.writer_level_determination
          - endpoints.POST_/writers
        distinguishing_aspect: |
          Writer creation is not a plain insert: it runs writer_level_determination against the supplied
          agreement, so three writers created with 20, 3 and 0 career credits must land on PRODUCER,
          STORY_EDITOR and STAFF_WRITER respectively while every derived counter starts at 0. An
          implementation that stores a client-supplied level or defers determination fails here.
        test_recipe:
          setup:
            - "Agreement AG exists with level_credit_thresholds { STORY_EDITOR: 2, EXEC_STORY_EDITOR: 4, CO_PRODUCER: 7, PRODUCER: 12 }."
          setup_api_calls:
            - *C_AG
          trigger:
            - &C_SR
              call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - &C_W1
              call: "POST /writers"
              payload: { legal_name: "Wanda Cole", guild_member_id: "GM-1001", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w1: "$.data.id" }
            - &C_W3
              call: "POST /writers"
              payload: { legal_name: "Ivy Nakamura", guild_member_id: "GM-1003", agreement_id: "${ag}" }
              as: GuildAdministrator
              captures: { w3: "$.data.id" }
          assert:
            - "Writer.${sr}.determined_level == PRODUCER (20 >= 12) and is_showrunner_eligible == true"
            - "Writer.${w1}.determined_level == STORY_EDITOR (3 >= 2 but 3 < 4)"
            - "Writer.${w3}.determined_level == STAFF_WRITER and career_episodic_credits == 0"
            - "All three writers carry level_determination_agreement_id == ${ag}"
            - "All three writers report active_seat_count == 0, on_screen_credit_count == 0, diversity_program_participant == false and version == 1"

      - name: availability_window_creation_starts_open_with_no_consuming_seat
        claim_type: creation
        grounds:
          - entities.AvailabilityWindow
          - entities.AvailabilityWindow.fields.status
          - endpoints.POST_/writers/{writer_id}/availability-windows
        distinguishing_aspect: |
          A window is declared against a writer through a nested route: writer_id comes from the path
          rather than the body, status starts OPEN and consumed_by_seat_id must be null until some seat
          acceptance consumes it.
        test_recipe:
          setup:
            - "Agreement AG and writers W1 and W2 exist."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - &C_W2
              call: "POST /writers"
              payload: { legal_name: "Bram Ochoa", guild_member_id: "GM-1002", agreement_id: "${ag}", career_episodic_credits: 3 }
              as: GuildAdministrator
              captures: { w2: "$.data.id" }
          trigger:
            - &C_AW1
              call: "POST /writers/${w1}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${w1}"
              captures: { aw1: "$.data.id" }
            - &C_AW2
              call: "POST /writers/${w2}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "NON_EXCLUSIVE" }
              as: Writer
              as_user_id: "${w2}"
              captures: { aw2: "$.data.id" }
          assert:
            - "AvailabilityWindow.${aw1}.writer_id == ${w1} (taken from the path, not the body) and status == OPEN"
            - "AvailabilityWindow.${aw1}.commitment_type == EXCLUSIVE and consumed_by_seat_id == null"
            - "AvailabilityWindow.${aw2}.writer_id == ${w2} and commitment_type == NON_EXCLUSIVE"
            - "GET /availability-windows?status=OPEN returns exactly 2 rows"

      - name: season_creation_initialises_the_fiscal_counters_and_derives_coverage_at_once
        claim_type: creation
        grounds:
          - entities.Season
          - entities.Season.fields.coverage_posture
          - entities.Season.fields.coverage_gap
          - calculations.script_coverage_index
          - endpoints.POST_/seasons
        distinguishing_aspect: |
          The create must both zero the two money counters and immediately run script_coverage_index on
          an episode-free season: with ready_script_target 1 the gap is 1, which is <= AT_RISK_MAX_GAP,
          so coverage_posture is AT_RISK and NOT the CRITICAL field default. An implementation that
          merely writes the declared defaults reports CRITICAL and fails.
        test_recipe:
          setup:
            - "Agreement AG and showrunner-eligible writer SR exist."
          setup_api_calls:
            - *C_AG
            - *C_SR
          trigger:
            - &C_SE
              call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S2", episode_order: 10, length_format: "ONE_HOUR", production_start_date: "2027-11-02T00:00:00Z", staffing_window_start: "2027-08-01T00:00:00Z", staffing_window_end: "2027-09-30T00:00:00Z", ready_script_target: 5, staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se2: "$.data.id" }
          assert:
            - "Season.${se}.staffing_commitment_weekly_cents == 0, script_fee_committed_cents == 0 and ready_script_count == 0"
            - "Season.${se}.coverage_gap == 1 and coverage_posture == AT_RISK (gap 1 <= 2), not the CRITICAL field default"
            - "Season.${se2}.coverage_gap == 5 and coverage_posture == CRITICAL (gap 5 > 2)"
            - "Season.${se}.guarantee_application_mode == FORWARD_COMMIT and Season.${se2}.guarantee_application_mode == CHRONOLOGICAL_ON_ACCEPTANCE (default applied)"
            - "Both seasons report version == 1"

      - name: room_creation_starts_open_with_every_seat_free_and_tier_one_facility_fee
        claim_type: creation
        grounds:
          - entities.WritersRoom
          - entities.WritersRoom.fields.open_seat_count
          - entities.WritersRoom.fields.facility_tier
          - calculations.room_weekly_burn
          - endpoints.POST_/seasons/{season_id}/rooms
        distinguishing_aspect: |
          room_weekly_burn runs on an EMPTY seat set at create: subtotal 0 keys TIER_1 (0 <= 1500000),
          the IN_PERSON surcharge is 200000 * 1.0 = 200000 and weekly_burn_cents is 200000 even though no
          writer is hired yet - while Season.staffing_commitment_weekly_cents stays 0, because an OPEN
          room is outside the commitment input set.
        test_recipe:
          setup:
            - "Agreement AG, writer SR and season SE exist; the season has no room yet."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
          trigger:
            - &C_RM
              call: "POST /seasons/${se}/rooms"
              payload: { name: "Main Room", format: "IN_PERSON", seat_capacity: 3, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", diversity_seats_required: 0 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm: "$.data.id" }
            - call: "GET /seasons/${se}"
              payload: {}
              as: StudioExecutive
          assert:
            - "WritersRoom.${rm}.status == OPEN, season_id == ${se} and version == 1"
            - "WritersRoom.${rm}.seat_capacity == 3, open_seat_count == 3, filled_seat_count == 0, confirmed_seat_count == 0 and confirmed_diversity_seat_count == 0"
            - "WritersRoom.${rm}.seat_subtotal_weekly_cents == 0, facility_tier == TIER_1, facility_surcharge_weekly_cents == 200000 and weekly_burn_cents == 200000"
            - "Season.${se}.staffing_commitment_weekly_cents == 0: an OPEN room is excluded from calculation season_staffing_commitment"

      - name: seat_offer_creation_computes_floor_weekly_prorated_and_guarantee_slots
        claim_type: creation
        grounds:
          - entities.RoomSeat
          - entities.RoomSeat.fields.guild_floor_weekly_cents
          - entities.RoomSeat.fields.prorated_commitment_cents
          - entities.RoomSeat.fields.guarantee_slots_remaining
          - calculations.seat_weekly_compensation
          - calculations.seat_prorated_commitment
          - endpoints.POST_/rooms/{room_id}/seats
        distinguishing_aspect: |
          One create runs two calculations and moves two counters on the parent: the STORY_EDITOR floor is
          600000 (no MINI_ROOM multiplier, 26 weeks >= the 20-week threshold so no uplift), the 181-day
          half-open interval prorates to 25 * 600000 + 6 * 85714 = 15514284, guarantee_slots_remaining
          starts at episodic_guarantee_count, and the room's open/filled counters swap - yet the room's
          burn does NOT move, because an OFFERED seat is outside the subtotal input set.
        test_recipe:
          setup:
            - "Season SE with room RM in status STAFFING (open_seat_count 3, weekly_burn_cents 200000)."
            - "Writer W1 (STORY_EDITOR) with an OPEN EXCLUSIVE window covering 2026-08-15..2027-06-01."
            - "Season.staffing_commitment_weekly_cents == 200000, because a STAFFING room is inside the commitment input set."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - &C_OPEN
              call: "POST /rooms/${rm}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv1: "$.data.version" }
          trigger:
            - &C_S1
              call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 1, diversity_program_funded: false, expected_room_version: "${rv1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s1: "$.data.id" }
          assert:
            - "RoomSeat.${s1}.status == OFFERED, room_id == ${rm}, writer_id == ${w1} and version == 1"
            - "RoomSeat.${s1}.guild_floor_weekly_cents == 600000 and weekly_compensation_cents == 600000"
            - "RoomSeat.${s1}.diversity_subsidy_weekly_cents == 0 and studio_charge_weekly_cents == 600000"
            - "RoomSeat.${s1}.prorated_commitment_cents == 15514284 (181 days = 25 full weeks + 6 days; daily rate 85714)"
            - "RoomSeat.${s1}.guarantee_slots_consumed == 0 and guarantee_slots_remaining == 1"
            - "RoomSeat.${s1}.confirmed_at == null and consumed_window_id == null"
            - "WritersRoom.${rm}.filled_seat_count == 1, open_seat_count == 2, confirmed_seat_count == 0 and version == 3"
            - "WritersRoom.${rm}.seat_subtotal_weekly_cents == 0 and weekly_burn_cents == 200000; Season.${se}.staffing_commitment_weekly_cents == 200000"
            - "AvailabilityWindow.${aw1}.status == OPEN: the window is consumed on acceptance, not on the offer"

      - name: episode_creation_starts_all_three_posture_dimensions_at_their_initial_values
        claim_type: creation
        grounds:
          - entities.Episode
          - entities.Episode.fields.script_readiness
          - entities.Episode.fields.credit_status
          - entities.Episode.fields.clearance_posture
          - endpoints.POST_/seasons/{season_id}/episodes
        distinguishing_aspect: |
          An Episode carries three independent state dimensions that must all start at their own initial
          value in the same create, with every credit and lock field empty, while the season's coverage
          index is re-run and stays unchanged (a NOT_STARTED episode is outside the ready count).
        test_recipe:
          setup:
            - "Season SE (ready_script_target 1, coverage_gap 1) with the ACTIVE room RM already staffed by W1 and W2."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - &C_ACC1
              call: "POST /room-seats/${s1}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w1}"
            - &C_GRV
              call: "GET /rooms/${rm}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rv2: "$.data.version" }
            - &C_S2
              call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w2}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "NON_EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 0, diversity_program_funded: false, expected_room_version: "${rv2}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { s2: "$.data.id" }
            - &C_ACC2
              call: "POST /room-seats/${s2}/accept"
              payload: {}
              as: Writer
              as_user_id: "${w2}"
            - &C_ACTIVATE
              call: "POST /rooms/${rm}/activate"
              payload: {}
              as: StudioExecutive
          trigger:
            - &C_EP1
              call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 1, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-02T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep1: "$.data.id", ev1: "$.data.version" }
          assert:
            - "Episode.${ep1}.script_readiness == NOT_STARTED, credit_status == PENDING and clearance_posture == PENDING"
            - "Episode.${ep1}.approved_teleplay_assignment_id == null, determined_credit_string == null and locked_at == null"
            - "Episode.${ep1}.provisional_credit_shares == {} and final_credit_shares == {}"
            - "Episode.${ep1}.season_id == ${se}, episode_number == 1, shoot_days == 8 and version == 1"
            - "Season.${se}.ready_script_count == 0, coverage_gap == 1 and coverage_posture == AT_RISK - unchanged, since a NOT_STARTED episode is excluded from the ready count"

      - name: assignment_creation_synthesizes_only_the_teleplay_milestone_chain
        claim_type: creation
        grounds:
          - entities.ScriptAssignment
          - entities.Milestone.fields.milestone_type
          - entities.Milestone.fields.sequence_index
          - calculations.script_fee_derivation
          - calculations.milestone_schedule_derivation
          - endpoints.POST_/episodes/{episode_id}/script-assignments
        distinguishing_aspect: |
          The milestone chain is type-specific, not fixed: a TELEPLAY yields exactly three milestones
          (OUTLINE, FIRST_DRAFT, SECOND_DRAFT) while all FOUR due-date fields - including
          polish_due_date, for which no milestone exists - are still populated on the assignment. A STORY
          created on the same episode yields exactly one OUTLINE milestone. An implementation that always
          synthesizes four rows, or that omits polish_due_date, fails.
        test_recipe:
          setup:
            - "Episode EP1 (ONE_HOUR, production start 2026-11-02) with no assignment; W1 and W2 hold CONFIRMED seats in the ACTIVE room RM."
            - "Agreement lead days: outline 42, first draft 28, second draft 14, polish 3."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
          trigger:
            - &C_A1
              call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w1}", assignment_type: "TELEPLAY", expected_episode_version: "${ev1}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a1: "$.data.id" }
            - &C_MLIST
              call: "GET /milestones?assignment_id=${a1}"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id" }
            - &C_GEP
              call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
              captures: { ev2: "$.data.version" }
            - &C_A2
              call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "STORY", expected_episode_version: "${ev2}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a2: "$.data.id" }
          assert:
            - "ScriptAssignment.${a1}.status == DRAFTING, room_seat_id == ${s1}, revision_round == 0 and late_milestone_count == 0"
            - "ScriptAssignment.${a1}.gross_fee_cents == 3500000 (5000000 * 0.70) and payable_fee_cents == 1750000 with guarantee_slot_applied == true"
            - "ScriptAssignment.${a1}.outline_due_date == 2026-09-21T23:59:59.999Z, first_draft_due_date == 2026-10-05T23:59:59.999Z, second_draft_due_date == 2026-10-19T23:59:59.999Z and polish_due_date == 2026-10-30T23:59:59.999Z"
            - "GET /milestones?assignment_id=${a1} returns exactly 3 rows with milestone_type OUTLINE, FIRST_DRAFT, SECOND_DRAFT and sequence_index 1, 2, 3 - no PRODUCTION_POLISH row exists"
            - "Milestone.${m1}.due_date == 2026-09-21T23:59:59.999Z, Milestone.${m2}.due_date == 2026-10-05T23:59:59.999Z, Milestone.${m3}.due_date == 2026-10-19T23:59:59.999Z, all in status PENDING with days_late == 0"
            - "ScriptAssignment.${a2}.gross_fee_cents == 1500000 (5000000 * 0.30) and payable_fee_cents == 1500000 with guarantee_slot_applied == false (seat ${s2} has episodic_guarantee_count 0)"
            - "GET /milestones?assignment_id=${a2} returns exactly 1 row of milestone_type OUTLINE with sequence_index 1 and due_date 2026-09-21T23:59:59.999Z"
            - "Episode.${ep1}.script_readiness == IN_PROGRESS and Season.${se}.script_fee_committed_cents == 3250000"

      - name: clearance_review_creation_starts_pending_and_resets_the_episode_posture
        claim_type: creation
        grounds:
          - entities.ClearanceReview
          - entities.ClearanceReview.fields.posture
          - endpoints.POST_/script-assignments/{assignment_id}/clearance-reviews
        distinguishing_aspect: |
          A review opens against a specific delivered draft milestone of the SAME assignment, starts with
          zero items and risk_score 0 in posture PENDING, and pushes that PENDING posture onto the
          episode - so an episode that was about to be locked is gated again by the mere existence of an
          empty review.
        test_recipe:
          setup:
