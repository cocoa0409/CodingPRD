  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: meeting_point_windows_are_half_open_with_an_end_side_buffer_and_an_aggregate_group_ceiling
        grounds:
          - calculations.meeting_point_occupancy
          - validations[39].ERR_MEETING_POINT_CONGESTED
          - entities.MeetingPoint.fields.max_concurrent_groups
          - entities.MeetingPoint.fields.slot_buffer_minutes
          - entities.ExcursionDeparture.fields.dispatch_dwell_minutes
          - endpoints[POST /shore-excursions/departures]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN windows [meeting - 15, meeting + dwell + slot_buffer) on the
          MeetingPoint resource, with the buffer padding only the END. Two effects are pinned at once —
          a third overlapping group breaches the aggregate ceiling of 2 even though no pair of windows is
          identical, and a candidate whose window starts exactly where an existing window ends is admitted
          because the endpoint is exclusive.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port whose meeting point Pier Apron A has max_concurrent_groups 2 and slot_buffer_minutes 10."
            - "One APPROVED operator owns one PUBLISHED PREMIUM excursion of duration_minutes 300."
            - "Port call V2609 is OPEN_FOR_SALE with arrival 2026-09-15T08:00:00Z and all_aboard 16:30Z."
            - "Departure E1 meets 09:00Z with dwell 20, so it occupies [08:45Z, 09:30Z)."
            - "Departure E2 meets 09:10Z with dwell 20, so it occupies [08:55Z, 09:40Z) and the peak concurrent group count is already 2."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/ports/${port_id}/meeting-points"
              payload: { name: "Pier Apron A", zone: "PIER_APRON", max_concurrent_groups: 2, slot_buffer_minutes: 10 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { mp_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Maya Reef Excursions", contact_email: "ops@maya.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "SUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "APPROVE" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/excursions"
              payload: { port_id: "${port_id}", operator_id: "${op_id}", title: "Reef Snorkel", duration_minutes: 300, min_age: 18, mobility_level: "LEVEL_2", languages: ["EN", "ES"], base_price_cents: 12000, price_tier: "PREMIUM", is_line_operated: false }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { exc_id: $.data.id }
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "PUBLISH" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/port-calls"
              payload: { port_id: "${port_id}", voyage_code: "V2609", ship_code: "MS-AURORA", arrival_utc: "2026-09-15T08:00:00Z", all_aboard_utc: "2026-09-15T16:30:00Z", departure_utc: "2026-09-15T17:00:00Z" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { pc_id: $.data.id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/transitions"
              payload: { action: "OPEN_SALES" }
              as: PortAgent
              as_user_id: "u_agent_1"
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:00:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { dep_e1_id: $.data.id }
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:10:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { dep_e2_id: $.data.id }
          trigger:
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:20:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { err_id: $.data.error_id }
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:55:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { dep_e5_id: $.data.id }
          assert:
            - "the 09:20Z candidate returns 409 with data.error_id == ERR_MEETING_POINT_CONGESTED"
            - "the 09:20Z candidate creates no ExcursionDeparture row"
            - "the 09:55Z candidate returns 201 because its window [09:40Z, 10:25Z) only touches E2's window end at 09:40Z"
            - "ExcursionDeparture.${dep_e5_id}.status == SELLING"
            - "ExcursionDeparture.${dep_e5_id}.meeting_time_utc == 2026-09-15T09:55:00Z"
            - "ExcursionDeparture.${dep_e1_id}.status == SELLING"
            - "ExcursionDeparture.${dep_e2_id}.status == SELLING"
            - "GET /shore-excursions/departures?meeting_point_id=${mp_id} returns total_count 3"

      - name: tender_wave_windows_are_closed_intervals_so_a_shared_endpoint_collides
        grounds:
          - validations[38].ERR_TENDER_WAVE_OVERLAP
          - entities.TenderWave.fields.window_start_utc
          - entities.TenderWave.fields.window_end_utc
          - entities.TenderWave.fields.priority_class
          - endpoints[POST /shore-excursions/port-calls/{portCallId}/tender-waves]
        distinguishing_aspect: |
          Interval semantics: CLOSED windows [window_start_utc, window_end_utc] on the TenderWave resource,
          the exact opposite convention from the half-open MeetingPoint windows, and with a single-occupancy
          rule instead of an aggregate ceiling. A candidate starting at 08:50Z collides with a wave ending at
          08:50Z, while a candidate starting one minute later at 08:51Z is admitted.
        test_recipe:
          setup:
            - "Nassau is a TENDER port; port call V2609 is PLANNED with arrival 2026-09-15T08:00:00Z and all_aboard 16:30Z."
            - "Tender wave 1 is EXCURSION_PRIORITY with the closed window [08:30Z, 08:50Z] and guest_capacity 100."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "NASS", name: "Nassau", country_code: "BS", docking_mode: "TENDER", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/port-calls"
              payload: { port_id: "${port_id}", voyage_code: "V2609", ship_code: "MS-AURORA", arrival_utc: "2026-09-15T08:00:00Z", all_aboard_utc: "2026-09-15T16:30:00Z", departure_utc: "2026-09-15T17:00:00Z" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { pc_id: $.data.id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/tender-waves"
              payload: { wave_index: 1, window_start_utc: "2026-09-15T08:30:00Z", window_end_utc: "2026-09-15T08:50:00Z", guest_capacity: 100, priority_class: "EXCURSION_PRIORITY" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { wave1_id: $.data.id }
          trigger:
            - call: "POST /shore-excursions/port-calls/${pc_id}/tender-waves"
              payload: { wave_index: 2, window_start_utc: "2026-09-15T08:50:00Z", window_end_utc: "2026-09-15T09:10:00Z", guest_capacity: 100, priority_class: "GENERAL" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { err_id: $.data.error_id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/tender-waves"
              payload: { wave_index: 2, window_start_utc: "2026-09-15T08:51:00Z", window_end_utc: "2026-09-15T09:10:00Z", guest_capacity: 100, priority_class: "GENERAL" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { wave2_id: $.data.id }
          assert:
            - "the 08:50Z-starting candidate returns 409 with data.error_id == ERR_TENDER_WAVE_OVERLAP"
            - "the 08:50Z-starting candidate creates no TenderWave row"
            - "the 08:51Z-starting candidate returns 201"
            - "TenderWave.${wave2_id}.wave_index == 2"
