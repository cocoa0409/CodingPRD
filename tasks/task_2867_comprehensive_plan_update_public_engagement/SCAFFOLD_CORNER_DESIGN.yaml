              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "read 1 (no scenario, two elements approved): compliance_posture == \"CAPACITY_HOLD\" (adopted_scenario_id is null), state_review_status == \"NOT_SUBMITTED\", required_elements_complete_count == 2, missing_element_types as a set == {HOUSING, TRANSPORTATION, INFRASTRUCTURE}, open_consistency_link_count == 0, housing_shortfall_total == 0, equity_share_pct == 0.0, land_capacity_units == 0, projected_demand_units == 0, capacity_gap_units == 0 and monitoring_on_track_count == 0 - zeros, never nulls"
            - "read 1 returns HTTP 200 for the CommissionClerk: the summary is readable by all five roles and read 2 and read 3 use two other roles to prove it"
            - "the TREND scenario reports land_capacity_units == 11700, projected_demand_units == 6183 and capacity_gap_units == 0"
            - "read 2 (scenario adopted, allocations loaded, two readings taken): land_capacity_units == 11700, projected_demand_units == 6183, capacity_gap_units == 0 - the summary echoes the ADOPTED scenario, not the sum of all scenarios"
            - "read 2: housing_shortfall_total == 2300, the sum of the four per-tier shortfalls (490 + 660 + 660 + 490) produced by the waterfall over the 11700 pool"
            - "read 2: compliance_posture is still \"CAPACITY_HOLD\" because housing_shortfall_total > 0, even though a scenario is now adopted"
            - "read 2: monitoring_on_track_count == 1 - the INCREASE action read 140 against a target of 120 so on_track is true, while the DECREASE action read 18 against a target of 12 so on_track is false; both rows report reading_count == 1"
            - "read 3 (one OPEN link added): compliance_posture == \"CONSISTENCY_HOLD\" and open_consistency_link_count == 1, even though the shortfall (2300) and the equity share (0.0) would each also justify a hold - the first matching rule wins"
            - "read 3 is otherwise identical to read 2: the link changed no counter except open_consistency_link_count"
            - "the GET on the plan itself reports the same compliance_posture, open_consistency_link_count, housing_shortfall_total, equity_share_pct, required_elements_complete_count and monitoring_on_track_count values as read 3 - the summary is a projection of the stored plan, not an independent recomputation that could drift"
            - "no compliance-summary call changes the plan's version"

      - name: consistency_link_is_a_cross_reference_endpoint
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_planning_consistency_links
          - endpoints.GET_planning_consistency_links
          - entities.ConsistencyLink
        distinguishing_aspect: |
          POST /planning/consistency-links is the only endpoint whose body carries two foreign keys
          to the SAME entity type, and neither of them is a path parameter. That makes it the only
          place where "which id was wrong" can be confused: a bad source and a bad target must both
          produce ERR_ELEMENT_NOT_FOUND, and a link created in one direction must NOT be visible
          when the list is filtered by the opposite role. This instance therefore pins the
          association semantics rather than the graph rules: the row records source, target and
          dependency_type, starts OPEN, is counted on the SOURCE element's plan, and is retrievable
          under both filters with the roles reversed. It also pins that the link is created against
          DRAFT elements - the endpoint never requires either element to be reviewed - which is what
          makes the consistency network declarable before drafting finishes.
        test_recipe:
          setup:
            - "One plan with three DRAFT elements."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Mobility Element", draft_body: "Network plan.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { src: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { tgt: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Open space standards.", policy_count: 3 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { other: $.data.id }
          trigger:
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "00000000-0000-4000-8000-00000000dead", target_element_id: "${tgt}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_src: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${src}", target_element_id: "00000000-0000-4000-8000-00000000beef", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_tgt: $.data.error_id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${src}", target_element_id: "${tgt}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk: $.data.id, lk_st: $.data.status, lk_src: $.data.source_element_id, lk_tgt: $.data.target_element_id }
            - call: "GET /planning/consistency-links/${lk}"
              as: CommissionClerk
              as_user_id: "clerk-1"
            - call: "GET /planning/consistency-links?source_element_id=${src}&status=OPEN"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/consistency-links?target_element_id=${src}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/consistency-links?dependency_type=LEVEL_OF_SERVICE"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/consistency-links?source_element_id=${other}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "an unknown source_element_id returns HTTP 404 with error_id == \"ERR_ELEMENT_NOT_FOUND\""
            - "an unknown target_element_id returns HTTP 404 with the SAME error_id - both body foreign keys resolve against the same entity and neither is reported as a generic invalid-request"
            - "the valid link is created with HTTP 201, status == \"OPEN\", source_element_id == the mobility element, target_element_id == the land use element, dependency_type == \"LEVEL_OF_SERVICE\", reconciled_by_user_id == null, reconciliation_note == null and staled_by_amendment_id == null"
            - "GET by id returns the identical row for a CommissionClerk - reads are open to all five roles while the create is PlanningStaff-only"
            - "the list filtered by source_element_id == mobility and status == OPEN returns total_count == 1"
            - "the list filtered by target_element_id == mobility returns total_count == 0 - the association is directed, so the same element does not answer to both filters"
            - "the list filtered by dependency_type == LEVEL_OF_SERVICE returns total_count == 1; filtering by source_element_id == the parks element returns total_count == 0"
            - "the plan reports open_consistency_link_count == 1, so the counter follows the SOURCE element's plan"
            - "both elements remain in status \"DRAFT\": creating a link requires no review state at all, and the source element's consistency_status is unchanged by the create"

      - name: logical_clock_action_endpoint_is_shared_by_every_role
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_clock_set_current_utc
          - rbac.shared_operations
        distinguishing_aspect: |
          POST /_clock/set_current_utc is the one endpoint outside the /planning prefix, the one
          endpoint with no entity behind it, and the only endpoint whose roles list is all five
          roles for a WRITE. Everything time-gated in this scaffold - hearing open, environmental
          certify, activity complete - depends on it, so its own contract has to be pinned
          separately: the startup value is exactly 2026-08-01T00:00:00Z before anybody calls it,
          the response echoes the new instant with three fractional digits, and the instant it sets
          is immediately visible to a DIFFERENT role's time-gated call. This instance also pins the
          part a test that only ever moves the clock forward would miss: the endpoint sets an
          absolute instant rather than advancing an offset, so setting it twice to the same value is
          a no-op and moving it BACKWARDS is accepted and re-closes a gate that was previously open
          (the activity that could be completed at 2026-09-01 is refused with ERR_ACTIVITY_NOT_ENDED
          once the clock is set back to 2026-08-10).
        test_recipe:
          setup:
            - "One plan, one venue and one WORKSHOP activity running 2026-08-20T18:00:00Z to 2026-08-20T20:00:00Z with a single participation record, so its completion is purely clock-gated."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Center", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ven: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "WORKSHOP", title: "Eastside workshop", start_at: "2026-08-20T18:00:00Z", end_at: "2026-08-20T20:00:00Z", venue_id: "${ven}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "resident-1", demographic_group: "LOW_INCOME", census_tract: "06001402100" }
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /planning/engagement-activities/${act}/complete"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { c1: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { c2: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CommissionClerk
              as_user_id: "clerk-1"
              captures: { c3: $.data.current_utc }
            - call: "POST /planning/engagement-activities/${act}/complete"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_back: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T20:00:00Z" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { c4: $.data.current_utc }
            - call: "POST /planning/engagement-activities/${act}/complete"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { done_st: $.data.status, done_eq: $.data.equity_share_pct }
            - call: "GET /planning/engagement-activities/${act}"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "before any clock call the completion is refused with HTTP 409 error_id == \"ERR_ACTIVITY_NOT_ENDED\": the startup clock is exactly 2026-08-01T00:00:00Z, which is before the activity's end_at"
            - "the StateReviewer's clock call returns HTTP 200 with current_utc == \"2026-09-01T09:30:00.000Z\" - a role with almost no write authority anywhere else may still set the clock"
            - "the EnvironmentalConsultant's identical call returns the same current_utc: setting an absolute instant twice is a no-op, not an advance"
            - "the CommissionClerk may move the clock BACKWARDS to \"2026-08-10T00:00:00.000Z\" and the response echoes that value"
            - "with the clock back at 2026-08-10 the completion is refused again with error_id == \"ERR_ACTIVITY_NOT_ENDED\" - the gate is re-closed, proving the guard reads the current clock on every call rather than a flag set once"
            - "setting the clock to exactly the activity's end_at (\"2026-08-20T20:00:00.000Z\") makes the completion succeed with status == \"COMPLETED\" - the guard is the inclusive clock >= end_at"
            - "the completed activity reports equity_share_pct == 100.0 (its single respondent is LOW_INCOME) and completed_at == \"2026-08-20T20:00:00.000Z\", the clock instant and not a wall-clock time"
            - "every clock response carries exactly three fractional-second digits and the trailing Z"

      - name: preferred_alternative_selection_is_conditional_on_circulation
        claim_type: conditional_action
        grounds:
          - endpoints.POST_planning_environmental_reviews_id_select_preferred_alternative
          - state_machines.PlanAlternative.EVALUATED_to_PREFERRED
          - state_machines.EnvironmentalReview.CIRCULATED_to_CERTIFIED
        distinguishing_aspect: |
          Selection is the hinge of the environmental workflow and it is fenced on both sides. It
          cannot run before circulation (the review is still DRAFT, so the public has not seen the
          alternatives), and certification cannot run before it. The result is a three-step ordering
          that an implementation can only satisfy by keeping the selection and the certification as
          separate gates: select-on-DRAFT is ERR_REVIEW_NOT_CIRCULATED, certify-before-the-window-
          closes is ERR_COMMENT_PERIOD_OPEN, certify-after-the-window-but-before-selection is
          ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED, and only the full sequence certifies. The
          selection response is also the one place in the API where the returned body is NOT the
          entity named in the path: the endpoint's declared output is the winning PlanAlternative,
          so the response id must be the alternative's id and its status must be PREFERRED, while
          the review's preferred_alternative_id has to be read back with a second call. An
          implementation that returns the EnvironmentalReview here fails on shape alone. The EIR
          comment period (45 days from a circulation at 2026-08-01T00:00:00Z ends at
          2026-09-15T00:00:00Z) is exercised at exactly its endpoint, one second early and on the
          instant, so the inclusive comparison is pinned too.
        test_recipe:
          setup:
            - "The clock starts at its default 2026-08-01T00:00:00Z; circulation therefore stamps circulated_at at that instant."
            - "One plan, one DRAFT EIR review and two evaluated alternatives whose net scores differ (so the winner is unambiguous)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev: $.data.id }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Alternative A - infill focus", traffic_vmt_index: 40, ghg_index: 40, habitat_index: 40, water_index: 40 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_a: $.data.id, a_net: $.data.net_impact_score }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Alternative B - corridor focus", traffic_vmt_index: 60, ghg_index: 60, habitat_index: 60, water_index: 60 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_b: $.data.id, b_net: $.data.net_impact_score }
          trigger:
            - call: "POST /planning/environmental-reviews/${rev}/select-preferred-alternative"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { e_draft: $.data.error_id }
            - call: "POST /planning/environmental-reviews/${rev}/circulate"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { circ_days: $.data.comment_period_days, circ_at: $.data.circulated_at, circ_end: $.data.comment_period_ends_at }
            - call: "POST /planning/environmental-reviews/${rev}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_open: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T23:59:59Z" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/environmental-reviews/${rev}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_open2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/environmental-reviews/${rev}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_nosel: $.data.error_id }
            - call: "POST /planning/environmental-reviews/${rev}/select-preferred-alternative"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { win_id: $.data.id, win_st: $.data.status, win_net: $.data.net_impact_score, win_label: $.data.label }
            - call: "GET /planning/environmental-reviews/${rev}"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
            - call: "POST /planning/environmental-reviews/${rev}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { cert_st: $.data.status, cert_at: $.data.certified_at }
            - call: "GET /planning/environmental-reviews/${rev}/plan-alternatives"
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
          assert:
            - "selection on the DRAFT review returns HTTP 409 with error_id == \"ERR_REVIEW_NOT_CIRCULATED\" and leaves both alternatives in status \"EVALUATED\""
            - "circulation stamps comment_period_days == 45 (EIR, not the 30-day ND value), circulated_at == \"2026-08-01T00:00:00.000Z\" and comment_period_ends_at == \"2026-09-15T00:00:00.000Z\""
            - "certify at the circulation instant returns HTTP 409 error_id == \"ERR_COMMENT_PERIOD_OPEN\", and certify at 2026-09-14T23:59:59Z - one second early - returns the same error"
            - "certify at exactly 2026-09-15T00:00:00Z gets past the clock gate and now returns HTTP 409 error_id == \"ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED\": the window comparison is the inclusive clock >= comment_period_ends_at, and the selection gate is a separate check reached only after it"
            - "the selection then returns HTTP 200 whose body is the winning PlanAlternative, not the review: id == Alternative A's id, label == \"Alternative A - infill focus\", status == \"PREFERRED\" and net_impact_score == 40.00 (raw 40.00, no mitigation credit below 50)"
            - "Alternative B is untouched at status \"EVALUATED\" with raw_impact_score == 60.00, mitigation_credit == 6.00 (MID tier, keyed on the raw score) and net_impact_score == 54.00 - still worse than A's 40.00, so the winner is unambiguous"
            - "the review read back reports preferred_alternative_id == Alternative A's id and status still \"CIRCULATED\" - selection does not certify"
            - "certify now succeeds with status == \"CERTIFIED\" and certified_at == \"2026-09-15T00:00:00.000Z\""
            - "the alternatives list returns total_count == 2 with exactly one row in status \"PREFERRED\""

      - name: plan_element_patch_is_the_only_update_and_it_is_partial
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_planning_plan_elements_id
          - endpoints.GET_planning_plan_elements_id
          - endpoints.GET_planning_plan_updates_id_plan_elements
        distinguishing_aspect: |
          PATCH /planning/plan-elements/{id} is the ONLY update endpoint in a 59-endpoint API - every
          other mutation is a create or a named action - and all three of its body fields are
          optional. That makes it the one place where partial-update semantics matter: a body
          carrying only policy_count must leave title and draft_body byte-identical, and a body
          carrying only title must leave policy_count intact. The absent-versus-null distinction is
          the specific failure mode: an implementation that binds the request to a full object will
          quietly null out the omitted columns, and no other test in the suite can see that. The
          instance also pins the surrounding CRUD surface: there is no DELETE for any entity, so the
          only lifecycle exit is a state transition; the element read echoes the patched values and
          an incremented version; the list under the parent plan reflects the patch immediately
          (the consistency model is immediate); and a PATCH with an empty body is still a legal
          no-op write that increments version, which distinguishes "no fields supplied" from
          "invalid request".
        test_recipe:
          setup:
            - "One plan with one DRAFT element carrying all three patchable fields set."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "HOUSING", title: "Housing Element", draft_body: "Sites inventory and constraints analysis.", policy_count: 9 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id, v0: $.data.version }
          trigger:
            - call: "GET /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { policy_count: 11 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { p1_title: $.data.title, p1_body: $.data.draft_body, p1_pc: $.data.policy_count, p1_v: $.data.version }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { title: "Housing Element - 6th Cycle" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { p2_title: $.data.title, p2_body: $.data.draft_body, p2_pc: $.data.policy_count, p2_v: $.data.version }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Sites inventory, constraints analysis and AFFH programs.", policy_count: 12 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { p3_title: $.data.title, p3_body: $.data.draft_body, p3_pc: $.data.policy_count, p3_v: $.data.version }
            - call: "PATCH /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { p4_title: $.data.title, p4_pc: $.data.policy_count, p4_v: $.data.version }
            - call: "GET /planning/plan-elements/${el}"
              as: CommissionClerk
              as_user_id: "clerk-1"
            - call: "GET /planning/plan-updates/${pu}/plan-elements?element_type=HOUSING&status=DRAFT"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "patch 1 supplies only policy_count: policy_count == 11 while title == \"Housing Element\" and draft_body == \"Sites inventory and constraints analysis.\" are unchanged - omitted fields are not nulled"
            - "patch 2 supplies only title: title == \"Housing Element - 6th Cycle\", policy_count is still 11 and draft_body is still the original text"
            - "patch 3, issued by a PlanningDirector (the endpoint is shared by both roles), sets draft_body and policy_count == 12 and leaves the patched title intact"
            - "patch 4 with an empty body is accepted (HTTP 200) and changes no field, but still increments version - it is a legal no-op write, not an ERR_INVALID_REQUEST"
            - "version increments by exactly 1 on each of the four patches, so the final version == the creation version + 4"
            - "the element never leaves status \"DRAFT\": a PATCH from DRAFT is a self-loop, and revision_round stays 0 because no review ever requested a revision"
            - "the read-back by a CommissionClerk returns the final field values, and updated_at is later than created_at while created_at is unchanged"
            - "the filtered list under the parent plan returns total_count == 1 with the patched values immediately visible in the same request cycle"
            - "no DELETE endpoint exists for PlanElement or for any other entity in the API, so the element cannot be removed - only transitioned"

  - section: errors
    instances:
      - name: not_found_sweep_across_every_addressable_entity
        claim_type: error_triggerability
        grounds:
          - errors[ERR_PLAN_UPDATE_NOT_FOUND]
          - errors[ERR_INVENTORY_NOT_FOUND]
          - errors[ERR_SCENARIO_NOT_FOUND]
          - errors[ERR_ELEMENT_NOT_FOUND]
          - errors[ERR_LINK_NOT_FOUND]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_ACTIVITY_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_HEARING_NOT_FOUND]
          - errors[ERR_AMENDMENT_NOT_FOUND]
          - errors[ERR_ACTION_NOT_FOUND]
          - validations.priority_30_path_existence
          - validations.priority_40_body_foreign_keys
        distinguishing_aspect: |
          The catalogue declares ELEVEN distinct not-found ids, one per entity, and an
          implementation that raises a single shared 404 would satisfy every per-entity test that
          only checks the status code. This sweep pins all eleven in one place, and it deliberately
          reaches each one through the cheapest route that exists for that entity: a GET by id for
          the ten entities that have one, and a body foreign key for Venue, which has no read
          endpoint at all - the only way to observe ERR_VENUE_NOT_FOUND is to book an activity at a
          venue that does not exist. Two further shapes are pinned that a flat sweep would miss.
          A bogus id in a sub-resource path (GET /planning/plan-updates/{id}/plan-elements) must
          404 with the PARENT's id, not return an empty page - returning `total_count: 0` for an
          unknown plan is the most common wrong answer. And a bogus id in an ACTION path
          (POST /planning/hearings/{id}/open) must 404 rather than 409, because path existence at
          priority 30 outranks every state check. Real rows of each type exist throughout, so no
          404 can be an artefact of an empty table.
        test_recipe:
          setup:
            - "One fully populated plan so that every table has at least one real row: a certified LAND_USE inventory, an adopted scenario, an element, a consistency link, a venue with an activity, an environmental review and an implementation action."
            - "The bogus id 00000000-0000-4000-8000-000000000404 is syntactically valid and belongs to no table."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 100, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_lu: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_lu}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu_v: $.data.version }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_lu}", expected_inventory_version: "${lu_v}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_a: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Mobility Element", draft_body: "Network plan.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_b: $.data.id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_b}", target_element_id: "${el_a}", dependency_type: "CAPACITY_ASSUMPTION" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lk: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Center", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ven: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", activity_type: "WORKSHOP", title: "Eastside workshop", start_at: "2026-08-20T18:00:00Z", end_at: "2026-08-20T20:00:00Z", venue_id: "${ven}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id }
