        distinguishing_aspect: "A CRITICAL fault on a corridor-designated DCFC_350 station drives the raw computation below the statutory floor: 240 x 0.5 = 120, minus the 60-minute corridor tightening = 60, which max() must lift back to REGULATORY_FLOOR_MINUTES 120. The deadline is 02:00Z, not the 01:00Z an unclamped chain produces, and the floor must be applied after the corridor subtraction rather than to the base."
