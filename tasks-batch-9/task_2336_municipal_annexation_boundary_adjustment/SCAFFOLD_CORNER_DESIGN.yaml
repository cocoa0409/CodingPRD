      - name: the_referendum_branch_of_ordinance_adoption_is_taken_only_for_a_listed_method
        claim_type: conditional_action
        grounds:
          - endpoints[POST /annexation-cases/{caseId}/adopt-ordinance]
          - endpoints[POST /annexation-cases/{caseId}/record-referendum]
          - endpoints[POST /annexation-cases/{caseId}/effectuate]
        distinguishing_aspect: |
          adopt-ordinance is one endpoint with two destinations chosen by configuration rather than
          by payload: when the case's method appears in referendum_required_methods the case lands
          in REFERENDUM_PENDING instead of ORDINANCE_ADOPTED, record-referendum then becomes a
          legal call and an APPROVED result opens effectuation through REFERENDUM_APPROVED. The
          contrasting branch — the identical chain landing directly in ORDINANCE_ADOPTED under an
          empty referendum_required_methods list — is asserted in the tax-roll instance, so the two
          together pin the conditional on the flag and not on the request.
        test_recipe:
          setup:
            - "A statute whose referendum_required_methods contains INVOLUNTARY_ORDINANCE, carried through the whole house chain to a closed protest period with a FAILED outcome at clock 2026-10-11T09:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], referendum_required_methods: ["INVOLUNTARY_ORDINANCE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_e5: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_e5}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
