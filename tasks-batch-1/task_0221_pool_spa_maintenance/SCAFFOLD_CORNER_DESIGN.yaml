            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "POST /invoices"
              payload: { pool_id: "${pool_id}", visit_id: "${visit_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: AccountManager
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Pool.${pool_id}.balance_due_cents == 0"

      - name: work_order_resolve_recomputes_open_count
        claim_type: cascading_side_effects
        grounds: [entities.Pool.fields.open_work_order_count, state_machines.WorkOrder.AWAITING_APPROVAL_to_RESOLVED]
        distinguishing_aspect: "Resolving the only open work order drops Pool.open_work_order_count from 1 to 0 (derived recompute)."
        test_recipe:
          setup: ["Pool with one AWAITING_APPROVAL work order (open_work_order_count==1); customer owns pool."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wc Owner", email: "wc@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /work-orders"
              payload: { pool_id: "${pool_id}", component: "CHLORINATOR", severity: "MINOR" }
              as: FieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/diagnose"
              payload: { quoted_parts_cents: 0, labor_minutes: 30 }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/submit-for-approval"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /work-orders/${wo_id}/resolve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "WorkOrder.${wo_id}.status == RESOLVED"
            - "Pool.${pool_id}.open_work_order_count == 0"

  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_balance_visible_same_response
        claim_type: immediate
        grounds: [entities.Pool.fields.balance_due_cents, state_machines.Invoice.DRAFT_to_ISSUED]
        distinguishing_aspect: "Immediately after POST /invoices/{id}/issue, a GET /pools/{id} in the next request shows the updated balance_due_cents (no lag)."
        test_recipe:
          setup: ["Pool with a DRAFT invoice of 12500 from a recovery visit completion."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cm Owner", email: "cm@x.com" }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /pools"
              payload: { customer_id: "${cust_id}", label: "Yard", water_type: "CHLORINE", volume_gallons: 20000 }
              as: AccountManager
              captures: { pool_id: $.data.id }
            - call: "POST /service-plans"
              payload: { pool_id: "${pool_id}", plan_type: "ONE_TIME", frequency: "NONE", per_visit_rate_cents: 8000 }
              as: AccountManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /routes"
              payload: { technician_id: "tech-1", service_date: "2026-06-10", window_start_minute: 480, window_end_minute: 1020, capacity_visits: 5 }
              as: RouteManager
              captures: { route_id: $.data.id }
            - call: "POST /visits"
              payload: { pool_id: "${pool_id}", plan_id: "${plan_id}", route_id: "${route_id}", slot_start_minute: 540, slot_end_minute: 600 }
              as: RouteManager
              captures: { visit_id: $.data.id }
            - call: "POST /pools/${pool_id}/seasonal-events"
              payload: { event_type: "OPEN", effective_date: "2026-06-10" }
              as: RouteManager
              captures: { se_id: $.data.id }
            - call: "POST /seasonal-events/${se_id}/apply"
              payload: {}
              as: RouteManager
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: RouteManager
            - call: "POST /visits/${visit_id}/complete"
              payload: { green_pool: true }
              as: FieldTechnician
            - call: "GET /routes/${route_id}/visits"
              payload: {}
              as: RouteManager
              captures: { recovery_visit_id: "$.data[1].id" }
            - call: "POST /visits/${recovery_visit_id}/complete"
              payload: { green_pool: false }
              as: FieldTechnician
            - call: "POST /invoices"
              payload: { pool_id: "${pool_id}", visit_id: "${recovery_visit_id}" }
              as: AccountManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: AccountManager
            - call: "GET /pools/${pool_id}"
              payload: {}
              as: AccountManager
              captures: { bal: $.data.balance_due_cents }
          assert:
            - "Invoice.${inv_id}.amount_cents == 12500"
            - "Pool.${pool_id}.balance_due_cents == 12500"
