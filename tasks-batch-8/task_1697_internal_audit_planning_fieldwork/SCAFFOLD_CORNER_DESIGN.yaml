            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2026, likelihood: 3, impact: 3, expected_auditable_entity_version: "${ent_v1}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { ra1: "$.data.id" } }
          trigger:
            - { call: "GET /audit/auditable-entities/${ent}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { ent_v2: "$.data.version" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2026, likelihood: 4, impact: 4, expected_auditable_entity_version: "${ent_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /audit/risk-assessments/${ra1}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/risk-assessments/${ra1}/finalize", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { e2: "$.data.error_id" } }
            - { call: "GET /audit/auditable-entities/${ent}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { ent_v3: "$.data.version" } }
            - { call: "POST /audit/risk-assessments", payload: { auditable_entity_id: "${ent}", fiscal_year: 2026, likelihood: 5, impact: 5, expected_auditable_entity_version: "${ent_v3}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { e3: "$.data.error_id" } }
          assert:
            - "Duplicate DRAFT (same year): error == ERR_RISK_ASSESSMENT_DRAFT_EXISTS"
            - "Re-finalize: error == ERR_RISK_ASSESSMENT_INVALID_STATE"
            - "Create after finalize (same year): error == ERR_RISK_ASSESSMENT_ALREADY_FINALIZED"
            - "AuditableEntity.${ent}.current_inherent_risk_score == 60 (8*3+12*3) and current_risk_tier == MODERATE"

