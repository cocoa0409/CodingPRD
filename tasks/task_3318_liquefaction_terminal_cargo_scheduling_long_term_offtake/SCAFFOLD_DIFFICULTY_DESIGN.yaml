            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T00:00:01Z" }, as: TerminalOperator }
            - { call: "POST /api/cargo-slots/${slot2}/cancellations", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "first cancel succeeds: CargoCancellation.${cx1}.notice_days_provided == 30"
            - "second cancel fails: error_id == ERR_INSUFFICIENT_NOTICE (29.99999 days < 30)"
