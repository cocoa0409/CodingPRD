              captures: { rndC: $.data.id, rnC: $.data.round_number, reqC: $.data.required_vote_count }
            - call: "GET /design-packages/${pkg2}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pst3: $.data.status, prr3: $.data.review_round_count }
          assert:
            - "${g1} == ERR_ROUND_ALREADY_OPEN with HTTP 409 - one OPEN round per package, and a different panel composition does not make it a different request"
            - "${s1} == OPEN with ${c1} == 1, then ${s2} == APPROVED with ${c2} == 2, ${a2} == 2 and ${d2} == 2026-08-01T00:00:00Z - the second vote reaches the quorum of 2 and stamps decided_at from the logical clock"
            - "${g2} == ERR_INVALID_ROUND_STATE with HTTP 409 - the third panelist's vote arrives after the round left OPEN; the quorum is 2 of 3, so a full panel is never required"
            - "${g3} == ERR_INVALID_PACKAGE_STATE with HTTP 409, NOT ERR_ROUND_ALREADY_OPEN - there is no OPEN round any more, so the objection has moved from priority 32 to priority 44"
            - "${pst1} == APPROVED with ${prr1} == 1, ${prev1} == 0 and ${pap1} == 2026-08-01T00:00:00Z"
            - "${rnB} == 1 - round_number is scoped to the package, so the DESIGN_DEV package starts its own numbering"
            - "${sB} == REVISION_REQUESTED with ${revB} == 1 and ${appB} == 1 - quorum reached with at least one REVISE and no VETO"
            - "${pst2} == REVISION_REQUESTED with ${prev2} == 1 and ${prr2} == 1"
            - "${orev} == 1 and ${post} == RESTRICTED - one revision-requested package is enough to restrict the project"
            - "the second round on ${pkg2} is created with HTTP 201 - the identical endpoint that returned ${g3} on an APPROVED package succeeds on a REVISION_REQUESTED one"
            - "${rnC} == 2 and ${reqC} == 3 - the round index continues rather than restarting, and the re-seated 4-role panel re-derives its own quorum as ceil(4 * 2 / 3)"
            - "${pst3} == IN_REVIEW with ${prr3} == 2 - REVISION_REQUESTED -> IN_REVIEW is the declared cycle back into review"

      - name: the_interactive_prototype_loop_re_enters_after_a_rejection_and_re_derives_the_tier
        claim_type: cyclic
        grounds:
          - state_machines.Interactive.status
          - calculations.interactive_durability_index
          - entities.Interactive.fields.prototype_iteration
          - validations.priority_52
          - errors.ERR_INVALID_INTERACTIVE_STATE
        distinguishing_aspect: |
          The prototype loop is the one cycle whose repetitions are counted, and the
          count must survive the loop: prototype_iteration goes 0 -> 1 -> 2 while the
          status returns to the same PROTOTYPE_SUBMITTED value. The second half of the
          claim is that durability_index_verified is written ONLY on an approving
          decision - a rejection leaves it null and leaves maintenance_tier standing
          on the specification figure - and that when it finally lands it re-derives
          the tier through a different threshold band, MEDIUM -> LOW, because the
          verified variant both uses the measured figures and adds the prototype
          credit. From SPECIFIED and from FABRICATED the loop's own triggers are
          refused, so the cycle has exactly one entry point.
