              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run_id: $.data.id }
            - call: "POST /bed-runs/${run_id}/cylinder-sets"
              payload: { purpose: "RELEASE", specimen_count: 4, cured_with_member: false }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { set_id: $.data.id }
          trigger:
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 45239, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 42726, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 40213, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 51523, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
          assert:
            - "after break 1 (3600 psi): CylinderSet.${set_id}.status == TESTING and qualified_strength_psi == null and valid_break_count == 1"
            - "after break 2 (3400 psi): CylinderSet.${set_id}.status == RELEASE_MET and raw_mean_psi == 3500.00 and qualified_strength_psi == 3500"
            - "after break 3 (3200 psi): CylinderSet.${set_id}.status == RELEASE_NOT_MET and raw_mean_psi == 3400.00 and qualified_strength_psi == 3400 and valid_break_count == 3"
            - "after break 4 (4100 psi): CylinderSet.${set_id}.status == RELEASE_MET and raw_mean_psi == 3575.00 and qualified_strength_psi == 3500 and valid_break_count == 2"
            - "CylinderSet.${set_id}.strength_variant == TRIMMED_AVERAGE"
            - "the 3200 psi break and the 4100 psi break both end with inclusion_status == DISCARDED_OUTLIER while the 3600 and 3400 psi breaks end VALID"
            - "BedRun.${run_id}.status == SCHEDULED (no cascade fired because the run was never cast)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: release_strength_cascade_set_to_run_to_piece_to_project
        grounds:
          - state_machines.CylinderSet.TESTING_to_RELEASE_MET
          - state_machines.BedRun.CURING_to_RELEASE_READY
          - state_machines.Piece.qc_status.HOLD_to_CLEARED
          - entities.Project.fields.cleared_piece_count
          - entities.Project.fields.held_piece_count
        distinguishing_aspect: |
          A four-hop chain triggered by recording a cylinder break: the break mutates the
          CylinderSet (hop 1), the set reaching RELEASE_MET mutates the BedRun (hop 2), the run
          reaching RELEASE_READY mutates every held Piece (hop 3), and the pieces leaving HOLD
          mutate their Project's counters (hop 4). Each hop is caused by the previous hop, not by
          the original call.
        test_recipe:
          setup:
            - "Run R1 is CURING with two pieces on QC hold for AWAITING_RELEASE_STRENGTH."
            - "R1's single CuringCycle is COMPLETED."
            - "R1's RELEASE CylinderSet has specimen_count 2 and exactly one break recorded at 3500 psi, so valid_break_count is 1 and qualified_strength_psi is still null."
            - "Project counters read held_piece_count 2, cleared_piece_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
