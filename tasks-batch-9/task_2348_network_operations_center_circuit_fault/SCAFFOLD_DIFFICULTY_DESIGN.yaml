            - "ApplicationPath.${px_id}.posture == DEGRADED_NO_REDUNDANCY"
            - "Circuit.${c6_id}.spof_flag == true (the surviving leg is now the single point of failure)"
            - "Circuit.${c5_id}.spof_flag == false (a leg that is already down is not a SPOF)"
            - "Incident.${i7_id}.impact_score == 46 (tier_max 4*10 + path_count 1*2 + redundancy 4 + spof 0)"
            - "Incident.${i7_id}.severity == SEV2"
            - "Incident.${i7_id}.response_due_at == 2026-08-11T04:30:00.000Z"
            - "Incident.${i7_id}.escalation_due_at == 2026-08-11T05:00:00.000Z"

