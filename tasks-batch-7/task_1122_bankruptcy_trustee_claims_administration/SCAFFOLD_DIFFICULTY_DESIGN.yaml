            - call: "POST /trustee/claims/${cl3}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl3}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${asset_id}/mark_for_sale"
