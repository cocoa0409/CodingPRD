      - name: distributor_cannot_respond_for_other_distributor
        claim_type: rbac_deny
        grounds: [roles.Distributor, "validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Ownership is enforced by X-User-ID: distributor B cannot respond to a NEEDS_INFO request owned by distributor A."
        test_recipe:
          setup: ["distributors A and B; A's request is in NEEDS_INFO"]
          setup_api_calls:
            - call: "POST /api/distributors"
              payload: { name: "Dist A", credit_limit_cents: 1000000, contact_email: "a@x.com" }
              as: CommercialManager
              captures: { dist_a: $.data.id }
            - call: "POST /api/distributors"
              payload: { name: "Dist B", credit_limit_cents: 1000000, contact_email: "b@x.com" }
              as: CommercialManager
              captures: { dist_b: $.data.id }
            - call: "POST /api/formulation-requests"
              payload: { distributor_id: "${dist_a}", contact_name: "Ana", target_substrate: "glass", required_bond_strength_mpa: 11.0, application_notes: "optically clear" }
              as: Distributor
              as_user_id: "${dist_a}"
              captures: { req_id: $.data.id }
            - { call: "POST /api/formulation-requests/${req_id}/start-review", payload: {}, as: TechServiceEngineer }
            - { call: "POST /api/formulation-requests/${req_id}/request-info", payload: { info_request_note: "UV stability?" }, as: TechServiceEngineer }
          trigger:
            - { call: "POST /api/formulation-requests/${req_id}/respond", payload: { response_note: "intruder reply" }, as: Distributor, as_user_id: "${dist_b}", captures: { err: $.data.error_id } }
          assert:
            - "http 403; ${err} == ERR_INSUFFICIENT_PERMISSIONS (request.distributor_id ${dist_a} != X-User-ID ${dist_b})"
            - "FormulationRequest.${req_id}.status == NEEDS_INFO (unchanged)"

