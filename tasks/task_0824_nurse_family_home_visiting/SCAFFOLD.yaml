scenario: "Nurse-Family Partnership Home Visiting: enrollment (first-time mother/gestational age), nurse assignment & visit schedule (pregnancy→age 2), assessment & screening/milestone, referral & benefit linkage, visit-completion (dosage) tracking, caseload & supervision, outcome measures, MIECHV reporting"
domain_name: "nurse-family-home-visiting"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies; URLs are
  # flat collections (/clients, /enrollments, /visits) with no parent nesting.

  state_machine_shape: cyclic
  # Visit carries a reschedule loop (SCHEDULED -> RESCHEDULED -> new SCHEDULED)
  # and a completion-correction loop (COMPLETED -> SCHEDULED); Referral carries a
  # re-attempt loop (CONTACTED -> OPEN).

  relationship_patterns:
    - one_to_many
    - self_referential      # Visit.rescheduled_from_visit_id -> Visit.id
    - cross_aggregate       # Assessment references both Visit and Enrollment

  role_model: peer_roles
  # IntakeCoordinator owns Client/Enrollment; HomeVisitNurse owns Visit/Assessment/
  # Referral (only for own nurse_id); Supervisor owns Assignment/SupervisionSession;
  # ProgramAdmin owns Nurse/Supervisor/OutcomeMeasure/MiechvReport/clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: nurse legal name
      - name: credential_type
        type: enum
        source: input
        description: nursing credential
        constraints: "one of {RN, BSN, APRN}"
      - name: status
        type: enum
        source: input
        description: employment status governing whether new assignments may target this nurse
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_LEAVE, INACTIVE}"
      - name: max_caseload_weight
        type: number
        source: input
        description: per-nurse cap on total active weighted caseload
        default: 25.0
        constraints: ">= 0; if omitted defaults to CASELOAD_MAX_WEIGHT"
      - name: current_caseload_weight
        type: number
        source: computed
        description: sum of caseload_weight over this nurse's ACTIVE Assignments; see calculations.nurse_caseload_weight
        default: 0.0
      - name: pending_supervision_count
        type: integer
        source: system
        description: number of open dosage-alert reviews awaiting a SupervisionSession; incremented by the dosage cascade, cleared when a SupervisionSession covering the nurse is SIGNED
        default: 0

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: supervisor legal name
      - name: status
        type: enum
        source: input
        description: employment status
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: mother legal name
      - name: mother_dob
        type: string
        source: input
        description: mother date of birth (ISO date)
      - name: first_time_mother
        type: boolean
        source: input
        description: NFP eligibility gate; must be true to enroll
      - name: gestational_age_weeks
        type: integer
        source: input
        description: gestational age in completed weeks at intake; drives enrollment eligibility
        constraints: ">= 0"
      - name: consent_signed
        type: boolean
        source: system
        description: whether informed consent has been recorded; set true only by POST /clients/{id}/consent
        default: false
      - name: child_dob
        type: string
        source: system
        description: infant date of birth (ISO date); null until birth recorded via POST /enrollments/{id}/record-birth
        default: null
      - name: risk_tier
        type: enum
        source: computed
        description: comprehensive risk classification; see calculations.client_risk_tier (comprehensive variant)
        default: LOW
        constraints: "one of {LOW, MODERATE, HIGH}"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the enrolled mother (one active Enrollment per Client)"
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle state; see state_machines.Enrollment
        default: PROSPECT
        constraints: "one of {PROSPECT, ENROLLED, ACTIVE, GRADUATED, EXITED}"
      - name: program_phase
        type: enum
        source: system
        description: current program phase; PREGNANCY until birth recorded, then INFANCY, then TODDLERHOOD at 12 months
        default: PREGNANCY
        constraints: "one of {PREGNANCY, INFANCY, TODDLERHOOD}"
      - name: gestational_age_at_enrollment
        type: integer
        source: system
        description: snapshot of Client.gestational_age_weeks at the moment of enrollment
      - name: completed_visit_count
        type: integer
        source: system
        description: count of this enrollment's Visits currently in COMPLETED state; kept in lockstep by visit completion/correction (see calculations.visit_dosage invariant)
        default: 0
      - name: dosage_alert
        type: boolean
        source: computed
        description: true when the to-date dosage percentage has fallen below DOSAGE_FLOOR_PCT; see calculations.visit_dosage
        default: false
      - name: risk_tier_at_enrollment
        type: enum
        source: computed
        description: snapshot mirror of Client.risk_tier as of the latest assessment; informational only
        default: LOW
        constraints: "one of {LOW, MODERATE, HIGH}"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being serviced"
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the home-visiting nurse"
      - name: phase_at_assignment
        type: enum
        source: system
        description: Enrollment.program_phase snapshot when the assignment was created; fixes the caseload weight tier
        constraints: "one of {PREGNANCY, INFANCY, TODDLERHOOD}"
      - name: high_needs
        type: boolean
        source: input
        description: operator marks a high-needs (intensive) caseload slot; applies HIGH_RISK_MULTIPLIER to the weight
        default: false
      - name: caseload_weight
        type: number
        source: computed
        description: weighted load this assignment contributes to the nurse; see calculations.nurse_caseload_weight
      - name: status
        type: enum
        source: system
        description: assignment lifecycle state; see state_machines.Assignment
        default: ACTIVE
        constraints: "one of {ACTIVE, ENDED}"
      - name: review_required
        type: boolean
        source: system
        description: set true by the dosage cascade when the serviced enrollment breaches the dosage floor
        default: false

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this visit serves"
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the nurse who will conduct the visit"
      - name: phase
        type: enum
        source: input
        description: program phase this visit belongs to
        constraints: "one of {PREGNANCY, INFANCY, TODDLERHOOD}"
      - name: target_date
        type: string
        source: input
        description: planned calendar date (ISO date) the visit is due; used by dosage to-date gating
      - name: scheduled_start
        type: string
        source: input
        description: planned start datetime (ISO 8601 UTC) used for nurse double-booking detection
      - name: scheduled_end
        type: string
        source: input
        description: planned end datetime (ISO 8601 UTC); must be strictly after scheduled_start
      - name: status
        type: enum
        source: system
        description: visit lifecycle state; see state_machines.Visit
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, MISSED, CANCELED, RESCHEDULED}"
      - name: completed_date
        type: string
        source: system
        description: calendar date (ISO date) the visit was completed; null unless status COMPLETED
        default: null
      - name: on_time
        type: boolean
        source: computed
        description: whether completed within ON_TIME_TOLERANCE_DAYS of target_date; see calculations.visit_on_time
        default: false
      - name: rescheduled_from_visit_id
        type: string
        source: system
        description: "FK -> Visit.id; set on the replacement visit created by a reschedule, pointing at the superseded visit; null for original visits"
        default: null

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the completed visit at which the screening was administered"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; denormalized owning enrollment (must equal Visit.enrollment_id)"
      - name: instrument_type
        type: enum
        source: input
        description: screening / milestone instrument administered
        constraints: "one of {INTAKE, ASQ, EDINBURGH, ASQ_SE}"
      - name: raw_scores
        type: object
        source: input
        description: map of domain name -> integer subscore
      - name: result_band
        type: enum
        source: computed
        description: overall banding of the assessment; see calculations.assessment_result_band
        constraints: "one of {ON_TRACK, MONITOR, REFER}"
      - name: domain_flags
        type: array
        source: computed
        description: list of domain names whose subscore fell below DOMAIN_FLAG_THRESHOLD

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being linked to a benefit"
      - name: benefit_type
        type: enum
        source: input
        description: benefit / service being linked
        constraints: "one of {WIC, MEDICAID, HOUSING, CHILDCARE, MENTAL_HEALTH}"
      - name: status
        type: enum
        source: system
        description: referral lifecycle state; see state_machines.Referral
        default: OPEN
        constraints: "one of {OPEN, CONTACTED, CONNECTED, DECLINED, CLOSED}"
      - name: attempts
        type: integer
        source: system
        description: number of contact attempts; incremented each time the referral loops CONTACTED -> OPEN
        default: 0
      - name: connected_at
        type: string
        source: system
        description: datetime linkage was confirmed (ISO 8601 UTC); null unless status CONNECTED
        default: null

  - name: SupervisionSession
    parent: null
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; nurse whose caseload is being reviewed"
      - name: supervisor_id
        type: string
        source: input
        description: "FK -> Supervisor.id; supervisor conducting the review"
      - name: period_start
        type: string
        source: input
        description: review window start (ISO date, inclusive)
      - name: period_end
        type: string
        source: input
        description: review window end (ISO date, inclusive)
      - name: reviewed_enrollment_ids
        type: array
        source: input
        description: enrollment ids whose dosage alerts this session dispositions
      - name: status
        type: enum
        source: system
        description: session lifecycle state; see state_machines.SupervisionSession
        default: DRAFT
        constraints: "one of {DRAFT, SIGNED}"

  - name: OutcomeMeasure
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; enrollment the measure summarizes"
      - name: measure_type
        type: enum
        source: input
        description: outcome measure being snapshotted
        constraints: "one of {ON_TIME_VISIT_RATE, DOSAGE_TO_DATE, BREASTFEEDING_INITIATED}"
      - name: period_start
        type: string
        source: input
        description: measurement window start (ISO date, inclusive)
      - name: period_end
        type: string
        source: input
        description: measurement window end (ISO date, inclusive)
      - name: numerator
        type: integer
        source: computed
        description: measure numerator captured at snapshot time
      - name: denominator
        type: integer
        source: computed
        description: measure denominator captured at snapshot time
      - name: rate_pct
        type: number
        source: computed
        description: round(100 * numerator / denominator, 2); null when denominator == 0

  - name: MiechvReport
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: string
        source: input
        description: reporting period start (ISO date, inclusive)
      - name: period_end
        type: string
        source: input
        description: reporting period end (ISO date, inclusive)
      - name: status
        type: enum
        source: system
        description: report lifecycle state; see state_machines.MiechvReport
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"
      - name: program_on_time_rate_pct
        type: number
        source: computed
        description: pooled program-wide on-time visit rate; see calculations.program_on_time_rate; null until FINALIZED
        default: null
      - name: enrolled_count
        type: integer
        source: computed
        description: number of enrollments that were ACTIVE or GRADUATED at any point in the period; frozen at FINALIZED
        default: 0
      - name: dosage_alert_count
        type: integer
        source: computed
        description: number of enrollments with dosage_alert true at FINALIZED time; frozen at FINALIZED
        default: 0

state_machines:
  - entity: Enrollment
    initial_state: PROSPECT
    terminal_states: [GRADUATED, EXITED]
    transitions:
      - from: PROSPECT
        to: ENROLLED
        trigger: "POST /enrollments/{id}/activate-enrollment"
        actor: IntakeCoordinator
        preconditions:
          - "Client.consent_signed == true (else ERR_CONSENT_REQUIRED)"
          - "Client.first_time_mother == true (else ERR_NOT_FIRST_TIME_MOTHER)"
          - "gestational_age_at_enrollment <= GESTATIONAL_AGE_MAX_WEEKS (else ERR_GESTATIONAL_AGE_INELIGIBLE)"
        side_effects:
          - "no counter changes; Enrollment.status becomes ENROLLED"
        note: "eligibility is re-checked here against the snapshot taken at create"
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /assignments (first ACTIVE assignment for this enrollment)"
        actor: Supervisor
        preconditions:
          - "an ACTIVE Assignment now exists for this enrollment"
        side_effects:
          - "Enrollment.status becomes ACTIVE"
        note: "cross-entity: driven by Assignment creation"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /enrollments/{id}/graduate"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment.program_phase == TODDLERHOOD (else ERR_GRADUATION_TOO_EARLY)"
        side_effects:
          - "all ACTIVE Assignments for this enrollment transition to ENDED (each releases its caseload_weight from its Nurse.current_caseload_weight)"
          - "all non-terminal Visits (SCHEDULED) for this enrollment transition to CANCELED"
      - from: PROSPECT
        to: EXITED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "Enrollment.status becomes EXITED"
      - from: ENROLLED
        to: EXITED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "Enrollment.status becomes EXITED"
      - from: ACTIVE
        to: EXITED
        trigger: "POST /enrollments/{id}/disenroll"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "CASCADE (depth 1): all ACTIVE Assignments -> ENDED"
          - "CASCADE (depth 2): each ended Assignment subtracts its caseload_weight from Nurse.current_caseload_weight (recompute nurse_caseload_weight)"
          - "CASCADE (depth 2, sibling): all SCHEDULED Visits for this enrollment -> CANCELED"
        note: "disenroll is the second cascade trigger (depth >= 2), distinct from visit completion"

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /assignments/{id}/end OR cascade from Enrollment graduate/disenroll OR supersede by a new Assignment"
        actor: Supervisor
        preconditions:
          - "Assignment.status == ACTIVE"
        side_effects:
          - "subtract this Assignment.caseload_weight from Nurse.current_caseload_weight (recompute nurse_caseload_weight over remaining ACTIVE assignments)"
          - "if review_required was true, decrement Nurse.pending_supervision_count by 1"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [MISSED, CANCELED, RESCHEDULED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: HomeVisitNurse
        preconditions:
          - "acting nurse owns the visit: X-User-ID == Visit.nurse_id (else ERR_NOT_VISIT_OWNER)"
          - "Enrollment.status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "completed_date within the current logical clock day or earlier"
        side_effects:
          - "set completed_date, compute on_time (visit_on_time)"
          - "increment Enrollment.completed_visit_count by 1 and recompute visit_dosage (to-date rises)"
          - "if the recomputed dosage_to_date_pct >= DOSAGE_FLOOR_PCT and dosage_alert was true, clear dosage_alert, clear review_required on this enrollment's ACTIVE Assignments, and decrement each such Nurse.pending_supervision_count by 1 (floor 0)"
        note: "completion raises dosage; it can only clear an alert, never raise one"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /visits/{id}/mark-missed"
        actor: HomeVisitNurse
        preconditions:
          - "X-User-ID == Visit.nurse_id (else ERR_NOT_VISIT_OWNER)"
        side_effects:
          - "CASCADE hop 1: mark MISSED, then recompute visit_dosage (MISSED enters the to-date denominator, not the numerator, so dosage drops)"
          - "CASCADE hop 2: if the recomputed dosage_to_date_pct < DOSAGE_FLOOR_PCT, set Enrollment.dosage_alert = true"
          - "CASCADE hop 3 (only when hop 2 flips dosage_alert false->true): set review_required = true on every ACTIVE Assignment of this enrollment"
          - "CASCADE hop 4 (only when hop 3 fired): increment Nurse.pending_supervision_count by 1 for each such Assignment's nurse"
        note: "primary escalation cascade trigger (depth 4); each hop caused strictly by the prior hop's mutation"
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /visits/{id}/cancel OR cascade from Enrollment graduate/disenroll"
        actor: IntakeCoordinator
        preconditions:
          - "Visit.status == SCHEDULED"
        side_effects:
          - "recompute visit_dosage (CANCELED leaves both numerator and denominator)"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /visits/{id}/reschedule"
        actor: HomeVisitNurse
        preconditions:
          - "X-User-ID == Visit.nurse_id (else ERR_NOT_VISIT_OWNER)"
          - "new scheduled_start/scheduled_end do not double-book the nurse (see validations resource_temporal_overlap)"
        side_effects:
          - "create a replacement Visit in SCHEDULED with rescheduled_from_visit_id = this visit's id, copying enrollment_id/nurse_id/phase and the new dates"
          - "this visit becomes RESCHEDULED (superseded; leaves the dosage denominator)"
        note: "cyclic: the replacement is SCHEDULED and may itself be rescheduled again"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /visits/{id}/revert-completion"
        actor: HomeVisitNurse
        preconditions:
          - "X-User-ID == Visit.nurse_id (else ERR_NOT_VISIT_OWNER)"
          - "Visit.status == COMPLETED"
        side_effects:
          - "COMPENSATION: clear completed_date and on_time"
          - "COMPENSATION: decrement Enrollment.completed_visit_count by 1 and recompute visit_dosage; if dosage recovers >= DOSAGE_FLOOR_PCT clear dosage_alert and the derived review_required / pending_supervision_count that this enrollment contributed"
        note: "exact inverse of the completion cascade (compensating_invariant on completed_visit_count)"

  - entity: Referral
    initial_state: OPEN
    terminal_states: [CONNECTED, DECLINED, CLOSED]
    transitions:
      - from: OPEN
        to: CONTACTED
        trigger: "POST /referrals/{id}/contact"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == OPEN"
        side_effects:
          - "increment attempts by 1"
      - from: CONTACTED
        to: CONNECTED
        trigger: "POST /referrals/{id}/connect"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == CONTACTED"
        side_effects:
          - "set connected_at to the current logical clock time"
      - from: CONTACTED
        to: DECLINED
        trigger: "POST /referrals/{id}/decline"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == CONTACTED"
        side_effects: []
      - from: CONTACTED
        to: OPEN
        trigger: "POST /referrals/{id}/reopen"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == CONTACTED"
        side_effects: []
        note: "cyclic re-attempt loop; the next contact increments attempts again"
      - from: OPEN
        to: CLOSED
        trigger: "POST /referrals/{id}/close"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == OPEN"
        side_effects: []
      - from: CONTACTED
        to: CLOSED
        trigger: "POST /referrals/{id}/close"
        actor: HomeVisitNurse
        preconditions:
          - "Referral.status == CONTACTED"
        side_effects: []

  - entity: SupervisionSession
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /supervision-sessions/{id}/sign"
        actor: Supervisor
        preconditions:
          - "acting supervisor owns the session: X-User-ID == SupervisionSession.supervisor_id (else ERR_NOT_SESSION_OWNER)"
          - "Supervisor.status == ACTIVE"
        side_effects:
          - "for each enrollment id in reviewed_enrollment_ids that currently has dosage_alert and an ACTIVE Assignment to this session's nurse: clear that Assignment.review_required and decrement Nurse.pending_supervision_count by 1 (floor at 0)"

  - entity: MiechvReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /miechv-reports/{id}/finalize"
        actor: ProgramAdmin
        preconditions:
          - "MiechvReport.status == DRAFT"
        side_effects:
          - "freeze program_on_time_rate_pct (program_on_time_rate), enrolled_count, dosage_alert_count as of the current logical clock"

concurrency_rules:
  - rule_id: assignment-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /assignments"
    occ_field: "expected_enrollment_version"
    description: |
      Creating an Assignment supersedes any existing ACTIVE Assignment on the
      same enrollment (reassignment). A create whose expected_enrollment_version
      no longer matches the enrollment's current version is rejected: the
      enrollment has already been mutated (a prior assignment was created and
      advanced the version), so the caller's view of who is currently assigned
      is stale.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

calculations:
  - name: enrollment_eligibility
    trigger: "POST /enrollments (create) and re-checked on POST /enrollments/{id}/activate-enrollment"
    algorithm: threshold
    formula: |
      eligible = (Client.first_time_mother == true)
                 AND (Client.gestational_age_weeks <= GESTATIONAL_AGE_MAX_WEEKS)
      # boundary is inclusive: exactly GESTATIONAL_AGE_MAX_WEEKS is eligible;
      # GESTATIONAL_AGE_MAX_WEEKS + 1 is not.
    input_set: "the single Client referenced by client_id"
    constants:
      GESTATIONAL_AGE_MAX_WEEKS: 28
    precision: "integer comparison"

  - name: visit_dosage
    trigger: "recomputed on Visit complete / revert-completion / mark-missed / cancel / reschedule; read via GET /enrollments/{id}/dosage"
    algorithm: aggregation
    formula: |
      # to-date (chronological) variant — denominator is visits that have come
      # due AND reached a dispositioned outcome {COMPLETED, MISSED}; gated by clock.
      DOSAGE_TO_DATE_DENOM_STATUSES = {COMPLETED, MISSED}
      completed_to_date = count(Visit v : v.enrollment_id == E
                                AND v.status == COMPLETED
                                AND date(v.target_date) <= date(clock))
      expected_to_date  = count(Visit v : v.enrollment_id == E
                                AND v.status in DOSAGE_TO_DATE_DENOM_STATUSES
                                AND date(v.target_date) <= date(clock))
      dosage_to_date_pct = null if expected_to_date == 0
                           else round(100 * completed_to_date / expected_to_date, 2)
      # full-program (forward-looking) variant — denominator is the whole planned
      # schedule {COMPLETED, MISSED, SCHEDULED}; ignores the clock.
      DOSAGE_FULL_DENOM_STATUSES = {COMPLETED, MISSED, SCHEDULED}
      completed_full = count(Visit v : v.enrollment_id == E AND v.status == COMPLETED)
      expected_full  = count(Visit v : v.enrollment_id == E
                             AND v.status in DOSAGE_FULL_DENOM_STATUSES)
      dosage_full_pct = null if expected_full == 0
                        else round(100 * completed_full / expected_full, 2)
      # alert is driven by the to-date variant only:
      Enrollment.dosage_alert = (dosage_to_date_pct is not null
                                 AND dosage_to_date_pct < DOSAGE_FLOOR_PCT)
      # INVARIANT: Enrollment.completed_visit_count == completed_full's COMPLETED tally.
    input_set: "Visits of the enrollment; RESCHEDULED and CANCELED excluded from both variants; to_date denom excludes still-SCHEDULED visits, full denom includes them"
    constants:
      DOSAGE_FLOOR_PCT: 60.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: to_date
        when: "GET /enrollments/{id}/dosage default; drives dosage_alert"
        difference: "denominator = {COMPLETED, MISSED} with target_date <= clock (still-SCHEDULED visits excluded)"
      - name: full_program
        when: "GET /enrollments/{id}/dosage?basis=full_program"
        difference: "denominator = {COMPLETED, MISSED, SCHEDULED} regardless of target_date; diverges from to_date whenever future-dated SCHEDULED visits exist"

  - name: nurse_caseload_weight
    trigger: "on Assignment create, Assignment end, and any cascade that ends assignments"
    algorithm: weighted_scoring
    formula: |
      phase_weight(phase) = { PREGNANCY: PHASE_WEIGHT_PREGNANCY,
                              INFANCY:   PHASE_WEIGHT_INFANCY,
                              TODDLERHOOD: PHASE_WEIGHT_TODDLERHOOD }[phase]
      # per-assignment weight (>=3 inputs: phase tier, high_needs flag, multiplier):
      assignment_weight(a) = round(
          phase_weight(a.phase_at_assignment)
          * (HIGH_RISK_MULTIPLIER if a.high_needs else 1.0), 2)
      Nurse.current_caseload_weight = round(
          sum(assignment_weight(a) for a in ACTIVE assignments of nurse), 2)
      # cap enforced on create (validations business_fiscal):
      would_be = Nurse.current_caseload_weight + assignment_weight(new)
      reject if would_be > Nurse.max_caseload_weight   # strict >: equal is allowed
    input_set: "the nurse's ACTIVE Assignments only (ENDED excluded)"
    constants:
      PHASE_WEIGHT_PREGNANCY: 1.0
      PHASE_WEIGHT_INFANCY: 0.8
      PHASE_WEIGHT_TODDLERHOOD: 0.6
      HIGH_RISK_MULTIPLIER: 1.25
      CASELOAD_MAX_WEIGHT: 25.0
    precision: "2 decimal places, round_half_up; per-assignment rounding then sum (pinned order)"

  - name: client_risk_tier
    trigger: "recomputed whenever an Assessment is created for the client's enrollment; read on Client and via GET /clients/{id}/risk"
    algorithm: weighted_scoring
    formula: |
      # a 'flag' is one entry in Assessment.domain_flags.
      provisional_flags = sum(len(a.domain_flags) for a in Assessments
                              where a.enrollment.client_id == C
                              AND a.instrument_type == INTAKE)
      comprehensive_flags = sum(len(a.domain_flags) for a in Assessments
                                where a.enrollment.client_id == C)
      tier(n) = HIGH     if n >= HIGH_RISK_FLAG_THRESHOLD
                MODERATE if n >= MODERATE_RISK_FLAG_THRESHOLD
                LOW      otherwise
      Client.risk_tier = tier(comprehensive_flags)   # comprehensive variant persisted
    input_set: "all Assessments whose enrollment.client_id == C; provisional restricts to INTAKE instrument"
    constants:
      HIGH_RISK_FLAG_THRESHOLD: 3
      MODERATE_RISK_FLAG_THRESHOLD: 1
    precision: "integer flag counts"
    variants:
      - name: provisional
        when: "GET /clients/{id}/risk?basis=provisional; used at intake before all instruments recorded"
        difference: "counts only INTAKE-instrument flags"
      - name: comprehensive
        when: "GET /clients/{id}/risk default; persisted to Client.risk_tier"
        difference: "counts flags across all instrument types; can produce a higher tier than provisional"

  - name: assessment_result_band
    trigger: "POST /assessments (create)"
    algorithm: threshold
    formula: |
      total = sum(raw_scores.values())
      domain_flags = [domain for domain, subscore in raw_scores.items()
                      if subscore < DOMAIN_FLAG_THRESHOLD]   # ascending key order for determinism
      result_band = ON_TRACK if total >= ON_TRACK_MIN
                    MONITOR  if total >= MONITOR_MIN
                    REFER    otherwise
    input_set: "the single Assessment's raw_scores map"
    constants:
      ON_TRACK_MIN: 85
      MONITOR_MIN: 70
      DOMAIN_FLAG_THRESHOLD: 10
    precision: "integer sums; domain_flags ordered by domain key ascending"

  - name: visit_on_time
    trigger: "POST /visits/{id}/complete"
    algorithm: threshold
    formula: |
      on_time = abs(date(completed_date) - date(target_date)) <= ON_TIME_TOLERANCE_DAYS
      # inclusive boundary: exactly ON_TIME_TOLERANCE_DAYS days late/early is on_time.
    input_set: "the single Visit being completed"
    constants:
      ON_TIME_TOLERANCE_DAYS: 7
    precision: "whole-day difference"

  - name: program_on_time_rate
    trigger: "POST /miechv-reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      scope = Enrollments that were ACTIVE or GRADUATED at any time in
              [period_start, period_end]  (inclusive-inclusive)
      completed = [v for e in scope for v in Visits(e)
                   if v.status == COMPLETED
                   AND period_start <= date(v.completed_date) <= period_end]
      numerator   = count(v in completed where v.on_time == true)
      denominator = count(completed)
      # PINNED aggregation order — pool first, round ONCE:
      program_on_time_rate_pct = null if denominator == 0
                                 else round(100 * numerator / denominator, 2)
      # FORBIDDEN alternative: averaging per-enrollment rounded rates.
    input_set: "COMPLETED visits whose completed_date is within the inclusive period, across all in-scope enrollments"
    constants:
      ROUND_DECIMALS: 2
    precision: "2 decimal places, round_half_up; pool numerator/denominator then round exactly once"

  - name: nurse_visit_conflict
    trigger: "POST /visits (create) and POST /visits/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # a candidate [scheduled_start, scheduled_end) collides with an existing
      # non-terminal visit (status in {SCHEDULED, COMPLETED}) of the SAME nurse
      # when the intervals, each expanded by VISIT_TRAVEL_BUFFER_MINUTES on the
      # END side only, overlap:
      conflict = candidate.start < (existing.end + VISIT_TRAVEL_BUFFER_MINUTES)
                 AND existing.start < (candidate.end + VISIT_TRAVEL_BUFFER_MINUTES)
      # half-open geometry: back-to-back visits with >= buffer gap do NOT collide.
    input_set: "the nurse's Visits in status {SCHEDULED, COMPLETED}"
    constants:
      VISIT_TRAVEL_BUFFER_MINUTES: 30
    precision: "minute-resolution datetime comparison"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when unauthenticated is disallowed too"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and every FK in the body resolves to an existing entity (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 4
    category: state
    check: "on POST /assignments the enrollment status is ENROLLED or ACTIVE (assignable)"
    error_id: ERR_ENROLLMENT_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 4
    category: state
    check: "on POST /visits/{id}/complete the visit is SCHEDULED and its enrollment is ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /visits/{id}/complete"
  - priority: 4
    category: state
    check: "on POST /assessments the referenced visit is in COMPLETED status"
    error_id: ERR_VISIT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /assessments"
  - priority: 4
    category: state
    check: "acting nurse owns the visit (X-User-ID == Visit.nurse_id) for nurse-driven visit transitions"
    error_id: ERR_NOT_VISIT_OWNER
    http_status: 403
    applies_to: "POST /visits/{id}/complete|revert-completion|mark-missed|reschedule"
  - priority: 5
    category: business_safety
    check: "enrollment activation and referral creation require Client.consent_signed == true"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate-enrollment, POST /referrals"
  - priority: 5
    category: business_safety
    check: "Client.first_time_mother == true for enrollment creation and activation"
    error_id: ERR_NOT_FIRST_TIME_MOTHER
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/activate-enrollment"
  - priority: 6
    category: business_temporal
    check: "new/rescheduled visit does not double-book the nurse within VISIT_TRAVEL_BUFFER_MINUTES (nurse_visit_conflict)"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/reschedule"
  - priority: 6
    category: business_temporal
    check: "no two non-terminal visits of the same enrollment share the same target_date"
    error_id: ERR_DUPLICATE_TARGET_DATE
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/reschedule"
  - priority: 7
    category: business_constraint
    check: "gestational_age_weeks <= GESTATIONAL_AGE_MAX_WEEKS at enrollment create and activation"
    error_id: ERR_GESTATIONAL_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /enrollments, POST /enrollments/{id}/activate-enrollment"
  - priority: 7
    category: business_constraint
    check: "at most one non-EXITED Enrollment per Client"
    error_id: ERR_ENROLLMENT_EXISTS
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 7
    category: business_constraint
    check: "graduation requires program_phase == TODDLERHOOD"
    error_id: ERR_GRADUATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /enrollments/{id}/graduate"
  - priority: 7
    category: business_constraint
    check: "no existing non-terminal Referral of the same benefit_type for the enrollment"
    error_id: ERR_DUPLICATE_REFERRAL
    http_status: 409
    applies_to: "POST /referrals"
  - priority: 8
    category: business_referential
    check: "on POST /assessments the body enrollment_id equals the referenced Visit.enrollment_id"
    error_id: ERR_ASSESSMENT_VISIT_MISMATCH
    http_status: 422
    applies_to: "POST /assessments"
  - priority: 8
    category: business_referential
    check: "on POST /assignments the target Nurse.status == ACTIVE"
    error_id: ERR_NURSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 9
    category: business_fiscal
    check: "assignment would not push Nurse.current_caseload_weight above max_caseload_weight (strict >)"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 10
    category: state
    check: "expected_enrollment_version matches Enrollment.version on POST /assignments (OCC)"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /assignments"

endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock used by dosage to-date gating, on-time, connected_at, finalize"]

  # ---- Nurse ----
  - method: POST
    path: "/nurses"
    description: "Create a home-visiting nurse."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, credential_type, "status?", "max_caseload_weight?"]
    output: Nurse
    side_effects: []
  - method: GET
    path: "/nurses/{id}"
    description: "Read a nurse including current_caseload_weight and pending_supervision_count."
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: []
    output: Nurse

  # ---- Supervisor ----
  - method: POST
    path: "/supervisors"
    description: "Create a supervisor."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, "status?"]
    output: Supervisor

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Register a prospective client (first-time mother)."
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, mother_dob, first_time_mother, gestational_age_weeks]
    output: Client
  - method: GET
    path: "/clients/{id}"
    description: "Read a client including computed risk_tier."
    roles: [IntakeCoordinator, Supervisor]
    code: 200
    input: []
    output: Client
  - method: GET
    path: "/clients"
    description: "List clients."
    roles: [IntakeCoordinator, Supervisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]
  - method: POST
    path: "/clients/{id}/consent"
    description: "Record informed consent; sets consent_signed = true."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["Client.consent_signed = true"]
  - method: GET
    path: "/clients/{id}/risk"
    description: "Read risk classification; basis=provisional counts only INTAKE flags, default comprehensive."
    roles: [IntakeCoordinator, Supervisor]
    code: 200
    input: ["basis?"]
    output: "{ tier: string, provisional_flags: integer, comprehensive_flags: integer }"

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Create a PROSPECT enrollment for a client; snapshots gestational age."
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id]
    output: Enrollment
    side_effects: ["gestational_age_at_enrollment = Client.gestational_age_weeks"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Read an enrollment."
    roles: [IntakeCoordinator, Supervisor, HomeVisitNurse]
    code: 200
    input: []
    output: Enrollment
  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by client_id."
    roles: [IntakeCoordinator, Supervisor]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
  - method: POST
    path: "/enrollments/{id}/activate-enrollment"
    description: "PROSPECT -> ENROLLED after consent + eligibility re-check."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ENROLLED"]
  - method: POST
    path: "/enrollments/{id}/record-birth"
    description: "Record infant birth; sets Client.child_dob and advances program_phase PREGNANCY -> INFANCY."
    roles: [IntakeCoordinator]
    code: 200
    input: [child_dob]
    output: Enrollment
    side_effects: ["Client.child_dob set; program_phase -> INFANCY"]
  - method: POST
    path: "/enrollments/{id}/advance-phase"
    description: "Advance program_phase INFANCY -> TODDLERHOOD (child reached 12 months)."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["program_phase -> TODDLERHOOD"]
  - method: POST
    path: "/enrollments/{id}/graduate"
    description: "ACTIVE -> GRADUATED at program completion; cascades assignment/visit closure."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["end ACTIVE assignments (release caseload weight); cancel SCHEDULED visits"]
  - method: POST
    path: "/enrollments/{id}/disenroll"
    description: "Exit the enrollment from any non-terminal state; cascades closure."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> EXITED; end ACTIVE assignments (release caseload weight); cancel SCHEDULED visits"]
  - method: GET
    path: "/enrollments/{id}/dosage"
    description: "Read dosage; basis=full_program uses the forward-looking denominator, default to_date."
    roles: [IntakeCoordinator, Supervisor, HomeVisitNurse]
    code: 200
    input: ["basis?"]
    output: "{ dosage_to_date_pct: number, dosage_full_pct: number, completed_to_date: integer, expected_to_date: integer, dosage_alert: boolean }"

  # ---- Assignment ----
  - method: POST
    path: "/assignments"
    description: "Assign a nurse to an enrollment; supersedes any existing ACTIVE assignment (OCC on enrollment version)."
    roles: [Supervisor]
    code: 201
    input: [enrollment_id, nurse_id, expected_enrollment_version, "high_needs?"]
    output: Assignment
    side_effects:
      - "compute caseload_weight (nurse_caseload_weight); add to Nurse.current_caseload_weight"
      - "end any prior ACTIVE assignment for the enrollment (release its weight)"
      - "if enrollment was ENROLLED, transition it to ACTIVE"
      - "increments Enrollment.version by 1"
  - method: GET
    path: "/assignments/{id}"
    description: "Read an assignment."
    roles: [Supervisor, ProgramAdmin]
    code: 200
    input: []
    output: Assignment
  - method: GET
    path: "/assignments"
    description: "List assignments; filter by enrollment_id or nurse_id."
    roles: [Supervisor, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "nurse_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
  - method: POST
    path: "/assignments/{id}/end"
    description: "End an ACTIVE assignment; releases its caseload weight."
    roles: [Supervisor]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> ENDED; subtract caseload_weight from Nurse.current_caseload_weight"]

  # ---- Visit ----
  - method: POST
    path: "/visits"
    description: "Schedule a visit for an enrollment."
    roles: [HomeVisitNurse]
    code: 201
    input: [enrollment_id, nurse_id, phase, target_date, scheduled_start, scheduled_end]
    output: Visit
    side_effects: ["recompute visit_dosage denominator"]
  - method: GET
    path: "/visits/{id}"
    description: "Read a visit."
    roles: [HomeVisitNurse, Supervisor, IntakeCoordinator]
    code: 200
    input: []
    output: Visit
  - method: GET
    path: "/visits"
    description: "List visits; filter by enrollment_id, nurse_id, rescheduled_from_visit_id, status."
    roles: [HomeVisitNurse, Supervisor, IntakeCoordinator]
    code: 200
    input: ["enrollment_id?", "nurse_id?", "rescheduled_from_visit_id?", "status?", "limit?", "offset?"]
    output: Visit[]
  - method: POST
    path: "/visits/{id}/complete"
    description: "SCHEDULED -> COMPLETED; drives the dosage cascade."
    roles: [HomeVisitNurse]
    code: 200
    input: [completed_date]
    output: Visit
    side_effects: ["set completed_date, on_time; increment Enrollment.completed_visit_count; dosage cascade (see state_machines.Visit)"]
  - method: POST
    path: "/visits/{id}/revert-completion"
    description: "COMPLETED -> SCHEDULED; exact inverse of the completion cascade."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Visit
    side_effects: ["clear completed_date/on_time; decrement Enrollment.completed_visit_count; recompute dosage and unwind alert cascade"]
  - method: POST
    path: "/visits/{id}/mark-missed"
    description: "SCHEDULED -> MISSED (no-show)."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Visit
    side_effects: ["recompute visit_dosage"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "SCHEDULED -> CANCELED."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["recompute visit_dosage"]
  - method: POST
    path: "/visits/{id}/reschedule"
    description: "SCHEDULED -> RESCHEDULED; creates and returns a replacement SCHEDULED visit."
    roles: [HomeVisitNurse]
    code: 200
    input: [target_date, scheduled_start, scheduled_end]
    output: Visit
    side_effects: ["original -> RESCHEDULED; create replacement Visit with rescheduled_from_visit_id set"]

  # ---- Assessment ----
  - method: POST
    path: "/assessments"
    description: "Record a screening/milestone assessment against a completed visit."
    roles: [HomeVisitNurse]
    code: 201
    input: [visit_id, enrollment_id, instrument_type, raw_scores]
    output: Assessment
    side_effects: ["compute result_band + domain_flags; recompute client_risk_tier"]
  - method: GET
    path: "/assessments/{id}"
    description: "Read an assessment."
    roles: [HomeVisitNurse, Supervisor]
    code: 200
    input: []
    output: Assessment
  - method: GET
    path: "/assessments"
    description: "List assessments; filter by visit_id or enrollment_id."
    roles: [HomeVisitNurse, Supervisor]
    code: 200
    input: ["visit_id?", "enrollment_id?", "limit?", "offset?"]
    output: Assessment[]

  # ---- Referral ----
  - method: POST
    path: "/referrals"
    description: "Open a benefit-linkage referral for an enrollment."
    roles: [HomeVisitNurse]
    code: 201
    input: [enrollment_id, benefit_type]
    output: Referral
  - method: GET
    path: "/referrals/{id}"
    description: "Read a referral."
    roles: [HomeVisitNurse, Supervisor]
    code: 200
    input: []
    output: Referral
  - method: GET
    path: "/referrals"
    description: "List referrals; filter by enrollment_id."
    roles: [HomeVisitNurse, Supervisor]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: Referral[]
  - method: POST
    path: "/referrals/{id}/contact"
    description: "OPEN -> CONTACTED; increments attempts."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Referral
    side_effects: ["attempts += 1"]
  - method: POST
    path: "/referrals/{id}/connect"
    description: "CONTACTED -> CONNECTED; stamps connected_at."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Referral
    side_effects: ["connected_at = clock"]
  - method: POST
    path: "/referrals/{id}/decline"
    description: "CONTACTED -> DECLINED."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Referral
  - method: POST
    path: "/referrals/{id}/reopen"
    description: "CONTACTED -> OPEN (re-attempt loop)."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Referral
  - method: POST
    path: "/referrals/{id}/close"
    description: "OPEN or CONTACTED -> CLOSED (unresolved)."
    roles: [HomeVisitNurse]
    code: 200
    input: []
    output: Referral

  # ---- SupervisionSession ----
  - method: POST
    path: "/supervision-sessions"
    description: "Open a caseload supervision session for a nurse over a period."
    roles: [Supervisor]
    code: 201
    input: [nurse_id, supervisor_id, period_start, period_end, reviewed_enrollment_ids]
    output: SupervisionSession
  - method: GET
    path: "/supervision-sessions/{id}"
    description: "Read a supervision session."
    roles: [Supervisor, ProgramAdmin]
    code: 200
    input: []
    output: SupervisionSession
  - method: GET
    path: "/supervision-sessions"
    description: "List supervision sessions; filter by nurse_id or supervisor_id."
    roles: [Supervisor, ProgramAdmin]
    code: 200
    input: ["nurse_id?", "supervisor_id?", "status?", "limit?", "offset?"]
    output: SupervisionSession[]
  - method: POST
    path: "/supervision-sessions/{id}/sign"
    description: "DRAFT -> SIGNED; dispositions dosage alerts for reviewed enrollments."
    roles: [Supervisor]
    code: 200
    input: []
    output: SupervisionSession
    side_effects: ["clear review_required and decrement pending_supervision_count for matching alerted enrollments"]

  # ---- OutcomeMeasure ----
  - method: POST
    path: "/outcome-measures"
    description: "Snapshot an outcome measure for an enrollment over a period."
    roles: [ProgramAdmin]
    code: 201
    input: [enrollment_id, measure_type, period_start, period_end]
    output: OutcomeMeasure
    side_effects: ["compute numerator, denominator, rate_pct"]
  - method: GET
    path: "/outcome-measures/{id}"
    description: "Read an outcome measure."
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: []
    output: OutcomeMeasure
  - method: GET
    path: "/outcome-measures"
    description: "List outcome measures; filter by enrollment_id."
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: OutcomeMeasure[]

  # ---- MiechvReport ----
  - method: POST
    path: "/miechv-reports"
    description: "Create a DRAFT MIECHV report for a period."
    roles: [ProgramAdmin]
    code: 201
    input: [period_start, period_end]
    output: MiechvReport
  - method: GET
    path: "/miechv-reports/{id}"
    description: "Read a MIECHV report."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MiechvReport
  - method: POST
    path: "/miechv-reports/{id}/finalize"
    description: "DRAFT -> FINALIZED; freezes pooled program metrics."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MiechvReport
    side_effects: ["freeze program_on_time_rate_pct, enrolled_count, dosage_alert_count"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced path id or FK does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_ENROLLMENT_NOT_ASSIGNABLE
    http: 409
    condition: "POST /assignments when enrollment status is not ENROLLED or ACTIVE"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "completing a visit whose enrollment is not ACTIVE"
  - id: ERR_VISIT_NOT_COMPLETED
    http: 409
    condition: "creating an assessment against a visit not in COMPLETED status"
  - id: ERR_NOT_VISIT_OWNER
    http: 403
    condition: "nurse-driven visit transition where X-User-ID != Visit.nurse_id"
  - id: ERR_NOT_SESSION_OWNER
    http: 403
    condition: "signing a supervision session where X-User-ID != SupervisionSession.supervisor_id"
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "enrollment activation or referral creation without Client.consent_signed"
  - id: ERR_NOT_FIRST_TIME_MOTHER
    http: 422
    condition: "enrollment for a client whose first_time_mother is false"
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "new/rescheduled visit double-books the nurse within VISIT_TRAVEL_BUFFER_MINUTES"
  - id: ERR_DUPLICATE_TARGET_DATE
    http: 409
    condition: "another non-terminal visit of the same enrollment already has this target_date"
  - id: ERR_GESTATIONAL_AGE_INELIGIBLE
    http: 422
    condition: "gestational_age_weeks exceeds GESTATIONAL_AGE_MAX_WEEKS"
  - id: ERR_ENROLLMENT_EXISTS
    http: 409
    condition: "client already has a non-EXITED enrollment"
  - id: ERR_GRADUATION_TOO_EARLY
    http: 409
    condition: "graduation attempted before program_phase is TODDLERHOOD"
  - id: ERR_DUPLICATE_REFERRAL
    http: 409
    condition: "an open (non-terminal) referral of the same benefit_type already exists for the enrollment"
  - id: ERR_ASSESSMENT_VISIT_MISMATCH
    http: 422
    condition: "assessment enrollment_id does not equal the referenced Visit.enrollment_id"
  - id: ERR_NURSE_NOT_ACTIVE
    http: 422
    condition: "assignment targets a nurse whose status is not ACTIVE"
  - id: ERR_CASELOAD_EXCEEDED
    http: 422
    condition: "assignment would push nurse caseload above max_caseload_weight"
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not match the enrollment's current version"
  - id: ERR_VALIDATION
    http: 422
    condition: "a required body field is missing or a field value violates its type/enum constraint"
  - id: ERR_SCHEDULE_WINDOW_INVALID
    http: 422
    condition: "scheduled_end is not strictly after scheduled_start on a visit create/reschedule"

roles:
  - name: IntakeCoordinator
    description: "handles intake, consent, enrollment lifecycle, and visit cancellation"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/consent"
      - "POST /enrollments"
      - "POST /enrollments/{id}/activate-enrollment"
      - "POST /enrollments/{id}/record-birth"
      - "POST /enrollments/{id}/advance-phase"
      - "POST /enrollments/{id}/graduate"
      - "POST /enrollments/{id}/disenroll"
      - "POST /visits/{id}/cancel"
    shared_operations:
      - "GET /clients, GET /clients/{id}, GET /clients/{id}/risk"
      - "GET /enrollments, GET /enrollments/{id}, GET /enrollments/{id}/dosage"
      - "GET /visits, GET /visits/{id}"
  - name: HomeVisitNurse
    description: "conducts home visits, records assessments, manages referrals for own caseload"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /visits"
      - "POST /visits/{id}/complete"
      - "POST /visits/{id}/revert-completion"
      - "POST /visits/{id}/mark-missed"
      - "POST /visits/{id}/reschedule"
      - "POST /assessments"
      - "POST /referrals and all referral transitions"
    shared_operations:
      - "GET /visits, GET /visits/{id}"
      - "GET /enrollments/{id}, GET /enrollments/{id}/dosage"
      - "GET /assessments, GET /assessments/{id}"
      - "GET /referrals, GET /referrals/{id}"
  - name: Supervisor
    description: "assigns nurses, manages caseload, runs supervision sessions"
    identity: "entity_backed:Supervisor"
    exclusive_operations:
      - "POST /assignments"
      - "POST /assignments/{id}/end"
      - "POST /supervision-sessions"
      - "POST /supervision-sessions/{id}/sign"
    shared_operations:
      - "GET /nurses/{id}, GET /assignments, GET /assignments/{id}"
      - "GET /clients/{id}, GET /clients/{id}/risk"
      - "GET /enrollments, GET /enrollments/{id}, GET /enrollments/{id}/dosage"
      - "GET /visits, GET /assessments, GET /referrals"
      - "GET /supervision-sessions, GET /outcome-measures"
  - name: ProgramAdmin
    description: "manages staff records, outcome measures, MIECHV reporting, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /nurses"
      - "POST /supervisors"
      - "POST /outcome-measures"
      - "POST /miechv-reports"
      - "POST /miechv-reports/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /nurses/{id}, GET /assignments, GET /assignments/{id}"
      - "GET /supervision-sessions, GET /outcome-measures, GET /outcome-measures/{id}"
      - "GET /miechv-reports/{id}"
