# =============================================================================
# SCAFFOLD.yaml — Independent Contractor Classification & Compliance
# (worker classification review board)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files per skill spec.
# =============================================================================

scenario: |
  Independent Contractor Classification & Compliance (worker classification review board):
  engagement intake questionnaire & classification test application by jurisdiction,
  approval workflow & exception documentation, contract terms & business entity
  verification, ongoing relationship monitoring for scope creep, reclassification
  risk audit & remediation, 1099 reporting & state reporting requirements,
  agency/audit response, conversion process to employment.

domain_name: contractor-classification-compliance
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat           # peer resources joined by FK references in request bodies; sub-resource GETs only for reverse-reachability
  state_machine_shape: cyclic     # multiple cycle-bearing machines (info-request loop, correction loop, escalation round loop) + parallel dimensions on Contractor
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # TaxForm1099Filing.corrects_filing_id
  role_model: segregation_of_duties  # approval quorum steps must be performed by distinct X-User-ID principals
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code, e.g. US-FED, US-CA, US-MA, US-TX", constraints: "unique across all jurisdictions" }
      - { name: test_type, type: enum, source: input, description: "Classification test applied in this jurisdiction: ABC_TEST | COMMON_LAW_WEIGHTED | ECONOMIC_REALITY" }
      - { name: employee_score_threshold, type: number, source: input, default: 0.60, description: "COMMON_LAW_WEIGHTED only: weighted score >= threshold => EMPLOYEE_RISK (boundary is inclusive)", constraints: "0 < value <= 1" }
      - { name: state_filing_threshold_cents, type: integer, source: input, description: "State 1099 filing threshold in cents; state copy required when reportable_amount_cents >= this value", constraints: ">= 0" }
      - { name: max_active_exceptions, type: integer, source: input, description: "Capacity cap: max ExceptionGrants with status ACTIVE across all engagements in this jurisdiction", constraints: ">= 0" }
      - { name: min_insurance_cents, type: integer, source: input, description: "Minimum contractor liability insurance required to execute a contract in this jurisdiction", constraints: ">= 0" }
      - { name: description, type: string, source: input, default: "", description: "Free-text description of the jurisdiction regime" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the worker or business entity" }
      - { name: entity_type, type: enum, source: input, description: "INDIVIDUAL | SOLE_PROPRIETOR | LLC | S_CORP | PARTNERSHIP" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number (or SSN for INDIVIDUAL)", constraints: "unique across all contractors" }
      - { name: insurance_coverage_cents, type: integer, source: input, description: "Current liability insurance coverage in cents", constraints: ">= 0" }
      - { name: verification_status, type: enum, source: system, description: "Parallel dimension 1: UNVERIFIED -> VERIFIED | VERIFICATION_FAILED; VERIFICATION_FAILED -> VERIFIED on re-verification", default: UNVERIFIED }
      - { name: standing_status, type: enum, source: system, description: "Parallel dimension 2: GOOD_STANDING -> WATCH -> GOOD_STANDING; GOOD_STANDING|WATCH -> SUSPENDED_STANDING; any non-terminal -> CONVERTED_TO_EMPLOYEE. Evolves independently of verification_status", default: GOOD_STANDING }
      - { name: lifetime_reported_cents, type: integer, source: computed, description: "Sum of signed_amount_cents over all TaxForm1099Filing of this contractor with status IN {SUBMITTED, ACCEPTED}; DRAFT, REJECTED_AGENCY, SUPERSEDED and VOID filings contribute 0. Initial value 0", default: 0 }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; the engaged worker" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governing classification regime" }
      - { name: title, type: string, source: input, description: "Engagement title" }
      - { name: scope_description, type: string, source: input, description: "Statement of work summary" }
      - { name: agreed_rate_cents, type: integer, source: input, description: "Contracted rate in cents per rate_unit", constraints: "> 0" }
      - { name: rate_unit, type: enum, source: input, description: "HOURLY | DAILY | PROJECT" }
      - { name: start_date, type: string, source: input, description: "ISO date, engagement start" }
      - { name: end_date, type: string, source: input, description: "ISO date, engagement end; must be >= start_date" }
      - { name: supervision_level, type: enum, source: input, description: "Observed supervision intensity: NONE | LIGHT | CLOSE; feeds scope_creep_index", default: NONE }
      - { name: status, type: enum, source: system, description: "DRAFT -> INTAKE_SUBMITTED -> CLASSIFIED -> UNDER_REVIEW <-> INFO_REQUESTED -> APPROVAL_PENDING -> APPROVED -> ACTIVE <-> SUSPENDED; terminal: REJECTED | TERMINATED | CONVERTED", default: DRAFT }
      - { name: risk_tier, type: enum, source: computed, description: "HIGH if current determination outcome == EMPLOYEE_RISK; ELEVATED if outcome == CONTRACTOR and jurisdiction.test_type IN {ABC_TEST, ECONOMIC_REALITY}; STANDARD if outcome == CONTRACTOR and test_type == COMMON_LAW_WEIGHTED. Null until CLASSIFIED" }
      - { name: required_approval_count, type: integer, source: computed, description: "Approval quorum from risk_tier: STANDARD=1, ELEVATED=2, HIGH=3" }
      - { name: approvals_recorded, type: array, source: system, description: "Ordered list of {role, user_id, decided_at} approval entries; quorum reached => auto APPROVED", default: [] }
      - { name: current_determination_id, type: string, source: system, description: "Soft pointer (nullable) to the current non-superseded ClassificationDetermination; reverse discovery via GET /api/engagements/{id}/determinations" }
      - { name: scope_creep_index, type: integer, source: computed, description: "0..100 per calculations.scope_creep_index; recomputed on amendment APPLIED, review CLOSED, and any engagement mutation", default: 0 }
      - { name: scope_creep_tier, type: enum, source: computed, description: "LOW (<25) | MODERATE (25-49) | HIGH (50-74) | CRITICAL (>=75), derived from scope_creep_index", default: LOW }

  - name: IntakeQuestionnaire
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement (path parameter)" }
      - { name: answers, type: array, source: input, description: "List of {factor_key, answer}; factor_key IN {CONTROL_METHOD, CONTROL_HOURS, OUTSIDE_USUAL_BUSINESS, INDEPENDENT_TRADE, PROFIT_LOSS, INVESTMENT, INTEGRAL_TO_BUSINESS, PERMANENCY}; answer IN {YES, NO}" }
      - { name: revision, type: integer, source: system, description: "Starts at 1 on first POST; increments by 1 on every subsequent POST for the same engagement", default: 1 }
      - { name: complete, type: boolean, source: computed, description: "True iff answers cover all 8 factor_keys exactly once" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp (logical clock) of latest POST" }

  - name: ClassificationDetermination
    parent: Engagement
    common_fields: false
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement (path parameter)" }
      - { name: jurisdiction_test_type, type: enum, source: system, description: "Snapshot of Jurisdiction.test_type at computation time: ABC_TEST | COMMON_LAW_WEIGHTED | ECONOMIC_REALITY" }
      - { name: questionnaire_revision, type: integer, source: system, description: "Revision of the IntakeQuestionnaire this determination was computed from" }
      - { name: outcome, type: enum, source: computed, description: "CONTRACTOR | EMPLOYEE_RISK, per calculations.classification_test_application" }
      - { name: score, type: number, source: computed, description: "COMMON_LAW_WEIGHTED: weighted score (2dp); ABC_TEST: failed prong count; ECONOMIC_REALITY: employee-indicative factor count" }
      - { name: failed_prongs, type: integer, source: computed, description: "ABC_TEST: count of failed prongs (0..3); other test types: 0" }
      - { name: superseded, type: boolean, source: system, description: "True once a newer determination exists for the same engagement", default: false }

  - name: ExceptionGrant
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement the exception applies to (path parameter)" }
      - { name: justification, type: string, source: input, description: "Documented business justification for proceeding despite classification risk" }
      - { name: expires_at, type: datetime, source: input, description: "ISO8601 expiry instant; grant is EXPIRED when logical clock > expires_at" }
      - { name: granted_by_user_id, type: string, source: system, description: "X-User-ID of the granting ComplianceBoardMember" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> EXPIRED (clock) | REVOKED (manual or cascade)", default: ACTIVE }

  - name: ContractAgreement
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement (path parameter)" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; denormalized from engagement for overlap checks" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; denormalized from engagement for overlap checks" }
      - { name: start_date, type: string, source: input, description: "ISO date, half-open interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date, half-open interval end (exclusive); must be > start_date" }
      - { name: rate_cents, type: integer, source: input, description: "Rate in cents per rate_unit", constraints: "> 0" }
      - { name: rate_unit, type: enum, source: input, description: "HOURLY | DAILY | PROJECT" }
      - { name: status, type: enum, source: system, description: "DRAFT -> EXECUTED <-> SUSPENDED; terminal: TERMINATED | EXPIRED", default: DRAFT }

  - name: ContractAmendment
    parent: ContractAgreement
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> ContractAgreement.id; amended contract (path parameter)" }
      - { name: new_rate_cents, type: integer, source: input, description: "Optional replacement rate in cents; null = unchanged", constraints: "> 0 when present" }
      - { name: new_end_date, type: string, source: input, description: "Optional replacement end date (exclusive); null = unchanged" }
      - { name: scope_change_summary, type: string, source: input, description: "Required description of scope change; widening scope feeds scope_creep_index" }
      - { name: exception_grant_id, type: string, source: input, description: "Optional soft reference (nullable) to the ExceptionGrant under which this amendment is made; used by the suspend cascade" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> APPROVED -> APPLIED; PROPOSED -> REJECTED; PROPOSED|APPROVED -> VOIDED (cascade)", default: PROPOSED }

  - name: MonitoringReview
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; reviewed engagement (path parameter)" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of the review; must be >= 30 days from any other review of the same engagement" }
      - { name: findings, type: array, source: input, description: "Provided at close: list of {severity: LOW|MEDIUM|HIGH, description}; may be empty" }
      - { name: remediation_action_ids, type: array, source: input, description: "Provided at close: RemediationAction ids addressing findings; required non-empty iff findings non-empty" }
      - { name: findings_count, type: integer, source: computed, description: "= length(findings) recorded at close", default: 0 }
      - { name: outcome, type: enum, source: system, description: "Set at close: CLEARED when findings_count == 0, FINDINGS_FILED when findings_count >= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CLOSED", default: SCHEDULED }

  - name: RiskAudit
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; audited contractor" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; null = portfolio-level audit of the contractor", constraints: "nullable" }
      - { name: audit_type, type: enum, source: input, description: "SCREENING | FIELDWORK" }
      - { name: provisional_risk_score, type: number, source: computed, description: "Forward-looking score at creation per calculations.reclassification_risk_score (1 decimal place)" }
      - { name: final_risk_score, type: number, source: computed, description: "Chronological fieldwork score at finalize; null until FINDINGS_FINALIZED", constraints: "nullable" }
      - { name: risk_level, type: enum, source: computed, description: "LOW (<25) | MODERATE (25-49.9) | HIGH (50-74.9) | CRITICAL (>=75) over final_risk_score when present else provisional_risk_score" }
      - { name: open_action_count, type: integer, source: computed, description: "= count of child RemediationAction with status == OPEN", default: 0 }
      - { name: findings_summary, type: string, source: input, description: "Provided at finalize" }
      - { name: status, type: enum, source: system, description: "OPEN -> FINDINGS_FINALIZED -> REMEDIATION -> CLOSED; OPEN -> CLOSED when audit_type SCREENING and no findings", default: OPEN }

  - name: RemediationAction
    parent: RiskAudit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> RiskAudit.id; owning audit (path parameter)" }
      - { name: description, type: string, source: input, description: "Remediation work item" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: due_date, type: string, source: input, description: "ISO date" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED | WAIVED", default: OPEN }
      - { name: close_note, type: string, source: input, description: "Optional note recorded at close", default: "" }

  - name: TaxForm1099Filing
    parent: Contractor
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; recipient of the 1099" }
      - { name: state_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; state regime for the state-copy threshold" }
      - { name: tax_year, type: integer, source: input, description: "Calendar tax year, e.g. 2026", constraints: ">= 2020 and <= clock year" }
      - { name: kind, type: enum, source: input, description: "ORIGINAL | CORRECTION", default: ORIGINAL }
      - { name: corrects_filing_id, type: string, source: input, description: "FK -> TaxForm1099Filing.id; required when kind == CORRECTION, must be null when ORIGINAL; target must be ACCEPTED", constraints: "nullable; self-referential" }
      - { name: payment_line_items, type: array, source: input, description: "List of {amount_cents, payment_date (ISO), kind: SERVICE_FEE | EXPENSE_REIMBURSEMENT}; only SERVICE_FEE items with payment_date inside [Jan 1, Dec 31] of tax_year count toward reportable" }
      - { name: reportable_amount_cents, type: integer, source: computed, description: "Sum of qualifying SERVICE_FEE line items per calculations.reportable_amount_1099" }
      - { name: federal_filing_required, type: boolean, source: computed, description: "reportable_amount_cents >= 60000 (inclusive boundary)" }
      - { name: state_filing_required, type: boolean, source: computed, description: "reportable_amount_cents >= Jurisdiction.state_filing_threshold_cents (inclusive boundary)" }
      - { name: signed_amount_cents, type: integer, source: computed, description: "+ reportable_amount_cents for ORIGINAL and CORRECTION filings; contributes to contractor.lifetime_reported_cents only while status IN {SUBMITTED, ACCEPTED}" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of first successful submit; null while never submitted", constraints: "nullable" }
      - { name: days_late, type: integer, source: computed, description: "max(0, calendar days from filing deadline (Jan 31 of tax_year+1) to filed_at date)", default: 0 }
      - { name: penalty_cents, type: integer, source: computed, description: "Per calculations.late_filing_penalty at submit time", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACCEPTED | REJECTED_AGENCY; REJECTED_AGENCY -> SUBMITTED (resubmission cycle); ACCEPTED -> SUPERSEDED (by CORRECTION submit); SUBMITTED|ACCEPTED -> VOID", default: DRAFT }

  - name: AgencyInquiry
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement under agency scrutiny (path parameter)" }
      - { name: agency_type, type: enum, source: input, description: "IRS | DOL | STATE_EDD | STATE_UI" }
      - { name: received_at, type: datetime, source: input, description: "ISO8601 instant the inquiry was received" }
      - { name: response_deadline, type: datetime, source: input, description: "ISO8601 response deadline; replaced by new_response_deadline on escalation" }
      - { name: back_payments_cents, type: integer, source: input, description: "Alleged back-payment exposure base in cents", constraints: ">= 0" }
      - { name: quarters_outstanding, type: integer, source: input, description: "Whole quarters the alleged misclassification has persisted", constraints: ">= 0" }
      - { name: exposure_estimate_cents, type: integer, source: computed, description: "Per calculations.agency_exposure_estimate (pinned evaluation order)" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> RESPONSE_SUBMITTED -> RESOLVED | AUDIT_OPENED; AUDIT_OPENED -> RESPONSE_SUBMITTED (new response round)", default: RECEIVED }

  - name: ConversionCase
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement being converted to employment (path parameter)" }
      - { name: lookback_quarters, type: array, source: input, description: "Exactly 4 entries {quarter_label, service_fee_cents}; basis of the lookback compensation delta", constraints: "length == 4" }
      - { name: w2_equivalent_total_cents, type: integer, source: computed, description: "Per calculations.conversion_lookback_compensation (per-quarter rounding, then sum)" }
      - { name: lookback_delta_cents, type: integer, source: computed, description: "= w2_equivalent_total_cents - sum(service_fee_cents over lookback_quarters)" }
      - { name: offer_salary_cents, type: integer, source: input, description: "Annual salary offered; provided at extend-offer", constraints: "nullable until OFFER_EXTENDED" }
      - { name: status, type: enum, source: system, description: "INITIATED -> OFFER_EXTENDED -> COMPLETED | DECLINED | RESCINDED", default: INITIATED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED, CONVERTED]
    transitions:
      - from: DRAFT
        to: INTAKE_SUBMITTED
        trigger: POST /api/engagements/{id}/questionnaire (first questionnaire submission)
        actor: EngagementManager
        preconditions:
          - "answers array covers all 8 factor_keys (else complete == false; transition still occurs but later submit-review will fail)"
        side_effects:
          - "IntakeQuestionnaire.revision := 1, submitted_at := logical clock"
          - "increments Engagement.version by 1"
      - from: INTAKE_SUBMITTED
        to: INTAKE_SUBMITTED
        trigger: POST /api/engagements/{id}/questionnaire (re-submission before determination)
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "IntakeQuestionnaire.revision += 1; any existing current determination becomes stale (questionnaire_revision mismatch)"
          - "increments Engagement.version by 1"
      - from: INTAKE_SUBMITTED
        to: CLASSIFIED
        trigger: POST /api/engagements/{id}/determinations (OCC-guarded)
        actor: ClassificationAnalyst
        preconditions:
          - "expected_engagement_version == Engagement.version (ERR_STALE_VERSION, 412)"
          - "IntakeQuestionnaire exists with complete == true (ERR_QUESTIONNAIRE_INCOMPLETE)"
        side_effects:
          - "runs calculations.classification_test_application for the engagement jurisdiction test_type over the current questionnaire revision"
          - "new ClassificationDetermination appended; prior current determination (if any) superseded := true"
          - "Engagement.current_determination_id := new determination id; risk_tier and required_approval_count recomputed"
          - "increments Engagement.version by 1"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: POST /api/engagements/{id}/determinations (re-computation, OCC-guarded)
        actor: ClassificationAnalyst
        preconditions:
          - "expected_engagement_version == Engagement.version (ERR_STALE_VERSION, 412)"
          - "IntakeQuestionnaire exists with complete == true (ERR_QUESTIONNAIRE_INCOMPLETE)"
        side_effects:
          - "same as INTAKE_SUBMITTED -> CLASSIFIED: new determination supersedes prior; risk_tier recomputed"
          - "increments Engagement.version by 1"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: POST /api/engagements/{id}/questionnaire (answer revision after classification)
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "IntakeQuestionnaire.revision += 1; the current determination becomes stale (questionnaire_revision mismatch) until re-run"
          - "increments Engagement.version by 1"
      - from: CLASSIFIED
        to: UNDER_REVIEW
        trigger: POST /api/engagements/{id}/submit-review
        actor: EngagementManager
        preconditions:
          - "current determination exists (ERR_DETERMINATION_REQUIRED)"
          - "questionnaire complete == true (ERR_QUESTIONNAIRE_INCOMPLETE)"
        side_effects:
          - "increments Engagement.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: POST /api/engagements/{id}/request-info
        actor: ClassificationAnalyst
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: POST /api/engagements/{id}/questionnaire (resubmission answers the info request; cycle of the review loop)
        actor: EngagementManager
        preconditions:
          - "answers array present"
        side_effects:
          - "IntakeQuestionnaire.revision += 1 (renders the current determination stale until re-run)"
          - "increments Engagement.version by 1"
      - from: UNDER_REVIEW
        to: APPROVAL_PENDING
        trigger: POST /api/engagements/{id}/submit-approval
        actor: ClassificationAnalyst
        preconditions:
          - "current determination's questionnaire_revision == IntakeQuestionnaire.revision (ERR_DETERMINATION_STALE)"
        side_effects:
          - "Engagement.approvals_recorded := [] (any prior round entries cleared on re-entry)"
          - "increments Engagement.version by 1"
      - from: APPROVAL_PENDING
        to: APPROVED
        trigger: POST /api/engagements/{id}/approve (auto-fires on the call that reaches quorum)
        actor: HRApprover | LegalApprover | ComplianceBoardMember
        preconditions:
          - "acting role == APPROVAL_SEQUENCE[len(approvals_recorded)] where APPROVAL_SEQUENCE = [HRApprover, LegalApprover, ComplianceBoardMember] truncated to required_approval_count (ERR_APPROVAL_OUT_OF_ORDER)"
          - "acting X-User-ID not present in approvals_recorded[*].user_id (ERR_APPROVER_ALREADY_ACTED — segregation of duties)"
          - "when this call is the final (quorum-reaching) approval and risk_tier == HIGH: an ExceptionGrant with status ACTIVE and expires_at >= clock exists for the engagement (ERR_EXCEPTION_REQUIRED; an expired grant yields ERR_EXCEPTION_EXPIRED)"
        side_effects:
          - "append {role, user_id, decided_at} to approvals_recorded; when len == required_approval_count, status := APPROVED"
          - "increments Engagement.version by 1"
      - from: APPROVAL_PENDING
        to: REJECTED
        trigger: POST /api/engagements/{id}/reject
        actor: HRApprover | LegalApprover | ComplianceBoardMember
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /api/engagements/{id}/reject
        actor: ClassificationAnalyst | HRApprover | LegalApprover | ComplianceBoardMember
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: POST /api/engagements/{id}/activate
        actor: EngagementManager
        preconditions:
          - "a ContractAgreement for this engagement has status == EXECUTED (ERR_CONTRACT_NOT_EXECUTED)"
          - "Contractor.standing_status IN {GOOD_STANDING, WATCH} (ERR_CONTRACTOR_STANDING_SUSPENDED)"
        side_effects:
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /api/engagements/{id}/suspend
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE link 1: the EXECUTED ContractAgreement of this engagement -> SUSPENDED (contract mutation)"
          - "CASCADE link 2 (caused by link 1 contract mutation): every ContractAmendment of that contract with status IN {PROPOSED, APPROVED} -> VOIDED"
          - "CASCADE link 3 (caused by link 2 amendment voiding): every ExceptionGrant referenced by a VOIDED amendment via exception_grant_id and currently ACTIVE -> REVOKED"
          - "CASCADE link 4 (caused by link 3 revocation): Contractor.standing_status recomputed; if any ExceptionGrant of any engagement of this contractor was REVOKED within the audit window and contractor is GOOD_STANDING -> WATCH"
          - "increments Engagement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /api/engagements/{id}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "Contractor.standing_status IN {GOOD_STANDING, WATCH} (ERR_CONTRACTOR_STANDING_SUSPENDED)"
        side_effects:
          - "the SUSPENDED ContractAgreement of this engagement -> EXECUTED (VOIDED amendments and REVOKED exceptions are NOT restored — asymmetric compensation)"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /api/engagements/{id}/terminate
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "the engagement's ContractAgreement in EXECUTED or SUSPENDED -> TERMINATED"
          - "increments Engagement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /api/engagements/{id}/terminate
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "the engagement's SUSPENDED ContractAgreement -> TERMINATED"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: CONVERTED
        trigger: system (caused by ConversionCase record-decision with decision == ACCEPTED; see ConversionCase.OFFER_EXTENDED_to_COMPLETED)
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 2 (caused by this engagement reaching CONVERTED): Contractor.standing_status := CONVERTED_TO_EMPLOYEE"
          - "CASCADE link 3 (caused by link 2 standing mutation): every OTHER engagement of the same contractor in a non-terminal status IN {DRAFT, INTAKE_SUBMITTED, CLASSIFIED, UNDER_REVIEW, INFO_REQUESTED, APPROVAL_PENDING, APPROVED} -> REJECTED"
          - "increments Engagement.version by 1"

  - entity: Contractor
    initial_state: "verification_status = UNVERIFIED, standing_status = GOOD_STANDING (parallel dimensions, evolve independently)"
    terminal_states: ["verification: (none)", "standing: CONVERTED_TO_EMPLOYEE"]
    transitions:
      - from: "verification_status == UNVERIFIED"
        to: "verification_status == VERIFIED"
        trigger: POST /api/contractors/{id}/verify with outcome == VERIFIED
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "verification_status == UNVERIFIED"
        to: "verification_status == VERIFICATION_FAILED"
        trigger: POST /api/contractors/{id}/verify with outcome == FAILED
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "verification_status == VERIFICATION_FAILED"
        to: "verification_status == VERIFIED"
        trigger: POST /api/contractors/{id}/verify with outcome == VERIFIED (re-verification after failure)
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "standing_status == GOOD_STANDING"
        to: "standing_status == WATCH"
        trigger: system (RiskAudit finalize with risk_level HIGH; or suspend-cascade link 4 exception revocation)
        actor: system
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "standing_status == WATCH"
        to: "standing_status == GOOD_STANDING"
        trigger: system (RemediationAction close that brings the audit's open_action_count to 0 while contractor has no other audit with open_action_count > 0)
        actor: system
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "standing_status IN {GOOD_STANDING, WATCH}"
        to: "standing_status == SUSPENDED_STANDING"
        trigger: system (RiskAudit finalize with risk_level CRITICAL)"
        actor: system
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]
      - from: "standing_status IN {GOOD_STANDING, WATCH, SUSPENDED_STANDING}"
        to: "standing_status == CONVERTED_TO_EMPLOYEE"
        trigger: system (ConversionCase completion cascade link 2)
        actor: system
        preconditions: []
        side_effects: ["increments Contractor.version by 1"]

  - entity: ContractAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: POST /api/contracts/{id}/execute
        actor: EngagementManager
        preconditions:
          - "Contractor.verification_status == VERIFIED (ERR_CONTRACTOR_NOT_VERIFIED)"
          - "Contractor.insurance_coverage_cents >= Jurisdiction.min_insurance_cents for the contract jurisdiction (ERR_INSURANCE_BELOW_MINIMUM)"
          - "if engagement.risk_tier == HIGH: an ACTIVE non-expired ExceptionGrant exists for the engagement (absent: ERR_EXCEPTION_REQUIRED; expired: ERR_EXCEPTION_EXPIRED)"
        side_effects: ["increments ContractAgreement.version by 1"]
      - from: EXECUTED
        to: SUSPENDED
        trigger: system (engagement suspend cascade link 1)
        actor: system
        preconditions: []
        side_effects: ["amendments PROPOSED|APPROVED -> VOIDED (cascade link 2)", "increments ContractAgreement.version by 1"]
      - from: SUSPENDED
        to: EXECUTED
        trigger: system (engagement reinstate)
        actor: system
        preconditions: []
        side_effects: ["increments ContractAgreement.version by 1"]
      - from: EXECUTED
        to: TERMINATED
        trigger: system (engagement terminate)
        actor: system
        preconditions: []
        side_effects: ["increments ContractAgreement.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: system (engagement terminate)
        actor: system
        preconditions: []
        side_effects: ["increments ContractAgreement.version by 1"]
      - from: EXECUTED
        to: EXPIRED
        trigger: system (logical clock passes end_date; evaluated lazily on read or write of the contract)"
        actor: system
        preconditions: ["clock date > end_date"]
        side_effects: ["increments ContractAgreement.version by 1"]

  - entity: ContractAmendment
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED, VOIDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /api/amendments/{id}/approve with decision == APPROVED
        actor: LegalApprover
        preconditions: ["parent ContractAgreement.status == EXECUTED (ERR_INVALID_STATE)"]
        side_effects: ["increments ContractAmendment.version by 1"]
      - from: APPROVED
        to: APPLIED
        trigger: system (immediately after approval, same request)
        actor: system
        preconditions: []
        side_effects:
          - "applies new_rate_cents / new_end_date to the parent ContractAgreement and increments ContractAgreement.version by 1"
          - "recomputes Engagement.scope_creep_index (amendment count input increases)"
      - from: PROPOSED
        to: REJECTED
        trigger: POST /api/amendments/{id}/approve with decision == REJECTED
        actor: LegalApprover
        preconditions: []
        side_effects: ["increments ContractAmendment.version by 1"]
      - from: PROPOSED
        to: VOIDED
        trigger: system (engagement suspend cascade link 2)
        actor: system
        preconditions: []
        side_effects: ["linked ACTIVE ExceptionGrant -> REVOKED (cascade link 3)"]
      - from: APPROVED
        to: VOIDED
        trigger: system (engagement suspend cascade link 2 fires before the same-request apply when the suspend lands first in request order)"
        actor: system
        preconditions: []
        side_effects: ["linked ACTIVE ExceptionGrant -> REVOKED (cascade link 3)"]

  - entity: ExceptionGrant
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: system (logical clock passes expires_at; evaluated lazily whenever the grant is read or used as a precondition)
        actor: system
        preconditions: ["clock instant > expires_at"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: POST /api/exceptions/{id}/revoke
        actor: ComplianceBoardMember
        preconditions: []
        side_effects:
          - "Contractor.standing_status recomputed for the grant's engagement's contractor: GOOD_STANDING -> WATCH"
          - "increments ExceptionGrant.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: system (engagement suspend cascade link 3)
        actor: system
        preconditions: []
        side_effects: ["Contractor standing recompute (cascade link 4)"]

  - entity: MonitoringReview
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: POST /api/reviews/{id}/close
        actor: ComplianceOfficer
        preconditions:
          - "if findings non-empty: remediation_action_ids non-empty and every referenced RemediationAction has status == OPEN and belongs to a RiskAudit of the same contractor as the review's engagement (ERR_REVIEW_NOT_CLOSABLE)"
        side_effects:
          - "findings_count := len(findings); outcome := CLEARED when findings_count == 0 else FINDINGS_FILED"
          - "recomputes Engagement.scope_creep_index (review outcome input)"
          - "increments MonitoringReview.version by 1"

  - entity: RiskAudit
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FINDINGS_FINALIZED
        trigger: POST /api/audits/{id}/finalize
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "runs calculations.reclassification_risk_score final variant over fieldwork_events; sets final_risk_score and risk_level"
          - "risk_level == HIGH => Contractor.standing_status GOOD_STANDING -> WATCH; risk_level == CRITICAL => GOOD_STANDING|WATCH -> SUSPENDED_STANDING"
          - "risk_level IN {HIGH, CRITICAL} => status continues to REMEDIATION automatically (compound transition)"
          - "increments RiskAudit.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: POST /api/audits/{id}/close (screening audit closed without findings)
        actor: ComplianceOfficer
        preconditions:
          - "audit_type == SCREENING (ERR_INVALID_STATE)"
          - "open_action_count == 0 (ERR_AUDIT_ACTIONS_OPEN)"
        side_effects: ["increments RiskAudit.version by 1"]
      - from: FINDINGS_FINALIZED
        to: REMEDIATION
        trigger: system (automatic when finalized risk_level IN {HIGH, CRITICAL})
        actor: system
        preconditions: []
        side_effects: []
      - from: FINDINGS_FINALIZED
        to: CLOSED
        trigger: POST /api/audits/{id}/close
        actor: ComplianceOfficer
        preconditions: ["risk_level IN {LOW, MODERATE} (ERR_INVALID_STATE)", "open_action_count == 0 (ERR_AUDIT_ACTIONS_OPEN)"]
        side_effects: ["increments RiskAudit.version by 1"]
      - from: REMEDIATION
        to: CLOSED
        trigger: POST /api/audits/{id}/close
        actor: ComplianceOfficer
        preconditions: ["open_action_count == 0 (ERR_AUDIT_ACTIONS_OPEN)"]
        side_effects: ["increments RiskAudit.version by 1"]

  - entity: RemediationAction
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /api/remediation-actions/{id}/close with outcome == CLOSED
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "RiskAudit.open_action_count -= 1"
          - "if parent audit open_action_count reaches 0 and contractor standing_status == WATCH and no other audit of that contractor has open_action_count > 0: standing_status -> GOOD_STANDING"
          - "increments RemediationAction.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: POST /api/remediation-actions/{id}/close with outcome == WAIVED
        actor: ComplianceOfficer
        preconditions: ["close_note non-empty (ERR_INVALID_REQUEST)"]
        side_effects:
          - "RiskAudit.open_action_count -= 1 (same contractor-standing restore rule as CLOSED)"
          - "increments RemediationAction.version by 1"

  - entity: TaxForm1099Filing
    initial_state: DRAFT
    terminal_states: [VOID, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/filings/{id}/submit
        actor: TaxReportingSpecialist
        preconditions:
          - "Contractor.verification_status == VERIFIED (ERR_CONTRACTOR_NOT_VERIFIED)"
          - "if kind == CORRECTION: corrects_filing_id references a filing with status ACCEPTED (ERR_CORRECTION_REQUIRES_ACCEPTED)"
        side_effects:
          - "filed_at := clock; days_late and penalty_cents computed per calculations.late_filing_penalty"
          - "if kind == CORRECTION: the corrected filing ACCEPTED -> SUPERSEDED (its signed amount leaves lifetime_reported_cents; this filing's enters)"
          - "Contractor.lifetime_reported_cents recomputed per calculations.contractor_lifetime_reported_reconciliation"
          - "increments TaxForm1099Filing.version by 1"
      - from: REJECTED_AGENCY
        to: SUBMITTED
        trigger: POST /api/filings/{id}/submit (resubmission cycle after agency rejection)
        actor: TaxReportingSpecialist
        preconditions:
          - "Contractor.verification_status == VERIFIED (ERR_CONTRACTOR_NOT_VERIFIED)"
        side_effects:
          - "days_late and penalty_cents recomputed against the new clock position"
          - "Contractor.lifetime_reported_cents recomputed"
          - "increments TaxForm1099Filing.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /api/filings/{id}/agency-response with outcome == ACCEPTED
        actor: TaxReportingSpecialist
        preconditions: []
        side_effects: ["increments TaxForm1099Filing.version by 1"]
      - from: SUBMITTED
        to: REJECTED_AGENCY
        trigger: POST /api/filings/{id}/agency-response with outcome == REJECTED
        actor: TaxReportingSpecialist
        preconditions: []
        side_effects: ["Contractor.lifetime_reported_cents recomputed (REJECTED_AGENCY excluded)", "increments TaxForm1099Filing.version by 1"]
      - from: SUBMITTED
        to: VOID
        trigger: POST /api/filings/{id}/correct with mode == VOID
        actor: TaxReportingSpecialist
        preconditions: []
        side_effects: ["Contractor.lifetime_reported_cents recomputed (VOID excluded — compensating action of submit)", "increments TaxForm1099Filing.version by 1"]
      - from: ACCEPTED
        to: VOID
        trigger: POST /api/filings/{id}/correct with mode == VOID
        actor: TaxReportingSpecialist
        preconditions: []
        side_effects: ["Contractor.lifetime_reported_cents recomputed (VOID excluded)", "increments TaxForm1099Filing.version by 1"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: system (a CORRECTION filing naming this filing in corrects_filing_id is submitted)
        actor: system
        preconditions: []
        side_effects: ["Contractor.lifetime_reported_cents recomputed (SUPERSEDED excluded, correction included)", "increments TaxForm1099Filing.version by 1"]

  - entity: AgencyInquiry
    initial_state: RECEIVED
    terminal_states: [RESOLVED]
    transitions:
      - from: RECEIVED
        to: RESPONSE_SUBMITTED
        trigger: POST /api/inquiries/{id}/respond
        actor: AgencyLiaison
        preconditions: ["clock instant <= response_deadline (ERR_INQUIRY_DEADLINE_PASSED)"]
        side_effects: ["increments AgencyInquiry.version by 1"]
      - from: AUDIT_OPENED
        to: RESPONSE_SUBMITTED
        trigger: POST /api/inquiries/{id}/respond (new response round after escalation; cycle)
        actor: AgencyLiaison
        preconditions: ["clock instant <= response_deadline (ERR_INQUIRY_DEADLINE_PASSED; deadline is the new_response_deadline set at escalation)"]
        side_effects: ["increments AgencyInquiry.version by 1"]
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: POST /api/inquiries/{id}/resolve with outcome == RESOLVED
        actor: AgencyLiaison
        preconditions: []
        side_effects: ["increments AgencyInquiry.version by 1"]
      - from: RESPONSE_SUBMITTED
        to: AUDIT_OPENED
        trigger: POST /api/inquiries/{id}/resolve with outcome == ESCALATE_TO_AUDIT
        actor: AgencyLiaison
        preconditions: ["new_response_deadline provided and > clock (ERR_INVALID_REQUEST)"]
        side_effects:
          - "creates a RiskAudit (audit_type FIELDWORK, status OPEN) on the inquiry's contractor with engagement_id set to the inquiry's engagement (cross-entity creation)"
          - "response_deadline := new_response_deadline"
          - "increments AgencyInquiry.version by 1"

  - entity: ConversionCase
    initial_state: INITIATED
    terminal_states: [COMPLETED, DECLINED, RESCINDED]
    transitions:
      - from: INITIATED
        to: OFFER_EXTENDED
        trigger: POST /api/conversions/{id}/extend-offer
        actor: HRApprover
        preconditions: []
        side_effects: ["offer_salary_cents recorded", "increments ConversionCase.version by 1"]
      - from: OFFER_EXTENDED
        to: COMPLETED
        trigger: POST /api/conversions/{id}/record-decision with decision == ACCEPTED
        actor: EngagementManager
        preconditions: ["Engagement.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "CASCADE link 1: source Engagement ACTIVE -> CONVERTED"
          - "CASCADE link 2 (caused by link 1): Contractor.standing_status -> CONVERTED_TO_EMPLOYEE"
          - "CASCADE link 3 (caused by link 2): all other non-terminal engagements of the contractor -> REJECTED"
          - "increments ConversionCase.version by 1"
      - from: OFFER_EXTENDED
        to: DECLINED
        trigger: POST /api/conversions/{id}/record-decision with decision == DECLINED
        actor: EngagementManager
        preconditions: []
        side_effects: ["increments ConversionCase.version by 1"]
      - from: OFFER_EXTENDED
        to: RESCINDED
        trigger: POST /api/conversions/{id}/record-decision with decision == RESCINDED
        actor: EngagementManager
        preconditions: []
        side_effects: ["increments ConversionCase.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: determination-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /api/engagements/{id}/determinations"
    occ_field: expected_engagement_version
    description: |
      Creating a ClassificationDetermination against an Engagement whose
      version has advanced since the client last observed it is rejected.
      The new determination legitimately supersedes the current one, so a
      writer holding a stale engagement view must re-read before computing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: amendment-create-stale-contract
    parent_entity: ContractAgreement
    write_endpoint: "POST /api/contracts/{id}/amendments"
    occ_field: expected_contract_version
    description: |
      Creating a ContractAmendment against a ContractAgreement whose version
      has advanced since the client last observed it (e.g., another amendment
      was just applied, changing rate_cents/end_date) is rejected; the
      amendment must be re-based on the current contract terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: classification_test_application
    trigger: "POST /api/engagements/{id}/determinations (INTAKE_SUBMITTED -> CLASSIFIED or CLASSIFIED re-run)"
    algorithm: threshold
    formula: |
      Input set: the current IntakeQuestionnaire (complete == true) answers for
      the engagement; the jurisdiction test_type snapshot at computation time.
      Variant selection is by Engagement.jurisdiction.test_type ONLY.
      COMMON_LAW_WEIGHTED:
        employee-indicative flags: CONTROL_METHOD==YES, CONTROL_HOURS==YES,
        INTEGRAL_TO_BUSINESS==YES, PROFIT_LOSS==NO, PERMANENCY==YES, INVESTMENT==NO
        score = 0.25*[CONTROL_METHOD] + 0.20*[CONTROL_HOURS] + 0.20*[INTEGRAL_TO_BUSINESS]
              + 0.15*[PROFIT_LOSS] + 0.10*[PERMANENCY] + 0.10*[INVESTMENT]
        outcome = EMPLOYEE_RISK iff score >= jurisdiction.employee_score_threshold (INCLUSIVE)
        Determination.score := score (2dp); failed_prongs := 0
      ABC_TEST:
        prong_A_failed = (CONTROL_METHOD==YES OR CONTROL_HOURS==YES)
        prong_B_failed = (OUTSIDE_USUAL_BUSINESS==NO)
        prong_C_failed = (INDEPENDENT_TRADE==NO)
        outcome = CONTRACTOR iff failed prong count == 0 (any single failure => EMPLOYEE_RISK)
        Determination.score := failed prong count; failed_prongs := failed prong count
      ECONOMIC_REALITY:
        count = [CONTROL_METHOD==YES] + [INTEGRAL_TO_BUSINESS==YES] + [PROFIT_LOSS==NO]
              + [INVESTMENT==NO] + [PERMANENCY==YES] + [OUTSIDE_USUAL_BUSINESS==NO]
        outcome = EMPLOYEE_RISK iff count >= 2 (INCLUSIVE)
        Determination.score := count; failed_prongs := 0
    input_set: "IntakeQuestionnaire with revision == engagement's current revision; all 8 factor_keys required"
    constants:
      CL_WEIGHT_CONTROL_METHOD: 0.25
      CL_WEIGHT_CONTROL_HOURS: 0.20
      CL_WEIGHT_INTEGRAL: 0.20
      CL_WEIGHT_PROFIT_LOSS: 0.15
      CL_WEIGHT_PERMANENCY: 0.10
      CL_WEIGHT_INVESTMENT: 0.10
      ECONOMIC_REALITY_FAIL_COUNT: 2
    precision: "COMMON_LAW score: 2 decimal places, round_half_up; counts are integers"
    variants:
      - name: abc_test
        when: "jurisdiction.test_type == ABC_TEST"
        difference: "All-or-nothing prong test: one failed prong flips outcome to EMPLOYEE_RISK regardless of how favorable the other answers are"
      - name: common_law_weighted
        when: "jurisdiction.test_type == COMMON_LAW_WEIGHTED"
        difference: "Weighted average tolerant of isolated employee-indicative answers; identical answers that fail ABC can pass here"
      - name: economic_reality
        when: "jurisdiction.test_type == ECONOMIC_REALITY"
        difference: "Unweighted count of 6 indicative factors with a >= 2 threshold; identical answers can diverge from both other variants"

  - name: reclassification_risk_score
    trigger: "POST /api/audits (provisional variant) and POST /api/audits/{id}/finalize (final variant)"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL (at creation, forward-looking over declared data):
        P = round_half_up_1dp( 0.5 * engagement.scope_creep_index
            + 40 * [engagement current determination outcome == EMPLOYEE_RISK]
            + 10 * (count of ACTIVE ExceptionGrants on the engagement)
            + 2 * min(full calendar months between engagement.start_date and clock date, 12) )
        For portfolio audits (engagement_id null): use max(scope_creep_index) over the
        contractor's engagements in status IN {ACTIVE, SUSPENDED}, 0 when none; the
        determination term is 40 if ANY such engagement has current outcome EMPLOYEE_RISK;
        exception count sums over those engagements; months uses the earliest start_date.
      FINAL (at finalize, chronological replay of fieldwork events):
        event points per occurrence, each event type capped at 3 occurrences:
          SUPERVISION_OBSERVED 15, EQUIPMENT_PROVIDED 10, INTEGRATED_WORKFLOW 15, PAYMENT_REGULARITY 5
        F = round_half_up_1dp( 0.3 * P + sum(capped event points) )
      risk_level over (final when present else provisional):
        < 25 LOW; 25 <= x < 50 MODERATE; 50 <= x < 75 HIGH; >= 75 CRITICAL
    input_set: "Provisional: engagement declared fields; Final: fieldwork_events array supplied at finalize, replayed in array order (points are additive so order does not change the sum, only the cap application per type)"
    constants:
      PROVISIONAL_RISK_WEIGHT: 0.3
      MONTHS_CAP: 12
      EVENT_OCCURRENCE_CAP: 3
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "audit creation (OPEN)"
        difference: "Forward-looking estimate from declared data; ignores observed fieldwork — same contractor scores lower than final when fieldwork reveals supervision"
      - name: final
        when: "audit finalize (FINDINGS_FINALIZED)"
        difference: "Chronological fieldwork replay discounts the provisional to 30% weight and adds observed-event points; identical contractor data yields a different (typically higher) score than provisional"

  - name: scope_creep_index
    trigger: "Recomputed on: ContractAmendment -> APPLIED; MonitoringReview -> CLOSED; any Engagement mutation that changes rate/dates/supervision_level"
    algorithm: weighted_scoring
    formula: |
      Inputs: A = count of ContractAmendment with status == APPLIED on the engagement's contract;
              R = |current contract rate_cents - original rate_cents| / original rate_cents
                  (original = rate at EXECUTED first time; 0 when no contract exists);
              D = max(0, calendar days from engagement.end_date to clock date) — 0 before end_date;
              S = engagement.supervision_level IN {NONE, LIGHT, CLOSE}.
      raw = min(A, 5) * 12 + min(R, 0.50) * 200 + min(D, 90)
      if S == CLOSE: raw = raw * 1.5
      elif S == LIGHT: raw = raw * 1.2
      if engagement.status == SUSPENDED: raw = max(raw, 70)
      index = min(100, round_half_up_0dp(raw))
      tier: < 25 LOW; 25-49 MODERATE; 50-74 HIGH; >= 75 CRITICAL
    input_set: "Single engagement + its contract + amendments in terminal APPLIED status only (PROPOSED, REJECTED, VOIDED excluded)"
    constants:
      AMENDMENT_CAP: 5
      AMENDMENT_POINTS: 12
      RATE_VARIANCE_CAP: 0.50
      RATE_VARIANCE_MULTIPLIER: 200
      DAYS_OVERRUN_CAP: 90
      SUSPENDED_FLOOR: 70
      INDEX_CAP: 100
    precision: "integer index, round_half_up from 1dp raw"
    variants: []

  - name: conversion_lookback_compensation
    trigger: "POST /api/engagements/{id}/conversions (computed at INITIATED creation)"
    algorithm: aggregation
    formula: |
      For each of the 4 lookback_quarters entries q (processing order = array order):
        employer_cost_q = round_half_up_to_cents(q.service_fee_cents * 1.0765)
        benefits_q      = round_half_up_to_cents(employer_cost_q * 0.30)   # nested: uses ROUNDED employer_cost_q
        quarter_total_q = employer_cost_q + benefits_q
      w2_equivalent_total_cents = sum(quarter_total_q over the 4 quarters)
      lookback_delta_cents = w2_equivalent_total_cents - sum(q.service_fee_cents)
      PINNED ROUNDING ORDER: round per quarter, then sum. The alternative
      (sum bases, then apply factors and round once) yields different cents and
      is NOT compliant (fixture [1000300, 1000400, 1005200, 1003400] cents:
      pinned order 5610815 vs sum-then-round 5610814).
    input_set: "ConversionCase.lookback_quarters (exactly 4 entries, all included regardless of amounts)"
    constants:
      EMPLOYER_TAX_FACTOR: 1.0765
      BENEFITS_LOAD: 0.30
      QUARTERS: 4
    precision: "integer cents; round_half_up to whole cents at each of the two per-quarter steps"
    variants: []

  - name: reportable_amount_1099
    trigger: "POST /api/filings (creation) — computed fields fixed at creation; resubmit recomputes only days_late/penalty"
    algorithm: aggregation
    formula: |
      reportable_amount_cents = sum of payment_line_items[i].amount_cents
        where kind == SERVICE_FEE
        AND payment_date IN [tax_year-01-01, tax_year-12-31] (both endpoints INCLUSIVE)
      EXPENSE_REIMBURSEMENT items and out-of-window SERVICE_FEE items are excluded.
      federal_filing_required = reportable_amount_cents >= 60000 (INCLUSIVE boundary)
      state_filing_required   = reportable_amount_cents >= Jurisdiction.state_filing_threshold_cents (INCLUSIVE)
      signed_amount_cents = + reportable_amount_cents
    input_set: "TaxForm1099Filing.payment_line_items as submitted"
    constants:
      FEDERAL_1099_THRESHOLD_CENTS: 60000
    precision: "integer cents, no rounding"
    variants: []

  - name: late_filing_penalty
    trigger: "POST /api/filings/{id}/submit (each submit, including resubmission from REJECTED_AGENCY)"
    algorithm: tiered_pricing
    formula: |
      deadline = tax_year + 1, January 31 (date)
      days_late = max(0, calendar days from deadline to filed_at date)
      penalty_cents = 0        when days_late == 0
                    = 6000     when 1 <= days_late <= 30
                    = 13000    when 31 <= days_late <= 121
                    = 33000    when days_late >= 122
      (intentional_disregard flag is out of scope; per-form basis is exactly one form per filing)
    input_set: "Single filing's tax_year and filed_at"
    constants:
      TIER1_MAX_DAYS: 30
      TIER1_CENTS: 6000
      TIER2_MAX_DAYS: 121
      TIER2_CENTS: 13000
      TIER3_CENTS: 33000
    precision: "integer cents"
    variants: []

  - name: agency_exposure_estimate
    trigger: "POST /api/inquiries (computed at RECEIVED creation)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (the penalty tier is keyed on the PRE-penalty base,
      and interest compounds on back_payments + penalty — never on itself):
        (1) base := back_payments_cents (as alleged)
        (2) penalty_rate = 0.10 when base < 10000000
                         = 0.20 when 10000000 <= base < 100000000
                         = 0.40 when base >= 100000000
            penalty_cents = round_half_up_to_cents(base * penalty_rate)
        (3) interest_cents = round_half_up_to_cents((base + penalty_cents) * 0.05 * quarters_outstanding)  # simple interest per quarter
        (4) exposure_estimate_cents = base + penalty_cents + interest_cents
      Worked pin: base 5000000, quarters 2 => penalty 500000, interest 550000, exposure 6050000.
    input_set: "AgencyInquiry.back_payments_cents and quarters_outstanding as supplied at creation"
    constants:
      PENALTY_TIER1_LIMIT_CENTS: 10000000
      PENALTY_TIER2_LIMIT_CENTS: 100000000
      PENALTY_RATE_T1: 0.10
      PENALTY_RATE_T2: 0.20
      PENALTY_RATE_T3: 0.40
      QUARTERLY_INTEREST_RATE: 0.05
    precision: "integer cents; round_half_up to whole cents at steps (2) and (3)"
    variants: []

  - name: contractor_lifetime_reported_reconciliation
    trigger: "Any TaxForm1099Filing transition into or out of the counted set {SUBMITTED, ACCEPTED}: submit, resubmit, agency-response, correct (VOID), correction supersession"
    algorithm: aggregation
    formula: |
      Contractor.lifetime_reported_cents =
        sum of signed_amount_cents over all TaxForm1099Filing rows
        with contractor_id == Contractor.id AND status IN {SUBMITTED, ACCEPTED}
      DRAFT, REJECTED_AGENCY, SUPERSEDED, VOID rows contribute nothing.
      INVARIANT (compensating pair): a submit followed by a VOID correction of the
      same filing returns lifetime_reported_cents to its pre-submit value exactly.
    input_set: "All filings of the contractor, filtered by status as stated"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles (RBAC)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, enum values in their declared sets, dates parseable, lookback_quarters length == 4, close_note non-empty when outcome == WAIVED, new_response_deadline present and future when outcome == ESCALATE_TO_AUDIT, corrects_filing_id present iff kind == CORRECTION and null otherwise", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path resources exist, validated left-to-right: contractor (ERR_CONTRACTOR_NOT_FOUND), engagement (ERR_ENGAGEMENT_NOT_FOUND), any other entity (ERR_RESOURCE_NOT_FOUND)", error_id: ERR_CONTRACTOR_NOT_FOUND, http_status: 404, applies_to: "endpoints with {id} path params" }
  - { priority: 4, category: existence, check: "Engagement path resource exists", error_id: ERR_ENGAGEMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints under /api/engagements/{id}" }
  - { priority: 4, category: existence, check: "Contract, amendment, review, audit, remediation action, filing, inquiry, conversion, exception, jurisdiction referenced in path or body exist", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all other id-referencing endpoints" }
  - { priority: 5, category: state, check: "Generic invalid-from: transition not defined from the entity's current status (includes terminal lockdown of REJECTED/TERMINATED/CONVERTED engagements, VOID/SUPERSEDED filings, CLOSED audits/reviews, terminal amendments, RESOLVED inquiries, terminal conversions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "submit-review requires a current determination to exist", error_id: ERR_DETERMINATION_REQUIRED, http_status: 409, applies_to: ["POST /api/engagements/{id}/submit-review"] }
  - { priority: 5, category: state, check: "approve requires status APPROVAL_PENDING", error_id: ERR_ENGAGEMENT_NOT_APPROVAL_PENDING, http_status: 409, applies_to: ["POST /api/engagements/{id}/approve"] }
  - { priority: 5, category: state, check: "activate requires an EXECUTED contract for the engagement", error_id: ERR_CONTRACT_NOT_EXECUTED, http_status: 409, applies_to: ["POST /api/engagements/{id}/activate"] }
  - { priority: 5, category: state, check: "submit requires filing status IN {DRAFT, REJECTED_AGENCY}", error_id: ERR_FILING_NOT_SUBMITTABLE, http_status: 409, applies_to: ["POST /api/filings/{id}/submit"] }
  - { priority: 5, category: state, check: "CORRECTION filing submit requires the corrected filing to be ACCEPTED", error_id: ERR_CORRECTION_REQUIRES_ACCEPTED, http_status: 409, applies_to: ["POST /api/filings/{id}/submit"] }
  - { priority: 5, category: state, check: "remediation action creation requires audit status IN {FINDINGS_FINALIZED, REMEDIATION}", error_id: ERR_AUDIT_NOT_OPEN, http_status: 409, applies_to: ["POST /api/audits/{id}/remediation-actions"] }
  - { priority: 5, category: state, check: "audit close requires open_action_count == 0", error_id: ERR_AUDIT_ACTIONS_OPEN, http_status: 409, applies_to: ["POST /api/audits/{id}/close"] }
  - { priority: 5, category: state, check: "conversion creation requires engagement status IN {ACTIVE, SUSPENDED}", error_id: ERR_CONVERSION_NOT_POSSIBLE, http_status: 409, applies_to: ["POST /api/engagements/{id}/conversions"] }
  - { priority: 5, category: state, check: "OCC: expected_engagement_version == Engagement.version / expected_contract_version == ContractAgreement.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /api/engagements/{id}/determinations"] }
  - { priority: 5, category: state, check: "OCC: expected_contract_version == ContractAgreement.version", error_id: ERR_STALE_CONTRACT_VERSION, http_status: 412, applies_to: ["POST /api/contracts/{id}/amendments"] }
  - { priority: 6, category: business_safety, check: "Contractor standing gate: engagement creation and activation require standing_status IN {GOOD_STANDING, WATCH}", error_id: ERR_CONTRACTOR_STANDING_SUSPENDED, http_status: 422, applies_to: ["POST /api/engagements", "POST /api/engagements/{id}/activate", "POST /api/engagements/{id}/reinstate"] }
  - { priority: 6, category: business_safety, check: "Contractor verification gate: contract execute and filing submit require verification_status == VERIFIED", error_id: ERR_CONTRACTOR_NOT_VERIFIED, http_status: 422, applies_to: ["POST /api/contracts/{id}/execute", "POST /api/filings/{id}/submit"] }
  - { priority: 6, category: business_safety, check: "Insurance floor: contract execute requires contractor.insurance_coverage_cents >= jurisdiction.min_insurance_cents", error_id: ERR_INSURANCE_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /api/contracts/{id}/execute"] }
  - { priority: 6, category: business_safety, check: "HIGH risk tier requires an ACTIVE ExceptionGrant for the engagement before the final approval step and before contract execute; absent grant", error_id: ERR_EXCEPTION_REQUIRED, http_status: 422, applies_to: ["POST /api/engagements/{id}/approve", "POST /api/contracts/{id}/execute"] }
  - { priority: 7, category: business_constraint, check: "Approval chain order: acting role must equal the next role in APPROVAL_SEQUENCE for this engagement's required_approval_count", error_id: ERR_APPROVAL_OUT_OF_ORDER, http_status: 409, applies_to: ["POST /api/engagements/{id}/approve"] }
  - { priority: 7, category: business_constraint, check: "Segregation of duties: acting X-User-ID must not already appear in this engagement's approvals_recorded", error_id: ERR_APPROVER_ALREADY_ACTED, http_status: 409, applies_to: ["POST /api/engagements/{id}/approve"] }
  - { priority: 7, category: business_constraint, check: "Questionnaire completeness: submit-review and determination require all 8 factor_keys answered exactly once", error_id: ERR_QUESTIONNAIRE_INCOMPLETE, http_status: 422, applies_to: ["POST /api/engagements/{id}/submit-review", "POST /api/engagements/{id}/determinations"] }
  - { priority: 7, category: business_constraint, check: "Uniqueness: at most one non-VOID, non-SUPERSEDED ORIGINAL filing per (contractor_id, tax_year)", error_id: ERR_DUPLICATE_FILING, http_status: 409, applies_to: ["POST /api/filings"] }
  - { priority: 7, category: business_constraint, check: "Contract half-open interval overlap: no two contracts for the same (contractor_id, jurisdiction_id) with status IN {DRAFT, EXECUTED, SUSPENDED} may satisfy new.start < existing.end AND existing.start < new.end; adjacency (new.start == existing.end) is ALLOWED", error_id: ERR_CONTRACT_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /api/engagements/{id}/contracts"] }
  - { priority: 7, category: business_constraint, check: "Review minimum gap: |new.scheduled_date - existing.scheduled_date| >= 30 days against every other review of the engagement (any status); exactly 30 days is ALLOWED, 29 rejected", error_id: ERR_REVIEW_INTERVAL_TOO_SHORT, http_status: 409, applies_to: ["POST /api/engagements/{id}/reviews"] }
  - { priority: 8, category: business_temporal, check: "Determination freshness: submit-approval requires current determination's questionnaire_revision == IntakeQuestionnaire.revision", error_id: ERR_DETERMINATION_STALE, http_status: 409, applies_to: ["POST /api/engagements/{id}/submit-approval"] }
  - { priority: 8, category: business_temporal, check: "Inquiry response deadline: respond requires clock instant <= response_deadline", error_id: ERR_INQUIRY_DEADLINE_PASSED, http_status: 422, applies_to: ["POST /api/inquiries/{id}/respond"] }
  - { priority: 9, category: business_referential, check: "Exception expiry: an ExceptionGrant referenced as approval/execute/amendment support whose expires_at < clock is EXPIRED and cannot satisfy the requirement", error_id: ERR_EXCEPTION_EXPIRED, http_status: 422, applies_to: ["POST /api/engagements/{id}/approve", "POST /api/contracts/{id}/execute", "POST /api/contracts/{id}/amendments"] }
  - { priority: 9, category: business_referential, check: "Review close linkage: findings non-empty requires remediation_action_ids referencing OPEN RemediationActions of an audit on the same contractor", error_id: ERR_REVIEW_NOT_CLOSABLE, http_status: 422, applies_to: ["POST /api/reviews/{id}/close"] }
  - { priority: 10, category: business_fiscal, check: "Exception capacity: count of ACTIVE ExceptionGrants across engagements of the jurisdiction must be < Jurisdiction.max_active_exceptions before granting another", error_id: ERR_EXCEPTION_CAPACITY_REACHED, http_status: 422, applies_to: ["POST /api/engagements/{id}/exceptions"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- administration / configuration ---
  - { method: POST, path: "/api/jurisdictions", description: "Create a jurisdiction classification regime", roles: [PlatformAdmin], code: 201, input: [code, test_type, "employee_score_threshold?", state_filing_threshold_cents, max_active_exceptions, min_insurance_cents, "description?"], output: Jurisdiction, side_effects: [] }
  - { method: GET, path: "/api/jurisdictions", description: "List jurisdictions", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["test_type?", "limit?", "offset?"], output: "Jurisdiction[]", side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["lazy EXPIRED evaluation for ExceptionGrant and ContractAgreement on subsequent reads/writes"] }

  # --- contractors ---
  - { method: POST, path: "/api/contractors", description: "Register a contractor (business entity or individual)", roles: [EngagementManager], code: 201, input: [legal_name, entity_type, ein, insurance_coverage_cents], output: Contractor, side_effects: ["verification_status := UNVERIFIED, standing_status := GOOD_STANDING, lifetime_reported_cents := 0"] }
  - { method: GET, path: "/api/contractors", description: "List contractors with filters", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["standing_status?", "verification_status?", "limit?", "offset?"], output: "Contractor[]", side_effects: [] }
  - { method: GET, path: "/api/contractors/{id}", description: "Read one contractor (both parallel status dimensions, lifetime_reported_cents)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: Contractor, side_effects: [] }
  - { method: POST, path: "/api/contractors/{id}/verify", description: "Business entity verification decision (EIN/registry/insurance check outcome)", roles: [ComplianceOfficer], code: 200, input: [outcome, "notes?"], output: Contractor, side_effects: ["verification_status transition per Contractor machine", "increments Contractor.version by 1"] }

  # --- engagements ---
  - { method: POST, path: "/api/engagements", description: "Open an engagement intake in DRAFT", roles: [EngagementManager], code: 201, input: [contractor_id, jurisdiction_id, title, scope_description, agreed_rate_cents, rate_unit, start_date, end_date, "supervision_level?"], output: Engagement, side_effects: ["status := DRAFT", "gate: contractor standing IN {GOOD_STANDING, WATCH}"] }
  - { method: GET, path: "/api/engagements", description: "List engagements with filters", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["contractor_id?", "jurisdiction_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/api/engagements/{id}", description: "Read one engagement (risk_tier, approvals_recorded, scope_creep_index)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/api/engagements/{id}/questionnaire", description: "Submit or resubmit the intake questionnaire (upsert; revision increments; DRAFT->INTAKE_SUBMITTED, INFO_REQUESTED->UNDER_REVIEW, CLASSIFIED->CLASSIFIED with staleness; other statuses reject ERR_INVALID_STATE)", roles: [EngagementManager], code: 200, input: [answers], output: IntakeQuestionnaire, side_effects: ["Engagement transitions per machine", "questionnaire.revision += 1 (starts at 1)", "increments Engagement.version by 1"] }
  - { method: GET, path: "/api/engagements/{id}/questionnaire", description: "Reverse-reachability: questionnaire of an engagement (array of length 0 or 1)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "IntakeQuestionnaire[]", side_effects: [] }
  - { method: POST, path: "/api/engagements/{id}/determinations", description: "Run the jurisdiction classification test; OCC-guarded; new determination supersedes the prior current one", roles: [ClassificationAnalyst], code: 201, input: [expected_engagement_version], output: ClassificationDetermination, side_effects: ["classification_test_application", "Engagement.current_determination_id updated; risk_tier, required_approval_count recomputed", "increments Engagement.version by 1"] }
  - { method: GET, path: "/api/engagements/{id}/determinations", description: "Reverse-reachability: all determinations of an engagement, newest first", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "ClassificationDetermination[]", side_effects: [] }
  - { method: POST, path: "/api/engagements/{id}/submit-review", description: "CLASSIFIED -> UNDER_REVIEW", roles: [EngagementManager], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/request-info", description: "UNDER_REVIEW -> INFO_REQUESTED (review loop opens)", roles: [ClassificationAnalyst], code: 200, input: [reason], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/submit-approval", description: "UNDER_REVIEW -> APPROVAL_PENDING; requires fresh determination", roles: [ClassificationAnalyst], code: 200, input: [], output: Engagement, side_effects: ["approvals_recorded := []", "increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/approve", description: "Record the next quorum approval; auto APPROVED when quorum reached; segregation of duties enforced", roles: [HRApprover, LegalApprover, ComplianceBoardMember], code: 200, input: [], output: Engagement, side_effects: ["append approval entry", "auto-transition to APPROVED at quorum", "increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/reject", description: "UNDER_REVIEW or APPROVAL_PENDING -> REJECTED", roles: [ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember], code: 200, input: [reason], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/activate", description: "APPROVED -> ACTIVE; requires EXECUTED contract and contractor standing", roles: [EngagementManager], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/suspend", description: "ACTIVE -> SUSPENDED; fires cascade: contract -> amendments -> exceptions -> contractor standing", roles: [ComplianceOfficer], code: 200, input: [], output: Engagement, side_effects: ["suspend cascade links 1-4 per Engagement machine", "increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/reinstate", description: "SUSPENDED -> ACTIVE; contract restored to EXECUTED; voided amendments/revoked exceptions NOT restored", roles: [ComplianceOfficer], code: 200, input: [], output: Engagement, side_effects: ["contract SUSPENDED -> EXECUTED", "increments Engagement.version by 1"] }
  - { method: POST, path: "/api/engagements/{id}/terminate", description: "ACTIVE|SUSPENDED -> TERMINATED; contract terminated", roles: [ComplianceOfficer], code: 200, input: [], output: Engagement, side_effects: ["contract -> TERMINATED", "increments Engagement.version by 1"] }

  # --- exceptions ---
  - { method: POST, path: "/api/engagements/{id}/exceptions", description: "Grant a documented classification-risk exception (capacity-gated per jurisdiction)", roles: [ComplianceBoardMember], code: 201, input: [justification, expires_at], output: ExceptionGrant, side_effects: ["status := ACTIVE", "granted_by_user_id := X-User-ID"] }
  - { method: GET, path: "/api/engagements/{id}/exceptions", description: "Reverse-reachability: exceptions of an engagement", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "ExceptionGrant[]", side_effects: ["lazy EXPIRED evaluation"] }
  - { method: POST, path: "/api/exceptions/{id}/revoke", description: "ACTIVE -> REVOKED; contractor standing recomputed to WATCH", roles: [ComplianceBoardMember], code: 200, input: [], output: ExceptionGrant, side_effects: ["Contractor GOOD_STANDING -> WATCH", "increments ExceptionGrant.version by 1"] }

  # --- contracts & amendments ---
  - { method: POST, path: "/api/engagements/{id}/contracts", description: "Draft a contract for an APPROVED or ACTIVE engagement; half-open overlap check per (contractor, jurisdiction)", roles: [EngagementManager], code: 201, input: [start_date, end_date, rate_cents, rate_unit], output: ContractAgreement, side_effects: ["status := DRAFT", "contractor_id/jurisdiction_id denormalized from engagement"] }
  - { method: GET, path: "/api/engagements/{id}/contracts", description: "Reverse-reachability: contracts of an engagement", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "ContractAgreement[]", side_effects: ["lazy EXPIRED evaluation"] }
  - { method: GET, path: "/api/contracts/{id}", description: "Read one contract", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: ContractAgreement, side_effects: ["lazy EXPIRED evaluation"] }
  - { method: GET, path: "/api/contracts", description: "List contracts with filters (reverse-reachability for contractor_id / jurisdiction_id FKs)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["contractor_id?", "jurisdiction_id?", "engagement_id?", "status?", "limit?", "offset?"], output: "ContractAgreement[]", side_effects: [] }
  - { method: POST, path: "/api/contracts/{id}/execute", description: "DRAFT -> EXECUTED; gates: contractor VERIFIED, insurance floor, HIGH-tier exception", roles: [EngagementManager], code: 200, input: [], output: ContractAgreement, side_effects: ["increments ContractAgreement.version by 1"] }
  - { method: POST, path: "/api/contracts/{id}/amendments", description: "Propose an amendment; OCC-guarded on contract version; exception_grant_id required when engagement risk_tier == HIGH", roles: [EngagementManager], code: 201, input: [expected_contract_version, scope_change_summary, "new_rate_cents?", "new_end_date?", "exception_grant_id?"], output: ContractAmendment, side_effects: ["status := PROPOSED", "increments ContractAgreement.version by 1"] }
  - { method: GET, path: "/api/contracts/{id}/amendments", description: "Reverse-reachability: amendments of a contract", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "ContractAmendment[]", side_effects: [] }
  - { method: POST, path: "/api/amendments/{id}/approve", description: "PROPOSED -> APPROVED -> APPLIED (same request) or -> REJECTED; applying bumps contract version and recomputes scope_creep_index", roles: [LegalApprover], code: 200, input: [decision], output: ContractAmendment, side_effects: ["on APPROVED: contract fields updated, scope_creep_index recomputed", "increments ContractAmendment.version by 1"] }

  # --- monitoring reviews ---
  - { method: POST, path: "/api/engagements/{id}/reviews", description: "Schedule a monitoring review; engagement must be ACTIVE; 30-day minimum gap rule", roles: [ComplianceOfficer], code: 201, input: [scheduled_date], output: MonitoringReview, side_effects: ["status := SCHEDULED"] }
  - { method: GET, path: "/api/engagements/{id}/reviews", description: "Reverse-reachability: reviews of an engagement", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "MonitoringReview[]", side_effects: [] }
  - { method: POST, path: "/api/reviews/{id}/close", description: "SCHEDULED -> CLOSED with findings; zero findings => CLEARED; findings require linked OPEN remediation actions of same contractor", roles: [ComplianceOfficer], code: 200, input: [findings, remediation_action_ids], output: MonitoringReview, side_effects: ["outcome := CLEARED | FINDINGS_FILED", "scope_creep_index recomputed", "increments MonitoringReview.version by 1"] }

  # --- risk audits & remediation ---
  - { method: POST, path: "/api/audits", description: "Open a reclassification risk audit; provisional risk score computed", roles: [ComplianceOfficer], code: 201, input: [contractor_id, "engagement_id?", audit_type], output: RiskAudit, side_effects: ["provisional_risk_score computed", "status := OPEN"] }
  - { method: GET, path: "/api/audits", description: "List audits (reverse-reachability for contractor_id / engagement_id FKs)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["contractor_id?", "engagement_id?", "status?", "limit?", "offset?"], output: "RiskAudit[]", side_effects: [] }
  - { method: GET, path: "/api/audits/{id}", description: "Read one audit (scores, level, open_action_count)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: RiskAudit, side_effects: [] }
  - { method: POST, path: "/api/audits/{id}/finalize", description: "OPEN -> FINDINGS_FINALIZED (-> REMEDIATION when HIGH|CRITICAL); final score, standing side effects", roles: [ComplianceOfficer], code: 200, input: [fieldwork_events, findings_summary], output: RiskAudit, side_effects: ["reclassification_risk_score final variant", "contractor standing transition per level", "increments RiskAudit.version by 1"] }
  - { method: POST, path: "/api/audits/{id}/remediation-actions", description: "Create a remediation action on a finalized audit", roles: [ComplianceOfficer], code: 201, input: [description, severity, due_date], output: RemediationAction, side_effects: ["RiskAudit.open_action_count += 1"] }
  - { method: GET, path: "/api/audits/{id}/remediation-actions", description: "Reverse-reachability: actions of an audit", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "RemediationAction[]", side_effects: [] }
  - { method: POST, path: "/api/remediation-actions/{id}/close", description: "OPEN -> CLOSED | WAIVED; decrements audit open_action_count; may restore contractor standing", roles: [ComplianceOfficer], code: 200, input: [outcome, "close_note?"], output: RemediationAction, side_effects: ["RiskAudit.open_action_count -= 1", "standing restore rule per RemediationAction machine"] }
  - { method: POST, path: "/api/audits/{id}/close", description: "Close an audit: OPEN (SCREENING only), FINDINGS_FINALIZED (LOW|MODERATE), or REMEDIATION with zero open actions", roles: [ComplianceOfficer], code: 200, input: [], output: RiskAudit, side_effects: ["increments RiskAudit.version by 1"] }

  # --- 1099 filings ---
  - { method: POST, path: "/api/filings", description: "Create a 1099 filing (ORIGINAL or CORRECTION); reportable amount, thresholds, signed amount computed at creation", roles: [TaxReportingSpecialist], code: 201, input: [contractor_id, state_jurisdiction_id, tax_year, payment_line_items, "kind?", "corrects_filing_id?"], output: TaxForm1099Filing, side_effects: ["reportable_amount_1099 computed", "status := DRAFT"] }
  - { method: GET, path: "/api/filings", description: "List filings (reverse-reachability for contractor_id / state_jurisdiction_id / corrects_filing_id FKs)", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["contractor_id?", "state_jurisdiction_id?", "corrects_filing_id?", "tax_year?", "status?", "limit?", "offset?"], output: "TaxForm1099Filing[]", side_effects: [] }
  - { method: GET, path: "/api/filings/{id}", description: "Read one filing", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: TaxForm1099Filing, side_effects: [] }
  - { method: POST, path: "/api/filings/{id}/submit", description: "DRAFT|REJECTED_AGENCY -> SUBMITTED; verification gate; penalty computed; correction supersedes its target", roles: [TaxReportingSpecialist], code: 200, input: [], output: TaxForm1099Filing, side_effects: ["late_filing_penalty", "lifetime_reported_cents reconciled", "corrected filing -> SUPERSEDED when CORRECTION", "increments TaxForm1099Filing.version by 1"] }
  - { method: POST, path: "/api/filings/{id}/agency-response", description: "Record agency acknowledgement: SUBMITTED -> ACCEPTED | REJECTED_AGENCY", roles: [TaxReportingSpecialist], code: 200, input: [outcome], output: TaxForm1099Filing, side_effects: ["lifetime_reported_cents reconciled", "increments TaxForm1099Filing.version by 1"] }
  - { method: POST, path: "/api/filings/{id}/correct", description: "VOID correction: SUBMITTED|ACCEPTED -> VOID (compensating action of submit)", roles: [TaxReportingSpecialist], code: 200, input: [mode, reason], output: TaxForm1099Filing, side_effects: ["lifetime_reported_cents reconciled (VOID excluded)", "increments TaxForm1099Filing.version by 1"] }

  # --- agency inquiries ---
  - { method: POST, path: "/api/engagements/{id}/inquiries", description: "Register an incoming agency inquiry against an engagement; exposure estimate computed", roles: [AgencyLiaison], code: 201, input: [agency_type, received_at, response_deadline, back_payments_cents, quarters_outstanding], output: AgencyInquiry, side_effects: ["agency_exposure_estimate computed", "status := RECEIVED"] }
  - { method: GET, path: "/api/engagements/{id}/inquiries", description: "Reverse-reachability: inquiries of an engagement", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "AgencyInquiry[]", side_effects: [] }
  - { method: GET, path: "/api/inquiries", description: "List inquiries with filters", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: ["engagement_id?", "status?", "limit?", "offset?"], output: "AgencyInquiry[]", side_effects: [] }
  - { method: POST, path: "/api/inquiries/{id}/respond", description: "RECEIVED|AUDIT_OPENED -> RESPONSE_SUBMITTED; deadline enforced (temporal)", roles: [AgencyLiaison], code: 200, input: [response_summary], output: AgencyInquiry, side_effects: ["increments AgencyInquiry.version by 1"] }
  - { method: POST, path: "/api/inquiries/{id}/resolve", description: "RESPONSE_SUBMITTED -> RESOLVED, or -> AUDIT_OPENED (escalation creates a FIELDWORK RiskAudit, sets new deadline)", roles: [AgencyLiaison], code: 200, input: [outcome, "new_response_deadline?"], output: AgencyInquiry, side_effects: ["on ESCALATE_TO_AUDIT: RiskAudit created (OPEN)", "increments AgencyInquiry.version by 1"] }

  # --- conversions ---
  - { method: POST, path: "/api/engagements/{id}/conversions", description: "Open a conversion-to-employment case; lookback compensation computed at creation", roles: [ComplianceOfficer], code: 201, input: [lookback_quarters], output: ConversionCase, side_effects: ["conversion_lookback_compensation computed", "status := INITIATED"] }
  - { method: GET, path: "/api/engagements/{id}/conversions", description: "Reverse-reachability: conversion cases of an engagement", roles: [PlatformAdmin, EngagementManager, ClassificationAnalyst, HRApprover, LegalApprover, ComplianceBoardMember, ComplianceOfficer, TaxReportingSpecialist, AgencyLiaison], code: 200, input: [], output: "ConversionCase[]", side_effects: [] }
  - { method: POST, path: "/api/conversions/{id}/extend-offer", description: "INITIATED -> OFFER_EXTENDED with salary offer", roles: [HRApprover], code: 200, input: [offer_salary_cents], output: ConversionCase, side_effects: ["increments ConversionCase.version by 1"] }
  - { method: POST, path: "/api/conversions/{id}/record-decision", description: "OFFER_EXTENDED -> COMPLETED (acceptance cascade) | DECLINED | RESCINDED", roles: [EngagementManager], code: 200, input: [decision], output: ConversionCase, side_effects: ["on ACCEPTED: conversion cascade links 1-3 per ConversionCase machine", "increments ConversionCase.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, malformed date, lookback_quarters != 4, missing waiver note, missing escalation deadline, corrects_filing_id mismatch with kind" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "contractor_id or contractor path id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagement path id does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Contract, amendment, review, audit, remediation action, filing, inquiry, conversion, exception, or jurisdiction id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from current status (includes terminal lockdown)" }
  - { id: ERR_DETERMINATION_REQUIRED, http: 409, condition: "submit-review without a current determination" }
  - { id: ERR_DETERMINATION_STALE, http: 409, condition: "submit-approval with determination.questionnaire_revision != questionnaire.revision" }
  - { id: ERR_QUESTIONNAIRE_INCOMPLETE, http: 422, condition: "Fewer than 8 factor_keys answered, or duplicate factor_key entries" }
  - { id: ERR_ENGAGEMENT_NOT_APPROVAL_PENDING, http: 409, condition: "approve called when status != APPROVAL_PENDING" }
  - { id: ERR_APPROVAL_OUT_OF_ORDER, http: 409, condition: "Acting role is not the next role in the engagement's approval sequence" }
  - { id: ERR_APPROVER_ALREADY_ACTED, http: 409, condition: "Segregation of duties: X-User-ID already recorded in approvals_recorded" }
  - { id: ERR_EXCEPTION_REQUIRED, http: 422, condition: "HIGH risk tier approval quorum / contract execute requires an ACTIVE ExceptionGrant and none exists" }
  - { id: ERR_EXCEPTION_EXPIRED, http: 422, condition: "Referenced ExceptionGrant exists but expires_at < clock (status EXPIRED)" }
  - { id: ERR_EXCEPTION_CAPACITY_REACHED, http: 422, condition: "Jurisdiction already at max_active_exceptions ACTIVE grants" }
  - { id: ERR_CONTRACTOR_NOT_VERIFIED, http: 422, condition: "verification_status != VERIFIED at contract execute or filing submit" }
  - { id: ERR_CONTRACTOR_STANDING_SUSPENDED, http: 422, condition: "standing_status IN {SUSPENDED_STANDING, CONVERTED_TO_EMPLOYEE} blocks engagement create/activate/reinstate" }
  - { id: ERR_INSURANCE_BELOW_MINIMUM, http: 422, condition: "insurance_coverage_cents < jurisdiction.min_insurance_cents at contract execute" }
  - { id: ERR_CONTRACT_NOT_EXECUTED, http: 409, condition: "activate without an EXECUTED contract for the engagement" }
  - { id: ERR_CONTRACT_PERIOD_OVERLAP, http: 409, condition: "Half-open interval collision with an existing non-terminal contract for same (contractor_id, jurisdiction_id)" }
  - { id: ERR_REVIEW_INTERVAL_TOO_SHORT, http: 409, condition: "New review scheduled < 30 days from an existing review of the same engagement" }
  - { id: ERR_REVIEW_NOT_CLOSABLE, http: 422, condition: "Findings present without valid OPEN remediation actions of the same contractor" }
  - { id: ERR_DUPLICATE_FILING, http: 409, condition: "A non-VOID, non-SUPERSEDED ORIGINAL filing already exists for (contractor_id, tax_year)" }
  - { id: ERR_FILING_NOT_SUBMITTABLE, http: 409, condition: "submit from status other than DRAFT or REJECTED_AGENCY" }
  - { id: ERR_CORRECTION_REQUIRES_ACCEPTED, http: 409, condition: "CORRECTION filing submitted while its corrects_filing_id target is not ACCEPTED" }
  - { id: ERR_AUDIT_NOT_OPEN, http: 409, condition: "Remediation action creation when audit status not IN {FINDINGS_FINALIZED, REMEDIATION}" }
  - { id: ERR_AUDIT_ACTIONS_OPEN, http: 409, condition: "Audit close with open_action_count > 0" }
  - { id: ERR_INQUIRY_DEADLINE_PASSED, http: 422, condition: "respond after response_deadline (clock > deadline)" }
  - { id: ERR_CONVERSION_NOT_POSSIBLE, http: 409, condition: "Conversion created while engagement not IN {ACTIVE, SUSPENDED}" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_engagement_version != Engagement.version at determination creation (OCC)" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != ContractAgreement.version at amendment creation (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator; owns jurisdiction configuration and test-driving clock"
    identity: opaque
    exclusive_operations: ["POST /api/jurisdictions", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: EngagementManager
    description: "Business-side owner of engagements, questionnaires, contracts, amendments, activation, conversion decisions"
    identity: opaque
    exclusive_operations: ["POST /api/contractors", "POST /api/engagements", "POST /api/engagements/{id}/questionnaire", "POST /api/engagements/{id}/submit-review", "POST /api/engagements/{id}/activate", "POST /api/engagements/{id}/contracts", "POST /api/contracts/{id}/execute", "POST /api/contracts/{id}/amendments", "POST /api/conversions/{id}/record-decision"]
    shared_operations: ["all GET endpoints"]
  - name: ClassificationAnalyst
    description: "Runs classification determinations, drives review loop, submits engagements for approval"
    identity: opaque
    exclusive_operations: ["POST /api/engagements/{id}/determinations", "POST /api/engagements/{id}/request-info", "POST /api/engagements/{id}/submit-approval"]
    shared_operations: ["all GET endpoints", "POST /api/engagements/{id}/reject"]
  - name: HRApprover
    description: "Approval quorum step 1 (all tiers); extends conversion offers"
    identity: opaque
    exclusive_operations: ["POST /api/conversions/{id}/extend-offer"]
    shared_operations: ["POST /api/engagements/{id}/approve", "POST /api/engagements/{id}/reject", "all GET endpoints"]
  - name: LegalApprover
    description: "Approval quorum step 2 (ELEVATED/HIGH); adjudicates contract amendments"
    identity: opaque
    exclusive_operations: ["POST /api/amendments/{id}/approve"]
    shared_operations: ["POST /api/engagements/{id}/approve", "POST /api/engagements/{id}/reject", "all GET endpoints"]
  - name: ComplianceBoardMember
    description: "Approval quorum step 3 (HIGH); grants and revokes classification exceptions"
    identity: opaque
    exclusive_operations: ["POST /api/engagements/{id}/exceptions", "POST /api/exceptions/{id}/revoke"]
    shared_operations: ["POST /api/engagements/{id}/approve", "POST /api/engagements/{id}/reject", "all GET endpoints"]
  - name: ComplianceOfficer
    description: "Verification decisions, suspensions, monitoring reviews, risk audits, remediation, conversion case creation"
    identity: opaque
    exclusive_operations: ["POST /api/contractors/{id}/verify", "POST /api/engagements/{id}/suspend", "POST /api/engagements/{id}/reinstate", "POST /api/engagements/{id}/terminate", "POST /api/engagements/{id}/reviews", "POST /api/reviews/{id}/close", "POST /api/audits", "POST /api/audits/{id}/finalize", "POST /api/audits/{id}/remediation-actions", "POST /api/remediation-actions/{id}/close", "POST /api/audits/{id}/close", "POST /api/engagements/{id}/conversions"]
    shared_operations: ["all GET endpoints"]
  - name: TaxReportingSpecialist
    description: "1099 lifecycle: create, submit, agency acknowledgement, void corrections"
    identity: opaque
    exclusive_operations: ["POST /api/filings", "POST /api/filings/{id}/submit", "POST /api/filings/{id}/agency-response", "POST /api/filings/{id}/correct"]
    shared_operations: ["all GET endpoints"]
  - name: AgencyLiaison
    description: "Agency inquiry intake, response drafting/submission, resolution or audit escalation"
    identity: opaque
    exclusive_operations: ["POST /api/engagements/{id}/inquiries", "POST /api/inquiries/{id}/respond", "POST /api/inquiries/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
