        source: system
        description: "Cash applied to this invoice."
        default: 0
      - name: balance_due
        type: number
        source: computed
        description: "total_due - amount_paid, rounded to MONEY_PRECISION."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle."
        default: "DRAFT"
        constraints: "one of DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOIDED"

  - name: Settlement
    parent: null
