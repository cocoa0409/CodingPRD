  # ===========================================================================
  # §1.3's complexity_layers are optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation and selector_policy. The first three map to guide rows;
  # selector_policy has no row in the layer table and is instead covered by the
  # remarketing_channel_selection instances in the calculations section.
  - section: cross_cutting_complexity_layers
    instances:

      - name: consignment_create_with_a_stale_expected_vehicle_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consignment-create-stale-vehicle]
          - validations[priority 8 ERR_STALE_VEHICLE_VERSION]
        distinguishing_aspect: "This is the second §1.2.1 rule, whose parent is Vehicle rather than FleetPlan: a usage posting between the read and the consignment moves the odometer that the channel choice was based on, so the stale expected_vehicle_version is a 412 while the refreshed one succeeds - and each accepted write bumps version by exactly one."
        test_recipe:
          setup:
            - "One ATL market, MIDSIZE segment with an ACTIVE policy, RISK program, AUCTION channel."
            - "One vehicle IN_SERVICE as of 2026-01-15T00:00:00Z. Its version is read, and THEN a usage posting advances the odometer to 5000 km, invalidating the read."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/remarketing-channels"
              payload: { code: "AUCTION", name: "Regional auction", fee_pct: 0.06, fixed_fee_cents: 25000, expected_days_to_sell: 14, expected_proceeds_multiplier: 0.92, recondition_required: false }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { ch_auction: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Cascade", program_year: 2026, program_type: "RISK", repurchase_guarantee_pct: 0.00, min_holding_days: 90, max_holding_days: 900, max_eligible_mileage_km: 100000, excess_mileage_charge_cents_per_km: 0, damage_deduction_cap_cents: 0 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_rsk: $.data.id }
            - call: "POST /fleet/depreciation-policies"
              payload: { segment_id: "${seg_mid}", name: "MID-2026", monthly_depreciation_pct: 0.0150, mileage_depreciation_cents_per_km: 12, floor_residual_pct: 0.35, effective_from: "2026-01-01T00:00:00Z" }
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { pol_mid: $.data.id }
            - call: "POST /fleet/depreciation-policies/${pol_mid}/activate"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-b"
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_rsk}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_o: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_o}/vehicles"
              payload: { vin: "CA26RSKATL001301", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_o: $.data.id }
            - call: "POST /fleet/vehicles/${veh_o}/in-fleet"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_o}/in-fleeting-tasks"
              payload: { task_type: "REGISTRATION", cost_cents: 14000, window_start: "2026-01-05T08:00:00Z", window_end: "2026-01-05T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { to_reg: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${to_reg}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_o}/in-fleeting-tasks"
              payload: { task_type: "LICENSING", cost_cents: 9000, window_start: "2026-01-06T08:00:00Z", window_end: "2026-01-06T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { to_lic: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${to_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_o}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-07T08:00:00Z", window_end: "2026-01-07T10:00:00Z", bay_code: "B1" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { to_prep: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/in-fleeting-tasks/${to_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "GET /fleet/vehicles/${veh_o}"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
              captures: { veh_o_stale: $.data.version }
            - call: "POST /fleet/vehicles/${veh_o}/usage"
              payload: { odometer_km: 5000, rented_days_delta: 10, available_days_delta: 12, revenue_cents_delta: 55000 }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
          trigger:
            - call: "POST /fleet/consignments"
              payload: { vehicle_id: "${veh_o}", channel_id: "${ch_auction}", expected_vehicle_version: "${veh_o_stale}" }
              as: RemarketingManager
              as_user_id: "u-rm-1"
              captures: { e_occ: $.data.error_id }
            - call: "GET /fleet/vehicles/${veh_o}"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
              captures: { veh_o_fresh: $.data.version }
            - call: "POST /fleet/consignments"
              payload: { vehicle_id: "${veh_o}", channel_id: "${ch_auction}", expected_vehicle_version: "${veh_o_fresh}" }
              as: RemarketingManager
              as_user_id: "u-rm-1"
              captures: { cons_o: $.data.id }
          assert:
            - "the stale create returns HTTP 412 with data.error_id == \"ERR_STALE_VEHICLE_VERSION\" and no Consignment row is written"
            - "${veh_o_fresh} == ${veh_o_stale} + 1: the usage posting bumped version by exactly one, and the refused consignment bumped it by zero"
            - "the refreshed create returns HTTP 201 with status \"DRAFT\", and the vehicle's net_book_value_at_hold_cents reflects odometer 5000 (2800000 - 0 - 60000 == 2740000) rather than the pre-usage value"
            - "priority 8 is evaluated before priority 10, so the 412 is returned rather than any state guard"

      - name: allocation_create_optimistic_concurrency_on_the_fleet_plan
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-create-stale-plan]
          - validations[priority 8 ERR_STALE_PLAN_VERSION]
        excluded_because:
          difficulty_instance: stale_plan_version_outranks_frozen_posture_on_allocation_create
          rationale: "The first §1.2.1 rule is asserted there in its strongest form: the same request violates the stale-version rule AND the frozen-posture rule, and the 412 wins, which subsumes the plain stale-version test."

      - name: four_level_cascade_from_task_completion_up_to_the_plan
        claim_type: cascading_side_effects
        grounds:
          - state_machines[InFleetingTask] PENDING -> COMPLETED
        excluded_because:
          difficulty_instance: task_completion_cascades_vehicle_allocation_plan_four_levels
          rationale: "The N-level chain verified end-to-end, plus its ordering sensitivity, is exactly that instance; total_loss_cascades_vehicle_orders_and_market_census_three_levels covers the second, differently shaped chain."

      - name: dual_variant_valuation_and_the_delta_between_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations[vehicle_residual_valuation].variants
        excluded_because:
          difficulty_instance: vehicle_residual_program_guarantee_vs_policy_schedule_divergence
          rationale: "Both variants on identical inputs and the exact delta are asserted there; fleet_plan_forward_planned_vs_chronological_actual_divergence covers the second dual-variant surface."

