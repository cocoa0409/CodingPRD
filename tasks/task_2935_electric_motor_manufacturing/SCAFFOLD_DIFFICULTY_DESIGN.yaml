  - rule_id: resource_temporal_overlap
    instances:

      - name: oven_window_conflicts_until_the_full_cooldown_buffer_has_elapsed
        grounds:
          - calculations.oven_window_conflict
          - errors[ERR_OVEN_WINDOW_CONFLICT]
          - endpoints[POST /stator-builds/{id}/impregnate]
          - entities.CuringOven.fields.cooldown_buffer_minutes
          - calculations.oven_booked_minutes_ledger
        distinguishing_aspect: |
          The conflict window is not the booked interval: it is the booked interval extended by
          the oven's own cooldown_buffer_minutes, so an existing 08:00-12:00Z booking on an oven
          with a 45-minute buffer blocks everything that starts before 12:45Z. A request starting
          at 12:30Z — thirty minutes AFTER the previous window ends, and therefore accepted by any
          naive raw-end comparison — must be refused, while 12:45Z exactly is allowed. The two
          builds are deliberately on different work orders, because one work order may hold only
          one live stator.
        test_recipe:
          setup:
            - "OVEN-A with max_temp_c 180.0 and cooldown_buffer_minutes 45."
            - "Design D1 RELEASED; two confirmed orders; WO1 and WO2 open on D1."
            - "sb1 on WO1 impregnated 2026-08-03T08:00:00.000Z - 12:00:00.000Z (240 minutes), so the buffered effective end is 12:45:00.000Z."
            - "sb2 on WO2 is WOUND and unbooked."
