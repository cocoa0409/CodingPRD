            - "LabelTask.${task_next_day}.due_at == 2026-08-07T00:00:00Z (effective_date 2026-08-03T00:00:00Z + grace_period_hours 96) and overdue == false at clock 2026-08-01T00:00:00Z"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_liability_ledger_reconciles_across_approve_pay_and_deny
        grounds:
          - entities.Store.fields.refund_liability_outstanding_cents
          - entities.Store.fields.refund_paid_total_cents
          - state_machines.RefundClaim.PENDING_to_APPROVED
          - state_machines.RefundClaim.APPROVED_to_PAID
          - state_machines.RefundClaim.PENDING_to_DENIED
          - calculations.refund_claim_amount
        distinguishing_aspect: |
          MONEY invariant with two mirrored accumulators:
          Store.refund_liability_outstanding_cents == sum of claimed_amount_cents over claims in
          {PENDING, APPROVED} and Store.refund_paid_total_cents == sum over claims in {PAID}, at
          every single step. The forward operation is claim creation and the compensations are two
          different terminal moves — DENIED removes the amount from the ledger entirely while PAID
          moves it from one accumulator to the other — so a claim can leave the outstanding sum in
          two distinguishable ways, and APPROVED is deliberately a no-op on both totals.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with overcharge_refund_policy REFUND_DIFFERENCE_PLUS_FIXED, refund_fixed_bonus_cents 500, refund_cap_cents 5000, refund_budget_per_audit_cents 100000, scanner_error_rate_threshold_pct 60.0."
            - "One store, one aisle with NO assigned associate, one CERTIFIED PRICE_AUDITOR (pa1)."
            - "One CLOSED audit with three OVERCHARGE scan lines of variance 150, 250 and 900 cents."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", overcharge_refund_policy: "REFUND_DIFFERENCE_PLUS_FIXED", refund_fixed_bonus_cents: 500, refund_cap_cents: 5000, refund_budget_per_audit_cents: 100000, scanner_error_rate_threshold_pct: 60.0 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_m: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_m}/scan-lines"
              payload: { item_upc: "00000000001501", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_a: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_m}/scan-lines"
              payload: { item_upc: "00000000001502", shelf_price_cents: 349, register_price_cents: 599 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_b: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_m}/scan-lines"
              payload: { item_upc: "00000000001503", shelf_price_cents: 199, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_c: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_m}/scan-lines"
              payload: { item_upc: "00000000001504", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_m}/scan-lines"
              payload: { item_upc: "00000000001505", shelf_price_cents: 259, register_price_cents: 259 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_m}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_v: $.data.version }
          trigger:
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_a}", customer_ref: "CUST-A", expected_scanner_audit_version: "${audit_v}" }
              as: CustomerServiceDesk
              captures: { claim_a: $.data.id }
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_b}", customer_ref: "CUST-B", expected_scanner_audit_version: "${audit_v}" }
              as: CustomerServiceDesk
              captures: { claim_b: $.data.id }
            - call: "POST /price-integrity/refund-claims/${claim_a}/settle"
              payload: { target_status: "APPROVED" }
              as: CustomerServiceDesk
            - call: "POST /price-integrity/refund-claims/${claim_a}/settle"
              payload: { target_status: "PAID" }
              as: CustomerServiceDesk
            - call: "POST /price-integrity/refund-claims/${claim_b}/settle"
              payload: { target_status: "DENIED", denial_reason: "Customer could not produce the receipt" }
              as: CustomerServiceDesk
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_c}", customer_ref: "CUST-C", expected_scanner_audit_version: "${audit_v}" }
              as: CustomerServiceDesk
              captures: { claim_c: $.data.id }
            - call: "POST /price-integrity/refund-claims/${claim_c}/settle"
              payload: { target_status: "DENIED", denial_reason: "Duplicate of an earlier goodwill credit" }
              as: CustomerServiceDesk
          assert:
            - "Baseline: Store.${store_a}.refund_liability_outstanding_cents == 0 and refund_paid_total_cents == 0"
            - "Amounts: RefundClaim.${claim_a}.claimed_amount_cents == 650 (150 + 500), ${claim_b} == 750 (250 + 500), ${claim_c} == 1400 (900 + 500); all three are under refund_cap_cents 5000"
            - "After creating claim A: outstanding == 650, paid_total == 0, RefundClaim.${claim_a}.status == PENDING"
            - "After creating claim B: outstanding == 1400 == 650 + 750, paid_total == 0"
            - "APPROVED is a deliberate no-op on both accumulators: after approving A, outstanding is still 1400 and paid_total is still 0, while RefundClaim.${claim_a}.status == APPROVED"
            - "PAID moves the amount between accumulators: after paying A, outstanding == 750, paid_total == 650, RefundClaim.${claim_a}.paid_at == 2026-08-01T00:00:00Z; 750 + 650 == 1400, so nothing is lost"
            - "DENIED removes the amount from both accumulators: after denying B, outstanding == 0 and paid_total == 650; RefundClaim.${claim_b}.denial_reason is stored"
            - "Forward again from a clean ledger: creating claim C gives outstanding == 1400, paid_total == 650"
            - "Compensating again: denying C returns outstanding to exactly 0, paid_total unchanged at 650 — bit-for-bit the value it held before claim C existed"
            - "Reconciliation at every step: outstanding == sum of claimed_amount_cents over GET /price-integrity/refund-claims?store_id=${store_a}&status=PENDING plus the same list filtered to APPROVED, and paid_total == the same sum over status=PAID"
            - "Total claims raised (650 + 750 + 1400 == 2800) does not equal any accumulator at the end — 0 outstanding and 650 paid — proving the accumulators are recomputed from claim state rather than incremented blindly"
            - "GET /price-integrity/refund-claims?store_id=${store_a} returns total_count 3 with statuses PAID, DENIED, DENIED"

      - name: label_backlog_counter_survives_reject_replace_and_withdrawal
        grounds:
          - calculations.store_label_backlog_count
          - entities.Store.fields.label_backlog_count
          - state_machines.LabelTask.placement_status=PLACED_to_placement_status=REJECTED
          - state_machines.LabelTask.placement_status=REJECTED_to_placement_status=PLACED
          - state_machines.PriceChangeLine.LABELED_to_WITHDRAWN
        distinguishing_aspect: |
          COUNTER invariant rather than a money ledger, and its compensation arrives from a THIRD
          entity: Store.label_backlog_count == count of tasks in {UNPLACED, REJECTED} whose line is
          not WITHDRAWN. The forward/undo pair place -> reject -> place walks the counter 2 -> 1 ->
          2 -> 1 with no drift, and then a supersede on the owning file drives it to 0 by changing
          the LINE rather than the task — a task still sitting in UNPLACED silently stops counting.
          Unlike the money instance, no transition on the counted entity is reversed at all.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default; jurisdiction US-CA with grace_period_hours 48."
            - "One store, one aisle, one CERTIFIED LABEL_ASSOCIATE (la1), one CERTIFIED PRICE_AUDITOR (pa1)."
            - "File F1 distributed with TWO lines and one task per line, both UNPLACED."
            - "File F2 left in DRAFT with a later effective_date to serve as the supersede target."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lena Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000001601", item_description: "Milk 1gal", category_code: "DAIRY", old_retail_cents: 449, new_retail_cents: 399, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000001602", item_description: "Butter 1lb", category_code: "DAIRY", old_retail_cents: 549, new_retail_cents: 499, net_content_qty: 1, net_content_uom: "LB" }
              as: PricingAdmin
              captures: { line_2: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1002", jurisdiction_id: "${jur_a}", effective_date: "2026-08-04T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_2: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              payload: {}
              as: PricingAdmin
              captures: { f1_v1: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_1}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T10:00:00Z", expected_price_change_file_version: "${f1_v1}" }
              as: PricingAdmin
              captures: { task_1: $.data.id }
            - call: "GET /price-integrity/price-change-files/${file_1}"
              as: PricingAdmin
              captures: { f1_v2: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_1}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_2}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T10:01:00Z", scheduled_end_at: "2026-08-03T11:00:00Z", expected_price_change_file_version: "${f1_v2}" }
              as: PricingAdmin
              captures: { task_2: $.data.id }
          trigger:
            - call: "POST /price-integrity/label-tasks/${task_1}/print"
              payload: {}
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/label-tasks/${task_1}/place"
              payload: { observed_shelf_price_cents: 399 }
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/label-tasks/${task_1}/verify-placement"
              payload: { outcome: "REJECTED", rejection_reason: "Tag was placed on the adjacent facing" }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/label-tasks/${task_1}/print"
              payload: {}
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/label-tasks/${task_1}/place"
              payload: { observed_shelf_price_cents: 399 }
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/price-change-files/${file_1}/supersede"
              payload: { superseded_by_file_id: "${file_2}" }
              as: PricingAdmin
          assert:
            - "Baseline after both tasks exist: Store.${store_a}.label_backlog_count == 2 (both tasks UNPLACED, both lines live) and compliance_posture == OPEN (2 < RESTRICTED_BACKLOG_COUNT 5)"
            - "Printing does not touch the counter: after ${task_1} reaches print_status PRINTED, label_backlog_count is still 2 — the counter reads placement_status only"
            - "Forward: after placing ${task_1}, label_backlog_count == 1"
            - "Compensating hop from a peer: verify REJECTED puts ${task_1} back in the counted set, label_backlog_count == 2, and rejection_count == 1"
            - "Forward again: reprint then place ${task_1}, label_backlog_count == 1 — exactly the value it held after the first place, with no accumulated drift"
            - "Third-entity compensation: superseding file_1 drives label_backlog_count to 0, even though LabelTask.${task_2}.placement_status is still UNPLACED — its line went WITHDRAWN"
            - "PriceChangeLine.${line_1}.line_status == WITHDRAWN and PriceChangeLine.${line_2}.line_status == WITHDRAWN; PriceChangeFile.${file_1}.status == SUPERSEDED"
            - "Neither task's placement_status was reversed by the supersede: LabelTask.${task_1}.placement_status == PLACED and LabelTask.${task_2}.placement_status == UNPLACED, but print_status is REPRINT_REQUIRED on both"
            - "Reconciliation: at each of the six checkpoints label_backlog_count equals the direct count from GET /price-integrity/label-tasks?store_id=${store_a}&placement_status=UNPLACED plus the same list filtered to REJECTED, minus any whose line is WITHDRAWN"
            - "Store.${store_a}.compliance_posture == OPEN at the end (backlog 0, no findings, no failed audits, no signage violations)"

      - name: accountability_score_returns_to_its_pre_issue_value_after_voids
        grounds:
          - calculations.associate_accountability_score
          - state_machines.AccountabilityAction.ISSUED_to_VOIDED
          - state_machines.Associate.CERTIFIED_to_SUSPENDED
          - state_machines.Associate.SUSPENDED_to_CERTIFIED
          - entities.Associate.fields.issued_action_count
        distinguishing_aspect: |
          POINTS invariant with a deliberately ASYMMETRIC compensation: the scalar
          accountability_score == max(0, 100 - sum of ACTION_WEIGHTS over ISSUED actions) is restored
          bit-for-bit by voiding, but the Associate's training_status is NOT auto-restored — once
          SUSPENDED, only remedial training returns it to CERTIFIED. So unlike the money and counter
          instances, undoing the arithmetic does not undo the state, and the round trip needs a
          separate forward operation (remedial training) that itself completes the remaining ISSUED
          punitive actions. The floor comparison is strict, so a score of exactly 80 stays CERTIFIED.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with accountability_variant OCCURRENCE_WEIGHTED."
            - "One store, one CERTIFIED LABEL_ASSOCIATE (la1) with no actions and no placements, so accountability_score starts at 100.00."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", accountability_variant: "OCCURRENCE_WEIGHTED" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lena Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
          trigger:
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "MANUAL", action_type: "COACHING" }
              as: ComplianceOfficer
              captures: { act_c1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "MANUAL", action_type: "WRITTEN_WARNING" }
              as: ComplianceOfficer
              captures: { act_ww: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/accountability-actions"
              payload: { trigger_code: "MANUAL", action_type: "COACHING" }
              as: ComplianceOfficer
              captures: { act_c2: $.data.id }
            - call: "POST /price-integrity/accountability-actions/${act_c2}/transition"
              payload: { target_status: "VOIDED", void_reason: "Second coaching was logged against the wrong associate" }
              as: ComplianceOfficer
            - call: "POST /price-integrity/accountability-actions/${act_ww}/transition"
              payload: { target_status: "VOIDED", void_reason: "Warning rescinded after the grievance hearing" }
              as: ComplianceOfficer
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "REMEDIAL_LABEL_101", score_pct: 95 }
              as: PricingAdmin
          assert:
            - "Baseline: Associate.${la1}.accountability_score == 100.00, issued_action_count == 0, training_status == CERTIFIED, certification_expires_at == 2027-08-01T00:00:00Z"
            - "Forward 1: after the COACHING (weight 5), accountability_score == 95.00, issued_action_count == 1, training_status still CERTIFIED"
            - "Forward 2: after the WRITTEN_WARNING (weight 15), accountability_score == 80.00, issued_action_count == 2 — and training_status is STILL CERTIFIED because the floor comparison is strict (80.00 < 80 is false)"
            - "Forward 3: after the second COACHING, accountability_score == 75.00, issued_action_count == 3, and training_status == SUSPENDED (75.00 < SUSPENSION_SCORE_FLOOR 80)"
            - "Compensate 1: voiding the second COACHING restores accountability_score to exactly 80.00 and issued_action_count to 2, but training_status is STILL SUSPENDED — the scalar compensates, the state does not"
            - "Compensate 2: voiding the WRITTEN_WARNING restores accountability_score to exactly 95.00 and issued_action_count to 1, and training_status is STILL SUSPENDED"
            - "AccountabilityAction.${act_c2}.status == VOIDED with its void_reason stored, and AccountabilityAction.${act_ww}.status == VOIDED — voided rows persist but leave the weight sum"
            - "State restoration needs its own forward operation: remedial training with module_code REMEDIAL_LABEL_101 and score_pct 95 moves training_status SUSPENDED -> CERTIFIED and sets certification_expires_at == 2027-08-01T00:00:00Z"
            - "The remedial precondition was satisfiable because the recomputed score 95.00 >= SUSPENSION_SCORE_FLOOR 80 once the two voids had landed"
            - "Final state has zero drift: accountability_score == 95.00, identical to the value right after the very first COACHING, with issued_action_count == 1 and AccountabilityAction.${act_c1}.status == ISSUED (a COACHING is not in {SUSPENSION, RETRAINING_ASSIGNED}, so the remedial completion does not clear it)"
            - "GET /price-integrity/associates/${la1}/accountability-actions returns total_count 3, of which exactly 1 has status ISSUED"
