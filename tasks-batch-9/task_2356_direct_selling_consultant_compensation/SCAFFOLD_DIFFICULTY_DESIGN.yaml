              as: CommissionAnalyst
              captures: { p8_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications"
              payload: { applicant_email: "mia@ex.test", applicant_full_name: "Mia Line", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-MIA" }
              as: PlatformAdmin
              captures: { app_m_id: "$.data.id" }
            - call: "POST /direct-selling/enrollment-applications/${app_m_id}/accept-agreement"
              payload: { agreement_version: "AGR-2026-01" }
              as: Applicant
              as_user_id: "${app_m_id}"
            - call: "POST /direct-selling/enrollment-applications/${app_m_id}/identity-decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
            - call: "POST /direct-selling/enrollment-applications/${app_m_id}/pay-starter-kit"
              payload: { amount_cents: 11129, payment_reference: "KIT-PAY-MIA" }
              as: PlatformAdmin
            - call: "POST /direct-selling/enrollment-applications/${app_m_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { cons_m_id: "$.data.id" }
          trigger:
            - call: "POST /direct-selling/product-orders"
              payload: { consultant_id: "${cons_m_id}", order_type: "BUSINESS_SUPPLY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${sample_id}", quantity: 5 }, { product_id: "${sachet_id}", quantity: 5 } ] }
              as: Consultant
              as_user_id: "${cons_m_id}"
              captures: { split_id: "$.data.id", split_tax: "$.data.tax_total_cents", split_basis: "$.data.srp_basis_cents", split_total: "$.data.total_due_cents" }
            - call: "POST /direct-selling/product-orders"
              payload: { consultant_id: "${cons_m_id}", order_type: "BUSINESS_SUPPLY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${sample_id}", quantity: 10 } ] }
              as: Consultant
