# =============================================================================
# §1.6 Error Code Catalog (58 codes)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer's X-User-ID does not match the resource's household_id" }
  - { id: ERR_NOT_ASSIGNED_TECH, http: 403, condition: "ServiceTech's X-User-ID does not match assigned_technician_id / route.technician_id" }
  # --- existence ---
  - { id: ERR_HOUSEHOLD_NOT_FOUND, http: 404, condition: "household id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "subscription plan id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product sku does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription id does not exist" }
  - { id: ERR_COOP_SITE_NOT_FOUND, http: 404, condition: "coop site id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "service visit id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "sitting engagement id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "sitting route id does not exist" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "route stop id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "supply order id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum value outside declared set" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end not after start, malformed MM-DD/HH:MM, non-positive quantity/duration" }
  # --- state ---
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Operation requires household status ACTIVE (or suspend requires ACTIVE)" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "pause/plan-change/renew require ACTIVE; resume requires PAUSED; cancel requires ACTIVE|PAUSED" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "renew-period before logical clock reaches current_period_end" }
  - { id: ERR_VISIT_NOT_ASSIGNABLE, http: 409, condition: "assign requires visit status REQUESTED or RESCHEDULE_REQUESTED" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "check-in/mark-no-show/request-reschedule require SCHEDULED" }
  - { id: ERR_VISIT_NOT_ON_SITE, http: 409, condition: "complete requires ON_SITE" }
  - { id: ERR_VISIT_NOT_CANCELLABLE, http: 409, condition: "cancel requires REQUESTED/SCHEDULED/RESCHEDULE_REQUESTED" }
  - { id: ERR_ENGAGEMENT_NOT_QUOTED, http: 409, condition: "confirm requires QUOTED" }
  - { id: ERR_ENGAGEMENT_NOT_CONFIRMED, http: 409, condition: "settle or route-stop add requires engagement CONFIRMED" }
  - { id: ERR_ENGAGEMENT_NOT_CANCELLABLE, http: 409, condition: "engagement cancel requires REQUESTED/QUOTED/CONFIRMED" }
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "publish requires PLANNED" }
  - { id: ERR_ROUTE_NOT_PUBLISHED, http: 409, condition: "stop add requires PUBLISHED; route cancel requires PLANNED|PUBLISHED" }
  - { id: ERR_STOP_NOT_PENDING, http: 409, condition: "stop complete/skip requires PENDING" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "add-line/place require order DRAFT" }
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "issue requires DRAFT" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "mark-paid/dispute/void require ISSUED" }
  - { id: ERR_INVOICE_NOT_DISPUTED, http: 409, condition: "resolve-dispute requires DISPUTED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (e.g., reinstate when not SUSPENDED, quote when not REQUESTED)" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version" }
  # --- business referential/safety ---
  - { id: ERR_COOP_NOT_INSTALLED, http: 409, condition: "Operation requires coop status INSTALLED (non-setup visits; engagement confirm)" }
  - { id: ERR_COOP_ALREADY_INSTALLED, http: 409, condition: "SETUP_INSTALL visit requires coop status PLANNED" }
  - { id: ERR_FULFILLMENT_VISIT_INVALID, http: 409, condition: "fulfillment_visit_id missing on this household or visit not SCHEDULED at place time" }
  - { id: ERR_PREDATOR_GRADE_INSUFFICIENT, http: 409, condition: "Engagement confirm requires coop predator_grade IN {B, A}" }
  # --- business temporal ---
  - { id: ERR_SCHEDULE_IN_PAST, http: 409, condition: "scheduled_start (or engagement start_date) is before the logical clock time at creation" }
  - { id: ERR_ENGAGEMENT_DATE_OVERLAP, http: 409, condition: "Closed-interval date overlap with a non-CANCELLED engagement of the same household" }
  - { id: ERR_SEASONAL_WINDOW_OVERLAP, http: 409, condition: "New seasonal window covers a calendar day already covered for the same zone (wrap-aware)" }
  - { id: ERR_TECH_SCHEDULE_CONFLICT, http: 409, condition: "Buffered (30-min) window collides with another SCHEDULED/ON_SITE visit of the technician" }
  - { id: ERR_STOP_TIME_CONFLICT, http: 409, condition: "Buffered (30-min) stop window collides with a PENDING/DONE stop on the route" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "Half-open invoice period overlaps an existing non-VOID invoice of the household" }
  # --- business constraint ---
  - { id: ERR_ROUTE_CAPACITY_FULL, http: 409, condition: "route.committed_stops >= max_stops on stop creation (equality rejects)" }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http: 409, condition: "request-reschedule when reschedule_count >= 2" }
  - { id: ERR_ORDER_EMPTY, http: 409, condition: "place with zero lines" }
  - { id: ERR_ENGAGEMENT_DURATION_INVALID, http: 400, condition: "engagement nights < 1 or > 30" }
  - { id: ERR_SUBSCRIPTION_ALREADY_EXISTS, http: 409, condition: "household already has a subscription with status ACTIVE or PAUSED" }
  - { id: ERR_ROUTE_NOT_EMPTY, http: 409, condition: "route cancel with committed_stops > 0" }
  - { id: ERR_STOPS_OUTSTANDING, http: 409, condition: "settle with any stop still PENDING" }
  - { id: ERR_NO_ROUTE_AVAILABLE, http: 409, condition: "selector found no eligible route for at least one stop date; confirm rejected atomically" }
  - { id: ERR_INVALID_ADJUSTMENT, http: 422, condition: "adjustment_amount_cents == 0 or would drive invoice total_cents < 0" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "invoice generate swept zero billable sources" }
  # --- business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "order total_cents > household.wallet_credit_cents + 20000 at place time" }
  - { id: ERR_INSUFFICIENT_WALLET_CREDIT, http: 402, condition: "negative wallet adjustment would drive wallet_credit_cents below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Backyard flock owner; books visits, manages own subscription/engagements/orders, disputes invoices"
    identity: "entity_backed:HouseholdAccount"
    exclusive_operations:
      - "POST /coopcare/service-visits/{id}/request-reschedule"
      - "POST /coopcare/invoices/{id}/dispute"
    shared_operations:
      - "POST /coopcare/subscriptions, pause, resume, cancel, plan-changes (own household; shared with PlatformAdmin)"
      - "POST /coopcare/coop-sites (shared with PlatformAdmin)"
      - "POST /coopcare/service-visits; POST /coopcare/service-visits/{id}/cancel (shared with PlatformAdmin/Dispatcher)"
      - "POST /coopcare/sitting-engagements, confirm, cancel (shared with PlatformAdmin/Dispatcher)"
      - "POST /coopcare/supply-orders, lines, place (shared with PlatformAdmin)"
      - "GET reads (shared with all roles)"

  - name: ServiceTech
    description: "Field technician; runs assigned visits and route stops"
    identity: "opaque"
    exclusive_operations:
      - "POST /coopcare/service-visits/{id}/check-in, complete, mark-no-show (assigned tech only)"
      - "POST /coopcare/route-stops/{id}/complete, skip (route tech only)"
    shared_operations:
      - "GET reads (shared with all roles)"

  - name: Dispatcher
    description: "Operations planner; assigns visits, quotes engagements, builds and publishes routes"
    identity: "opaque"
    exclusive_operations:
      - "POST /coopcare/service-visits/{id}/assign"
      - "POST /coopcare/sitting-engagements/{id}/quote"
      - "POST /coopcare/sitting-routes, publish, cancel, stops"
    shared_operations:
      - "POST /coopcare/service-visits/{id}/cancel; POST /coopcare/sitting-engagements/{id}/cancel (shared with Customer)"
      - "GET reads (shared with all roles)"

  - name: BillingAdmin
    description: "Finance operator; invoices, wallet, subscription renewal, account suspension"
    identity: "opaque"
    exclusive_operations:
      - "POST /coopcare/households/{id}/suspend, reinstate, wallet-adjustments"
      - "POST /coopcare/subscriptions/{id}/renew-period"
      - "POST /coopcare/sitting-engagements/{id}/settle"
      - "POST /coopcare/invoices, issue, mark-paid, resolve-dispute, void"
    shared_operations:
      - "GET reads (shared with all roles)"

  - name: PlatformAdmin
    description: "Platform operator; configuration and onboarding"
    identity: "opaque"
    exclusive_operations:
      - "POST /coopcare/_clock/set_current_utc"
      - "POST /coopcare/households"
      - "POST /coopcare/subscription-plans, products, seasonal-windows"
    shared_operations:
      - "Customer-scoped writes (subscriptions, coop-sites, visits, engagements, orders) as operator override"
      - "GET reads (shared with all roles)"
