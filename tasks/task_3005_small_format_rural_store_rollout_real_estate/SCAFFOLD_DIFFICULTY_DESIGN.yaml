  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: occ_stale_version_beats_program_not_active_on_decide
        grounds:
          - validations[priority=6]
          - validations[priority=18]
          - concurrency_rules[capital-decide-stale-program]
        distinguishing_aspect: |
          Category pair state(program) vs state(OCC): a decide call on a DRAFT
          (not ACTIVE) program that ALSO carries a stale expected_program_version
          — both priority 6 and 18 fail; the scaffold pins ERR_PROGRAM_NOT_ACTIVE
          (priority 6) as the winner because program gating is evaluated before
          OCC.
        test_recipe:
          setup:
            - "program P in DRAFT (never activated); EXISTING store X; REMODEL project CP created in DRAFT... submit blocked while DRAFT, so CP stays DRAFT — decide attempted directly from DRAFT is also a state failure; instead: program ACTIVATED, CP submitted, then program DEACTIVATED (no store past PROPOSED — X is EXISTING which is excluded) so program DRAFT; caller holds stale expected_program_version"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 50000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/capital-projects"
              payload: { rollout_program_id: "${rid}", kind: "REMODEL", store_id: "${ex}", remodel_cost_cents: 80000000, projected_uplift_cents: 60000000 }
              as: FINANCE_ANALYST
              captures: { cpid: $.data.id }
            - call: "POST /rollouts/capital-projects/${cpid}/submit"
              payload: { rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
            - call: "POST /rollouts/${rid}/deactivate"
              as: PROGRAM_ADMIN
              captures: { p_stale_v: $.data.version }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/${rid}/deactivate"
              as: PROGRAM_ADMIN
          trigger:
            - call: "POST /rollouts/capital-projects/${cpid}/decide"
              payload: { rollout_program_id: "${rid}", decision: "APPROVE", expected_program_version: "${p_stale_v}" }
              as: PROGRAM_ADMIN
          assert:
            - "response error_id == ERR_PROGRAM_NOT_ACTIVE (http 409), NOT ERR_STALE_VERSION — program-gate (priority 6) wins over OCC (priority 18)"

      - name: segregation_of_duties_beats_capital_budget_on_decide
        grounds:
          - validations[priority=14]
          - validations[priority=17]
        distinguishing_aspect: |
          Different error-category pair than the OCC/program-gate instance:
          business_safety (segregation of duties, priority 14) vs
          business_fiscal (capital budget, priority 17). A decide by the same
          analyst who submitted the project, on a project whose cost also
          exceeds available capital, returns ERR_SEGREGATION_OF_DUTIES — the
          safety gate is evaluated before the fiscal gate.
        test_recipe:
          setup:
            - "ACTIVE program with budget 50000000; EXISTING store X; REMODEL project CP (cost 80000000 > budget) submitted by analyst fa_1"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 50000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id, p_v0: $.data.version }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
              captures: { p_v1: $.data.version }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 50000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/capital-projects"
              payload: { rollout_program_id: "${rid}", kind: "REMODEL", store_id: "${ex}", remodel_cost_cents: 80000000, projected_uplift_cents: 60000000 }
              as: FINANCE_ANALYST
              captures: { cpid: $.data.id }
            - call: "POST /rollouts/capital-projects/${cpid}/submit"
              payload: { rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
              as_user_id: "fa_1"
          trigger:
            - call: "POST /rollouts/capital-projects/${cpid}/decide"
              payload: { rollout_program_id: "${rid}", decision: "APPROVE", expected_program_version: "${p_v1}" }
              as: PROGRAM_ADMIN
              as_user_id: "fa_1"
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (http 403), NOT ERR_CAPITAL_BUDGET_EXCEEDED — business_safety (priority 14) beats business_fiscal (priority 17) even though the 80000000 cost also exceeds the 50000000 budget"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cannibalization_entry_band_below_block_threshold
        grounds:
          - calculations.cannibalization_transfer
          - validations[priority=12]
        distinguishing_aspect: |
          Metric: per-entry impact percentage at the > vs >= boundary. Impact
          exactly 18.00% (below the 20 BLOCK band, above the 12 MITIGATE band)
          finalizes as MITIGATE; at exactly 20.00 the entry does NOT block
          (rule is strictly > 20) — here 18.00 must NOT trigger
          ERR_CANNIBALIZATION_BLOCKED while a sibling study at 20.80 must.
        test_recipe:
          setup:
            - "ACTIVE program; EXISTING store X (sales 100000000); new store S (DG_FRESH, projected_revenue_cents 145600000)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 100000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "F", drive_time_minutes: 18, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 30 }
              as: PROGRAM_ADMIN
              captures: { taf: $.data.id, taf_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taf}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${taf_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taf}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.45 } ] }
              as: FINANCE_ANALYST
              captures: { csid: $.data.id }
            - call: "POST /rollouts/cannibalization-studies/${csid}/finalize"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
          assert:
            - "CannibalizationStudy.${csid}.recommendation == MITIGATE (entry impact 18.00 > 12 but not > 20; transfer_pct 12.36 > 8 but not > 15)"
            - "finalize succeeds: CannibalizationStudy.${csid}.status == FINAL"
            - "CannibalizationStudy.${csid}.transfer_pct == 12.36"

      - name: delivery_penalty_bonus_tier_and_cap
        grounds:
          - calculations.delivery_penalty_accrual
          - entities.SiteControlAgreement.fields.penalty_cents
        distinguishing_aspect: |
          Different metric and endpoint than the cannibalization boundary:
          penalty accrual has a bonus tier after day 60 and a hard cap at
          45,000,000. At 75 late days base+bonus = 41250000 (below cap); at 80
          late days the sum 45000000 exactly equals the cap (min binds at
          equality) — reachable via the deliveries endpoint.
        test_recipe:
          setup:
            - "ACTIVE program; store S UNDER_CONSTRUCTION, agreement AG ACTIVE with committed_delivery_date 2026-11-01"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/activate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/site-agreements/${agid}/deliveries"
              payload: { rollout_program_id: "${rid}", actual_delivery_date: "2027-01-20T00:00:00Z" }
              as: REAL_ESTATE_MANAGER
          assert:
            - "SiteControlAgreement.${agid}.late_days == 80"
            - "SiteControlAgreement.${agid}.penalty_cents == 45000000 (cap binds: base 40000000 + bonus 5000000 = cap; day 75 would yield 41250000 — distinct values pin the bonus tier)"

