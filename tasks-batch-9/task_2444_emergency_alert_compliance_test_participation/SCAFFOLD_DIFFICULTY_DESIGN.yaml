            - "The amendment is filed at the SAME clock instant with a freshly captured expected_test_event_version, so priorities 1-11 are all satisfied (FILED is an allowed source status for filing, 2026-08-19T02:00Z is inside deadline + FILING_GRACE_DAYS 10 = 2026-08-27T01:00Z, coverage is complete, and the filer cert-1 never appended a log line)."
