        distinguishing_aspect: "Duty events are strictly increasing per driver: equal timestamp rejected, +1 minute accepted."
        test_recipe:
          setup: ["clock 2026-08-01T06:00:00Z; driver exists; one OFF_DUTY event at 06:00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
