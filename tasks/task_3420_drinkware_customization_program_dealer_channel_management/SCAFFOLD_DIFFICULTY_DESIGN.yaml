            - call: "POST /drinkware/enforcement-cases/${case_pr1}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "first", expected_dealer_version: "${dealer_pr_v2}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /drinkware/dealers/${dealer_pr}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { dealer_pr_v3: $.data.version }
            - call: "POST /drinkware/enforcement-cases/${case_pr2}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "second", expected_dealer_version: "${dealer_pr_v3}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "POST /drinkware/product-lines"
              payload: { name: "Rambler 26 oz pb", category: "DRINKWARE", base_sku: "RAM26P", base_custom_price_cents: 3200, map_price_cents: 3799, min_custom_quantity: 24, warranty_months_lid: 24, warranty_months_insulation: 36, warranty_months_hardware: 12 }
              as: PlatformAdmin
              captures: { pl_pr: $.data.id }
            - call: "POST /drinkware/colorway-drops"
              payload: { product_line_id: "${pl_pr}", color_name: "Probation Pink", pantone_code: "PMS 210", drop_type: "STANDARD", total_units: 40, dtc_reserved_units: 10, dealer_unit_price_cents: 2000, allocation_opens_at: "2026-09-05T00:00:00Z", allocation_closes_at: "2026-09-20T00:00:00Z", go_live_at: "2026-10-01T00:00:00Z", sales_end_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { drop_pr: $.data.id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${drop_pr}/open-allocation"
              payload: {}
              as: PlatformAdmin
          trigger:
