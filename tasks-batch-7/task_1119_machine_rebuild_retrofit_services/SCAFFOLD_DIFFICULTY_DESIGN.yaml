            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-B-108", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 800000, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
