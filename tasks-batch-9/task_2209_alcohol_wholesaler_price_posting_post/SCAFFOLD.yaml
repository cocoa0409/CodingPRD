# =============================================================================
# PRD Benchmark Scaffold — task_2209_alcohol_wholesaler_price_posting_post
# =============================================================================

scenario: |
  2209. Alcohol Wholesaler Price Posting & Post-and-Hold Compliance (state price posting program): monthly price schedule filing by brand, size and package with effective dates, post-and-hold windows allowing competitor amendments before prices take effect, quantity discount and combination-sale restrictions by state, price schedule error correction and late filing consequences, retailer invoicing validation against posted prices, promotional allowance and depletion allowance rules, brand registration prerequisites before posting, audit of off-posted-price sales and penalty exposure

domain_name: "alcohol-price-posting"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "expert_plus"

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        required: true
        description: "Two-letter state code identifying the price posting program."
        constraints: "unique across all StateProgram records"
      - name: program_name
        type: string
        source: input
        required: true
        description: "Display name of the state price posting program."
      - name: posting_deadline_day
        type: integer
        source: input
        required: false
        default: 10
        description: "Day of the posting month by which a price schedule must be filed to be on time."
        constraints: "1..28"
      - name: hold_window_days
        type: integer
        source: input
        required: false
        default: 3
        description: "Length in days of the post-and-hold window during which competitors may amend."
        constraints: ">= 1"
      - name: correction_window_days
        type: integer
        source: input
        required: false
        default: 15
        description: "Number of days after certification during which error corrections may be filed."
        constraints: ">= 1"
      - name: combo_cooldown_days
        type: integer
        source: input
        required: false
        default: 7
        description: "Buffer in days that must separate two combination-sale promotional windows for the same wholesaler."
        constraints: ">= 0"
      - name: quantity_discount_allowed
        type: boolean
        source: input
        required: false
        default: true
        description: "Whether quantity discount tiers may be attached to posted items in this state."
      - name: combination_sale_allowed
        type: boolean
        source: input
        required: false
        default: true
        description: "Whether combination sales may be declared in this state."
      - name: max_quantity_discount_pct
        type: number
        source: input
        required: false
        default: 0.15
        description: "Maximum permitted quantity discount percentage expressed as a decimal fraction."
        constraints: "0 .. 1"
      - name: max_promotional_allowance_pct
        type: number
        source: input
        required: false
        default: 0.05
        description: "Maximum promotional allowance as a decimal fraction of an invoice line's gross amount."
        constraints: "0 .. 1"
      - name: depletion_allowance_per_case_cents
        type: integer
        source: input
        required: false
        default: 150
        description: "Maximum depletion allowance in cents permitted per case sold."
        constraints: ">= 0"
      - name: late_filing_penalty_cents
        type: integer
        source: input
        required: false
        default: 250000
        description: "Penalty in cents accrued each time a price schedule is filed after the posting deadline."
        constraints: ">= 0"
      - name: repeat_correction_penalty_cents
        type: integer
        source: input
        required: false
        default: 100000
        description: "Penalty in cents accrued when a second error correction is approved on the same price schedule."
        constraints: ">= 0"
      - name: frivolous_amendment_penalty_cents
        type: integer
        source: input
        required: false
        default: 75000
        description: "Penalty in cents accrued once a wholesaler reaches three rejected hold amendments."
        constraints: ">= 0"
      - name: off_posted_penalty_rate_pct
        type: number
        source: input
        required: false
        default: 0.40
        description: "Penalty rate applied to each audit finding's variance, expressed as a decimal fraction."
        constraints: "0 .. 1"
      - name: max_corrections_per_schedule
        type: integer
        source: input
        required: false
        default: 2
        description: "Maximum number of approved error corrections permitted on a single price schedule."
        constraints: ">= 1"

