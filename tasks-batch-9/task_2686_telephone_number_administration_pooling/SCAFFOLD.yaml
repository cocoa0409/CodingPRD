scenario: |
  Generate task harder than expert level!

  2686. Telephone Number Administration & Pooling (numbering resource administration): carrier eligibility verification with licensing and facilities readiness before number assignment, number block allocation with thousand-block pooling and rate center assignment, utilization threshold demonstration required before additional resources are granted, forecast submission and audit of carrier utilization reports, number reclamation from carriers failing to activate resources within required timeframes, area code relief planning with jurisdictional splits and overlays including public comment, port administration support with routing data and number portability database updates, safety valve requests and growth allocation exceptions

domain_name: telephone-number-administration-pooling
api_prefix: "/numbering"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Blocks, rate centers, NPAs, carriers and filings form a many-to-many mesh
  # (a NumberBlock points at NPA + RateCenter + holder Carrier simultaneously;
  # a UtilizationFiling is keyed on the Carrier x RateCenter pair), and NPA is
  # self-referential through relief succession (relief_parent_npa_id).

  state_machine_shape: cyclic
  # AllocationRequest cycles PENDING_REVIEW -> INFO_REQUESTED -> PENDING_REVIEW,
  # UtilizationFiling cycles SUBMITTED -> UNDER_AUDIT -> REJECTED -> SUBMITTED,
  # NPA cycles ACTIVE -> JEOPARDY -> ACTIVE, NumberBlock carries two independent
  # parallel dimensions (allocation_status x routing_status), and ReliefPlan is a
  # branching fork-join (PUBLIC_COMMENT -> {OVERLAY_RECOMMENDED|SPLIT_RECOMMENDED} -> ORDERED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential      # NPA.relief_parent_npa_id -> NPA.id; PortRequest.supersedes_port_request_id -> PortRequest.id
    - cross_aggregate       # NumberBlock <-> Carrier <-> UtilizationFiling <-> AllocationRequest

  role_model: segregation_of_duties
  # The X-User-ID that recorded an audit finding may not dispose of it; the
  # X-User-ID that requested more information on an allocation request may not
  # approve it; the X-User-ID that recommended a relief type may not order it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: ocn
        type: string
        source: input
        description: "Four-character Operating Company Number identifying the carrier"
        constraints: "exactly 4 characters, uppercase A-Z or 0-9; unique across all Carrier rows"
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name as filed with the commission"
        constraints: "1..120 chars"
      - name: carrier_type
        type: enum
        source: input
        description: "Service category that determines which request types the carrier may file"
        constraints: "one of {ILEC, CLEC, WIRELESS, VOIP_INTERCONNECTED}"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter state whose commission licensed the carrier"
        constraints: "exactly 2 uppercase letters"
      - name: months_in_operation
        type: integer
        source: input
        description: "Months the carrier has been providing service; INITIAL requests require < 6, GROWTH requires >= 6"
        default: 0
        constraints: ">= 0"
      - name: license_status
        type: enum
        source: system
        description: "Commission licensing dimension, driven by POST /numbering/carriers/{carrier_id}/license-actions"
        default: NONE
        constraints: "one of {NONE, GRANTED, SUSPENDED, REVOKED}"
      - name: license_expires_on
        type: datetime
        source: system
        description: "Expiry instant stamped by the GRANT/RENEW license action; null while license_status == NONE"
        default: null
      - name: facilities_readiness_status
        type: enum
        source: system
        description: "Facilities-readiness dimension, driven by POST /numbering/carriers/{carrier_id}/readiness-events"
        default: NOT_SUBMITTED
        constraints: "one of {NOT_SUBMITTED, ATTESTED, VERIFIED, FAILED}"
      - name: switch_clli
        type: string
        source: system
        description: "Common Language Location Identifier of the carrier switch, captured from the ATTEST readiness event"
        default: null
      - name: interconnection_ready
        type: boolean
        source: system
        description: "True once the ATTEST readiness event declared interconnection in place"
        default: false
      - name: eligibility_status
        type: enum
        source: computed
        description: "Derived gate for every allocation: SUSPENDED when license_status IN {SUSPENDED, REVOKED}; PROBATION when license_status == GRANTED AND facilities_readiness_status == VERIFIED AND (reclamation_strike_count >= 2 OR (probation_until is not null AND probation_until > clock_now)); ELIGIBLE when license_status == GRANTED AND facilities_readiness_status == VERIFIED AND reclamation_strike_count < 2 AND (probation_until is null OR probation_until <= clock_now); INELIGIBLE otherwise. Licence EXPIRY is deliberately NOT part of this field - a granted-but-expired licence still reads ELIGIBLE here and is caught one step later by validations[priority=14] / ERR_LICENSE_EXPIRED"
        constraints: "one of {INELIGIBLE, ELIGIBLE, PROBATION, SUSPENDED}"
      - name: blocks_held_count
        type: integer
        source: computed
        description: "count of NumberBlock rows with holder_carrier_id == this Carrier.id AND allocation_status IN {RESERVED, ASSIGNED, RECLAMATION_PENDING}"
        default: 0
      - name: reclamation_strike_count
        type: integer
        source: system
        description: "Cumulative strikes: +1 on every ReclamationOrder EXECUTED against this carrier and +1 on every ACCEPTED AuditFinding whose penalty_action == RECLAMATION_REFERRAL"
        default: 0
      - name: safety_valve_grant_count
        type: integer
        source: system
        description: "Number of APPROVED AllocationRequest rows with request_type == SAFETY_VALVE for this carrier; capped at SAFETY_VALVE_MAX_GRANTS_PER_CARRIER"
        default: 0
      - name: probation_until
        type: datetime
        source: system
        description: "Instant probation lapses; stamped clock_now + PROBATION_DAYS when reclamation_strike_count reaches 2 or an ACCEPTED AuditFinding carries penalty_action == PROBATION"
        default: null

  - name: NPA
    parent: null
    common_fields: true
    fields:
      - name: npa_code
        type: string
        source: input
        description: "Three-digit area code"
        constraints: "exactly 3 digits, first digit 2-9; unique across all NPA rows"
      - name: state_code
        type: string
        source: input
        description: "Two-letter jurisdiction that regulates relief for this area code"
        constraints: "exactly 2 uppercase letters"
      - name: npa_type
        type: enum
        source: input
        description: "GEOGRAPHIC for an original code, OVERLAY for a successor code created by an ORDERED all-services-overlay ReliefPlan"
        default: GEOGRAPHIC
        constraints: "one of {GEOGRAPHIC, OVERLAY}"
      - name: relief_parent_npa_id
        type: string
        source: system
        description: "FK -> NPA.id; the predecessor code this NPA relieves. Set only by the ORDER transition of a ReliefPlan; null on originally created NPAs"
        default: null
      - name: status
        type: enum
        source: system
        description: "Exhaust posture of the code, recomputed by npa_exhaust_posture on every block allocation_status change"
        default: ACTIVE
        constraints: "one of {ACTIVE, JEOPARDY, RELIEF_PLANNED, EXHAUSTED, RETIRED}"
      - name: available_block_count
        type: integer
        source: computed
        description: "count of NumberBlock rows with npa_id == this NPA.id AND allocation_status == POOL_AVAILABLE"
        default: 0
      - name: total_block_count
        type: integer
        source: computed
        description: "count of all NumberBlock rows with npa_id == this NPA.id regardless of allocation_status"
        default: 0
      - name: exhaust_projection_months
        type: number
        source: computed
        description: "Output of npa_exhaust_posture: available_block_count divided by the trailing monthly assignment rate, 2dp; EXHAUST_SENTINEL_MONTHS when the rate is 0"
        default: null
      - name: jeopardy_declared_at
        type: datetime
        source: system
        description: "Instant status last became JEOPARDY; cleared to null when the code recovers to ACTIVE"
        default: null
      - name: permissive_dialing_end_at
        type: datetime
        source: system
        description: "Copied from the ORDERED ReliefPlan of this NPA; null until relief is ordered"
        default: null

  - name: RateCenter
    parent: NPA
    common_fields: true
    fields:
      - name: npa_id
        type: string
        source: input
        description: "FK -> NPA.id; the area code that serves this rate center"
      - name: name
        type: string
        source: input
        description: "Rate center name as published in LERG"
        constraints: "1..64 chars; unique within npa_id"
      - name: state_code
        type: string
        source: input
        description: "Two-letter jurisdiction of the rate center; must equal the parent NPA.state_code"
        constraints: "exactly 2 uppercase letters"
      - name: lata_code
        type: string
        source: input
        description: "Three-digit Local Access and Transport Area code"
        constraints: "exactly 3 digits"
      - name: pooling_status
        type: enum
        source: system
        description: "Thousand-block pooling posture, driven by POST /numbering/rate-centers/{rate_center_id}/pooling-transitions"
        default: NON_POOLED
        constraints: "one of {NON_POOLED, TRANSITIONAL, POOLED}"
      - name: pooling_effective_at
        type: datetime
        source: system
        description: "Instant pooling_status last became POOLED; null while NON_POOLED or TRANSITIONAL"
        default: null
      - name: available_block_count
        type: integer
        source: computed
        description: "count of NumberBlock rows with rate_center_id == this RateCenter.id AND allocation_status == POOL_AVAILABLE"
        default: 0
      - name: assigned_block_count
        type: integer
        source: computed
        description: "count of NumberBlock rows with rate_center_id == this RateCenter.id AND allocation_status IN {RESERVED, ASSIGNED, RECLAMATION_PENDING}"
        default: 0
      - name: aggregate_utilization_pct
        type: number
        source: computed
        description: "Output of rate_center_aggregate_utilization_pct (sum numerators and denominators across carriers first, round once, 2dp); null when no carrier has an effective filing for this rate center"
        default: null
      - name: jeopardy_flag
        type: boolean
        source: system
        description: "Mirrors the parent NPA entering JEOPARDY or EXHAUSTED; cleared when the NPA recovers to ACTIVE"
        default: false
      - name: accepts_initial_requests
        type: boolean
        source: computed
        description: "false when jeopardy_flag == true OR pooling_status == TRANSITIONAL; true otherwise"
        default: true
      - name: pending_request_count
        type: integer
        source: system
        description: "Incremented by 1 on every AllocationRequest created against this rate center, decremented by 1 whenever one of its requests leaves status IN {PENDING_REVIEW, INFO_REQUESTED}"
        default: 0
      - name: last_donation_block_count
        type: integer
        source: system
        description: "Blocks actually donated to the pool by the most recent COMPLETE_POOLING transition, output of pooling_donation_obligation"
        default: 0
      - name: donation_shortfall_count
        type: integer
        source: system
        description: "Obligation minus donated blocks summed across carriers on the most recent COMPLETE_POOLING transition"
        default: 0

  - name: NumberBlock
    parent: RateCenter
    common_fields: true
    fields:
      - name: npa_id
        type: string
        source: input
        description: "FK -> NPA.id; area code of the thousand-block"
      - name: rate_center_id
        type: string
        source: input
        description: "FK -> RateCenter.id; rate center the thousand-block is homed to; its npa_id must equal this block's npa_id"
      - name: nxx_code
        type: string
        source: input
        description: "Three-digit central office code"
        constraints: "exactly 3 digits, first digit 2-9"
      - name: thousands_digit
        type: integer
        source: input
        description: "Thousands digit identifying which block of 1000 numbers inside the NXX"
        constraints: "0..9"
      - name: block_label
        type: string
        source: computed
        description: "Concatenation NPA-NXX-D built from the parent NPA.npa_code, nxx_code and thousands_digit; unique across all NumberBlock rows"
      - name: allocation_status
        type: enum
        source: system
        description: "Inventory dimension of the block; evolves independently of routing_status"
        default: POOL_AVAILABLE
        constraints: "one of {POOL_AVAILABLE, RESERVED, ASSIGNED, RECLAMATION_PENDING, AGING, RETIRED}"
      - name: routing_status
        type: enum
        source: system
        description: "Network-routing dimension of the block; evolves independently of allocation_status"
        default: UNROUTED
        constraints: "one of {UNROUTED, ROUTING_PENDING, LERG_PUBLISHED, PORT_LOCKED, ROUTING_WITHDRAWN}"
      - name: holder_carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; carrier currently holding the block. Set by an APPROVED AllocationRequest or by the optional holder_carrier_id input on POST /numbering/blocks (legacy pre-pooling load); cleared when the block returns to POOL_AVAILABLE"
        default: null
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant the block last became ASSIGNED"
        default: null
      - name: activation_due_at
        type: datetime
        source: system
        description: "assigned_at + ACTIVATION_WINDOW_DAYS; the reclamation sweep issues an order once this instant is strictly in the past and activated_at is still null"
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant the holder confirmed in-service activation; null means the block has never been activated"
        default: null
      - name: aging_release_at
        type: datetime
        source: system
        description: "Instant an AGING block returns to POOL_AVAILABLE; stamped executed_at + AGING_PERIOD_DAYS by a reclamation execution"
        default: null
      - name: contaminated_count
        type: integer
        source: input
        description: "Count of the 1000 numbers in the block already assigned to end users at load time"
        default: 0
        constraints: "0..1000"
      - name: is_pooling_eligible
        type: boolean
        source: computed
        description: "contaminated_count <= CONTAMINATION_MAX_FOR_POOLING (100), i.e. at most 10 percent contaminated"
      - name: current_lrn
        type: string
        source: system
        description: "Location Routing Number of the single open PUBLISHED RoutingRecord for this block; null while routing_status IN {UNROUTED, ROUTING_WITHDRAWN}"
        default: null
      - name: npac_db_version
        type: integer
        source: system
        description: "Per-block portability-database counter incremented by 1 on every routing publication, supersede or withdrawal; never decremented"
        default: 0

  - name: AllocationRequest
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the applicant carrier"
      - name: rate_center_id
        type: string
        source: input
        description: "FK -> RateCenter.id; rate center the resources are requested in"
      - name: request_type
        type: enum
        source: input
        description: "INITIAL for a first block in the rate center, GROWTH for additional resources, POOL_REPLENISH for a pooling administrator replenishment, SAFETY_VALVE for an exception filing that bypasses the utilization and exhaust gates"
        constraints: "one of {INITIAL, GROWTH, POOL_REPLENISH, SAFETY_VALVE}"
      - name: requested_block_count
        type: integer
        source: input
        description: "Thousand-blocks the carrier asks for"
        constraints: "1..10"
      - name: justification
        type: string
        source: input
        description: "Free-text exception rationale; required when request_type == SAFETY_VALVE, otherwise optional"
        default: null
        constraints: "1..500 chars when present"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle of the filing"
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, INFO_REQUESTED, APPROVED, DENIED, SUPERSEDED, WITHDRAWN}"
      - name: info_request_count
        type: integer
        source: system
        description: "Times a REQUEST_INFO review has been recorded; capped at INFO_REQUEST_MAX_CYCLES"
        default: 0
      - name: utilization_pct_at_submission
        type: number
        source: computed
        description: "effective_utilization_pct of the applicant's effective UtilizationFiling for this rate center, snapshotted at creation and re-snapshotted on every resubmission, 2dp; null when no effective filing exists"
        default: null
      - name: months_to_exhaust_at_submission
        type: number
        source: computed
        description: "Output of rate_center_months_to_exhaust snapshotted at creation and on every resubmission, 2dp; the forward_looking variant for INITIAL/GROWTH/POOL_REPLENISH and the chronological variant for SAFETY_VALVE"
        default: null
      - name: granted_block_count
        type: integer
        source: system
        description: "Blocks actually granted by an APPROVE review; output of growth_grant_size unless the reviewer supplied a smaller granted_block_count"
        default: 0
      - name: assigned_block_ids
        type: array
        source: system
        description: "Ids of the NumberBlock rows the APPROVE review assigned, in the order block_pool_selection ranked them"
        default: []
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded the first REQUEST_INFO or the DENY review; segregation of duties bars this id from later approving the same request"
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: "X-User-ID of the RegulatoryApprover who recorded the APPROVE review"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant status last became APPROVED, DENIED, SUPERSEDED or WITHDRAWN"
        default: null
      - name: denial_reason
        type: enum
        source: system
        description: "Populated whenever status becomes DENIED: UTILIZATION_BELOW_THRESHOLD when growth_grant_size yields tier_cap 0, POOL_INSUFFICIENT when the pool cannot cover one block, CARRIER_PROBATION when the applicant is on probation at review time, REVIEWER_DENIED when an operator denied it outright"
        default: null
        constraints: "one of {UTILIZATION_BELOW_THRESHOLD, POOL_INSUFFICIENT, CARRIER_PROBATION, REVIEWER_DENIED}"
      - name: superseded_by_request_id
        type: string
        source: system
        description: "FK -> AllocationRequest.id; set on the older request when a newer request from the same carrier for the same rate center supersedes it"
        default: null

  - name: UtilizationFiling
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the reporting carrier"
      - name: rate_center_id
        type: string
        source: input
        description: "FK -> RateCenter.id; rate center the numbering-resource utilization report covers"
      - name: reporting_period
        type: string
        source: input
        description: "Half-year the report covers; string ordering is the chronological ordering"
        constraints: "matches YYYY-H1 or YYYY-H2; unique per (carrier_id, rate_center_id)"
      - name: numbers_assigned
        type: integer
        source: input
        description: "Numbers working with end users at period end"
        constraints: ">= 0"
      - name: numbers_intermediate
        type: integer
        source: input
        description: "Numbers given to a reseller or intermediate provider at period end"
        constraints: ">= 0"
      - name: numbers_reserved
        type: integer
        source: input
        description: "Numbers held at a customer's request at period end"
        constraints: ">= 0"
      - name: numbers_aging
        type: integer
        source: input
        description: "Disconnected numbers in the aging interval at period end; excluded from the denominator"
        constraints: ">= 0"
      - name: numbers_administrative
        type: integer
        source: input
        description: "Numbers used for internal test and administrative purposes; excluded from the denominator"
        constraints: ">= 0"
      - name: blocks_held_at_period_end
        type: integer
        source: input
        description: "Thousand-blocks the carrier reports holding in this rate center at period end; the denominator basis"
        constraints: ">= 1"
      - name: forecast_quarters
        type: array
        source: input
        description: "Exactly four integers: projected net number demand for the next four quarters, index 0 nearest"
        constraints: "length == 4, every element >= 0"
      - name: status
        type: enum
        source: system
        description: "Filing lifecycle; only SUBMITTED and ACCEPTED filings can be the effective filing for allocation gating"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_AUDIT, ACCEPTED, REJECTED}"
      - name: claimed_utilization_pct
        type: number
        source: computed
        description: "Output of filing_utilization_pct variant carrier_claimed: (numbers_assigned + numbers_intermediate + numbers_reserved) over the denominator, 2dp"
        default: null
      - name: strict_utilization_pct
        type: number
        source: computed
        description: "Output of filing_utilization_pct variant strict_assigned_only: numbers_assigned alone over the denominator, 2dp"
        default: null
      - name: audited_utilization_pct
        type: number
        source: system
        description: "Utilization on the audited basis, stamped when an AuditFinding on this filing is ACCEPTED; null while the carrier-claimed figure stands"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant status last became SUBMITTED"
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: "Times the filing has been resubmitted out of REJECTED"
        default: 0

  - name: AuditFinding
    parent: UtilizationFiling
    common_fields: true
    fields:
      - name: utilization_filing_id
        type: string
        source: input
        description: "FK -> UtilizationFiling.id; the filing under audit"
      - name: auditor_user_id
        type: string
        source: system
        description: "X-User-ID of the NumberingAdministrator who recorded the finding; segregation of duties bars this id from disposing of the finding"
      - name: finding_type
        type: enum
        source: input
        description: "Audit conclusion; the three non-NO_DISCREPANCY values require the adjusted_* inputs"
        constraints: "one of {NO_DISCREPANCY, UNDERSTATED_UTILIZATION, OVERSTATED_UTILIZATION, MISSING_DATA}"
      - name: adjusted_numbers_assigned
        type: integer
        source: input
        description: "Auditor-corrected numbers_assigned; required when finding_type IN {UNDERSTATED_UTILIZATION, OVERSTATED_UTILIZATION}, forbidden otherwise"
        default: null
        constraints: ">= 0"
      - name: adjusted_numbers_administrative
        type: integer
        source: input
        description: "Auditor-corrected numbers_administrative; optional and only allowed when finding_type IN {UNDERSTATED_UTILIZATION, OVERSTATED_UTILIZATION}"
        default: null
        constraints: ">= 0"
      - name: adjusted_utilization_pct
        type: number
        source: computed
        description: "Output of filing_utilization_pct variant strict_assigned_only recomputed over the adjusted inputs, 2dp; null when finding_type IN {NO_DISCREPANCY, MISSING_DATA}"
        default: null
      - name: penalty_action
        type: enum
        source: computed
        description: "Output of audit_penalty_action over abs(claimed_utilization_pct - adjusted_utilization_pct); NONE when finding_type == NO_DISCREPANCY"
        constraints: "one of {NONE, PROBATION, RECLAMATION_REFERRAL}"
      - name: status
        type: enum
        source: system
        description: "Disposition lifecycle of the finding"
        default: OPEN
        constraints: "one of {OPEN, ACCEPTED, REJECTED}"
      - name: disposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who accepted or rejected the finding"
        default: null
      - name: disposition_note
        type: string
        source: input
        description: "Rationale captured on the disposition call"
        default: null

  - name: ReclamationOrder
    parent: NumberBlock
    common_fields: true
    fields:
      - name: number_block_id
        type: string
        source: system
        description: "FK -> NumberBlock.id; the block being reclaimed"
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; the holder the order is served on, copied from NumberBlock.holder_carrier_id at issuance"
      - name: reason
        type: enum
        source: system
        description: "ACTIVATION_DEADLINE_MISSED when the sweep found activation_due_at strictly in the past with activated_at null; UTILIZATION_SHORTFALL when the sweep found the holder's effective utilization below UTILIZATION_MIN_PCT_GROWTH; LICENSE_REVOKED when a REVOKE license action swept the holder's blocks; VOLUNTARY_RETURN when the holder surrendered the block outside a sweep"
        constraints: "one of {ACTIVATION_DEADLINE_MISSED, UTILIZATION_SHORTFALL, LICENSE_REVOKED, VOLUNTARY_RETURN}"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle"
        default: ISSUED
        constraints: "one of {ISSUED, SURRENDER_ACKNOWLEDGED, APPEAL_PENDING, WITHDRAWN, EXECUTED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the sweep or license revocation issued the order"
      - name: response_due_at
        type: datetime
        source: system
        description: "issued_at + RECLAMATION_RESPONSE_DAYS; a sweep executes unanswered orders once this instant is strictly in the past"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant status became EXECUTED"
        default: null
      - name: appeal_note
        type: string
        source: input
        description: "Carrier rationale captured on the APPEAL transition"
        default: null
      - name: strike_applied
        type: boolean
        source: system
        description: "True once the execution incremented the holder's reclamation_strike_count; guarantees at most one strike per order"
        default: false

  - name: ReliefPlan
    parent: NPA
    common_fields: true
    fields:
      - name: npa_id
        type: string
        source: input
        description: "FK -> NPA.id; the code being relieved"
      - name: planned_relief_type
        type: enum
        source: input
        description: "Relief type the administrator proposes before public comment"
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, ALL_SERVICES_OVERLAY, GEOGRAPHIC_SPLIT}"
      - name: status
        type: enum
        source: system
        description: "Relief lifecycle; the fork after PUBLIC_COMMENT is decided by comment_tally_weighted"
        default: PLANNING
        constraints: "one of {PLANNING, PUBLIC_COMMENT, OVERLAY_RECOMMENDED, SPLIT_RECOMMENDED, ORDERED, WITHDRAWN}"
      - name: comment_window_days
        type: integer
        source: input
        description: "Length of the public comment window opened by the OPEN_COMMENT transition"
        default: 30
        constraints: "7..90"
      - name: comment_window_open_at
        type: datetime
        source: system
        description: "Logical-clock instant OPEN_COMMENT ran; null while PLANNING"
        default: null
      - name: comment_window_close_at
        type: datetime
        source: system
        description: "comment_window_open_at + comment_window_days; comments are accepted on the half-open interval [open, close) - a comment filed at exactly comment_window_close_at is refused by validations[priority=21], while CLOSE_AND_RECOMMEND at that same instant is accepted"
        default: null
      - name: recommended_relief_type
        type: enum
        source: system
        description: "Output of comment_tally_weighted stamped by CLOSE_AND_RECOMMEND"
        default: null
        constraints: "one of {ALL_SERVICES_OVERLAY, GEOGRAPHIC_SPLIT}"
      - name: support_overlay_weight
        type: number
        source: computed
        description: "Sum of comment weights with position == SUPPORT_OVERLAY inside the closed comment window, summed raw then rounded once to 2dp"
        default: null
      - name: support_split_weight
        type: number
        source: computed
        description: "Sum of comment weights with position == SUPPORT_SPLIT inside the closed comment window, summed raw then rounded once to 2dp"
        default: null
      - name: comment_count
        type: integer
        source: computed
        description: "count of PublicComment rows with relief_plan_id == this ReliefPlan.id"
        default: 0
      - name: recommender_user_id
        type: string
        source: system
        description: "X-User-ID that ran CLOSE_AND_RECOMMEND; segregation of duties bars this id from running ORDER"
        default: null
      - name: ordering_user_id
        type: string
        source: system
        description: "X-User-ID that ran ORDER"
        default: null
      - name: new_npa_code
        type: string
        source: input
        description: "Three-digit successor code supplied on the ORDER transition"
        default: null
        constraints: "exactly 3 digits, first digit 2-9; must not collide with an existing NPA.npa_code"
      - name: effective_at
        type: datetime
        source: input
        description: "Relief implementation instant supplied on the ORDER transition; must be strictly after the logical clock"
        default: null
      - name: permissive_dialing_end_at
        type: datetime
        source: system
        description: "effective_at + PERMISSIVE_DIALING_DAYS, stamped by ORDER"
        default: null
      - name: successor_npa_id
        type: string
        source: system
        description: "FK -> NPA.id; the NPA row the ORDER transition created"
        default: null
      - name: window_end_at
        type: datetime
        source: computed
        description: "permissive_dialing_end_at when status == ORDERED, otherwise comment_window_close_at; null when status IN {PLANNING, WITHDRAWN}. Defines the closed occupied interval used by the relief-window overlap check"
        default: null

  - name: PublicComment
    parent: ReliefPlan
    common_fields: false
    fields:
      - name: relief_plan_id
        type: string
        source: input
        description: "FK -> ReliefPlan.id; the plan being commented on"
      - name: commenter_type
        type: enum
        source: input
        description: "Commenter category that selects the tally weight"
        constraints: "one of {CONSUMER, BUSINESS, CARRIER, GOVERNMENT}"
      - name: position
        type: enum
        source: input
        description: "Stance taken by the comment; OPPOSE_BOTH counts toward comment_count but toward neither support weight"
        constraints: "one of {SUPPORT_OVERLAY, SUPPORT_SPLIT, OPPOSE_BOTH}"
      - name: body
        type: string
        source: input
        description: "Comment text"
        constraints: "1..1000 chars"
      - name: weight
        type: number
        source: computed
        description: "COMMENT_WEIGHTS[commenter_type]; CONSUMER 1.0, BUSINESS 1.5, CARRIER 2.0, GOVERNMENT 3.0"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the comment was filed; must lie on the closed interval [comment_window_open_at, comment_window_close_at]"

  - name: PortRequest
    parent: null
    common_fields: true
    fields:
      - name: telephone_number
        type: string
        source: input
        description: "Ten-digit number being ported; its first seven digits and thousands digit must fall inside the referenced block"
        constraints: "exactly 10 digits"
      - name: number_block_id
        type: string
        source: input
        description: "FK -> NumberBlock.id; block the ported number lives in"
      - name: from_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the losing carrier, which must equal NumberBlock.holder_carrier_id"
      - name: to_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the gaining carrier, which must differ from from_carrier_id"
      - name: requested_lrn
        type: string
        source: input
        description: "Ten-digit Location Routing Number the gaining carrier will route the number to"
        constraints: "exactly 10 digits"
      - name: desired_due_at
        type: datetime
        source: input
        description: "Requested port completion instant; must be strictly after the logical clock at creation"
      - name: status
        type: enum
        source: system
        description: "Port lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, CONCURRED, ACTIVATED, REJECTED, CANCELLED, SNAPPED_BACK}"
      - name: concurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the losing carrier concurred"
        default: null
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant porting operations activated the port"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant status last became REJECTED, CANCELLED or SNAPPED_BACK"
        default: null
      - name: reject_reason
        type: string
        source: input
        description: "Rationale captured on the REJECT or CANCEL transition"
        default: null
      - name: npac_db_version_at_activation
        type: integer
        source: system
        description: "NumberBlock.npac_db_version observed immediately after the activation published the new routing record"
        default: null
      - name: supersedes_port_request_id
        type: string
        source: system
        description: "FK -> PortRequest.id; set when this request replaced an earlier SUBMITTED request for the same telephone_number"
        default: null

  - name: RoutingRecord
    parent: NumberBlock
    common_fields: false
    fields:
      - name: number_block_id
        type: string
        source: input
        description: "FK -> NumberBlock.id; block the routing record covers"
      - name: lrn
        type: string
        source: input
        description: "Ten-digit Location Routing Number the block routes to for this interval"
        constraints: "exactly 10 digits"
      - name: ocn
        type: string
        source: system
        description: "Operating Company Number of the block's holder at publication time"
      - name: switch_clli
        type: string
        source: input
        description: "Common Language Location Identifier of the terminating switch"
        constraints: "1..11 chars"
      - name: effective_at
        type: datetime
        source: input
        description: "Start of the half-open routing interval [effective_at, end_at)"
      - name: end_at
        type: datetime
        source: system
        description: "Exclusive end of the routing interval; null while the record is the single open PUBLISHED record for the block"
        default: null
      - name: record_status
        type: enum
        source: system
        description: "PUBLISHED for the open record, SUPERSEDED once a later record starts, WITHDRAWN when reclamation execution pulled the block out of routing"
        default: PUBLISHED
        constraints: "one of {PUBLISHED, SUPERSEDED, WITHDRAWN}"
      - name: npac_db_version
        type: integer
        source: system
        description: "Value of NumberBlock.npac_db_version immediately after this record was written"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Carrier
    initial_state: NONE
    terminal_states: [REVOKED]
    note: |
      PARALLEL DIMENSIONS. Two independent status axes live on one Carrier row and
      advance without touching each other: dimension L is `license_status`
      (NONE -> GRANTED <-> SUSPENDED -> REVOKED, with a GRANTED -> GRANTED renew
      self-loop) and dimension F is `facilities_readiness_status`
      (NOT_SUBMITTED -> ATTESTED -> VERIFIED, ATTESTED -> FAILED -> ATTESTED).
      `initial_state`/`terminal_states` above describe dimension L. The derived
      `eligibility_status` is a function of both axes plus reclamation_strike_count
      and probation_until; it is never written directly.
    transitions:
      - from: NONE
        to: GRANTED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=GRANT"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status == NONE"
          - "payload license_expires_on is present and strictly after the logical clock"
        side_effects:
          - "sets license_status = GRANTED and license_expires_on = payload license_expires_on"
          - "recomputes eligibility_status (becomes ELIGIBLE only if facilities_readiness_status is already VERIFIED)"
          - "increments Carrier.version by 1 and refreshes updated_at"
      - from: GRANTED
        to: GRANTED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=RENEW"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status == GRANTED"
          - "payload license_expires_on is strictly after carrier.license_expires_on"
        side_effects:
          - "extends license_expires_on to payload license_expires_on"
          - "increments Carrier.version by 1"
        note: "Renew self-loop; the licensing axis is cyclic, not a one-way pipeline."
      - from: GRANTED
        to: SUSPENDED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=SUSPEND"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status == GRANTED"
        side_effects:
          - "sets license_status = SUSPENDED; eligibility_status recomputes to SUSPENDED"
          - "held blocks are NOT disturbed - suspension blocks new allocations only"
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=REINSTATE"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status == SUSPENDED"
          - "carrier.license_expires_on is strictly after the logical clock"
        side_effects:
          - "sets license_status = GRANTED; eligibility_status recomputes"
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=REVOKE"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status IN {GRANTED, SUSPENDED}"
        side_effects:
          - "sets license_status = REVOKED; eligibility_status recomputes to SUSPENDED"
          - "CASCADE step 1: every NumberBlock with holder_carrier_id == this carrier AND allocation_status IN {RESERVED, ASSIGNED}, in created_at ASC order, moves to RECLAMATION_PENDING"
          - "CASCADE step 2: because each of those blocks entered RECLAMATION_PENDING, one ReclamationOrder per block is created with reason = LICENSE_REVOKED, status = ISSUED, issued_at = clock_now, response_due_at = clock_now + RECLAMATION_RESPONSE_DAYS"
          - "CASCADE step 3: because the blocks left {RESERVED, ASSIGNED}, RateCenter.assigned_block_count and Carrier.blocks_held_count are recomputed for each affected rate center"
          - "every PENDING_REVIEW or INFO_REQUESTED AllocationRequest of this carrier moves to DENIED with denial_reason = CARRIER_PROBATION and decided_at = clock_now, decrementing RateCenter.pending_request_count by 1 each"
          - "increments Carrier.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /numbering/carriers/{carrier_id}/license-actions with action=REVOKE"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.license_status IN {GRANTED, SUSPENDED}"
        side_effects:
          - "identical to the SUSPENDED -> REVOKED cascade above"
      - from: NOT_SUBMITTED
        to: ATTESTED
        trigger: "POST /numbering/carriers/{carrier_id}/readiness-events with event=ATTEST"
        actor: CarrierRepresentative
        preconditions:
          - "X-User-ID equals {carrier_id} in the path"
          - "carrier.facilities_readiness_status IN {NOT_SUBMITTED, FAILED}"
          - "payload switch_clli and interconnection_ready are present"
        side_effects:
          - "sets facilities_readiness_status = ATTESTED, switch_clli and interconnection_ready from the payload"
          - "increments Carrier.version by 1"
      - from: ATTESTED
        to: VERIFIED
        trigger: "POST /numbering/carriers/{carrier_id}/readiness-events with event=VERIFY"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.facilities_readiness_status == ATTESTED"
          - "carrier.interconnection_ready == true"
        side_effects:
          - "sets facilities_readiness_status = VERIFIED"
          - "recomputes eligibility_status (becomes ELIGIBLE when license_status == GRANTED and the license has not expired)"
          - "increments Carrier.version by 1"
      - from: ATTESTED
        to: FAILED
        trigger: "POST /numbering/carriers/{carrier_id}/readiness-events with event=FAIL"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.facilities_readiness_status == ATTESTED"
        side_effects:
          - "sets facilities_readiness_status = FAILED; eligibility_status recomputes to INELIGIBLE"
          - "increments Carrier.version by 1"
      - from: VERIFIED
        to: FAILED
        trigger: "POST /numbering/carriers/{carrier_id}/readiness-events with event=FAIL"
        actor: NumberingAdministrator
        preconditions:
          - "carrier.facilities_readiness_status == VERIFIED"
        side_effects:
          - "a failed re-inspection revokes verified readiness: sets facilities_readiness_status = FAILED and eligibility_status recomputes to INELIGIBLE even though the licensing axis is untouched"
          - "held blocks are NOT disturbed - failed readiness blocks new allocations only"
          - "increments Carrier.version by 1"
      - from: FAILED
        to: ATTESTED
        trigger: "POST /numbering/carriers/{carrier_id}/readiness-events with event=ATTEST"
        actor: CarrierRepresentative
        preconditions:
          - "X-User-ID equals {carrier_id} in the path"
          - "carrier.facilities_readiness_status == FAILED"
        side_effects:
          - "sets facilities_readiness_status = ATTESTED with the resubmitted switch_clli"
          - "increments Carrier.version by 1"
        note: "Readiness axis is cyclic: a failed inspection can be re-attested without touching the licensing axis."

  - entity: NPA
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: "Cyclic exhaust posture: ACTIVE <-> JEOPARDY <-> EXHAUSTED plus the direct ACTIVE <-> EXHAUSTED pair for a code whose pool goes to zero (or back above four) in a single recomputation, with RELIEF_PLANNED entered from either distressed state and RETIRED reachable only when a GEOGRAPHIC_SPLIT order moves every rate center off the code. Every edge is derived from npa_exhaust_posture, so the machine is total: whatever posture the calculation returns, an edge exists to reach it."
    transitions:
      - from: ACTIVE
        to: JEOPARDY
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == ACTIVE"
          - "0 < npa.available_block_count <= NPA_JEOPARDY_AVAILABLE_BLOCKS (4) after the change - an available count of exactly 0 takes the ACTIVE -> EXHAUSTED edge instead"
        side_effects:
          - "sets status = JEOPARDY and jeopardy_declared_at = clock_now"
          - "CASCADE: because the code entered JEOPARDY, every RateCenter with npa_id == this NPA gets jeopardy_flag = true, which flips their computed accepts_initial_requests to false"
          - "increments NPA.version by 1 and each touched RateCenter.version by 1"
      - from: ACTIVE
        to: JEOPARDY
        trigger: "POST /numbering/npas/{npa_id}/jeopardy-declarations"
        actor: NumberingAdministrator
        preconditions:
          - "npa.status == ACTIVE"
        side_effects:
          - "identical side effects to the automatic threshold transition above"
        note: "Manual declaration exists because the administrator may declare jeopardy on forecast grounds before the block threshold is crossed."
      - from: JEOPARDY
        to: ACTIVE
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == JEOPARDY"
          - "npa.available_block_count > NPA_JEOPARDY_AVAILABLE_BLOCKS (4) after the change"
        side_effects:
          - "sets status = ACTIVE and jeopardy_declared_at = null"
          - "CASCADE: every RateCenter with npa_id == this NPA gets jeopardy_flag = false, restoring accepts_initial_requests"
          - "increments NPA.version by 1 and each touched RateCenter.version by 1"
      - from: JEOPARDY
        to: EXHAUSTED
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == JEOPARDY"
          - "npa.available_block_count == 0 after the change"
        side_effects:
          - "sets status = EXHAUSTED; jeopardy_declared_at retained"
          - "rate-center jeopardy_flag values stay true"
      - from: EXHAUSTED
        to: JEOPARDY
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == EXHAUSTED"
          - "0 < npa.available_block_count <= NPA_JEOPARDY_AVAILABLE_BLOCKS (4) after the change"
        side_effects:
          - "sets status = JEOPARDY"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == ACTIVE"
          - "npa.available_block_count == 0 after the change"
        side_effects:
          - "sets status = EXHAUSTED and leaves jeopardy_declared_at null - the code skips JEOPARDY because the very first recomputation already found an empty pool, which is what happens when a code is loaded with nothing but already-assigned blocks"
          - "CASCADE: every RateCenter with npa_id == this NPA gets jeopardy_flag = true, flipping accepts_initial_requests to false"
          - "increments NPA.version by 1 and each touched RateCenter.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system event: npa_exhaust_posture recomputation after any NumberBlock.allocation_status change inside the code"
        actor: system
        preconditions:
          - "npa.status == EXHAUSTED"
          - "npa.available_block_count > NPA_JEOPARDY_AVAILABLE_BLOCKS (4) after the change"
          - "npa.jeopardy_declared_at is null - a manual declaration keeps the code in JEOPARDY per npa_exhaust_posture"
        side_effects:
          - "sets status = ACTIVE and jeopardy_declared_at = null"
          - "CASCADE: every RateCenter with npa_id == this NPA gets jeopardy_flag = false, restoring accepts_initial_requests"
          - "increments NPA.version by 1 and each touched RateCenter.version by 1"
      - from: JEOPARDY
        to: RELIEF_PLANNED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
        actor: RegulatoryApprover
        preconditions:
          - "npa.status IN {JEOPARDY, EXHAUSTED}"
          - "the ordering ReliefPlan.npa_id == this NPA.id"
          - "at least one RateCenter remains on this NPA after the split reassignment"
        side_effects:
          - "sets status = RELIEF_PLANNED and permissive_dialing_end_at = plan.permissive_dialing_end_at"
          - "increments NPA.version by 1"
      - from: EXHAUSTED
        to: RELIEF_PLANNED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
        actor: RegulatoryApprover
        preconditions:
          - "npa.status IN {JEOPARDY, EXHAUSTED}"
          - "at least one RateCenter remains on this NPA after the split reassignment"
        side_effects:
          - "identical to the JEOPARDY -> RELIEF_PLANNED transition"
      - from: JEOPARDY
        to: RETIRED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER on a plan whose recommended_relief_type == GEOGRAPHIC_SPLIT"
        actor: RegulatoryApprover
        preconditions:
          - "npa.status IN {JEOPARDY, EXHAUSTED}"
          - "the split reassignment moves every RateCenter of this NPA to the successor code"
        side_effects:
          - "sets status = RETIRED"
          - "CASCADE: because the code retired, every NumberBlock still on it with allocation_status == POOL_AVAILABLE moves to RETIRED"
          - "increments NPA.version by 1"

  - entity: RateCenter
    initial_state: NON_POOLED
    terminal_states: [POOLED]
    transitions:
      - from: NON_POOLED
        to: TRANSITIONAL
        trigger: "POST /numbering/rate-centers/{rate_center_id}/pooling-transitions with action=BEGIN_POOLING"
        actor: NumberingAdministrator
        preconditions:
          - "rate_center.pooling_status == NON_POOLED"
        side_effects:
          - "sets pooling_status = TRANSITIONAL; computed accepts_initial_requests flips to false"
          - "increments RateCenter.version by 1"
      - from: TRANSITIONAL
        to: NON_POOLED
        trigger: "POST /numbering/rate-centers/{rate_center_id}/pooling-transitions with action=REVERT"
        actor: NumberingAdministrator
        preconditions:
          - "rate_center.pooling_status == TRANSITIONAL"
        side_effects:
          - "sets pooling_status = NON_POOLED; accepts_initial_requests recomputes from jeopardy_flag alone"
          - "increments RateCenter.version by 1"
      - from: TRANSITIONAL
        to: POOLED
        trigger: "POST /numbering/rate-centers/{rate_center_id}/pooling-transitions with action=COMPLETE_POOLING"
        actor: NumberingAdministrator
        preconditions:
          - "rate_center.pooling_status == TRANSITIONAL"
          - "no AllocationRequest for this rate center is in status IN {PENDING_REVIEW, INFO_REQUESTED} (rate_center.pending_request_count == 0)"
        side_effects:
          - "sets pooling_status = POOLED and pooling_effective_at = clock_now"
          - "runs pooling_donation_obligation per holding carrier in Carrier.created_at ASC order; each donated block moves allocation_status {RESERVED, ASSIGNED} -> POOL_AVAILABLE with holder_carrier_id, assigned_at, activation_due_at and activated_at cleared"
          - "CASCADE: because blocks became POOL_AVAILABLE, RateCenter.available_block_count / assigned_block_count and each donor Carrier.blocks_held_count are recomputed, then NPA.available_block_count is recomputed, which may fire the NPA JEOPARDY -> ACTIVE recovery transition"
          - "sets last_donation_block_count and donation_shortfall_count from the run"
          - "recomputes aggregate_utilization_pct"
          - "increments RateCenter.version by 1 and each donor Carrier.version by 1"

  - entity: NumberBlock
    initial_state: POOL_AVAILABLE
    terminal_states: [RETIRED]
    note: |
      PARALLEL DIMENSIONS. Dimension A is `allocation_status`
      (POOL_AVAILABLE -> RESERVED -> ASSIGNED, RESERVED/ASSIGNED -> RECLAMATION_PENDING
      -> AGING -> POOL_AVAILABLE, RECLAMATION_PENDING -> RESERVED/ASSIGNED on withdrawal,
      POOL_AVAILABLE -> RETIRED). Dimension R is `routing_status`
      (UNROUTED -> ROUTING_PENDING -> LERG_PUBLISHED <-> PORT_LOCKED, and
      LERG_PUBLISHED/PORT_LOCKED -> ROUTING_WITHDRAWN -> ROUTING_PENDING).
      The two axes never gate each other's transitions: publishing routing data
      leaves allocation_status untouched, and a reclamation sweep moves
      allocation_status while routing_status stays exactly where it was.
      `initial_state`/`terminal_states` above describe dimension A.
    transitions:
      - from: POOL_AVAILABLE
        to: RESERVED
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE (block chosen by block_pool_selection)"
        actor: RegulatoryApprover
        preconditions:
          - "block.allocation_status == POOL_AVAILABLE"
          - "block.routing_status IN {UNROUTED, ROUTING_WITHDRAWN}"
          - "when rate_center.pooling_status != POOLED, block.contaminated_count == 0"
        side_effects:
          - "sets holder_carrier_id = request.carrier_id, assigned_at = clock_now, activation_due_at = clock_now + ACTIVATION_WINDOW_DAYS, activated_at = null"
          - "CASCADE: because the block left POOL_AVAILABLE, RateCenter.available_block_count / assigned_block_count and Carrier.blocks_held_count are recomputed, then NPA.available_block_count is recomputed, which can fire the NPA ACTIVE -> JEOPARDY transition"
          - "increments NumberBlock.version by 1"
      - from: POOL_AVAILABLE
        to: RESERVED
        trigger: "POST /numbering/blocks with holder_carrier_id supplied (legacy pre-pooling load)"
        actor: NumberingAdministrator
        preconditions:
          - "the referenced carrier exists and eligibility_status IN {ELIGIBLE, PROBATION}"
        side_effects:
          - "creates the block already holding: holder_carrier_id set, assigned_at = clock_now, activation_due_at = clock_now + ACTIVATION_WINDOW_DAYS"
          - "when mark_activated == true the block continues straight to ASSIGNED with activated_at = clock_now"
          - "recomputes RateCenter and NPA block counters and Carrier.blocks_held_count"
      - from: RESERVED
        to: ASSIGNED
        trigger: "POST /numbering/blocks/{block_id}/activation-confirmations"
        actor: CarrierRepresentative
        preconditions:
          - "block.allocation_status == RESERVED"
          - "X-User-ID equals block.holder_carrier_id"
          - "the logical clock is at or before block.activation_due_at"
        side_effects:
          - "sets activated_at = clock_now"
          - "increments NumberBlock.version by 1"
      - from: RESERVED
        to: RECLAMATION_PENDING
        trigger: "POST /numbering/reclamation-sweeps (activation deadline missed)"
        actor: NumberingAdministrator
        preconditions:
          - "block.allocation_status == RESERVED"
          - "block.activated_at is null"
          - "block.activation_due_at is strictly before the sweep instant"
        side_effects:
          - "creates a ReclamationOrder with reason = ACTIVATION_DEADLINE_MISSED, status = ISSUED, issued_at = sweep instant, response_due_at = sweep instant + RECLAMATION_RESPONSE_DAYS"
          - "routing_status is left exactly as it was - the two dimensions are independent"
          - "increments NumberBlock.version by 1"
      - from: ASSIGNED
        to: RECLAMATION_PENDING
        trigger: "POST /numbering/reclamation-sweeps (utilization shortfall) or a REVOKE license action"
        actor: NumberingAdministrator
        preconditions:
          - "block.allocation_status == ASSIGNED"
          - "for the sweep path: the holder's effective UtilizationFiling for this rate center reports strict_utilization_pct strictly below UTILIZATION_MIN_PCT_GROWTH, or the holder has no UtilizationFiling in status SUBMITTED or ACCEPTED for the rate center"
        side_effects:
          - "creates a ReclamationOrder with reason = UTILIZATION_SHORTFALL (sweep) or LICENSE_REVOKED (license path)"
          - "increments NumberBlock.version by 1"
      - from: RECLAMATION_PENDING
        to: RESERVED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=WITHDRAW"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, APPEAL_PENDING}"
          - "block.activated_at is null"
        side_effects:
          - "restores allocation_status to RESERVED because the block was never activated (COMPENSATION of the sweep)"
          - "increments NumberBlock.version by 1"
      - from: RECLAMATION_PENDING
        to: ASSIGNED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=WITHDRAW"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, APPEAL_PENDING}"
          - "block.activated_at is not null"
        side_effects:
          - "restores allocation_status to ASSIGNED because the block had been activated (COMPENSATION of the sweep)"
          - "increments NumberBlock.version by 1"
      - from: RECLAMATION_PENDING
        to: AGING
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=EXECUTE"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, SURRENDER_ACKNOWLEDGED, APPEAL_PENDING}"
          - "block.allocation_status == RECLAMATION_PENDING"
        side_effects:
          - "sets aging_release_at = clock_now + AGING_PERIOD_DAYS, clears holder_carrier_id, assigned_at, activation_due_at and activated_at"
          - "CASCADE step 2 of the reclamation chain: because the block left the holder, Carrier.blocks_held_count is recomputed and Carrier.reclamation_strike_count is incremented by 1 (order.strike_applied = true)"
          - "CASCADE step 3: because reclamation_strike_count reached RECLAMATION_PROBATION_STRIKES (2), eligibility_status becomes PROBATION and probation_until = clock_now + PROBATION_DAYS"
          - "CASCADE step 4: because the carrier entered PROBATION, each of its AllocationRequest rows in status PENDING_REVIEW with request_type IN {GROWTH, POOL_REPLENISH}, in created_at ASC order, moves to INFO_REQUESTED with info_request_count incremented by 1"
          - "when routing_status IN {LERG_PUBLISHED, PORT_LOCKED} it becomes ROUTING_WITHDRAWN, the open PUBLISHED RoutingRecord gets end_at = clock_now and record_status = WITHDRAWN, current_lrn is cleared and npac_db_version is incremented by 1; when routing_status IN {UNROUTED, ROUTING_PENDING} the routing axis is left untouched"
          - "increments NumberBlock.version by 1"
      - from: AGING
        to: POOL_AVAILABLE
        trigger: "POST /numbering/reclamation-sweeps (aging release pass)"
        actor: NumberingAdministrator
        preconditions:
          - "block.allocation_status == AGING"
          - "block.aging_release_at is at or before the sweep instant (inclusive)"
        side_effects:
          - "clears aging_release_at"
          - "CASCADE: RateCenter.available_block_count and NPA.available_block_count are recomputed, which can fire the NPA JEOPARDY -> ACTIVE recovery transition"
          - "increments NumberBlock.version by 1"
        note: "Aging release uses an INCLUSIVE boundary (<=) while the activation-deadline sweep uses a STRICT boundary (<)."
      - from: POOL_AVAILABLE
        to: RETIRED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER whose split retires the parent NPA"
        actor: RegulatoryApprover
        preconditions:
          - "the parent NPA transitions to RETIRED"
          - "block.allocation_status == POOL_AVAILABLE"
        side_effects:
          - "recomputes NPA.available_block_count to 0"
      - from: UNROUTED
        to: LERG_PUBLISHED
        trigger: "POST /numbering/blocks/{block_id}/routing-records with effective_at at or before the logical clock"
        actor: NumberingAdministrator
        preconditions:
          - "block.allocation_status IN {RESERVED, ASSIGNED, RECLAMATION_PENDING}"
          - "block.routing_status IN {UNROUTED, ROUTING_PENDING, ROUTING_WITHDRAWN}"
          - "payload expected_block_version equals block.version"
        side_effects:
          - "creates a RoutingRecord with record_status = PUBLISHED, end_at = null, ocn copied from the holder"
          - "sets current_lrn = record.lrn, increments npac_db_version by 1 and stamps it onto the record"
          - "increments NumberBlock.version by 1; allocation_status is NOT touched"
      - from: UNROUTED
        to: ROUTING_PENDING
        trigger: "POST /numbering/blocks/{block_id}/routing-records with effective_at strictly after the logical clock"
        actor: NumberingAdministrator
        preconditions:
          - "same preconditions as the UNROUTED -> LERG_PUBLISHED transition"
        side_effects:
          - "same record creation and npac_db_version increment; routing_status becomes ROUTING_PENDING until the record's effective_at is reached"
      - from: ROUTING_PENDING
        to: LERG_PUBLISHED
        trigger: "POST /numbering/reclamation-sweeps (routing activation pass)"
        actor: NumberingAdministrator
        preconditions:
          - "block.routing_status == ROUTING_PENDING"
          - "the open PUBLISHED RoutingRecord.effective_at is at or before the sweep instant"
        side_effects:
          - "sets current_lrn from the record; npac_db_version is NOT incremented (no database write, only a posture refresh)"
      - from: LERG_PUBLISHED
        to: PORT_LOCKED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=ACTIVATE"
        actor: PortingOperations
        preconditions:
          - "block.routing_status == LERG_PUBLISHED"
          - "port_request.status == CONCURRED"
        side_effects:
          - "supersedes the open PUBLISHED RoutingRecord (end_at = clock_now, record_status = SUPERSEDED) and publishes a new PUBLISHED record with lrn = port_request.requested_lrn and effective_at = clock_now"
          - "sets current_lrn to the new lrn and increments npac_db_version by 1"
          - "allocation_status is NOT touched"
          - "increments NumberBlock.version by 1"
      - from: PORT_LOCKED
        to: LERG_PUBLISHED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=CANCEL on an ACTIVATED port (snapback)"
        actor: PortingOperations
        preconditions:
          - "block.routing_status == PORT_LOCKED"
          - "port_request.status == ACTIVATED"
        side_effects:
          - "COMPENSATION: supersedes the port's PUBLISHED record (end_at = clock_now, record_status = SUPERSEDED) and publishes a NEW PUBLISHED record carrying the lrn of the record that the activation had superseded"
          - "sets current_lrn back to that original lrn and increments npac_db_version by 1 (the counter is never rolled back)"
          - "increments NumberBlock.version by 1"
      - from: LERG_PUBLISHED
        to: ROUTING_PENDING
        trigger: "POST /numbering/blocks/{block_id}/routing-records with effective_at strictly after the logical clock on a block that already carries live routing (an effective-dated re-home)"
        actor: NumberingAdministrator
        preconditions:
          - "block.routing_status == LERG_PUBLISHED"
          - "payload expected_block_version equals block.version"
          - "the new record's effective_at is at or after the open PUBLISHED record's effective_at"
        side_effects:
          - "supersedes the open PUBLISHED record (end_at = clock_now, record_status = SUPERSEDED) and creates the new PUBLISHED record with the future effective_at"
          - "clears current_lrn until the new record reaches its effective_at, increments npac_db_version by 1 and increments NumberBlock.version by 1"
        note: "A block with live routing can only be re-homed on an effective date; the block sits in ROUTING_PENDING until a sweep promotes the new record, and any port activation is refused meanwhile."
      - from: ROUTING_WITHDRAWN
        to: ROUTING_PENDING
        trigger: "POST /numbering/blocks/{block_id}/routing-records with effective_at strictly after the logical clock on a re-assigned block"
        actor: NumberingAdministrator
        preconditions:
          - "block.routing_status == ROUTING_WITHDRAWN"
          - "block.allocation_status IN {RESERVED, ASSIGNED}"
        side_effects:
          - "publishes a fresh RoutingRecord and increments npac_db_version by 1"

  - entity: AllocationRequest
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, DENIED, SUPERSEDED, WITHDRAWN]
    note: "CYCLIC: PENDING_REVIEW -> INFO_REQUESTED -> PENDING_REVIEW may run at most INFO_REQUEST_MAX_CYCLES (2) times before the third REQUEST_INFO is refused."
    transitions:
      - from: PENDING_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=REQUEST_INFO"
        actor: NumberingAdministrator
        preconditions:
          - "request.status == PENDING_REVIEW"
          - "request.info_request_count < INFO_REQUEST_MAX_CYCLES (2)"
          - "payload info_note is present"
        side_effects:
          - "increments info_request_count by 1 and sets reviewer_user_id to the acting X-User-ID when it is still null"
          - "increments AllocationRequest.version by 1"
      - from: PENDING_REVIEW
        to: INFO_REQUESTED
        trigger: "system event: the applicant carrier entered PROBATION through a reclamation execution or an ACCEPTED AuditFinding"
        actor: system
        preconditions:
          - "request.status == PENDING_REVIEW"
          - "request.request_type IN {GROWTH, POOL_REPLENISH}"
        side_effects:
          - "increments info_request_count by 1 without setting reviewer_user_id"
          - "increments AllocationRequest.version by 1"
      - from: INFO_REQUESTED
        to: PENDING_REVIEW
        trigger: "POST /numbering/allocation-requests/{request_id}/resubmissions"
        actor: CarrierRepresentative
        preconditions:
          - "request.status == INFO_REQUESTED"
          - "X-User-ID equals request.carrier_id"
        side_effects:
          - "overwrites requested_block_count with revised_requested_block_count and justification with response_note"
          - "re-snapshots utilization_pct_at_submission and months_to_exhaust_at_submission against the carrier's current effective filing"
          - "increments AllocationRequest.version by 1"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
        actor: RegulatoryApprover
        preconditions:
          - "request.status == PENDING_REVIEW"
          - "carrier.eligibility_status == ELIGIBLE at review time (re-checked, not inherited from submission)"
          - "the acting X-User-ID differs from request.reviewer_user_id"
          - "growth_grant_size yields at least 1 block and block_pool_selection finds at least that many candidate blocks"
          - "when payload granted_block_count is present it is <= the growth_grant_size entitlement"
        side_effects:
          - "CASCADE step 1: sets status = APPROVED, granted_block_count, assigned_block_ids, approver_user_id and decided_at = clock_now; decrements RateCenter.pending_request_count by 1"
          - "CASCADE step 2: because the request was approved, each selected NumberBlock moves POOL_AVAILABLE -> RESERVED with holder_carrier_id = request.carrier_id and activation_due_at = clock_now + ACTIVATION_WINDOW_DAYS"
          - "CASCADE step 3: because those blocks left POOL_AVAILABLE, RateCenter.available_block_count / assigned_block_count are recomputed, RateCenter.aggregate_utilization_pct is recomputed and Carrier.blocks_held_count is recomputed"
          - "CASCADE step 4: because the rate center's counters changed, NPA.available_block_count and NPA.exhaust_projection_months are recomputed and the NPA ACTIVE -> JEOPARDY threshold transition may fire"
          - "CASCADE step 5: because the NPA entered JEOPARDY, every RateCenter under it gets jeopardy_flag = true and computed accepts_initial_requests = false"
          - "when request_type == SAFETY_VALVE, Carrier.safety_valve_grant_count is incremented by 1"
          - "increments AllocationRequest.version, RateCenter.version, NPA.version and each touched NumberBlock.version by 1"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=DENY"
        actor: NumberingAdministrator
        preconditions:
          - "request.status == PENDING_REVIEW"
          - "the acting X-User-ID differs from request.reviewer_user_id when reviewer_user_id is not null"
        side_effects:
          - "sets status = DENIED, denial_reason = REVIEWER_DENIED, reviewer_user_id when null, decided_at = clock_now"
          - "decrements RateCenter.pending_request_count by 1"
          - "increments AllocationRequest.version by 1"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=DENY"
        actor: NumberingAdministrator
        preconditions:
          - "request.status == INFO_REQUESTED"
        side_effects:
          - "identical to the PENDING_REVIEW -> DENIED transition"
      - from: PENDING_REVIEW
        to: SUPERSEDED
        trigger: "POST /numbering/allocation-requests (a newer request from the same carrier for the same rate center)"
        actor: CarrierRepresentative
        preconditions:
          - "request.status IN {PENDING_REVIEW, INFO_REQUESTED}"
          - "the new request carries the same carrier_id and rate_center_id"
        side_effects:
          - "sets status = SUPERSEDED, superseded_by_request_id = the new request id, decided_at = clock_now"
          - "decrements RateCenter.pending_request_count by 1 for the superseded row and increments it by 1 for the new row"
          - "increments AllocationRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUPERSEDED
        trigger: "POST /numbering/allocation-requests (a newer request from the same carrier for the same rate center)"
        actor: CarrierRepresentative
        preconditions:
          - "request.status IN {PENDING_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "identical to the PENDING_REVIEW -> SUPERSEDED transition"
      - from: PENDING_REVIEW
        to: WITHDRAWN
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=WITHDRAW"
        actor: CarrierRepresentative
        preconditions:
          - "request.status IN {PENDING_REVIEW, INFO_REQUESTED}"
          - "X-User-ID equals request.carrier_id"
        side_effects:
          - "sets status = WITHDRAWN and decided_at = clock_now; decrements RateCenter.pending_request_count by 1"
          - "increments AllocationRequest.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /numbering/allocation-requests/{request_id}/reviews with action=WITHDRAW"
        actor: CarrierRepresentative
        preconditions:
          - "request.status IN {PENDING_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "identical to the PENDING_REVIEW -> WITHDRAWN transition"

  - entity: UtilizationFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    note: "CYCLIC: a REJECTED filing may be amended back to SUBMITTED, so SUBMITTED -> UNDER_AUDIT -> REJECTED -> SUBMITTED can loop; only ACCEPTED is terminal."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /numbering/utilization-filings/{filing_id}/submissions"
        actor: CarrierRepresentative
        preconditions:
          - "filing.status == DRAFT"
          - "X-User-ID equals filing.carrier_id"
          - "carrier.license_status == GRANTED"
        side_effects:
          - "sets submitted_at = clock_now and recomputes claimed_utilization_pct with the carrier_claimed variant"
          - "recomputes RateCenter.aggregate_utilization_pct from the newly effective filing"
          - "increments UtilizationFiling.version by 1"
      - from: SUBMITTED
        to: UNDER_AUDIT
        trigger: "POST /numbering/utilization-filings/{filing_id}/audit-findings"
        actor: NumberingAdministrator
        preconditions:
          - "filing.status IN {SUBMITTED, UNDER_AUDIT}"
          - "payload adjusted_numbers_assigned is <= filing.blocks_held_at_period_end * 1000"
        side_effects:
          - "creates an AuditFinding with status = OPEN, computes adjusted_utilization_pct with the strict_assigned_only variant over the adjusted_* inputs and derives penalty_action from abs(filing.claimed_utilization_pct - adjusted_utilization_pct)"
          - "sets auditor_user_id on the finding to the acting X-User-ID"
          - "increments UtilizationFiling.version by 1"
      - from: UNDER_AUDIT
        to: ACCEPTED
        trigger: "POST /numbering/audit-findings/{finding_id}/dispositions with disposition=ACCEPT on the last OPEN finding whose penalty_action == NONE"
        actor: RegulatoryApprover
        preconditions:
          - "filing.status == UNDER_AUDIT"
          - "the acting X-User-ID differs from finding.auditor_user_id"
          - "no other AuditFinding for this filing is still OPEN"
        side_effects:
          - "sets filing.status = ACCEPTED and audited_utilization_pct = the finding's adjusted_utilization_pct, or the filing's own strict_utilization_pct when finding_type == NO_DISCREPANCY"
          - "recomputes RateCenter.aggregate_utilization_pct from the audited figure"
          - "increments UtilizationFiling.version by 1"
      - from: UNDER_AUDIT
        to: REJECTED
        trigger: "POST /numbering/audit-findings/{finding_id}/dispositions with disposition=ACCEPT on a finding whose penalty_action != NONE"
        actor: RegulatoryApprover
        preconditions:
          - "filing.status == UNDER_AUDIT"
          - "the acting X-User-ID differs from finding.auditor_user_id"
        side_effects:
          - "sets filing.status = REJECTED and audited_utilization_pct = the finding's adjusted_utilization_pct"
          - "CASCADE: when penalty_action == PROBATION the carrier moves to eligibility_status = PROBATION with probation_until = clock_now + PROBATION_DAYS; when penalty_action == RECLAMATION_REFERRAL the carrier gets reclamation_strike_count incremented by 1 instead, and probation_until = clock_now + PROBATION_DAYS with eligibility_status PROBATION follows only once that count has reached RECLAMATION_PROBATION_STRIKES (2)"
          - "CASCADE: because the carrier entered PROBATION, its PENDING_REVIEW GROWTH and POOL_REPLENISH requests move to INFO_REQUESTED"
          - "increments UtilizationFiling.version and Carrier.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /numbering/utilization-filings/{filing_id}/submissions (amended filing)"
        actor: CarrierRepresentative
        preconditions:
          - "filing.status == REJECTED"
          - "X-User-ID equals filing.carrier_id"
          - "payload amendment_note is present"
        side_effects:
          - "increments amendment_count by 1, clears audited_utilization_pct and re-stamps submitted_at = clock_now"
          - "recomputes claimed_utilization_pct from the amended counts"
          - "increments UtilizationFiling.version by 1"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /numbering/audit-findings/{finding_id}/dispositions with disposition=ACCEPT"
        actor: RegulatoryApprover
        preconditions:
          - "finding.status == OPEN"
          - "the acting X-User-ID differs from finding.auditor_user_id (segregation of duties)"
        side_effects:
          - "sets disposed_by_user_id = X-User-ID"
          - "drives the parent filing to ACCEPTED or REJECTED per the finding's penalty_action"
          - "increments AuditFinding.version by 1"
      - from: OPEN
        to: REJECTED
        trigger: "POST /numbering/audit-findings/{finding_id}/dispositions with disposition=REJECT"
        actor: RegulatoryApprover
        preconditions:
          - "finding.status == OPEN"
          - "the acting X-User-ID differs from finding.auditor_user_id"
        side_effects:
          - "sets disposed_by_user_id = X-User-ID; the finding is discarded so NO penalty is applied and the parent filing stays UNDER_AUDIT"
          - "increments AuditFinding.version by 1"

  - entity: ReclamationOrder
    initial_state: ISSUED
    terminal_states: [EXECUTED, WITHDRAWN]
    note: "BRANCHING with a join: ISSUED forks into SURRENDER_ACKNOWLEDGED and APPEAL_PENDING, and both branches funnel into EXECUTED; only the appeal branch can also reach WITHDRAWN."
    transitions:
      - from: ISSUED
        to: SURRENDER_ACKNOWLEDGED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=SURRENDER"
        actor: CarrierRepresentative
        preconditions:
          - "order.status == ISSUED"
          - "X-User-ID equals order.carrier_id"
        side_effects:
          - "records the surrender acknowledgement; issued_at and response_due_at are left unchanged"
          - "increments ReclamationOrder.version by 1"
      - from: ISSUED
        to: APPEAL_PENDING
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=APPEAL"
        actor: CarrierRepresentative
        preconditions:
          - "order.status == ISSUED"
          - "X-User-ID equals order.carrier_id"
          - "the logical clock is at or before order.response_due_at"
        side_effects:
          - "stores appeal_note from the payload"
          - "increments ReclamationOrder.version by 1"
      - from: SURRENDER_ACKNOWLEDGED
        to: EXECUTED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=EXECUTE"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, SURRENDER_ACKNOWLEDGED, APPEAL_PENDING}"
          - "for order.status == ISSUED the logical clock is strictly after order.response_due_at"
        side_effects:
          - "sets executed_at = clock_now, strike_applied = true"
          - "drives the block RECLAMATION_PENDING -> AGING and runs the depth-4 carrier probation cascade"
          - "increments ReclamationOrder.version by 1"
      - from: APPEAL_PENDING
        to: EXECUTED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=EXECUTE (appeal denied)"
        actor: NumberingAdministrator
        preconditions:
          - "order.status == APPEAL_PENDING"
        side_effects:
          - "identical to the SURRENDER_ACKNOWLEDGED -> EXECUTED transition"
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=EXECUTE (no carrier response by the deadline)"
        actor: NumberingAdministrator
        preconditions:
          - "order.status == ISSUED"
          - "the logical clock is strictly after order.response_due_at"
        side_effects:
          - "identical to the SURRENDER_ACKNOWLEDGED -> EXECUTED transition"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=WITHDRAW"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, APPEAL_PENDING}"
        side_effects:
          - "leaves executed_at null and strike_applied false"
          - "COMPENSATION: restores the block to ASSIGNED when it had been activated, otherwise to RESERVED, and leaves the carrier's reclamation_strike_count untouched"
          - "increments ReclamationOrder.version by 1"
      - from: APPEAL_PENDING
        to: WITHDRAWN
        trigger: "POST /numbering/reclamation-orders/{order_id}/transitions with action=WITHDRAW (appeal granted)"
        actor: NumberingAdministrator
        preconditions:
          - "order.status IN {ISSUED, APPEAL_PENDING}"
        side_effects:
          - "identical to the ISSUED -> WITHDRAWN transition"

  - entity: ReliefPlan
    initial_state: PLANNING
    terminal_states: [ORDERED, WITHDRAWN]
    note: "BRANCHING: PUBLIC_COMMENT forks into OVERLAY_RECOMMENDED or SPLIT_RECOMMENDED depending on comment_tally_weighted, and both branches join at ORDERED."
    transitions:
      - from: PLANNING
        to: PUBLIC_COMMENT
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=OPEN_COMMENT"
        actor: NumberingAdministrator
        preconditions:
          - "plan.status == PLANNING"
          - "npa.status IN {JEOPARDY, EXHAUSTED, RELIEF_PLANNED}"
          - "no other ReliefPlan for the same NPA is in status PUBLIC_COMMENT, OVERLAY_RECOMMENDED or SPLIT_RECOMMENDED"
        side_effects:
          - "sets comment_window_open_at = clock_now and comment_window_close_at = clock_now + plan.comment_window_days, and window_end_at follows comment_window_close_at"
          - "sets NPA.status = RELIEF_PLANNED when it is not already RELIEF_PLANNED"
          - "increments ReliefPlan.version by 1"
      - from: PUBLIC_COMMENT
        to: OVERLAY_RECOMMENDED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=CLOSE_AND_RECOMMEND"
        actor: NumberingAdministrator
        preconditions:
          - "plan.status == PUBLIC_COMMENT"
          - "the logical clock is at or after plan.comment_window_close_at"
          - "comment_tally_weighted returns ALL_SERVICES_OVERLAY (overlay weight >= split weight, including the zero-comment case)"
        side_effects:
          - "sets recommended_relief_type = ALL_SERVICES_OVERLAY, recommender_user_id = X-User-ID, support_overlay_weight, support_split_weight and comment_count"
          - "increments ReliefPlan.version by 1"
      - from: PUBLIC_COMMENT
        to: SPLIT_RECOMMENDED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=CLOSE_AND_RECOMMEND"
        actor: NumberingAdministrator
        preconditions:
          - "plan.status == PUBLIC_COMMENT"
          - "the logical clock is at or after plan.comment_window_close_at"
          - "comment_tally_weighted returns GEOGRAPHIC_SPLIT (split weight strictly greater than overlay weight)"
        side_effects:
          - "sets recommended_relief_type = GEOGRAPHIC_SPLIT plus recommender_user_id and the same weight and count fields"
          - "increments ReliefPlan.version by 1"
      - from: OVERLAY_RECOMMENDED
        to: ORDERED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
        actor: RegulatoryApprover
        preconditions:
          - "plan.status IN {OVERLAY_RECOMMENDED, SPLIT_RECOMMENDED}"
          - "the acting X-User-ID differs from plan.recommender_user_id (segregation of duties)"
          - "payload new_npa_code does not collide with any existing NPA.npa_code, otherwise ERR_DUPLICATE_NPA_CODE"
          - "payload effective_at is at least RELIEF_WINDOW_BUFFER_DAYS after plan.comment_window_close_at"
        side_effects:
          - "creates or activates the successor NPA with relief_parent_npa_id = plan.npa_id and status = ACTIVE, and stores successor_npa_id on the plan"
          - "sets ordering_user_id = X-User-ID, permissive_dialing_end_at = effective_at + PERMISSIVE_DIALING_DAYS and window_end_at = permissive_dialing_end_at"
          - "OVERLAY: every RateCenter under the parent NPA keeps its npa_id because an overlay adds a second code over the same geography; the parent NPA moves to ACTIVE with available_block_count recomputed"
          - "increments ReliefPlan.version, NPA.version and each RateCenter.version by 1"
      - from: SPLIT_RECOMMENDED
        to: ORDERED
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
        actor: RegulatoryApprover
        preconditions:
          - "same preconditions as the OVERLAY_RECOMMENDED -> ORDERED transition"
          - "payload moved_rate_center_ids lists at least one RateCenter belonging to plan.npa_id"
        side_effects:
          - "SPLIT: every RateCenter whose id is in moved_rate_center_ids is re-parented to the successor NPA (npa_id rewritten) together with the NumberBlock rows inside it"
          - "CASCADE: available_block_count and exhaust_projection_months are recomputed on BOTH the parent and the successor NPA"
          - "when moved_rate_center_ids covers every RateCenter of the parent NPA, the parent NPA moves to RETIRED and its POOL_AVAILABLE blocks move to RETIRED"
          - "increments ReliefPlan.version, both NPA.version values and each moved RateCenter.version by 1"
      - from: PLANNING
        to: WITHDRAWN
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=WITHDRAW"
        actor: NumberingAdministrator
        preconditions:
          - "plan.status IN {PLANNING, PUBLIC_COMMENT, OVERLAY_RECOMMENDED, SPLIT_RECOMMENDED}"
        side_effects:
          - "sets status = WITHDRAWN and leaves recommended_relief_type as it stood; when no other plan for the NPA is active the NPA reverts from RELIEF_PLANNED to its threshold-derived posture (npa_exhaust_posture)"
          - "increments ReliefPlan.version by 1"
      - from: PUBLIC_COMMENT
        to: WITHDRAWN
        trigger: "POST /numbering/relief-plans/{plan_id}/transitions with action=WITHDRAW"
        actor: NumberingAdministrator
        preconditions:
          - "plan.status IN {PLANNING, PUBLIC_COMMENT, OVERLAY_RECOMMENDED, SPLIT_RECOMMENDED}"
        side_effects:
          - "identical to the PLANNING -> WITHDRAWN transition and additionally freezes the comment window"

  - entity: PortRequest
    initial_state: SUBMITTED
    terminal_states: [SNAPPED_BACK, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: CONCURRED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=CONCUR"
        actor: CarrierRepresentative
        preconditions:
          - "port_request.status == SUBMITTED"
          - "X-User-ID equals port_request.from_carrier_id (the losing carrier concurs)"
          - "the logical clock is at or before port_request.desired_due_at"
        side_effects:
          - "sets concurred_at = clock_now"
          - "increments PortRequest.version by 1"
      - from: CONCURRED
        to: ACTIVATED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=ACTIVATE"
        actor: PortingOperations
        preconditions:
          - "port_request.status == CONCURRED"
          - "block.routing_status == LERG_PUBLISHED"
        side_effects:
          - "sets activated_at = clock_now and npac_db_version_at_activation = the block's incremented npac_db_version"
          - "drives the block LERG_PUBLISHED -> PORT_LOCKED, supersedes the open RoutingRecord and publishes a new one with the requested LRN"
          - "increments PortRequest.version by 1"
      - from: ACTIVATED
        to: SNAPPED_BACK
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=CANCEL"
        actor: PortingOperations
        preconditions:
          - "port_request.status == ACTIVATED"
        side_effects:
          - "sets closed_at = clock_now"
          - "COMPENSATION: drives the block PORT_LOCKED -> LERG_PUBLISHED, supersedes the port's record and republishes the pre-port LRN, leaving exactly one PUBLISHED RoutingRecord"
          - "increments PortRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=REJECT"
        actor: CarrierRepresentative
        preconditions:
          - "port_request.status == SUBMITTED"
          - "X-User-ID equals port_request.from_carrier_id"
        side_effects:
          - "sets closed_at = clock_now and reject_reason from the payload"
          - "increments PortRequest.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=CANCEL"
        actor: PortingOperations
        preconditions:
          - "port_request.status IN {SUBMITTED, CONCURRED}"
        side_effects:
          - "sets closed_at = clock_now; no routing data is touched because no activation had occurred"
          - "increments PortRequest.version by 1"
      - from: CONCURRED
        to: CANCELLED
        trigger: "POST /numbering/port-requests/{port_request_id}/transitions with action=CANCEL"
        actor: PortingOperations
        preconditions:
          - "port_request.status IN {SUBMITTED, CONCURRED}"
        side_effects:
          - "identical to the SUBMITTED -> CANCELLED transition"

  - entity: RoutingRecord
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED, WITHDRAWN]
    note: "RoutingRecord has common_fields: false - it is an append-only routing ledger row, so its status changes are driven exclusively by side effects of NumberBlock and PortRequest transitions, never by a direct endpoint on the record."
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system side effect of a port ACTIVATE, a port CANCEL snapback, or a newer POST /numbering/blocks/{block_id}/routing-records"
        actor: system
        preconditions:
          - "record.record_status == PUBLISHED"
          - "record.end_at is null"
        side_effects:
          - "sets end_at = clock_now so that the closed interval is half-open [effective_at, end_at)"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system side effect of a reclamation EXECUTE on a routed block"
        actor: system
        preconditions:
          - "record.record_status == PUBLISHED"
        side_effects:
          - "sets end_at = clock_now, clears the block's current_lrn and increments the block's npac_db_version by 1"

concurrency_rules:
  - rule_id: allocation-request-create-stale-rate-center
    parent_entity: RateCenter
    write_endpoint: "POST /numbering/allocation-requests"
    occ_field: "expected_rate_center_version"
    description: |
      Filing an AllocationRequest against a RateCenter whose version has
      advanced since the client last read it is rejected. A newer request from
      the same carrier for the same rate center legitimately supersedes that
      carrier's still-open request, and every accepted filing advances
      RateCenter.version through pending_request_count, so a writer holding an
      older version number is working from a stale view of the rate center's
      pool and pending demand and must re-read before filing.
    error_id: ERR_STALE_RATE_CENTER_VERSION
    http_status: 412
  - rule_id: routing-record-publish-stale-block
    parent_entity: NumberBlock
    write_endpoint: "POST /numbering/blocks/{block_id}/routing-records"
    occ_field: "expected_block_version"
    description: |
      Publishing a RoutingRecord for a NumberBlock whose version has advanced
      since the client last read it is rejected. A newly published record
      legitimately supersedes the block's open PUBLISHED record and bumps
      npac_db_version, so a writer carrying an older block version would be
      closing an interval it never observed; it must re-read the block first.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

calculations:
  - name: filing_utilization_pct
    trigger: "On POST /numbering/utilization-filings/{filing_id}/submissions (carrier_claimed) and on POST /numbering/utilization-filings/{filing_id}/audit-findings (strict_assigned_only over the adjusted inputs)"
    algorithm: aggregation
    formula: |
      denominator = blocks_held_at_period_end * 1000
                    - numbers_administrative
                    - numbers_aging
      if denominator <= 0:
          return 0.00
      numerator = variant_numerator(filing)      # see variants
      return round_half_up(100 * numerator / denominator, 2)
    input_set: "A single UtilizationFiling row. Administrative and aging numbers are removed from the denominator because they are not assignable inventory; they are never added to the numerator."
    constants:
      NUMBERS_PER_BLOCK: 1000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: carrier_claimed
        when: "The carrier submits or amends the filing; the result is stored in claimed_utilization_pct"
        difference: "numerator = numbers_assigned + numbers_intermediate + numbers_reserved. Intermediate (ported-away but still held) and reserved numbers count as used."
      - name: strict_assigned_only
        when: "An administrator opens an AuditFinding; the result is stored in UtilizationFiling.strict_utilization_pct and, over the adjusted_* inputs, in AuditFinding.adjusted_utilization_pct"
        difference: "numerator = numbers_assigned only. Intermediate and reserved numbers are excluded, so the strict figure is always <= the claimed figure for the same row."
    note: |
      Worked divergence, both variants over the SAME row
      (blocks_held_at_period_end 5, numbers_assigned 2500, numbers_intermediate 400,
      numbers_reserved 200, numbers_administrative 300, numbers_aging 200):
      denominator = 5*1000 - 300 - 200 = 4500;
      carrier_claimed numerator = 3100 -> 68.89;
      strict_assigned_only numerator = 2500 -> 55.56.
      The 13.33-point gap is the whole point of the audit program.

  - name: rate_center_months_to_exhaust
    trigger: "On every AllocationRequest submission (snapshotted into months_to_exhaust_at_submission) and whenever a rate center's available_block_count changes"
    algorithm: forward_looking
    formula: |
      available_numbers = rate_center.available_block_count * 1000
      monthly_demand    = variant_monthly_demand(...)   # see variants
      if monthly_demand <= 0:
          return 999.00                                  # EXHAUST_SENTINEL_MONTHS
      return round_half_up(available_numbers / monthly_demand, 2)
    input_set: "available_block_count counts only NumberBlock rows in allocation_status POOL_AVAILABLE inside the rate center. Blocks in RESERVED, ASSIGNED, RECLAMATION_PENDING, AGING or RETIRED are excluded - a block in AGING is NOT available even though nobody holds it."
    constants:
      NUMBERS_PER_BLOCK: 1000
      DEMAND_HORIZON_MONTHS: 6
      EXHAUST_SENTINEL_MONTHS: 999.00
      MONTHS_TO_EXHAUST_MAX: 6
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "The applicant's effective UtilizationFiling for the rate center carries forecast_quarters; this is the variant used to gate GROWTH requests"
        difference: "monthly_demand = (forecast_quarters[0] + forecast_quarters[1]) / DEMAND_HORIZON_MONTHS - i.e. the next two forecast quarters spread over six months. Purely projected; no history is consulted."
      - name: chronological
        when: "The applicant has at least two UtilizationFiling rows in status SUBMITTED or ACCEPTED for the rate center and forecast_quarters is absent or all zeros"
        difference: "monthly_demand = (latest.numbers_assigned - previous.numbers_assigned) / DEMAND_HORIZON_MONTHS, where latest and previous are ordered by submitted_at ASC then created_at ASC. Purely historical; the forecast is ignored, so a carrier whose growth is slowing looks far healthier under this variant."
    note: |
      Worked divergence for one rate center with available_block_count 1
      plus a 900-number backlog: available_numbers = 1900,
      forecast_quarters [1800, 1200] -> monthly_demand 500 -> 3.80 months;
      history (latest 2400 vs previous 1500) -> monthly_demand 150 -> 12.67 months.
      3.80 is under MONTHS_TO_EXHAUST_MAX (6) and qualifies for growth;
      12.67 is over it and does not.

  - name: growth_grant_size
    trigger: "On POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE, before any block is reserved"
    algorithm: threshold
    formula: |
      u = effective_utilization(request)   # audited_utilization_pct of the effective
                                           # filing when it is non-null, else its
                                           # claimed_utilization_pct; 0.00 when the
                                           # carrier has no effective filing
      if   u >= 90.00: tier_cap = 3
      elif u >= 75.00: tier_cap = 2
      elif u >= 60.00: tier_cap = 1
      else:            tier_cap = 0
      demand_blocks = ceil((forecast_quarters[0] + forecast_quarters[1]) / 1000)
      if request.request_type == 'INITIAL':
          tier_cap      = 1                       # first block needs no utilization
          demand_blocks = 1
      if request.request_type == 'SAFETY_VALVE':
          tier_cap      = SAFETY_VALVE_MAX_BLOCKS # 1, regardless of u
          demand_blocks = SAFETY_VALVE_MAX_BLOCKS
      if request.request_type == 'POOL_REPLENISH' and rate_center.pooling_status == 'POOLED':
          tier_cap = tier_cap + 1                 # pooling administrators get one extra
      pool_available = len(block_pool_selection(rate_center))
      return min(request.requested_block_count, demand_blocks, tier_cap, pool_available)
    input_set: "The applicant's effective UtilizationFiling for request.rate_center_id (the newest row in status SUBMITTED, ACCEPTED or REJECTED, ordered by submitted_at DESC then created_at DESC), the rate center's pooling_status, and the pool candidates returned by block_pool_selection."
    constants:
      UTILIZATION_MIN_PCT_GROWTH: 60.00
      UTILIZATION_TIER_2_PCT: 75.00
      UTILIZATION_TIER_3_PCT: 90.00
      SAFETY_VALVE_MAX_BLOCKS: 1
      NUMBERS_PER_BLOCK: 1000
    precision: "Integer block count; the ceil() on demand_blocks rounds UP, every other term is already an integer"
    note: |
      Four independent ceilings must be composed and the smallest wins, so no
      single input predicts the grant. Worked example: requested_block_count 4,
      u = 68.89 -> tier_cap 1, forecast [1800, 1200] -> demand_blocks
      ceil(3000/1000) = 3, pool_available 6 -> grant = min(4, 3, 1, 6) = 1.
      Raising u to 91.00 lifts tier_cap to 3 and the grant becomes
      min(4, 3, 3, 6) = 3. A grant of 0 is never an approval: tier_cap == 0
      raises ERR_UTILIZATION_THRESHOLD_NOT_MET, and pool_available == 0 raises
      ERR_BLOCK_NOT_POOLING_ELIGIBLE when the rate center still holds unrouted
      POOL_AVAILABLE blocks that are every one contamination-blocked, otherwise
      ERR_POOL_INSUFFICIENT_BLOCKS.

  - name: rate_center_aggregate_utilization_pct
    trigger: "Whenever a UtilizationFiling for the rate center becomes effective (submission, amendment, or audit closure) and after every block allocation_status change in the rate center"
    algorithm: aggregation
    formula: |
      total_numerator   = 0
      total_denominator = 0
      for filing in effective_filings(rate_center):        # one per holder carrier
          total_numerator   += filing.numbers_assigned
                             + filing.numbers_intermediate
                             + filing.numbers_reserved
          total_denominator += filing.blocks_held_at_period_end * 1000
                             - filing.numbers_administrative
                             - filing.numbers_aging
      if total_denominator <= 0:
          return 0.00
      return round_half_up(100 * total_numerator / total_denominator, 2)
    input_set: "For each carrier holding at least one RESERVED or ASSIGNED block in the rate center, its newest UtilizationFiling in status SUBMITTED, ACCEPTED or REJECTED (ordered submitted_at DESC, created_at DESC). Filings in DRAFT and filings from carriers that hold nothing here are excluded."
    constants:
      NUMBERS_PER_BLOCK: 1000
    precision: "2 decimal places, round_half_up, applied EXACTLY ONCE to the pooled ratio"
    note: |
      SUM-THEN-ROUND is mandatory: numerators and denominators are pooled
      across filings and the ratio is rounded once at the very end. Averaging
      the already-rounded per-filing percentages is WRONG and observably
      different. Worked example with two holders - filing A (3100 / 4500 ->
      68.89) and filing B (95 / 1000 -> 9.50):
      correct pooled result = 100 * 3195 / 5500 = 58.09;
      the forbidden average of rounded values = (68.89 + 9.50) / 2 = 39.20.

  - name: pooling_donation_obligation
    trigger: "On POST /numbering/rate-centers/{rate_center_id}/pooling-transitions with action=COMPLETE_POOLING"
    algorithm: tiered_pricing
    formula: |
      for carrier in holders(rate_center) ordered by created_at ASC:
          blocks_held = count(blocks in rate_center held by carrier
                              with allocation_status IN {RESERVED, ASSIGNED})
          u = pre_donation_utilization(carrier, rate_center)   # PINNED, see note
          if   u >= 90.00: rate = 0.00
          elif u >= 75.00: rate = 0.10
          elif u >= 60.00: rate = 0.25
          else:            rate = 0.50
          obligation = floor(blocks_held * rate)
          candidates = [b for b in carrier_blocks
                        if b.is_pooling_eligible
                        and b.routing_status IN {UNROUTED, ROUTING_WITHDRAWN}]
          ranked = sort(candidates, key=(-contaminated_count, created_at ASC))
          donated = ranked[:obligation]
          for b in donated:
              b.allocation_status = 'POOL_AVAILABLE'; b.holder_carrier_id = null
          rate_center.last_donation_block_count += len(donated)
          rate_center.donation_shortfall_count  += obligation - len(donated)
    input_set: "Only blocks in allocation_status RESERVED or ASSIGNED held by the carrier inside this rate center, and only those with is_pooling_eligible true and no live routing. A block already in AGING, RECLAMATION_PENDING or POOL_AVAILABLE is never donated."
    constants:
      DONATION_RATE_BELOW_60: 0.50
      DONATION_RATE_60_TO_75: 0.25
      DONATION_RATE_75_TO_90: 0.10
      DONATION_RATE_90_PLUS: 0.00
      UTILIZATION_MIN_PCT_GROWTH: 60.00
      UTILIZATION_TIER_2_PCT: 75.00
      UTILIZATION_TIER_3_PCT: 90.00
    precision: "floor() on the block obligation - a partial block is never donated; the rate itself is an exact 2-decimal constant"
    note: |
      The donation rate is PINNED to the utilization measured BEFORE any block
      leaves the carrier, and the obligation is computed exactly ONCE. Donating
      blocks raises the carrier's utilization, so an implementation that
      recomputes the rate after the donation - or that iterates to a fixed
      point - reaches a different and wrong answer. Worked example: filing A
      holds 5 blocks at 3100 / 4500 = 68.89 -> rate 0.25 -> obligation
      floor(5 * 0.25) = 1 block donated. Post-donation the same carrier reads
      3100 / 3500 = 88.57, whose rate would be 0.10 -> floor(5 * 0.10) = 0,
      so a fixed-point implementation donates nothing. Exactly one block must
      move.

  - name: block_pool_selection
    trigger: "Whenever blocks must be drawn from a rate center's pool: an APPROVE review, and the pool_available term of growth_grant_size"
    algorithm: waterfall_allocation
    formula: |
      candidates = [b for b in blocks(rate_center)
                    if b.allocation_status == 'POOL_AVAILABLE'
                    and b.routing_status IN {'UNROUTED', 'ROUTING_WITHDRAWN'}
                    and b.is_pooling_eligible
                    and (rate_center.pooling_status == 'POOLED'
                         or b.contaminated_count == 0)]
      ranked = sort(candidates, key=(contaminated_count ASC,
                                     nxx_code ASC,
                                     thousands_digit ASC,
                                     created_at ASC))
      if len(ranked) < requested_count:
          return ranked            # caller decides: short grant or ERR_POOL_INSUFFICIENT_BLOCKS
      return ranked[:requested_count]
    input_set: "Blocks in the target rate center only. A block whose routing_status is ROUTING_PENDING, LERG_PUBLISHED or PORT_LOCKED is never a candidate even if its allocation_status somehow reads POOL_AVAILABLE, because live routing data would have to be torn down first."
    constants:
      CONTAMINATION_MAX_FOR_POOLING: 100
    precision: "Exact integer counts; ranking is fully deterministic - contaminated_count, then nxx_code, then thousands_digit, then created_at ASC. Entity id is NEVER a ranking input."
    note: |
      Cleanest blocks are handed out first so that contaminated blocks stay in
      the pool for pooled rate centers that can absorb them. A NON_POOLED rate
      center can only ever hand out pristine blocks (contaminated_count == 0),
      so the very same pool yields a different candidate list depending on the
      rate center's pooling_status.

  - name: comment_tally_weighted
    trigger: "On POST /numbering/relief-plans/{plan_id}/transitions with action=CLOSE_AND_RECOMMEND"
    algorithm: weighted_scoring
    formula: |
      overlay_raw = sum(COMMENT_WEIGHTS[c.commenter_type]
                        for c in comments(plan) if c.position == 'SUPPORT_OVERLAY')
      split_raw   = sum(COMMENT_WEIGHTS[c.commenter_type]
                        for c in comments(plan) if c.position == 'SUPPORT_SPLIT')
      support_overlay_weight = round_half_up(overlay_raw, 2)
      support_split_weight   = round_half_up(split_raw, 2)
      comment_count          = count(comments(plan))        # includes OPPOSE_BOTH
      if split_raw > overlay_raw:
          return 'GEOGRAPHIC_SPLIT'
      return 'ALL_SERVICES_OVERLAY'                          # ties and zero comments
    input_set: "Every PublicComment attached to the plan, including comments whose position is OPPOSE_BOTH - those raise comment_count but contribute to neither weight."
    constants:
      WEIGHT_CONSUMER: 1.0
      WEIGHT_BUSINESS: 1.5
      WEIGHT_CARRIER: 2.0
      WEIGHT_GOVERNMENT: 3.0
    precision: "Raw weights are summed at full precision and rounded to 2 decimal places, round_half_up, EXACTLY ONCE per side; the comparison uses the raw sums so rounding can never flip the recommendation"
    note: |
      The overlay bias is deliberate and must be observable: a tie recommends
      ALL_SERVICES_OVERLAY, and a plan closed with zero comments also
      recommends ALL_SERVICES_OVERLAY with both weights 0.00 and comment_count
      0. Worked example over six rows: two CONSUMER and one BUSINESS comment
      supporting the overlay (1.0 + 1.0 + 1.5 = 3.50), one CARRIER and one
      CONSUMER comment supporting the split (2.0 + 1.0 = 3.00), and one
      GOVERNMENT comment at OPPOSE_BOTH -> support_overlay_weight 3.50,
      support_split_weight 3.00, comment_count 6, recommendation
      ALL_SERVICES_OVERLAY. Dropping the BUSINESS overlay comment leaves
      2.00 against 3.00 and flips the recommendation to GEOGRAPHIC_SPLIT.

  - name: audit_penalty_action
    trigger: "On POST /numbering/utilization-filings/{filing_id}/audit-findings, when the finding is created"
    algorithm: threshold
    formula: |
      if finding_type == 'NO_DISCREPANCY':
          return 'NONE'
      if finding_type == 'MISSING_DATA':
          return 'PROBATION'
      delta = abs(filing.claimed_utilization_pct - finding.adjusted_utilization_pct)
      if delta >= 20.00: return 'RECLAMATION_REFERRAL'
      if delta >=  5.00: return 'PROBATION'
      return 'NONE'
    input_set: "The parent filing's claimed_utilization_pct as stored at submission time and the finding's adjusted_utilization_pct, which is filing_utilization_pct variant strict_assigned_only recomputed over adjusted_numbers_assigned and adjusted_numbers_administrative."
    constants:
      AUDIT_DELTA_PROBATION_PCT: 5.00
      AUDIT_DELTA_REFERRAL_PCT: 20.00
    precision: "delta is computed from two values already rounded to 2 decimal places, and the comparisons are inclusive (>=), so a delta of exactly 5.00 is PROBATION and exactly 20.00 is RECLAMATION_REFERRAL"
    note: |
      Worked example: a filing claiming 95.00 audited down to 60.00 yields
      delta 35.00 -> RECLAMATION_REFERRAL, which on disposition drives the
      filing to REJECTED, puts the carrier on PROBATION and increments
      reclamation_strike_count. A filing claiming 68.89 audited to 65.00
      yields delta 3.89 -> NONE and the filing is ACCEPTED.

  - name: activation_and_aging_schedule
    trigger: "When a block is reserved (activation_due_at), when a reclamation order is issued (response_due_at), when a reclamation order is executed (aging_release_at), and on every POST /numbering/reclamation-sweeps"
    algorithm: interval_merge
    formula: |
      # stamping
      block.activation_due_at = block.assigned_at + ACTIVATION_WINDOW_DAYS
      order.response_due_at   = order.issued_at   + RECLAMATION_RESPONSE_DAYS
      block.aging_release_at  = order.executed_at + AGING_PERIOD_DAYS
      # sweeping at instant S, in this exact pass order
      pass_1_reclaim = [b for b in blocks
                        if b.allocation_status == 'RESERVED'
                        and b.activated_at is null
                        and b.activation_due_at < S]        # STRICT
      pass_2_release = [b for b in blocks
                        if b.allocation_status == 'AGING'
                        and b.aging_release_at <= S]        # INCLUSIVE
      pass_3_routing = [b for b in blocks
                        if b.routing_status == 'ROUTING_PENDING'
                        and open_routing_record(b).effective_at <= S]
      each pass processes its blocks in created_at ASC order
    input_set: "All NumberBlock rows; each pass filters on a different allocation_status, so a block can be touched by at most one pass per sweep."
    constants:
      ACTIVATION_WINDOW_DAYS: 180
      RECLAMATION_RESPONSE_DAYS: 30
      AGING_PERIOD_DAYS: 90
      PROBATION_DAYS: 180
    precision: "Whole-day arithmetic on UTC instants; comparisons are to the second"
    note: |
      The two boundaries are deliberately asymmetric. A block whose
      activation_due_at is EXACTLY the sweep instant is NOT reclaimed
      (strict <), because the carrier still owns that instant. A block whose
      aging_release_at is EXACTLY the sweep instant IS released back to the
      pool (inclusive <=), because aging has fully elapsed. With the default
      clock 2026-08-01T00:00:00Z, a block reserved at T0 is due
      2027-01-28T00:00:00Z: a sweep at 2027-01-28T00:00:00Z leaves it alone
      and a sweep at 2027-01-29T00:00:00Z reclaims it.

  - name: npa_exhaust_posture
    trigger: "After every change to a NumberBlock's allocation_status, after a relief plan is ORDERED, and after a jeopardy declaration"
    algorithm: threshold
    formula: |
      if npa.status IN {'RETIRED'}:
          return 'RETIRED'                              # sticky terminal
      available = count(blocks under npa with allocation_status == 'POOL_AVAILABLE')
      if npa.status == 'RELIEF_PLANNED':
          return 'RELIEF_PLANNED'                       # sticky while a plan is live
      if available == 0:
          return 'EXHAUSTED'
      if available <= NPA_JEOPARDY_AVAILABLE_BLOCKS:
          return 'JEOPARDY'
      if npa.jeopardy_declared_at is not null:
          return 'JEOPARDY'                             # manual declaration holds
      return 'ACTIVE'
    input_set: "Every NumberBlock whose npa_id is this NPA, across all of its rate centers. Blocks in AGING are NOT counted as available."
    constants:
      NPA_JEOPARDY_AVAILABLE_BLOCKS: 4
    precision: "Integer block counts; the jeopardy comparison is inclusive (<=), so exactly 4 available blocks is JEOPARDY and 5 is ACTIVE"
    note: |
      This posture is CYCLIC: an approval that drops available from 5 to 4
      moves ACTIVE -> JEOPARDY and sets jeopardy_flag on every rate center
      under the code, and a later aging release that lifts available back to 5
      moves JEOPARDY -> ACTIVE and clears those flags - unless an
      administrator had declared jeopardy manually, in which case the code
      stays in JEOPARDY until relief is ordered.

validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed on the endpoint being called"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every required input field is present, every field has the declared type, every enum field carries a declared value, integer counts are >= 0, forecast_quarters holds exactly four integers, nxx_code is three digits, thousands_digit is 0-9, telephone_number is ten digits"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Every resource named in the path exists, resolved left to right"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_NPA_NOT_FOUND | ERR_RATE_CENTER_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_ALLOCATION_REQUEST_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_AUDIT_FINDING_NOT_FOUND | ERR_RECLAMATION_ORDER_NOT_FOUND | ERR_RELIEF_PLAN_NOT_FOUND | ERR_PORT_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, checked in payload declaration order"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_NPA_NOT_FOUND | ERR_RATE_CENTER_NOT_FOUND | ERR_BLOCK_NOT_FOUND"
    http_status: 404
    applies_to: "POST /numbering/rate-centers, POST /numbering/blocks, POST /numbering/allocation-requests, POST /numbering/utilization-filings, POST /numbering/port-requests, POST /numbering/relief-plans/{plan_id}/transitions"
  - priority: 6
    category: auth
    check: "When X-User-Role is CarrierRepresentative, X-User-ID equals the carrier foreign key of the resource being acted on: request.carrier_id, filing.carrier_id, order.carrier_id, block.holder_carrier_id, to_carrier_id when filing a port request (the gaining carrier files), or port_request.from_carrier_id when concurring in or rejecting one"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /numbering/allocation-requests, POST /numbering/allocation-requests/{request_id}/resubmissions, POST /numbering/utilization-filings, POST /numbering/utilization-filings/{filing_id}/submissions, POST /numbering/blocks/{block_id}/activation-confirmations, POST /numbering/reclamation-orders/{order_id}/transitions, POST /numbering/port-requests/{port_request_id}/transitions, POST /numbering/carriers/{carrier_id}/readiness-events"
  - priority: 7
    category: auth
    check: "The requested action is permitted for the acting role on that specific endpoint even though the role may call the endpoint at all, evaluated per endpoint: on a review only RegulatoryApprover may send APPROVE, only NumberingAdministrator may send REQUEST_INFO or DENY, and only CarrierRepresentative may send WITHDRAW; on a relief plan transition only RegulatoryApprover may send ORDER and only NumberingAdministrator may send OPEN_COMMENT, CLOSE_AND_RECOMMEND or WITHDRAW; on a reclamation order transition only CarrierRepresentative may send SURRENDER or APPEAL and only NumberingAdministrator may send EXECUTE or WITHDRAW; on a readiness event only CarrierRepresentative may send ATTEST and only NumberingAdministrator may send VERIFY or FAIL; on a port request transition only CarrierRepresentative may send CONCUR or REJECT and only PortingOperations may send ACTIVATE or CANCEL. License actions, audit dispositions and pooling transitions are single-role endpoints, so priority 2 already covers them and no action-level check applies"
    error_id: ERR_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "every /transitions, /reviews, /license-actions, /readiness-events, /dispositions and /pooling-transitions endpoint"
  - priority: 8
    category: state
    check: "The expected_<parent>_version supplied in the body equals the parent's current version (optimistic concurrency, see 1.2.1)"
    error_id: "ERR_STALE_RATE_CENTER_VERSION | ERR_STALE_BLOCK_VERSION"
    http_status: 412
    applies_to: "POST /numbering/allocation-requests, POST /numbering/blocks/{block_id}/routing-records"
  - priority: 9
    category: state
    check: "The target resource is not already in a terminal state for its machine (AllocationRequest APPROVED/DENIED/SUPERSEDED/WITHDRAWN, UtilizationFiling ACCEPTED, AuditFinding ACCEPTED/REJECTED, ReclamationOrder EXECUTED/WITHDRAWN, ReliefPlan ORDERED/WITHDRAWN, PortRequest SNAPPED_BACK/REJECTED/CANCELLED, NumberBlock RETIRED)"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 10
    category: state
    check: "The requested transition exists from the resource's current state, and every cross-entity precondition of that transition holds (for example APPROVE requires the rate center to be past its pooling transition, ACTIVATE requires the block routing_status to be LERG_PUBLISHED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 11
    category: state
    check: "A REQUEST_INFO review is refused once info_request_count has already reached INFO_REQUEST_MAX_CYCLES (2)"
    error_id: ERR_INFO_CYCLE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews"
  - priority: 12
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the user who performed the preceding step - finding.auditor_user_id for a disposition, request.reviewer_user_id for an APPROVE, plan.recommender_user_id for an ORDER"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /numbering/audit-findings/{finding_id}/dispositions, POST /numbering/allocation-requests/{request_id}/reviews, POST /numbering/relief-plans/{plan_id}/transitions"
  - priority: 13
    category: business_safety
    check: "The applicant carrier's eligibility_status is ELIGIBLE or PROBATION - that is, license_status GRANTED and facilities_readiness_status VERIFIED - at the moment of the action, re-evaluated and never inherited from submission time. Two neighbouring conditions are deliberately NOT examined here so that they surface as their own errors: licence expiry belongs to priority 14 and PROBATION belongs to priority 15, so an expired-but-granted licence and a carrier on probation both pass this rule and fail the next ones"
    error_id: ERR_CARRIER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /numbering/allocation-requests, POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE, POST /numbering/port-requests"
  - priority: 14
    category: business_safety
    check: "The carrier's license_expires_on is strictly after the logical clock"
    error_id: ERR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /numbering/allocation-requests, POST /numbering/utilization-filings/{filing_id}/submissions, POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 15
    category: business_safety
    check: "The applicant carrier is not on probation: eligibility_status != PROBATION and probation_until is null or at or before the logical clock"
    error_id: ERR_CARRIER_ON_PROBATION
    http_status: 422
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 16
    category: business_referential
    check: "Jurisdiction agreement: the rate center's state_code equals its NPA's state_code, and for an INITIAL request it also equals the applicant carrier's home_state_code"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /numbering/rate-centers, POST /numbering/allocation-requests"
  - priority: 17
    category: business_referential
    check: "The telephone_number on a port request falls inside the referenced block: its first six digits equal npa_code plus nxx_code and its seventh digit equals thousands_digit"
    error_id: ERR_NUMBER_OUTSIDE_BLOCK
    http_status: 422
    applies_to: "POST /numbering/port-requests"
  - priority: 18
    category: business_referential
    check: "A port request targets a block that is actually in service: allocation_status ASSIGNED, routing_status LERG_PUBLISHED, and from_carrier_id equal to the block's holder_carrier_id"
    error_id: ERR_PORT_BLOCK_NOT_ROUTED
    http_status: 409
    applies_to: "POST /numbering/port-requests, POST /numbering/port-requests/{port_request_id}/transitions with action=ACTIVATE"
  - priority: 19
    category: business_temporal
    check: "A new RoutingRecord's half-open interval [effective_at, end_at) must not overlap the block's open PUBLISHED record: effective_at must be at or after that record's effective_at, and a record starting exactly at the previous record's end_at is adjacent, not overlapping, and is allowed"
    error_id: ERR_ROUTING_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /numbering/blocks/{block_id}/routing-records"
  - priority: 20
    category: business_temporal
    check: "A relief plan's occupied interval must clear the previous plan's window: the new plan's effective_at must be at least RELIEF_WINDOW_BUFFER_DAYS (90) after the newest non-withdrawn plan's window_end_at for the same NPA, and closed intervals are inclusive on both ends"
    error_id: ERR_RELIEF_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /numbering/npas/{npa_id}/relief-plans, POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
  - priority: 21
    category: business_temporal
    check: "A public comment is accepted only while the window is open: the logical clock is at or after comment_window_open_at and strictly before comment_window_close_at"
    error_id: ERR_COMMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /numbering/relief-plans/{plan_id}/comments"
  - priority: 22
    category: business_temporal
    check: "An activation confirmation is accepted only at or before block.activation_due_at, and a reclamation appeal only at or before order.response_due_at"
    error_id: ERR_ACTIVATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /numbering/blocks/{block_id}/activation-confirmations, POST /numbering/reclamation-orders/{order_id}/transitions with action=APPEAL"
  - priority: 23
    category: business_constraint
    check: "ocn is unique across all carriers"
    error_id: ERR_DUPLICATE_OCN
    http_status: 409
    applies_to: "POST /numbering/carriers"
  - priority: 24
    category: business_constraint
    check: "npa_code is unique across all NPAs, including a new_npa_code minted by an ORDER"
    error_id: ERR_DUPLICATE_NPA_CODE
    http_status: 409
    applies_to: "POST /numbering/npas, POST /numbering/relief-plans/{plan_id}/transitions with action=ORDER"
  - priority: 25
    category: business_constraint
    check: "block_label - npa_code plus nxx_code plus thousands_digit - is unique across all blocks"
    error_id: ERR_DUPLICATE_BLOCK_LABEL
    http_status: 409
    applies_to: "POST /numbering/blocks"
  - priority: 26
    category: business_constraint
    check: "A carrier has at most one UtilizationFiling per rate_center_id and reporting_period that is not in status REJECTED"
    error_id: ERR_DUPLICATE_FILING_PERIOD
    http_status: 409
    applies_to: "POST /numbering/utilization-filings"
  - priority: 27
    category: business_constraint
    check: "An INITIAL request requires rate_center.accepts_initial_requests to be true, which is false while jeopardy_flag is set or pooling_status is TRANSITIONAL"
    error_id: ERR_RATE_CENTER_NOT_ACCEPTING_INITIAL
    http_status: 409
    applies_to: "POST /numbering/allocation-requests"
  - priority: 28
    category: business_constraint
    check: "The rate center's pool is not blocked purely by contamination. The rate center holds at least one POOL_AVAILABLE block whose routing_status is UNROUTED or ROUTING_WITHDRAWN, and at least one of those blocks passes the pool eligibility test - is_pooling_eligible true (contaminated_count <= CONTAMINATION_MAX_FOR_POOLING) and, when pooling_status is not POOLED, contaminated_count == 0. If every unrouted POOL_AVAILABLE block fails that test this rule fires; priority 33 fires only when the rate center has no unrouted POOL_AVAILABLE block at all. Donations are not gated here: pooling_donation_obligation never selects an ineligible block, it records a donation_shortfall_count instead"
    error_id: ERR_BLOCK_NOT_POOLING_ELIGIBLE
    http_status: 422
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 29
    category: business_fiscal
    check: "A GROWTH, POOL_REPLENISH or SAFETY_VALVE request requires an effective UtilizationFiling for the same carrier and rate center in status SUBMITTED, ACCEPTED or REJECTED"
    error_id: ERR_UTILIZATION_FILING_REQUIRED
    http_status: 422
    applies_to: "POST /numbering/allocation-requests"
  - priority: 30
    category: business_fiscal
    check: "The effective utilization reaches UTILIZATION_MIN_PCT_GROWTH (60.00), inclusive, so growth_grant_size yields a tier_cap of at least 1; SAFETY_VALVE and INITIAL requests bypass this gate"
    error_id: ERR_UTILIZATION_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 31
    category: business_fiscal
    check: "rate_center_months_to_exhaust is at most MONTHS_TO_EXHAUST_MAX (6) months under the variant that applies to the applicant's effective filing; SAFETY_VALVE requests bypass this gate"
    error_id: ERR_EXHAUST_HORIZON_TOO_LONG
    http_status: 422
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 32
    category: business_fiscal
    check: "A carrier may hold at most SAFETY_VALVE_MAX_GRANTS_PER_CARRIER (1) granted safety-valve exception, and a SAFETY_VALVE request may ask for at most SAFETY_VALVE_MAX_BLOCKS (1) block"
    error_id: ERR_SAFETY_VALVE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /numbering/allocation-requests, POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 33
    category: business_fiscal
    check: "block_pool_selection returns at least one candidate block for the rate center. Priority 28 has already ruled out the contamination-blocked pool, so this rule is the empty-pool case: no POOL_AVAILABLE block with routing_status UNROUTED or ROUTING_WITHDRAWN exists in the rate center"
    error_id: ERR_POOL_INSUFFICIENT_BLOCKS
    http_status: 409
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"
  - priority: 34
    category: business_fiscal
    check: "An explicit granted_block_count on an APPROVE review does not exceed the growth_grant_size entitlement"
    error_id: ERR_GRANT_EXCEEDS_ENTITLEMENT
    http_status: 422
    applies_to: "POST /numbering/allocation-requests/{request_id}/reviews with action=APPROVE"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock to any UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline in this domain (activation windows, aging releases, comment windows, permissive dialing) is evaluated against this clock."
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations, PublicCommenter]
    code: 200
    input: [current_utc]
    output: {current_utc: datetime}
    side_effects: ["sets the logical clock; no entity is mutated and no sweep is run"]

  - method: POST
    path: "/numbering/carriers"
    description: "Registers a carrier (OCN holder) with no license and no facilities readiness"
    roles: [NumberingAdministrator]
    code: 201
    input: [ocn, legal_name, carrier_type, home_state_code, "months_in_operation?"]
    output: Carrier
    side_effects: ["license_status = NONE, facilities_readiness_status = NOT_SUBMITTED", "computes eligibility_status, which is INELIGIBLE at creation", "version starts at 1"]
  - method: GET
    path: "/numbering/carriers"
    description: "Lists carriers with filtering and pagination"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: ["ocn?", "license_status?", "eligibility_status?", "home_state_code?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []
  - method: GET
    path: "/numbering/carriers/{carrier_id}"
    description: "Retrieves one carrier including its derived eligibility_status and counters"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/numbering/carriers/{carrier_id}/license-actions"
    description: "Drives the licensing dimension of the Carrier machine: GRANT, RENEW, SUSPEND, REINSTATE or REVOKE"
    roles: [NumberingAdministrator]
    code: 200
    input: [action, "license_expires_on?", "reason?"]
    output: Carrier
    side_effects: ["updates license_status and license_expires_on", "recomputes eligibility_status", "REVOKE additionally issues a LICENSE_REVOKED ReclamationOrder for every block the carrier holds, in created_at ASC order, and denies its PENDING_REVIEW and INFO_REQUESTED requests", "increments Carrier.version by 1"]
  - method: POST
    path: "/numbering/carriers/{carrier_id}/readiness-events"
    description: "Drives the facilities-readiness dimension of the Carrier machine: ATTEST by the carrier itself, VERIFY or FAIL by the administrator"
    roles: [CarrierRepresentative, NumberingAdministrator]
    code: 200
    input: [event, "switch_clli?", "interconnection_ready?", "note?"]
    output: Carrier
    side_effects: ["updates facilities_readiness_status, switch_clli and interconnection_ready", "recomputes eligibility_status", "increments Carrier.version by 1"]

  - method: POST
    path: "/numbering/npas"
    description: "Creates an area code (NPA) in ACTIVE status"
    roles: [NumberingAdministrator]
    code: 201
    input: [npa_code, state_code, "npa_type?"]
    output: NPA
    side_effects: ["available_block_count and total_block_count start at 0", "exhaust_projection_months starts at the EXHAUST_SENTINEL_MONTHS value 999.00"]
  - method: GET
    path: "/numbering/npas"
    description: "Lists area codes with filtering and pagination; relief_parent_npa_id finds the successor codes minted from a parent code"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations, PublicCommenter]
    code: 200
    input: ["state_code?", "status?", "npa_type?", "relief_parent_npa_id?", "limit?", "offset?"]
    output: NPA[]
    side_effects: []
  - method: GET
    path: "/numbering/npas/{npa_id}"
    description: "Retrieves one area code with its recomputed exhaust posture"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations, PublicCommenter]
    code: 200
    input: []
    output: NPA
    side_effects: []
  - method: GET
    path: "/numbering/npas/{npa_id}/rate-centers"
    description: "Lists the rate centers that belong to this area code"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PortingOperations]
    code: 200
    input: ["pooling_status?", "limit?", "offset?"]
    output: RateCenter[]
    side_effects: []
  - method: POST
    path: "/numbering/npas/{npa_id}/jeopardy-declarations"
    description: "Manually declares the area code to be in jeopardy regardless of its available block count"
    roles: [NumberingAdministrator]
    code: 200
    input: [reason]
    output: NPA
    side_effects: ["sets jeopardy_declared_at = clock_now and status = JEOPARDY", "sets jeopardy_flag = true on every rate center under the code, which turns accepts_initial_requests false", "increments NPA.version and each RateCenter.version by 1"]
  - method: POST
    path: "/numbering/npas/{npa_id}/relief-plans"
    description: "Opens a relief plan for the area code in PLANNING status"
    roles: [NumberingAdministrator]
    code: 201
    input: [planned_relief_type, "comment_window_days?", "new_npa_code?", "effective_at?"]
    output: ReliefPlan
    side_effects: ["status = PLANNING with comment_window_days defaulting to COMMENT_WINDOW_DAYS (30)", "window_end_at stays null while the plan is in PLANNING", "runs the relief-window buffer check against the newest non-withdrawn plan for the same NPA"]
  - method: GET
    path: "/numbering/npas/{npa_id}/relief-plans"
    description: "Lists the relief plans opened for this area code"
    roles: [NumberingAdministrator, RegulatoryApprover, CarrierRepresentative, PublicCommenter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReliefPlan[]
    side_effects: []

  - method: POST
    path: "/numbering/rate-centers"
    description: "Creates a rate center inside an area code, initially NON_POOLED"
    roles: [NumberingAdministrator]
    code: 201
    input: [npa_id, name, state_code, lata_code]
    output: RateCenter
    side_effects: ["pooling_status = NON_POOLED, accepts_initial_requests computes to true", "jeopardy_flag inherits true when the parent NPA is already in JEOPARDY"]
  - method: GET
