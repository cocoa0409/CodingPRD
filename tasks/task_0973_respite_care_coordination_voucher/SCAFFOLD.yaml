# =============================================================================
# Task 0973: Respite-Care Coordination & Voucher — scaffold seed tables
# =============================================================================

scenario: |
  973. Respite-Care Coordination & Voucher: caregiver enrollment & eligibility,
  respite-hours allocation & voucher, provider match & scheduling, EVV & claim,
  budget & cap, emergency respite, satisfaction, funder reporting

domain_name: respite-care-voucher
api_prefix: /respite

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: fiscal_year_start, type: string, source: input, description: "Fiscal year anchor date YYYY-MM-DD; quarters are 3-calendar-month blocks from this date" }
      - { name: posture, type: enum, source: system, description: "ENROLLMENT_OPEN | ENROLLMENT_PAUSED | PROGRAM_SUSPENDED | CLOSED; gates child operations", default: ENROLLMENT_OPEN }
      - { name: total_budget_cents, type: integer, source: input, description: "Total program budget in cents" }
      - { name: encumbered_cents, type: integer, source: computed, description: "Outstanding encumbrance (voucher provisionals + approved unpaid claims)" }
      - { name: settled_cents, type: integer, source: computed, description: "Sum of PAID claim amounts" }
      - { name: unencumbered_cents, type: integer, source: computed, description: "total_budget_cents - encumbered_cents - settled_cents" }
      - { name: emergency_reserve_hours, type: integer, source: input, description: "Hours pool reserved for emergency respite" }
      - { name: emergency_hours_used, type: number, source: computed, description: "Hours debited from reserve by dispatched emergency requests; 2dp" }
      - { name: quarterly_cap_hours, type: number, source: input, description: "Max reserved+consumed hours per caregiver per quarter; 2dp" }
      - { name: annual_cap_hours, type: number, source: input, description: "Max reserved+consumed hours per caregiver per fiscal year; 2dp" }
      - { name: standard_rate_cents_per_hour, type: integer, source: input, description: "Base hourly rate in cents" }
      - { name: weekend_multiplier, type: number, source: input, description: "Rate multiplier when check_in_at is Sat/Sun UTC", default: 1.5 }
      - { name: evening_multiplier, type: number, source: input, description: "Rate multiplier when check_in_at hour (UTC) >= evening_start_hour and day is Mon-Fri", default: 1.25 }
      - { name: evening_start_hour, type: integer, source: input, description: "UTC hour at which evening differential begins", default: 18 }
      - { name: emergency_multiplier, type: number, source: input, description: "Rate multiplier for emergency bookings", default: 2.0 }
      - { name: credential_premium_multiplier, type: number, source: input, description: "Rate multiplier for ENHANCED credential providers", default: 1.10 }
      - { name: max_overage_pct, type: number, source: input, description: "Payable minutes cap as fraction of committed minutes", default: 1.10 }
      - { name: voucher_expiry_days, type: integer, source: input, description: "Days from issue until voucher expiry", default: 90 }
      - { name: carryover_cap_pct, type: number, source: input, description: "Max fraction of base grant carried into next quarter", default: 0.25 }
      - { name: no_show_grace_minutes, type: integer, source: input, description: "Minutes past booking start before no-show marking", default: 30 }
      - { name: auto_close_grace_hours, type: integer, source: input, description: "Hours past booking end before an OPEN visit is auto-closed", default: 2 }
      - { name: appeal_window_days, type: integer, source: input, description: "Days after claim denial during which appeal is allowed", default: 30 }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic epoch counter, starts 0, +1 per ops-run", default: 0 }

  - name: Caregiver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Caregiver legal name" }
      - { name: email, type: string, source: input, description: "Login email; unique across caregivers" }
      - { name: care_recipient_name, type: string, source: input, description: "Name of person receiving care" }
      - { name: care_recipient_condition, type: string, source: input, description: "Condition summary driving eligibility" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ACTIVE | SUSPENDED | REDETERMINATION_PENDING | DISENROLLED", default: ENROLLED }
      - { name: redetermination_due_at, type: datetime, source: system, description: "Set to approval time + 365 days; null until first approval" }

  - name: EligibilityApplication
    parent: null
    common_fields: true
    fields:
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; applicant" }
      - { name: need_score, type: integer, source: input, description: "Assessed need 1-10" }
      - { name: notes, type: string, source: input, description: "Applicant notes", default: "" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | APPEALED | DENIED_FINAL | WITHDRAWN", default: SUBMITTED }
      - { name: revision_count, type: integer, source: system, description: "Number of resubmissions after info request", default: 0 }
      - { name: review_note, type: string, source: system, description: "Coordinator note from last review decision; null until reviewed" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of APPROVE/DENY decision; null until decided" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: caregiver_id, type: string, source: system, description: "FK -> Caregiver.id; owner of the grant" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; funding program" }
      - { name: period_start, type: datetime, source: system, description: "Quarter start derived from program fiscal calendar at creation time" }
      - { name: period_end, type: datetime, source: system, description: "Quarter end (exclusive) derived from program fiscal calendar" }
      - { name: granted_hours, type: number, source: system, description: "Total granted hours; 2dp; adjusted by grant-adjustments" }
      - { name: available_hours, type: number, source: computed, description: "Hours issuable to new vouchers; 2dp" }
      - { name: reserved_hours, type: number, source: computed, description: "Hours held by non-terminal vouchers; 2dp" }
      - { name: consumed_hours, type: number, source: computed, description: "Hours redeemed by verified visits; 2dp" }
      - { name: expired_hours, type: number, source: computed, description: "Hours forfeited by voucher expiry; 2dp" }
      - { name: revoked_hours, type: number, source: computed, description: "Hours clawed back by revocation/suspension; 2dp" }
      - { name: status, type: enum, source: system, description: "OPEN | FROZEN | CLOSED", default: OPEN }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; null for emergency vouchers funded from the program reserve" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; funding program" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; voucher owner" }
      - { name: is_emergency, type: boolean, source: system, description: "True when created by emergency dispatch", default: false }
      - { name: authorized_hours, type: number, source: input, description: "Voucher face hours; 2dp; multiple of 0.25; 1.00..80.00" }
      - { name: committed_hours, type: number, source: computed, description: "Hours pinned by non-terminal bookings (PENDING_CONFIRMATION|CONFIRMED|IN_SERVICE); 2dp" }
      - { name: consumed_hours, type: number, source: computed, description: "Hours redeemed by verified visits; 2dp" }
      - { name: released_hours, type: number, source: computed, description: "Remainder hours released to allocation at redemption; 2dp" }
      - { name: forfeited_hours, type: number, source: computed, description: "Unconsumed hours forfeited at expiry/revocation; 2dp" }
      - { name: status, type: enum, source: system, description: "ISSUED | COMMITTED | REDEEMED | SETTLED | EXPIRED | REVOKED", default: ISSUED }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp (logical clock)" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + program.voucher_expiry_days; emergency vouchers: needed_end_at" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider display name" }
      - { name: credential_level, type: enum, source: input, description: "STANDARD | ENHANCED" }
      - { name: service_zip, type: string, source: input, description: "Service area ZIP" }
      - { name: accepts_emergency, type: boolean, source: input, description: "Willing to take emergency dispatches", default: false }
      - { name: credential_status, type: enum, source: system, description: "APPLIED | ACTIVE | SUSPENDED | LAPSED | TERMINATED", default: APPLIED }
      - { name: credential_expires_at, type: datetime, source: system, description: "activation time + 180 days; null until first activation" }
      - { name: quality_score_simple, type: number, source: computed, description: "Mean of all survey ratings; 2dp; null when no surveys" }
      - { name: quality_score_weighted, type: number, source: computed, description: "Recency-decay weighted rating (half-life 30d); 2dp; null when no surveys" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded at last suspension; null otherwise" }

  - name: AvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; owning provider" }
      - { name: start_at, type: datetime, source: input, description: "Window start (UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (UTC); half-open [start_at, end_at)" }
      - { name: capacity, type: integer, source: input, description: "Max overlapping non-cancelled bookings; >= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | FULLY_BOOKED | CLOSED | WITHDRAWN", default: OPEN }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: voucher_id, type: string, source: input, description: "FK -> Voucher.id; funding voucher" }
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; receiving caregiver" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; explicit in EXPLICIT mode, system-selected in AUTO mode" }
      - { name: window_id, type: string, source: input, description: "FK -> AvailabilityWindow.id; required in EXPLICIT mode, set by selector in AUTO mode, null for emergency bookings" }
      - { name: emergency_request_id, type: string, source: system, description: "FK -> EmergencyRequest.id; null unless created by emergency dispatch" }
      - { name: is_emergency, type: boolean, source: system, description: "True when created by emergency dispatch", default: false }
      - { name: auto_matched, type: boolean, source: system, description: "True when provider was selected by the AUTO matcher", default: false }
      - { name: start_at, type: datetime, source: input, description: "Booking start (UTC); half-open [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Booking end (UTC); must be after start_at" }
      - { name: committed_minutes, type: integer, source: computed, description: "Duration in whole minutes: (end_at - start_at)/60" }
      - { name: status, type: enum, source: system, description: "PENDING_CONFIRMATION | CONFIRMED | IN_SERVICE | COMPLETED | CANCELLED | NO_SHOW", default: PENDING_CONFIRMATION }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Estimate at confirm: committed_minutes x standard_rate / 60, rounded half-up; null until confirmed" }
      - { name: cancel_reason, type: string, source: system, description: "Reason recorded at cancellation; null otherwise" }

  - name: VisitRecord
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; visit under verification" }
      - { name: check_in_at, type: datetime, source: system, description: "EVV check-in timestamp (logical clock)" }
      - { name: check_in_location, type: string, source: input, description: "EVV geo string captured at check-in" }
      - { name: check_out_at, type: datetime, source: system, description: "EVV check-out timestamp; null while OPEN" }
      - { name: tasks_completed, type: array, source: input, description: "Task codes reported at check-out", default: [] }
      - { name: auto_closed, type: boolean, source: system, description: "True when ops-run closed the visit at booking end", default: false }
      - { name: verified_minutes, type: integer, source: computed, description: "Quarter-hour-rounded minutes between check-in and check-out; null until check-out" }
      - { name: payable_minutes, type: integer, source: computed, description: "min(verified_minutes, floor(committed_minutes x max_overage_pct)); null until check-out" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | VERIFIED | REJECTED", default: OPEN }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at rejection; null otherwise" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: visit_record_id, type: string, source: system, description: "FK -> VisitRecord.id; exactly one claim per visit" }
      - { name: voucher_id, type: string, source: system, description: "FK -> Voucher.id; funding voucher" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; billing provider" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Booking-time estimate carried from booking" }
      - { name: amount_cents, type: integer, source: computed, description: "Final adjudicated amount per claim_amount_final" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PAID | DENIED | APPEALED | DENIED_FINAL", default: DRAFT }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded at denial; null otherwise" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of last adjudication; null until adjudicated" }
      - { name: paid_at, type: datetime, source: system, description: "Timestamp of payment; null until paid" }

  - name: BudgetLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; ledger owner" }
      - { name: entry_type, type: enum, source: system, description: "ENCUMBER | RELEASE | SETTLE | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed effect magnitude in cents (always positive; direction implied by entry_type)" }
      - { name: ref_type, type: string, source: system, description: "Originating entity kind label (voucher | claim | program); free-form, not a foreign key" }
      - { name: ref_id, type: string, source: system, description: "Originating entity identifier; free-form, not a foreign key" }
      - { name: note, type: string, source: system, description: "Human-readable ledger note", default: "" }

  - name: EmergencyRequest
    parent: null
    common_fields: true
    fields:
      - { name: caregiver_id, type: string, source: input, description: "FK -> Caregiver.id; requesting caregiver" }
      - { name: needed_start_at, type: datetime, source: input, description: "Needed coverage start (UTC)" }
      - { name: needed_end_at, type: datetime, source: input, description: "Needed coverage end (UTC)" }
      - { name: reason, type: string, source: input, description: "Emergency justification" }
      - { name: requested_hours, type: number, source: computed, description: "(needed_end_at - needed_start_at) in hours; 2dp" }
      - { name: approved_hours, type: number, source: system, description: "Hours approved at triage; null until triaged; 2dp" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | DISPATCHED | FULFILLED | EXPIRED | CANCELLED", default: OPEN }
      - { name: dispatched_booking_id, type: string, source: system, description: "FK -> Booking.id; null until dispatched" }
      - { name: selected_provider_id, type: string, source: system, description: "FK -> Provider.id; null until dispatched" }

  - name: SatisfactionSurvey
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; one survey per booking (unique)" }
      - { name: caregiver_id, type: string, source: system, description: "FK -> Caregiver.id; author" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; subject" }
      - { name: rating, type: integer, source: input, description: "1-5 overall rating" }
      - { name: would_rebook, type: boolean, source: input, description: "Would book this provider again" }
      - { name: comments, type: string, source: input, description: "Free-text feedback", default: "" }

  - name: ReportSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; reporting program" }
      - { name: period_start, type: datetime, source: system, description: "Calendar month start of the ops-run clock time" }
      - { name: period_end, type: datetime, source: system, description: "Calendar month end (exclusive) of the ops-run clock time" }
      - { name: status, type: enum, source: system, description: "GENERATED | FINALIZED | SUBMITTED_TO_FUNDER | UNDER_AMENDMENT | RESUBMITTED", default: GENERATED }
      - { name: utilization_projected_pct, type: number, source: computed, description: "100 x (consumed + reserved hours over all program allocations) / granted; 2dp; 0.00 when granted is 0" }
      - { name: utilization_settled_pct, type: number, source: computed, description: "100 x settled_cents / total_budget_cents; 2dp" }
      - { name: total_granted_hours, type: number, source: computed, description: "Sum of granted_hours across program allocations; 2dp" }
      - { name: consumed_hours, type: number, source: computed, description: "Sum of consumed_hours across program allocations; 2dp" }
      - { name: reserved_hours, type: number, source: computed, description: "Sum of reserved_hours across program allocations; 2dp" }
      - { name: claims_paid_count, type: integer, source: computed, description: "Count of program claims in PAID status" }
      - { name: total_paid_amount_cents, type: integer, source: computed, description: "Sum of amount_cents over PAID claims (per-claim rounded integers summed)" }
      - { name: emergency_hours_used, type: number, source: computed, description: "Program emergency_hours_used at snapshot time; 2dp" }
      - { name: ops_run_index, type: integer, source: system, description: "Program ops_run_index at generation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: ENROLLMENT_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: ENROLLMENT_OPEN
        to: ENROLLMENT_PAUSED
        trigger: "POST /respite/programs/{id}/posture {target_posture: ENROLLMENT_PAUSED}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments Program.version by 1"]
      - from: ENROLLMENT_PAUSED
        to: ENROLLMENT_OPEN
        trigger: "POST /respite/programs/{id}/posture {target_posture: ENROLLMENT_OPEN}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments Program.version by 1"]
      - from: ENROLLMENT_OPEN
        to: PROGRAM_SUSPENDED
        trigger: "POST /respite/programs/{id}/posture {target_posture: PROGRAM_SUSPENDED}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments Program.version by 1"]
      - from: ENROLLMENT_PAUSED
        to: PROGRAM_SUSPENDED
        trigger: "POST /respite/programs/{id}/posture {target_posture: PROGRAM_SUSPENDED}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments Program.version by 1"]
      - from: PROGRAM_SUSPENDED
        to: ENROLLMENT_OPEN
        trigger: "POST /respite/programs/{id}/posture {target_posture: ENROLLMENT_OPEN}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments Program.version by 1"]
      - from: ENROLLMENT_OPEN
        to: CLOSED
        trigger: "POST /respite/programs/{id}/posture {target_posture: CLOSED}"
        actor: FunderAdmin
        preconditions:
          - "No Voucher in ISSUED, COMMITTED, or REDEEMED status for this program"
          - "No Claim in DRAFT, SUBMITTED, APPROVED, or APPEALED status for this program"
          - "No Booking in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE status for this program"
        side_effects: ["increments Program.version by 1"]

  - entity: Caregiver
    initial_state: ENROLLED
    terminal_states: [DISENROLLED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "system: first EligibilityApplication APPROVE for this caregiver (POST /respite/eligibility-applications/{id}/review-decisions {action: APPROVE})"
        actor: system
        preconditions: ["Application status SUBMITTED or APPEALED"]
        side_effects:
          - "Caregiver.redetermination_due_at = now + 365 days"
          - "Auto-create Allocation for the current fiscal quarter: granted_hours = program.quarterly_cap_hours, all buckets 0 except available_hours = granted_hours, status OPEN (skipped if an OPEN allocation for the current quarter already exists)"
          - "increments Caregiver.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /respite/caregivers/{id}/status-transitions {target_status: SUSPENDED}"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "All OPEN allocations of caregiver -> FROZEN"
          - "Each FROZEN allocation's ISSUED vouchers -> REVOKED (reserved_hours moved to revoked_hours; forfeited_hours set; budget RELEASE of remaining provisional encumbrance)"
          - "Each COMMITTED voucher's bookings in PENDING_CONFIRMATION or CONFIRMED -> CANCELLED (reason SYSTEM_SUSPENSION), then the voucher -> REVOKED (same bucket and ledger effects)"
          - "Each cancelled booking frees its AvailabilityWindow overlap count; a FULLY_BOOKED window whose overlap count drops below capacity -> OPEN"
          - "increments Caregiver.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /respite/caregivers/{id}/status-transitions {target_status: ACTIVE}"
        actor: Coordinator
        preconditions: ["redetermination_due_at is null or > now"]
        side_effects:
          - "All FROZEN allocations of caregiver -> OPEN"
          - "increments Caregiver.version by 1"
      - from: ACTIVE
        to: REDETERMINATION_PENDING
        trigger: "system: ops-run observes redetermination_due_at <= now (POST /respite/programs/{id}/ops-runs)"
        actor: system
        preconditions: []
        side_effects: ["increments Caregiver.version by 1"]
      - from: REDETERMINATION_PENDING
        to: ACTIVE
        trigger: "system: a new EligibilityApplication APPROVE for this caregiver"
        actor: system
        preconditions: []
        side_effects:
          - "Caregiver.redetermination_due_at = now + 365 days"
          - "Auto-create current-quarter Allocation if none OPEN (same rule as first approval)"
          - "increments Caregiver.version by 1"
      - from: ENROLLED
        to: DISENROLLED
        trigger: "POST /respite/caregivers/{id}/status-transitions {target_status: DISENROLLED}"
        actor: Coordinator
        preconditions: []
        side_effects: ["increments Caregiver.version by 1"]
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /respite/caregivers/{id}/status-transitions {target_status: DISENROLLED}"
        actor: Coordinator
        preconditions: ["No bookings in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE for this caregiver"]
        side_effects:
          - "All OPEN allocations -> CLOSED; their ISSUED vouchers -> REVOKED with bucket and ledger effects as in suspension"
          - "increments Caregiver.version by 1"

  - entity: EligibilityApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED_FINAL, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: REQUEST_INFO}"
        actor: Coordinator
        preconditions: []
        side_effects: ["review_note = note", "increments EligibilityApplication.version by 1"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /respite/eligibility-applications/{id}/resubmit"
        actor: Caregiver
        preconditions: ["Acting caregiver owns the application (caregiver_id == X-User-ID)"]
        side_effects: ["revision_count += 1", "increments EligibilityApplication.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: APPROVE}"
        actor: Coordinator
        preconditions: ["Program posture == ENROLLMENT_OPEN"]
        side_effects:
          - "decided_at = now; review_note = note"
          - "Caregiver ENROLLED -> ACTIVE or REDETERMINATION_PENDING -> ACTIVE (see Caregiver machine)"
          - "increments EligibilityApplication.version by 1"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: APPROVE}"
        actor: Coordinator
        preconditions: ["Program posture == ENROLLMENT_OPEN"]
        side_effects: ["decided_at = now; review_note = note", "Caregiver -> ACTIVE as above", "increments EligibilityApplication.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: DENY}"
        actor: Coordinator
        preconditions: []
        side_effects: ["decided_at = now; review_note = note", "increments EligibilityApplication.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /respite/eligibility-applications/{id}/appeal"
        actor: Caregiver
        preconditions:
          - "Acting caregiver owns the application"
          - "now <= decided_at + 30 days"
        side_effects: ["increments EligibilityApplication.version by 1"]
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: DENY}"
        actor: Coordinator
        preconditions: []
        side_effects: ["decided_at = now; review_note = note", "increments EligibilityApplication.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /respite/eligibility-applications/{id}/review-decisions {action: WITHDRAW}"
        actor: Coordinator
        preconditions: []
        side_effects: ["increments EligibilityApplication.version by 1"]

  - entity: Allocation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system: caregiver suspension cascade"
        actor: system
        preconditions: []
        side_effects: ["increments Allocation.version by 1"]
      - from: FROZEN
        to: OPEN
        trigger: "system: caregiver reinstatement cascade"
        actor: system
        preconditions: []
        side_effects: ["increments Allocation.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system: QUARTER_ROLLOVER ops-run with period_end <= now, or caregiver disenrollment"
        actor: system
        preconditions: []
        side_effects: ["increments Allocation.version by 1"]

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [SETTLED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: COMMITTED
        trigger: "POST /respite/bookings (booking pins hours on this voucher)"
        actor: Caregiver
        preconditions:
          - "voucher.status == ISSUED"
          - "booking end_at <= voucher.expires_at"
          - "committed_hours + booking duration <= authorized_hours - consumed_hours - released_hours - forfeited_hours"
        side_effects: ["committed_hours += booking duration hours", "increments Voucher.version by 1"]
      - from: COMMITTED
        to: ISSUED
        trigger: "POST /respite/bookings/{id}/cancel or system no-show, when no non-terminal booking remains"
        actor: "Caregiver | Provider | Coordinator | system"
        preconditions: ["All bookings of the voucher are CANCELLED or NO_SHOW"]
        side_effects: ["committed_hours = 0", "increments Voucher.version by 1"]
      - from: COMMITTED
        to: REDEEMED
        trigger: "system: visit verification cascade (POST /respite/visit-records/{id}/verification-decisions {decision: VERIFY})"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_hours += verified_hours; committed_hours = 0"
          - "released_hours = authorized_hours - consumed_hours - forfeited_hours"
          - "Allocation: reserved_hours -= authorized_hours; consumed_hours += verified_hours; available_hours += released_hours (when allocation OPEN)"
          - "increments Voucher.version by 1"
      - from: REDEEMED
        to: SETTLED
        trigger: "system: claim payment cascade when no DRAFT/SUBMITTED/APPROVED/APPEALED claim and no non-terminal booking remains for the voucher"
        actor: system
        preconditions: []
        side_effects: ["increments Voucher.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system: ops-run observes expires_at <= now"
        actor: system
        preconditions: []
        side_effects:
          - "forfeited_hours = authorized_hours - consumed_hours"
          - "Allocation: reserved_hours -= forfeited_hours; expired_hours += forfeited_hours"
          - "Budget: RELEASE remaining provisional encumbrance forfeited_hours x standard_rate_cents_per_hour / 1 hour"
          - "increments Voucher.version by 1"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /respite/vouchers/{id}/revoke or system suspension/disenrollment cascade"
        actor: "Coordinator | system"
        preconditions: []
        side_effects:
          - "forfeited_hours = authorized_hours - consumed_hours"
          - "Allocation: reserved_hours -= forfeited_hours; revoked_hours += forfeited_hours"
          - "Budget: RELEASE remaining provisional encumbrance"
          - "increments Voucher.version by 1"
      - from: COMMITTED
        to: REVOKED
        trigger: "system suspension/disenrollment cascade (bookings cancelled first)"
        actor: system
        preconditions: ["All bookings of the voucher already CANCELLED by the same cascade"]
        side_effects:
          - "forfeited_hours = authorized_hours - consumed_hours; committed_hours = 0"
          - "Allocation: reserved_hours -= forfeited_hours; revoked_hours += forfeited_hours"
          - "Budget: RELEASE remaining provisional encumbrance"
          - "increments Voucher.version by 1"

  - entity: Provider
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: ACTIVE}"
        actor: Coordinator
        preconditions: []
        side_effects: ["credential_expires_at = now + 180 days", "increments Provider.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: ACTIVE}"
        actor: Coordinator
        preconditions: []
        side_effects: ["suspension_reason = null", "credential_expires_at = now + 180 days", "increments Provider.version by 1"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: ACTIVE}"
        actor: Coordinator
        preconditions: []
        side_effects: ["credential_expires_at = now + 180 days", "increments Provider.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: SUSPENDED}"
        actor: Coordinator
        preconditions: []
        side_effects: ["suspension_reason = reason", "increments Provider.version by 1", "NOTE: existing bookings and windows are NOT cascaded — suspension only gates NEW bookings and windows"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system: ops-run observes credential_expires_at <= now"
        actor: system
        preconditions: []
        side_effects: ["increments Provider.version by 1"]
      - from: APPLIED
        to: TERMINATED
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: TERMINATED}"
        actor: Coordinator
        preconditions: []
        side_effects: ["increments Provider.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: TERMINATED}"
        actor: Coordinator
        preconditions: ["No bookings in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE for this provider"]
        side_effects: ["increments Provider.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /respite/providers/{id}/status-transitions {target_status: TERMINATED}"
        actor: Coordinator
        preconditions: ["No bookings in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE for this provider"]
        side_effects: ["increments Provider.version by 1"]

  - entity: AvailabilityWindow
    initial_state: OPEN
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: FULLY_BOOKED
        trigger: "system: booking creation raises the maximum overlap count to capacity"
        actor: system
        preconditions: []
        side_effects: ["increments AvailabilityWindow.version by 1"]
      - from: FULLY_BOOKED
        to: OPEN
        trigger: "system: a booking cancellation/no-show drops the maximum overlap count below capacity"
        actor: system
        preconditions: []
        side_effects: ["increments AvailabilityWindow.version by 1"]
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /respite/availability-windows/{id}/close"
        actor: Provider
        preconditions: ["Acting provider owns the window", "No bookings in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE reference this window"]
        side_effects: ["increments AvailabilityWindow.version by 1"]
      - from: FULLY_BOOKED
        to: WITHDRAWN
        trigger: "POST /respite/availability-windows/{id}/close"
        actor: Provider
        preconditions: ["Acting provider owns the window", "No bookings in PENDING_CONFIRMATION, CONFIRMED, or IN_SERVICE reference this window"]
        side_effects: ["increments AvailabilityWindow.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system: ops-run observes end_at <= now"
        actor: system
        preconditions: []
        side_effects: ["increments AvailabilityWindow.version by 1"]
      - from: FULLY_BOOKED
        to: CLOSED
        trigger: "system: ops-run observes end_at <= now"
        actor: system
        preconditions: []
        side_effects: ["increments AvailabilityWindow.version by 1"]

  - entity: Booking
    initial_state: PENDING_CONFIRMATION
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PENDING_CONFIRMATION
        to: CONFIRMED
        trigger: "POST /respite/bookings/{id}/confirm; emergency dispatch creates bookings directly in CONFIRMED"
        actor: "Provider | system"
        preconditions: ["Acting provider owns the booking (provider_id == X-User-ID)"]
        side_effects:
          - "provisional_amount_cents = round_half_up(committed_minutes x program.standard_rate_cents_per_hour / 60)"
          - "increments Booking.version by 1"
      - from: PENDING_CONFIRMATION
        to: CANCELLED
        trigger: "POST /respite/bookings/{id}/cancel or system suspension cascade or voucher expiry ops-run"
        actor: "Caregiver | Provider | Coordinator | system"
        preconditions: []
        side_effects:
          - "Voucher committed_hours -= committed_minutes/60; if voucher COMMITTED and no non-terminal booking remains -> ISSUED"
          - "AvailabilityWindow overlap count drops; FULLY_BOOKED -> OPEN if below capacity"
          - "cancel_reason = reason"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /respite/bookings/{id}/cancel or system suspension cascade or voucher expiry ops-run"
        actor: "Caregiver | Provider | Coordinator | system"
        preconditions: []
        side_effects:
          - "Same voucher/window release effects as PENDING_CONFIRMATION -> CANCELLED"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: IN_SERVICE
        trigger: "POST /respite/bookings/{id}/check-in"
        actor: Provider
        preconditions:
          - "booking.status == CONFIRMED"
          - "now >= start_at - 15 minutes AND now <= end_at"
          - "No OPEN VisitRecord exists for this booking"
        side_effects: ["VisitRecord created in OPEN with check_in_at = now", "increments Booking.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system: ops-run observes start_at + program.no_show_grace_minutes < now and no VisitRecord exists"
        actor: system
        preconditions: []
        side_effects:
          - "Same voucher/window release effects as cancellation"
          - "increments Booking.version by 1"
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "system: visit verification cascade (VERIFY)"
        actor: system
        preconditions: []
        side_effects: ["increments Booking.version by 1"]

  - entity: VisitRecord
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /respite/visit-records/{id}/check-out or system auto-close ops-run"
        actor: "Provider | system"
        preconditions: ["Manual: acting provider owns the parent booking", "Auto: booking end_at + auto_close_grace_hours < now; check_out_at set to booking end_at, auto_closed = true"]
        side_effects:
          - "verified_minutes = 15 x round_half_up((check_out_at - check_in_at) minutes / 15)"
          - "payable_minutes = min(verified_minutes, floor(committed_minutes x program.max_overage_pct))"
          - "increments VisitRecord.version by 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /respite/visit-records/{id}/verification-decisions {decision: VERIFY}"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Claim created in DRAFT: provisional_amount_cents from booking, amount_cents per claim_amount_final"
          - "Voucher COMMITTED -> REDEEMED with allocation bucket updates"
          - "Booking IN_SERVICE -> COMPLETED"
          - "Budget: RELEASE voucher provisional encumbrance, ENCUMBER claim amount_cents"
          - "increments VisitRecord.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /respite/visit-records/{id}/verification-decisions {decision: REJECT}"
        actor: Coordinator
        preconditions: []
        side_effects: ["rejection_reason = reason", "increments VisitRecord.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /respite/visit-records/{id}/resubmit"
        actor: Provider
        preconditions: ["Acting provider owns the parent booking"]
        side_effects:
          - "check_in_at / check_out_at replaced when supplied; verified_minutes and payable_minutes recomputed"
          - "rejection_reason = null"
          - "increments VisitRecord.version by 1"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED_FINAL]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /respite/claims/{id}/submit"
        actor: Provider
        preconditions: ["Acting provider owns the claim (provider_id == X-User-ID)"]
        side_effects: ["increments Claim.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /respite/claims/{id}/adjudicate {decision: APPROVE}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["decided_at = now", "increments Claim.version by 1"]
      - from: APPEALED
        to: APPROVED
        trigger: "POST /respite/claims/{id}/adjudicate {decision: APPROVE}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["decided_at = now", "Budget: ENCUMBER claim amount_cents (re-encumber after the denial-time RELEASE)", "increments Claim.version by 1", "increments Program.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /respite/claims/{id}/adjudicate {decision: DENY}"
        actor: FunderAdmin
        preconditions: []
        side_effects:
          - "denial_reason = reason; decided_at = now"
          - "Budget: RELEASE claim amount_cents encumbrance"
          - "increments Claim.version by 1"
      - from: APPEALED
        to: DENIED_FINAL
        trigger: "POST /respite/claims/{id}/adjudicate {decision: DENY}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["denial_reason = reason; decided_at = now", "Budget: RELEASE claim amount_cents encumbrance", "increments Claim.version by 1"]
      - from: DENIED
        to: APPEALED
        trigger: "POST /respite/claims/{id}/appeal"
        actor: Provider
        preconditions:
          - "Acting provider owns the claim"
          - "now <= decided_at + program.appeal_window_days"
        side_effects: ["increments Claim.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /respite/claims/{id}/pay"
        actor: FunderAdmin
        preconditions: []
        side_effects:
          - "Budget: SETTLE amount_cents (encumbered_cents -= amount_cents; settled_cents += amount_cents)"
          - "paid_at = now"
          - "Voucher REDEEMED -> SETTLED when no non-terminal claim and no non-terminal booking remains for the voucher"
          - "increments Claim.version by 1"

  - entity: EmergencyRequest
    initial_state: OPEN
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /respite/emergency-requests/{id}/triage"
        actor: Coordinator
        preconditions: ["program.emergency_hours_used + approved_hours <= program.emergency_reserve_hours"]
        side_effects: ["approved_hours set", "increments EmergencyRequest.version by 1"]
      - from: TRIAGED
        to: DISPATCHED
        trigger: "POST /respite/emergency-requests/{id}/dispatch"
        actor: Coordinator
        preconditions: ["Emergency provider selector pool non-empty (see calculations.emergency_dispatch_selector)"]
        side_effects:
          - "Provider selected per emergency_dispatch_selector; selected_provider_id set"
          - "Emergency Voucher created (ISSUED, allocation_id null, is_emergency true, authorized_hours = approved_hours, expires_at = needed_end_at)"
          - "Budget: ENCUMBER approved_hours x standard_rate_cents_per_hour x emergency_multiplier / 1 hour (provisional)"
          - "Booking created directly in CONFIRMED: is_emergency true, window_id null, start/end = needed interval"
          - "Voucher ISSUED -> COMMITTED (committed_hours = approved_hours)"
          - "program.emergency_hours_used += approved_hours"
          - "dispatched_booking_id set"
          - "increments EmergencyRequest.version by 1"
      - from: DISPATCHED
        to: FULFILLED
        trigger: "system: the dispatched booking reaches COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["increments EmergencyRequest.version by 1"]
      - from: OPEN
        to: EXPIRED
        trigger: "system: ops-run observes needed_start_at <= now"
        actor: system
        preconditions: []
        side_effects: ["increments EmergencyRequest.version by 1"]
      - from: TRIAGED
        to: EXPIRED
        trigger: "system: ops-run observes needed_start_at <= now"
        actor: system
        preconditions: []
        side_effects: ["increments EmergencyRequest.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /respite/emergency-requests/{id}/cancel"
        actor: "Caregiver | Coordinator"
        preconditions: ["Caregiver actor must own the request"]
        side_effects: ["increments EmergencyRequest.version by 1"]
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /respite/emergency-requests/{id}/cancel"
        actor: "Caregiver | Coordinator"
        preconditions: ["Caregiver actor must own the request"]
        side_effects: ["increments EmergencyRequest.version by 1"]

  - entity: ReportSnapshot
    initial_state: GENERATED
    terminal_states: []
    transitions:
      - from: GENERATED
        to: FINALIZED
        trigger: "POST /respite/report-snapshots/{id}/transitions {target_status: FINALIZED}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments ReportSnapshot.version by 1"]
      - from: FINALIZED
        to: SUBMITTED_TO_FUNDER
        trigger: "POST /respite/report-snapshots/{id}/transitions {target_status: SUBMITTED_TO_FUNDER}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments ReportSnapshot.version by 1"]
      - from: SUBMITTED_TO_FUNDER
        to: UNDER_AMENDMENT
        trigger: "POST /respite/report-snapshots/{id}/transitions {target_status: UNDER_AMENDMENT}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments ReportSnapshot.version by 1"]
      - from: UNDER_AMENDMENT
        to: FINALIZED
        trigger: "POST /respite/report-snapshots/{id}/transitions {target_status: FINALIZED}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments ReportSnapshot.version by 1"]
      - from: FINALIZED
        to: UNDER_AMENDMENT
        trigger: "POST /respite/report-snapshots/{id}/transitions {target_status: UNDER_AMENDMENT}"
        actor: FunderAdmin
        preconditions: []
        side_effects: ["increments ReportSnapshot.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; serially observable only)
# =============================================================================
concurrency_rules:
  - rule_id: program-budget-adjust-stale
    parent_entity: Program
    write_endpoint: "POST /respite/programs/{id}/budget-adjustments"
    occ_field: expected_program_version
    description: |
      Creating a budget adjustment against a Program whose version has advanced
      since the client last observed it is rejected. The client's view of
      total/unencumbered budget is stale once any other writer (adjustment,
      voucher encumbrance cascade, settlement) has mutated the program.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-grant-adjust-stale
    parent_entity: Allocation
    write_endpoint: "POST /respite/allocations/{id}/grant-adjustments"
    occ_field: expected_allocation_version
    description: |
      Creating a grant adjustment against an Allocation whose version has
      advanced since the client last observed it is rejected. The client's view
      of granted_hours is stale once a voucher issue/redeem/revoke cascade or a
      prior adjustment has mutated the allocation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: verified_visit_minutes
    trigger: "VisitRecord check-out (manual or ops-run auto-close)"
    algorithm: chronological
    formula: |
      elapsed_minutes = (check_out_at - check_in_at) in whole minutes
      verified_minutes = 15 * round_half_up(elapsed_minutes / 15)
      payable_minutes = min(verified_minutes, floor(booking.committed_minutes * program.max_overage_pct))
    input_set: "The single VisitRecord being checked out plus its parent Booking"
    constants:
      QUARTER_HOUR_MINUTES: 15
    precision: "whole minutes; round_half_up to the nearest 15-minute unit"
    variants: []

  - name: claim_amount_final
    trigger: "VisitRecord VERIFY decision (claim DRAFT creation)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (execute top to bottom):
      (1) base_minutes = visit.payable_minutes
      (2) day_mult = program.weekend_multiplier if check_in_at is Sat/Sun (UTC),
          else program.evening_multiplier if hour(check_in_at UTC) >= program.evening_start_hour,
          else 1.0  (multipliers NEVER stack with each other; weekend wins over evening)
      (3) cred_mult = program.credential_premium_multiplier if provider.credential_level == ENHANCED else 1.0
      (4) emerg_mult = program.emergency_multiplier if booking.is_emergency else 1.0
      (5) amount_cents = round_half_up(base_minutes * program.standard_rate_cents_per_hour
                                       * day_mult * cred_mult * emerg_mult / 60)
      Rounding order is pinned: each claim is rounded individually at creation;
      downstream aggregates (ReportSnapshot.total_paid_amount_cents) sum the
      rounded integer amounts — never re-round a sum of unrounded values.
    input_set: "The verified VisitRecord, its Booking, the billing Provider, and the Program rate card"
    constants: {}
    precision: "integer cents; round_half_up once per claim at creation"
    variants:
      - name: provisional
        when: "Booking confirmation time (claim_amount_provisional) — no day/credential/emergency multipliers applied"
        difference: "provisional uses committed_minutes x standard rate only; final applies multipliers and payable-minute capping, so identical service yields different amounts"

  - name: claim_amount_provisional
    trigger: "Booking CONFIRMED transition"
    algorithm: forward_looking
    formula: |
      provisional_amount_cents = round_half_up(booking.committed_minutes * program.standard_rate_cents_per_hour / 60)
    input_set: "The Booking being confirmed and the Program rate card"
    constants: {}
    precision: "integer cents; round_half_up"
    variants:
      - name: final
        when: "Claim adjudication (claim_amount_final)"
        difference: "final applies day/credential/emergency multipliers and payable-minute caps; provisional ignores them, so identical service yields different amounts"

  - name: allocation_availability
    trigger: "Voucher creation (POST /respite/vouchers)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved top-down):
      (1) Treat every voucher of the allocation with expires_at <= now and
          status in {ISSUED, COMMITTED} as already-forfeited for this computation
          (their hours count as unavailable regardless of stored status).
      (2) available = allocation.available_hours (derived field maintained by cascades)
      (3) quarter_load = sum over the caregiver's allocations sharing the same
          fiscal quarter of (reserved_hours + consumed_hours)
      (4) annual_load = same over all allocations in the fiscal year
      (5) max_issuable = min(available,
                             program.quarterly_cap_hours - quarter_load,
                             program.annual_cap_hours - annual_load)
      (6) Reject when authorized_hours > max_issuable:
          authorized > available                      -> ERR_INSUFFICIENT_HOURS
          else quarter cap binding                    -> ERR_QUARTERLY_CAP_EXCEEDED
          else annual cap binding                     -> ERR_ANNUAL_CAP_EXCEEDED
      (7) Provisional encumbrance check:
          authorized_hours * standard_rate_cents_per_hour > program.unencumbered_cents
          -> ERR_BUDGET_EXCEEDED
    input_set: "The target Allocation, all Vouchers of that allocation, all Allocations of the caregiver, the Program"
    constants: {}
    precision: "hours at 2dp"
    variants: []

  - name: provider_quality_score
    trigger: "SatisfactionSurvey creation"
    algorithm: weighted_scoring
    formula: |
      Let surveys = all SatisfactionSurvey rows with provider_id = this provider,
      days_ago(s) = whole days between s.created_at and now (logical clock).
      simple   = round_half_up(avg(rating), 2dp)                       (null when no surveys)
      weighted = round_half_up(sum(w_s * rating_s) / sum(w_s), 2dp)
                 where w_s = 0.5 ** (days_ago(s) / 30)                 (null when no surveys)
      Both fields recompute immediately on every new survey.
    input_set: "All SatisfactionSurvey rows of the provider (any booking status)"
    constants:
      HALF_LIFE_DAYS: 30
    precision: "2 decimal places, round_half_up"
    variants:
      - name: simple
        when: "Displayed average (quality_score_simple)"
        difference: "unweighted mean; weighted decays old ratings by half-life, so identical rating sets with different ages yield different scores"

  - name: utilization_reporting
    trigger: "ReportSnapshot generation (ops-run)"
    algorithm: aggregation
    formula: |
      projected_pct = round_half_up(100 * (consumed + reserved) / granted, 2dp)
        over all allocations of the program (any status); 0.00 when granted == 0
      settled_pct = round_half_up(100 * program.settled_cents / program.total_budget_cents, 2dp)
      total_paid_amount_cents = sum of amount_cents over PAID claims (integer sum of
        per-claim rounded amounts — rounding happens per claim, never on the sum)
    input_set: "All Allocations of the program; all PAID Claims whose voucher belongs to the program"
    constants: {}
    precision: "percentages 2dp round_half_up; amounts integer cents"
    variants:
      - name: projected
        when: "Forward-looking utilization (includes reserved-not-yet-consumed hours)"
        difference: "projected counts reserved hours; settled counts only paid money — identical system state yields two different utilization figures"

  - name: quarterly_rollover
    trigger: "Ops-run with run_type = QUARTER_ROLLOVER"
    algorithm: waterfall_allocation
    formula: |
      For each Allocation with status OPEN or FROZEN and period_end <= now,
      processed in order: caregiver need_score of latest approved application DESC,
      then caregiver.created_at ASC (never id):
        (1) old allocation -> CLOSED (buckets freeze as-is)
        (2) carryover = min(round_half_up(program.quarterly_cap_hours * program.carryover_cap_pct, 2dp),
                            old.available_hours)
        (3) create next-quarter Allocation for the same caregiver:
            granted_hours = program.quarterly_cap_hours + carryover
            available_hours = granted_hours; all other buckets 0; status OPEN
      Rollover is skipped for caregivers in DISENROLLED status (no new allocation).
    input_set: "Allocations with period_end <= now and status OPEN|FROZEN; their caregivers' latest APPROVED applications"
    constants: {}
    precision: "hours 2dp, round_half_up on the carryover cap product"
    variants: []

  - name: emergency_dispatch_selector
    trigger: "POST /respite/emergency-requests/{id}/dispatch"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate pool):
        provider.credential_status == ACTIVE
        AND provider.accepts_emergency == true
        AND no booking of the provider in CONFIRMED or IN_SERVICE status
            overlaps [needed_start_at, needed_end_at)  (half-open overlap)
      Ranking expression: quality_score_weighted DESC, NULLS LAST
      Tie-break: provider.created_at ASC (never id)
      Fallback when pool empty: reject with ERR_NO_PROVIDER_AVAILABLE
    input_set: "All Providers of the program scope"
    constants: {}
    precision: "n/a"
    variants: []

  - name: auto_match_selector
    trigger: "POST /respite/bookings with match_mode = AUTO"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter:
        provider.credential_status == ACTIVE
        AND exists an AvailabilityWindow w of the provider with w.status in {OPEN, FULLY_BOOKED},
            w.start_at <= booking.start_at, booking.end_at <= w.end_at,
            and overlap_count(w, [start_at, end_at)) < w.capacity
      Ranking expression: quality_score_weighted DESC, NULLS LAST
      Tie-break: provider.created_at ASC (never id)
      Fallback when pool empty: reject with ERR_NO_PROVIDER_AVAILABLE
      The selected window is the earliest-start_at eligible window of the chosen provider
      (tie-break window.created_at ASC).
    input_set: "All Providers and their AvailabilityWindows"
    constants: {}
    precision: "n/a"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role appears in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed actor owns the target resource (X-User-ID equals the resource's caregiver_id / provider_id as applicable)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all entity-backed role endpoints" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, types correct, enum members valid, hour quantities are multiples of 0.25 within 1.00..80.00 where applicable", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path template ids resolve left-to-right; body foreign-key ids resolve", error_id: ERR_PROGRAM_NOT_FOUND, http_status: 404, applies_to: "all — the returned id is entity-specific per path segment: ERR_PROGRAM_NOT_FOUND | ERR_CAREGIVER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_EMERGENCY_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND" }
  - { priority: 6, category: state, check: "Program posture gates: caregiver/provider creation and application review require ENROLLMENT_OPEN; voucher creation, bookings, visits, claims actions require posture != PROGRAM_SUSPENDED and != CLOSED", error_id: ERR_POSTURE_GATE, http_status: 409, applies_to: "mutating endpoints" }
  - { priority: 7, category: state, check: "Target resource state machine permits the transition from its current state (generic invalid-from rejection)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Caregiver status == ACTIVE for voucher creation, booking creation, emergency request creation; REDETERMINATION_PENDING yields ERR_REDETERMINATION_OVERDUE instead", error_id: ERR_CAREGIVER_NOT_ACTIVE, http_status: 422, applies_to: "POST /respite/vouchers, POST /respite/bookings, POST /respite/emergency-requests" }
  - { priority: 9, category: business_safety, check: "Provider credential_status == ACTIVE for window creation, booking creation, confirm, check-in", error_id: ERR_PROVIDER_NOT_ACTIVE, http_status: 422, applies_to: "POST /respite/providers/{id}/availability-windows, POST /respite/bookings, POST /respite/bookings/{id}/confirm, POST /respite/bookings/{id}/check-in" }
  - { priority: 10, category: business_safety, check: "Caregiver in REDETERMINATION_PENDING cannot receive new vouchers", error_id: ERR_REDETERMINATION_OVERDUE, http_status: 422, applies_to: "POST /respite/vouchers" }
  - { priority: 11, category: business_referential, check: "voucher create: allocation.caregiver_id == caregiver_id and allocation.status == OPEN", error_id: ERR_ALLOCATION_CAREGIVER_MISMATCH, http_status: 422, applies_to: "POST /respite/vouchers" }
  - { priority: 12, category: business_constraint, check: "Caregiver email unique across caregivers", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /respite/caregivers" }
  - { priority: 13, category: business_constraint, check: "AvailabilityWindow half-open interval exclusion: a provider's windows must not overlap ([start,end); touching endpoints allowed)", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /respite/providers/{id}/availability-windows" }
  - { priority: 14, category: business_constraint, check: "Window capacity: overlap_count of non-cancelled bookings at the new booking's interval must be < window.capacity", error_id: ERR_WINDOW_CAPACITY_FULL, http_status: 409, applies_to: "POST /respite/bookings" }
  - { priority: 15, category: business_constraint, check: "Caregiver double-booking buffer: a caregiver's non-cancelled bookings must leave a 30-minute gap; new [start-30m, end+30m) must not intersect any existing booking interval", error_id: ERR_CAREGIVER_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /respite/bookings" }
  - { priority: 16, category: business_constraint, check: "One satisfaction survey per booking", error_id: ERR_DUPLICATE_SURVEY, http_status: 409, applies_to: "POST /respite/bookings/{id}/satisfaction-surveys" }
  - { priority: 17, category: business_temporal, check: "Booking end_at must be <= voucher.expires_at", error_id: ERR_BOOKING_BEYOND_VOUCHER_EXPIRY, http_status: 422, applies_to: "POST /respite/bookings" }
  - { priority: 18, category: business_temporal, check: "EVV check-in allowed only within [start_at - 15 minutes, end_at]", error_id: ERR_EVV_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST /respite/bookings/{id}/check-in" }
  - { priority: 19, category: business_temporal, check: "Claim appeal only within decided_at + program.appeal_window_days", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: "POST /respite/claims/{id}/appeal" }
  - { priority: 20, category: business_temporal, check: "Emergency request needed_start_at must be > now at creation and triage", error_id: ERR_EMERGENCY_WINDOW_PAST, http_status: 422, applies_to: "POST /respite/emergency-requests, POST /respite/emergency-requests/{id}/triage" }
  - { priority: 21, category: business_fiscal, check: "Voucher authorized_hours <= allocation.available_hours", error_id: ERR_INSUFFICIENT_HOURS, http_status: 422, applies_to: "POST /respite/vouchers" }
  - { priority: 22, category: business_fiscal, check: "Quarterly cap: reserved + consumed (same quarter) + authorized <= program.quarterly_cap_hours", error_id: ERR_QUARTERLY_CAP_EXCEEDED, http_status: 422, applies_to: "POST /respite/vouchers" }
  - { priority: 23, category: business_fiscal, check: "Annual cap: reserved + consumed (fiscal year) + authorized <= program.annual_cap_hours", error_id: ERR_ANNUAL_CAP_EXCEEDED, http_status: 422, applies_to: "POST /respite/vouchers" }
  - { priority: 24, category: business_fiscal, check: "Provisional encumbrance fits unencumbered budget (voucher issue: authorized x standard rate; emergency dispatch: approved_hours x standard rate x emergency_multiplier)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /respite/vouchers, POST /respite/emergency-requests/{id}/dispatch" }
  - { priority: 25, category: business_fiscal, check: "Emergency triage: emergency_hours_used + approved_hours <= emergency_reserve_hours", error_id: ERR_EMERGENCY_RESERVE_EXHAUSTED, http_status: 422, applies_to: "POST /respite/emergency-requests/{id}/triage" }
  - { priority: 26, category: business_fiscal, check: "Selector pool non-empty (emergency dispatch; booking match_mode AUTO)", error_id: ERR_NO_PROVIDER_AVAILABLE, http_status: 422, applies_to: "POST /respite/emergency-requests/{id}/dispatch, POST /respite/bookings (match_mode AUTO)" }
  - { priority: 27, category: state, check: "Voucher must be ISSUED with sufficient unconsumed hours for a new booking", error_id: ERR_VOUCHER_NOT_ISSUABLE, http_status: 422, applies_to: "POST /respite/bookings" }
  - { priority: 28, category: state, check: "Booking must be CONFIRMED for check-in", error_id: ERR_BOOKING_NOT_CONFIRMED, http_status: 409, applies_to: "POST /respite/bookings/{id}/check-in" }
  - { priority: 29, category: business_constraint, check: "No OPEN VisitRecord may already exist for the booking", error_id: ERR_EVV_ALREADY_OPEN, http_status: 409, applies_to: "POST /respite/bookings/{id}/check-in" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program & admin ---
  - { method: POST, path: "/respite/programs", description: "Create a respite program with rate card, caps, and reserve", roles: [FunderAdmin], code: 201, input: [name, fiscal_year_start, total_budget_cents, quarterly_cap_hours, annual_cap_hours, standard_rate_cents_per_hour, emergency_reserve_hours, "weekend_multiplier?", "evening_multiplier?", "evening_start_hour?", "emergency_multiplier?", "credential_premium_multiplier?", "max_overage_pct?", "voucher_expiry_days?", "carryover_cap_pct?", "no_show_grace_minutes?", "auto_close_grace_hours?", "appeal_window_days?"], output: Program, side_effects: ["posture = ENROLLMENT_OPEN", "ops_run_index = 0"] }
  - { method: GET, path: "/respite/programs/{id}", description: "Read program incl. computed budget fields", roles: [FunderAdmin, Coordinator], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/respite/programs/{id}/posture", description: "Program posture transition per Program state machine", roles: [FunderAdmin], code: 200, input: [target_posture, "reason?"], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/respite/programs/{id}/budget-adjustments", description: "Adjust total budget (delta_cents may be negative but total must stay >= encumbered + settled); OCC-guarded", roles: [FunderAdmin], code: 201, input: [delta_cents, reason, expected_program_version], output: Program, side_effects: ["total_budget_cents += delta_cents", "BudgetLedgerEntry ADJUSTMENT created", "increments Program.version by 1"] }
  - { method: GET, path: "/respite/programs/{id}/budget-ledger", description: "Append-only budget ledger entries (newest first)", roles: [FunderAdmin, Coordinator], code: 200, input: ["entry_type?", "limit?", "offset?"], output: "BudgetLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/respite/programs/{id}/report-snapshots", description: "List report snapshots of the program", roles: [FunderAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "ReportSnapshot[]", side_effects: [] }
  - { method: GET, path: "/respite/programs/{id}/allocations", description: "List allocations of the program", roles: [Coordinator, FunderAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/respite/programs/{id}/ops-runs", description: "Advance the system epoch: expire vouchers, mark no-shows, auto-close stale visits, lapse credentials, flag redeterminations, close past windows, generate a ReportSnapshot; QUARTER_ROLLOVER additionally closes ended allocations and creates next-quarter grants", roles: [Coordinator], code: 201, input: [run_type], output: ReportSnapshot, side_effects: ["voucher expiry cascades", "no-show cascades", "visit auto-close", "provider lapse", "redetermination flags", "window close", "ReportSnapshot created in GENERATED", "increments Program.ops_run_index by 1", "increments Program.version by 1"] }

  # --- Caregiver ---
  - { method: POST, path: "/respite/caregivers", description: "Enroll a caregiver (self-service or coordinator-assisted)", roles: [Anonymous, Coordinator], code: 201, input: [full_name, email, care_recipient_name, care_recipient_condition], output: Caregiver, side_effects: ["status = ENROLLED"] }
  - { method: GET, path: "/respite/caregivers/{id}", description: "Read a caregiver", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: [], output: Caregiver, side_effects: [] }
  - { method: POST, path: "/respite/caregivers/{id}/status-transitions", description: "SUSPEND / reinstate (ACTIVE) / DISENROLL per Caregiver state machine incl. suspension cascade", roles: [Coordinator], code: 200, input: [target_status, "reason?"], output: Caregiver, side_effects: ["allocation freeze/unfreeze cascade", "voucher revocation cascade", "booking cancellation cascade", "window reopen cascade", "increments Caregiver.version by 1"] }
  - { method: GET, path: "/respite/caregivers/{id}/eligibility-applications", description: "List a caregiver's eligibility applications", roles: [Caregiver, Coordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "EligibilityApplication[]", side_effects: [] }
  - { method: GET, path: "/respite/caregivers/{id}/allocations", description: "List a caregiver's allocations", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }

  # --- Eligibility ---
  - { method: POST, path: "/respite/caregivers/{id}/eligibility-applications", description: "Submit an eligibility application", roles: [Caregiver, Coordinator], code: 201, input: [need_score, "notes?"], output: EligibilityApplication, side_effects: ["status = SUBMITTED"] }
  - { method: GET, path: "/respite/eligibility-applications/{id}", description: "Read an application", roles: [Caregiver, Coordinator], code: 200, input: [], output: EligibilityApplication, side_effects: [] }
  - { method: POST, path: "/respite/eligibility-applications/{id}/review-decisions", description: "Coordinator decision: REQUEST_INFO | APPROVE | DENY | WITHDRAW per EligibilityApplication machine", roles: [Coordinator], code: 200, input: [action, "note?"], output: EligibilityApplication, side_effects: ["caregiver activation + allocation auto-create on APPROVE", "increments EligibilityApplication.version by 1"] }
  - { method: POST, path: "/respite/eligibility-applications/{id}/resubmit", description: "Resubmit after info request (cycle)", roles: [Caregiver], code: 200, input: ["need_score?", "notes?"], output: EligibilityApplication, side_effects: ["revision_count += 1", "increments EligibilityApplication.version by 1"] }
  - { method: POST, path: "/respite/eligibility-applications/{id}/appeal", description: "Appeal a DENIED application within 30 days", roles: [Caregiver], code: 200, input: ["reason?"], output: EligibilityApplication, side_effects: ["increments EligibilityApplication.version by 1"] }

  # --- Allocation ---
  - { method: GET, path: "/respite/allocations/{id}", description: "Read an allocation with computed buckets", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/respite/allocations", description: "List allocations filtered by caregiver/program/status", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: ["caregiver_id?", "program_id?", "status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/respite/allocations/{id}/grant-adjustments", description: "Adjust granted_hours (delta may be negative but granted must stay >= reserved + consumed + expired + revoked); OCC-guarded", roles: [Coordinator], code: 201, input: [delta_hours, reason, expected_allocation_version], output: Allocation, side_effects: ["granted_hours += delta_hours; available_hours += delta_hours", "increments Allocation.version by 1"] }

  # --- Voucher ---
  - { method: POST, path: "/respite/vouchers", description: "Issue a voucher against an OPEN allocation (caps + budget checked per allocation_availability)", roles: [Caregiver, Coordinator], code: 201, input: [allocation_id, caregiver_id, authorized_hours], output: Voucher, side_effects: ["allocation available -= authorized, reserved += authorized", "Budget ENCUMBER authorized x standard_rate provisional", "increments Allocation.version by 1", "increments Program.version by 1"] }
  - { method: GET, path: "/respite/vouchers/{id}", description: "Read a voucher", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: [], output: Voucher, side_effects: [] }
  - { method: GET, path: "/respite/vouchers", description: "List vouchers filtered by allocation/caregiver/program/status", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: ["allocation_id?", "caregiver_id?", "program_id?", "status?", "limit?", "offset?"], output: "Voucher[]", side_effects: [] }
  - { method: POST, path: "/respite/vouchers/{id}/revoke", description: "Revoke an ISSUED voucher (coordinator clawback)", roles: [Coordinator], code: 200, input: ["reason?"], output: Voucher, side_effects: ["allocation reserved -> revoked bucket move", "Budget RELEASE provisional", "increments Voucher.version by 1", "increments Allocation.version by 1", "increments Program.version by 1"] }

  # --- Provider ---
  - { method: POST, path: "/respite/providers", description: "Register a respite provider", roles: [Anonymous, Coordinator], code: 201, input: [name, credential_level, service_zip, "accepts_emergency?"], output: Provider, side_effects: ["credential_status = APPLIED"] }
  - { method: GET, path: "/respite/providers/{id}", description: "Read a provider incl. quality scores", roles: [Provider, Caregiver, Coordinator, FunderAdmin], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: POST, path: "/respite/providers/{id}/status-transitions", description: "Credential lifecycle: ACTIVE (activate/reinstate) | SUSPENDED | TERMINATED per Provider machine", roles: [Coordinator], code: 200, input: [target_status, "reason?"], output: Provider, side_effects: ["credential_expires_at set on activation", "increments Provider.version by 1"] }
  - { method: POST, path: "/respite/providers/{id}/availability-windows", description: "Publish an availability window (half-open, no provider overlap)", roles: [Provider], code: 201, input: [start_at, end_at, capacity], output: AvailabilityWindow, side_effects: ["status = OPEN"] }
  - { method: GET, path: "/respite/providers/{id}/availability-windows", description: "List a provider's windows", roles: [Provider, Caregiver, Coordinator, FunderAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "AvailabilityWindow[]", side_effects: [] }
  - { method: POST, path: "/respite/availability-windows/{id}/close", description: "Withdraw a window with no non-terminal bookings", roles: [Provider], code: 200, input: [], output: AvailabilityWindow, side_effects: ["increments AvailabilityWindow.version by 1"] }

  # --- Booking / scheduling ---
  - { method: POST, path: "/respite/bookings", description: "Request a booking: EXPLICIT mode pins provider_id+window_id; AUTO mode selects provider per auto_match_selector", roles: [Caregiver, Coordinator], code: 201, input: [voucher_id, caregiver_id, match_mode, "provider_id?", "window_id?", start_at, end_at], output: Booking, side_effects: ["voucher ISSUED -> COMMITTED, committed_hours += duration", "window overlap count increases; OPEN -> FULLY_BOOKED at capacity", "increments Voucher.version by 1", "increments AvailabilityWindow.version by 1"] }
  - { method: GET, path: "/respite/bookings/{id}", description: "Read a booking", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/respite/bookings", description: "List bookings filtered by voucher/provider/caregiver/window/emergency-request/status", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: ["voucher_id?", "provider_id?", "caregiver_id?", "window_id?", "emergency_request_id?", "status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: POST, path: "/respite/bookings/{id}/confirm", description: "Provider confirms a requested booking", roles: [Provider], code: 200, input: [], output: Booking, side_effects: ["provisional_amount_cents computed", "increments Booking.version by 1"] }
  - { method: POST, path: "/respite/bookings/{id}/cancel", description: "Cancel a non-terminal booking; releases voucher commitment and window capacity", roles: [Caregiver, Provider, Coordinator], code: 200, input: ["reason?"], output: Booking, side_effects: ["voucher commitment release (COMMITTED -> ISSUED when none remain)", "window reopen cascade", "increments Booking.version by 1", "increments Voucher.version by 1"] }
  - { method: GET, path: "/respite/bookings/{id}/visit-records", description: "List visit records of a booking (0-1 entries)", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: [], output: "VisitRecord[]", side_effects: [] }
  - { method: POST, path: "/respite/bookings/{id}/check-in", description: "EVV check-in; creates OPEN VisitRecord and moves booking to IN_SERVICE", roles: [Provider], code: 201, input: [check_in_location], output: VisitRecord, side_effects: ["Booking CONFIRMED -> IN_SERVICE", "increments Booking.version by 1"] }
  - { method: POST, path: "/respite/bookings/{id}/satisfaction-surveys", description: "Caregiver rates a COMPLETED booking (one per booking)", roles: [Caregiver], code: 201, input: [rating, would_rebook, "comments?"], output: SatisfactionSurvey, side_effects: ["provider quality_score_simple and quality_score_weighted recomputed", "increments Provider.version by 1"] }

  # --- EVV ---
  - { method: POST, path: "/respite/visit-records/{id}/check-out", description: "EVV check-out; computes verified/payable minutes", roles: [Provider], code: 200, input: ["tasks_completed?", "notes?"], output: VisitRecord, side_effects: ["verified_minutes and payable_minutes computed", "VisitRecord OPEN -> SUBMITTED", "increments VisitRecord.version by 1"] }
  - { method: GET, path: "/respite/visit-records/{id}", description: "Read a visit record", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: [], output: VisitRecord, side_effects: [] }
  - { method: POST, path: "/respite/visit-records/{id}/verification-decisions", description: "Coordinator verifies or rejects a submitted visit; VERIFY fires the claim/voucher/booking/budget cascade", roles: [Coordinator], code: 200, input: [decision, "reason?"], output: VisitRecord, side_effects: ["VERIFY: claim DRAFT created, voucher REDEEMED, booking COMPLETED, budget RELEASE+ENCUMBER", "REJECT: rejection_reason set", "increments VisitRecord.version by 1"] }
  - { method: POST, path: "/respite/visit-records/{id}/resubmit", description: "Provider resubmits a REJECTED visit with corrected times", roles: [Provider], code: 200, input: ["check_in_at?", "check_out_at?", "notes?"], output: VisitRecord, side_effects: ["verified_minutes and payable_minutes recomputed", "REJECTED -> SUBMITTED", "increments VisitRecord.version by 1"] }

  # --- Claims ---
  - { method: GET, path: "/respite/claims/{id}", description: "Read a claim", roles: [Provider, Coordinator, FunderAdmin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/respite/claims", description: "List claims filtered by provider/voucher/visit/status", roles: [Provider, Coordinator, FunderAdmin], code: 200, input: ["provider_id?", "voucher_id?", "visit_record_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/respite/claims/{id}/submit", description: "Provider submits a DRAFT claim", roles: [Provider], code: 200, input: [], output: Claim, side_effects: ["increments Claim.version by 1"] }
  - { method: POST, path: "/respite/claims/{id}/adjudicate", description: "FunderAdmin approves or denies a SUBMITTED or APPEALED claim", roles: [FunderAdmin], code: 200, input: [decision, "reason?"], output: Claim, side_effects: ["DENY: budget RELEASE of claim encumbrance", "decided_at set", "increments Claim.version by 1", "increments Program.version by 1"] }
  - { method: POST, path: "/respite/claims/{id}/pay", description: "Pay an APPROVED claim; settles budget; may settle the voucher", roles: [FunderAdmin], code: 200, input: [], output: Claim, side_effects: ["Budget SETTLE amount_cents", "voucher REDEEMED -> SETTLED when applicable", "paid_at set", "increments Claim.version by 1", "increments Program.version by 1"] }
  - { method: POST, path: "/respite/claims/{id}/appeal", description: "Provider appeals a DENIED claim within the appeal window", roles: [Provider], code: 200, input: ["reason?"], output: Claim, side_effects: ["increments Claim.version by 1"] }

  # --- Emergency respite ---
  - { method: POST, path: "/respite/emergency-requests", description: "Caregiver requests emergency respite coverage", roles: [Caregiver, Coordinator], code: 201, input: [caregiver_id, needed_start_at, needed_end_at, reason], output: EmergencyRequest, side_effects: ["requested_hours computed"] }
  - { method: GET, path: "/respite/emergency-requests/{id}", description: "Read an emergency request", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: [], output: EmergencyRequest, side_effects: [] }
  - { method: GET, path: "/respite/emergency-requests", description: "List emergency requests filtered by caregiver/status/dispatch booking/selected provider", roles: [Caregiver, Coordinator, FunderAdmin], code: 200, input: ["caregiver_id?", "status?", "dispatched_booking_id?", "selected_provider_id?", "limit?", "offset?"], output: "EmergencyRequest[]", side_effects: [] }
  - { method: POST, path: "/respite/emergency-requests/{id}/triage", description: "Coordinator approves emergency hours against the reserve", roles: [Coordinator], code: 200, input: [approved_hours, "note?"], output: EmergencyRequest, side_effects: ["increments EmergencyRequest.version by 1"] }
  - { method: POST, path: "/respite/emergency-requests/{id}/dispatch", description: "Dispatch: selects provider, creates emergency voucher + CONFIRMED booking, debits reserve", roles: [Coordinator], code: 200, input: [], output: EmergencyRequest, side_effects: ["emergency_dispatch_selector runs", "emergency voucher created and COMMITTED", "booking created in CONFIRMED", "budget ENCUMBER emergency provisional", "emergency_hours_used += approved_hours", "increments EmergencyRequest.version by 1", "increments Program.version by 1"] }
  - { method: POST, path: "/respite/emergency-requests/{id}/cancel", description: "Cancel an OPEN or TRIAGED emergency request", roles: [Caregiver, Coordinator], code: 200, input: ["reason?"], output: EmergencyRequest, side_effects: ["increments EmergencyRequest.version by 1"] }

  # --- Satisfaction ---
  - { method: GET, path: "/respite/satisfaction-surveys/{id}", description: "Read a survey", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: [], output: SatisfactionSurvey, side_effects: [] }
  - { method: GET, path: "/respite/satisfaction-surveys", description: "List surveys filtered by booking/provider/caregiver", roles: [Caregiver, Provider, Coordinator, FunderAdmin], code: 200, input: ["booking_id?", "provider_id?", "caregiver_id?", "limit?", "offset?"], output: "SatisfactionSurvey[]", side_effects: [] }

  # --- Funder reporting ---
  - { method: GET, path: "/respite/report-snapshots/{id}", description: "Read a report snapshot", roles: [FunderAdmin], code: 200, input: [], output: ReportSnapshot, side_effects: [] }
  - { method: POST, path: "/respite/report-snapshots/{id}/transitions", description: "FINALIZED | SUBMITTED_TO_FUNDER | UNDER_AMENDMENT per ReportSnapshot machine", roles: [FunderAdmin], code: 200, input: [target_status, "note?"], output: ReportSnapshot, side_effects: ["increments ReportSnapshot.version by 1"] }

  # --- Test-driving ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z; before any set call the logical clock reads that default and never falls back to wall-clock time", roles: [FunderAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed actor acts on a resource owned by another caregiver/provider" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, invalid enum member, or hour quantity not a multiple of 0.25 in 1.00..80.00" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Referenced program id does not exist" }
  - { id: ERR_CAREGIVER_NOT_FOUND, http: 404, condition: "Referenced caregiver id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced eligibility application id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Referenced allocation id does not exist" }
  - { id: ERR_VOUCHER_NOT_FOUND, http: 404, condition: "Referenced voucher id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Referenced provider id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "Referenced availability window id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Referenced booking id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "Referenced visit record id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced claim id does not exist" }
  - { id: ERR_EMERGENCY_NOT_FOUND, http: 404, condition: "Referenced emergency request id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "Referenced report snapshot id does not exist" }
  - { id: ERR_POSTURE_GATE, http: 409, condition: "Program posture forbids the operation (enrollment paused, program suspended, or closed)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine rejects the transition from the resource's current state" }
  - { id: ERR_CAREGIVER_NOT_ACTIVE, http: 422, condition: "Caregiver not ACTIVE (ENROLLED/SUSPENDED/DISENROLLED) for voucher/booking/emergency creation" }
  - { id: ERR_REDETERMINATION_OVERDUE, http: 422, condition: "Caregiver in REDETERMINATION_PENDING attempts to receive a new voucher" }
  - { id: ERR_PROVIDER_NOT_ACTIVE, http: 422, condition: "Provider credential_status not ACTIVE for window/booking/confirm/check-in" }
  - { id: ERR_ALLOCATION_CAREGIVER_MISMATCH, http: 422, condition: "Voucher create: allocation does not belong to caregiver_id, or allocation not OPEN" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Caregiver email already registered" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New availability window overlaps an existing window of the same provider (half-open; touching allowed)" }
  - { id: ERR_WINDOW_CAPACITY_FULL, http: 409, condition: "Booking would raise window overlap count above capacity" }
  - { id: ERR_CAREGIVER_DOUBLE_BOOKED, http: 409, condition: "New booking violates the 30-minute buffer around the caregiver's existing bookings" }
  - { id: ERR_DUPLICATE_SURVEY, http: 409, condition: "A satisfaction survey already exists for the booking" }
  - { id: ERR_VOUCHER_NOT_ISSUABLE, http: 422, condition: "Voucher not in ISSUED status or lacks unconsumed hours for the booking" }
  - { id: ERR_BOOKING_BEYOND_VOUCHER_EXPIRY, http: 422, condition: "Booking end_at is after voucher.expires_at" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "Check-in attempted on a booking not in CONFIRMED status" }
  - { id: ERR_EVV_OUTSIDE_WINDOW, http: 422, condition: "Check-in outside [start_at - 15 minutes, end_at]" }
  - { id: ERR_EVV_ALREADY_OPEN, http: 409, condition: "An OPEN visit record already exists for the booking" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted after decided_at + appeal_window_days" }
  - { id: ERR_EMERGENCY_WINDOW_PAST, http: 422, condition: "Emergency needed_start_at is not in the future" }
  - { id: ERR_INSUFFICIENT_HOURS, http: 422, condition: "Voucher authorized_hours exceeds allocation.available_hours" }
  - { id: ERR_QUARTERLY_CAP_EXCEEDED, http: 422, condition: "Voucher would push the caregiver's quarter reserved+consumed above quarterly_cap_hours" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 422, condition: "Voucher would push the caregiver's fiscal-year reserved+consumed above annual_cap_hours" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Provisional encumbrance at voucher issue or emergency dispatch exceeds unencumbered program budget" }
  - { id: ERR_EMERGENCY_RESERVE_EXHAUSTED, http: 422, condition: "Triage approved_hours exceeds remaining emergency reserve" }
  - { id: ERR_NO_PROVIDER_AVAILABLE, http: 422, condition: "Selector pool empty (auto-match or emergency dispatch)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller self-registering as caregiver or provider"
    identity: opaque
    exclusive_operations: ["POST /respite/caregivers", "POST /respite/providers"]
    shared_operations: []
  - name: Caregiver
    description: "Enrolled family caregiver; owns applications, vouchers, bookings, emergency requests, and surveys"
    identity: "entity_backed:Caregiver"
    exclusive_operations:
      - "POST /respite/caregivers/{id}/eligibility-applications (own)"
      - "POST /respite/eligibility-applications/{id}/resubmit (own)"
      - "POST /respite/eligibility-applications/{id}/appeal (own)"
      - "POST /respite/bookings/{id}/satisfaction-surveys (own booking)"
    shared_operations:
      - "POST /respite/vouchers (own allocation)"
      - "POST /respite/bookings (own)"
      - "POST /respite/bookings/{id}/cancel (own)"
      - "POST /respite/emergency-requests (own)"
      - "POST /respite/emergency-requests/{id}/cancel (own)"
      - "GET on own caregivers/allocations/vouchers/bookings/visits/emergencies/surveys"
  - name: Provider
    description: "Respite service provider; owns availability windows, confirms bookings, performs EVV, bills claims, appeals denials"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /respite/providers/{id}/availability-windows (own)"
      - "POST /respite/availability-windows/{id}/close (own)"
      - "POST /respite/bookings/{id}/confirm (own)"
      - "POST /respite/bookings/{id}/check-in (own)"
      - "POST /respite/visit-records/{id}/check-out (own)"
      - "POST /respite/visit-records/{id}/resubmit (own)"
      - "POST /respite/claims/{id}/submit (own)"
      - "POST /respite/claims/{id}/appeal (own)"
    shared_operations:
      - "POST /respite/bookings/{id}/cancel (own)"
      - "GET on own providers/bookings/visits/claims/surveys/windows"
  - name: Coordinator
    description: "Program operations staff; reviews eligibility, manages lifecycle states, verifies EVV, triages and dispatches emergency requests, runs ops"
    identity: opaque
    exclusive_operations:
      - "POST /respite/eligibility-applications/{id}/review-decisions"
      - "POST /respite/caregivers/{id}/status-transitions"
      - "POST /respite/providers/{id}/status-transitions"
      - "POST /respite/allocations/{id}/grant-adjustments"
      - "POST /respite/vouchers/{id}/revoke"
      - "POST /respite/visit-records/{id}/verification-decisions"
      - "POST /respite/emergency-requests/{id}/triage"
      - "POST /respite/emergency-requests/{id}/dispatch"
      - "POST /respite/programs/{id}/ops-runs"
    shared_operations: ["GET on all resources", "POST /respite/caregivers", "POST /respite/providers", "POST /respite/vouchers", "POST /respite/bookings", "POST /respite/bookings/{id}/cancel", "POST /respite/emergency-requests", "POST /respite/emergency-requests/{id}/cancel"]
  - name: FunderAdmin
    description: "Funder administrator; owns program configuration, posture, budget, claim adjudication/payment, reporting, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /respite/programs"
      - "POST /respite/programs/{id}/posture"
      - "POST /respite/programs/{id}/budget-adjustments"
      - "POST /respite/claims/{id}/adjudicate"
      - "POST /respite/claims/{id}/pay"
      - "POST /respite/report-snapshots/{id}/transitions"
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET on programs/allocations/vouchers/bookings/visits/claims/emergencies/surveys/snapshots/ledger"]
