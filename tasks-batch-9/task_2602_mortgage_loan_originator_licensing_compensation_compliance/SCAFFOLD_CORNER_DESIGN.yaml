  # ===========================================================================
  # Every error_id in §1.6 must be triggerable. Twelve errors that no other §1.9
  # section reaches get a recipe here; eight are covered by a named §1.8 instance and
  # carry an excluded_because stub. The remaining nineteen are already triggered by
  # earlier §1.9 sections of this file: ERR_ROLE_NOT_PERMITTED and
  # ERR_ORIGINATOR_IDENTITY_MISMATCH and ERR_SEGREGATION_OF_DUTIES (rbac),
  # ERR_STALE_ORIGINATOR_VERSION (cross_cutting_complexity_layers),
  # ERR_RESOURCE_NOT_FOUND / ERR_REFERENCED_RESOURCE_NOT_FOUND / ERR_INVALID_REQUEST
  # (entities and endpoints), ERR_INVALID_PAGINATION / ERR_DUPLICATE_KEY /
  # ERR_PROHIBITED_COMP_VARIABLE / ERR_PLAN_WEIGHTS_NOT_100 /
  # ERR_JUSTIFICATION_INSUFFICIENT / ERR_STATE_NOT_AUTHORIZED /
  # ERR_RESPONSE_DEADLINE_PASSED / ERR_OPEN_PIPELINE_BLOCKS_SURRENDER (validations),
  # ERR_INVALID_STATE_TRANSITION / ERR_ALREADY_TERMINAL / ERR_RENEWAL_WINDOW_CLOSED
  # (state_machines) and ERR_AD_DISCLOSURE_INCOMPLETE (calculations).
  - section: errors
    instances:

      - name: request_with_missing_auth_headers_returns_401
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: |
          Priority 1 outranks everything: a list request that omits BOTH X-User-Role and
          X-User-ID returns 401 ERR_MISSING_AUTH_HEADERS, and so does a request that carries a
          valid X-User-Role but an empty X-User-ID - the identity header is required even for
          a read that no role restricts.
        test_recipe:
          setup:
            - "One Originator exists, so the list endpoint would otherwise return data."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /originators"
              payload: {}
              as: LicensingAnalyst
              as_user_id: ""
              captures: { err1: $.data.error_id, msg1: $.data.message }
            - call: "GET /originators"
              payload: { limit: 10, offset: 0 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { total: $.total_count }
          assert:
            - "The first call is sent with NO X-User-Role and NO X-User-ID header at all
               (the `as` / `as_user_id` values above are placeholders for an absent header pair);
               a second variant sends X-User-Role LicensingAnalyst with an empty X-User-ID"
            - "HTTP status is 401 for both header-less variants"
            - "${err1} == ERR_MISSING_AUTH_HEADERS and ${msg1} is a non-empty string"
            - "${total} == 1 with both headers present, proving the 401 came from the headers
               and not from an empty table"

      - name: request_with_invalid_role_header_returns_unknown_role
        claim_type: error_triggerable
        grounds:
          - validations[priority=2]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: |
          A syntactically present but undeclared X-User-Role ("Underwriter", which is not one of
          the seven roles in the RBAC matrix) returns 401 ERR_UNKNOWN_ROLE at priority 2 -
          before the priority-3 403 that a declared-but-unpermitted role would get, so the
          status code distinguishes the two rules.
        test_recipe:
          setup:
            - "One Originator exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
          trigger:
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: Underwriter
              as_user_id: "u-1"
              captures: { err: $.data.error_id }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ExaminationCoordinator
              as_user_id: "exam-1"
              captures: { nmls: $.data.nmls_unique_id }
          assert:
            - "X-User-Role Underwriter is deliberately not a declared role in §1.7"
            - "HTTP status is 401"
            - "${err} == ERR_UNKNOWN_ROLE (not ERR_ROLE_NOT_PERMITTED, which would be 403)"
            - "${nmls} == 2200001 for a declared role on the same path"

      - name: taking_application_without_active_sponsorship_returns_sponsorship_required
        claim_type: error_triggerable
        grounds:
          - validations[priority=15]
          - errors[ERR_SPONSORSHIP_REQUIRED]
          - state_machines.SponsorshipTransfer.ACTIVE_to_RELINQUISHED
        distinguishing_aspect: |
          The licence is ACTIVE, the clock instant 2026-08-02 sits inside the half-open licence
          interval [2026-08-01, 2027-01-31) and the originator is EMPLOYED, so none of
          priority 14's fires-when clauses apply; the only missing element is a
          SponsorshipTransfer covering the instant, which was relinquished at 2026-08-01. The
          request therefore returns 422 ERR_SPONSORSHIP_REQUIRED, and a fresh sponsorship
          effective 2026-08-02 makes the identical call succeed.
        test_recipe:
          setup:
            - "Originator 2200001, EMPLOYED, with an ACTIVE CA licence activated at 2026-08-01
               and sponsored by INST-0001 from 2026-07-01; that sponsorship is relinquished at
               2026-08-01, leaving the licence unsponsored."
            - "The clock is then moved to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
