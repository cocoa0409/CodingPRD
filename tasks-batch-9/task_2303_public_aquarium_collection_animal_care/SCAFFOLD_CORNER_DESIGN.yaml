      - TransferRequest.negotiation_round == 2
      - TransferRequest.counter_conditions == ["DIET_TRANSITION_PLAN"] (the round-2 demand, not the rejected round-3 one)
      - TransferRequest.welfare_conditions == ["WATER_CHEMISTRY_MATCH", "TRANSPORT_OXYGEN_PLAN", "QUARANTINE_ON_ARRIVAL", "DIET_TRANSITION_PLAN"]
      - Specimen.disposition_status == TRANSFER_PENDING and Specimen.pre_transfer_disposition == CLEARED
  - name: state_audit_start_before_scheduled_for_returns_audit_not_due
    claim_type: Precondition Enforcement
    grounds:
    - §1.2 AccreditationAudit SCHEDULED -> IN_PROGRESS (precondition clock_now >= scheduled_for)
    - §1.4 priority 35 (ERR_AUDIT_NOT_DUE)
    - §1.6 ERR_AUDIT_NOT_DUE (409)
    - §1.1 AccreditationAudit.readiness_score / opened_by_user_id / started_at
    distinguishing_aspect: START at 2026-08-01 for an audit scheduled 2026-09-15 returns 409 ERR_AUDIT_NOT_DUE and leaves readiness_score null — the AUDIT_SNAPSHOT re-scoring step never runs.
    test_recipe:
      setup:
      - One audit scheduled for 2026-09-15T00:00:00Z; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/accreditation-audits
        payload: {audit_code: AUD-2026-Q4, scope: FULL, scheduled_for: '2026-09-15T00:00:00Z'}
        as: ComplianceDirector
        captures: {aud_id: $.data.id}
      trigger:
      - call: POST /aquarium/accreditation-audits/${aud_id}/progressions
        payload: {action: START}
        as: ComplianceDirector
        as_user_id: dir-audit-opener
        captures: {err: $.data.error_id}
      assert:
      - HTTP 409 and data.error_id == ERR_AUDIT_NOT_DUE
      - AccreditationAudit.status == SCHEDULED
      - AccreditationAudit.readiness_score == null and domain_subscores == null
      - AccreditationAudit.blocking_finding_count == 0
      - AccreditationAudit.opened_by_user_id == null and started_at == null
      - AccreditationAudit.version == 1
  - name: state_audit_close_on_an_empty_collection_passes_and_enforces_sod
    claim_type: Valid Transition
    grounds:
    - §1.2 AccreditationAudit SCHEDULED -> IN_PROGRESS
    - §1.2 AccreditationAudit IN_PROGRESS -> PASSED
    - §1.3 readiness_score (empty-set fallbacks and AUDIT_PASS_SCORE 85.00)
    - §1.4 priority 13 (ERR_SOD_VIOLATION)
    - §1.1 AccreditationAudit.domain_subscores / blocking_finding_count / opened_by_user_id / closed_by_user_id
    distinguishing_aspect: On an empty collection every domain subscore falls back to 100.00, so readiness_score is exactly 100.00 with blocking_finding_count 0 and CLOSE lands on PASSED — but only for a director other than the one who ran START, whose own CLOSE returns 409 ERR_SOD_VIOLATION.
    test_recipe:
      setup:
      - No plants, exhibits, specimens, permits or sessions exist. One audit scheduled for 2026-08-01T00:00:00Z, started by dir-audit-opener at that instant.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/accreditation-audits
        payload: {audit_code: AUD-2026-Q3, scope: FULL, scheduled_for: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {aud_id: $.data.id}
      - call: POST /aquarium/accreditation-audits/${aud_id}/progressions
        payload: {action: START}
        as: ComplianceDirector
        as_user_id: dir-audit-opener
      trigger:
      - call: POST /aquarium/accreditation-audits/${aud_id}/progressions
        payload: {action: CLOSE, determination_note: self-signed determination attempt}
        as: ComplianceDirector
        as_user_id: dir-audit-opener
        captures: {err: $.data.error_id}
      - call: POST /aquarium/accreditation-audits/${aud_id}/progressions
        payload: {action: CLOSE, determination_note: no findings on an empty collection}
        as: ComplianceDirector
        as_user_id: dir-audit-closer
      assert:
      - 'after START: AccreditationAudit.readiness_score == 100.00'
      - 'after START: AccreditationAudit.domain_subscores == { LIFE_SUPPORT: 100.00, ANIMAL_HEALTH: 100.00, RECORDS: 100.00, PERMITS: 100.00, PUBLIC_SAFETY: 100.00 }'
      - 'after START: AccreditationAudit.blocking_finding_count == 0 and opened_by_user_id == "dir-audit-opener"'
      - 'first trigger: HTTP 409 and data.error_id == ERR_SOD_VIOLATION; status stays IN_PROGRESS'
      - 'second trigger: HTTP 200, AccreditationAudit.status == PASSED'
      - AccreditationAudit.closed_by_user_id == "dir-audit-closer" and closed_at == 2026-08-01T00:00:00Z
      - AccreditationAudit.determination_note == "no findings on an empty collection"
- section: calculations
  instances:
  - name: calc_latest_reading_selector_ignores_insertion_order
    claim_type: chronological
    grounds:
    - §1.3 latest_reading_selector (greatest taken_at, ties by created_at, id never used)
    - §1.3 water_quality_index
    - §1.2 LifeSupportSystem NORMAL -> WARNING
    - §1.2 LifeSupportSystem NORMAL -> OFFLINE (redundancy FAIL)
    - §1.2 LifeSupportSystem OFFLINE -> NORMAL / OFFLINE -> WARNING (the recovery fork keyed on the latest reading's severity)
    - §1.1 LifeSupportSystem.water_quality_index
    distinguishing_aspect: The 2026-08-01 WARNING sample is INSERTED LAST but is not the latest by taken_at, so the plant's water_quality_index stays 100.00 and the OFFLINE recovery fork lands on NORMAL / OPEN. An implementation keyed on insertion order would report 77.60 and recover to WARNING / RESTRICTED.
    test_recipe:
      setup:
      - 'One COLD_MARINE plant serving one exhibit. Two samples exist: taken_at 2026-08-02T00:00:00Z at every target value (WQI 100.00, severity NORMAL), inserted FIRST, and taken_at 2026-08-01T00:00:00Z with temperature_c 13.6 (WQI 77.60, severity WARNING), inserted SECOND. Clock at 2026-08-03T00:00:00Z.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-03T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-02T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      trigger:
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/redundancy-tests
        payload: {performed_at: '2026-08-03T00:00:00Z', result: FAIL}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/redundancy-tests
        payload: {performed_at: '2026-08-03T00:00:00Z', result: PASS}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'after the two samples: LifeSupportSystem.alarm_state == WARNING (escalation follows the APPENDED reading''s severity) and consecutive_breach_readings == 1, consecutive_normal_readings == 0'
      - 'after the two samples: LifeSupportSystem.water_quality_index == 100.00 — the 2026-08-02 snapshot, NOT the later-inserted 2026-08-01 snapshot of 77.60'
      - the 2026-08-02 reading has water_quality_index_snapshot 100.00, severity NORMAL, breach_parameters []
      - the 2026-08-01 reading has water_quality_index_snapshot 77.60, severity WARNING, breach_parameters ["temperature_c"]
      - 'after the FAIL: alarm_state == OFFLINE and Exhibit.posture == CLOSED with last_posture_reason == LSS_OFFLINE'
      - 'after the PASS: alarm_state == NORMAL (the fork read the 2026-08-02 NORMAL sample through §1.3 latest_reading_selector), NOT WARNING'
      - 'after the PASS: Exhibit.posture == OPEN and last_posture_reason == null'
      - 'after the PASS: last_redundancy_test_at == 2026-08-03T00:00:00Z and redundancy_overdue == false'
  - name: calc_touch_pool_contact_surcharge_is_the_only_habitat_specific_term
    claim_type: Constants Applied
    grounds:
    - §1.3 water_quality_index constants TOUCH_CONTACT_WEIGHT 10.0, SUM_WEIGHT 6.0, MAX_WEIGHT 15.0, AMMONIA_WARN 0.020, AMMONIA_CRIT 0.050
    - §1.3 water_quality_index HABITAT_TARGETS rows COLD_MARINE and TOUCH_POOL
    - §1.1 WaterQualityReading.water_quality_index_snapshot / severity / breach_parameters
    - §1.2 LifeSupportSystem NORMAL -> WARNING
    distinguishing_aspect: Both plants receive ammonia 0.035 mg/L — ratio exactly 1.0 — with every other parameter at its own habitat target. The COLD_MARINE plant scores 100 - (6.0*1.0 + 15.0*1.0) = 79.00; the TOUCH_POOL plant subtracts a further 10.0 * (1.0 - 0.5) = 5.00 for guest contact and scores 74.00. A single shared formula would report 79.00 twice.
    test_recipe:
      setup:
      - 'Two plants: LSS-COLD-1 with design_habitat COLD_MARINE and LSS-TOUCH-1 with design_habitat TOUCH_POOL. No exhibits. Clock at 2026-08-01T00:00:00Z.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-TOUCH-1, system_type: RECIRCULATING_MARINE, design_habitat: TOUCH_POOL, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {tp_id: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.035, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${tp_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 14.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.8, ammonia_mg_l: 0.035, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${tp_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'COLD_MARINE reading: water_quality_index_snapshot == 79.00, severity == WARNING, breach_parameters == ["ammonia_mg_l"]'
      - 'TOUCH_POOL reading: water_quality_index_snapshot == 74.00, severity == WARNING, breach_parameters == ["ammonia_mg_l"]'
      - the 5.00 delta is exactly TOUCH_CONTACT_WEIGHT * (r_ammonia - 0.5) = 10.0 * 0.5
      - 'both plants: alarm_state == WARNING, consecutive_breach_readings == 1'
      - LifeSupportSystem.${lss_id}.water_quality_index == 79.00 and LifeSupportSystem.${tp_id}.water_quality_index == 74.00
      - severity is identical (WARNING) on both readings — the surcharge moves the index, not the severity classification
  - name: calc_welfare_rolling_window_drops_the_sixth_oldest_log
    claim_type: Input Set Filtering
    grounds:
    - §1.3 welfare_score ROLLING variant (ROLLING_WINDOW_SIZE 5, ordered logged_at DESC then created_at DESC)
    - §1.3 welfare_score constants BASE_WELFARE 40.0, APPETITE_WEIGHT 8.0, BEHAVIOR_POINTS
    - §1.1 Specimen.welfare_score / welfare_score_variant
    - §1.5 POST /aquarium/specimens/{id}/husbandry-logs
    distinguishing_aspect: Five logs are on file (appetite 1, 4, 5, 3 plus one NORMAL behaviour) giving 40 + 26.00 + 10.00 = 76.00. Appending a sixth log pushes the appetite-1 record out of the window, so the score RISES to 79.00. An implementation that averages every log would fall to 73.00 instead.
    test_recipe:
      setup:
      - 'A quarantined specimen with five husbandry logs: FEEDING appetite 1 on 2026-09-10, FEEDING 4 on 2026-09-11, FEEDING 5 on 2026-09-12, BEHAVIOR NORMAL on 2026-09-12T15:00:00Z and FEEDING 3 on 2026-09-13. No OPEN TREATMENT case. Clock at 2026-09-14T12:00:00Z.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      - call: POST /aquarium/specimens
        payload: {accession_code: SPC-0001, species_id: '${sp_id}', acquisition_request_id: '${ar_id}', arrival_at: '2026-08-01T00:00:00Z', holding_area: QT-BAY-1}
        as: CuratorOfCollections
        captures: {spec_id: $.data.id}
      - call: GET /aquarium/specimens/${spec_id}/quarantine-cases
        payload: {}
        as: VeterinaryOfficer
        captures: {qc_id: '$.data[0].id'}
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-09-14T12:00:00Z'}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-10T09:00:00Z', appetite_score: 1, feed_grams: 30.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-11T09:00:00Z', appetite_score: 4, feed_grams: 120.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-12T09:00:00Z', appetite_score: 5, feed_grams: 150.0}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: BEHAVIOR, logged_at: '2026-09-12T15:00:00Z', behavior_code: NORMAL}
        as: AquaristTechnician
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: FEEDING, logged_at: '2026-09-13T09:00:00Z', appetite_score: 3, feed_grams: 90.0}
        as: AquaristTechnician
      - call: GET /aquarium/specimens/${spec_id}
        payload: {}
        as: AquaristTechnician
      trigger:
      - call: POST /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {log_type: BEHAVIOR, logged_at: '2026-09-14T09:00:00Z', behavior_code: LETHARGIC}
        as: AquaristTechnician
      - call: GET /aquarium/specimens/${spec_id}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/specimens/${spec_id}/husbandry-logs
        payload: {limit: 10}
        as: AquaristTechnician
      assert:
      - 'before the trigger: Specimen.welfare_score == 76.00 (40 + mean(1,4,5,3)*8 = 26.00 + mean(NORMAL)=10.00) and welfare_score_variant == ROLLING'
      - 'after the trigger: Specimen.welfare_score == 79.00 (window is now 2026-09-11..2026-09-14: 40 + mean(4,5,3)*8 = 32.00 + mean(10,4) = 7.00)'
      - 'after the trigger: welfare_score_variant == ROLLING'
      - the husbandry-log list returns total_count == 6 — the appetite-1 row is still stored, it is only outside the scoring window
      - the score MOVED UP, which is only possible if the oldest log left the window; averaging all six rows would give 73.00
  - name: calc_final_score_below_min_clearance_score_blocks_the_clearance
    claim_type: Constants Applied
    grounds:
    - §1.3 sustainability_score constants RATING_POINTS RED 8.0, SOURCE_POINTS WILD_COLLECTION 10.0, INSTITUTION_WEIGHT 0.25, PROTECTION_PENALTY ESA_LISTED 18.0, PERMIT_BONUS 5.0, QUOTA_PRESSURE_WEIGHT 20.0, MIN_CLEARANCE_SCORE 40.0
    - §1.3 sustainability_score FINAL variant
    - §1.4 priority 47 (ERR_CLEARANCE_SCORE_TOO_LOW)
    - §1.6 ERR_CLEARANCE_SCORE_TOO_LOW (409)
    - §1.2 AcquisitionRequest PENDING_PERMIT -> CLEARED precondition 'FINAL sustainability_score >= MIN_CLEARANCE_SCORE'
    - §1.1 AcquisitionRequest.sustainability_score / sustainability_score_variant
    distinguishing_aspect: The FINAL score is 8 + 10 + 0.25*62.00 + 5.00 permit bonus = 38.50, then -18.00 ESA penalty and -20.0*(1/4) quota pressure = 15.50 — below MIN_CLEARANCE_SCORE 40.00 — so a fully permitted, in-quota, correctly segregated clearance is still refused, and the +5.00 bonus and -5.00 quota term cancel so PROVISIONAL and FINAL coincide at 15.50.
    test_recipe:
      setup:
      - An ESA_LISTED, RED-rated species with wild_take_quota_annual 4 under an ANY_WITH_JUSTIFICATION plan line; a WILD_COLLECTION request for 1 specimen from an ACCREDITED institution whose welfare_audit_score is 62.00; the request's IMPORT permit is ISSUED with a 2026-08-01 -> 2027-06-01 window. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Totoaba macdonaldi, common_name: totoaba, taxon_group: TELEOST, protection_status: ESA_LISTED, sustainability_rating: RED, bioload_units_per_specimen: 30, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: ANY_WITH_JUSTIFICATION, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 62.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}', justification: 'ex-situ conservation breeding programme, permit NMFS-2026-1177'}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id, prov_score: $.data.sustainability_score}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_id}', permit_type: IMPORT, authority_reference: NMFS-2026-1177, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE, ESA_AUTHORIZATION]}
        as: PermitOfficer
        captures: {pm_id: $.data.id}
      - call: POST /aquarium/permits/${pm_id}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2027-06-01T00:00:00Z'}
        as: ComplianceDirector
        as_user_id: dir-permit-officer
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_v2: $.data.version}
      trigger:
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_v2}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
        captures: {err: $.data.error_id}
      - call: GET /aquarium/acquisition-requests/${ar_id}
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
      assert:
      - HTTP 409 and data.error_id == ERR_CLEARANCE_SCORE_TOO_LOW
      - the PROVISIONAL score captured at creation was 15.50 (8 + 10 + 15.50 = 33.50 gross, minus 18.00 ESA penalty)
      - AcquisitionRequest.status == PENDING_PERMIT (unchanged)
      - AcquisitionRequest.sustainability_score == 15.50 and sustainability_score_variant == PROVISIONAL — the rejected clearance does not overwrite the stored variant
      - AcquisitionRequest.cleared_by_user_id == null and cleared_at == null
      - Species.wild_take_quota_reserved == 0 — no quota was reserved
      - Species.version is unchanged by the rejected clearance
      - the request's IMPORT permit is still ISSUED
      - 'every higher-priority gate passed: the permit is ISSUED and of type IMPORT (priorities 26/27), the clearing director is not the plan approver (priority 13) and 0 + 1 <= 4 satisfies the quota (priority 46)'
  - name: calc_sustainability_score_rounds_half_up_at_two_decimals
    claim_type: Precision
    grounds:
    - §1.3 sustainability_score precision (2 decimal places, round_half_up)
    - §1.3 sustainability_score constants RATING_POINTS GREEN 40.0, SOURCE_POINTS INSTITUTIONAL_TRANSFER 22.0, INSTITUTION_WEIGHT 0.25
    - §1.1 AcquisitionRequest.sustainability_score
    - §1.1 Institution.welfare_audit_score
    distinguishing_aspect: 40 + 22 + 0.25 * 70.10 = 79.525 exactly — a true half at the third decimal. round_half_up yields 79.53; banker's rounding would yield 79.52 and truncation 79.52.
    test_recipe:
      setup:
      - A GREEN, UNLISTED species under a GREEN_ONLY plan line; an ACCREDITED source institution with welfare_audit_score exactly 70.10; one INSTITUTIONAL_TRANSFER request for 1 specimen.
