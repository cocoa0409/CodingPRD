  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_patient_version_on_a_profile_write_is_rejected_and_the_reread_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[risk-profile-create-stale-patient]
          - validations[priority 18]
          - errors[ERR_STALE_PATIENT_VERSION]
          - endpoints[POST /bone-density/patients/{id}/risk-factor-profiles]
        distinguishing_aspect: "The version a client captured at patient creation is spent by the first profile write, so replaying it yields 412 ERR_STALE_PATIENT_VERSION and no row: the second write must carry the re-read version, and the 412 is a pure precondition failure that leaves the incumbent ACTIVE profile and the patient version untouched."
        test_recipe:
          setup:
            - "One patient with one ACTIVE risk factor profile already recorded using the version captured at creation."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-8001", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_v0}", height_cm: 165.0, weight_kg: 58.0, current_smoker: false }
              as: Scheduler
              captures: { prof1_id: $.data.id }
            - call: "GET /bone-density/patients/${pat_id}"
              payload: {}
              as: Scheduler
              captures: { pat_v1: $.data.version }
          trigger:
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_v0}", height_cm: 164.0, weight_kg: 57.0, current_smoker: true }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_v1}", height_cm: 164.0, weight_kg: 57.0, current_smoker: true }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "GET /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: {}
              as: Scheduler
          assert:
            - "${pat_v1} is exactly ${pat_v0} + 1, because the first profile write incremented Patient.version"
            - "the first trigger response status is 412 and data.error_id is ERR_STALE_PATIENT_VERSION"
            - "immediately after the 412, GET /bone-density/patients/${pat_id} still reports version == ${pat_v1}, so the rejected write incremented nothing"
            - "immediately after the 412, GET /bone-density/patients/${pat_id}/risk-factor-profiles?status=ACTIVE returns total_count 1 with id == ${prof1_id}"
            - "the second trigger response status is 201 with status ACTIVE, current_smoker true and height_cm 164.0"
            - "after the successful write GET /bone-density/patients/${pat_id} reports version == ${pat_v1} + 1"
            - "the third trigger response has total_count 2, with the row whose id == ${prof1_id} now status SUPERSEDED and exactly one row status ACTIVE"
      - name: stale_densitometer_version_on_a_precision_write_is_rejected_and_the_lsc_is_unchanged
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[precision-assessment-stale-densitometer]
          - validations[priority 19]
          - errors[ERR_STALE_DENSITOMETER_VERSION]
          - calculations.precision_lsc
        distinguishing_aspect: "The second OCC rule guards a value other sessions snapshot: replaying the creation-time device version on a second precision assessment returns 412 and leaves lsc_g_cm2 at the first study's 0.0277, whereas the same body with the re-read version is accepted and moves the LSC to 0.0554, proving the 412 is not a duplicate-suppression rule."
        test_recipe:
          setup:
            - "One densitometer with one accepted precision assessment at rms 0.0100."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_v0: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_v0}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "GET /bone-density/densitometers/${dev_a_id}"
              payload: {}
              as: ProgramAdmin
              captures: { dev_v1: $.data.version }
          trigger:
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_v0}", technologist_user_id: "tech-002", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0200 }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_v1}", technologist_user_id: "tech-002", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0200 }
              as: ProgramAdmin
          assert:
            - "the setup assessment produced precision_degrees_of_freedom 30 and lsc_g_cm2 0.0277, from 2.77 * 0.0100"
            - "${dev_v1} is exactly ${dev_v0} + 1"
            - "the first trigger response status is 412 and data.error_id is ERR_STALE_DENSITOMETER_VERSION"
            - "immediately after the 412, GET /bone-density/densitometers/${dev_a_id} still reports rms_sd_g_cm2 0.0100, lsc_g_cm2 0.0277 and version == ${dev_v1}"
            - "the second trigger response status is 201 with rms_sd_g_cm2 0.0200 and lsc_g_cm2 0.0554"
            - "after the successful write GET /bone-density/densitometers/${dev_a_id} reports version == ${dev_v1} + 1 and lsc_g_cm2 0.0554"
      - name: shift_detection_reads_only_the_two_preceding_daily_runs_on_the_same_device
        claim_type: selector_policy
        grounds:
          - calculations.qc_deviation_and_result
          - "calculations.qc_deviation_and_result.constants[QC_SHIFT_RUN_COUNT, QC_SHIFT_MIN_SD]"
          - entities.Densitometer[consecutive_qc_pass_count, qc_hold_reason_code]
        distinguishing_aspect: "The shift selector is per-device and sign-sensitive, so two devices whose runs are interleaved in wall-clock order reach opposite verdicts from the same third magnitude: device A's chain +1.000, +1.200, +1.100 trips SUSTAINED_SHIFT even though the first run PASSed at exactly the limit, while device B's -1.200 between +1.500 and +1.100 breaks the sign chain and B stays ACTIVE."
        test_recipe:
          setup:
            - "Two identical densitometers, each with two DAILY_QC runs already recorded, interleaved A, B, A, B."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0002", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "EAST", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_b_id: $.data.id }
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0100, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0150, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0120, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 0.9880, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
          trigger:
            - call: "POST /bone-density/densitometers/${dev_a_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0110, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/densitometers/${dev_b_id}/qc-runs"
              payload: { purpose: "DAILY_QC", phantom_bmd_g_cm2: 1.0110, scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
          assert:
            - "the four setup runs computed deviation_sd_units 1.000 (A, PASS), 1.500 (B, WARN), 1.200 (A, WARN) and -1.200 (B, WARN), and all four have shift_detected false because each device had fewer than two preceding DAILY_QC runs at the time"
            - "after the setup, GET /bone-density/densitometers/${dev_a_id} reports status ACTIVE and consecutive_qc_pass_count 0, the count having been raised to 1 by the PASS and reset by the WARN"
            - "the first trigger response has deviation_g_cm2 0.0110, deviation_sd_units 1.100, result WARN and shift_detected true"
            - "immediately after that run GET /bone-density/densitometers/${dev_a_id} reports status QC_HOLD, qc_hold_reason_code SUSTAINED_SHIFT and consecutive_qc_pass_count 0"
            - "the second trigger response has deviation_sd_units 1.100, result WARN and shift_detected false, because the immediately preceding B run was -1.200 and the sign chain is broken"
            - "immediately after that run GET /bone-density/densitometers/${dev_b_id} reports status ACTIVE with qc_hold_reason_code null"
            - "GET /bone-density/qc-runs?densitometer_id=${dev_a_id} returns total_count 3 and GET /bone-density/qc-runs?densitometer_id=${dev_b_id} returns total_count 3, so neither device's selector saw the other's runs"
      - name: cascading_side_effects_layer_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / report_finalize_cascades_four_levels_to_cancel_a_future_appointment"
          rationale: "The §1.8 transitive_cascade instance already walks the full four-level finalize chain end to end - report to patient ledger to future order to its booked slot - and its sibling instance walks the three-level QC hold chain while asserting that an appointment beyond the 48 hour horizon is spared, which is exactly the ordering-sensitivity and partial-scope pair this layer row asks for."
      - name: dual_variant_calculation_layer_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / frax_with_bmd_versus_without_bmd_diverges_on_identical_risk_profile"
          rationale: "That instance runs both FRAX variants over one identical risk factor profile and pins the full delta - raw 2.30 versus 4.70, major 16.8 versus 31.2, hip 4.1 versus 7.9 and the threshold_basis flip - so a separate layer-level variant divergence test would replay the same arithmetic."

  - section: consistency_model
    instances:
