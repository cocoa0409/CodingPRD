scenario: |
  Opaque Inventory Booking & Supplier Rate Protection (Priceline): supplier agreements permitting
  discounted rates when the brand is concealed until purchase, bid or fixed-price opaque offers
  with star rating, neighborhood and amenity disclosure boundaries, inventory selection logic
  choosing which supplier fills an opaque booking based on rate and availability, non-refundable
  booking terms with limited exception handling for service failures, rate parity protection
  where the discount does not become publicly attributable to a brand, customer expectation
  management and complaint handling when the revealed property disappoints, supplier settlement
  and commission accounting, fraud and abuse controls on repeat opaque arbitrage

domain_name: opaque-inventory-booking
api_prefix: /opaque

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Supplier corporate legal name" }
      - { name: opaque_commission_pct, type: number, source: input, description: "Commission percentage retained by the platform on opaque supplier remittance; decimal in (0,1) exclusive" }
      - { name: parity_protection_enabled, type: boolean, source: input, default: true, description: "When true, the supplier's opaque discount must never be publicly attributable to its brand" }
      - { name: concealment_discount_min_pct, type: number, source: input, description: "Minimum discount fraction below the property's published reference rate that the supplier requires for any opaque fill; decimal in [0,1)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; owning supplier of this property" }
      - { name: brand_name, type: string, source: input, description: "Publicly recognizable brand name; NEVER disclosed pre-purchase on opaque inventory" }
      - { name: star_rating, type: integer, source: input, description: "Star rating 1..5 inclusive" }
      - { name: neighborhood_code, type: string, source: input, description: "Neighborhood identifier used as the opaque disclosure unit" }
      - { name: amenity_codes, type: array, source: input, description: "List of amenity codes; only these may be disclosed pre-purchase" }
      - { name: published_rate_cents, type: integer, source: input, description: "Public retail nightly rate in cents; the reference against which opaque discounts are measured" }

  - name: RateWindow
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property whose opaque rate this window covers" }
      - { name: check_in_date, type: datetime, source: input, description: "Start date (inclusive) of the window, date-only UTC midnight" }
      - { name: check_out_date, type: datetime, source: input, description: "End date (exclusive) of the window, date-only UTC midnight" }
      - { name: opaque_rate_cents, type: integer, source: input, description: "Opaque nightly rate the supplier will accept for fills inside this window" }
      - { name: rooms_allocated, type: integer, source: input, description: "Total opaque rooms the supplier commits across the window (per-night basis; the window sells the same room count each night)" }
      - { name: rooms_sold, type: integer, source: computed, default: 0, description: "Count of CONFIRMED or SETTLED opaque bookings that consumed one room-night slot in this window" }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED | CLOSED" }

  - name: DisclosureZone
    parent: null
    common_fields: true
    fields:
      - { name: neighborhood_code, type: string, source: input, description: "Neighborhood this zone covers; unique per zone" }
      - { name: min_star_rating, type: integer, source: input, description: "Minimum star rating the zone will show for opaque offers in this neighborhood" }
      - { name: revealed_amenity_codes, type: array, source: input, description: "Amenity codes that the zone permits to be disclosed pre-purchase" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer contact email; unique" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: fraud_score, type: integer, source: computed, default: 0, description: "Running fraud-abuse score; higher is worse; floors at 0" }
      - { name: fraud_status, type: enum, source: system, default: "CLEAR", description: "CLEAR | WATCH | BLOCKED" }
      - { name: opaque_win_count_30d, type: integer, source: computed, default: 0, description: "Number of ACCEPTED opaque bookings by this customer in the trailing 30-day window ending at the logical clock" }

  - name: OpaqueBid
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; bidding customer" }
      - { name: neighborhood_code, type: string, source: input, description: "Neighborhood the bid targets" }
      - { name: min_star_rating, type: integer, source: input, description: "Minimum acceptable star rating (1..5)" }
      - { name: check_in_date, type: datetime, source: input, description: "Check-in date, date-only UTC midnight" }
      - { name: check_out_date, type: datetime, source: input, description: "Check-out date, date-only UTC midnight; strictly after check_in_date" }
      - { name: bid_price_cents, type: integer, source: input, description: "Total price the customer offers for the whole stay (all nights combined)" }
      - { name: offer_mode, type: enum, source: input, description: "BID (customer names a price) | FIXED (customer accepts the platform-computed opaque price)" }
      - { name: computed_price_cents, type: integer, source: computed, description: "Platform-computed opaque price for the stay at bid evaluation time; for BID mode this is the floor the bid must meet; for FIXED mode it is the price charged" }
      - { name: winning_property_id, type: string, source: system, description: "FK -> Property.id; property chosen by the selector at acceptance; null until ACCEPTED" }
      - { name: winning_rate_window_id, type: string, source: system, description: "FK -> RateWindow.id; rate window consumed at acceptance; null until ACCEPTED" }
      - { name: concealment_discount_pct, type: number, source: computed, description: "Discount fraction achieved vs the winning property's published_rate_cents at acceptance time" }
      - { name: status, type: enum, source: system, description: "PENDING → ACCEPTED | REJECTED | EXPIRED | WITHDRAWN" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: opaque_bid_id, type: string, source: system, description: "FK -> OpaqueBid.id; the bid this booking fulfills" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the bid" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the revealed property" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; supplier of the revealed property" }
      - { name: rate_window_id, type: string, source: system, description: "FK -> RateWindow.id; the rate window consumed" }
      - { name: check_in_date, type: datetime, source: system, description: "Copied from the bid" }
      - { name: check_out_date, type: datetime, source: system, description: "Copied from the bid" }
      - { name: charged_price_cents, type: integer, source: system, description: "Total amount charged to the customer" }
      - { name: supplier_remittance_cents, type: integer, source: computed, description: "Amount owed to the supplier; see calculation supplier_remittance" }
      - { name: platform_commission_cents, type: integer, source: computed, description: "Platform's commission on the booking; see calculation supplier_remittance" }
      - { name: payment_status, type: enum, source: system, description: "CAPTURED | REFUNDED | PARTIALLY_REFUNDED — payment dimension, independent of fulfillment_status" }
      - { name: fulfillment_status, type: enum, source: system, description: "CONFIRMED | SERVICE_FAILED | SETTLED — fulfillment dimension, independent of payment_status" }

  - name: ComplaintCase
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking complained about" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the booking" }
      - { name: category, type: enum, source: input, description: "PROPERTY_MISREPRESENTED | SERVICE_FAILURE | DISSATISFIED_REVEAL | OTHER" }
      - { name: description, type: string, source: input, description: "Free-form complaint description" }
      - { name: resolution, type: enum, source: system, description: "NONE | GOODWILL_CREDIT | FULL_REFUND — the disposition once resolved" }
      - { name: goodwill_credit_cents, type: integer, source: computed, default: 0, description: "Goodwill amount granted when resolution == GOODWILL_CREDIT" }
      - { name: status, type: enum, source: system, description: "OPEN → UNDER_REVIEW → RESOLVED | REJECTED" }

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier being settled" }
      - { name: period_start_date, type: datetime, source: input, description: "Inclusive start of the settlement period, date-only UTC midnight" }
      - { name: period_end_date, type: datetime, source: input, description: "Exclusive end of the settlement period, date-only UTC midnight" }
      - { name: booking_ids, type: array, source: computed, description: "Ids of bookings included in this batch; see calculation settlement_selection" }
      - { name: gross_remittance_cents, type: integer, source: computed, description: "Sum of supplier_remittance_cents over the batch's bookings" }
      - { name: goodwill_deduction_cents, type: integer, source: computed, description: "Goodwill credits clawed back from the supplier under goodwill_chargeback (may be zero)" }
      - { name: net_remittance_cents, type: integer, source: computed, description: "= gross_remittance_cents - goodwill_deduction_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT → APPROVED → PAID | VOIDED" }

  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; flagged customer" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; booking that triggered the flag (nullable for manual flags)" }
      - { name: reason_code, type: enum, source: input, description: "ARBITRAGE_PATTERN | REPEAT_WIN_RATE | MANUAL_REVIEW" }
      - { name: score_delta, type: integer, source: input, description: "Points added to the customer's fraud_score; positive integer" }
      - { name: status, type: enum, source: system, description: "OPEN → UPHELD | DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /opaque/suppliers/{supplierId}/suspend
        actor: PlatformAdmin
        preconditions:
          - "Supplier is ACTIVE"
        side_effects:
          - "All OPEN RateWindows of every Property owned by this supplier transition to CLOSED"
          - "PENDING OpaqueBids that would have selected this supplier's properties become unfillable (rejected at next evaluate call)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /opaque/suppliers/{supplierId}/reinstate
        actor: PlatformAdmin
        preconditions:
          - "Supplier is SUSPENDED"
        side_effects: []
        note: "Reinstatement does NOT reopen previously CLOSED RateWindows — the supplier must create new windows"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /opaque/suppliers/{supplierId}/terminate
        actor: PlatformAdmin
        preconditions:
          - "Supplier is ACTIVE or SUSPENDED"
          - "No DRAFT or APPROVED SettlementBatch exists for this supplier"
        side_effects:
          - "All OPEN RateWindows of this supplier's properties transition to CLOSED"

  - entity: RateWindow
    initial_state: OPEN
    terminal_states: [EXHAUSTED, CLOSED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic when rooms_sold reaches rooms_allocated)"
        actor: system
        preconditions:
          - "rooms_sold == rooms_allocated"
        side_effects:
          - "Window becomes ineligible for the selector"
      - from: OPEN
        to: CLOSED
        trigger: "POST /opaque/rate-windows/{rateWindowId}/close OR supplier suspend/terminate cascade"
        actor: PlatformAdmin | system
        preconditions:
          - "Window is OPEN"
        side_effects: []
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (automatic when a CONFIRMED booking in this window is refunded and releases its slot)"
        actor: system
        preconditions:
          - "A booking consuming this window transitions payment_status to REFUNDED"
        side_effects:
          - "rooms_sold decremented by 1"

  - entity: OpaqueBid
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: POST /opaque/opaque-bids/{bidId}/evaluate
        actor: system
        preconditions:
          - "Bid is PENDING"
          - "Customer.fraud_status is not BLOCKED"
          - "At least one eligible (Property, RateWindow) candidate exists; see calculation opaque_price_floor and selector opaque_fill_selector"
          - "For BID mode: bid_price_cents >= computed_price_cents"
          - "For BID mode: concealment_discount_pct >= winning supplier's concealment_discount_min_pct"
        side_effects:
          - "A Booking is created in (payment_status=CAPTURED, fulfillment_status=CONFIRMED)"
          - "winning_property_id and winning_rate_window_id are set on the bid"
          - "RateWindow.rooms_sold incremented by 1; if rooms_sold == rooms_allocated the window transitions OPEN→EXHAUSTED"
          - "Customer.opaque_win_count_30d recomputed; if it crosses REPEAT_WIN_THRESHOLD a FraudFlag(reason_code=REPEAT_WIN_RATE) is auto-created and Customer.fraud_score incremented by REPEAT_WIN_PENALTY"
      - from: PENDING
        to: REJECTED
        trigger: POST /opaque/opaque-bids/{bidId}/evaluate
        actor: system
        preconditions:
          - "Bid is PENDING"
          - "Either no eligible candidate exists OR (BID mode and bid_price_cents < computed_price_cents) OR (BID mode and concealment_discount_pct < concealment_discount_min_pct)"
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: POST /opaque/opaque-bids/{bidId}/withdraw
        actor: Customer
        preconditions:
          - "Bid is PENDING"
          - "Caller is the bid's customer"
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches the bid's check_in_date with the bid still PENDING)"
        actor: system
        preconditions:
          - "Bid is PENDING"
          - "current logical date >= check_in_date"
        side_effects: []

  - entity: Booking
    initial_state: "payment_status=CAPTURED, fulfillment_status=CONFIRMED"
    terminal_states:
      - "payment_status=REFUNDED, fulfillment_status=SERVICE_FAILED"
      - "payment_status=CAPTURED, fulfillment_status=SETTLED"
      - "payment_status=PARTIALLY_REFUNDED, fulfillment_status=SETTLED"
    note: "Two parallel dimensions. payment_status evolves CAPTURED → {REFUNDED, PARTIALLY_REFUNDED}; fulfillment_status evolves CONFIRMED → {SERVICE_FAILED, SETTLED}. The dimensions are independent except where a transition explicitly pins both."
    transitions:
      - from: "payment_status=CAPTURED, fulfillment_status=CONFIRMED"
        to: "payment_status=REFUNDED, fulfillment_status=SERVICE_FAILED"
        trigger: POST /opaque/bookings/{bookingId}/mark-service-failure
        actor: CustomerService
        preconditions:
          - "Booking fulfillment_status is CONFIRMED"
          - "A ComplaintCase for this booking exists with category SERVICE_FAILURE and status RESOLVED and resolution FULL_REFUND"
        side_effects:
          - "Customer is refunded charged_price_cents in full"
          - "supplier_remittance_cents recomputed to 0 and platform_commission_cents recomputed to 0"
          - "RateWindow.rooms_sold decremented by 1; if the window was EXHAUSTED it transitions EXHAUSTED→OPEN"
          - "Customer.fraud_score adjusted by goodwill clawback rules (no change for a genuine service failure)"
      - from: "payment_status=CAPTURED, fulfillment_status=CONFIRMED"
        to: "payment_status=PARTIALLY_REFUNDED, fulfillment_status=CONFIRMED"
        trigger: POST /opaque/bookings/{bookingId}/grant-goodwill
        actor: CustomerService
        preconditions:
          - "Booking fulfillment_status is CONFIRMED"
          - "A ComplaintCase for this booking exists with status RESOLVED and resolution GOODWILL_CREDIT"
          - "goodwill_credit_cents > 0 and < charged_price_cents"
        side_effects:
          - "Customer is refunded goodwill_credit_cents"
          - "platform_commission_cents recomputed (goodwill is charged back to the supplier only under calculation goodwill_chargeback conditions)"
      - from: "fulfillment_status=CONFIRMED"
        to: "fulfillment_status=SETTLED"
        trigger: "system (automatic when the booking's id is included in a SettlementBatch that transitions DRAFT→APPROVED)"
        actor: system
        preconditions:
          - "Booking fulfillment_status is CONFIRMED"
          - "Booking check_out_date < SettlementBatch.period_end_date and check_out_date >= SettlementBatch.period_start_date"
        side_effects:
          - "Booking is locked against further mark-service-failure and grant-goodwill"

  - entity: ComplaintCase
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /opaque/complaint-cases/{caseId}/start-review
        actor: CustomerService
        preconditions:
          - "Case is OPEN"
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: POST /opaque/complaint-cases/{caseId}/resolve
        actor: CustomerService
        preconditions:
          - "Case is UNDER_REVIEW"
          - "resolution in {GOODWILL_CREDIT, FULL_REFUND} supplied"
          - "If category is DISSATISFIED_REVEAL then resolution MUST be GOODWILL_CREDIT — a disappointed reveal never earns a full refund (non-refundable terms)"
        side_effects:
          - "resolution recorded"
          - "If resolution == GOODWILL_CREDIT, goodwill_credit_cents is set to the supplied amount (validated against the booking's charged_price_cents)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /opaque/complaint-cases/{caseId}/reject
        actor: CustomerService
        preconditions:
          - "Case is UNDER_REVIEW"
        side_effects: []

  - entity: SettlementBatch
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /opaque/settlement-batches/{batchId}/approve
        actor: FinanceOps
        preconditions:
          - "Batch is DRAFT"
          - "booking_ids is non-empty"
          - "Supplier is not TERMINATED"
        side_effects:
          - "Every booking in booking_ids transitions fulfillment_status CONFIRMED→SETTLED"
          - "gross_remittance_cents, goodwill_deduction_cents, net_remittance_cents are frozen (final variant of calculation supplier_remittance applies)"
      - from: DRAFT
        to: VOIDED
        trigger: POST /opaque/settlement-batches/{batchId}/void
        actor: FinanceOps
        preconditions:
          - "Batch is DRAFT"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: POST /opaque/settlement-batches/{batchId}/mark-paid
        actor: FinanceOps
        preconditions:
          - "Batch is APPROVED"
        side_effects: []

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: POST /opaque/fraud-flags/{flagId}/uphold
        actor: PlatformAdmin
        preconditions:
          - "Flag is OPEN"
        side_effects:
          - "Customer.fraud_score increases by the flag's score_delta if the flag's delta was not already applied (auto-created REPEAT_WIN_RATE flags are applied at creation; manual flags are applied here)"
          - "Customer.fraud_status recomputed: score >= BLOCKED_THRESHOLD → BLOCKED, score >= WATCH_THRESHOLD → WATCH, else CLEAR"
      - from: OPEN
        to: DISMISSED
        trigger: POST /opaque/fraud-flags/{flagId}/dismiss
        actor: PlatformAdmin
        preconditions:
          - "Flag is OPEN"
        side_effects:
          - "Customer.fraud_score decreases by the flag's score_delta (floor 0) if and only if the delta had been applied; dismissing an unapplied manual flag leaves the score unchanged"
          - "Customer.fraud_status recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: bid-evaluate-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /opaque/opaque-bids/{bidId}/evaluate"
    occ_field: "expected_customer_version"
    description: |
      Evaluating an OpaqueBid against a Customer whose version has advanced
      since the client last observed it is rejected. The customer's fraud_score
      or fraud_status may have been mutated by a fraud-flag disposition or by
      another accepted bid; the evaluating writer's view of the customer is
      therefore stale and the evaluation must be retried against a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: rate-window-close-stale-window
    parent_entity: RateWindow
    write_endpoint: "POST /opaque/rate-windows/{rateWindowId}/close"
    occ_field: "expected_rate_window_version"
    description: |
      Closing a RateWindow whose version has advanced since the client last
      observed it is rejected. A fill or refund may have just mutated
      rooms_sold and the window status; the closer's view is stale and the
      close must be re-issued against a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-approve-stale-batch
    parent_entity: SettlementBatch
    write_endpoint: "POST /opaque/settlement-batches/{batchId}/approve"
    occ_field: "expected_settlement_batch_version"
    description: |
      Approving a SettlementBatch whose version has advanced since the client
      last observed it is rejected. A re-selection may have re-derived
      booking_ids; the approver's view of the batch contents is stale and the
      approval must be re-issued against a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: opaque_price_floor
    trigger: "OpaqueBid evaluation (POST /opaque/opaque-bids/{id}/evaluate), computed per candidate property before the selector runs"
    algorithm: tiered_pricing
    formula: |
      nights = (check_out_date - check_in_date) in whole days; nights >= 1 is guaranteed by validation.
      For each candidate Property p in the bid's neighborhood with star_rating >= bid.min_star_rating:
        window = p's OPEN RateWindow that covers [check_in_date, check_out_date) with rooms_sold < rooms_allocated
        base = window.opaque_rate_cents * nights
        floor_price = ceil(base * (1 - p.supplier.concealment_discount_min_pct))
        # floor_price is the LOWEST total price the supplier will accept for the stay
      computed_price_cents (bid-level) = min over candidates of floor_price
    constants:
      NIGHTS_MIN: 1
    precision: "integer cents, ceil to whole cent"
    note: "The min-across-candidates aggregation is part of the floor; the selector then runs over the same candidate set."

  - name: opaque_fill_selector
    trigger: "OpaqueBid evaluation when at least one eligible candidate exists"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (candidate = (Property p, RateWindow w)):
        p.neighborhood_code == bid.neighborhood_code
        p.star_rating >= bid.min_star_rating
        p.supplier.status == ACTIVE
        w.property_id == p.id AND w.status == OPEN
        w.check_in_date <= bid.check_in_date AND w.check_out_date >= bid.check_out_date
        w.rooms_sold < w.rooms_allocated
        every amenity in bid's required amenity filter (if supplied) ∈ p.amenity_codes ∩ DisclosureZone(p.neighborhood_code).revealed_amenity_codes
      Ranking expression: sort candidates by
        (1) w.opaque_rate_cents ASC
        (2) p.published_rate_cents DESC   (deeper public discount first)
        (3) w.created_at ASC              (earliest-created window first)
        (4) p.created_at ASC
      Fallback: if the candidate set is empty, the bid transitions to REJECTED.
      The winning candidate supplies winning_property_id and winning_rate_window_id.
    precision: "deterministic; no random field may participate in ranking or tie-break"
    note: "ID values are forbidden anywhere in the ranking."

  - name: concealment_discount_pct
    trigger: "OpaqueBid acceptance, recorded on the bid"
    algorithm: aggregation
    formula: |
      winning_property = the selector's winner
      published_total = winning_property.published_rate_cents * nights
      concealment_discount_pct = (published_total - charged_price_cents) / published_total
      where charged_price_cents = bid_price_cents for BID mode, computed_price_cents for FIXED mode.
    precision: "4 decimal places, round_half_up"

  - name: supplier_remittance
    trigger: "Booking creation (provisional) and SettlementBatch approval (final)"
    algorithm: waterfall_allocation
    formula: |
      PROVISIONAL variant (at booking creation, fulfillment CONFIRMED, payment CAPTURED):
        provisional_supplier_remittance_cents = floor(charged_price_cents * (1 - supplier.opaque_commission_pct))
        provisional_platform_commission_cents = charged_price_cents - provisional_supplier_remittance_cents
      FINAL variant (at SettlementBatch DRAFT→APPROVED):
        For SERVICE_FAILED bookings: final_supplier_remittance_cents = 0, final_platform_commission_cents = 0.
        For PARTIALLY_REFUNDED bookings with goodwill_chargeback applicable:
          final_supplier_remittance_cents = floor((charged_price_cents - goodwill_credit_cents) * (1 - supplier.opaque_commission_pct))
          final_platform_commission_cents = (charged_price_cents - goodwill_credit_cents) - final_supplier_remittance_cents
        Otherwise the final values equal the provisional values.
      The two variants differ on exactly the goodwill-chargeback and service-failure paths.
    precision: "integer cents, floor"
    variants:
      - name: provisional
        when: "booking is CONFIRMED/CAPTURED and not yet settled"
        difference: "computed on charged_price_cents with no goodwill deduction"
      - name: final
        when: "booking enters a SettlementBatch that is APPROVED"
        difference: "computed on (charged_price_cents - goodwill_credit_cents) when goodwill_chargeback applies, and forced to 0 on service failure"

  - name: settlement_selection
    trigger: "SettlementBatch creation and re-selection (POST /opaque/settlement-batches and POST /opaque/settlement-batches/{id}/reselect)"
    algorithm: chronological
    formula: |
      eligible bookings =
        all bookings where booking.supplier_id == batch.supplier_id
          AND booking.fulfillment_status == CONFIRMED
          AND booking.check_out_date >= batch.period_start_date
          AND booking.check_out_date <  batch.period_end_date
      Sort by (check_out_date ASC, booking.created_at ASC).
      booking_ids = the sorted id list.
      gross_remittance_cents = sum of PROVISIONAL supplier_remittance_cents over booking_ids
      goodwill_deduction_cents = sum over booking_ids of
          (booking's linked RESOLVED GOODWILL_CREDIT ComplaintCase.goodwill_credit_cents
           when calculation goodwill_chargeback applies to that booking, else 0)
      net_remittance_cents = gross_remittance_cents - goodwill_deduction_cents
    precision: "integer cents"

  - name: goodwill_chargeback
    trigger: "settlement_selection, per booking"
    algorithm: threshold
    formula: |
      For a booking with a RESOLVED GOODWILL_CREDIT complaint:
        ratio = goodwill_credit_cents / booking.charged_price_cents
        chargeback applies IFF ratio > GOODWILL_SUPPLIER_THRESHOLD
      When it applies, the supplier absorbs the goodwill (see supplier_remittance final variant);
      when it does not, the platform absorbs it (supplier_remittance final == provisional).
    constants:
      GOODWILL_SUPPLIER_THRESHOLD: 0.15
    precision: "4 decimal places, round_half_up; comparison is strict >"

  - name: fraud_score_recompute
    trigger: "OpaqueBid acceptance, FraudFlag creation/uphold/dismiss"
    algorithm: decay_function
    formula: |
      On OpaqueBid ACCEPTED:
        opaque_win_count_30d = count of this customer's ACCEPTED bids with created_at in [clock - 30d, clock]
        if opaque_win_count_30d > REPEAT_WIN_THRESHOLD:
          auto-create FraudFlag(reason_code=REPEAT_WIN_RATE, score_delta=REPEAT_WIN_PENALTY, status=OPEN, applied=true)
          fraud_score += REPEAT_WIN_PENALTY
      On manual FraudFlag creation (POST /opaque/fraud-flags): no score change yet (applied=false).
      On FraudFlag UPHELD:    if not applied: fraud_score += score_delta; applied = true
      On FraudFlag DISMISSED: if applied: fraud_score = max(0, fraud_score - score_delta); applied = false
      fraud_status: score >= BLOCKED_THRESHOLD → BLOCKED; score >= WATCH_THRESHOLD → WATCH; else CLEAR
    constants:
      REPEAT_WIN_THRESHOLD: 3
      REPEAT_WIN_PENALTY: 25
      WATCH_THRESHOLD: 20
      BLOCKED_THRESHOLD: 50

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: existence
    check: "Body foreign keys must exist, in the endpoint's input declaration order"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST endpoints that take body FKs (opaque-bids, complaint-cases, settlement-batches, fraud-flags, properties, rate-windows)"
  - priority: 5
    category: state
    check: "Target entity must be in a state that permits this operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints (evaluate, withdraw, close, suspend, reinstate, terminate, start-review, resolve, reject, approve, void, mark-paid, uphold, dismiss, mark-service-failure, grant-goodwill)"
  - priority: 6
    category: business_safety
    check: "Rate-parity protection: a candidate's opaque price must not be publicly attributable to the brand — the disclosure boundary (neighborhood + min star + revealed amenity codes) is enforced, and any request field attempting to narrow disclosure below the zone's declared granularity is rejected"
    error_id: ERR_DISCLOSURE_BOUNDARY_VIOLATION
    http_status: 422
    applies_to: "POST /opaque/opaque-bids"
  - priority: 7
    category: business_safety
    check: "Fraud gate: Customer.fraud_status must not be BLOCKED at bid creation and at evaluation"
    error_id: ERR_CUSTOMER_BLOCKED
    http_status: 403
    applies_to: "POST /opaque/opaque-bids, POST /opaque/opaque-bids/{id}/evaluate"
  - priority: 8
    category: business_temporal
    check: "check_out_date must be strictly after check_in_date; check_in_date must be >= current logical date for new bids"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /opaque/opaque-bids, POST /opaque/rate-windows, POST /opaque/settlement-batches"
  - priority: 9
    category: business_constraint
    check: "Bid mode semantics: BID requires bid_price_cents; FIXED ignores bid_price_cents; amenity filter values must be members of the zone's revealed_amenity_codes"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /opaque/opaque-bids"
  - priority: 10
    category: business_referential
    check: "A ComplaintCase may be created only against an existing Booking owned by the calling customer, and at most one OPEN or UNDER_REVIEW case per booking"
    error_id: ERR_DUPLICATE_COMPLAINT
    http_status: 409
    applies_to: "POST /opaque/complaint-cases"
  - priority: 11
    category: business_fiscal
    check: "BID-mode evaluation: bid_price_cents >= computed_price_cents AND concealment_discount_pct >= concealment_discount_min_pct; otherwise the bid transitions to REJECTED (not an error response — a terminal state)"
    error_id: ERR_BID_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /opaque/opaque-bids/{id}/evaluate (when the caller requests strict evaluation via fail_on_reject=true)"
  - priority: 12
    category: business_fiscal
    check: "Goodwill amount must satisfy 0 < goodwill_credit_cents < booking.charged_price_cents"
    error_id: ERR_INVALID_GOODWILL_AMOUNT
    http_status: 422
    applies_to: "POST /opaque/complaint-cases/{id}/resolve"

