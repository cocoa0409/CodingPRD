            - "LegalAidOrg.${org}.current_week_reserved == 1 (W2 count only; W1's accepted/dispatched referral no longer counts in the new week)"
            - "R2's sla_dispatch_by (created 2026-08-01 + 168h = 2026-08-08T00:00:00Z) was still valid at the W2 dispatch — temporal gate satisfied"

  - rule_id: compensating_invariant
    instances:
      - name: org_slot_compensation_invariant
        grounds:
          - calculations.org_weekly_capacity
          - state_machines.Referral.DISPATCHED_to_DECLINED
          - state_machines.Referral.DISPATCHED_to_ACCEPTED
          - entities.LegalAidOrg.fields.current_week_reserved
        distinguishing_aspect: |
          Conserved quantity: an org's weekly reserved slot count. The forward
          action (dispatch, +1) paired with its compensating action (decline,
          -1) leaves current_week_reserved unchanged at every step:
          0 -> dispatch R1 -> 1 -> decline R1 -> 0 -> dispatch R2 -> 1 ->
          accept R2 -> 1 (ACCEPTED still holds). Invariant pinned as
          current_week_reserved == count(referrals dispatched in the current
          ISO week with status in {DISPATCHED, ACCEPTED}). Different conserved
          quantity than the script-window-continuity instance.
        test_recipe:
          setup:
            - "Clock default (ISO week W1); CA; EVICTION script published; trained counselor; identified caller; org cap 3; STANDARD case IN_PROGRESS; consent granted; referrals R1, R2 PROPOSED"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id, cal_v0: $.data.version } }
            - { call: "POST /hotline/legal-aid-orgs", payload: { name: "LegalAid X", covered_jurisdiction_codes: ["CA"], accepted_categories: ["EVICTION"], weekly_capacity: 3 }, as: AgencyAdmin, captures: { org: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
            - { call: "POST /hotline/cases/${case}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}", captures: { case_v: $.data.version } }
            - { call: "POST /hotline/callers/${cal}/consents", payload: { consent_type: "LEGAL_AID_RELEASE", expected_caller_version: "${cal_v0}" }, as: Caller, as_user_id: "${cal}", captures: { cons: $.data.id } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { ref1: $.data.id } }
            - { call: "GET /hotline/cases/${case}", as: Counselor, as_user_id: "${wk}", captures: { case_v2: $.data.version } }
            - { call: "POST /hotline/cases/${case}/referrals", payload: { referral_type: "LEGAL_AID", legal_aid_org_id: "${org}", expected_case_version: "${case_v2}" }, as: Counselor, as_user_id: "${wk}", captures: { ref2: $.data.id } }
          trigger:
            - { call: "POST /hotline/referrals/${ref1}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { n1: $.data.current_week_reserved } }
            - { call: "POST /hotline/referrals/${ref1}/state", payload: { to_status: "DECLINED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { n2: $.data.current_week_reserved } }
            - { call: "POST /hotline/referrals/${ref2}/state", payload: { to_status: "DISPATCHED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { n3: $.data.current_week_reserved } }
            - { call: "POST /hotline/referrals/${ref2}/state", payload: { to_status: "ACCEPTED" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "GET /hotline/legal-aid-orgs/${org}", as: Counselor, as_user_id: "${wk}", captures: { n4: $.data.current_week_reserved } }
          assert:
            - "After dispatch R1: current_week_reserved == 1; after decline R1: == 0 (dispatch+decline pair nets zero drift)"
            - "After dispatch R2: == 1; after accept R2: == 1 (ACCEPTED keeps holding the slot)"
            - "Every read satisfies the invariant: current_week_reserved == count(referrals of ${org} dispatched in ISO week W1 with status in {DISPATCHED, ACCEPTED})"
            - "Referral.${ref1}.declined_org_ids contains ${org} (re-route exclusion recorded)"

      - name: script_chain_continuity_invariant
        grounds:
          - calculations.script_effective_window
          - state_machines.RightsScript.IN_REVIEW_to_PUBLISHED
          - entities.RightsScript.fields.effective_until
        distinguishing_aspect: |
          Conserved quantity: published-singleton + window continuity per
          (jurisdiction, category) chain. Each publish paired with its
          supersession compensation keeps count(PUBLISHED for the pair) == 1
          and the half-open windows gapless: S1 [08-01, 08-05), S2 [08-05,
          08-07), S3 [08-07, null). Different conserved quantity (temporal
          coverage + uniqueness) than the org slot count.
        test_recipe:
          setup:
            - "CA; author + reviewer counselors; S1 v1 PUBLISHED effective 2026-08-01T00:00:00Z (clock default); clock advanced to 2026-08-05T00:00:00Z for v2 and 2026-08-07T00:00:00Z for v3"
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { s1: $.data.id } }
            - { call: "POST /hotline/scripts/${s1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${s1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 2, body: "script v2", supersedes_script_id: "${s1}" }, as: Counselor, as_user_id: "${auth}", captures: { s2: $.data.id } }
            - { call: "POST /hotline/scripts/${s2}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${s2}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-05T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 3, body: "script v3", supersedes_script_id: "${s2}" }, as: Counselor, as_user_id: "${auth}", captures: { s3: $.data.id } }
            - { call: "POST /hotline/scripts/${s3}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
          trigger:
            - { call: "POST /hotline/scripts/${s3}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-07T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "GET /hotline/scripts/${s1}", as: Counselor, as_user_id: "${rev}", captures: { s1_status: $.data.status, s1_until: $.data.effective_until } }
            - { call: "GET /hotline/scripts/${s2}", as: Counselor, as_user_id: "${rev}", captures: { s2_status: $.data.status, s2_from: $.data.effective_from, s2_until: $.data.effective_until } }
            - { call: "GET /hotline/scripts/${s3}", as: Counselor, as_user_id: "${rev}", captures: { s3_status: $.data.status, s3_from: $.data.effective_from } }
            - { call: "GET /hotline/scripts?jurisdiction_id=${jur}&issue_category=EVICTION&status=PUBLISHED", as: Counselor, as_user_id: "${rev}" }
          assert:
            - "After each publish+supersede pair, the PUBLISHED-filtered list for the pair contains exactly one row (total_count == 1); after the third publish it is Script.${s3}"
            - "Script.${s1}: status SUPERSEDED, effective_until == 2026-08-05T00:00:00Z == Script.${s2}.effective_from"
            - "Script.${s2}: status SUPERSEDED, effective_until == 2026-08-07T00:00:00Z == Script.${s3}.effective_from"
            - "Half-open chain [2026-08-01, 2026-08-05) -> [2026-08-05, 2026-08-07) -> [2026-08-07, null): non-overlapping and gapless — at any instant exactly one window is current"
