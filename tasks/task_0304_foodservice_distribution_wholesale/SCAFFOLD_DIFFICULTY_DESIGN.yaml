        distinguishing_aspect: |
          Return's REQUESTED->APPROVED requires the referenced Order.fulfillment_status == DELIVERED; while the order
          is only SUBMITTED the approve fails ERR_ORDER_NOT_DELIVERED. Entity pair Return->Order (different pair than Order->Customer).
