# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Each grounds in SCAFFOLD.yaml
# §1.1-§1.7 and carries an executable setup_api_calls chain from empty-DB.
# Logical-clock startup default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: enforcement_fine_provisional_vs_final
        grounds:
          - calculations.enforcement_effective_fine
          - calculations.fine_escalation
          - state_machines.Enforcement.HEARING_SCHEDULED_to_REDUCED
          - entities.Enforcement.fields.assessed_fine_cents
          - entities.Enforcement.fields.effective_fine_cents
        distinguishing_aspect: "On the Enforcement domain, assessed_fine_cents (provisional at issuance) stays 15000 while effective_fine_cents (final after a REDUCED hearing at 0.25) becomes 11250 for identical inputs."
        test_recipe:
          setup:
            - "COMMERCIAL policy + property; two substantiated complaints so the second Enforcement is a CITATION with assessed_fine_cents 15000; it is contested and a hearing is scheduled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "1 Loud St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-01T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-02T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-06-02T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf_id: "$.data.id", assessed: "$.data.assessed_fine_cents", tier: "$.data.tier" } }
            - { call: "POST /enforcements/${enf_id}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enf_id}/hearings", payload: { scheduled_at: "2026-06-05T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hear_id: "$.data.id" } }
          trigger:
            - { call: "POST /hearings/${hear_id}/decide", payload: { outcome: "REDUCED", reduction_pct: 0.25 }, as: HearingOfficer, as_user_id: "hof-9" }
          assert:
            - "Enforcement.${enf_id}.assessed_fine_cents == 15000"
            - "Enforcement.${enf_id}.effective_fine_cents == 11250"
            - "Enforcement.${enf_id}.status == REDUCED"

      - name: variance_fee_estimate_vs_final
        grounds:
          - calculations.variance_fee
          - state_machines.VariancePermit.UNDER_REVIEW_to_ISSUED
          - entities.VariancePermit.fields.fee_estimate_cents
          - entities.VariancePermit.fields.fee_final_cents
        distinguishing_aspect: "On the VariancePermit domain, fee_estimate_cents from the requested 10-day window is 30000 while fee_final_cents from the clerk-narrowed 6-day window is 20000."
        test_recipe:
          setup:
            - "A CONSTRUCTION variance requested for a 10-day window; the clerk issues it but narrows the approved window to 6 days."
          setup_api_calls:
            - { call: "POST /properties", payload: { address: "2 Build Rd", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /variance-permits", payload: { property_id: "${prop_id}", permit_type: "CONSTRUCTION", requested_start: "2026-06-01T00:00:00Z", requested_end: "2026-06-11T00:00:00Z", permitted_max_db: 90 }, as: PermitClerk, captures: { var_id: "$.data.id", est: "$.data.fee_estimate_cents" } }
          trigger:
            - { call: "POST /variance-permits/${var_id}/issue", payload: { approved_start: "2026-06-01T00:00:00Z", approved_end: "2026-06-07T00:00:00Z" }, as: PermitClerk }
          assert:
            - "VariancePermit.${var_id}.fee_estimate_cents == 30000"
            - "VariancePermit.${var_id}.fee_final_cents == 20000"
            - "VariancePermit.${var_id}.status == ISSUED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fine_escalation_tiered_nonlinear_mode_a
        grounds:
          - calculations.fine_escalation
          - entities.Enforcement.fields.assessed_fine_cents
          - entities.Enforcement.fields.escalation_level
          - entities.Property.fields.zoning_type
        distinguishing_aspect: "Mode (a): assessed_fine_cents = min(500000, round_half_up(10000 * level * ZONING_FINE_FACTOR * chronic_factor)) — a 3-factor product with tier selection and a min() cap; COMMERCIAL level-1 non-chronic evaluates to 15000."
        test_recipe:
          setup:
            - "COMMERCIAL property with one prior WARNING; second substantiation yields a level-1 CITATION."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "3 Bang Ave", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf1_tier: "$.data.tier", enf1_fine: "$.data.assessed_fine_cents" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf_id: "$.data.id", tier: "$.data.tier", level: "$.data.escalation_level", fine: "$.data.assessed_fine_cents" } }
          assert:
            - "Enforcement.${enf_id}.tier == CITATION"
            - "Enforcement.${enf_id}.escalation_level == 1"
            - "Enforcement.${enf_id}.assessed_fine_cents == 15000"

      - name: late_penalty_round_per_day_then_sum_mode_b
        grounds:
          - calculations.late_penalty
          - entities.Enforcement.fields.late_penalty_cents
          - entities.Enforcement.fields.due_date
        distinguishing_aspect: "Mode (b): per_day = round_half_up(7500 * 0.015) = 113 rounded BEFORE summing; 2 overdue days -> 226 (round-per-day-then-sum), NOT round_half_up(7500*0.015*2)=225 (sum-then-round)."
        test_recipe:
          setup:
            - "INDUSTRIAL level-1 CITATION of 7500 issued at 2026-06-01; clock advanced to 2 days past its 2026-07-01 due date."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /noise-policies", payload: { zoning_type: "INDUSTRIAL", day_limit_db: 75, night_limit_db: 65, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "4 Grind Way", zoning_type: "INDUSTRIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-01T12:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 90, measured_at: "2026-06-01T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-06-01T13:00:00Z", noise_type: "MACHINERY" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 90, measured_at: "2026-06-01T13:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf_id: "$.data.id", fine: "$.data.assessed_fine_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-03T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /enforcements/${enf_id}", payload: {}, as: CodeOfficer, captures: { late: "$.data.late_penalty_cents" } }
          assert:
            - "Enforcement.${enf_id}.effective_fine_cents == 7500"
            - "Enforcement.${enf_id}.late_penalty_cents == 226"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enforcement_appeal_remand_cycle
        grounds:
          - state_machines.Enforcement.HEARING_SCHEDULED_to_CONTESTED
          - state_machines.Enforcement.CONTESTED_to_HEARING_SCHEDULED
          - state_machines.Hearing.PENDING_to_REMANDED
        distinguishing_aspect: "Cyclic on Enforcement: a REMANDED hearing returns status HEARING_SCHEDULED -> CONTESTED, and a fresh hearing re-enters HEARING_SCHEDULED, revisiting a prior state (not a forward-only pipeline)."
        test_recipe:
          setup:
            - "COMMERCIAL level-1 CITATION, contested, first hearing scheduled then REMANDED."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "COMMERCIAL", day_limit_db: 65, night_limit_db: 55, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "5 Echo Ct", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf_id: "$.data.id" } }
            - { call: "POST /enforcements/${enf_id}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enf_id}/hearings", payload: { scheduled_at: "2026-05-20T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hear1: "$.data.id" } }
            - { call: "POST /hearings/${hear1}/decide", payload: { outcome: "REMANDED" }, as: HearingOfficer, as_user_id: "hof-9" }
          trigger:
            - { call: "POST /enforcements/${enf_id}/hearings", payload: { scheduled_at: "2026-05-25T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hear2: "$.data.id" } }
          assert:
            - "After REMAND, Enforcement.${enf_id}.status was CONTESTED"
            - "After re-schedule, Enforcement.${enf_id}.status == HEARING_SCHEDULED"
            - "Hearing.${hear2}.outcome == PENDING"

      - name: property_parallel_chronic_and_abatement_axes
        grounds:
          - state_machines.Property.WATCH_to_DESIGNATED
          - state_machines.Property.UNDER_ABATEMENT_to_ABATED
          - entities.Property.fields.chronic_status
          - entities.Property.fields.abatement_status
        distinguishing_aspect: "Two independent axes on one Property row: after comply, abatement_status == ABATED while chronic_status remains DESIGNATED — the axes move independently."
        test_recipe:
          setup:
            - "RESIDENTIAL property driven to DESIGNATED by 3 substantiations, which auto-creates a PENDING CHRONIC_DESIGNATION AbatementOrder (abatement_status UNDER_ABATEMENT)."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "6 Quiet Ln", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-12T12:00:00Z", noise_type: "ANIMAL" }, as: CodeOfficer, captures: { c3: "$.data.id" } }
            - { call: "POST /complaints/${c3}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c3}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-12T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c3}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "GET /abatement-orders", payload: { property_id: "${prop_id}" }, as: CodeOfficer, captures: { abate_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /abatement-orders/${abate_id}/comply", payload: {}, as: CodeOfficer }
          assert:
            - "Property.${prop_id}.chronic_status == DESIGNATED"
            - "Property.${prop_id}.abatement_status == ABATED"
            - "AbatementOrder.${abate_id}.status == COMPLIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: substantiate_chronic_designation_cascade_depth3
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Property.WATCH_to_DESIGNATED
          - calculations.property_chronic_status
          - entities.AbatementOrder.fields.trigger_source
        distinguishing_aspect: "Depth-3 chain from ONE substantiate: create Enforcement (hop1) -> Property count->3 & chronic DESIGNATED (hop2) -> auto CREATE AbatementOrder(CHRONIC_DESIGNATION) (hop3); each hop caused by the previous."
        test_recipe:
          setup:
            - "RESIDENTIAL property already at WATCH (2 substantiations); a third complaint reviewed and inspected over the limit."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "7 Row St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-12T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c3: "$.data.id" } }
            - { call: "POST /complaints/${c3}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c3}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-12T12:00:00Z" }, as: CodeOfficer }
          trigger:
            - { call: "POST /complaints/${c3}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf3: "$.data.id" } }
          assert:
            - "Property.${prop_id}.substantiated_violation_count == 3"
            - "Property.${prop_id}.chronic_status == DESIGNATED"
            - "Property.${prop_id}.abatement_status == UNDER_ABATEMENT"
            - "GET /abatement-orders?property_id=${prop_id} returns exactly one order with status PENDING and trigger_source CHRONIC_DESIGNATION"

      - name: dismiss_downgrade_vacate_cascade_depth3
        grounds:
          - state_machines.Hearing.PENDING_to_DISMISSED
          - state_machines.Enforcement.HEARING_SCHEDULED_to_DISMISSED
          - state_machines.Property.DESIGNATED_to_WATCH
          - state_machines.AbatementOrder.PENDING_to_VACATED
        distinguishing_aspect: "Depth-3 chain from a DISMISSED hearing (different trigger than substantiate): Enforcement->DISMISSED (hop1) -> Property count->2 & chronic WATCH (hop2) -> the CHRONIC_DESIGNATION AbatementOrder->VACATED & abatement_status NONE (hop3)."
        test_recipe:
          setup:
            - "RESIDENTIAL property at DESIGNATED (3 CITATION-eligible substantiations, level-2 third citation) with an auto CHRONIC_DESIGNATION AbatementOrder; the third enforcement is contested and its hearing scheduled by a different officer."
          setup_api_calls:
            - { call: "POST /noise-policies", payload: { zoning_type: "RESIDENTIAL", day_limit_db: 55, night_limit_db: 45, day_start_hour: 7, night_start_hour: 22 }, as: SystemAdmin }
            - { call: "POST /properties", payload: { address: "8 Row St", zoning_type: "RESIDENTIAL" }, as: CodeOfficer, captures: { prop_id: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-10T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c1: "$.data.id" } }
            - { call: "POST /complaints/${c1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-11T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c2: "$.data.id" } }
            - { call: "POST /complaints/${c2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${prop_id}", reported_at: "2026-05-12T12:00:00Z", noise_type: "VEHICLE" }, as: CodeOfficer, captures: { c3: "$.data.id" } }
            - { call: "POST /complaints/${c3}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${c3}/inspections", payload: { measured_decibel: 70, measured_at: "2026-05-12T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${c3}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enf3: "$.data.id" } }
            - { call: "GET /abatement-orders", payload: { property_id: "${prop_id}" }, as: CodeOfficer, captures: { abate_id: "$.data[0].id" } }
            - { call: "POST /enforcements/${enf3}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enf3}/hearings", payload: { scheduled_at: "2026-05-20T10:00:00Z", hearing_officer_id: "hof-9" }, as: HearingOfficer, captures: { hear3: "$.data.id" } }
          trigger:
            - { call: "POST /hearings/${hear3}/decide", payload: { outcome: "DISMISSED" }, as: HearingOfficer, as_user_id: "hof-9" }
          assert:
            - "Enforcement.${enf3}.status == DISMISSED"
            - "Property.${prop_id}.substantiated_violation_count == 2"
            - "Property.${prop_id}.chronic_status == WATCH"
