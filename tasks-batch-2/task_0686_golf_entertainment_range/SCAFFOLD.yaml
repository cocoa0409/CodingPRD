# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    field: status
    initial_state: HOLD
    terminal_states: [EXPIRED, CANCELLED, NO_SHOW]
    note: "Branching: HOLD forks to CONFIRMED / EXPIRED / CANCELLED; CONFIRMED forks to NO_SHOW / CANCELLED."
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /golf/reservations/{id}/confirm"
        actor: Guest
        preconditions:
          - "Reservation.status == HOLD"
          - "current clock < hold_expires_utc (else the hold is treated as EXPIRED)"
          - "Bay.status != OUT_OF_SERVICE for the reserved bay"
          - "No CONFIRMED Reservation and no SCHEDULED Lesson on the same bay whose [start_utc, end_utc) overlaps this reservation's window"
          - "If pay_source == WALLET: Member.wallet_balance_cents >= quoted_price_cents"
        side_effects:
          - "Create Charge(kind=BAY_RESERVATION, amount_cents=quoted_price_cents, pay_source=Reservation.pay_source, status=SETTLED); set Reservation.charge_id"
          - "If pay_source == WALLET: debit Member.wallet_balance_cents by quoted_price_cents"
          - "Accrue Member.pending_loyalty_points += EARN_PROVISIONAL(quoted_price_cents) [bay-reservation provisional earn]"
          - "increments Reservation.version by 1"

      - from: HOLD
        to: EXPIRED
        trigger: "POST /golf/venues/{venue_id}/sweep_holds (system sweep) — any HOLD whose hold_expires_utc <= current clock"
        actor: system
        preconditions:
          - "Reservation.status == HOLD"
          - "hold_expires_utc <= current clock"
        side_effects:
          - "No charge; the bay window is released"
          - "increments Reservation.version by 1"

      - from: HOLD
        to: CANCELLED
        trigger: "POST /golf/reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "Reservation.status == HOLD"
        side_effects:
          - "No charge existed; nothing to reverse"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /golf/reservations/{id}/cancel"
        actor: Guest
        preconditions:
          - "Reservation.status == CONFIRMED"
        side_effects:
          - "If current clock <= start_utc - LATE_CANCEL_WINDOW_MINUTES: full reversal — Charge.status=REVERSED, and if pay_source==WALLET credit Member.wallet_balance_cents back by amount_cents; reverse pending loyalty (Member.pending_loyalty_points -= the provisional earn); no_show_fee_cents stays 0"
          - "Else (late cancel, current clock > start_utc - LATE_CANCEL_WINDOW_MINUTES): set no_show_fee_cents = NO_SHOW_FEE(quoted_price_cents); reverse the original bay charge then create Charge(kind=NO_SHOW_FEE, amount_cents=no_show_fee_cents); net wallet effect debits the fee; reverse pending loyalty"
          - "increments Reservation.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /golf/venues/{venue_id}/sweep_holds (system sweep) — CONFIRMED reservation whose end_utc <= current clock with no realizing GameSession"
        actor: system
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "end_utc <= current clock"
          - "No GameSession has reservation_id == this Reservation.id"
        side_effects:
          - "Set no_show_fee_cents = NO_SHOW_FEE(quoted_price_cents); the bay charge is retained, an additional Charge(kind=NO_SHOW_FEE) is NOT created (the retained bay charge IS the penalty); reverse pending loyalty (provisional earn never confirms)"
          - "increments Reservation.version by 1"

  - entity: GameSession
    field: play_status
    initial_state: OPEN
    terminal_states: [ENDED]
    note: "Parallel dimensions — play_status (OPEN/ENDED) and billing_status (UNBILLED/CHARGED/VOID) evolve independently on the same GameSession row."
    transitions:
      - from: OPEN
        to: ENDED
        trigger: "POST /golf/sessions/{id}/end"
        actor: FrontDesk
        preconditions:
          - "GameSession.play_status == OPEN"
        side_effects:
          - "Recompute total_score one final time (SCORING)"
          - "Set occupied Bay.status = AVAILABLE and Bay.current_session_id = null"
          - "Confirm loyalty: move provisional → confirmed via EARN_FINAL (Member.loyalty_points += EARN_FINAL(net), Member.pending_loyalty_points -= the matching provisional earn)"
          - "increments GameSession.version by 1"

  - entity: GameSession
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [CHARGED, VOID]
    note: "Independent billing axis on the same GameSession row; CHARGED and VOID are mutually exclusive terminals."
    transitions:
      - from: UNBILLED
        to: CHARGED
        trigger: "POST /golf/sessions/{id}/settle"
        actor: FrontDesk
        preconditions:
          - "GameSession.billing_status == UNBILLED"
          - "GameSession.play_status == ENDED"
          - "Any attached FBTab is CLOSED"
        side_effects:
          - "Create Charge(kind=SESSION_SETTLEMENT, amount_cents = session walk-in bay fee + closed FBTab.total_cents, pay_source per request); set GameSession.charge_id"
          - "If pay_source==WALLET: debit Member.wallet_balance_cents by amount_cents"
          - "increments GameSession.version by 1"

      - from: UNBILLED
        to: VOID
        trigger: "POST /golf/sessions/{id}/void"
        actor: RangeManager
        preconditions:
          - "GameSession.billing_status == UNBILLED"
        side_effects:
          - "Reverse any confirmed loyalty earned for this session at end (Member.loyalty_points -= EARN_FINAL(net)); reverse outstanding pending provisional earn"
          - "increments GameSession.version by 1"

  - entity: EventPackage
    field: status
    initial_state: QUOTED
    terminal_states: [SETTLED, CANCELLED]
    note: "Cyclic revision loop QUOTED→NEGOTIATING→QUOTED before confirmation."
    transitions:
      - from: QUOTED
        to: NEGOTIATING
        trigger: "POST /golf/event-packages/{id}/negotiate"
        actor: RangeManager
        preconditions:
          - "EventPackage.status == QUOTED"
        side_effects:
          - "increments EventPackage.version by 1"

      - from: NEGOTIATING
        to: QUOTED
        trigger: "PATCH /golf/event-packages/{id}"
        actor: RangeManager
        preconditions:
          - "EventPackage.status == NEGOTIATING"
        side_effects:
          - "Recompute estimated_total_cents from updated headcount_estimate / per_head_package_cents / bay_block_cents (EVENT_PRICING provisional variant)"
          - "increments EventPackage.version by 1"

      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /golf/event-packages/{id}/confirm"
        actor: RangeManager
        preconditions:
          - "EventPackage.status == QUOTED"
          - "deposit_cents <= Member(organizer).wallet_balance_cents"
        side_effects:
          - "Debit organizer Member.wallet_balance_cents by deposit_cents (held as deposit)"
          - "increments EventPackage.version by 1"

      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /golf/event-packages/{id}/settle"
        actor: RangeManager
        preconditions:
          - "EventPackage.status == CONFIRMED"
          - "All FBTab rows with event_package_id == this id are CLOSED"
        side_effects:
          - "Set actual_attendee_count from request; compute final_total_cents (EVENT_PRICING settled variant including F&B overage)"
          - "Apply deposit via DEPOSIT_WATERFALL across bay_block, per-head, then F&B; create Charge(kind=EVENT_SETTLEMENT, amount_cents = final_total_cents - deposit_applied) for organizer"
          - "Credit organizer Member.wallet_balance_cents by deposit_refund_cents (waterfall remainder)"
          - "increments EventPackage.version by 1"

      - from: [QUOTED, NEGOTIATING, CONFIRMED]
        to: CANCELLED
        trigger: "POST /golf/event-packages/{id}/cancel"
        actor: RangeManager
        preconditions:
          - "EventPackage.status IN {QUOTED, NEGOTIATING, CONFIRMED}"
        side_effects:
          - "If status was CONFIRMED: credit organizer Member.wallet_balance_cents back by deposit_cents (full deposit reversal)"
          - "increments EventPackage.version by 1"

  - entity: QueueTicket
    field: status
    initial_state: WAITING
    terminal_states: [SEATED, CANCELLED, EXPIRED]
    note: "Walk-in queue; seating consumes a game-card credit and occupies a bay."
    transitions:
      - from: WAITING
        to: SEATED
        trigger: "POST /golf/venues/{venue_id}/seat_next"
        actor: FrontDesk
        preconditions:
          - "QueueTicket.status == WAITING"
          - "This ticket is the lowest-position WAITING ticket (position == 1) at the venue"
          - "At least one Bay at the venue has status == AVAILABLE"
          - "If game_card_id is set: GameCard.status == ACTIVE and GameCard.credits_remaining >= 1"
        side_effects:
          - "Select the AVAILABLE Bay with the lowest floor_level, tie-broken by created_at ASC; set Bay.status = OCCUPIED"
          - "If game_card_id set: decrement GameCard.credits_remaining by 1; if it reaches 0 set GameCard.status = DEPLETED"
          - "Create a walk-in GameSession on the assigned bay (play_status=OPEN, billing_status=UNBILLED), set Bay.current_session_id and QueueTicket.assigned_bay_id"
          - "increments QueueTicket.version by 1"

      - from: WAITING
        to: CANCELLED
        trigger: "POST /golf/queue-tickets/{id}/cancel"
        actor: Guest
        preconditions:
          - "QueueTicket.status == WAITING"
        side_effects:
          - "increments QueueTicket.version by 1"

      - from: WAITING
        to: EXPIRED
        trigger: "POST /golf/venues/{venue_id}/sweep_holds (system sweep) — WAITING ticket older than QUEUE_TTL_MINUTES"
        actor: system
        preconditions:
          - "QueueTicket.status == WAITING"
          - "created_at + QUEUE_TTL_MINUTES <= current clock"
        side_effects:
          - "increments QueueTicket.version by 1"

  - entity: FBTab
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /golf/fb-tabs/{id}/close"
        actor: FrontDesk
        preconditions:
          - "FBTab.status == OPEN"
        side_effects:
          - "Freeze subtotal_cents/gratuity_cents/tax_cents/total_cents (FB_TAB_TOTAL); the totals stop responding to line-item appends"
          - "increments FBTab.version by 1"

  - entity: Lesson
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /golf/lessons/{id}/complete"
        actor: FrontDesk
        preconditions:
          - "Lesson.status == SCHEDULED"
        side_effects:
          - "increments Lesson.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /golf/lessons/{id}/cancel"
        actor: Guest
        preconditions:
          - "Lesson.status == SCHEDULED"
        side_effects:
          - "increments Lesson.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-confirm-stale-bay
    parent_entity: Bay
    write_endpoint: "POST /golf/reservations/{id}/confirm"
    occ_field: "expected_bay_version"
    description: |
      Confirming a Reservation against a Bay whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      bay window has just been claimed by another confirmation (which legitimately
      occupies the same [start_utc, end_utc) span and bumps Bay.version), so the
      current writer's view of the bay is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: queue-seat-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /golf/venues/{venue_id}/seat_next"
    occ_field: "expected_venue_version"
    description: |
      Seating the next walk-in ticket against a Venue whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another seat_next has just consumed an AVAILABLE bay (legitimately advancing
      the venue's available_bay_count and Venue.version), so the operator's view
      of venue capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: DYNAMIC_BAY_PRICE
    trigger: "Reservation HOLD creation (POST /golf/reservations)"
    algorithm: tiered_pricing
    formula: |
      num_segments = (end_utc - start_utc) in minutes / 30        # whole number, validated
      band_mult    = TWILIGHT:0.80 | OFFPEAK:1.00 | PEAK:1.60      # by Reservation.time_band
      day_factor   = WEEKDAY:1.00 | WEEKEND:1.25                   # by Reservation.day_type
      raw_mult     = band_mult * day_factor * Venue.peak_demand_factor
      eff_mult     = max(0.80, min(2.00, raw_mult))                # clamped, 3-input non-linear
      # ROUND_TOTAL order is PINNED: multiply the whole block once, round once.
      gross_cents  = round_half_up( base_rate_cents_per_half_hour * num_segments * eff_mult )
      discount_pct = STANDARD:0.00 | GOLD:0.10 | PLATINUM:0.15     # by Member.tier
      discount     = round_half_up( gross_cents * discount_pct )
      quoted_price_cents = gross_cents - discount                 # net, never negative
    input_set: "Single Reservation + its Member.tier + its Venue.base_rate_cents_per_half_hour and peak_demand_factor"
    constants:
      BAND_TWILIGHT: 0.80
      BAND_OFFPEAK: 1.00
      BAND_PEAK: 1.60
      DAY_WEEKDAY: 1.00
      DAY_WEEKEND: 1.25
      MULT_FLOOR: 0.80
      MULT_CEIL: 2.00
      TIER_STANDARD_DISCOUNT: 0.00
      TIER_GOLD_DISCOUNT: 0.10
      TIER_PLATINUM_DISCOUNT: 0.15
    precision: "integer cents, round_half_up; ROUND_TOTAL (round once on the whole product, not per segment)"

  - name: FB_TAB_TOTAL
    trigger: "FBTab line-item append (POST /golf/fb-tabs/{id}/items) and freeze at FBTab close"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum( item.unit_price_cents * item.qty for item in line_items )
      # PINNED ORDER (nested rounding): gratuity is computed and rounded on the FULL subtotal,
      # then tax is computed on (subtotal + rounded gratuity) and rounded. NOT per-line-item.
      gratuity_cents = round_half_up( subtotal_cents * GRATUITY_PCT )
      tax_cents      = round_half_up( (subtotal_cents + gratuity_cents) * TAX_PCT )
      total_cents    = subtotal_cents + gratuity_cents + tax_cents
    input_set: "All line_items on the FBTab"
    constants:
      GRATUITY_PCT: 0.18
      TAX_PCT: 0.0825
    precision: "integer cents, round_half_up; gratuity rounded BEFORE tax is computed (sum-then-charge order pinned)"

  - name: EVENT_PRICING
    trigger: "EventPackage create/recompute (provisional) and EventPackage settle (final)"
    algorithm: forward_looking
    formula: |
      estimated_total_cents = headcount_estimate * per_head_package_cents + bay_block_cents
    input_set: "EventPackage fields; final variant additionally sums CLOSED FBTab.total_cents for the event"
    constants: {}
    precision: "integer cents (no rounding; integer arithmetic)"
    variants:
      - name: PROVISIONAL
        when: "EventPackage QUOTED/NEGOTIATING/CONFIRMED — before settlement"
        difference: "Uses headcount_estimate; excludes any F&B; written to estimated_total_cents"
      - name: SETTLED
        when: "EventPackage settle transition (CONFIRMED→SETTLED)"
        difference: "final_total_cents = actual_attendee_count * per_head_package_cents + bay_block_cents + sum(CLOSED FBTab.total_cents for event); uses actual count, includes F&B overage"

  - name: LOYALTY_EARN
    trigger: "Bay reservation confirm / session settle (provisional) and session end (final)"
    algorithm: threshold
    formula: |
      EARN_PROVISIONAL(net_cents) = floor( net_cents / POINTS_PER_CENT_DIVISOR )         # 1 pt per 100 cents, tier-agnostic
      EARN_FINAL(net_cents)       = floor( (net_cents / POINTS_PER_CENT_DIVISOR) * tier_multiplier )
      tier_multiplier = STANDARD:1.0 | GOLD:1.25 | PLATINUM:1.5
    input_set: "Per-charge net cents + Member.tier"
    constants:
      POINTS_PER_CENT_DIVISOR: 100
      TIER_MULT_STANDARD: 1.0
      TIER_MULT_GOLD: 1.25
      TIER_MULT_PLATINUM: 1.5
    precision: "integer points, floor"
    variants:
      - name: EARN_PROVISIONAL
        when: "At charge time — accrued to Member.pending_loyalty_points"
        difference: "tier-agnostic floor(net/100); reversible"
      - name: EARN_FINAL
        when: "At GameSession end — confirmed into Member.loyalty_points"
        difference: "applies tier_multiplier then floors; pending is cleared"

  - name: DEPOSIT_WATERFALL
    trigger: "EventPackage settle (CONFIRMED→SETTLED)"
    algorithm: waterfall_allocation
    formula: |
      remaining = deposit_cents
      buckets in PINNED order: [bay_block_cents, actual_attendee_count*per_head_package_cents, event_fb_total_cents]
      for each bucket b in order:
        applied_b  = min(remaining, b)
        remaining -= applied_b
      deposit_applied  = deposit_cents - remaining
      deposit_refund_cents = remaining               # overflow returned to organizer wallet
    input_set: "EventPackage at settlement: deposit_cents, bay_block_cents, actual_attendee_count*per_head_package_cents, sum CLOSED FBTab.total_cents"
    constants: {}
    precision: "integer cents; bucket order is fixed (bay block → per-head → F&B), remainder is the refund"

  - name: SCORING
    trigger: "GameSession shot append (POST /golf/sessions/{id}/shots) and at session end"
    algorithm: aggregation
    formula: |
      base = sum( shot.points for shot in shots )
      # streak bonus: STREAK_BONUS awarded ONCE if there exists any run of >= STREAK_LEN
      # consecutive shots each with points >= STREAK_MIN_POINTS (by shot seq order)
      bonus = STREAK_BONUS if (a qualifying run exists) else 0
      total_score = base + bonus
      shot_count  = len(shots)
    input_set: "All shots on the GameSession, in seq order"
    constants:
      STREAK_LEN: 5
      STREAK_MIN_POINTS: 10
      STREAK_BONUS: 25
    precision: "integer points; bonus applied at most once per session"

  - name: NO_SHOW_FEE
    trigger: "Reservation late-cancel (CONFIRMED→CANCELLED late path) and NO_SHOW sweep"
    algorithm: threshold
    formula: |
      no_show_fee_cents = round_half_up( quoted_price_cents * NO_SHOW_PCT )
    input_set: "Single Reservation.quoted_price_cents"
    constants:
      NO_SHOW_PCT: 0.50
      LATE_CANCEL_WINDOW_MINUTES: 120
    precision: "integer cents, round_half_up; LATE boundary is strict — a cancel exactly at start_utc - 120min is on-time (no fee), one minute later is late (fee)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed Guest acting on own resource, X-User-ID equals the resource's member_id / organizer_member_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Guest-owned reservation/queue/lesson/event mutations"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, end_utc > start_utc, window spans whole 30-min segments, within venue open/close minutes"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create + mutate endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Reservation/Lesson window does not overlap an existing CONFIRMED Reservation or SCHEDULED Lesson on the same bay (half-open [start,end), back-to-back allowed)"
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /golf/reservations, POST /golf/reservations/{id}/confirm, POST /golf/lessons"

  - priority: 8
    category: business_safety
    check: "Bay is not OUT_OF_SERVICE for confirm/seat/lesson operations; lesson kind capacity (PRIVATE_LESSON/SIMULATOR seats==1)"
    error_id: ERR_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "confirm, seat_next, lesson create"

  - priority: 9
    category: business_constraint
    check: "Walk-in seating requires an AVAILABLE bay and (if card-paid) an ACTIVE GameCard with credits_remaining >= 1"
    error_id: ERR_NO_BAY_AVAILABLE
    http_status: 409
    applies_to: "POST /golf/venues/{venue_id}/seat_next"

  - priority: 10
    category: business_referential
    check: "seat_next is only valid for the lowest-position (position==1) WAITING ticket"
    error_id: ERR_NOT_QUEUE_HEAD
    http_status: 409
    applies_to: "POST /golf/venues/{venue_id}/seat_next"

  - priority: 11
    category: business_constraint
    check: "GameCard has at least 1 remaining credit when consumed at seating"
    error_id: ERR_CARD_DEPLETED
    http_status: 409
    applies_to: "POST /golf/venues/{venue_id}/seat_next"

  - priority: 12
    category: business_fiscal
    check: "Funding source has sufficient balance: WALLET reservation/settlement/deposit requires wallet_balance_cents >= amount; gift-card redemption requires remaining_cents >= amount"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "confirm (WALLET), session settle (WALLET), event confirm deposit, gift-card redeem"

  - priority: 13
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /golf/reservations/{id}/confirm, POST /golf/venues/{venue_id}/seat_next"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Venue ----
  - method: POST
    path: "/golf/venues"
    description: "Create a venue; bays are created separately."
    roles: [RangeManager]
    code: 201
    input: [name, bay_count, "open_minute_of_day?", "close_minute_of_day?", "base_rate_cents_per_half_hour?", "peak_demand_factor?"]
    output: Venue
    side_effects: ["status counters initialized; version=1"]

  - method: GET
    path: "/golf/venues/{venue_id}"
    description: "Get a venue with computed open_queue_length and available_bay_count."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/golf/venues"
    description: "List venues (paginated)."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: POST
    path: "/golf/venues/{venue_id}/seat_next"
    description: "Seat the head (position 1) WAITING walk-in ticket onto an AVAILABLE bay. OCC-guarded on Venue.version."
    roles: [FrontDesk]
    code: 200
    input: [expected_venue_version]
    output: QueueTicket
    side_effects:
      - "Head WAITING ticket → SEATED; selects AVAILABLE bay lowest floor_level then created_at ASC → OCCUPIED"
      - "Consumes 1 GameCard credit if game_card_id set (may flip card to DEPLETED)"
      - "Creates walk-in GameSession; increments Venue.version by 1"

  - method: POST
    path: "/golf/venues/{venue_id}/sweep_holds"
    description: "System sweep: expire stale HOLD reservations, EXPIRE stale WAITING tickets, mark CONFIRMED-but-unplayed reservations NO_SHOW. Idempotent per clock."
    roles: [RangeManager]
    code: 200
    input: []
    output: Venue
    side_effects:
      - "HOLD with hold_expires_utc <= clock → EXPIRED"
      - "WAITING with created_at + QUEUE_TTL_MINUTES <= clock → EXPIRED"
      - "CONFIRMED with end_utc <= clock and no realizing GameSession → NO_SHOW (sets no_show_fee_cents)"

  # ---- Bay ----
  - method: POST
    path: "/golf/bays"
    description: "Create a bay under a venue."
    roles: [RangeManager]
    code: 201
    input: [venue_id, label, "floor_level?", "has_target_tech?"]
    output: Bay
    side_effects: ["status=AVAILABLE; version=1"]

  - method: GET
    path: "/golf/bays/{bay_id}"
    description: "Get a bay."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Bay
    side_effects: []

  - method: GET
    path: "/golf/bays"
    description: "List bays, filterable by venue_id or current_session_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["venue_id?", "current_session_id?", "limit?", "offset?"]
    output: Bay[]
    side_effects: ["current_session_id filter is the reverse lookup for Bay.current_session_id"]

  - method: POST
    path: "/golf/bays/{bay_id}/out_of_service"
    description: "Mark a bay OUT_OF_SERVICE (maintenance)."
    roles: [RangeManager]
    code: 200
    input: [expected_bay_version]
    output: Bay
    side_effects: ["Bay.status=OUT_OF_SERVICE; increments Bay.version by 1"]

  # ---- Member ----
  - method: POST
    path: "/golf/members"
    description: "Register a member."
    roles: [Guest, FrontDesk, RangeManager]
    code: 201
    input: [email, full_name, "tier?"]
    output: Member
    side_effects: ["wallet_balance_cents=0, loyalty_points=0, pending_loyalty_points=0; version=1"]

  - method: GET
    path: "/golf/members/{member_id}"
    description: "Get a member with wallet and loyalty balances."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/golf/members/{member_id}/wallet/topup"
    description: "Add stored value to a member's wallet (operator top-up or member self-load)."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["wallet_balance_cents += amount_cents; increments Member.version by 1"]

  # ---- GameCard ----
  - method: POST
    path: "/golf/game-cards"
    description: "Purchase a game-card (bay-turn credit punch card) for a member."
    roles: [Guest, FrontDesk, RangeManager]
    code: 201
    input: [member_id, credits_total]
    output: GameCard
    side_effects: ["credits_remaining=credits_total, status=ACTIVE; version=1"]

  - method: GET
    path: "/golf/game-cards/{card_id}"
    description: "Get a game-card."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: GameCard
    side_effects: []

  - method: GET
    path: "/golf/game-cards"
    description: "List game-cards, filterable by member_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: GameCard[]
    side_effects: []

  # ---- GiftCard ----
  - method: POST
    path: "/golf/gift-cards"
    description: "Issue a gift card with a face value."
    roles: [Guest, FrontDesk, RangeManager]
    code: 201
    input: [face_value_cents]
    output: GiftCard
    side_effects: ["remaining_cents=face_value_cents, redeemed_total_cents=0, status=ISSUED"]

  - method: GET
    path: "/golf/gift-cards/{gift_card_id}"
    description: "Get a gift card."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: GiftCard
    side_effects: []

  - method: POST
    path: "/golf/gift-cards/{gift_card_id}/redeem"
    description: "Redeem part or all of a gift card's value onto a member's wallet."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: [member_id, amount_cents]
    output: GiftCard
    side_effects:
      - "remaining_cents -= amount_cents; redeemed_total_cents += amount_cents"
      - "credit target Member.wallet_balance_cents += amount_cents (Member.version +1)"
      - "if remaining_cents reaches 0 → status=DEPLETED"

  # ---- Reservation ----
  - method: POST
    path: "/golf/reservations"
    description: "Create a HOLD reservation for a bay window; computes the dynamic quoted price."
    roles: [Guest, FrontDesk]
    code: 201
    input: [venue_id, bay_id, member_id, start_utc, end_utc, time_band, "day_type?", "pay_source?"]
    output: Reservation
    side_effects:
      - "status=HOLD; quoted_price_cents = DYNAMIC_BAY_PRICE; hold_expires_utc = clock + HOLD_TTL_MINUTES"
      - "Rejected if window overlaps a CONFIRMED reservation or SCHEDULED lesson on the bay"

  - method: GET
    path: "/golf/reservations/{reservation_id}"
    description: "Get a reservation."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/golf/reservations"
    description: "List reservations, filterable by venue_id, bay_id, member_id, or charge_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["venue_id?", "bay_id?", "member_id?", "charge_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: ["charge_id filter is the reverse lookup for Reservation.charge_id"]

  - method: POST
    path: "/golf/reservations/{reservation_id}/confirm"
    description: "Confirm a HOLD reservation; charges the quote and accrues provisional loyalty. OCC-guarded on Bay.version."
    roles: [Guest, FrontDesk]
    code: 200
    input: [expected_bay_version, "pay_source?"]
    output: Reservation
    side_effects:
      - "status HOLD→CONFIRMED; creates BAY_RESERVATION Charge; debits wallet if WALLET; pending loyalty accrues"
      - "increments Bay.version by 1"

  - method: POST
    path: "/golf/reservations/{reservation_id}/cancel"
    description: "Cancel a HOLD or CONFIRMED reservation; late CONFIRMED cancel incurs no-show fee."
    roles: [Guest, FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "HOLD→CANCELLED (no charge); CONFIRMED→CANCELLED reverses charge (on-time) or applies NO_SHOW_FEE (late)"

  # ---- GameSession ----
  - method: POST
    path: "/golf/sessions"
    description: "Start a GameSession on a bay (from a confirmed reservation or directly)."
    roles: [FrontDesk]
    code: 201
    input: [bay_id, member_id, "reservation_id?"]
    output: GameSession
    side_effects:
      - "play_status=OPEN, billing_status=UNBILLED; Bay.status=OCCUPIED, Bay.current_session_id set"
      - "If reservation_id set: that Reservation must be CONFIRMED"

  - method: GET
    path: "/golf/sessions/{session_id}"
    description: "Get a session with total_score and shots."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: GameSession
    side_effects: []

  - method: GET
    path: "/golf/sessions"
    description: "List sessions, filterable by bay_id, member_id, reservation_id, queue_ticket_id, or charge_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["bay_id?", "member_id?", "reservation_id?", "queue_ticket_id?", "charge_id?", "limit?", "offset?"]
    output: GameSession[]
    side_effects: ["charge_id filter is the reverse lookup for GameSession.charge_id"]

  - method: POST
    path: "/golf/sessions/{session_id}/shots"
    description: "Record a shot; recomputes total_score (SCORING)."
    roles: [FrontDesk]
    code: 200
    input: [points]
    output: GameSession
    side_effects: ["append shot; total_score and shot_count recomputed"]

  - method: POST
    path: "/golf/sessions/{session_id}/end"
    description: "End play; frees the bay and confirms loyalty (EARN_FINAL)."
    roles: [FrontDesk]
    code: 200
    input: []
    output: GameSession
    side_effects:
      - "play_status OPEN→ENDED; Bay.status=AVAILABLE, current_session_id=null"
      - "Member.loyalty_points += EARN_FINAL; pending provisional cleared"

  - method: POST
    path: "/golf/sessions/{session_id}/settle"
    description: "Settle the session billing (walk-in bay fee + closed F&B tab)."
    roles: [FrontDesk]
    code: 200
    input: ["pay_source?"]
    output: GameSession
    side_effects:
      - "billing_status UNBILLED→CHARGED; creates SESSION_SETTLEMENT Charge; debits wallet if WALLET"

  - method: POST
    path: "/golf/sessions/{session_id}/void"
    description: "Void session billing; reverses any confirmed loyalty for this session."
    roles: [RangeManager]
    code: 200
    input: []
    output: GameSession
    side_effects: ["billing_status UNBILLED→VOID; reverse EARN_FINAL and outstanding provisional loyalty"]

  # ---- EventPackage ----
  - method: POST
    path: "/golf/event-packages"
    description: "Quote a group/corporate event package."
    roles: [Guest, RangeManager]
    code: 201
    input: [venue_id, organizer_member_id, headcount_estimate, per_head_package_cents, "bay_block_cents?", "deposit_cents?"]
    output: EventPackage
    side_effects: ["status=QUOTED; estimated_total_cents = EVENT_PRICING(PROVISIONAL)"]

  - method: GET
    path: "/golf/event-packages/{event_package_id}"
    description: "Get an event package."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: EventPackage
    side_effects: []

  - method: GET
    path: "/golf/event-packages"
    description: "List event packages, filterable by venue_id or organizer_member_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["venue_id?", "organizer_member_id?", "limit?", "offset?"]
    output: EventPackage[]
    side_effects: []

  - method: PATCH
    path: "/golf/event-packages/{event_package_id}"
    description: "Revise a NEGOTIATING package's headcount/pricing; returns it to QUOTED and recomputes the estimate."
    roles: [RangeManager]
    code: 200
    input: ["headcount_estimate?", "per_head_package_cents?", "bay_block_cents?", "deposit_cents?"]
    output: EventPackage
    side_effects: ["status NEGOTIATING→QUOTED; estimated_total_cents recomputed"]

  - method: POST
    path: "/golf/event-packages/{event_package_id}/negotiate"
    description: "Move a QUOTED package into NEGOTIATING (revision loop)."
    roles: [RangeManager]
    code: 200
    input: []
    output: EventPackage
    side_effects: ["status QUOTED→NEGOTIATING"]

  - method: POST
    path: "/golf/event-packages/{event_package_id}/confirm"
    description: "Confirm a QUOTED package; collects the deposit from organizer wallet."
    roles: [RangeManager]
    code: 200
    input: []
    output: EventPackage
    side_effects: ["status QUOTED→CONFIRMED; debit organizer wallet by deposit_cents"]

  - method: POST
    path: "/golf/event-packages/{event_package_id}/settle"
    description: "Settle a CONFIRMED package; computes the final total, applies deposit waterfall, refunds overflow."
    roles: [RangeManager]
    code: 200
    input: [actual_attendee_count]
    output: EventPackage
    side_effects:
      - "status CONFIRMED→SETTLED; final_total_cents = EVENT_PRICING(SETTLED); DEPOSIT_WATERFALL applied"
      - "EVENT_SETTLEMENT Charge created; deposit_refund_cents credited to organizer wallet"

  - method: POST
    path: "/golf/event-packages/{event_package_id}/cancel"
    description: "Cancel a package; reverses deposit if it was CONFIRMED."
    roles: [RangeManager]
    code: 200
    input: []
    output: EventPackage
    side_effects: ["status→CANCELLED; if was CONFIRMED, refund deposit_cents to organizer wallet"]

  # ---- FBTab ----
  - method: POST
    path: "/golf/fb-tabs"
    description: "Open a food-and-beverage tab on a session or an event package."
    roles: [FrontDesk]
    code: 201
    input: ["session_id?", "event_package_id?"]
    output: FBTab
    side_effects: ["status=OPEN; all totals 0"]

  - method: GET
    path: "/golf/fb-tabs/{fb_tab_id}"
    description: "Get an F&B tab with computed totals."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: FBTab
    side_effects: []

  - method: GET
    path: "/golf/fb-tabs"
    description: "List F&B tabs, filterable by session_id or event_package_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["session_id?", "event_package_id?", "limit?", "offset?"]
    output: FBTab[]
    side_effects: []

  - method: POST
    path: "/golf/fb-tabs/{fb_tab_id}/items"
    description: "Append a line item; recomputes subtotal/gratuity/tax/total (FB_TAB_TOTAL)."
    roles: [FrontDesk]
    code: 200
    input: [name, unit_price_cents, "qty?"]
    output: FBTab
    side_effects: ["append line item; totals recomputed"]

  - method: POST
    path: "/golf/fb-tabs/{fb_tab_id}/close"
    description: "Close a tab, freezing its totals so it can be settled."
    roles: [FrontDesk]
    code: 200
    input: []
    output: FBTab
    side_effects: ["status OPEN→CLOSED; totals frozen"]

  # ---- QueueTicket ----
  - method: POST
    path: "/golf/queue-tickets"
    description: "Take a walk-in queue ticket at a venue."
    roles: [Guest, FrontDesk]
    code: 201
    input: [venue_id, member_id, "game_card_id?", "party_size?"]
    output: QueueTicket
    side_effects: ["status=WAITING; position computed from created_at ASC among WAITING tickets"]

  - method: GET
    path: "/golf/queue-tickets/{queue_ticket_id}"
    description: "Get a queue ticket with its current position."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: QueueTicket
    side_effects: []

  - method: GET
    path: "/golf/queue-tickets"
    description: "List queue tickets, filterable by venue_id, member_id, game_card_id, or assigned_bay_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["venue_id?", "member_id?", "game_card_id?", "assigned_bay_id?", "limit?", "offset?"]
    output: QueueTicket[]
    side_effects: ["assigned_bay_id filter is the reverse lookup for QueueTicket.assigned_bay_id"]

  - method: POST
    path: "/golf/queue-tickets/{queue_ticket_id}/cancel"
    description: "Cancel a WAITING queue ticket."
    roles: [Guest, FrontDesk]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status WAITING→CANCELLED"]

  # ---- Lesson ----
  - method: POST
    path: "/golf/lessons"
    description: "Schedule a lesson, clinic, or simulator booking on a bay window."
    roles: [Guest, FrontDesk]
    code: 201
    input: [venue_id, bay_id, member_id, kind, start_utc, end_utc, "seats?"]
    output: Lesson
    side_effects:
      - "status=SCHEDULED; rejected if window overlaps a CONFIRMED reservation or SCHEDULED lesson on the bay"

  - method: GET
    path: "/golf/lessons/{lesson_id}"
    description: "Get a lesson."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Lesson
    side_effects: []

  - method: GET
    path: "/golf/lessons"
    description: "List lessons, filterable by venue_id, bay_id, or member_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["venue_id?", "bay_id?", "member_id?", "limit?", "offset?"]
    output: Lesson[]
    side_effects: []

  - method: POST
    path: "/golf/lessons/{lesson_id}/complete"
    description: "Mark a lesson completed."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Lesson
    side_effects: ["status SCHEDULED→COMPLETED"]

  - method: POST
    path: "/golf/lessons/{lesson_id}/cancel"
    description: "Cancel a scheduled lesson."
    roles: [Guest, FrontDesk]
    code: 200
    input: []
    output: Lesson
    side_effects: ["status SCHEDULED→CANCELLED"]

  # ---- Charge (read) ----
  - method: GET
    path: "/golf/charges/{charge_id}"
    description: "Get a charge ledger entry."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: GET
    path: "/golf/charges"
    description: "List charges, filterable by member_id."
    roles: [Guest, FrontDesk, RangeManager]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Charge[]
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/golf/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-04-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time. Drives hold expiry, late-cancel windows, no-show sweeps, and queue TTL deterministically."
    roles: [RangeManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Guest X-User-ID does not own the targeted member-scoped resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing field, bad enum, end_utc<=start_utc, non-30-min span, or window outside venue hours" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_BAY_WINDOW_CONFLICT, http: 409, condition: "Reservation/lesson window overlaps a CONFIRMED reservation or SCHEDULED lesson on the same bay" }
  - { id: ERR_BAY_UNAVAILABLE, http: 409, condition: "Bay is OUT_OF_SERVICE, or lesson capacity violated (PRIVATE_LESSON/SIMULATOR seats>1)" }
  - { id: ERR_NO_BAY_AVAILABLE, http: 409, condition: "seat_next found no AVAILABLE bay at the venue" }
  - { id: ERR_NOT_QUEUE_HEAD, http: 409, condition: "seat_next targeted a ticket that is not the position-1 WAITING ticket" }
  - { id: ERR_CARD_DEPLETED, http: 409, condition: "GameCard is DEPLETED or has zero remaining credits when a credit is required" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Wallet balance < amount, or gift-card remaining_cents < redeem amount" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Confirm attempted on a HOLD whose hold_expires_utc has passed" }
  - { id: ERR_FBTAB_NOT_CLOSED, http: 409, condition: "Settlement attempted while an attached F&B tab is still OPEN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "Numeric input outside allowed range (e.g. peak_demand_factor not in [0.5,1.5], negative amount, points<0)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already registered" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Guest
    description: "A registered member acting on their own bookings, cards, queue tickets, lessons, and event quotes."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /golf/members — self-register"
      - "POST /golf/members/{id}/wallet/topup — load own wallet"
      - "POST /golf/game-cards — buy own game-card"
      - "POST /golf/gift-cards, POST /golf/gift-cards/{id}/redeem — buy/redeem gift cards"
      - "POST /golf/reservations + confirm + cancel — own reservations"
      - "POST /golf/queue-tickets + cancel — own queue tickets"
      - "POST /golf/event-packages — request a quote"
      - "POST /golf/lessons + cancel — own lessons"
      - "GET reads on own resources"

  - name: FrontDesk
    description: "Operational staff who seat walk-ins, run sessions, record shots/scores, manage F&B tabs, and take bookings on behalf of guests."
    identity: "opaque"
    exclusive_operations:
      - "POST /golf/sessions (+ shots, end, settle)"
      - "POST /golf/fb-tabs (+ items, close)"
    shared_operations:
      - "POST /golf/venues/{id}/seat_next — seat walk-ins (FrontDesk-only operation)"
      - "POST /golf/reservations + confirm + cancel — on behalf of guest"
      - "POST /golf/queue-tickets + cancel — on behalf of guest"
      - "POST /golf/lessons + complete + cancel"
      - "GET reads"

  - name: RangeManager
    description: "Venue operator: provisions venues/bays, runs the sweep, manages event packages, voids sessions, sets the clock, takes bays out of service."
    identity: "opaque"
    exclusive_operations:
      - "POST /golf/venues, POST /golf/bays, POST /golf/bays/{id}/out_of_service"
      - "POST /golf/venues/{id}/sweep_holds"
      - "POST /golf/event-packages/{id}/negotiate|confirm|settle|cancel, PATCH /golf/event-packages/{id}"
      - "POST /golf/sessions/{id}/void"
      - "POST /golf/_clock/set_current_utc"
    shared_operations:
      - "POST /golf/members, POST /golf/game-cards, POST /golf/gift-cards (+ redeem), wallet topup"
      - "POST /golf/event-packages — create quote"
      - "GET reads"
