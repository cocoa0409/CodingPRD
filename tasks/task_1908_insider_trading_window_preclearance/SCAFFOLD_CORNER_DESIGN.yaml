            - "PreclearanceRequest.${req_id}.status == UNDER_REVIEW (unchanged)"

      - name: member_cannot_vote_own_exception_forbidden
        claim_type: rbac_deny
        grounds: ["validations[priority=6]", "errors[ERR_SELF_ACTION_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties on the committee: the exception owner holding the CommitteeMember role cannot vote on their own request — ERR_SELF_ACTION_FORBIDDEN."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; person M created; M's exception SUBMITTED"]
          setup_api_calls:
