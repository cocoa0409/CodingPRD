              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_id}", work_date: "2026-08-03", units_trimmed: 10, labor_hours: 2, equipment_hours: 1, disposal_tons: 0 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/storm-events"
              payload: { event_code: "STM-1", severity_level: 4, affected_district: "NORTH" }
              as: UtilityForester
              captures: { stm_id: $.data.id }
            - call: "POST /vm/storm-events/${stm_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "GET /vm/crews/${crew1_id}"
              payload: {}
              as: ContractorPlanner
              captures: { crew1_v: $.data.version }
            - call: "POST /vm/storm-events/${stm_id}/reassignments"
              payload: { crew_id: "${crew1_id}", expected_crew_version: "${crew1_v}" }
              as: ContractorPlanner
            - call: "GET /vm/work-orders"
              payload: { parent_work_order_id: "${wo_id}" }
              as: ContractorPlanner
              captures: { child_id: "$.data[0].id" }
          trigger:
            - call: "POST /vm/storm-events/${stm_id}/demobilize"
              payload: {}
              as: UtilityForester
          assert:
            - "before the storm reassignment WorkPlan.${wp_id}.planned_unit_count == 200"
            - "during the preemption WorkOrder.${wo_id}.planned_unit_count == 10 and WorkOrder.${child_id}.planned_unit_count == 190 and WorkPlan.${wp_id}.planned_unit_count == 200"
            - "WorkOrder.${child_id}.execution_status == CANCELLED"
            - "WorkOrder.${wo_id}.planned_unit_count == 200"
            - "WorkOrder.${wo_id}.execution_status == RELEASED"
            - "WorkPlan.${wp_id}.planned_unit_count == 200"
            - "WorkPlan.${wp_id}.status == IN_PROGRESS"
            - "Circuit.${ckt_id}.trim_status == ACTIVE_CYCLE"
            - "CrewAssignment.${ca_id}.status == RELEASED"
            - "Crew.${crew1_id}.status == AVAILABLE"
            - "StormEvent.${stm_id}.status == DEMOBILIZING and preempted_assignment_count == 0"

      - name: billing_line_draft_then_void_conserves_plan_committed_cents
        grounds:
          - state_machines.BillingLine.DRAFT_to_VOID
          - calculations.work_plan_committed_cents
          - entities.WorkPlan.fields.committed_cents
          - endpoints["POST /vm/billing-lines/{id}/void"]
        distinguishing_aspect: |
          Conserved quantity: CURRENCY, a different type of quantity from the trim-unit invariant.
          WorkPlan.committed_cents == sum(final_payable_cents over BillingLines in
          {DRAFT, SUBMITTED, APPROVED, PAID}) must return to exactly its pre-draft value of 0 after
          the forward draft (+820800) is undone by the compensating void.
        test_recipe:
          setup:
            - "Circuit CKT-A, plan budget 5000000, one COMPLETED UNIT_PRICE span of 2.5 miles with 180 units of production and no refusals."
            - "WorkPlan.committed_cents is 0 because no billing line exists yet."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/work-plans"
              payload: { circuit_id: "${ckt_id}", program_year: 2026, planned_span_miles: 10, budget_cents: 5000000 }
              as: UtilityForester
              captures: { wp_id: $.data.id }
            - call: "POST /vm/work-orders"
              payload: { work_plan_id: "${wp_id}", span_miles: 2.5, billing_method: "UNIT_PRICE", planned_unit_count: 200 }
              as: ContractorPlanner
              captures: { wo_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/map"
              payload: { clearance_radius_ft: 12 }
              as: ContractorPlanner
            - call: "POST /vm/work-plans/${wp_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/work-orders/${wo_id}/release"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/crews"
              payload: { crew_code: "CRW-1", crew_type: "BUCKET", headcount: 3, hourly_rate_cents: 8533, home_district: "NORTH" }
              as: ContractorPlanner
              captures: { crew1_id: $.data.id }
            - call: "POST /vm/crew-assignments"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew1_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z" }
              as: ContractorPlanner
              captures: { ca_id: $.data.id }
            - call: "POST /vm/work-orders/${wo_id}/start"
              payload: {}
              as: ContractorPlanner
            - call: "POST /vm/production-entries"
              payload: { crew_assignment_id: "${ca_id}", work_date: "2026-08-03", units_trimmed: 180, labor_hours: 8, equipment_hours: 6, disposal_tons: 1 }
              as: CrewForeman
              as_user_id: "${crew1_id}"
            - call: "POST /vm/work-orders/${wo_id}/complete"
              payload: {}
              as: ContractorPlanner
            - call: "GET /vm/work-orders/${wo_id}"
              payload: {}
              as: BillingAnalyst
              captures: { wo_v: $.data.version }
            - call: "POST /vm/work-orders/${wo_id}/billing-lines"
              payload: { billing_method: "UNIT_PRICE", expected_work_order_version: "${wo_v}" }
              as: BillingAnalyst
              captures: { bl_id: $.data.id }
          trigger:
            - call: "POST /vm/billing-lines/${bl_id}/void"
              payload: { reason: "re-measure required" }
              as: BillingAnalyst
          assert:
            - "before the void WorkPlan.${wp_id}.committed_cents == 820800"
            - "BillingLine.${bl_id}.status == VOID"
            - "BillingLine.${bl_id}.superseded_by_billing_line_id == null"
            - "WorkPlan.${wp_id}.committed_cents == 0"
            - "WorkOrder.${wo_id}.billing_status == BILLABLE"
            - "WorkOrder.${wo_id}.execution_status == COMPLETED"
