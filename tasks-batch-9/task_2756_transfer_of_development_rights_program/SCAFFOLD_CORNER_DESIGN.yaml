      - name: full_retirement_reconciles_the_certificate_easement_and_holder_ledgers
        claim_type: side_effect_execution
        grounds:
          - state_machines.Certificate.ISSUED_to_RETIRED
          - endpoints.POST_tdr_certificates_id_retire
          - calculations.rights_ledger_identity
          - entities.Party.fields.units_held
        distinguishing_aspect: "Retiring every remaining unit is a ledger-sync side effect that reaches three entities at once — the certificate's lifecycle_status, the backing easement's units_retired / units_outstanding (with units_issued_total deliberately unchanged, because issuance is history), and the holder's derived units_held / certificates_held_count. A RETIREMENT row is appended with a null counterparty and a null price."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for all 22 units and certified"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/retire"
              payload: { units: 22, reason: "landowner elects permanent retirement" }
              as: Landowner
              as_user_id: "${own_id}"
          assert:
            - "the retire returns 200"
            - "Certificate.${cert_id}.units_retired == 22, units_remaining == 0, lifecycle_status == RETIRED, market_status == HELD"
            - "ConservationEasement.${eas_id}.units_retired == 22 and units_outstanding == 0"
            - "ConservationEasement.${eas_id}.units_issued_total == 22 (issuance history is never rewound by a retirement)"
            - "Party.${own_id}.units_held == 0 and certificates_held_count == 0"
            - "GET /tdr/certificate-transfers?certificate_id=${cert_id} returns total_count 2"
            - "the seq_no 2 row has transfer_type RETIREMENT, units 22, to_party_id null, price_cents null"
            - "SendingParcel.${parcel_id}.severed_units == 22 and restricted_acres == 100.00 (the easement stays recorded; retiring rights does not un-preserve land)"

      - name: severance_revision_cycle_is_covered_by_the_cyclic_difficulty_instance
        claim_type: cyclic_loop_termination
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.SeveranceApplication.REVISION_REQUESTED_to_SUBMITTED
          - validations.priority_36_revision_limit
        distinguishing_aspect: "The cyclic shape's loop-termination claim — the application can return to SUBMITTED twice and the third revision request is refused at MAX_REVISION_ROUNDS."
        excluded_because:
          difficulty_instance: severance_review_cycle_exhausts_two_revision_rounds
          rationale: "That §1.8 non_linear_state_machine instance drives the full two-round cycle, asserts ERR_REVISION_LIMIT_EXCEEDED on the third REQUIRE_REVISION at revision_round 2, and then completes the loop with an APPROVE. A separate §1.9 recipe would be the same call sequence with weaker assertions."

      - name: parallel_state_dimensions_are_covered_by_the_independence_difficulty_instance
        claim_type: parallel_dimension_independence
        grounds:
          - complexity_profile.state_machine_shape
          - entities.ConservationEasement.fields.recording_status
          - entities.ConservationEasement.fields.compliance_status
          - entities.Certificate.fields.lifecycle_status
          - entities.Certificate.fields.market_status
        distinguishing_aspect: "Both ConservationEasement and Certificate carry two orthogonal state dimensions; each must advance without dragging the other along."
        excluded_because:
          difficulty_instance: easement_recording_and_compliance_dimensions_advance_independently
          rationale: "That §1.8 instance amends an easement's recording_status while its compliance_status is already VIOLATION_NOTICED and asserts each dimension separately, including that the newly issued certificate is ISSUED/HELD rather than frozen. It subsumes the generic parallel-dimension claim."

      - name: certify_cascade_chain_is_covered_by_the_transitive_cascade_instance
        claim_type: cascade_down
        grounds:
          - state_machines.SeveranceApplication.APPROVED_to_CERTIFIED
          - state_machines.SendingArea.ACTIVE_to_CLOSED
          - state_machines.SeveranceApplication.SUBMITTED_to_SUSPENDED
        distinguishing_aspect: "The four-link cascade from certification down to the suspension of a sibling application in the same sending area."
        excluded_because:
          difficulty_instance: certification_cascades_parcel_to_area_closure_to_sibling_suspension
          rationale: "That §1.8 transitive_cascade instance asserts all four links with their causal ordering and pins the sending cap to exactly the certified units so link 4 fires; a §1.9 duplicate would add nothing."

      - name: settlement_reversal_compensation_is_covered_by_the_invariant_instance
        claim_type: compensation
        grounds:
          - state_machines.MarketTransaction.SETTLED_to_REVERSED
          - endpoints.POST_tdr_market-transactions_id_reverse
          - calculations.cash_ledger_identity
        distinguishing_aspect: "A reversal must undo every cash leg, the title move, and the derived holder counters exactly, leaving no rounding residue."
        excluded_because:
          difficulty_instance: program_cash_conserved_across_settlement_and_reversal
          rationale: "That §1.8 compensating_invariant instance asserts the three-way cash identity before, between, and after settlement and reversal, including the bank's fee_revenue_cents returning to its pre-settlement value — a strict superset of the generic compensation claim."

  # ===========================================================================
  # §1.9.3 Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: soil_class_multiplier_constants_move_the_baseline_allocation
        claim_type: constants_applied
        grounds:
          - calculations.parcel_baseline_allocation
          - entities.SendingParcel.fields.soil_class
          - entities.SendingParcel.fields.baseline_allocation_units
        distinguishing_aspect: "All four declared soil multipliers are exercised on four otherwise identical 40.00-acre parcels in the same V1_NET_ACRE area, and two of them (PRIME 12.5 and NONE 7.5) land on a half unit, so the floor-before-deduction rule is visible as truncation rather than rounding: 12.5 -> 12, not 13, and 7.5 -> 7, not 8."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "LANDOWNER party; ACTIVE sending area SA-SOIL (V1_NET_ACRE, base_rate_units_per_acre 0.25, cap 200)"
            - "four parcels, each 40.00 gross acres, 0.00 constrained acres, 0 existing dwelling units, differing only in soil_class"
          setup_api_calls:
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-SOIL", name: "Soil Test Area", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-PRIME", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "PRIME", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { p_prime: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-STATE", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "STATEWIDE", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { p_state: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-LOCAL", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { p_local: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-NONE", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "NONE", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { p_none: $.data.id }
          assert:
            - "SendingParcel.${p_prime}.baseline_allocation_units == 12 — 40.00 * 0.25 * 1.25 = 12.5, floored to 12"
            - "SendingParcel.${p_state}.baseline_allocation_units == 11 — 40.00 * 0.25 * 1.10 = 11.0"
            - "SendingParcel.${p_local}.baseline_allocation_units == 10 — 40.00 * 0.25 * 1.00 = 10.0"
            - "SendingParcel.${p_none}.baseline_allocation_units == 7 — 40.00 * 0.25 * 0.75 = 7.5, floored to 7"
            - "each parcel's remaining_units equals its baseline_allocation_units and severed_units == 0"
            - "SendingArea.${sa_id}.severed_units_total == 0 — enrolling parcels allocates potential, not severed rights"

      - name: settlement_fee_tier_upper_bound_is_inclusive_at_five_million_cents
        claim_type: tier_boundary
        grounds:
          - calculations.settlement_split
          - calculations.appraisal_reference_value
          - endpoints.POST_tdr_market-transactions_id_settle
        distinguishing_aspect: "The first fee tier's upper bound is inclusive, so a one-cent price difference straddles it: gross exactly 5000000 pays 350 bps (175000) while gross 5000001 pays 275 bps (137500) — the higher price yields the SMALLER fee. Both sales sit on identical 5-unit certificates from the same UNDERSERVED area, so nothing but the tier can explain the gap."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER (credited 20000000 cents), and MUNICIPAL_BANK parties"
            - "ACTIVE SA-EAST in NB-EAST (V1_NET_ACRE, base_rate 0.25, UNDERSERVED, cap 200) — surcharge 0 bps"
            - "appraisal schedule for NB-EAST: per_unit_value_cents 1000000, equity_adjustment_bps 0 -> per_unit_base_cents 1000000"
            - "parcel APN-TEN (40.00 / 0.00 / LOCAL / 0) -> baseline 10 units, severed in full and certified"
            - "the 10-unit certificate split 5 off, leaving a 5-unit parent and a 5-unit child"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
