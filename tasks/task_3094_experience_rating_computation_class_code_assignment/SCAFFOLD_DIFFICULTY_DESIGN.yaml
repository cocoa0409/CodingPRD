  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlapping_class_assignment_effective_dates_rejected
        grounds:
          - state_machines.ClassAssignment
          - errors.ERR_CLASS_ASSIGNMENT_OVERLAP
          - validations[priority=5]
        distinguishing_aspect: |
          Interval semantics (closed effective-date ranges) on the
          ClassAssignment resource: a second ASSIGNED assignment for the same
          employer whose effective_date falls within the existing assignment's
          effective period is rejected with ERR_CLASS_ASSIGNMENT_OVERLAP;
          touching boundaries (same effective_date) count as overlap.
        test_recipe:
          setup:
            - "Bureau defaults; employer A ACTIVE; class codes 3632 and 8810 ACTIVE; CA1 ASSIGNED with effective_date 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /employers"
              payload: { fein: "75-1000001", legal_name: "Pecos Machine Works", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_a: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
              captures: { cc_3632: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "8810", description: "Clerical Office Employees", state_code: "TX" }
              as: BureauAdmin
              captures: { cc_8810: $.data.id }
            - call: "POST /class-assignments"
              payload: { employer_id: "${employer_a}", class_code_id: "${cc_3632}", effective_date: "2026-01-01" }
              as: BureauAnalyst
              captures: { ca_1: $.data.id }
            - call: "POST /class-assignments/${ca_1}/assign"
              payload: {}
              as: BureauAnalyst
          trigger:
            - call: "POST /class-assignments"
              payload: { employer_id: "${employer_a}", class_code_id: "${cc_8810}", effective_date: "2026-01-01" }
              as: BureauAnalyst
              captures: { ca_2: $.data.id }
            - call: "POST /class-assignments/${ca_2}/assign"
              payload: {}
              as: BureauAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the second assign returns 409 and error_id == ERR_CLASS_ASSIGNMENT_OVERLAP"
            - "ClassAssignment.${ca_2}.status == PENDING_INSPECTION"

      - name: superseding_rating_table_closes_prior_table_interval
        grounds:
          - state_machines.RatingTable
          - entities.RatingTable.fields.status
        distinguishing_aspect: |
          Interval semantics on the RatingTable resource with implicit
          half-open supersession: promulgating a new TX table effective
          2026-07-01 marks the prior PROMULGATED table SUPERSEDED, so lookups
          for policies effective on/after 2026-07-01 use the new table while
          earlier policies keep the old — different interval semantics
          (point-in-time lookup over versioned tables) than the
          assignment-overlap rule.
        test_recipe:
          setup:
            - "Bureau defaults; employer B; carrier; class 3632; TX table T1 promulgated effective 2026-01-01 (rate 250); TX table T2 created effective 2026-07-01 (rate 300)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10001", legal_name: "Alamo Mutual", assigned_risk_quota_cents: 100000000 }
              as: BureauAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000002", legal_name: "Brazos Fabrication", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_b: $.data.id }
            - call: "POST /class-codes"
              payload: { code: "3632", description: "Machine Shop NOC", state_code: "TX" }
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-01-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 250, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_1: $.data.id }
            - call: "POST /rating-tables/${rt_1}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /rating-tables"
              payload: { state_code: "TX", effective_date: "2026-07-01", values: [{ class_code: "3632", rate_per_100_payroll_cents: 300, elr_per_100_payroll_cents: 150, d_ratio_bp: 4000 } ] }
              as: BureauAdmin
              captures: { rt_2: $.data.id }
          trigger:
            - call: "POST /rating-tables/${rt_2}/promulgate"
              payload: {}
              as: BureauAdmin
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-JUN", effective_date: "2026-06-01", expiration_date: "2027-06-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_jun: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${employer_b}", carrier_id: "${carrier_id}", policy_number: "WC-AUG", effective_date: "2026-08-01", expiration_date: "2027-08-01", class_codes: [{ class_code: "3632", payroll_dollars: 100000 } ] }
              as: CarrierDataReporter
              as_user_id: "${carrier_id}"
              captures: { policy_aug: $.data.id }
          assert:
            - "RatingTable.${rt_1}.status == SUPERSEDED"
            - "RatingTable.${rt_2}.status == PROMULGATED"
            - "Policy.${policy_jun}.manual_premium_cents == 250000 (old table governs pre-supersession effective dates)"
            - "Policy.${policy_aug}.manual_premium_cents == 300000 (new table governs)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: carrier_pool_load_conserved_across_assign_and_takeout_approve
        grounds:
          - state_machines.AssignedRiskEnrollment.PENDING_to_ACTIVE
          - state_machines.AssignedRiskEnrollment.ACTIVE_to_EXITED
          - state_machines.AssignedRiskTakeOut.PENDING_to_APPROVED
          - entities.Carrier.fields.assigned_risk_current_load_cents
        distinguishing_aspect: |
          Conserved quantity: Carrier.assigned_risk_current_load_cents. The
          forward action (assign, +500,000) paired with its compensating
          action (take-out approve, -500,000) returns the load to exactly its
          pre-pair value of 0 — invariant over carrier pool capacity.
        test_recipe:
          setup:
            - "Bureau defaults; employer C; carrier1 quota 10,000,000, initial load 0; carrier2 voluntary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureaus"
              payload: { code: "NCCI", name: "National Bureau", eligibility_threshold_cents: 500000, split_point_cents: 1000000, credibility_ballast_bp: 4000, credibility_excess_divisor_bp: 6000, underwriting_threshold_cents: 2500000 }
              as: BureauAdmin
            - call: "POST /carriers"
              payload: { naic_number: "10002", legal_name: "Pool Carrier One", assigned_risk_quota_cents: 10000000 }
              as: BureauAdmin
              captures: { carrier_1: $.data.id, carrier_1_load0: $.data.assigned_risk_current_load_cents }
            - call: "POST /carriers"
              payload: { naic_number: "10003", legal_name: "Voluntary Carrier Two", assigned_risk_quota_cents: 1000000 }
              as: BureauAdmin
              captures: { carrier_2: $.data.id }
            - call: "POST /employers"
              payload: { fein: "75-1000003", legal_name: "Capitol Fasteners", state_code: "TX" }
              as: BureauAdmin
              captures: { employer_c: $.data.id }
          trigger:
            - call: "POST /assigned-risk-enrollments"
              payload: { employer_id: "${employer_c}", state_code: "TX", effective_date: "2026-01-01", expiration_date: "2026-12-31", estimated_annual_premium_cents: 500000 }
              as: PoolAdministrator
              captures: { enr_1: $.data.id }
            - call: "POST /assigned-risk-enrollments/${enr_1}/assign"
              payload: { carrier_id: "${carrier_1}" }
              as: PoolAdministrator
              captures: { enr_1_v: $.data.version }
            - call: "POST /assigned-risk-take-outs"
              payload: { enrollment_id: "${enr_1}", voluntary_carrier_id: "${carrier_2}", exit_date: "2026-07-01", expected_enrollment_version: "${enr_1_v}" }
              as: VoluntaryCarrierRepresentative
              as_user_id: "${carrier_2}"
              captures: { takeout_1: $.data.id }
            - call: "POST /assigned-risk-take-outs/${takeout_1}/approve"
              payload: {}
              as: PoolAdministrator
            - call: "GET /carriers/${carrier_1}"
              payload: {}
              as: Any
          assert:
            - "Carrier.${carrier_1}.assigned_risk_current_load_cents == ${carrier_1_load0} (== 0 after the forward/compensating pair)"

      - name: claim_level_loss_totals_conserved_across_correction
        grounds:
          - state_machines.UnitStatReport.LOCKED_to_CORRECTED
          - calculations.primary_excess_split
        distinguishing_aspect: |
          Conserved quantity of a different type — per-claim loss identity:
          for every claim on the corrected report, primary + excess ==
          incurred exactly, and total incurred across the correction equals
          the sum of the new claim lines (3,300,000 = 1,600,000 + 1,700,000),
          so the revision must not leak or duplicate loss cents between the
          CORRECTED report and its replacement.
        test_recipe:
          setup:
            - "Base fixture; sheet S1 promulgated off report R1; correction R2 validated with C2 reduced to 1,700,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
