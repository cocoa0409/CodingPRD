          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-B4", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
