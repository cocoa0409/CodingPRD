        distinguishing_aspect: "Participant calling ProgramAdmin-exclusive POST /workshops gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["a participant exists (identity for X-User-ID); module and certified coach exist"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "PRB", email: "prb@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /curriculum-modules", payload: { module_code: "RB-100", title: "RB", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
