            - "The immediately following GET /sponsorship-deals/${deal_id} reports approved_count == 1, assigned_count == 1 and deal_status FULFILLED — the bubble-up crossed an aggregate boundary within the same request"
            - "GET /deliverable-assignments/${d1_id} reports assignment_status APPROVED, rejection_count == 0 and fee_share_cents == 1000000 (floor(1000000 / 1))"
