        distinguishing_aspect: "The negotiation cycle runs exactly MAX_PROPOSAL_ROUNDS = 3 alternating filings and the 4th filing is ACCEPTED as round_number 4 while driving the case to ESCALATED; at that point all four proposals project to VOIDED (not COUNTERED/PENDING) and only arbitration writes resolved_value into the road."
