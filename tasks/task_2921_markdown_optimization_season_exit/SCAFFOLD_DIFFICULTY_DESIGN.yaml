# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: markdown-optimization-season-exit (task 2921)
#
# Shared fixture vocabulary used by the setup chains below (every value is a
# literal pinned here and recomputed from §1.3 by code):
#   Season  FW26-APPAREL   APPAREL, 2026-08-15 .. 2027-01-31,
#                          exit_target_date 2027-01-15, exit_units_target 1000,
#                          sell_through_target_pct 82.00, clearance_space_units 900
#   Item A  A-1001         cluster CL-W1, vendor VN-100, first receipt 2026-08-20,
#                          original 4999c, cost 2000c, received 600
#                          -> protected_until_date 2026-10-01
#                          -> 4 sales weeks: 60@4999, 55@4999, 68@4499, 74@4499
#                          -> units_sold_total 257, on_hand 343, sell_through 42.83,
#                             weeks_of_supply 5.34, own-history coefficient -1.9901
#   Item B  B-2002         same cluster, first receipt 2026-08-18, original 3999c,
#                          cost 1500c, received 400, weeks 40@3999, 38@3999,
#                          52@3599, 55@3599 -> coefficient -3.0217 (CERTIFIED)
#   Zones   CHAIN-US (CHAIN, lead 10), REGION-WEST (REGION, lead 7, parent CHAIN-US)
#   Stores  0101 (300 bays), 0202 (500 bays), 0303 (120 bays, REMODEL)
#   Clock   default 2026-08-01T00:00:00Z; the chains advance it explicitly
#   Ladder  rung 1 2026-10-19 @22.57 -> 3871c, rung 2 2026-11-09 @35.00 -> 3249c
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: elasticity_own_history_versus_cluster_pooled_diverge
        grounds:
          - calculations.elasticity_coefficient_estimation
          - calculations.elasticity_coefficient_estimation.variants.own_history
          - calculations.elasticity_coefficient_estimation.variants.cluster_pooled
          - entities.ElasticityEstimate.fields.resolved_method
          - entities.ElasticityEstimate.fields.peer_items_used
          - entities.ElasticityEstimate.fields.confidence
        distinguishing_aspect: |
          Item domain (elasticity of one Item): the same four stored SalesWeek rows of item A
          yield -1.9901 under own_history and -3.0217 under cluster_pooled, because the pooled
          variant reads only peer item B's CERTIFIED coefficient and never A's own weeks.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and holds items A-1001 and B-2002, both APPAREL in cluster CL-W1"
            - "Both items carry their four sales weeks; item B already has a CERTIFIED own-history estimate of -3.0217 and units_sold_total 185"
            - "Item A has four sales weeks with two distinct ticket prices, so own_history_ok is true for A"
            - "Logical clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.00, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "B-2002", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-18", original_retail_cents: 3999, unit_cost_cents: 1500, units_received_total: 400 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_b_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 40, ticket_price_cents: 3999 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 38, ticket_price_cents: 3999 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 52, ticket_price_cents: 3599 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 55, ticket_price_cents: 3599 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_b_id}", method: "OWN_HISTORY" }
              as: PricingAnalyst
              captures: { est_b_id: $.data.id }
            - call: "POST /elasticity-estimates/${est_b_id}/certify"
              payload: {}
              as: PricingAnalyst
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_a_id}", method: "AUTO" }
              as: PricingAnalyst
              captures: { est_a_own_id: $.data.id, est_a_own_coeff: $.data.elasticity_coefficient }
          trigger:
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_a_id}", method: "CLUSTER_POOLED" }
              as: PricingAnalyst
              captures: { est_a_pooled_id: $.data.id }
          assert:
            - "ElasticityEstimate.${est_a_own_id}.resolved_method == OWN_HISTORY"
            - "ElasticityEstimate.${est_a_own_id}.elasticity_coefficient == -1.9901"
            - "ElasticityEstimate.${est_a_own_id}.sample_weeks_used == 4 and peer_items_used == 0 and confidence == HIGH"
            - "ElasticityEstimate.${est_a_pooled_id}.resolved_method == CLUSTER_POOLED"
            - "ElasticityEstimate.${est_a_pooled_id}.elasticity_coefficient == -3.0217"
            - "ElasticityEstimate.${est_a_pooled_id}.sample_weeks_used == 0 and peer_items_used == 1 and confidence == LOW"
            - "The two estimates of item ${item_a_id} differ by exactly 1.0316 while every stored SalesWeek row is unchanged"
            - "ElasticityEstimate.${est_a_pooled_id}.status == DRAFT"

      - name: exit_scorecard_preliminary_versus_final_diverge
        grounds:
          - calculations.season_exit_scorecard
          - calculations.season_exit_scorecard.variants.preliminary
          - calculations.season_exit_scorecard.variants.final
          - entities.SeasonExitReview.fields.gross_margin_cents
          - validations[priority=9]
        distinguishing_aspect: |
          Season domain (whole-season margin, not one item): with one APPLIED and one SCHEDULED
          execution, one SUBMITTED claim and one APPROVED disposition on the books, PRELIMINARY
          reports gross_margin_cents 906458 and FINAL reports 893658 from byte-identical rows.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is in EXIT_WINDOW with items A-1001 (600 received, 257 sold) and B-2002 (400 received, 185 sold)"
            - "Item A's PERMANENT plan has rung 1 (2026-10-19 @22.57 -> 3871c) APPLIED over 200 units (line 225600) and rung 2 (2026-11-09 @35.00 -> 3249c) SCHEDULED over 100 units"
            - "One VendorClaim for 60000c is SUBMITTED and not yet recognized; one SALVAGE DispositionOrder for 50 units at 300c per unit is APPROVED and not settled"
            - "The clock is set to 2026-10-10T00:00:00Z while the ladder and the signage window are authored, then advanced to 2026-10-19T00:00:00Z so rung 1 may be applied (apply requires current_date >= effective_date)"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.00, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /price-zones"
              payload: { zone_code: "CHAIN-US", zone_type: "CHAIN", signage_lead_days: 10 }
              as: MerchandiseDirector
              captures: { chain_zone_id: $.data.id }
            - call: "POST /price-zones"
              payload: { zone_code: "REGION-WEST", zone_type: "REGION", parent_zone_id: "${chain_zone_id}", signage_lead_days: 7, region_code: "WEST" }
              as: MerchandiseDirector
              captures: { west_zone_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "0101", price_zone_id: "${west_zone_id}", clearance_bay_units: 300, region_code: "WEST" }
              as: MerchandiseDirector
              captures: { store_0101_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "B-2002", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-18", original_retail_cents: 3999, unit_cost_cents: 1500, units_received_total: 400 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_b_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 40, ticket_price_cents: 3999 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 38, ticket_price_cents: 3999 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 52, ticket_price_cents: 3599 }
              as: PricingAnalyst
            - call: "POST /items/${item_b_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 55, ticket_price_cents: 3599 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_a_id}", method: "AUTO" }
              as: PricingAnalyst
              captures: { est_a_id: $.data.id }
            - call: "POST /elasticity-estimates/${est_a_id}/certify"
              payload: {}
              as: PricingAnalyst
            - call: "GET /items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { item_a_version: $.data.version }
            - call: "POST /markdown-plans"
              payload: { season_id: "${season_id}", item_id: "${item_a_id}", elasticity_estimate_id: "${est_a_id}", plan_type: "PERMANENT", exit_date_target: "2027-01-15", expected_item_version: "${item_a_version}" }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { plan_id: $.data.id }
            - call: "POST /markdown-plans/${plan_id}/steps"
              payload: { step_index: 1, effective_date: "2026-10-19", depth_pct: 22.57 }
              as: PricingAnalyst
              captures: { step1_id: $.data.id }
            - call: "POST /markdown-plans/${plan_id}/steps"
              payload: { step_index: 2, effective_date: "2026-11-09", depth_pct: 35.00 }
              as: PricingAnalyst
              captures: { step2_id: $.data.id }
            - call: "POST /markdown-plans/${plan_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /markdown-plans/${plan_id}/approve"
              payload: {}
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /zone-executions"
              payload: { markdown_plan_id: "${plan_id}", markdown_step_id: "${step1_id}", price_zone_id: "${west_zone_id}", execution_scope: "ZONE", effective_date: "2026-10-19", units_in_scope: 200 }
              as: PricingAnalyst
              captures: { exec1_id: $.data.id }
            - call: "POST /zone-executions/${exec1_id}/post-signage"
              payload: {}
              as: StoreManager
              as_user_id: "${store_0101_id}"
            - call: "POST /zone-executions/${exec1_id}/verify-signage"
              payload: {}
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-19T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /zone-executions/${exec1_id}/apply"
              payload: {}
              as: PricingAnalyst
            - call: "POST /zone-executions"
              payload: { markdown_plan_id: "${plan_id}", markdown_step_id: "${step2_id}", price_zone_id: "${west_zone_id}", execution_scope: "ZONE", effective_date: "2026-11-09", units_in_scope: 100 }
              as: PricingAnalyst
              captures: { exec2_id: $.data.id }
            - call: "POST /allowance-agreements"
              payload: { season_id: "${season_id}", vendor_code: "VN-100", item_category_scope: "APPAREL", current_share_pct: 25.00, current_cap_cents: 100000 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /allowance-agreements/${agreement_id}/accept"
              payload: {}
              as: VendorRep
              as_user_id: "vr-1"
            - call: "POST /vendor-claims"
              payload: { allowance_agreement_id: "${agreement_id}", markdown_plan_id: "${plan_id}", claimed_cents: 60000 }
              as: PricingAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /disposition-orders"
              payload: { season_id: "${season_id}", item_id: "${item_a_id}", channel: "SALVAGE", units: 50, unit_recovery_cents: 300 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { disp_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "EXIT_WINDOW" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /disposition-orders/${disp_id}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-1"
          trigger:
            - call: "POST /seasons/${season_id}/exit-reviews"
              payload: { review_type: "PRELIMINARY" }
              as: Controller
              as_user_id: "ctl-1"
              captures: { prelim_id: $.data.id, prelim_margin: $.data.gross_margin_cents }
            - call: "POST /seasons/${season_id}/exit-reviews"
              payload: { review_type: "FINAL" }
              as: Controller
              as_user_id: "ctl-1"
              captures: { final_id: $.data.id }
          assert:
            - "SeasonExitReview.${prelim_id}.revenue_cents == 1910758 and cogs_cents == 791500"
            - "SeasonExitReview.${prelim_id}.markdown_reserve_cents == 287800"
            - "SeasonExitReview.${prelim_id}.vendor_funding_cents == 60000"
            - "SeasonExitReview.${prelim_id}.disposition_recovery_cents == 15000"
            - "SeasonExitReview.${prelim_id}.gross_margin_cents == 906458"
            - "SeasonExitReview.${final_id}.markdown_reserve_cents == 225600"
            - "SeasonExitReview.${final_id}.vendor_funding_cents == 0 and disposition_recovery_cents == 0"
            - "SeasonExitReview.${final_id}.gross_margin_cents == 893658"
            - "SeasonExitReview.${final_id}.gross_margin_cents - SeasonExitReview.${prelim_id}.gross_margin_cents == -12800"
            - "Both reviews report units_received_total == 1000, units_sold_total == 442, sell_through_pct == 44.20, sell_through_variance_pct == -37.80 and exit_units_variance == -558"

  - rule_id: combinatorial_formula
    instances:
      - name: recommended_depth_pins_four_input_interaction
        grounds:
          - calculations.recommended_first_step_depth
          - entities.MarkdownPlan.fields.recommended_depth_pct
          - entities.Item.fields.weeks_of_supply
          - entities.Item.fields.lifecycle_stage
          - entities.ElasticityEstimate.fields.elasticity_coefficient
          - concurrency_rules[plan-create-stale-item]
        distinguishing_aspect: |
          Four independent inputs combine non-linearly in one pinned order - a stage-keyed base (AGING 15.00),
          a tier-selected urgency bonus (0.00 because weeks_to_exit is 13 > 12), a clamped linear pressure term
          (2.01 from weeks_of_supply 5.34) and a 4-decimal clamped elasticity ratio (1.3267 from -1.9901 / 1.50) -
          so recommended_depth_pct is exactly 22.57 and no reordering or early rounding reproduces it.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE and holds item A-1001 with its four sales weeks (257 units sold of 600 received)"
            - "Item A's AUTO estimate resolved to OWN_HISTORY with elasticity_coefficient -1.9901 and is CERTIFIED"
            - "Logical clock stands at 2026-10-10T00:00:00Z, so weeks_on_hand is 7 and weeks_to_exit is 13"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /elasticity-estimates"
              payload: { item_id: "${item_a_id}", method: "AUTO" }
              as: PricingAnalyst
              captures: { est_a_id: $.data.id }
            - call: "POST /elasticity-estimates/${est_a_id}/certify"
              payload: {}
              as: PricingAnalyst
            - call: "GET /items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { item_a_version: $.data.version }
          trigger:
            - call: "POST /markdown-plans"
              payload: { season_id: "${season_id}", item_id: "${item_a_id}", elasticity_estimate_id: "${est_a_id}", plan_type: "PERMANENT", exit_date_target: "2027-01-15", expected_item_version: "${item_a_version}" }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { plan_id: $.data.id }
          assert:
            - "Item.${item_a_id}.lifecycle_stage == AGING and sell_through_pct == 42.83 and weeks_of_supply == 5.34"
            - "MarkdownPlan.${plan_id}.recommended_depth_pct == 22.57"
            - "MarkdownPlan.${plan_id}.recommended_depth_pct != 22.62, the value produced by rounding elasticity_factor to 2 decimals (1.33) instead of 4"
            - "MarkdownPlan.${plan_id}.recommended_depth_pct != 19.90, the value produced by dropping the pressure term"
            - "MarkdownPlan.${plan_id}.status == DRAFT and ladder_step_count == 0 and revision_round == 0"
            - "Item.${item_a_id}.version == ${item_a_version} + 1 (POST /markdown-plans bumps the OCC parent)"
      - name: markdown_liability_line_pins_rounding_order
        grounds:
          - calculations.markdown_liability_line
          - calculations.markdown_step_price
          - entities.ZoneExecution.fields.per_unit_markdown_cents
          - entities.ZoneExecution.fields.line_markdown_cents
          - entities.MarkdownPlan.fields.gross_markdown_cents
          - state_machines.ZoneExecution.SCHEDULED_to_APPLIED
        distinguishing_aspect: |
          The same three factors (4999c ticket, 22.57% depth, 200 units) are combined in the pinned order
          round-the-per-unit-cent-first-then-multiply, giving line_markdown_cents 225600; the arithmetically
          equivalent-looking order multiply-then-round gives 225655, so the two orders are observably different.
        test_recipe:
          setup:
