      - name: lsc_verdict_requires_adjust_then_round_then_difference_ordering
        grounds:
          - calculations.interval_and_action_determination
          - calculations.cross_calibration_factor
          - calculations.prior_session_selection
          - entities.DiagnosticReport.fields.prior_bmd_used_g_cm2
          - entities.DiagnosticReport.fields.bmd_change_g_cm2
          - entities.DiagnosticReport.fields.bmd_change_pct
          - entities.DiagnosticReport.fields.lsc_interpretation
          - entities.ScanSession.fields.applied_cross_cal_factor
        distinguishing_aspect: |
          The single verdict NO_SIGNIFICANT_CHANGE is the product of four chained operations that must
          happen in exactly one order: the two phantom means are rounded to 4 places before
          percent_difference 2.00 and the factor 0.9804 are derived from them, the prior TOTAL_HIP
          0.7000 is multiplied by that factor and rounded to 0.6863 before any subtraction,
          bmd_change_g_cm2 is -0.0163 against an LSC of 0.0277, and bmd_change_pct -2.38 is taken
          from the unrounded difference over the adjusted prior rather than from the rounded change.
          Skipping the cross-calibration adjustment yields -0.0300 and the opposite verdict
