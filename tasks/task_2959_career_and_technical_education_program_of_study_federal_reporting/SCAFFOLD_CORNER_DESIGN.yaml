        claim_type: error_triggerability
        grounds:
          - errors[ERR_CREDIT_POSTING_BLOCKED]
          - validations[priority=36]
          - state_machines.ProgramOfStudy.STATE_APPROVED_to_SUSPENDED
          - endpoints[POST /cte/students/{id}/credit-postings]
          - endpoints[POST /cte/students/{id}/exit]
        distinguishing_aspect: |
          Priority 36 names exactly two operations — credit postings and exits — so the suspension has to be a targeted
          freeze rather than a read-only program. The instance suspends the program through the declared miss cascade and
          then proves all three halves of the rule in one pass: the posting is refused, the exit is refused with the SAME
