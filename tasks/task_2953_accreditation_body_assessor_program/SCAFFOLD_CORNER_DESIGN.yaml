        assert: [limit=101 returns HTTP 400 with data.error_id == "ERR_INVALID_PAGINATION", limit=0 returns HTTP 400 with data.error_id == "ERR_INVALID_PAGINATION", offset=-1 returns HTTP 400 with data.error_id == "ERR_INVALID_PAGINATION", 'limit=100 with offset=0 returns HTTP 200 with limit == 100, offset == 0, total_count == 1 and has_more == false', omitting both parameters returns limit == 10 and offset == 0]
