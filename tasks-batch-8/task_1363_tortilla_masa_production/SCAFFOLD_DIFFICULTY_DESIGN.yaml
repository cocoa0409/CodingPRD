            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "SOY-6-Q", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 32, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "SOY_BLENDED" }, as: PlantManager, captures: { soy_id: "$.data.id" } }
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-Q", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { corn_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-CASC", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv1: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${soy_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T08:00:00Z", end_at: "2026-08-02T10:00:00Z", expected_line_version: "${lv1}" }, as: LineScheduler, captures: { run_a: "$.data.id" } }
            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { lv2: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${corn_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T12:00:00Z", end_at: "2026-08-02T14:00:00Z", expected_line_version: "${lv2}" }, as: LineScheduler, captures: { run_b: "$.data.id", req_kg: "$.data.masa_required_kg" } }
            - { call: "GET /plant/runs/${run_b}/changeovers", payload: {}, as: LineScheduler, captures: { co_b: "$.data[0].id" } }
            - { call: "POST /plant/runs/${run_b}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_b}", allocated_kg: 388.8 }, as: LineScheduler, captures: { alloc_b: "$.data.id" } }
          trigger:
            - { call: "POST /plant/nixtamal-batches/${batch_id}/quarantine", payload: {}, as: QualityInspector, captures: { b_status: "$.data.batch_status", b_avail: "$.data.masa_available_kg" } }
            - { call: "GET /plant/allocations/${alloc_b}", payload: {}, as: LineScheduler, captures: { al_status: "$.data.allocation_status" } }
            - { call: "GET /plant/runs/${run_b}", payload: {}, as: LineScheduler, captures: { rb_status: "$.data.production_status" } }
            - { call: "GET /plant/changeovers/${co_b}", payload: {}, as: LineScheduler, captures: { co_status: "$.data.changeover_status" } }
            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { posture: "$.data.line_posture" } }
          assert:
            - "NixtamalBatch.${batch_id}.batch_status == QUARANTINED and masa_available_kg == 1552.0 (link 1: reservation returned)"
            - "BatchAllocation.${alloc_b}.allocation_status == RELEASED (caused by quarantine)"
            - "ProductionRun.${run_b}.production_status == PLANNED (link 2: demotion caused by the release, not by the quarantine call)"
            - "ChangeoverRecord.${co_b}.changeover_status == CANCELLED (link 3: caused by the demotion)"
            - "ProductionLine.${line_id}.line_posture == AVAILABLE (no open changeovers, nothing running)"

      - name: seasonal_activation_sweep_shortens_stops
        grounds:
          - state_machines.SeasonalWindow.SCHEDULED_to_ACTIVE
          - state_machines.RouteStop.ALLOCATED_to_SHORTED
          - calculations.seasonal_allotment_waterfall
