          - endpoints[POST /mfg/heater-units/{id}/ship]
          - entities.ProductModel.fields.warranty_reserve_accrued_cents
        distinguishing_aspect: >
          The consistency model is immediate, so no derived value may lag behind the write that produced it: the
          label response must already carry the minted serial, the ship response must already carry the band, the
          factor and shipped_at, and the model's reserve must already reflect the accrual on the very next read with
