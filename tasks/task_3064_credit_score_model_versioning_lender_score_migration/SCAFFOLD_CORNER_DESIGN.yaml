            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2: $.data.id}}
