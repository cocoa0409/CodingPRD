          - entities.WorkArea.fields.occupancy_cap
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
          - endpoints[POST /work-areas]
        distinguishing_aspect: |
          Two distinct type constraints on the same endpoint: an out-of-range job_function enum value
          and an occupancy_cap of 0 that breaks the declared ">= 1" bound both return ERR_INVALID_REQUEST
          at priority 4, before the body FK check at priority 6 ever sees the worksite_id.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
