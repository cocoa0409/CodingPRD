    side_effects: ["state_machines.BaselinePeriod.SUBMITTED_to_OPEN — rejection_count += 1, frozen metrics cleared (revision cycle)"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BASELINE_NOT_FOUND, ERR_INVALID_BASELINE_STATE]

  - method: GET
    path: /baseline-periods/{id}
    purpose: Read one baseline period with its frozen metrics.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: BaselinePeriod
