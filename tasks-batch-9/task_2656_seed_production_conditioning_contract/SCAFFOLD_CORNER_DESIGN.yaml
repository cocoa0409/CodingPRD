              payload: { seed_lot_id: "${lot_id}", sample_kind: "INITIAL", sampled_on: "2026-09-14" }
              as: CertificationAgency
              as_user_id: "agency-1"
              captures: { s1_id: $.data.id }
            - call: "POST /seed-ops/lot-samples/${s1_id}/results"
              payload: { germination_pct: 96.0, purity_pct: 99.6, inert_pct: 0.3, weed_seed_count_per_kg: 0, tested_at: "2026-09-14T00:00:00Z" }
              as: CertificationAgency
              as_user_id: "agency-1"
          trigger:
            - call: "POST /seed-ops/certification-tags"
              payload: { seed_lot_id: "${lot_id}", lot_sample_id: "${s1_id}", tag_class: "CERTIFIED", bag_count: 1380 }
              as: CertificationAgency
              as_user_id: "agency-1"
              captures: { t1_id: $.data.id }
            - call: "POST /seed-ops/certification-tags/${t1_id}/void"
              payload: { void_reason: "Tags printed with the wrong lot serial" }
              as: CertificationAgency
              as_user_id: "agency-1"
            - call: "POST /seed-ops/certification-tags"
              payload: { seed_lot_id: "${lot_id}", lot_sample_id: "${s1_id}", tag_class: "CERTIFIED", bag_count: 1380 }
              as: CertificationAgency
              as_user_id: "agency-1"
              captures: { t2_id: $.data.id }
          assert:
            - "AFTER CREATE: ProductionContract.${c_id}.certified_units_total == 1380.05 and SeedLot.${lot_id}.tagged_bag_count == 1380 and certification_status == TAGGED"
            - "AFTER SOURCE REMOVAL: ProductionContract.${c_id}.certified_units_total == 0.0, SeedLot.${lot_id}.tagged_bag_count == 0 and certification_status == PASSED"
            - "CertificationTag.${t1_id}.status == VOIDED and void_reason is stored"
            - "AFTER RE-CREATE: ProductionContract.${c_id}.certified_units_total == 1380.05 again and CertificationTag.${t2_id}.status == ISSUED with a tag_serial distinct from ${t1_id}"
            - "GET /seed-ops/certification-tags?seed_lot_id=${lot_id} returns total_count 2 - the VOIDED row is retained, so the roll-up filters on status rather than deleting history"

      - name: cascading_side_effect_chain_depth
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / sample_fail_cascade_voids_tags_and_supersedes_settlement
          rationale: "The five-hop end-to-end chain, its ordering sensitivity and the per-hop version bumps are asserted there."

      - name: dual_variant_calculation_switch_delta
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / clean_unit_variant_divergence_provisional_vs_final
          rationale: "Both variants and the exact delta on the switch are asserted there, with the eligibility pair covered by eligibility_variant_divergence_strict_vs_decay."

