              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 25000000, effective_from: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
              captures: { f2_items: $.data.affected_menu_item_count }
          trigger:
            - call: "POST /culinary/price-change-proposals/${prop_id}/submit"
              as: RecipeDeveloper
              captures: { first_error: $.data.error_id, first_message: $.data.message }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_after: $.data.batch_cost_micros, portion_after: $.data.portion_cost_micros }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_after: $.data.plate_cost_cents, fc_after: $.data.food_cost_bps }
            - call: "POST /culinary/price-change-proposals/${prop_id}/submit"
              as: RecipeDeveloper
              captures: { second_error: $.data.error_id }
          assert:
            - "${plate_before} == 100 and ${f2_items} == 1 — the publication is what makes the plate cost stale"
            - "${first_error} == ERR_COST_STALE with HTTP 409 — priority 26 wins even though the 600-cent price also breaches the 448-cent cap checked at priority 47"
            - "${batch_after} == 4409171 (400 * 25000000 / 2268) and ${portion_after} == 1102293"
            - "${plate_after} == 114 (s1 1102293, s2 1124339, garnish 16865, plate_cost_micros 1141204) and ${fc_after} == 2850"
            - "${second_error} == ERR_MARKET_CAP_EXCEEDED with HTTP 422 — the fiscal violation was live during the first call and only became reportable once the state violation was cleared"
            - "PriceChangeProposal.${prop_id}.status == DRAFT with projected_food_cost_bps still null after both failures — 1900 would have been its value (114 * 10000 / 600), which is below the 3000 target, so no relief would have applied"
            - "MenuItem.${mi_id}.current_price_cents == 400"

      - name: feed_publish_reports_ingredient_retired_referential_error_before_window_overlap_temporal_error
        grounds:
          - validations[priority 31]
          - validations[priority 45]
          - state_machines.PriceFeed.DRAFT_to_PUBLISHED
          - entities.Ingredient.fields.status
          - endpoints[POST /culinary/ingredients/{ingredient_id}/retire]
        distinguishing_aspect: |
          Feed 2 carries a line that is BOTH on a RETIRED ingredient and inside an existing
          PUBLISHED window, and must report ERR_INGREDIENT_RETIRED (priority 31, HTTP 422); feed 3
          carries the identical window collision on an ACTIVE ingredient and reports
          ERR_PRICE_WINDOW_OVERLAP (priority 45, HTTP 409). The winning error carries the HIGHER
          HTTP status, the mirror image of the other priority_pair instance, and the two violated
          rules sit in different categories (business_referential versus business_temporal) on two
          separate feed rows rather than on one repeated request.
        test_recipe:
          setup:
            - "Two ingredients, TOMATO-SAUCE (pack 3785) and PEANUT-OIL (pack 946), each with one PUBLISHED open-ended MW price effective from 2026-07-01T00:00:00Z loaded by feed 1."
            - "TOMATO-SAUCE is then RETIRED; PEANUT-OIL stays ACTIVE."
            - "Feed 2 (DRAFT) holds one TOMATO-SAUCE line effective from 2026-06-01T00:00:00.000Z — earlier than the existing PUBLISHED row's effective_from, which is a collision under the half-open rule, on an ingredient that is also retired."
            - "Feed 3 (DRAFT) holds one PEANUT-OIL line with the same 2026-06-01T00:00:00.000Z start, so it reproduces only the temporal violation."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "TOMATO-SAUCE", name: "Tomato Sauce", base_uom: "GRAM", pack_base_units: 3785, trim_yield_bps: 10000, cook_shrink_bps: 500, allergen_mask: 0, kcal_per_base_unit_micros: 300000, sodium_mcg_per_base_unit: 4100 }
              as: RecipeDeveloper
              captures: { sauce_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Oil", base_uom: "GRAM", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${sauce_id}", pack_cost_micros: 9500000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
              captures: { feed1_status: $.data.status, feed1_superseded: $.data.superseded_price_count }
            - call: "POST /culinary/ingredients/${sauce_id}/retire"
              as: CulinaryDirector
              captures: { sauce_status: $.data.status }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${sauce_id}", pack_cost_micros: 9000000, effective_from: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_line_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed3_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed3_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 11000000, effective_from: "2026-06-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed3_line_id: $.data.id }
          trigger:
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
              captures: { feed2_error: $.data.error_id, feed2_message: $.data.message }
            - call: "POST /culinary/price-feeds/${feed3_id}/publish"
              as: CostAnalyst
              captures: { feed3_error: $.data.error_id }
          assert:
            - "${feed1_status} == PUBLISHED with ${feed1_superseded} == 0 and ${sauce_status} == RETIRED"
            - "${feed2_error} == ERR_INGREDIENT_RETIRED with HTTP 422 — priority 31 outranks the equally live window collision at priority 45"
            - "${feed3_error} == ERR_PRICE_WINDOW_OVERLAP with HTTP 409 — the identical 2026-06-01 start on an ACTIVE ingredient isolates the temporal rule"
            - "PriceFeed.${feed2_id}.status == DRAFT and PriceFeed.${feed3_id}.status == DRAFT — neither failed publish advanced its feed"
            - "IngredientPrice.${feed2_line_id}.status == PENDING and IngredientPrice.${feed3_line_id}.status == PENDING"
            - "The two PUBLISHED 2026-07-01 rows still have effective_to null — a failed publish truncates nothing"
  - rule_id: boundary_precision_check
    instances:
      - name: mix_percentage_exactly_at_popularity_threshold_classifies_as_plowhorse
        grounds:
          - calculations.menu_mix_classification
          - constants.POPULARITY_FACTOR_BPS
          - entities.MenuMixLine.fields.mix_pct_bps
          - entities.MenuMixLine.fields.margin_class
          - entities.MenuPeriodReview.fields.popularity_threshold_bps
          - entities.MenuPeriodReview.fields.margin_threshold_cents
        distinguishing_aspect: |
          The 700-unit line's mix_pct_bps lands EXACTLY on popularity_threshold_bps 3500
          (700 * 10000 / 2000 with no remainder, against 7000 / 2 lines), and the inclusive
          comparison puts it on the popular side, so it classifies PLOWHORSE; an exclusive
          comparison would classify it DOG while leaving the other line's STAR untouched, so the
          boundary is observable in exactly one field. The other boundary_precision_check instance
          sits on a monetary floor and an instant, not on a percentage, and its boundary is
          satisfied yet still produces the unfavourable verdict because a second AND-arm fails.
        test_recipe:
          setup:
            - "GRILL WORLD pricing: CHEDDAR-BLOCK 22000000 per 2268 PUBLISHED for MW, Recipe PLATE-GRILL ACTIVE with portion_cost_micros 970018."
            - "Two ACTIVE MenuItems on that recipe, both with plate_cost_cents 100: MI-GRILL-A at 1099 cents and MI-GRILL-B at 985 cents."
            - "One MenuPeriodReview with two mix lines chosen so that both divisions are exact: A sold 1300 units for 1428700 cents (exactly 1099 each) and B sold 700 units for 689500 cents (exactly 985 each), for total_units_sold 2000."
            - "With two lines, popularity_threshold_bps = round_half_up(7000 / 2) = 3500 and B's mix_pct_bps is exactly 3500."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-A", name: "Grilled Cheese Large", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 1099, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_a_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_a_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_a: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_a_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-B", name: "Grilled Cheese Small", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 985, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_b_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_b_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_b: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_b_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/units"
              payload: { code: "UNIT-MW-01", name: "Downtown MW", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_a_id}", units_sold: 1300, gross_sales_cents: 1428700 }
              as: CostAnalyst
              captures: { line_a_id: $.data.id }
            - call: "GET /culinary/menu-period-reviews/${rev_id}"
              as: CostAnalyst
              captures: { rev_status_after_first_line: $.data.status }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_b_id}", units_sold: 700, gross_sales_cents: 689500 }
              as: CostAnalyst
              captures: { line_b_id: $.data.id }
          trigger:
            - call: "POST /culinary/menu-period-reviews/${rev_id}/classify"
              as: CostAnalyst
              captures: { rev_status: $.data.status, total_units: $.data.total_units_sold, pop_threshold: $.data.popularity_threshold_bps, margin_threshold: $.data.margin_threshold_cents }
          assert:
            - "${plate_a} == 100 and ${plate_b} == 100 — identical plate costs, so only the mix percentages and the contribution margins separate the two lines"
            - "${rev_status_after_first_line} == MIX_LOADED — the review auto-advances on its first mix line"
            - "${rev_status} == CLASSIFIED and ${total_units} == 2000"
            - "${pop_threshold} == 3500 == round_half_up(POPULARITY_FACTOR_BPS 7000 / 2 lines)"
            - "${margin_threshold} == 959 — round_half_up((1300 * 999 + 700 * 885) / 2000) = round_half_up(1918200 / 2000) = round_half_up(959.1)"
            - "MenuMixLine.${line_a_id}.mix_pct_bps == 6500, cm_per_unit_cents == 999 (1428700 / 1300 = 1099 exactly, minus the 100-cent snapshot) and margin_class == STAR"
            - "MenuMixLine.${line_b_id}.mix_pct_bps == 3500 — exactly equal to popularity_threshold_bps, not one basis point either side"
            - "MenuMixLine.${line_b_id}.cm_per_unit_cents == 885 (689500 / 700 = 985 exactly) which is strictly below the 959 threshold"
            - "MenuMixLine.${line_b_id}.margin_class == PLOWHORSE and NOT DOG — popular by the inclusive arm of the popularity comparison, unprofitable by the strict arm of the margin comparison"
            - "MenuItem.${mi_a_id}.margin_class == STAR and MenuItem.${mi_b_id}.margin_class == PLOWHORSE — classify copies each line's class onto its item"

      - name: lto_close_review_with_zero_actual_units_is_unprofitable_at_the_contribution_boundary
        grounds:
          - calculations.lto_post_promo_profitability
          - constants.LTO_MIN_CONTRIBUTION_CENTS
          - constants.LTO_MIN_ATTAINMENT_BPS
          - state_machines.LTOCampaign.LAUNCHED_to_CLOSED
          - state_machines.LTOCampaign.CLOSED_to_RENEWED
          - validations[priority 44]
        distinguishing_aspect: |
          A campaign closed with actual_units 0 and actual_gross_sales_cents 0 produces
          promo_contribution_cents EXACTLY 0, which satisfies the inclusive
          >= LTO_MIN_CONTRIBUTION_CENTS arm, and forecast_attainment_bps exactly 0, which fails the
          >= 8000 arm, so the verdict is UNPROFITABLE and RENEW is unreachable — a two-armed AND
          boundary where one arm is met at its exact limit. The close-review call additionally sits
          on a temporal boundary: the clock is moved to exactly window_end, the inclusive edge of
          priority 44. The other boundary_precision_check instance's boundary is a rounded
          percentage tie inside a classification, not a floor met with equality.
        test_recipe:
          setup:
            - "GRILL WORLD: Recipe PLATE-GRILL ACTIVE / FRESH, MenuItem MI-GRILL-MW ACTIVE in MW at 400 cents with plate_cost_cents 100 and plate_cost_state FRESH."
            - "One LTOCampaign on that item over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z) at promo_price_cents 380 with forecast_units 500, COSTED (promo_plate_cost_cents 100, promo_food_cost_bps 2632, forecast_contribution_cents 140000) and then LAUNCHED while the clock is still 2026-08-01T00:00:00Z."
            - "The logical clock is then advanced to exactly 2026-08-20T00:00:00.000Z — the campaign's window_end, the inclusive edge of the close-review temporal gate."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
              captures: { mi_v_active: $.data.version }
            - call: "POST /culinary/lto-campaigns"
              payload: { menu_item_id: "${mi_id}", window_start: "2026-08-10T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", promo_price_cents: 380, forecast_units: 500, expected_menu_item_version: "${mi_v_active}" }
              as: RecipeDeveloper
              captures: { lto_id: $.data.id, lto_status_planned: $.data.status }
            - call: "POST /culinary/lto-campaigns/${lto_id}/cost"
              as: CostAnalyst
              captures: { lto_pfc: $.data.promo_food_cost_bps, lto_forecast_contrib: $.data.forecast_contribution_cents }
            - call: "POST /culinary/lto-campaigns/${lto_id}/launch"
              as: CulinaryDirector
              captures: { lto_status_launched: $.data.status }
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /culinary/lto-campaigns/${lto_id}/close-review"
              payload: { actual_units: 0, actual_gross_sales_cents: 0 }
              as: CostAnalyst
              captures: { close_status: $.data.status, support: $.data.promo_support_cost_cents, contribution: $.data.promo_contribution_cents, attainment: $.data.forecast_attainment_bps, verdict: $.data.verdict }
            - call: "POST /culinary/lto-campaigns/${lto_id}/decide"
              payload: { decision: "RENEW" }
              as: CulinaryDirector
              captures: { decide_error: $.data.error_id }
          assert:
            - "${lto_status_planned} == PLANNED at creation, ${lto_pfc} == 2632 (100 * 10000 / 380) and ${lto_forecast_contrib} == 140000 (500 * 280); ${lto_status_launched} == LAUNCHED"
            - "${close_status} == CLOSED — the clock sits exactly on window_end, which satisfies the inclusive priority-44 gate rather than tripping ERR_EFFECTIVE_DATE_NOT_REACHED"
            - "${support} == 0 (round_half_up(0 * 300 / 10000)) and ${contribution} == 0 — exactly LTO_MIN_CONTRIBUTION_CENTS, so the first verdict arm is satisfied at its limit"
            - "${attainment} == 0 which is strictly below LTO_MIN_ATTAINMENT_BPS 8000"
            - "${verdict} == UNPROFITABLE — an AND of a satisfied boundary and a failed boundary, not a sign test on the contribution alone"
            - "${decide_error} == ERR_LTO_INVALID_STATE with HTTP 409 — the RENEW arm requires verdict PROFITABLE, so no successor campaign is minted"
            - "LTOCampaign.${lto_id}.status == CLOSED with actual_units == 0 and actual_gross_sales_cents == 0 stored"
            - "MenuItem.${mi_id}.is_lto == false and open_lto_count == 0 after the close-review, and status is still ACTIVE because the failed RENEW never reached the RETIRE arm's suspension"
            - "GET /culinary/lto-campaigns filtered by menu_item_id returns exactly 1 row — the failed decide minted nothing"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: menu_item_activation_requires_backing_recipe_active
        grounds:
          - state_machines.MenuItem.DRAFT_to_ACTIVE
          - validations[priority 18]
          - state_machines.Recipe.UNDER_REVIEW_to_ACTIVE
          - entities.MenuItem.fields.status
          - entities.Recipe.fields.status
        distinguishing_aspect: |
          The MenuItem is internally perfect — plate_cost_state FRESH, plate_cost_cents 100,
          declared_allergen_mask covering the recipe's mask — and is blocked purely by ANOTHER
          entity's lifecycle status (Recipe.status == UNDER_REVIEW) at priority 18; activating the
          recipe, with no further write to the item, unblocks the identical request. The other
          cross_entity_state_dependency instance is blocked by another entity's DERIVED freshness
          flag rather than its lifecycle status, and that flag is flipped by a third entity.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK priced 22000000 per 2268 base units, PUBLISHED for MW."
            - "Recipe PLATE-GRILL (batch_yield 4, portions 4, cheddar ep 400) rolled up to portion_cost_micros 970018 and then submitted for review, so it sits in UNDER_REVIEW with cost_state FRESH and allergen_mask 1."
            - "MenuItem MI-GRILL-MW created on that recipe in MW at 400 cents with declared_allergen_mask 1, plate-costed to 100 cents and plate_cost_state FRESH, still in DRAFT."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
