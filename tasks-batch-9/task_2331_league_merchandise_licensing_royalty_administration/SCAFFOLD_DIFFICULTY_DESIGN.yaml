              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Foundry Sportswear", contact_email: "ops@foundry.example", home_country_code: "US", vendor_compliance_certified: true }
