# =============================================================================
# SCAFFOLD — Student Device & Textbook Inventory (1:1 program)
# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim) · §1.1 Entities · §1.2 State
# Machines · §1.2.1 Concurrency · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
#
# (§1.8 scaffold_difficulty_design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
#  §1.9 scaffold_corner_design lives in SCAFFOLD_CORNER_DESIGN.yaml. Neither
#  key appears here per SKILL.md §Output.)
# =============================================================================

scenario: |
  1118. Student Device & Textbook Inventory (1:1 program): asset assignment
  to student & barcode/serial tracking, damage/loss fee schedule & insurance
  option, repair depot & loaner pool, summer collection & re-imaging,
  end-of-life refresh & disposal/donation, family agreement & acceptable use,
  fee waiver for low-income families, inventory audit & unaccounted-asset
  write-off.

domain_name: student-device-textbook-inventory
api_prefix: /api

# -----------------------------------------------------------------------------
# §0 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation           # repair depot + loaner pool are finite pools competed for, reserved, committed, released
  secondary_archetype: posture_driven_gating    # StudentAccount posture (CLEAR / FEES_OUTSTANDING / SUSPENDED) gates assignment, renewal, summer checkout
  complexity_layers:
    - optimistic_concurrency                    # OCC on StudentAccount.version and AssetUnit.version
    - cascading_side_effects                    # damage report → fee assessed → fee schedule tier lookup → posture recompute → assignment freeze
    - dual_variant_calculation                  # provisional vs final damage fee; depreciated vs replacement value at end-of-life
    - rate_threshold_triggers                   # loaner pool threshold triggers; insurance deductible tier
    - derived_field_reconciliation              # StudentAccount.outstanding_balance_cents from FeeAssessment rows; AssetUnit.depreciated_value_cents from lifecycle events
    - ops_run_checkpoint                        # SummerCollection sweep; EndOfLifeRefresh batch
    - soft_delete                               # written-off assets retained for audit
    - bulk_operations                           # audit sweep; re-imaging batch
    - selector_policy                           # loaner pool allocation: ranking + tie-break over candidate pool

  entity_topology: hierarchical                 # StudentAccount → Assignment → FeeAssessment/LoanerCheckout; AssetFleet → AssetUnit → AssetLifecycleEvent
  state_machine_shape: compound                 # AssetUnit lifecycle is cyclic (REPAIR→READY→DEPLOYED→REPAIR); StudentAccount has parallel dimensions (financial_posture × agreement_status); SummerCollection and Audit are batch-run state machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate                           # Assignment links StudentAccount and AssetUnit (across the two hierarchies)
    - self_referential                          # AssetLifecycleEvent references a parent AssetLifecycleEvent for superseding corrections
  role_model: hierarchical_override             # DistrictAdmin ⊃ SiteTechnician ⊃ Registrar ⊃ Family
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DistrictProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Display name for the 1:1 program" }
      - { name: school_year, type: string, source: input, description: "e.g. '2026-2027'; scopes summer collection and end-of-life refresh" }
      - { name: loaner_pool_threshold_pct, type: number, source: input, default: 0.10, description: "Fraction of deployable fleet reserved as loaner floor; assignment rejected if granting would breach floor" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → SUMMER_COLLECTION → CLOSED" }

  - name: StudentAccount
    parent: DistrictProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> DistrictProgram.id; owning program" }
      - { name: student_external_id, type: string, source: input, description: "SIS identifier; unique per program" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: grade_level, type: integer, source: input, description: "0-12" }
      - { name: free_lunch_eligible, type: boolean, source: input, default: false, description: "Drives fee waiver eligibility" }
      - { name: family_agreement_status, type: enum, source: system, description: "PENDING → SIGNED / DECLINED" }
      - { name: insurance_enrolled, type: boolean, source: system, default: false, description: "True while an InsurancePolicy row is ACTIVE" }
      - { name: financial_posture, type: enum, source: computed, description: "Derived from open FeeAssessments: CLEAR | FEES_OUTSTANDING | SUSPENDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum over FeeAssessment where status IN {ASSESSED, APPEALED} of amount_cents − waived_cents − paid_cents" }
      - { name: lifetime_damage_count, type: integer, source: computed, default: 0, description: "Count of DamageReport rows with status=CONFIRMED for this student" }
      - { name: status, type: enum, source: system, description: "ENROLLED → WITHDRAWN / GRADUATED" }

  - name: FamilyAgreement
    parent: StudentAccount
    common_fields: false
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; one per student" }
      - { name: acceptable_use_version, type: string, source: input, description: "Version label of the AUP document signed (e.g. 'AUP-2026.v3')" }
      - { name: signed_by_guardian_name, type: string, source: input, description: "Guardian full name at signing time" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of signing; null while PENDING" }
      - { name: signature_state, type: enum, source: system, description: "PENDING → SIGNED / DECLINED" }

  - name: InsurancePolicy
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id; one ACTIVE policy per student" }
      - { name: premium_cents, type: integer, source: input, description: "Annual premium; non-refundable once ACTIVE" }
      - { name: deductible_cents, type: integer, source: input, description: "Per-incident deductible applied to damage fee" }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Max payout per school year" }
      - { name: academic_year, type: string, source: input, description: "Scopes policy to a school year" }
      - { name: status, type: enum, source: system, description: "QUOTED → ACTIVE → EXHAUSTED / CANCELLED / EXPIRED" }

  - name: AssetFleet
    parent: DistrictProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> DistrictProgram.id" }
      - { name: fleet_name, type: string, source: input, description: "e.g. 'Chromebook-Grade-9-2026'" }
      - { name: asset_class, type: enum, source: input, description: "DEVICE | TEXTBOOK" }
      - { name: unit_replacement_cost_cents, type: integer, source: input, description: "Replacement cost used in fee schedule and end-of-life" }
      - { name: salvage_value_cents, type: integer, source: input, description: "Floor for depreciation calc" }
      - { name: useful_life_months, type: integer, source: input, description: "Straight-line depreciation denominator" }
      - { name: in_service_date, type: datetime, source: input, description: "Depreciation start; also summer collection anchor" }

  - name: AssetUnit
    parent: AssetFleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "FK -> AssetFleet.id" }
      - { name: asset_tag_barcode, type: string, source: input, description: "Unique barcode within program" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique within fleet" }
      - { name: condition_grade, type: enum, source: system, default: "A", description: "A | B | C | D | F — assigned at intake and after each repair" }
      - { name: lifecycle_status, type: enum, source: system, description: "READY → DEPLOYED → IN_REPAIR → LOANER → SUMMER_INTAKE → RE_IMAGING → END_OF_LIFE → DISPOSED / DONATED / WRITTEN_OFF" }
      - { name: depreciated_value_cents, type: integer, source: computed, description: "Straight-line: max(salvage, replacement_cost − months_in_service × (replacement_cost − salvage)/useful_life_months)" }
      - { name: months_in_service, type: integer, source: computed, description: "Calendar months between in_service_date and current_utc, capped at useful_life_months" }
      - { name: assigned_to_student_id, type: string, source: system, description: "FK -> StudentAccount.id; null unless lifecycle_status == DEPLOYED or LOANER" }

  - name: Assignment
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id" }
      - { name: asset_unit_id, type: string, source: input, description: "FK -> AssetUnit.id" }
      - { name: expected_return_date, type: datetime, source: input, description: "Summer collection deadline for this assignment" }
      - { name: checked_out_at, type: datetime, source: system, description: "Server clock at checkout" }
      - { name: checked_in_at, type: datetime, source: system, description: "Null until return" }
      - { name: checkout_condition_grade, type: enum, source: system, description: "Grade at checkout for damage delta comparison" }
      - { name: return_condition_grade, type: enum, source: system, description: "Grade recorded at return; null while open" }
      - { name: late_return_days, type: integer, source: computed, description: "max(0, calendar_days(checked_in_at, expected_return_date))" }
      - { name: status, type: enum, source: system, description: "ACTIVE → RETURNED / OVERDUE / LOST" }

  - name: DamageReport
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id" }
      - { name: reported_by_role, type: enum, source: input, description: "FAMILY | SITE_TECH | SYSTEM — provenance of report" }
      - { name: damage_category, type: enum, source: input, description: "COSMETIC | FUNCTIONAL | LIQUID | SCREEN | LOSS | THEFT" }
      - { name: observed_condition_grade, type: enum, source: input, description: "Grade at discovery" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee at report time using provisional variant of fee schedule" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Null until CONFIRMED; uses final variant with insurance + waiver applied" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → CONFIRMED / DISMISSED" }

  - name: FeeAssessment
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id" }
      - { name: source_damage_report_id, type: string, source: system, description: "FK -> DamageReport.id; null for LATE_RETURN and NON_RETURN fees" }
      - { name: fee_type, type: enum, source: system, description: "DAMAGE | LATE_RETURN | NON_RETURN | INSURANCE_DEDUCTIBLE" }
      - { name: amount_cents, type: integer, source: computed, description: "Gross fee before waiver/insurance credit" }
      - { name: waived_cents, type: integer, source: computed, default: 0, description: "Amount covered by fee waiver for free_lunch_eligible students" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of FeePayment rows" }
      - { name: status, type: enum, source: system, description: "ASSESSED → APPEALED → SETTLED / WAIVED / WRITTEN_OFF" }

  - name: LoanerCheckout
    parent: StudentAccount
    common_fields: true
    fields:
      - { name: student_account_id, type: string, source: system, description: "FK -> StudentAccount.id" }
      - { name: loaner_asset_unit_id, type: string, source: input, description: "FK -> AssetUnit.id; must be in lifecycle_status == LOANER" }
      - { name: checkout_reason, type: enum, source: input, description: "REPAIR | LOSS_PENDING | NEW_ENROLLMENT" }
      - { name: max_loaner_days, type: integer, source: input, default: 14, description: "Hard cap on loaner duration" }
      - { name: returned_at, type: datetime, source: system, description: "Null while open" }
      - { name: status, type: enum, source: system, description: "OPEN → RETURNED / OVERDUE / ESCALATED" }

  - name: AssetLifecycleEvent
    parent: AssetUnit
    common_fields: false
    fields:
      - { name: asset_unit_id, type: string, source: system, description: "FK -> AssetUnit.id" }
      - { name: event_type, type: enum, source: input, description: "INTAKE | DEPLOY | RETURN | REPAIR_START | REPAIR_COMPLETE | RE_IMAGE | RETIRE | DISPOSE | DONATE | WRITE_OFF | CORRECTION" }
      - { name: supersedes_event_id, type: string, source: input, description: "FK -> AssetLifecycleEvent.id; null unless event_type == CORRECTION" }
      - { name: event_payload, type: object, source: input, description: "Type-specific details (e.g. re-image image_version, repair cost)" }
      - { name: occurred_at, type: datetime, source: system, description: "Server clock at event creation" }

  - name: AuditSweep
    parent: DistrictProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> DistrictProgram.id" }
      - { name: sweep_label, type: string, source: input, description: "e.g. 'spring-2026-cycle-2'" }
      - { name: started_at, type: datetime, source: system, description: "Set when sweep moves to IN_PROGRESS" }
      - { name: closed_at, type: datetime, source: system, description: "Set when sweep moves to CLOSED" }
      - { name: unaccounted_count, type: integer, source: computed, default: 0, description: "Count of AssetUnits marked UNACCOUNTED during this sweep" }
      - { name: status, type: enum, source: system, description: "DRAFT → IN_PROGRESS → RECONCILING → CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DistrictProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /api/programs/{progId}/activate
        actor: DistrictAdmin
        preconditions: ["At least one AssetFleet exists for this program (ERR_PROGRAM_HAS_NO_FLEET)"]
        side_effects: []
      - from: ACTIVE
        to: SUMMER_COLLECTION
        trigger: POST /api/programs/{progId}/begin-summer-collection
        actor: DistrictAdmin
        preconditions: ["No Assignment is OVERDUE for > 30 days without a NON_RETURN FeeAssessment (ERR_OVERDUE_UNRESOLVED)"]
        side_effects:
          - "All Assignment rows with status == ACTIVE transition to OVERDUE if expected_return_date < current_utc"
          - "All AssetUnits with lifecycle_status == DEPLOYED transition to SUMMER_INTAKE as their Assignments close"
      - from: SUMMER_COLLECTION
        to: CLOSED
        trigger: POST /api/programs/{progId}/close
        actor: DistrictAdmin
        preconditions:
          - "All AssetUnits in lifecycle_status IN {SUMMER_INTAKE, RE_IMAGING} have been processed (ERR_UNPROCESSED_SUMMER_INTAKE)"
          - "All AuditSweeps for the program are CLOSED (ERR_OPEN_AUDIT_SWEEP)"
        side_effects: []

  - entity: StudentAccount
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN, GRADUATED]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: POST /api/programs/{progId}/students/{studentId}/withdraw
        actor: Registrar
        preconditions:
          - "No Assignment with status IN {ACTIVE, OVERDUE} (ERR_OPEN_ASSIGNMENTS)"
          - "financial_posture == CLEAR (ERR_FEES_OUTSTANDING)"
        side_effects: []
      - from: ENROLLED
        to: GRADUATED
        trigger: POST /api/programs/{progId}/students/{studentId}/graduate
        actor: Registrar
        preconditions:
          - "No Assignment with status IN {ACTIVE, OVERDUE} (ERR_OPEN_ASSIGNMENTS)"
          - "financial_posture == CLEAR (ERR_FEES_OUTSTANDING)"
        side_effects: []

  - entity: FamilyAgreement
    initial_state: PENDING
    terminal_states: [SIGNED, DECLINED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: POST /api/programs/{progId}/students/{studentId}/family-agreement/sign
        actor: Family
        preconditions: ["StudentAccount.status == ENROLLED (ERR_STUDENT_NOT_ENROLLED)"]
        side_effects:
          - "StudentAccount.family_agreement_status → SIGNED"
          - "signed_at := current_utc"
      - from: PENDING
        to: DECLINED
        trigger: POST /api/programs/{progId}/students/{studentId}/family-agreement/decline
        actor: Family
        preconditions: ["StudentAccount.status == ENROLLED (ERR_STUDENT_NOT_ENROLLED)"]
        side_effects:
          - "StudentAccount.family_agreement_status → DECLINED"
          - "StudentAccount cannot receive new Assignments until a new agreement is signed (guard on POST /assignments)"

  - entity: InsurancePolicy
    initial_state: QUOTED
    terminal_states: [EXHAUSTED, CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: POST /api/programs/{progId}/students/{studentId}/insurance-policies/{policyId}/activate
        actor: Family
        preconditions:
          - "StudentAccount.family_agreement_status == SIGNED (ERR_AGREEMENT_NOT_SIGNED)"
          - "No other InsurancePolicy for this student with status == ACTIVE (ERR_ACTIVE_POLICY_EXISTS)"
          - "academic_year matches DistrictProgram.school_year (ERR_POLICY_YEAR_MISMATCH)"
        side_effects:
          - "StudentAccount.insurance_enrolled := true"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when cumulative payouts >= coverage_cap_cents)"
        actor: system
        preconditions: []
        side_effects: ["StudentAccount.insurance_enrolled := false"]
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /api/programs/{progId}/students/{studentId}/insurance-policies/{policyId}/cancel
        actor: Family
        preconditions: ["No FeeAssessment with status == APPEALED tied to a DamageReport under this policy (ERR_PENDING_APPEAL_BLOCKS_CANCEL)"]
        side_effects: ["StudentAccount.insurance_enrolled := false"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic on DistrictProgram.school_year rollover or POST /api/programs/{progId}/expire-insurance-policies)"
        actor: system
        preconditions: []
        side_effects: ["StudentAccount.insurance_enrolled := false"]

  - entity: AssetUnit
    initial_state: READY
    terminal_states: [DISPOSED, DONATED, WRITTEN_OFF]
    transitions:
      - from: READY
        to: DEPLOYED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments (asset is selected by policy)
        actor: Registrar
        preconditions:
          - "AssetUnit.lifecycle_status == READY (ERR_ASSET_NOT_READY)"
          - "AssetUnit.condition_grade != 'F' (ERR_ASSET_NOT_READY)"
        side_effects:
          - "AssetUnit.assigned_to_student_id := Assignment.student_account_id"
          - "AssetLifecycleEvent DEPLOY appended"
      - from: DEPLOYED
        to: IN_REPAIR
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports (with damage_category IN {FUNCTIONAL, LIQUID, SCREEN} and observed_condition_grade IN {D, F})
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "AssetLifecycleEvent REPAIR_START appended"
      - from: IN_REPAIR
        to: READY
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/complete-repair
        actor: SiteTechnician
        preconditions: ["Repair cost recorded in event_payload.repair_cost_cents (ERR_REPAIR_COST_REQUIRED)"]
        side_effects:
          - "AssetUnit.condition_grade updated from event_payload.post_repair_grade"
          - "AssetLifecycleEvent REPAIR_COMPLETE appended"
          - "Any matching LoanerCheckout with checkout_reason == REPAIR is flagged for return"
      - from: DEPLOYED
        to: SUMMER_INTAKE
        trigger: "system (DistrictProgram.begin-summer-collection)"
        actor: system
        preconditions: []
        side_effects:
          - "AssetLifecycleEvent RETURN appended"
      - from: SUMMER_INTAKE
        to: RE_IMAGING
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/begin-reimage
        actor: SiteTechnician
        preconditions: ["AssetFleet.asset_class == DEVICE (ERR_REIMAGE_TEXTBOOK_NOT_ALLOWED)"]
        side_effects: ["AssetLifecycleEvent RE_IMAGE appended"]
      - from: RE_IMAGING
        to: READY
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/complete-reimage
        actor: SiteTechnician
        preconditions: ["event_payload.image_version recorded (ERR_IMAGE_VERSION_REQUIRED)"]
        side_effects: []
      - from: SUMMER_INTAKE
        to: READY
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/complete-reimage
        actor: SiteTechnician
        preconditions: ["AssetFleet.asset_class == TEXTBOOK (textbooks skip imaging)"]
        side_effects: []
      - from: READY
        to: LOANER
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/designate-loaner
        actor: SiteTechnician
        preconditions: ["AssetUnit.condition_grade IN {A, B, C} (ERR_LOANER_CONDITION_TOO_LOW)"]
        side_effects: []
      - from: LOANER
        to: DEPLOYED
        trigger: POST /api/programs/{progId}/students/{studentId}/loaner-checkouts
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "AssetLifecycleEvent DEPLOY appended with payload.loaner := true"
      - from: LOANER
        to: READY
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/return-loaner-to-pool
        actor: SiteTechnician
        preconditions: ["No OPEN LoanerCheckout references this AssetUnit (ERR_LOANER_STILL_OUT)"]
        side_effects: []
      - from: DEPLOYED
        to: END_OF_LIFE
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/retire
        actor: DistrictAdmin
        preconditions:
          - "AssetUnit.months_in_service >= AssetFleet.useful_life_months OR AssetUnit.condition_grade == 'F' with two failed repairs (ERR_EOL_CRITERIA_NOT_MET)"
        side_effects: ["AssetLifecycleEvent RETIRE appended"]
      - from: READY
        to: END_OF_LIFE
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/retire
        actor: DistrictAdmin
        preconditions: ["same as DEPLOYED → END_OF_LIFE"]
        side_effects: ["AssetLifecycleEvent RETIRE appended"]
      - from: END_OF_LIFE
        to: DISPOSED
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/dispose
        actor: DistrictAdmin
        preconditions: ["AssetUnit.assigned_to_student_id is null (ERR_STILL_ASSIGNED)"]
        side_effects:
          - "AssetLifecycleEvent DISPOSE appended"
          - "AssetUnit.depreciated_value_cents := AssetFleet.salvage_value_cents"
      - from: END_OF_LIFE
        to: DONATED
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/donate
        actor: DistrictAdmin
        preconditions: ["AssetUnit.assigned_to_student_id is null (ERR_STILL_ASSIGNED)"]
        side_effects:
          - "AssetLifecycleEvent DONATE appended"
          - "AssetUnit.depreciated_value_cents := AssetFleet.salvage_value_cents"
      - from: END_OF_LIFE
        to: WRITTEN_OFF
        trigger: POST /api/programs/{progId}/asset-units/{assetId}/write-off
        actor: DistrictAdmin
        preconditions:
          - "AssetUnit was marked UNACCOUNTED in a CLOSED AuditSweep (ERR_NOT_UNACCOUNTED)"
        side_effects:
          - "AssetLifecycleEvent WRITE_OFF appended"
          - "AssetUnit.depreciated_value_cents := 0"
      - from: IN_REPAIR
        to: DEPLOYED
        trigger: "system (revert when DamageReport is DISMISSED — repair was a false alarm)"
        actor: system
        preconditions: []
        side_effects: ["AssetLifecycleEvent CORRECTION appended with supersedes_event_id := the REPAIR_START event"]

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/return
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "Assignment.checked_in_at := current_utc; late_return_days computed"
          - "If late_return_days > 0: FeeAssessment of fee_type LATE_RETURN is created"
          - "If return_condition_grade is worse than checkout_condition_grade: DamageReport auto-generated with reported_by_role=SYSTEM"
          - "AssetUnit.lifecycle_status → READY (or IN_REPAIR if damaged)"
      - from: ACTIVE
        to: OVERDUE
        trigger: "system (nightly scan OR DistrictProgram.begin-summer-collection): expected_return_date < current_utc AND checked_in_at is null"
        actor: system
        preconditions: []
        side_effects:
          - "If StudentAccount.financial_posture == CLEAR: posture recomputed → FEES_OUTSTANDING if LATE_RETURN fees generated"
      - from: OVERDUE
        to: RETURNED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/return
        actor: SiteTechnician
        preconditions: []
        side_effects: ["Same as ACTIVE → RETURNED plus late_return fee accrues at higher tier"]
      - from: OVERDUE
        to: LOST
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/declare-lost
        actor: Registrar
        preconditions: ["Assignment has been OVERDUE for >= 30 days (ERR_NOT_OVERDUE_LONG_ENOUGH)"]
        side_effects:
          - "FeeAssessment of fee_type NON_RETURN created at full AssetFleet.unit_replacement_cost_cents"
          - "AssetUnit.lifecycle_status → END_OF_LIFE"

  - entity: DamageReport
    initial_state: DRAFT
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/submit
        actor: Family
        preconditions: ["StudentAccount.family_agreement_status == SIGNED"]
        side_effects: ["provisional_fee_cents frozen at submit time"]
      - from: SUBMITTED
        to: CONFIRMED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/confirm
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "final_fee_cents computed with insurance deductible + waiver applied"
          - "FeeAssessment row created with fee_type=DAMAGE (or INSURANCE_DEDUCTIBLE for the deductible component)"
          - "StudentAccount.lifetime_damage_count += 1; financial_posture recomputed"
          - "If StudentAccount.insurance_enrolled AND cumulative payouts >= coverage_cap_cents: InsurancePolicy → EXHAUSTED"
      - from: SUBMITTED
        to: DISMISSED
        trigger: POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/dismiss
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "If AssetUnit.lifecycle_status == IN_REPAIR due to this report: revert to DEPLOYED"
          - "No FeeAssessment is created"

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [SETTLED, WAIVED, WRITTEN_OFF]
    transitions:
      - from: ASSESSED
        to: APPEALED
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal
        actor: Family
        preconditions: ["Within 30 days of assessment (ERR_APPEAL_WINDOW_CLOSED)"]
        side_effects: []
      - from: APPEALED
        to: ASSESSED
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal-deny
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["financial_posture recomputed"]
      - from: APPEALED
        to: WAIVED
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal-grant
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "waived_cents := amount_cents − paid_cents"
          - "financial_posture recomputed"
      - from: ASSESSED
        to: SETTLED
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/settle (full payment received OR waiver applied covering 100%)"
        actor: DistrictAdmin
        preconditions: ["paid_cents + waived_cents >= amount_cents (ERR_UNDERPAID)"]
        side_effects: ["financial_posture recomputed"]
      - from: ASSESSED
        to: WAIVED
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/waive
        actor: DistrictAdmin
        preconditions:
          - "StudentAccount.free_lunch_eligible == true (ERR_WAIVER_NOT_ELIGIBLE)"
          - "fee_type IN {DAMAGE, LATE_RETURN} (NON_RETURN cannot be waived; ERR_WAIVER_FORBIDDEN_FOR_FEE_TYPE)"
        side_effects:
          - "waived_cents := amount_cents − paid_cents"
          - "financial_posture recomputed"
      - from: ASSESSED
        to: WRITTEN_OFF
        trigger: POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/write-off
        actor: DistrictAdmin
        preconditions:
          - "StudentAccount.status IN {WITHDRAWN, GRADUATED} (ERR_STUDENT_ACTIVE)"
          - "FeeAssessment has been ASSESSED for >= 180 days (ERR_WRITE_OFF_TOO_EARLY)"
        side_effects: ["financial_posture recomputed"]

  - entity: LoanerCheckout
    initial_state: OPEN
    terminal_states: [RETURNED, ESCALATED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: POST /api/programs/{progId}/students/{studentId}/loaner-checkouts/{checkoutId}/return
        actor: SiteTechnician
        preconditions: []
        side_effects:
          - "returned_at := current_utc"
          - "LoanerCheckout days-over-cap computed; if elapsed > max_loaner_days: late_return FeeAssessment created"
          - "AssetUnit.lifecycle_status → LOANER (returned to pool)"
      - from: OPEN
        to: OVERDUE
        trigger: "system (nightly scan): current_utc − checked_out_at > max_loaner_days AND returned_at is null"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: RETURNED
        trigger: POST /api/programs/{progId}/students/{studentId}/loaner-checkouts/{checkoutId}/return
        actor: SiteTechnician
        preconditions: []
        side_effects: ["Same as OPEN → RETURNED; late fee calculated from day cap breach"]
      - from: OVERDUE
        to: ESCALATED
        trigger: POST /api/programs/{progId}/students/{studentId}/loaner-checkouts/{checkoutId}/escalate
        actor: DistrictAdmin
        preconditions: ["checkout has been OVERDUE for >= 7 days (ERR_NOT_OVERDUE_LONG_ENOUGH)"]
        side_effects:
          - "NON_RETURN FeeAssessment created for loaner asset replacement cost"
          - "AssetUnit.lifecycle_status → END_OF_LIFE (written off)"

  - entity: AuditSweep
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: POST /api/programs/{progId}/audit-sweeps/{sweepId}/begin
        actor: DistrictAdmin
        preconditions: ["No other AuditSweep for this program is IN_PROGRESS or RECONCILING (ERR_SWEEP_IN_PROGRESS)"]
        side_effects: ["started_at := current_utc"]
      - from: IN_PROGRESS
        to: RECONCILING
        trigger: POST /api/programs/{progId}/audit-sweeps/{sweepId}/finish-scan
        actor: DistrictAdmin
        preconditions: ["Every AssetUnit in the program has been scanned at least once in this sweep (ERR_UNSCANNED_ASSETS_REMAIN)"]
        side_effects: ["unaccounted_count computed"]
      - from: RECONCILING
        to: CLOSED
        trigger: POST /api/programs/{progId}/audit-sweeps/{sweepId}/close
        actor: DistrictAdmin
        preconditions: ["All AssetUnits flagged UNACCOUNTED during scan have been resolved (re-located or written off) (ERR_UNRESOLVED_UNACCOUNTED)"]
        side_effects: ["closed_at := current_utc"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-student
    parent_entity: StudentAccount
    write_endpoint: "POST /api/programs/{progId}/students/{studentId}/assignments"
    occ_field: "expected_student_version"
    description: |
      Creating an Assignment against a StudentAccount whose version has
      advanced since the client last observed it is rejected. Captures the
      case where another writer has just changed the student's posture
      (e.g., by settling a fee, signing the agreement, enrolling in
      insurance) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: asset-unit-transition-stale-version
    parent_entity: AssetUnit
    write_endpoint: "POST /api/programs/{progId}/asset-units/{assetId}/retire"
    occ_field: "expected_asset_unit_version"
    description: |
      Retiring an AssetUnit whose version has advanced since the client last
      observed it is rejected. Captures the case where another writer has
      just deployed, repaired, or otherwise mutated the unit and the current
      writer's lifecycle view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: audit-sweep-begin-stale-program
    parent_entity: DistrictProgram
    write_endpoint: "POST /api/programs/{progId}/audit-sweeps"
    occ_field: "expected_program_version"
    description: |
      Creating an AuditSweep against a DistrictProgram whose version has
      advanced since the client last observed it is rejected. Captures the
      case where another writer has just transitioned the program status
      (DRAFT→ACTIVE→SUMMER_COLLECTION) or begun another sweep, mutating
      program state that the new sweep's preconditions depend on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_damage_fee
    trigger: "DamageReport transitions DRAFT → SUBMITTED"
    algorithm: forward_looking
    formula: |
      base_rate = AssetFleet.unit_replacement_cost_cents
      severity_multiplier = match DamageReport.damage_category:
        COSMETIC  → 0.10
        FUNCTIONAL → 0.45
        LIQUID    → 0.80
        SCREEN    → 0.55
        LOSS      → 1.00
        THEFT     → 1.00
      condition_discount = match AssetUnit.condition_grade (pre-damage):
        A → 0.00
        B → 0.10
        C → 0.25
        D → 0.50
        F → 0.75
      raw = base_rate * severity_multiplier * (1 - condition_discount)
      provisional = round_half_up(raw, 2)
      # No insurance, no waiver at provisional time — quote the gross exposure
    constants:
      ROUNDING: "half-up to whole cents"
    precision: "0 decimal places (cents), round_half_up"

  - name: final_damage_fee
    trigger: "DamageReport transitions SUBMITTED → CONFIRMED"
    algorithm: chronological
    formula: |
      # Step 1: start from the same gross base
      gross = provisional_damage_fee(student, report)
      # Step 2: insurance deductible application (if policy ACTIVE)
      if StudentAccount.insurance_enrolled AND policy.status == ACTIVE:
        if policy.coverage_cap_cents - policy.cumulative_payouts_cents >= gross - policy.deductible_cents:
          insurance_payout = gross - policy.deductible_cents
          student_responsibility = policy.deductible_cents
        else:
          insurance_payout = policy.coverage_cap_cents - policy.cumulative_payouts_cents
          student_responsibility = gross - insurance_payout
      else:
        insurance_payout = 0
        student_responsibility = gross
      # Step 3: fee waiver (free_lunch_eligible)
      if StudentAccount.free_lunch_eligible:
        waived_portion = round_half_up(student_responsibility * WAIVER_RATE, 2)
        student_responsibility -= waived_portion
      # Step 4: enforcement cap — never charge more than current depreciated value for grades C/D/F damage
      if DamageReport.observed_condition_grade IN {C, D, F}:
        student_responsibility = min(student_responsibility, AssetUnit.depreciated_value_cents)
      final = student_responsibility
    constants:
      WAIVER_RATE: 0.80
    precision: "0 decimal places (cents), round_half_up"

  - name: late_return_fee
    trigger: "Assignment ACTIVE|OVERDUE → RETURNED, and LoanerCheckout OPEN|OVERDUE → RETURNED"
    algorithm: tiered_pricing
    formula: |
      days_late = max(0, calendar_days(checked_in_at, expected_return_date))
      # tier boundaries are INCLUSIVE on the lower edge: day 1..7 at DAILY_T1, day 8..30 at DAILY_T2, day 31+ at DAILY_T3
      if days_late == 0: fee = 0
      else:
        tier1_days = min(days_late, 7)
        tier2_days = min(max(days_late - 7, 0), 23)
        tier3_days = max(days_late - 30, 0)
        fee = tier1_days * DAILY_T1 + tier2_days * DAILY_T2 + tier3_days * DAILY_T3
      # fee waiver applies at 50% (different from damage waiver)
      if StudentAccount.free_lunch_eligible:
        fee = round_half_up(fee * 0.50, 2)
    constants:
      DAILY_T1: 100      # cents per day, days 1-7
      DAILY_T2: 250      # cents per day, days 8-30
      DAILY_T3: 500      # cents per day, days 31+
    precision: "0 decimal places (cents), round_half_up"

  - name: asset_depreciated_value
    trigger: "Computed on every AssetUnit read; cached field updated by system on the 1st of each calendar month and on lifecycle transitions"
    algorithm: decay_function
    formula: |
      months_in_service = floor((current_utc - AssetFleet.in_service_date) / 30.44 days), capped at AssetFleet.useful_life_months
      replacement = AssetFleet.unit_replacement_cost_cents
      salvage = AssetFleet.salvage_value_cents
      depreciable_amount = replacement - salvage
      depreciated = max(salvage, replacement - round_half_up(months_in_service * depreciable_amount / AssetFleet.useful_life_months, 0))
    precision: "0 decimal places (cents), round_half_up"
    variants:
      - name: end_of_life_forced
        when: "AssetUnit transitions END_OF_LIFE → DISPOSED|DONATED"
        difference: "depreciated_value_cents is force-set to salvage_value_cents, ignoring the linear formula"
      - name: write_off_forced
        when: "AssetUnit transitions END_OF_LIFE → WRITTEN_OFF"
        difference: "depreciated_value_cents is force-set to 0, ignoring both the linear formula and the salvage floor"

  - name: financial_posture_derivation
    trigger: "Any mutation on FeeAssessment for the student (create, appeal, settle, waive, write-off, appeal-grant, appeal-deny)"
    algorithm: aggregation
    formula: |
      outstanding = sum(FeeAssessment.amount_cents - FeeAssessment.waived_cents - FeeAssessment.paid_cents
                        for FeeAssessment in student.fees
                        where FeeAssessment.status IN {ASSESSED, APPEALED})
      # Posture rules (boundaries inclusive):
      #   outstanding == 0                          → CLEAR
      #   0 < outstanding < SUSPEND_THRESHOLD_CENTS → FEES_OUTSTANDING
      #   outstanding >= SUSPEND_THRESHOLD_CENTS    → SUSPENDED
      # OR: any single FeeAssessment with fee_type == NON_RETURN and status == ASSESSED forces SUSPENDED regardless of total.
    constants:
      SUSPEND_THRESHOLD_CENTS: 10000
    precision: "0 decimal places (cents)"

  - name: loaner_pool_allocation
    trigger: "POST /api/programs/{progId}/students/{studentId}/loaner-checkouts (auto-selects a loaner asset if request omits loaner_asset_unit_id)"
    algorithm: selector_policy
    formula: |
      eligible = AssetUnits where lifecycle_status == LOANER
                          AND condition_grade IN {A, B, C}
                          AND AssetFleet.asset_class matches the Assignment's fleet class (or the in-repair unit's class)
      rank by:
        1. condition_grade ASC (A before B before C)
        2. months_in_service ASC (younger first)
        3. AssetUnit.created_at ASC (oldest record first as final tie-break)
      # MUST NOT use AssetUnit.id as tie-break (forbidden — see SKILL.md §1.3)
      # Empty pool: raise ERR_LOANER_POOL_EXHAUSTED
      # Threshold check: after allocation, count of remaining LOANER units must be >= floor(loaner_pool_threshold_pct * count of DEPLOYABLE units), else reject with ERR_LOANER_FLOOR_BREACH
    precision: "n/a (selector)"

  - name: audit_unaccounted_count
    trigger: "AuditSweep transitions IN_PROGRESS → RECONCILING"
    algorithm: aggregation
    formula: |
      scanned_ids = set of AssetUnit.id where a scan event for this sweep exists
      expected_ids = set of AssetUnit.id where AssetFleet.program_id == program AND lifecycle_status NOT IN {DISPOSED, DONATED, WRITTEN_OFF}
      unaccounted = expected_ids - scanned_ids
      AuditSweep.unaccounted_count = |unaccounted|
      # side effect: for each unit in unaccounted, AssetUnit.lifecycle_status → WRITTEN_OFF after DistrictAdmin authorization via /write-off
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: existence
    check: "Path-templated IDs (progId, studentId, fleetId, assetId, assignmentId, reportId, feeId, checkoutId, policyId, sweepId) resolve to existing resources, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 3
    category: state
    check: "Parent DistrictProgram.status permits the operation (e.g., ACTIVE required for assignment creation; SUMMER_COLLECTION required for re-imaging)"
    error_id: ERR_PROGRAM_STATE_FORBIDS
    http_status: 409
    applies_to: "all child mutations"

  - priority: 4
    category: concurrency
    check: "OCC: any endpoint declaring expected_*_version must match the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assignments, POST /asset-units/{id}/retire, POST /audit-sweeps"

  - priority: 5
    category: state
    check: "Target resource state precondition for the specific transition (e.g., DamageReport must be SUBMITTED to confirm)"
    error_id: "ERR_INVALID_STATE (varies per transition — see specific errors)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "FamilyAgreement.signature_state == SIGNED before any of: assignment create, insurance activate, damage report submit"
    error_id: ERR_AGREEMENT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /assignments, POST /insurance-policies/{id}/activate, POST /damage-reports/{id}/submit"

  - priority: 7
    category: business_constraint
    check: "Student financial_posture != SUSPENDED for any operation that creates new obligations (assignment create, loaner checkout)"
    error_id: ERR_STUDENT_SUSPENDED
    http_status: 409
    applies_to: "POST /assignments, POST /loaner-checkouts"

  - priority: 8
    category: business_referential
    check: "Cross-entity referential integrity: AssetUnit.assigned_to_student_id must match Assignment.student_account_id; LoanerCheckout.asset must have lifecycle_status == LOANER; AuditSweep child scans must reference program-scoped assets"
    error_id: "ERR_REFERENTIAL_INTEGRITY (or specific: ERR_ASSET_NOT_READY, ERR_LOANER_CONDITION_TOO_LOW)"
    http_status: 409
    applies_to: "POST /assignments, POST /loaner-checkouts, POST /asset-units/{id}/designate-loaner"

  - priority: 9
    category: business_constraint
    check: "Loaner pool floor: allocation must not breach program-configured threshold"
    error_id: ERR_LOANER_FLOOR_BREACH
    http_status: 409
    applies_to: "POST /loaner-checkouts"

  - priority: 10
    category: business_temporal
    check: "Time-window rules: appeal window (30d), loaner duration cap (14d default), assignment overdue grace (>=30d before declare-lost), fee write-off (>=180d), insurance academic year match"
    error_id: "ERR_APPEAL_WINDOW_CLOSED, ERR_NOT_OVERDUE_LONG_ENOUGH, ERR_WRITE_OFF_TOO_EARLY, ERR_POLICY_YEAR_MISMATCH"
    http_status: 409
    applies_to: "appeal, declare-lost, write-off, insurance-activate"

  - priority: 11
    category: business_fiscal
    check: "Fee amount arithmetic: paid_cents + waived_cents >= amount_cents before SETTLED; waiver only on DAMAGE/LATE_RETURN for free_lunch_eligible; insurance cap respected"
    error_id: "ERR_UNDERPAID, ERR_WAIVER_NOT_ELIGIBLE, ERR_WAIVER_FORBIDDEN_FOR_FEE_TYPE"
    http_status: 422
    applies_to: "POST /fees/{id}/settle, POST /fees/{id}/waive"

  - priority: 12
    category: business_safety
    check: "End-of-life criteria: months_in_service >= useful_life_months OR condition_grade == F with >= 2 failed repairs"
    error_id: ERR_EOL_CRITERIA_NOT_MET
    http_status: 409
    applies_to: "POST /asset-units/{id}/retire"

  - priority: 13
    category: business_safety
    check: "Repair completion requires repair_cost_cents in event_payload; re-image completion requires image_version"
    error_id: "ERR_REPAIR_COST_REQUIRED, ERR_IMAGE_VERSION_REQUIRED"
    http_status: 400
    applies_to: "POST /asset-units/{id}/complete-repair, POST /asset-units/{id}/complete-reimage"

  - priority: 14
    category: business_constraint
    check: "Batch operations atomic: audit sweep begin requires no other open sweep; re-imaging batch all-or-nothing"
    error_id: "ERR_SWEEP_IN_PROGRESS, ERR_BATCH_REJECTED"
    http_status: 409
    applies_to: "POST /audit-sweeps/{id}/begin, POST /asset-units/begin-reimage-batch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- DistrictProgram ---
  - method: POST
    path: "/api/programs"
    description: "Create a new DistrictProgram"
    roles: [DistrictAdmin]
    code: 201
    input: [program_name, school_year, "loaner_pool_threshold_pct?"]
    output: DistrictProgram
    side_effects: ["status initialized to DRAFT"]

  - method: GET
    path: "/api/programs"
    description: "List DistrictPrograms (paginated)"
    roles: [DistrictAdmin, SiteTechnician, Registrar, Family]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DistrictProgram[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}"
    description: "Get a single DistrictProgram"
    roles: [DistrictAdmin, SiteTechnician, Registrar, Family]
    code: 200
    input: []
    output: DistrictProgram
    side_effects: []

  - method: POST
    path: "/api/programs/{progId}/activate"
    description: "Transition DistrictProgram DRAFT → ACTIVE"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: DistrictProgram
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/api/programs/{progId}/begin-summer-collection"
    description: "Transition DistrictProgram ACTIVE → SUMMER_COLLECTION; triggers Assignment → OVERDUE cascade"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: DistrictProgram
    side_effects:
      - "status → SUMMER_COLLECTION"
      - "All Assignment rows ACTIVE with expected_return_date < current_utc → OVERDUE"
      - "All AssetUnits DEPLOYED → SUMMER_INTAKE"

  - method: POST
    path: "/api/programs/{progId}/close"
    description: "Transition DistrictProgram SUMMER_COLLECTION → CLOSED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: DistrictProgram
    side_effects: ["status → CLOSED"]

  # --- AssetFleet ---
  - method: POST
    path: "/api/programs/{progId}/fleets"
    description: "Create an AssetFleet"
    roles: [DistrictAdmin]
    code: 201
    input: [fleet_name, asset_class, unit_replacement_cost_cents, salvage_value_cents, useful_life_months, in_service_date]
    output: AssetFleet
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/fleets"
    description: "List AssetFleets in a program"
    roles: [DistrictAdmin, SiteTechnician, Registrar]
    code: 200
    input: ["asset_class?", "limit?", "offset?"]
    output: "AssetFleet[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/fleets/{fleetId}"
    description: "Get an AssetFleet"
    roles: [DistrictAdmin, SiteTechnician, Registrar]
    code: 200
    input: []
    output: AssetFleet
    side_effects: []

  # --- AssetUnit ---
  - method: POST
    path: "/api/programs/{progId}/fleets/{fleetId}/asset-units"
    description: "Intake a new AssetUnit (barcode + serial)"
    roles: [DistrictAdmin, SiteTechnician]
    code: 201
    input: [asset_tag_barcode, serial_number, "condition_grade?"]
    output: AssetUnit
    side_effects: ["lifecycle_status initialized to READY; AssetLifecycleEvent INTAKE appended"]

  - method: GET
    path: "/api/programs/{progId}/fleets/{fleetId}/asset-units"
    description: "List AssetUnits in a fleet"
    roles: [DistrictAdmin, SiteTechnician, Registrar]
    code: 200
    input: ["lifecycle_status?", "condition_grade?", "assigned_to_student_id?", "limit?", "offset?"]
    output: "AssetUnit[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/asset-units/{assetId}"
    description: "Get an AssetUnit (cross-fleet)"
    roles: [DistrictAdmin, SiteTechnician, Registrar]
    code: 200
    input: []
    output: AssetUnit
    side_effects: []

  - method: POST
    path: "/api/programs/{progId}/asset-units/{assetId}/designate-loaner"
    description: "Move AssetUnit READY → LOANER"
    roles: [SiteTechnician]
    code: 200
    input: []
    output: AssetUnit
    side_effects: ["lifecycle_status → LOANER"]

  - method: POST
    path: "/api/programs/{progId}/asset-units/{assetId}/return-loaner-to-pool"
    description: "Move AssetUnit LOANER → READY"
    roles: [SiteTechnician]
    code: 200
    input: []
    output: AssetUnit
    side_effects: ["lifecycle_status → READY"]

  - method: POST
    path: "/api/programs/{progId}/asset-units/{assetId}/complete-repair"
    description: "Move AssetUnit IN_REPAIR → READY"
    roles: [SiteTechnician]
    code: 200
    input: [repair_cost_cents, post_repair_grade]
    output: AssetUnit
    side_effects:
      - "lifecycle_status → READY"
      - "condition_grade := post_repair_grade"
      - "AssetLifecycleEvent REPAIR_COMPLETE appended"

  - method: POST
    path: "/api/programs/{progId}/asset-units/{assetId}/begin-reimage"
