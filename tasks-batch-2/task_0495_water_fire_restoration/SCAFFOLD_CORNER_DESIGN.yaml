              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "LossJob.${job_id}.status == COMPLETED with warranty_expires_on set"
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: decommission_chamber_with_active_equipment_returns_chamber_has_equipment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DryingChamber.OPEN_to_DECOMMISSIONED
          - errors[ERR_CHAMBER_HAS_EQUIPMENT]
        distinguishing_aspect: "Decommissioning a chamber that still holds an ACTIVE placement fails ERR_CHAMBER_HAS_EQUIPMENT (409)."
        test_recipe:
          setup: ["A WATER job with chamber R1 (OPEN) holding one ACTIVE air-mover placement."]
          setup_api_calls:
            - call: "POST /restoration/claims"
              payload: { carrier_name: "Acme", policy_number: "PC9", peril: "WATER", coverage_limit_cents: 500000 }
