# =============================================================================
# Scaffold: Grant-Writing & Proposal Service (task_0712)
# Difficulty: Expert
# =============================================================================

scenario: |
  712. Grant-Writing & Proposal Service: client/org & funding-opportunity match,
  proposal/narrative & budget development, deadline & submission-portal tracking,
  deliverable & revision, success-fee vs hourly/retainer, post-award
  reporting/compliance support, boilerplate library, win-rate tracking

domain_name: grant-writing-proposal-service
api_prefix: /grant-desk

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  # All entities are peer collections under /grant-desk/<segment>; relationships
  # are expressed as foreign-key fields, never as nested URL ownership chains.
  state_machine_shape: cyclic
  # Proposal and Deliverable both carry revision loops (cycles); Deliverable
  # additionally carries two independent state dimensions (parallel); Submission
  # is branching (ACCEPTED vs REJECTED with divergent side-effects).
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # RevisionRequest.supersedes_revision_id -> RevisionRequest.id
  role_model: peer_roles
  # GrantWriter owns proposals/deliverables/boilerplate; AccountManager owns
  # engagements/matches/invoices; ClientContact (entity_backed Client) approves
  # deliverables and submissions; ComplianceOfficer owns awards/compliance reports.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Client organization name" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number; unique across all non-ARCHIVED Clients" }
      - { name: mission_areas, type: array, source: input, description: "List of funding focus areas, e.g. [EDUCATION, HEALTH]; used by match scoring" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Client annual operating budget in cents; gates opportunity size eligibility" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | ARCHIVED" }
      - { name: proposals_submitted_count, type: integer, source: computed, description: "Count of this client's Proposals that ever reached SUBMITTED via a Submission" }
      - { name: proposals_won_count, type: integer, source: computed, description: "Count of this client's Proposals whose Submission reached ACCEPTED (won)" }
      - { name: win_rate_pct, type: number, source: computed, description: "Win rate over decided submissions; see calculations.win_rate" }

  - name: FundingOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: funder_name, type: string, source: input, description: "Name of the funding agency/foundation" }
      - { name: title, type: string, source: input, description: "Opportunity title" }
      - { name: focus_areas, type: array, source: input, description: "Eligible focus areas, e.g. [EDUCATION]; matched against Client.mission_areas" }
      - { name: ceiling_amount_cents, type: integer, source: input, description: "Maximum award amount in cents" }
      - { name: floor_amount_cents, type: integer, source: input, default: 0, description: "Minimum request amount in cents" }
      - { name: portal_name, type: string, source: input, description: "Submission portal identifier, e.g. GRANTS_GOV | FOUNDANT" }
      - { name: deadline_utc, type: datetime, source: input, description: "Hard submission deadline (ISO 8601 UTC)" }
      - { name: min_org_budget_cents, type: integer, source: input, default: 0, description: "Minimum applicant annual budget required to be eligible" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED; auto-CLOSED at deadline via /_clock advance" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the engaged client" }
      - { name: fee_model, type: enum, source: input, description: "SUCCESS_FEE | HOURLY | RETAINER; immutable after creation; drives invoicing" }
      - { name: success_fee_pct, type: number, source: input, default: 0, description: "Percent of awarded amount billed on win; required when fee_model=SUCCESS_FEE" }
      - { name: hourly_rate_cents, type: integer, source: input, default: 0, description: "Billed cents per hour; required when fee_model=HOURLY" }
      - { name: retainer_monthly_cents, type: integer, source: input, default: 0, description: "Flat monthly retainer in cents; required when fee_model=RETAINER" }
      - { name: retainer_included_hours, type: integer, source: input, default: 0, description: "Hours included in the monthly retainer before overage billing" }
      - { name: overage_rate_cents, type: integer, source: input, default: 0, description: "Per-hour cents charged beyond retainer_included_hours" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | PAUSED | CLOSED" }
      - { name: ytd_billed_cents, type: integer, source: computed, description: "Sum of issued Invoice.total_cents for this engagement in the current year" }

  - name: MatchAssessment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client being matched" }
      - { name: opportunity_id, type: string, source: input, description: "FK -> FundingOpportunity.id; the opportunity being matched" }
      - { name: score, type: integer, source: computed, description: "0-100 match score; see calculations.match_score" }
      - { name: eligible, type: boolean, source: computed, description: "True iff client passes hard eligibility gates (budget floor, focus overlap)" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | PURSUING | DECLINED; PURSUING is required before a Proposal can attach" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; owning engagement (supplies the client)" }
      - { name: match_id, type: string, source: input, description: "FK -> MatchAssessment.id; the pursued match (supplies the opportunity)" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested from the funder; must lie within opportunity floor/ceiling at submission" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Increments each time the proposal returns from IN_REVIEW to DRAFTING" }
      - { name: budget_total_cents, type: integer, source: computed, description: "Sum of BudgetLine.amount_cents for this proposal; see calculations.budget_total" }
      - { name: status, type: enum, source: system, default: "DRAFTING", description: "DRAFTING | IN_REVIEW | APPROVED | SUBMITTED | WITHDRAWN" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; owning proposal" }
      - { name: category, type: enum, source: input, description: "PERSONNEL | EQUIPMENT | TRAVEL | INDIRECT | OTHER" }
      - { name: label, type: string, source: input, description: "Line description" }
      - { name: amount_cents, type: integer, source: input, description: "Direct cost in cents (for INDIRECT lines this is the computed indirect cost; see calculations.budget_total)" }
      - { name: indirect_rate_pct, type: number, source: input, default: 0, description: "Applied only when category=INDIRECT; percent of the modified direct base" }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; owning proposal" }
      - { name: kind, type: enum, source: input, description: "NARRATIVE | BUDGET_JUSTIFICATION | ATTACHMENT" }
      - { name: title, type: string, source: input, description: "Deliverable title" }
      - { name: body, type: string, source: input, default: "", description: "Current narrative body text" }
      - { name: content_status, type: enum, source: system, default: "OUTLINE", description: "Content dimension: OUTLINE | DRAFTED | FINAL (independent of approval_status)" }
      - { name: approval_status, type: enum, source: system, default: "UNREVIEWED", description: "Approval dimension: UNREVIEWED | CHANGES_REQUESTED | APPROVED (independent of content_status)" }
      - { name: open_revision_count, type: integer, source: computed, description: "Count of RevisionRequests on this deliverable in OPEN status" }

  - name: RevisionRequest
    parent: null
    common_fields: true
    fields:
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; the deliverable to revise" }
      - { name: supersedes_revision_id, type: string, source: input, default: null, description: "FK -> RevisionRequest.id; prior open request this one replaces (self-referential), or null" }
      - { name: note, type: string, source: input, description: "Reviewer's requested change" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED | SUPERSEDED" }

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; the proposal being submitted" }
      - { name: portal_name, type: string, source: system, description: "Copied from the opportunity at submission time" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical clock instant when the submission was filed" }
      - { name: decision_due_utc, type: datetime, source: input, default: null, description: "Funder's expected decision date (optional)" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | ACCEPTED | REJECTED | WITHDRAWN" }

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement the work is booked to" }
      - { name: proposal_id, type: string, source: input, default: null, description: "FK -> Proposal.id; optional proposal the work relates to" }
      - { name: minutes, type: integer, source: input, description: "Minutes worked; must be > 0" }
      - { name: period_yyyymm, type: string, source: input, description: "Billing period as YYYYMM, e.g. 202603" }
      - { name: status, type: enum, source: system, default: "LOGGED", description: "LOGGED | BILLED; BILLED once swept into an Invoice" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement being billed" }
      - { name: kind, type: enum, source: system, description: "SUCCESS_FEE | HOURLY | RETAINER; derived from engagement.fee_model and the issue endpoint" }
      - { name: period_start_yyyymm, type: string, source: input, default: null, description: "First billing month (YYYYMM, e.g. 202603) for HOURLY/RETAINER invoices; null for SUCCESS_FEE" }
      - { name: period_end_yyyymm, type: string, source: input, default: null, description: "Last billing month (YYYYMM) inclusive for HOURLY/RETAINER invoices; null for SUCCESS_FEE; must be >= period_start_yyyymm" }
      - { name: award_id, type: string, source: input, default: null, description: "FK -> Award.id; the won award a SUCCESS_FEE invoice bills against; null otherwise" }
      - { name: line_count, type: integer, source: computed, description: "Number of TimeEntries swept (HOURLY) or 0 (RETAINER/SUCCESS_FEE)" }
      - { name: total_cents, type: integer, source: computed, description: "Invoice total; see calculations.invoice_total" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | VOID" }

  - name: Award
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the accepted submission that produced this award" }
      - { name: awarded_amount_cents, type: integer, source: input, description: "Amount actually awarded; may differ from requested_amount_cents" }
      - { name: period_of_performance_months, type: integer, source: input, description: "Award duration in months; report cadence derived from this" }
      - { name: report_cadence_months, type: integer, source: input, default: 3, description: "Months between required compliance reports" }
      - { name: compliance_status, type: enum, source: computed, description: "GREEN | AT_RISK | DELINQUENT; see calculations.compliance_posture" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED_OUT" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: award_id, type: string, source: input, description: "FK -> Award.id; the award this report fulfills" }
      - { name: due_utc, type: datetime, source: input, description: "Report due date (ISO 8601 UTC); also the inclusive end of the report's coverage window" }
      - { name: covers_window_start_utc, type: datetime, source: input, default: null, description: "Inclusive-open start of the reporting period this report covers; for scheduled reports = previous report's due_utc (or award.created_at for the first); a SUPPLEMENTAL report's (start, due] half-open window must not overlap any existing report's window" }
      - { name: report_type, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED (auto-generated) | SUPPLEMENTAL (manually inserted)" }
      - { name: sequence_index, type: integer, source: input, description: "1-based ordinal of this report within the award's schedule" }
      - { name: submitted_at_utc, type: datetime, source: system, default: null, description: "Logical clock instant the report was filed; null until filed" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | FILED | LATE; LATE set by clock advance when due_utc passes while PENDING" }

  - name: BoilerplateSnippet
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client's reusable library entry" }
      - { name: section_key, type: string, source: input, description: "Library slot key, e.g. ORG_HISTORY; unique per client among ACTIVE snippets" }
      - { name: body, type: string, source: input, description: "Reusable narrative text" }
      - { name: usage_count, type: integer, source: computed, description: "Number of Deliverables that imported this snippet" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Engagement: linear lifecycle gating proposal/billing work ----
  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /grant-desk/engagements/{id}/activate"
        actor: AccountManager
        preconditions:
          - "Client.status == ACTIVE (cross-entity; else ERR_CLIENT_NOT_ACTIVE)"
          - "fee_model-specific required field present (success_fee_pct>0 | hourly_rate_cents>0 | retainer_monthly_cents>0); else ERR_FEE_MODEL_INCOMPLETE"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /grant-desk/engagements/{id}/pause"
        actor: AccountManager
        preconditions: []
        side_effects: ["status -> PAUSED"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /grant-desk/engagements/{id}/activate"
        actor: AccountManager
        preconditions:
          - "Client.status == ACTIVE (else ERR_CLIENT_NOT_ACTIVE)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /grant-desk/engagements/{id}/close"
        actor: AccountManager
        preconditions:
          - "No Proposal under this engagement in DRAFTING or IN_REVIEW (else ERR_ENGAGEMENT_HAS_OPEN_WORK)"
        side_effects: ["status -> CLOSED"]
      - from: PAUSED
        to: CLOSED
        trigger: "POST /grant-desk/engagements/{id}/close"
        actor: AccountManager
        preconditions:
          - "No Proposal under this engagement in DRAFTING or IN_REVIEW (else ERR_ENGAGEMENT_HAS_OPEN_WORK)"
        side_effects: ["status -> CLOSED"]

  # ---- Proposal: CYCLIC — IN_REVIEW can return to DRAFTING (revision loop) ----
  - entity: Proposal
    initial_state: DRAFTING
    terminal_states: [SUBMITTED, WITHDRAWN]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /grant-desk/proposals/{id}/submit-for-review"
        actor: GrantWriter
        preconditions:
          - "Engagement.status == ACTIVE (cross-entity; else ERR_ENGAGEMENT_NOT_ACTIVE)"
          - "At least one Deliverable of kind=NARRATIVE exists for this proposal (else ERR_NO_NARRATIVE)"
          - "budget_total_cents > 0 (else ERR_EMPTY_BUDGET)"
        side_effects: ["status -> IN_REVIEW"]
      - from: IN_REVIEW
        to: DRAFTING
        trigger: "POST /grant-desk/proposals/{id}/request-changes"
        actor: ClientContact
        preconditions:
          - "Acting ClientContact owns this proposal's client (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status -> DRAFTING"
          - "revision_round += 1"
          - "Every Deliverable under this proposal with approval_status==APPROVED is reset to approval_status=CHANGES_REQUESTED (cascade)"
        note: "This is the revision cycle edge — IN_REVIEW -> DRAFTING -> IN_REVIEW may repeat."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /grant-desk/proposals/{id}/approve"
        actor: ClientContact
        preconditions:
          - "Acting ClientContact owns this proposal's client (else ERR_NOT_RESOURCE_OWNER)"
          - "Every Deliverable under this proposal has approval_status==APPROVED (else ERR_DELIVERABLES_NOT_APPROVED)"
        side_effects: ["status -> APPROVED"]
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /grant-desk/submissions  (filing a Submission for this proposal)"
        actor: GrantWriter
        preconditions:
          - "FundingOpportunity.status == OPEN and clock < deadline_utc (cross-entity; else ERR_OPPORTUNITY_CLOSED)"
          - "floor_amount_cents <= requested_amount_cents <= ceiling_amount_cents (else ERR_REQUEST_OUT_OF_RANGE)"
        side_effects:
          - "status -> SUBMITTED"
          - "Submission row created in FILED"
          - "Client.proposals_submitted_count recomputed"
      - from: DRAFTING
        to: WITHDRAWN
        trigger: "POST /grant-desk/proposals/{id}/withdraw"
        actor: GrantWriter
        preconditions: []
        side_effects: ["status -> WITHDRAWN"]
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /grant-desk/proposals/{id}/withdraw"
        actor: GrantWriter
        preconditions: []
        side_effects: ["status -> WITHDRAWN"]

  # ---- Deliverable: PARALLEL dimensions (content_status x approval_status) ----
  - entity: Deliverable
    initial_state: "OUTLINE/UNREVIEWED"
    terminal_states: []
    transitions:
      # content dimension
      - from: "content_status=OUTLINE"
        to: "content_status=DRAFTED"
        trigger: "POST /grant-desk/deliverables/{id}/advance-content"
        actor: GrantWriter
        preconditions:
          - "len(body) > 0 (else ERR_EMPTY_BODY)"
        side_effects: ["content_status -> DRAFTED"]
      - from: "content_status=DRAFTED"
        to: "content_status=FINAL"
        trigger: "POST /grant-desk/deliverables/{id}/advance-content"
        actor: GrantWriter
        preconditions:
          - "open_revision_count == 0 (else ERR_OPEN_REVISIONS_BLOCK_FINAL)"
        side_effects: ["content_status -> FINAL"]
      # approval dimension (independent axis)
      - from: "approval_status=UNREVIEWED"
        to: "approval_status=CHANGES_REQUESTED"
        trigger: "POST /grant-desk/revision-requests  (opening a RevisionRequest on this deliverable)"
        actor: ClientContact
        preconditions:
          - "content_status IN {DRAFTED, FINAL} (cannot review an OUTLINE; else ERR_NOT_REVIEWABLE)"
        side_effects:
          - "approval_status -> CHANGES_REQUESTED"
          - "open_revision_count recomputed (+1)"
      - from: "approval_status=CHANGES_REQUESTED"
        to: "approval_status=APPROVED"
        trigger: "POST /grant-desk/deliverables/{id}/approve"
        actor: ClientContact
        preconditions:
          - "open_revision_count == 0 (all RevisionRequests RESOLVED/SUPERSEDED; else ERR_OPEN_REVISIONS_BLOCK_APPROVAL)"
        side_effects: ["approval_status -> APPROVED"]
      - from: "approval_status=UNREVIEWED"
        to: "approval_status=APPROVED"
        trigger: "POST /grant-desk/deliverables/{id}/approve"
        actor: ClientContact
        preconditions:
          - "content_status IN {DRAFTED, FINAL} (else ERR_NOT_REVIEWABLE)"
          - "open_revision_count == 0 (else ERR_OPEN_REVISIONS_BLOCK_APPROVAL)"
        side_effects: ["approval_status -> APPROVED"]

  # ---- RevisionRequest: revision loop participant ----
  - entity: RevisionRequest
    initial_state: OPEN
    terminal_states: [RESOLVED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /grant-desk/revision-requests/{id}/resolve"
        actor: GrantWriter
        preconditions: []
        side_effects:
          - "status -> RESOLVED"
          - "Deliverable.open_revision_count recomputed (-1)"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system (a newer RevisionRequest is created with supersedes_revision_id == this.id)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED"
          - "Deliverable.open_revision_count recomputed (the superseded one no longer counts; the new one counts)"

  # ---- Submission: BRANCHING — ACCEPTED vs REJECTED with divergent side-effects ----
  - entity: Submission
    initial_state: FILED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /grant-desk/submissions/{id}/record-decision  (decision=ACCEPTED)"
        actor: AccountManager
        preconditions:
          - "FundingOpportunity for the proposal exists (else ERR_NOT_FOUND)"
        side_effects:
          - "status -> ACCEPTED"
          - "Client.proposals_won_count recomputed (+1)"
          - "Client.win_rate_pct recomputed"
          - "Award becomes creatable for this submission"
      - from: FILED
        to: REJECTED
        trigger: "POST /grant-desk/submissions/{id}/record-decision  (decision=REJECTED)"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "status -> REJECTED"
          - "Client.win_rate_pct recomputed (denominator grows, numerator unchanged)"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /grant-desk/submissions/{id}/withdraw"
        actor: GrantWriter
        preconditions:
          - "clock < FundingOpportunity.deadline_utc (else ERR_OPPORTUNITY_CLOSED)"
        side_effects:
          - "status -> WITHDRAWN"
          - "Owning Proposal status -> WITHDRAWN (cross-entity cascade)"
          - "Client.proposals_submitted_count recomputed (this proposal no longer counts as submitted)"

  # ---- MatchAssessment: pursue/decline lifecycle ----
  - entity: MatchAssessment
    initial_state: PROPOSED
    terminal_states: [DECLINED]
    transitions:
      - from: PROPOSED
        to: PURSUING
        trigger: "POST /grant-desk/matches/{id}/pursue"
        actor: AccountManager | GrantWriter
        preconditions:
          - "Client.status == ACTIVE (cross-entity; else ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "status -> PURSUING"
          - "match becomes attachable by a Proposal"
        note: "A Proposal create requires its referenced match to be PURSUING (else ERR_MATCH_NOT_PURSUING)."
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /grant-desk/matches/{id}/decline"
        actor: AccountManager | GrantWriter
        preconditions: []
        side_effects: ["status -> DECLINED"]
      - from: PURSUING
        to: DECLINED
        trigger: "POST /grant-desk/matches/{id}/decline"
        actor: AccountManager | GrantWriter
        preconditions:
          - "No Proposal under this match in DRAFTING/IN_REVIEW/APPROVED (else ERR_INVALID_STATE)"
        side_effects: ["status -> DECLINED"]

  # ---- Award: post-award lifecycle ----
  - entity: Award
    initial_state: ACTIVE
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: ACTIVE
        to: CLOSED_OUT
        trigger: "POST /grant-desk/awards/{id}/close-out"
        actor: ComplianceOfficer
        preconditions:
          - "No ComplianceReport for this award in PENDING or LATE status (else ERR_REPORTS_OUTSTANDING)"
        side_effects: ["status -> CLOSED_OUT"]
    note: "Award create (POST /grant-desk/awards) requires its Submission to be ACCEPTED (else ERR_SUBMISSION_NOT_ACCEPTED) and uses OCC on the submission version."

  # ---- ComplianceReport: filing + auto-LATE on deadline pass ----
  - entity: ComplianceReport
    initial_state: PENDING
    terminal_states: [FILED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /grant-desk/compliance-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Award.status == ACTIVE (cross-entity; else ERR_AWARD_CLOSED)"
        side_effects:
          - "status -> FILED"
          - "submitted_at_utc = clock"
          - "Award.compliance_status recomputed"
      - from: LATE
        to: FILED
        trigger: "POST /grant-desk/compliance-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "Award.status == ACTIVE (else ERR_AWARD_CLOSED)"
        side_effects:
          - "status -> FILED"
          - "submitted_at_utc = clock"
          - "Award.compliance_status recomputed"
      - from: PENDING
        to: LATE
        trigger: "system (clock advance past due_utc while still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> LATE"
          - "Award.compliance_status recomputed (may flip GREEN -> AT_RISK -> DELINQUENT)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: submission-create-stale-proposal
    parent_entity: Proposal
    write_endpoint: "POST /grant-desk/submissions"
    occ_field: "expected_proposal_version"
    description: |
      Filing a Submission against a Proposal whose version has advanced since
      the client last observed it is rejected as a stale-version write. A
      Submission filing legitimately supersedes any prior view of the proposal
      (it drives the proposal APPROVED -> SUBMITTED and is terminal), so a writer
      holding an outdated proposal version must re-read before filing.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412

  - rule_id: award-create-stale-submission
    parent_entity: Submission
    write_endpoint: "POST /grant-desk/awards"
    occ_field: "expected_submission_version"
    description: |
      Creating an Award against a Submission whose version has advanced since
      the client last observed it is rejected as a stale-version write. The
      submission version advances when its decision is recorded; a writer whose
      view predates the recorded ACCEPTED decision is working from stale state.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: match_score
    trigger: "POST /grant-desk/matches (MatchAssessment creation) and on Client/Opportunity referenced fields"
    algorithm: weighted_scoring
    formula: |
      # Hard eligibility gate first:
      focus_overlap = intersection(Client.mission_areas, FundingOpportunity.focus_areas)
      eligible = (len(focus_overlap) >= 1)
                 AND (Client.annual_budget_cents >= FundingOpportunity.min_org_budget_cents)
      if not eligible:
        score = 0
      else:
        # Weighted 0-100 score (weights sum to 100), each component in [0,1]:
        focus_component = len(focus_overlap) / len(FundingOpportunity.focus_areas)   # fraction of opp areas covered
        # budget fit: how well client budget sits relative to opp ceiling (closer/larger is better, capped at 1.0)
        budget_fit = min(1.0, Client.annual_budget_cents / max(1, FundingOpportunity.ceiling_amount_cents))
        # capacity headroom: 1.0 if client has <3 OPEN concurrent pursuits, else decays
        headroom = 1.0 if open_pursuits < 3 else max(0.0, 1.0 - 0.25 * (open_pursuits - 2))
        raw = 50*focus_component + 30*budget_fit + 20*headroom
        score = round(raw)                       # round_half_up to nearest integer
      # open_pursuits = count of this client's MatchAssessment in status PURSUING
    input_set: "Client + FundingOpportunity referenced fields; open_pursuits over MatchAssessment status==PURSUING for the client"
    constants:
      W_FOCUS: 50
      W_BUDGET: 30
      W_HEADROOM: 20
      HEADROOM_FREE_PURSUITS: 2
      HEADROOM_DECAY: 0.25
    precision: "integer, round_half_up"

  - name: budget_total
    trigger: "BudgetLine create/update; recomputed on Proposal read of budget_total_cents"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED: direct lines first, then indirect lines, because
      # an INDIRECT line's amount derives from the modified direct base.
      direct_base = sum(BudgetLine.amount_cents
                        for lines where category in {PERSONNEL, TRAVEL, OTHER})
      # EQUIPMENT is excluded from the indirect base (modified-total-direct-cost convention).
      for each INDIRECT line (process in created_at ASC order):
        line.amount_cents = floor(direct_base * line.indirect_rate_pct / 100)
      budget_total_cents = sum(BudgetLine.amount_cents over ALL categories)
    input_set: "All BudgetLine rows for the proposal; EQUIPMENT excluded from indirect base, included in total"
    constants:
      INDIRECT_BASE_CATEGORIES: "PERSONNEL,TRAVEL,OTHER"
    precision: "integer cents; floor each indirect line before summing (round per-line then sum)"

  - name: invoice_total
    trigger: "POST /grant-desk/invoices (issue) per fee_model variant"
    algorithm: tiered_pricing
    formula: |
      # Variant chosen by Engagement.fee_model — three structurally different formulas:
      base = 0
      total_cents = base   # see variants
    input_set: "Engagement fee fields; for HOURLY/RETAINER: LOGGED TimeEntries whose period_yyyymm lies in [period_start_yyyymm..period_end_yyyymm]; for SUCCESS_FEE: Award.awarded_amount_cents"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents; see each variant for rounding order"
    variants:
      - name: hourly
        when: "Engagement.fee_model == HOURLY; period_start_yyyymm and period_end_yyyymm supplied"
        difference: |
          Sweep TimeEntry rows where engagement_id matches, status==LOGGED, and
          period_start_yyyymm <= period_yyyymm <= period_end_yyyymm (closed month interval).
          total_cents = floor( (sum(minutes) / 60) * hourly_rate_cents )   # SUM-then-convert-then-round
          line_count = number of swept TimeEntries; each swept entry -> status BILLED.
      - name: retainer
        when: "Engagement.fee_model == RETAINER; period_start_yyyymm and period_end_yyyymm supplied (typically a single month)"
        difference: |
          billed_minutes = sum(minutes) over swept LOGGED TimeEntries (engagement, period window).
          billed_hours = billed_minutes / 60   (exact, not rounded yet)
          overage_hours = max(0, billed_hours - retainer_included_hours)
          total_cents = retainer_monthly_cents + floor(overage_hours * overage_rate_cents)
          line_count = 0; swept entries -> BILLED.
      - name: success_fee
        when: "Engagement.fee_model == SUCCESS_FEE; award_id supplied (Award must be ACTIVE/won)"
        difference: |
          total_cents = floor(Award.awarded_amount_cents * success_fee_pct / 100)
          line_count = 0; no TimeEntries swept.

  - name: win_rate
    trigger: "Submission record-decision (ACCEPTED/REJECTED) and withdraw; Client read of win_rate_pct"
    algorithm: aggregation
    formula: |
      decided = count of this client's Submissions in status ACCEPTED or REJECTED
                (WITHDRAWN and FILED are EXCLUDED from the denominator)
      won = count of this client's Submissions in status ACCEPTED
      if decided == 0:
        win_rate_pct = 0.0      # empty-set boundary: no decided submissions -> 0.0, not null/NaN
      else:
        win_rate_pct = round(100.0 * won / decided, 1)   # one decimal, round_half_up
    input_set: "Submissions joined to the client via Proposal.match->client; only ACCEPTED+REJECTED counted in denominator"
    constants: {}
    precision: "1 decimal place, round_half_up; 0.0 when no decided submissions"

  - name: compliance_posture
    trigger: "ComplianceReport file; clock advance (auto-LATE); Award read of compliance_status"
    algorithm: threshold
    formula: |
      late = count of this award's ComplianceReports in status LATE
      if late == 0:
        GREEN
      elif late == 1:
        AT_RISK
      else:    # late >= 2
        DELINQUENT
    input_set: "ComplianceReport rows for the award; only status==LATE counted"
    constants:
      AT_RISK_AT: 1
      DELINQUENT_AT: 2
    precision: "enum"

  - name: report_schedule
    trigger: "POST /grant-desk/awards (Award creation)"
    algorithm: chronological
    formula: |
      # Generate the report schedule deterministically at award creation.
      n = floor(period_of_performance_months / report_cadence_months)
      window_start = award.created_at
      for k in 1..n (ascending k = sequence_index):
        due_utc = award.created_at + k * report_cadence_months months
        create ComplianceReport(sequence_index=k, report_type=SCHEDULED,
                                covers_window_start_utc=window_start,
                                due_utc=due_utc, status=PENDING)
        window_start = due_utc      # next report covers (this due, next due]
      # If period_of_performance_months < report_cadence_months -> n=0 -> no reports (boundary).
    input_set: "Award.period_of_performance_months and report_cadence_months"
    constants: {}
    precision: "integer count of reports; months added by calendar arithmetic"

  - name: billing_period_overlap
    trigger: "POST /grant-desk/invoices (HOURLY/RETAINER issue) — guards the engagement's billing calendar"
    algorithm: interval_merge
    formula: |
      # Each HOURLY/RETAINER invoice claims the CLOSED month interval
      # [period_start_yyyymm .. period_end_yyyymm] on its engagement.
      # Two month intervals [a1,b1] and [a2,b2] (treated as integer YYYYMM month indices)
      # OVERLAP iff a1 <= b2 AND a2 <= b1. Closed-interval semantics: adjacency is
      # NOT allowed to share an endpoint month, but consecutive non-touching months are.
      # e.g. [202601,202602] vs [202602,202603] -> overlap (share 202602) -> REJECT.
      #      [202601,202602] vs [202603,202604] -> no overlap -> OK (adjacent months).
      reject (ERR_BILLING_PERIOD_OVERLAP) if the new interval overlaps any
      existing ISSUED (non-VOID) invoice interval on the same engagement.
    input_set: "All ISSUED Invoices on the engagement with non-null period_start_yyyymm; VOID invoices excluded"
    constants: {}
    precision: "month-index integer comparison; closed interval [start,end]"

  - name: report_window_overlap
    trigger: "POST /grant-desk/compliance-reports (SUPPLEMENTAL report creation)"
    algorithm: interval_merge
    formula: |
      # A SUPPLEMENTAL report claims the HALF-OPEN coverage window
      # (covers_window_start_utc, due_utc] on its award.
      # Two half-open windows (s1,e1] and (s2,e2] OVERLAP iff s1 < e2 AND s2 < e1.
      # Half-open semantics: a window ENDING exactly where another STARTS does NOT
      # overlap (s == e is allowed to touch). This differs from the closed-interval
      # billing rule above, which rejects shared endpoints.
      # e.g. (T0,T3] vs (T3,T6] -> no overlap (touch at T3) -> OK.
      #      (T0,T3] vs (T2,T5] -> overlap -> REJECT.
      reject (ERR_REPORT_WINDOW_OVERLAP) if the new window overlaps any existing
      ComplianceReport window on the same award (SCHEDULED or SUPPLEMENTAL, any status).
    input_set: "All ComplianceReport rows for the award and their (covers_window_start_utc, due_utc] windows"
    constants: {}
    precision: "half-open interval (start, end]; touching endpoints allowed"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting ClientContact's X-User-ID equals the Client owning the targeted resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "proposal approve/request-changes, deliverable approve, revision-request create"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, positive quantities, valid enums, EIN/section_key uniqueness"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state from which the transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state gate: parent/related entity must be in the required state"
    error_id: "ERR_ENGAGEMENT_NOT_ACTIVE | ERR_CLIENT_NOT_ACTIVE | ERR_AWARD_CLOSED | ERR_OPPORTUNITY_CLOSED"
    http_status: 409
    applies_to: "proposal submit-for-review, engagement activate, compliance-report file, submission create/withdraw"

  - priority: 8
    category: business_safety
    check: "Compliance gate: an Award cannot close out while any ComplianceReport is PENDING or LATE; a Deliverable cannot be APPROVED while open revisions exist"
    error_id: "ERR_REPORTS_OUTSTANDING | ERR_OPEN_REVISIONS_BLOCK_APPROVAL | ERR_OPEN_REVISIONS_BLOCK_FINAL"
    http_status: 409
    applies_to: "award close-out, deliverable approve, deliverable advance-content"

  - priority: 9
    category: business_temporal
    check: "Submission/withdraw allowed only while opportunity OPEN and clock strictly before deadline_utc"
    error_id: ERR_OPPORTUNITY_CLOSED
    http_status: 409
    applies_to: "submission create, submission withdraw"

  - priority: 10
    category: business_constraint
    check: "Aggregate/range gates: requested_amount within floor..ceiling; proposal has a NARRATIVE deliverable and non-empty budget before review; all deliverables approved before proposal approve"
    error_id: "ERR_REQUEST_OUT_OF_RANGE | ERR_NO_NARRATIVE | ERR_EMPTY_BUDGET | ERR_DELIVERABLES_NOT_APPROVED"
    http_status: 409
    applies_to: "submission create, proposal submit-for-review, proposal approve"

  - priority: 11
    category: business_fiscal
    check: "Fee-model fiscal gates: SUCCESS_FEE invoice requires a won Award; HOURLY/RETAINER invoice requires LOGGED TimeEntries or a valid period; engagement billable only when ACTIVE"
    error_id: "ERR_NO_AWARD_FOR_SUCCESS_FEE | ERR_NOTHING_TO_BILL | ERR_ENGAGEMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "invoice issue"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal current parent.version"
    error_id: "ERR_STALE_PROPOSAL_VERSION | ERR_STALE_SUBMISSION_VERSION"
    http_status: 412
    applies_to: "submission create, award create"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/grant-desk/_clock/set_current_utc"
    description: "Set the logical clock to an absolute instant. Server startup default is 2026-03-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock. Advancing the clock past a FundingOpportunity.deadline_utc auto-CLOSES it, and past a PENDING ComplianceReport.due_utc flips it to LATE (recomputing Award.compliance_status)."
    roles: [Ops]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock set"
      - "FundingOpportunity OPEN -> CLOSED where clock >= deadline_utc"
      - "ComplianceReport PENDING -> LATE where clock >= due_utc; Award.compliance_status recomputed"

  # ---- Client ----
  - method: POST
    path: "/grant-desk/clients"
    description: "Create a Client"
    roles: [AccountManager]
    code: 201
    input: [org_name, ein, mission_areas, annual_budget_cents, contact_email]
    output: Client
    side_effects: ["status=ACTIVE; counters initialized to 0; win_rate_pct=0.0"]
  - method: GET
    path: "/grant-desk/clients/{id}"
    description: "Get a Client (with computed win-rate fields)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/grant-desk/clients"
    description: "List Clients"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["status?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/grant-desk/clients/{id}/suspend"
    description: "Suspend a Client"
    roles: [AccountManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> SUSPENDED"]

  # ---- FundingOpportunity ----
  - method: POST
    path: "/grant-desk/opportunities"
    description: "Create a FundingOpportunity"
    roles: [AccountManager]
    code: 201
    input: [funder_name, title, focus_areas, ceiling_amount_cents, "floor_amount_cents?", portal_name, deadline_utc, "min_org_budget_cents?"]
    output: FundingOpportunity
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/grant-desk/opportunities/{id}"
    description: "Get a FundingOpportunity"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: FundingOpportunity
    side_effects: []
  - method: GET
    path: "/grant-desk/opportunities"
    description: "List FundingOpportunities"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["status?", "portal_name?"]
    output: FundingOpportunity[]
    side_effects: []

  # ---- Engagement ----
  - method: POST
    path: "/grant-desk/engagements"
    description: "Create an Engagement (fee_model immutable thereafter)"
    roles: [AccountManager]
    code: 201
    input: [client_id, fee_model, "success_fee_pct?", "hourly_rate_cents?", "retainer_monthly_cents?", "retainer_included_hours?", "overage_rate_cents?"]
    output: Engagement
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/grant-desk/engagements/{id}"
    description: "Get an Engagement (with ytd_billed_cents)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/grant-desk/engagements"
    description: "List Engagements (filterable by client_id for FK reverse-reachability)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["client_id?", "status?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/grant-desk/engagements/{id}/activate"
    description: "Activate (DRAFT/PAUSED -> ACTIVE)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/grant-desk/engagements/{id}/pause"
    description: "Pause (ACTIVE -> PAUSED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/grant-desk/engagements/{id}/close"
    description: "Close (ACTIVE/PAUSED -> CLOSED)"
    roles: [AccountManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> CLOSED"]

  # ---- MatchAssessment ----
  - method: POST
    path: "/grant-desk/matches"
    description: "Create a MatchAssessment; computes score + eligible"
    roles: [AccountManager, GrantWriter]
    code: 201
    input: [client_id, opportunity_id]
    output: MatchAssessment
    side_effects: ["score and eligible computed; status=PROPOSED"]
  - method: GET
    path: "/grant-desk/matches/{id}"
    description: "Get a MatchAssessment"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: MatchAssessment
    side_effects: []
  - method: GET
    path: "/grant-desk/matches"
    description: "List MatchAssessments (filterable by client_id / opportunity_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["client_id?", "opportunity_id?", "status?"]
    output: MatchAssessment[]
    side_effects: []
  - method: POST
    path: "/grant-desk/matches/{id}/pursue"
    description: "Mark a match PURSUING (PROPOSED -> PURSUING); required before a Proposal can attach"
    roles: [AccountManager, GrantWriter]
    code: 200
    input: []
    output: MatchAssessment
    side_effects: ["status -> PURSUING"]
  - method: POST
    path: "/grant-desk/matches/{id}/decline"
    description: "Decline a match (PROPOSED/PURSUING -> DECLINED)"
    roles: [AccountManager, GrantWriter]
    code: 200
    input: []
    output: MatchAssessment
    side_effects: ["status -> DECLINED"]

  # ---- Proposal ----
  - method: POST
    path: "/grant-desk/proposals"
    description: "Create a Proposal against an engagement + a PURSUING match"
    roles: [GrantWriter]
    code: 201
    input: [engagement_id, match_id, requested_amount_cents]
    output: Proposal
    side_effects: ["status=DRAFTING; revision_round=0; budget_total_cents=0"]
  - method: GET
    path: "/grant-desk/proposals/{id}"
    description: "Get a Proposal (with budget_total_cents)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/grant-desk/proposals"
    description: "List Proposals (filterable by engagement_id / match_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["engagement_id?", "match_id?", "status?"]
    output: Proposal[]
    side_effects: []
  - method: POST
    path: "/grant-desk/proposals/{id}/submit-for-review"
    description: "DRAFTING -> IN_REVIEW"
    roles: [GrantWriter]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> IN_REVIEW"]
  - method: POST
    path: "/grant-desk/proposals/{id}/request-changes"
    description: "IN_REVIEW -> DRAFTING (revision cycle); increments revision_round; resets APPROVED deliverables"
    roles: [ClientContact]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> DRAFTING", "revision_round += 1", "approved deliverables -> CHANGES_REQUESTED"]
  - method: POST
    path: "/grant-desk/proposals/{id}/approve"
    description: "IN_REVIEW -> APPROVED (all deliverables must be APPROVED)"
    roles: [ClientContact]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/grant-desk/proposals/{id}/withdraw"
    description: "DRAFTING/IN_REVIEW -> WITHDRAWN"
    roles: [GrantWriter]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> WITHDRAWN"]

  # ---- BudgetLine ----
  - method: POST
    path: "/grant-desk/budget-lines"
    description: "Add a BudgetLine to a proposal; recomputes proposal budget_total_cents"
    roles: [GrantWriter]
    code: 201
    input: [proposal_id, category, label, "amount_cents?", "indirect_rate_pct?"]
    output: BudgetLine
    side_effects: ["Proposal.budget_total_cents recomputed (indirect lines derived from direct base)"]
  - method: GET
    path: "/grant-desk/budget-lines/{id}"
    description: "Get a BudgetLine"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []
  - method: GET
    path: "/grant-desk/budget-lines"
    description: "List BudgetLines (filterable by proposal_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["proposal_id?", "category?"]
    output: BudgetLine[]
    side_effects: []

  # ---- Deliverable ----
  - method: POST
    path: "/grant-desk/deliverables"
    description: "Create a Deliverable on a proposal; optionally import a boilerplate snippet"
    roles: [GrantWriter]
    code: 201
    input: [proposal_id, kind, title, "body?", "import_snippet_id?"]
    output: Deliverable
    side_effects: ["content_status=OUTLINE; approval_status=UNREVIEWED", "if import_snippet_id: body seeded from snippet and snippet.usage_count recomputed"]
  - method: GET
    path: "/grant-desk/deliverables/{id}"
    description: "Get a Deliverable (both state dimensions + open_revision_count)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/grant-desk/deliverables"
    description: "List Deliverables (filterable by proposal_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["proposal_id?", "kind?"]
    output: Deliverable[]
    side_effects: []
  - method: PATCH
    path: "/grant-desk/deliverables/{id}"
    description: "Update deliverable body text (does not change either state dimension)"
    roles: [GrantWriter]
    code: 200
    input: [body]
    output: Deliverable
    side_effects: ["body updated"]
  - method: POST
    path: "/grant-desk/deliverables/{id}/advance-content"
    description: "Advance content dimension OUTLINE -> DRAFTED -> FINAL"
    roles: [GrantWriter]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["content_status advances one step"]
  - method: POST
    path: "/grant-desk/deliverables/{id}/approve"
    description: "Advance approval dimension to APPROVED (requires no open revisions, content DRAFTED/FINAL)"
    roles: [ClientContact]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["approval_status -> APPROVED"]

  # ---- RevisionRequest ----
  - method: POST
    path: "/grant-desk/revision-requests"
    description: "Open a RevisionRequest on a deliverable; optionally supersede a prior OPEN request"
    roles: [ClientContact]
    code: 201
    input: [deliverable_id, note, "supersedes_revision_id?"]
    output: RevisionRequest
    side_effects:
      - "status=OPEN"
      - "Deliverable.approval_status -> CHANGES_REQUESTED"
      - "if supersedes_revision_id: that RevisionRequest -> SUPERSEDED"
      - "Deliverable.open_revision_count recomputed"
  - method: GET
    path: "/grant-desk/revision-requests/{id}"
    description: "Get a RevisionRequest"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: []
  - method: GET
    path: "/grant-desk/revision-requests"
    description: "List RevisionRequests (filterable by deliverable_id / supersedes_revision_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["deliverable_id?", "supersedes_revision_id?", "status?"]
    output: RevisionRequest[]
    side_effects: []
  - method: POST
    path: "/grant-desk/revision-requests/{id}/resolve"
    description: "OPEN -> RESOLVED; recomputes deliverable open_revision_count"
    roles: [GrantWriter]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["status -> RESOLVED", "Deliverable.open_revision_count recomputed"]

  # ---- Submission ----
  - method: POST
    path: "/grant-desk/submissions"
    description: "File a Submission for an APPROVED proposal (OCC on the proposal). Drives proposal -> SUBMITTED."
    roles: [GrantWriter]
    code: 201
    input: [proposal_id, expected_proposal_version, "decision_due_utc?"]
    output: Submission
    side_effects:
      - "Submission created in FILED; portal_name + submitted_at_utc stamped"
      - "Proposal status -> SUBMITTED"
      - "increments Proposal.version by 1"
      - "Client.proposals_submitted_count recomputed"
  - method: GET
    path: "/grant-desk/submissions/{id}"
    description: "Get a Submission"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Submission
    side_effects: []
  - method: GET
    path: "/grant-desk/submissions"
    description: "List Submissions (filterable by proposal_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["proposal_id?", "status?"]
    output: Submission[]
    side_effects: []
  - method: POST
    path: "/grant-desk/submissions/{id}/record-decision"
    description: "FILED -> ACCEPTED or REJECTED (branching; divergent side-effects)"
    roles: [AccountManager]
    code: 200
    input: [decision]
    output: Submission
    side_effects:
      - "status -> ACCEPTED|REJECTED"
      - "increments Submission.version by 1"
      - "Client win/submitted counters and win_rate_pct recomputed"
  - method: POST
    path: "/grant-desk/submissions/{id}/withdraw"
    description: "FILED -> WITHDRAWN (cascades proposal -> WITHDRAWN; only before deadline)"
    roles: [GrantWriter]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> WITHDRAWN", "Proposal -> WITHDRAWN", "Client.proposals_submitted_count recomputed"]

  # ---- TimeEntry ----
  - method: POST
    path: "/grant-desk/time-entries"
    description: "Log billable time against an engagement"
    roles: [GrantWriter, AccountManager]
    code: 201
    input: [engagement_id, "proposal_id?", minutes, period_yyyymm]
    output: TimeEntry
    side_effects: ["status=LOGGED"]
  - method: GET
    path: "/grant-desk/time-entries/{id}"
    description: "Get a TimeEntry"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []
  - method: GET
    path: "/grant-desk/time-entries"
    description: "List TimeEntries (filterable by engagement_id / proposal_id / period)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["engagement_id?", "proposal_id?", "period_yyyymm?", "status?"]
    output: TimeEntry[]
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/grant-desk/invoices"
    description: "Issue an Invoice; total computed by engagement.fee_model variant (HOURLY sweeps LOGGED time in the month window, RETAINER uses overage, SUCCESS_FEE bills the award). HOURLY/RETAINER reject if the [period_start..period_end] month interval overlaps an existing ISSUED invoice on the engagement."
    roles: [AccountManager]
    code: 201
    input: [engagement_id, "period_start_yyyymm?", "period_end_yyyymm?", "award_id?"]
    output: Invoice
    side_effects:
      - "total_cents + line_count computed per variant"
      - "for HOURLY/RETAINER: swept TimeEntries -> BILLED"
      - "Engagement.ytd_billed_cents recomputed"
  - method: GET
    path: "/grant-desk/invoices/{id}"
    description: "Get an Invoice"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/grant-desk/invoices"
    description: "List Invoices (filterable by engagement_id / award_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["engagement_id?", "award_id?", "status?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/grant-desk/invoices/{id}/void"
    description: "Void an Invoice (ISSUED -> VOID); restores swept TimeEntries to LOGGED"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID", "swept TimeEntries -> LOGGED", "Engagement.ytd_billed_cents recomputed"]

  # ---- Award ----
  - method: POST
    path: "/grant-desk/awards"
    description: "Create an Award from an ACCEPTED submission (OCC on the submission). Generates the compliance report schedule."
    roles: [ComplianceOfficer, AccountManager]
    code: 201
    input: [submission_id, expected_submission_version, awarded_amount_cents, period_of_performance_months, "report_cadence_months?"]
    output: Award
    side_effects:
      - "status=ACTIVE; compliance_status=GREEN"
      - "increments Submission.version by 1"
      - "ComplianceReport schedule generated (calculations.report_schedule)"
  - method: GET
    path: "/grant-desk/awards/{id}"
    description: "Get an Award (with compliance_status)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/grant-desk/awards"
    description: "List Awards (filterable by submission_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["submission_id?", "status?"]
    output: Award[]
    side_effects: []
  - method: POST
    path: "/grant-desk/awards/{id}/close-out"
    description: "ACTIVE -> CLOSED_OUT (blocked if any report PENDING/LATE)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Award
    side_effects: ["status -> CLOSED_OUT"]

  # ---- ComplianceReport ----
  - method: POST
    path: "/grant-desk/compliance-reports"
    description: "Insert a SUPPLEMENTAL ComplianceReport on an ACTIVE award; rejects if its (covers_window_start_utc, due_utc] window overlaps any existing report window (half-open semantics)."
    roles: [ComplianceOfficer]
    code: 201
    input: [award_id, covers_window_start_utc, due_utc, sequence_index]
    output: ComplianceReport
    side_effects: ["report_type=SUPPLEMENTAL; status=PENDING", "Award.compliance_status recomputed"]
  - method: GET
    path: "/grant-desk/compliance-reports/{id}"
    description: "Get a ComplianceReport"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []
  - method: GET
    path: "/grant-desk/compliance-reports"
    description: "List ComplianceReports (filterable by award_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["award_id?", "status?"]
    output: ComplianceReport[]
    side_effects: []
  - method: POST
    path: "/grant-desk/compliance-reports/{id}/file"
    description: "File a report (PENDING/LATE -> FILED); recomputes Award.compliance_status"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["status -> FILED; submitted_at_utc stamped", "Award.compliance_status recomputed"]

  # ---- BoilerplateSnippet ----
  - method: POST
    path: "/grant-desk/boilerplate"
    description: "Create a boilerplate library snippet for a client (section_key unique among ACTIVE)"
    roles: [GrantWriter]
    code: 201
    input: [client_id, section_key, body]
    output: BoilerplateSnippet
    side_effects: ["status=ACTIVE; usage_count=0"]
  - method: GET
    path: "/grant-desk/boilerplate/{id}"
    description: "Get a BoilerplateSnippet"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: []
    output: BoilerplateSnippet
    side_effects: []
  - method: GET
    path: "/grant-desk/boilerplate"
    description: "List BoilerplateSnippets (filterable by client_id)"
    roles: [AccountManager, GrantWriter, ClientContact, ComplianceOfficer, Ops]
    code: 200
    input: ["client_id?", "section_key?", "status?"]
    output: BoilerplateSnippet[]
    side_effects: []
  - method: POST
    path: "/grant-desk/boilerplate/{id}/retire"
    description: "Retire a snippet (ACTIVE -> RETIRED); frees its section_key for reuse"
    roles: [GrantWriter]
    code: 200
    input: []
    output: BoilerplateSnippet
    side_effects: ["status -> RETIRED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting ClientContact does not own the targeted resource's client" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, non-positive quantity, bad enum, or EIN/section_key uniqueness violation" }
  # --- generic state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which this transition is allowed" }
  # --- cross-entity state gates ---
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Operation requires the Client to be ACTIVE" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the Engagement to be ACTIVE" }
  - { id: ERR_ENGAGEMENT_HAS_OPEN_WORK, http: 409, condition: "Cannot close an engagement with a Proposal in DRAFTING or IN_REVIEW" }
  - { id: ERR_AWARD_CLOSED, http: 409, condition: "Cannot file a ComplianceReport against a CLOSED_OUT Award" }
  - { id: ERR_OPPORTUNITY_CLOSED, http: 409, condition: "FundingOpportunity is CLOSED or the clock is at/after its deadline" }
  # --- match / proposal business ---
  - { id: ERR_MATCH_NOT_PURSUING, http: 409, condition: "A Proposal can only attach to a MatchAssessment in PURSUING status" }
  - { id: ERR_NO_NARRATIVE, http: 409, condition: "Proposal has no NARRATIVE deliverable; cannot submit for review" }
  - { id: ERR_EMPTY_BUDGET, http: 409, condition: "Proposal budget_total_cents is 0; cannot submit for review" }
  - { id: ERR_DELIVERABLES_NOT_APPROVED, http: 409, condition: "Not every deliverable is APPROVED; cannot approve the proposal" }
  - { id: ERR_REQUEST_OUT_OF_RANGE, http: 409, condition: "requested_amount_cents outside the opportunity floor..ceiling band" }
  # --- deliverable / revision business ---
  - { id: ERR_EMPTY_BODY, http: 409, condition: "Cannot advance content from OUTLINE with an empty body" }
  - { id: ERR_NOT_REVIEWABLE, http: 409, condition: "Deliverable content is still OUTLINE; cannot review/approve" }
  - { id: ERR_OPEN_REVISIONS_BLOCK_APPROVAL, http: 409, condition: "Deliverable has open RevisionRequests; cannot approve" }
  - { id: ERR_OPEN_REVISIONS_BLOCK_FINAL, http: 409, condition: "Deliverable has open RevisionRequests; cannot mark content FINAL" }
  # --- fee / invoice business ---
  - { id: ERR_FEE_MODEL_INCOMPLETE, http: 409, condition: "Engagement missing the fee field its fee_model requires" }
  - { id: ERR_NO_AWARD_FOR_SUCCESS_FEE, http: 409, condition: "SUCCESS_FEE invoice issued without a valid won Award" }
  - { id: ERR_NOTHING_TO_BILL, http: 409, condition: "HOURLY/RETAINER invoice has no LOGGED time for the period window to sweep" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "New HOURLY/RETAINER invoice's [start..end] month interval overlaps an existing ISSUED invoice on the engagement (closed-interval semantics)" }
  # --- award / compliance business ---
  - { id: ERR_REPORTS_OUTSTANDING, http: 409, condition: "Cannot close out an Award with PENDING or LATE ComplianceReports" }
  - { id: ERR_SUBMISSION_NOT_ACCEPTED, http: 409, condition: "Award can only be created from an ACCEPTED Submission" }
  - { id: ERR_REPORT_WINDOW_OVERLAP, http: 409, condition: "Supplemental report's (start, due] window overlaps an existing report window on the award (half-open semantics)" }
  # --- OCC ---
  - { id: ERR_STALE_PROPOSAL_VERSION, http: 412, condition: "expected_proposal_version does not equal current Proposal.version" }
  - { id: ERR_STALE_SUBMISSION_VERSION, http: 412, condition: "expected_submission_version does not equal current Submission.version" }
  # --- pagination ---
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit/offset outside allowed bounds" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns clients, opportunities, engagements, matches, invoices, and submission decisions"
    identity: opaque
    exclusive_operations:
      - "POST /grant-desk/clients — Create client"
      - "POST /grant-desk/clients/{id}/suspend — Suspend client"
      - "POST /grant-desk/opportunities — Create opportunity"
      - "POST /grant-desk/engagements — Create engagement"
      - "POST /grant-desk/engagements/{id}/activate — Activate engagement"
      - "POST /grant-desk/engagements/{id}/pause — Pause engagement"
      - "POST /grant-desk/engagements/{id}/close — Close engagement"
      - "POST /grant-desk/submissions/{id}/record-decision — Record submission decision"
      - "POST /grant-desk/invoices — Issue invoice"
      - "POST /grant-desk/invoices/{id}/void — Void invoice"
    shared_operations:
      - "POST /grant-desk/matches — Create match (shared with GrantWriter)"
      - "POST /grant-desk/matches/{id}/pursue — Pursue match (shared)"
      - "POST /grant-desk/matches/{id}/decline — Decline match (shared)"
      - "POST /grant-desk/time-entries — Log time (shared with GrantWriter)"
      - "POST /grant-desk/awards — Create award (shared with ComplianceOfficer)"
      - "GET — all read endpoints"

  - name: GrantWriter
    description: "Owns proposals, budget lines, deliverables, submissions filing, time logging, and the boilerplate library"
    identity: opaque
    exclusive_operations:
      - "POST /grant-desk/proposals — Create proposal"
      - "POST /grant-desk/proposals/{id}/submit-for-review — Submit for review"
      - "POST /grant-desk/proposals/{id}/withdraw — Withdraw proposal"
      - "POST /grant-desk/budget-lines — Add budget line"
      - "POST /grant-desk/deliverables — Create deliverable"
      - "PATCH /grant-desk/deliverables/{id} — Edit deliverable body"
      - "POST /grant-desk/deliverables/{id}/advance-content — Advance content"
      - "POST /grant-desk/revision-requests/{id}/resolve — Resolve revision"
      - "POST /grant-desk/submissions — File submission"
      - "POST /grant-desk/submissions/{id}/withdraw — Withdraw submission"
      - "POST /grant-desk/boilerplate — Create snippet"
      - "POST /grant-desk/boilerplate/{id}/retire — Retire snippet"
    shared_operations:
      - "POST /grant-desk/matches — Create match (shared with AccountManager)"
      - "POST /grant-desk/matches/{id}/pursue — Pursue match (shared)"
      - "POST /grant-desk/matches/{id}/decline — Decline match (shared)"
      - "POST /grant-desk/time-entries — Log time (shared with AccountManager)"
      - "GET — all read endpoints"

  - name: ClientContact
    description: "Client-side reviewer; approves/rejects proposals and deliverables, opens revision requests, only on its own client's resources"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /grant-desk/proposals/{id}/request-changes — Request changes"
      - "POST /grant-desk/proposals/{id}/approve — Approve proposal"
      - "POST /grant-desk/deliverables/{id}/approve — Approve deliverable"
      - "POST /grant-desk/revision-requests — Open revision request"
    shared_operations:
      - "GET — all read endpoints"

  - name: ComplianceOfficer
    description: "Owns post-award compliance: awards, reports, close-out"
    identity: opaque
    exclusive_operations:
      - "POST /grant-desk/awards/{id}/close-out — Close out award"
      - "POST /grant-desk/compliance-reports/{id}/file — File report"
    shared_operations:
      - "POST /grant-desk/awards — Create award (shared with AccountManager)"
      - "GET — all read endpoints"

  - name: Ops
    description: "Operational/test-harness role for the logical clock and read access"
    identity: opaque
    exclusive_operations:
      - "POST /grant-desk/_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "GET — all read endpoints"
