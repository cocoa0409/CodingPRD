      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role is rejected with the header error before any role authorization."
        test_recipe:
          setup: ["handler h exists"]
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H AH", email: "hah@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
          trigger:
            - { call: "GET /v1/handlers/${h}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "Sent WITHOUT X-User-ID/X-User-Role headers: err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not ERR_FORBIDDEN_ROLE"

      - name: unknown_body_field_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Request bodies are closed: an undeclared field (e.g. nickname on animal creation) is rejected rather than silently ignored."
