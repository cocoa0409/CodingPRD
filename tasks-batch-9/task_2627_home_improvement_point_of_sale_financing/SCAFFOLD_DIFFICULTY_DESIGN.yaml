  # ===========================================================================
  # RULE 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: consumer_favor_resolution_four_hop_reserve_suspension_cascade
        grounds:
          - state_machines.DisputeCase.MERCHANT_RESPONSE_PENDING_to_RESOLVED_CONSUMER_FAVOR
          - calculations.chargeback_allocation_waterfall
          - state_machines.Merchant.APPROVED_to_SUSPENDED
          - state_machines.MerchantPromotionEnrollment.ACTIVE_to_SUSPENDED
          - state_machines.FundingDraw.REQUESTED_to_DENIED
          - concurrency_rules[dispute-resolution-stale-merchant]
        distinguishing_aspect: |
          Depth-4 cascade whose TRIGGERING TRANSITION is DisputeCase
          MERCHANT_RESPONSE_PENDING -> RESOLVED_CONSUMER_FAVOR, and each hop is caused strictly
          by the previous one: hop 1 splits the claim into three buckets, hop 1's reserve
          debit is what drops reserve_coverage_bps to 0 (hop 2), hop 2's sub-5000 coverage is
          what suspends the merchant (hop 3), and hop 3's suspension is what suspends the
          enrollment and denies the pending draw (hop 4) — none of hops 2-4 is reachable
          directly from the resolution call.
        test_recipe:
          setup:
            - "Program, APPROVED merchant, ACTIVE enrollment (negotiated_discount_bps 449), ACTIVATED application, PROMO_ACTIVE LoanAccount for Consumer Dana Ruiz."
            - "Project 3500000 with milestones at 3000 / 4000 / 3000 bps, all three VERIFIED, so completion_status == SUBSTANTIALLY_COMPLETE and releasable_cents == 2450000 (capped at 7000 bps)."
            - "Draw 1 of 1000050 and draw 2 of 1400000 are SETTLED by sa-1, so Merchant.holdback_reserve_cents == 96002, holdback_target_cents == 96002, funded_volume_cents == 2400050 and Project.settled_funded_cents == 2400050."
            - "Draw 3 of 49950 is left in REQUESTED so hop 4 has a live draw to deny."
            - "A DisputeCase claiming 1800000 of incomplete work is open in MERCHANT_RESPONSE_PENDING with no merchant response."
            - "Logical clock stays at 2026-08-01T00:00:00Z throughout, so the trailing-180-day settled volume that sizes the receivable cap is 2400050."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
