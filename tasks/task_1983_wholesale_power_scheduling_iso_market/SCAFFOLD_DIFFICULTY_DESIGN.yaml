              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "PRELIMINARY" }
              as: IsoOperator
              captures: { s_pre: "$.data[0].id" }
            - call: "GET /market/statements/${s_pre}/lines"
              as: IsoOperator
              captures: { ln_id: "$.data[0].id" }
          trigger:
            - call: "POST /market/statements/${s_pre}/disputes"
              payload: { dispute_reason: "PRICE_ERROR", disputed_line_ids: ["${ln_id}"] }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_STATEMENT_NOT_FINAL — dispute creation depends on the statement's run_type ∈ {FINAL, RESETTLEMENT}"
            - "SettlementStatement.${s_pre}.status remains ISSUED"

      - name: posting_release_blocked_by_open_margin_call
        grounds:
          - state_machines.CollateralPosting.POSTED_to_RELEASED
          - validations[priority=8]
          - errors[ERR_OPEN_MARGIN_CALL]
        distinguishing_aspect: |
          Entity pair CollateralPosting → MarginCall (third distinct pair):
          release is blocked while ANY margin call of the participant is OPEN,
          independent of amounts — the posting's own state is a valid
          from-state and funds would still be insufficient either way.
        test_recipe:
          setup:
            - "BELOW_INVESTMENT_GRADE participant posts 100000 BEFORE any requirement exists (no margin call yet)"
            - "Obligation 10 MW @ 1000000; full outage covering the clock approved → AT_RISK → requirement 500000 → MarginCall OPEN 400000"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Dep3 Co", credit_rating_tier: "BELOW_INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 100000, instrument_type: "CASH" }
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "FULL", derate_pct: 100, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "forced" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - call: "GET /market/margin-calls"
              payload: { market_participant_id: "${p_id}", status: "OPEN" }
              as: IsoOperator
              captures: { mc_amt: "$.data[0].required_additional_cents" }
          trigger:
            - call: "POST /market/postings/${cp_id}/release"
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "MarginCall.required_additional_cents == 400000 confirms the OPEN call exists (requirement 500000 − posted 100000)"
            - "error_id == ERR_OPEN_MARGIN_CALL — release depends on MarginCall state, not just on balances"
            - "CollateralPosting.${cp_id}.status remains POSTED and participant posted_collateral_cents stays 100000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: outage_half_open_interval_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_OUTAGE_OVERLAP]
          - entities.OutageReport.fields.start_at
        distinguishing_aspect: |
          Resource GeneratorAsset under HALF-OPEN datetime semantics: a report
          intersecting [10:00, 12:00) is rejected, while one starting at
          exactly 12:00 (adjacent, touching the exclusive end) is accepted.
        test_recipe:
          setup:
            - "Participant with one generator; existing SUBMITTED outage [2026-08-05T10:00:00Z, 2026-08-05T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Ovl Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 50, start_at: "2026-08-05T10:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "first" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out1: $.data.id }
          trigger:
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 30, start_at: "2026-08-05T11:00:00Z", end_at: "2026-08-05T13:00:00Z", reason: "overlapping" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e_overlap: $.data.error_id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 30, start_at: "2026-08-05T12:00:00Z", end_at: "2026-08-05T14:00:00Z", reason: "adjacent" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out3: $.data.id, out3_st: $.data.status }
          assert:
            - "Overlap attempt rejected with ERR_OUTAGE_OVERLAP ([11:00,13:00) intersects [10:00,12:00))"
            - "Adjacent report ${out3} accepted with status SUBMITTED — half-open end is exclusive, so 12:00 start does not collide"
            - "GET /market/outages?generator_asset_id=${g_id} returns exactly 2 rows (${out1} then ${out3}, created_at ASC)"

      - name: performance_event_buffer_gap_semantics
        grounds:
          - validations[priority=11]
          - errors[ERR_EVENT_BUFFER_VIOLATION]
          - entities.CapacityPerformanceEvent.fields.start_interval
        distinguishing_aspect: |
          Different resource (OperatingDay event calendar) under DIFFERENT
          interval semantics than the outage half-open rule: closed integer
          intervals with a mandatory one-interval buffer — event [1,4] blocks a
          new event starting at 5 (adjacent) and only allows start >= 6.
        test_recipe:
          setup:
            - "Operating day 2026-08-10 with existing DECLARED event intervals 1-4"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 1, end_interval: 4 }
              as: IsoOperator
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 5, end_interval: 6 }
              as: IsoOperator
              captures: { e_buf: $.data.error_id }
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 6, end_interval: 8 }
              as: IsoOperator
              captures: { ev3: $.data.id, ev3_st: $.data.status }
          assert:
            - "Adjacent event [5,6] rejected with ERR_EVENT_BUFFER_VIOLATION — unlike the outage rule, direct adjacency is forbidden here (buffer interval 5 must stay empty)"
            - "Event [6,8] accepted (DECLARED): 6 >= 4 + 2 satisfies the one-interval buffer"
            - "GET /market/events?operating_day_id=${d_id} returns exactly 2 rows (${ev1} then ${ev3})"

  - rule_id: compensating_invariant
    instances:
      - name: collateral_post_release_conservation
        grounds:
          - state_machines.CollateralPosting.POSTED_to_RELEASED
          - entities.MarketParticipant.fields.posted_collateral_cents
        distinguishing_aspect: |
          Conserved quantity: MarketParticipant.posted_collateral_cents ==
          Σ amount_cents over POSTED postings. The forward action (post 250000)
          paired with its compensating action (release the same posting)
          returns the conserved quantity to its exact prior value (0).
        test_recipe:
          setup:
            - "INVESTMENT_GRADE participant with no statements, no offers, no AT_RISK obligations → effective_requirement 0"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Inv Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id, p_posted0: $.data.posted_collateral_cents }
          trigger:
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 250000, instrument_type: "CASH" }
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { cp_id: $.data.id, cp_st: $.data.status }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_posted1: $.data.posted_collateral_cents }
            - { call: "POST /market/postings/${cp_id}/release", as: CreditOfficer, as_user_id: "${p_id}" }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_posted2: $.data.posted_collateral_cents }
            - call: "GET /market/postings/${cp_id}"
              as: IsoOperator
              captures: { cp_st2: $.data.status }
          assert:
            - "posted_collateral_cents: 0 → 250000 after post → 0 after release — forward + compensating pair leaves the conserved quantity unchanged"
            - "CollateralPosting.${cp_id}.status == POSTED after create and == RELEASED after release"
            - "Invariant holds at every step: posted_collateral_cents == Σ amount_cents of POSTED postings (250000 then 0)"

      - name: penalty_pool_zero_sum_conservation
        grounds:
          - calculations.capacity_performance_charge
          - entities.CapacityPerformanceEvent.fields.penalties_collected_cents
          - entities.CapacityPerformanceEvent.fields.bonuses_paid_cents
        distinguishing_aspect: |
          Different conserved quantity than collateral: the capacity penalty
          pool. Penalties charged (forward action) fund bonuses to
          over-performers (compensating allocation), and the pool zero-sums:
          penalties_collected_cents − bonuses_paid_cents == 0 whenever any
          surplus claim exists.
        test_recipe:
          setup:
            - "Two participants, generators A (obligation 10 MW) and B (obligation 5 MW), delivery period 2026-08"
            - "Day 2026-08-10 event intervals 1-2: A averages 6 MW (shortfall 4 → penalty 4 × 50000 × 2 = 400000); B averages 8 MW (surplus 3 → claim 6 MWh, sole claimant)"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Under Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p1: $.data.id }
            - call: "POST /market/participants"
              payload: { company_name: "Over Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p2: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p1}", unit_name: "A1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { ga: $.data.id, ga_v: $.data.version }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p2}", unit_name: "B1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { gb: $.data.id, gb_v: $.data.version }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${ga}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }
              as: IsoOperator
              captures: { oba: $.data.id }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${gb}", delivery_period: "2026-08", obligated_mw: 5, capacity_rate_cents_per_mw: 1000000 }
              as: IsoOperator
              captures: { obb: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${ga}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${ga_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
              as_user_id: "${p1}"
            - call: "POST /market/generators/${gb}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${gb_v}", readings: [ { interval_index: 1, actual_mw: 8 }, { interval_index: 2, actual_mw: 8 } ] }
              as: Trader
              as_user_id: "${p2}"
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 1, end_interval: 2 }
              as: IsoOperator
              captures: { ev_id: $.data.id }
            - { call: "POST /market/events/${ev_id}/activate", as: IsoOperator }
          trigger:
            - { call: "POST /market/events/${ev_id}/complete", as: IsoOperator }
            - call: "GET /market/events/${ev_id}"
              as: IsoOperator
              captures: { ev_pen: $.data.penalties_collected_cents, ev_bon: $.data.bonuses_paid_cents, ev_st: $.data.status }
            - call: "GET /market/obligations/${oba}"
              as: IsoOperator
              captures: { oba_pen: $.data.accrued_penalty_cents, oba_bon: $.data.accrued_bonus_cents }
            - call: "GET /market/obligations/${obb}"
              as: IsoOperator
              captures: { obb_pen: $.data.accrued_penalty_cents, obb_bon: $.data.accrued_bonus_cents }
          assert:
            - "CapacityPerformanceEvent.${ev_id}.penalties_collected_cents == 400000 and bonuses_paid_cents == 400000 — pool zero-sums (collected − paid == 0)"
            - "CapacityObligation.${oba}: accrued_penalty_cents == 400000, accrued_bonus_cents == 0"
            - "CapacityObligation.${obb}: accrued_penalty_cents == 0, accrued_bonus_cents == 400000 (sole surplus claimant absorbs the whole pool)"
            - "event status == COMPLETED"



