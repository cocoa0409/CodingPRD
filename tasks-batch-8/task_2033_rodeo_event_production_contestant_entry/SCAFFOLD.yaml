# =============================================================================
# Task 2033: Rodeo Event Production & Contestant Entry — seed tables
# =============================================================================

scenario: |
  2033. Rodeo Event Production & Contestant Entry (PRCA rodeo committee): event schedule & rough stock/timed event slotting, contestant entry via central office & draw assignment, stock contractor agreement & animal welfare compliance, judge assignment & scoring/timing, payout structure by go-round & average, entry fee accounting & added money, veterinary presence & injury protocol, ticketing & arena operations

domain_name: rodeo-event-production
api_prefix: /api

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers: [cascading_side_effects, dual_variant_calculation, rate_threshold_triggers, optimistic_concurrency]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Rodeo
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rodeo production name" }
      - { name: city, type: string, source: input, description: "Host city" }
      - { name: entries_close_at, type: datetime, source: input, description: "Entry deadline; compared against the logical clock" }
      - { name: posture, type: enum, source: system, description: "DRAFT | ENTRIES_OPEN | DRAW_LOCKED | IN_PROGRESS | COMPLETED | SETTLED | CANCELLED", default: DRAFT }
      - { name: unclaimed_purse_cents, type: integer, source: computed, description: "Purse rolled to committee when a go-round or average has zero eligible contestants", default: 0 }

  - name: RodeoEvent
    parent: null
    common_fields: true
    fields:
      - { name: rodeo_id, type: string, source: input, description: "FK -> Rodeo.id; owning rodeo" }
      - { name: event_code, type: enum, source: input, description: "BAREBACK | SADDLE_BRONC | BULL_RIDING | TIE_DOWN_ROPING | STEER_WRESTLING | TEAM_ROPING | BARREL_RACING" }
      - { name: discipline, type: enum, source: computed, description: "ROUGH_STOCK for BAREBACK/SADDLE_BRONC/BULL_RIDING, else TIMED" }
      - { name: go_rounds, type: integer, source: input, description: "Number of go-rounds", constraints: "1..3" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Gross entry fee", constraints: ">= 1000" }
      - { name: added_money_cents, type: integer, source: input, description: "Committee added money for this event's purse", constraints: ">= 0" }
      - { name: per_performance_slots, type: integer, source: input, description: "Max draw slots for this event per performance", constraints: ">= 1" }
      - { name: payout_places, type: integer, source: input, description: "Places paid per go-round and per average", constraints: "1..4" }
      - { name: drawn_rounds, type: array, source: system, description: "Go-round numbers with an executed draw", default: "[]" }

  - name: Performance
    parent: null
    common_fields: true
    fields:
      - { name: rodeo_id, type: string, source: input, description: "FK -> Rodeo.id; owning rodeo" }
      - { name: label, type: string, source: input, description: "Human label, e.g. Friday Night" }
      - { name: arena, type: string, source: input, description: "Arena identifier; overlap-checked per rodeo+arena" }
      - { name: starts_at, type: datetime, source: input, description: "Performance start (half-open interval start)" }
      - { name: ends_at, type: datetime, source: input, description: "Performance end (half-open interval end); must be > starts_at" }
      - { name: arena_capacity, type: integer, source: input, description: "Ticket seats for this performance", constraints: ">= 1" }
      - { name: sold_tickets, type: integer, source: computed, description: "Sum of quantity over PAID TicketOrders", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: Contestant
    parent: null
    common_fields: true
    fields:
      - { name: card_number, type: string, source: input, description: "PRCA card number; unique across contestants" }
      - { name: full_name, type: string, source: input, description: "Contestant legal name" }
      - { name: status, type: enum, source: system, description: "GOOD_STANDING | SUSPENDED", default: GOOD_STANDING }

  - name: StockContract
    parent: null
    common_fields: true
    fields:
      - { name: rodeo_id, type: string, source: input, description: "FK -> Rodeo.id; rodeo this contractor serves" }
      - { name: contractor_name, type: string, source: input, description: "Stock contractor company name" }
      - { name: day_rate_cents, type: integer, source: input, description: "Day-rate basis: per performance-day fee", constraints: ">= 0" }
      - { name: per_out_fee_cents, type: integer, source: input, description: "Per-out basis: fee per completed animal out", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SETTLED | TERMINATED", default: PROPOSED }
      - { name: day_rate_total_cents, type: integer, source: computed, description: "day_rate_cents x distinct performance days of the rodeo; set at settle", default: 0 }
      - { name: per_out_total_cents, type: integer, source: computed, description: "per_out_fee_cents x completed outs of this contract's animals; set at settle", default: 0 }
      - { name: settlement_cents, type: integer, source: computed, description: "max(day_rate_total, per_out_total); set at settle", default: 0 }
      - { name: settlement_basis, type: enum, source: computed, description: "DAY_RATE | PER_OUT; which basis won (tie -> DAY_RATE); null until settled" }

  - name: StockAnimal
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> StockContract.id; owning contractor agreement" }
      - { name: tag_number, type: string, source: input, description: "Animal tag; unique within its contract" }
      - { name: event_code, type: enum, source: input, description: "Event this animal is slated for (same enum as RodeoEvent.event_code)" }
      - { name: welfare_out_count, type: integer, source: system, description: "Number of VERIFIED results naming this animal; invariant: equals count of VERIFIED non-VOIDED RunResults with this animal_id", default: 0 }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DRAWN | COMPETED | INJURED | RETIRED", default: AVAILABLE }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: card_number, type: string, source: input, description: "Judge card number; unique across judges" }
      - { name: full_name, type: string, source: input, description: "Judge name" }
      - { name: certification, type: enum, source: input, description: "PRCA_CARD | PRCA_GOLD; BARRIER assignments require PRCA_GOLD" }

  - name: JudgeAssignment
    parent: null
    common_fields: true
    fields:
      - { name: judge_id, type: string, source: input, description: "FK -> Judge.id; assigned judge" }
      - { name: performance_id, type: string, source: input, description: "FK -> Performance.id; assigned performance" }
      - { name: position, type: enum, source: input, description: "ARENA_1 | ARENA_2 | BARRIER | TIMER" }

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - { name: contestant_id, type: string, source: input, description: "FK -> Contestant.id; entering contestant" }
      - { name: rodeo_event_id, type: string, source: input, description: "FK -> RodeoEvent.id; target event" }
      - { name: status, type: enum, source: system, description: "ENTERED | WAITLISTED | DRAWN | TURNED_OUT | DRAWN_OUT | CANCELLED | COMPETED", default: ENTERED }
      - { name: entry_fee_cents, type: integer, source: system, description: "Fee charged at latest entry/re-entry; copied from RodeoEvent.entry_fee_cents at charge time" }
      - { name: purse_contribution_cents, type: integer, source: computed, description: "Latest split: fee - retention - sanction (residual, per entry_fee_split)" }
      - { name: committee_retention_cents, type: integer, source: computed, description: "Latest split: round_half_up(fee x 0.12), rounded per entry" }
      - { name: sanction_fee_cents, type: integer, source: computed, description: "Latest split: flat 600" }
      - { name: fee_charges_cents, type: integer, source: system, description: "Cumulative gross fees ever charged on this entry (grows on re-entry)", default: 0 }
      - { name: contribution_charges_cents, type: integer, source: system, description: "Cumulative purse contributions ever charged (grows on re-entry)", default: 0 }
      - { name: refunded_cents, type: integer, source: system, description: "Cumulative gross refunded", default: 0 }
      - { name: refunded_contribution_cents, type: integer, source: system, description: "Cumulative purse-contribution portion refunded (drives purse shrink)", default: 0 }
      - { name: turn_out_reason, type: enum, source: system, description: "VOLUNTARY | MEDICAL; set on TURN_OUT, cleared on RE_ENTER; null otherwise" }
      - { name: vet_report_id, type: string, source: system, description: "FK -> VetReport.id; justifying report for medical turn-out; null otherwise" }

  - name: DrawAssignment
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> Entry.id; assigned entry" }
      - { name: rodeo_event_id, type: string, source: system, description: "FK -> RodeoEvent.id; denormalized for queries" }
      - { name: go_round_number, type: integer, source: system, description: "Go-round this assignment slots" }
      - { name: performance_id, type: string, source: system, description: "FK -> Performance.id; slotted performance" }
      - { name: animal_id, type: string, source: system, description: "FK -> StockAnimal.id; rough stock only, null for TIMED events" }
      - { name: draw_position, type: integer, source: system, description: "1-based order within the performance for this event+go-round" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | RELEASED", default: PENDING }

  - name: RunResult
    parent: null
    common_fields: true
    fields:
      - { name: draw_assignment_id, type: string, source: input, description: "FK -> DrawAssignment.id; the out being scored" }
      - { name: entry_id, type: string, source: system, description: "FK -> Entry.id; denormalized from the assignment" }
      - { name: rodeo_event_id, type: string, source: system, description: "FK -> RodeoEvent.id; denormalized from the assignment" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; set from X-User-ID of the submitting Judge" }
      - { name: judge_1_score, type: integer, source: input, description: "ROUGH_STOCK only: judge 1 score", constraints: "0..50; null for TIMED" }
      - { name: judge_2_score, type: integer, source: input, description: "ROUGH_STOCK only: judge 2 score", constraints: "0..50; null for TIMED" }
      - { name: raw_time_ms, type: integer, source: input, description: "TIMED only: raw time", constraints: ">= 0; null for ROUGH_STOCK" }
      - { name: penalty_ms, type: integer, source: input, description: "TIMED only: penalty time", default: 0, constraints: ">= 0" }
      - { name: qualified_flag, type: boolean, source: input, description: "Judges mark the ride/run qualified" }
      - { name: disqualified_flag, type: boolean, source: input, description: "Judges disqualify the out", default: false }
      - { name: outcome, type: enum, source: computed, description: "DISQUALIFIED if disqualified_flag; else QUALIFIED if qualified_flag; else NO_SCORE (rough) / NO_TIME (timed)" }
      - { name: total_score, type: integer, source: computed, description: "judge_1_score + judge_2_score (rough stock), 0..100" }
      - { name: total_time_ms, type: integer, source: computed, description: "raw_time_ms + penalty_ms (timed)" }
      - { name: status, type: enum, source: system, description: "RECORDED | VERIFIED | AMENDED | VOIDED", default: RECORDED }
      - { name: amendment_reason, type: string, source: system, description: "Set on AMEND; null otherwise" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp of latest VERIFY transition; tie-remainder allocation key" }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: rodeo_event_id, type: string, source: input, description: "FK -> RodeoEvent.id; 1:1 with the event" }
      - { name: computed_variant, type: enum, source: system, description: "PROVISIONAL (includes RECORDED+VERIFIED results) | FINAL (VERIFIED only); variant of the last compute" }
      - { name: purse_cents, type: integer, source: computed, description: "added_money_cents + sum over entries of (contribution_charges_cents - refunded_contribution_cents)" }
      - { name: go_round_pools, type: array, source: computed, description: "Per go-round {go_round, pool_cents}; empty go-rounds roll into average" }
      - { name: average_pool_cents, type: integer, source: computed, description: "purse - sum(non-empty go-round pools) + rolled-in empty go-round pools" }
      - { name: place_lines, type: array, source: computed, description: "{scope: GO_ROUND_n | AVERAGE, place, contestant_id, amount_cents, tied_count}" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | DISBURSED", default: PROVISIONAL }

  - name: VetReport
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: input, description: "ANIMAL | CONTESTANT" }
      - { name: animal_id, type: string, source: input, description: "FK -> StockAnimal.id; required when subject_type=ANIMAL, else null" }
      - { name: contestant_id, type: string, source: input, description: "FK -> Contestant.id; required when subject_type=CONTESTANT, else null" }
      - { name: performance_id, type: string, source: input, description: "FK -> Performance.id; optional context" }
      - { name: findings, type: string, source: input, description: "Free-text veterinary findings" }
      - { name: disposition, type: enum, source: input, description: "CLEARED | INJURED_TURNOUT | RETIRED; CONTESTANT subject allows only INJURED_TURNOUT" }
      - { name: veterinarian_name, type: string, source: input, description: "Attending veterinarian" }

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - { name: performance_id, type: string, source: input, description: "FK -> Performance.id; ticketed performance" }
      - { name: section, type: string, source: input, description: "Seating section label" }
      - { name: quantity, type: integer, source: input, description: "Seats purchased", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per seat", constraints: ">= 0" }
      - { name: total_cents, type: integer, source: computed, description: "quantity x unit_price_cents" }
      - { name: status, type: enum, source: system, description: "PAID | REFUNDED", default: PAID }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Rodeo
    field: posture
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ENTRIES_OPEN
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=OPEN_ENTRIES)"
        actor: CommitteeAdmin
        preconditions: ["At least one RodeoEvent exists for this rodeo", "At least one Performance exists for this rodeo"]
        side_effects: []
      - from: ENTRIES_OPEN
        to: DRAW_LOCKED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=LOCK_DRAW)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: []
      - from: DRAW_LOCKED
        to: ENTRIES_OPEN
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=UNLOCK_DRAW)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Every PENDING DrawAssignment of this rodeo's events -> RELEASED; their StockAnimals DRAWN -> AVAILABLE"
          - "WAITLISTED entries of this rodeo's events -> ENTERED"
          - "DRAWN entries of this rodeo's events -> ENTERED"
          - "drawn_rounds cleared on all of this rodeo's RodeoEvents"
        note: "Unlock wipes the draw so a later lock+draw rebuilds it from scratch (re-draw supersedes under OCC)."
      - from: DRAW_LOCKED
        to: IN_PROGRESS
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=START_RODEO)"
        actor: CommitteeAdmin
        preconditions: ["Every RodeoEvent of this rodeo has 1 in drawn_rounds"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=COMPLETE_RODEO)"
        actor: CommitteeAdmin
        preconditions:
          - "Every Performance of this rodeo has status IN {COMPLETED, CANCELLED}"
          - "No RunResult of this rodeo's entries has status IN {RECORDED, AMENDED} (ERR_RESULTS_PENDING)"
        side_effects: []
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=SETTLE_RODEO)"
        actor: CommitteeAdmin
        preconditions: ["Every RodeoEvent of this rodeo has a Payout with status FINAL (ERR_PAYOUT_NOT_FINAL)"]
        side_effects:
          - "Every such Payout FINAL -> DISBURSED"
          - "Every StockContract of this rodeo with status ACTIVE -> SETTLED; contractor_settlement computed (day_rate_total_cents, per_out_total_cents, settlement_cents, settlement_basis)"
          - "For each event whose average had zero eligible contestants, its average_pool_cents is added to Rodeo.unclaimed_purse_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=CANCEL_RODEO)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: ["All non-terminal Entries -> CANCELLED with full refund", "All PENDING DrawAssignments -> RELEASED; StockAnimals DRAWN -> AVAILABLE"]
      - from: ENTRIES_OPEN
        to: CANCELLED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=CANCEL_RODEO)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: ["Same cascades as DRAFT -> CANCELLED"]
      - from: DRAW_LOCKED
        to: CANCELLED
        trigger: "POST /api/rodeos/{rodeo_id}/transition (action=CANCEL_RODEO)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: ["Same cascades as DRAFT -> CANCELLED"]

  - entity: Performance
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/performances/{performance_id}/transition (action=COMPLETE_PERFORMANCE)"
        actor: CommitteeAdmin
        preconditions: ["Rodeo posture == IN_PROGRESS"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/performances/{performance_id}/transition (action=CANCEL_PERFORMANCE)"
        actor: CommitteeAdmin
        preconditions: ["No DrawAssignment with this performance_id has status IN {PENDING, COMPLETED} (ERR_PERF_HAS_ASSIGNMENTS)"]
        side_effects: ["PAID TicketOrders for this performance -> REFUNDED; sold_tickets recomputed"]

  - entity: Contestant
    field: status
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "PATCH /api/contestants/{contestant_id} (status=SUSPENDED)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "ENTERED entries of this contestant -> CANCELLED (full refund incl. sanction)"
          - "WAITLISTED entries -> CANCELLED (full refund incl. sanction)"
          - "DRAWN entries -> DRAWN_OUT (full refund incl. sanction); their PENDING DrawAssignments -> RELEASED; assigned StockAnimals DRAWN -> AVAILABLE"
          - "Event purses recomputed (refunded_contribution_cents rises); any existing Payout record is stale until recomputed"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "PATCH /api/contestants/{contestant_id} (status=GOOD_STANDING)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: []
        note: "Does not undo prior DRAWN_OUT/CANCELLED cascades."

  - entity: StockContract
    field: status
    initial_state: PROPOSED
    terminal_states: [SETTLED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /api/stock-contracts/{contract_id}/transition (action=ACTIVATE)"
        actor: CommitteeAdmin
        preconditions: ["Rodeo posture IN {DRAFT, ENTRIES_OPEN}"]
        side_effects: []
      - from: ACTIVE
        to: SETTLED
        trigger: "system (Rodeo SETTLE_RODEO)"
        actor: system
        preconditions: []
        side_effects: ["contractor_settlement computed and stored"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/stock-contracts/{contract_id}/transition (action=TERMINATE)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "AVAILABLE animals of this contract -> RETIRED"
          - "DRAWN animals: their PENDING DrawAssignments -> RELEASED, those Entries -> DRAWN_OUT (full refund), then the animals -> RETIRED"
          - "INJURED animals -> RETIRED"
          - "Event purses recomputed for refunded entries"

  - entity: StockAnimal
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: DRAWN
        trigger: "system (draw execution assigns this animal)"
        actor: system
        preconditions: ["welfare_out_count < 3", "Owning StockContract status == ACTIVE"]
        side_effects: []
      - from: DRAWN
        to: COMPETED
        trigger: "system (RunResult naming this animal VERIFY)"
        actor: system
        preconditions: []
        side_effects: ["welfare_out_count += 1"]
      - from: COMPETED
        to: AVAILABLE
        trigger: "system (auto-release after welfare_out_count increment when count < 3)"
        actor: system
        preconditions: ["welfare_out_count < 3"]
        side_effects: []
      - from: COMPETED
        to: RETIRED
        trigger: "system (auto-retire after welfare_out_count increment when count >= 3)"
        actor: system
        preconditions: ["welfare_out_count >= 3"]
        side_effects: []
      - from: DRAWN
        to: AVAILABLE
        trigger: "system (assignment RELEASED: turn-out, re-draw supersede, unlock, suspension, termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: INJURED
        trigger: "POST /api/vet-reports (disposition=INJURED_TURNOUT)"
        actor: Veterinarian
        preconditions: []
        side_effects: []
      - from: DRAWN
        to: INJURED
        trigger: "POST /api/vet-reports (disposition=INJURED_TURNOUT)"
        actor: Veterinarian
        preconditions: []
        side_effects: ["PENDING DrawAssignments naming this animal -> RELEASED; their Entries -> TURNED_OUT (MEDICAL, purse contribution refunded, vet_report_id = this report); purse recomputed; existing Payout stale"]
      - from: COMPETED
        to: INJURED
        trigger: "POST /api/vet-reports (disposition=INJURED_TURNOUT)"
        actor: Veterinarian
        preconditions: []
        side_effects: []
      - from: INJURED
        to: AVAILABLE
        trigger: "POST /api/vet-reports (disposition=CLEARED)"
        actor: Veterinarian
        preconditions: ["Animal status == INJURED (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /api/vet-reports (disposition=RETIRED) or system (contract TERMINATE)"
        actor: "Veterinarian or system"
        preconditions: []
        side_effects: []
      - from: INJURED
        to: RETIRED
        trigger: "POST /api/vet-reports (disposition=RETIRED) or system (contract TERMINATE)"
        actor: "Veterinarian or system"
        preconditions: []
        side_effects: []
      - from: DRAWN
        to: RETIRED
        trigger: "POST /api/vet-reports (disposition=RETIRED)"
        actor: Veterinarian
        preconditions: []
        side_effects: ["Same entry release cascade as DRAWN -> INJURED"]

  - entity: Entry
    field: status
    initial_state: ENTERED
    terminal_states: [CANCELLED, DRAWN_OUT, COMPETED]
    transitions:
      - from: ENTERED
        to: CANCELLED
        trigger: "POST /api/entries/{entry_id}/transition (action=CANCEL_ENTRY) or system (rodeo cancel / contestant suspension)"
        actor: "EntryOffice, Contestant (own), or system"
        preconditions: []
        side_effects: ["Refund purse_contribution + committee_retention (sanction kept): refunded_cents += contribution+retention; refunded_contribution_cents += contribution; purse recomputed"]
      - from: ENTERED
        to: DRAWN
        trigger: "system (draw execution slots this entry)"
        actor: system
        preconditions: []
        side_effects: ["DrawAssignment created (PENDING); rough stock: assigned StockAnimal AVAILABLE -> DRAWN"]
      - from: ENTERED
        to: WAITLISTED
        trigger: "system (draw execution finds no free performance slot)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: DRAWN
        trigger: "system (re-draw with freed capacity slots this entry)"
        actor: system
        preconditions: []
        side_effects: ["DrawAssignment created (PENDING); rough stock: animal AVAILABLE -> DRAWN"]
      - from: WAITLISTED
        to: ENTERED
        trigger: "system (UNLOCK_DRAW wipe)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAWN
        to: ENTERED
        trigger: "system (UNLOCK_DRAW wipe)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAWN
        to: TURNED_OUT
        trigger: "POST /api/entries/{entry_id}/transition (action=TURN_OUT, reason=VOLUNTARY|MEDICAL, vet_report_id required when MEDICAL) or system (vet injury cascade)"
        actor: "EntryOffice, Contestant (own), or system"
        preconditions: ["Rodeo posture IN {DRAW_LOCKED, IN_PROGRESS}", "MEDICAL: vet_report_id references a VetReport with disposition=INJURED_TURNOUT (ERR_MEDICAL_RELEASE_REQUIRED)"]
        side_effects:
          - "VOLUNTARY: no refund (fee forfeited to purse)"
          - "MEDICAL: refunded_cents += purse_contribution; refunded_contribution_cents += purse_contribution; purse recomputed"
          - "PENDING DrawAssignments of this entry -> RELEASED; assigned animals DRAWN -> AVAILABLE"
      - from: TURNED_OUT
        to: ENTERED
        trigger: "POST /api/entries/{entry_id}/transition (action=RE_ENTER)"
        actor: "EntryOffice, Contestant (own)"
        preconditions: ["Rodeo posture == ENTRIES_OPEN (ERR_RODEO_NOT_OPEN)", "logical clock < entries_close_at (ERR_ENTRY_WINDOW_CLOSED)", "Contestant status == GOOD_STANDING (ERR_CONTESTANT_SUSPENDED)"]
        side_effects: ["Fee split recomputed from RodeoEvent.entry_fee_cents; fee_charges_cents += fee; contribution_charges_cents += new contribution; turn_out_reason and vet_report_id cleared; purse grows by new contribution"]
        note: "Voluntary turn-out forfeits the first fee; re-entry charges again, so one contestant may contribute twice. This is intended."
      - from: DRAWN
        to: DRAWN_OUT
        trigger: "POST /api/entries/{entry_id}/transition (action=DRAW_OUT) or system (contestant suspension / contract termination)"
        actor: "CommitteeAdmin or system"
        preconditions: []
        side_effects: ["Full refund incl. sanction: refunded_cents += fee; refunded_contribution_cents += contribution", "PENDING DrawAssignments -> RELEASED; animals DRAWN -> AVAILABLE", "Purse recomputed"]
      - from: DRAWN
        to: COMPETED
        trigger: "system (bubble-up: all go-round DrawAssignments of this entry are COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPETED
        to: DRAWN
        trigger: "system (a VERIFIED result of this entry is AMENDED, reopening a go-round)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrawAssignment
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "system (RunResult for this assignment VERIFY)"
        actor: system
        preconditions: []
        side_effects: ["animal DRAWN -> COMPETED (+welfare_out_count, then auto-release or auto-retire)", "entry bubble-up check for COMPETED"]
      - from: COMPLETED
        to: PENDING
        trigger: "system (the VERIFIED RunResult for this assignment is AMENDED)"
        actor: system
        preconditions: []
        side_effects: ["animal COMPETED/RETIRED -> DRAWN with welfare_out_count -= 1", "entry COMPETED -> DRAWN"]
      - from: PENDING
        to: RELEASED
        trigger: "system (turn-out, re-draw supersede, unlock, suspension, contract termination, vet injury/retire)"
        actor: system
        preconditions: []
        side_effects: ["assigned animal DRAWN -> AVAILABLE"]
    note: "Reride (POST /api/draw-assignments/{id}/reride) swaps animal_id on a PENDING rough-stock assignment without a status change: old animal DRAWN -> AVAILABLE, new animal AVAILABLE -> DRAWN."

  - entity: RunResult
    field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/run-results/{result_id}/transition (action=VERIFY)"
        actor: CommitteeAdmin
        preconditions: ["Rodeo posture == IN_PROGRESS"]
        side_effects: ["verified_at stamped", "DrawAssignment PENDING -> COMPLETED cascade", "existing Payout for the event is stale until recomputed"]
      - from: AMENDED
        to: VERIFIED
        trigger: "POST /api/run-results/{result_id}/transition (action=VERIFY)"
        actor: CommitteeAdmin
        preconditions: ["Rodeo posture == IN_PROGRESS"]
        side_effects: ["Same forward cascade as RECORDED -> VERIFIED"]
      - from: VERIFIED
        to: AMENDED
        trigger: "POST /api/run-results/{result_id}/transition (action=AMEND, amendment_reason + corrected score/time fields)"
        actor: Judge
        preconditions: ["Rodeo posture == IN_PROGRESS (results freeze at COMPLETED)", "Acting judge holds a JudgeAssignment for the result's performance"]
        side_effects: ["Compensation: DrawAssignment COMPLETED -> PENDING; animal welfare_out_count -= 1 and status COMPETED/RETIRED -> DRAWN; Entry COMPETED -> DRAWN; corrected fields stored; amendment_reason set"]
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/run-results/{result_id}/transition (action=VOID)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: ["Assignment stays PENDING (a new result may be recorded)"]
      - from: AMENDED
        to: VOIDED
        trigger: "POST /api/run-results/{result_id}/transition (action=VOID)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects: ["Assignment stays PENDING"]

  - entity: Payout
    field: status
    initial_state: PROVISIONAL
    terminal_states: [DISBURSED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /api/payouts/{payout_id}/transition (action=FINALIZE)"
        actor: CommitteeAdmin
        preconditions: ["Rodeo posture == COMPLETED"]
        side_effects: ["Recomputed under FINAL variant (VERIFIED results only); computed_variant = FINAL"]
      - from: FINAL
        to: DISBURSED
        trigger: "system (Rodeo SETTLE_RODEO)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TicketOrder
    field: status
    initial_state: PAID
    terminal_states: [REFUNDED]
    transitions:
      - from: PAID
        to: REFUNDED
        trigger: "POST /api/ticket-orders/{order_id}/transition (action=REFUND) or system (performance cancelled)"
        actor: "BoxOffice or system"
        preconditions: []
        side_effects: ["Performance.sold_tickets -= quantity"]

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: draw-execute-stale-event
    parent_entity: RodeoEvent
    write_endpoint: "POST /api/rodeo-events/{event_id}/draws"
    occ_field: expected_rodeo_event_version
    description: |
      Executing a draw against a RodeoEvent whose version has advanced since the
      client last observed it is rejected. A draw legitimately supersedes the
      prior draw for the same go-round (releasing its PENDING assignments), so a
      writer holding a stale version would otherwise silently wipe assignments
      created after its last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: entry_fee_split
    trigger: "Entry creation and Entry RE_ENTER"
    algorithm: aggregation
    formula: |
      sanction_fee_cents = SANCTION_FLAT_CENTS
      committee_retention_cents = round_half_up(entry_fee_cents * RETENTION_PCT)
      purse_contribution_cents = entry_fee_cents - committee_retention_cents - sanction_fee_cents
      Rounding order is pinned: the split is computed and rounded PER ENTRY at
      charge time; aggregates (purse, retention totals) sum the per-entry
      rounded values. Never round an aggregate fee sum. (Per-entry rounding of
      fees 2005 and 2030 yields retentions 241+244=485 and contributions
      1164+1186=2350; rounding the aggregate fee sum would yield 484 and 2351.)
    input_set: "The single Entry being charged; entry_fee_cents copied from RodeoEvent at charge time"
    constants:
      SANCTION_FLAT_CENTS: 600
      RETENTION_PCT: 0.12
    precision: "integer cents, round_half_up applied per entry"

  - name: purse_and_places
    trigger: "POST /api/payouts/compute (creates or refreshes the event's Payout) and POST /api/payouts/{payout_id}/transition (FINALIZE)"
    algorithm: waterfall_allocation
    formula: |
      purse_cents = event.added_money_cents + sum over the event's Entries of (contribution_charges_cents - refunded_contribution_cents)
      total_go_share = purse_cents - round_half_up(purse_cents * AVERAGE_SHARE_PCT)   # computed per pool below, see pin
      per go-round pool_g = round_half_up(purse_cents * (1 - AVERAGE_SHARE_PCT) / go_rounds)
      average_pool_cents = purse_cents - sum(pool_g for non-empty go-rounds)
        (empty go-round = zero QUALIFIED ranked contestants; its pool rolls into the average)
      if the average itself has zero eligible contestants: entire purse rolls to Rodeo.unclaimed_purse_cents at SETTLE
      Place percentages for N = event.payout_places: 1:[100], 2:[60,40], 3:[50,30,20], 4:[40,30,20,10]
      place_amount_k = round_half_up(pool * pct_k / 100) for k < N; place N gets the pool residual (pool - sum of prior places)
      Ranking input: results of the event with outcome == QUALIFIED, ordered by
        ROUGH_STOCK: total_score DESC; TIMED: total_time_ms ASC
      Go-round scope ranks that go-round's results; AVERAGE scope uses average_aggregate.
      Ties at place k covering m places: the m contestants split the sum of place
        amounts k..k+m-1 equally, each = round_half_up(sum / m); leftover cents
        (sum - m*each) go to the tied contestant whose result was verified
        earliest (verified_at ASC, tie-break RunResult.created_at ASC). Never id.
    input_set: "PROVISIONAL variant: RunResults of the event with status IN {RECORDED, VERIFIED}; FINAL variant: status == VERIFIED only. Entries: all statuses (refunds already net into the purse formula)."
    constants:
      AVERAGE_SHARE_PCT: 0.30
    precision: "integer cents, round_half_up; residual-to-last-place and residual-to-average pinned"
    variants:
      - name: provisional
        when: "compute with variant=PROVISIONAL, or any Payout before FINALIZE"
        difference: "ranking input includes RECORDED (unverified) results"
      - name: final
        when: "compute with variant=FINAL, and at FINALIZE"
        difference: "ranking input is VERIFIED results only; identical data with an unverified RECORDED result yields different place_lines than provisional"

  - name: average_aggregate
    trigger: "invoked by purse_and_places for the AVERAGE scope"
    algorithm: aggregation
    formula: |
      A contestant is eligible for the average only if they hold a QUALIFIED
      in-scope result (see variant) in EVERY go-round 1..event.go_rounds.
      aggregate = sum of total_score over go-rounds (ROUGH_STOCK, rank DESC)
                or sum of total_time_ms over go-rounds (TIMED, rank ASC)
      Ties in the aggregate are ties for placing (split per purse_and_places).
    input_set: "Entries of the event; per-contestant results grouped across go-rounds, filtered by the active variant's status set"
    precision: "integer"

  - name: contractor_settlement
    trigger: "Rodeo SETTLE_RODEO side effect on each ACTIVE StockContract"
    algorithm: threshold
    formula: |
      performance_days = count of DISTINCT calendar dates (UTC) over the rodeo's
        Performances with status IN {SCHEDULED, COMPLETED} at settle time
      day_rate_total_cents = day_rate_cents * performance_days
      outs = count of DrawAssignments with status COMPLETED whose animal belongs
        to this contract
      per_out_total_cents = per_out_fee_cents * outs
      settlement_cents = max(day_rate_total_cents, per_out_total_cents)
      settlement_basis = DAY_RATE if day_rate_total_cents >= per_out_total_cents else PER_OUT
    input_set: "The contract; rodeo performances; this contract's animals' DrawAssignments"
    precision: "integer cents"
    variants:
      - name: day_rate_basis
        when: "always computed"
        difference: "time-based: ignores how many animals actually worked"
      - name: per_out_basis
        when: "always computed"
        difference: "usage-based: identical contract data yields a different total; scaffold pins max() with tie -> DAY_RATE"

  - name: welfare_out_threshold
    trigger: "RunResult VERIFY cascade on the named StockAnimal"
    algorithm: threshold
    formula: |
      welfare_out_count += 1 on VERIFY; if welfare_out_count >= MAX_OUTS_PER_RODEO
        the animal auto-transitions COMPETED -> RETIRED, else COMPETED -> AVAILABLE.
      Boundary is inclusive: exactly 3 outs retires the animal.
      AMEND compensates: welfare_out_count -= 1 and the animal returns to DRAWN
        (even if it had auto-retired).
    input_set: "The single StockAnimal named by the verified/amended result's assignment"
    constants:
      MAX_OUTS_PER_RODEO: 3
    precision: "integer"

  - name: ticket_capacity_check
    trigger: "POST /api/ticket-orders"
    algorithm: threshold
    formula: |
      sold_tickets(performance) = sum of quantity over TicketOrders with status PAID
      accept iff sold_tickets + requested quantity <= arena_capacity
      (exactly reaching capacity succeeds; capacity + 1 -> ERR_CAPACITY_EXCEEDED)
    input_set: "TicketOrders of the performance with status PAID"
    precision: "integer seats"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint and action; Contestant may only act on entries whose contestant_id == X-User-ID; Judge identity must equal X-User-ID on result submission", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Body foreign keys exist (contestant_id, rodeo_event_id, contract_id, judge_id, performance_id, draw_assignment_id, animal_id, vet_report_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "create/action endpoints with body FKs" }
  - { priority: 5, category: business_constraint, check: "Field shape: enum members, ranges (go_rounds 1..3, payout_places 1..4, fee >= 1000), ends_at > starts_at, VetReport subject/disposition pairing (CONTESTANT allows only INJURED_TURNOUT), BARRIER assignment requires Judge.certification == PRCA_GOLD", error_id: ERR_VALIDATION, http_status: 400, applies_to: "create/action endpoints" }
  - { priority: 6, category: state, check: "Transition action is valid from the resource's current state (covers terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7, category: state, check: "Rodeo posture gate for the operation: entries/re-entry require ENTRIES_OPEN; draws require DRAW_LOCKED or IN_PROGRESS; results require IN_PROGRESS; FINALIZE requires COMPLETED", error_id: ERR_RODEO_NOT_OPEN, http_status: 409, applies_to: "posture-gated endpoints" }
  - { priority: 8, category: business_temporal, check: "Entry create / RE_ENTER: logical clock < Rodeo.entries_close_at", error_id: ERR_ENTRY_WINDOW_CLOSED, http_status: 409, applies_to: "POST /api/entries, entry RE_ENTER" }
  - { priority: 9, category: business_safety, check: "Contestant standing: status == GOOD_STANDING for entry create / RE_ENTER", error_id: ERR_CONTESTANT_SUSPENDED, http_status: 409, applies_to: "POST /api/entries, entry RE_ENTER" }
  - { priority: 10, category: business_safety, check: "Animal eligibility for draw assignment / reride: status == AVAILABLE (not DRAWN/INJURED/RETIRED), welfare_out_count < 3, event_code matches", error_id: ERR_ANIMAL_NOT_ELIGIBLE, http_status: 409, applies_to: "reride, draw stock selection" }
  - { priority: 11, category: business_referential, check: "Animal's StockContract status == ACTIVE for draw assignment / reride; MEDICAL turn-out requires vet_report_id naming a VetReport with disposition == INJURED_TURNOUT", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: "reride, draw stock selection" }
  - { priority: 11.5, category: business_referential, check: "MEDICAL turn-out vet report linkage", error_id: ERR_MEDICAL_RELEASE_REQUIRED, http_status: 409, applies_to: "entry TURN_OUT" }
  - { priority: 12, category: business_constraint, check: "Uniqueness: Contestant.card_number, Judge.card_number globally unique; StockAnimal.tag_number unique within contract", error_id: ERR_DUPLICATE_CARD, http_status: 409, applies_to: "POST /api/contestants, POST /api/judges, POST /api/stock-animals (tag uses ERR_DUPLICATE_TAG)" }
  - { priority: 13, category: business_constraint, check: "No second non-terminal Entry for the same (contestant_id, rodeo_event_id); non-terminal = ENTERED, WAITLISTED, DRAWN", error_id: ERR_DUPLICATE_ENTRY, http_status: 409, applies_to: "POST /api/entries" }
  - { priority: 14, category: business_constraint, check: "Performance overlap: same rodeo + same arena + status SCHEDULED, half-open [starts_at, ends_at) intersection; touching intervals allowed", error_id: ERR_PERFORMANCE_OVERLAP, http_status: 409, applies_to: "POST /api/performances" }
  - { priority: 15, category: business_constraint, check: "Judge buffered conflict: same judge with buffered interval [starts_at - 45min, ends_at + 45min) intersecting another assignment's buffered interval", error_id: ERR_JUDGE_CONFLICT, http_status: 409, applies_to: "POST /api/judge-assignments" }
  - { priority: 16, category: business_constraint, check: "Judge holds a JudgeAssignment for the result's performance (result submit and amend)", error_id: ERR_JUDGE_NOT_ASSIGNED, http_status: 409, applies_to: "POST /api/run-results, run-result AMEND" }
  - { priority: 17, category: business_constraint, check: "No non-VOIDED RunResult already exists for the same DrawAssignment", error_id: ERR_DUPLICATE_RESULT, http_status: 409, applies_to: "POST /api/run-results" }
  - { priority: 18, category: business_constraint, check: "Score/time domain: ROUGH_STOCK requires judge_1_score, judge_2_score in 0..50 and forbids raw_time_ms; TIMED requires raw_time_ms >= 0 and forbids judge scores", error_id: ERR_SCORE_OUT_OF_RANGE, http_status: 400, applies_to: "POST /api/run-results, run-result AMEND" }
  - { priority: 19, category: business_constraint, check: "Draw parameters: 1 <= go_round_number <= event.go_rounds; go-round G requires G-1 already in drawn_rounds; no VERIFIED results exist for this event+go-round", error_id: ERR_GO_ROUND_INVALID, http_status: 422, applies_to: "POST /api/rodeo-events/{event_id}/draws" }
  - { priority: 19.5, category: business_constraint, check: "Re-draw blocked once VERIFIED results exist for the go-round", error_id: ERR_RESULTS_EXIST, http_status: 409, applies_to: "POST /api/rodeo-events/{event_id}/draws" }
  - { priority: 20, category: business_constraint, check: "Rough-stock draw requires enough eligible animals for all assigned entries (atomic: no partial draw)", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /api/rodeo-events/{event_id}/draws" }
  - { priority: 21, category: business_constraint, check: "Performance cancel blocked while PENDING/COMPLETED DrawAssignments reference it", error_id: ERR_PERF_HAS_ASSIGNMENTS, http_status: 409, applies_to: "performance CANCEL_PERFORMANCE" }
  - { priority: 22, category: business_constraint, check: "Rodeo COMPLETE blocked while results unverified; SETTLE blocked while any event lacks a FINAL Payout", error_id: ERR_RESULTS_PENDING, http_status: 409, applies_to: "COMPLETE_RODEO (ERR_RESULTS_PENDING); SETTLE_RODEO uses ERR_PAYOUT_NOT_FINAL" }
  - { priority: 23, category: business_fiscal, check: "SETTLE_RODEO requires every event's Payout status == FINAL", error_id: ERR_PAYOUT_NOT_FINAL, http_status: 409, applies_to: "SETTLE_RODEO" }
  - { priority: 24, category: business_fiscal, check: "Ticket order: sold_tickets + quantity <= arena_capacity", error_id: ERR_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /api/ticket-orders" }
  - { priority: 25, category: business_fiscal, check: "OCC: expected_rodeo_event_version must equal the RodeoEvent's current version on draw execution", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/rodeo-events/{event_id}/draws" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [CommitteeAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  # --- Rodeo ---
  - { method: POST, path: "/api/rodeos", description: "Create a rodeo (posture DRAFT)", roles: [CommitteeAdmin], code: 201, input: [name, city, entries_close_at], output: Rodeo, side_effects: ["posture=DRAFT, unclaimed_purse_cents=0"] }
  - { method: GET, path: "/api/rodeos/{rodeo_id}", description: "Get a rodeo", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Rodeo, side_effects: [] }
  - { method: POST, path: "/api/rodeos/{rodeo_id}/transition", description: "Posture transition: OPEN_ENTRIES | LOCK_DRAW | UNLOCK_DRAW | START_RODEO | COMPLETE_RODEO | SETTLE_RODEO | CANCEL_RODEO", roles: [CommitteeAdmin], code: 200, input: [action], output: Rodeo, side_effects: ["Posture machine cascades per §1.2", "increments Rodeo.version by 1"] }

  # --- RodeoEvent ---
  - { method: POST, path: "/api/rodeo-events", description: "Add a competition event to a rodeo", roles: [CommitteeAdmin], code: 201, input: [rodeo_id, event_code, go_rounds, entry_fee_cents, added_money_cents, per_performance_slots, payout_places], output: RodeoEvent, side_effects: ["discipline computed from event_code"] }
  - { method: GET, path: "/api/rodeo-events", description: "List events (filter by rodeo_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["rodeo_event_id?", "rodeo_id?", "limit?", "offset?"], output: "RodeoEvent[]", side_effects: [] }
  - { method: GET, path: "/api/rodeo-events/{event_id}", description: "Get an event", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: RodeoEvent, side_effects: [] }
  - { method: POST, path: "/api/rodeo-events/{event_id}/draws", description: "Execute (or supersede) the deterministic draw for one go-round", roles: [CommitteeAdmin], code: 200, input: [go_round_number, expected_rodeo_event_version], output: { assigned_count: integer, waitlisted_count: integer, go_round_number: integer }, side_effects: ["increments RodeoEvent.version by 1", "supersede: prior PENDING assignments of this go-round RELEASED, animals freed, WAITLISTED back to ENTERED", "eligible entries sorted by created_at ASC then Contestant.card_number ASC; slotted round-robin into SCHEDULED performances ordered by starts_at ASC respecting per_performance_slots", "rough stock: eligible animals (AVAILABLE, welfare_out_count<3, contract ACTIVE, event_code match) sorted tag_number ASC assigned 1:1 in draw order", "overflow entries -> WAITLISTED (go-round 1)", "drawn_rounds updated"] }

  # --- Performance ---
  - { method: POST, path: "/api/performances", description: "Schedule a performance (arena overlap checked, half-open intervals)", roles: [CommitteeAdmin], code: 201, input: [rodeo_id, label, arena, starts_at, ends_at, arena_capacity], output: Performance, side_effects: ["status=SCHEDULED, sold_tickets=0"] }
  - { method: GET, path: "/api/performances", description: "List performances (filter by rodeo_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["rodeo_id?", "status?", "limit?", "offset?"], output: "Performance[]", side_effects: [] }
  - { method: GET, path: "/api/performances/{performance_id}", description: "Get a performance", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Performance, side_effects: [] }
  - { method: POST, path: "/api/performances/{performance_id}/transition", description: "COMPLETE_PERFORMANCE | CANCEL_PERFORMANCE", roles: [CommitteeAdmin], code: 200, input: [action], output: Performance, side_effects: ["CANCEL: PAID TicketOrders -> REFUNDED, sold_tickets recomputed"] }

  # --- Contestant ---
  - { method: POST, path: "/api/contestants", description: "Register a contestant (PRCA card)", roles: [CommitteeAdmin, EntryOffice], code: 201, input: [card_number, full_name], output: Contestant, side_effects: ["status=GOOD_STANDING"] }
  - { method: GET, path: "/api/contestants", description: "List contestants", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["card_number?", "status?", "limit?", "offset?"], output: "Contestant[]", side_effects: [] }
  - { method: GET, path: "/api/contestants/{contestant_id}", description: "Get a contestant", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Contestant, side_effects: [] }
  - { method: PATCH, path: "/api/contestants/{contestant_id}", description: "Update contestant status (GOOD_STANDING | SUSPENDED); suspension cascades to entries", roles: [CommitteeAdmin], code: 200, input: [status], output: Contestant, side_effects: ["SUSPENDED: entry cancel/draw-out cascade per §1.2", "increments Contestant.version by 1"] }

  # --- StockContract ---
  - { method: POST, path: "/api/stock-contracts", description: "Create a stock contractor agreement (PROPOSED)", roles: [CommitteeAdmin], code: 201, input: [rodeo_id, contractor_name, day_rate_cents, per_out_fee_cents], output: StockContract, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/api/stock-contracts", description: "List contracts (filter by rodeo_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["rodeo_id?", "status?", "limit?", "offset?"], output: "StockContract[]", side_effects: [] }
  - { method: GET, path: "/api/stock-contracts/{contract_id}", description: "Get a contract", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: StockContract, side_effects: [] }
  - { method: POST, path: "/api/stock-contracts/{contract_id}/transition", description: "ACTIVATE | TERMINATE", roles: [CommitteeAdmin], code: 200, input: [action], output: StockContract, side_effects: ["TERMINATE: animal/entry cascade per §1.2"] }

  # --- StockAnimal ---
  - { method: POST, path: "/api/stock-animals", description: "Register an animal under a contract", roles: [CommitteeAdmin], code: 201, input: [contract_id, tag_number, event_code], output: StockAnimal, side_effects: ["status=AVAILABLE, welfare_out_count=0"] }
  - { method: GET, path: "/api/stock-animals", description: "List animals (filter by contract_id, event_code, status)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["contract_id?", "event_code?", "status?", "limit?", "offset?"], output: "StockAnimal[]", side_effects: [] }
  - { method: GET, path: "/api/stock-animals/{animal_id}", description: "Get an animal", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: StockAnimal, side_effects: [] }

  # --- Judge & assignments ---
  - { method: POST, path: "/api/judges", description: "Register a judge", roles: [CommitteeAdmin], code: 201, input: [card_number, full_name, certification], output: Judge, side_effects: [] }
  - { method: GET, path: "/api/judges", description: "List judges", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["card_number?", "certification?", "limit?", "offset?"], output: "Judge[]", side_effects: [] }
  - { method: GET, path: "/api/judges/{judge_id}", description: "Get a judge", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Judge, side_effects: [] }
  - { method: POST, path: "/api/judge-assignments", description: "Assign a judge to a performance (buffered-overlap checked)", roles: [CommitteeAdmin], code: 201, input: [judge_id, performance_id, position], output: JudgeAssignment, side_effects: [] }
  - { method: GET, path: "/api/judge-assignments", description: "List assignments (filter by judge_id, performance_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["judge_id?", "performance_id?", "limit?", "offset?"], output: "JudgeAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/judge-assignments/{assignment_id}", description: "Get an assignment", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: JudgeAssignment, side_effects: [] }

  # --- Entry ---
  - { method: POST, path: "/api/entries", description: "Enter a contestant into an event (central office or the contestant themself)", roles: [EntryOffice, Contestant], code: 201, input: [contestant_id, rodeo_event_id], output: Entry, side_effects: ["entry_fee_split computed and charged; fee copied from RodeoEvent; status=ENTERED; purse grows by purse_contribution_cents"] }
  - { method: GET, path: "/api/entries", description: "List entries (filters)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["contestant_id?", "rodeo_event_id?", "status?", "vet_report_id?", "limit?", "offset?"], output: "Entry[]", side_effects: [] }
  - { method: GET, path: "/api/entries/{entry_id}", description: "Get an entry", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Entry, side_effects: [] }
  - { method: POST, path: "/api/entries/{entry_id}/transition", description: "CANCEL_ENTRY | TURN_OUT | RE_ENTER (EntryOffice/Contestant-own) ; DRAW_OUT (CommitteeAdmin only)", roles: [CommitteeAdmin, EntryOffice, Contestant], code: 200, input: [action, "reason?", "vet_report_id?"], output: Entry, side_effects: ["refund rules and assignment releases per §1.2 Entry machine", "increments Entry.version by 1"] }

  # --- DrawAssignment ---
  - { method: GET, path: "/api/draw-assignments", description: "List draw assignments (filters)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["entry_id?", "rodeo_event_id?", "performance_id?", "animal_id?", "status?", "limit?", "offset?"], output: "DrawAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/draw-assignments/{draw_assignment_id}", description: "Get a draw assignment", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: DrawAssignment, side_effects: [] }
  - { method: POST, path: "/api/draw-assignments/{draw_assignment_id}/reride", description: "Swap the animal on a PENDING rough-stock assignment (re-ride)", roles: [CommitteeAdmin], code: 200, input: [animal_id], output: DrawAssignment, side_effects: ["old animal DRAWN -> AVAILABLE; new animal AVAILABLE -> DRAWN", "increments DrawAssignment.version by 1"] }

  # --- RunResult ---
  - { method: POST, path: "/api/run-results", description: "Judge records a score/time for an out", roles: [Judge], code: 201, input: [draw_assignment_id, "judge_1_score?", "judge_2_score?", "raw_time_ms?", "penalty_ms?", qualified_flag, "disqualified_flag?"], output: RunResult, side_effects: ["status=RECORDED; outcome/total computed; judge_id set from X-User-ID"] }
  - { method: GET, path: "/api/run-results", description: "List results (filters)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["draw_assignment_id?", "entry_id?", "rodeo_event_id?", "judge_id?", "status?", "limit?", "offset?"], output: "RunResult[]", side_effects: [] }
  - { method: GET, path: "/api/run-results/{result_id}", description: "Get a result", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: RunResult, side_effects: [] }
  - { method: POST, path: "/api/run-results/{result_id}/transition", description: "VERIFY | VOID (CommitteeAdmin) ; AMEND (Judge, assigned, with amendment_reason + corrected fields)", roles: [CommitteeAdmin, Judge], code: 200, input: [action, "amendment_reason?", "judge_1_score?", "judge_2_score?", "raw_time_ms?", "penalty_ms?", "qualified_flag?", "disqualified_flag?"], output: RunResult, side_effects: ["VERIFY: assignment/animal/entry cascade per §1.2; AMEND: compensating reversal", "increments RunResult.version by 1"] }

  # --- Payout ---
  - { method: POST, path: "/api/payouts/compute", description: "Create or refresh the event's Payout under the requested variant", roles: [CommitteeAdmin], code: 200, input: [rodeo_event_id, variant], output: Payout, side_effects: ["purse_and_places executed; computed_variant recorded; status stays PROVISIONAL until FINALIZE"] }
  - { method: GET, path: "/api/payouts", description: "List payouts (filter by rodeo_event_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["rodeo_event_id?", "status?", "limit?", "offset?"], output: "Payout[]", side_effects: [] }
  - { method: GET, path: "/api/payouts/{payout_id}", description: "Get a payout", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: POST, path: "/api/payouts/{payout_id}/transition", description: "FINALIZE (requires rodeo COMPLETED)", roles: [CommitteeAdmin], code: 200, input: [action], output: Payout, side_effects: ["recompute under FINAL variant; status PROVISIONAL -> FINAL"] }

  # --- VetReport ---
  - { method: POST, path: "/api/vet-reports", description: "File a veterinary report; ANIMAL dispositions drive the injury/clear/retire cascades", roles: [Veterinarian], code: 201, input: [subject_type, "animal_id?", "contestant_id?", "performance_id?", findings, disposition, veterinarian_name], output: VetReport, side_effects: ["animal status cascade per §1.2 StockAnimal machine (injury releases assignments, turns out entries with medical refund, purse recompute)"] }
  - { method: GET, path: "/api/vet-reports", description: "List vet reports (filters)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["animal_id?", "contestant_id?", "performance_id?", "limit?", "offset?"], output: "VetReport[]", side_effects: [] }
  - { method: GET, path: "/api/vet-reports/{report_id}", description: "Get a vet report", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: VetReport, side_effects: [] }

  # --- TicketOrder ---
  - { method: POST, path: "/api/ticket-orders", description: "Sell tickets for a performance (capacity-checked)", roles: [BoxOffice], code: 201, input: [performance_id, section, quantity, unit_price_cents], output: TicketOrder, side_effects: ["status=PAID; total_cents computed; Performance.sold_tickets += quantity"] }
  - { method: GET, path: "/api/ticket-orders", description: "List ticket orders (filter by performance_id)", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: ["performance_id?", "status?", "limit?", "offset?"], output: "TicketOrder[]", side_effects: [] }
  - { method: GET, path: "/api/ticket-orders/{order_id}", description: "Get a ticket order", roles: [CommitteeAdmin, EntryOffice, Contestant, Judge, Veterinarian, BoxOffice], code: 200, input: [], output: TicketOrder, side_effects: [] }
  - { method: POST, path: "/api/ticket-orders/{order_id}/transition", description: "REFUND a paid order", roles: [BoxOffice], code: 200, input: [action], output: TicketOrder, side_effects: ["PAID -> REFUNDED; Performance.sold_tickets -= quantity"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint/action, or Contestant acting on another contestant's entry" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Field shape violation: bad enum, out-of-range integer, ends_at <= starts_at, illegal VetReport subject/disposition pairing, BARRIER position with non-GOLD judge" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition action not valid from the resource's current state (incl. terminal lockdown)" }
  - { id: ERR_RODEO_NOT_OPEN, http: 409, condition: "Rodeo posture does not permit this operation" }
  - { id: ERR_ENTRY_WINDOW_CLOSED, http: 409, condition: "Logical clock is at/after Rodeo.entries_close_at on entry create or RE_ENTER" }
  - { id: ERR_CONTESTANT_SUSPENDED, http: 409, condition: "Contestant status is SUSPENDED on entry create or RE_ENTER" }
  - { id: ERR_DUPLICATE_CARD, http: 409, condition: "card_number already exists on Contestant or Judge create" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "tag_number already exists within the contract on animal create" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Contestant already holds a non-terminal entry (ENTERED/WAITLISTED/DRAWN) for this event" }
  - { id: ERR_MEDICAL_RELEASE_REQUIRED, http: 409, condition: "MEDICAL turn-out without a vet_report_id whose disposition is INJURED_TURNOUT" }
  - { id: ERR_PERFORMANCE_OVERLAP, http: 409, condition: "Same rodeo+arena half-open interval intersects an existing SCHEDULED performance" }
  - { id: ERR_JUDGE_CONFLICT, http: 409, condition: "Judge's buffered interval (+/-45min) intersects another of their assignments" }
  - { id: ERR_JUDGE_NOT_ASSIGNED, http: 409, condition: "Submitting/amending judge holds no JudgeAssignment for the result's performance" }
  - { id: ERR_DUPLICATE_RESULT, http: 409, condition: "A non-VOIDED RunResult already exists for this DrawAssignment" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 400, condition: "Rough-stock score outside 0..50, or wrong discipline payload (scores on TIMED / time on ROUGH_STOCK)" }
  - { id: ERR_GO_ROUND_INVALID, http: 422, condition: "go_round_number out of range, or go-round G requested before G-1 is drawn" }
  - { id: ERR_RESULTS_EXIST, http: 409, condition: "Re-draw of a go-round that already has VERIFIED results" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Rough-stock draw lacks enough eligible animals for all assigned entries (atomic reject)" }
  - { id: ERR_PERF_HAS_ASSIGNMENTS, http: 409, condition: "Performance cancel blocked by PENDING/COMPLETED draw assignments" }
  - { id: ERR_RESULTS_PENDING, http: 409, condition: "COMPLETE_RODEO while any result is RECORDED or AMENDED" }
  - { id: ERR_PAYOUT_NOT_FINAL, http: 409, condition: "SETTLE_RODEO while any event's Payout is missing or not FINAL" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Ticket order would push sold_tickets above arena_capacity" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Animal's StockContract is not ACTIVE at draw assignment / reride" }
  - { id: ERR_ANIMAL_NOT_ELIGIBLE, http: 409, condition: "Animal not AVAILABLE, event_code mismatch, or welfare_out_count >= 3 at assignment / reride" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rodeo_event_version does not match the RodeoEvent's current version" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CommitteeAdmin
    description: "Rodeo committee secretary/admin; runs production, draw, verification, payouts"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/rodeos and /api/rodeos/{id}/transition"
      - "POST /api/rodeo-events and /api/rodeo-events/{id}/draws"
      - "POST /api/performances and /api/performances/{id}/transition"
      - "PATCH /api/contestants/{id}"
      - "POST /api/stock-contracts(+transition), /api/stock-animals, /api/judges, /api/judge-assignments"
      - "POST /api/draw-assignments/{id}/reride"
      - "POST /api/payouts/compute and /api/payouts/{id}/transition"
      - "entry DRAW_OUT action; run-result VERIFY and VOID actions"
    shared_operations: ["All GET endpoints", "POST /api/contestants (with EntryOffice)"]
  - name: EntryOffice
    description: "Central entry office clerk; registers contestants and processes entries"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/contestants (with CommitteeAdmin)"
      - "POST /api/entries and entry CANCEL_ENTRY/TURN_OUT/RE_ENTER for any contestant (with Contestant)"
      - "All GET endpoints"
  - name: Contestant
    description: "PRCA contestant acting on their own entries"
    identity: entity_backed:Contestant
    exclusive_operations: []
    shared_operations:
      - "POST /api/entries with contestant_id == X-User-ID"
      - "Entry CANCEL_ENTRY/TURN_OUT/RE_ENTER on own entries"
      - "All GET endpoints"
  - name: Judge
    description: "Assigned event judge; records and amends results"
    identity: entity_backed:Judge
    exclusive_operations:
      - "POST /api/run-results"
      - "run-result AMEND action"
    shared_operations: ["All GET endpoints"]
  - name: Veterinarian
    description: "On-site veterinarian filing welfare reports"
    identity: opaque
    exclusive_operations: ["POST /api/vet-reports"]
    shared_operations: ["All GET endpoints"]
  - name: BoxOffice
    description: "Arena box office selling and refunding tickets"
    identity: opaque
    exclusive_operations: ["POST /api/ticket-orders", "POST /api/ticket-orders/{id}/transition"]
    shared_operations: ["All GET endpoints"]
