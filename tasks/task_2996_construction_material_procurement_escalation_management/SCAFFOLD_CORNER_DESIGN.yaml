        captures: {sup_id: $.data.id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '310.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-08, value: '316.20', published_at: '2026-08-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_COPPER_WIRE, period: 2026-07, value: '200.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_COPPER_WIRE, period: 2026-08, value: '204.10', published_at: '2026-08-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_at_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: ELEC-FEEDER-01, description: Electrical feeder conductor package, commodity_index_code: PPI_COPPER_WIRE, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
