              captures: { err_inv_nf: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PENALTY_INVOICE_NOT_FOUND"
            - "POST /false-alarm-program/penalty-invoices/8c1f0a44-0000-4000-8000-000000000007/adjustments returns the same 404 code before any version or amount check runs"
            - "PenaltyInvoice.${inv1_id} is untouched with outstanding_cents 5500"

      - name: payment_record_read_with_an_unknown_id_is_not_found
        claim_type: Error triggerability
        grounds:
          - errors.ERR_PAYMENT_RECORD_NOT_FOUND
          - endpoints.GET_/false-alarm-program/payment-records/{paymentId}
        distinguishing_aspect: "The void endpoint shares this path parameter, so the 404 must precede the two-day void-window check: an unknown paymentId can never produce ERR_PAYMENT_VOID_WINDOW_CLOSED, which is what stops a probe from inferring whether a receipt exists."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one real CARD payment of 5500 cents is posted."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_site
            - *k_c1
            - *k_c2
            - *k_sys1
            - *k_app1
            - *k_inv1
            - *k_site_v
            - *k_pay1
          trigger:
