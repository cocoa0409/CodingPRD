              payload: { body_actual_weight_lb: 2160 }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { uo_v2: "$.data.version" }
            - call: "POST /upfit/weight-certifications"
              payload: { upfit_order_id: "${uo}", basis: "AS_MEASURED", expected_upfit_order_version: "${uo_v2}" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { wc_m: "$.data.id" }
            - call: "POST /upfit/weight-certifications/${wc_m}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /upfit/compliance-labels"
              payload: { upfit_order_id: "${uo}", weight_certification_id: "${wc_m}" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { lbl: "$.data.id" }
            - call: "POST /upfit/build-slots/${slot1}/close"
              payload: {}
              as: InstallTechnician
              as_user_id: "tech-1"
            - call: "POST /upfit/upfit-orders/${uo}/deliver"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-1"
            - call: "POST /upfit/warranty-claims"
              payload: { upfit_order_id: "${uo}", claim_number: "WC-3001", failure_system: "CHASSIS_ELECTRICAL", claim_cost_cents: 73333 }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
              captures: { clm: "$.data.id" }
            - call: "POST /upfit/warranty-claims/${clm}/inspect"
              payload: { taint_confirmed: true }
              as: WarrantyAdministrator
              as_user_id: "wa-1"
          trigger:
            - call: "POST /upfit/warranty-claims/${clm}/adjudicate"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "wa-1"
          assert:
            - "UpfitOrder.${uo}.chassis_warranty_status == CONDITIONAL"
            - "ElectricalInterface.${ifc}.warranty_impact == CONDITIONAL"
            - "WarrantyClaim.${clm}.split_basis == FINAL"
            - "WarrantyClaim.${clm}.chassis_pct == 15"
            - "WarrantyClaim.${clm}.upfitter_pct == 80"
            - "WarrantyClaim.${clm}.goodwill_pct == 5"
            - "WarrantyClaim.${clm}.chassis_liability_cents == 11000"
            - "WarrantyClaim.${clm}.upfitter_liability_cents == 58666"
            - "WarrantyClaim.${clm}.customer_goodwill_cents == 3667"
            - "the PROVISIONAL split observed on the claim-create response was chassis_pct 60, upfitter_pct 35, goodwill_pct 5 with cents 44000 / 25667 / 3666"
            - "upfitter_liability_cents moved from 25667 (PROVISIONAL) to 58666 (FINAL), a delta of exactly 32999 cents"
            - "UpfitOrder.${uo}.upfitter_liability_cents == 58666"
            - "UpfitOrder.${uo}.chassis_liability_cents == 11000"
            - "UpfitOrder.${uo}.customer_goodwill_cents == 3667"

  - rule_id: combinatorial_formula
    instances:
      - name: payload_capacity_nested_min_with_front_term_skipped
        grounds:
          - calculations.payload_capacity
          - calculations.axle_load_distribution
          - entities.BodySpec.fields.cargo_cg_from_body_front_in
          - entities.ChassisModel.fields.front_gawr_lb
        distinguishing_aspect: |
          Mode (a) nested aggregate: payload_capacity is max(0, round(min(gvwr_headroom,
          rear_axle_headroom / rear_share, front_axle_headroom / front_share))) where the third
          candidate is DROPPED whenever front_share <= 0. On a 176 in wheelbase with the cargo
          centroid at 180 in the front share is negative (the load lifts the front axle), so the
          correct answer is 2999 lb from the rear-axle term; an implementation that keeps the front
          term divides positive headroom by a negative share and collapses the payload to 0.
        test_recipe:
          setup:
            - "ChassisModel F450-SRW-60CA: wheelbase 176 in, cab-to-axle 60 in, curb axles 4180 / 2320 lb, GVWR 14000, front GAWR 5000, rear GAWR 9450, max aux 40 A, DISCRETE bus, PTO FULL at 14 gpm."
            - "BodySpec DUMP-12FT: 3400 lb at cg 78 in, cargo cg 84 in, min CA 60 in, min wheelbase 176 in, 8 A, requires hydraulics."
            - "EquipmentSpec DUMP-HOIST-10T: 950 lb, PTO, 12 gpm, 5 A, duty 2, BODY_FLOOR."
            - "A CUSTOMER_SPECIFIC order with body_mount_offset_from_front_axle_in 96, so the body centroid is 174 in and the cargo centroid 180 in — 4 in BEHIND the rear axle."
            - "The hoist is planned at 130 in; chassis allocated so the 14 gpm pool is bound."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /upfit/chassis-models"
              payload: { code: "F450-SRW-60CA", make: "FORD", gvwr_lb: 14000, front_gawr_lb: 5000, rear_gawr_lb: 9450, wheelbase_in: 176, cab_to_axle_in: 60, curb_front_axle_lb: 4180, curb_rear_axle_lb: 2320, max_aux_amp_draw: 40, electrical_bus: "DISCRETE", pto_provision: "FULL", pto_max_flow_gpm: 14, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              captures: { cm_b: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "DUMP-12FT", body_type: "DUMP", weight_lb: 3400, cg_from_body_front_in: 78, cargo_cg_from_body_front_in: 84, length_in: 144, required_min_ca_in: 60, required_min_wheelbase_in: 176, aux_amp_draw: 8, requires_hydraulics: true, list_price_cents: 1120000 }
              as: PlantAdmin
              captures: { bs_dump: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "DUMP-HOIST-10T", equipment_class: "PTO_HOIST", weight_lb: 950, requires_pto: true, required_flow_gpm: 12, aux_amp_draw: 5, duty_priority: 2, mount_zone: "BODY_FLOOR", requires_can_gateway: false, list_price_cents: 640000 }
              as: PlantAdmin
              captures: { es_hoist: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-DUMP-B", chassis_model_id: "${cm_b}", body_spec_id: "${bs_dump}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF4HT0BB20001", chassis_model_id: "${cm_b}", ownership: "CUSTOMER_ASSIGNED", availability_date: "2026-08-10" }
              as: PlantAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4180, measured_rear_axle_weight_lb: 2320 }
