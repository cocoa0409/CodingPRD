scenario: |
  2932. Mental Health Parity Comparative Analysis (employer plan sponsor and third-party
  administrator): benefit classification into permitted categories with in-network and
  out-of-network tiers, quantitative treatment limitation testing using the substantially-all
  and predominant standards, nonquantitative treatment limitation inventory across prior
  authorization, network admission, reimbursement rates and medical necessity criteria,
  comparative analysis documentation with factors, evidentiary standards and stringency
  comparison in operation, data collection on denial rates and network composition to test
  as-applied parity, vendor cooperation and contractual obligations to produce analyses,
  regulator request response and corrective action plan, participant notice on identified
  violations
domain_name: mental-health-parity-comparative-analysis
api_prefix: /parity

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only four short sub-resource paths
  # exist (classifications, treatment-limitations, parity-tests, participant-notices);
  # every other entity is addressed at its own top-level collection with FK fields in
  # the request body and FK query filters on the list endpoints.
  state_machine_shape: cyclic
  # ComparativeAnalysis: SUBMITTED -> {CERTIFIED, INSUFFICIENT}, INSUFFICIENT -> DRAFT
  # (bounded revision loop). RegulatorRequest: RESPONDED -> INSUFFICIENT_RESPONSE ->
  # RESPONDED. VendorDataRequest carries two independent dimensions
  # (fulfillment_status x escalation_status). PlanYear.status is compound —
  # REMEDIATION is entered and left by recomputation of compliance_posture.
  relationship_patterns:
    - one_to_many
    - self_referential      # ComparativeAnalysis.supersedes_analysis_id -> ComparativeAnalysis.id
    - cross_aggregate       # DataSubmission ties a VendorDataRequest to a BenefitClassification
  role_model: segregation_of_duties
  # The user who authors a ComparativeAnalysis may not certify it; the ComplianceOfficer
  # who records a VIOLATION determination may not approve the CorrectiveActionPlan that
  # remedies it. Both checks compare X-User-ID against a persisted actor id.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Administrator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the third-party administrator that services the plan.
        constraints: "1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: Contract-notice address used for vendor escalation notices.
        constraints: "must contain '@'"
      - name: contractual_production_days
        type: integer
        source: input
        description: Contractual number of calendar days the TPA has to produce a requested analysis or data set.
        default: 45
        constraints: ">= 1 and <= 120"
      - name: outstanding_request_count
        type: integer
        source: computed
        description: "Conserved obligation counter: count(VendorDataRequest where administrator_id == this.id AND fulfillment_status IN {OPEN, PARTIAL})."
      - name: late_request_count
        type: integer
        source: computed
        description: "CONTRACT_BASIS late count: count(VendorDataRequest where administrator_id == this.id AND fulfillment_status IN {OPEN, PARTIAL} AND clock_now > due_at)."
      - name: breach_count
        type: integer
        source: computed
        description: "count(VendorDataRequest where administrator_id == this.id AND escalation_status == BREACH_DECLARED)."
      - name: regulator_reportable_late_count
        type: integer
        source: computed
        description: "REGULATORY_BASIS late count: count(VendorDataRequest where administrator_id == this.id AND fulfillment_status IN {OPEN, PARTIAL} AND clock_now > regulatory_due_at)."
      - name: cooperation_score
        type: number
        source: computed
        description: CONTRACT_BASIS cooperation score from calculations.administrator_cooperation_score (2 decimal places, floor 0).
      - name: regulatory_basis_cooperation_score
        type: number
        source: computed
        description: REGULATORY_BASIS variant of the same score, computed from regulator_reportable_late_count instead of late_request_count.
      - name: cooperation_status
        type: enum
        source: computed
        description: Vendor-cooperation posture derived from cooperation_score (CONTRACT_BASIS only).
        constraints: "one of {COOPERATIVE, DELINQUENT, ESCALATED}; COOPERATIVE iff cooperation_score >= 80, DELINQUENT iff 50 <= cooperation_score < 80, ESCALATED iff cooperation_score < 50"

  - name: PlanYear
    parent: null
    common_fields: true
    fields:
      - name: plan_name
        type: string
        source: input
        description: Name of the employer group health plan under review.
        constraints: "1..120 chars"
      - name: plan_year_label
        type: string
        source: input
        description: Human label of the plan year (e.g. "2026").
        constraints: "1..16 chars"
      - name: administrator_id
        type: string
        source: input
        description: FK -> Administrator.id; the TPA contractually obligated to produce comparative analyses for this plan year.
      - name: funding_arrangement
        type: enum
        source: input
        description: Whether the plan is self-funded or fully insured.
        constraints: "one of {SELF_FUNDED, INSURED}"
      - name: covered_participant_count
        type: integer
        source: input
        description: Number of covered participants; stamped onto every ParticipantNotice as recipient_count.
        constraints: ">= 1"
      - name: remediation_liability_cap_cents
        type: integer
        source: input
        description: Board-approved ceiling on aggregate approved corrective-action liability for this plan year.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Plan-year lifecycle state; gates which child mutations are accepted.
        default: OPEN
        constraints: "one of {OPEN, UNDER_REGULATOR_REVIEW, REMEDIATION, CLOSED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived posture from calculations.plan_year_compliance_posture; recomputed on every child event listed in that calculation's trigger.
        constraints: "one of {COMPLIANT, AT_RISK, VIOLATION}"
      - name: open_violation_count
        type: integer
        source: computed
        description: "count(NqtlItem where plan_year_id == this.id AND status == VIOLATION)."
      - name: notified_violation_count
        type: integer
        source: computed
        description: "count(ParticipantNotice where notice_type == VIOLATION_DISCLOSURE AND its NqtlItem.plan_year_id == this.id)."
      - name: failing_parity_test_count
        type: integer
        source: computed
        description: "count(ParityTest where status == COMPUTED AND basis == PLAN_PAYMENTS AND result == FAIL AND its BenefitClassification.plan_year_id == this.id); CLAIMS_COUNT tests are advisory and never counted."
      - name: remediation_liability_cents
        type: integer
        source: computed
        description: "sum(CorrectiveActionPlan.reprocessing_liability_cents where status == APPROVED AND its NqtlItem.plan_year_id == this.id); 0 when the set is empty."

  - name: BenefitClassification
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: FK -> PlanYear.id; owning plan year (taken from the path, not the body).
      - name: benefit_category
        type: enum
        source: input
        description: Permitted MHPAEA benefit category for this classification row.
        constraints: "one of {INPATIENT, OUTPATIENT, EMERGENCY_CARE, PRESCRIPTION_DRUGS}"
      - name: network_tier
        type: enum
        source: input
        description: Network tier of the classification.
        constraints: "one of {IN_NETWORK, OUT_OF_NETWORK, NOT_APPLICABLE}; must be NOT_APPLICABLE when benefit_category IN {EMERGENCY_CARE, PRESCRIPTION_DRUGS} and must NOT be NOT_APPLICABLE otherwise"
      - name: sub_classification
        type: enum
        source: input
        description: Outpatient sub-classification split.
        default: NONE
        constraints: "one of {NONE, OFFICE_VISITS, ALL_OTHER_OUTPATIENT}; must be NONE unless benefit_category == OUTPATIENT"
      - name: measurement_period_start
        type: string
        source: input
        description: Inclusive first date (YYYY-MM-DD) of the claims measurement period this classification row covers.
      - name: measurement_period_end
        type: string
        source: input
        description: Inclusive last date (YYYY-MM-DD) of the claims measurement period; must be >= measurement_period_start.
      - name: mh_su_benefits_covered
        type: boolean
        source: input
        description: Whether mental-health / substance-use-disorder benefits are offered in this classification.
        default: true

  - name: TreatmentLimitation
    parent: null
    common_fields: true
    fields:
      - name: classification_id
        type: string
        source: input
        description: FK -> BenefitClassification.id; classification whose financial requirement / quantitative limit this row records.
      - name: limitation_type
        type: enum
        source: input
        description: Type of financial requirement or quantitative treatment limitation.
        constraints: "one of {COPAY, COINSURANCE, DEDUCTIBLE, OUT_OF_POCKET_MAX, DAY_LIMIT, VISIT_LIMIT}"
      - name: benefit_side
        type: enum
        source: input
        description: Whether the row describes the medical/surgical baseline or the MH/SUD side under test.
        constraints: "one of {MEDICAL_SURGICAL, MENTAL_HEALTH_SUD}"
      - name: level_value
        type: number
        source: input
        description: The level of the requirement (dollar copay, coinsurance fraction, day/visit count). 0 means the requirement does not apply to that slice of benefits.
        constraints: ">= 0"
      - name: projected_plan_payments_cents
        type: integer
        source: input
        description: Dollar amount (in cents) of plan payments expected for the benefits subject to this level during the measurement period.
        constraints: ">= 0"
      - name: projected_claims_count
        type: integer
        source: input
        description: Number of claims expected for the benefits subject to this level; used only by the CLAIMS_COUNT parity-test variant.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: ACTIVE rows form the test population; a later row with the same (classification_id, limitation_type, benefit_side, level_value) supersedes the prior ACTIVE row.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

  - name: ParityTest
    parent: null
    common_fields: true
    fields:
      - name: classification_id
        type: string
        source: input
        description: FK -> BenefitClassification.id; classification the substantially-all / predominant test was run against.
      - name: limitation_type
        type: enum
        source: input
        description: Limitation type under test.
        constraints: "one of {COPAY, COINSURANCE, DEDUCTIBLE, OUT_OF_POCKET_MAX, DAY_LIMIT, VISIT_LIMIT}"
      - name: basis
        type: enum
        source: input
        description: Which weighting variant of calculations.qtl_predominant_level was applied.
        constraints: "one of {PLAN_PAYMENTS, CLAIMS_COUNT}"
      - name: advisory_only
        type: boolean
        source: computed
        description: "true iff basis == CLAIMS_COUNT; advisory tests never feed PlanYear.failing_parity_test_count."
      - name: total_ms_payments_cents
        type: integer
        source: computed
        description: Denominator of the substantially-all ratio — sum of projected_plan_payments_cents over ACTIVE MEDICAL_SURGICAL rows of this limitation_type.
      - name: subject_payments_cents
        type: integer
        source: computed
        description: Numerator of the substantially-all ratio — same sum restricted to rows with level_value > 0.
      - name: substantially_all_ratio
        type: number
        source: computed
        description: Reported ratio (6 decimal places, round_half_up) from calculations.qtl_substantially_all_ratio; display only, never used for the threshold comparison.
      - name: substantially_all_met
        type: boolean
        source: computed
        description: "Integer cross-multiplication verdict subject_payments_cents * 3 >= total_ms_payments_cents * 2."
      - name: predominant_level
        type: number
        source: computed
        description: Predominant medical/surgical level from calculations.qtl_predominant_level under the chosen basis; null when substantially_all_met is false.
      - name: mh_level_value
        type: number
        source: computed
        description: Level of the MH/SUD row selected by calculations.mh_level_under_test; null when no ACTIVE MENTAL_HEALTH_SUD row of this limitation_type exists.
      - name: result
        type: enum
        source: computed
        description: "NOT_APPLICABLE when substantially_all_met is false or mh_level_value is null; FAIL when mh_level_value > predominant_level; PASS otherwise."
        constraints: "one of {PASS, FAIL, NOT_APPLICABLE}"
      - name: status
        type: enum
        source: system
        description: A newer test on the same (classification_id, limitation_type, basis) supersedes the prior COMPUTED row.
        default: COMPUTED
        constraints: "one of {COMPUTED, SUPERSEDED}"

  - name: NqtlItem
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: FK -> PlanYear.id; plan year whose NQTL inventory this item belongs to.
      - name: classification_id
        type: string
        source: input
        description: FK -> BenefitClassification.id; classification the NQTL is applied in; must belong to plan_year_id.
      - name: nqtl_type
        type: enum
        source: input
        description: Nonquantitative treatment limitation being inventoried.
        constraints: "one of {PRIOR_AUTHORIZATION, NETWORK_ADMISSION, REIMBURSEMENT_RATE, MEDICAL_NECESSITY_CRITERIA, CONCURRENT_REVIEW, STEP_THERAPY}"
      - name: applied_to
        type: enum
        source: input
        description: Which benefit side the NQTL is applied to as written.
        constraints: "one of {MENTAL_HEALTH_SUD_ONLY, MEDICAL_SURGICAL_ONLY, BOTH}"
      - name: description
        type: string
        source: input
        description: Plain-language description of the limitation as written in plan documents.
        constraints: "1..400 chars"
      - name: stringency_in_operation_index
        type: number
        source: computed
        description: Index (0.00..10.00, 2 decimal places) from calculations.nqtl_stringency_in_operation_index; 0.00 before any evidence exists.
      - name: stringency_flag
        type: boolean
        source: computed
        description: "true iff stringency_in_operation_index >= STRINGENCY_VIOLATION_THRESHOLD (5.0)."
      - name: determination_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer whose determination last moved this item to COMPLIANT or VIOLATION; null before any determination.
      - name: status
        type: enum
        source: system
        description: NQTL analysis lifecycle state.
        default: INVENTORIED
        constraints: "one of {INVENTORIED, ANALYSIS_DRAFTED, ANALYSIS_SUBMITTED, COMPLIANT, VIOLATION, REMEDIATED}"

  - name: ComparativeAnalysis
    parent: null
    common_fields: true
    fields:
      - name: nqtl_item_id
        type: string
        source: input
        description: FK -> NqtlItem.id; NQTL this comparative analysis documents.
      - name: supersedes_analysis_id
        type: string
        source: input
        description: FK -> ComparativeAnalysis.id; prior analysis for the same nqtl_item_id that this one replaces; null on a first analysis.
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID captured at creation; the segregation-of-duties comparison target for certification.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who certified the analysis; null until CERTIFIED.
      - name: factor_count
        type: integer
        source: input
        description: Number of factors documented (e.g. excessive utilization, provider supply, claim-type mix).
        constraints: ">= 0"
      - name: evidentiary_standard_count
        type: integer
        source: input
        description: Number of evidentiary standards relied upon for those factors.
        constraints: ">= 0"
      - name: stringency_written_finding
        type: enum
        source: input
        description: Comparative finding for the limitation as written.
        constraints: "one of {COMPARABLE, MORE_STRINGENT_MH, MORE_STRINGENT_MS}"
      - name: stringency_operation_finding
        type: enum
        source: input
        description: Comparative finding for the limitation in operation.
        constraints: "one of {COMPARABLE, MORE_STRINGENT_MH, MORE_STRINGENT_MS}"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed INSUFFICIENT -> DRAFT loops; bounded by MAX_REVISION_ROUNDS.
        default: 0
      - name: status
        type: enum
        source: system
        description: Documentation lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CERTIFIED, INSUFFICIENT, WITHDRAWN}"

  - name: VendorDataRequest
    parent: null
    common_fields: true
    fields:
      - name: administrator_id
        type: string
        source: input
        description: FK -> Administrator.id; TPA obligated to produce the requested material.
      - name: plan_year_id
        type: string
        source: input
        description: FK -> PlanYear.id; plan year the request is scoped to.
      - name: nqtl_item_id
        type: string
        source: input
        description: FK -> NqtlItem.id; NQTL the requested material relates to; null for plan-wide data pulls.
      - name: requested_item_count
        type: integer
        source: input
        description: Number of VALIDATED DataSubmission rows required before the request is FULFILLED.
        constraints: ">= 1 and <= 10"
      - name: requested_submission_types
        type: array
        source: input
        description: Submission types the TPA must produce.
        constraints: "non-empty array of {DENIAL_RATES, NETWORK_COMPOSITION, REIMBURSEMENT_BENCHMARK}, no duplicates"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the request was issued (ISO 8601 UTC, three fractional digits).
      - name: due_at
        type: datetime
        source: computed
        description: "issued_at + Administrator.contractual_production_days calendar days, evaluated once at issuance and never re-derived."
      - name: regulatory_due_at
        type: datetime
        source: computed
        description: "issued_at + REGULATORY_PRODUCTION_DAYS (30) calendar days; the REGULATORY_BASIS deadline used by the cooperation-score variant."
      - name: validated_submission_count
        type: integer
        source: computed
        description: "count(DataSubmission where vendor_request_id == this.id AND status == VALIDATED)."
      - name: is_overdue
        type: boolean
        source: computed
        description: "true iff clock_now > due_at AND fulfillment_status != FULFILLED."
      - name: fulfillment_status
        type: enum
        source: system
        description: Production dimension; advances only on VALIDATED submissions.
        default: OPEN
        constraints: "one of {OPEN, PARTIAL, FULFILLED}"
      - name: escalation_status
        type: enum
        source: system
        description: Contract-enforcement dimension; evolves independently of fulfillment_status.
        default: NONE
        constraints: "one of {NONE, NOTICE_SENT, BREACH_DECLARED}"

  - name: DataSubmission
    parent: null
    common_fields: true
    fields:
      - name: vendor_request_id
        type: string
        source: input
        description: FK -> VendorDataRequest.id; request this submission answers (taken from the path).
      - name: classification_id
        type: string
        source: input
        description: FK -> BenefitClassification.id; classification the data describes; must belong to the request's plan_year_id.
      - name: submission_type
        type: enum
        source: input
        description: Kind of as-applied data produced.
        constraints: "one of {DENIAL_RATES, NETWORK_COMPOSITION, REIMBURSEMENT_BENCHMARK}"
      - name: mh_denials
        type: integer
        source: input
        description: MH/SUD adverse benefit determinations in the measurement period.
        default: 0
        constraints: ">= 0 and <= mh_adjudicated_claims"
      - name: mh_adjudicated_claims
        type: integer
        source: input
        description: MH/SUD claims adjudicated in the measurement period.
        default: 0
        constraints: ">= 0"
      - name: ms_denials
        type: integer
        source: input
        description: Medical/surgical adverse benefit determinations in the measurement period.
        default: 0
        constraints: ">= 0 and <= ms_adjudicated_claims"
      - name: ms_adjudicated_claims
        type: integer
        source: input
        description: Medical/surgical claims adjudicated in the measurement period.
        default: 0
        constraints: ">= 0"
      - name: mh_in_network_provider_pct
        type: number
        source: input
        description: Share of MH/SUD providers in the service area admitted to the network; required for NETWORK_COMPOSITION.
        constraints: "null or 0.0 <= value <= 1.0"
      - name: ms_in_network_provider_pct
        type: number
        source: input
        description: Share of medical/surgical providers in the service area admitted to the network; required for NETWORK_COMPOSITION.
        constraints: "null or 0.0 <= value <= 1.0"
      - name: benchmark_note
        type: string
        source: input
        description: Free-text reimbursement-benchmark reference; only meaningful for REIMBURSEMENT_BENCHMARK.
        constraints: "null or 1..200 chars"
      - name: mh_denial_rate
        type: number
        source: computed
        description: "round(mh_denials / mh_adjudicated_claims, 6) round_half_up; null unless submission_type == DENIAL_RATES and status == VALIDATED."
      - name: ms_denial_rate
        type: number
        source: computed
        description: "round(ms_denials / ms_adjudicated_claims, 6) round_half_up; null unless submission_type == DENIAL_RATES and status == VALIDATED."
      - name: disparity_ratio
        type: number
        source: computed
        description: Output of calculations.denial_rate_disparity_index (4 decimal places); null when status != VALIDATED or submission_type != DENIAL_RATES.
      - name: network_composition_gap
        type: number
        source: computed
        description: "round(ms_in_network_provider_pct - mh_in_network_provider_pct, 4) round_half_up; null unless submission_type == NETWORK_COMPOSITION and status == VALIDATED."
      - name: as_applied_flag
        type: boolean
        source: computed
        description: "true iff disparity_ratio is not null AND disparity_ratio >= DISPARITY_THRESHOLD (2.0)."
      - name: rejection_reason
        type: enum
        source: computed
        description: Why the automatic validation rejected the submission.
        default: NONE
        constraints: "one of {NONE, ZERO_ADJUDICATED_CLAIMS, ZERO_COMPARATOR_DENIALS, MISSING_NETWORK_PCT}"
      - name: status
        type: enum
        source: system
        description: Set by the automatic RECEIVED -> {VALIDATED, REJECTED} transition at creation; only VALIDATED rows feed calculations and fulfillment progress.
        default: RECEIVED
        constraints: "one of {RECEIVED, VALIDATED, REJECTED}"

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - name: nqtl_item_id
        type: string
        source: input
        description: FK -> NqtlItem.id; the NQTL in VIOLATION that this plan remedies.
      - name: remedy_type
        type: enum
        source: input
        description: Remedy chosen; selects the reprocessing rate constant.
        constraints: "one of {DESIGN_CHANGE, PROCESS_CHANGE, RETROSPECTIVE_CLAIMS_REPROCESSING}"
      - name: affected_claims_count
        type: integer
        source: input
        description: Number of participant claims within the remedy scope.
        constraints: ">= 0"
      - name: average_claim_cents
        type: integer
        source: input
        description: Average allowed amount per affected claim, in cents.
        constraints: ">= 0"
      - name: target_completion_date
        type: string
        source: input
        description: Committed completion date (YYYY-MM-DD).
      - name: reprocessing_liability_cents
        type: integer
        source: computed
        description: Output of calculations.remediation_liability_cents, rounded to whole cents at creation and then frozen.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who approved the plan; null until APPROVED.
      - name: status
        type: enum
        source: system
        description: Corrective-action lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, REJECTED, COMPLETED, ABANDONED}"

  - name: RegulatorRequest
    parent: null
    common_fields: true
    fields:
      - name: plan_year_id
        type: string
        source: input
        description: FK -> PlanYear.id; plan year whose comparative analyses are demanded.
      - name: requested_nqtl_types
        type: array
        source: input
        description: NQTL types the regulator demands analyses for.
        constraints: "non-empty array of NqtlItem.nqtl_type values, no duplicates"
      - name: request_reference
        type: string
        source: input
        description: Regulator's own docket reference for the request.
        constraints: "1..64 chars"
      - name: opened_at
        type: datetime
        source: system
        description: Logical-clock instant of request creation (ISO 8601 UTC, three fractional digits).
      - name: response_due_at
        type: datetime
        source: computed
        description: "opened_at + REGULATOR_RESPONSE_DAYS (30) calendar days, extended by REOPEN_EXTENSION_DAYS (14) on every RESPONDED -> INSUFFICIENT_RESPONSE adjudication."
      - name: requested_item_count
        type: integer
        source: computed
        description: "count(NqtlItem where plan_year_id == this.plan_year_id AND nqtl_type IN requested_nqtl_types), evaluated at each respond call."
      - name: covered_item_count
        type: integer
        source: computed
        description: Subset of requested_item_count having at least one ComparativeAnalysis in status CERTIFIED, evaluated at each respond call.
      - name: completeness_score
        type: number
        source: computed
        description: Output of calculations.regulator_response_completeness_score (2 decimal places); null before the first respond call.
      - name: response_sufficient
        type: boolean
        source: computed
        description: "true iff completeness_score >= RESPONSE_SUFFICIENCY_THRESHOLD (85.0); null before the first respond call."
      - name: regulator_round
        type: integer
        source: system
        description: Number of INSUFFICIENT adjudications so far.
        default: 0
      - name: status
        type: enum
        source: system
        description: Regulator-request lifecycle state.
        default: OPEN
        constraints: "one of {OPEN, RESPONDED, INSUFFICIENT_RESPONSE, CLOSED}"

  - name: ParticipantNotice
    parent: null
    common_fields: false
    fields:
      - name: nqtl_item_id
        type: string
        source: input
        description: FK -> NqtlItem.id; NQTL whose violation or correction the notice discloses.
      - name: notice_type
        type: enum
        source: system
        description: Which cascade produced the notice.
        constraints: "one of {VIOLATION_DISCLOSURE, CORRECTION_COMPLETED}"
      - name: recipient_count
        type: integer
        source: system
        description: Copied from the plan year's covered_participant_count at issuance.
      - name: disclosure_summary
        type: string
        source: system
        description: "System-composed line: '<nqtl_type> in <benefit_category>/<network_tier>: <notice_type>'."
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the notice was generated (ISO 8601 UTC, three fractional digits).
      - name: source
        type: enum
        source: system
        description: Cascade that generated the notice; append-only, never updated.
        constraints: "one of {DETERMINATION_CASCADE, CAP_CLOSURE_CASCADE}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PlanYear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REGULATOR_REVIEW
        trigger: "POST /parity/regulator-requests (system cascade from RegulatorRequest creation)"
        actor: system
        preconditions:
          - "PlanYear.status == OPEN"
        side_effects:
          - "PlanYear.updated_at refreshed; increments PlanYear.version by 1"
          - "no further BenefitClassification or TreatmentLimitation rows may be created for this plan year (see validations priority 10)"
        note: "A regulator demand freezes the classification/limitation surface so the produced analyses describe a fixed plan design."
      - from: OPEN
        to: REMEDIATION
        trigger: "system: recomputation of calculations.plan_year_compliance_posture yields VIOLATION"
        actor: system
        preconditions:
          - "PlanYear.status == OPEN"
          - "compliance_posture recomputed to VIOLATION (open_violation_count >= 1 OR failing_parity_test_count >= 1)"
        side_effects:
          - "PlanYear.compliance_posture set to VIOLATION"
          - "PlanYear.updated_at refreshed; increments PlanYear.version by 1"
      - from: UNDER_REGULATOR_REVIEW
        to: REMEDIATION
        trigger: "system: recomputation of calculations.plan_year_compliance_posture yields VIOLATION"
        actor: system
        preconditions:
          - "PlanYear.status == UNDER_REGULATOR_REVIEW"
          - "compliance_posture recomputed to VIOLATION"
        side_effects:
          - "PlanYear.compliance_posture set to VIOLATION"
          - "PlanYear.updated_at refreshed; increments PlanYear.version by 1"
      - from: REMEDIATION
        to: OPEN
        trigger: "system: recomputation of calculations.plan_year_compliance_posture yields a value other than VIOLATION (e.g. the last VIOLATION NqtlItem reaches REMEDIATED)"
        actor: system
        preconditions:
          - "PlanYear.status == REMEDIATION"
          - "open_violation_count == 0 AND failing_parity_test_count == 0"
        side_effects:
          - "PlanYear.compliance_posture set to COMPLIANT or AT_RISK per the posture calculation"
          - "PlanYear.updated_at refreshed; increments PlanYear.version by 1"
        note: "Closes the REMEDIATION loop: OPEN -> REMEDIATION -> OPEN is reachable more than once within one plan year."
      - from: UNDER_REGULATOR_REVIEW
        to: CLOSED
        trigger: "POST /parity/regulator-requests/{id}/adjudicate with outcome == ACCEPTED (system cascade)"
        actor: system
        preconditions:
          - "PlanYear.status == UNDER_REGULATOR_REVIEW"
          - "PlanYear.compliance_posture == COMPLIANT at the moment of adjudication"
        side_effects:
          - "PlanYear.updated_at refreshed; increments PlanYear.version by 1"
          - "every subsequent child mutation on this plan year is rejected with ERR_PLAN_YEAR_NOT_OPEN"

  - entity: TreatmentLimitation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /parity/classifications/{id}/treatment-limitations creating a row with the same (classification_id, limitation_type, benefit_side, level_value)"
        actor: system
        preconditions:
          - "an ACTIVE TreatmentLimitation exists with identical (classification_id, limitation_type, benefit_side, level_value)"
        side_effects:
          - "prior row status set to SUPERSEDED and excluded from every calculation input_set"
          - "prior row updated_at refreshed; increments that row's version by 1"

  - entity: ParityTest
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: SUPERSEDED
        trigger: "POST /parity/classifications/{id}/parity-tests re-running the same (classification_id, limitation_type, basis)"
        actor: system
        preconditions:
          - "a COMPUTED ParityTest exists for the same (classification_id, limitation_type, basis)"
        side_effects:
          - "prior row status set to SUPERSEDED; increments that row's version by 1"
          - "PlanYear.failing_parity_test_count recomputed (a superseded FAIL stops counting)"
          - "PlanYear.compliance_posture recomputed; PlanYear.version incremented when posture or count changes"

  - entity: DataSubmission
    initial_state: RECEIVED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /parity/vendor-requests/{id}/data-submissions (automatic validation inside the same request)"
        actor: system
        preconditions:
          - "submission_type == DENIAL_RATES AND mh_adjudicated_claims >= 1 AND ms_adjudicated_claims >= 1 AND ms_denials >= 1"
          - "OR submission_type == NETWORK_COMPOSITION AND both mh_in_network_provider_pct and ms_in_network_provider_pct are non-null"
          - "OR submission_type == REIMBURSEMENT_BENCHMARK"
        side_effects:
          - "computes mh_denial_rate, ms_denial_rate, disparity_ratio, as_applied_flag (DENIAL_RATES) or network_composition_gap (NETWORK_COMPOSITION)"
          - "VendorDataRequest.validated_submission_count incremented; fulfillment_status advanced to PARTIAL or FULFILLED"
          - "recomputes calculations.nqtl_stringency_in_operation_index for every NqtlItem whose classification_id == this.classification_id; increments each such NqtlItem.version by 1"
          - "PlanYear.compliance_posture recomputed"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /parity/vendor-requests/{id}/data-submissions (automatic validation inside the same request)"
        actor: system
        preconditions:
          - "submission_type == DENIAL_RATES AND (mh_adjudicated_claims == 0 OR ms_adjudicated_claims == 0 OR ms_denials == 0)"
          - "OR submission_type == NETWORK_COMPOSITION AND either provider-percentage field is null"
        side_effects:
          - "rejection_reason set to ZERO_ADJUDICATED_CLAIMS, ZERO_COMPARATOR_DENIALS or MISSING_NETWORK_PCT"
          - "all rate/ratio/gap fields left null; VendorDataRequest.fulfillment_status and validated_submission_count unchanged"
        note: "A rejected submission still persists (the TPA's production attempt is on the record) but never advances fulfillment."

  - entity: NqtlItem
    initial_state: INVENTORIED
    terminal_states: [REMEDIATED]
    transitions:
      - from: INVENTORIED
        to: ANALYSIS_DRAFTED
        trigger: "POST /parity/comparative-analyses (system cascade from ComparativeAnalysis creation)"
        actor: system
        preconditions:
          - "NqtlItem.status == INVENTORIED"
          - "payload expected_nqtl_item_version equals NqtlItem.version"
        side_effects:
          - "increments NqtlItem.version by 1"
          - "recomputes calculations.nqtl_stringency_in_operation_index"
          - "PlanYear.compliance_posture recomputed (an INVENTORIED item leaving the inventory can clear AT_RISK)"
      - from: ANALYSIS_DRAFTED
        to: ANALYSIS_SUBMITTED
        trigger: "POST /parity/comparative-analyses/{id}/submit (system cascade)"
        actor: system
        preconditions:
          - "NqtlItem.status == ANALYSIS_DRAFTED"
        side_effects:
          - "increments NqtlItem.version by 1"
          - "recomputes calculations.nqtl_stringency_in_operation_index and stringency_flag"
      - from: ANALYSIS_SUBMITTED
        to: ANALYSIS_DRAFTED
        trigger: "POST /parity/comparative-analyses/{id}/review with outcome == INSUFFICIENT (system cascade)"
        actor: system
        preconditions:
          - "NqtlItem.status == ANALYSIS_SUBMITTED"
        side_effects:
          - "increments NqtlItem.version by 1"
        note: "Revert leg: the item drops back so the author can reopen and resubmit."
      - from: ANALYSIS_SUBMITTED
        to: COMPLIANT
        trigger: "POST /parity/nqtl-items/{id}/determinations with outcome == COMPLIANT"
        actor: ComplianceOfficer
        preconditions:
          - "NqtlItem.status == ANALYSIS_SUBMITTED"
          - "the latest ComparativeAnalysis for this item (ranked by created_at DESC) has status == CERTIFIED"
          - "stringency_in_operation_index recomputed immediately before the check is < STRINGENCY_VIOLATION_THRESHOLD (5.0)"
          - "payload expected_plan_year_version equals PlanYear.version"
        side_effects:
          - "determination_recorded_by_user_id set to X-User-ID; increments NqtlItem.version by 1"
          - "PlanYear.compliance_posture recomputed; increments PlanYear.version by 1"
      - from: ANALYSIS_SUBMITTED
        to: VIOLATION
        trigger: "POST /parity/nqtl-items/{id}/determinations with outcome == VIOLATION"
        actor: ComplianceOfficer
        preconditions:
          - "NqtlItem.status == ANALYSIS_SUBMITTED"
          - "stringency_in_operation_index recomputed immediately before the check is >= STRINGENCY_VIOLATION_THRESHOLD (5.0)"
          - "payload expected_plan_year_version equals PlanYear.version"
        side_effects:
          - "determination_recorded_by_user_id set to X-User-ID; increments NqtlItem.version by 1"
          - "cascade hop 2 — creates one ParticipantNotice (notice_type VIOLATION_DISCLOSURE, source DETERMINATION_CASCADE, recipient_count = PlanYear.covered_participant_count, issued_at = clock_now)"
          - "cascade hop 3 — that notice raises PlanYear.notified_violation_count, and the item's new status raises PlanYear.open_violation_count; PlanYear.compliance_posture recomputed to VIOLATION"
          - "cascade hop 4 — the VIOLATION posture drives PlanYear OPEN|UNDER_REGULATOR_REVIEW -> REMEDIATION; increments PlanYear.version by 1"
      - from: COMPLIANT
        to: VIOLATION
        trigger: "POST /parity/nqtl-items/{id}/determinations with outcome == VIOLATION (re-determination on as-applied evidence)"
        actor: ComplianceOfficer
        preconditions:
          - "NqtlItem.status == COMPLIANT"
          - "stringency_in_operation_index recomputed immediately before the check is >= STRINGENCY_VIOLATION_THRESHOLD (5.0)"
          - "payload expected_plan_year_version equals PlanYear.version"
        side_effects:
          - "same cascade hops 2-4 as the ANALYSIS_SUBMITTED -> VIOLATION transition"
      - from: VIOLATION
        to: REMEDIATED
        trigger: "POST /parity/corrective-action-plans/{id}/closure with outcome == COMPLETED (system cascade)"
        actor: system
        preconditions:
          - "NqtlItem.status == VIOLATION"
          - "the closing CorrectiveActionPlan.nqtl_item_id == this.id AND its status == APPROVED"
        side_effects:
          - "increments NqtlItem.version by 1"
          - "creates one ParticipantNotice (notice_type CORRECTION_COMPLETED, source CAP_CLOSURE_CASCADE)"
          - "PlanYear.open_violation_count decremented, remediation_liability_cents reduced by the plan's reprocessing_liability_cents, compliance_posture recomputed; PlanYear REMEDIATION -> OPEN when no violation remains"

  - entity: ComparativeAnalysis
    initial_state: DRAFT
    terminal_states: [CERTIFIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /parity/comparative-analyses/{id}/submit"
        actor: PlanSponsor | Administrator
        preconditions:
          - "ComparativeAnalysis.status == DRAFT"
          - "factor_count >= MIN_FACTORS (2) AND evidentiary_standard_count >= MIN_EVIDENTIARY_STANDARDS (1)"
          - "the owning NqtlItem.status == ANALYSIS_DRAFTED"
          - "PlanYear.status != CLOSED"
        side_effects:
          - "NqtlItem ANALYSIS_DRAFTED -> ANALYSIS_SUBMITTED"
          - "recomputes calculations.nqtl_stringency_in_operation_index on the owning NqtlItem"
          - "increments ComparativeAnalysis.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /parity/comparative-analyses/{id}/review with outcome == CERTIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "ComparativeAnalysis.status == SUBMITTED"
          - "X-User-ID != ComparativeAnalysis.authored_by_user_id (segregation of duties)"
          - "at least one DataSubmission with status == VALIDATED AND submission_type == DENIAL_RATES exists for the owning NqtlItem.classification_id"
        side_effects:
          - "certified_by_user_id set to X-User-ID; increments ComparativeAnalysis.version by 1"
          - "RegulatorRequest.covered_item_count for this plan year will include the owning item at the next respond call"
        note: "Branch A of the fork on SUBMITTED."
      - from: SUBMITTED
        to: INSUFFICIENT
        trigger: "POST /parity/comparative-analyses/{id}/review with outcome == INSUFFICIENT"
        actor: ComplianceOfficer
        preconditions:
          - "ComparativeAnalysis.status == SUBMITTED"
          - "X-User-ID != ComparativeAnalysis.authored_by_user_id (segregation of duties)"
        side_effects:
          - "NqtlItem ANALYSIS_SUBMITTED -> ANALYSIS_DRAFTED"
          - "increments ComparativeAnalysis.version by 1"
        note: "Branch B of the fork on SUBMITTED; unlike branch A it does not require in-operation data."
      - from: INSUFFICIENT
        to: DRAFT
        trigger: "POST /parity/comparative-analyses/{id}/reopen"
        actor: PlanSponsor | Administrator
        preconditions:
          - "ComparativeAnalysis.status == INSUFFICIENT"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "revision_round incremented by 1; increments ComparativeAnalysis.version by 1"
        note: "Closes the revision cycle DRAFT -> SUBMITTED -> INSUFFICIENT -> DRAFT; the fourth reopen is rejected with ERR_REVISION_LIMIT_REACHED."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /parity/comparative-analyses with supersedes_analysis_id pointing at this row (system cascade)"
        actor: system
        preconditions:
          - "ComparativeAnalysis.status IN {DRAFT, SUBMITTED, INSUFFICIENT}"
          - "the new analysis has the same nqtl_item_id"
        side_effects:
          - "increments the superseded row's version by 1; it is excluded from the latest-analysis selector"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /parity/comparative-analyses with supersedes_analysis_id pointing at this row (system cascade)"
        actor: system
        preconditions:
          - "ComparativeAnalysis.status IN {DRAFT, SUBMITTED, INSUFFICIENT}"
          - "the new analysis has the same nqtl_item_id"
        side_effects:
          - "increments the superseded row's version by 1"
          - "the owning NqtlItem is reset to ANALYSIS_DRAFTED by the creation cascade"
      - from: INSUFFICIENT
        to: WITHDRAWN
        trigger: "POST /parity/comparative-analyses with supersedes_analysis_id pointing at this row (system cascade)"
        actor: system
        preconditions:
          - "ComparativeAnalysis.status IN {DRAFT, SUBMITTED, INSUFFICIENT}"
          - "the new analysis has the same nqtl_item_id"
        side_effects:
          - "increments the superseded row's version by 1"

  - entity: VendorDataRequest
    initial_state: "OPEN x NONE (fulfillment_status x escalation_status)"
    terminal_states: ["FULFILLED x BREACH_DECLARED"]
    transitions:
      - from: "fulfillment_status: OPEN"
        to: "fulfillment_status: PARTIAL"
        trigger: "POST /parity/vendor-requests/{id}/data-submissions producing a VALIDATED row while validated_submission_count < requested_item_count"
        actor: Administrator
        preconditions:
          - "fulfillment_status == OPEN"
          - "escalation_status != BREACH_DECLARED"
          - "the created DataSubmission reached status VALIDATED"
        side_effects:
          - "validated_submission_count incremented; increments VendorDataRequest.version by 1"
          - "Administrator.late_request_count / regulator_reportable_late_count recomputed (still counted while OPEN or PARTIAL)"
        note: "escalation_status is untouched by this transition — the two dimensions advance independently."
      - from: "fulfillment_status: OPEN | PARTIAL"
        to: "fulfillment_status: FULFILLED"
        trigger: "POST /parity/vendor-requests/{id}/data-submissions producing the VALIDATED row that reaches requested_item_count"
        actor: Administrator
        preconditions:
          - "fulfillment_status IN {OPEN, PARTIAL}"
          - "escalation_status != BREACH_DECLARED"
          - "validated_submission_count + 1 == requested_item_count"
        side_effects:
          - "Administrator.outstanding_request_count decremented by exactly 1 (compensating leg of the obligation invariant)"
          - "Administrator.late_request_count, regulator_reportable_late_count, cooperation_score, regulatory_basis_cooperation_score, cooperation_status recomputed"
          - "PlanYear.compliance_posture recomputed; increments VendorDataRequest.version by 1"
      - from: "escalation_status: NONE"
        to: "escalation_status: NOTICE_SENT"
        trigger: "POST /parity/vendor-requests/{id}/escalate"
        actor: PlanSponsor
        preconditions:
          - "escalation_status == NONE"
          - "fulfillment_status IN {OPEN, PARTIAL}"
          - "clock_now > due_at (strictly greater; equality is not yet overdue)"
        side_effects:
          - "increments VendorDataRequest.version by 1"
        note: "fulfillment_status is untouched; a NOTICE_SENT request can still be fulfilled normally."
      - from: "escalation_status: NOTICE_SENT"
        to: "escalation_status: BREACH_DECLARED"
        trigger: "POST /parity/vendor-requests/{id}/escalate"
        actor: PlanSponsor
        preconditions:
          - "escalation_status == NOTICE_SENT"
          - "fulfillment_status IN {OPEN, PARTIAL}"
          - "clock_now > due_at + BREACH_GRACE_DAYS (7) calendar days"
        side_effects:
          - "cascade hop 1 -> 2: Administrator.breach_count incremented, cooperation_score / regulatory_basis_cooperation_score recomputed, cooperation_status re-derived; increments Administrator.version by 1"
          - "cascade hop 2 -> 3: because cooperation_status is now in {DELINQUENT, ESCALATED}, calculations.plan_year_compliance_posture is recomputed for every PlanYear whose administrator_id == this administrator and yields AT_RISK; increments each such PlanYear.version by 1"
          - "no further DataSubmission is accepted for this request (ERR_PRODUCTION_WINDOW_CLOSED)"

  - entity: CorrectiveActionPlan
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED, ABANDONED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /parity/corrective-action-plans/{id}/decision with outcome == APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.status == DRAFT"
          - "the owning NqtlItem.status == VIOLATION"
          - "X-User-ID != NqtlItem.determination_recorded_by_user_id (segregation of duties)"
          - "PlanYear.remediation_liability_cents + this.reprocessing_liability_cents <= PlanYear.remediation_liability_cap_cents"
        side_effects:
          - "approved_by_user_id set to X-User-ID; increments CorrectiveActionPlan.version by 1"
          - "PlanYear.remediation_liability_cents increased by exactly this.reprocessing_liability_cents (forward leg of the money invariant); increments PlanYear.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /parity/corrective-action-plans/{id}/decision with outcome == REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.status == DRAFT"
          - "the owning NqtlItem.status == VIOLATION"
        side_effects:
          - "increments CorrectiveActionPlan.version by 1; PlanYear.remediation_liability_cents unchanged"
        note: "Second branch of the DRAFT fork; the liability ledger is never touched on this leg."
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /parity/corrective-action-plans/{id}/closure with outcome == COMPLETED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.status == APPROVED"
          - "the owning NqtlItem.status == VIOLATION"
        side_effects:
          - "NqtlItem VIOLATION -> REMEDIATED with its own cascade (participant notice, open_violation_count, posture, PlanYear REMEDIATION -> OPEN)"
          - "PlanYear.remediation_liability_cents reduced by exactly this.reprocessing_liability_cents"
          - "increments CorrectiveActionPlan.version by 1"
      - from: APPROVED
        to: ABANDONED
        trigger: "POST /parity/corrective-action-plans/{id}/closure with outcome == ABANDONED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.status == APPROVED"
        side_effects:
          - "PlanYear.remediation_liability_cents reduced by exactly this.reprocessing_liability_cents (compensating leg of the money invariant — zero drift)"
          - "the owning NqtlItem keeps status VIOLATION; no ParticipantNotice is created"
          - "increments CorrectiveActionPlan.version by 1; increments PlanYear.version by 1"

  - entity: RegulatorRequest
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /parity/regulator-requests/{id}/respond"
        actor: PlanSponsor
        preconditions:
          - "RegulatorRequest.status == OPEN"
          - "clock_now <= response_due_at"
          - "requested_item_count >= 1"
        side_effects:
          - "requested_item_count, covered_item_count, completeness_score, response_sufficient recomputed by calculations.regulator_response_completeness_score"
          - "increments RegulatorRequest.version by 1"
      - from: INSUFFICIENT_RESPONSE
        to: RESPONDED
        trigger: "POST /parity/regulator-requests/{id}/respond"
        actor: PlanSponsor
        preconditions:
          - "RegulatorRequest.status == INSUFFICIENT_RESPONSE"
          - "clock_now <= response_due_at (already extended by REOPEN_EXTENSION_DAYS)"
          - "requested_item_count >= 1"
        side_effects:
          - "completeness_score and response_sufficient recomputed against the current CERTIFIED analyses"
          - "increments RegulatorRequest.version by 1"
        note: "Closes the regulator cycle RESPONDED -> INSUFFICIENT_RESPONSE -> RESPONDED."
      - from: RESPONDED
        to: INSUFFICIENT_RESPONSE
        trigger: "POST /parity/regulator-requests/{id}/adjudicate with outcome == INSUFFICIENT"
        actor: Regulator
        preconditions:
          - "RegulatorRequest.status == RESPONDED"
        side_effects:
          - "regulator_round incremented by 1; response_due_at extended by REOPEN_EXTENSION_DAYS (14) calendar days"
          - "increments RegulatorRequest.version by 1"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /parity/regulator-requests/{id}/adjudicate with outcome == ACCEPTED"
        actor: Regulator
        preconditions:
          - "RegulatorRequest.status == RESPONDED"
        side_effects:
          - "increments RegulatorRequest.version by 1"
          - "when PlanYear.compliance_posture == COMPLIANT the plan year moves UNDER_REGULATOR_REVIEW -> CLOSED; otherwise PlanYear.status is left unchanged"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: determination-stale-plan-year
    parent_entity: PlanYear
    write_endpoint: "POST /parity/nqtl-items/{id}/determinations"
    occ_field: "expected_plan_year_version"
    description: |
      Recording a determination against a plan year whose version has advanced since
      the officer last read it is rejected. A determination is written on the basis of
      the plan year's posture, open_violation_count and failing_parity_test_count; any
      earlier accepted determination, superseding parity test, validated data submission
      or corrective-action decision has already rewritten those fields, so an officer
      holding the older version is deciding from a superseded record and must re-read.
    error_id: ERR_STALE_PLAN_YEAR_VERSION
    http_status: 412
  - rule_id: analysis-create-stale-nqtl-item
    parent_entity: NqtlItem
    write_endpoint: "POST /parity/comparative-analyses"
    occ_field: "expected_nqtl_item_version"
    description: |
      Creating a ComparativeAnalysis against an NqtlItem whose version has advanced
      since the author last read it is rejected. This captures the create-with-supersede
      case: a previously created analysis (which legitimately supersedes the prior one
      via supersedes_analysis_id) or a validated as-applied data submission has already
      moved the item's status and stringency index, so the author's view of what the
      analysis must document is stale.
    error_id: ERR_STALE_NQTL_ITEM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: qtl_substantially_all_ratio
    trigger: "POST /parity/classifications/{id}/parity-tests"
    algorithm_type: threshold
    output_fields: ["ParityTest.total_ms_payments_cents", "ParityTest.subject_payments_cents", "ParityTest.substantially_all_ratio", "ParityTest.substantially_all_met"]
    input_set: |
      All TreatmentLimitation rows where classification_id == the path classification, status == ACTIVE,
      benefit_side == MEDICAL_SURGICAL and limitation_type == the requested limitation_type.
      SUPERSEDED rows are excluded. MENTAL_HEALTH_SUD rows never enter either sum.
      The denominator uses every row in that set; the numerator uses only rows with level_value > 0
      (a level_value of 0 records the slice of medical/surgical benefits on which the requirement is
      not imposed at all).
    variants:
      PLAN_PAYMENTS: "weight_field = projected_plan_payments_cents"
      CLAIMS_COUNT: "weight_field = projected_claims_count"
    formula: |
      total_weight   = sum(weight_field for every row in the input set)
      subject_weight = sum(weight_field for rows with level_value > 0)
      substantially_all_met = (subject_weight * 3 >= total_weight * 2)      # integer cross-multiplication, no division
      substantially_all_ratio = round(Decimal(subject_weight) / Decimal(total_weight), 6)   # display only
      When total_weight == 0 the endpoint is rejected with ERR_EMPTY_TEST_POPULATION; the ratio is
      never computed from a zero denominator.
      The threshold decision MUST use the cross-multiplication, never the rounded ratio: a ratio that
      rounds up to 0.666667 can still fail the two-thirds standard.
      total_ms_payments_cents and subject_payments_cents always report the PLAN_PAYMENTS sums so the
      two variants of one classification remain comparable on the record.
    constants:
      SUBSTANTIALLY_ALL_NUMERATOR: 2
      SUBSTANTIALLY_ALL_DENOMINATOR: 3
    precision: "substantially_all_ratio: 6 decimal places, ROUND_HALF_UP. Weight sums are exact integers."
    worked_example: |
      MEDICAL_SURGICAL COPAY rows: level 30 -> 5000000 cents / 400 claims; level 20 -> 3000000 / 400;
      level 10 -> 1000000 / 200; level 0 -> 1500000 / 100.
      PLAN_PAYMENTS: subject 9000000, total 10500000; 27000000 >= 21000000 -> met = true; ratio 0.857143.
      CLAIMS_COUNT:  subject 1000, total 1100; 3000 >= 2200 -> met = true; ratio 0.909091.
      Boundary: subject 2000000 / total 3000000 -> 6000000 >= 6000000 -> met = true, ratio 0.666667.
      Boundary: subject 2000000 / total 3000001 -> 6000000 >= 6000002 -> met = false, ratio 0.666666.

  - name: qtl_predominant_level
    trigger: "POST /parity/classifications/{id}/parity-tests"
    algorithm_type: waterfall_allocation
    output_fields: ["ParityTest.predominant_level"]
    input_set: |
      The same ACTIVE MEDICAL_SURGICAL rows of the requested limitation_type, restricted to
      level_value > 0 (the benefits actually subject to the limitation). Evaluated only when
      substantially_all_met is true; otherwise predominant_level is null and the calculation is skipped.
    variants:
      PLAN_PAYMENTS: "weight_field = projected_plan_payments_cents"
      CLAIMS_COUNT: "weight_field = projected_claims_count"
    formula: |
      denominator = sum(weight_field over the input set)              # the benefits subject to the limitation
      level_weight[L] = sum(weight_field over rows with level_value == L)
      Step 1 (single-level branch): if any level L satisfies level_weight[L] * 2 > denominator, then
        predominant_level = that L. Strictly greater than one half; a level at exactly one half does
        not qualify. At most one level can satisfy this, so no ordering is needed.
      Step 2 (combination branch): otherwise walk the distinct levels in level_value DESC order
        (most restrictive first; a higher level_value is the more restrictive requirement), keeping a
        running cumulative weight, and stop at the first level where cumulative * 2 > denominator.
        predominant_level = the level_value of that last-added level — the least restrictive level
        inside the combination.
      Ordering is pinned: DESC by level_value, and for two rows carrying the same level_value the rows
      are merged into one level before the walk (so created_at never affects the result). Walking ASC
      would return a different level and is forbidden.
    constants:
      PREDOMINANT_NUMERATOR: 1
      PREDOMINANT_DENOMINATOR: 2
    precision: "predominant_level is reported exactly as the stored level_value; no rounding."
    worked_example: |
      Same rows as qtl_substantially_all_ratio.
      PLAN_PAYMENTS: denominator 9000000; level 30 weight 5000000 -> 10000000 > 9000000, single-level
        branch fires -> predominant_level = 30.
      CLAIMS_COUNT: denominator 1000; no level exceeds 500 (400 / 400 / 200), so the combination branch
        runs: 30 -> cumulative 400 (800 > 1000 false); 20 -> cumulative 800 (1600 > 1000 true) ->
        predominant_level = 20.
      The two variants therefore take different branches of the same algorithm and return different levels.

  - name: mh_level_under_test
    trigger: "POST /parity/classifications/{id}/parity-tests"
    algorithm_type: chronological
    output_fields: ["ParityTest.mh_level_value", "ParityTest.result"]
    input_set: |
      TreatmentLimitation rows where classification_id == the path classification, status == ACTIVE,
      benefit_side == MENTAL_HEALTH_SUD, limitation_type == the requested limitation_type and
      level_value > 0. SUPERSEDED rows are excluded.
    formula: |
      Rank the input set by level_value DESC (the most restrictive requirement actually imposed on
      MH/SUD benefits), then created_at ASC as the deterministic fallback tie-break, then take the
      first row. mh_level_value = that row's level_value, or null when the set is empty.
      result is then decided in this fixed order:
        1. substantially_all_met == false            -> NOT_APPLICABLE   (the limitation may not be
                                                        applied to MH/SUD benefits at all, and no
                                                        predominant level exists to compare against)
        2. mh_level_value is null                    -> NOT_APPLICABLE   (nothing imposed on MH/SUD)
        3. mh_level_value > predominant_level        -> FAIL
        4. otherwise                                 -> PASS
      advisory_only = (basis == CLAIMS_COUNT); only a FAIL on basis PLAN_PAYMENTS increments
      PlanYear.failing_parity_test_count.
    constants: {}
    precision: "No rounding; level values are compared as exact decimals."
    worked_example: |
      One ACTIVE MENTAL_HEALTH_SUD COPAY row at level 25.
      PLAN_PAYMENTS test: predominant 30, 25 > 30 false -> PASS.
      CLAIMS_COUNT test:  predominant 20, 25 > 20 true  -> FAIL, but advisory_only is true so
      PlanYear.failing_parity_test_count stays 0 and the posture is untouched.

  - name: denial_rate_disparity_index
    trigger: "POST /parity/vendor-requests/{id}/data-submissions with submission_type == DENIAL_RATES that passes automatic validation"
    algorithm_type: threshold
    output_fields: ["DataSubmission.mh_denial_rate", "DataSubmission.ms_denial_rate", "DataSubmission.disparity_ratio", "DataSubmission.as_applied_flag"]
    input_set: |
      The four integer counters on the single DataSubmission being created
      (mh_denials, mh_adjudicated_claims, ms_denials, ms_adjudicated_claims).
      No other submission contributes; each submission is scored on its own numbers.
    formula: |
      mh_raw = Decimal(mh_denials) / Decimal(mh_adjudicated_claims)
      ms_raw = Decimal(ms_denials) / Decimal(ms_adjudicated_claims)
      mh_denial_rate = round(mh_raw, 6)      # reported for the record only
      ms_denial_rate = round(ms_raw, 6)      # reported for the record only
      disparity_ratio = round(mh_raw / ms_raw, 4)
      as_applied_flag = (disparity_ratio >= DISPARITY_THRESHOLD)
      Rounding order is pinned: the ratio is taken from the two UNROUNDED quotients and rounded exactly
      once, at the end, to 4 places. Dividing the two already-6-place-rounded rates is forbidden and
      produces a different fourth decimal.
      Division by zero can never occur: a submission with a zero denominator (or ms_denials == 0) is
      REJECTED by the RECEIVED -> REJECTED transition before this calculation runs.
    constants:
      DISPARITY_THRESHOLD: 2.0
    precision: "mh_denial_rate / ms_denial_rate: 6 decimal places, ROUND_HALF_UP. disparity_ratio: 4 decimal places, ROUND_HALF_UP."
    worked_example: |
      mh 263/3491, ms 71/1913: mh_denial_rate 0.075337, ms_denial_rate 0.037114.
      Pinned order: round((263/3491) / (71/1913), 4) = 2.0298 -> as_applied_flag true.
      Forbidden order: round(0.075337 / 0.037114, 4) = 2.0299.
      mh 137/1919, ms 71/1913 -> 1.9235 -> as_applied_flag false (forbidden order: 1.9236).
      mh 200/1000, ms 100/1000 -> exactly 2.0000 -> as_applied_flag true (at the threshold, not above it).
      mh 1999/10000, ms 1000/10000 -> 1.9990 -> as_applied_flag false.

  - name: nqtl_stringency_in_operation_index
    trigger: |
      Recomputed on: POST /parity/comparative-analyses (creation), .../submit, .../review,
      POST /parity/vendor-requests/{id}/data-submissions that yields a VALIDATED row for the item's
      classification, and immediately before each POST /parity/nqtl-items/{id}/determinations check.
    algorithm_type: weighted_scoring
    output_fields: ["NqtlItem.stringency_in_operation_index", "NqtlItem.stringency_flag"]
    input_set: |
      D_evidence: DataSubmission rows with status == VALIDATED, submission_type == DENIAL_RATES and
        classification_id == NqtlItem.classification_id. D = max(disparity_ratio) over that set, or
        Decimal("0") when the set is empty. REJECTED and RECEIVED rows are excluded.
      N_evidence: DataSubmission rows with status == VALIDATED, submission_type == NETWORK_COMPOSITION
        and the same classification_id. N = max(network_composition_gap) over that set, or
        Decimal("0") when empty.
      Documentation credit: the single most recent ComparativeAnalysis for this nqtl_item_id whose
        status != WITHDRAWN, ranked created_at DESC then version DESC; F = its factor_count and
        E = its evidentiary_standard_count, or F = E = 0 when no such analysis exists.
    formula: |
      (W_D, W_N) = UM_WEIGHTS            when nqtl_type IN {PRIOR_AUTHORIZATION,
                                              MEDICAL_NECESSITY_CRITERIA, CONCURRENT_REVIEW, STEP_THERAPY}
                 = NETWORK_WEIGHTS       when nqtl_type IN {NETWORK_ADMISSION, REIMBURSEMENT_RATE}
      base = W_D * max(0, D - 1) + W_N * max(0, N)
      if applied_to == MENTAL_HEALTH_SUD_ONLY: base = base * ASYMMETRY_MULTIPLIER
      doc_credit = min(DOC_CREDIT_CAP, FACTOR_CREDIT * F + EVIDENCE_CREDIT * E)
      index = round(clamp(base * 10 - doc_credit * 10, 0, 10), 2)
      stringency_flag = (index >= STRINGENCY_VIOLATION_THRESHOLD)
      Evaluation order is pinned and every step matters:
        (1) weight and sum the two evidence terms, (2) apply the asymmetry multiplier to the summed
        base and not to the individual terms, (3) cap doc_credit BEFORE scaling it by 10,
        (4) subtract the credit, (5) clamp into [0, 10], (6) round once to 2 places.
      Clamping before subtracting the credit, or subtracting an uncapped credit, both yield a
      different index.
    constants:
      UM_WEIGHTS: { W_D: 0.6, W_N: 0.4 }
      NETWORK_WEIGHTS: { W_D: 0.3, W_N: 0.7 }
      ASYMMETRY_MULTIPLIER: 1.5
      FACTOR_CREDIT: 0.05
      EVIDENCE_CREDIT: 0.03
      DOC_CREDIT_CAP: 0.25
      STRINGENCY_VIOLATION_THRESHOLD: 5.0
    precision: "index: 2 decimal places, ROUND_HALF_UP, clamped to [0.00, 10.00]. Intermediate terms keep full Decimal precision."
    worked_example: |
      PRIOR_AUTHORIZATION (UM weights), applied_to MENTAL_HEALTH_SUD_ONLY, D = 2.0298, N = 0.2800,
      latest analysis F = 4, E = 5:
        base = 0.6 * 1.0298 + 0.4 * 0.2800 = 0.61788 + 0.112 = 0.72988
        base * 1.5 = 1.09482 -> * 10 = 10.9482
        doc_credit = min(0.25, 0.05*4 + 0.03*5 = 0.35) = 0.25 -> * 10 = 2.5
        index = round(clamp(10.9482 - 2.5, 0, 10), 2) = 8.45 -> stringency_flag true
        Clamp-first order would give 10.00 - 2.5 = 7.50; an uncapped credit would give 7.45.
      NETWORK_ADMISSION (network weights), applied_to BOTH, D = 1.9235, N = 0 (no network submission),
      F = 2, E = 1:
        base = 0.3 * 0.9235 = 0.27705 -> * 10 = 2.7705; doc_credit = 0.13 -> 1.3
        index = 1.47 -> stringency_flag false.

  - name: administrator_cooperation_score
    trigger: |
      Recomputed on: POST /parity/vendor-requests (issuance), POST /parity/vendor-requests/{id}/escalate,
      the VALIDATED submission that fulfils a request, and POST /_clock/set_current_utc (which can turn
      an on-time request late without any vendor action).
    algorithm_type: weighted_scoring
    output_fields: ["Administrator.cooperation_score", "Administrator.regulatory_basis_cooperation_score", "Administrator.cooperation_status", "Administrator.late_request_count", "Administrator.regulator_reportable_late_count", "Administrator.breach_count", "Administrator.outstanding_request_count"]
    input_set: |
      All VendorDataRequest rows with administrator_id == this administrator.
      late counts consider only rows with fulfillment_status IN {OPEN, PARTIAL} — a request that was
      produced in full stops being late even if it was produced after its deadline.
      breach_count considers rows with escalation_status == BREACH_DECLARED regardless of fulfillment.
    variants:
      CONTRACT_BASIS: "deadline field = due_at (issued_at + Administrator.contractual_production_days days); result stored in cooperation_score and is the ONLY variant that drives cooperation_status"
      REGULATORY_BASIS: "deadline field = regulatory_due_at (issued_at + REGULATORY_PRODUCTION_DAYS days); result stored in regulatory_basis_cooperation_score and is reported to the regulator but never drives cooperation_status"
    formula: |
      late_count(variant) = count(requests with fulfillment_status IN {OPEN, PARTIAL} AND
                                  clock_now > deadline_field(variant))            # strictly greater
      score(variant) = max(0, 100 - LATE_PENALTY * late_count(variant) - BREACH_PENALTY * breach_count)
      cooperation_score                   = round(score(CONTRACT_BASIS), 2)
      regulatory_basis_cooperation_score  = round(score(REGULATORY_BASIS), 2)
      cooperation_status = COOPERATIVE  when cooperation_score >= COOPERATIVE_FLOOR
                         = DELINQUENT   when DELINQUENT_FLOOR <= cooperation_score < COOPERATIVE_FLOOR
                         = ESCALATED    when cooperation_score < DELINQUENT_FLOOR
      The floor at 0 is applied before rounding; the score never goes negative however many breaches
      accumulate.
    constants:
      LATE_PENALTY: 15
      BREACH_PENALTY: 25
      REGULATORY_PRODUCTION_DAYS: 30
      COOPERATIVE_FLOOR: 80
      DELINQUENT_FLOOR: 50
    precision: "Both scores: 2 decimal places, ROUND_HALF_UP, floored at 0.00 and capped at 100.00."
    worked_example: |
      contractual_production_days = 45; two requests issued 2026-08-01T00:00:00.000Z, both still OPEN;
      clock advanced to 2026-09-10T00:00:00.000Z.
        CONTRACT_BASIS: due_at 2026-09-15 -> 0 late -> cooperation_score 100.00 -> COOPERATIVE.
        REGULATORY_BASIS: regulatory_due_at 2026-08-31 -> 2 late -> 100 - 30 = 70.00.
      One late request plus one declared breach: 100 - 15 - 25 = 60.00 -> DELINQUENT.
      Three late plus one breach: 100 - 45 - 25 = 30.00 -> ESCALATED.

  - name: regulator_response_completeness_score
    trigger: "POST /parity/regulator-requests/{id}/respond"
    algorithm_type: tiered_pricing
    output_fields: ["RegulatorRequest.requested_item_count", "RegulatorRequest.covered_item_count", "RegulatorRequest.completeness_score", "RegulatorRequest.response_sufficient"]
    input_set: |
      requested_items = NqtlItem rows with plan_year_id == the request's plan_year_id and
        nqtl_type IN requested_nqtl_types, evaluated fresh at each respond call.
      covered_items = the subset having at least one ComparativeAnalysis with status == CERTIFIED
        (WITHDRAWN, DRAFT, SUBMITTED and INSUFFICIENT analyses do not cover an item).
      E_total = sum of evidentiary_standard_count over one CERTIFIED analysis per covered item
        (the most recent by created_at DESC when an item has more than one).
    formula: |
      base = Decimal(100) * Decimal(covered_item_count) / Decimal(requested_item_count)
      tier = "A" when base >= TIER_A_FLOOR
           = "B" when base >= TIER_B_FLOOR
           = "C" otherwise
      credit = TIER_CREDIT[tier] * min(1, Decimal(E_total) / EVIDENCE_TARGET)
      completeness_score = round(min(100, base + credit), 2)
      response_sufficient = (completeness_score >= RESPONSE_SUFFICIENCY_THRESHOLD)
      The tier is selected from base ALONE, before any evidentiary credit is added. Re-deriving the
      tier from base + credit (iterating to a fixed point) is forbidden and can promote a response
      across the sufficiency threshold that should have failed it.
      requested_item_count == 0 is rejected with ERR_NO_REQUESTED_ITEMS rather than divided by.
    constants:
      TIER_A_FLOOR: 80
      TIER_B_FLOOR: 60
      TIER_CREDIT: { A: 10, B: 6, C: 2 }
      EVIDENCE_TARGET: 8
      RESPONSE_SUFFICIENCY_THRESHOLD: 85.0
    precision: "completeness_score: 2 decimal places, ROUND_HALF_UP, capped at 100.00."
    worked_example: |
      4 requested items, 3 covered by CERTIFIED analyses with evidentiary_standard_count 3, 3 and 2:
        base = 75.00 -> tier B (75 < 80) -> credit = 6 * min(1, 8/8) = 6
        completeness_score = 81.00 -> response_sufficient false (81.00 < 85.0).
      The forbidden iterated order gives 75 + 6 = 81 -> tier A -> 75 + 10 = 85.00 -> sufficient true.

  - name: remediation_liability_cents
    trigger: "POST /parity/corrective-action-plans (freezes CorrectiveActionPlan.reprocessing_liability_cents) and every APPROVED / COMPLETED / ABANDONED transition (re-derives PlanYear.remediation_liability_cents)"
    algorithm_type: aggregation
    output_fields: ["CorrectiveActionPlan.reprocessing_liability_cents", "PlanYear.remediation_liability_cents"]
    input_set: |
      Per plan: the single CorrectiveActionPlan being created.
      Per plan year: CorrectiveActionPlan rows with status == APPROVED whose NqtlItem.plan_year_id ==
      this plan year. DRAFT, REJECTED, COMPLETED and ABANDONED plans contribute nothing.
    formula: |
      rate = REMEDY_RATES[remedy_type]
      reprocessing_liability_cents = round(affected_claims_count * average_claim_cents * rate, 0)
        -> a whole number of cents, computed once at creation and then frozen; later clock moves,
           re-approvals or reopened analyses never change it.
      PlanYear.remediation_liability_cents = sum(reprocessing_liability_cents over the APPROVED set)
      Order is pinned: each plan is rounded to whole cents FIRST and the already-rounded amounts are
      then summed. Summing the unrounded products and rounding once at the end is forbidden.
      APPROVED adds exactly one plan's frozen amount; COMPLETED and ABANDONED each subtract exactly
      the same frozen amount, so an approve-then-abandon round trip returns the plan year to its
      previous total with zero drift.
    constants:
      REMEDY_RATES: { RETROSPECTIVE_CLAIMS_REPROCESSING: 1.00, DESIGN_CHANGE: 0.25, PROCESS_CHANGE: 0.10 }
    precision: "Whole cents, ROUND_HALF_UP, applied per corrective-action plan before aggregation."
    worked_example: |
      DESIGN_CHANGE, 1327 affected claims, 4990 cents average: 1327 * 4990 * 0.25 = 1655432.50
      -> ROUND_HALF_UP -> 1655433 cents frozen on the plan.
      Approving it moves PlanYear.remediation_liability_cents 0 -> 1655433; abandoning it returns
      1655433 -> 0. The same inputs under RETROSPECTIVE_CLAIMS_REPROCESSING give 6621730 cents.

  - name: plan_year_compliance_posture
    trigger: |
      Recomputed on: every NqtlItem status change, every ParityTest creation or supersession, every
      VALIDATED DataSubmission, every VendorDataRequest fulfilment or breach declaration, every
      CorrectiveActionPlan decision or closure, and POST /_clock/set_current_utc.
    algorithm_type: constraint_propagation
    output_fields: ["PlanYear.compliance_posture", "PlanYear.open_violation_count", "PlanYear.notified_violation_count", "PlanYear.failing_parity_test_count", "PlanYear.status"]
    input_set: |
      open_violation_count      = count(NqtlItem where plan_year_id == this.id AND status == VIOLATION)
      failing_parity_test_count = count(ParityTest where status == COMPUTED AND basis == PLAN_PAYMENTS
                                        AND result == FAIL AND its classification's plan_year_id == this.id)
      inventoried_count         = count(NqtlItem where plan_year_id == this.id AND status == INVENTORIED)
      the owning Administrator's cooperation_status.
      SUPERSEDED parity tests, advisory CLAIMS_COUNT tests and REMEDIATED items are all excluded.
    formula: |
      Evaluated as an ordered ladder; the first matching clause wins.
        1. open_violation_count >= 1 OR failing_parity_test_count >= 1                  -> VIOLATION
        2. Administrator.cooperation_status IN {DELINQUENT, ESCALATED}
           OR inventoried_count >= 1                                                    -> AT_RISK
        3. otherwise                                                                    -> COMPLIANT
      Reaching VIOLATION also drives PlanYear.status OPEN|UNDER_REGULATOR_REVIEW -> REMEDIATION;
      leaving VIOLATION while status == REMEDIATION drives REMEDIATION -> OPEN. A CLOSED plan year
      keeps recomputing its posture but never changes status again.
      The ladder must not be evaluated as a max/severity blend: an item in VIOLATION outranks a
      delinquent vendor even though both conditions hold.
    constants: {}
    precision: "Integer counts; no rounding."
    worked_example: |
      Fresh plan year with one INVENTORIED NqtlItem and a COOPERATIVE administrator -> AT_RISK.
      That item certified and determined COMPLIANT, no failing PLAN_PAYMENTS test -> COMPLIANT.
      A VIOLATION determination on any item -> VIOLATION and status REMEDIATION.
      The corrective plan closing COMPLETED returns the item to REMEDIATED -> COMPLIANT and status OPEN.
      A declared vendor breach dropping cooperation_score to 60.00 (DELINQUENT) with no violation
      and no INVENTORIED item -> AT_RISK.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated strictly in this order; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role are both present and non-empty (a header sent as the empty string counts as absent)."
    error_id: ERR_MISSING_IDENTITY_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of {PlanSponsor, Administrator, ComplianceOfficer, Regulator}."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Every id in the path exists, checked left-to-right. Emits the entity-specific 404: ERR_ADMINISTRATOR_NOT_FOUND, ERR_PLAN_YEAR_NOT_FOUND, ERR_CLASSIFICATION_NOT_FOUND, ERR_NQTL_ITEM_NOT_FOUND, ERR_ANALYSIS_NOT_FOUND, ERR_VENDOR_REQUEST_NOT_FOUND, ERR_DATA_SUBMISSION_NOT_FOUND, ERR_CAP_NOT_FOUND, ERR_REGULATOR_REQUEST_NOT_FOUND."
    error_id: ERR_PLAN_YEAR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "Every FK id in the request body exists, checked in the order the fields are declared in §1.1. Emits the same entity-specific 404 codes as priority 4."
    error_id: ERR_ADMINISTRATOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /parity/plan-years, POST /parity/nqtl-items, POST /parity/comparative-analyses, POST /parity/vendor-requests, POST /parity/vendor-requests/{id}/data-submissions, POST /parity/corrective-action-plans, POST /parity/regulator-requests"
  - priority: 6
    category: business_constraint
    check: "Payload shape: every required field present; types match §1.1; enum values inside the declared set; numeric ranges honoured; string lengths honoured; arrays non-empty and duplicate-free; dates YYYY-MM-DD; instants ISO-8601 UTC; pagination limit within 1..100 and offset >= 0."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 7
    category: business_constraint
    check: "network_tier == NOT_APPLICABLE exactly when benefit_category IN {EMERGENCY_CARE, PRESCRIPTION_DRUGS}, and IN {IN_NETWORK, OUT_OF_NETWORK} otherwise."
    error_id: ERR_NETWORK_TIER_MISMATCH
    http_status: 422
    applies_to: "POST /parity/plan-years/{id}/classifications"
  - priority: 8
    category: business_constraint
    check: "sub_classification != NONE only when benefit_category == OUTPATIENT."
    error_id: ERR_SUB_CLASSIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /parity/plan-years/{id}/classifications"
  - priority: 9
    category: business_temporal
    check: "measurement_period_end >= measurement_period_start (single-row internal consistency, checked before any cross-row comparison)."
    error_id: ERR_MEASUREMENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /parity/plan-years/{id}/classifications"
  - priority: 10
    category: business_constraint
    check: "mh_denials <= mh_adjudicated_claims and ms_denials <= ms_adjudicated_claims."
    error_id: ERR_DENIALS_EXCEED_CLAIMS
    http_status: 422
    applies_to: "POST /parity/vendor-requests/{id}/data-submissions"
  - priority: 11
    category: business_constraint
    check: "submission_type appears in the owning VendorDataRequest.requested_submission_types."
    error_id: ERR_SUBMISSION_TYPE_NOT_REQUESTED
    http_status: 422
    applies_to: "POST /parity/vendor-requests/{id}/data-submissions"
  - priority: 12
    category: business_referential
    check: |
      Cross-aggregate coherence: NqtlItem.classification_id must belong to NqtlItem.plan_year_id;
      DataSubmission.classification_id must belong to the vendor request's plan_year_id;
      VendorDataRequest.nqtl_item_id (when given) must belong to the request's plan_year_id;
      ComparativeAnalysis.supersedes_analysis_id must carry the same nqtl_item_id as the new analysis.
    error_id: ERR_CROSS_PLAN_YEAR_REFERENCE
    http_status: 409
    applies_to: "POST /parity/nqtl-items, POST /parity/vendor-requests, POST /parity/vendor-requests/{id}/data-submissions, POST /parity/comparative-analyses"
  - priority: 13
    category: business_referential
    check: "supersedes_analysis_id points at a row whose status IN {DRAFT, SUBMITTED, INSUFFICIENT}; a CERTIFIED or already WITHDRAWN analysis cannot be superseded."
    error_id: ERR_ANALYSIS_ALREADY_SUPERSEDED
    http_status: 409
    applies_to: "POST /parity/comparative-analyses"
  - priority: 14
    category: state
    check: "The owning PlanYear.status != CLOSED. Applies to every mutation that reaches a plan year, whether through the path or through an FK chain."
    error_id: ERR_PLAN_YEAR_CLOSED
    http_status: 409
    applies_to: "every POST except POST /parity/administrators, POST /parity/plan-years and POST /_clock/set_current_utc"
  - priority: 15
    category: state
    check: "The owning PlanYear.status == OPEN. Only the plan-design surface is frozen this tightly: once a regulator request has opened (UNDER_REGULATOR_REVIEW) or a violation has been found (REMEDIATION), the classification and treatment-limitation rows the produced analyses describe may no longer change."
    error_id: ERR_PLAN_YEAR_NOT_OPEN
    http_status: 409
    applies_to: "POST /parity/plan-years/{id}/classifications, POST /parity/classifications/{id}/treatment-limitations"
  - priority: 16
    category: state
    check: |
      The target resource is in a state the requested transition departs from (§1.2), emitting the
      transition-specific code: ERR_ANALYSIS_NOT_DRAFT (submit), ERR_ANALYSIS_NOT_SUBMITTED (review),
      ERR_ANALYSIS_NOT_INSUFFICIENT (reopen), ERR_ITEM_NOT_AWAITING_DETERMINATION (determinations from
      a state other than ANALYSIS_SUBMITTED or COMPLIANT), ERR_ITEM_NOT_IN_VIOLATION (corrective-action
      create / decision / COMPLETED closure), ERR_CAP_NOT_DRAFT (decision), ERR_CAP_NOT_APPROVED
      (closure), ERR_REGULATOR_REQUEST_NOT_OPEN (respond from CLOSED or RESPONDED),
      ERR_REGULATOR_REQUEST_NOT_RESPONDED (adjudicate), ERR_ESCALATION_ALREADY_DECLARED (escalate past
      BREACH_DECLARED), ERR_REQUEST_ALREADY_FULFILLED (escalate or submit against a FULFILLED request),
      ERR_PRODUCTION_WINDOW_CLOSED (submit against a BREACH_DECLARED request).
    error_id: ERR_ANALYSIS_NOT_DRAFT
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 17
    category: business_constraint
    check: "expected_plan_year_version / expected_nqtl_item_version equals the current parent version (§1.2.1). Checked after existence and state so a stale caller learns the real reason when the state guard also fails."
    error_id: ERR_STALE_PLAN_YEAR_VERSION
    http_status: 412
    applies_to: "POST /parity/nqtl-items/{id}/determinations, POST /parity/comparative-analyses"
  - priority: 18
    category: business_safety
    check: "The reviewing ComplianceOfficer's X-User-ID differs from ComparativeAnalysis.authored_by_user_id — the author of a comparative analysis may never review it, on either branch."
    error_id: ERR_SELF_CERTIFICATION
    http_status: 409
    applies_to: "POST /parity/comparative-analyses/{id}/review"
  - priority: 19
    category: business_safety
    check: "The approving ComplianceOfficer's X-User-ID differs from the owning NqtlItem.determination_recorded_by_user_id — whoever found the violation may not approve the plan that remedies it."
    error_id: ERR_APPROVER_IS_DETERMINER
    http_status: 409
    applies_to: "POST /parity/corrective-action-plans/{id}/decision"
  - priority: 20
    category: business_safety
    check: "Certification requires at least one DataSubmission with status == VALIDATED and submission_type == DENIAL_RATES for the owning NqtlItem's classification_id: an analysis may not be certified without as-applied evidence. A REJECTED submission does not satisfy this rule."
    error_id: ERR_IN_OPERATION_DATA_MISSING
    http_status: 409
    applies_to: "POST /parity/comparative-analyses/{id}/review with outcome == CERTIFIED"
  - priority: 21
    category: business_safety
    check: "factor_count >= MIN_FACTORS (2) and evidentiary_standard_count >= MIN_EVIDENTIARY_STANDARDS (1) at submission time."
    error_id: ERR_INSUFFICIENT_COMPARATIVE_ANALYSIS
    http_status: 422
    applies_to: "POST /parity/comparative-analyses/{id}/submit"
  - priority: 22
    category: business_safety
    check: "A COMPLIANT determination requires the item's latest non-WITHDRAWN ComparativeAnalysis to be CERTIFIED."
    error_id: ERR_ANALYSIS_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /parity/nqtl-items/{id}/determinations with outcome == COMPLIANT"
  - priority: 23
    category: business_safety
    check: "The determination outcome agrees with the freshly recomputed evidence: COMPLIANT requires stringency_in_operation_index < STRINGENCY_VIOLATION_THRESHOLD (5.0); VIOLATION requires it >= 5.0."
    error_id: ERR_STRINGENCY_CONTRADICTS_EVIDENCE
    http_status: 409
    applies_to: "POST /parity/nqtl-items/{id}/determinations"
  - priority: 24
    category: business_constraint
    check: "The classification has mh_su_benefits_covered == true; an NQTL cannot be inventoried in a classification that offers no MH/SUD benefits."
    error_id: ERR_MH_BENEFITS_NOT_COVERED
    http_status: 409
    applies_to: "POST /parity/nqtl-items"
  - priority: 25
    category: business_constraint
    check: "No existing NqtlItem with status != REMEDIATED shares this (plan_year_id, classification_id, nqtl_type)."
    error_id: ERR_DUPLICATE_NQTL_ITEM
    http_status: 409
    applies_to: "POST /parity/nqtl-items"
  - priority: 26
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS (3); the fourth reopen of the same analysis is refused."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /parity/comparative-analyses/{id}/reopen"
  - priority: 27
    category: business_constraint
    check: "The substantially-all denominator is non-zero: at least one ACTIVE MEDICAL_SURGICAL TreatmentLimitation of the requested limitation_type exists with a positive weight under the requested basis."
    error_id: ERR_EMPTY_TEST_POPULATION
    http_status: 422
    applies_to: "POST /parity/classifications/{id}/parity-tests"
  - priority: 28
    category: business_temporal
    check: |
      Measurement periods do not collide. For a fixed (plan_year_id, benefit_category, network_tier,
      sub_classification) the periods are CLOSED intervals [measurement_period_start,
      measurement_period_end] that must additionally be separated by at least
      MEASUREMENT_PERIOD_BUFFER_DAYS (1) full day: reject when
      new_start <= existing_end + 1 day AND new_end >= existing_start - 1 day.
      Touching periods and periods one day apart are both refused; two days apart is accepted.
    error_id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /parity/plan-years/{id}/classifications"
  - priority: 29
    category: business_temporal
    check: |
      Production windows do not collide. For a fixed (administrator_id, plan_year_id) the window of a
      VendorDataRequest whose fulfillment_status IN {OPEN, PARTIAL} is the HALF-OPEN interval
      [issued_at, due_at) with NO buffer: reject a new request when
      new_issued_at < existing_due_at AND existing_issued_at < new_due_at.
      A new request issued at exactly the previous window's due_at is accepted — deliberately the
      opposite convention from the closed, buffered measurement-period rule above.
    error_id: ERR_PRODUCTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /parity/vendor-requests"
  - priority: 30
    category: business_temporal
    check: "Escalation is ripe: NONE -> NOTICE_SENT requires clock_now > due_at; NOTICE_SENT -> BREACH_DECLARED requires clock_now > due_at + BREACH_GRACE_DAYS (7) days. Equality is not yet overdue."
    error_id: ERR_NOT_YET_OVERDUE
    http_status: 409
    applies_to: "POST /parity/vendor-requests/{id}/escalate"
  - priority: 31
    category: business_temporal
    check: "clock_now <= RegulatorRequest.response_due_at (including any REOPEN_EXTENSION_DAYS extension already granted)."
    error_id: ERR_RESPONSE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /parity/regulator-requests/{id}/respond"
  - priority: 32
    category: business_constraint
    check: "requested_item_count >= 1 at respond time; a request whose demanded NQTL types match no inventoried item cannot be scored."
    error_id: ERR_NO_REQUESTED_ITEMS
    http_status: 409
    applies_to: "POST /parity/regulator-requests/{id}/respond"
  - priority: 33
    category: business_constraint
    check: "current_utc is strictly greater than the current logical clock value; the clock only moves forward."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 34
    category: business_fiscal
    check: "PlanYear.remediation_liability_cents + CorrectiveActionPlan.reprocessing_liability_cents <= PlanYear.remediation_liability_cap_cents. Evaluated last, so a plan that also violates the segregation-of-duties rule reports the safety failure first."
    error_id: ERR_LIABILITY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /parity/corrective-action-plans/{id}/decision with outcome == APPROVED"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (api_prefix /parity; every templated segment is {id})
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/parity/administrators"
    description: "Register the third-party administrator that services the plan and carries the contractual production obligation."
    roles: [PlanSponsor]
    code: 201
    input: [legal_name, contact_email, "contractual_production_days?"]
    output: Administrator
    side_effects: ["initialises outstanding_request_count, late_request_count, breach_count and regulator_reportable_late_count to 0", "cooperation_score and regulatory_basis_cooperation_score set to 100.00 and cooperation_status to COOPERATIVE"]
  - method: GET
    path: "/parity/administrators/{id}"
    description: "Read one administrator with both cooperation-score variants and the live obligation counters."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: Administrator
    side_effects: []

  - method: POST
    path: "/parity/plan-years"
    description: "Open a plan year for parity review under a registered administrator."
    roles: [PlanSponsor]
    code: 201
    input: [plan_name, plan_year_label, administrator_id, funding_arrangement, covered_participant_count, remediation_liability_cap_cents]
    output: PlanYear
    side_effects: ["status set to OPEN", "compliance_posture computed by calculations.plan_year_compliance_posture (COMPLIANT for an empty plan year with a COOPERATIVE administrator)", "all four derived counters and remediation_liability_cents set to 0"]
  - method: GET
    path: "/parity/plan-years/{id}"
    description: "Read one plan year with its posture, derived counters and liability ledger."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: PlanYear
    side_effects: []
  - method: GET
    path: "/parity/plan-years"
    description: "List plan years, filterable by administrator, lifecycle status and compliance posture."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["administrator_id?", "status?", "compliance_posture?", "limit?", "offset?"]
    output: PlanYear[]
    side_effects: []
  - method: POST
    path: "/parity/plan-years/{id}/classifications"
    description: "Classify benefits into a permitted MHPAEA category and network tier for one measurement period. Requires the plan year to be OPEN."
    roles: [PlanSponsor]
    code: 201
    input: [benefit_category, network_tier, "sub_classification?", measurement_period_start, measurement_period_end, "mh_su_benefits_covered?"]
    output: BenefitClassification
    side_effects: ["plan_year_id taken from the path", "measurement-period collision check at validations priority 28"]
  - method: GET
    path: "/parity/plan-years/{id}/classifications"
    description: "List the benefit classifications of one plan year (FK reverse-reachability for BenefitClassification.plan_year_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["benefit_category?", "network_tier?", "limit?", "offset?"]
    output: BenefitClassification[]
    side_effects: []
  - method: GET
    path: "/parity/classifications/{id}"
    description: "Read one benefit classification."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: BenefitClassification
    side_effects: []

  - method: POST
    path: "/parity/classifications/{id}/treatment-limitations"
    description: "Record one financial requirement / quantitative treatment limitation level on either benefit side of a classification. Requires the plan year to be OPEN."
    roles: [PlanSponsor, Administrator]
    code: 201
    input: [limitation_type, benefit_side, level_value, projected_plan_payments_cents, projected_claims_count]
    output: TreatmentLimitation
    side_effects: ["classification_id taken from the path", "status set to ACTIVE", "any ACTIVE row with the same (classification_id, limitation_type, benefit_side, level_value) moves ACTIVE -> SUPERSEDED"]
  - method: GET
    path: "/parity/classifications/{id}/treatment-limitations"
    description: "List the treatment-limitation rows of one classification (FK reverse-reachability for TreatmentLimitation.classification_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["limitation_type?", "benefit_side?", "status?", "limit?", "offset?"]
    output: TreatmentLimitation[]
    side_effects: []

  - method: POST
    path: "/parity/classifications/{id}/parity-tests"
    description: "Run the substantially-all and predominant tests for one limitation type on one classification under the chosen weighting basis."
    roles: [PlanSponsor, ComplianceOfficer]
    code: 201
    input: [limitation_type, basis]
    output: ParityTest
    side_effects: ["runs calculations.qtl_substantially_all_ratio, calculations.qtl_predominant_level and calculations.mh_level_under_test", "any COMPUTED test on the same (classification_id, limitation_type, basis) moves COMPUTED -> SUPERSEDED", "recomputes PlanYear.failing_parity_test_count and calculations.plan_year_compliance_posture (PLAN_PAYMENTS tests only)"]
  - method: GET
    path: "/parity/classifications/{id}/parity-tests"
    description: "List the parity tests run on one classification (FK reverse-reachability for ParityTest.classification_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["limitation_type?", "basis?", "status?", "limit?", "offset?"]
    output: ParityTest[]
    side_effects: []

  - method: POST
    path: "/parity/nqtl-items"
    description: "Inventory one nonquantitative treatment limitation as applied in a classification."
    roles: [PlanSponsor, ComplianceOfficer]
    code: 201
    input: [plan_year_id, classification_id, nqtl_type, applied_to, description]
    output: NqtlItem
    side_effects: ["status set to INVENTORIED", "stringency_in_operation_index computed by calculations.nqtl_stringency_in_operation_index from whatever evidence already exists for the classification", "recomputes calculations.plan_year_compliance_posture (an INVENTORIED item forces at least AT_RISK)"]
  - method: GET
    path: "/parity/nqtl-items/{id}"
    description: "Read one NQTL inventory item with its live stringency index and version (the value to pass as expected_nqtl_item_version)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: NqtlItem
    side_effects: []
  - method: GET
    path: "/parity/nqtl-items"
    description: "List NQTL inventory items (FK reverse-reachability for NqtlItem.plan_year_id and NqtlItem.classification_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["plan_year_id?", "classification_id?", "nqtl_type?", "status?", "limit?", "offset?"]
    output: NqtlItem[]
    side_effects: []
  - method: POST
    path: "/parity/nqtl-items/{id}/determinations"
    description: "Record the compliance officer's parity determination on one NQTL. Guarded by OCC on the plan year and by agreement with the recomputed stringency evidence."
    roles: [ComplianceOfficer]
    code: 201
    input: [outcome, rationale, expected_plan_year_version]
    output: NqtlItem
    side_effects: ["recomputes calculations.nqtl_stringency_in_operation_index before deciding", "moves NqtlItem ANALYSIS_SUBMITTED|COMPLIANT -> COMPLIANT|VIOLATION and stamps determination_recorded_by_user_id", "on VIOLATION: creates one ParticipantNotice (VIOLATION_DISCLOSURE / DETERMINATION_CASCADE), then recomputes PlanYear.open_violation_count, notified_violation_count and compliance_posture, then drives PlanYear -> REMEDIATION", "increments PlanYear.version"]
  - method: GET
    path: "/parity/nqtl-items/{id}/participant-notices"
    description: "List the participant notices generated for one NQTL (FK reverse-reachability for ParticipantNotice.nqtl_item_id; cascade-created rows have no other discovery channel)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["notice_type?", "limit?", "offset?"]
    output: ParticipantNotice[]
    side_effects: []

  - method: POST
    path: "/parity/comparative-analyses"
    description: "Draft the comparative analysis for one NQTL, optionally superseding an earlier non-certified analysis. Guarded by OCC on the NQTL item."
    roles: [PlanSponsor, Administrator]
    code: 201
    input: [nqtl_item_id, "supersedes_analysis_id?", factor_count, evidentiary_standard_count, stringency_written_finding, stringency_operation_finding, expected_nqtl_item_version]
    output: ComparativeAnalysis
    side_effects: ["status set to DRAFT, revision_round 0, authored_by_user_id stamped from X-User-ID", "when supersedes_analysis_id is given that row moves DRAFT|SUBMITTED|INSUFFICIENT -> WITHDRAWN", "moves NqtlItem INVENTORIED -> ANALYSIS_DRAFTED (or back to ANALYSIS_DRAFTED when a SUBMITTED analysis was withdrawn)", "recomputes calculations.nqtl_stringency_in_operation_index and increments NqtlItem.version"]
  - method: GET
    path: "/parity/comparative-analyses/{id}"
    description: "Read one comparative analysis."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: ComparativeAnalysis
    side_effects: []
  - method: GET
    path: "/parity/comparative-analyses"
    description: "List comparative analyses (FK reverse-reachability for ComparativeAnalysis.nqtl_item_id and the self-referential supersedes_analysis_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["nqtl_item_id?", "supersedes_analysis_id?", "status?", "limit?", "offset?"]
    output: ComparativeAnalysis[]
    side_effects: []
  - method: POST
    path: "/parity/comparative-analyses/{id}/submit"
    description: "Submit a drafted comparative analysis for compliance review."
    roles: [PlanSponsor, Administrator]
    code: 200
    input: []
    output: ComparativeAnalysis
    side_effects: ["DRAFT -> SUBMITTED", "moves NqtlItem ANALYSIS_DRAFTED -> ANALYSIS_SUBMITTED and increments its version", "recomputes calculations.nqtl_stringency_in_operation_index"]
  - method: POST
    path: "/parity/comparative-analyses/{id}/review"
    description: "Certify a submitted comparative analysis or send it back as insufficient. Segregation of duties applies on both branches."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "review_note?"]
    output: ComparativeAnalysis
    side_effects: ["SUBMITTED -> CERTIFIED (stamps certified_by_user_id) or SUBMITTED -> INSUFFICIENT", "on INSUFFICIENT: moves NqtlItem ANALYSIS_SUBMITTED -> ANALYSIS_DRAFTED", "recomputes calculations.nqtl_stringency_in_operation_index"]
  - method: POST
    path: "/parity/comparative-analyses/{id}/reopen"
    description: "Reopen an insufficient comparative analysis for revision, bounded by MAX_REVISION_ROUNDS."
    roles: [PlanSponsor, Administrator]
    code: 200
    input: []
    output: ComparativeAnalysis
    side_effects: ["INSUFFICIENT -> DRAFT and increments revision_round"]

  - method: POST
    path: "/parity/vendor-requests"
    description: "Issue a contractual data / analysis production request to the administrator, opening a production window."
    roles: [PlanSponsor]
    code: 201
    input: [administrator_id, plan_year_id, "nqtl_item_id?", requested_item_count, requested_submission_types]
    output: VendorDataRequest
    side_effects: ["issued_at stamped from the logical clock; due_at = issued_at + Administrator.contractual_production_days days; regulatory_due_at = issued_at + 30 days", "fulfillment_status OPEN, escalation_status NONE, validated_submission_count 0", "increments Administrator.outstanding_request_count and recomputes calculations.administrator_cooperation_score", "production-window collision check at validations priority 29"]
  - method: GET
    path: "/parity/vendor-requests/{id}"
    description: "Read one vendor data request with both status dimensions and its two deadlines."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: VendorDataRequest
    side_effects: []
  - method: GET
    path: "/parity/vendor-requests"
    description: "List vendor data requests (FK reverse-reachability for administrator_id, plan_year_id and nqtl_item_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["administrator_id?", "plan_year_id?", "nqtl_item_id?", "fulfillment_status?", "escalation_status?", "limit?", "offset?"]
    output: VendorDataRequest[]
    side_effects: []
  - method: POST
    path: "/parity/vendor-requests/{id}/escalate"
    description: "Advance the contract-enforcement dimension of an overdue request: notice first, breach after the grace period."
    roles: [PlanSponsor]
    code: 200
    input: []
    output: VendorDataRequest
    side_effects: ["NONE -> NOTICE_SENT or NOTICE_SENT -> BREACH_DECLARED; fulfillment_status untouched", "on BREACH_DECLARED: increments Administrator.breach_count, recomputes both cooperation-score variants and cooperation_status, then recomputes calculations.plan_year_compliance_posture for every plan year of that administrator"]
  - method: POST
    path: "/parity/vendor-requests/{id}/data-submissions"
    description: "Produce one as-applied data set against an open production window. Validated at creation; denial-rate submissions are scored immediately."
    roles: [Administrator]
    code: 201
    input: [classification_id, submission_type, "mh_denials?", "mh_adjudicated_claims?", "ms_denials?", "ms_adjudicated_claims?", "mh_in_network_provider_pct?", "ms_in_network_provider_pct?", "benchmark_note?"]
    output: DataSubmission
    side_effects: ["vendor_request_id taken from the path", "RECEIVED -> VALIDATED or RECEIVED -> REJECTED inside the same request", "on VALIDATED: runs calculations.denial_rate_disparity_index or computes network_composition_gap, advances fulfillment_status, recomputes calculations.nqtl_stringency_in_operation_index for every NqtlItem of that classification and calculations.plan_year_compliance_posture", "on the submission that reaches requested_item_count: decrements Administrator.outstanding_request_count and recomputes calculations.administrator_cooperation_score"]
  - method: GET
    path: "/parity/data-submissions/{id}"
    description: "Read one produced data submission with its computed rates, disparity ratio and rejection reason."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: DataSubmission
    side_effects: []
  - method: GET
    path: "/parity/data-submissions"
    description: "List produced data submissions (FK reverse-reachability for vendor_request_id and classification_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["vendor_request_id?", "classification_id?", "submission_type?", "status?", "limit?", "offset?"]
    output: DataSubmission[]
    side_effects: []

  - method: POST
    path: "/parity/corrective-action-plans"
    description: "Draft a corrective action plan for an NQTL found in violation; freezes the reprocessing liability at creation."
    roles: [PlanSponsor, ComplianceOfficer]
    code: 201
    input: [nqtl_item_id, remedy_type, affected_claims_count, average_claim_cents, target_completion_date]
    output: CorrectiveActionPlan
    side_effects: ["status set to DRAFT", "runs calculations.remediation_liability_cents to freeze reprocessing_liability_cents", "PlanYear.remediation_liability_cents is NOT touched until the plan is approved"]
  - method: GET
    path: "/parity/corrective-action-plans/{id}"
    description: "Read one corrective action plan with its frozen liability."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: GET
    path: "/parity/corrective-action-plans"
    description: "List corrective action plans (FK reverse-reachability for CorrectiveActionPlan.nqtl_item_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["nqtl_item_id?", "status?", "remedy_type?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []
  - method: POST
    path: "/parity/corrective-action-plans/{id}/decision"
    description: "Approve or reject a drafted corrective action plan. Approval books the liability against the plan year's cap."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "decision_note?"]
    output: CorrectiveActionPlan
    side_effects: ["DRAFT -> APPROVED (stamps approved_by_user_id and adds reprocessing_liability_cents to PlanYear.remediation_liability_cents) or DRAFT -> REJECTED (ledger untouched)", "increments PlanYear.version on the APPROVED branch"]
  - method: POST
    path: "/parity/corrective-action-plans/{id}/closure"
    description: "Close an approved corrective action plan as completed or abandoned. Both outcomes release the booked liability; only completion remediates the NQTL."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "closure_note?"]
    output: CorrectiveActionPlan
    side_effects: ["APPROVED -> COMPLETED or APPROVED -> ABANDONED; PlanYear.remediation_liability_cents reduced by exactly reprocessing_liability_cents on either branch", "on COMPLETED: moves NqtlItem VIOLATION -> REMEDIATED, creates one ParticipantNotice (CORRECTION_COMPLETED / CAP_CLOSURE_CASCADE), recomputes calculations.plan_year_compliance_posture and can drive PlanYear REMEDIATION -> OPEN", "on ABANDONED: the NqtlItem stays VIOLATION and no notice is created"]

  - method: POST
    path: "/parity/regulator-requests"
    description: "Open a regulator request for the plan year's comparative analyses; freezes the plan-design surface."
    roles: [Regulator]
    code: 201
    input: [plan_year_id, requested_nqtl_types, request_reference]
    output: RegulatorRequest
    side_effects: ["opened_at stamped from the logical clock; response_due_at = opened_at + 30 days", "status OPEN, regulator_round 0, completeness_score and response_sufficient null", "moves PlanYear OPEN -> UNDER_REGULATOR_REVIEW"]
  - method: GET
    path: "/parity/regulator-requests/{id}"
    description: "Read one regulator request with its completeness score and current deadline."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: RegulatorRequest
    side_effects: []
  - method: GET
    path: "/parity/regulator-requests"
    description: "List regulator requests (FK reverse-reachability for RegulatorRequest.plan_year_id)."
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: ["plan_year_id?", "status?", "limit?", "offset?"]
    output: RegulatorRequest[]
    side_effects: []
  - method: POST
    path: "/parity/regulator-requests/{id}/respond"
    description: "Produce the demanded analyses to the regulator; scores the response for completeness."
    roles: [PlanSponsor]
    code: 200
    input: ["response_note?"]
    output: RegulatorRequest
    side_effects: ["OPEN|INSUFFICIENT_RESPONSE -> RESPONDED", "runs calculations.regulator_response_completeness_score to set requested_item_count, covered_item_count, completeness_score and response_sufficient"]
  - method: POST
    path: "/parity/regulator-requests/{id}/adjudicate"
    description: "Accept the response and close the request, or reject it as insufficient and extend the deadline."
    roles: [Regulator]
    code: 200
    input: [outcome, "adjudication_note?"]
    output: RegulatorRequest
    side_effects: ["RESPONDED -> CLOSED or RESPONDED -> INSUFFICIENT_RESPONSE (increments regulator_round and extends response_due_at by 14 days)", "on ACCEPTED with PlanYear.compliance_posture == COMPLIANT: moves PlanYear UNDER_REGULATOR_REVIEW -> CLOSED"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Test-driving endpoint for the logical clock. The server's logical clock starts at exactly
      2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every issued_at, due_at,
      opened_at, response_due_at and overdue comparison is derived from this clock. The clock only
      moves forward. Returns the inline object
      { "current_utc": "<ISO-8601 UTC>", "recomputed_administrator_count": <int>,
        "recomputed_plan_year_count": <int> }.
    roles: [PlanSponsor, Administrator, ComplianceOfficer, Regulator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["advances the logical clock", "recomputes VendorDataRequest.is_overdue, Administrator.late_request_count, regulator_reportable_late_count and both cooperation-score variants for every administrator", "recomputes calculations.plan_year_compliance_posture for every plan year"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---
  - id: ERR_MISSING_IDENTITY_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent, or present but sent as an empty string."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of PlanSponsor, Administrator, ComplianceOfficer, Regulator."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The role is valid but not listed in the endpoint's roles (e.g. Administrator calling POST /parity/nqtl-items/{id}/determinations)."
  # --- existence ---
  - id: ERR_ADMINISTRATOR_NOT_FOUND
    http: 404
    condition: "administrator_id in the path or body matches no Administrator."
  - id: ERR_PLAN_YEAR_NOT_FOUND
    http: 404
    condition: "plan_year_id in the path or body matches no PlanYear."
  - id: ERR_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "classification_id in the path or body matches no BenefitClassification."
  - id: ERR_NQTL_ITEM_NOT_FOUND
    http: 404
    condition: "nqtl_item_id in the path or body matches no NqtlItem."
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "A comparative-analysis id in the path, or supersedes_analysis_id in the body, matches no ComparativeAnalysis."
  - id: ERR_VENDOR_REQUEST_NOT_FOUND
    http: 404
    condition: "A vendor-request id in the path matches no VendorDataRequest."
  - id: ERR_DATA_SUBMISSION_NOT_FOUND
    http: 404
    condition: "A data-submission id in the path matches no DataSubmission."
  - id: ERR_CAP_NOT_FOUND
    http: 404
    condition: "A corrective-action-plan id in the path matches no CorrectiveActionPlan."
  - id: ERR_REGULATOR_REQUEST_NOT_FOUND
    http: 404
    condition: "A regulator-request id in the path matches no RegulatorRequest."
  # --- payload shape and field-level constraints ---
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, wrong type, enum value outside the declared set, numeric range or string-length breach, empty or duplicated array, malformed YYYY-MM-DD date or ISO-8601 instant, pagination limit outside 1..100 or negative offset."
  - id: ERR_NETWORK_TIER_MISMATCH
    http: 422
    condition: "network_tier is NOT_APPLICABLE for INPATIENT or OUTPATIENT, or is IN_NETWORK / OUT_OF_NETWORK for EMERGENCY_CARE or PRESCRIPTION_DRUGS."
  - id: ERR_SUB_CLASSIFICATION_MISMATCH
    http: 422
    condition: "sub_classification is OFFICE_VISITS or ALL_OTHER_OUTPATIENT while benefit_category != OUTPATIENT."
  - id: ERR_MEASUREMENT_PERIOD_INVALID
    http: 422
    condition: "measurement_period_end is earlier than measurement_period_start."
  - id: ERR_DENIALS_EXCEED_CLAIMS
    http: 422
    condition: "mh_denials > mh_adjudicated_claims or ms_denials > ms_adjudicated_claims."
  - id: ERR_SUBMISSION_TYPE_NOT_REQUESTED
    http: 422
    condition: "submission_type is not listed in the owning VendorDataRequest.requested_submission_types."
  - id: ERR_INSUFFICIENT_COMPARATIVE_ANALYSIS
    http: 422
    condition: "Submitting an analysis with factor_count < 2 or evidentiary_standard_count < 1."
  - id: ERR_EMPTY_TEST_POPULATION
    http: 422
    condition: "Running a parity test when the ACTIVE MEDICAL_SURGICAL rows of that limitation_type carry a total weight of 0 under the requested basis (would divide by zero)."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "current_utc is equal to or earlier than the current logical clock value."
  # --- referential coherence ---
  - id: ERR_CROSS_PLAN_YEAR_REFERENCE
    http: 409
    condition: "An FK combination spans two plan years: NqtlItem.classification_id outside NqtlItem.plan_year_id, DataSubmission.classification_id outside the request's plan year, VendorDataRequest.nqtl_item_id outside the request's plan year, or supersedes_analysis_id belonging to a different nqtl_item_id."
  - id: ERR_ANALYSIS_ALREADY_SUPERSEDED
    http: 409
    condition: "supersedes_analysis_id points at an analysis whose status is CERTIFIED or WITHDRAWN."
  # --- plan-year gating ---
  - id: ERR_PLAN_YEAR_CLOSED
    http: 409
    condition: "Any child mutation reaching a PlanYear whose status is CLOSED."
  - id: ERR_PLAN_YEAR_NOT_OPEN
    http: 409
    condition: "Creating a BenefitClassification or TreatmentLimitation while the plan year is UNDER_REGULATOR_REVIEW or REMEDIATION."
  # --- transition guards ---
  - id: ERR_ANALYSIS_NOT_DRAFT
    http: 409
    condition: "Submitting a comparative analysis that is not in DRAFT."
  - id: ERR_ANALYSIS_NOT_SUBMITTED
    http: 409
    condition: "Reviewing a comparative analysis that is not in SUBMITTED."
  - id: ERR_ANALYSIS_NOT_INSUFFICIENT
    http: 409
    condition: "Reopening a comparative analysis that is not in INSUFFICIENT."
  - id: ERR_ITEM_NOT_AWAITING_DETERMINATION
    http: 409
    condition: "Recording a determination on an NqtlItem whose status is not ANALYSIS_SUBMITTED or COMPLIANT (INVENTORIED, ANALYSIS_DRAFTED, VIOLATION or the terminal REMEDIATED)."
  - id: ERR_ITEM_NOT_IN_VIOLATION
    http: 409
    condition: "Creating a corrective action plan, deciding on one, or closing one as COMPLETED while the owning NqtlItem is not in VIOLATION."
  - id: ERR_CAP_NOT_DRAFT
    http: 409
    condition: "Deciding on a corrective action plan that is not in DRAFT."
  - id: ERR_CAP_NOT_APPROVED
    http: 409
    condition: "Closing a corrective action plan that is not in APPROVED (including a second closure of a COMPLETED or ABANDONED plan)."
  - id: ERR_REGULATOR_REQUEST_NOT_OPEN
    http: 409
    condition: "Responding to a regulator request whose status is RESPONDED or CLOSED."
  - id: ERR_REGULATOR_REQUEST_NOT_RESPONDED
    http: 409
    condition: "Adjudicating a regulator request whose status is OPEN, INSUFFICIENT_RESPONSE or CLOSED."
  - id: ERR_ESCALATION_ALREADY_DECLARED
    http: 409
    condition: "Escalating a vendor request whose escalation_status is already BREACH_DECLARED."
  - id: ERR_REQUEST_ALREADY_FULFILLED
    http: 409
    condition: "Escalating, or producing a further submission against, a vendor request whose fulfillment_status is FULFILLED."
  - id: ERR_PRODUCTION_WINDOW_CLOSED
    http: 409
    condition: "Producing a data submission against a vendor request whose escalation_status is BREACH_DECLARED."
  # --- optimistic concurrency ---
  - id: ERR_STALE_PLAN_YEAR_VERSION
    http: 412
    condition: "expected_plan_year_version does not equal the owning PlanYear.version at determination time."
  - id: ERR_STALE_NQTL_ITEM_VERSION
    http: 412
    condition: "expected_nqtl_item_version does not equal the owning NqtlItem.version at analysis-creation time."
  # --- safety / compliance ---
  - id: ERR_SELF_CERTIFICATION
    http: 409
    condition: "The reviewing X-User-ID equals ComparativeAnalysis.authored_by_user_id."
  - id: ERR_APPROVER_IS_DETERMINER
    http: 409
    condition: "The approving X-User-ID equals the owning NqtlItem.determination_recorded_by_user_id."
  - id: ERR_IN_OPERATION_DATA_MISSING
    http: 409
    condition: "Certifying an analysis with no VALIDATED DENIAL_RATES submission for the item's classification (a REJECTED submission does not count)."
  - id: ERR_ANALYSIS_NOT_CERTIFIED
    http: 409
    condition: "Recording a COMPLIANT determination while the item's latest non-WITHDRAWN analysis is not CERTIFIED."
  - id: ERR_STRINGENCY_CONTRADICTS_EVIDENCE
    http: 409
    condition: "COMPLIANT requested while the recomputed stringency_in_operation_index >= 5.0, or VIOLATION requested while it is < 5.0."
  - id: ERR_MH_BENEFITS_NOT_COVERED
    http: 409
    condition: "Inventorying an NQTL in a classification whose mh_su_benefits_covered is false."
  - id: ERR_DUPLICATE_NQTL_ITEM
    http: 409
    condition: "An NqtlItem with status != REMEDIATED already exists for the same (plan_year_id, classification_id, nqtl_type)."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "Reopening an analysis whose revision_round has already reached MAX_REVISION_ROUNDS (3)."
  # --- temporal ---
  - id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http: 409
    condition: "A new classification's closed measurement period touches, overlaps, or sits within one day of an existing period for the same (plan_year_id, benefit_category, network_tier, sub_classification)."
  - id: ERR_PRODUCTION_WINDOW_OVERLAP
    http: 409
    condition: "A new vendor request's half-open [issued_at, due_at) window overlaps that of an OPEN or PARTIAL request for the same (administrator_id, plan_year_id)."
  - id: ERR_NOT_YET_OVERDUE
    http: 409
    condition: "Escalating to NOTICE_SENT at or before due_at, or to BREACH_DECLARED at or before due_at + 7 days."
  - id: ERR_RESPONSE_WINDOW_EXPIRED
    http: 409
    condition: "Responding to a regulator request after response_due_at."
  - id: ERR_NO_REQUESTED_ITEMS
    http: 409
    condition: "Responding to a regulator request whose demanded NQTL types match no inventoried item (requested_item_count would be 0)."
  # --- fiscal ---
  - id: ERR_LIABILITY_CAP_EXCEEDED
    http: 409
    condition: "Approving a corrective action plan would push PlanYear.remediation_liability_cents above remediation_liability_cap_cents."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlanSponsor
    description: "Employer plan-sponsor staff. Owns the plan design surface, issues contractual production requests to the TPA, drafts comparative analyses and answers the regulator."
    identity: opaque
    exclusive_operations:
      - "POST /parity/administrators"
      - "POST /parity/plan-years"
      - "POST /parity/plan-years/{id}/classifications"
      - "POST /parity/vendor-requests"
      - "POST /parity/vendor-requests/{id}/escalate"
      - "POST /parity/regulator-requests/{id}/respond"
    shared_operations:
      - "POST /parity/classifications/{id}/treatment-limitations (with Administrator)"
      - "POST /parity/classifications/{id}/parity-tests (with ComplianceOfficer)"
      - "POST /parity/nqtl-items (with ComplianceOfficer)"
      - "POST /parity/comparative-analyses, .../submit, .../reopen (with Administrator)"
      - "POST /parity/corrective-action-plans (with ComplianceOfficer)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint"
  - name: Administrator
    description: "Third-party administrator staff. Produces the requested data and analyses, records the limitation levels it administers, and may draft and submit comparative analyses on the sponsor's behalf."
    identity: "entity_backed:Administrator"
    exclusive_operations:
      - "POST /parity/vendor-requests/{id}/data-submissions"
    shared_operations:
      - "POST /parity/classifications/{id}/treatment-limitations (with PlanSponsor)"
      - "POST /parity/comparative-analyses, .../submit, .../reopen (with PlanSponsor)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint"
  - name: ComplianceOfficer
    description: "Independent compliance reviewer. Certifies comparative analyses, records parity determinations and decides corrective action plans. Segregation of duties forbids certifying an analysis this user authored or approving a corrective plan for a violation this user determined."
    identity: opaque
    exclusive_operations:
      - "POST /parity/comparative-analyses/{id}/review"
      - "POST /parity/nqtl-items/{id}/determinations"
      - "POST /parity/corrective-action-plans/{id}/decision"
      - "POST /parity/corrective-action-plans/{id}/closure"
    shared_operations:
      - "POST /parity/classifications/{id}/parity-tests (with PlanSponsor)"
      - "POST /parity/nqtl-items (with PlanSponsor)"
      - "POST /parity/corrective-action-plans (with PlanSponsor)"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint"
  - name: Regulator
    description: "State or federal regulator. Opens requests for the plan year's comparative analyses and adjudicates the sponsor's response; has read access to everything but may not author plan data."
    identity: opaque
    exclusive_operations:
      - "POST /parity/regulator-requests"
      - "POST /parity/regulator-requests/{id}/adjudicate"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint"
