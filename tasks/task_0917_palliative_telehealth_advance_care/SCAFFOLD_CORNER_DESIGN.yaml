            - "SymptomAssessment.${sa_2_id}.distress_score == 40"
            - "SymptomAssessment.${sa_2_id}.severity_tier == MODERATE"

      - name: logical_clock_defaults_to_the_declared_startup_instant
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - entities.Patient.fields.created_at
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z, so the first created row is stamped 2026-05-01T00:00:00.000Z rather than real wall-clock time."
        test_recipe:
