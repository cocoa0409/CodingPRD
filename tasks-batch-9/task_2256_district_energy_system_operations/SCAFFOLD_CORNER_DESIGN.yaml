      - name: register_reads_must_advance_and_a_variant_needs_two_admissible_reads
        claim_type: Violation → Error
        grounds:
          - validations[priority 14 ERR_READING_NOT_MONOTONIC]
          - validations[priority 16 ERR_INSUFFICIENT_METER_DATA]
          - calculations.invoice_billing_determinants
        distinguishing_aspect: "Admissibility is variant-dependent: with one ACTUAL read and one ESTIMATED read in the period, an ACTUAL_TRUE_UP invoice sees only one row and returns 422 ERR_INSUFFICIENT_METER_DATA while an ESTIMATED invoice over the identical period succeeds at 3.000 MWh; separately, a read that goes backwards in energy and a read that repeats an existing read_at are both refused with ERR_READING_NOT_MONOTONIC."
