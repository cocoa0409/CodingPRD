            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { se1: $.data.id } }
