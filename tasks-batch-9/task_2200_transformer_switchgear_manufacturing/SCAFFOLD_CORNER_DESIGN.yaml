            - "GET /long-lead-components/${component_id} as MaterialsPlanner shows quantity_reserved == 5, quantity_committed == 0, quantity_available == 0."
            - "data.preempted_for_allocation_id is null and data.release_penalty_cents == 0."

      - name: bay_occupation_window_end_includes_changeover_buffer_inside_the_window
        claim_type: correct_result
        grounds:
          - calculations.bay_occupation_window
          - endpoints[schedule_factory_acceptance_test]
