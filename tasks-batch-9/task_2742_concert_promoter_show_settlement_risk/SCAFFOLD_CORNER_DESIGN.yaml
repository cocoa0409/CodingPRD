            - call: "GET /budget-lines/${cc_blx_id}"
              payload: {}
              as: TourAccountant
            - call: "GET /budget-lines/${cc_bly_id}"
              payload: {}
              as: TourAccountant
            - call: "GET /shows/${cc_shx_id}"
              payload: {}
              as: TourAccountant
            - call: "GET /shows/${cc_shy_id}"
              payload: {}
              as: TourAccountant
            - call: "GET /ticket-tiers/${cc_ttx_id}"
              payload: {}
              as: TalentBuyer
            - call: "GET /ticket-tiers/${cc_tty_id}"
              payload: {}
              as: TalentBuyer
            - call: "POST /cancellation-events/${cc_cex_id}/process-refunds"
