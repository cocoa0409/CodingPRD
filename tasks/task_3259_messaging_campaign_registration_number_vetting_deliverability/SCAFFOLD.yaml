# =============================================================================
# SCAFFOLD — Messaging Campaign Registration, Number Vetting & Deliverability
# =============================================================================

scenario: |
  Messaging Campaign Registration, Number Vetting & Deliverability (Twilio): brand registration with business identity verification and campaign registration describing message use case and sample content, ten-digit long code, toll-free and short code path selection with throughput and vetting differences, carrier approval workflows with rejection reasons and resubmission, consent record requirements with opt-in evidence retention and opt-out keyword handling, throughput allocation and message queuing with carrier filtering and error code interpretation, deliverability monitoring with block and spam complaint feedback, number provisioning, porting and geographic requirements, per-message and per-registration fee pass-through

domain_name: messaging-deliverability
api_prefix: /messaging

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer organization display name" }
      - { name: plan_tier, type: enum, source: input, description: "STANDARD | PREMIUM — gates geographic reach (short codes) and provisioning authority" }
      - { name: country_code, type: enum, source: input, description: "ISO country of operation: US | CA | GB — drives number-path availability and short-code geo restriction" }
      - { name: suspend_reason, type: string, source: system, default: "", description: "Populated on compliance suspend; emptied on reinstate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Brand
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: legal_name, type: string, source: input, description: "Registered legal business name" }
      - { name: tax_id, type: string, source: input, description: "Business tax identifier (EIN / company number)" }
      - { name: business_type, type: enum, source: input, description: "PRIVATE_PROFIT | PUBLIC_PROFIT | NON_PROFIT | SOLE_PROPRIETOR" }
      - { name: address_line1, type: string, source: input, description: "Registered business address line 1" }
      - { name: city, type: string, source: input, description: "Registered business city" }
      - { name: region_code, type: string, source: input, description: "State/province code, must match country_code format" }
      - { name: postal_code, type: string, source: input, description: "Postal/ZIP code" }
      - { name: country_code, type: enum, source: input, description: "US | CA | GB — must equal Account.country_code at create" }
      - { name: website_url, type: string, source: input, description: "Public web presence used in identity vetting" }
      - { name: opt_in_mechanism, type: enum, source: input, description: "WEB_FORM | KEYWORD | PAPER_FORM | POINT_OF_SALE — drives consent evidence requirements" }
      - { name: identity_score, type: integer, source: system, description: "0-100 vetting score assigned by verification; gates toll-free send eligibility", default: 0 }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Number of failed verification rounds completed" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_VERIFICATION | UNVERIFIED | VERIFIED | REVOKED" }

  - name: Campaign
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id; brand must be VERIFIED to submit" }
      - { name: use_case, type: enum, source: input, description: "MARKETING | TRANSACTIONAL | MIXED | ACCOUNT_NOTIFICATION | LOW_VOLUME_MIXED" }
      - { name: description, type: string, source: input, description: "Free-text campaign description of message flow" }
      - { name: sample_messages, type: array, source: input, description: "1-5 sample message strings reviewed by carriers" }
      - { name: help_message, type: string, source: input, description: "Required HELP reply text" }
      - { name: stop_message, type: string, source: input, description: "Required STOP reply text" }
      - { name: path_kind, type: enum, source: input, description: "TEN_DLC | TOLL_FREE | SHORT_CODE — throughput/vetting profile chosen at registration" }
      - { name: trust_score, type: integer, source: system, default: 0, description: "0-100; set from brand identity_score on TEN_DLC submission; recomputed per DailySnapshot" }
      - { name: allocated_mps, type: integer, source: system, default: 0, description: "Approved throughput ceiling (messages/sec) for this campaign" }
      - { name: rejection_reason_code, type: string, source: system, default: "", description: "Carrier rejection code recorded on last REJECTED transition" }
      - { name: rejected_cycle_count, type: integer, source: system, default: 0, description: "Count of completed rejection cycles (incremented on each REJECTED transition)" }
      - { name: recurring_fee_last_charge_at, type: datetime, source: system, default: null, description: "Timestamp of last monthly recurring fee charge; drives recurring billing in run_ops" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | REJECTED | APPROVED | SUSPENDED | DEACTIVATED" }

  - name: SenderNumber
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: campaign_id, type: string, source: system, default: "", description: "FK -> Campaign.id; empty while UNATTACHED" }
      - { name: e164, type: string, source: system, description: "Normalized E.164 address derived from phone_number" }
      - { name: phone_number, type: string, source: input, description: "Requested or ported number in national or E.164 form" }
      - { name: number_type, type: enum, source: input, description: "TEN_DLC | TOLL_FREE | SHORT_CODE" }
      - { name: country_code, type: enum, source: input, description: "US | CA | GB — number's home geography" }
      - { name: provisioning_source, type: enum, source: system, description: "NEW_PURCHASE | PORT_IN | SHORT_CODE_ORDER" }
      - { name: port_phone_number, type: string, source: input, description: "Present only when provisioning_source is PORT_IN; the existing external number being ported" }
      - { name: port_letter_of_agency, type: string, source: input, description: "LOA document reference required for PORT_IN" }
      - { name: port_losing_carrier, type: string, source: input, description: "Current carrier name required for PORT_IN" }
      - { name: base_mps, type: integer, source: computed, default: 0, description: "Throughput from number_type constant table; SHORT_CODE ignores campaign tier" }
      - { name: suspended_reason, type: string, source: system, default: "", description: "Reason stamped when number is suspended (campaign cascade or spam floor breach)" }
      - { name: port_requested_at, type: datetime, source: system, default: null, description: "Timestamp when PORT_IN request was submitted" }
      - { name: status, type: enum, source: system, description: "PENDING | PORTING | ACTIVE | SUSPENDED | FAILED | RELEASED" }

  - name: ConsentRecord
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: brand_id, type: string, source: input, description: "FK -> Brand.id — consent scopes to one brand's messaging program" }
      - { name: phone_number, type: string, source: input, description: "Subscriber phone number in E.164" }
      - { name: evidence_url, type: string, source: input, description: "URI of retained opt-in evidence artifact" }
      - { name: evidence_text, type: string, source: input, description: "Human-readable description of opt-in capture" }
      - { name: captured_at, type: datetime, source: input, description: "When consent was captured; must be >= brand verified_at when consent_method is POST_BRAND" }
      - { name: retention_expires_at, type: datetime, source: computed, description: "= captured_at + CONSENT_RETENTION_DAYS; evidence must be retained until this instant" }
      - { name: consent_method, type: enum, source: input, description: "WEB_FORM | KEYWORD | PAPER_FORM | POINT_OF_SALE | POST_BRAND" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Set when opt-out is recorded; not null means revoked" }
      - { name: revoked_by_keyword, type: string, source: system, default: "", description: "STOP keyword variant that revoked consent, when applicable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: Message
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id — sending campaign" }
      - { name: sender_number_id, type: string, source: input, description: "FK -> SenderNumber.id — originating number, must be attached to campaign" }
      - { name: to_number, type: string, source: input, description: "Destination subscriber in E.164" }
      - { name: consent_record_id, type: string, source: system, description: "FK -> ConsentRecord.id; resolved at send acceptance as the ACTIVE consent for (campaign brand, to_number)" }
      - { name: body, type: string, source: input, description: "Message text, 1-1600 chars" }
      - { name: carrier_code, type: enum, source: input, description: "ATT | TMO | VZW | ROGERS | EE — carrier simulated for this send" }
      - { name: segments, type: integer, source: computed, description: "GSM-7 vs UCS-2 segment count derived from body encoding" }
      - { name: queued_at, type: datetime, source: system, default: null, description: "Timestamp message entered QUEUED state" }
      - { name: queued_run_index, type: integer, source: system, default: 0, description: "OpsRun.run_index value when message became QUEUED; staleness measured against this" }
      - { name: failed_error_code, type: string, source: system, default: "", description: "Carrier error code on FAILED transition (e.g. E30034)" }
      - { name: status, type: enum, source: system, description: "ACCEPTED | QUEUED | SENT | DELIVERED | UNDELIVERED | FAILED | FILTERED | STALE_CANCELLED" }

  - name: FeedbackEvent
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id — campaign the feedback accrues to" }
      - { name: message_id, type: string, source: input, description: "FK -> Message.id — message that triggered the event; required for BLOCK/SPAM_COMPLAINT, empty for STOP" }
      - { name: kind, type: enum, source: input, description: "BLOCK | SPAM_COMPLAINT | STOP" }
      - { name: keyword, type: string, source: input, description: "Required when kind=STOP: the opt-out keyword the subscriber sent" }
      - { name: to_number, type: string, source: input, description: "Required when kind=STOP: subscriber number whose consent is revoked" }
      - { name: status, type: enum, source: system, description: "RECORDED | APPLIED" }

  - name: Charge
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: kind, type: enum, source: system, description: "BRAND_VETTING | CAMPAIGN_REGISTRATION | CAMPAIGN_RECURRING | MESSAGE | CARRIER_PASSTHROUGH | NUMBER_MONTHLY" }
      - { name: reference_type, type: enum, source: system, description: "BRAND | CAMPAIGN | MESSAGE | NUMBER — which entity accrued the charge" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic reference: id of the accruing Brand/Campaign/Message/SenderNumber" }
      - { name: amount_cents, type: integer, source: computed, description: "Fee amount per fee schedule; negative values not permitted" }
      - { name: currency, type: enum, source: system, default: "USD", description: "USD only for this benchmark" }
      - { name: status, type: enum, source: system, description: "RECORDED | SETTLED" }

  - name: DailySnapshot
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: day_utc, type: string, source: input, description: "UTC calendar day YYYY-MM-DD this snapshot covers" }
      - { name: attempted, type: integer, source: computed, description: "Messages with status in terminal-send set {SENT, DELIVERED, UNDELIVERED, FILTERED, FAILED} created on day_utc for this campaign" }
      - { name: delivered, type: integer, source: computed, description: "Subset of attempted with status DELIVERED" }
      - { name: blocked, type: integer, source: computed, description: "Count of BLOCK FeedbackEvents on day_utc for this campaign" }
      - { name: spam, type: integer, source: computed, description: "Count of SPAM_COMPLAINT FeedbackEvents on day_utc for this campaign" }
      - { name: delivery_rate_pct, type: number, source: computed, description: "100 * delivered / attempted; null-safe = 0 when attempted == 0" }
      - { name: block_rate_bps, type: number, source: computed, description: "floor(10000 * blocked / attempted); 0 when attempted == 0" }
      - { name: spam_rate_bps, type: number, source: computed, description: "floor(10000 * spam / attempted); 0 when attempted == 0" }

  - name: OpsRun
    parent: Account
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: run_index, type: integer, source: system, description: "Monotone counter per account; starts at 1 on first run_ops" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock timestamp of the run" }
      - { name: messages_dequeued, type: integer, source: computed, default: 0, description: "QUEUED messages drained this run" }
      - { name: messages_stale_cancelled, type: integer, source: computed, default: 0, description: "QUEUED messages marked STALE_CANCELLED this run" }
      - { name: recurring_fees_charged, type: integer, source: computed, default: 0, description: "CAMPAIGN_RECURRING charges emitted this run" }
      - { name: number_fees_charged, type: integer, source: computed, default: 0, description: "NUMBER_MONTHLY charges emitted this run" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /messaging/accounts/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "cascade_suspend_account applied to every child Campaign and SenderNumber"
          - "Account.suspend_reason recorded"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /messaging/accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "No automatic child restoration — campaigns remain SUSPENDED until ComplianceOfficer reactivates each one"
          - "Account.suspend_reason cleared"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /messaging/accounts/{id}/close"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Every ACTIVE/SUSPENDED SenderNumber transitions to RELEASED with suspended_reason='ACCOUNT_CLOSED'"
          - "Detached numbers are permanently detached (campaign_id cleared)"

  - entity: Brand
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: PENDING_VERIFICATION
        trigger: "POST /messaging/accounts/{id}/brands/{id}/submit"
        actor: BrandManager
        preconditions:
          - "All required brand fields present and non-empty (ERR_VALIDATION)"
          - "brand.country_code == account.country_code (ERR_VALIDATION)"
        side_effects:
          - "identity_score computed per identity_scoring rule"
          - "Charge BRAND_VETTING recorded (reference_type BRAND, reference_id = brand.id)"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /messaging/accounts/{id}/brands/{id}/verify"
        actor: CarrierReviewer
        preconditions:
          - "identity_score >= BRAND_VERIFY_MIN_SCORE (ERR_BRAND_SCORE_TOO_LOW)"
        side_effects:
          - "Brand may now back campaign submissions"
      - from: PENDING_VERIFICATION
        to: UNVERIFIED
        trigger: "POST /messaging/accounts/{id}/brands/{id}/fail"
        actor: CarrierReviewer
        preconditions: []
        side_effects:
          - "resubmission_count += 1"
          - "If resubmission_count >= MAX_RESUBMISSIONS: transition is forced to REVOKED instead (see note)"
        note: "fail from PENDING_VERIFICATION when resubmission_count+1 >= MAX_RESUBMISSIONS lands in REVOKED, not UNVERIFIED"
      - from: UNVERIFIED
        to: PENDING_VERIFICATION
        trigger: "POST /messaging/accounts/{id}/brands/{id}/submit"
        actor: BrandManager
        preconditions:
          - "resubmission_count < MAX_RESUBMISSIONS (ERR_BRAND_REVOKED would apply if at cap — unreachable from UNVERIFIED by construction)"
        side_effects:
          - "identity_score recomputed (same rule; resubmission does not change score)"
          - "New Charge BRAND_VETTING recorded (each submission round is billable)"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /messaging/accounts/{id}/brands/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Every APPROVED Campaign with brand_id == this brand transitions to SUSPENDED"
          - "cascade_suspend_campaign then applies to each of those campaigns"

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [DEACTIVATED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/submit"
        actor: CampaignManager
        preconditions:
          - "Brand.brand_id exists and brand.status == VERIFIED (ERR_BRAND_NOT_VERIFIED)"
          - "path_kind == TOLL_FREE requires brand.identity_score >= TOLL_FREE_MIN_SCORE (ERR_TOLLFREE_VETTING_INSUFFICIENT)"
          - "path_kind == SHORT_CODE requires account.plan_tier == PREMIUM and account.country_code == 'US' (ERR_SHORT_CODE_GEO) and campaign.use_case == 'MARKETING' (ERR_SHORT_CODE_USE_CASE)"
          - "description, help_message, stop_message non-empty; 1 <= len(sample_messages) <= 5 (ERR_VALIDATION)"
        side_effects:
          - "trust_score initialized per trust_score rule (TEN_DLC tiering or flat default)"
          - "allocated_mps computed per throughput_allocation rule"
          - "Charge CAMPAIGN_REGISTRATION recorded"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/approve"
        actor: CarrierReviewer
        preconditions: []
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/reject"
        actor: CarrierReviewer
        preconditions:
          - "rejection_reason_code must be in REJECTION_REASON_CODES (ERR_VALIDATION)"
        side_effects:
          - "rejection_reason_code recorded"
          - "rejected_cycle_count += 1"
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/submit"
        actor: CampaignManager
        preconditions:
          - "rejected_cycle_count < MAX_CAMPAIGN_RESUBMISSIONS (ERR_CAMPAIGN_RESUBMISSION_LIMIT)"
          - "Brand still VERIFIED (ERR_BRAND_NOT_VERIFIED)"
          - "path_kind still satisfies its gates (ERR_TOLLFREE_VETTING_INSUFFICIENT / ERR_SHORT_CODE_GEO / ERR_SHORT_CODE_USE_CASE)"
        side_effects:
          - "trust_score and allocated_mps recomputed"
          - "New Charge CAMPAIGN_REGISTRATION recorded (resubmission is billable)"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system (cascade from Brand.revoke or Account.suspend) OR POST /messaging/accounts/{id}/campaigns/{id}/suspend"
        actor: "system | ComplianceOfficer"
        preconditions: []
        side_effects:
          - "cascade_suspend_campaign applied: every SenderNumber attached to this campaign with status ACTIVE transitions to SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "Account.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "Brand.status == VERIFIED (ERR_BRAND_NOT_VERIFIED)"
        side_effects:
          - "SenderNumbers suspended purely by this campaign's cascade (suspended_reason == 'CAMPAIGN_SUSPENDED') return to ACTIVE; numbers suspended for other reasons stay SUSPENDED"
      - from: DRAFT
        to: DEACTIVATED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/deactivate"
        actor: CampaignManager
        preconditions:
          - "No SenderNumber attached with status ACTIVE (ERR_CAMPAIGN_NOT_DEACTIVATABLE)"
        side_effects: []
      - from: REJECTED
        to: DEACTIVATED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/deactivate"
        actor: CampaignManager
        preconditions:
          - "No SenderNumber attached with status ACTIVE (ERR_CAMPAIGN_NOT_DEACTIVATABLE)"
        side_effects: []
      - from: APPROVED
        to: DEACTIVATED
        trigger: "POST /messaging/accounts/{id}/campaigns/{id}/deactivate"
        actor: CampaignManager
        preconditions:
          - "No SenderNumber attached with status ACTIVE (ERR_CAMPAIGN_NOT_DEACTIVATABLE)"
        side_effects: []

  - entity: SenderNumber
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/activate"
        actor: NumberProvisioner
        preconditions:
          - "provisioning_source != PORT_IN (ERR_INVALID_STATE — porting numbers activate via complete_port)"
        side_effects: []
      - from: PENDING
        to: PORTING
        trigger: "system (automatic on create when provisioning_source == PORT_IN)"
        actor: system
        preconditions: []
        side_effects:
          - "port_requested_at stamped"
      - from: PORTING
        to: ACTIVE
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/complete_port"
        actor: NumberProvisioner
        preconditions: []
        side_effects: []
      - from: PORTING
        to: FAILED
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/fail_port"
        actor: NumberProvisioner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from campaign suspend, account suspend, or spam-floor breach)"
        actor: system
        preconditions: []
        side_effects:
          - "suspended_reason set to CAMPAIGN_SUSPENDED | ACCOUNT_SUSPENDED | SPAM_FLOOR_BREACH"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/reinstate OR system (campaign reactivate cascade when suspended_reason == CAMPAIGN_SUSPENDED)"
        actor: "NumberProvisioner | system"
        preconditions:
          - "Parent Campaign (if attached) status == APPROVED (ERR_CAMPAIGN_NOT_APPROVED)"
          - "Account.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
        side_effects:
          - "suspended_reason cleared"
      - from: PENDING
        to: RELEASED
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/release"
        actor: NumberProvisioner
        preconditions: []
        side_effects:
          - "If attached to a campaign: detach (campaign_id cleared)"
      - from: FAILED
        to: RELEASED
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/release"
        actor: NumberProvisioner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/release"
        actor: NumberProvisioner
        preconditions: []
        side_effects:
          - "If attached to a campaign: detach (campaign_id cleared)"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /messaging/accounts/{id}/numbers/{id}/release"
        actor: NumberProvisioner
        preconditions: []
        side_effects:
          - "If attached to a campaign: detach (campaign_id cleared)"

  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /messaging/accounts/{id}/consent_records/{id}/revoke OR system (STOP keyword FeedbackEvent on matching brand_id + phone_number)"
        actor: "BrandManager | system"
        preconditions: []
        side_effects:
          - "revoked_at stamped; revoked_by_keyword recorded when revoked via STOP keyword"
          - "Subsequent sends to this phone_number from this brand are rejected with ERR_NO_CONSENT"

  - entity: Message
    initial_state: ACCEPTED
    terminal_states: [DELIVERED, UNDELIVERED, FAILED, FILTERED, STALE_CANCELLED]
    transitions:
      - from: ACCEPTED
        to: QUEUED
        trigger: "system (immediately after send acceptance)"
        actor: system
        preconditions: []
        side_effects:
          - "queued_at stamped; queued_run_index = current account OpsRun.run_index (0 if none)"
      - from: QUEUED
        to: SENT
        trigger: "system (drain inside POST /messaging/accounts/{id}/run_ops)"
        actor: system
        preconditions: []
        side_effects:
          - "Charge MESSAGE + Charge CARRIER_PASSTHROUGH recorded (per message_fee rule; reference_type MESSAGE, reference_id = message.id)"
      - from: QUEUED
        to: FILTERED
        trigger: "system (drain inside run_ops when simulated carrier filtering applies per carrier_filtering rule)"
        actor: system
        preconditions: []
        side_effects:
          - "Charge MESSAGE only (no carrier passthrough for filtered messages)"
      - from: QUEUED
        to: STALE_CANCELLED
        trigger: "system (run_ops when current run_index - queued_run_index >= STALE_QUEUE_RUNS)"
        actor: system
        preconditions: []
        side_effects:
          - "No charges recorded for stale-cancelled messages"
      - from: SENT
        to: DELIVERED
        trigger: "POST /messaging/accounts/{id}/messages/{id}/delivery_outcome with outcome=DELIVERED"
        actor: SystemDriver
        preconditions: []
        side_effects: []
      - from: SENT
        to: UNDELIVERED
        trigger: "POST /messaging/accounts/{id}/messages/{id}/delivery_outcome with outcome=UNDELIVERED"
        actor: SystemDriver
        preconditions: []
        side_effects: []
      - from: SENT
        to: FAILED
        trigger: "POST /messaging/accounts/{id}/messages/{id}/delivery_outcome with outcome=FAILED"
        actor: SystemDriver
        preconditions:
          - "error_code in payload must be in CARRIER_ERROR_CODES (ERR_VALIDATION)"
        side_effects:
          - "failed_error_code recorded"
      - from: FAILED
        to: ACCEPTED
        trigger: "POST /messaging/accounts/{id}/messages/{id}/retry"
        actor: CampaignManager
        preconditions:
          - "failed_error_code is in RETRYABLE_ERROR_CODES (ERR_MESSAGE_NOT_RETRYABLE)"
        side_effects:
          - "Consent re-validated at retry time (ERR_NO_CONSENT if since revoked)"
          - "Throughput re-validated at retry time (ERR_THROUGHPUT_EXCEEDED if campaign cap now exceeded)"
      - from: ACCEPTED
        to: QUEUED
        trigger: "system (post-retry re-queue)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: STALE_CANCELLED
        trigger: "POST /messaging/accounts/{id}/messages/{id}/cancel"
        actor: CampaignManager
        preconditions: []
        side_effects:
          - "Message + carrier passthrough charges from the original send remain settled (no refund)"

  - entity: FeedbackEvent
    initial_state: RECORDED
    terminal_states: [APPLIED]
    transitions:
      - from: RECORDED
        to: APPLIED
        trigger: "system (same request that records the event applies its effects)"
        actor: system
        preconditions: []
        side_effects:
          - "kind == STOP: matching ConsentRecord (same brand_id + phone_number, status ACTIVE) transitions to REVOKED with revoked_by_keyword = keyword"
          - "kind == BLOCK or SPAM_COMPLAINT: accrues to DailySnapshot counters for the campaign/day; spam-floor and suspension checks re-evaluated"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: campaign-resubmit-stale-version
    parent_entity: Campaign
    write_endpoint: "POST /messaging/accounts/{id}/campaigns/{id}/submit"
    occ_field: "expected_campaign_version"
    description: |
      Resubmitting a REJECTED campaign while the client's observed campaign
      version is stale (e.g. another reviewer action or a prior resubmit has
      already advanced Campaign.version) is rejected with 412. This captures
      CREATE-with-supersede semantics: a resubmission legitimately replaces
      the prior review cycle, so a stale view of the campaign is a true
      conflict, not a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: number-attach-stale-version
    parent_entity: Campaign
    write_endpoint: "POST /messaging/accounts/{id}/numbers/{id}/attach"
    occ_field: "expected_campaign_version"
    description: |
      Attaching a number to a campaign whose version has advanced since the
      client last read it is rejected with 412. Attachment mutates the
      campaign's sender pool, so a stale campaign view would silently bind the
      number to an outdated throughput/vetting profile.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: identity_scoring
    trigger: "Brand submit (DRAFT->PENDING_VERIFICATION and UNVERIFIED->PENDING_VERIFICATION)"
    algorithm: weighted_scoring
    formula: |
      base = 50
      +10 if website_url is non-empty
      +10 if business_type == PUBLIC_PROFIT
      +5  if business_type == NON_PROFIT
      -20 if business_type == SOLE_PROPRIETOR
      +10 if tax_id matches ^\d{2}-\d{7}$
      +10 if postal_code matches country format (US: ^\d{5}$, CA: ^[A-Z]\d[A-Z]\d[A-Z]\d$, GB: ^[A-Z]{1,2}\d[A-Z\d]? \d[A-Z]{2}$)
      +5  if opt_in_mechanism in {WEB_FORM, POINT_OF_SALE}
      identity_score = clamp(base, 0, 100)
      Evaluation order: additive terms first (in listed order), clamp LAST.
    constants:
      BRAND_VERIFY_MIN_SCORE: 60
      TOLL_FREE_MIN_SCORE: 75
    precision: "integer score, no rounding needed"

  - name: throughput_allocation
    trigger: "Campaign submit; also re-derived reads on campaign GET"
    algorithm: tiered_pricing
    formula: |
      if path_kind == SHORT_CODE:
        allocated_mps = SHORT_CODE_MPS                      # 100, ignores trust_score
      elif path_kind == TOLL_FREE:
        allocated_mps = TOLL_FREE_MPS                       # 3 flat, gated at submit
      else:  # TEN_DLC tiered on trust_score
        if trust_score >= 75: allocated_mps = 10
        elif trust_score >= 50: allocated_mps = 3
        elif trust_score >= 25: allocated_mps = 1
        else: allocated_mps = 0   # cannot send
      Boundary is INCLUSIVE of the tier minimum: score exactly 75 -> tier 10, not 3.
    constants:
      SHORT_CODE_MPS: 100
      TOLL_FREE_MPS: 3
    variants:
      - name: flat_paths
        when: "path_kind is TOLL_FREE or SHORT_CODE"
        difference: "constant throughput; trust_score ignored entirely"
      - name: tiered_ten_dlc
        when: "path_kind == TEN_DLC"
        difference: "trust_score-tiered throughput with inclusive tier boundaries"

  - name: trust_score
    trigger: "Campaign submit; recomputed by DailySnapshot creation"
    algorithm: decay_function
    formula: |
      Initial (on submit):
        if path_kind == TEN_DLC: trust_score = brand.identity_score
        else: trust_score = TRUST_SCORE_DEFAULT (50)
      Recompute (on each DailySnapshot for this campaign, chronological by day_utc):
        raw = trust_score
          - 5  if snapshot.block_rate_bps >= BLOCK_PENALTY_BPS (300)
          - 15 if snapshot.spam_rate_bps >= SPAM_PENALTY_BPS (100)
          + 2  if snapshot.attempted >= GOOD_DAY_MIN_ATTEMPTED (1000) and snapshot.spam_rate_bps < SPAM_PENALTY_BPS
        trust_score = clamp(raw, 0, 100)
      Recompute ordering: penalties applied before the good-day bonus; clamp last.
      No snapshot for a day => no adjustment that day.
    constants:
      TRUST_SCORE_DEFAULT: 50
      BLOCK_PENALTY_BPS: 300
      SPAM_PENALTY_BPS: 100
      GOOD_DAY_MIN_ATTEMPTED: 1000

  - name: snapshot_metrics
    trigger: "POST /messaging/accounts/{id}/campaigns/{id}/snapshots"
    algorithm: aggregation
    formula: |
      attempted = count(Message where campaign_id == this, date(created_at) == day_utc,
                       status IN {SENT, DELIVERED, UNDELIVERED, FILTERED, FAILED})
      delivered = count(same set, status == DELIVERED)
      blocked   = count(FeedbackEvent where campaign_id == this, date(created_at) == day_utc, kind == BLOCK)
      spam      = count(FeedbackEvent where campaign_id == this, date(created_at) == day_utc, kind == SPAM_COMPLAINT)
      if attempted == 0:
        delivery_rate_pct = 0; block_rate_bps = 0; spam_rate_bps = 0
      else:
        delivery_rate_pct = round_half_up(100 * delivered / attempted, 2)
        block_rate_bps = floor(10000 * blocked / attempted)
        spam_rate_bps  = floor(10000 * spam / attempted)
      QUEUED / ACCEPTED / STALE_CANCELLED messages are EXCLUDED from attempted.
    precision: "delivery_rate_pct 2dp round_half_up; bps values integer floor"

  - name: spam_floor_check
    trigger: "DailySnapshot creation (after trust_score recompute)"
    algorithm: threshold
    formula: |
      if snapshot.attempted >= SPAM_FLOOR_MIN_VOLUME (2000)
         and snapshot.spam_rate_bps >= SPAM_FLOOR_BPS (300):
        campaign -> SUSPENDED (reason SPAM_FLOOR)
        cascade_suspend_campaign applies to attached ACTIVE numbers (suspended_reason='SPAM_FLOOR_BREACH')
      Boundary INCLUSIVE on both volume and rate: attempted == 2000 with spam_rate_bps == 300 suspends.
    constants:
      SPAM_FLOOR_BPS: 300
      SPAM_FLOOR_MIN_VOLUME: 2000

  - name: carrier_filtering
    trigger: "Message drain inside run_ops"
    algorithm: constraint_propagation
    formula: |
      Filtered probability is deterministic by carrier_code + path profile:
        A message is FILTERED at drain if
          (path_kind == TEN_DLC and carrier_code == 'ATT' and len(body) > 160)
          OR (carrier_code == 'TMO' and body contains substring 'FREE')
          OR (number_type == TOLL_FREE and brand.identity_score < TOLL_FREE_MIN_SCORE)   # unreachable via gated submit, kept for ported legacy numbers
      All other drained messages become SENT.
      Filter evaluation happens BEFORE charge recording so FILTERED messages incur no carrier passthrough.

  - name: segments_and_fee
    trigger: "Message acceptance (segments) and drain (fees)"
    algorithm: tiered_pricing
    formula: |
      Encoding: body is GSM-7 iff every char is in GSM7_BASIC; otherwise UCS-2.
      segments = ceil(len(body) / 160) if GSM-7 else ceil(len(body) / 70); minimum 1.
      message_charge_cents = segments * MESSAGE_FEE_PER_SEGMENT_CENTS
      carrier_charge_cents = segments * CARRIER_FEE_PER_SEGMENT_CENTS[carrier_code]
      PINNED ORDER: compute segments per message FIRST, then multiply by per-segment
      rates, then sum to cents — never average rate times total segments.
      Round: amounts are integer cents by construction; no rounding performed.
    constants:
      MESSAGE_FEE_PER_SEGMENT_CENTS: 75
      CARRIER_FEE_PER_SEGMENT_CENTS: { ATT: 40, TMO: 35, VZW: 45, ROGERS: 50, EE: 55 }
    variants:
      - name: per_message_fee
        when: "segments <= 3"
        difference: "single sum at the pinned per-segment order above"
      - name: long_message_fee
        when: "segments > 3"
        difference: "surcharge of LONG_MESSAGE_SURCHARGE_CENTS added ONCE per message after the per-segment sum"
    constants_note: "LONG_MESSAGE_SURCHARGE_CENTS: 50"

  - name: registration_fees
    trigger: "Brand submit; Campaign submit; run_ops recurring pass"
    algorithm: chronological
    formula: |
      On each Brand submit round:   Charge BRAND_VETTING         = BRAND_VETTING_FEE_CENTS (200)
      On each Campaign submit round: Charge CAMPAIGN_REGISTRATION = CAMPAIGN_REGISTRATION_FEE_CENTS (1500)
      In each run_ops (chronological, processing campaigns by created_at ASC):
        For each APPROVED campaign:
          if recurring_fee_last_charge_at is null (first run since approval)
             OR current clock >= recurring_fee_last_charge_at + RECURRING_FEE_PERIOD_DAYS days:
            Charge CAMPAIGN_RECURRING = CAMPAIGN_RECURRING_FEE_CENTS (1000)
            recurring_fee_last_charge_at = clock now
        For each SenderNumber with status in {ACTIVE, SUSPENDED} (suspended numbers still billed):
          if number became ACTIVE at least NUMBER_FEE_PERIOD_DAYS before now
             and no NUMBER_MONTHLY charge exists for this number within the trailing NUMBER_FEE_PERIOD_DAYS:
            Charge NUMBER_MONTHLY = NUMBER_MONTHLY_FEE_CENTS[number_type]
      Campaign recurring fee is keyed on the trailing window from recurring_fee_last_charge_at,
      NOT on calendar months — two runs 30+ days apart each charge exactly once.
    constants:
      BRAND_VETTING_FEE_CENTS: 200
      CAMPAIGN_REGISTRATION_FEE_CENTS: 1500
      CAMPAIGN_RECURRING_FEE_CENTS: 1000
      RECURRING_FEE_PERIOD_DAYS: 30
      NUMBER_MONTHLY_FEE_CENTS: { TEN_DLC: 200, TOLL_FREE: 300, SHORT_CODE: 100000 }
      NUMBER_FEE_PERIOD_DAYS: 30

  - name: cascade_suspend_account
    trigger: "Account.suspend transition"
    algorithm: constraint_propagation
    formula: |
      For each Campaign of this account with status == APPROVED (order: created_at ASC):
        campaign -> SUSPENDED
        For each SenderNumber with campaign_id == campaign.id and status == ACTIVE:
          number -> SUSPENDED, suspended_reason='ACCOUNT_SUSPENDED'
      Numbers attached to non-APPROVED campaigns and UNATTACHED numbers are untouched.

  - name: cascade_suspend_campaign
    trigger: "Campaign -> SUSPENDED (any cause)"
    algorithm: constraint_propagation
    formula: |
      For each SenderNumber with campaign_id == this campaign and status == ACTIVE
      (order: created_at ASC):
        number -> SUSPENDED
        suspended_reason = 'CAMPAIGN_SUSPENDED' when trigger is campaign suspend/revoke/account cascade
        suspended_reason = 'SPAM_FLOOR_BREACH' when trigger is spam_floor_check

  - name: queue_drain
    trigger: "run_ops"
    algorithm: waterfall_allocation
    formula: |
      For each campaign with status == APPROVED (order: created_at ASC):
        capacity = campaign.allocated_mps * DRAIN_SECONDS_PER_RUN (60)
        candidates = messages QUEUED for this campaign, ordered queued_at ASC, tie-break created_at ASC
        drain up to capacity candidates:
          carrier_filtering decides SENT vs FILTERED per message; charges per segments_and_fee
        remaining QUEUED messages stay queued
      After per-campaign drains, staleness sweep:
        any still-QUEUED message with (run_index - queued_run_index) >= STALE_QUEUE_RUNS (3)
        -> STALE_CANCELLED
      A message queued during run N can be drained in run N+1 (it was not a candidate of run N).
    constants:
      DRAIN_SECONDS_PER_RUN: 60
      STALE_QUEUE_RUNS: 3

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints
  - priority: 3
    category: existence
    check: "Path ids exist and nest correctly (account -> brand/campaign/number/consent/message), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: business_safety
    check: "Account gate: non-read endpoints rejected when account.status == SUSPENDED (ERR_ACCOUNT_SUSPENDED) or CLOSED (ERR_ACCOUNT_CLOSED)"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: all mutating endpoints except account reinstate/close and reads
  - priority: 5
    category: business_safety
    check: "Compliance gate for sends: campaign must be APPROVED (ERR_CAMPAIGN_NOT_APPROVED); sender number must be ACTIVE and attached to the campaign (ERR_NUMBER_NOT_ATTACHED / ERR_INVALID_STATE)"
    error_id: ERR_CAMPAIGN_NOT_APPROVED
    http_status: 409
    applies_to: "POST messages, POST messages/{id}/retry"
  - priority: 6
    category: business_safety
    check: "Consent gate for sends: an ACTIVE ConsentRecord must exist for (brand of campaign, to_number) (ERR_NO_CONSENT)"
    error_id: ERR_NO_CONSENT
    http_status: 409
    applies_to: "POST messages, POST messages/{id}/retry"
  - priority: 7
    category: state
    check: "Entity in valid from-state for the requested transition (includes ERR_BRAND_REVOKED for revoked brands, ERR_MESSAGE_NOT_RETRYABLE for non-retryable error codes)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 8
    category: business_constraint
    check: "Throughput gate: on send, count of messages for this campaign created within the trailing 1 second of logical clock must be < campaign.allocated_mps; at exactly allocated_mps the send is rejected"
    error_id: ERR_THROUGHPUT_EXCEEDED
    http_status: 429
    applies_to: "POST messages, POST messages/{id}/retry"
  - priority: 9
    category: business_referential
    check: "Brand gates on campaign submit: brand VERIFIED, toll-free score gate, short-code tier/geo/use-case gates, resubmission caps"
    error_id: ERR_BRAND_NOT_VERIFIED
    http_status: 409
    applies_to: "campaign submit"
  - priority: 10
    category: business_temporal
    check: "Temporal overlap: on attach, campaign must not already have an ACTIVE number of the same number_type (ERR_NUMBER_TYPE_OCCUPIED). On send, recipient number must not already have an in-flight (QUEUED) message from this campaign (ERR_RECIPIENT_BUSY)"
    error_id: ERR_NUMBER_TYPE_OCCUPIED
    http_status: 409
    applies_to: "number attach, message send"
  - priority: 11
    category: business_constraint
    check: "Porting prerequisites: PORT_IN numbers must supply port_phone_number, port_letter_of_agency, port_losing_carrier; the number's country must match account country"
    error_id: ERR_PORT_REQUIREMENTS
    http_status: 422
    applies_to: "number create with provisioning_source PORT_IN"
  - priority: 12
    category: business_constraint
    check: "Geography: SHORT_CODE numbers only provisionable for US accounts; short code campaigns only on US PREMIUM accounts"
    error_id: ERR_SHORT_CODE_GEO
    http_status: 422
    applies_to: "number create, campaign submit"
  - priority: 13
    category: business_fiscal
    check: "Fiscal last: number release with unsettled NUMBER_MONTHLY charge younger than 30 days is allowed but immediately bills a final NUMBER_MONTHLY charge"
    error_id: ERR_FEE_SCHEDULE
    http_status: 422
    applies_to: "run_ops fee pass (internal), never a client-visible rejection path for release"
  - priority: 14
    category: business_constraint
    check: "Field shape validation (required fields present, enum membership, formats, sample_messages length 1-5, body 1-1600 chars)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all mutating endpoints
  - priority: 15
    category: business_constraint
    check: "OCC: expected_campaign_version present on guarded endpoints and equal to current Campaign.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "campaign submit (resubmit path), number attach"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- utility / clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and the logical clock never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Account ---
  - method: POST
    path: "/messaging/accounts"
    description: "Create an Account"
    roles: [PlatformAdmin]
    code: 201
    input: [name, plan_tier, country_code]
    output: Account
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/messaging/accounts/{id}"
    description: "Get an Account"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, NumberProvisioner, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/messaging/accounts"
    description: "List Accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/suspend"
    description: "Suspend an account; cascades to campaigns and numbers"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Account
    side_effects:
      - "Account -> SUSPENDED"
      - "cascade_suspend_account"

  - method: POST
    path: "/messaging/accounts/{id}/reinstate"
    description: "Reinstate a suspended account (children NOT auto-restored)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["Account -> ACTIVE"]

  - method: POST
    path: "/messaging/accounts/{id}/close"
    description: "Close a suspended account; releases all numbers"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects:
      - "Account -> CLOSED"
      - "All ACTIVE/SUSPENDED numbers -> RELEASED (detached)"

  - method: POST
    path: "/messaging/accounts/{id}/run_ops"
    description: "Ops checkpoint: drains queues, applies staleness sweep, emits recurring/number fees"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OpsRun
    side_effects:
      - "OpsRun.run_index = previous + 1"
      - "queue_drain per campaign"
      - "stale queue sweep"
      - "registration_fees recurring pass"

  - method: GET
    path: "/messaging/accounts/{id}/ops_runs"
    description: "List ops runs for an account"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?"]
    output: "OpsRun[]"
    side_effects: []


  # --- Prefix-level single-resource GETs (derive canonical collection segments) ---
  - method: GET
    path: "/messaging/brands/{id}"
    description: "Get a Brand by id (prefix-level alias of the account-nested GET)"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: GET
    path: "/messaging/campaigns/{id}"
    description: "Get a Campaign by id"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, NumberProvisioner, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/messaging/numbers/{id}"
    description: "Get a SenderNumber by id"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, NumberProvisioner, CarrierReviewer]
    code: 200
    input: []
    output: SenderNumber
    side_effects: []

  - method: GET
    path: "/messaging/consent_records/{id}"
    description: "Get a ConsentRecord by id"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/messaging/messages/{id}"
    description: "Get a Message by id"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Message
    side_effects: []


  - method: GET
    path: "/messaging/feedback_events/{id}"
    description: "Get a FeedbackEvent by id"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: []
    output: FeedbackEvent
    side_effects: []

  - method: GET
    path: "/messaging/snapshots/{id}"
    description: "Get a DailySnapshot by id"
    roles: [PlatformAdmin, ComplianceOfficer, DeliverabilityAnalyst]
    code: 200
    input: []
    output: DailySnapshot
    side_effects: []

  - method: GET
    path: "/messaging/ops_runs/{id}"
    description: "Get an OpsRun by id"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: OpsRun
    side_effects: []

  # --- Prefix-level child collections (canonical collection segments + filtered-list FK reverse reachability) ---
  - method: GET
    path: "/messaging/brands"
    description: "List brands across accounts; account_id filter scopes to one account"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?"]
    output: "Brand[]"
    side_effects: []

  - method: GET
    path: "/messaging/campaigns"
    description: "List campaigns across accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "brand_id?", "status?"]
    output: "Campaign[]"
    side_effects: []

  - method: GET
    path: "/messaging/numbers"
    description: "List sender numbers across accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "campaign_id?", "status?"]
    output: "SenderNumber[]"
    side_effects: []

  - method: GET
    path: "/messaging/consent_records"
    description: "List consent records across accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "brand_id?", "phone_number?", "status?"]
    output: "ConsentRecord[]"
    side_effects: []

  - method: GET
    path: "/messaging/messages"
    description: "List messages across accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "campaign_id?", "sender_number_id?", "consent_record_id?", "status?"]
    output: "Message[]"
    side_effects: []

  - method: GET
    path: "/messaging/feedback_events"
    description: "List feedback events across accounts"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "account_id?", "campaign_id?", "message_id?", "kind?"]
    output: "FeedbackEvent[]"
    side_effects: []

  - method: GET
    path: "/messaging/snapshots"
    description: "List daily snapshots across accounts"
