              payload: { account_id: "${acct_id}" }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${bowl_id}", quantity: 4 }
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { line_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: WarehouseOps
              captures: { cver: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_account_version: "${cver}" }
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "Product.${bowl_id}.on_hand_qty == 10"
            - "OrderLine.${line_id}.allocated_qty == 0"
            - "PurchaseOrder.${order_id}.lifecycle_status == CANCELLED"

      - name: confirm_cancel_conserves_account_outstanding
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - state_machines.PurchaseOrder.CONFIRMED_to_CANCELLED
          - calculations.account_outstanding
