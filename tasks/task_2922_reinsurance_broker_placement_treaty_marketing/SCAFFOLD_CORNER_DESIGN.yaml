            - call: "POST /reinsurers/${alpha_id}/security-status"
              payload: { security_status: "APPROVED", reason: "Rating restored" }
              as: ComplianceOfficer
              captures: { restored_status: $.data.security_status, restored_committed: $.data.committed_capacity_minor }
            - call: "GET /signing-lines/${sl_a}"
              payload: {}
