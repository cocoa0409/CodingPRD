  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_offer_issuance_rejects_a_stale_application_version_and_admits_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-issue-stale-application]
          - errors[ERR_STALE_APPLICATION_VERSION]
          - validations[priority=8]
          - endpoints[POST /applications/{id}/offers]
        distinguishing_aspect: "A second OFFER from the same observed state is a legitimate product operation — nothing in §1.2 forbids a repeat offer from RANKED — so only OCC on Application.version can reject the writer whose view predates the first offer. The version read before the first offer is replayed against the endpoint and returns 412 ERR_STALE_APPLICATION_VERSION with negotiation_round_count unchanged at 1; refreshing the version admits the second offer and advances the count to 2."
        test_recipe:
          setup:
            - "Application AP1 is RANKED with a CERTIFIED appraisal of 175,550,000 and version ${app_a_v1}. The clock is 2026-10-05."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
          trigger:
            - *k_offer_a
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v1}", offer_cents: 170000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - *k_get_app_a_v2
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v2}", offer_cents: 170000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "trigger call 1 returns HTTP 200 with Application.${app_a_id}.status == OFFER_ISSUED, current_offer_cents == 175550000, negotiation_round_count == 1 and version == ${app_a_v1} + 1"
            - "trigger call 2 returns HTTP 412 with error code ERR_STALE_APPLICATION_VERSION because ${app_a_v1} is no longer Application.${app_a_id}.version"
            - "after trigger call 2 Application.${app_a_id}.current_offer_cents is still 175550000, negotiation_round_count is still 1 and version is unchanged, so the rejected write had no side effects"
            - "trigger call 4 returns HTTP 200 with current_offer_cents == 170000000, structure == FULL_PURCHASE, donation_pct == 0, negotiation_round_count == 2 and total_program_cost_cents == 172550000"
            - "Application.${app_a_id}.version == ${app_a_v2} + 1 after trigger call 4, so version increments on every successful write"

      - name: occ_funding_plan_supersede_rejects_a_stale_application_version_before_touching_any_commitment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[funding-plan-supersede-stale-application]
          - errors[ERR_STALE_APPLICATION_VERSION]
          - state_machines.Application.funding_plan_status[FUNDED -> FUNDED]
          - endpoints[POST /applications/{id}/funding-plan]
        distinguishing_aspect: "The supersede path is the reason this rule exists: re-running the waterfall from the same observed version is a valid operation, so the stale-version replay must be rejected before any RESERVED commitment is released. The replay returns 412 and leaves the original three commitments RESERVED with their original amounts; the refreshed call then supersedes them, releasing exactly three rows with lapse_reason PLAN_SUPERSEDED and creating three new ones."
        test_recipe:
          setup:
            - "Application AP1 is OFFER_ISSUED at 175,550,000 BARGAIN_SALE with total_program_cost_cents 160,364,925 and version ${app_a_v2}, and a first funding plan has been assembled."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
          trigger:
            - call: "POST /applications/${app_a_id}/funding-plan"
              payload: { expected_application_version: "${app_a_v2}", target_closing_date: "2027-02-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-commitments"
              payload: { application_id: "${app_a_id}", status: "RESERVED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_a_v3: $.data.version }
            - call: "POST /applications/${app_a_id}/funding-plan"
              payload: { expected_application_version: "${app_a_v3}", target_closing_date: "2027-02-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-commitments"
              payload: { application_id: "${app_a_id}", status: "RELEASED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1 returns HTTP 412 with error code ERR_STALE_APPLICATION_VERSION, because the successful setup plan already advanced the version past ${app_a_v2}"
            - "trigger call 2 returns total_count == 3 with amounts 56127723, 64145970 and 40091232, so the rejected supersede released nothing"
            - "trigger call 4 returns HTTP 200 with commitment_count == 3, funded_cost_cents == 160364925 and remainder_absorbed_cents == 1"
            - "trigger call 5 returns total_count == 3 with every row lapse_reason == PLAN_SUPERSEDED"
            - "GET /funding-commitments?application_id=${app_a_id}&status=RESERVED still returns total_count == 3 after the supersede, and FundingSource.${src_local_id}.reserved_cents == 56127723 rather than double-counted"

      - name: occ_amendment_draft_rejects_a_stale_easement_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-draft-stale-easement]
          - errors[ERR_STALE_EASEMENT_VERSION]
          - validations[priority=8]
          - endpoints[POST /easements/{id}/amendments]
        distinguishing_aspect: "Easement.version is advanced by an intervening approved impervious-use request rather than by another amendment, which is exactly the case the rule describes: the drafter's view predates a stewardship write. The draft replayed with the pre-request version returns 412 ERR_STALE_EASEMENT_VERSION and creates no Amendment row, while the same draft with the refreshed version is accepted."
        test_recipe:
          setup:
            - "Easement EA1 was recorded 2026-12-15 with impervious_allowance_sqft 139,392 and impervious_used_sqft 0, COMPLIANT and with no stewardship hold."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
            - *k_clk_1012
            - *k_accept_a
            - *k_get_req_title
            - *k_get_req_sub
            - *k_get_req_survey
            - *k_submit_req_title
            - *k_review_req_title
            - *k_submit_req_sub
            - *k_review_req_sub
            - *k_submit_req_survey
            - *k_review_req_survey
            - *k_clk_1215
            - *k_close_a
          trigger:
            - call: "GET /easements/${ease_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ease_a_v_occ: $.data.version }
            - call: "POST /easements/${ease_a_id}/impervious-requests"
              payload: { added_impervious_sqft: 1200, description: "new milkhouse slab" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
            - call: "POST /easements/${ease_a_id}/amendments"
              payload: { expected_easement_version: "${ease_a_v_occ}", amendment_type: "RESIDENTIAL_RIGHT_RELOCATION", net_conservation_benefit_cents: 250000, residential_rights_delta: -1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /easements/${ease_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ease_a_v_occ2: $.data.version }
            - call: "POST /easements/${ease_a_id}/amendments"
              payload: { expected_easement_version: "${ease_a_v_occ2}", amendment_type: "RESIDENTIAL_RIGHT_RELOCATION", net_conservation_benefit_cents: 250000, residential_rights_delta: -1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { amd_occ_id: $.data.id }
          assert:
            - "trigger call 2 returns HTTP 200 with Easement.${ease_a_id}.impervious_used_sqft == 1200 and version == ${ease_a_v_occ} + 1"
            - "trigger call 3 returns HTTP 412 with error code ERR_STALE_EASEMENT_VERSION"
            - "GET /easements/${ease_a_id}/amendments returns total_count == 0 immediately after trigger call 3"
            - "trigger call 5 returns HTTP 201 with Amendment.${amd_occ_id}.status == DRAFT, residential_rights_delta == -1 and applied_rights_delta == 0"
            - "Easement.${ease_a_id}.residential_rights_retained is still 2 after the DRAFT, because only an APPROVE decision applies the delta"

      - name: occ_parcel_patch_rejects_a_stale_parcel_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[parcel-attribute-stale-parcel]
          - errors[ERR_STALE_PARCEL_VERSION]
          - validations[priority=8]
          - endpoints[PATCH /parcels/{id}]
          - calculations.parcel_development_pressure_score
        distinguishing_aspect: "Re-patching the same attributes is a legitimate repeat operation, so the two identical PATCH bodies are distinguished only by expected_parcel_version. The first patch succeeds and recomputes the development-pressure score from the new frontage — min(30, floor(1200/100) * 3) == 30 plus sewer 25 plus the 2.0-acre zoning tier 35 == 90 — and the replay of the same version returns 412 with the parcel untouched."
        test_recipe:
          setup:
            - "Parcel PA1 exists at version 1 with road_frontage_feet 640, sewer_available true and zoning_min_lot_acres 2.0, so its development_pressure_score is 18 + 25 + 35 == 78. The clock is 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
          trigger:
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { parcel_a_v_occ: $.data.version }
            - call: "PATCH /parcels/${parcel_a_id}"
              payload: { expected_parcel_version: "${parcel_a_v_occ}", road_frontage_feet: 1200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "PATCH /parcels/${parcel_a_id}"
              payload: { expected_parcel_version: "${parcel_a_v_occ}", road_frontage_feet: 1200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { parcel_a_v_occ2: $.data.version }
            - call: "PATCH /parcels/${parcel_a_id}"
              payload: { expected_parcel_version: "${parcel_a_v_occ2}", sewer_available: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 2 returns HTTP 200 with Parcel.${parcel_a_id}.road_frontage_feet == 1200, development_pressure_score == 90.00 and version == ${parcel_a_v_occ} + 1"
            - "trigger call 3 returns HTTP 412 with error code ERR_STALE_PARCEL_VERSION"
            - "trigger call 4 shows Parcel.${parcel_a_id}.road_frontage_feet == 1200 and development_pressure_score == 90.00, unchanged by the rejected replay"
            - "trigger call 5 returns HTTP 200 with sewer_available == false and development_pressure_score == 65.00, because the frontage still contributes 30 and the zoning tier 35 while the sewer term drops to 0"
            - "Parcel.${parcel_a_id}.soil_quality_score == 84.00 throughout, because no patched field feeds the soil calculation"

      - name: remainder_policy_last_non_zero_take_moves_when_the_last_eligible_source_is_suspended
        claim_type: selector_policy
        grounds:
          - calculations.funding_waterfall_allocation.constants.REMAINDER_POLICY
          - calculations.funding_waterfall_allocation.precision
          - calculations.funding_waterfall_allocation.input_set
          - state_machines.FundingSource[ACTIVE -> SUSPENDED]
          - errors[ERR_MATCH_RATIO_UNSATISFIED]
        distinguishing_aspect: "REMAINDER_POLICY LAST_NON_ZERO_TAKE selects the absorbing source by sweep position, not by identity, so suspending the FEDERAL source moves the absorption to the STATE source and the absorbed amount jumps from 1 cent to 40,091,232. It also exposes the deliberate asymmetry in the policy: the absorbing source's own max_share_pct is NOT re-checked, so the STATE take of 104,237,202 legally exceeds its 0.40 cap of 64,145,970, while the program-level federal cap and the LOCAL match floor are still enforced. Because a suspended source is skipped entirely, its requires_match ratio is not tested either, which is what keeps this plan legal."
        test_recipe:
          setup:
            - "Application AP1 is OFFER_ISSUED with total_program_cost_cents 160,364,925 and version ${app_a_v2}. No funding plan exists yet."
            - "Sources sweep in priority order LOCAL 0.35 (authorized 60,000,000), STATE 0.40 (120,000,000), FEDERAL 0.25 (200,000,000, requires_match ratio 1.0)."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
          trigger:
            - call: "POST /funding-sources/${src_fed_id}/suspension"
              payload: { reason: "federal award notice delayed past the closing window" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /applications/${app_a_id}/funding-plan"
              payload: { expected_application_version: "${app_a_v2}", target_closing_date: "2027-01-15T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-commitments"
              payload: { application_id: "${app_a_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-commitments"
              payload: { funding_source_id: "${src_state_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { commit_state_id: "$.data[0].id" }
          assert:
            - "trigger call 1 returns HTTP 200 with FundingSource.${src_fed_id}.status == SUSPENDED"
            - "trigger call 2 returns HTTP 200 with commitment_count == 2, federal_total_cents == 0, local_total_cents == 56127723, state_total_cents == 104237202 and remainder_absorbed_cents == 40091232"
            - "trigger call 2 also reports funded_cost_cents == 160364925, so 56,127,723 + 104,237,202 covers the target exactly"
            - "trigger call 3 returns total_count == 2 with sweep_order 1 and 2 and no FEDERAL row, because a SUSPENDED source is skipped even though its available_cents is 200,000,000"
            - "FundingCommitment.${commit_state_id}.amount_cents == 104237202 with absorbed_remainder_cents == 40091232, exceeding the source's floor(160,364,925 * 0.40) == 64,145,970 cap because the absorbed remainder is not re-checked against max_share_pct"
            - "the plan is accepted rather than rejected with ERR_MATCH_RATIO_UNSATISFIED, because the only requires_match source was skipped, and the LOCAL floor still holds: 56,127,723 >= ceil(160,364,925 * 0.25) == 40,091,232"

      - name: cascading_side_effects_across_the_acceptance_and_visit_completion_chains
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Application.status[OFFER_ISSUED -> ACCEPTED]
          - state_machines.MonitoringVisit[SCHEDULED -> COMPLETED]
        excluded_because:
          difficulty_instance: acceptance_cascades_six_levels_and_lapses_a_sibling_reservation
          rationale: "Both cascade chains are already verified end to end with ordering sensitivity in §1.8: acceptance_cascades_six_levels_and_lapses_a_sibling_reservation walks commitment obligation, source recomputation, the FULLY_OBLIGATED threshold, the sibling lapse, the sibling's UNDERFUNDED flip and the closing-requirement creation, and visit_completion_cascades_five_levels_and_suspends_a_pending_amendment walks the finding, the violation, the compliance flip, the stewardship hold and the amendment suspension."

      - name: dual_variant_calculation_of_the_composite_score_and_the_easement_value
        claim_type: dual_variant_calculation
        grounds:
          - calculations.composite_priority_score
          - calculations.easement_value
        excluded_because:
          difficulty_instance: composite_score_receipt_basis_versus_round_close_basis
          rationale: "Both dual-variant calculations are already asserted in §1.8 with the delta on the switch: composite_score_receipt_basis_versus_round_close_basis ranks the same round under both score_basis values and shows the contiguity term changing, and easement_value_preliminary_assessor_versus_certified_appraisal_basis contrasts the preliminary assessor basis with the certified appraisal basis on the same parcel."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: the_acceptance_response_itself_already_shows_every_cascaded_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Application.status[OFFER_ISSUED -> ACCEPTED]
          - response_envelope.success
        distinguishing_aspect: "The declared consistency model is immediate, so the six-level acceptance cascade must be fully visible in the response to the acceptance call itself — funding_plan_status OBLIGATED, closing_status PENDING_REQUIREMENTS and requirement_total 3 are already in that body — and every child read taken immediately afterwards agrees with it. No sweep, no retry and no second write is needed to observe any part of the cascade."
        test_recipe:
          setup:
            - "Application AP1 is OFFER_ISSUED at 175,550,000 with a FUNDED plan of three RESERVED commitments totalling 160,364,925. The clock is 2026-10-12."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
            - *k_clk_1012
          trigger:
            - *k_accept_a
            - call: "GET /funding-commitments"
              payload: { application_id: "${app_a_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /funding-sources/${src_local_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /applications/${app_a_id}/closing-requirements"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /applications/${app_a_id}/negotiation-rounds"
              payload: { kind: "ACCEPTANCE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the body of trigger call 1 already carries status == ACCEPTED, agreed_price_cents == 175550000, funding_plan_status == OBLIGATED, closing_status == PENDING_REQUIREMENTS, requirement_total == 3 and requirement_satisfied_count == 0"
            - "trigger call 2 returns total_count == 3 with every row status == OBLIGATED, matching what trigger call 1 already reported"
            - "trigger call 3 shows FundingSource.${src_local_id}.committed_cents == 56127723 and available_cents == 3872277 with version already incremented"
            - "trigger call 4 returns total_count == 3 with types TITLE_COMMITMENT, MORTGAGE_SUBORDINATION and BOUNDARY_SURVEY, all OUTSTANDING"
            - "trigger call 5 returns total_count == 1 with amount_cents == 175550000"
            - "no POST /stewardship-sweeps call is needed anywhere in this instance: nothing about the cascade is deferred to a later request"
