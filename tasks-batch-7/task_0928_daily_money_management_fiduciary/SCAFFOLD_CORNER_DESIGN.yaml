            - "one imported StatementLine for 100000 cents that does not correspond to it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
