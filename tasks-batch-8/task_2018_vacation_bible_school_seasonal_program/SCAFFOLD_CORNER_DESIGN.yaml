            - "${err} == ERR_FAMILY_ARCHIVED"
      - name: budget_exceeded_on_approve_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.budget_remaining
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: "Fiscal gate evaluated at approve time against live remaining budget: with 70000 of 100000 already approved, approving a 36000 order fails with ERR_BUDGET_EXCEEDED (402) while a 30000 order would pass."
        test_recipe:
          setup:
            - "Program Alpha (budget 100000, no classrooms so required_final == 0); order A 10x7000 APPROVED; order B 6x6000 SUBMITTED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit A", vendor: "Cokesbury", quantity: 10, unit_cost_cents: 7000 }, as: ProgramDirector, captures: { ord_a: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_a}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders/${ord_a}/approve", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Kit B", vendor: "Cokesbury", quantity: 6, unit_cost_cents: 6000 }, as: ProgramDirector, captures: { ord_b: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_b}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /vbs/supply-orders/${ord_b}/approve", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_BUDGET_EXCEEDED and http status == 402  (36000 > 100000 - 70000)"
            - "SupplyOrder.${ord_b}.status == SUBMITTED and budget_remaining_cents == 30000"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_limit_offset_interaction
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - "endpoints: GET /vbs/families"
        distinguishing_aspect: "limit/offset/total_count/has_more compose correctly: 3 families with limit 2 yields page 1 of 2 rows (has_more true) and page 2 of 1 row (has_more false); default limit is 10."
        test_recipe:
          setup: ["three ACTIVE families"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "F1", primary_contact_name: "P One", email: "f1@example.com", phone: "555-0101" }, as: Anonymous }
            - { call: "POST /vbs/families", payload: { household_name: "F2", primary_contact_name: "P Two", email: "f2@example.com", phone: "555-0102" }, as: Anonymous }
            - { call: "POST /vbs/families", payload: { household_name: "F3", primary_contact_name: "P Three", email: "f3@example.com", phone: "555-0103" }, as: Anonymous }
          trigger:
            - { call: "GET /vbs/families", payload: { limit: 2, offset: 0 }, as: RegistrationCoordinator, captures: { first_row: "$.data[0].email" } }
            - { call: "GET /vbs/families", payload: { limit: 2, offset: 2 }, as: RegistrationCoordinator, captures: { last_row: "$.data[0].email" } }
          assert:
            - "page 1: exactly 2 rows, total_count == 3, has_more == true, first row is f1@example.com (creation order)"
            - "page 2 (${last_row} == f3@example.com): exactly 1 row, has_more == false"
      - name: registrations_filter_by_status
        claim_type: listing
        grounds:
          - "endpoints: GET /vbs/registrations"
        distinguishing_aspect: "The status filter is exact: with 2 ENROLLED and 1 WAITLISTED in a classroom, status=WAITLISTED returns exactly the one waitlisted row."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN; Koalas (cap 2): A,B ENROLLED; C WAITLISTED"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
          trigger:
            - { call: "GET /vbs/registrations", payload: { classroom_id: "${cls_k}", status: "WAITLISTED" }, as: RegistrationCoordinator, captures: { row_id: "$.data[0].id", row_status: "$.data[0].status" } }
          assert:
            - "exactly 1 row returned and ${row_id} == ${reg_c} and ${row_status} == WAITLISTED"
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds:
          - response_envelope.success
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == \"object\" for single-entity GET, data carries the entity."
        test_recipe:
          setup: ["Program Alpha DRAFT"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "GET /vbs/programs/${prog_id}", payload: {}, as: ProgramDirector, captures: { got_id: $.data.id } }
          assert:
            - "${got_id} == ${prog_id}"
            - "envelope has meta.api_request_id (non-empty), meta.api_request_timestamp (ISO8601), response_type == object"
      - name: error_envelope_shape
        claim_type: standard_crud
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every failure wraps the error in the fixed envelope: response_type == \"error\", data.error_id and data.message both present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vbs/programs/11111111-2222-3333-4444-555555555555", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "envelope has response_type == error and data.message is a non-empty string"

  # ===========================================================================
  # Section: errors (violation instances above already trigger every catalog
  # entry; these stubs record where the remaining ones live)
  # ===========================================================================
  - section: errors
    instances:
      - name: err_offer_expired_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_EXPIRED]
        excluded_because:
          difficulty_instance: offer_expiry_strict_less_than
          rationale: "Asserted as the failure path of the boundary instance (accept exactly at offer_expires_at)."
      - name: err_invalid_state_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: order_approve_state_beats_fiscal
          rationale: "Asserted as the winning error of the state-vs-fiscal priority conflict; also re-asserted by terminal-lockdown corners."
      - name: err_kit_quantity_short_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_KIT_QUANTITY_SHORT]
        excluded_because:
          difficulty_instance: kit_recommendation_provisional_vs_final
          rationale: "Asserted as the submit-time failure of an order at the provisional quantity."
      - name: err_staffing_inadequate_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFFING_INADEQUATE]
        excluded_because:
          difficulty_instance: day_open_gated_by_classroom_staffing
          rationale: "Asserted as the day-open failure before the second adult confirms."
      - name: err_accommodation_and_tag_and_day_errors_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACCOMMODATION_NOT_APPROVED]
          - errors[ERR_PROGRAM_DATE_OVERLAP]
          - errors[ERR_DAY_NOT_SEQUENTIAL]
        excluded_because:
          difficulty_instance: checkin_safety_beats_state
          rationale: "ERR_ACCOMMODATION_NOT_APPROVED is the asserted winner of the safety-vs-state conflict; ERR_PROGRAM_DATE_OVERLAP and ERR_DAY_NOT_SEQUENTIAL are asserted by the two temporal-overlap difficulty instances."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: safety_officer_cannot_confirm_assignment
        claim_type: role_exclusive_denied
        grounds:
          - roles.VolunteerCoordinator.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Segregation of duties: the screener role (SafetyOfficer) is denied the assigner role's exclusive confirm operation with ERR_FORBIDDEN, even for a well-formed request."
        test_recipe:
          setup: ["Program Alpha DRAFT; Koalas; volunteer v1 (uncleared) with PROPOSED assignment asg1"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v1}", classroom_id: "${cls_k}", role: "ASSISTANT_TEACHER" }, as: VolunteerCoordinator, captures: { asg1: $.data.id } }
          trigger:
            - { call: "POST /vbs/role-assignments/${asg1}/confirm", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
      - name: volunteer_coordinator_cannot_decide_screening
        claim_type: role_exclusive_denied
        grounds:
          - roles.SafetyOfficer.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "The other half of the segregation: the assigner (VolunteerCoordinator) cannot decide screening checks — ERR_FORBIDDEN."
        test_recipe:
          setup: ["Program Alpha DRAFT; volunteer v1 with SUBMITTED BACKGROUND check"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { chk: $.data.id } }
          trigger:
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "CLEARED" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
      - name: parent_cannot_checkin_child
        claim_type: role_exclusive_denied
        grounds:
          - roles.CheckInStaff.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Families never mark their own attendance: Parent on POST /vbs/attendance/check-in fails authz (P2) with ERR_FORBIDDEN before the referenced ids are even resolved (P3)."
        test_recipe:
          setup: ["Family F ACTIVE (ids in the body need not resolve: authorization is evaluated first)"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
          trigger:
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "11111111-2222-3333-4444-555555555555", program_day_id: "11111111-2222-3333-4444-555555555555" }, as: Parent, as_user_id: "${fam_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN  (role denial precedes existence checks)"
      - name: parent_cross_family_child_read_forbidden
        claim_type: ownership_scope
        grounds:
          - roles.Parent.identity
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Parent identity is entity_backed:Family — X-User-ID must equal the owning family_id: family B's Parent reading family A's child gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Family A with child k1; Family B exists"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_a: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_a}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_a}", captures: { k1: $.data.id } }
            - { call: "POST /vbs/families", payload: { household_name: "Baker", primary_contact_name: "Sam Baker", email: "baker@example.com", phone: "555-0102" }, as: Anonymous, captures: { fam_b: $.data.id } }
          trigger:
            - { call: "GET /vbs/children/${k1}", payload: {}, as: Parent, as_user_id: "${fam_b}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
      - name: volunteer_reads_own_record_ok
        claim_type: role_shared_allowed
        grounds:
          - roles.Volunteer.identity
        distinguishing_aspect: "Volunteer identity is entity_backed:Volunteer — reading one's own record succeeds and returns status APPLIED."
        test_recipe:
          setup: ["Program Alpha DRAFT; volunteer v1 APPLIED"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
          trigger:
            - { call: "GET /vbs/volunteers/${v1}", payload: {}, as: Volunteer, as_user_id: "${v1}", captures: { st: $.data.status } }
          assert:
            - "${st} == APPLIED"
      - name: anonymous_list_programs_forbidden
        claim_type: role_exclusive_denied
        grounds:
          - roles.Anonymous.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Anonymous holds only the two self-service creations; GET /vbs/programs is staff-only and returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /vbs/programs", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_classroom_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[classroom-config-stale-update]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH /vbs/classrooms/{id} honors expected_classroom_version: a first patch with the observed version succeeds (version 1 -> 2); a second patch replaying the same observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Program Alpha DRAFT; classroom Koalas just created (version 1)"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id, cls_v: $.data.version } }
          trigger:
            - { call: "PATCH /vbs/classrooms/${cls_k}", payload: { capacity: 20, expected_classroom_version: "${cls_v}" }, as: RegistrationCoordinator, captures: { cap_after: $.data.capacity, v_after: $.data.version } }
            - { call: "PATCH /vbs/classrooms/${cls_k}", payload: { age_max: 7, expected_classroom_version: "${cls_v}" }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${cap_after} == 20 and ${v_after} == 2  (first patch succeeded and bumped the version)"
            - "${err} == ERR_STALE_VERSION and http status == 412  (replayed stale version rejected)"
            - "Classroom.${cls_k}.age_max == 6  (the rejected patch applied nothing)"
      - name: occ_plan_approve_stale_child_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-approve-stale-child]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Approve-with-supersede is OCC-guarded on Child.version: approving plan A bumps the child's version; approving plan B with the pre-A version fails 412 ERR_STALE_VERSION and B stays SUBMITTED while A stays APPROVED."
        test_recipe:
          setup: ["Family F with special-needs child k1 (version 1); plans A and B both SUBMITTED for k1; A not yet approved"]
          setup_api_calls:
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN", has_special_needs: true }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id, k1_v: $.data.version } }
            - { call: "POST /vbs/accommodation-plans", payload: { child_id: "${k1}", severity: "FOOD_ALLERGY", allergens: ["PEANUT"], instructions: "Plan A instructions" }, as: Parent, as_user_id: "${fam_id}", captures: { plan_a: $.data.id } }
            - { call: "POST /vbs/accommodation-plans/${plan_a}/submit", payload: {}, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/accommodation-plans", payload: { child_id: "${k1}", severity: "FOOD_ALLERGY", allergens: ["PEANUT", "TREE_NUT"], instructions: "Plan B instructions" }, as: Parent, as_user_id: "${fam_id}", captures: { plan_b: $.data.id } }
            - { call: "POST /vbs/accommodation-plans/${plan_b}/submit", payload: {}, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/accommodation-plans/${plan_a}/approve", payload: { expected_child_version: "${k1_v}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { a_status: $.data.status } }
            - { call: "POST /vbs/accommodation-plans/${plan_b}/approve", payload: { expected_child_version: "${k1_v}" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
            - { call: "GET /vbs/accommodation-plans/${plan_b}", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { b_status: $.data.status } }
          assert:
            - "${a_status} == APPROVED  (first approve at the observed version succeeds and bumps Child.version)"
            - "${err} == ERR_STALE_VERSION and http status == 412  (second approve's view is stale)"
            - "${b_status} == SUBMITTED  (no partial supersede)"
      - name: occ_sweep_stale_program_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-sweep-stale-program]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The waitlist sweep is OCC-guarded on Program.version: a sweep at the observed version succeeds (a no-op sweep is legitimate and still bumps the version); replaying the same observed version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Program Alpha REGISTRATION_OPEN with no waitlist activity; coordinator has just read the program"]
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, waitlist_offer_ttl_hours: 48 }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "GET /vbs/programs/${prog_id}", payload: {}, as: RegistrationCoordinator, captures: { prog_v: $.data.version } }
          trigger:
            - { call: "POST /vbs/programs/${prog_id}/sweep-expired-offers", payload: { expected_program_version: "${prog_v}" }, as: RegistrationCoordinator, captures: { v_after: $.data.version } }
            - { call: "POST /vbs/programs/${prog_id}/sweep-expired-offers", payload: { expected_program_version: "${prog_v}" }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${v_after} == ${prog_v} + 1  (even a no-op sweep advances the version, which is what makes the stale view detectable)"
            - "${err} == ERR_STALE_VERSION and http status == 412"
      - name: staffing_threshold_exact_flip
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.required_adults_and_staffing
          - entities.Classroom.fields.staffing_status
        distinguishing_aspect: "The ADEQUATE threshold is inclusive (confirmed >= required): with 1 enrolled child (required 2), one confirmed adult reads UNDERSTAFFED and the second confirmation flips the classroom to exactly ADEQUATE."
        test_recipe:
          setup:
            - "Program Alpha REGISTRATION_OPEN; Koalas (ratio 4) with 1 ENROLLED child (required_adults 2); v1 and v2 each with PROPOSED child-facing assignments and cleared checks in progress"
