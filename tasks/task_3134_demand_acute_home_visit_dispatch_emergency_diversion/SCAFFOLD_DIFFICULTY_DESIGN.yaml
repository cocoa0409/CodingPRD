              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-I", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
