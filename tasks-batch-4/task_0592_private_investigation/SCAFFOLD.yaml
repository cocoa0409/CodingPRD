scenario: "592. Private Investigation & Skip-Tracing: case intake & retainer, investigator assignment & licensing, surveillance/activity log & evidence chain, database/skip-trace search, report & deliverable, expense & hourly billing, confidentiality/redaction, court-testimony scheduling"
domain_name: "private-investigation-skip-tracing"
api_prefix: "/"

complexity_profile:
  difficulty_level: Expert
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # InvestigationReport.supersedes_report_id -> InvestigationReport.id
    - cross_aggregate       # Assignment / SurveillanceSession / CourtTestimony bridge Case and Investigator
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Client legal name as it appears on the retainer agreement"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email for the client contact person"
      - name: adverse_party_names
        type: array
        source: input
        description: "List of adverse-party names used by the conflict check on every Case of this Client"
        default: []
      - name: status
        type: enum
        source: system
        description: "Client account status"
        default: ACTIVE
        constraints: "one of {ACTIVE, BARRED}; BARRED is written by the conflict-check DECLINE transition on any Case of this Client"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the retaining client"
      - name: case_type
        type: enum
        source: input
        description: "Investigation product purchased"
        constraints: "one of {SKIP_TRACE, SURVEILLANCE, BACKGROUND}"
      - name: jurisdiction_state
        type: string
        source: input
        description: "Two-letter state code where field work is performed; every SurveillanceSession requires an ACTIVE License in this state"
        constraints: "exactly two uppercase letters"
      - name: subject_name
        type: string
        source: input
        description: "Name of the investigation subject"
      - name: confidentiality_level
        type: enum
        source: input
        description: "Drives the redaction-approval threshold (see redaction_score calculation constants)"
        default: STANDARD
        constraints: "one of {STANDARD, RESTRICTED}"
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state; see §1.2 Case state machine"
        default: INTAKE
        constraints: "one of {INTAKE, CONFLICT_CLEARED, ACTIVE, SUSPENDED, CLOSED, DECLINED}"
      - name: total_deposit_cents
        type: integer
        source: computed
        description: "Sum of RetainerLedgerEntry.amount_cents over entries of this Case with kind == DEPOSIT"
        default: 0
      - name: retainer_balance_cents
        type: integer
        source: computed
        description: "Signed sum over this Case's RetainerLedgerEntry rows; see calculations.retainer_balance"
        default: 0
      - name: billable_minutes_total
        type: integer
        source: computed
        description: "Sum of SurveillanceSession.billable_minutes over this Case's sessions with status == COMPLETED; see calculations.case_billable_minutes"
        default: 0
      - name: court_hold
        type: boolean
        source: computed
        description: "true iff this Case has at least one CourtTestimony with status IN {REQUESTED, SCHEDULED, CONTINUED}; blocks close"
        default: false

  - name: RetainerLedgerEntry
    parent: Case
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> Case.id; the case whose retainer this entry moves"
      - name: kind
        type: enum
        source: system
        description: "Ledger entry kind; sign convention is pinned in calculations.retainer_balance"
        constraints: "one of {DEPOSIT, DRAW, REFUND}; DEPOSIT written by POST /cases/{id}/retainer, DRAW by expense approval and skip-trace completion, REFUND by expense reversal"
      - name: amount_cents
        type: integer
        source: system
        description: "Absolute magnitude of the movement in cents; always positive, the sign comes from kind"
        constraints: "> 0"
      - name: source_ref
        type: string
        source: system
        description: "Id of the ExpenseEntry / SkipTraceSearch / retainer deposit request that produced this entry; empty string for deposits"
      - name: balance_after_cents
        type: integer
        source: computed
        description: "Case.retainer_balance_cents immediately after this entry was appended"
      - name: seq
        type: integer
        source: system
        description: "1-based append order within the Case; ledger replay order is seq ASC"

  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Investigator name"
      - name: seniority
        type: enum
        source: input
        description: "Seniority band; constrains hourly_rate_cents"
        constraints: "one of {JUNIOR, SENIOR, LEAD}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Billing rate in cents per hour; must sit inside the seniority band (see validations priority 13)"
        constraints: "JUNIOR 5000-9999, SENIOR 10000-14999, LEAD 15000-25000"
      - name: status
        type: enum
        source: system
        description: "Investigator availability"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: License
    parent: Investigator
    common_fields: true
    fields:
      - name: investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; the licence holder"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code the licence authorises field work in"
        constraints: "exactly two uppercase letters"
      - name: license_number
        type: string
        source: input
        description: "Licence number as issued by the state board"
      - name: valid_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the licence becomes effective (inclusive)"
      - name: valid_until
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the licence lapses (exclusive)"
      - name: status
        type: enum
        source: system
        description: "Licence administrative status"
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}; REVOKED written by POST /licenses/{id}/revoke"
      - name: is_currently_valid
        type: boolean
        source: computed
        description: "true iff status == ACTIVE AND valid_from <= clock_now < valid_until, evaluated against the logical clock at read time"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case the investigator is staffed onto"
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Investigator.id; the staffed investigator"
      - name: role_on_case
        type: enum
        source: input
        description: "Staffing role; at most one LEAD per Case may hold status IN {ASSIGNED, ACTIVE}"
        constraints: "one of {LEAD, SUPPORT}"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle; see §1.2 Assignment state machine"
        default: ASSIGNED
        constraints: "one of {ASSIGNED, ACTIVE, RELEASED}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the assignment was released; null while not RELEASED"
        default: null

  - name: SurveillanceSession
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being surveilled"
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Investigator.id; the investigator occupying the interval"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the surveillance interval (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the surveillance interval (exclusive); must be > start_at"
      - name: location
        type: string
        source: input
        description: "Free-text observation post"
      - name: mileage_miles
        type: number
        source: input
        description: "Miles driven, supplied at completion; 0 until then"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Session lifecycle; see §1.2 SurveillanceSession state machine"
        default: PLANNED
        constraints: "one of {PLANNED, IN_PROGRESS, COMPLETED, ABORTED, VOIDED}"
      - name: billable_minutes
        type: integer
        source: computed
        description: "Clamped, night-weighted minutes; see calculations.session_charge; 0 unless status == COMPLETED"
        default: 0
      - name: session_charge_cents
        type: integer
        source: computed
        description: "Labour + mileage for this session in cents; see calculations.session_charge; 0 unless status == COMPLETED"
        default: 0

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this evidence belongs to"
      - name: session_id
        type: string
        source: input
        description: "FK -> SurveillanceSession.id; the session during which the item was captured"
      - name: kind
        type: enum
        source: input
        description: "Evidence medium; drives the redaction sensitivity weight"
        constraints: "one of {PHOTO, VIDEO, AUDIO, DOC}"
      - name: hash_sha256
        type: string
        source: input
        description: "Content hash; unique per Case (see validations priority 13)"
      - name: captured_at
        type: datetime
        source: input
        description: "ISO 8601 UTC capture instant"
      - name: custody_state
        type: enum
        source: system
        description: "Custody dimension of the evidence state machine; evolves independently of redaction_state"
        default: COLLECTED
        constraints: "one of {COLLECTED, SEALED, RELEASED, DESTROYED}"
      - name: redaction_state
        type: enum
        source: system
        description: "Redaction dimension of the evidence state machine; evolves independently of custody_state"
        default: UNREDACTED
        constraints: "one of {UNREDACTED, REDACTED}"
      - name: custodian_user_id
        type: string
        source: system
        description: "X-User-ID currently holding the item; set to the collecting Investigator on create, rewritten by transfer"
      - name: chain_seq
        type: integer
        source: computed
        description: "Count of CustodyEvent rows for this item; equals the highest CustodyEvent.seq"
        default: 1

  - name: CustodyEvent
    parent: EvidenceItem
    common_fields: false
    fields:
      - name: evidence_id
        type: string
        source: system
        description: "FK -> EvidenceItem.id; the item this link of the chain describes"
      - name: seq
        type: integer
        source: system
        description: "1-based append order within the item; chain replay order is seq ASC"
      - name: action
        type: enum
        source: system
        description: "Chain-of-custody action"
        constraints: "one of {COLLECT, TRANSFER, SEAL, REDACT, DESTROY}"
      - name: from_custodian_id
        type: string
        source: system
        description: "X-User-ID relinquishing the item; empty string on the COLLECT link"
      - name: to_custodian_id
        type: string
        source: system
        description: "X-User-ID receiving the item"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant the action was recorded"

  - name: SkipTraceSearch
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case charged for the search"
      - name: database_code
        type: enum
        source: input
        description: "Vendor database queried; sets the base unit cost"
        constraints: "one of {LEXIS, TLO, CREDIT_HEADER}"
      - name: permissible_purpose_code
        type: enum
        source: input
        description: "Regulatory permissible purpose asserted for the query"
        constraints: "one of {LITIGATION, INSURANCE_CLAIM, DEBT_COLLECTION, EMPLOYMENT_SCREEN}"
      - name: subject_identifier
        type: string
        source: input
        description: "Search key (name, SSN fragment, plate)"
      - name: status
        type: enum
        source: system
        description: "Search lifecycle; see §1.2 SkipTraceSearch state machine"
        default: REQUESTED
        constraints: "one of {REQUESTED, COMPLETED, DENIED}"
      - name: hit_count
        type: integer
        source: input
        description: "Records returned by the vendor, supplied at execution; 0 until then"
        default: 0
      - name: cost_cents
        type: integer
        source: computed
        description: "Charged amount; see calculations.search_cost; 0 unless status == COMPLETED"
        default: 0
      - name: denial_reason
        type: enum
        source: system
        description: "Why the search was denied; null unless status == DENIED"
        default: null
        constraints: "one of {VENDOR_DENIED, RETAINER_SUSPENDED}"

  - name: InvestigationReport
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case reported on"
      - name: supersedes_report_id
        type: string
        source: input
        description: "FK -> InvestigationReport.id; the prior report this one replaces (self-referential); null for the first report of a case"
        default: null
      - name: title
        type: string
        source: input
        description: "Report title"
      - name: evidence_ids
        type: array
        source: input
        description: "Ordered list of EvidenceItem.id values cited by this report; every id must belong to case_id"
        constraints: "non-empty"
      - name: author_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; the X-User-ID that created the report"
      - name: reviewer_investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; the X-User-ID that performed the peer review; null before peer review"
        default: null
      - name: status
        type: enum
        source: system
        description: "Report lifecycle; see §1.2 InvestigationReport state machine"
        default: DRAFT
        constraints: "one of {DRAFT, PEER_REVIEW, REVISION_REQUESTED, REDACTION_REVIEW, APPROVED, DELIVERED, SUPERSEDED}"
      - name: author_redaction_score
        type: integer
        source: computed
        description: "AUTHOR_SELF variant of calculations.redaction_score, stamped on the DRAFT->PEER_REVIEW transition"
        default: 0
      - name: compliance_redaction_score
        type: integer
        source: computed
        description: "COMPLIANCE variant of calculations.redaction_score, stamped on every redaction-review decision"
        default: 0
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant the report was delivered to the client; null before DELIVERED"
        default: null

  - name: ExpenseEntry
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case charged"
      - name: investigator_id
        type: string
        source: system
        description: "FK -> Investigator.id; the X-User-ID that submitted the expense"
      - name: category
        type: enum
        source: input
        description: "Expense category"
        constraints: "one of {MILEAGE, EQUIPMENT, TRAVEL, RECORDS}"
      - name: amount_cents
        type: integer
        source: input
        description: "Claimed amount in cents"
        constraints: "> 0 and <= MAX_SINGLE_EXPENSE_CENTS (100000)"
      - name: incurred_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the cost was incurred"
      - name: status
        type: enum
        source: system
        description: "Expense lifecycle; see §1.2 ExpenseEntry state machine"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED, REVERSED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being billed"
      - name: variant
        type: enum
        source: input
        description: "Which input set calculations.invoice_totals uses"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle; see §1.2 Invoice state machine"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PAID, VOID}"
      - name: labor_cents
        type: integer
        source: computed
        description: "Per-line-rounded labour total; see calculations.invoice_totals"
        default: 0
      - name: expense_cents
        type: integer
        source: computed
        description: "Expense total for the variant's input set; see calculations.invoice_totals"
        default: 0
      - name: database_cents
        type: integer
        source: computed
        description: "Skip-trace database total; see calculations.invoice_totals"
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "labor_cents + expense_cents + database_cents"
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Administrative fee; rate tier keyed on subtotal_cents, never on total_cents; see calculations.invoice_totals"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + admin_fee_cents"
        default: 0

  - name: CourtTestimony
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being litigated"
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Investigator.id; the investigator subpoenaed"
      - name: court_state_code
        type: string
        source: input
        description: "Two-letter state code of the court; the investigator needs an ACTIVE License in this state to be scheduled"
        constraints: "exactly two uppercase letters"
      - name: scheduled_start
        type: datetime
        source: system
        description: "ISO 8601 UTC start of the booked appearance (inclusive); null while REQUESTED or CONTINUED"
        default: null
      - name: scheduled_end
        type: datetime
        source: system
        description: "ISO 8601 UTC end of the booked appearance (inclusive); null while REQUESTED or CONTINUED"
        default: null
      - name: continuance_count
        type: integer
        source: system
        description: "Number of times this testimony has been continued; a testimony may be continued at most MAX_CONTINUANCES (2) times"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Testimony lifecycle; see §1.2 CourtTestimony state machine"
        default: REQUESTED
        constraints: "one of {REQUESTED, SCHEDULED, CONTINUED, TESTIFIED, CANCELLED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Case
    initial_state: INTAKE
    terminal_states: [CLOSED, DECLINED]
    shape: "cyclic (ACTIVE <-> SUSPENDED) with a branching conflict-check fork"
    transitions:
      - from: INTAKE
        to: CONFLICT_CLEARED
        trigger: "POST /cases/{id}/conflict-check with decision=CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == INTAKE"
          - "case.subject_name is NOT present (case-insensitive exact match) in Client.adverse_party_names of case.client_id"
        side_effects:
          - "Case.status = CONFLICT_CLEARED"
        note: "Branch A of the fork. Divergent side-effect set from the DECLINE branch below."
      - from: INTAKE
        to: DECLINED
        trigger: "POST /cases/{id}/conflict-check with decision=DECLINE"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == INTAKE"
        side_effects:
          - "Case.status = DECLINED"
          - "Client.status of case.client_id = BARRED (cross-entity)"
          - "every other Case of that Client with status == INTAKE stays INTAKE but its conflict-check will fail existence-independent business check ERR_CLIENT_BARRED"
        note: "Branch B of the fork. Terminal; no ledger, no assignments."
      - from: CONFLICT_CLEARED
        to: ACTIVE
        trigger: "POST /cases/{id}/retainer (deposit) whose resulting retainer_balance_cents >= MIN_RETAINER_CENTS"
        actor: CaseManager
        preconditions:
          - "case.status == CONFLICT_CLEARED"
          - "resulting Case.retainer_balance_cents >= MIN_RETAINER_CENTS (50000)"
        side_effects:
          - "append RetainerLedgerEntry{kind: DEPOSIT}"
          - "recompute Case.total_deposit_cents and Case.retainer_balance_cents"
          - "Case.status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: retainer posture recomputation after any DRAW ledger append"
        actor: system
        preconditions:
          - "case.status == ACTIVE"
          - "Case.retainer_balance_cents < round_half_up(LOW_RETAINER_RATIO (0.25) * Case.total_deposit_cents)"
        side_effects:
          - "Case.status = SUSPENDED"
          - "every SkipTraceSearch of this Case with status == REQUESTED -> DENIED with denial_reason = RETAINER_SUSPENDED (cascade link 3 of transitive_cascade `expense_approval_suspends_case_and_denies_searches`)"
        note: "Auto-transition. Fires only from the ledger-append recompute, never from a direct client call."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: retainer posture recomputation after any DEPOSIT or REFUND ledger append"
        actor: system
        preconditions:
          - "case.status == SUSPENDED"
          - "Case.retainer_balance_cents >= round_half_up(LOW_RETAINER_RATIO (0.25) * Case.total_deposit_cents)"
        side_effects:
          - "Case.status = ACTIVE"
        note: "Closes the cycle ACTIVE -> SUSPENDED -> ACTIVE. Previously DENIED searches are NOT resurrected."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: CaseManager
        preconditions:
          - "case.status == ACTIVE"
          - "case.court_hold == false (no CourtTestimony of this Case in {REQUESTED, SCHEDULED, CONTINUED})"
          - "every Invoice of this Case with status == DRAFT does not exist (all invoices are ISSUED, PAID or VOID)"
        side_effects:
          - "Case.status = CLOSED"
          - "cascade link 1: every Assignment of this Case with status IN {ASSIGNED, ACTIVE} -> RELEASED (released_at = clock_now)"
          - "cascade link 2 (caused by link 1): releasing an Assignment aborts every SurveillanceSession of that Assignment's investigator on that Case with status IN {PLANNED, IN_PROGRESS} -> ABORTED"
          - "cascade link 3 (caused by link 2): aborting a SurveillanceSession seals every EvidenceItem of that session with custody_state == COLLECTED -> SEALED, appending a CustodyEvent{action: SEAL} and incrementing EvidenceItem.chain_seq"
        note: "Depth-3 transitive cascade `case_close_releases_aborts_seals`."
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: CaseManager
        preconditions:
          - "case.status == SUSPENDED"
          - "case.court_hold == false"
          - "no Invoice of this Case has status == DRAFT"
        side_effects:
          - "identical cascade to the ACTIVE -> CLOSED transition (links 1-3)"

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    shape: linear
    transitions:
      - from: ASSIGNED
        to: ACTIVE
        trigger: "system: POST /surveillance-sessions/{id}/start by this Assignment's investigator on this Assignment's case"
        actor: system
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "Assignment.status = ACTIVE"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /assignments/{id}/release, or cascade link 1 of Case close"
        actor: CaseManager
        preconditions:
          - "assignment.status == ASSIGNED"
        side_effects:
          - "Assignment.status = RELEASED, released_at = clock_now"
          - "every SurveillanceSession of this investigator on this case with status IN {PLANNED, IN_PROGRESS} -> ABORTED"
          - "each abort in turn seals that session's COLLECTED EvidenceItems (SEALED + CustodyEvent{action: SEAL})"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /assignments/{id}/release, or cascade link 1 of Case close"
        actor: CaseManager
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "same as ASSIGNED -> RELEASED"

  - entity: SurveillanceSession
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED, VOIDED]
    shape: "branching with a compensating VOID edge"
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /surveillance-sessions/{id}/start"
        actor: Investigator
        preconditions:
          - "session.status == PLANNED"
          - "Case of this session has status == ACTIVE (cross-entity gate; SUSPENDED is rejected with ERR_CASE_NOT_ACTIVE)"
          - "the acting Investigator holds an Assignment on this Case with status IN {ASSIGNED, ACTIVE}"
        side_effects:
          - "SurveillanceSession.status = IN_PROGRESS"
          - "the acting Investigator's Assignment on this Case, if ASSIGNED, -> ACTIVE"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /surveillance-sessions/{id}/complete"
        actor: Investigator
        preconditions:
          - "session.status == IN_PROGRESS"
        side_effects:
          - "SurveillanceSession.mileage_miles = request mileage_miles"
          - "compute SurveillanceSession.billable_minutes and session_charge_cents via calculations.session_charge"
          - "recompute Case.billable_minutes_total via calculations.case_billable_minutes (forward leg of compensating_invariant `billable_minutes_conservation`)"
      - from: PLANNED
        to: ABORTED
        trigger: "cascade: Assignment release (directly, or via Case close link 1 -> link 2)"
        actor: system
        preconditions:
          - "session.status == PLANNED"
        side_effects:
          - "SurveillanceSession.status = ABORTED"
          - "every EvidenceItem of this session with custody_state == COLLECTED -> SEALED (+ CustodyEvent{action: SEAL}, chain_seq += 1)"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "cascade: Assignment release (directly, or via Case close link 1 -> link 2)"
        actor: system
        preconditions:
          - "session.status == IN_PROGRESS"
        side_effects:
          - "SurveillanceSession.status = ABORTED"
          - "billable_minutes and session_charge_cents stay 0 (an aborted session is never billed)"
          - "every EvidenceItem of this session with custody_state == COLLECTED -> SEALED (+ CustodyEvent{action: SEAL}, chain_seq += 1)"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /surveillance-sessions/{id}/void"
        actor: CaseManager
        preconditions:
          - "session.status == COMPLETED"
          - "no Invoice of this session's Case has status IN {ISSUED, PAID} that already billed this session (i.e. no Invoice of the Case is in {ISSUED, PAID})"
        side_effects:
          - "SurveillanceSession.status = VOIDED"
          - "SurveillanceSession.billable_minutes = 0 and session_charge_cents = 0"
          - "recompute Case.billable_minutes_total via calculations.case_billable_minutes (compensating leg of compensating_invariant `billable_minutes_conservation`)"

  - entity: EvidenceItem
    initial_state: "custody_state=COLLECTED x redaction_state=UNREDACTED"
    terminal_states: [DESTROYED]
    shape: "parallel dimensions: custody_state and redaction_state advance independently on the same row"
    transitions:
      - from: "custody_state=COLLECTED"
        to: "custody_state=SEALED"
        trigger: "POST /evidence/{id}/seal, or the session-abort cascade"
        actor: Investigator
        preconditions:
          - "evidence.custody_state == COLLECTED"
        side_effects:
          - "EvidenceItem.custody_state = SEALED"
          - "append CustodyEvent{action: SEAL, from_custodian_id: evidence.custodian_user_id, to_custodian_id: evidence.custodian_user_id, seq: chain_seq + 1}"
          - "EvidenceItem.chain_seq += 1"
        note: "redaction_state is untouched by this edge."
      - from: "custody_state IN {COLLECTED, SEALED}"
        to: "custody_state unchanged, custodian_user_id rewritten"
        trigger: "POST /evidence/{id}/transfer"
        actor: Investigator | ComplianceOfficer
        preconditions:
          - "evidence.custody_state IN {COLLECTED, SEALED}"
          - "the acting X-User-ID equals evidence.custodian_user_id"
        side_effects:
          - "append CustodyEvent{action: TRANSFER, from_custodian_id: old custodian, to_custodian_id: request to_custodian_id, seq: chain_seq + 1}"
          - "EvidenceItem.custodian_user_id = request to_custodian_id"
          - "EvidenceItem.chain_seq += 1"
      - from: "custody_state=SEALED"
        to: "custody_state=RELEASED"
        trigger: "system: POST /reports/{id}/deliver releases every EvidenceItem cited by the delivered report"
        actor: system
        preconditions:
          - "evidence.custody_state == SEALED"
        side_effects:
          - "EvidenceItem.custody_state = RELEASED"
          - "append CustodyEvent{action: TRANSFER, to_custodian_id: 'CLIENT', seq: chain_seq + 1}; chain_seq += 1"
      - from: "custody_state IN {SEALED, RELEASED}"
        to: "custody_state=DESTROYED"
        trigger: "POST /evidence/{id}/destroy"
        actor: ComplianceOfficer
        preconditions:
          - "evidence.custody_state IN {SEALED, RELEASED}"
          - "evidence.redaction_state == REDACTED (an unredacted item may never be destroyed)"
          - "Case of this evidence has status == CLOSED"
        side_effects:
          - "EvidenceItem.custody_state = DESTROYED"
          - "append CustodyEvent{action: DESTROY, seq: chain_seq + 1}; chain_seq += 1"
      - from: "redaction_state=UNREDACTED"
        to: "redaction_state=REDACTED"
        trigger: "POST /evidence/{id}/redact"
        actor: ComplianceOfficer
        preconditions:
          - "evidence.redaction_state == UNREDACTED"
          - "evidence.custody_state != DESTROYED"
        side_effects:
          - "EvidenceItem.redaction_state = REDACTED"
          - "append CustodyEvent{action: REDACT, seq: chain_seq + 1}; chain_seq += 1"
          - "for every InvestigationReport whose evidence_ids contains this item and whose status == REDACTION_REVIEW, recompute compliance_redaction_score via calculations.redaction_score(COMPLIANCE)"
        note: "custody_state is untouched by this edge; the two dimensions are orthogonal."

  - entity: SkipTraceSearch
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /skip-trace-searches/{id}/execute with outcome=COMPLETED"
        actor: Investigator
        preconditions:
          - "search.status == REQUESTED"
          - "Case of this search has status == ACTIVE"
          - "hit_count >= 0 supplied in the request"
        side_effects:
          - "SkipTraceSearch.hit_count = request hit_count"
          - "SkipTraceSearch.cost_cents = calculations.search_cost"
          - "append RetainerLedgerEntry{kind: DRAW, amount_cents: cost_cents, source_ref: search.id} — skipped entirely when cost_cents == 0"
          - "recompute Case.retainer_balance_cents; run the retainer posture recompute (may drive Case ACTIVE -> SUSPENDED)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /skip-trace-searches/{id}/execute with outcome=DENIED, or the Case-suspension cascade"
        actor: Investigator | system
        preconditions:
          - "search.status == REQUESTED"
        side_effects:
          - "SkipTraceSearch.status = DENIED, cost_cents = 0"
          - "SkipTraceSearch.denial_reason = VENDOR_DENIED when triggered by the endpoint, RETAINER_SUSPENDED when triggered by the Case ACTIVE -> SUSPENDED cascade"
          - "no ledger entry is appended (a denied search is never charged)"

  - entity: InvestigationReport
    initial_state: DRAFT
    terminal_states: [DELIVERED, SUPERSEDED]
    shape: "cyclic: PEER_REVIEW -> REVISION_REQUESTED -> PEER_REVIEW, and REDACTION_REVIEW -> REVISION_REQUESTED -> PEER_REVIEW"
    transitions:
      - from: DRAFT
        to: PEER_REVIEW
        trigger: "POST /reports/{id}/submit-review"
        actor: Investigator
        preconditions:
          - "report.status == DRAFT"
          - "the acting X-User-ID == report.author_investigator_id"
          - "every EvidenceItem in report.evidence_ids has custody_state != DESTROYED"
        side_effects:
          - "InvestigationReport.status = PEER_REVIEW"
          - "stamp InvestigationReport.author_redaction_score = calculations.redaction_score variant AUTHOR_SELF"
      - from: REVISION_REQUESTED
        to: PEER_REVIEW
        trigger: "POST /reports/{id}/submit-review"
        actor: Investigator
        preconditions:
          - "report.status == REVISION_REQUESTED"
          - "the acting X-User-ID == report.author_investigator_id"
        side_effects:
          - "InvestigationReport.status = PEER_REVIEW"
          - "re-stamp author_redaction_score = calculations.redaction_score variant AUTHOR_SELF (evidence redaction may have changed since the last stamp)"
        note: "Closes the revision cycle."
      - from: PEER_REVIEW
        to: REDACTION_REVIEW
        trigger: "POST /reports/{id}/peer-review with decision=APPROVE"
        actor: Investigator
        preconditions:
          - "report.status == PEER_REVIEW"
          - "the acting X-User-ID != report.author_investigator_id (segregation of duties)"
          - "the acting Investigator holds an Assignment on report.case_id with status IN {ASSIGNED, ACTIVE}"
        side_effects:
          - "InvestigationReport.reviewer_investigator_id = acting X-User-ID"
          - "InvestigationReport.status = REDACTION_REVIEW"
      - from: PEER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /reports/{id}/peer-review with decision=REQUEST_REVISION"
        actor: Investigator
        preconditions:
          - "report.status == PEER_REVIEW"
          - "the acting X-User-ID != report.author_investigator_id"
        side_effects:
          - "InvestigationReport.reviewer_investigator_id = acting X-User-ID"
          - "InvestigationReport.status = REVISION_REQUESTED"
      - from: REDACTION_REVIEW
        to: APPROVED
        trigger: "POST /reports/{id}/redaction-review with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == REDACTION_REVIEW"
          - "compliance_redaction_score (calculations.redaction_score variant COMPLIANCE, recomputed now) <= REDACTION_THRESHOLD for the Case.confidentiality_level (STANDARD 40, RESTRICTED 20)"
        side_effects:
          - "stamp InvestigationReport.compliance_redaction_score"
          - "InvestigationReport.status = APPROVED"
      - from: REDACTION_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /reports/{id}/redaction-review with decision=REQUEST_REVISION"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == REDACTION_REVIEW"
        side_effects:
          - "stamp InvestigationReport.compliance_redaction_score"
          - "InvestigationReport.status = REVISION_REQUESTED"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /reports/{id}/deliver"
        actor: CaseManager
        preconditions:
          - "report.status == APPROVED"
          - "every EvidenceItem in report.evidence_ids has redaction_state == REDACTED (cross-entity gate)"
          - "every EvidenceItem in report.evidence_ids has custody_state IN {SEALED, RELEASED}"
        side_effects:
          - "InvestigationReport.status = DELIVERED, delivered_at = clock_now"
          - "every cited EvidenceItem with custody_state == SEALED -> RELEASED (+ CustodyEvent{action: TRANSFER, to_custodian_id: 'CLIENT'}, chain_seq += 1)"
      - from: "any of {DRAFT, PEER_REVIEW, REVISION_REQUESTED, REDACTION_REVIEW, APPROVED}"
        to: SUPERSEDED
        trigger: "system: POST /reports with supersedes_report_id pointing at this report"
        actor: system
        preconditions:
          - "report.status != DELIVERED and report.status != SUPERSEDED"
        side_effects:
          - "InvestigationReport.status = SUPERSEDED"
        note: "The supersede path is the CREATE-with-supersede race guarded by OCC on Case.version (see §1.2.1)."

  - entity: ExpenseEntry
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    shape: "branching with a compensating REVERSED edge"
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expense-entries/{id}/decision with decision=APPROVE"
        actor: CaseManager
        preconditions:
          - "expense.status == SUBMITTED"
          - "Case of this expense has status IN {ACTIVE, SUSPENDED}"
          - "Case.retainer_balance_cents - expense.amount_cents >= 0"
        side_effects:
          - "ExpenseEntry.status = APPROVED"
          - "cascade link 1: append RetainerLedgerEntry{kind: DRAW, amount_cents: expense.amount_cents, source_ref: expense.id} and recompute Case.retainer_balance_cents"
          - "cascade link 2 (caused by link 1): the retainer posture recompute drives Case ACTIVE -> SUSPENDED when balance < 25% of total_deposit_cents"
          - "cascade link 3 (caused by link 2): the suspension denies every REQUESTED SkipTraceSearch of the Case with denial_reason = RETAINER_SUSPENDED"
        note: "Depth-3 transitive cascade `expense_approval_suspends_case_and_denies_searches`."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expense-entries/{id}/decision with decision=REJECT"
        actor: CaseManager
        preconditions:
          - "expense.status == SUBMITTED"
        side_effects:
          - "ExpenseEntry.status = REJECTED"
          - "no ledger movement"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /expense-entries/{id}/reverse"
        actor: CaseManager
        preconditions:
          - "expense.status == APPROVED"
          - "no Invoice of this expense's Case has status IN {ISSUED, PAID}"
        side_effects:
          - "ExpenseEntry.status = REVERSED"
          - "append RetainerLedgerEntry{kind: REFUND, amount_cents: expense.amount_cents, source_ref: expense.id} and recompute Case.retainer_balance_cents"
          - "the retainer posture recompute may drive Case SUSPENDED -> ACTIVE"
        note: "Compensating leg of compensating_invariant `retainer_cents_conservation`."

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    shape: linear with a supersede VOID edge
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: CaseManager
        preconditions:
          - "invoice.status == DRAFT"
          - "invoice.total_cents > 0 (an invoice whose input set is empty on all three line groups is rejected with ERR_INVOICE_EMPTY)"
          - "for variant == FINAL: no SurveillanceSession of the Case has status == IN_PROGRESS and no ExpenseEntry of the Case has status == SUBMITTED"
        side_effects:
          - "recompute all invoice money fields via calculations.invoice_totals for invoice.variant"
          - "Invoice.status = ISSUED"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: CaseManager
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Invoice.status = PAID"
      - from: DRAFT
        to: VOID
        trigger: "system: POST /invoices creating a newer Invoice on the same Case"
        actor: system
        preconditions:
          - "invoice.status == DRAFT"
        side_effects:
          - "Invoice.status = VOID"
        note: "CREATE-with-supersede — the newer draft legitimately replaces the older one. Guarded by OCC on Case.version (§1.2.1)."

  - entity: CourtTestimony
    initial_state: REQUESTED
    terminal_states: [TESTIFIED, CANCELLED]
    shape: "cyclic: SCHEDULED -> CONTINUED -> SCHEDULED"
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /court-testimonies/{id}/schedule"
        actor: CaseManager
        preconditions:
          - "testimony.status == REQUESTED"
          - "the investigator holds an Assignment on testimony.case_id with status IN {ASSIGNED, ACTIVE} (cross-entity gate)"
          - "the investigator holds a License with state_code == testimony.court_state_code and is_currently_valid == true"
          - "scheduled_end > scheduled_start"
          - "no other CourtTestimony of the same Case in status IN {SCHEDULED} has a closed interval within TESTIMONY_BUFFER_MINUTES (120) of the requested closed interval"
        side_effects:
          - "CourtTestimony.scheduled_start / scheduled_end = request values"
          - "CourtTestimony.status = SCHEDULED"
          - "recompute Case.court_hold (becomes true)"
      - from: CONTINUED
        to: SCHEDULED
        trigger: "POST /court-testimonies/{id}/schedule"
        actor: CaseManager
        preconditions:
          - "testimony.status == CONTINUED"
          - "same licensing, assignment, ordering and buffer preconditions as REQUESTED -> SCHEDULED"
        side_effects:
          - "CourtTestimony.scheduled_start / scheduled_end = request values"
          - "CourtTestimony.status = SCHEDULED"
        note: "Closes the continuance cycle."
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /court-testimonies/{id}/continue"
        actor: CaseManager
        preconditions:
          - "testimony.status == SCHEDULED"
          - "testimony.continuance_count < MAX_CONTINUANCES (2)"
        side_effects:
          - "CourtTestimony.continuance_count += 1"
          - "CourtTestimony.scheduled_start = null, scheduled_end = null (the slot is released)"
          - "CourtTestimony.status = CONTINUED"
      - from: SCHEDULED
        to: TESTIFIED
        trigger: "POST /court-testimonies/{id}/testify"
        actor: Investigator
        preconditions:
          - "testimony.status == SCHEDULED"
          - "the acting X-User-ID == testimony.investigator_id"
          - "clock_now >= testimony.scheduled_end"
        side_effects:
          - "CourtTestimony.status = TESTIFIED"
          - "recompute Case.court_hold (false when no other testimony of the Case is in {REQUESTED, SCHEDULED, CONTINUED})"
      - from: "any of {REQUESTED, SCHEDULED, CONTINUED}"
        to: CANCELLED
        trigger: "POST /court-testimonies/{id}/cancel"
        actor: CaseManager
        preconditions:
          - "testimony.status IN {REQUESTED, SCHEDULED, CONTINUED}"
        side_effects:
          - "CourtTestimony.status = CANCELLED, scheduled_start = null, scheduled_end = null"
          - "recompute Case.court_hold"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on Case.version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: report-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /reports"
    occ_field: "expected_case_version"
    description: |
      Creating an InvestigationReport against a Case whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another author has already filed a report that legitimately supersedes the
      prior one, so the current writer's view of the case (and of which report is
      current) is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /invoices"
    occ_field: "expected_case_version"
    description: |
      Creating an Invoice against a Case whose version has advanced since the
      client last observed it is rejected. A newer draft invoice legitimately
      voids the prior DRAFT invoice, so a writer holding a stale case version
      would be voiding a draft it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: session_charge
    trigger: "POST /surveillance-sessions/{id}/complete (IN_PROGRESS -> COMPLETED); writes SurveillanceSession.billable_minutes and SurveillanceSession.session_charge_cents"
    algorithm: threshold
    combinatorial_mode: "(a) formula with >=3 inputs and non-linear interaction (nested min/max clamp + conditional night weighting + per-investigator rate)"
    formula: |
      raw_minutes    = whole minutes in the half-open interval [start_at, end_at)
      night_minutes  = whole minutes of [start_at, end_at) that fall inside the daily
                       UTC window [22:00, 24:00) U [00:00, 06:00)
      day_minutes    = raw_minutes - night_minutes
      weighted       = day_minutes + ceil(night_minutes * NIGHT_MULTIPLIER)
      billable_minutes = min(max(weighted, MIN_BILLABLE_MINUTES), MAX_SESSION_BILLABLE_MINUTES)
      labor_cents    = round_half_up(billable_minutes / 60 * Investigator.hourly_rate_cents)
      mileage_cents  = round_half_up(mileage_miles * MILEAGE_RATE_CENTS_PER_MILE)
      session_charge_cents = labor_cents + mileage_cents
    input_set: "Exactly one SurveillanceSession, at the moment it leaves IN_PROGRESS. The rate is read from the session's Investigator (investigator_id), not from the Assignment. ABORTED and VOIDED sessions keep billable_minutes = 0 and session_charge_cents = 0."
    constants:
      MIN_BILLABLE_MINUTES: 60
      MAX_SESSION_BILLABLE_MINUTES: 720
      NIGHT_MULTIPLIER: 1.5
      NIGHT_WINDOW_UTC: "22:00-06:00"
      MILEAGE_RATE_CENTS_PER_MILE: 67
    precision: "labor_cents and mileage_cents are each rounded to whole cents with round_half_up BEFORE being added; the sum is never re-rounded"

  - name: case_billable_minutes
    trigger: "any SurveillanceSession status change into or out of COMPLETED (complete, void); writes Case.billable_minutes_total"
    algorithm: aggregation
    formula: |
      Case.billable_minutes_total =
        sum(SurveillanceSession.billable_minutes
            for sessions with case_id == Case.id AND status == COMPLETED)
    input_set: "SurveillanceSession rows of the Case whose status is exactly COMPLETED. PLANNED, IN_PROGRESS, ABORTED and VOIDED sessions contribute 0."
    constants: {}
    precision: "integer minutes; full recompute from the source rows on every change (no incremental delta)"

  - name: retainer_balance
    trigger: "every RetainerLedgerEntry append (deposit, expense approval DRAW, skip-trace DRAW, expense reversal REFUND); writes Case.retainer_balance_cents, Case.total_deposit_cents and RetainerLedgerEntry.balance_after_cents"
    algorithm: chronological
    formula: |
      replay the Case's RetainerLedgerEntry rows in seq ASC order:
        balance = 0
        for e in entries (seq ASC):
            balance += e.amount_cents  if e.kind IN {DEPOSIT, REFUND}
            balance -= e.amount_cents  if e.kind == DRAW
            e.balance_after_cents = balance
      Case.retainer_balance_cents = balance
      Case.total_deposit_cents    = sum(e.amount_cents for e where e.kind == DEPOSIT)

      # retainer posture recompute — runs immediately after every append
      low_water = round_half_up(LOW_RETAINER_RATIO * Case.total_deposit_cents)
      if Case.status == ACTIVE    and balance <  low_water: Case.status = SUSPENDED
      if Case.status == SUSPENDED and balance >= low_water: Case.status = ACTIVE
    input_set: "All RetainerLedgerEntry rows of the Case, none excluded; replay order is seq ASC (never created_at DESC, never id)."
    constants:
      LOW_RETAINER_RATIO: 0.25
      MIN_RETAINER_CENTS: 50000
    precision: "integer cents; low_water uses round_half_up"

  - name: search_cost
    trigger: "POST /skip-trace-searches/{id}/execute with outcome=COMPLETED; writes SkipTraceSearch.cost_cents and drives the DRAW ledger append"
    algorithm: tiered_pricing
    formula: |
      base            = DB_BASE_CENTS[database_code]
      standard_hits   = min(hit_count, BULK_HIT_THRESHOLD - 1)      # hits 1..24
      bulk_hits       = max(hit_count - (BULK_HIT_THRESHOLD - 1), 0) # hits 25 and beyond
      cost_cents      = base + standard_hits * HIT_RATE_STANDARD_CENTS
                             + bulk_hits     * HIT_RATE_BULK_CENTS
      # outcome == DENIED: cost_cents = 0, no ledger entry at all
    input_set: "Exactly one SkipTraceSearch at execution. The marginal bulk rate engages on the 25th hit and beyond, i.e. it applies iff hit_count >= BULK_HIT_THRESHOLD; at hit_count == 24 every hit is still charged at the standard rate."
    constants:
      DB_BASE_CENTS: { LEXIS: 1500, TLO: 900, CREDIT_HEADER: 2500 }
      HIT_RATE_STANDARD_CENTS: 40
      HIT_RATE_BULK_CENTS: 20
      BULK_HIT_THRESHOLD: 25
    precision: "integer cents; no rounding needed"

  - name: invoice_totals
    trigger: "POST /invoices (initial stamp) and POST /invoices/{id}/issue (recompute before ISSUED); writes Invoice.labor_cents, expense_cents, database_cents, subtotal_cents, admin_fee_cents, total_cents"
    algorithm: aggregation
    combinatorial_mode: "(b) nested rounding whose order is pinned: labour is rounded PER SESSION LINE and then summed, never summed and then rounded; plus (c) the admin-fee tier is keyed on subtotal_cents, never on total_cents"
    formula: |
      # 1. line groups, per variant input_set below
      labor_cents    = sum( SurveillanceSession.session_charge_cents )   # each line already
                                                                         # rounded by calculations.session_charge
      expense_cents  = sum( ExpenseEntry.amount_cents )
      database_cents = sum( SkipTraceSearch.cost_cents )

      # 2. subtotal
      subtotal_cents = labor_cents + expense_cents + database_cents

      # 3. admin fee — evaluation order is PINNED and non-iterative:
      #    the tier is selected from subtotal_cents (NOT from total_cents),
      #    the fee is then rounded, and only then added. Do not re-tier on total.
      admin_rate      = ADMIN_FEE_RATE_LOW  if subtotal_cents <= ADMIN_FEE_TIER_CENTS
                        else ADMIN_FEE_RATE_HIGH
      admin_fee_cents = round_half_up(subtotal_cents * admin_rate)
      total_cents     = subtotal_cents + admin_fee_cents
    input_set: "Depends on Invoice.variant — see variants below. Sessions of the Case are matched on case_id; expenses on case_id; searches on case_id. Rows in any other status are excluded entirely."
    constants:
      ADMIN_FEE_TIER_CENTS: 50000
      ADMIN_FEE_RATE_LOW: 0.08
      ADMIN_FEE_RATE_HIGH: 0.05
    precision: "integer cents; round_half_up on the admin fee only — the three line-group sums are already integers because each line was rounded when it was stamped"
    variants:
      - name: PROVISIONAL
        when: "Invoice.variant == PROVISIONAL (an interim bill cut while field work is still running)"
        difference: |
          Input set is optimistic:
            sessions  : status IN {COMPLETED}                       (IN_PROGRESS sessions contribute 0 because
                                                                     session_charge_cents is only stamped at completion)
            expenses  : status IN {SUBMITTED, APPROVED}             (claims not yet adjudicated ARE billed)
            searches  : status IN {COMPLETED}
      - name: FINAL
        when: "Invoice.variant == FINAL (the closing bill)"
        difference: |
          Input set is adjudicated-only:
            sessions  : status IN {COMPLETED}
            expenses  : status IN {APPROVED}                        (SUBMITTED claims are EXCLUDED)
            searches  : status IN {COMPLETED}
          Identical Case data therefore yields a strictly smaller total_cents than the PROVISIONAL
          variant whenever any ExpenseEntry of the Case is still SUBMITTED, and the divergence is
          amplified by the admin fee because the fee is a function of subtotal_cents.

  - name: redaction_score
    trigger: "DRAFT|REVISION_REQUESTED -> PEER_REVIEW stamps author_redaction_score (AUTHOR_SELF); every POST /reports/{id}/redaction-review and every POST /evidence/{id}/redact touching a REDACTION_REVIEW report stamps compliance_redaction_score (COMPLIANCE)"
    algorithm: weighted_scoring
    formula: |
      for each EvidenceItem e in InvestigationReport.evidence_ids (order: the order given in evidence_ids):
        sensitivity(e) = SENSITIVITY_BY_KIND[e.kind]
        exposure(e)    = 0 if e.redaction_state == REDACTED else sensitivity(e)
      n              = count(evidence_ids)            # >= 1, enforced at report creation
      exposed_count  = count(e where exposure(e) > 0)

      AUTHOR_SELF : score = round_half_up( sum(exposure(e)) / n )
      COMPLIANCE  : score = min(100, max(exposure(e) over all e, default 0)
                                     + EXPOSED_ITEM_PENALTY * exposed_count)
    input_set: "Exactly the EvidenceItem rows named in InvestigationReport.evidence_ids; evidence of the same Case that the report does not cite is excluded. DESTROYED items cannot be cited (report submission is blocked)."
    constants:
      SENSITIVITY_BY_KIND: { PHOTO: 20, VIDEO: 30, AUDIO: 25, DOC: 15 }
      EXPOSED_ITEM_PENALTY: 10
      REDACTION_THRESHOLD_STANDARD: 40
      REDACTION_THRESHOLD_RESTRICTED: 20
    precision: "integer score, round_half_up on the AUTHOR_SELF mean; COMPLIANCE is integer by construction and capped at 100"
    variants:
      - name: AUTHOR_SELF
        when: "stamped on the transition into PEER_REVIEW (the author's own averaged self-assessment)"
        difference: "arithmetic MEAN of exposure across the cited items — one heavily exposed item is diluted by redacted siblings"
      - name: COMPLIANCE
        when: "stamped on every redaction-review decision and recomputed when a cited item is redacted while the report sits in REDACTION_REVIEW; this is the variant the approval threshold is compared against"
        difference: "WORST-CASE: the maximum single-item exposure plus a 10-point penalty per still-exposed item, capped at 100. On identical evidence the two variants return different integers; only COMPLIANCE gates approval."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource referenced in the path exists, validated left-to-right; then every FK supplied in the body exists (client_id, case_id, investigator_id, session_id, evidence_ids[], supersedes_report_id)"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_INVESTIGATOR_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_EVIDENCE_NOT_FOUND | ERR_SEARCH_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_EXPENSE_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_TESTIMONY_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "for entity_backed roles, the acting X-User-ID owns the resource: Investigator acts only on its own sessions/evidence/expenses/reports/testimonies; ClientContact reads only Cases and DELIVERED reports of its own Client"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /cases/{id}, GET /reports/{id}, POST /surveillance-sessions/{id}/start, POST /surveillance-sessions/{id}/complete, POST /evidence, POST /evidence/{id}/seal, POST /evidence/{id}/transfer, POST /reports/{id}/submit-review, POST /court-testimonies/{id}/testify, POST /expense-entries"

  - priority: 5
    category: business_constraint
    check: "request body/query shape: required fields present, enums in range, integers in range, datetimes ISO 8601 UTC, evidence_ids non-empty, pagination limit within [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "expected_case_version equals the current Case.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /reports, POST /invoices"

  - priority: 7
    category: state
    check: "the target resource is in a from-state that admits the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint (conflict-check, retainer, close, release, start, complete, void, seal, transfer, redact, destroy, execute, submit-review, peer-review, redaction-review, deliver, decision, reverse, issue, pay, schedule, continue, testify, cancel)"

  - priority: 8
    category: state
    check: "cross-entity Case-state gate: the Case must be ACTIVE for session create/start, skip-trace create/execute, evidence create and report create; the Case must be in {ACTIVE, SUSPENDED} for expense approval and invoice create"
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /surveillance-sessions, POST /surveillance-sessions/{id}/start, POST /skip-trace-searches, POST /skip-trace-searches/{id}/execute, POST /evidence, POST /reports, POST /expense-entries/{id}/decision, POST /invoices"

  - priority: 9
    category: state
    check: "the Client of the Case has status == ACTIVE (a BARRED client's remaining INTAKE cases can no longer be cleared)"
    error_id: ERR_CLIENT_BARRED
    http_status: 409
    applies_to: "POST /cases/{id}/conflict-check, POST /cases"

  - priority: 10
    category: state
    check: "money already billed cannot be unwound: a session may not be voided and an approved expense may not be reversed once any Invoice of the Case is ISSUED or PAID"
    error_id: ERR_INVOICE_LOCKED
    http_status: 409
    applies_to: "POST /surveillance-sessions/{id}/void, POST /expense-entries/{id}/reverse"

  - priority: 11
    category: business_safety
    check: "segregation of duties: the peer reviewer's X-User-ID must differ from InvestigationReport.author_investigator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reports/{id}/peer-review"

  - priority: 12
    category: business_safety
    check: "licensing: the investigator holds a License with state_code == Case.jurisdiction_state (sessions) or == CourtTestimony.court_state_code (testimony scheduling), status == ACTIVE, and valid_from <= clock_now < valid_until"
    error_id: ERR_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /surveillance-sessions, POST /court-testimonies/{id}/schedule"

  - priority: 12
    category: business_safety
    check: "permissible purpose: a CREDIT_HEADER search requires permissible_purpose_code IN {LITIGATION, DEBT_COLLECTION}; any other purpose for that database is unlawful"
    error_id: ERR_PERMISSIBLE_PURPOSE_INVALID
    http_status: 422
    applies_to: "POST /skip-trace-searches"

  - priority: 12
    category: business_safety
    check: "redaction completeness: every EvidenceItem cited by the report has redaction_state == REDACTED and custody_state IN {SEALED, RELEASED}"
    error_id: ERR_REDACTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /reports/{id}/deliver"

  - priority: 12
    category: business_safety
    check: "an EvidenceItem whose redaction_state == UNREDACTED may never be destroyed"
    error_id: ERR_EVIDENCE_UNREDACTED
    http_status: 422
    applies_to: "POST /evidence/{id}/destroy"

  - priority: 12
    category: business_safety
    check: "a Case with court_hold == true may not be closed"
    error_id: ERR_COURT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /cases/{id}/close"

  - priority: 13
    category: business_referential
    check: "every id in evidence_ids belongs to the report's case_id"
    error_id: ERR_EVIDENCE_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /reports"

  - priority: 13
    category: business_referential
    check: "supersedes_report_id, when supplied, names a report of the same Case whose status is not DELIVERED and not SUPERSEDED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /reports"

  - priority: 13
    category: business_referential
    check: "the acting/target Investigator holds an Assignment on the Case with status IN {ASSIGNED, ACTIVE}"
    error_id: ERR_NOT_ASSIGNED_TO_CASE
    http_status: 422
    applies_to: "POST /surveillance-sessions, POST /reports, POST /reports/{id}/peer-review, POST /skip-trace-searches, POST /expense-entries, POST /court-testimonies/{id}/schedule"

  - priority: 14
    category: business_temporal
    check: "interval sanity: end_at > start_at (sessions); scheduled_end > scheduled_start (testimony)"
    error_id: ERR_INTERVAL_INVALID
    http_status: 422
    applies_to: "POST /surveillance-sessions, POST /court-testimonies/{id}/schedule"

  - priority: 15
    category: business_temporal
    check: "investigator surveillance overlap — HALF-OPEN [start_at, end_at) semantics, no buffer: reject when new.start_at < other.end_at AND other.start_at < new.end_at for any other SurveillanceSession of the SAME Investigator (any Case) with status IN {PLANNED, IN_PROGRESS, COMPLETED}. Exactly touching intervals (new.start_at == other.end_at) are ACCEPTED."
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /surveillance-sessions"

  - priority: 15
    category: business_temporal
    check: "court-testimony buffer — CLOSED [scheduled_start, scheduled_end] semantics with a mandatory TESTIMONY_BUFFER_MINUTES (120) separation on the SAME Case: reject when the gap between the requested closed interval and any other SCHEDULED CourtTestimony's closed interval on that Case is <= 120 minutes (overlapping intervals have gap 0 and are therefore also rejected). A gap of exactly 120 minutes is REJECTED; 121 minutes is accepted."
    error_id: ERR_TESTIMONY_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /court-testimonies/{id}/schedule"

  - priority: 15
    category: business_temporal
    check: "an appearance may only be marked TESTIFIED once clock_now >= scheduled_end"
    error_id: ERR_TESTIMONY_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /court-testimonies/{id}/testify"

  - priority: 16
    category: business_constraint
    check: "at most one Assignment per (case_id, investigator_id) with status IN {ASSIGNED, ACTIVE}"
    error_id: ERR_DUPLICATE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 16
    category: business_constraint
    check: "at most one LEAD Assignment per Case with status IN {ASSIGNED, ACTIVE}"
    error_id: ERR_LEAD_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 16
    category: business_constraint
    check: "hash_sha256 is unique among EvidenceItem rows of the same Case"
    error_id: ERR_DUPLICATE_EVIDENCE_HASH
    http_status: 409
    applies_to: "POST /evidence"

  - priority: 16
    category: business_constraint
    check: "hourly_rate_cents sits inside the seniority band (JUNIOR 5000-9999, SENIOR 10000-14999, LEAD 15000-25000)"
    error_id: ERR_RATE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /investigators"

  - priority: 16
    category: business_constraint
    check: "continuance_count < MAX_CONTINUANCES (2)"
    error_id: ERR_CONTINUANCE_LIMIT
    http_status: 409
    applies_to: "POST /court-testimonies/{id}/continue"

  - priority: 16
    category: business_constraint
    check: "an Invoice whose computed total_cents == 0 (every line group's input set is empty) may not be issued"
    error_id: ERR_INVOICE_EMPTY
    http_status: 422
    applies_to: "POST /invoices/{id}/issue"

  - priority: 16
    category: business_constraint
    check: "a Case with an Invoice in status DRAFT may not be closed"
    error_id: ERR_DRAFT_INVOICE_OPEN
    http_status: 409
    applies_to: "POST /cases/{id}/close"

  - priority: 17
    category: business_fiscal
    check: "a deposit that leaves retainer_balance_cents below MIN_RETAINER_CENTS (50000) cannot activate a CONFLICT_CLEARED case"
    error_id: ERR_RETAINER_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /cases/{id}/retainer"

  - priority: 17
    category: business_fiscal
    check: "amount_cents <= MAX_SINGLE_EXPENSE_CENTS (100000)"
    error_id: ERR_EXPENSE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /expense-entries"

  - priority: 18
    category: business_fiscal
    check: "retainer must cover the charge: Case.retainer_balance_cents > 0 for session/search creation, and Case.retainer_balance_cents - amount_cents >= 0 for an expense approval"
    error_id: ERR_RETAINER_EXHAUSTED
    http_status: 402
    applies_to: "POST /surveillance-sessions, POST /skip-trace-searches, POST /expense-entries/{id}/decision"

  - priority: 18
    category: business_fiscal
    check: "compliance_redaction_score exceeds the Case's confidentiality threshold (STANDARD 40, RESTRICTED 20) — strict >"
    error_id: ERR_REDACTION_SCORE_TOO_HIGH
    http_status: 422
    applies_to: "POST /reports/{id}/redaction-review with decision=APPROVE"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # --- Clients & Cases -----------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register a retaining client"
    roles: [CaseManager]
    code: 201
    input: [legal_name, contact_email, "adverse_party_names?"]
    output: Client
    side_effects: ["Client.status = ACTIVE"]

  - method: GET
    path: "/clients/{id}"
    description: "Read a client (used to observe the BARRED cascade)"
    roles: [CaseManager, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/cases"
    description: "Open a case in INTAKE"
    roles: [CaseManager]
    code: 201
    input: [client_id, case_type, jurisdiction_state, subject_name, "confidentiality_level?"]
    output: Case
    side_effects: ["Case.status = INTAKE", "Case.version = 1"]

  - method: GET
    path: "/cases/{id}"
    description: "Read a case with its computed retainer, billable-minute and court-hold fields"
    roles: [CaseManager, ComplianceOfficer, Investigator, ClientContact]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases, filterable by client and status, paginated"
    roles: [CaseManager, ComplianceOfficer]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/conflict-check"
    description: "Compliance conflict check; CLEAR advances the case, DECLINE terminates it and bars the client"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: Case
    side_effects:
      - "decision=CLEAR: Case.status INTAKE -> CONFLICT_CLEARED"
      - "decision=DECLINE: Case.status INTAKE -> DECLINED and Client.status -> BARRED"

  - method: POST
    path: "/cases/{id}/retainer"
    description: "Deposit retainer funds; appends a DEPOSIT ledger entry and runs the retainer posture recompute"
    roles: [CaseManager]
    code: 200
    input: [amount_cents]
    output: Case
    side_effects:
      - "append RetainerLedgerEntry{kind: DEPOSIT}"
      - "recompute Case.total_deposit_cents, Case.retainer_balance_cents"
      - "Case CONFLICT_CLEARED -> ACTIVE when the resulting balance >= MIN_RETAINER_CENTS"
      - "Case SUSPENDED -> ACTIVE when the resulting balance >= 25% of total_deposit_cents"
      - "increments Case.version by 1"

  - method: POST
    path: "/cases/{id}/close"
    description: "Close a case; releases assignments, which aborts their sessions, which seals their collected evidence"
    roles: [CaseManager]
    code: 200
    input: []
    output: Case
    side_effects:
      - "Case.status -> CLOSED"
      - "cascade: assignments RELEASED -> sessions ABORTED -> evidence SEALED (+ CustodyEvent)"
      - "increments Case.version by 1"

  - method: GET
    path: "/cases/{id}/ledger"
    description: "Chain of retainer ledger entries in seq ASC order"
    roles: [CaseManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RetainerLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/cases/{id}/summary"
    description: "Computed read: live money and time posture of the case"
    roles: [CaseManager, ComplianceOfficer]
    code: 200
    input: []
    output: { case_id: string, status: string, retainer_balance_cents: integer, total_deposit_cents: integer, low_water_cents: integer, billable_minutes_total: integer, open_session_count: integer, submitted_expense_count: integer, court_hold: boolean }
    side_effects: []

  # --- Investigators & Licences -------------------------------------------
  - method: POST
    path: "/investigators"
    description: "Create an investigator"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, seniority, hourly_rate_cents]
    output: Investigator
    side_effects: ["Investigator.status = ACTIVE"]

  - method: GET
    path: "/investigators/{id}"
    description: "Read an investigator"
    roles: [PlatformAdmin, CaseManager, ComplianceOfficer, Investigator]
    code: 200
    input: []
    output: Investigator
    side_effects: []

  - method: POST
    path: "/investigators/{id}/licenses"
    description: "Record a state licence for an investigator"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, license_number, valid_from, valid_until]
    output: License
    side_effects: ["License.status = ACTIVE"]

  - method: GET
    path: "/investigators/{id}/licenses"
    description: "List an investigator's licences with is_currently_valid computed against the logical clock"
    roles: [ComplianceOfficer, CaseManager, Investigator]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: POST
    path: "/licenses/{id}/revoke"
    description: "Revoke a licence"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: License
    side_effects: ["License.status -> REVOKED", "License.is_currently_valid becomes false"]

  # --- Assignments ---------------------------------------------------------
  - method: POST
    path: "/assignments"
    description: "Staff an investigator onto a case"
    roles: [CaseManager]
    code: 201
    input: [case_id, investigator_id, role_on_case]
    output: Assignment
    side_effects: ["Assignment.status = ASSIGNED"]

  - method: GET
    path: "/assignments/{id}"
    description: "Read an assignment"
    roles: [CaseManager, Investigator, ComplianceOfficer]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments filtered by case and/or investigator"
    roles: [CaseManager, Investigator, ComplianceOfficer]
    code: 200
    input: ["case_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/release"
    description: "Release an investigator from a case; aborts their open sessions, which seals collected evidence"
    roles: [CaseManager]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment.status -> RELEASED"
      - "cascade: PLANNED/IN_PROGRESS sessions of that investigator on that case -> ABORTED -> their COLLECTED evidence -> SEALED"

  # --- Surveillance --------------------------------------------------------
  - method: POST
    path: "/surveillance-sessions"
    description: "Plan a surveillance interval for an assigned, licensed investigator"
    roles: [Investigator]
    code: 201
    input: [case_id, investigator_id, start_at, end_at, location]
    output: SurveillanceSession
    side_effects: ["SurveillanceSession.status = PLANNED"]

  - method: GET
    path: "/surveillance-sessions/{id}"
    description: "Read a surveillance session"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: []
    output: SurveillanceSession
    side_effects: []

  - method: GET
    path: "/surveillance-sessions"
    description: "List surveillance sessions filtered by case, investigator and status"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: SurveillanceSession[]
    side_effects: []

  - method: POST
    path: "/surveillance-sessions/{id}/start"
    description: "Begin the session (requires an ACTIVE case)"
    roles: [Investigator]
    code: 200
    input: []
    output: SurveillanceSession
    side_effects: ["session PLANNED -> IN_PROGRESS", "the acting investigator's ASSIGNED assignment on the case -> ACTIVE"]

  - method: POST
    path: "/surveillance-sessions/{id}/complete"
    description: "Complete the session and bill it; stamps billable_minutes and session_charge_cents"
    roles: [Investigator]
    code: 200
    input: [mileage_miles]
    output: SurveillanceSession
    side_effects:
      - "session IN_PROGRESS -> COMPLETED"
      - "run calculations.session_charge"
      - "recompute Case.billable_minutes_total"

  - method: POST
    path: "/surveillance-sessions/{id}/void"
    description: "Void a completed session (compensating action); zeroes its billing and restores Case.billable_minutes_total"
    roles: [CaseManager]
    code: 200
    input: ["reason?"]
    output: SurveillanceSession
    side_effects:
      - "session COMPLETED -> VOIDED"
      - "billable_minutes = 0, session_charge_cents = 0"
      - "recompute Case.billable_minutes_total"

  # --- Evidence & chain of custody ----------------------------------------
  - method: POST
    path: "/evidence"
    description: "Log an evidence item captured during a session; opens its chain of custody"
    roles: [Investigator]
    code: 201
    input: [case_id, session_id, kind, hash_sha256, captured_at]
    output: EvidenceItem
    side_effects:
      - "custody_state = COLLECTED, redaction_state = UNREDACTED"
      - "custodian_user_id = acting X-User-ID"
      - "append CustodyEvent{action: COLLECT, seq: 1}; chain_seq = 1"

  - method: GET
    path: "/evidence/{id}"
    description: "Read an evidence item"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: GET
    path: "/evidence"
    description: "List evidence filtered by case, session, custody state and redaction state"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "session_id?", "custody_state?", "redaction_state?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  - method: POST
    path: "/evidence/{id}/seal"
    description: "Seal a collected item (custody dimension only; redaction_state untouched)"
    roles: [Investigator]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["custody_state COLLECTED -> SEALED", "append CustodyEvent{action: SEAL}; chain_seq += 1"]

  - method: POST
    path: "/evidence/{id}/transfer"
    description: "Hand the item to another custodian; appends a chain link without changing custody_state"
    roles: [Investigator, ComplianceOfficer]
    code: 200
    input: [to_custodian_id]
    output: EvidenceItem
    side_effects: ["custodian_user_id = to_custodian_id", "append CustodyEvent{action: TRANSFER}; chain_seq += 1"]

  - method: POST
    path: "/evidence/{id}/redact"
    description: "Redact an item (redaction dimension only; custody_state untouched)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EvidenceItem
    side_effects:
      - "redaction_state UNREDACTED -> REDACTED"
      - "append CustodyEvent{action: REDACT}; chain_seq += 1"
      - "recompute compliance_redaction_score of every citing report in REDACTION_REVIEW"

  - method: POST
    path: "/evidence/{id}/destroy"
    description: "Destroy a redacted item on a closed case"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: ["custody_state -> DESTROYED", "append CustodyEvent{action: DESTROY}; chain_seq += 1"]

  - method: GET
    path: "/evidence/{id}/custody-events"
    description: "Replay the chain of custody in seq ASC order"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  # --- Skip-trace searches -------------------------------------------------
  - method: POST
    path: "/skip-trace-searches"
    description: "Request a database/skip-trace query; permissible purpose is checked here"
    roles: [Investigator]
    code: 201
    input: [case_id, database_code, permissible_purpose_code, subject_identifier]
    output: SkipTraceSearch
    side_effects: ["SkipTraceSearch.status = REQUESTED"]

  - method: GET
    path: "/skip-trace-searches/{id}"
    description: "Read a skip-trace search"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: []
    output: SkipTraceSearch
    side_effects: []

  - method: GET
    path: "/skip-trace-searches"
    description: "List skip-trace searches filtered by case and status"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: SkipTraceSearch[]
    side_effects: []

  - method: POST
    path: "/skip-trace-searches/{id}/execute"
    description: "Record the vendor outcome; COMPLETED prices the hits and draws the retainer, DENIED charges nothing"
    roles: [Investigator]
    code: 200
    input: [outcome, "hit_count?"]
    output: SkipTraceSearch
    side_effects:
      - "outcome=COMPLETED: status -> COMPLETED, cost_cents = calculations.search_cost, append DRAW ledger entry, run retainer posture recompute"
      - "outcome=DENIED: status -> DENIED, denial_reason = VENDOR_DENIED, no ledger entry"

  # --- Reports -------------------------------------------------------------
  - method: POST
    path: "/reports"
    description: "Draft a report citing evidence; may supersede a prior non-delivered report of the same case (OCC on Case.version)"
    roles: [Investigator]
    code: 201
    input: [case_id, title, evidence_ids, expected_case_version, "supersedes_report_id?"]
    output: InvestigationReport
    side_effects:
      - "InvestigationReport.status = DRAFT, author_investigator_id = acting X-User-ID"
      - "supersedes_report_id, when supplied: that report -> SUPERSEDED"
      - "increments Case.version by 1"

  - method: GET
    path: "/reports/{id}"
    description: "Read a report; a ClientContact may only read reports of its own client and only once DELIVERED"
    roles: [Investigator, CaseManager, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: InvestigationReport
    side_effects: []

  - method: GET
    path: "/reports"
    description: "List reports filtered by case, author, reviewer, supersede target and status"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "author_investigator_id?", "reviewer_investigator_id?", "supersedes_report_id?", "status?", "limit?", "offset?"]
    output: InvestigationReport[]
    side_effects: []

  - method: POST
    path: "/reports/{id}/submit-review"
    description: "Author submits the draft (or the revised draft) for peer review; stamps the AUTHOR_SELF redaction score"
    roles: [Investigator]
    code: 200
    input: []
    output: InvestigationReport
    side_effects: ["status DRAFT|REVISION_REQUESTED -> PEER_REVIEW", "stamp author_redaction_score (AUTHOR_SELF variant)"]

  - method: POST
    path: "/reports/{id}/peer-review"
    description: "Peer review by a different assigned investigator (segregation of duties)"
    roles: [Investigator]
    code: 200
    input: [decision, "note?"]
    output: InvestigationReport
    side_effects:
      - "reviewer_investigator_id = acting X-User-ID"
      - "decision=APPROVE: status -> REDACTION_REVIEW"
      - "decision=REQUEST_REVISION: status -> REVISION_REQUESTED"

  - method: POST
    path: "/reports/{id}/redaction-review"
    description: "Compliance redaction review; APPROVE is gated on the COMPLIANCE redaction score"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: InvestigationReport
    side_effects:
      - "stamp compliance_redaction_score (COMPLIANCE variant)"
      - "decision=APPROVE: status -> APPROVED"
      - "decision=REQUEST_REVISION: status -> REVISION_REQUESTED"

  - method: POST
    path: "/reports/{id}/deliver"
    description: "Deliver the approved report to the client; releases the cited evidence"
    roles: [CaseManager]
    code: 200
    input: []
    output: InvestigationReport
    side_effects:
      - "status APPROVED -> DELIVERED, delivered_at = clock_now"
      - "every cited SEALED EvidenceItem -> RELEASED (+ CustodyEvent{action: TRANSFER, to_custodian_id: CLIENT})"

  # --- Expenses ------------------------------------------------------------
  - method: POST
    path: "/expense-entries"
    description: "Submit a case expense"
    roles: [Investigator]
    code: 201
    input: [case_id, category, amount_cents, incurred_at]
    output: ExpenseEntry
    side_effects: ["ExpenseEntry.status = SUBMITTED", "investigator_id = acting X-User-ID"]

  - method: GET
    path: "/expense-entries/{id}"
    description: "Read an expense entry"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: []
    output: ExpenseEntry
    side_effects: []

  - method: GET
    path: "/expense-entries"
    description: "List expense entries filtered by case, investigator and status"
    roles: [Investigator, CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: ExpenseEntry[]
    side_effects: []

  - method: POST
    path: "/expense-entries/{id}/decision"
    description: "Approve or reject a submitted expense; approval draws the retainer and may suspend the case"
    roles: [CaseManager]
    code: 200
    input: [decision, "note?"]
    output: ExpenseEntry
    side_effects:
      - "decision=APPROVE: status -> APPROVED, append DRAW ledger entry, retainer posture recompute (may SUSPEND the case and deny its REQUESTED searches)"
      - "decision=REJECT: status -> REJECTED, no ledger movement"

  - method: POST
    path: "/expense-entries/{id}/reverse"
    description: "Reverse an approved expense (compensating action); appends a REFUND ledger entry"
    roles: [CaseManager]
    code: 200
    input: ["reason?"]
    output: ExpenseEntry
    side_effects:
      - "status APPROVED -> REVERSED"
      - "append RetainerLedgerEntry{kind: REFUND, amount_cents: expense.amount_cents}"
      - "retainer posture recompute (may resume a SUSPENDED case)"

  # --- Invoices ------------------------------------------------------------
  - method: POST
    path: "/invoices"
    description: "Cut a PROVISIONAL or FINAL draft invoice (OCC on Case.version); voids any prior DRAFT invoice of the case"
    roles: [CaseManager]
    code: 201
    input: [case_id, variant, expected_case_version]
    output: Invoice
    side_effects:
      - "Invoice.status = DRAFT, money fields stamped by calculations.invoice_totals for the variant"
      - "any prior DRAFT Invoice of the case -> VOID"
      - "increments Case.version by 1"

  - method: GET
    path: "/invoices/{id}"
    description: "Read an invoice with all six money fields"
    roles: [CaseManager, ComplianceOfficer, ClientContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices filtered by case and status"
    roles: [CaseManager, ComplianceOfficer]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: "Recompute and issue the invoice; a zero-total invoice is rejected"
    roles: [CaseManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["recompute calculations.invoice_totals", "status DRAFT -> ISSUED"]

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an issued invoice as paid"
    roles: [CaseManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED -> PAID"]

  # --- Court testimony -----------------------------------------------------
  - method: POST
    path: "/court-testimonies"
    description: "Record a subpoena for an investigator on a case"
    roles: [CaseManager]
    code: 201
    input: [case_id, investigator_id, court_state_code]
    output: CourtTestimony
    side_effects: ["CourtTestimony.status = REQUESTED", "Case.court_hold becomes true"]

  - method: GET
    path: "/court-testimonies/{id}"
    description: "Read a court testimony"
    roles: [CaseManager, Investigator, ComplianceOfficer]
    code: 200
    input: []
    output: CourtTestimony
    side_effects: []

  - method: GET
    path: "/court-testimonies"
    description: "List court testimonies filtered by case, investigator and status"
    roles: [CaseManager, Investigator, ComplianceOfficer]
    code: 200
    input: ["case_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: CourtTestimony[]
    side_effects: []

  - method: POST
    path: "/court-testimonies/{id}/schedule"
    description: "Book (or re-book after a continuance) the appearance window; enforces the 120-minute same-case buffer"
    roles: [CaseManager]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: CourtTestimony
    side_effects: ["status REQUESTED|CONTINUED -> SCHEDULED", "scheduled_start / scheduled_end stamped"]

  - method: POST
    path: "/court-testimonies/{id}/continue"
    description: "Grant a continuance; releases the booked slot and returns the testimony to CONTINUED"
    roles: [CaseManager]
    code: 200
    input: ["reason?"]
    output: CourtTestimony
    side_effects: ["status SCHEDULED -> CONTINUED", "continuance_count += 1", "scheduled_start / scheduled_end cleared"]

  - method: POST
    path: "/court-testimonies/{id}/testify"
    description: "Investigator confirms the appearance happened (only after scheduled_end has elapsed on the logical clock)"
    roles: [Investigator]
    code: 200
    input: []
    output: CourtTestimony
    side_effects: ["status SCHEDULED -> TESTIFIED", "recompute Case.court_hold"]

  - method: POST
    path: "/court-testimonies/{id}/cancel"
    description: "Cancel a subpoena; clears the court hold when no other testimony holds the case"
    roles: [CaseManager]
    code: 200
    input: ["reason?"]
    output: CourtTestimony
    side_effects: ["status -> CANCELLED", "recompute Case.court_hold"]

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-05-01T00:00:00Z at server startup and NEVER falls back to real wall-clock time; every licence-validity, testimony-elapsed and *_at stamp reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock = to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (Investigator on another investigator's session/evidence/report/expense/testimony; ClientContact on another client's case or on a non-DELIVERED report)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the peer reviewer is the report's author"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, non-positive amount, malformed datetime, empty evidence_ids, or pagination limit outside [1,100]"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "case id does not resolve"
  - id: ERR_INVESTIGATOR_NOT_FOUND
    http: 404
    condition: "investigator_id does not resolve"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "licence id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id does not resolve"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "surveillance session id does not resolve"
  - id: ERR_EVIDENCE_NOT_FOUND
    http: 404
    condition: "evidence id (path or evidence_ids member) does not resolve"
  - id: ERR_SEARCH_NOT_FOUND
    http: 404
    condition: "skip-trace search id does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report id (path or supersedes_report_id) does not resolve"
  - id: ERR_EXPENSE_NOT_FOUND
    http: 404
    condition: "expense entry id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id does not resolve"
  - id: ERR_TESTIMONY_NOT_FOUND
    http: 404
    condition: "court testimony id does not resolve"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current Case.version on POST /reports or POST /invoices"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a from-state that admits the requested transition"
  - id: ERR_CASE_NOT_ACTIVE
    http: 409
    condition: "the Case is not ACTIVE (or, for expense approval and invoice creation, not in {ACTIVE, SUSPENDED})"
  - id: ERR_CLIENT_BARRED
    http: 409
    condition: "the Client has status BARRED"
  - id: ERR_INVOICE_LOCKED
    http: 409
    condition: "a session void or expense reversal is attempted while the Case has an ISSUED or PAID invoice"
  - id: ERR_LICENSE_INVALID
    http: 422
    condition: "no ACTIVE licence covering the required state code is valid on the logical clock"
  - id: ERR_PERMISSIBLE_PURPOSE_INVALID
    http: 422
    condition: "a CREDIT_HEADER search asserts a purpose outside {LITIGATION, DEBT_COLLECTION}"
  - id: ERR_REDACTION_INCOMPLETE
    http: 422
    condition: "delivery attempted while a cited evidence item is UNREDACTED or its custody_state is not in {SEALED, RELEASED}"
  - id: ERR_EVIDENCE_UNREDACTED
    http: 422
    condition: "destruction attempted on an UNREDACTED evidence item"
  - id: ERR_COURT_HOLD_ACTIVE
    http: 409
    condition: "case close attempted while court_hold == true"
  - id: ERR_EVIDENCE_CASE_MISMATCH
    http: 422
    condition: "a cited evidence item belongs to a different case than the report"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_report_id names a report of a different case, or one that is already DELIVERED or SUPERSEDED"
  - id: ERR_NOT_ASSIGNED_TO_CASE
    http: 422
    condition: "the acting or named investigator holds no Assignment on the case with status in {ASSIGNED, ACTIVE}"
  - id: ERR_INTERVAL_INVALID
    http: 422
    condition: "end_at <= start_at, or scheduled_end <= scheduled_start"
  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "the half-open interval [start_at, end_at) collides with another PLANNED/IN_PROGRESS/COMPLETED session of the same investigator"
  - id: ERR_TESTIMONY_BUFFER_CONFLICT
    http: 409
    condition: "the requested closed appearance interval sits within 120 minutes of another SCHEDULED testimony of the same case"
  - id: ERR_TESTIMONY_NOT_ELAPSED
    http: 409
    condition: "testify called before the logical clock reaches scheduled_end"
  - id: ERR_DUPLICATE_ASSIGNMENT
    http: 409
    condition: "the investigator already holds an ASSIGNED/ACTIVE assignment on that case"
  - id: ERR_LEAD_ALREADY_ASSIGNED
    http: 409
    condition: "the case already has an ASSIGNED/ACTIVE LEAD assignment"
  - id: ERR_DUPLICATE_EVIDENCE_HASH
    http: 409
    condition: "hash_sha256 already exists on another evidence item of the same case"
  - id: ERR_RATE_OUT_OF_BAND
    http: 422
    condition: "hourly_rate_cents falls outside the seniority band"
  - id: ERR_CONTINUANCE_LIMIT
    http: 409
    condition: "a third continuance is requested (continuance_count already == 2)"
  - id: ERR_INVOICE_EMPTY
    http: 422
    condition: "issue attempted on an invoice whose recomputed total_cents == 0"
  - id: ERR_DRAFT_INVOICE_OPEN
    http: 409
    condition: "case close attempted while a DRAFT invoice exists"
  - id: ERR_RETAINER_BELOW_MINIMUM
    http: 422
    condition: "a deposit leaves a CONFLICT_CLEARED case below MIN_RETAINER_CENTS (50000)"
  - id: ERR_EXPENSE_LIMIT_EXCEEDED
    http: 422
    condition: "amount_cents exceeds MAX_SINGLE_EXPENSE_CENTS (100000)"
  - id: ERR_RETAINER_EXHAUSTED
    http: 402
    condition: "retainer_balance_cents is 0 or negative at session/search creation, or an expense approval would drive it below 0"
  - id: ERR_REDACTION_SCORE_TOO_HIGH
    http: 422
    condition: "redaction-review APPROVE while compliance_redaction_score exceeds the case's confidentiality threshold (STANDARD 40, RESTRICTED 20)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CaseManager
    description: "Runs case intake, retainer, staffing, billing, delivery and court scheduling. Never performs field work and never adjudicates redaction."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /cases"
      - "POST /cases/{id}/retainer"
      - "POST /cases/{id}/close"
      - "POST /assignments"
      - "POST /assignments/{id}/release"
      - "POST /surveillance-sessions/{id}/void"
      - "POST /reports/{id}/deliver"
      - "POST /expense-entries/{id}/decision"
      - "POST /expense-entries/{id}/reverse"
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/pay"
      - "POST /court-testimonies"
      - "POST /court-testimonies/{id}/schedule"
      - "POST /court-testimonies/{id}/continue"
      - "POST /court-testimonies/{id}/cancel"
    shared_operations:
      - "GET /cases/{id}, GET /cases, GET /cases/{id}/ledger, GET /cases/{id}/summary"
      - "GET /clients/{id}, GET /investigators/{id}, GET /investigators/{id}/licenses"
      - "GET /assignments, GET /assignments/{id}"
      - "GET /surveillance-sessions, GET /surveillance-sessions/{id}"
      - "GET /evidence, GET /evidence/{id}, GET /evidence/{id}/custody-events"
      - "GET /skip-trace-searches, GET /skip-trace-searches/{id}"
      - "GET /reports, GET /reports/{id}"
      - "GET /expense-entries, GET /expense-entries/{id}"
      - "GET /invoices, GET /invoices/{id}"
      - "GET /court-testimonies, GET /court-testimonies/{id}"

  - name: Investigator
    description: "Licensed field investigator. Plans and runs surveillance, logs evidence, runs skip-trace queries, authors and peer-reviews reports, submits expenses and testifies."
    identity: "entity_backed:Investigator"
    exclusive_operations:
      - "POST /surveillance-sessions"
      - "POST /surveillance-sessions/{id}/start"
      - "POST /surveillance-sessions/{id}/complete"
      - "POST /evidence"
      - "POST /evidence/{id}/seal"
      - "POST /skip-trace-searches"
      - "POST /skip-trace-searches/{id}/execute"
      - "POST /reports"
      - "POST /reports/{id}/submit-review"
      - "POST /reports/{id}/peer-review"
      - "POST /expense-entries"
      - "POST /court-testimonies/{id}/testify"
    shared_operations:
      - "POST /evidence/{id}/transfer (shared with ComplianceOfficer)"
      - "GET /cases/{id}, GET /investigators/{id}, GET /investigators/{id}/licenses"
      - "GET /assignments, GET /assignments/{id}, GET /surveillance-sessions, GET /surveillance-sessions/{id}"
      - "GET /evidence, GET /evidence/{id}, GET /evidence/{id}/custody-events"
      - "GET /skip-trace-searches, GET /skip-trace-searches/{id}, GET /reports, GET /reports/{id}"
      - "GET /expense-entries, GET /expense-entries/{id}, GET /court-testimonies, GET /court-testimonies/{id}"

  - name: ComplianceOfficer
    description: "Runs conflict checks, licence administration, redaction review and evidence destruction. Segregated from case management and from field work."
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/conflict-check"
      - "POST /investigators/{id}/licenses"
      - "POST /licenses/{id}/revoke"
      - "POST /evidence/{id}/redact"
      - "POST /evidence/{id}/destroy"
      - "POST /reports/{id}/redaction-review"
    shared_operations:
      - "POST /evidence/{id}/transfer (shared with Investigator)"
      - "GET /clients/{id}, GET /cases, GET /cases/{id}, GET /cases/{id}/ledger, GET /cases/{id}/summary"
      - "GET /investigators/{id}, GET /investigators/{id}/licenses, GET /assignments, GET /assignments/{id}"
      - "GET /surveillance-sessions, GET /surveillance-sessions/{id}, GET /evidence, GET /evidence/{id}, GET /evidence/{id}/custody-events"
      - "GET /skip-trace-searches, GET /skip-trace-searches/{id}, GET /reports, GET /reports/{id}"
      - "GET /expense-entries, GET /expense-entries/{id}, GET /invoices, GET /invoices/{id}, GET /court-testimonies, GET /court-testimonies/{id}"

  - name: ClientContact
    description: "The retaining client's contact person. Read-only, and only on its own client's cases and DELIVERED reports."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "GET /clients/{id} (own client only)"
      - "GET /cases/{id} (own client's cases only)"
      - "GET /reports/{id} (own client's cases, DELIVERED only)"
      - "GET /invoices/{id}"

  - name: PlatformAdmin
    description: "Operational role: provisions investigators and drives the logical clock. Holds no case-level authority."
    identity: opaque
    exclusive_operations:
      - "POST /investigators"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /investigators/{id}"
