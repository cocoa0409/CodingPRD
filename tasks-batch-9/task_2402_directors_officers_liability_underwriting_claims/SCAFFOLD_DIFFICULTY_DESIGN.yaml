            - "trigger call 2 returns 422 ERR_NOTICE_OUTSIDE_PERIOD on P2, which isolates priority 62: the only difference from trigger call 1 is that P2's coverage_status is INCEPTED, an accepted state for notices"
            - "trigger call 4 returns 201 with data.status == NOTICED, data.notice_date == 2026-09-02T00:00:00Z and data.retention_remaining_usd == 250000, proving both rules pass once the clock is inside [period_start, period_end)"
            - "the winning error is decided by priority, not by category ordering or by which condition is cheaper to evaluate: the state error is a 409 and the temporal error a 422, so the HTTP status alone distinguishes the two outcomes"
      - name: rejected_conduct_exclusion_and_capacity_exceeded_returns_mandatory_exclusion_error
        grounds:
          - validations[priority=54]
          - validations[priority=86]
          - state_machines.Quote.OFFERED_to_ACCEPTED
          - state_machines.ExclusionTerm.PROPOSED_to_REJECTED
          - calculations.entity_side_c_capacity
        distinguishing_aspect: |
          A different priority pair with different categories: priority 54 (business_safety,
          ERR_MANDATORY_EXCLUSION_MISSING, 422) versus priority 86 (business_fiscal,
          ERR_ENTITY_CAPACITY_EXCEEDED, 409) on the same accept call. The insured's Side C cap of
          4,000,000 is already breached by the 5,000,000 sublimit AND the mandatory CONDUCT term was
