  - rule_id: priority_pair_validation_conflict
    instances:
      - name: tender_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=22]
          - errors[ERR_FAIR_NOT_OPEN]
          - errors[ERR_TENDER_SHORT]
          - state_machines.SaleTransaction.DRAFT_to_TENDERED
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the tender violates BOTH the
          fair-OPEN state gate (fair already RECONCILING) AND the fiscal floor
          (tendered 1 < total 1000). Priority 8 beats priority 22, so the response
          must be ERR_FAIR_NOT_OPEN (409), never ERR_TENDER_SHORT (402).
        test_recipe:
          setup:
            - "Fair was OPEN with one FRONTLIST line delivered 10 and a DRAFT sale of qty 1 (total 1000); fair then closed to RECONCILING"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 10 }, as: Organizer, captures: { line_id: "$.data.id" } }
            - { call: "POST /stock-lines/${line_id}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_id}/deliver", payload: { qty_delivered: 10 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_id}", qty: 1 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
            - { call: "POST /fairs/${fair_id}/close-sales", payload: {}, as: Organizer, as_user_id: "org_lead_1" }
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: { tendered_amount_cents: 1 }
              as: Cashier
              captures: { err: "$.data.error_id" }
          assert:
            - "Response error_id == ERR_FAIR_NOT_OPEN (state, priority 8)"
            - "Response error_id != ERR_TENDER_SHORT (fiscal, priority 22) even though tendered_amount_cents (1) < total_cents (1000)"
            - "HTTP status == 409, not 402"
            - "SaleTransaction.${sale_id}.status remains DRAFT"

      - name: admit_safety_beats_referential
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors[ERR_LINE_CAPACITY_EXCEEDED]
          - errors[ERR_TICKET_SESSION_MISMATCH]
          - state_machines.SigningTicket.ISSUED_to_ADMITTED
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (distinct from the
          state-vs-fiscal pair): the admit violates BOTH the fire-marshal concurrent
          cap (target session already holds 1 ADMITTED of admit_concurrent_cap 1)
          AND the ticket-session referential check (ticket belongs to a different
          session than the payload names). Priority 10 beats priority 20.
