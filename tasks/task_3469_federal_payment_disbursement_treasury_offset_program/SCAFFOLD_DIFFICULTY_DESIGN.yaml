          setup:
            - "Clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333; FULL SALARY policy ACTIVE; two ACTIVE debts for the payee (FEDERAL_TAX 30000 delinquent 2026-01-10; FEDERAL_NONTAX 20000 delinquent 2026-02-01). One 100000-cent SALARY payment evaluated (waterfall takes 30000 then 20000) and executed; both debts PAID_IN_FULL; creditor net ledger 48500."
