              payload: { agreement_id: "${ct1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ACTUAL_TRUE_UP", expected_agreement_version: "${ct1_v}" }
              as: BillingAnalyst
              captures: { inv_t1_id: $.data.id, inv_t1_total: $.data.total_amount, inv_t1_minbill: $.data.minimum_bill_applied, inv_t1_energy: $.data.billed_energy_mwh, inv_t1_dem: $.data.billed_demand_kw, inv_t1_lf: $.data.load_factor_pct }
            - call: "POST /district-energy/invoices"
              payload: { agreement_id: "${ct2_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", variant: "ACTUAL_TRUE_UP", expected_agreement_version: "${ct2_v}" }
              as: BillingAnalyst
