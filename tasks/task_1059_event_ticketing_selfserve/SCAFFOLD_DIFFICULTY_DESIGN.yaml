  - rule_id: resource_temporal_overlap
    instances:

      - name: venue_occupancy_uses_turnaround_buffer_half_open_interval
        grounds:
          - validations[priority=50]
          - errors[ERR_VENUE_DOUBLE_BOOKED]
          - entities.Event.fields.starts_at
          - entities.Event.fields.ends_at
        distinguishing_aspect: |
          Interval semantics #1 on the VENUE resource: each Event occupies the BUFFER-EXTENDED
          half-open interval [starts_at, ends_at + 90 minutes), so a new event starting at
          2026-08-01T23:00:00Z collides while one starting at exactly 2026-08-02T00:00:00Z
          (the buffer's exclusive right edge) is accepted.
        test_recipe:
          setup:
            - "Venue V hosts Event E1 from 2026-08-01T18:00:00Z to 2026-08-01T22:00:00Z, status DRAFT (any non-CANCELLED status occupies the venue)."
            - "E1's occupied interval is therefore [2026-08-01T18:00:00Z, 2026-08-02T00:00:00Z)."
            - "Logical clock at the default 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/organizers"
              payload: { display_name: "Turnaround Touring", contact_email: "ops@turnaround.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Turnaround Hall", city: "Kansas City", seated_capacity: 800 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Early Show", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T22:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Late Show Too Early", starts_at: "2026-08-01T23:00:00Z", ends_at: "2026-08-02T01:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/events"
              payload: { organizer_id: "${org_id}", venue_id: "${venue_id}", title: "Late Show On Buffer Edge", starts_at: "2026-08-02T00:00:00Z", ends_at: "2026-08-02T02:00:00Z", fee_mode: "PASS_ON", refund_policy: "FEE_RETAINED" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { e3_id: $.data.id }
          assert:
            - "the first POST /api/events returns HTTP 409 with data.error_id == ERR_VENUE_DOUBLE_BOOKED"
            - "the second POST /api/events returns HTTP 201"
            - "Event.${e3_id}.starts_at == 2026-08-02T00:00:00Z"
            - "GET /api/events?venue_id=${venue_id} returns total_count == 2"

      - name: seat_occupancy_frees_exactly_at_hold_expiry_instant
        grounds:
          - validations[priority=70]
          - errors[ERR_SEAT_UNAVAILABLE]
          - entities.Order.fields.hold_expires_at
          - entities.SeatBlock.fields.seats_taken
        distinguishing_aspect: |
          Interval semantics #2, on a DIFFERENT resource (SeatBlock seat) and with different
          arithmetic: a held seat is occupied over [order.created_at, hold_expires_at) with no
          buffer at all, so the same seat request is refused at 2026-07-05T10:00:00Z and
          accepted at exactly 2026-07-05T10:15:00Z, the SEAT_HOLD_MINUTES expiry instant.
        test_recipe:
          setup:
            - "ONSALE Event E has RESERVED TicketType T (quantity_total 10) with SeatBlock SB row A seats 1..10."
            - "Buyer B1 created an unpaid Order at 2026-07-05T10:00:00Z holding seat 3, so hold_expires_at == 2026-07-05T10:15:00Z and SeatBlock.seats_taken == 1."
            - "Buyer B2 has no orders on E."
          setup_api_calls:
