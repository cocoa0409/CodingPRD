  - rule_id: resource_temporal_overlap
    instances:
      - name: gap_defect_closed_interval_on_parcel
        grounds:
          - validations[priority=8]
          - entities.TitleSearch.fields.gap_from_date
          - entities.TitleSearch.fields.gap_to_date
          - errors[ERR_GAP_DEFECT]
        distinguishing_aspect: |
          A LIEN plant record whose recorded_date equals gap_from_date (2026-02-01,
          the CLOSED lower boundary, inclusive) of an active gap window
