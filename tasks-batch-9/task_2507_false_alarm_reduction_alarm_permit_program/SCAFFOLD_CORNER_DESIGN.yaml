            - "AlarmSystem.${system_block2_id}.status is still SUBMITTED and no second AlarmPermit exists"
            - "paying 1 cent against the balance and replaying the approval returns 201, which pins the inclusive edge"

      - name: adjustment_amount_above_outstanding_is_rejected
        claim_type: Violation -> Error
        grounds:
