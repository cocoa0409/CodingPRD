              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_INVALID_TIME_WINDOW; HTTP 400"]

      - name: credit_limit_exceeded_standalone_returns_402
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Placing an unlinked order (total 54000) against a client with credit_limit 100 -> ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["Client credit_limit_cents 100; DRAFT order (no quote) total 54000."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Rho", primary_contact_email: "r@rho.test", credit_limit_cents: 100 }
