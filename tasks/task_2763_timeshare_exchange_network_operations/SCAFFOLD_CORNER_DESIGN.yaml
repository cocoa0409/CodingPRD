# =============================================================================
# §1.9 Corner Design — Timeshare Exchange Network Operations
# Breadth probe over §1.1–§1.7. Nine sections, taxonomy and claim_type values
# taken from references/claim-extraction-guide.md.
#
# Shared assumptions for every recipe (identical to SCAFFOLD_DIFFICULTY_DESIGN):
#   * The database starts empty and the logical clock starts at the mandatory
#     default 2026-08-01T00:00:00Z. A recipe only calls
#     POST /exchange-network/_clock/set_current_utc when it needs a later instant.
#   * Setting the clock has no side effects of its own; every time-driven
#     transition happens inside POST /exchange-network/matching-runs.
#   * "Tier PLUS" means tier_code PLUS with annual_dues_cents 19900,
#     base_exchange_fee_cents 20900, priority_surcharge_cents 2500,
#     priority_window_days 365, deposit_first_bonus_pct 10,
#     max_active_requests 3, cancellation_fee_cents 8900,
#     reinstatement_fee_cents 10900, extension_fee_cents_per_month 3400.
#   * "Resort A" means name "Aspen Ridge Club", region_code US-CO,
#     required_annual_deposit_units 2, initial_quality_rating GOLD_CROWN,
#     units_per_size 2, demand_index 4, with a GOLD season band 04-01..06-30,
#     affiliated at the default clock.
#   * Dues are paid with amount_cents 100000 and paid_through_date "2030-12-31"
#     unless the recipe is about lapsing, so wallet_credit_cents starts at 80100.
#   * At Resort A a ONE_BR week checking in 2027-06-15 is worth 82
#     (45 * 1.25 * 1.10 = 61.875 -> 62, +6 = 68, lead 318 -> factor 1.20,
#     81.6 -> 82). This one number recurs throughout the file.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: membership_tier_creation_echoes_every_declared_field
        claim_type: creation
        grounds: ["entities.MembershipTier", "endpoints[POST /exchange-network/membership-tiers]"]
        distinguishing_aspect: >-
          All ten MembershipTier business fields are `source: input` and none has a default, so a
          201 response must echo every one of them verbatim alongside the four common fields. A
          server that silently drops priority_window_days or coerces the cents fields to strings
          fails here before any pricing test runs.
        test_recipe:
          setup: ["Empty database, default clock."]
          setup_api_calls: []
          trigger:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
          assert:
            - "HTTP 201 and the envelope has response_type \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "data echoes tier_code \"PLUS\", annual_dues_cents 19900, base_exchange_fee_cents 20900, priority_surcharge_cents 2500, priority_window_days 365, deposit_first_bonus_pct 10, max_active_requests 3, cancellation_fee_cents 8900, reinstatement_fee_cents 10900, extension_fee_cents_per_month 3400 — all as integers"
            - "data.id is non-empty, data.version == 1, data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\""
            - "GET /exchange-network/membership-tiers/${plus_tier} returns the identical field values"

      - name: resort_defaults_applied_when_units_and_demand_omitted
        claim_type: defaults
        grounds: ["entities.Resort.units_per_size", "entities.Resort.demand_index", "calculations.deposit_trading_power"]
        distinguishing_aspect: >-
          units_per_size defaults to 2 and demand_index defaults to 3, and 3 is the DEMAND_PIVOT, so
          the default resort has a demand multiplier of exactly 1.00. A server that defaults
          demand_index to 0 or leaves it null produces 27 or a crash instead of 30 on the first
          deposit, which makes the default observable through the valuation rather than only through
          the create response.
        test_recipe:
          setup: >-
            Tier PLUS. A resort created with only the four required fields — no units_per_size and no
            demand_index — plus a SILVER band covering the whole year so January is valuable, then
            affiliated. Member M1 on PLUS, dues-paid.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Cedar Point Retreat", region_code: "US-OH", required_annual_deposit_units: 1, initial_quality_rating: "STANDARD" }
              captures: { resort_d: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_d}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_d}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_d}", unit_size: "STUDIO", check_in_date: "2027-01-15" }
              captures: { dep: "$.data.id" }
          assert:
            - "GET /exchange-network/resorts/${resort_d} — units_per_size == 2 and demand_index == 3, both server-supplied"
            - "GET /exchange-network/deposits/${dep} — awarded_power == 30 (30 * 1.00 * 1.00 = 30.0 -> 30, +0 for STANDARD, lead 167 -> factor 1.00, 30)"
            - "GET /exchange-network/deposits/${dep}/valuation — demand_multiplier == \"1.00\", season_multiplier == \"1.00\", quality_bonus == 0, unit_size_base == 30"
            - "GET /exchange-network/resorts/${resort_d} — affiliation_status == \"ACTIVE\", affiliated_on == \"2026-08-01\", quality_rating == \"STANDARD\", quality_score == null, review_count == 0, downgrade_notches == 0, complaint_strikes == 0"

      - name: member_system_and_computed_fields_initialised_by_server
        claim_type: system_fields
        grounds: ["entities.Member", "state_machines.Member.enrollment_status.initial_state"]
        distinguishing_aspect: >-
          A newly created Member is not yet transactable: enrollment_status must be PENDING_PAYMENT,
          not ACTIVE, and the three balances must be zero even though nothing in the request body
          mentions them. dues_paid_through must be null rather than the creation date, otherwise the
          step 0 lapse sweep would treat brand-new members as paid.
        test_recipe:
          setup: ["Tier PLUS exists. No members yet. Default clock."]
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id" }
          assert:
            - "HTTP 201; data.enrollment_status == \"PENDING_PAYMENT\", the declared initial_state"
            - "data.trading_power_balance == 0, data.wallet_credit_cents == 0, data.active_request_count == 0, data.dues_paid_through == null, data.home_resort_id == null"
            - "data.id, data.created_at, data.updated_at are server-generated and data.version == 1"
            - "GET /exchange-network/ledger-entries?member_id=${m1} — total_count == 0; creating a member writes no ledger row"

      - name: deposit_computed_fields_derived_from_resort_and_clock
        claim_type: computed_fields
        grounds: ["entities.Deposit", "occupancy_model", "calculations.deposit_trading_power"]
        distinguishing_aspect: >-
          Six of Deposit's fields are derived rather than supplied: season_band_code is resolved from
          the resort's calendar, occupancy_end_date is check_in_date + 8 as an EXCLUSIVE end,
          awarded_power is the AT_DEPOSIT variant, settlement_power must still be null because no run
          has touched the row, remaining_power equals awarded_power minus a zero haircut, and
          expires_at is check_in_date + 730 days at midnight — not created_at + 730.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated at the default clock, member M1 on PLUS and dues-paid.
            Nothing else exists, so no matching run has ever run.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep: "$.data.id" }
          assert:
            - "HTTP 201; data.season_band_code == \"GOLD\" resolved from the 04-01..06-30 band"
            - "data.occupancy_end_date == \"2027-06-23\" (check_in_date + 8, exclusive), NOT \"2027-06-22\""
            - "data.awarded_power == 82 and data.remaining_power == 82 and data.restoration_haircut_power == 0"
            - "data.settlement_power == null — no matching run has reserved or listed this deposit"
            - "data.expires_at == \"2029-06-14T00:00:00Z\" (check_in_date + 730 days at midnight) and data.extension_months_purchased == 0"
            - "data.deposit_status == \"BANKED\" and data.rental_status == \"NOT_LISTED\" — both dimensions at their initial states"
            - "GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 1 and committed_nights == 8"

      - name: deposit_get_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority 6]", "errors[ERR_DEPOSIT_NOT_FOUND]"]
        distinguishing_aspect: >-
          A syntactically valid but unknown deposit id on a read must be 404 ERR_DEPOSIT_NOT_FOUND,
          not 200 with a null body and not 400. The same id used on a sub-resource read must produce
          the same error, proving the path-parameter existence check runs before the sub-resource
          projection.
        test_recipe:
          setup: ["Empty database except a single membership tier, so no Deposit row exists at all. Default clock."]
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/deposits/11111111-1111-4111-8111-111111111111"
              as: NetworkOperator
              payload: {}
              captures: { err: "$.data.error_id" }
            - call: "GET /exchange-network/deposits/11111111-1111-4111-8111-111111111111/valuation"
              as: NetworkOperator
              payload: {}
              captures: { err2: "$.data.error_id" }
          assert:
            - "both trigger calls — HTTP 404 with error_id ERR_DEPOSIT_NOT_FOUND"
            - "both responses use the error envelope: response_type \"error\" and data containing only error_id and message"
            - "GET /exchange-network/deposits — total_count == 0, has_more false, data == []"

      - name: create_calls_with_malformed_bodies_return_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority 4]", "errors[ERR_INVALID_REQUEST]", "entities.Resort.demand_index", "entities.Member.tier_id"]
        distinguishing_aspect: >-
          Priority 4 covers three different shape failures with one error_id: a missing required
          field, an out-of-range integer, and an enum value outside its declared set. All three must
          be 400 ERR_INVALID_REQUEST rather than 422 or 404, and the out-of-range case must be caught
          even though demand_index is optional — a supplied optional field is still range-checked.
        test_recipe:
          setup: ["Tier PLUS exists so a valid tier_id is available for the control call. Default clock."]
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran" }
              captures: { err_missing: "$.data.error_id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", demand_index: 7 }
              captures: { err_range: "$.data.error_id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "PLATINUM_CROWN" }
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "call 1, tier_id absent — HTTP 400 with error_id ERR_INVALID_REQUEST, not 404 ERR_TIER_NOT_FOUND"
            - "call 2, demand_index 7 outside 1..5 — HTTP 400 with error_id ERR_INVALID_REQUEST even though demand_index is an optional input"
            - "call 3, initial_quality_rating not in {GOLD_CROWN, SILVER_CROWN, STANDARD, HOSPITALITY} — HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /exchange-network/members — total_count == 0 and GET /exchange-network/resorts — total_count == 0; none of the three rejected calls persisted anything"

      - name: deposits_listing_returns_pagination_envelope_fields
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults", "endpoints[GET /exchange-network/deposits]"]
        distinguishing_aspect: >-
          The list envelope must carry all four pagination fields with total_count reflecting the
          whole filtered set rather than the returned page, and has_more must be a boolean derived
          from offset + len(data) < total_count. With three deposits and the default limit of 10 the
          page holds all three and has_more must be false.
        test_recipe:
          setup: >-
            Tier PLUS, Resort A affiliated, member M1 on PLUS and dues-paid, and three ONE_BR weeks
            banked at Resort A with non-conflicting occupancy intervals: 2027-05-10, 2027-06-15 and
            2027-06-25, each worth 82. No pagination parameters are supplied on the trigger, so the
            defaults apply.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-05-10" }
              captures: { dep1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep2: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-25" }
              captures: { dep3: "$.data.id" }
          trigger:
            - call: "GET /exchange-network/deposits"
              as: NetworkOperator
              payload: {}
              captures: { first_row: "$.data[0].id" }
          assert:
            - "HTTP 200 with response_type \"array\"; the envelope carries limit == 10, offset == 0, total_count == 3 and has_more == false"
            - "data has exactly 3 rows and every row's awarded_power == 82"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 246 (three 82-point credits)"
            - "GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 3 and committed_nights == 24"

      - name: deposit_body_fk_to_unknown_resort_returns_resort_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority 7]", "errors[ERR_RESORT_NOT_FOUND]", "complexity_profile.entity_topology"]
        distinguishing_aspect: >-
          The topology is flat, so Deposit reaches its resort through a body foreign key rather than
          a nested URL. Priority 7 checks body foreign keys in the endpoint's declared input order,
          so an unknown resort_id must surface ERR_RESORT_NOT_FOUND even though member_id is checked
          first and is valid — and it must surface before the priority 15 affiliation check and the
          priority 21 season-band check, which cannot even be evaluated for a resort that does not
          exist.
        test_recipe:
          setup: >-
            Tier PLUS and member M1 on PLUS, dues-paid. No resort has ever been created, so any
            resort_id is unknown.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "22222222-2222-4222-8222-222222222222", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id ERR_RESORT_NOT_FOUND, not ERR_RESORT_NOT_AFFILIATED and not ERR_NO_SEASON_BAND_FOR_DATE"
            - "GET /exchange-network/deposits — total_count == 0"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 0 and wallet_credit_cents == 80100, untouched"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: matching_run_reaches_completed_within_the_creating_request
        claim_type: initial_state
        grounds: ["state_machines.MatchingRun.status", "matching_run_step_order"]
        distinguishing_aspect: >-
          MatchingRun is the only linear machine and it must not be observable in PENDING from the
          outside: the seven ordered steps all execute inside the creating POST, so the 201 response
          already reports COMPLETED with every counter populated. On an empty network all thirteen
          counters must be 0 rather than null, which proves they are computed rather than defaulted
          from a later aggregation.
        test_recipe:
          setup: ["Empty database, default clock 2026-08-01T00:00:00Z. No members, resorts, deposits or requests exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "cold start" }
              captures: { run1: "$.data.id" }
          assert:
            - "HTTP 201; data.status == \"COMPLETED\" — never PENDING — and data.run_sequence == 1"
            - "data.as_of_utc == \"2026-08-01T00:00:00Z\", the logical clock at call time, and data.note == \"cold start\""
            - "lapsed_member_count, expired_deposit_count, probation_resort_count, expired_request_count, denied_request_count, matched_count, waitlisted_count, completed_confirmation_count and getaway_listed_count are all 0"
            - "GET /exchange-network/matching-runs/${run1} — status still COMPLETED; the terminal state is reached synchronously"
            - "a second POST /exchange-network/matching-runs yields run_sequence == 2, so the sequence is per-network and monotonic"

      - name: dispute_withdrawn_from_open_without_review
        claim_type: valid_transition
        grounds: ["state_machines.Dispute.status", "endpoints[POST /exchange-network/disputes/{dispute_id}/withdrawal]"]
        distinguishing_aspect: >-
          The Dispute machine allows OPEN to go straight to the WITHDRAWN terminal without passing
          through UNDER_REVIEW, so the member-initiated exit is not gated on analyst action. The
          withdrawal must leave granted_power_adjustment at 0 and must not touch the cited deposit's
          power, distinguishing it from the RESOLVED_UPHELD path that does move power.
        test_recipe:
          setup: >-
