  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: guest_registration_state_error_beats_screening_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SCREENING_NOT_CLEARED
        distinguishing_aspect: |
          Category pair state vs business_safety: registering a guest on a
          CHECKED_OUT stay that also lacks any same-day PASS screening violates
          both priority 4 and priority 5; priority 4 wins, so the response is
          ERR_INVALID_STATE (409), never ERR_SCREENING_NOT_CLEARED.
        test_recipe:
          setup:
            - "A stay that has already CHECKED_OUT (checked in 2026-09-02, out 2026-09-05). No screening recorded on the current date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/rooms"
