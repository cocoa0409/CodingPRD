            - "the earlier open by the arming user also returned 200 with open_state == \"UNLOCKED\""
            - "Safe.${safe_id}.open_state == \"LOCKED\" and balance_cents == 400000"

      - name: barred_cashier_cannot_be_assigned_after_substantiated_close
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=50]
          - state_machines.VarianceCase.ESCALATED_to_CLOSED_SUBSTANTIATED
          - errors[ERR_CASHIER_BARRED]
        distinguishing_aspect: >
          A SUBSTANTIATED close writes the 59000 loss off the safe ledger, restores posture to OPEN and
          keeps the cashier BARRED — so the next assignment fails with 403 ERR_CASHIER_BARRED rather
          than 409 ERR_SAFE_FROZEN, proving the two gates are distinct.
        test_recipe:
          setup:
            - "Store S-1953 (default thresholds), MANUAL safe SAFE-A (500000), cashier E-100, journal 2026-08-03"
            - "Session reconciles 60000 short; the SESSION_VARIANCE case is attributed 1000 to REGISTER, escalated, then closed SUBSTANTIATED by loss prevention"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1953", name: "Store 1953", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
