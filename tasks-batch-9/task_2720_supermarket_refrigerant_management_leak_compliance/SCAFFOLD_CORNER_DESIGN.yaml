          - calculations.total_refrigerant_mass_invariant
        distinguishing_aspect: "A RECOVER_REFRIGERANT record moves 30.0 lb out of the system and into the cylinder in one write: fill_limit_lbs is the derived 40.0 (80 percent of 50.0), contents go 0.0 to 30.0, disposition flips VIRGIN to RECOVERED, and the store's four mass buckets still total 80.0."
