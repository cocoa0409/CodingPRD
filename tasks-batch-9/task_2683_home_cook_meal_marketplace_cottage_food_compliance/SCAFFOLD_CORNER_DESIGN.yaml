          difficulty_instance: "dual_variant_calc / payout_basis_accrual_vs_cash_divergence"
          rationale: >
            Both dual-variant calculations are proven divergent there and in its sibling
            safety_score_substantiated_only_vs_intake_inclusive: the same window drafted under
            ACCRUAL_WINDOW and CASH_HANDOFF yields different nets, and the same incident set yields
            different authoritative and advisory scores.

      - name: cumulative_severity_points_cross_the_standing_bands_at_their_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.cook_safety_score.constants
          - state_machines.Cook.compliance_standing
        distinguishing_aspect: >
          The standing bands are cumulative, not per-incident, and the SUSPEND band is strict: a cook
          whose accumulated charge is exactly 40 sits at score 60 and stays WARNED, because the band is
          score < 60 rather than score <= 60. The sequence lands that boundary exactly with a mix of
          severities, so an implementation that inverted the comparison suspends one incident too early,
          and it holds the clock still so every decay factor is 1.00 and the whole movement is
          attributable to accumulation rather than ageing.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /production-windows: cook ${cook_id} ACTIVE and CLEAR at safety_score 100 in CA, APPROVED MenuItem ${mi_id}, OPEN window ${w_id}. Clock 2026-08-01T00:00:00Z and never advanced."
            - "Five incidents are filed and substantiated one at a time, all created at the same clock instant so decay(I) == 1.00 for every one of them."
          setup_api_calls: []
