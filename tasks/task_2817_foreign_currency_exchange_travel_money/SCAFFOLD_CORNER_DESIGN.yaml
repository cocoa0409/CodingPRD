        distinguishing_aspect: "Each settlement-axis trigger has its own error for a wrong from-state: authorize on an already-AUTHORIZED row gives ERR_TRANSACTION_NOT_QUOTED, reverse on a QUOTED row gives ERR_TRANSACTION_NOT_SETTLED, and void on a SETTLED row gives ERR_TRANSACTION_NOT_VOIDABLE - three distinct error ids from one shared priority-5 state rule."
