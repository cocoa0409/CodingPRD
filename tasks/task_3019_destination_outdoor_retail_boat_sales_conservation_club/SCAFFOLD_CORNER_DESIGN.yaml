            - "the union of the two responses contains both sessions and no duplicates"

      - name: action_endpoint_confirm_enforces_its_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /stores/event-offerings/{offering_id}/registrations/{registration_id}/confirm
          - state_machines.EventRegistration.transitions.REGISTERED_to_CONFIRMED
