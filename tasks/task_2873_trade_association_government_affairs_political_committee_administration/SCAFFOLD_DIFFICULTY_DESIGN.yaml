  - rule_id: transitive_cascade
    instances:
      - name: adopt_position_cascades_votes_to_members_to_seats_to_committee
        grounds:
          - state_machines.PolicyPosition.transitions[CONSENSUS_REACHED->ADOPTED]
          - state_machines.CommitteeSeat.transitions[ACTIVE->DAMPENED]
          - entities.Member.fields.recorded_dissent_count
          - entities.CommitteeSeat.fields.dissent_strikes
          - entities.PolicyCommittee.fields.total_voting_weight
        distinguishing_aspect: |
          A four-hop chain in ONE request - position -> PositionVote (dissent RECORDED) -> Member
          (recorded_dissent_count) -> CommitteeSeat (dissent_strikes, damping, voting_weight) -> PolicyCommittee
          (total_voting_weight, roster_state). Hop 3 fires only because hop 2 pushed the member's counter to the
          DISSENT_DAMPING_STRIKES boundary, and hop 4 fires only because hop 3 changed a weight, so no hop can be
          reached without its predecessor.
        test_recipe:
          setup:
            - "One committee (quorum 60.00 / consensus 66.67) with three seats of weight 3 (PREMIER, CHAIR), 2 (FULL) and 1 (ASSOCIATE); total_voting_weight 6, roster_state QUORATE."
            - "Position P1 already ADOPTED with the FULL member voting OPPOSE plus a dissent statement, so that member already carries recorded_dissent_count 1 and dissent_strikes 1 (below the damping boundary of 2)."
            - "Position P2 taken as far as CONSENSUS_REACHED with the same 4-vs-2 split (consensus_pct exactly 66.67) and the same FULL member again filing a dissent."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
