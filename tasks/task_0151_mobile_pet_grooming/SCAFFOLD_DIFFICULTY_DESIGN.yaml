        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair existence(priority 3) vs state(priority 5): scheduling a still-REQUESTED
          (not QUOTED) appointment onto a NON-EXISTENT route_day_id violates both the existence check
          and the state precondition; the lower-numbered existence rule wins, so ERR_NOT_FOUND (404)
          is returned, not ERR_INVALID_STATE.
