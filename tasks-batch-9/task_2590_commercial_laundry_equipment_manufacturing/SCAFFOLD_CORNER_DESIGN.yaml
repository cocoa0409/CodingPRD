              captures: { q1: $.data.id, v0: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m1}", quantity: 1, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${v0}" }
