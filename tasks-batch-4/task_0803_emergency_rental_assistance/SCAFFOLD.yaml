scenario: "803. Emergency Rental Assistance (ERAP): tenant/landlord co-application, income & hardship eligibility, arrears vs prospective-rent calculation, duplicate-benefit check, landlord ledger verification & W-9, direct-to-landlord disbursement, recertification & months-cap, fraud/recapture"
domain_name: emergency-rental-assistance
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party negotiation          # tenant + landlord co-application; both sections must complete before review
  secondary_archetype: ledger reconciliation          # arrears (chronological) vs prospective-rent (forward-looking) diverge on identical inputs
  complexity_layers:
    - dual_variant_calculation                         # income countable-vs-gross; arrears chronological-vs-gross
    - cascading_side_effects                           # recapture recover chain; disbursement-create pool-exhaust chain
    - rate_threshold_triggers                          # income AMI threshold; months-cap; funding-pool exhaustion
    - optimistic_concurrency                           # OCC on Application.version for disbursement over-reservation

  entity_topology: flat                                # peer entities (Tenant, Landlord, Unit, Application) joined by FK references, not nested ownership
  state_machine_shape: parallel                        # Application carries two independent section-completion axes plus a review cycle; Disbursement is cyclic
  relationship_patterns:
    - one_to_many                                      # Application -> IncomeSource / LedgerLine / Disbursement / Recertification / RecaptureCase
    - flat_foreign_key                                 # Application references Program, Tenant, Landlord, Unit by id
    - cross_aggregate                                  # RecaptureCase references both Application and Disbursement
  role_model: segregation_of_duties                    # CaseWorker who approves an Application may not issue its Disbursement (four-eyes)
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "ERAP program / jurisdiction name"
      - name: status
        type: enum
        source: computed
        description: "OPEN while funds remain; EXHAUSTED once funding_pool_remaining_cents reaches 0"
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED}"
      - name: funding_pool_total_cents
        type: integer
        source: input
        description: "total dollars (cents) allocated to this program"
        constraints: ">= 0"
      - name: funding_pool_remaining_cents
        type: integer
        source: computed
        description: "funding_pool_total_cents minus SUM(Disbursement.amount_cents WHERE status IN {PENDING,SENT,CLEARED}); reserved at disbursement creation, released on FAILED/RECAPTURED"
      - name: months_cap
        type: integer
        source: input
        description: "maximum total assisted months (arrears + prospective) per household in this program"
        default: 18
      - name: per_month_max_cents
        type: integer
        source: input
        description: "per-month rent cap; monthly_award = min(Application.monthly_rent_cents, per_month_max_cents)"
      - name: monthly_income_limit_by_size
        type: object
        source: input
        description: "map household_size(string) -> monthly countable income limit (cents); a household is income-eligible when countable_monthly_income_cents <= this limit (80% AMI)"
      - name: eligibility_ami_pct
        type: number
        source: input
        description: "AMI fraction the limit table encodes (informational; reported ami_pct = countable_monthly_income_cents / (limit / eligibility_ami_pct))"
        default: 0.80

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "applicant household head name"
      - name: email
        type: string
        source: input
        description: "contact email"
      - name: household_size
        type: integer
        source: input
        description: "number of household members; selects the row in Program.monthly_income_limit_by_size"
        constraints: ">= 1"
      - name: months_used
        type: integer
        source: computed
        description: "conserved counter: SUM(Disbursement.months_covered WHERE the disbursement's Application.tenant_id == this Tenant AND status IN {PENDING,SENT,CLEARED}); reserved at disbursement creation, released on FAILED/RECAPTURED"
        default: 0

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "payee legal name (must match W-9)"
      - name: email
        type: string
        source: input
        description: "contact email"
      - name: w9_status
        type: enum
        source: computed
        description: "W-9 lifecycle; disbursement eligibility requires VERIFIED"
        default: MISSING
        constraints: "one of {MISSING, SUBMITTED, VERIFIED, REJECTED}"
      - name: tin
        type: string
        source: input
        description: "taxpayer identification number captured on W-9 submission"
      - name: banking_last4
        type: string
        source: input
        description: "last four digits of the disbursement bank account"
      - name: mailing_address
        type: string
        source: input
        description: "W-9 mailing address"

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the owner/payee of this rental unit"
      - name: address
        type: string
        source: input
        description: "unit street address"
      - name: monthly_rent_cents
        type: integer
        source: input
        description: "contract rent for the unit (cents)"
        constraints: "> 0"

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the ERAP program funding this application"
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; the applicant household"
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the payee landlord (must equal Unit.landlord_id)"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the rental unit"
      - name: status
        type: enum
        source: computed
        description: "application lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DISBURSED, DENIED, CLOSED}"
      - name: tenant_section_status
        type: enum
        source: computed
        description: "independent axis: tenant portion completion (income sources + hardship attestation)"
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, COMPLETE}"
      - name: landlord_section_status
        type: enum
        source: computed
        description: "independent axis: landlord portion completion (unit + submitted rent ledger)"
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, COMPLETE}"
      - name: hardship_type
        type: enum
        source: input
        description: "COVID/economic hardship category, set via tenant-section"
        constraints: "one of {JOB_LOSS, REDUCED_INCOME, MEDICAL, OTHER}"
      - name: hardship_attested
        type: boolean
        source: input
        description: "tenant attestation of hardship; must be true to approve"
        default: false
      - name: monthly_rent_cents
        type: integer
        source: input
        description: "contract monthly rent claimed on this application (cents)"
        constraints: "> 0"
      - name: arrears_start_month
        type: string
        source: input
        description: "inclusive first month (YYYY-MM) of the arrears coverage window; null when no arrears requested"
      - name: arrears_end_month
        type: string
        source: input
        description: "inclusive last month (YYYY-MM) of the arrears coverage window; null when no arrears requested"
      - name: arrears_covered_months
        type: integer
        source: computed
        description: "count of calendar months in [arrears_start_month, arrears_end_month] inclusive; 0 when window is null"
        default: 0
      - name: requested_prospective_months
        type: integer
        source: input
        description: "number of future months of rent requested"
        default: 0
      - name: prospective_start_date
        type: string
        source: input
        description: "first covered day (YYYY-MM-DD) of prospective coverage; null when none requested"
      - name: prospective_end_date
        type: string
        source: input
        description: "last covered day (YYYY-MM-DD) of prospective coverage; null when none requested"
      - name: countable_monthly_income_cents
        type: integer
        source: computed
        description: "SUM(IncomeSource.monthly_amount_cents WHERE countable == true); the default eligibility variant"
      - name: ami_pct
        type: number
        source: computed
        description: "countable_monthly_income_cents / (Program.monthly_income_limit_by_size[household_size] / Program.eligibility_ami_pct)"
      - name: income_eligible
        type: boolean
        source: computed
        description: "true when countable_monthly_income_cents <= Program.monthly_income_limit_by_size[household_size]"
      - name: arrears_owed_cents
        type: integer
        source: computed
        description: "chronological FIFO arrears within the arrears window (see calculations.arrears_owed); 0 when window null"
        default: 0
      - name: arrears_award_cents
        type: integer
        source: computed
        description: "min(arrears_owed_cents, arrears_covered_months * monthly_award)"
        default: 0
      - name: prospective_award_cents
        type: integer
        source: computed
        description: "per-month-rounded prospective award (see calculations.prospective_award)"
        default: 0
      - name: total_award_cents
        type: integer
        source: computed
        description: "arrears_award_cents + prospective_award_cents (see calculations.total_award); pinned at approval"
        default: 0
      - name: months_awarded
        type: integer
        source: computed
        description: "arrears_covered_months + prospective_months_grantable; the months this award consumes from the cap"
        default: 0
      - name: total_disbursed_cents
        type: integer
        source: computed
        description: "SUM(Disbursement.amount_cents WHERE status == CLEARED) for this application; reversed on RECAPTURED"
        default: 0
      - name: approved_by_cw_id
        type: string
        source: system
        description: "X-User-ID of the CaseWorker who approved; used for segregation-of-duties on disbursement creation"
      - name: decision_reason
        type: string
        source: input
        description: "free-text reason captured on approve/deny"

  - name: IncomeSource
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the co-application this income line belongs to"
      - name: source_type
        type: enum
        source: input
        description: "income category"
        constraints: "one of {WAGES, SELF_EMPLOYMENT, UNEMPLOYMENT, SSI, TANF, CHILD_SUPPORT}"
      - name: monthly_amount_cents
        type: integer
        source: input
        description: "monthly income from this source (cents)"
        constraints: ">= 0"
      - name: countable
        type: boolean
        source: computed
        description: "true for {WAGES, SELF_EMPLOYMENT, UNEMPLOYMENT}; false (excluded from AMI) for {SSI, TANF, CHILD_SUPPORT}"

  - name: RentLedger
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; exactly one ledger per application (1:1)"
      - name: status
        type: enum
        source: computed
        description: "ledger verification lifecycle; approval requires VERIFIED"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, REJECTED}"
      - name: verified_by_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAdmin who verified/rejected the ledger"

  - name: LedgerLine
    parent: RentLedger
    common_fields: true
    fields:
      - name: ledger_id
        type: string
        source: input
        description: "FK -> RentLedger.id; the ledger this monthly line belongs to"
      - name: month
        type: string
        source: input
        description: "the billing month (YYYY-MM) this line applies to"
      - name: line_type
        type: enum
        source: input
        description: "CHARGE adds rent owed; PAYMENT credits it; ADJUSTMENT is a manual credit"
        constraints: "one of {CHARGE, PAYMENT, ADJUSTMENT}"
      - name: charge_cents
        type: integer
        source: input
        description: "rent charged this month (cents); used when line_type == CHARGE"
        default: 0
      - name: payment_cents
        type: integer
        source: input
        description: "amount paid/credited this month (cents); used when line_type IN {PAYMENT, ADJUSTMENT}"
        default: 0

  - name: Disbursement
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application being paid"
      - name: amount_cents
        type: integer
        source: input
        description: "payment amount to the landlord (cents); must not push total reserved above total_award_cents"
        constraints: "> 0"
      - name: months_covered
        type: integer
        source: input
        description: "number of assisted months this disbursement consumes from the cap"
        constraints: ">= 0"
      - name: coverage_kind
        type: enum
        source: input
        description: "what the payment covers"
        constraints: "one of {ARREARS, PROSPECTIVE, COMBINED}"
      - name: status
        type: enum
        source: computed
        description: "payment lifecycle; funds/months reserved while status IN {PENDING,SENT,CLEARED}"
        default: PENDING
        constraints: "one of {PENDING, SENT, CLEARED, FAILED, RECAPTURED}"
      - name: issued_by_cw_id
        type: string
        source: system
        description: "X-User-ID of the CaseWorker who created this disbursement; must differ from Application.approved_by_cw_id"
      - name: payment_reference
        type: string
        source: input
        description: "ACH/check reference captured when the disbursement is sent"

  - name: Recertification
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the disbursed application being extended"
      - name: requested_additional_months
        type: integer
        source: input
        description: "additional prospective months requested"
        constraints: ">= 1"
      - name: new_prospective_start_date
        type: string
        source: input
        description: "first covered day (YYYY-MM-DD) of the extension"
      - name: new_prospective_end_date
        type: string
        source: input
        description: "last covered day (YYYY-MM-DD) of the extension"
      - name: status
        type: enum
        source: computed
        description: "recertification decision lifecycle"
        default: PENDING
        constraints: "one of {PENDING, APPROVED, DENIED}"
      - name: decision_reason
        type: string
        source: input
        description: "free-text reason captured on decide"

  - name: RecaptureCase
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the application under fraud investigation"
      - name: disbursement_id
        type: string
        source: input
        description: "FK -> Disbursement.id; the CLEARED disbursement targeted for recovery"
      - name: reason
        type: enum
        source: input
        description: "recapture ground"
        constraints: "one of {DUPLICATE_BENEFIT, INCOME_MISREPRESENTATION, VACATED_UNIT, OTHER}"
      - name: status
        type: enum
        source: computed
        description: "investigation lifecycle"
        default: OPEN
        constraints: "one of {OPEN, SUBSTANTIATED, RECOVERED, DISMISSED}"
      - name: recovered_amount_cents
        type: integer
        source: computed
        description: "amount clawed back on RECOVERED (equals the targeted Disbursement.amount_cents); 0 otherwise"
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Tenant
        preconditions:
          - "acting Tenant owns the application (X-User-ID == application.tenant_id)"
          - "tenant_section_status == COMPLETE"
          - "landlord_section_status == COMPLETE"
        side_effects:
          - "set status = SUBMITTED"
        note: "co-application quorum: both parties must have completed their section"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/review"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "set status = UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /applications/{id}/request-info"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "set status = INFO_REQUESTED"
        note: "cyclic: pairs with INFO_REQUESTED->UNDER_REVIEW"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/resubmit"
        actor: Tenant | Landlord
        preconditions:
          - "acting party owns the application (Tenant: X-User-ID == tenant_id; Landlord: X-User-ID == landlord_id)"
        side_effects:
          - "set status = UNDER_REVIEW"
        note: "cyclic revision loop back into review"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: CaseWorker
        preconditions:
          - "Landlord.w9_status == VERIFIED  (cross-entity: Application depends on Landlord)"
          - "the application's RentLedger.status == VERIFIED"
          - "hardship_attested == true"
          - "income_eligible == true  (countable_monthly_income_cents <= program limit)"
          - "no duplicate benefit: arrears window does not overlap any other APPROVED/DISBURSED application's arrears window for the same unit_id"
          - "no prospective overlap: prospective window neither overlaps nor is within the 1-month buffer of any other APPROVED/DISBURSED application's prospective window for the same tenant_id"
          - "Tenant.months_used + months_awarded <= Program.months_cap"
          - "Program.funding_pool_remaining_cents >= total_award_cents"
        side_effects:
          - "compute countable_monthly_income_cents, ami_pct, income_eligible (calculations.income_eligibility)"
          - "compute arrears_owed_cents (calculations.arrears_owed), arrears_covered_months, arrears_award_cents"
          - "compute prospective_award_cents (calculations.prospective_award), prospective_months_grantable"
          - "compute total_award_cents (calculations.total_award) and months_awarded"
          - "set approved_by_cw_id = X-User-ID of the acting CaseWorker"
          - "set status = APPROVED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/deny"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "set status = DENIED; store decision_reason"
      - from: APPROVED
        to: DISBURSED
        trigger: "system: a Disbursement for this application transitions SENT->CLEARED"
        actor: system
        preconditions:
          - "total_disbursed_cents (after this clear) >= total_award_cents"
        side_effects:
          - "set status = DISBURSED"
        note: "bubble-up from Disbursement.clear when the full award has cleared"
      - from: APPROVED
        to: CLOSED
        trigger: "system: RecaptureCase.recover cascade reverses this application"
        actor: system
        preconditions: []
        side_effects:
          - "set status = CLOSED"
        note: "reached only via the recapture cascade (see RecaptureCase SUBSTANTIATED->RECOVERED)"
      - from: DISBURSED
        to: CLOSED
        trigger: "system: RecaptureCase.recover cascade reverses this application"
        actor: system
        preconditions: []
        side_effects:
          - "set status = CLOSED"

  - entity: Landlord
    initial_state: MISSING
    terminal_states: []
    transitions:
      - from: MISSING
        to: SUBMITTED
        trigger: "POST /landlords/{id}/w9"
        actor: Landlord
        preconditions:
          - "acting Landlord owns the record (X-User-ID == landlord.id)"
        side_effects:
          - "store tin, banking_last4, mailing_address; set w9_status = SUBMITTED"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /landlords/{id}/w9/verify (decision=VERIFIED)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "set w9_status = VERIFIED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /landlords/{id}/w9/verify (decision=REJECTED)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "set w9_status = REJECTED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /landlords/{id}/w9"
        actor: Landlord
        preconditions:
          - "acting Landlord owns the record"
        side_effects:
          - "overwrite tin/banking_last4/mailing_address; set w9_status = SUBMITTED"
        note: "branch-with-revert: rejected W-9 can be resubmitted"

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [RECAPTURED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /disbursements/{id}/send"
        actor: CaseWorker
        preconditions:
          - "the disbursement's Application.status == APPROVED  (cross-entity: Disbursement depends on Application)"
          - "the application's Landlord.w9_status == VERIFIED"
        side_effects:
          - "store payment_reference; set status = SENT"
      - from: SENT
        to: CLEARED
        trigger: "POST /disbursements/{id}/clear"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Application.total_disbursed_cents += amount_cents"
          - "if Application.total_disbursed_cents >= Application.total_award_cents then Application.status -> DISBURSED (bubble-up)"
          - "set status = CLEARED"
      - from: SENT
        to: FAILED
        trigger: "POST /disbursements/{id}/fail"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "release reservation: Program.funding_pool_remaining_cents += amount_cents; if it becomes > 0 and program was EXHAUSTED then Program.status -> OPEN"
          - "release months: Tenant.months_used -= months_covered"
          - "set status = FAILED"
      - from: FAILED
        to: PENDING
        trigger: "POST /disbursements/{id}/retry"
        actor: CaseWorker
        preconditions:
          - "Program.funding_pool_remaining_cents >= amount_cents (re-reservation must fit)"
          - "Tenant.months_used + months_covered <= Program.months_cap"
        side_effects:
          - "re-reserve: Program.funding_pool_remaining_cents -= amount_cents (Program.status -> EXHAUSTED if it hits 0)"
          - "re-reserve months: Tenant.months_used += months_covered"
          - "set status = PENDING"
        note: "cyclic FAILED<->PENDING retry loop"
      - from: CLEARED
        to: RECAPTURED
        trigger: "system: RecaptureCase SUBSTANTIATED->RECOVERED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "release reservation: Program.funding_pool_remaining_cents += amount_cents (Program.status -> OPEN if it was EXHAUSTED)"
          - "release months: Tenant.months_used -= months_covered"
          - "Application.total_disbursed_cents -= amount_cents; Application.status -> CLOSED"
          - "set status = RECAPTURED"
        note: "terminal; second link of the recapture cascade"

  - entity: Recertification
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /recertifications/{id}/decide (decision=APPROVE)"
        actor: CaseWorker
        preconditions:
          - "the application's status == DISBURSED"
          - "the application's income_eligible == true (still eligible)"
          - "Tenant.months_used + requested_additional_months <= Program.months_cap"
          - "Program.funding_pool_remaining_cents >= requested_additional_months * min(Application.monthly_rent_cents, Program.per_month_max_cents)"
        side_effects:
          - "create a child Disbursement (PENDING, coverage_kind=PROSPECTIVE) for the additional months, reserving funds and months"
          - "set status = APPROVED"
      - from: PENDING
        to: DENIED
        trigger: "POST /recertifications/{id}/decide (decision=DENY)"
        actor: CaseWorker
        preconditions: []
        side_effects:
          - "set status = DENIED; store decision_reason"

  - entity: RecaptureCase
    initial_state: OPEN
    terminal_states: [RECOVERED, DISMISSED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /recapture-cases/{id}/substantiate"
        actor: FraudInvestigator
        preconditions: []
        side_effects:
          - "set status = SUBSTANTIATED"
      - from: SUBSTANTIATED
        to: RECOVERED
        trigger: "POST /recapture-cases/{id}/recover"
        actor: FraudInvestigator
        preconditions:
          - "the targeted Disbursement.status == CLEARED"
        side_effects:
          - "set recovered_amount_cents = targeted Disbursement.amount_cents"
          - "cascade: targeted Disbursement.status -> RECAPTURED (which itself reverses Application ledger + restores Program funds and Tenant months — see Disbursement CLEARED->RECAPTURED)"
          - "set status = RECOVERED"
        note: "first link of the depth-3 recapture cascade: RecaptureCase -> Disbursement -> Application -> Program/Tenant"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /recapture-cases/{id}/dismiss"
        actor: FraudInvestigator
        preconditions: []
        side_effects:
          - "set status = DISMISSED"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: disbursement-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/disbursements"
    occ_field: "expected_application_version"
    description: |
      Creating a Disbursement against an Application whose version has advanced
      since the client last observed it is rejected. Each disbursement creation
      reserves funds/months and bumps the application's version; a second create
      that still carries the pre-reservation version has not observed the first
      reservation and would over-reserve against the same total_award_cents. The
      rule reduces this to a stale-version check: the loser presents an
      expected_application_version older than the application's current version.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: income_eligibility
    trigger: "Application UNDER_REVIEW->APPROVED (POST /applications/{id}/approve)"
    algorithm: aggregation
    formula: |
      countable_monthly_income_cents = SUM(is.monthly_amount_cents
                                            for is in IncomeSource[application_id]
                                            WHERE is.countable == true)
      limit = Program.monthly_income_limit_by_size[str(Tenant.household_size)]
      income_eligible = (countable_monthly_income_cents <= limit)
      ami_pct = countable_monthly_income_cents / (limit / Program.eligibility_ami_pct)
    input_set: "IncomeSource rows of this application; countable = source_type IN {WAGES, SELF_EMPLOYMENT, UNEMPLOYMENT}"
    constants:
      NON_COUNTABLE_TYPES: "{SSI, TANF, CHILD_SUPPORT}"
    precision: "integer cents; ami_pct to full float (informational)"
    variants:
      - name: countable
        when: "default variant used for the eligibility decision"
        difference: "sums only countable sources (excludes SSI/TANF/CHILD_SUPPORT)"
      - name: gross
        when: "alternative interpretation that counts all declared income"
        difference: "sums every IncomeSource regardless of source_type; can flip a household from eligible to ineligible"

  - name: arrears_owed
    trigger: "Application UNDER_REVIEW->APPROVED (POST /applications/{id}/approve)"
    algorithm: chronological
    formula: |
      # Process ALL ledger lines in chronological order (month ASC, then created_at ASC).
      # Maintain per-charge outstanding balances. Each PAYMENT/ADJUSTMENT is applied
      # FIFO to the oldest still-outstanding CHARGE, even charges dated before the
      # arrears window. After processing, arrears_owed_cents = SUM of remaining
      # outstanding on CHARGE lines whose month is within
      # [arrears_start_month, arrears_end_month] inclusive.
      order lines by (month ASC, created_at ASC)
      outstanding = {}                      # charge_line_id -> remaining cents
      for line in ordered_lines:
        if line.line_type == CHARGE: outstanding[line.id] = line.charge_cents
        else:
          credit = line.payment_cents
          for cid in charges_sorted_oldest_first_with_remaining():
            take = min(outstanding[cid], credit)
            outstanding[cid] -= take; credit -= take
            if credit == 0: break
      arrears_owed_cents = SUM(outstanding[cid] for CHARGE cid
                               WHERE arrears_start_month <= charge.month <= arrears_end_month)
    input_set: "all LedgerLine rows of the application's RentLedger; window filter applied only at the final summation"
    constants: {}
    precision: "integer cents; no rounding (all inputs integer cents)"
    variants:
      - name: chronological_fifo
        when: "default variant used for the award"
        difference: "payments consume oldest outstanding charges first (including pre-window charges), so a pre-window charge can absorb an in-window-dated payment and leave in-window arrears higher"
      - name: gross_window
        when: "naive alternative"
        difference: "arrears = SUM(charge_cents in window) - SUM(payment_cents in window); ignores chronological application and can under- or over-count vs FIFO"

  - name: prospective_award
    trigger: "Application UNDER_REVIEW->APPROVED (POST /applications/{id}/approve)"
    algorithm: forward_looking
    formula: |
      monthly_award = min(Application.monthly_rent_cents, Program.per_month_max_cents)
      months_remaining = Program.months_cap - Tenant.months_used
      prospective_months_grantable = min(requested_prospective_months,
                                         max(0, months_remaining - arrears_covered_months),
                                         count_calendar_months(prospective_start_date, prospective_end_date))
      # Proration: prorate the first and last partial calendar months by covered
      # days; ROUND EACH MONTH'S prorated amount half-up to the cent, THEN SUM.
      # (round-per-month-then-sum is pinned; sum-then-round is NOT used.)
      for each covered calendar month m in [prospective_start_date, prospective_end_date]:
        dim = days_in_month(m)
        covered_days = number of covered days of m within [prospective_start_date, prospective_end_date]
        month_amount[m] = round_half_up(monthly_award * covered_days / dim) if covered_days < dim
                          else monthly_award
      prospective_award_cents = SUM(month_amount[m] for the first prospective_months_grantable covered months)
    input_set: "prospective window on the application; Program per_month_max and months_cap; Tenant.months_used"
    constants: {}
    precision: "round_half_up to integer cents, applied PER MONTH before summation"
    variants:
      - name: round_per_month_then_sum
        when: "pinned/default"
        difference: "each partial month rounded to the cent, then summed"
      - name: sum_then_round
        when: "rejected alternative"
        difference: "sum unrounded prorated amounts then round once; differs by up to 1 cent when two partial months' fractional cents co-accumulate"

  - name: total_award
    trigger: "Application UNDER_REVIEW->APPROVED (POST /applications/{id}/approve)"
    algorithm: threshold
    formula: |
      monthly_award = min(Application.monthly_rent_cents, Program.per_month_max_cents)
      arrears_award_cents = min(arrears_owed_cents, arrears_covered_months * monthly_award)
      # prospective_award_cents from calculations.prospective_award
      total_award_cents = arrears_award_cents + prospective_award_cents
      months_awarded = arrears_covered_months + prospective_months_grantable
      # Fiscal admissibility is a validation, NOT a clamp: approval is rejected
      # with ERR_FUNDING_EXHAUSTED when Program.funding_pool_remaining_cents < total_award_cents.
    input_set: "arrears_owed_cents, arrears_covered_months, prospective_award_cents, Program.per_month_max_cents, Application.monthly_rent_cents"
    constants: {}
    precision: "integer cents"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role (registration endpoints POST /tenants, POST /landlords accept the Anonymous principal without headers)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /tenants, POST /landlords"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body-referenced resource exists, validated left-to-right (program, tenant, landlord, unit, application, ledger, disbursement, recertification, recapture-case)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "entity_backed actor owns the target (Tenant: X-User-ID == application.tenant_id; Landlord: X-User-ID == landlord.id / application.landlord_id)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Tenant/Landlord write operations on applications, units, ledgers, w9"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (submit, review, request-info, resubmit, approve, deny, send, clear, fail, retry, w9/verify, recert decide, substantiate, recover, dismiss, disbursement create)"
  - priority: 6
    category: state
    check: "submit requires tenant_section_status == COMPLETE and landlord_section_status == COMPLETE"
    error_id: ERR_SECTION_INCOMPLETE
    http_status: 409
    applies_to: "POST /applications/{id}/submit"
  - priority: 7
    category: business_referential
    check: "Unit.landlord_id == application.landlord_id"
    error_id: ERR_UNIT_LANDLORD_MISMATCH
    http_status: 422
    applies_to: "POST /applications"
  - priority: 8
    category: business_referential
    check: "Landlord.w9_status == VERIFIED"
    error_id: ERR_W9_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /applications/{id}/approve, POST /disbursements/{id}/send"
  - priority: 9
    category: business_referential
    check: "the application's RentLedger.status == VERIFIED"
    error_id: ERR_LEDGER_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 10
    category: business_safety
    check: "no RecaptureCase for this application is in {OPEN, SUBSTANTIATED} (fraud hold)"
    error_id: ERR_FRAUD_HOLD
    http_status: 409
    applies_to: "POST /applications/{id}/disbursements, POST /disbursements/{id}/send, POST /disbursements/{id}/retry"
  - priority: 11
    category: business_constraint
    check: "hardship_attested == true"
    error_id: ERR_HARDSHIP_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "income_eligible == true (countable_monthly_income_cents <= program limit for household_size)"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/approve"
  - priority: 13
    category: business_constraint
    check: "arrears window [arrears_start_month, arrears_end_month] shares no month with any other APPROVED/DISBURSED application's arrears window for the same unit_id (closed-interval overlap; adjacency allowed)"
    error_id: ERR_DUPLICATE_BENEFIT
    http_status: 409
    applies_to: "POST /applications/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "prospective window [prospective_start_date, prospective_end_date) neither overlaps nor is within a 1-month buffer of any other APPROVED/DISBURSED application's prospective window for the same tenant_id (adjacency rejected)"
    error_id: ERR_PROSPECTIVE_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{id}/approve"
  - priority: 15
    category: business_temporal
    check: "Tenant.months_used + months_awarded <= Program.months_cap (approve); Tenant.months_used + requested_additional_months <= Program.months_cap (recert decide)"
    error_id: ERR_MONTHS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /applications/{id}/approve, POST /recertifications/{id}/decide"
  - priority: 16
    category: business_fiscal
    check: "Program.funding_pool_remaining_cents >= amount to reserve (total_award_cents on approve; amount_cents on disbursement create/retry; extension cost on recert decide)"
    error_id: ERR_FUNDING_EXHAUSTED
    http_status: 402
    applies_to: "POST /applications/{id}/approve, POST /applications/{id}/disbursements, POST /disbursements/{id}/retry, POST /recertifications/{id}/decide"
  - priority: 17
    category: business_constraint
    check: "segregation of duties: on disbursement creation X-User-ID != Application.approved_by_cw_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/disbursements"
  - priority: 18
    category: business_constraint
    check: "disbursement over-reservation: SUM of reserved (PENDING/SENT/CLEARED) amount_cents including this one must not exceed Application.total_award_cents; likewise months_covered must not exceed remaining awarded months"
    error_id: ERR_AWARD_EXCEEDED
    http_status: 422
    applies_to: "POST /applications/{id}/disbursements"
  - priority: 19
    category: state
    check: "optimistic concurrency: expected_application_version == Application.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/disbursements"
  - priority: 20
    category: business_constraint
    check: "at most one RentLedger per application (1:1)"
    error_id: ERR_LEDGER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /applications/{id}/ledger"
  - priority: 21
    category: business_constraint
    check: "required fields present, enum values valid, integer/date formats valid, amounts within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Program ----
  - method: POST
    path: "/programs"
    description: "create an ERAP program with funding pool, months cap, per-month cap, and income-limit table"
    roles: [ProgramAdmin]
    code: 201
    input: [name, funding_pool_total_cents, per_month_max_cents, monthly_income_limit_by_size, "months_cap?", "eligibility_ami_pct?"]
    output: Program
    side_effects: ["funding_pool_remaining_cents := funding_pool_total_cents", "status := OPEN (or EXHAUSTED if total == 0)"]
  - method: GET
    path: "/programs/{id}"
    description: "fetch a program"
    roles: [ProgramAdmin, CaseWorker, Tenant, Landlord, FraudInvestigator]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: PATCH
    path: "/programs/{id}/funding"
    description: "adjust the program funding pool total; remaining is recomputed against outstanding reservations"
    roles: [ProgramAdmin]
    code: 200
    input: [funding_pool_total_cents]
    output: Program
    side_effects: ["recompute funding_pool_remaining_cents", "recompute status (OPEN/EXHAUSTED)", "increments Program.version by 1"]

  # ---- Tenant ----
  - method: POST
    path: "/tenants"
    description: "register a tenant household (unauthenticated)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, household_size]
    output: Tenant
    side_effects: ["months_used := 0"]
  - method: GET
    path: "/tenants/{id}"
    description: "fetch a tenant"
    roles: [ProgramAdmin, CaseWorker, Tenant, FraudInvestigator]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # ---- Landlord ----
  - method: POST
    path: "/landlords"
    description: "register a landlord/payee (unauthenticated)"
    roles: [Anonymous]
    code: 201
    input: [legal_name, email]
    output: Landlord
    side_effects: ["w9_status := MISSING"]
  - method: GET
    path: "/landlords/{id}"
    description: "fetch a landlord"
    roles: [ProgramAdmin, CaseWorker, Landlord, FraudInvestigator]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/landlords/{id}/w9"
    description: "submit (or resubmit) the landlord W-9 and banking details"
    roles: [Landlord]
    code: 200
    input: [tin, banking_last4, mailing_address]
    output: Landlord
    side_effects: ["w9_status: MISSING|REJECTED -> SUBMITTED"]
  - method: POST
    path: "/landlords/{id}/w9/verify"
    description: "program admin verifies or rejects a submitted W-9"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: Landlord
    side_effects: ["w9_status: SUBMITTED -> VERIFIED|REJECTED"]

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "landlord registers a rental unit"
    roles: [Landlord]
    code: 201
    input: [landlord_id, address, monthly_rent_cents]
    output: Unit
    side_effects: []
  - method: GET
    path: "/units/{id}"
    description: "fetch a unit"
    roles: [ProgramAdmin, CaseWorker, Landlord]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/units"
    description: "list units, optionally filtered by landlord (reverse lookup for Unit.landlord_id)"
    roles: [ProgramAdmin, CaseWorker, Landlord]
    code: 200
    input: ["landlord_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "tenant opens a co-application draft referencing program, landlord, and unit"
    roles: [Tenant]
    code: 201
    input: [program_id, tenant_id, landlord_id, unit_id, monthly_rent_cents, requested_prospective_months, "arrears_start_month?", "arrears_end_month?", "prospective_start_date?", "prospective_end_date?"]
    output: Application
    side_effects: ["status := DRAFT", "tenant_section_status := INCOMPLETE", "landlord_section_status := INCOMPLETE"]
  - method: GET
    path: "/applications/{id}"
    description: "fetch an application (includes all computed award fields)"
    roles: [ProgramAdmin, CaseWorker, Tenant, Landlord, FraudInvestigator]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "list applications; filters cover the reverse lookup for all Application FKs"
    roles: [ProgramAdmin, CaseWorker, Tenant, Landlord, FraudInvestigator]
    code: 200
    input: ["tenant_id?", "landlord_id?", "unit_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: PATCH
    path: "/applications/{id}/tenant-section"
    description: "tenant completes their section (hardship attestation); requires >=1 income source on file"
    roles: [Tenant]
    code: 200
    input: [hardship_type, hardship_attested]
    output: Application
    side_effects: ["store hardship_type/hardship_attested", "tenant_section_status := COMPLETE"]
  - method: PATCH
    path: "/applications/{id}/landlord-section"
    description: "landlord marks their section complete; requires the unit set and a submitted ledger on file"
    roles: [Landlord]
    code: 200
    input: ["ledger_confirmed?"]
    output: Application
    side_effects: ["landlord_section_status := COMPLETE"]
  - method: POST
    path: "/applications/{id}/submit"
    description: "tenant submits the co-application for review"
    roles: [Tenant]
    code: 200
    input: []
    output: Application
    side_effects: ["status: DRAFT -> SUBMITTED"]
  - method: POST
    path: "/applications/{id}/review"
    description: "caseworker takes the application under review"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["status: SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/applications/{id}/request-info"
    description: "caseworker requests additional information (cycle out of review)"
    roles: [CaseWorker]
    code: 200
    input: ["note?"]
    output: Application
    side_effects: ["status: UNDER_REVIEW -> INFO_REQUESTED"]
  - method: POST
    path: "/applications/{id}/resubmit"
    description: "tenant or landlord resubmits after an info request (cycle back into review)"
    roles: [Tenant, Landlord]
    code: 200
    input: []
    output: Application
    side_effects: ["status: INFO_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/applications/{id}/approve"
    description: "caseworker approves; runs eligibility + arrears + prospective + total_award calculations and pins the award"
    roles: [CaseWorker]
    code: 200
    input: ["decision_reason?"]
    output: Application
    side_effects: ["compute income/arrears/prospective/total_award + months_awarded", "set approved_by_cw_id", "status: UNDER_REVIEW -> APPROVED"]
  - method: POST
    path: "/applications/{id}/deny"
    description: "caseworker denies the application"
    roles: [CaseWorker]
    code: 200
    input: ["decision_reason?"]
    output: Application
    side_effects: ["status: UNDER_REVIEW -> DENIED"]

  # ---- IncomeSource ----
  - method: POST
    path: "/applications/{id}/income-sources"
    description: "tenant adds a household income source"
    roles: [Tenant]
    code: 201
    input: [source_type, monthly_amount_cents]
    output: IncomeSource
    side_effects: ["countable := source_type IN {WAGES,SELF_EMPLOYMENT,UNEMPLOYMENT}"]
  - method: GET
    path: "/applications/{id}/income-sources"
    description: "list an application's income sources (reverse lookup for IncomeSource.application_id)"
    roles: [ProgramAdmin, CaseWorker, Tenant]
    code: 200
    input: []
    output: IncomeSource[]
    side_effects: []
  - method: GET
    path: "/income-sources/{id}"
    description: "fetch an income source"
    roles: [ProgramAdmin, CaseWorker, Tenant]
    code: 200
    input: []
    output: IncomeSource
    side_effects: []

  # ---- RentLedger / LedgerLine ----
  - method: POST
    path: "/applications/{id}/ledger"
    description: "landlord submits the rent ledger (with its monthly lines) for the application (1:1)"
    roles: [Landlord]
    code: 201
    input: [lines]
    output: RentLedger
    side_effects: ["create RentLedger (status SUBMITTED) and one LedgerLine per entry in lines"]
  - method: GET
    path: "/applications/{id}/ledger"
    description: "fetch the application's rent ledger (reverse lookup for RentLedger.application_id; array of 0..1)"
    roles: [ProgramAdmin, CaseWorker, Landlord, Tenant]
    code: 200
    input: []
    output: RentLedger[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/ledger/verify"
    description: "program admin verifies or rejects the submitted ledger"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: RentLedger
    side_effects: ["RentLedger.status: SUBMITTED -> VERIFIED|REJECTED", "set verified_by_id"]
  - method: GET
    path: "/ledger-lines/{id}"
    description: "fetch a ledger line"
    roles: [ProgramAdmin, CaseWorker, Landlord]
    code: 200
    input: []
    output: LedgerLine
    side_effects: []
  - method: GET
    path: "/ledger-lines"
    description: "list ledger lines filtered by ledger (reverse lookup for LedgerLine.ledger_id)"
    roles: [ProgramAdmin, CaseWorker, Landlord]
    code: 200
    input: ["ledger_id?", "limit?", "offset?"]
    output: LedgerLine[]
    side_effects: []

  # ---- Disbursement ----
  - method: POST
    path: "/applications/{id}/disbursements"
    description: "caseworker creates a direct-to-landlord disbursement against an approved award (OCC + segregation-of-duties)"
    roles: [CaseWorker]
    code: 201
    input: [amount_cents, months_covered, coverage_kind, expected_application_version]
    output: Disbursement
    side_effects: ["reserve funds: Program.funding_pool_remaining_cents -= amount_cents (Program.status -> EXHAUSTED if it hits 0)", "reserve months: Tenant.months_used += months_covered", "set issued_by_cw_id", "increments Application.version by 1", "status := PENDING"]
  - method: GET
    path: "/applications/{id}/disbursements"
    description: "list an application's disbursements (reverse lookup for Disbursement.application_id)"
    roles: [ProgramAdmin, CaseWorker, Landlord, Tenant]
    code: 200
    input: []
    output: Disbursement[]
    side_effects: []
  - method: GET
    path: "/disbursements/{id}"
    description: "fetch a disbursement"
    roles: [ProgramAdmin, CaseWorker, Landlord]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: "/disbursements/{id}/send"
    description: "caseworker marks the payment sent to the landlord"
    roles: [CaseWorker]
    code: 200
    input: ["payment_reference?"]
    output: Disbursement
    side_effects: ["status: PENDING -> SENT"]
  - method: POST
    path: "/disbursements/{id}/clear"
    description: "program admin marks the payment cleared; credits the application ledger"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Application.total_disbursed_cents += amount_cents", "Application.status -> DISBURSED when award fully cleared", "status: SENT -> CLEARED"]
  - method: POST
    path: "/disbursements/{id}/fail"
    description: "program admin marks a sent payment failed/bounced; releases reservation"
    roles: [ProgramAdmin]
    code: 200
    input: ["reason?"]
    output: Disbursement
    side_effects: ["release funds and months reservation", "status: SENT -> FAILED"]
  - method: POST
    path: "/disbursements/{id}/retry"
    description: "caseworker retries a failed payment; re-reserves funds and months"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["re-reserve funds and months", "status: FAILED -> PENDING"]

  # ---- Recertification ----
  - method: POST
    path: "/applications/{id}/recertifications"
    description: "caseworker opens a recertification to extend prospective assistance"
    roles: [CaseWorker]
    code: 201
    input: [requested_additional_months, "new_prospective_start_date?", "new_prospective_end_date?"]
    output: Recertification
    side_effects: ["status := PENDING"]
  - method: GET
    path: "/applications/{id}/recertifications"
    description: "list an application's recertifications (reverse lookup for Recertification.application_id)"
    roles: [ProgramAdmin, CaseWorker, Tenant]
    code: 200
    input: []
    output: Recertification[]
    side_effects: []
  - method: POST
    path: "/recertifications/{id}/decide"
    description: "caseworker approves or denies a recertification; approval creates a new prospective disbursement (subject to months-cap)"
    roles: [CaseWorker]
    code: 200
    input: [decision, "decision_reason?"]
    output: Recertification
    side_effects: ["APPROVE: create child Disbursement reserving funds+months; status -> APPROVED", "DENY: status -> DENIED"]

  # ---- RecaptureCase ----
  - method: POST
    path: "/recapture-cases"
    description: "fraud investigator opens a recapture case against a cleared disbursement"
    roles: [FraudInvestigator]
    code: 201
    input: [application_id, disbursement_id, reason]
    output: RecaptureCase
    side_effects: ["status := OPEN (places a fraud hold on the application)"]
  - method: GET
    path: "/recapture-cases/{id}"
    description: "fetch a recapture case"
    roles: [ProgramAdmin, CaseWorker, FraudInvestigator]
    code: 200
    input: []
    output: RecaptureCase
    side_effects: []
  - method: GET
    path: "/recapture-cases"
    description: "list recapture cases; filters cover reverse lookup for both FKs (application_id, disbursement_id)"
    roles: [ProgramAdmin, CaseWorker, FraudInvestigator]
    code: 200
    input: ["application_id?", "disbursement_id?", "limit?", "offset?"]
    output: RecaptureCase[]
    side_effects: []
  - method: POST
    path: "/recapture-cases/{id}/substantiate"
    description: "fraud investigator substantiates the case"
    roles: [FraudInvestigator]
    code: 200
    input: ["note?"]
    output: RecaptureCase
    side_effects: ["status: OPEN -> SUBSTANTIATED"]
  - method: POST
    path: "/recapture-cases/{id}/recover"
    description: "fraud investigator recovers funds; triggers the recapture cascade"
    roles: [FraudInvestigator]
    code: 200
    input: []
    output: RecaptureCase
    side_effects: ["cascade: Disbursement -> RECAPTURED -> Application reversal -> Program/Tenant restore", "status: SUBSTANTIATED -> RECOVERED"]
  - method: POST
    path: "/recapture-cases/{id}/dismiss"
    description: "fraud investigator dismisses the case (lifts the fraud hold)"
    roles: [FraudInvestigator]
    code: 200
    input: ["note?"]
    output: RecaptureCase
    side_effects: ["status: OPEN -> DISMISSED"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown auth headers on an authenticated endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this endpoint"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "referenced program id does not exist"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "referenced tenant id does not exist"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "referenced landlord id does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "referenced unit id does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "referenced application id does not exist"
  - id: ERR_LEDGER_NOT_FOUND
    http: 404
    condition: "referenced ledger id / application has no ledger"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "referenced disbursement id does not exist"
  - id: ERR_RECERT_NOT_FOUND
    http: 404
    condition: "referenced recertification id does not exist"
  - id: ERR_RECAPTURE_NOT_FOUND
    http: 404
    condition: "referenced recapture-case id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum, bad integer/date format, or constraint violation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition is not defined from the resource's current state"
  - id: ERR_SECTION_INCOMPLETE
    http: 409
    condition: "submit attempted while a tenant or landlord section is INCOMPLETE"
  - id: ERR_UNIT_LANDLORD_MISMATCH
    http: 422
    condition: "the unit's landlord_id does not match the application's landlord_id"
  - id: ERR_W9_NOT_VERIFIED
    http: 422
    condition: "approve/send attempted while Landlord.w9_status != VERIFIED"
  - id: ERR_LEDGER_NOT_VERIFIED
    http: 422
    condition: "approve attempted while the RentLedger.status != VERIFIED"
  - id: ERR_FRAUD_HOLD
    http: 409
    condition: "disbursement create/send/retry attempted while an OPEN/SUBSTANTIATED recapture case exists for the application"
  - id: ERR_HARDSHIP_NOT_ATTESTED
    http: 422
    condition: "approve attempted while hardship_attested != true"
  - id: ERR_INCOME_INELIGIBLE
    http: 422
    condition: "countable_monthly_income_cents exceeds the program income limit for the household size"
  - id: ERR_DUPLICATE_BENEFIT
    http: 409
    condition: "arrears coverage window overlaps another approved/disbursed application's arrears window for the same unit"
  - id: ERR_PROSPECTIVE_OVERLAP
    http: 409
    condition: "prospective coverage window overlaps or is within the 1-month buffer of another approved/disbursed application's prospective window for the same tenant"
  - id: ERR_MONTHS_CAP_EXCEEDED
    http: 422
    condition: "granting the requested months would push Tenant.months_used past Program.months_cap"
  - id: ERR_FUNDING_EXHAUSTED
    http: 402
    condition: "program funding_pool_remaining_cents is insufficient to reserve the requested amount"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caseworker creating the disbursement is the same principal who approved the application"
  - id: ERR_AWARD_EXCEEDED
    http: 422
    condition: "disbursement amount/months would exceed the application's pinned total_award_cents/months_awarded"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not match the application's current version"
  - id: ERR_LEDGER_ALREADY_EXISTS
    http: 409
    condition: "a ledger already exists for this application (1:1)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "unauthenticated principal used only for household/landlord self-registration"
    identity: opaque
    exclusive_operations:
      - "POST /tenants"
      - "POST /landlords"
    shared_operations: []
  - name: Tenant
    description: "applicant household; owns the tenant section of the co-application"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /applications"
      - "PATCH /applications/{id}/tenant-section"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/income-sources"
    shared_operations:
      - "POST /applications/{id}/resubmit (with Landlord)"
      - "GET reads of own application, income-sources, ledger, disbursements, recertifications"
  - name: Landlord
    description: "payee landlord; owns units, W-9, and the rent ledger section"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /units"
      - "POST /landlords/{id}/w9"
      - "PATCH /applications/{id}/landlord-section"
      - "POST /applications/{id}/ledger"
    shared_operations:
      - "POST /applications/{id}/resubmit (with Tenant)"
      - "GET reads of own landlord, units, ledger, disbursements"
  - name: CaseWorker
    description: "reviews applications, decides eligibility, issues and retries disbursements, decides recertifications"
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/review"
      - "POST /applications/{id}/request-info"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/deny"
      - "POST /applications/{id}/disbursements"
      - "POST /disbursements/{id}/send"
      - "POST /disbursements/{id}/retry"
      - "POST /applications/{id}/recertifications"
      - "POST /recertifications/{id}/decide"
    shared_operations:
      - "GET reads across the program"
  - name: ProgramAdmin
    description: "configures programs and funding, verifies W-9s and ledgers, clears/fails payments, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "PATCH /programs/{id}/funding"
      - "POST /landlords/{id}/w9/verify"
      - "POST /applications/{id}/ledger/verify"
      - "POST /disbursements/{id}/clear"
      - "POST /disbursements/{id}/fail"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across the program"
  - name: FraudInvestigator
    description: "opens, substantiates, recovers, and dismisses recapture cases"
    identity: opaque
    exclusive_operations:
      - "POST /recapture-cases"
      - "POST /recapture-cases/{id}/substantiate"
      - "POST /recapture-cases/{id}/recover"
      - "POST /recapture-cases/{id}/dismiss"
    shared_operations:
      - "GET reads of recapture cases, applications, disbursements"
