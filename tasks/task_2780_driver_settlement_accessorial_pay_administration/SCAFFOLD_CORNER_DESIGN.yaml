      - name: manual_escrow_deductions_are_restricted_to_the_permissible_reason_list
        claim_type: error_triggerable
        grounds:
          - validations[priority=31]
          - errors[ERR_DEDUCTION_NOT_PERMISSIBLE]
          - domain_constants.PERMISSIBLE_DEDUCTION_REASONS
          - entities.EscrowTransaction.fields.reason_code
        distinguishing_aspect: |
          reason_code has a wide declared enum but only the six PERMISSIBLE_DEDUCTION_REASONS may fund a manual
          deduction, so ADVANCE_DEFAULT - a declared member reserved for system-written entries - must fail with
          ERR_DEDUCTION_NOT_PERMISSIBLE at 422 and not with ERR_INVALID_FIELD_VALUE. The balance is 3686 and the
          request is 1000, so the rejection also cannot be ERR_ESCROW_INSUFFICIENT_BALANCE; swapping in
          TRACTOR_LEASE with the identical amount succeeds and takes the balance to 2686, which proves the reason
          code was the only thing standing in the way.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_DED is a LEASED_OPERATOR on an escrow_required package, so escrow_status is COLLECTING"
            - "load LOAD_DED DELIVERED 2026-08-04T18:00Z paying 46080"
            - "settlement STL_DED prepared by clerk-01 and approved by approver-01, writing a DEPOSIT of 3686"
            - "the caller has just read the driver and holds its current version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
