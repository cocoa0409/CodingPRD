# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Scenario: Review Recommendation Software & Advertiser Complaint Handling
# Walks the claim-extraction guide against §1.1–§1.7.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: review_create_defaults_and_system_fields
        claim_type: creation
        grounds: ["entities.Review"]
        distinguishing_aspect: "Review creation stamps submitted_at from the logical clock, defaults edited_flag=false and evidence_confirmed=false, computes recommendation_score_x1000, and ignores any client-supplied id/version."
        test_recipe:
          setup: ["Clock 2026-09-01; user U1 (default trust 50); page P1 ACTIVE"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "e1@x.com", display_name: "E One", home_region: "US-CA" }
              as: PlatformOps
              captures: { e1_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Ent Eatery", address_line: "1 Entity Way", city: "Springfield", category: "cafe", website: "https://ent.example" }
              as: PlatformOps
              captures: { ep1_id: $.data.id }
          trigger:
            - call: "POST /platform/business-pages/${ep1_id}/reviews"
              payload: { rating: 3, text: "A perfectly average but honest three star visit." }
              as: Reviewer
              as_user_id: "${e1_id}"
              captures: { er1_id: $.data.id }
          assert:
            - "Review.${er1_id}.submitted_at == 2026-09-01T00:00:00Z (logical clock)"
            - "Review.${er1_id}.edited_flag == false and evidence_confirmed == false"
            - "Review.${er1_id}.recommendation_score_x1000 == 500 (300 + 4*50) and recommendation_state == FILTERED"
            - "Review.${er1_id}.version == 1 and id is a server-minted UUID"

      - name: review_get_not_found
        claim_type: not_found
        grounds: ["entities.Review", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent review UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Clock default; empty DB except ops"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "GET /platform/reviews/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformOps
              captures: { nf_err: $.data.error_id }
          assert:
            - "Response is 404 with error_id == ERR_NOT_FOUND"

      - name: review_rating_out_of_range_rejected
        claim_type: required_fields
        grounds: ["entities.Review.fields.rating", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rating 0 or 6 violates the [1,5] integer constraint and fails with ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["Clock 2026-09-01; user U1; page P1 ACTIVE"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "e2@x.com", display_name: "E Two", home_region: "US-CA" }
              as: PlatformOps
              captures: { e2_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Range Ramen", address_line: "2 Range Rd", city: "Springfield", category: "ramen", website: "https://range.example" }
              as: PlatformOps
              captures: { ep2_id: $.data.id }
          trigger:
            - call: "POST /platform/business-pages/${ep2_id}/reviews"
              payload: { rating: 6, text: "Six stars is out of range and must fail hard." }
              as: Reviewer
              as_user_id: "${e2_id}"
              captures: { rng_err: $.data.error_id }
          assert:
            - "Response is 400 with error_id == ERR_INVALID_REQUEST"

      - name: page_computed_aggregates_ignore_input
        claim_type: computed_fields
        grounds: ["entities.BusinessPage.fields.displayed_review_count", "entities.BusinessPage.fields.displayed_rating_avg_x100"]
        distinguishing_aspect: "displayed_review_count and displayed_rating_avg_x100 are computed; any client-supplied values on create are ignored and start at 0."
        test_recipe:
          setup: ["Clock default"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /platform/business-pages"
              payload: { name: "Computed Cafe", address_line: "3 Calc St", city: "Springfield", category: "cafe", website: "https://calc.example" }
              as: PlatformOps
              captures: { epc_id: $.data.id, epc_count: $.data.displayed_review_count, epc_avg: $.data.displayed_rating_avg_x100 }
          assert:
            - "BusinessPage.${epc_id}.displayed_review_count == 0 and displayed_rating_avg_x100 == 0 regardless of request payload extras"

      - name: event_entities_immutable_no_update
        claim_type: immutability
        grounds: ["entities.AdImpressionEvent", "entities.CallTrackEvent", "entities.AttributionReport"]
        distinguishing_aspect: "common_fields:false event entities have no PATCH/PUT endpoint and no version field; they are append-only."
        test_recipe:
          setup: ["Clock default"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "GET /platform/users"
              payload: {}
              as: PlatformOps
          assert:
            - "No update endpoint exists for AdImpressionEvent/CallTrackEvent/AttributionReport (only list/create); these resources expose no PATCH/PUT and no version field in their payloads"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: review_initial_state_pending_or_scored
        claim_type: valid_transition
        grounds: ["state_machines.Review"]
        distinguishing_aspect: "A freshly submitted review is scored immediately (at_submission variant) and lands DISPLAYED or FILTERED per the threshold; PENDING is reachable only transiently."
        test_recipe:
          setup: ["Clock 2026-09-01; user U1 trust 100; page P1 ACTIVE"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "s1@x.com", display_name: "S One", home_region: "US-CA" }
              as: PlatformOps
              captures: { s1_id: $.data.id }
            - call: "POST /platform/users/${s1_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/business-pages"
              payload: { name: "State Soup", address_line: "4 State St", city: "Springfield", category: "soup", website: "https://state.example" }
              as: PlatformOps
              captures: { sp1_id: $.data.id }
          trigger:
            - call: "POST /platform/business-pages/${sp1_id}/reviews"
              payload: { rating: 5, text: "Trust-one-hundred review displays immediately at submit." }
              as: Reviewer
              as_user_id: "${s1_id}"
              captures: { sr1_state: $.data.recommendation_state }
          assert:
            - "Review recommendation_state == DISPLAYED right after creation (score 700 >= 700)"

      - name: evaluate_removed_review_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Review", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REMOVED is terminal: evaluating a REMOVED review fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Clock 2026-09-01; author UA, owner UO claims P1; review R1 by UA REMOVED via complaint REMOVE_REVIEW"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ta@x.com", display_name: "T Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { ta_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "to@x.com", display_name: "T Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { to_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Term Tacos", address_line: "5 Term St", city: "Springfield", category: "tacos", website: "https://term.example" }
              as: PlatformOps
              captures: { tp1_id: $.data.id, tp1_v: $.data.version }
            - call: "POST /platform/business-pages/${tp1_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Taco shop ownership evidence packet." }
              as: BusinessOwner
              as_user_id: "${to_id}"
              captures: { tcl_id: $.data.id, tcl_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${tcl_id}/verify"
              payload: { verification_code: "${tcl_code}" }
              as: BusinessOwner
              as_user_id: "${to_id}"
            - call: "POST /platform/page-claims/${tcl_id}/approve"
              payload: { expected_page_version: "${tp1_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${tp1_id}/reviews"
              payload: { rating: 1, text: "One star review headed for removal shortly." }
              as: Reviewer
              as_user_id: "${ta_id}"
              captures: { tr1_id: $.data.id }
            - call: "POST /platform/business-pages/${tp1_id}/complaints"
              payload: { review_id: "${tr1_id}", kind: "NEGATIVE_DISPUTE", body: "Please remove this one star review." }
              as: BusinessOwner
              as_user_id: "${to_id}"
              captures: { tc1_id: $.data.id }
            - call: "POST /platform/complaints/${tc1_id}/start-review"
              payload: {}
              as: ContentModerator
            - call: "POST /platform/complaints/${tc1_id}/resolve"
              payload: { action: "REMOVE_REVIEW" }
              as: ContentModerator
          trigger:
            - call: "POST /platform/reviews/${tr1_id}/evaluate"
              payload: {}
              as: PlatformOps
              captures: { term_err: $.data.error_id }
          assert:
            - "Evaluate on REMOVED review returns 409 ERR_INVALID_STATE"
            - "Review.${tr1_id}.recommendation_state remains REMOVED"

      - name: complaint_escalate_sets_flag_and_state
        claim_type: side_effect_execution
        grounds: ["state_machines.Complaint.UNDER_REVIEW_to_ESCALATED"]
        distinguishing_aspect: "Escalate sets both status=ESCALATED and escalated=true; the escalated flag persists through later resolution."
        test_recipe:
          setup: ["Clock 2026-09-01; owner UO claims P1; review R1 FILTERED; complaint CM1 UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ea@x.com", display_name: "Esc Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { ea_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "eo@x.com", display_name: "Esc Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { eo_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Esc Eats", address_line: "6 Esc St", city: "Springfield", category: "cafe", website: "https://esc.example" }
              as: PlatformOps
              captures: { epp_id: $.data.id, epp_v: $.data.version }
            - call: "POST /platform/business-pages/${epp_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Escalation test ownership evidence." }
              as: BusinessOwner
              as_user_id: "${eo_id}"
              captures: { ecl_id: $.data.id, ecl_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${ecl_id}/verify"
              payload: { verification_code: "${ecl_code}" }
              as: BusinessOwner
              as_user_id: "${eo_id}"
            - call: "POST /platform/page-claims/${ecl_id}/approve"
              payload: { expected_page_version: "${epp_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${epp_id}/reviews"
              payload: { rating: 2, text: "Two star review destined for a filter dispute." }
              as: Reviewer
              as_user_id: "${ea_id}"
              captures: { er_id: $.data.id }
            - call: "POST /platform/business-pages/${epp_id}/complaints"
              payload: { review_id: "${er_id}", kind: "FILTERED_DISPUTE", body: "Dispute this filtering decision please." }
              as: BusinessOwner
              as_user_id: "${eo_id}"
              captures: { ec_id: $.data.id }
            - call: "POST /platform/complaints/${ec_id}/start-review"
              payload: {}
              as: ContentModerator
          trigger:
            - call: "POST /platform/complaints/${ec_id}/escalate"
              payload: {}
              as: ContentModerator
              captures: { ec_status: $.data.status, ec_flag: $.data.escalated }
          assert:
            - "Complaint.${ec_id}.status == ESCALATED and escalated == true"

      - name: complaint_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Complaint"]
        distinguishing_aspect: "A RESOLVED_UPHELD complaint accepts no further transitions: start-review, escalate, resolve, and reject all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-09-01; owner UO claims P1; review R1 FILTERED; complaint CM1 resolved UPHOLD_FILTER"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "la2@x.com", display_name: "Lock Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { la2_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "lo2@x.com", display_name: "Lock Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { lo2_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Lock Lunch", address_line: "7 Lock St", city: "Springfield", category: "deli", website: "https://lock.example" }
              as: PlatformOps
              captures: { lp_id: $.data.id, lp_v: $.data.version }
            - call: "POST /platform/business-pages/${lp_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Lock test ownership evidence bundle." }
              as: BusinessOwner
              as_user_id: "${lo2_id}"
              captures: { lcl_id: $.data.id, lcl_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${lcl_id}/verify"
              payload: { verification_code: "${lcl_code}" }
              as: BusinessOwner
              as_user_id: "${lo2_id}"
            - call: "POST /platform/page-claims/${lcl_id}/approve"
              payload: { expected_page_version: "${lp_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${lp_id}/reviews"
              payload: { rating: 3, text: "Three star filtered review for lockdown test." }
              as: Reviewer
              as_user_id: "${la2_id}"
              captures: { lr_id: $.data.id }
            - call: "POST /platform/business-pages/${lp_id}/complaints"
              payload: { review_id: "${lr_id}", kind: "FILTERED_DISPUTE", body: "Dispute the filter on this review." }
              as: BusinessOwner
              as_user_id: "${lo2_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /platform/complaints/${lc_id}/start-review"
              payload: {}
              as: ContentModerator
            - call: "POST /platform/complaints/${lc_id}/resolve"
              payload: { action: "UPHOLD_FILTER" }
              as: ContentModerator
          trigger:
            - call: "POST /platform/complaints/${lc_id}/reject"
              payload: {}
              as: ContentModerator
              captures: { lock_err: $.data.error_id }
          assert:
            - "Reject on terminal RESOLVED_UPHELD complaint returns 409 ERR_INVALID_STATE"
            - "Complaint.${lc_id}.status remains RESOLVED_UPHELD"

      - name: pageclaim_expiry_via_clock
        claim_type: valid_transition
        grounds: ["state_machines.PageClaim.SUBMITTED_to_EXPIRED", "validations[priority=12]"]
        distinguishing_aspect: "Advancing the logical clock past created_at + 7d expires a SUBMITTED claim; verify afterwards fails with ERR_VERIFICATION_EXPIRED."
        test_recipe:
          setup: ["Clock 2026-09-01; page P1 unclaimed; claim CL1 SUBMITTED at 2026-09-01; clock advanced to 2026-09-09"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "claimx@x.com", display_name: "Claim X", home_region: "US-CA" }
              as: PlatformOps
              captures: { cxu_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Expiry Eats", address_line: "8 Expire St", city: "Springfield", category: "cafe", website: "https://expire.example" }
              as: PlatformOps
              captures: { exp_id: $.data.id }
            - call: "POST /platform/business-pages/${exp_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Claim that will expire unverified." }
              as: BusinessOwner
              as_user_id: "${cxu_id}"
              captures: { excl_id: $.data.id, excl_code: $.data.verification_code }
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /platform/page-claims/${excl_id}/verify"
              payload: { verification_code: "${excl_code}" }
              as: BusinessOwner
              as_user_id: "${cxu_id}"
              captures: { exp_err: $.data.error_id }
          assert:
            - "Verify 8 days after submission fails with 410 ERR_VERIFICATION_EXPIRED"
            - "PageClaim.${excl_id}.status == EXPIRED (lazy clock-advance transition)"

      - name: merge_rejected_leaves_pages_untouched
        claim_type: side_effect_execution
        grounds: ["state_machines.MergeRequest.PENDING_to_REJECTED"]
        distinguishing_aspect: "Rejecting a PENDING merge request changes only the request; both pages stay ACTIVE with reviews unmoved."
        test_recipe:
          setup: ["Clock 2026-09-01; pages PD and PS ACTIVE; MR1 PENDING"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/business-pages"
              payload: { name: "Reject Dup", address_line: "9 Rej Rd", city: "Springfield", category: "cafe", website: "https://rejd.example" }
              as: PlatformOps
              captures: { rjd_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Reject Surv", address_line: "10 Rej Rd", city: "Springfield", category: "cafe", website: "https://rejs.example" }
              as: PlatformOps
              captures: { rjs_id: $.data.id }
            - call: "POST /platform/merge-requests"
              payload: { duplicate_page_id: "${rjd_id}", survivor_page_id: "${rjs_id}", reason: "Possible duplicates under review." }
              as: SupportAdmin
              captures: { rjm_id: $.data.id }
          trigger:
            - call: "POST /platform/merge-requests/${rjm_id}/reject"
              payload: {}
              as: SupportAdmin
          assert:
            - "MergeRequest.${rjm_id}.status == REJECTED"
            - "BusinessPage.${rjd_id}.status == ACTIVE and merged_into_id == null"
            - "BusinessPage.${rjs_id}.status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: displayed_average_rounding_sum_then_round
        claim_type: precision
        grounds: ["calculations.displayed_rating_average"]
        distinguishing_aspect: "Rounding order pinned: sum first, divide, then round_half_up at the final step. Ratings 5,4,4 -> 100*13/3 = 433.33 -> 433; ratings 5,4 -> 450 exactly; a per-review-rounding implementation would produce different values."
        test_recipe:
          setup: ["Clock 2026-09-01; page P1; three trust-100 users each post a DISPLAYED review with ratings 5, 4, 4"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "av1@x.com", display_name: "Avg One", home_region: "US-CA" }
              as: PlatformOps
              captures: { av1_id: $.data.id }
            - call: "POST /platform/users/${av1_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "av2@x.com", display_name: "Avg Two", home_region: "US-CA" }
              as: PlatformOps
              captures: { av2_id: $.data.id }
            - call: "POST /platform/users/${av2_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "av3@x.com", display_name: "Avg Three", home_region: "US-CA" }
              as: PlatformOps
              captures: { av3_id: $.data.id }
            - call: "POST /platform/users/${av3_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/business-pages"
              payload: { name: "Average Annex", address_line: "11 Avg Ave", city: "Springfield", category: "cafe", website: "https://avg.example" }
              as: PlatformOps
              captures: { avp_id: $.data.id }
          trigger:
            - call: "POST /platform/business-pages/${avp_id}/reviews"
              payload: { rating: 5, text: "Five star review for rounding test one." }
              as: Reviewer
              as_user_id: "${av1_id}"
            - call: "POST /platform/business-pages/${avp_id}/reviews"
              payload: { rating: 4, text: "Four star review for rounding test two." }
              as: Reviewer
              as_user_id: "${av2_id}"
            - call: "POST /platform/business-pages/${avp_id}/reviews"
              payload: { rating: 4, text: "Four star review for rounding test three." }
              as: Reviewer
              as_user_id: "${av3_id}"
            - call: "GET /platform/business-pages/${avp_id}"
              payload: {}
              as: PlatformOps
              captures: { avp_avg: $.data.displayed_rating_avg_x100, avp_count: $.data.displayed_review_count }
          assert:
            - "BusinessPage.${avp_id}.displayed_review_count == 3"
            - "BusinessPage.${avp_id}.displayed_rating_avg_x100 == 433 (round_half_up(100*13/3), single final rounding)"

      - name: empty_page_average_is_zero
        claim_type: correct_result
        grounds: ["calculations.displayed_rating_average"]
        distinguishing_aspect: "The empty-set edge: a page with zero DISPLAYED reviews reports displayed_rating_avg_x100 == 0 (no division by zero, no null leak)."
        test_recipe:
          setup: ["Clock 2026-09-01; page P1 with a single FILTERED review (trust-50 author)"]
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "ez@x.com", display_name: "Empty Z", home_region: "US-CA" }
              as: PlatformOps
              captures: { ez_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Empty Eats", address_line: "12 Empty St", city: "Springfield", category: "cafe", website: "https://empty.example" }
              as: PlatformOps
              captures: { ezp_id: $.data.id }
            - call: "POST /platform/business-pages/${ezp_id}/reviews"
              payload: { rating: 5, text: "Filtered review means zero displayed count." }
              as: Reviewer
              as_user_id: "${ez_id}"
