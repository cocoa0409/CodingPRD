              as: Dispatcher
            - call: "POST /tanks/${tank_id}/evaluate-reorder"
              payload: {}
              as: Dispatcher
              captures: { reorder: $.data.reorder_status }
          trigger:
            - call: "POST /tanks/${tank_id}/generate-auto-order"
              payload: {}
              as: Dispatcher
              captures: { req: $.data.requested_gallons, origin: $.data.origin }
          assert:
