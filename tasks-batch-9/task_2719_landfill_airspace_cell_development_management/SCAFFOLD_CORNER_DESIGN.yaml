            - "${hca1_state2} == 'TERMINATED' with ${hca1_term} == 'SUPERSEDED_BY_NEW_AGREEMENT'"
            - "${hca2_state2} == 'UNDER_AMENDMENT' with amendment_reason 'Annual fee reopener'"
            - "${e_amend} == 'ERR_AMENDMENT_IN_PROGRESS' with HTTP 409, and HCA-2 keeps its FIRST amendment_reason and its amendment_round 0"
            - "${e_live} == 'ERR_HOST_AGREEMENT_ALREADY_LIVE' with HTTP 409 — a DRAFT may not be executed while the site's live agreement is UNDER_AMENDMENT; HCA-3 stays DRAFT and Landfill.version is unchanged from ${lf_v3}"

      - name: requests_with_missing_auth_headers_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Rung 1 precedes everything: the same GET that succeeds with headers must fail with 401 when X-User-Role or X-User-ID is absent, and it must fail with 401 rather than 404 even when the path id does not exist."
        test_recipe:
          setup:
            - "One Landfill LF exists."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
          trigger:
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { e_noheaders: $.data.error_id }
            - call: "GET /cells/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e_noheaders2: $.data.error_id }
            - call: "POST /landfills"
              payload: { name: "Headerless MSW", permit_number: "MSW-0000", permitted_total_airspace_cy: 100, design_footprint_sf: 100, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 100 }
              as: PlatformAdmin
              captures: { e_noheaders3: $.data.error_id }
          assert:
            - "trigger 1 is issued with BOTH the X-User-Role and X-User-ID headers omitted: ${e_noheaders} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "trigger 2 is issued with X-User-ID omitted and X-User-Role present: ${e_noheaders2} == 'ERR_UNAUTHENTICATED' with HTTP 401 — rung 1 outranks the rung-4 path lookup that would otherwise say ERR_CELL_NOT_FOUND"
            - "trigger 3 is issued with X-User-Role omitted: ${e_noheaders3} == 'ERR_UNAUTHENTICATED' with HTTP 401 and no second Landfill row is created"
            - "the identical three requests WITH both headers present succeed (200, 404 with ERR_CELL_NOT_FOUND, and 201 respectively), so the 401 is attributable to the headers alone"

