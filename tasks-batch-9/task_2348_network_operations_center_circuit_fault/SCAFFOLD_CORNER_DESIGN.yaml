              as: PlatformAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pp_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${ca_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pp_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${cb_id}" }
              as: PlatformAdmin
            - call: "POST /failover-tests"
              payload: { application_path_id: "${pp_id}", tested_leg_group: "LEG_A", scheduled_start: "2026-08-20T01:00:00Z", scheduled_end: "2026-08-20T02:00:00Z" }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { ft_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T01:10:00Z" }
              as: PlatformAdmin
            - call: "POST /failover-tests/${ft_id}/start"
              payload: {}
              as: NocAnalyst
          trigger:
            - call: "POST /failover-tests/${ft_id}/record-result"
