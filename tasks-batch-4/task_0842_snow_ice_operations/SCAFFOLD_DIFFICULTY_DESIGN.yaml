            - call: "POST /storm-events/${st}/callouts"
              payload: { operator_id: "${op}", window_start_at: "2026-02-11T00:00:00Z", window_end_at: "2026-02-11T08:00:00Z" }
              as: DispatchSupervisor
              captures: { co_b: $.data.id }
          trigger:
            - call: "POST /callouts/${co_a}/complete"
              payload: { hours_worked: 8.0 }
              as: Operator
              as_user_id: "${op}"
            - call: "POST /callouts/${co_b}/complete"
              payload: { hours_worked: 8.01 }
              as: Operator
              as_user_id: "${op}"
          assert:
            - "Callout.${co_a}.overtime_hours == 0"
            - "Callout.${co_a}.pay_cents == 32000"
            - "Callout.${co_b}.pay_cents == 32060"

