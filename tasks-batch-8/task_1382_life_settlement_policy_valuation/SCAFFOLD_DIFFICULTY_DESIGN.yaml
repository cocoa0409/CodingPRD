            - { call: "POST /api/cases/${cb}/screenings", payload: {}, as: CaseManager, captures: { res_b: "$.data.result" } }
          assert:
            - "captured res_a == PASSED (face 10000000 >= MIN_FACE_CENTS 10000000 inclusive)"
            - "GET /api/cases/${ca}: status == UNDERWRITING"
            - "captured res_b == FAILED; GET /api/cases/${cb}/screenings: latest row checks.face_ok == false and failure_reasons == [\"FACE\"]"
