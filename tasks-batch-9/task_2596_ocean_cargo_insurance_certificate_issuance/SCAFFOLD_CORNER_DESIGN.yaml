          assert:
            - "${err_right} == \"ERR_DECLARATION_PERIOD_OVERLAP\" with HTTP 409"
            - "${err_inside} == \"ERR_DECLARATION_PERIOD_OVERLAP\" with HTTP 409"
            - "${err_left} == \"ERR_DECLARATION_PERIOD_OVERLAP\" with HTTP 409 — a period ending 2026-06-02 still overlaps one starting 2026-06-01"
