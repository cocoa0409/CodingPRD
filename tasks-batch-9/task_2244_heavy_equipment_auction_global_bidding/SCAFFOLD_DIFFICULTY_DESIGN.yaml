              payload: { invoice_id: "${inv1_id}", bay_id: "${bay1_id}", expected_invoice_version: "${inv1_ver_a}", slot_start: "2026-08-18T08:00:00Z", slot_end: "2026-08-18T10:00:00Z", transport_mode: "HOUSE_BROKERED", tonnage_kg: 36000 }
              as: Bidder
