              as: LogisticsCoordinator
              captures: { tank_id: $.data.id }
          trigger:
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: RegulatoryAdmin
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: ProcessEngineer
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: SafetyOfficer
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: CommercialManager
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /nitrogen-ops/plants/{id}"
              payload: {}
              as: TerminalOperator
              as_user_id: "${tank_id}"
          assert:
            - "all six trigger calls return HTTP status 200"
            - "all six trigger calls return data.id == ${plant_id}"
            - "all six trigger calls return data.operating_posture == NORMAL and data.permit_limit_tons_30d == 12.00"
            - "Plant.${plant_id}.version == 1"

      - name: roles_cannot_perform_another_roles_exclusive_write
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=3]
          - roles
        distinguishing_aspect: |
          Five cross-role writes are all 403 ERR_ROLE_NOT_PERMITTED and none of them changes state, even
          where the acting role would be allowed on a neighbouring endpoint of the same resource: the
          commercial manager owns the order book but may not approve the campaign, and the engineer
          produces the tons but may not clear the security check.
        test_recipe:
          setup:
            - "One plant, one train with an ACTIVE zero-hour charge, one PLANNED run PR-1, one REGULATED AMMONIUM_NITRATE line with a CONTROLLED dome, one PENDING order PO-1 on PR-1, one DRAFT quote QT-1 and one DRAFT shipment SH-1 between two UREA assets."
