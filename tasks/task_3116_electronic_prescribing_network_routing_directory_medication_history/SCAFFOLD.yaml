    path: "/network/transaction-fees/{id}"
    description: "Get one transaction fee entry"
    roles: [NetworkOperator, ParticipantAdmin]
    code: 200
    input: []

    output: TransactionFeeEntry
    side_effects: []
  - method: GET
    path: "/network/transaction-fees/{id}/reversal"
    description: "The compensating entry already created for this fee entry"
    roles: [NetworkOperator, ParticipantAdmin]
    code: 200
    input: []

    output: TransactionFeeEntry[]
    side_effects: []
  - method: POST
    path: "/network/transaction-fees/{id}/reverse"
    description: "Reverse a posted fee entry by creating its compensating row"
    roles: [NetworkOperator]
    code: 200
    input: [expected_participant_version]

    output: TransactionFeeEntry
    side_effects:
      - "this entry status → REVERSED (marker only; its fee_cents stays inside period_net_total_cents)"
      - "a compensating entry is created with entry_type = MANUAL_REVERSAL, status POSTED, fee_cents = the negation of this entry's fee_cents, transaction_count = the negation of this entry's transaction_count, the same direction, and reversal_of_entry_id = this entry id"
      - "this entry's reversal_entry_id points at the compensating row"
      - "period_net_total_cents for the participant and month returns to its pre-charge value, and the cell's sum(transaction_count) likewise"
      - "increments NetworkParticipant.version by 1"

