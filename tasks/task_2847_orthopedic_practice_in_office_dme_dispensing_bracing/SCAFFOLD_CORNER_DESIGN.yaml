      - name: corner_parallel_dimensions_evolve_independently
        claim_type: Valid Transition
        grounds:
          - complexity_profile.state_machine_shape (parallel)
          - state_machines[DispenseEncounter.clinical_status]
          - state_machines[DispenseEncounter.financial_status]
        excluded_because:
          difficulty_instance: encounter_parallel_clinical_and_financial_dimensions_evolve_independently
          rationale: "That §1.8 instance already walks the clinical dimension DRAFT -> DOCUMENTED -> RESERVED -> FITTED while the financial dimension independently walks UNVERIFIED -> VERIFIED -> AUTH_PENDING -> AUTH_APPROVED, asserting the combined state after every step and that neither dimension is advanced by the other's trigger. A second breadth instance of the parallel shape would only re-walk the same pairs."

      - name: corner_fabrication_adjustment_cycle_respects_round_limit
        claim_type: Invalid Transitions
        grounds:
          - complexity_profile.state_machine_shape (cyclic adjustment loop)
          - state_machines[CustomFabOrder].READY_FOR_FITTING -> ADJUSTMENT_REQUESTED
          - errors[ERR_ADJUSTMENT_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: custom_fab_order_adjustment_cycle_third_request_rejected
          rationale: "That §1.8 instance drives the READY_FOR_FITTING -> ADJUSTMENT_REQUESTED -> IN_FABRICATION -> READY_FOR_FITTING loop twice, asserts adjustment_rounds 1 then 2, and shows the third request rejected with ERR_ADJUSTMENT_LIMIT_REACHED while the order stays READY_FOR_FITTING -- which is exactly the loop-count/termination claim for a cyclic machine."

      - name: corner_product_return_fork_and_refit_join
        claim_type: Valid Transition
        grounds:
          - complexity_profile.state_machine_shape (branching fork/join)
          - state_machines[ProductReturn].REQUESTED -> RESTOCKED
          - state_machines[ProductReturn].REQUESTED -> DESTROYED
          - state_machines[ProductReturn].RESTOCKED -> REFIT_ISSUED
        excluded_because:
          difficulty_instance: product_return_fork_restocked_or_destroyed_then_join_refit_issued
          rationale: "That §1.8 instance runs both fork arms on identical inputs (SELLABLE -> RESTOCKED with the shelf credited, SOILED -> DESTROYED with the shelf untouched) and then joins both arms into REFIT_ISSUED, asserting the differing money and inventory consequences of each arm."

      - name: corner_guarded_transition_requires_accepted_fab_order
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[DispenseEncounter.clinical_status].AWAITING_DEVICE -> FITTED
          - validations[priority=24]
          - errors[ERR_INVALID_FAB_ORDER_STATE]
        excluded_because:
          difficulty_instance: awaiting_device_fitting_blocked_until_fab_order_accepted_rejected
          rationale: "That §1.8 instance is the guarded-transition claim in full: it attempts the AWAITING_DEVICE -> FITTED fitting while the child CustomFabOrder is only READY_FOR_FITTING, asserts ERR_INVALID_FAB_ORDER_STATE rather than ERR_INVALID_CLINICAL_STATE, then accepts the order and shows the same fitting succeed."

      - name: corner_dispense_cascade_suspends_clinic_and_holds_siblings
        claim_type: Side Effect Execution
        grounds:
          - state_machines[ClinicParLevel.stock_posture].OK -> STOCKOUT
          - state_machines[Clinic.dispensing_status].RESTRICTED -> SUSPENDED
          - calculations.clinic_dispensing_posture
        excluded_because:
          difficulty_instance: dispense_drains_shelf_cascades_par_posture_clinic_suspension_sibling_hold
          rationale: "That §1.8 instance verifies the whole four-link cascade end to end (dispense -> on_hand_qty 0 -> stock_posture STOCKOUT -> stockout_par_level_count 2 -> Clinic SUSPENDED -> compliance_hold on the sibling RESERVED encounter) including the ordering sensitivity, so the cascade-down and bubble-up side-effect patterns are already covered at depth."

