# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Single top-level key: scaffold_difficulty_design
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: complaint_age_calendar_vs_business_divergence
        grounds:
          - calculations.complaint_age_calendar
          - calculations.complaint_age_business
          - entities.Complaint.fields.days_open_calendar
          - entities.Complaint.fields.days_open_business
        distinguishing_aspect: |
          Two valid aging algorithms on the SAME complaint — calendar-day
          counting vs business-day counting over the fixed holiday/weekend
          rules — produce different values for identical received_at and
          clock position whenever the window spans a weekend: received
          2026-08-01 (Saturday), clock 2026-08-10 yields days_open_calendar
          == 9 but days_open_business == 6.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-10T00:00:00Z (Monday)"
            - "One complaint created at the default clock 2026-08-01T00:00:00Z (Saturday) on a non-terminal status"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "CKNG-STD", display_name: "Standard Checking" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web Portal" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES.OVERDRAFT" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-001", channel_code: "WEB", product_code: "CKNG-STD", category_code: "FEES.OVERDRAFT", narrative: "Overdraft fee dispute" }
              as: IntakeSpecialist
              captures: { c1_id: $.data.id }
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplaintManager
          trigger:
            - call: "GET /complaint-office/complaints/${c1_id}"
              payload: {}
              as: CaseHandler
          assert:
            - "Complaint.${c1_id}.days_open_calendar == 9"
            - "Complaint.${c1_id}.days_open_business == 6"
            - "Complaint.${c1_id}.days_open_calendar != Complaint.${c1_id}.days_open_business"

      - name: restitution_per_line_floor_vs_sum_first_divergence
        grounds:
          - calculations.restitution_amount
          - entities.RemediationDecision.fields.restitution_amount_cents
          - entities.RemediationDecision.fields.line_items
        distinguishing_aspect: |
          Two valid rounding orders on the SAME line_items — per-line floor
          then sum (pinned by the scaffold) vs sum-then-floor — produce
          different totals: lines [101, 103] at 5000 bps yield 101 under the
          pinned order but 102 under sum-first; the RESTITUTION domain
          diverges independently of the complaint-aging divergence above.
        test_recipe:
          setup:
            - "Complaint in INVESTIGATING status (remediable)"
            - "Complaint created at default clock, triaged, investigation started"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "CARD-GLD", display_name: "Gold Card" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "PHONE", display_name: "Phone" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES.LATE" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-002", channel_code: "PHONE", product_code: "CARD-GLD", category_code: "FEES.LATE", narrative: "Late fee dispute" }
              as: IntakeSpecialist
              captures: { c2_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c2_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c2_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${c2_id}"
              payload: {}
              as: CaseHandler
              captures: { c2_v: $.data.version }
          trigger:
            - call: "POST /complaint-office/complaints/${c2_id}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "fee1", amount_cents: 101, rounding_rate_bps: 5000 }, { label: "fee2", amount_cents: 103, rounding_rate_bps: 5000 } ], expected_complaint_version: "${c2_v}" }
              as: CaseHandler
              captures: { dec_id: $.data.id }
          assert:
            - "RemediationDecision.${dec_id}.restitution_amount_cents == 101"
            - "RemediationDecision.${dec_id}.restitution_amount_cents != 102"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a), (b), (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: timeliness_score_multi_input_nonlinear
        grounds:
          - calculations.response_timeliness_score
          - entities.Complaint.fields.timeliness_score
          - state_machines.RegulatoryReferral.OPEN_to_RESPONSE_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: days_to_respond
          (linear decay with floor at 0), referral.timeliness (conditional
          0.5 multiplier), latest QA outcome (three-way branch +10/-15/0),
          and claimed_loss_cents (tiered bonus at >= 1000000). On-time
          submission at day 4 with QA PASS and high-value claim yields
          min(100, floor(80*1.0)+10+5) == 95; a late day-19 submission with
          no QA and low claim yields max(0, min(100, floor(5*0.5))) == 2.
        test_recipe:
          setup:
            - "Portal-channel complaint created at 2026-08-01T00:00:00Z with claimed_loss_cents 2000000; referral auto-created"
            - "Complaint driven to RESPONSE_QA; QA review completed PASS by a distinct reviewer; referral response submitted on 2026-08-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "MORT-CONF", display_name: "Conforming Mortgage" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "CFPB Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "LOAN.SERVICING" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-003", channel_code: "CFPB_PORTAL", product_code: "MORT-CONF", category_code: "LOAN.SERVICING", narrative: "Escrow mishandling", claimed_loss_cents: 2000000, portal_ref: "CFPB-2026-001" }
              as: IntakeSpecialist
              as_user_id: "user_intake_1"
              captures: { c3_id: $.data.id }
            - call: "GET /complaint-office/complaints/${c3_id}/referrals"
              payload: {}
              as: CaseHandler
              captures: { ref3_id: $.data.0.id }
            - call: "POST /complaint-office/complaints/${c3_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c3_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c3_id}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "MORT-CONF", process_step: "ESCROW_ANALYSIS" }
              as: CaseHandler
              captures: { rca3_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca3_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c3_id}/draft_response"
              payload: { response_text: "We have corrected the escrow analysis." }
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c3_id}/submit_for_qa"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c3_id}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-15T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_1"
              captures: { qr3_id: $.data.id }
            - call: "POST /complaint-office/quality-reviews/${qr3_id}/complete"
              payload: { outcome: "PASS" }
              as: QAReviewer
              as_user_id: "user_qa_1"
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/referrals/${ref3_id}/submit_response"
              payload: { response_text: "Response to regulator with remediation summary." }
              as: CaseHandler
          assert:
            - "RegulatoryReferral.${ref3_id}.timeliness == ON_TIME"
            - "RegulatoryReferral.${ref3_id}.response_due_at == 2026-08-16T00:00:00Z"
            - "Complaint.${c3_id}.timeliness_score == 95"

      - name: early_warning_pinned_evaluation_order
        grounds:
          - calculations.early_warning_threshold
          - entities.TrendSnapshot.fields.early_warning
          - entities.TrendSnapshot.fields.substantiation_rate_bps
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned order: the
          snapshot's early_warning depends on a live recompute of
          Product.open_complaint_count, which itself changes as complaints
          resolve; the pinned order (count -> rate -> live open count ->
          boolean) makes the value well-defined. A window with 4 complaints
          and 2 substantiated yields rate exactly 5000 bps (>= boundary) and
          early_warning == true; a same-product window with 3 complaints and
          1 substantiated yields 3333 bps and (with open count < 10)
          early_warning == false.
        test_recipe:
          setup:
            - "Product with 4 complaints received inside window [2026-08-01, 2026-08-31]; exactly 2 carry COMPLETED SUBSTANTIATED RCAs; product open count at evaluation is 4 (< 10)"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "AUTO-IND", display_name: "Indirect Auto" }
              as: ComplaintManager
              captures: { p4_id: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "BRANCH", display_name: "Branch" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "LOAN.PAYOFF" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-101", channel_code: "BRANCH", product_code: "AUTO-IND", category_code: "LOAN.PAYOFF", narrative: "n1" }
              as: IntakeSpecialist
              captures: { c41_id: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-102", channel_code: "BRANCH", product_code: "AUTO-IND", category_code: "LOAN.PAYOFF", narrative: "n2" }
              as: IntakeSpecialist
              captures: { c42_id: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-103", channel_code: "BRANCH", product_code: "AUTO-IND", category_code: "LOAN.PAYOFF", narrative: "n3" }
              as: IntakeSpecialist
              captures: { c43_id: $.data.id }
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-104", channel_code: "BRANCH", product_code: "AUTO-IND", category_code: "LOAN.PAYOFF", narrative: "n4" }
              as: IntakeSpecialist
              captures: { c44_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c41_id}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "AUTO-IND", process_step: "PAYOFF_QUOTE" }
              as: CaseHandler
              captures: { rca41_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca41_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c42_id}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "AUTO-IND", process_step: "PAYOFF_QUOTE" }
              as: CaseHandler
              captures: { rca42_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca42_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c43_id}/rcas"
              payload: { verdict: "NOT_SUBSTANTIATED", linked_product_code: "AUTO-IND", process_step: "PAYOFF_QUOTE" }
              as: CaseHandler
              captures: { rca43_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca43_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c44_id}/rcas"
              payload: { verdict: "INCONCLUSIVE", linked_product_code: "AUTO-IND", process_step: "PAYOFF_QUOTE" }
              as: CaseHandler
              captures: { rca44_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca44_id}/complete"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/products/${p4_id}/trend-snapshots"
              payload: { period_start_at: "2026-08-01T00:00:00Z", period_end_at: "2026-08-31T23:59:59Z" }
              as: ComplaintManager
              captures: { snap4_id: $.data.id }
          assert:
            - "TrendSnapshot.${snap4_id}.complaint_count == 4"
            - "TrendSnapshot.${snap4_id}.substantiated_count == 2"
            - "TrendSnapshot.${snap4_id}.substantiation_rate_bps == 5000"
            - "TrendSnapshot.${snap4_id}.early_warning == true"
            - "Product.${p4_id}.early_warning_active == true"
            - "Product.${p4_id}.posture == WATCH"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_resolved_reopened_cycle_restores_work_state
        grounds:
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - state_machines.Complaint.REOPENED_to_INVESTIGATING
          - entities.Complaint.fields.retention_purge_at
        distinguishing_aspect: |
          Cyclic machine on Complaint: RESOLVED -> REOPENED -> INVESTIGATING
          closes a work loop; the reopen must clear resolved_at and
          retention_purge_at (set at resolve time) and re-increment
          Product.open_complaint_count, proving the cycle restores the
          pre-terminal working state rather than minting a new record.
        test_recipe:
          setup:
            - "Complaint fully resolved (QA PASS on file); Product.open_complaint_count == 0; retention_purge_at == 2031-08-10T00:00:00Z (resolved 2026-08-10 at the default-clock start... resolved_at pinned by clock set)"
            - "Clock remains 2026-08-10T00:00:00Z (before retention expiry)"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "SAVE-PLUS", display_name: "Savings Plus" }
              as: ComplaintManager
              captures: { p5_id: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "SVC.STATEMENT" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-201", channel_code: "WEB", product_code: "SAVE-PLUS", category_code: "SVC.STATEMENT", narrative: "Statement error" }
              as: IntakeSpecialist
              as_user_id: "user_intake_2"
              captures: { c5_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c5_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "SAVE-PLUS", process_step: "STATEMENT_GEN" }
              as: CaseHandler
              captures: { rca5_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca5_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/draft_response"
              payload: { response_text: "Corrected statement issued." }
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/submit_for_qa"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-09T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_2"
              captures: { qr5_id: $.data.id }
            - call: "POST /complaint-office/quality-reviews/${qr5_id}/complete"
              payload: { outcome: "PASS" }
              as: QAReviewer
              as_user_id: "user_qa_2"
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints/${c5_id}/resolve"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${c5_id}/reopen"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c5_id}/start_investigation"
              payload: {}
              as: CaseHandler
          assert:
            - "Complaint.${c5_id}.status == INVESTIGATING"
            - "Complaint.${c5_id}.resolved_at == null"
            - "Complaint.${c5_id}.retention_purge_at == null"
            - "Product.${p5_id}.open_complaint_count == 1"
            - "IntakeEvent stream for ${c5_id} contains a REOPENED event after the resolve STATUS_CHANGED event"

      - name: referral_regulator_reopen_cycle_recomputes_timeliness_same_deadline
        grounds:
          - state_machines.RegulatoryReferral.RESPONSE_SUBMITTED_to_REOPENED_BY_REGULATOR
          - state_machines.RegulatoryReferral.REOPENED_BY_REGULATOR_to_RESPONSE_SUBMITTED
          - calculations.response_due_at
        distinguishing_aspect: |
          Cyclic machine on a DIFFERENT entity (RegulatoryReferral):
          RESPONSE_SUBMITTED -> REOPENED_BY_REGULATOR -> RESPONSE_SUBMITTED
          loops while response_due_at stays fixed at the original 15-day
          deadline; a second submission after the deadline flips timeliness
          to LATE even though the first submission was ON_TIME.
        test_recipe:
          setup:
            - "Portal complaint received 2026-08-01T00:00:00Z; referral OPEN with response_due_at == 2026-08-16T00:00:00Z"
            - "First response submitted ON_TIME at 2026-08-05; referral reopened by regulator at 2026-08-06"
            - "Clock advanced to 2026-08-20T00:00:00Z (past deadline) before the second submission"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "HELM-FIX", display_name: "Home Equity Fixed" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "CFPB Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "LOAN.PMI" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-301", channel_code: "CFPB_PORTAL", product_code: "HELM-FIX", category_code: "LOAN.PMI", narrative: "PMI cancellation refusal", portal_ref: "CFPB-2026-777" }
              as: IntakeSpecialist
              captures: { c6_id: $.data.id }
            - call: "GET /complaint-office/complaints/${c6_id}/referrals"
              payload: {}
              as: CaseHandler
              captures: { ref6_id: $.data.0.id }
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplaintManager
            - call: "POST /complaint-office/referrals/${ref6_id}/submit_response"
              payload: { response_text: "Initial response." }
              as: CaseHandler
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ComplaintManager
            - call: "POST /complaint-office/referrals/${ref6_id}/regulator_reopen"
              payload: {}
              as: ComplaintManager
            - call: "POST /complaint-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/referrals/${ref6_id}/submit_response"
              payload: { response_text: "Supplemental response after reopen." }
              as: CaseHandler
          assert:
            - "RegulatoryReferral.${ref6_id}.status == RESPONSE_SUBMITTED"
            - "RegulatoryReferral.${ref6_id}.timeliness == LATE"
            - "RegulatoryReferral.${ref6_id}.response_due_at == 2026-08-16T00:00:00Z"
            - "RegulatoryReferral.${ref6_id}.submitted_at == 2026-08-20T00:00:00Z"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: regulator_reopen_cascades_referral_to_complaint_to_product
        grounds:
          - state_machines.RegulatoryReferral.RESPONSE_SUBMITTED_to_REOPENED_BY_REGULATOR
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - calculations.product_posture
          - entities.Product.fields.open_complaint_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by referral regulator_reopen: hop 1
          referral RESPONSE_SUBMITTED -> REOPENED_BY_REGULATOR; hop 2 the
          parent Complaint (RESOLVED) -> REOPENED with resolved_at and
          retention_purge_at cleared; hop 3 Product.open_complaint_count
          increments and Product.posture recomputes. Each hop is caused by
          the previous mutation, not by the original call.
        test_recipe:
          setup:
            - "Portal complaint fully RESOLVED (QA PASS, response submitted on time, referral RESPONSE_SUBMITTED); Product.open_complaint_count == 0"
            - "Clock 2026-08-12T00:00:00Z"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "PIR-REV", display_name: "Reverse Mortgage" }
              as: ComplaintManager
              captures: { p7_id: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "CFPB Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "LOAN.PAYOFF" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-401", channel_code: "CFPB_PORTAL", product_code: "PIR-REV", category_code: "LOAN.PAYOFF", narrative: "Payoff statement delay", portal_ref: "CFPB-2026-900" }
              as: IntakeSpecialist
              as_user_id: "user_intake_3"
              captures: { c7_id: $.data.id }
            - call: "GET /complaint-office/complaints/${c7_id}/referrals"
              payload: {}
              as: CaseHandler
              captures: { ref7_id: $.data.0.id }
            - call: "POST /complaint-office/complaints/${c7_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c7_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c7_id}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "PIR-REV", process_step: "PAYOFF_LETTER" }
              as: CaseHandler
              captures: { rca7_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca7_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c7_id}/draft_response"
              payload: { response_text: "Payoff letter reissued." }
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c7_id}/submit_for_qa"
