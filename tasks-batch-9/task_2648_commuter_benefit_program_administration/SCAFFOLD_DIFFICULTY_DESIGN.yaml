            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-P2", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp1_id}", benefit_category_id: "${cat_id}" }
