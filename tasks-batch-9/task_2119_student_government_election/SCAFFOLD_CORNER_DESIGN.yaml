  - section: validations
    instances:

      - name: pagination_limit_above_maximum_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and is rejected with ERR_INVALID_PAGINATION and HTTP 400; limit 100 is accepted."
        test_recipe:
          setup:
            - "One election exists."
          setup_api_calls:
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 50000, poster_cap: 50, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          trigger:
            - call: "GET /elections"
              payload: { limit: 101 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /elections"
              payload: { limit: 100 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          assert:
            - "the first trigger returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "the second trigger returns HTTP 200 with total_count == 1 and has_more == false"

