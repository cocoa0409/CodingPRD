          - calculations.retention_destruction_eligible_at.variants.EXIT_ANCHORED
        excluded_because:
          difficulty_instance: dual_variant_calc / retention_last_activity_vs_exit_anchor
          rationale: "Which anchor governs destruction_eligible_at versus exit_anchored_eligible_at is the subject of the named §1.8 instance."

