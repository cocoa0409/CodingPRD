    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []

  - method: GET
    path: "/api/billing-accounts/{id}/billing-periods/{id}"
    description: "Get a BillingPeriod"
    roles: [BillingAdmin, FinanceReader, TeamLead]
    code: 200
