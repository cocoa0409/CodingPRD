  # ===========================================================================
  # Rule 3: non_linear_state_machine — different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: conversion_order_rework_cycle_resets_post_window_and_signoff
        grounds:
          - state_machines.ConversionOrder.QC_REVIEW_to_REWORK_REQUESTED
          - state_machines.ConversionOrder.REWORK_REQUESTED_to_IN_POST
          - entities.ConversionOrder.fields.filmmaker_signoff
        distinguishing_aspect: |
          ConversionOrder exhibits a cycle: QC_REVIEW → REWORK_REQUESTED →
          IN_POST. Each rework resets scheduled_post_end_date to clock+7d and
          clears filmmaker_signoff, distinguishing it from a linear pipeline.
        test_recipe:
          setup:
            - "Logical clock 2026-09-04. Studio ACTIVE, film (90 min, release 2026-09-15), conversion with filmmaker_approval_required=true driven SUBMITTED → IN_POST → QC_REVIEW."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/studios", payload: { studio_legal_name: "St A", contact_email: "a@st.com" }, as: StudioRelationshipManager, captures: { stu_id: $.data.id } }
            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "Film Y", runtime_minutes: 90, worldwide_release_date: "2026-09-15T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_id: $.data.id } }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z", filmmaker_approval_required: true }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/conversion-orders/${conv_id}/submit-for-qc", payload: {}, as: PostProductionScheduler }
          trigger:
            - { call: "POST /v1/conversion-orders/${conv_id}/request-rework", payload: {}, as: QualityAssuranceReviewer }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "GET /v1/conversion-orders/${conv_id}", payload: {}, as: PostProductionScheduler }
          assert:
            - "After request-rework: ConversionOrder.${conv_id}.status == REWORK_REQUESTED"
            - "After begin-post (the cycle return): ConversionOrder.${conv_id}.status == IN_POST"
            - "ConversionOrder.${conv_id}.scheduled_post_end_date == 2026-09-11T00:00:00Z (clock 2026-09-04 + 7 days)"
            - "ConversionOrder.${conv_id}.filmmaker_signoff == false (cleared by the rework)"

