  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: batch_accept_state_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=24]
          - endpoints.POST_/data-feed-batches/{id}/accept
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: accepting a batch already in
          REJECTED (state violation) while the agreement royalty budget is exhausted
          (fiscal violation) must return ERR_BATCH_INVALID_STATE (409), never
          ERR_ROYALTY_BUDGET_EXHAUSTED.
        test_recipe:
          setup:
            - "PHARMACY supplier, agreement ACTIVE with royalty_budget_cents 0 (fiscal armed: any royalty exceeds it), batch of 20000 records driven to REJECTED (state violation armed)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "PharmCo3", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 0 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 20000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b_id}/reject"
              payload: {}
              as: PrivacyOfficer
          trigger:
            - call: "POST /data-feed-batches/${b_id}/accept"
              payload: { deid_qa_score: 0.99 }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BATCH_INVALID_STATE with HTTP 409 (state priority 9 beats fiscal priority 24)"
            - "GET /data-feed-batches/${b_id} still shows status REJECTED and royalty_cents null"
            - "GET /data-acquisition-agreements/${ag_id} still shows royalty_spent_cents == 0"

      - name: compile_safety_beats_referential
        grounds:
          - validations[priority=15]
          - validations[priority=21]
          - endpoints.POST_/report-deliveries/{id}/compile
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential: compiling with
          a forced include of an opted-out prescriber (safety) while the product's
          pinned methodology version is stale (referential) must return
          ERR_PRESCRIBER_OPT_OUT_VIOLATION (422), never ERR_PRODUCT_VERSION_STALE.
        test_recipe:
          setup:
            - "Default clock. Prescriber P1 with an ACTIVE opt-out. Methodology restated after product creation so product.pinned_methodology_version (1) != methodology.version (2); its only cell is PENDING_RESTATEMENT. Period ended 2026-08-31, one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr X", npi: "NPI-101", state_code: "TX", specialty: "CARDIOLOGY" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-PRI", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, mv: $.data.version }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "TX-ALL", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Client Pri", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-PRI", prescriber_ids: ["${p1_id}"], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /prescribers/${p1_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { oo_id: $.data.id }
            - call: "POST /prescriber-opt-outs/${oo_id}/verify"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /prescriber-opt-outs/${oo_id}/activate"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /projection-methodologies/${m_id}/restate"
              payload: { expected_methodology_version: "${mv}" }
              as: PlatformAdmin
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: { include_prescriber_ids: ["${p1_id}"] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRESCRIBER_OPT_OUT_VIOLATION with HTTP 422 (safety priority 15 beats referential priorities 21/22)"
            - "GET /report-deliveries/${d_id} still shows status SCHEDULED with fee_cents null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: qa_bonus_threshold_at_exact_0_98
        grounds:
          - calculations.calc_acquisition_royalty
          - validations[priority=17]
          - endpoints.POST_/data-feed-batches/{id}/accept
        distinguishing_aspect: |
          Boundary metric: deid_qa_score against the >= 0.98 QA-bonus threshold on
          the accept endpoint. Exactly 0.98 earns the +10% bonus (30000 -> 33000);
          0.9799 does not (stays 30000) — a >= vs > distinction.
        test_recipe:
          setup:
            - "PHARMACY supplier, ACTIVE agreement (budget 10000000), profile, two batches of 20000 records each, both DEIDENTIFIED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "PharmCo4", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 10000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /deidentification-profiles"
              payload: { name: "DP4", salt_version: "sv1" }
              as: PrivacyOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 20000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 20000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /data-feed-batches/${b1_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b1_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
            - call: "POST /data-feed-batches/${b2_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b2_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
          trigger:
            - call: "POST /data-feed-batches/${b1_id}/accept"
              payload: { deid_qa_score: 0.98 }
