              as_user_id: "buyer-std"
              captures: { c_proof2x: $.data.id }
            - call: "POST /drinkware/artwork-proofs/${c_proof2x}/request-changes"
              payload: { review_notes: "round 2 notes" }
              as: PrepressTech
              as_user_id: "pp-1"
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${c_order}", artwork_file_ref: "s3://art/std-v3.ai", color_count: 1, placement_count: 1, pantone_codes: ["PMS 533"] }
              as: Buyer
              as_user_id: "buyer-std"
              captures: { c_proof3x: $.data.id }
            - call: "POST /drinkware/artwork-proofs/${c_proof3x}/request-changes"
              payload: { review_notes: "round 3 notes" }
              as: PrepressTech
              as_user_id: "pp-1"
          trigger:
            - call: "POST /drinkware/artwork-proofs"
              payload: { order_id: "${c_order}", artwork_file_ref: "s3://art/std-v4.ai", color_count: 1, placement_count: 1, pantone_codes: ["PMS 533"] }
              as: Buyer
              as_user_id: "buyer-std"
              captures: { err_rounds: $.data.error_id }
            - call: "POST /drinkware/customization-orders/${c_order}/cancel"
