              as: CaseWorker
              captures: { ncpc: "$.data.id" }
            - call: "POST /child-support/participants/${ncpc}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpc}", noncustodial_party_id: "${ncpc}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casec: "$.data.id" }
