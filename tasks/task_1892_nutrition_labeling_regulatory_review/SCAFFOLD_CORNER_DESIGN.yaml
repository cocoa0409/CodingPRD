      - name: val_panel_not_current_on_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_PANEL_NOT_CURRENT]"]
        distinguishing_aspect: "Submit-review after the only DATABASE panel went STALE (its recipe superseded by a newer LOCKED recipe) fails with ERR_PANEL_NOT_CURRENT."
