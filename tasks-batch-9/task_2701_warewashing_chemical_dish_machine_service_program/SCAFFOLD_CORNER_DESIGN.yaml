          - state_machines.MachinePlacement.placement_status.RETRIEVAL_SCHEDULED_to_RETRIEVED
        distinguishing_aspect: |
          Retrieval is two actions, not one: the order only schedules (RETRIEVAL_SCHEDULED, health axis
          untouched at UP, retrieval_due_date taken from the request instead of the default 14 days), and
          only the completion moves the machine to RETRIEVED, forces the health axis to OFFLINE and drives
          every dispenser to the terminal REMOVED state - which then frees the (placement, product) slot
          that dispenser_product_unique_per_placement guards.
