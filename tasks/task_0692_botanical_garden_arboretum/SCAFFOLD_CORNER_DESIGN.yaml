          trigger:
            - call: "POST /v1/gardens"
              payload: { name: "Sneaky Garden" }
              as: Visitor
              as_user_id: "anon-sneak"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_headers_returns_unauthenticated
        claim_type: missing_auth
        grounds:
          - roles
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID -> ERR_UNAUTHENTICATED 401 (auth precedes role and existence checks)."
        test_recipe:
          setup: ["Empty DB; request sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/gardens/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: development_officer_cannot_check_in_returns_forbidden
        claim_type: exclusive_operation_denied
        grounds:
          - roles
          - state_machines.Reservation.HELD_to_CHECKED_IN
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A DevelopmentOfficer calling POST /v1/reservations/{id}/check-in (GardenStaff-exclusive) -> ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup: ["A HELD reservation; clock inside slot window."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Aloe Arbor" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-13T10:00:00Z", ends_at: "2026-04-13T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-doc"
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-13T10:30:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: DevelopmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_membership_version_on_reservation_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-membership]
          - errors[ERR_STALE_MEMBERSHIP_VERSION]
          - entities.Membership.fields.version
        distinguishing_aspect: |
          After one guest-pass-spending reservation bumps Membership.version, a second create still
          carrying the pre-bump version (captured before the first create) -> ERR_STALE_MEMBERSHIP_VERSION 412.
        test_recipe:
          setup: ["ACTIVE HOUSEHOLD membership grant 4; slot capacity 10; client captures version before first reservation."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Begonia Bend", guest_pass_grant_household: 4 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, admission_included: true }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Bee", auto_renew: false }
              as: Visitor
              as_user_id: "anon-bee"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-14T10:00:00Z", ends_at: "2026-04-14T12:00:00Z", capacity: 10, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", guest_heads: 1, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", guest_heads: 1, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 412"
            - "response.data.error_id == ERR_STALE_MEMBERSHIP_VERSION"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-membership]
          - entities.Membership.fields.version
        distinguishing_aspect: |
          A reservation create carrying the CURRENT membership version succeeds (201) and increments
          Membership.version by 1; a re-read shows version advanced and guest_passes_remaining reduced.
        test_recipe:
          setup: ["ACTIVE HOUSEHOLD membership grant 4; capture version right before create."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Cosmos Court", guest_pass_grant_household: 4 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000, admission_included: true }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Cleo", auto_renew: false }
              as: Visitor
              as_user_id: "anon-cleo"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-15T10:00:00Z", ends_at: "2026-04-15T12:00:00Z", capacity: 10, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", membership_id: "${m_id}", guest_heads: 2, expected_membership_version: "${m_v1}" }
              as: Visitor
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Reservation.${res_id}.status == HELD"
            - "Membership.${m_id}.guest_passes_remaining == 2"

      - name: cascade_lapse_chain_already_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Membership.ACTIVE_to_LAPSED
        excluded_because:
          difficulty_instance: transitive_cascade / tc_lapse_withdraws_registration_promotes_waitlister_depth3
          rationale: "The lapse -> withdraw -> promote cascade is asserted end-to-end by the named §1.8 instance."

      - name: rate_threshold_household_cap_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Garden.fields.household_member_cap
          - validations[priority=10]
        distinguishing_aspect: "HOUSEHOLD membership with exactly cap (2) household_member_names succeeds (boundary == cap allowed); 3 would fail (covered elsewhere)."
        test_recipe:
          setup: ["Garden household_member_cap 2; HOUSEHOLD plan."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Dianthus Down", household_member_cap: 2 }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "HOUSEHOLD", annual_fee_cents: 9000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Dot", household_member_names: ["a","b"], auto_renew: false }
              as: Visitor
              as_user_id: "anon-dot"
              captures: { m_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Membership.${m_id}.status == PENDING"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_held_count_visible_same_request
        claim_type: immediate
        grounds:
          - entities.TimeSlot.fields.held_count
          - endpoints
        distinguishing_aspect: "Creating a reservation immediately reflects TimeSlot.held_count in a subsequent GET within the same logical step (immediate consistency, no lag)."
        test_recipe:
          setup: ["TimeSlot capacity 5; create one reservation paid_heads 2."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Erica Edge" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-16T10:00:00Z", ends_at: "2026-04-16T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 2 }
              as: Visitor
              as_user_id: "anon-im"
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /v1/time-slots/${s_id}"
              payload: {}
              as: GardenStaff
              captures: { hc: $.data.held_count }
          assert:
            - "TimeSlot.${s_id}.held_count == 2"
            - "TimeSlot.${s_id}.status == OPEN"
