            - "POST /psych-services/protocol-orders/${orderm}/receive with received_quantity 30 is refused with ERR_ORDER_STATE_INVALID (409)"
            - "POST /psych-services/protocol-orders/${orders}/decision with decision APPROVE is refused with ERR_ORDER_STATE_INVALID — the auto-approved order was never in SUBMITTED"
