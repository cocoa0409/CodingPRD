  # =====================================================================
  # RULE 5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_offer_state_check_preempts_market_exposure_check
        grounds:
          - "validations[priority=17]"
          - "validations[priority=41]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_MARKET_EXPOSURE_EXCEEDED]"
          - "state_machines.Offer.SUBMITTED_to_ACCEPTED"
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR: state (priority 17) versus business_fiscal (priority 41). One call
          violates BOTH — the offer is still DRAFT so no ACCEPTED transition exists from it, AND
          accepting it would push the market's committed guarantee from 4000000 to 6000000 against
          a 5000000 limit. The response must be ERR_INVALID_STATE (409), and the SAME call after
          the state defect alone is repaired must then return ERR_MARKET_EXPOSURE_EXCEEDED (402),
          proving the fiscal rule was live all along and merely outranked.
        test_recipe:
          setup:
            - "One Market with guarantee_exposure_limit_cents 5000000."
            - "Show 1 (artist A1) has an ACCEPTED FLAT_GUARANTEE offer of 4000000, so the market sits at committed_guarantee_cents 4000000, exposure_utilization_pct 80.00 and risk_posture WATCH — WATCH does NOT block acceptance, only FROZEN does."
            - "Show 2 (artist A2, same venue, a non-overlapping load-in window 17 days later) has one Offer of 2000000 left in status DRAFT — it was never submitted."
            - "The clock sits at 2026-08-01T00:00:00Z so no offer has expired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Great Basin", region_code: "GBS", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { q_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Neon Arroyo", agency: "Sagebrush Talent", tier: "ARENA", historical_sellthrough_pct: 69.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { q_ar1_id: $.data.id }
