  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_duty_intervals_half_open_adjacency
        grounds:
          - calculations.duty_interval_rules
          - validations[priority=32]
          - errors[ERR_DUTY_INTERVAL_OVERLAP]
        distinguishing_aspect: |
          Resource Driver with HALF-OPEN interval semantics [start, end): a DUTY_ON at
          exactly the previous DUTY_OFF's timestamp is legal adjacency, while a later
          event back-dated inside an already-recorded interval (occurred_at 10:30 <
          last event 11:00) is rejected as ERR_DUTY_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "Driver exists; clock 2026-08-02T12:00:00Z; events recorded: DUTY_ON 06:00, DUTY_OFF 10:00, DUTY_ON 10:00 (adjacent), DUTY_OFF 11:00"
          setup_api_calls:
            - { call: "POST /haul/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers", payload: { name: "Ned", license_no: "CDL-D17" }, as: CarrierAdmin, captures: { dr: $.data.id } }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-02T06:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_OFF", occurred_at: "2026-08-02T10:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-02T10:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_OFF", occurred_at: "2026-08-02T11:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /haul/drivers/${dr}/duty-events", payload: { event_type: "DUTY_ON", occurred_at: "2026-08-02T10:30:00Z" }, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "The adjacent DUTY_ON at exactly 10:00 (equal to prior DUTY_OFF) was accepted — 4 events recorded"
            - "Back-dated DUTY_ON at 10:30 (inside [10:00, 11:00)): err == ERR_DUTY_INTERVAL_OVERLAP (http 409)"
            - "GET /haul/drivers/${dr}/duty-events returns exactly 4 rows"

      - name: trailer_planned_windows_closed_interval_touching_conflicts
        grounds:
          - calculations.trailer_window_overlap
          - validations[priority=34]
          - errors[ERR_TRAILER_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource Trailer with CLOSED interval semantics (distinct semantics from
          the driver's half-open adjacency): load B whose planned window starts at
          exactly the instant load A's window ends (18:00 == 18:00) CONFLICTS —
          touching endpoints admit no turnaround gap — while load C starting one
          minute later (18:01) assigns cleanly.
        test_recipe:
          setup:
            - "Trailer T with compartments c1/c2 (10 head each); drivers D1/D2/D3"
