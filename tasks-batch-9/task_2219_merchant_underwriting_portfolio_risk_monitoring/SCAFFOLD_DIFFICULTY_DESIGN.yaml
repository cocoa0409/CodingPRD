  - rule_id: priority_pair_validation_conflict
    instances:
      - name: funding_hold_state_beats_release_amount_fiscal
        grounds:
          - validations[priority=19]
          - validations[priority=53]
          - errors.ERR_FUNDING_STATE_INVALID
          - errors.ERR_RELEASE_AMOUNT_EXCEEDS_RELEASABLE
        conflicting_priorities: [19, 53]
        expected_error: ERR_FUNDING_STATE_INVALID
        distinguishing_aspect: |
          One request violates a state rule (funding_state HELD blocks reserve release) and a fiscal
          rule (amount_cents 500000 exceeds releasable_balance_cents 50000). The lower priority
          number wins, so the 409 state error is returned and the 422 fiscal error is never seen -
          categories state vs business_fiscal.
        test_recipe:
          setup:
            - "one ACTIVE merchant whose reserve account holds a matured 50000-cent HOLD (effective 2026-04-01, ROLLING lag 90 days)"
