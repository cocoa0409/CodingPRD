scenario: "2346. Insurance Market Conduct Examination (state insurance department market regulation): market analysis using complaint ratios, financial data and consumer trend indicators to select targets, examination scope definition across underwriting, rating, claims and producer practices, data call issuance with file sampling methodology and error tolerance thresholds, on-site or desk examination fieldwork with interview and system walkthrough documentation, criticism issuance, company response and corrective action plan negotiation, penalty determination, restitution calculation and consent order drafting, multistate collaborative examination coordination, report publication and follow-up examination scheduling"
domain_name: "insurance-market-conduct-examination"
api_prefix: "/market-conduct"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "beyond-expert (13 entities / 52 endpoints / 42 error codes / 12 calculations / 8 state machines / 44 validation rules / 5 roles)"
  notes: |
    Density notes. (1) The scaffold is deliberately above the Expert band on endpoint and
    error count because §1.5's FK reverse-reachability rule forces one discovery GET per
    foreign key and the domain has 8 lifecycle entities; every endpoint is either a business
    transition, a mandated reverse-reachability read, or the single `/_clock` test driver.
    (2) The hard part is not the surface size but four tightly-coupled couplings: the sample
    -> scope-area -> examination -> collaboration cascade, the restitution/penalty double
    dual-variant chain whose second stage reads the first stage's output, the two temporal
    occupancy geometries (half-open exam windows on an Insurer vs closed buffered data-call
    windows on an ExamScopeArea), and the two conserved ledgers (cycle examiner slots,
    multistate restitution cents) that a compensating abort must leave undisturbed.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the regulated carrier"
        constraints: "1..120 chars"
      - name: naic_code
        type: string
        source: input
        description: "NAIC company code; unique across all Insurer rows"
        constraints: "exactly 5 digits; uniqueness enforced -> ERR_DUPLICATE_IDENTIFIER"
      - name: license_status
        type: enum
        source: input
        description: "Certificate-of-authority status in the examining state"
        default: LICENSED
        constraints: "LICENSED | SUSPENDED | WITHDRAWN"
      - name: annual_premium_written_cents
        type: integer
        source: input
        description: "Direct written premium for the reference period, in cents"
        constraints: ">= 0"
      - name: policy_count_in_force
        type: integer
        source: input
        description: "Policies in force at period end; denominator of the complaint ratio"
        constraints: ">= 0 (0 is legal and yields UNRATED)"
      - name: confirmed_complaints_12mo
        type: integer
        source: input
        description: "Consumer complaints confirmed against the carrier in the trailing 12 months"
        constraints: ">= 0"
      - name: financial_stress_score
        type: integer
        source: input
        description: "Financial-analysis stress indicator supplied by the financial regulation division"
        constraints: "0..100"
      - name: consumer_trend_score
        type: integer
        source: input
        description: "Consumer-trend indicator (rate-increase velocity, social-media escalation, media volume)"
        constraints: "0..100"
      - name: complaint_ratio_per_1k
        type: number
        source: computed
        description: "Output of calculations.complaint_ratio_per_1k; complaints per 1000 policies in force"
        constraints: "2 decimal places"
      - name: risk_tier
        type: enum
        source: computed
        description: "Output of calculations.complaint_ratio_per_1k tier map"
        constraints: "UNRATED | LOW | MODERATE | ELEVATED | HIGH"
      - name: open_exam_count
        type: integer
        source: computed
        description: "Count of Examination rows with this insurer_id and status NOT IN {PUBLISHED, ABORTED}"
      - name: pending_enforcement_exam_count
        type: integer
        source: computed
        description: "Count of Examination rows with this insurer_id and status IN {NEGOTIATION, ORDER_PENDING}"
      - name: lifetime_restitution_ordered_cents
        type: integer
        source: computed
        description: "Sum of ConsentOrder.restitution_cents over EXECUTED orders on this insurer's examinations"

  - name: MarketAnalysisCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Analysis cycle label, unique across cycles"
        constraints: "1..40 chars; uniqueness enforced -> ERR_DUPLICATE_IDENTIFIER"
      - name: reference_period_start
        type: string
        source: input
        description: "First day of the data reference period (YYYY-MM-DD)"
      - name: reference_period_end
        type: string
        source: input
        description: "Last day of the data reference period (YYYY-MM-DD); must be > reference_period_start"
      - name: target_slot_capacity
        type: integer
        source: input
        description: "Number of examiner slots the division can staff from this cycle"
        constraints: ">= 1"
      - name: default_fieldwork_start
        type: string
        source: input
        description: "fieldwork_start_date stamped on every Examination this cycle creates (YYYY-MM-DD)"
      - name: default_fieldwork_end
        type: string
        source: input
        description: "fieldwork_end_date stamped on every Examination this cycle creates (YYYY-MM-DD); must be > default_fieldwork_start"
      - name: default_exam_mode
        type: enum
        source: input
        description: "mode stamped on every Examination this cycle creates"
        default: ON_SITE
        constraints: "ON_SITE | DESK"
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state"
        default: DRAFT
        constraints: "DRAFT | SCORED | TARGETS_SELECTED | CLOSED"
      - name: scored_at
        type: datetime
        source: system
        description: "Logical-clock instant at which scoring ran"
      - name: scored_insurer_count
        type: integer
        source: computed
        description: "Count of AnalysisScore rows created by the scoring run"
        default: 0
      - name: selected_target_count
        type: integer
        source: computed
        description: "Count of AnalysisScore rows with selected == true after target selection"
        default: 0
      - name: slots_committed
        type: integer
        source: computed
        description: "Count of Examination rows with this cycle_id and status NOT IN {PUBLISHED, ABORTED}"
        default: 0
      - name: slots_available
        type: integer
        source: computed
        description: "target_slot_capacity - slots_committed; conserved-quantity partner of slots_committed"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the cycle auto-closed"

  - name: AnalysisScore
    parent: MarketAnalysisCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> MarketAnalysisCycle.id; the scoring run that produced this row"
      - name: insurer_id
        type: string
        source: system
        description: "FK -> Insurer.id; the scored carrier"
      - name: complaint_ratio_at_scoring
        type: number
        source: computed
        description: "Insurer.complaint_ratio_per_1k snapshotted at scoring time"
      - name: complaint_component
        type: number
        source: computed
        description: "Tiered complaint sub-score from calculations.composite_analysis_score"
      - name: financial_component
        type: number
        source: computed
        description: "Financial sub-score from calculations.composite_analysis_score"
      - name: trend_component
        type: number
        source: computed
        description: "Consumer-trend sub-score from calculations.composite_analysis_score"
      - name: volume_multiplier
        type: number
        source: computed
        description: "Premium-volume multiplier applied to the component sum"
      - name: composite_score
        type: number
        source: computed
        description: "Output of calculations.composite_analysis_score; 2 decimal places, capped at 100.00"
      - name: rank_position
        type: integer
        source: computed
        description: "1-based rank within the cycle under the selection ranking expression"
      - name: selected
        type: boolean
        source: computed
        description: "True when target selection turned this score into an Examination"
        default: false
      - name: selection_reason
        type: enum
        source: computed
        description: "Why the row was or was not selected"
        constraints: "SELECTED | BELOW_THRESHOLD | CAPACITY_EXHAUSTED | WINDOW_CONFLICT_DEFERRED | LICENSE_INELIGIBLE"

  - name: Examination
    parent: null
    common_fields: true
    fields:
      - name: insurer_id
        type: string
        source: input
        description: "FK -> Insurer.id; the examined carrier"
      - name: cycle_id
        type: string
        source: system
        description: "FK -> MarketAnalysisCycle.id; null for for-cause examinations created directly"
      - name: predecessor_exam_id
        type: string
        source: system
        description: "FK -> Examination.id; set on a follow-up examination created by report publication"
      - name: exam_type
        type: enum
        source: input
        description: "Statutory character of the examination"
        constraints: "MARKET_CONDUCT_EXAM | TARGETED_EXAM"
      - name: mode
        type: enum
        source: input
        description: "Fieldwork mode; drives statutory minimum sample size and interview documentation requirements"
        constraints: "ON_SITE | DESK"
      - name: lead_state_code
        type: string
        source: input
        description: "Two-letter code of the state leading the examination"
        constraints: "exactly 2 uppercase letters"
      - name: fieldwork_start_date
        type: string
        source: input
        description: "Inclusive first day of the fieldwork occupancy window (YYYY-MM-DD)"
      - name: fieldwork_end_date
        type: string
        source: input
        description: "Exclusive last day of the fieldwork occupancy window (YYYY-MM-DD); must be > fieldwork_start_date"
      - name: status
        type: enum
        source: system
        description: "Examination lifecycle state"
        default: SCOPING
        constraints: "SCOPING | DATA_CALL | FIELDWORK | CRITICISM | NEGOTIATION | ORDER_PENDING | PUBLISHED | ABORTED"
      - name: scope_locked
        type: boolean
        source: computed
        description: "True once the supervising examiner locks scope; scope areas become immutable"
        default: false
      - name: scope_area_count
        type: integer
        source: computed
        description: "Count of ExamScopeArea rows for this examination"
        default: 0
      - name: rejected_data_call_count
        type: integer
        source: computed
        description: "Count of DataCall rows for this examination with status == REJECTED"
        default: 0
      - name: open_criticism_count
        type: integer
        source: computed
        description: "Count of Criticism rows for this examination with status IN {ISSUED, RESPONDED}"
        default: 0
      - name: sustained_criticism_count
        type: integer
        source: computed
        description: "Count of Criticism rows for this examination with status == SUSTAINED"
        default: 0
      - name: pending_restitution_cents
        type: integer
        source: computed
        description: "Sum of Criticism.restitution_exposure_cents over rows with status IN {ISSUED, RESPONDED}"
        default: 0
      - name: aggregate_restitution_cents
        type: integer
        source: computed
        description: "Sum of Criticism.restitution_exposure_cents over rows with status == SUSTAINED"
        default: 0
      - name: penalty_units_total
        type: integer
        source: computed
        description: "Sum of Criticism.penalty_units over rows with status == SUSTAINED"
        default: 0
      - name: criticism_phase_opened_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the examination entered CRITICISM"
      - name: report_published_at
        type: datetime
        source: system
        description: "Logical-clock instant of report publication"
      - name: public_summary
        type: string
        source: input
        description: "Published report summary text supplied at publication"
      - name: followup_required
        type: boolean
        source: computed
        description: "True when sustained_criticism_count >= 1 at publication"
        default: false
      - name: followup_due_date
        type: string
        source: computed
        description: "Output of calculations.followup_schedule (YYYY-MM-DD); null when followup_required is false"
      - name: abort_reason
        type: string
        source: input
        description: "Free-text justification recorded when the examination is aborted"

  - name: ExamScopeArea
    parent: Examination
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Examination.id; owning examination"
      - name: area
        type: enum
        source: input
        description: "Statutory examination area; at most one row per (exam_id, area)"
        constraints: "UNDERWRITING | RATING | CLAIMS | PRODUCER"
      - name: population_size
        type: integer
        source: input
        description: "Number of files in the area population for the reference period"
        constraints: ">= 1"
      - name: sample_size
        type: integer
        source: input
        description: "Number of files to be pulled by the systematic-interval sampling plan"
        constraints: ">= statutory minimum for Examination.mode and <= population_size"
      - name: error_tolerance_pct
        type: number
        source: input
        description: "Error tolerance threshold for this area; breach is >= (not >)"
        default: "per-area statutory default from calculations.error_rate_and_tolerance constants"
        constraints: "0.00..100.00, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "Scope-area testing state"
        default: PLANNED
        constraints: "PLANNED | FIELDWORK | TESTED | CLOSED"
      - name: reviewed_sample_count
        type: integer
        source: computed
        description: "Count of FileSample rows in this area with review_status != UNREVIEWED"
        default: 0
      - name: error_count
        type: integer
        source: computed
        description: "Count of FileSample rows in this area with review_status == ERROR"
        default: 0
      - name: material_error_count
        type: integer
        source: computed
        description: "Count of FileSample rows in this area with error_severity == MATERIAL"
        default: 0
      - name: error_rate_pct
        type: number
        source: computed
        description: "Output of calculations.error_rate_and_tolerance"
        default: 0.00
      - name: material_error_rate_pct
        type: number
        source: computed
        description: "Material-only error rate from calculations.error_rate_and_tolerance"
        default: 0.00
      - name: tolerance_breached
        type: boolean
        source: computed
        description: "error_rate_pct >= error_tolerance_pct evaluated when the area reaches TESTED"
        default: false
      - name: escalation_required
        type: boolean
        source: computed
        description: "material_error_rate_pct >= MATERIAL_ESCALATION_PCT; an escalation signal reported to the supervising examiner, evaluated independently of tolerance_breached"
        default: false
      - name: tested_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the last sample review closed testing"

  - name: DataCall
    parent: ExamScopeArea
    common_fields: true
    fields:
      - name: scope_area_id
        type: string
        source: system
        description: "FK -> ExamScopeArea.id; the area this data call serves"
      - name: records_requested
        type: integer
        source: input
        description: "Number of records the carrier is directed to produce"
        constraints: ">= 1"
      - name: issued_date
        type: string
        source: system
        description: "Logical-clock date at issuance (YYYY-MM-DD); left edge of the occupancy interval"
      - name: response_due_date
        type: string
        source: input
        description: "Right edge of the occupancy interval (YYYY-MM-DD, inclusive)"
      - name: sampling_method
        type: enum
        source: input
        description: "Sampling methodology applied when the response is accepted"
        default: SYSTEMATIC_INTERVAL
        constraints: "SYSTEMATIC_INTERVAL"
      - name: status
        type: enum
        source: system
        description: "Data call lifecycle state"
        default: ISSUED
        constraints: "ISSUED | OVERDUE | RESPONDED | ACCEPTED | REJECTED | CANCELLED"
      - name: records_received
        type: integer
        source: input
        description: "Records actually produced by the carrier"
        default: 0
      - name: submitted_by_contact
        type: string
        source: input
        description: "Carrier compliance contact recorded on the response"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the carrier response"
      - name: is_late
        type: boolean
        source: computed
        description: "True when the response date is after response_due_date"
        default: false
      - name: days_late
        type: integer
        source: computed
        description: "max(0, response date - response_due_date) in whole days"
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: "Output of calculations.data_call_completeness (raw production ratio)"
        default: 0.00
      - name: effective_completeness_pct
        type: number
        source: computed
        description: "completeness_pct after the lateness penalty; acceptance threshold is applied to this field"
        default: 0.00
      - name: disposition_reason
        type: string
        source: input
        description: "Examiner note recorded with the acceptance or rejection"
      - name: sample_draw_interval
        type: integer
        source: computed
        description: "Output of calculations.sample_draw_plan; floor(population_size / sample_size)"
        default: 0
      - name: samples_drawn_count
        type: integer
        source: computed
        description: "Count of FileSample rows created by the acceptance cascade"
        default: 0

  - name: FileSample
    parent: DataCall
    common_fields: true
    fields:
      - name: data_call_id
        type: string
        source: system
        description: "FK -> DataCall.id; the accepted data call this sample was drawn from"
      - name: file_reference
        type: string
        source: system
        description: "Deterministic sample label from calculations.sample_draw_plan, e.g. CLM-000401"
      - name: population_index
        type: integer
        source: system
        description: "1-based index of the record inside the area population"
      - name: review_status
        type: enum
        source: system
        description: "Workpaper review state of this sampled file"
        default: UNREVIEWED
        constraints: "UNREVIEWED | COMPLIANT | ERROR"
      - name: error_severity
        type: enum
        source: input
        description: "Severity recorded by the examiner at review"
        default: NONE
        constraints: "NONE | MINOR | MATERIAL"
      - name: underpaid_amount_cents
        type: integer
        source: input
        description: "Consumer harm quantified on this file, in cents; the restitution base"
        default: 0
        constraints: ">= 0; must be 0 when error_severity == NONE"
      - name: days_to_pay
        type: integer
        source: input
        description: "Days the carrier took to settle the file; documentation only"
        default: 0
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the review"

  - name: FieldworkActivity
    parent: Examination
    common_fields: false
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Examination.id; the examination this workpaper belongs to"
      - name: activity_type
        type: enum
        source: input
        description: "Kind of fieldwork evidence"
        constraints: "INTERVIEW | SYSTEM_WALKTHROUGH"
      - name: area
        type: enum
        source: input
        description: "Scope area the activity covers; matched against ExamScopeArea.area by value, not by FK"
        constraints: "UNDERWRITING | RATING | CLAIMS | PRODUCER"
      - name: participant_name
        type: string
        source: input
        description: "Carrier staff member interviewed or walked through the system"
      - name: participant_title
        type: string
        source: input
        description: "Title of the participant"
      - name: summary
        type: string
        source: input
        description: "Narrative workpaper text"
      - name: evidence_ref
        type: string
        source: input
        description: "Workpaper exhibit reference; absence leaves the activity undocumented"
      - name: conducted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the activity was recorded"
      - name: documented
        type: boolean
        source: computed
        description: "True when len(summary) >= 20 AND evidence_ref is present and non-empty"

  - name: Criticism
    parent: Examination
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: input
        description: "FK -> Examination.id; the examination issuing the criticism"
      - name: scope_area_id
        type: string
        source: input
        description: "FK -> ExamScopeArea.id; must belong to exam_id"
      - name: statute_citation
        type: string
        source: input
        description: "Statute or regulation cited"
      - name: severity
        type: enum
        source: input
        description: "Criticism severity; drives restitution method and follow-up interval"
        constraints: "MINOR | MATERIAL | EGREGIOUS"
      - name: affected_file_count
        type: integer
        source: input
        description: "Number of sampled files the criticism covers"
        constraints: ">= 1 and <= ExamScopeArea.error_count"
      - name: status
        type: enum
        source: system
        description: "Criticism lifecycle state; ISSUED <-> RESPONDED is a rebuttal cycle"
        default: ISSUED
        constraints: "ISSUED | RESPONDED | SUSTAINED | WITHDRAWN"
      - name: response_round
        type: integer
        source: computed
        description: "Number of company response rounds consumed; capped by MAX_RESPONSE_ROUNDS"
        default: 0
      - name: rebuttal_count
        type: integer
        source: computed
        description: "Number of examiner rebuttals issued on this criticism"
        default: 0
      - name: restitution_method
        type: enum
        source: computed
        description: "Variant of calculations.restitution_exposure selected at issuance"
        constraints: "SAMPLE_ACTUAL | POPULATION_EXTRAPOLATED"
      - name: restitution_exposure_cents
        type: integer
        source: computed
        description: "Output of calculations.restitution_exposure, frozen at issuance"
      - name: penalty_units
        type: integer
        source: input
        description: "Statutory violation units assessed when the criticism is sustained"
        default: 0
        constraints: ">= 0"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the examiner who issued the criticism; segregation-of-duties key"
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervising examiner who sustained or withdrew the criticism"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of finalization"
      - name: disposition_note
        type: string
        source: input
        description: "Supervisor note recorded at finalization"

  - name: CompanyResponse
    parent: Criticism
    common_fields: false
    fields:
      - name: criticism_id
        type: string
        source: system
        description: "FK -> Criticism.id; the criticism being answered"
      - name: round_number
        type: integer
        source: computed
        description: "1-based response round; equals Criticism.response_round after this row is written"
      - name: position
        type: enum
        source: input
        description: "Carrier position on the criticism"
        constraints: "CONCUR | PARTIAL_CONCUR | DISPUTE"
      - name: narrative
        type: string
        source: input
        description: "Carrier response text"
      - name: remediation_offer_cents
        type: integer
        source: input
        description: "Restitution the carrier offers to pay voluntarily, in cents"
        default: 0
        constraints: ">= 0"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission"

  - name: CorrectiveActionPlan
    parent: Examination
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Examination.id; the examination being remediated"
      - name: status
        type: enum
        source: system
        description: "Plan negotiation state"
        default: PROPOSED
        constraints: "PROPOSED | REVISION_REQUESTED | APPROVED | REJECTED | SUPERSEDED"
      - name: revision_round
        type: integer
        source: computed
        description: "1 for the first plan on an examination, incremented for each superseding plan"
        default: 1
      - name: milestone_count
        type: integer
        source: input
        description: "Number of remediation milestones the plan commits to"
        constraints: ">= 1"
      - name: completion_due_date
        type: string
        source: input
        description: "Date the carrier commits to completing all milestones (YYYY-MM-DD)"
      - name: narrative
        type: string
        source: input
        description: "Plan text"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervising examiner who dispositioned the plan"
      - name: review_note
        type: string
        source: input
        description: "Reviewer note recorded with the decision"

  - name: ConsentOrder
    parent: Examination
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Examination.id; the examination being settled"
      - name: order_number
        type: string
        source: input
        description: "Department order number; unique across all ConsentOrder rows"
        constraints: "uniqueness enforced -> ERR_DUPLICATE_IDENTIFIER"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state"
        default: DRAFT
        constraints: "DRAFT | EXECUTED | VOIDED"
      - name: penalty_variant
        type: enum
        source: input
        description: "Which penalty algorithm the department elects for this order"
        constraints: "PER_VIOLATION | TIERED_AGGREGATE"
      - name: restitution_cents
        type: integer
        source: computed
        description: "Examination.aggregate_restitution_cents frozen at drafting"
      - name: penalty_gross_cents
        type: integer
        source: computed
        description: "Output of calculations.penalty_determination for the elected variant, before credit"
      - name: cooperation_credit_pct
        type: number
        source: computed
        description: "Credit rate selected from the order subtotal tier"
      - name: penalty_net_cents
        type: integer
        source: computed
        description: "penalty_gross_cents after the cooperation credit, round_half_up to whole cents"
      - name: order_total_cents
        type: integer
        source: computed
        description: "restitution_cents + penalty_net_cents"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the supervising examiner who drafted the order; segregation-of-duties key"
      - name: signed_by
        type: string
        source: input
        description: "Carrier officer who executed the order"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution"

  - name: MultistateCollaboration
    parent: Examination
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: system
        description: "FK -> Examination.id; the examination being run collaboratively"
      - name: call_reference
        type: string
        source: input
        description: "NAIC collaborative-action call reference"
      - name: participating_states
        type: array
        source: input
        description: "Participant records; each object is { state_code, policy_count_in_state, has_examiner_resources, allocated_cents }. allocated_cents is server-maintained and starts at 0."
        constraints: "1..12 objects; state_code exactly 2 uppercase letters and unique in the array; policy_count_in_state >= 1"
      - name: lead_state_code
        type: string
        source: computed
        description: "Output of the lead-state selector; one of participating_states[].state_code"
      - name: status
        type: enum
        source: system
        description: "Collaboration lifecycle state"
        default: LEAD_ASSIGNED
        constraints: "LEAD_ASSIGNED | ACTIVE | SETTLED | DISSOLVED"
      - name: participant_count
        type: integer
        source: computed
        description: "Length of participating_states"
      - name: allocated_total_cents
        type: integer
        source: computed
        description: "Sum of participating_states[].allocated_cents; conserved against Examination.aggregate_restitution_cents"
        default: 0
      - name: allocation_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which restitution allocation ran"

state_machines:
  - entity: MarketAnalysisCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /market-conduct/analysis-cycles/{id}/score"
        actor: MarketAnalyst
        preconditions:
          - "cycle.status == DRAFT"
          - "at least one Insurer exists with license_status IN {LICENSED, SUSPENDED}"
        side_effects:
          - "creates one AnalysisScore per Insurer with license_status IN {LICENSED, SUSPENDED}, each carrying the outputs of calculations.composite_analysis_score"
          - "sets AnalysisScore.rank_position by composite_score DESC, then complaint_ratio_at_scoring DESC, then AnalysisScore.created_at ASC"
          - "sets cycle.scored_insurer_count, cycle.scored_at, increments cycle.version by 1"
      - from: SCORED
        to: TARGETS_SELECTED
        trigger: "POST /market-conduct/analysis-cycles/{id}/select-targets"
        actor: MarketAnalyst
        preconditions:
          - "cycle.status == SCORED"
          - "cycle.slots_available >= 1 (else ERR_CYCLE_SLOTS_EXHAUSTED)"
        side_effects:
          - "sets AnalysisScore.selection_reason on EVERY score row of the cycle per the selector in calculations.target_selection"
          - "for each selected score, creates an Examination { insurer_id, cycle_id, exam_type: MARKET_CONDUCT_EXAM, mode: cycle.default_exam_mode, lead_state_code: DEPARTMENT_STATE_CODE, fieldwork window from cycle defaults, status: SCOPING }"
          - "each created Examination raises Insurer.open_exam_count by 1 and raises cycle.slots_committed by 1 (lowering cycle.slots_available by 1)"
          - "sets cycle.selected_target_count, increments cycle.version by 1"
        note: "Empty eligible pool is NOT an error: the cycle still advances with selected_target_count == 0."
      - from: TARGETS_SELECTED
        to: CLOSED
        trigger: "system: last Examination of the cycle reaches PUBLISHED or ABORTED"
        actor: system
        preconditions:
          - "cycle.selected_target_count >= 1"
          - "every Examination with this cycle_id has status IN {PUBLISHED, ABORTED} (i.e. cycle.slots_committed == 0)"
        side_effects:
          - "sets cycle.closed_at, increments cycle.version by 1"

  - entity: Examination
    initial_state: SCOPING
    terminal_states: [PUBLISHED, ABORTED]
    transitions:
      - from: SCOPING
        to: DATA_CALL
        trigger: "POST /market-conduct/examinations/{id}/lock-scope"
        actor: SupervisingExaminer
        preconditions:
          - "exam.status == SCOPING (else ERR_EXAM_NOT_IN_SCOPING)"
          - "exam.scope_area_count >= 1 (else ERR_INVALID_REQUEST)"
          - "Insurer.license_status IN {LICENSED, SUSPENDED} (else ERR_INSURER_NOT_EXAMINABLE)"
        side_effects:
          - "sets exam.scope_locked = true; further POST /examinations/{id}/scope-areas is rejected with ERR_EXAM_NOT_IN_SCOPING"
          - "increments exam.version by 1"
      - from: DATA_CALL
        to: FIELDWORK
        trigger: "system: first DataCall of this examination reaches ACCEPTED"
        actor: system
        preconditions:
          - "exam.status == DATA_CALL"
        side_effects:
          - "increments exam.version by 1"
      - from: FIELDWORK
        to: CRITICISM
        trigger: "system: last ExamScopeArea of this examination reaches TESTED (bubble-up)"
        actor: system
        preconditions:
          - "exam.status == FIELDWORK"
          - "every ExamScopeArea with this exam_id has status == TESTED"
        side_effects:
          - "sets exam.criticism_phase_opened_at = logical clock; increments exam.version by 1"
          - "cascade hop 3: every MultistateCollaboration with this exam_id and status == LEAD_ASSIGNED advances to ACTIVE"
      - from: CRITICISM
        to: NEGOTIATION
        trigger: "system: last Criticism of this examination reaches a terminal state with at least one SUSTAINED"
        actor: system
        preconditions:
          - "exam.status == CRITICISM"
          - "exam.open_criticism_count == 0 AND exam.sustained_criticism_count >= 1"
        side_effects:
          - "increments exam.version by 1"
          - "cascade hop 3: raises Insurer.pending_enforcement_exam_count by 1"
      - from: CRITICISM
        to: PUBLISHED
        trigger: "POST /market-conduct/examinations/{id}/publish-report"
        actor: SupervisingExaminer
        preconditions:
          - "exam.status == CRITICISM"
          - "exam.open_criticism_count == 0 AND exam.sustained_criticism_count == 0"
        side_effects:
          - "sets exam.report_published_at, exam.public_summary, exam.followup_required = false, exam.followup_due_date = null"
          - "every ExamScopeArea with status == TESTED moves to CLOSED"
          - "cycle bubble-up: if exam.cycle_id is not null, lowers cycle.slots_committed by 1 and may close the cycle"
          - "increments exam.version by 1"
        note: "No-criticism branch: divergent side-effect set from the ORDER_PENDING branch below - no follow-up examination is created and no ConsentOrder is required."
      - from: NEGOTIATION
        to: ORDER_PENDING
        trigger: "system: a CorrectiveActionPlan of this examination reaches APPROVED"
        actor: system
        preconditions:
          - "exam.status == NEGOTIATION"
        side_effects:
          - "increments exam.version by 1"
      - from: ORDER_PENDING
        to: PUBLISHED
        trigger: "POST /market-conduct/examinations/{id}/publish-report"
        actor: SupervisingExaminer
        preconditions:
          - "exam.status == ORDER_PENDING (else ERR_EXAM_NOT_READY_FOR_PUBLICATION)"
          - "a ConsentOrder with this exam_id has status == EXECUTED (else ERR_ORDER_NOT_EXECUTED)"
          - "X-User-ID != that ConsentOrder.drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets exam.report_published_at, exam.public_summary, exam.followup_required = true, exam.followup_due_date = calculations.followup_schedule output"
          - "every ExamScopeArea with status == TESTED moves to CLOSED"
          - "creates a follow-up Examination { insurer_id, predecessor_exam_id: this exam.id, cycle_id: null, exam_type: TARGETED_EXAM, mode: DESK, lead_state_code copied, fieldwork_start_date = followup_due_date, fieldwork_end_date = followup_due_date + FOLLOWUP_WINDOW_DAYS, status: SCOPING }"
          - "the created follow-up examination raises Insurer.open_exam_count by 1"
          - "lowers Insurer.pending_enforcement_exam_count by 1"
          - "cycle bubble-up: if exam.cycle_id is not null, lowers cycle.slots_committed by 1 and may close the cycle"
          - "increments exam.version by 1"
      - from: "SCOPING | DATA_CALL | FIELDWORK | CRITICISM | NEGOTIATION | ORDER_PENDING"
        to: ABORTED
        trigger: "POST /market-conduct/examinations/{id}/abort"
        actor: SupervisingExaminer
        preconditions:
          - "exam.status NOT IN {PUBLISHED, ABORTED} (else ERR_EXAM_ALREADY_TERMINAL)"
        side_effects:
          - "cascade hop 1: sets exam.abort_reason and status ABORTED"
          - "cascade hop 2: every DataCall of this examination with status IN {ISSUED, OVERDUE, RESPONDED} moves to CANCELLED; every ExamScopeArea with status IN {PLANNED, FIELDWORK, TESTED} moves to CLOSED; every Criticism with status IN {ISSUED, RESPONDED} moves to WITHDRAWN; every CorrectiveActionPlan with status IN {PROPOSED, REVISION_REQUESTED} moves to REJECTED; every ConsentOrder with status == DRAFT moves to VOIDED; every MultistateCollaboration with status IN {LEAD_ASSIGNED, ACTIVE} moves to DISSOLVED"
          - "cascade hop 3: each Criticism withdrawal in hop 2 lowers exam.open_criticism_count by 1 and lowers exam.pending_restitution_cents by that criticism's restitution_exposure_cents, driving both to 0"
          - "cascade hop 3: because the examination became terminal, Insurer.open_exam_count is lowered by 1, Insurer.pending_enforcement_exam_count is lowered by 1 when the pre-abort status was NEGOTIATION or ORDER_PENDING, and if exam.cycle_id is not null cycle.slots_committed is lowered by 1 (restoring cycle.slots_available)"
          - "cascade hop 4: if that release leaves cycle.slots_committed == 0 and cycle.selected_target_count >= 1, the cycle advances TARGETS_SELECTED -> CLOSED"
          - "increments exam.version by 1"

  - entity: ExamScopeArea
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: FIELDWORK
        trigger: "system: the area's DataCall reaches ACCEPTED"
        actor: system
        preconditions:
          - "area.status == PLANNED"
        side_effects:
          - "creates sample_size FileSample rows per calculations.sample_draw_plan, all UNREVIEWED"
          - "increments area.version by 1"
      - from: FIELDWORK
        to: PLANNED
        trigger: "system: any DataCall of this area reaches REJECTED while the area has no reviewed sample"
        actor: system
        preconditions:
          - "area.status == FIELDWORK"
          - "area.reviewed_sample_count == 0 (a rejection after any sample has been reviewed leaves the area in FIELDWORK and only raises Examination.rejected_data_call_count)"
        side_effects:
          - "deletes every FileSample of this area - all of them are UNREVIEWED by the precondition - and resets area.reviewed_sample_count, error_count, material_error_count, error_rate_pct and material_error_rate_pct to 0 and tolerance_breached and escalation_required to false"
          - "sets samples_drawn_count = 0 on every ACCEPTED DataCall of this area whose samples were just deleted"
          - "raises Examination.rejected_data_call_count by 1"
          - "increments area.version by 1"
        note: "Cycle edge PLANNED -> FIELDWORK -> PLANNED. Rejecting an inadequate supplemental production voids the area's whole sample so a replacement data call can re-draw it (subject to the DATA_CALL_BUFFER_DAYS gap rule). The Examination does NOT roll back out of FIELDWORK."
      - from: FIELDWORK
        to: TESTED
        trigger: "system: the last UNREVIEWED FileSample of the area is reviewed (single or bulk review)"
        actor: system
        preconditions:
          - "area.status == FIELDWORK"
          - "no FileSample of this area has review_status == UNREVIEWED"
        side_effects:
          - "cascade hop 2: recomputes area.error_count, area.material_error_count, area.error_rate_pct, area.material_error_rate_pct, area.tolerance_breached, area.escalation_required per calculations.error_rate_and_tolerance; sets area.tested_at; increments area.version by 1"
          - "cascade hop 3: when every ExamScopeArea of the examination is TESTED, the Examination advances FIELDWORK -> CRITICISM"
      - from: "PLANNED | FIELDWORK | TESTED"
        to: CLOSED
        trigger: "system: owning Examination reaches PUBLISHED or ABORTED"
        actor: system
        preconditions:
          - "area.status != CLOSED"
        side_effects:
          - "increments area.version by 1"

  - entity: DataCall
    initial_state: ISSUED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    transitions:
      - from: ISSUED
        to: OVERDUE
        trigger: "system: POST /market-conduct/_clock/set_current_utc sweep moves the logical clock past response_due_date"
        actor: system
        preconditions:
          - "call.status == ISSUED"
          - "new logical clock date > call.response_due_date"
        side_effects:
          - "increments call.version by 1"
      - from: "ISSUED | OVERDUE"
        to: RESPONDED
        trigger: "POST /market-conduct/data-calls/{id}/respond"
        actor: InsurerRespondent
        preconditions:
          - "call.status IN {ISSUED, OVERDUE} (else ERR_DATA_CALL_NOT_AWAITING_RESPONSE)"
          - "Examination.status IN {DATA_CALL, FIELDWORK}"
          - "X-User-ID == Examination.insurer_id (else ERR_NOT_EXAM_SUBJECT)"
          - "records_received <= records_requested (else ERR_RECORDS_EXCEED_REQUEST)"
        side_effects:
          - "sets responded_at, is_late, days_late and the two completeness fields per calculations.data_call_completeness"
          - "increments call.version by 1"
      - from: RESPONDED
        to: ACCEPTED
        trigger: "POST /market-conduct/data-calls/{id}/disposition with disposition == ACCEPTED"
        actor: ExaminerInCharge
        preconditions:
          - "call.status == RESPONDED (else ERR_DATA_CALL_NOT_RESPONDED)"
          - "call.effective_completeness_pct >= ACCEPTANCE_COMPLETENESS_PCT (else ERR_RESPONSE_INCOMPLETE)"
        side_effects:
          - "cascade hop 1: sets call.sample_draw_interval and call.samples_drawn_count per calculations.sample_draw_plan"
          - "cascade hop 2: the owning ExamScopeArea advances PLANNED -> FIELDWORK, materialising sample_size FileSample rows"
          - "cascade hop 3: when this is the first ACCEPTED DataCall of the examination, the Examination advances DATA_CALL -> FIELDWORK"
          - "increments call.version by 1"
        note: "ACCEPTED branch side-effect set is disjoint from the REJECTED branch below."
      - from: RESPONDED
        to: REJECTED
        trigger: "POST /market-conduct/data-calls/{id}/disposition with disposition == REJECTED"
        actor: ExaminerInCharge
        preconditions:
          - "call.status == RESPONDED (else ERR_DATA_CALL_NOT_RESPONDED)"
        side_effects:
          - "no FileSample rows are drawn"
          - "cascade hop 2: when the owning ExamScopeArea is in FIELDWORK and its reviewed_sample_count == 0, the area returns FIELDWORK -> PLANNED and its whole sample is deleted; when the area is still PLANNED nothing further happens; when at least one sample has been reviewed the area stays in FIELDWORK. Examination.rejected_data_call_count is raised by 1 in every case"
          - "the examination does NOT advance to FIELDWORK on this branch"
          - "increments call.version by 1"
      - from: "ISSUED | OVERDUE | RESPONDED"
        to: CANCELLED
        trigger: "system: owning Examination reaches ABORTED"
        actor: system
        preconditions:
          - "call.status NOT IN {ACCEPTED, REJECTED, CANCELLED}"
        side_effects:
          - "increments call.version by 1"

  - entity: Criticism
    initial_state: ISSUED
    terminal_states: [SUSTAINED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: RESPONDED
        trigger: "POST /market-conduct/criticisms/{id}/responses"
        actor: InsurerRespondent
        preconditions:
          - "criticism.status == ISSUED (else ERR_CRITICISM_STATE_INVALID)"
          - "X-User-ID == Examination.insurer_id (else ERR_NOT_EXAM_SUBJECT)"
          - "criticism.response_round < MAX_RESPONSE_ROUNDS (else ERR_REBUTTAL_ROUNDS_EXHAUSTED)"
        side_effects:
          - "creates a CompanyResponse with round_number = criticism.response_round + 1"
          - "raises criticism.response_round by 1; increments criticism.version by 1"
      - from: RESPONDED
        to: ISSUED
        trigger: "POST /market-conduct/criticisms/{id}/rebut"
        actor: ExaminerInCharge
        preconditions:
          - "criticism.status == RESPONDED (else ERR_CRITICISM_STATE_INVALID)"
          - "criticism.response_round < MAX_RESPONSE_ROUNDS (else ERR_REBUTTAL_ROUNDS_EXHAUSTED)"
        side_effects:
          - "raises criticism.rebuttal_count by 1; increments criticism.version by 1"
          - "criticism.restitution_exposure_cents is NOT recomputed - the exposure frozen at issuance survives the cycle"
        note: "Cycle edge ISSUED -> RESPONDED -> ISSUED, bounded by MAX_RESPONSE_ROUNDS = 3 rounds."
      - from: RESPONDED
        to: SUSTAINED
        trigger: "POST /market-conduct/criticisms/{id}/finalize with disposition == SUSTAINED"
        actor: SupervisingExaminer
        preconditions:
          - "criticism.status == RESPONDED (else ERR_CRITICISM_STATE_INVALID)"
          - "X-User-ID != criticism.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "cascade hop 1: sets finalized_by_user_id, finalized_at, penalty_units, disposition_note; increments criticism.version by 1"
          - "cascade hop 2: lowers Examination.open_criticism_count by 1 and Examination.pending_restitution_cents by restitution_exposure_cents; raises Examination.sustained_criticism_count by 1, Examination.aggregate_restitution_cents by restitution_exposure_cents and Examination.penalty_units_total by penalty_units; increments exam.version by 1"
          - "cascade hop 3: if that leaves exam.open_criticism_count == 0 with sustained_criticism_count >= 1, the Examination advances CRITICISM -> NEGOTIATION, which itself raises Insurer.pending_enforcement_exam_count by 1"
      - from: RESPONDED
        to: WITHDRAWN
        trigger: "POST /market-conduct/criticisms/{id}/finalize with disposition == WITHDRAWN"
        actor: SupervisingExaminer
        preconditions:
          - "criticism.status == RESPONDED (else ERR_CRITICISM_STATE_INVALID)"
          - "X-User-ID != criticism.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "compensating branch: lowers Examination.open_criticism_count by 1 and lowers Examination.pending_restitution_cents by restitution_exposure_cents; leaves sustained_criticism_count, aggregate_restitution_cents and penalty_units_total untouched"
          - "increments criticism.version and exam.version by 1"
        note: "Divergent side-effect set versus the SUSTAINED branch: no fiscal accrual, and the examination can only leave CRITICISM through publish-report."
      - from: "ISSUED | RESPONDED"
        to: WITHDRAWN
        trigger: "system: owning Examination reaches ABORTED"
        actor: system
        preconditions:
          - "criticism.status IN {ISSUED, RESPONDED}"
        side_effects:
          - "lowers Examination.open_criticism_count by 1 and Examination.pending_restitution_cents by restitution_exposure_cents"
          - "increments criticism.version by 1"

  - entity: CorrectiveActionPlan
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: REVISION_REQUESTED
        trigger: "POST /market-conduct/corrective-action-plans/{id}/review with decision == REQUEST_REVISION"
        actor: SupervisingExaminer
        preconditions:
          - "plan.status == PROPOSED (else ERR_ENFORCEMENT_RECORD_STATE_INVALID)"
        side_effects:
          - "sets plan.reviewed_by_user_id, plan.review_note; increments plan.version by 1"
          - "Examination.status stays NEGOTIATION"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /market-conduct/corrective-action-plans/{id}/review with decision == APPROVE"
        actor: SupervisingExaminer
        preconditions:
          - "plan.status == PROPOSED (else ERR_ENFORCEMENT_RECORD_STATE_INVALID)"
        side_effects:
          - "sets plan.reviewed_by_user_id, plan.review_note; increments plan.version by 1"
          - "cascade: Examination advances NEGOTIATION -> ORDER_PENDING"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /market-conduct/corrective-action-plans/{id}/review with decision == REJECT"
        actor: SupervisingExaminer
        preconditions:
          - "plan.status == PROPOSED (else ERR_ENFORCEMENT_RECORD_STATE_INVALID)"
        side_effects:
          - "sets plan.reviewed_by_user_id, plan.review_note; increments plan.version by 1"
          - "Examination.status stays NEGOTIATION; the carrier must propose a superseding plan"
      - from: "PROPOSED | REVISION_REQUESTED"
        to: SUPERSEDED
        trigger: "system: a new CorrectiveActionPlan is created on the same examination"
        actor: system
        preconditions:
          - "plan.status IN {PROPOSED, REVISION_REQUESTED}"
        side_effects:
          - "the new plan takes revision_round = superseded plan.revision_round + 1"
          - "increments plan.version by 1"
      - from: "PROPOSED | REVISION_REQUESTED"
        to: REJECTED
        trigger: "system: owning Examination reaches ABORTED"
        actor: system
        preconditions:
          - "plan.status IN {PROPOSED, REVISION_REQUESTED}"
        side_effects:
          - "increments plan.version by 1"

  - entity: ConsentOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /market-conduct/consent-orders/{id}/execute"
        actor: InsurerRespondent
        preconditions:
          - "order.status == DRAFT (else ERR_ENFORCEMENT_RECORD_STATE_INVALID)"
          - "X-User-ID == Examination.insurer_id (else ERR_NOT_EXAM_SUBJECT)"
        side_effects:
          - "sets order.signed_by, order.executed_at; increments order.version by 1"
          - "raises Insurer.lifetime_restitution_ordered_cents by order.restitution_cents"
          - "Examination.status stays ORDER_PENDING until the report is published"
      - from: DRAFT
        to: VOIDED
        trigger: "system: a superseding ConsentOrder is drafted on the same examination, or the owning Examination reaches ABORTED"
        actor: system
        preconditions:
          - "order.status == DRAFT"
        side_effects:
          - "increments order.version by 1"

  - entity: MultistateCollaboration
    initial_state: LEAD_ASSIGNED
    terminal_states: [SETTLED, DISSOLVED]
    transitions:
      - from: LEAD_ASSIGNED
        to: ACTIVE
        trigger: "system: owning Examination advances FIELDWORK -> CRITICISM"
        actor: system
        preconditions:
          - "collaboration.status == LEAD_ASSIGNED"
        side_effects:
          - "increments collaboration.version by 1"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /market-conduct/collaborations/{id}/allocate-restitution"
        actor: MultistateCoordinator
        preconditions:
          - "collaboration.status == ACTIVE (else ERR_ENFORCEMENT_RECORD_STATE_INVALID)"
          - "a ConsentOrder with this exam_id has status == EXECUTED (else ERR_ORDER_NOT_EXECUTED)"
        side_effects:
          - "writes participating_states[].allocated_cents per calculations.multistate_restitution_allocation and sets allocated_total_cents and allocation_completed_at"
          - "increments collaboration.version by 1"
      - from: "LEAD_ASSIGNED | ACTIVE"
        to: DISSOLVED
        trigger: "system: owning Examination reaches ABORTED"
        actor: system
        preconditions:
          - "collaboration.status IN {LEAD_ASSIGNED, ACTIVE}"
        side_effects:
          - "resets every participating_states[].allocated_cents to 0 and allocated_total_cents to 0"
          - "increments collaboration.version by 1"

concurrency_rules:
  - rule_id: cap-create-stale-exam
    parent_entity: Examination
    write_endpoint: "POST /market-conduct/examinations/{id}/corrective-action-plans"
    occ_field: "expected_examination_version"
    description: |
      Proposing a CorrectiveActionPlan against an Examination whose version has advanced
      since the carrier last read it is rejected. A new plan legitimately supersedes the
      prior PROPOSED or REVISION_REQUESTED plan, so the write cannot be rejected on state
      grounds; the stale expected_examination_version is the only signal that the carrier
      is proposing against an examination whose plan history it has not observed.
    error_id: ERR_STALE_EXAMINATION_VERSION
    http_status: 412
  - rule_id: consent-order-create-stale-exam
    parent_entity: Examination
    write_endpoint: "POST /market-conduct/examinations/{id}/consent-orders"
    occ_field: "expected_examination_version"
    description: |
      Drafting a ConsentOrder against an Examination whose version has advanced since the
      supervising examiner last read it is rejected. A new draft legitimately voids the
      prior DRAFT order and re-freezes restitution_cents from the examination's current
      aggregate, so the write is state-legal; the stale expected_examination_version is the
      only signal that the drafter's view of the restitution aggregate is out of date.
    error_id: ERR_STALE_EXAMINATION_VERSION
    http_status: 412

calculations:
  - name: complaint_ratio_per_1k
    trigger: "POST /market-conduct/insurers and PATCH /market-conduct/insurers/{id}/market-data (both list complaint_ratio_per_1k and risk_tier in side_effects)"
    algorithm: threshold
    formula: |
      if policy_count_in_force == 0:
          complaint_ratio_per_1k = 0.00
          risk_tier = "UNRATED"
      else:
          complaint_ratio_per_1k = round_half_up(confirmed_complaints_12mo * 1000 / policy_count_in_force, 2)
          risk_tier = "HIGH"     if complaint_ratio_per_1k >= 5.00
                      "ELEVATED" if complaint_ratio_per_1k >= 2.50
                      "MODERATE" if complaint_ratio_per_1k >= 1.00
                      "LOW"      otherwise
    input_set: "The Insurer row being written; no cross-entity reads. policy_count_in_force == 0 is legal and short-circuits to UNRATED with ratio 0.00 - never a division error."
    constants:
      HIGH_TIER_RATIO: 5.00
      ELEVATED_TIER_RATIO: 2.50
      MODERATE_TIER_RATIO: 1.00
    precision: "ratio: 2 decimal places, round_half_up. Tier comparisons use >= on the rounded ratio."

  - name: composite_analysis_score
    trigger: "POST /market-conduct/analysis-cycles/{id}/score (DRAFT -> SCORED side_effects create AnalysisScore rows carrying complaint_component, financial_component, trend_component, volume_multiplier, composite_score)"
    algorithm: weighted_scoring
    formula: |
      # (a)-mode combinatorial: four inputs, tier selection on one, caps on two, multiplier on the sum.
      complaint_component = 40 if ratio >= 5.00 else 28 if ratio >= 2.50 else 16 if ratio >= 1.00 else 6
          # ratio = Insurer.complaint_ratio_per_1k snapshotted into AnalysisScore.complaint_ratio_at_scoring
      financial_component = min(30.00, round_half_up(Insurer.financial_stress_score * 0.30, 2))
      trend_component     = min(30.00, round_half_up(Insurer.consumer_trend_score  * 0.20, 2))
      volume_multiplier   = 1.10 if Insurer.annual_premium_written_cents >= 5000000000 else 1.00
      # PINNED EVALUATION ORDER: round each component to 2dp FIRST, then sum, then multiply,
      # then round the product to 2dp, then apply the 100.00 cap. Any other order is wrong.
      composite_score = min(100.00, round_half_up((complaint_component + financial_component + trend_component) * volume_multiplier, 2))
    input_set: "One AnalysisScore per Insurer with license_status IN {LICENSED, SUSPENDED}. WITHDRAWN carriers are not scored at all (no AnalysisScore row is created for them)."
    constants:
      COMPLAINT_TIER_POINTS: "{5.00: 40, 2.50: 28, 1.00: 16, else: 6}"
      FINANCIAL_WEIGHT: 0.30
      FINANCIAL_CAP: 30.00
      TREND_WEIGHT: 0.20
      TREND_CAP: 30.00
      LARGE_PREMIUM_THRESHOLD_CENTS: 5000000000
      LARGE_PREMIUM_MULTIPLIER: 1.10
      COMPOSITE_CAP: 100.00
    precision: "2 decimal places, round_half_up, applied per component and once more to the multiplied sum."

  - name: target_selection
    trigger: "POST /market-conduct/analysis-cycles/{id}/select-targets (SCORED -> TARGETS_SELECTED side_effects set AnalysisScore.selected / selection_reason / rank_position and create Examinations)"
    algorithm: waterfall_allocation
    formula: |
      threshold = request.min_composite_score if provided else MIN_COMPOSITE_SCORE_DEFAULT
      # (1) ELIGIBILITY FILTER over the cycle's AnalysisScore rows, evaluated in this order
      #     so that selection_reason is single-valued:
      #     a. Insurer.license_status != LICENSED                  -> reason LICENSE_INELIGIBLE
      #     b. composite_score < threshold                         -> reason BELOW_THRESHOLD
      #     c. the Insurer already has an Examination with status NOT IN {PUBLISHED, ABORTED}
      #        whose [fieldwork_start_date, fieldwork_end_date) half-open window intersects
      #        [cycle.default_fieldwork_start, cycle.default_fieldwork_end)
      #                                                            -> reason WINDOW_CONFLICT_DEFERRED
      #     surviving rows form the candidate pool.
      # (2) RANKING EXPRESSION over the candidate pool:
      #     composite_score DESC, then complaint_ratio_at_scoring DESC, then AnalysisScore.created_at ASC.
      #     (created_at is the only permitted final tie-break; id must never be consulted.)
      # (3) CAPACITY: take the first min(cycle.slots_available, len(candidate_pool)) ranked rows
      #     -> selected = true, selection_reason = SELECTED, one Examination created each.
      #     Remaining candidates -> selected = false, selection_reason = CAPACITY_EXHAUSTED.
      # (4) EMPTY-POOL FALLBACK: len(candidate_pool) == 0 is not an error - the cycle still
      #     advances to TARGETS_SELECTED with selected_target_count = 0 and no Examination created.
      # rank_position is assigned by the ranking expression of step (2) over ALL scored rows of
      # the cycle (not only the candidate pool), 1-based.
    input_set: "All AnalysisScore rows of the cycle. Examinations of OTHER cycles and for-cause examinations participate in the step-1c window test."
    constants:
      MIN_COMPOSITE_SCORE_DEFAULT: 40.00
      DEPARTMENT_STATE_CODE: "NV"
    precision: "Integer slot counts; composite comparisons on 2-decimal values with >= for the threshold test."

  - name: data_call_completeness
    trigger: "POST /market-conduct/data-calls/{id}/respond (ISSUED|OVERDUE -> RESPONDED side_effects set is_late, days_late, completeness_pct, effective_completeness_pct)"
    algorithm: threshold
    formula: |
      response_date = date part of the logical clock at the moment of the response
      days_late = max(0, response_date - response_due_date) in whole days
      is_late = days_late > 0
      completeness_pct = round_half_up(records_received * 100 / records_requested, 2)
      effective_completeness_pct = max(0.00, round_half_up(completeness_pct - LATE_PENALTY_PCT_PER_DAY * days_late, 2))
      # acceptance gate, evaluated by POST /data-calls/{id}/disposition with ACCEPTED:
      #   effective_completeness_pct >= ACCEPTANCE_COMPLETENESS_PCT  (>= , not >)
    input_set: "The single DataCall row. records_received is bounded above by records_requested (ERR_RECORDS_EXCEED_REQUEST at priority 65)."
    constants:
      LATE_PENALTY_PCT_PER_DAY: 0.50
      ACCEPTANCE_COMPLETENESS_PCT: 95.00
      DATA_CALL_BUFFER_DAYS: 3
    precision: "2 decimal places, round_half_up; subtraction of the lateness penalty happens on the already-rounded completeness_pct, then the result is rounded again and floored at 0.00."

  - name: sample_draw_plan
    trigger: "POST /market-conduct/data-calls/{id}/disposition with ACCEPTED (RESPONDED -> ACCEPTED side_effects set sample_draw_interval, samples_drawn_count and create the FileSample rows)"
    algorithm: chronological
    formula: |
      area = the DataCall's ExamScopeArea
      sample_draw_interval = floor(area.population_size / area.sample_size)     # >= 1 because sample_size <= population_size
      for k in 0 .. area.sample_size - 1:
          population_index = 1 + k * sample_draw_interval
          file_reference   = AREA_PREFIX[area.area] + "-" + zero_pad(population_index, 6)
          create FileSample { data_call_id, file_reference, population_index,
                              review_status: UNREVIEWED, error_severity: NONE,
                              underpaid_amount_cents: 0, days_to_pay: 0 }
      samples_drawn_count = area.sample_size
      # FileSample rows are created in ascending population_index order; created_at ordering
      # therefore matches population_index ordering. No randomness anywhere: the plan is a
      # pure function of population_size, sample_size and area.
    input_set: "The accepted DataCall and its ExamScopeArea. Samples are drawn once per acceptance; a REJECTED disposition draws nothing."
    constants:
      AREA_PREFIX: "{UNDERWRITING: 'UW', RATING: 'RT', CLAIMS: 'CLM', PRODUCER: 'PRD'}"
      MIN_SAMPLE_SIZE_ON_SITE: 10
      MIN_SAMPLE_SIZE_DESK: 5
    precision: "Integer arithmetic; floor division for the interval; population_index zero-padded to 6 digits."

  - name: error_rate_and_tolerance
    trigger: "POST /market-conduct/file-samples/{id}/review and POST /market-conduct/data-calls/{id}/bulk-review, and the ExamScopeArea FIELDWORK -> TESTED transition whose side_effects recompute error_count, error_rate_pct, material_error_rate_pct, tolerance_breached and escalation_required"
    algorithm: threshold
    formula: |
      reviewed_sample_count = count(FileSample of the area with review_status != UNREVIEWED)
      error_count           = count(FileSample of the area with review_status == ERROR)
      material_error_count  = count(FileSample of the area with error_severity == MATERIAL)
      error_rate_pct          = 0.00 if reviewed_sample_count == 0 else round_half_up(error_count * 100 / reviewed_sample_count, 2)
      material_error_rate_pct = 0.00 if reviewed_sample_count == 0 else round_half_up(material_error_count * 100 / reviewed_sample_count, 2)
      tolerance_breached   = error_rate_pct >= area.error_tolerance_pct            # >= , exact equality breaches
      escalation_required  = material_error_rate_pct >= MATERIAL_ESCALATION_PCT    # >= , exact equality escalates
      # A review sets review_status = COMPLIANT when error_severity == NONE and ERROR otherwise,
      # so error_count counts MINOR and MATERIAL files alike, while material_error_count counts
      # only MATERIAL files. The two rates therefore diverge on MINOR-only areas.
    input_set: "FileSample rows of ONE ExamScopeArea (joined through DataCall.scope_area_id). Samples belonging to a REJECTED data call have been deleted and never enter the counts."
    constants:
      MATERIAL_ESCALATION_PCT: 10.00
      AREA_TOLERANCE_DEFAULTS: "{UNDERWRITING: 7.00, RATING: 5.00, CLAIMS: 3.00, PRODUCER: 10.00}"
    precision: "2 decimal places, round_half_up. Threshold comparisons are >= on the rounded percentage."

  - name: restitution_exposure
    trigger: "POST /market-conduct/criticisms (creation side_effects set restitution_method and restitution_exposure_cents, and raise Examination.pending_restitution_cents)"
    algorithm: aggregation
    formula: |
      area = the criticism's ExamScopeArea
      sample_underpaid_total_cents = sum(FileSample.underpaid_amount_cents
                                         for samples of `area` with review_status == ERROR)
      reviewed = area.reviewed_sample_count
      # VARIANT SELECTION (deterministic, evaluated at issuance and frozen):
      #   POPULATION_EXTRAPOLATED  <=>  severity == "EGREGIOUS"
      #                              OR (severity == "MATERIAL" AND area.tolerance_breached == true)
      #   SAMPLE_ACTUAL            <=>  everything else
      # Both operands are load-bearing: a MATERIAL criticism on a within-tolerance area stays
      # SAMPLE_ACTUAL, and a MINOR criticism on a breached area stays SAMPLE_ACTUAL.
      if severity == "EGREGIOUS" or (severity == "MATERIAL" and area.tolerance_breached == true):
          restitution_method = "POPULATION_EXTRAPOLATED"
          # (b)-mode PINNED ROUNDING ORDER: round the per-file average to whole cents FIRST,
          # then multiply by the population. The alternative order
          #   round_half_up(sample_underpaid_total_cents / reviewed * area.population_size)
          # is a DIFFERENT number and is explicitly NOT the rule.
          average_underpayment_cents = round_half_up(sample_underpaid_total_cents / reviewed, 0)
          restitution_exposure_cents = average_underpayment_cents * area.population_size
      else:
          restitution_method = "SAMPLE_ACTUAL"
          restitution_exposure_cents = sample_underpaid_total_cents
    input_set: "ERROR-status FileSample rows of the criticism's scope area only. Samples of other areas of the same examination are excluded. reviewed >= 1 is guaranteed because the area must be TESTED."
    constants: {}
    precision: "Whole cents. average_underpayment_cents is rounded half-up to an integer BEFORE the multiplication."
    variants:
      - name: SAMPLE_ACTUAL
        when: "severity == MINOR, or severity == MATERIAL while area.tolerance_breached == false"
        difference: "Exposure equals the observed sample harm only; the unexamined population is not charged."
      - name: POPULATION_EXTRAPOLATED
        when: "severity == EGREGIOUS, or severity == MATERIAL while area.tolerance_breached == true"
        difference: "Exposure equals integer-rounded average sample harm times population_size, which for the same sample data is orders of magnitude larger than SAMPLE_ACTUAL."

  - name: penalty_determination
    trigger: "POST /market-conduct/examinations/{id}/consent-orders (creation side_effects set restitution_cents, penalty_gross_cents, cooperation_credit_pct, penalty_net_cents, order_total_cents); GET /market-conduct/examinations/{id}/exposure-summary reports BOTH variants without persisting either"
    algorithm: tiered_pricing
    formula: |
      R = Examination.aggregate_restitution_cents          # SUSTAINED criticisms only
      U = Examination.penalty_units_total                  # SUSTAINED criticisms only
      S = Examination.sustained_criticism_count
      # --- variant PER_VIOLATION ---
      penalty_gross_per_violation = U * PER_UNIT_PENALTY_CENTS
      # --- variant TIERED_AGGREGATE (waterfall over R, round EACH tier product then sum) ---
      t1 = min(R, TIER1_WIDTH_CENTS)
      t2 = min(max(R - TIER1_WIDTH_CENTS, 0), TIER2_WIDTH_CENTS)
      t3 = max(R - TIER1_WIDTH_CENTS - TIER2_WIDTH_CENTS, 0)
      penalty_gross_tiered = round_half_up(t1 * TIER1_RATE, 0)
                           + round_half_up(t2 * TIER2_RATE, 0)
                           + round_half_up(t3 * TIER3_RATE, 0)
                           + S * BASE_PER_SUSTAINED_CRITICISM_CENTS
      # --- (c)-mode PINNED EVALUATION ORDER for the elected variant -------------------
      # The credit rate is keyed on a subtotal that already contains the penalty, so the
      # chain LOOKS circular. It is resolved in exactly these five steps and no other:
      #   1. penalty_gross_cents      = gross of the elected penalty_variant (above)
      #   2. order_subtotal_cents     = R + penalty_gross_cents
      #   3. cooperation_credit_pct   = HIGH_CREDIT_PCT if order_subtotal_cents >= CREDIT_TIER_THRESHOLD_CENTS else LOW_CREDIT_PCT
      #   4. penalty_net_cents        = round_half_up(penalty_gross_cents * (1 - cooperation_credit_pct), 0)
      #   5. order_total_cents        = R + penalty_net_cents
      # order_subtotal_cents is an intermediate that is NOT persisted; the credit tier must be
      # derived from gross, never from net (deriving it from net changes the tier for values
      # straddling CREDIT_TIER_THRESHOLD_CENTS).
      # Statutory ceiling (validation, priority 70): penalty_gross_cents > STATUTORY_CAP_CENTS
      # -> ERR_PENALTY_CAP_EXCEEDED. The formula never silently clamps.
    input_set: "SUSTAINED Criticism rows of the examination only. ISSUED, RESPONDED and WITHDRAWN criticisms contribute nothing to R, U or S."
    constants:
      PER_UNIT_PENALTY_CENTS: 25000
      TIER1_WIDTH_CENTS: 5000000
      TIER1_RATE: 0.10
      TIER2_WIDTH_CENTS: 20000000
      TIER2_RATE: 0.06
      TIER3_RATE: 0.03
      BASE_PER_SUSTAINED_CRITICISM_CENTS: 100000
      CREDIT_TIER_THRESHOLD_CENTS: 25000000
      LOW_CREDIT_PCT: 0.05
      HIGH_CREDIT_PCT: 0.15
      STATUTORY_CAP_CENTS: 50000000
    precision: "Whole cents throughout; round_half_up per tier product and once on the net penalty."
    variants:
      - name: PER_VIOLATION
        when: "request.penalty_variant == PER_VIOLATION"
        difference: "Penalty scales with violation units and ignores restitution size entirely."
      - name: TIERED_AGGREGATE
        when: "request.penalty_variant == TIERED_AGGREGATE"
        difference: "Penalty scales with the restitution waterfall plus a per-criticism base and ignores violation units entirely; for the same examination it yields a different penalty_gross_cents, a possibly different credit tier, and a different order_total_cents."

  - name: criticism_response_round_accounting
    trigger: "POST /market-conduct/criticisms/{id}/responses (raises response_round) and POST /market-conduct/criticisms/{id}/rebut (raises rebuttal_count) - both transitions list these fields in their side_effects"
    algorithm: threshold
    formula: |
      # A criticism may be answered and rebutted repeatedly, but the ISSUED <-> RESPONDED
      # cycle is bounded so the negotiation terminates.
      on POST /criticisms/{id}/responses:
          guard: criticism.response_round < MAX_RESPONSE_ROUNDS   (else ERR_REBUTTAL_ROUNDS_EXHAUSTED)
          CompanyResponse.round_number = criticism.response_round + 1
          criticism.response_round     = criticism.response_round + 1
          criticism.status             = RESPONDED
      on POST /criticisms/{id}/rebut:
          guard: criticism.response_round < MAX_RESPONSE_ROUNDS   (else ERR_REBUTTAL_ROUNDS_EXHAUSTED)
          criticism.rebuttal_count = criticism.rebuttal_count + 1
          criticism.status         = ISSUED
      # Consequence: after the third response the criticism sits in RESPONDED with
      # response_round == 3 and can only be finalized (SUSTAINED or WITHDRAWN); a fourth
      # response and any further rebuttal are both rejected. rebuttal_count therefore never
      # exceeds MAX_RESPONSE_ROUNDS - 1 on a criticism that reaches finalization.
    input_set: "The single Criticism row; CompanyResponse rows are created but never re-read by the guard."
    constants:
      MAX_RESPONSE_ROUNDS: 3
    precision: "Integer round counters; the guard comparison is strict (<)."

  - name: lead_state_selection
    trigger: "POST /market-conduct/examinations/{id}/collaborations (creation side_effects set lead_state_code and status LEAD_ASSIGNED)"
    algorithm: weighted_scoring
    formula: |
      # (1) ELIGIBILITY FILTER: participating_states entries with has_examiner_resources == true.
      # (2) RANKING EXPRESSION: policy_count_in_state DESC.
      # (3) TIE-BREAK: state_code ASC (lexicographic on the two-letter code).
      # (4) EMPTY-POOL FALLBACK: no eligible entry -> ERR_NO_ELIGIBLE_LEAD_STATE (422); the
      #     MultistateCollaboration row is NOT created.
      lead_state_code = first entry after applying (1)-(3)
    input_set: "The participating_states array supplied in the creation request. Examination.lead_state_code is left untouched by this calculation."
    constants: {}
    precision: "Integer policy counts; lexicographic comparison on state_code."

  - name: multistate_restitution_allocation
    trigger: "POST /market-conduct/collaborations/{id}/allocate-restitution (ACTIVE -> SETTLED side_effects write participating_states[].allocated_cents and allocated_total_cents)"
    algorithm: waterfall_allocation
    formula: |
      total = Examination.aggregate_restitution_cents
      denominator = sum(p.policy_count_in_state for p in participating_states)   # >= 1 by input constraint
      for p in participating_states:
          p.allocated_cents = floor(total * p.policy_count_in_state / denominator)
      remainder = total - sum(p.allocated_cents)
      # remainder is distributed ONE cent at a time, cycling the participant list ordered by
      # policy_count_in_state DESC, then state_code ASC. remainder < participant_count always,
      # so exactly the first `remainder` participants in that order receive one extra cent.
      allocated_total_cents = sum(p.allocated_cents)
      # CONSERVATION INVARIANT (must hold exactly, with no rounding drift):
      #   allocated_total_cents == Examination.aggregate_restitution_cents
    input_set: "The collaboration's participating_states array and the examination's SUSTAINED-criticism restitution aggregate, read after the ConsentOrder is EXECUTED."
    constants: {}
    precision: "Whole cents; floor per participant, then a deterministic one-cent-per-participant sweep of the remainder."

  - name: followup_schedule
    trigger: "POST /market-conduct/examinations/{id}/publish-report from ORDER_PENDING (side_effects set followup_required, followup_due_date and create the follow-up Examination)"
    algorithm: threshold
    formula: |
      publication_date = date part of the logical clock at publication
      max_sustained_severity = the most severe severity among SUSTAINED criticisms,
                               ordered EGREGIOUS > MATERIAL > MINOR
      if Examination.sustained_criticism_count == 0:
          followup_required = false; followup_due_date = null
      else:
          months = 12 if max_sustained_severity == "EGREGIOUS"
                   18 if max_sustained_severity == "MATERIAL"
                   24 if max_sustained_severity == "MINOR"
          followup_required = true
          followup_due_date = publication_date + months calendar months,
                              clamped to the last day of the target month when the day
                              of month does not exist there
          follow-up Examination.fieldwork_start_date = followup_due_date
          follow-up Examination.fieldwork_end_date   = followup_due_date + FOLLOWUP_WINDOW_DAYS days
    input_set: "SUSTAINED Criticism rows of the published examination. WITHDRAWN criticisms never influence the follow-up interval."
    constants:
      FOLLOWUP_MONTHS_EGREGIOUS: 12
      FOLLOWUP_MONTHS_MATERIAL: 18
      FOLLOWUP_MONTHS_MINOR: 24
      FOLLOWUP_WINDOW_DAYS: 60
    precision: "Calendar-month arithmetic with end-of-month clamping; dates rendered YYYY-MM-DD."

validations:
  - priority: 10
    category: auth
    error_id: ERR_UNAUTHENTICATED
    condition: "X-User-ID header absent, empty, or not a well-formed UUID on any endpoint other than POST /market-conduct/_clock/set_current_utc."
    applies_to: "all authenticated endpoints"
  - priority: 11
    category: auth
    error_id: ERR_ROLE_NOT_PERMITTED
    condition: "The caller's X-User-Role is not in the endpoint's allowed role set."
    applies_to: "all authenticated endpoints"
  - priority: 12
    category: auth
    error_id: ERR_NOT_EXAM_SUBJECT
    condition: "Caller role is InsurerRespondent and the target record's owning Examination.insurer_id != X-User-ID."
    applies_to: "POST /data-calls/{id}/respond, POST /criticisms/{id}/responses, POST /examinations/{id}/corrective-action-plans, GET endpoints reachable by InsurerRespondent"
  - priority: 13
    category: auth
    error_id: ERR_SEGREGATION_OF_DUTIES
    condition: "POST /criticisms/{id}/finalize where X-User-ID equals the Criticism's issued_by_user_id (the examiner who issued a criticism may not sustain or withdraw it)."
    applies_to: "POST /market-conduct/criticisms/{id}/finalize"
  - priority: 14
    category: auth
    error_id: ERR_SEGREGATION_OF_DUTIES
    condition: "POST /examinations/{id}/publish-report where X-User-ID equals the EXECUTED ConsentOrder's drafted_by_user_id (the drafter of the order may not publish the report that rests on it)."
    applies_to: "POST /market-conduct/examinations/{id}/publish-report"
  - priority: 20
    category: existence
    error_id: ERR_INSURER_NOT_FOUND
    condition: "Path or body insurer_id does not match an existing Insurer."
    applies_to: "GET/PATCH /insurers/{id}, GET /insurers/{id}/analysis-scores, POST /examinations"
  - priority: 20
    category: existence
    error_id: ERR_CYCLE_NOT_FOUND
    condition: "Path cycle id does not match an existing MarketAnalysisCycle."
    applies_to: "GET /analysis-cycles/{id}, POST /analysis-cycles/{id}/score, GET /analysis-cycles/{id}/scores, POST /analysis-cycles/{id}/select-targets"
  - priority: 20
    category: existence
    error_id: ERR_EXAMINATION_NOT_FOUND
    condition: "Path examination id does not match an existing Examination."
    applies_to: "all /examinations/{id}/... endpoints"
  - priority: 20
    category: existence
    error_id: ERR_EXAM_RECORD_NOT_FOUND
    condition: "Path id for a scope area, data call, file sample, criticism, corrective action plan, consent order or collaboration does not match an existing row of that type."
    applies_to: "all /scope-areas/{id}/..., /data-calls/{id}/..., /file-samples/{id}/..., /criticisms/{id}/..., /corrective-action-plans/{id}/..., /consent-orders/{id}/..., /collaborations/{id}/... endpoints"
  - priority: 21
    category: existence
    error_id: ERR_EXAM_RECORD_NOT_FOUND
    condition: "Body scope_area_id on POST /criticisms does not match an existing ExamScopeArea, or matches one whose exam_id differs from the body exam_id."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 30
    category: format
    error_id: ERR_INVALID_REQUEST
    condition: "A required field is missing; a field has the wrong JSON type; an enum field carries a value outside its declared set; a monetary or count field is negative; sample_size or population_size or records_requested or milestone_count or target_slot_capacity is not >= 1; a date field is not YYYY-MM-DD; fieldwork_end_date <= fieldwork_start_date; reference_period_end <= reference_period_start; default_fieldwork_end <= default_fieldwork_start; a percentage field is outside 0.00..100.00; narrative or summary or public_summary or rebuttal_note shorter than 20 characters; participating_states is empty, contains a duplicate state_code, contains a state_code that is not exactly two uppercase letters, or has a total policy_count_in_state of 0; reviews on bulk-review is empty or contains a duplicate file_reference; min_composite_score outside 0.00..100.00; to_iso8601 not an RFC3339 UTC instant."
    applies_to: "all write endpoints"
  - priority: 35
    category: format
    error_id: ERR_DUPLICATE_IDENTIFIER
    condition: "Insurer.naic_code already exists; MarketAnalysisCycle.cycle_label already exists; ConsentOrder.order_number already exists; an ExamScopeArea with the same area already exists on the examination; a MultistateCollaboration already exists on the examination."
    applies_to: "POST /insurers, POST /analysis-cycles, POST /examinations/{id}/scope-areas, POST /examinations/{id}/consent-orders, POST /examinations/{id}/collaborations"
  - priority: 40
    category: state
    error_id: ERR_CYCLE_STATE_INVALID
    condition: "POST /analysis-cycles/{id}/score when status != DRAFT, or POST /analysis-cycles/{id}/select-targets when status != SCORED."
    applies_to: "POST /analysis-cycles/{id}/score, POST /analysis-cycles/{id}/select-targets"
  - priority: 40
    category: state
    error_id: ERR_EXAM_NOT_IN_SCOPING
    condition: "POST /examinations/{id}/scope-areas or POST /examinations/{id}/lock-scope when Examination.status != SCOPING."
    applies_to: "POST /examinations/{id}/scope-areas, POST /examinations/{id}/lock-scope"
  - priority: 40
    category: state
    error_id: ERR_SCOPE_NOT_LOCKED
    condition: "POST /scope-areas/{id}/data-calls when the owning Examination.status == SCOPING, or POST /examinations/{id}/fieldwork-activities when Examination.status IN {SCOPING}."
    applies_to: "POST /scope-areas/{id}/data-calls, POST /examinations/{id}/fieldwork-activities"
  - priority: 40
    category: state
    error_id: ERR_DATA_CALL_NOT_AWAITING_RESPONSE
    condition: "POST /data-calls/{id}/respond when DataCall.status NOT IN {ISSUED, OVERDUE}."
    applies_to: "POST /market-conduct/data-calls/{id}/respond"
  - priority: 40
    category: state
    error_id: ERR_DATA_CALL_NOT_RESPONDED
    condition: "POST /data-calls/{id}/disposition when DataCall.status != RESPONDED, or POST /data-calls/{id}/bulk-review when DataCall.status != ACCEPTED."
    applies_to: "POST /data-calls/{id}/disposition, POST /data-calls/{id}/bulk-review"
  - priority: 40
    category: state
    error_id: ERR_SAMPLE_ALREADY_REVIEWED
    condition: "POST /file-samples/{id}/review when FileSample.review_status != UNREVIEWED."
    applies_to: "POST /market-conduct/file-samples/{id}/review"
  - priority: 40
    category: state
    error_id: ERR_EXAM_NOT_IN_CRITICISM_PHASE
    condition: "POST /criticisms when the examination's status NOT IN {FIELDWORK, CRITICISM}."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 40
    category: state
    error_id: ERR_CRITICISM_STATE_INVALID
    condition: "POST /criticisms/{id}/responses when Criticism.status != ISSUED; POST /criticisms/{id}/rebut when Criticism.status != RESPONDED; POST /criticisms/{id}/finalize when Criticism.status != RESPONDED."
    applies_to: "POST /criticisms/{id}/responses, POST /criticisms/{id}/rebut, POST /criticisms/{id}/finalize"
  - priority: 40
    category: state
    error_id: ERR_EXAM_NOT_IN_NEGOTIATION
    condition: "POST /examinations/{id}/corrective-action-plans when Examination.status != NEGOTIATION, or POST /examinations/{id}/consent-orders when Examination.status NOT IN {NEGOTIATION, ORDER_PENDING}."
    applies_to: "POST /examinations/{id}/corrective-action-plans, POST /examinations/{id}/consent-orders"
  - priority: 40
    category: state
    error_id: ERR_ENFORCEMENT_RECORD_STATE_INVALID
    condition: "POST /corrective-action-plans/{id}/review when CorrectiveActionPlan.status != PROPOSED; POST /consent-orders/{id}/execute when ConsentOrder.status != DRAFT; POST /collaborations/{id}/allocate-restitution when MultistateCollaboration.status != ACTIVE."
    applies_to: "POST /corrective-action-plans/{id}/review, POST /consent-orders/{id}/execute, POST /collaborations/{id}/allocate-restitution"
  - priority: 40
    category: state
    error_id: ERR_EXAM_NOT_READY_FOR_PUBLICATION
    condition: "POST /examinations/{id}/publish-report when Examination.status NOT IN {CRITICISM, ORDER_PENDING}, or when status == CRITICISM and the examination has at least one SUSTAINED criticism (a sustained examination must route through NEGOTIATION and an executed order)."
    applies_to: "POST /market-conduct/examinations/{id}/publish-report"
  - priority: 40
    category: state
    error_id: ERR_EXAM_ALREADY_TERMINAL
    condition: "Any write against an Examination whose status IN {PUBLISHED, ABORTED}, including POST /examinations/{id}/abort."
    applies_to: "all POST endpoints nested under /examinations/{id} and all writes on its descendants"
  - priority: 45
    category: state
    error_id: ERR_STALE_EXAMINATION_VERSION
    condition: "expected_examination_version != Examination.version on POST /examinations/{id}/corrective-action-plans or POST /examinations/{id}/consent-orders."
    applies_to: "POST /examinations/{id}/corrective-action-plans, POST /examinations/{id}/consent-orders"
  - priority: 50
    category: business_safety
    error_id: ERR_INSURER_NOT_EXAMINABLE
    condition: "POST /examinations for an Insurer whose license_status == WITHDRAWN, or POST /examinations/{id}/lock-scope when the subject Insurer's license_status has become WITHDRAWN since the examination opened."
    applies_to: "POST /examinations, POST /examinations/{id}/lock-scope"
  - priority: 51
    category: business_safety
    error_id: ERR_SCOPE_AREA_NOT_TESTED
    condition: "POST /criticisms whose scope_area_id refers to an ExamScopeArea with status != TESTED."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 52
    category: business_safety
    error_id: ERR_FIELDWORK_NOT_DOCUMENTED
    condition: "POST /criticisms when the examination has no FieldworkActivity with activity_type == SYSTEM_WALKTHROUGH, or - only when Examination.mode == ON_SITE - has no FieldworkActivity with activity_type == INTERVIEW."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 53
    category: business_safety
    error_id: ERR_SAMPLE_SIZE_BELOW_MINIMUM
    condition: "POST /examinations/{id}/scope-areas with sample_size < MIN_SAMPLE_SIZE_ON_SITE when Examination.mode == ON_SITE, or < MIN_SAMPLE_SIZE_DESK when mode == DESK."
    applies_to: "POST /market-conduct/examinations/{id}/scope-areas"
  - priority: 54
    category: business_safety
    error_id: ERR_REBUTTAL_ROUNDS_EXHAUSTED
    condition: "POST /criticisms/{id}/responses or POST /criticisms/{id}/rebut when Criticism.response_round >= MAX_RESPONSE_ROUNDS."
    applies_to: "POST /market-conduct/criticisms/{id}/responses, POST /market-conduct/criticisms/{id}/rebut"
  - priority: 55
    category: business_temporal
    error_id: ERR_EXAM_WINDOW_CONFLICT
    condition: "POST /examinations where the requested [fieldwork_start_date, fieldwork_end_date) half-open window intersects the window of an existing Examination for the same insurer_id whose status NOT IN {PUBLISHED, ABORTED}. Adjacency (one window's end equal to the other's start) does not intersect and is allowed."
    applies_to: "POST /market-conduct/examinations"
  - priority: 56
    category: business_temporal
    error_id: ERR_DUE_DATE_OUT_OF_WINDOW
    condition: "POST /scope-areas/{id}/data-calls where response_due_date < the current logical clock date, or response_due_date > the owning Examination.fieldwork_end_date."
    applies_to: "POST /market-conduct/scope-areas/{id}/data-calls"
  - priority: 57
    category: business_temporal
    error_id: ERR_DATA_CALL_WINDOW_CONFLICT
    condition: "POST /scope-areas/{id}/data-calls where the scope area already has a DataCall with status NOT IN {REJECTED, CANCELLED} and abs(existing.response_due_date - requested response_due_date) in whole days < DATA_CALL_BUFFER_DAYS. A gap of exactly DATA_CALL_BUFFER_DAYS days is allowed; the comparison is strict."
    applies_to: "POST /market-conduct/scope-areas/{id}/data-calls"
  - priority: 60
    category: business_referential
    error_id: ERR_CAP_NOT_APPROVED
    condition: "POST /examinations/{id}/consent-orders when the examination has no CorrectiveActionPlan with status == APPROVED."
    applies_to: "POST /market-conduct/examinations/{id}/consent-orders"
  - priority: 61
    category: business_referential
    error_id: ERR_ORDER_NOT_EXECUTED
    condition: "POST /collaborations/{id}/allocate-restitution when the examination has no ConsentOrder with status == EXECUTED."
    applies_to: "POST /market-conduct/collaborations/{id}/allocate-restitution"
  - priority: 62
    category: business_referential
    error_id: ERR_NO_TOLERANCE_BREACH
    condition: "POST /criticisms with severity == EGREGIOUS when the referenced ExamScopeArea.tolerance_breached == false (an egregious criticism must rest on an area whose error rate breached its statutory tolerance)."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 63
    category: business_referential
    error_id: ERR_NO_ELIGIBLE_LEAD_STATE
    condition: "POST /examinations/{id}/collaborations where no participating_states entry has has_examiner_resources == true."
    applies_to: "POST /market-conduct/examinations/{id}/collaborations"
  - priority: 65
    category: business_constraint
    error_id: ERR_RECORDS_EXCEED_REQUEST
    condition: "POST /data-calls/{id}/respond with records_received > DataCall.records_requested."
    applies_to: "POST /market-conduct/data-calls/{id}/respond"
  - priority: 65
    category: business_constraint
    error_id: ERR_SAMPLE_EXCEEDS_POPULATION
    condition: "POST /examinations/{id}/scope-areas with sample_size > population_size, or POST /scope-areas/{id}/data-calls with records_requested > ExamScopeArea.population_size."
    applies_to: "POST /examinations/{id}/scope-areas, POST /scope-areas/{id}/data-calls"
  - priority: 66
    category: business_constraint
    error_id: ERR_AFFECTED_FILES_EXCEED_ERRORS
    condition: "POST /criticisms with affected_file_count > the referenced ExamScopeArea.error_count."
    applies_to: "POST /market-conduct/criticisms"
  - priority: 67
    category: business_constraint
    error_id: ERR_RESPONSE_INCOMPLETE
    condition: "POST /data-calls/{id}/disposition with disposition == ACCEPTED when the data call's effective_completeness_pct < ACCEPTANCE_COMPLETENESS_PCT."
    applies_to: "POST /market-conduct/data-calls/{id}/disposition"
  - priority: 68
    category: business_constraint
    error_id: ERR_CYCLE_SLOTS_EXHAUSTED
    condition: "POST /examinations with cycle_id set for a MarketAnalysisCycle whose slots_available == 0."
    applies_to: "POST /market-conduct/examinations"
  - priority: 70
    category: business_fiscal
    error_id: ERR_PENALTY_CAP_EXCEEDED
    condition: "POST /examinations/{id}/consent-orders where the elected penalty_variant yields penalty_gross_cents > STATUTORY_CAP_CENTS."
    applies_to: "POST /market-conduct/examinations/{id}/consent-orders"
  - priority: 71
    category: business_fiscal
    error_id: ERR_RESTITUTION_NOT_CONSERVED
    condition: "POST /collaborations/{id}/allocate-restitution when Examination.aggregate_restitution_cents == 0 (there is nothing to allocate and the conservation invariant would be vacuous)."
    applies_to: "POST /market-conduct/collaborations/{id}/allocate-restitution"

endpoints:
  # ---- Insurers and market data -------------------------------------------------
  - method: POST
    path: "/market-conduct/insurers"
    description: "Register a regulated carrier with the market-analysis data set."
    roles: [MarketAnalyst]
    code: 201
    input: [name, naic_code, annual_premium_written_cents, policy_count_in_force, confirmed_complaints_12mo, financial_stress_score, consumer_trend_score, "license_status?"]
    output: Insurer
    side_effects:
      - "computes complaint_ratio_per_1k and risk_tier per calculations.complaint_ratio_per_1k"
      - "initialises open_exam_count, pending_enforcement_exam_count and lifetime_restitution_ordered_cents to 0"
  - method: GET
    path: "/market-conduct/insurers"
    description: "List carriers, optionally filtered by licence status or computed risk tier."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator]
    code: 200
    input: ["license_status?", "risk_tier?", "limit?", "offset?"]
    output: Insurer[]
    side_effects: []
  - method: GET
    path: "/market-conduct/insurers/{id}"
    description: "Read one carrier including its computed complaint ratio, risk tier and enforcement counters."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: Insurer
    side_effects: []
  - method: PATCH
    path: "/market-conduct/insurers/{id}/market-data"
    description: "Refresh the carrier's complaint, financial, trend, premium or licence inputs; recomputes the complaint ratio and risk tier."
    roles: [MarketAnalyst]
    code: 200
    input: ["policy_count_in_force?", "confirmed_complaints_12mo?", "financial_stress_score?", "consumer_trend_score?", "annual_premium_written_cents?", "license_status?"]
    output: Insurer
    side_effects:
      - "recomputes complaint_ratio_per_1k and risk_tier per calculations.complaint_ratio_per_1k"
      - "increments Insurer.version by 1"
  - method: GET
    path: "/market-conduct/insurers/{id}/analysis-scores"
    description: "Reverse-reachability read: every AnalysisScore row produced for this carrier across all cycles."
    roles: [MarketAnalyst, SupervisingExaminer]
    code: 200
    input: ["cycle_id?", "selected?", "limit?", "offset?"]
    output: AnalysisScore[]
    side_effects: []

  # ---- Market analysis cycle ----------------------------------------------------
  - method: POST
    path: "/market-conduct/analysis-cycles"
    description: "Open a market-analysis cycle with an examiner slot capacity and the fieldwork window its examinations inherit."
    roles: [MarketAnalyst]
    code: 201
    input: [cycle_label, reference_period_start, reference_period_end, target_slot_capacity, default_fieldwork_start, default_fieldwork_end, "default_exam_mode?"]
    output: MarketAnalysisCycle
    side_effects:
      - "sets status DRAFT, slots_committed 0 and slots_available = target_slot_capacity"
  - method: GET
    path: "/market-conduct/analysis-cycles"
    description: "List market-analysis cycles."
    roles: [MarketAnalyst, SupervisingExaminer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MarketAnalysisCycle[]
    side_effects: []
  - method: GET
    path: "/market-conduct/analysis-cycles/{id}"
    description: "Read one cycle including its slot ledger (slots_committed / slots_available)."
    roles: [MarketAnalyst, SupervisingExaminer]
    code: 200
    input: []
    output: MarketAnalysisCycle
    side_effects: []
  - method: POST
    path: "/market-conduct/analysis-cycles/{id}/score"
    description: "Run the market-analysis scoring pass over every LICENSED or SUSPENDED carrier (cycle DRAFT -> SCORED)."
    roles: [MarketAnalyst]
    code: 200
    input: []
    output: MarketAnalysisCycle
    side_effects:
      - "creates one AnalysisScore per scored carrier per calculations.composite_analysis_score"
      - "assigns AnalysisScore.rank_position by composite_score DESC, complaint_ratio_at_scoring DESC, created_at ASC"
      - "sets scored_insurer_count, scored_at, status SCORED; increments MarketAnalysisCycle.version by 1"
  - method: GET
    path: "/market-conduct/analysis-cycles/{id}/scores"
    description: "Reverse-reachability read: the AnalysisScore rows of one cycle, in rank order."
    roles: [MarketAnalyst, SupervisingExaminer]
    code: 200
    input: ["selected?", "selection_reason?", "limit?", "offset?"]
    output: AnalysisScore[]
    side_effects: []
  - method: POST
    path: "/market-conduct/analysis-cycles/{id}/select-targets"
    description: "Apply the eligibility filter, ranking expression and slot capacity to turn scored carriers into examinations (cycle SCORED -> TARGETS_SELECTED)."
    roles: [MarketAnalyst]
    code: 200
    input: ["min_composite_score?"]
    output: MarketAnalysisCycle
    side_effects:
      - "sets AnalysisScore.selected, selection_reason and rank_position per calculations.target_selection"
      - "creates one Examination in SCOPING per selected score, raising Insurer.open_exam_count and cycle.slots_committed by 1 each"
      - "sets selected_target_count, status TARGETS_SELECTED; increments MarketAnalysisCycle.version by 1"

  # ---- Examination lifecycle ----------------------------------------------------
  - method: POST
    path: "/market-conduct/examinations"
    description: "Open a for-cause or targeted examination directly, outside a scoring cycle."
    roles: [SupervisingExaminer]
    code: 201
    input: [insurer_id, exam_type, mode, lead_state_code, fieldwork_start_date, fieldwork_end_date, "cycle_id?"]
    output: Examination
    side_effects:
      - "sets status SCOPING, scope_locked false and every derived counter to 0"
      - "raises Insurer.open_exam_count by 1"
      - "when cycle_id is supplied, raises cycle.slots_committed by 1 (lowering cycle.slots_available)"
  - method: GET
    path: "/market-conduct/examinations"
    description: "Reverse-reachability read: examinations filtered by subject carrier, originating cycle, predecessor examination or status."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["insurer_id?", "cycle_id?", "predecessor_exam_id?", "status?", "limit?", "offset?"]
    output: Examination[]
    side_effects: []
  - method: GET
    path: "/market-conduct/examinations/{id}"
    description: "Read one examination including version, scope flags and the restitution/penalty aggregates."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: Examination
    side_effects: []
  - method: POST
    path: "/market-conduct/examinations/{id}/scope-areas"
    description: "Add a statutory examination area with its population, sample size and error tolerance (allowed only while SCOPING)."
    roles: [ExaminerInCharge]
    code: 201
    input: [area, population_size, sample_size, "error_tolerance_pct?"]
    output: ExamScopeArea
    side_effects:
      - "defaults error_tolerance_pct from the per-area statutory table in calculations.error_rate_and_tolerance"
      - "sets status PLANNED; raises Examination.scope_area_count by 1 and increments Examination.version by 1"
  - method: GET
    path: "/market-conduct/examinations/{id}/scope-areas"
    description: "Reverse-reachability read: the scope areas of one examination with their testing state and error rates."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExamScopeArea[]
    side_effects: []
  - method: POST
    path: "/market-conduct/examinations/{id}/lock-scope"
    description: "Lock the examination scope and open the data-call phase (SCOPING -> DATA_CALL)."
    roles: [SupervisingExaminer]
    code: 200
    input: []
    output: Examination
    side_effects:
      - "sets scope_locked true and status DATA_CALL; increments Examination.version by 1"
  - method: POST
    path: "/market-conduct/examinations/{id}/fieldwork-activities"
    description: "Record an interview or system-walkthrough workpaper; documentation completeness gates criticism issuance."
    roles: [ExaminerInCharge]
    code: 201
    input: [activity_type, area, participant_name, participant_title, summary, "evidence_ref?"]
    output: FieldworkActivity
    side_effects:
      - "sets conducted_at from the logical clock and computes documented = (len(summary) >= 20 AND evidence_ref present)"
  - method: GET
    path: "/market-conduct/examinations/{id}/fieldwork-activities"
    description: "Reverse-reachability read: the fieldwork workpapers of one examination."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator]
    code: 200
    input: ["activity_type?", "area?", "limit?", "offset?"]
    output: FieldworkActivity[]
    side_effects: []
  - method: GET
    path: "/market-conduct/examinations/{id}/exposure-summary"
    description: "Computed read: both penalty variants side by side for the examination's current SUSTAINED aggregate, without persisting either."
    roles: [SupervisingExaminer, MultistateCoordinator]
    code: 200
    input: []
    output: "{ examination_id: string, sustained_criticism_count: integer, aggregate_restitution_cents: integer, penalty_units_total: integer, per_violation_penalty_gross_cents: integer, per_violation_cooperation_credit_pct: number, per_violation_penalty_net_cents: integer, per_violation_order_total_cents: integer, tiered_penalty_gross_cents: integer, tiered_cooperation_credit_pct: number, tiered_penalty_net_cents: integer, tiered_order_total_cents: integer }"
    side_effects: []
  - method: POST
    path: "/market-conduct/examinations/{id}/publish-report"
    description: "Publish the examination report (CRITICISM -> PUBLISHED for a clean exam, ORDER_PENDING -> PUBLISHED after an executed consent order) and schedule any follow-up."
    roles: [SupervisingExaminer]
    code: 200
    input: [public_summary]
    output: Examination
    side_effects:
      - "sets report_published_at, public_summary and status PUBLISHED"
      - "sets followup_required and followup_due_date per calculations.followup_schedule and, when required, creates the follow-up Examination in SCOPING"
      - "closes every TESTED ExamScopeArea and releases the cycle slot, possibly closing the MarketAnalysisCycle"
      - "increments Examination.version by 1"
  - method: POST
    path: "/market-conduct/examinations/{id}/abort"
    description: "Abort a non-terminal examination, cancelling its data calls, withdrawing its open criticisms, dissolving its collaboration and restoring the cycle slot."
    roles: [SupervisingExaminer]
    code: 200
    input: [abort_reason]
    output: Examination
    side_effects:
      - "sets abort_reason and status ABORTED"
      - "cancels live DataCall rows, closes ExamScopeArea rows, withdraws ISSUED/RESPONDED Criticism rows, rejects live CorrectiveActionPlan rows, voids DRAFT ConsentOrder rows, dissolves the MultistateCollaboration"
      - "drives open_criticism_count and pending_restitution_cents to 0, lowers Insurer.open_exam_count (and pending_enforcement_exam_count where applicable), and lowers cycle.slots_committed, possibly closing the cycle"
      - "increments Examination.version by 1"

  # ---- Scope areas and data calls -----------------------------------------------
  - method: GET
    path: "/market-conduct/scope-areas/{id}"
    description: "Read one scope area including reviewed/error counts, both error rates and the tolerance flags."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: ExamScopeArea
    side_effects: []
  - method: POST
    path: "/market-conduct/scope-areas/{id}/data-calls"
    description: "Issue a data call against one scope area with a response due date inside the fieldwork window."
    roles: [ExaminerInCharge]
    code: 201
    input: [records_requested, response_due_date, "sampling_method?"]
    output: DataCall
    side_effects:
      - "sets issued_date from the logical clock and status ISSUED"
  - method: GET
    path: "/market-conduct/scope-areas/{id}/data-calls"
    description: "Reverse-reachability read: the data calls issued against one scope area."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DataCall[]
    side_effects: []
  - method: GET
    path: "/market-conduct/data-calls/{id}"
    description: "Read one data call including lateness and both completeness percentages."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: DataCall
    side_effects: []
  - method: POST
    path: "/market-conduct/data-calls/{id}/respond"
    description: "Carrier produces records against a data call (ISSUED or OVERDUE -> RESPONDED)."
    roles: [InsurerRespondent]
    code: 200
    input: [records_received, submitted_by_contact]
    output: DataCall
    side_effects:
      - "sets responded_at, is_late, days_late, completeness_pct and effective_completeness_pct per calculations.data_call_completeness"
      - "increments DataCall.version by 1"
  - method: POST
    path: "/market-conduct/data-calls/{id}/disposition"
    description: "Accept or reject the carrier's production; acceptance draws the file sample, rejection returns the area to PLANNED."
    roles: [ExaminerInCharge]
    code: 200
    input: [disposition, "disposition_reason?"]
    output: DataCall
    side_effects:
      - "on ACCEPTED: sets sample_draw_interval and samples_drawn_count and creates the FileSample rows per calculations.sample_draw_plan, advances the ExamScopeArea PLANNED -> FIELDWORK, and advances the Examination DATA_CALL -> FIELDWORK on the first acceptance"
      - "on REJECTED: draws no samples, returns the ExamScopeArea to PLANNED (deleting its UNREVIEWED samples) and raises Examination.rejected_data_call_count by 1"
      - "increments DataCall.version by 1"
  - method: GET
    path: "/market-conduct/data-calls/{id}/file-samples"
    description: "Reverse-reachability read: the file samples drawn from one accepted data call, ordered by population_index."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["review_status?", "error_severity?", "limit?", "offset?"]
    output: FileSample[]
    side_effects: []
  - method: POST
    path: "/market-conduct/data-calls/{id}/bulk-review"
    description: "Bulk action: review many drawn files in one call, addressing them by deterministic file_reference. Already-reviewed references are skipped, not rejected."
    roles: [ExaminerInCharge]
    code: 200
    input: [reviews]
    output: "{ applied_count: integer, skipped_count: integer, skipped_file_references: string[], scope_area_status: string, reviewed_sample_count: integer, error_count: integer, error_rate_pct: number, material_error_rate_pct: number, tolerance_breached: boolean, escalation_required: boolean }"
    side_effects:
      - "sets review_status, error_severity, underpaid_amount_cents, days_to_pay and reviewed_at on each addressed UNREVIEWED FileSample"
      - "when no UNREVIEWED sample remains, advances the ExamScopeArea FIELDWORK -> TESTED, recomputing every field of calculations.error_rate_and_tolerance and possibly advancing the Examination FIELDWORK -> CRITICISM"

  # ---- File samples --------------------------------------------------------------
  - method: GET
    path: "/market-conduct/file-samples/{id}"
    description: "Read one sampled file workpaper."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: FileSample
    side_effects: []
  - method: POST
    path: "/market-conduct/file-samples/{id}/review"
    description: "Review one sampled file, recording severity and quantified consumer harm."
    roles: [ExaminerInCharge]
    code: 200
    input: [error_severity, "underpaid_amount_cents?", "days_to_pay?"]
    output: FileSample
    side_effects:
      - "sets review_status COMPLIANT when error_severity == NONE and ERROR otherwise, plus reviewed_at"
      - "recomputes the owning ExamScopeArea counters and, when it was the last UNREVIEWED sample, advances the area FIELDWORK -> TESTED and possibly the Examination FIELDWORK -> CRITICISM"
      - "increments FileSample.version by 1"

  # ---- Criticisms and company responses -----------------------------------------
  - method: POST
    path: "/market-conduct/criticisms"
    description: "Issue a criticism against a TESTED scope area, freezing the restitution exposure variant at issuance."
    roles: [ExaminerInCharge]
    code: 201
    input: [exam_id, scope_area_id, statute_citation, severity, affected_file_count]
    output: Criticism
    side_effects:
      - "sets restitution_method and restitution_exposure_cents per calculations.restitution_exposure and stamps issued_by_user_id from X-User-ID"
      - "raises Examination.open_criticism_count by 1 and Examination.pending_restitution_cents by restitution_exposure_cents; increments Examination.version by 1"
  - method: GET
    path: "/market-conduct/criticisms"
    description: "Reverse-reachability read: criticisms filtered by examination, scope area or status."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["exam_id?", "scope_area_id?", "status?", "limit?", "offset?"]
    output: Criticism[]
    side_effects: []
  - method: GET
    path: "/market-conduct/criticisms/{id}"
    description: "Read one criticism including its frozen restitution method and exposure."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: Criticism
    side_effects: []
  - method: POST
    path: "/market-conduct/criticisms/{id}/responses"
    description: "Carrier answers a criticism (ISSUED -> RESPONDED), consuming one response round."
    roles: [InsurerRespondent]
    code: 201
    input: [position, narrative, "remediation_offer_cents?"]
    output: CompanyResponse
    side_effects:
      - "creates the CompanyResponse with round_number = Criticism.response_round + 1"
      - "raises Criticism.response_round by 1, sets Criticism.status RESPONDED and increments Criticism.version by 1"
  - method: GET
    path: "/market-conduct/criticisms/{id}/responses"
    description: "Reverse-reachability read: the company response rounds recorded against one criticism."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["position?", "limit?", "offset?"]
    output: CompanyResponse[]
    side_effects: []
  - method: POST
    path: "/market-conduct/criticisms/{id}/rebut"
    description: "Examiner rebuts the carrier's answer, returning the criticism to ISSUED for another round (cyclic transition, bounded by MAX_RESPONSE_ROUNDS)."
    roles: [ExaminerInCharge]
    code: 200
    input: [rebuttal_note]
    output: Criticism
    side_effects:
      - "sets status ISSUED, raises rebuttal_count by 1 and increments Criticism.version by 1"
      - "leaves restitution_method and restitution_exposure_cents at their issuance values"
  - method: POST
    path: "/market-conduct/criticisms/{id}/finalize"
    description: "Supervising examiner sustains or withdraws a responded criticism; sustaining moves the exposure into the examination's enforcement aggregate."
    roles: [SupervisingExaminer]
    code: 200
    input: [disposition, "penalty_units?", "disposition_note?"]
    output: Criticism
    side_effects:
      - "sets status SUSTAINED or WITHDRAWN, finalized_by_user_id, finalized_at, penalty_units and disposition_note"
      - "on SUSTAINED: moves restitution_exposure_cents from Examination.pending_restitution_cents to Examination.aggregate_restitution_cents, raises sustained_criticism_count and penalty_units_total, and may advance the Examination CRITICISM -> NEGOTIATION"
      - "on WITHDRAWN: only lowers Examination.open_criticism_count and Examination.pending_restitution_cents"
      - "increments Criticism.version and Examination.version by 1"

  # ---- Corrective action plans ---------------------------------------------------
  - method: POST
    path: "/market-conduct/examinations/{id}/corrective-action-plans"
    description: "Carrier proposes a corrective action plan against the examination it last observed (optimistic concurrency on Examination.version)."
    roles: [InsurerRespondent]
    code: 201
    input: [expected_examination_version, milestone_count, completion_due_date, narrative]
    output: CorrectiveActionPlan
    side_effects:
      - "supersedes any PROPOSED or REVISION_REQUESTED plan on the examination and takes revision_round = superseded plan.revision_round + 1"
      - "sets status PROPOSED; increments Examination.version by 1"
  - method: GET
    path: "/market-conduct/examinations/{id}/corrective-action-plans"
    description: "Reverse-reachability read: the corrective action plans proposed on one examination, including superseded revisions."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []
  - method: GET
    path: "/market-conduct/corrective-action-plans/{id}"
    description: "Read one corrective action plan."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/market-conduct/corrective-action-plans/{id}/review"
    description: "Supervising examiner approves, rejects or requests revision of a proposed plan; approval opens the consent-order phase."
    roles: [SupervisingExaminer]
    code: 200
    input: [decision, "review_note?"]
    output: CorrectiveActionPlan
    side_effects:
      - "sets status APPROVED, REJECTED or REVISION_REQUESTED plus reviewed_by_user_id and review_note"
      - "on APPROVED: advances the Examination NEGOTIATION -> ORDER_PENDING and increments Examination.version by 1"
      - "increments CorrectiveActionPlan.version by 1"

  # ---- Consent orders ------------------------------------------------------------
  - method: POST
    path: "/market-conduct/examinations/{id}/consent-orders"
    description: "Draft a consent order electing a penalty variant, against the examination version the drafter last observed (optimistic concurrency on Examination.version)."
    roles: [SupervisingExaminer]
    code: 201
    input: [expected_examination_version, order_number, penalty_variant]
    output: ConsentOrder
    side_effects:
      - "freezes restitution_cents from Examination.aggregate_restitution_cents and computes penalty_gross_cents, cooperation_credit_pct, penalty_net_cents and order_total_cents per calculations.penalty_determination"
      - "voids any existing DRAFT order on the examination and stamps drafted_by_user_id from X-User-ID"
      - "sets status DRAFT; increments Examination.version by 1"
  - method: GET
    path: "/market-conduct/examinations/{id}/consent-orders"
    description: "Reverse-reachability read: the consent orders drafted on one examination, including voided drafts."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentOrder[]
    side_effects: []
  - method: GET
    path: "/market-conduct/consent-orders/{id}"
    description: "Read one consent order including the full penalty derivation."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: ConsentOrder
    side_effects: []
  - method: POST
    path: "/market-conduct/consent-orders/{id}/execute"
    description: "Carrier executes the consent order (DRAFT -> EXECUTED), which books the ordered restitution against the carrier's lifetime total."
    roles: [InsurerRespondent]
    code: 200
    input: [signed_by]
    output: ConsentOrder
    side_effects:
      - "sets signed_by, executed_at and status EXECUTED; increments ConsentOrder.version by 1"
      - "raises Insurer.lifetime_restitution_ordered_cents by restitution_cents"

  # ---- Multistate collaboration --------------------------------------------------
  - method: POST
    path: "/market-conduct/examinations/{id}/collaborations"
    description: "Open a multistate collaborative examination, electing the lead state from the participant roster."
    roles: [MultistateCoordinator]
    code: 201
    input: [participating_states, "call_reference?"]
    output: MultistateCollaboration
    side_effects:
      - "sets lead_state_code per calculations.lead_state_selection, participant_count, status LEAD_ASSIGNED and allocated_total_cents 0"
  - method: GET
    path: "/market-conduct/examinations/{id}/collaborations"
    description: "Reverse-reachability read: the multistate collaboration attached to one examination (0 or 1 rows)."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MultistateCollaboration[]
    side_effects: []
  - method: GET
    path: "/market-conduct/collaborations/{id}"
    description: "Read one collaboration including the per-state allocation array."
    roles: [ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: []
    output: MultistateCollaboration
    side_effects: []
  - method: POST
    path: "/market-conduct/collaborations/{id}/allocate-restitution"
    description: "Allocate the examination's sustained restitution across participating states by policy count (ACTIVE -> SETTLED)."
    roles: [MultistateCoordinator]
    code: 200
    input: []
    output: MultistateCollaboration
    side_effects:
      - "writes participating_states[].allocated_cents and allocated_total_cents per calculations.multistate_restitution_allocation, conserving Examination.aggregate_restitution_cents exactly"
      - "sets allocation_completed_at and status SETTLED; increments MultistateCollaboration.version by 1"

  # ---- Test-driving surface ------------------------------------------------------
  - method: POST
    path: "/market-conduct/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit RFC3339 UTC instant. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock sweeps every ISSUED DataCall whose response_due_date is now in the past into OVERDUE."
    roles: [MarketAnalyst, ExaminerInCharge, SupervisingExaminer, MultistateCoordinator, InsurerRespondent]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, data_calls_flagged_overdue: integer }"
    side_effects:
      - "moves every ISSUED DataCall with response_due_date < the new clock date to OVERDUE, incrementing each DataCall.version by 1"

errors:
  # ---- authentication and authorisation ------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent, empty or not a well-formed UUID on any endpoint other than POST /market-conduct/_clock/set_current_utc."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not in the called endpoint's declared roles - e.g. an ExaminerInCharge calling POST /market-conduct/criticisms/{id}/finalize, or a MarketAnalyst calling POST /market-conduct/examinations."
  - id: ERR_NOT_EXAM_SUBJECT
    http: 403
    condition: "An InsurerRespondent acts on a record whose owning Examination.insurer_id differs from X-User-ID - responding to another carrier's data call, answering another carrier's criticism, proposing another carrier's corrective action plan, or executing another carrier's consent order."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting supervising examiner is the same user who created the record being dispositioned: finalizing a criticism whose issued_by_user_id equals X-User-ID, or publishing a report whose EXECUTED ConsentOrder.drafted_by_user_id equals X-User-ID."

  # ---- existence ------------------------------------------------------------------
  - id: ERR_INSURER_NOT_FOUND
    http: 404
    condition: "The insurer id in the path or in the POST /market-conduct/examinations body matches no Insurer row."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "The analysis-cycle id in the path, or a cycle_id supplied on POST /market-conduct/examinations, matches no MarketAnalysisCycle row."
  - id: ERR_EXAMINATION_NOT_FOUND
    http: 404
    condition: "The examination id in the path, or the exam_id in the POST /market-conduct/criticisms body, matches no Examination row."
  - id: ERR_EXAM_RECORD_NOT_FOUND
    http: 404
    condition: "A scope-area, data-call, file-sample, criticism, corrective-action-plan, consent-order or collaboration id matches no row of that type, or a scope_area_id supplied on POST /market-conduct/criticisms belongs to a different examination than the supplied exam_id."

  # ---- request shape and uniqueness ----------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong JSON type, enum value outside the declared set, negative money or count, non-positive population_size / sample_size / records_requested / milestone_count / target_slot_capacity, malformed YYYY-MM-DD or RFC3339 value, end date not strictly after start date, percentage outside 0.00..100.00, narrative/summary/public_summary/rebuttal_note shorter than 20 characters, empty or malformed participating_states, empty reviews array or duplicate file_reference inside it, or lock-scope on an examination with zero scope areas."
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "Insurer.naic_code, MarketAnalysisCycle.cycle_label or ConsentOrder.order_number already exists; a second ExamScopeArea with the same area is added to one examination; a second MultistateCollaboration is opened on one examination."

  # ---- lifecycle state ------------------------------------------------------------
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "Scoring a cycle whose status is not DRAFT, or selecting targets on a cycle whose status is not SCORED (including re-running either action on an already-advanced cycle)."
  - id: ERR_EXAM_NOT_IN_SCOPING
    http: 409
    condition: "Adding a scope area to, or locking the scope of, an examination whose status is not SCOPING - including adding an area after the scope was locked."
  - id: ERR_SCOPE_NOT_LOCKED
    http: 409
    condition: "Issuing a data call or recording a fieldwork activity while the owning examination is still in SCOPING."
  - id: ERR_DATA_CALL_NOT_AWAITING_RESPONSE
    http: 409
    condition: "Responding to a data call whose status is not ISSUED or OVERDUE - already RESPONDED, ACCEPTED, REJECTED or CANCELLED."
  - id: ERR_DATA_CALL_NOT_RESPONDED
    http: 409
    condition: "Dispositioning a data call whose status is not RESPONDED, or bulk-reviewing against a data call whose status is not ACCEPTED."
  - id: ERR_SAMPLE_ALREADY_REVIEWED
    http: 409
    condition: "Single-file review of a FileSample whose review_status is already COMPLIANT or ERROR (the bulk endpoint skips such files instead of failing)."
  - id: ERR_EXAM_NOT_IN_CRITICISM_PHASE
    http: 409
    condition: "Issuing a criticism while the examination status is not FIELDWORK or CRITICISM."
  - id: ERR_CRITICISM_STATE_INVALID
    http: 409
    condition: "Responding to a criticism that is not ISSUED, or rebutting/finalizing a criticism that is not RESPONDED - including any action on a SUSTAINED or WITHDRAWN criticism."
  - id: ERR_EXAM_NOT_IN_NEGOTIATION
    http: 409
    condition: "Proposing a corrective action plan while the examination status is not NEGOTIATION, or drafting a consent order while it is not NEGOTIATION or ORDER_PENDING."
  - id: ERR_ENFORCEMENT_RECORD_STATE_INVALID
    http: 409
    condition: "Reviewing a corrective action plan that is not PROPOSED, executing a consent order that is not DRAFT, or allocating restitution on a collaboration that is not ACTIVE."
  - id: ERR_EXAM_NOT_READY_FOR_PUBLICATION
    http: 409
    condition: "Publishing a report while the examination status is neither CRITICISM nor ORDER_PENDING, or publishing from CRITICISM when the examination already has at least one SUSTAINED criticism (that path must route through NEGOTIATION and an executed order)."
  - id: ERR_EXAM_ALREADY_TERMINAL
    http: 409
    condition: "Any write against an examination whose status is PUBLISHED or ABORTED, including a second abort or a second publication."
  - id: ERR_STALE_EXAMINATION_VERSION
    http: 412
    condition: "expected_examination_version does not equal the current Examination.version on POST /market-conduct/examinations/{id}/corrective-action-plans or POST /market-conduct/examinations/{id}/consent-orders."

  # ---- business safety ------------------------------------------------------------
  - id: ERR_INSURER_NOT_EXAMINABLE
    http: 409
    condition: "Opening an examination against a WITHDRAWN carrier, or locking scope on an examination whose subject carrier has become WITHDRAWN since the examination opened."
  - id: ERR_SCOPE_AREA_NOT_TESTED
    http: 409
    condition: "Issuing a criticism against an ExamScopeArea whose status is not TESTED (still PLANNED, still in FIELDWORK, or already CLOSED)."
  - id: ERR_FIELDWORK_NOT_DOCUMENTED
    http: 409
    condition: "Issuing a criticism when the examination has no SYSTEM_WALKTHROUGH fieldwork activity, or - for an ON_SITE examination only - no INTERVIEW fieldwork activity."
  - id: ERR_SAMPLE_SIZE_BELOW_MINIMUM
    http: 422
    condition: "A scope area declares sample_size below the statutory minimum for the examination mode (10 for ON_SITE, 5 for DESK)."
  - id: ERR_REBUTTAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "A company response or an examiner rebuttal is attempted on a criticism whose response_round has already reached MAX_RESPONSE_ROUNDS (3)."

  # ---- business temporal ----------------------------------------------------------
  - id: ERR_EXAM_WINDOW_CONFLICT
    http: 409
    condition: "A new examination's half-open [fieldwork_start_date, fieldwork_end_date) window intersects that of a non-terminal examination for the same carrier. Exact adjacency (one window's end equal to the other's start) is allowed."
  - id: ERR_DUE_DATE_OUT_OF_WINDOW
    http: 422
    condition: "A data call's response_due_date is earlier than the current logical clock date, or later than the owning Examination.fieldwork_end_date."
  - id: ERR_DATA_CALL_WINDOW_CONFLICT
    http: 409
    condition: "A new data call's response_due_date is strictly fewer than DATA_CALL_BUFFER_DAYS (3) whole days away from that of an existing live (non-REJECTED, non-CANCELLED) data call on the same scope area; a gap of exactly 3 days is accepted."

  # ---- business referential -------------------------------------------------------
  - id: ERR_CAP_NOT_APPROVED
    http: 409
    condition: "Drafting a consent order on an examination that has no APPROVED CorrectiveActionPlan."
  - id: ERR_ORDER_NOT_EXECUTED
    http: 409
    condition: "Allocating multistate restitution, or publishing from ORDER_PENDING, when the examination has no EXECUTED ConsentOrder."
  - id: ERR_NO_TOLERANCE_BREACH
    http: 422
    condition: "Issuing an EGREGIOUS criticism against a scope area whose tolerance_breached is false."
  - id: ERR_NO_ELIGIBLE_LEAD_STATE
    http: 422
    condition: "Opening a collaboration where no participating_states entry has has_examiner_resources true."

  # ---- business constraint --------------------------------------------------------
  - id: ERR_RECORDS_EXCEED_REQUEST
    http: 422
    condition: "A carrier reports records_received greater than the data call's records_requested."
  - id: ERR_SAMPLE_EXCEEDS_POPULATION
    http: 422
    condition: "A scope area declares sample_size greater than population_size, or a data call requests more records than the area's population_size."
  - id: ERR_AFFECTED_FILES_EXCEED_ERRORS
    http: 422
    condition: "A criticism declares affected_file_count greater than the scope area's error_count."
  - id: ERR_RESPONSE_INCOMPLETE
    http: 409
    condition: "Accepting a data-call response whose effective_completeness_pct is below ACCEPTANCE_COMPLETENESS_PCT (95.00)."
  - id: ERR_CYCLE_SLOTS_EXHAUSTED
    http: 409
    condition: "Attaching an examination to a cycle whose slots_available is 0, or selecting targets on a cycle with no remaining slots."

  # ---- business fiscal ------------------------------------------------------------
  - id: ERR_PENALTY_CAP_EXCEEDED
    http: 422
    condition: "The elected penalty variant produces penalty_gross_cents above STATUTORY_CAP_CENTS (50,000,000 cents); the department must elect the other variant rather than have the figure silently clamped."
  - id: ERR_RESTITUTION_NOT_CONSERVED
    http: 409
    condition: "Allocating multistate restitution when Examination.aggregate_restitution_cents is 0 - there is nothing to conserve across participating states."

roles:
  - name: MarketAnalyst
    description: "Market analysis staff of the state insurance department. Owns the carrier data set, the scoring cycle and target selection; has no authority over examination fieldwork or enforcement."
    identity: "opaque"
    exclusive_operations:
      - "POST /market-conduct/insurers"
      - "PATCH /market-conduct/insurers/{id}/market-data"
      - "POST /market-conduct/analysis-cycles"
      - "POST /market-conduct/analysis-cycles/{id}/score"
      - "POST /market-conduct/analysis-cycles/{id}/select-targets"
    shared_operations:
      - "GET /market-conduct/insurers"
      - "GET /market-conduct/insurers/{id}"
      - "GET /market-conduct/insurers/{id}/analysis-scores"
      - "GET /market-conduct/analysis-cycles"
      - "GET /market-conduct/analysis-cycles/{id}"
      - "GET /market-conduct/analysis-cycles/{id}/scores"
      - "GET /market-conduct/examinations"
      - "GET /market-conduct/examinations/{id}"
      - "GET /market-conduct/examinations/{id}/scope-areas"
      - "POST /market-conduct/_clock/set_current_utc"
  - name: ExaminerInCharge
    description: "Examiner in charge of fieldwork. Defines scope areas, issues data calls, dispositions productions, reviews sampled files, records workpapers, issues criticisms and rebuts company responses - but may never finalize a criticism, approve a plan, draft an order or publish a report."
    identity: "opaque"
    exclusive_operations:
      - "POST /market-conduct/examinations/{id}/scope-areas"
      - "POST /market-conduct/scope-areas/{id}/data-calls"
      - "POST /market-conduct/data-calls/{id}/disposition"
      - "POST /market-conduct/data-calls/{id}/bulk-review"
      - "POST /market-conduct/file-samples/{id}/review"
      - "POST /market-conduct/examinations/{id}/fieldwork-activities"
      - "POST /market-conduct/criticisms"
      - "POST /market-conduct/criticisms/{id}/rebut"
    shared_operations:
      - "GET /market-conduct/insurers"
      - "GET /market-conduct/insurers/{id}"
      - "GET /market-conduct/examinations"
      - "GET /market-conduct/examinations/{id}"
      - "GET /market-conduct/examinations/{id}/scope-areas"
      - "GET /market-conduct/examinations/{id}/fieldwork-activities"
      - "GET /market-conduct/scope-areas/{id}"
      - "GET /market-conduct/scope-areas/{id}/data-calls"
      - "GET /market-conduct/data-calls/{id}"
      - "GET /market-conduct/data-calls/{id}/file-samples"
      - "GET /market-conduct/file-samples/{id}"
      - "GET /market-conduct/criticisms"
      - "GET /market-conduct/criticisms/{id}"
      - "GET /market-conduct/criticisms/{id}/responses"
      - "GET /market-conduct/examinations/{id}/corrective-action-plans"
      - "GET /market-conduct/corrective-action-plans/{id}"
      - "GET /market-conduct/examinations/{id}/consent-orders"
      - "GET /market-conduct/consent-orders/{id}"
      - "GET /market-conduct/examinations/{id}/collaborations"
      - "GET /market-conduct/collaborations/{id}"
      - "POST /market-conduct/_clock/set_current_utc"
  - name: SupervisingExaminer
    description: "Supervising examiner and enforcement authority. Opens examinations, locks scope, finalizes criticisms, reviews corrective action plans, drafts consent orders, publishes reports and aborts examinations. Segregation of duties bars the same user from both issuing and finalizing a criticism, and from both drafting an order and publishing its report."
    identity: "opaque"
    exclusive_operations:
      - "POST /market-conduct/examinations"
      - "POST /market-conduct/examinations/{id}/lock-scope"
      - "POST /market-conduct/criticisms/{id}/finalize"
      - "POST /market-conduct/corrective-action-plans/{id}/review"
      - "POST /market-conduct/examinations/{id}/consent-orders"
      - "POST /market-conduct/examinations/{id}/publish-report"
      - "POST /market-conduct/examinations/{id}/abort"
    shared_operations:
      - "GET /market-conduct/insurers"
      - "GET /market-conduct/insurers/{id}"
      - "GET /market-conduct/insurers/{id}/analysis-scores"
      - "GET /market-conduct/analysis-cycles"
      - "GET /market-conduct/analysis-cycles/{id}"
      - "GET /market-conduct/analysis-cycles/{id}/scores"
      - "GET /market-conduct/examinations"
      - "GET /market-conduct/examinations/{id}"
      - "GET /market-conduct/examinations/{id}/scope-areas"
      - "GET /market-conduct/examinations/{id}/fieldwork-activities"
      - "GET /market-conduct/examinations/{id}/exposure-summary"
      - "GET /market-conduct/scope-areas/{id}"
      - "GET /market-conduct/scope-areas/{id}/data-calls"
