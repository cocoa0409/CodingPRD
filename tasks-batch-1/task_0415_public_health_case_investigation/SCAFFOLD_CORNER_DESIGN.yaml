              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-1", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /surveillance/cases/${c1}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_JURISDICTION_SCOPE_VIOLATION"

  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: transfer_create_correct_version_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transfer-create-stale-case
          - entities.Case.fields.version
          - state_machines.Case.UNDER_INVESTIGATION_to_TRANSFER_PENDING
        distinguishing_aspect: |
          OCC happy path + version bump: a transfer create with expected_case_version equal to the
          current case.version succeeds (201) and increments case.version by 1. §1.8 covers the
          accept cascade; this isolates the OCC-success + version-increment claim.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdictions J1 and J2; case CC in J1 interviewed (version observed)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 2", fips_code: "06002" }
              as: JurisdictionAdmin
              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-CC", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cc: $.data.id }
            - call: "POST /surveillance/cases/${cc}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${cc}"
              as: EpiAnalyst
              captures: { cc_v: $.data.version }
          trigger:
            - call: "POST /surveillance/jurisdiction-transfers"
              payload: { program_id: "${prog}", case_id: "${cc}", to_jurisdiction_id: "${j2}", expected_case_version: "${cc_v}" }
              as: EpiAnalyst
              captures: { tr: $.data.id }
            - call: "GET /surveillance/cases/${cc}"
              as: EpiAnalyst
              captures: { cc_v2: $.data.version }
          assert:
            - "response.status == 201"
            - "JurisdictionTransfer.${tr}.status == REQUESTED"
            - "Case.${cc}.status == TRANSFER_PENDING"
            - "Case.${cc}.version == ${cc_v} + 1"

      - name: stale_case_version_on_transfer_excluded_because
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transfer-create-stale-case
          - errors[ERR_STALE_CASE_VERSION]
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_accept_rehomes_case_and_monitoring_depth3
          rationale: "The transfer-create OCC write and version observation are exercised by the named §1.8 cascade instance; the stale-version 412 rejection is its direct inverse and is asserted in §1.6/§1.4 priority-6."

      - name: rate_threshold_cluster_below_min_no_cluster_excluded_because
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.outbreak_cluster_membership
          - entities.ReportableCondition.fields.cluster_min_cases
        excluded_because:
          difficulty_instance: boundary_precision_check / cluster_forms_at_third_confirmed_case
          rationale: "The below-threshold (no cluster) and at-threshold (cluster forms) cumulative boundary is the core assertion of the named §1.8 boundary instance."

      - name: cascading_side_effects_not_a_case_excluded_because
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Case.UNDER_INVESTIGATION_to_CLASSIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / not_a_case_classify_voids_contacts_releases_monitoring_depth3
          rationale: "The N-level cascade end-to-end is the core assertion of the named §1.8 transitive_cascade instance."

      - name: dual_variant_quarantine_excluded_because
        claim_type: dual_variant_calculation
        grounds:
          - calculations.quarantine_end_date
        excluded_because:
          difficulty_instance: dual_variant_calc / quarantine_end_standard_vs_test_based_on_contact
          rationale: "Both quarantine variants and their delta are asserted by the named §1.8 dual_variant_calc instance."

      - name: multi_tenancy_program_scoped_listing_isolation
        claim_type: multi_tenancy
        grounds:
          - complexity_profile.complexity_layers
          - endpoints.GET_/surveillance/cases
          - entities.Case.fields.program_id
        distinguishing_aspect: |
          Program-scoped isolation: listing cases filtered to program P1 returns only P1's case,
          never P2's, even though both programs hold a case — denormalized program_id partitions
          the listing surface.
        test_recipe:
          setup:
            - "Two programs P1 and P2, each with jurisdiction + COVID19 condition + one OPEN case."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH 1" }
              as: JurisdictionAdmin
              captures: { p1: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${p1}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${p1}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${p1}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-P1", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { c1: $.data.id }
            - call: "POST /surveillance/programs"
              payload: { name: "State PH 2" }
              as: JurisdictionAdmin
              captures: { p2: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${p2}", name: "County 2", fips_code: "06002" }
              as: JurisdictionAdmin
              captures: { j2: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${p2}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${p2}", jurisdiction_id: "${j2}", condition_code: "COVID19", patient_reference: "PT-P2", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j2}"
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /surveillance/cases?program_id=${p1}"
              as: EpiAnalyst
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 1"
            - "response.data[0].id == ${c1}"

      - name: derived_field_contact_count_reconciles_after_second_elicit
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Case.fields.contact_count
          - state_machines.Contact.initial_state
          - calculations.case_completeness_score
        distinguishing_aspect: |
          Derived contact_count reconciles on each elicit: opening a case (0), eliciting one
          contact (1), then a second (2) keeps contact_count == count of non-VOIDED contacts.
          §1.8 covers the elicit-then-void conservation; this covers monotone accumulation.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; case CR interviewed (contact_count 0)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-R", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cr: $.data.id }
            - call: "POST /surveillance/cases/${cr}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${cr}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-1", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${cr}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-2", exposure_setting: "WORKPLACE", proximity_meters: 1.5, cumulative_exposure_minutes: 10, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${cr}"
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "Case.${cr}.contact_count == 2"

  # ===========================================================================
  # SECTION: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_contact_count_visible_in_elicit_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Case.fields.contact_count
        distinguishing_aspect: |
          immediate consistency: after eliciting a contact, an immediate GET of the source case
          reflects contact_count == 1 in the same request cycle (no lag) — the elicit side-effect
          on the parent is visible at once.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; case CI interviewed (contact_count 0)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-IMM", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${ci}"
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "Case.${ci}.contact_count == 1"
