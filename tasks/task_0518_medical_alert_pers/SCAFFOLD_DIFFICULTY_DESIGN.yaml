  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: finalize_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_LIVE_MONITORING_BLOCKS_CANCEL]
          - errors[ERR_TEMPORAL_NOT_DUE]
        distinguishing_aspect: |
          Pair business_safety (p7, ERR_LIVE_MONITORING_BLOCKS_CANCEL) vs business_temporal
          (p17, ERR_TEMPORAL_NOT_DUE): a finalize-cancellation that is BOTH before
          cancellation_effective_at AND has a still-ACTIVE device returns the safety error,
          because p7 < p17.
        test_recipe:
          setup:
            - "ACTIVE BASIC contract + still-ACTIVE device; cancellation requested (effective_at = paid_through 2026-07-01); finalize attempted at clock 2026-06-10 (before effective date)."
