              payload: { home_school_id: "${hs_id}", state_student_id: "S-6001", full_name: "Hana Iqbal", cohort_year: 2026, grade_level: 9 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /graduation-plans"
