      - name: every_write_on_the_negotiation_increments_its_version_by_exactly_one
        claim_type: Version Increments
        grounds:
          - "entities.Negotiation.fields.version"
          - "endpoints[POST /upfront/negotiations/{negotiationId}/counter]"
          - "endpoints[POST /upfront/negotiations/{negotiationId}/revise]"
          - "endpoints[POST /upfront/negotiations/{negotiationId}/withdraw]"
        distinguishing_aspect: |
          The OCC field is only meaningful if the guarded version advances on every accepted write and
          on no read: create 1, counter 2, revise 3, withdraw 4, with any number of intervening GETs
          leaving it at 4. An implementation that increments by the number of changed fields, that
          bumps the version on reads, or that only bumps it on state-changing transitions (leaving a
          same-state term replacement at the old version) fails.
