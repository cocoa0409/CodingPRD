              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "ASIAN", raw_count: 1 }
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
              captures: { cell1: $.data.id }
            - call: "POST /ir/data-requests/${dr}/cells"
              payload: { dimension_group: "RACE_ETHNICITY", dimension_key: "BLACK", raw_count: 2 }
              as: DisclosureOfficer
              as_user_id: "disclosure-1"
              captures: { cell2: $.data.id }
          trigger:
            - call: "POST /ir/data-requests/${dr}/screen"
