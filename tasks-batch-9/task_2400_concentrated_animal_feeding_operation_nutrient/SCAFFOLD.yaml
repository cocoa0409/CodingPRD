scenario: "2400. Concentrated Animal Feeding Operation Nutrient Management (livestock operation environmental compliance): permit coverage determination by animal units and discharge potential with permit application and renewal, nutrient management plan development with manure production estimates, soil testing and crop nutrient needs, land application rate calculation with nitrogen and phosphorus based limits and setback requirements, manure storage design, capacity verification and freeboard monitoring with inspection records, application recordkeeping with dates, rates, fields and weather conditions, third-party manure transfer with recipient documentation, mortality management, emergency response and spill reporting procedures, annual reporting, inspection response and plan revision triggers"
domain_name: "cafo-nutrient-management"
api_prefix: "/cafo"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Operation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the livestock operation
      - name: county
        type: string
        source: input
        description: county of record, used only for reporting and list filtering
      - name: animal_type
        type: enum
        source: input
        description: single dominant animal type confined at the operation
        constraints: "one of DAIRY_COW, BEEF_FEEDER, SWINE_FINISHING, LAYER_HEN"
      - name: head_count
        type: integer
        source: input
        description: number of animals confined
        constraints: ">= 1"
      - name: manure_handling
        type: enum
        source: input
        description: manure handling system, drives the animal-unit factor for LAYER_HEN and the dilution factor
        constraints: "one of LIQUID, DRY"
      - name: open_lot_area_sqft
        type: number
        source: input
        description: uncovered lot area contributing precipitation runoff to storage
        default: 0
        constraints: ">= 0"
      - name: discharge_potential
        type: enum
        source: input
        description: discharge pathway determination made by the permitting authority
        constraints: "one of NONE, STORMWATER_ONLY, CONTINUOUS"
      - name: has_conservation_plan
        type: boolean
        source: input
        description: whether an accepted conservation plan is on file, enabling the permit renewal fee discount tier
        default: false
      - name: animal_units
        type: number
        source: computed
        description: "computed by calculations.operation_animal_units_and_class; head_count x AU_FACTOR"
      - name: size_class
        type: enum
        source: computed
        description: "computed by calculations.operation_animal_units_and_class from animal_units"
        constraints: "one of SMALL, MEDIUM, LARGE"
      - name: permit_required
        type: boolean
        source: computed
        description: "computed by calculations.operation_animal_units_and_class from size_class and discharge_potential"
      - name: design_annual_manure_gallons
        type: number
        source: computed
        description: "DESIGN_BASIS output of calculations.operation_manure_production"
      - name: daily_production_gallons
        type: number
        source: computed
        description: "design_annual_manure_gallons / 365, round_half_up to 2 decimal places"
      - name: recorded_annual_manure_gallons
        type: number
        source: computed
        description: "RECORDS_BASIS output of calculations.operation_manure_production for the calendar year of the logical clock"
      - name: design_storage_days
        type: integer
        source: computed
        description: "computed by calculations.storage_days_of_capacity DESIGN_BASIS aggregated over all ManureStorage rows of this operation"
      - name: compliance_posture
        type: enum
        source: computed
        description: "computed by calculations.operation_compliance_posture; gates land application, transfers and plan approval"
        constraints: "one of OPEN, RESTRICTED, SUSPENDED"
      - name: open_finding_count
        type: integer
        source: computed
        description: "count of Inspection rows of this operation whose inspection_status IN {NOV_ISSUED, RESPONSE_SUBMITTED}"
        default: 0
      - name: open_discharge_incident_count
        type: integer
        source: computed
        description: "count of IncidentReport rows of this operation whose incident_type IN {DISCHARGE, SPILL} and incident_status IN {OPEN, NOTIFIED, WRITTEN_SUBMITTED}"
        default: 0

  - name: Hauler
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: registered name of the third-party manure hauler
      - name: license_number
        type: string
        source: input
        description: state manure-hauler license number
      - name: license_expires_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the hauler license lapses
      - name: certified_applicator
        type: boolean
        source: input
        description: whether the hauler holds a certified applicator endorsement
        default: false
      - name: hauler_status
        type: enum
        source: computed
        description: "ACTIVE while logical clock <= license_expires_on, otherwise LAPSED; recomputed on every read and on POST /cafo/_clock/set_current_utc"
        constraints: "one of ACTIVE, LAPSED"

  - name: Permit
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation the coverage applies to"
      - name: permit_type
        type: enum
        source: input
        description: coverage instrument requested
        constraints: "one of INDIVIDUAL, GENERAL"
      - name: effective_on
        type: datetime
        source: input
        description: requested first instant of coverage, ISO 8601 UTC
      - name: expiration_on
        type: datetime
        source: computed
        description: "effective_on + 5 years, stamped when coverage_status becomes COVERED; coverage interval is half-open [effective_on, expiration_on)"
      - name: renewal_window_opens_on
        type: datetime
        source: computed
        description: "expiration_on - 180 days"
      - name: renewal_due_on
        type: datetime
        source: computed
        description: "expiration_on - 90 days"
      - name: coverage_status
        type: enum
        source: computed
        description: coverage dimension of the parallel Permit state machine
        constraints: "one of DRAFT_APPLICATION, SUBMITTED, COVERED, RENEWAL_PENDING, EXPIRED"
      - name: compliance_status
        type: enum
        source: computed
        description: compliance dimension of the parallel Permit state machine, driven by Inspection transitions
        constraints: "one of IN_GOOD_STANDING, NOTICE_ISSUED, CORRECTIVE_ACTION"
      - name: renewal_submitted_at
        type: datetime
        source: computed
        description: logical-clock instant at which the renewal application was received
      - name: is_late_renewal
        type: boolean
        source: computed
        description: "true when renewal_submitted_at > renewal_due_on"
      - name: gross_fee
        type: number
        source: computed
        description: "step 1 of calculations.permit_renewal_fee"
      - name: conservation_discount_pct
        type: number
        source: computed
        description: "step 2 of calculations.permit_renewal_fee, keyed on gross_fee tier"
      - name: conservation_discount_amount
        type: number
        source: computed
        description: "step 3 of calculations.permit_renewal_fee"
      - name: net_fee
        type: number
        source: computed
        description: "step 4 of calculations.permit_renewal_fee"
      - name: late_surcharge_amount
        type: number
        source: computed
        description: "step 5 of calculations.permit_renewal_fee, keyed on net_fee"
      - name: total_due
        type: number
        source: computed
        description: "step 6 of calculations.permit_renewal_fee"

  - name: NutrientManagementPlan
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation the plan governs"
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the coverage the plan is filed under"
      - name: plan_year
        type: integer
        source: input
        description: calendar year the plan governs
      - name: supersedes_plan_id
        type: string
        source: input
        description: "FK -> NutrientManagementPlan.id; self-referential link to the plan this revision replaces, null for a first plan"
        default: null
      - name: allowed_application_methods
        type: array
        source: input
        description: application methods the certified planner authorizes for this plan
        constraints: "non-empty subset of {SURFACE_BROADCAST, INCORPORATED_24H, INJECTION, IRRIGATION}"
      - name: winter_application_allowed
        type: boolean
        source: input
        description: whether the plan authorizes application in the winter window (clock month IN {DEC, JAN, FEB})
        default: false
      - name: plan_status
        type: enum
        source: computed
        description: cyclic plan lifecycle state
        constraints: "one of DRAFT, CERTIFIED, SUBMITTED, APPROVED, REVISION_REQUIRED, SUPERSEDED"
      - name: certifying_planner_user_id
        type: string
        source: computed
        description: "X-User-ID of the CertifiedPlanner who executed POST /cafo/nutrient-plans/{id}/certify"
      - name: certified_at
        type: datetime
        source: computed
        description: logical-clock instant of certification
      - name: approved_at
        type: datetime
        source: computed
        description: logical-clock instant of state approval
      - name: revision_count
        type: integer
        source: computed
        description: number of times this plan has entered REVISION_REQUIRED
        default: 0

  - name: Field
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation controlling the field"
      - name: field_name
        type: string
        source: input
        description: operator label for the field
      - name: total_acres
        type: number
        source: input
        description: gross acreage of the field
        constraints: "> 0"
      - name: distance_to_water_ft
        type: number
        source: input
        description: shortest distance from the field edge to surface water
        constraints: ">= 0"
      - name: has_tile_inlet
        type: boolean
        source: input
        description: whether a surface tile inlet is present in the field
        default: false
      - name: slope_pct
        type: number
        source: input
        description: dominant slope percentage, drives the setback adder and the soil P index adjustment
        constraints: ">= 0"
      - name: water_frontage_ft
        type: number
        source: input
        description: length of field boundary adjoining surface water, used to convert the setback into excluded acres
        constraints: ">= 0"
      - name: required_setback_ft
        type: number
        source: computed
        description: "computed by calculations.field_setback_and_net_acres"
      - name: excluded_acres
        type: number
        source: computed
        description: "computed by calculations.field_setback_and_net_acres"
      - name: net_applicable_acres
        type: number
        source: computed
        description: "computed by calculations.field_setback_and_net_acres; total_acres - excluded_acres"
      - name: last_application_on
        type: datetime
        source: computed
        description: "applied_on of the most recent LandApplicationEvent on this field whose event_status IN {RECORDED, VERIFIED}, null when none"

  - name: SoilTest
    parent: Field
    common_fields: false
    fields:
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field sampled"
      - name: sampled_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the sample was drawn
      - name: lab_name
        type: string
        source: input
        description: laboratory that ran the analysis
      - name: soil_test_p_ppm
        type: number
        source: input
        description: Bray-1 phosphorus concentration in parts per million
        constraints: ">= 0"
      - name: soil_test_k_ppm
        type: number
        source: input
        description: potassium concentration in parts per million
        constraints: ">= 0"
      - name: organic_matter_pct
        type: number
        source: input
        description: soil organic matter percentage
        constraints: ">= 0"
      - name: p_index
        type: number
        source: computed
        description: "computed by calculations.soil_test_p_index using the parent Field.slope_pct"
      - name: p_index_category
        type: enum
        source: computed
        description: "computed by calculations.soil_test_p_index; selects P_INDEX_MULTIPLIER in calculations.budget_allowable_rate"
        constraints: "one of LOW, MEDIUM, HIGH, VERY_HIGH"
      - name: is_valid
        type: boolean
        source: computed
        description: "true while logical clock < sampled_on + SOIL_TEST_VALIDITY_YEARS; recomputed on read and on POST /cafo/_clock/set_current_utc"

  - name: FieldNutrientBudget
    parent: NutrientManagementPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> NutrientManagementPlan.id; the plan this budget belongs to"
      - name: field_id
        type: string
        source: input
        description: "FK -> Field.id; the field the budget rations"
      - name: soil_test_id
        type: string
        source: input
        description: "FK -> SoilTest.id; the soil test whose p_index_category sets the phosphorus allowance"
      - name: crop
        type: enum
        source: input
        description: crop planned for the plan year
        constraints: "one of CORN_GRAIN, SOYBEAN, ALFALFA, GRASS_HAY"
      - name: yield_goal
        type: number
        source: input
        description: yield goal in bushels per acre for CORN_GRAIN and SOYBEAN, tons per acre for ALFALFA and GRASS_HAY
        constraints: "> 0"
      - name: previous_crop
        type: enum
        source: input
        description: crop harvested in the prior year, drives the legume nitrogen credit
        constraints: "one of CORN_GRAIN, SOYBEAN, ALFALFA, GRASS_HAY, NONE"
      - name: planned_application_method
        type: enum
        source: input
        description: application method assumed by the budget, drives the nitrogen availability factor
        constraints: "one of SURFACE_BROADCAST, INCORPORATED_24H, INJECTION, IRRIGATION"
      - name: crop_n_need_lbs
        type: number
        source: computed
        description: "step 1 of calculations.budget_allowable_rate"
      - name: legume_credit_lbs
        type: number
        source: computed
        description: "step 2 of calculations.budget_allowable_rate"
      - name: adjusted_n_need_lbs
        type: number
        source: computed
        description: "step 3 of calculations.budget_allowable_rate"
      - name: crop_p_removal_lbs
        type: number
        source: computed
        description: "step 4 of calculations.budget_allowable_rate"
      - name: p_allowance_lbs
        type: number
        source: computed
        description: "step 5 of calculations.budget_allowable_rate"
      - name: allowable_n_rate_gal_per_acre
        type: number
        source: computed
        description: "step 6 of calculations.budget_allowable_rate, nitrogen-based limit"
      - name: allowable_p_rate_gal_per_acre
        type: number
        source: computed
        description: "step 7 of calculations.budget_allowable_rate, phosphorus-based limit"
      - name: binding_basis
        type: enum
        source: computed
        description: "step 8 of calculations.budget_allowable_rate; NITROGEN when the nitrogen limit is the smaller of the two, otherwise PHOSPHORUS"
        constraints: "one of NITROGEN, PHOSPHORUS"
      - name: allowable_rate_gal_per_acre
        type: number
        source: computed
        description: "step 8 of calculations.budget_allowable_rate; min of the two limits"
      - name: allowable_total_gallons
        type: number
        source: computed
        description: "step 9 of calculations.budget_allowable_rate; floor(allowable_rate_gal_per_acre x Field.net_applicable_acres)"
      - name: applied_gallons_to_date
        type: number
        source: computed
        description: "sum of gallons_applied over LandApplicationEvent rows of this budget whose event_status IN {RECORDED, VERIFIED}"
        default: 0
      - name: remaining_gallons
        type: number
        source: computed
        description: "allowable_total_gallons - applied_gallons_to_date; conserved-quantity ledger of the budget"
      - name: budget_status
        type: enum
        source: computed
        description: "ACTIVE while the owning plan is APPROVED, LOCKED whenever the owning plan leaves APPROVED"
        constraints: "one of ACTIVE, LOCKED"

  - name: ManureStorage
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation that owns the structure"
      - name: structure_name
        type: string
        source: input
        description: operator label for the structure
      - name: structure_type
        type: enum
        source: input
        description: structure kind; EARTHEN_LAGOON and STACKING_PAD carry the winter seasonal factor
        constraints: "one of EARTHEN_LAGOON, CONCRETE_TANK, STACKING_PAD"
      - name: surface_area_sqft
        type: number
        source: input
        description: plan-view surface area of the structure
        constraints: "> 0"
      - name: total_depth_in
        type: number
        source: input
        description: total inside depth in inches from floor to top of berm or wall
        constraints: "> 0"
      - name: required_freeboard_in
        type: number
        source: input
        description: freeboard that must be preserved above the liquid surface
        default: 24
        constraints: ">= 0 and < total_depth_in"
      - name: design_capacity_gallons
        type: number
        source: computed
        description: "computed by calculations.storage_capacity_and_freeboard"
      - name: freeboard_reserve_gallons
        type: number
        source: computed
        description: "computed by calculations.storage_capacity_and_freeboard"
      - name: operating_capacity_gallons
        type: number
        source: computed
        description: "design_capacity_gallons - freeboard_reserve_gallons"
      - name: cumulative_intake_gallons
        type: number
        source: computed
        description: "sum of gallons over accepted POST /cafo/manure-storages/{id}/intake calls"
        default: 0
      - name: precipitation_adjustment_gallons
        type: number
        source: computed
        description: "running reconciliation term written by StorageInspection so that cumulative_intake_gallons + precipitation_adjustment_gallons - cumulative_outflow_gallons == current_volume_gallons"
        default: 0
      - name: cumulative_outflow_gallons
        type: number
        source: computed
        description: "sum of gallons_applied over LandApplicationEvent rows drawing on this structure whose event_status IN {RECORDED, VERIFIED} plus gallons_transferred over ManureTransfer rows whose transfer_status IN {ACKNOWLEDGED, COMPLETED}"
        default: 0
      - name: current_volume_gallons
        type: number
        source: computed
        description: "cumulative_intake_gallons + precipitation_adjustment_gallons - cumulative_outflow_gallons"
        default: 0
      - name: committed_outflow_gallons
        type: number
        source: computed
        description: "sum of gallons_transferred over ManureTransfer rows on this structure whose transfer_status == INITIATED; released when a transfer is suspended or cancelled"
        default: 0
      - name: available_capacity_gallons
        type: number
        source: computed
        description: "operating_capacity_gallons - current_volume_gallons - committed_outflow_gallons"
      - name: days_of_storage_available
        type: integer
        source: computed
        description: "AVAILABLE_BASIS output of calculations.storage_days_of_capacity, floored at 0"
      - name: storage_status
        type: enum
        source: computed
        description: cyclic structure state driven by StorageInspection freeboard readings
        constraints: "one of IN_SERVICE, FREEBOARD_ALERT, OVERFLOW_IMMINENT"
      - name: last_inspected_on
        type: datetime
        source: computed
        description: "inspected_on of the most recent StorageInspection on this structure, null when none"

  - name: StorageInspection
    parent: ManureStorage
    common_fields: false
    fields:
      - name: storage_id
        type: string
        source: input
        description: "FK -> ManureStorage.id; the structure inspected"
      - name: inspected_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the inspection
      - name: inspector_name
        type: string
        source: input
        description: name of the person who performed the weekly structure inspection
      - name: measured_freeboard_in
        type: number
        source: input
        description: vertical distance from the liquid surface to the top of the structure
        constraints: ">= 0 and <= ManureStorage.total_depth_in"
      - name: visual_condition
        type: enum
        source: input
        description: recorded condition of berms, liner and outlets
        constraints: "one of NORMAL, SEEPAGE, EROSION, CRACKING"
      - name: measured_volume_gallons
        type: number
        source: computed
        description: "computed by calculations.storage_capacity_and_freeboard from measured_freeboard_in"
      - name: freeboard_deficit_in
        type: number
        source: computed
        description: "max(0, ManureStorage.required_freeboard_in - measured_freeboard_in)"
      - name: alert_raised
        type: boolean
        source: computed
        description: "true when freeboard_deficit_in > 0 or visual_condition != NORMAL"

  - name: LandApplicationEvent
    parent: NutrientManagementPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> NutrientManagementPlan.id; the approved plan the application is recorded under"
      - name: budget_id
        type: string
        source: input
        description: "FK -> FieldNutrientBudget.id; the budget debited by this application"
      - name: storage_id
        type: string
        source: input
        description: "FK -> ManureStorage.id; the structure the manure was drawn from"
      - name: applied_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the application occurred
      - name: gallons_applied
        type: number
        source: input
        description: volume applied
        constraints: "> 0"
      - name: acres_treated
        type: number
        source: input
        description: acres actually treated
        constraints: "> 0"
      - name: application_method
        type: enum
        source: input
        description: method used, must be listed in the plan's allowed_application_methods
        constraints: "one of SURFACE_BROADCAST, INCORPORATED_24H, INJECTION, IRRIGATION"
      - name: setback_maintained_ft
        type: number
        source: input
        description: setback actually left unapplied along surface water
        constraints: ">= 0"
      - name: soil_condition
        type: enum
        source: input
        description: recorded ground condition at time of application
        constraints: "one of DRY, MOIST, SATURATED, FROZEN, SNOW_COVERED"
      - name: precipitation_forecast_in_24h
        type: number
        source: input
        description: forecast precipitation in inches for the 24 hours after application
        default: 0
        constraints: ">= 0"
      - name: applicator_name
        type: string
        source: input
        description: name of the person who applied the manure
      - name: rate_gal_per_acre
        type: number
        source: computed
        description: "gallons_applied / acres_treated, round_half_up to 2 decimal places"
      - name: n_applied_lbs
        type: number
        source: computed
        description: "per-event plant-available nitrogen from calculations.application_event_nutrient_load, persisted rounded to 2 decimal places"
      - name: p2o5_applied_lbs
        type: number
        source: computed
        description: "per-event phosphate from calculations.application_event_nutrient_load, persisted rounded to 2 decimal places"
      - name: event_status
        type: enum
        source: computed
        description: recordkeeping state of the application
        constraints: "one of RECORDED, VERIFIED, VOIDED"

  - name: ManureTransfer
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation shipping the manure"
      - name: storage_id
        type: string
        source: input
        description: "FK -> ManureStorage.id; the structure the load is drawn from"
      - name: hauler_id
        type: string
        source: input
        description: "FK -> Hauler.id; the third-party hauler moving the manure"
      - name: recipient_name
        type: string
        source: input
        description: name of the receiving party
      - name: recipient_address
        type: string
        source: input
        description: street address of the receiving party
      - name: transferred_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the load left the operation
      - name: gallons_transferred
        type: number
        source: input
        description: volume shipped
        constraints: "> 0"
      - name: nutrient_analysis_provided
        type: boolean
        source: input
        description: whether the recipient received the required manure nutrient analysis sheet
        default: false
      - name: recipient_n_lbs
        type: number
        source: computed
        description: "total nitrogen shipped from calculations.application_event_nutrient_load TRANSFER context, no availability factor applied"
      - name: recipient_p2o5_lbs
        type: number
        source: computed
        description: "total phosphate shipped from calculations.application_event_nutrient_load TRANSFER context"
      - name: recipient_ack_signed_at
        type: datetime
        source: computed
        description: logical-clock instant the recipient acknowledgement was recorded, null before acknowledgement
      - name: transfer_status
        type: enum
        source: computed
        description: transfer lifecycle state
        constraints: "one of INITIATED, ACKNOWLEDGED, COMPLETED, SUSPENDED, CANCELLED"

  - name: IncidentReport
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the reporting operation"
      - name: incident_type
        type: enum
        source: input
        description: polymorphic discriminator selecting which subject FK and which notification rule applies
        constraints: "one of MORTALITY, DISCHARGE, SPILL"
      - name: subject_storage_id
        type: string
        source: input
        description: "FK -> ManureStorage.id; polymorphic subject required when incident_type IN {DISCHARGE, SPILL}, must be null when incident_type == MORTALITY"
        default: null
      - name: subject_field_id
        type: string
        source: input
        description: "FK -> Field.id; polymorphic subject required when incident_type == MORTALITY, must be null when incident_type IN {DISCHARGE, SPILL}"
        default: null
      - name: discovered_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the operator discovered the event
      - name: description
        type: string
        source: input
        description: narrative of the event and immediate actions
      - name: mortality_head_count
        type: integer
        source: input
        description: animals lost, meaningful only when incident_type == MORTALITY
        default: 0
        constraints: ">= 0"
      - name: disposal_method
        type: enum
        source: input
        description: carcass disposal route, meaningful only when incident_type == MORTALITY
        default: null
        constraints: "one of COMPOSTING, BURIAL, INCINERATION, RENDERING or null"
      - name: released_gallons
        type: number
        source: input
        description: volume released, meaningful only when incident_type IN {DISCHARGE, SPILL}
        default: 0
        constraints: ">= 0"
      - name: reached_water
        type: boolean
        source: input
        description: whether the release reached surface water
        default: false
      - name: requires_oral_notification
        type: boolean
        source: computed
        description: "computed by calculations.incident_notification_deadlines"
      - name: oral_notification_deadline_at
        type: datetime
        source: computed
        description: "discovered_at + ORAL_NOTIFICATION_HOURS, null when requires_oral_notification is false"
      - name: written_report_deadline_at
        type: datetime
        source: computed
        description: "discovered_at + WRITTEN_REPORT_DAYS, null when requires_oral_notification is false"
      - name: oral_notified_at
        type: datetime
        source: computed
        description: logical-clock instant the oral notification was recorded, null before recording
      - name: notification_late
        type: boolean
        source: computed
        description: "true when oral_notified_at > oral_notification_deadline_at strictly"
      - name: incident_status
        type: enum
        source: computed
        description: incident lifecycle state
        constraints: "one of OPEN, NOTIFIED, WRITTEN_SUBMITTED, CLOSED"

  - name: Inspection
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the operation inspected"
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the coverage under which the inspection is conducted"
      - name: scheduled_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant the inspection is scheduled for
      - name: inspection_kind
        type: enum
        source: input
        description: reason for the inspection
        constraints: "one of ROUTINE, COMPLAINT, FOLLOW_UP"
      - name: inspector_user_id
        type: string
        source: computed
        description: "X-User-ID of the StateReviewer who executed POST /cafo/inspections/{id}/conduct"
      - name: conducted_on
        type: datetime
        source: computed
        description: logical-clock instant the inspection was conducted
      - name: findings_count
        type: integer
        source: computed
        description: number of deficiencies recorded at conduct time
        default: 0
      - name: deficiency_categories
        type: array
        source: computed
        description: "deficiency categories recorded at conduct time, subset of {RECORDKEEPING, FREEBOARD, SETBACK, TRANSFER_DOCUMENTATION, MORTALITY}"
      - name: response_due_on
        type: datetime
        source: computed
        description: "conducted_on + RESPONSE_DAYS, stamped when a notice of violation is issued"
      - name: corrective_action_summary
        type: string
        source: computed
        description: narrative supplied with the operator response
      - name: closed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the actor who closed the inspection; must differ from inspector_user_id"
      - name: inspection_status
        type: enum
        source: computed
        description: branching inspection lifecycle state
        constraints: "one of SCHEDULED, CONDUCTED, NOV_ISSUED, RESPONSE_SUBMITTED, CLOSED"

  - name: AnnualReport
    parent: Operation
    common_fields: true
    fields:
      - name: operation_id
        type: string
        source: input
        description: "FK -> Operation.id; the reporting operation"
      - name: plan_id
        type: string
        source: input
        description: "FK -> NutrientManagementPlan.id; the plan in force for the report year"
      - name: report_year
        type: integer
        source: input
        description: calendar year covered by the report
      - name: beginning_storage_gallons
        type: number
        source: input
        description: operator-reported storage volume on the first day of the report year
        constraints: ">= 0"
      - name: ending_storage_gallons
        type: number
        source: input
        description: operator-reported storage volume on the last day of the report year
        constraints: ">= 0"
      - name: variance_explanation
        type: string
        source: input
        description: operator narrative explaining a mass-balance variance outside tolerance
        default: null
      - name: recorded_land_applied_gallons
        type: number
        source: computed
        description: "step 1 of calculations.annual_report_mass_balance"
      - name: recorded_transferred_gallons
        type: number
        source: computed
        description: "step 2 of calculations.annual_report_mass_balance"
      - name: recorded_total_gallons
        type: number
        source: computed
        description: "step 3 of calculations.annual_report_mass_balance"
      - name: mass_balance_expected_gallons
        type: number
        source: computed
        description: "step 4 of calculations.annual_report_mass_balance; Operation.design_annual_manure_gallons"
      - name: variance_pct
        type: number
        source: computed
        description: "step 5 of calculations.annual_report_mass_balance"
      - name: variance_classification
        type: enum
        source: computed
        description: "step 6 of calculations.annual_report_mass_balance"
        constraints: "one of WITHIN_TOLERANCE, EXCEEDS_TOLERANCE"
      - name: total_n_applied_lbs
        type: number
        source: computed
        description: "round-then-sum total of LandApplicationEvent.n_applied_lbs over the report year"
      - name: total_p2o5_applied_lbs
        type: number
        source: computed
        description: "round-then-sum total of LandApplicationEvent.p2o5_applied_lbs over the report year"
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of submission
      - name: accepted_at
        type: datetime
        source: computed
        description: logical-clock instant of acceptance
      - name: return_reason
        type: string
        source: computed
        description: reason recorded by the reviewer when the report is returned
      - name: report_status
        type: enum
        source: computed
        description: cyclic report lifecycle state
        constraints: "one of DRAFT, SUBMITTED, ACCEPTED, RETURNED"

state_machines:
  - entity: Permit
    initial_state: DRAFT_APPLICATION
    terminal_states: [EXPIRED]
    note: |
      Parallel state dimensions on one row. The coverage dimension (coverage_status) and the
      compliance dimension (compliance_status) advance independently: coverage transitions never
      write compliance_status, and compliance transitions never write coverage_status.
      compliance_status is initialised to IN_GOOD_STANDING at creation and is driven only by
      Inspection transitions on the same operation. The coverage-term constants used by the
      coverage transitions are declared in calculations.permit_renewal_fee.constants:
      COVERAGE_TERM_YEARS = 5, RENEWAL_WINDOW_DAYS = 180, RENEWAL_DUE_DAYS = 90. All three are
      applied in UTC whole days, so effective_on 2026-01-01 yields expiration_on 2031-01-01,
      renewal_window_opens_on 2030-07-05 and renewal_due_on 2030-10-03.
    transitions:
      - from: DRAFT_APPLICATION
        to: SUBMITTED
        trigger: "POST /cafo/permits/{id}/submit"
        actor: Operator
        preconditions:
          - "Operation.permit_required == true"
          - "no other Permit of the same operation has coverage_status IN {SUBMITTED, COVERED, RENEWAL_PENDING} whose half-open interval [effective_on, expiration_on) intersects this application's requested interval"
        side_effects:
          - "sets coverage_status = SUBMITTED"
          - "leaves compliance_status unchanged"
        note: "coverage dimension"
      - from: SUBMITTED
        to: COVERED
        trigger: "POST /cafo/permits/{id}/issue-coverage"
        actor: StateReviewer
        preconditions:
          - "Operation.compliance_posture != SUSPENDED"
        side_effects:
          - "sets coverage_status = COVERED"
          - "stamps expiration_on = effective_on + COVERAGE_TERM_YEARS"
          - "stamps renewal_window_opens_on = expiration_on - RENEWAL_WINDOW_DAYS"
          - "stamps renewal_due_on = expiration_on - RENEWAL_DUE_DAYS"
        note: "coverage dimension"
      - from: COVERED
        to: RENEWAL_PENDING
        trigger: "POST /cafo/permits/{id}/initiate-renewal"
        actor: Operator
        preconditions:
          - "logical clock >= renewal_window_opens_on"
        side_effects:
          - "sets coverage_status = RENEWAL_PENDING"
          - "stamps renewal_submitted_at = logical clock"
          - "sets is_late_renewal = (renewal_submitted_at > renewal_due_on)"
          - "runs calculations.permit_renewal_fee and writes gross_fee, conservation_discount_pct, conservation_discount_amount, net_fee, late_surcharge_amount, total_due"
        note: "coverage dimension"
      - from: RENEWAL_PENDING
        to: COVERED
        trigger: "POST /cafo/permits/{id}/complete-renewal"
        actor: StateReviewer
        preconditions:
          - "Operation.compliance_posture != SUSPENDED"
          - "the operation has at least one NutrientManagementPlan with plan_status == APPROVED"
        side_effects:
          - "sets coverage_status = COVERED"
          - "advances effective_on to the prior expiration_on and expiration_on to effective_on + COVERAGE_TERM_YEARS"
          - "recomputes renewal_window_opens_on and renewal_due_on from the new expiration_on"
        note: "coverage dimension; closes the coverage cycle COVERED -> RENEWAL_PENDING -> COVERED"
      - from: COVERED
        to: EXPIRED
        trigger: "system event: POST /cafo/_clock/set_current_utc advances the logical clock to or past expiration_on"
        actor: system
        preconditions:
          - "logical clock >= expiration_on"
        side_effects:
          - "sets coverage_status = EXPIRED"
        note: "coverage dimension; half-open interval means an instant exactly equal to expiration_on is already outside coverage"
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system event: POST /cafo/_clock/set_current_utc advances the logical clock to or past expiration_on"
        actor: system
        preconditions:
          - "logical clock >= expiration_on"
        side_effects:
          - "sets coverage_status = EXPIRED"
        note: "coverage dimension; an unfinished renewal does not extend coverage"
      - from: IN_GOOD_STANDING
        to: NOTICE_ISSUED
        trigger: "system event: cascade hop 1 of POST /cafo/inspections/{id}/issue-nov"
        actor: system
        preconditions:
          - "the issuing Inspection.permit_id == this Permit.id"
        side_effects:
          - "sets compliance_status = NOTICE_ISSUED"
          - "cascade hop 2: because compliance_status is now NOTICE_ISSUED, Operation.compliance_posture is recomputed by calculations.operation_compliance_posture and becomes RESTRICTED"
          - "leaves coverage_status unchanged"
        note: "compliance dimension"
      - from: NOTICE_ISSUED
        to: CORRECTIVE_ACTION
        trigger: "system event: caused by POST /cafo/inspections/{id}/submit-response"
        actor: system
        preconditions:
          - "the responding Inspection.permit_id == this Permit.id"
        side_effects:
          - "sets compliance_status = CORRECTIVE_ACTION"
          - "Operation.compliance_posture stays RESTRICTED because CORRECTIVE_ACTION is also a restricting compliance_status"
        note: "compliance dimension"
      - from: CORRECTIVE_ACTION
        to: IN_GOOD_STANDING
        trigger: "system event: caused by POST /cafo/inspections/{id}/close"
        actor: system
        preconditions:
          - "the closing Inspection.permit_id == this Permit.id"
          - "no other Inspection of the same operation has inspection_status IN {NOV_ISSUED, RESPONSE_SUBMITTED}"
        side_effects:
          - "sets compliance_status = IN_GOOD_STANDING"
          - "Operation.compliance_posture is recomputed and returns to OPEN when no other restricting condition holds"
        note: "compliance dimension; closes the compliance cycle IN_GOOD_STANDING -> NOTICE_ISSUED -> CORRECTIVE_ACTION -> IN_GOOD_STANDING"

  - entity: NutrientManagementPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /cafo/nutrient-plans/{id}/certify"
        actor: CertifiedPlanner
        preconditions:
          - "the plan's Permit has coverage_status IN {COVERED, RENEWAL_PENDING}"
          - "at least one FieldNutrientBudget exists with plan_id == this plan"
          - "Operation.design_storage_days >= MIN_STORAGE_DAYS"
        side_effects:
          - "sets plan_status = CERTIFIED"
          - "stamps certifying_planner_user_id = X-User-ID and certified_at = logical clock"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /cafo/nutrient-plans/{id}/submit"
        actor: Operator
        preconditions:
          - "certifying_planner_user_id is not null"
        side_effects:
          - "sets plan_status = SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cafo/nutrient-plans/{id}/approve"
        actor: StateReviewer
        preconditions:
          - "Operation.compliance_posture == OPEN"
        side_effects:
          - "sets plan_status = APPROVED and stamps approved_at = logical clock"
          - "sets budget_status = ACTIVE on every FieldNutrientBudget with plan_id == this plan"
          - "when supersedes_plan_id is not null, transitions the referenced plan APPROVED -> SUPERSEDED"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /cafo/nutrient-plans/{id}/require-revision"
        actor: StateReviewer
        preconditions:
          - "plan_status == SUBMITTED"
        side_effects:
          - "sets plan_status = REVISION_REQUIRED and increments revision_count by 1"
      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "system event: cascade hop 3 of any transition that recomputes Operation.compliance_posture to RESTRICTED or SUSPENDED"
        actor: system
        preconditions:
          - "Operation.compliance_posture IN {RESTRICTED, SUSPENDED}"
        side_effects:
          - "sets plan_status = REVISION_REQUIRED and increments revision_count by 1"
          - "cascade hop 4: because the plan has left APPROVED, every FieldNutrientBudget with plan_id == this plan is set to budget_status = LOCKED; allowable_total_gallons, applied_gallons_to_date and remaining_gallons are left untouched so the budget ledger invariant is preserved"
        note: "plan revision trigger; this is hop 3 of both declared cascades"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: caused by POST /cafo/nutrient-plans/{id}/approve on a newer plan whose supersedes_plan_id references this plan"
        actor: system
        preconditions:
          - "the newer plan has the same operation_id"
        side_effects:
          - "sets plan_status = SUPERSEDED"
          - "sets budget_status = LOCKED on every FieldNutrientBudget with plan_id == this plan"
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "PATCH /cafo/nutrient-plans/{id}"
        actor: CertifiedPlanner
        preconditions:
          - "plan_status IN {DRAFT, REVISION_REQUIRED}"
        side_effects:
          - "sets plan_status = DRAFT"
          - "clears certifying_planner_user_id and certified_at"
        note: "closes the plan cycle DRAFT -> CERTIFIED -> SUBMITTED -> APPROVED -> REVISION_REQUIRED -> DRAFT"

  - entity: ManureStorage
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: FREEBOARD_ALERT
        trigger: "system event: cascade hop 1 of POST /cafo/storage-inspections"
        actor: system
        preconditions:
          - "the new StorageInspection has freeboard_deficit_in > 0"
          - "the new StorageInspection has measured_freeboard_in > OVERFLOW_FREEBOARD_IN"
        side_effects:
          - "sets storage_status = FREEBOARD_ALERT"
          - "cascade hop 2: because storage_status is now FREEBOARD_ALERT, Operation.compliance_posture is recomputed by calculations.operation_compliance_posture and becomes RESTRICTED"
      - from: IN_SERVICE
        to: OVERFLOW_IMMINENT
        trigger: "system event: caused by POST /cafo/storage-inspections"
        actor: system
        preconditions:
          - "the new StorageInspection has measured_freeboard_in <= OVERFLOW_FREEBOARD_IN"
        side_effects:
          - "sets storage_status = OVERFLOW_IMMINENT"
          - "Operation.compliance_posture is recomputed and becomes SUSPENDED"
      - from: FREEBOARD_ALERT
        to: OVERFLOW_IMMINENT
        trigger: "system event: caused by POST /cafo/storage-inspections"
        actor: system
        preconditions:
          - "the new StorageInspection has measured_freeboard_in <= OVERFLOW_FREEBOARD_IN"
        side_effects:
          - "sets storage_status = OVERFLOW_IMMINENT"
          - "Operation.compliance_posture is recomputed and becomes SUSPENDED"
      - from: FREEBOARD_ALERT
        to: IN_SERVICE
        trigger: "POST /cafo/manure-storages/{id}/return-to-service"
        actor: Operator
        preconditions:
          - "the StorageInspection with the greatest inspected_on for this structure, tie-broken by greatest created_at, has freeboard_deficit_in == 0 and visual_condition == NORMAL"
        side_effects:
          - "sets storage_status = IN_SERVICE"
          - "Operation.compliance_posture is recomputed and returns to OPEN when no other restricting condition holds"
        note: "closes the structure cycle IN_SERVICE -> FREEBOARD_ALERT -> IN_SERVICE"
      - from: OVERFLOW_IMMINENT
        to: IN_SERVICE
        trigger: "POST /cafo/manure-storages/{id}/return-to-service"
        actor: Operator
        preconditions:
          - "the StorageInspection with the greatest inspected_on for this structure, tie-broken by greatest created_at, has freeboard_deficit_in == 0 and visual_condition == NORMAL"
        side_effects:
          - "sets storage_status = IN_SERVICE"
          - "Operation.compliance_posture is recomputed and returns to OPEN when no other restricting condition holds"

  - entity: LandApplicationEvent
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /cafo/application-events/{id}/verify"
        actor: CertifiedPlanner
        preconditions:
          - "the owning NutrientManagementPlan has plan_status == APPROVED"
        side_effects:
          - "sets event_status = VERIFIED"
          - "leaves FieldNutrientBudget.applied_gallons_to_date and ManureStorage.cumulative_outflow_gallons unchanged because both input sets already include RECORDED and VERIFIED events"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /cafo/application-events/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "event_status != VOIDED"
        side_effects:
          - "sets event_status = VOIDED"
          - "credits FieldNutrientBudget.applied_gallons_to_date down by gallons_applied and recomputes remaining_gallons, restoring the invariant applied_gallons_to_date + remaining_gallons == allowable_total_gallons"
          - "credits ManureStorage.cumulative_outflow_gallons down by gallons_applied and recomputes current_volume_gallons and available_capacity_gallons, restoring the invariant cumulative_intake_gallons + precipitation_adjustment_gallons - cumulative_outflow_gallons == current_volume_gallons"
          - "recomputes Field.last_application_on from the remaining non-voided events"
        note: "compensating action for both conserved quantities"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /cafo/application-events/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "event_status != VOIDED"
        side_effects:
          - "identical to the RECORDED -> VOIDED compensation"

  - entity: ManureTransfer
    initial_state: INITIATED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INITIATED
        to: ACKNOWLEDGED
        trigger: "POST /cafo/manure-transfers/{id}/acknowledge"
        actor: Hauler
        preconditions:
          - "nutrient_analysis_provided == true"
          - "Hauler.hauler_status == ACTIVE"
        side_effects:
          - "sets transfer_status = ACKNOWLEDGED and stamps recipient_ack_signed_at = logical clock"
          - "releases committed_outflow_gallons on the source ManureStorage by gallons_transferred and adds the same amount to cumulative_outflow_gallons, recomputing current_volume_gallons and available_capacity_gallons"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /cafo/manure-transfers/{id}/complete"
        actor: Hauler
        preconditions:
          - "recipient_ack_signed_at is not null"
        side_effects:
          - "sets transfer_status = COMPLETED"
      - from: INITIATED
        to: SUSPENDED
        trigger: "system event: cascade hop 4 of any transition that recomputes Operation.compliance_posture to RESTRICTED or SUSPENDED"
        actor: system
        preconditions:
          - "Operation.compliance_posture IN {RESTRICTED, SUSPENDED}"
        side_effects:
          - "sets transfer_status = SUSPENDED"
          - "cascade hop 5: releases committed_outflow_gallons on the source ManureStorage by gallons_transferred and recomputes available_capacity_gallons and days_of_storage_available"
        note: "applied to matching transfers in ascending created_at order"
      - from: SUSPENDED
        to: INITIATED
        trigger: "POST /cafo/manure-transfers/{id}/resume"
        actor: Operator
        preconditions:
          - "Operation.compliance_posture == OPEN"
          - "Hauler.hauler_status == ACTIVE"
          - "gallons_transferred <= ManureStorage.current_volume_gallons - ManureStorage.committed_outflow_gallons"
        side_effects:
          - "sets transfer_status = INITIATED"
          - "re-commits committed_outflow_gallons on the source ManureStorage by gallons_transferred"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /cafo/manure-transfers/{id}/cancel"
        actor: Operator
        preconditions:
          - "transfer_status IN {INITIATED, SUSPENDED}"
        side_effects:
          - "sets transfer_status = CANCELLED"
          - "releases committed_outflow_gallons on the source ManureStorage by gallons_transferred, restoring available_capacity_gallons to its pre-transfer value"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /cafo/manure-transfers/{id}/cancel"
        actor: Operator
        preconditions:
          - "transfer_status IN {INITIATED, SUSPENDED}"
        side_effects:
          - "sets transfer_status = CANCELLED"
          - "leaves committed_outflow_gallons unchanged because suspension already released it"

  - entity: IncidentReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: NOTIFIED
        trigger: "POST /cafo/incident-reports/{id}/record-oral-notification"
        actor: Operator
        preconditions:
          - "requires_oral_notification == true"
        side_effects:
          - "sets incident_status = NOTIFIED"
          - "stamps oral_notified_at = logical clock and sets notification_late = (oral_notified_at > oral_notification_deadline_at)"
      - from: NOTIFIED
        to: WRITTEN_SUBMITTED
        trigger: "POST /cafo/incident-reports/{id}/submit-written-report"
        actor: Operator
        preconditions:
          - "oral_notified_at is not null"
        side_effects:
          - "sets incident_status = WRITTEN_SUBMITTED"
      - from: OPEN
        to: CLOSED
        trigger: "POST /cafo/incident-reports/{id}/close"
        actor: StateReviewer
        preconditions:
          - "requires_oral_notification == false"
        side_effects:
          - "sets incident_status = CLOSED"
          - "recomputes Operation.open_discharge_incident_count and Operation.compliance_posture"
        note: "an incident below the notification threshold may be closed without any notification step"
      - from: WRITTEN_SUBMITTED
        to: CLOSED
        trigger: "POST /cafo/incident-reports/{id}/close"
        actor: StateReviewer
        preconditions:
          - "incident_status == WRITTEN_SUBMITTED"
        side_effects:
          - "sets incident_status = CLOSED"
          - "recomputes Operation.open_discharge_incident_count and Operation.compliance_posture, which returns to OPEN when no other restricting condition holds"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    note: |
      RESPONSE_DAYS = 30. It is declared only here and is used by exactly one side effect,
      response_due_on = conducted_on + 30 days, so an inspection conducted at 2026-08-01T00:00:00Z
      and served with a notice of violation is due a response by 2026-08-31T00:00:00Z.
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /cafo/inspections/{id}/conduct"
        actor: StateReviewer
        preconditions:
          - "the Inspection's Permit has coverage_status IN {COVERED, RENEWAL_PENDING}"
        side_effects:
          - "sets inspection_status = CONDUCTED"
          - "stamps inspector_user_id = X-User-ID, conducted_on = logical clock, findings_count and deficiency_categories from the request"
      - from: CONDUCTED
        to: NOV_ISSUED
        trigger: "POST /cafo/inspections/{id}/issue-nov"
        actor: StateReviewer
        preconditions:
          - "findings_count >= 1"
        side_effects:
          - "sets inspection_status = NOV_ISSUED and stamps response_due_on = conducted_on + RESPONSE_DAYS"
          - "increments Operation.open_finding_count"
          - "cascade hop 1: transitions the Inspection's Permit compliance dimension IN_GOOD_STANDING -> NOTICE_ISSUED"
        note: "origin of cascade B"
      - from: CONDUCTED
        to: CLOSED
        trigger: "POST /cafo/inspections/{id}/close"
        actor: StateReviewer
        preconditions:
          - "findings_count == 0"
          - "X-User-ID != inspector_user_id"
        side_effects:
          - "sets inspection_status = CLOSED and stamps closed_by_user_id = X-User-ID"
      - from: NOV_ISSUED
        to: RESPONSE_SUBMITTED
        trigger: "POST /cafo/inspections/{id}/submit-response"
        actor: Operator
        preconditions:
          - "inspection_status == NOV_ISSUED"
        side_effects:
          - "sets inspection_status = RESPONSE_SUBMITTED and stores corrective_action_summary"
          - "transitions the Inspection's Permit compliance dimension NOTICE_ISSUED -> CORRECTIVE_ACTION"
      - from: RESPONSE_SUBMITTED
        to: CLOSED
        trigger: "POST /cafo/inspections/{id}/close"
        actor: StateReviewer
        preconditions:
          - "X-User-ID != inspector_user_id"
        side_effects:
          - "sets inspection_status = CLOSED and stamps closed_by_user_id = X-User-ID"
          - "decrements Operation.open_finding_count"
          - "transitions the Inspection's Permit compliance dimension CORRECTIVE_ACTION -> IN_GOOD_STANDING when no other Inspection of the operation has inspection_status IN {NOV_ISSUED, RESPONSE_SUBMITTED}"
          - "recomputes Operation.compliance_posture"

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cafo/annual-reports/{id}/submit"
        actor: Operator
        preconditions:
          - "variance_classification == WITHIN_TOLERANCE or variance_explanation is a non-empty string"
        side_effects:
          - "recomputes calculations.annual_report_mass_balance over the current record set"
          - "sets report_status = SUBMITTED and stamps submitted_at = logical clock"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cafo/annual-reports/{id}/accept"
        actor: StateReviewer
        preconditions:
          - "report_status == SUBMITTED"
        side_effects:
          - "sets report_status = ACCEPTED and stamps accepted_at = logical clock"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /cafo/annual-reports/{id}/return"
        actor: StateReviewer
        preconditions:
          - "report_status == SUBMITTED"
        side_effects:
          - "sets report_status = RETURNED and stores return_reason"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /cafo/annual-reports/{id}/submit"
        actor: Operator
        preconditions:
          - "variance_classification == WITHIN_TOLERANCE or variance_explanation is a non-empty string"
        side_effects:
          - "recomputes calculations.annual_report_mass_balance over the current record set"
          - "sets report_status = SUBMITTED and re-stamps submitted_at = logical clock"
        note: "closes the report cycle SUBMITTED -> RETURNED -> SUBMITTED"

concurrency_rules:
  - rule_id: plan-create-stale-operation
    parent_entity: Operation
    write_endpoint: "POST /cafo/nutrient-plans"
    occ_field: "expected_operation_version"
    description: |
      Creating a NutrientManagementPlan against an Operation whose version has advanced since the
      client last observed it is rejected with a stale-version error. A new plan may legitimately
      carry supersedes_plan_id and displace the operation's current approved plan, so the create
      itself is always semantically valid; the version check is what forces the writer to have
      observed the operation's current herd size, storage days and compliance posture before
      filing a plan against it.
    error_id: ERR_STALE_OPERATION_VERSION
    http_status: 412

calculations:
  - name: operation_animal_units_and_class
    trigger: "on POST /cafo/operations and on PATCH /cafo/operations/{id}; also re-run by POST /cafo/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      au_factor =
        DAIRY_COW        -> 1.4
        BEEF_FEEDER      -> 1.0
        SWINE_FINISHING  -> 0.4
        LAYER_HEN        -> 0.033 when manure_handling == LIQUID, 0.0125 when manure_handling == DRY
      animal_units = round_half_up(head_count * au_factor, 2)

      size_class =
        LARGE  when animal_units >= LARGE_AU_THRESHOLD
        MEDIUM when animal_units >= MEDIUM_AU_THRESHOLD and animal_units < LARGE_AU_THRESHOLD
        SMALL  otherwise

      permit_required =
        true                                                  when size_class == LARGE
        discharge_potential IN {STORMWATER_ONLY, CONTINUOUS}   when size_class == MEDIUM
        discharge_potential == CONTINUOUS                      when size_class == SMALL
    input_set: "the single Operation row being written; no other entity participates"
    constants:
      LARGE_AU_THRESHOLD: 1000
      MEDIUM_AU_THRESHOLD: 300
      AU_FACTOR_DAIRY_COW: 1.4
      AU_FACTOR_BEEF_FEEDER: 1.0
      AU_FACTOR_SWINE_FINISHING: 0.4
      AU_FACTOR_LAYER_HEN_LIQUID: 0.033
      AU_FACTOR_LAYER_HEN_DRY: 0.0125
    precision: "animal_units to 2 decimal places, round_half_up; thresholds are inclusive lower bounds (>=), so animal_units exactly 1000.00 is LARGE"

  - name: operation_manure_production
    trigger: "on POST /cafo/operations, on PATCH /cafo/operations/{id}, and on POST /cafo/_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      # DESIGN_BASIS (writes Operation.design_annual_manure_gallons and daily_production_gallons)
      per_head_annual_gal =
        DAIRY_COW -> 9000, BEEF_FEEDER -> 3600, SWINE_FINISHING -> 1400, LAYER_HEN -> 30
      dilution_factor = 1.15 when manure_handling == LIQUID, 1.0 when manure_handling == DRY
      lot_precipitation_gallons = round_half_up(open_lot_area_sqft * NET_PRECIP_FT * GAL_PER_CUFT, 2)
      design_annual_manure_gallons =
        round_half_up(head_count * per_head_annual_gal * dilution_factor + lot_precipitation_gallons, 2)
      daily_production_gallons = round_half_up(design_annual_manure_gallons / DAYS_PER_YEAR, 2)

      # RECORDS_BASIS (writes Operation.recorded_annual_manure_gallons)
      year = calendar year (UTC) of the logical clock
      recorded_annual_manure_gallons =
        sum of LandApplicationEvent.gallons_applied over events whose owning plan has
          operation_id == this operation, event_status IN {RECORDED, VERIFIED},
          and calendar year (UTC) of applied_on == year
        + sum of ManureTransfer.gallons_transferred over transfers whose operation_id == this
          operation, transfer_status IN {ACKNOWLEDGED, COMPLETED},
          and calendar year (UTC) of transferred_on == year
    input_set: |
      DESIGN_BASIS reads only the Operation row's own input fields and is independent of any record.
      RECORDS_BASIS reads LandApplicationEvent rows with event_status IN {RECORDED, VERIFIED}
      (VOIDED excluded) and ManureTransfer rows with transfer_status IN {ACKNOWLEDGED, COMPLETED}
      (INITIATED, SUSPENDED and CANCELLED excluded), both filtered to the clock's calendar year.
    constants:
      PER_HEAD_ANNUAL_GAL_DAIRY_COW: 9000
      PER_HEAD_ANNUAL_GAL_BEEF_FEEDER: 3600
      PER_HEAD_ANNUAL_GAL_SWINE_FINISHING: 1400
      PER_HEAD_ANNUAL_GAL_LAYER_HEN: 30
      DILUTION_FACTOR_LIQUID: 1.15
      DILUTION_FACTOR_DRY: 1.0
      NET_PRECIP_FT: 0.9
      GAL_PER_CUFT: 7.4805
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up"
    variants:
      - name: DESIGN_BASIS
        when: "the permit application, the nutrient management plan and the annual report mass-balance expectation all use the design estimate"
        difference: "derives volume from head_count, per-head coefficients, the liquid dilution factor and open-lot precipitation; ignores every recorded application and transfer"
      - name: RECORDS_BASIS
        when: "GET /cafo/operations/{id}/nutrient-summary with basis=RECORDS_BASIS and the annual report's recorded totals"
        difference: "derives volume from the persisted application and transfer records for the clock's calendar year; ignores head_count entirely, so a herd change does not move it and a voided event does"

  - name: field_setback_and_net_acres
    trigger: "on POST /cafo/fields"
    algorithm: threshold
    formula: |
      base_setback_ft =
        SETBACK_TILE_INLET_FT                    when has_tile_inlet == true
        SETBACK_NEAR_WATER_FT                    when has_tile_inlet == false and distance_to_water_ft <= NEAR_WATER_FT
        SETBACK_BASE_FT                          otherwise
      slope_adder_ft = SETBACK_SLOPE_ADDER_FT when slope_pct > SETBACK_SLOPE_THRESHOLD_PCT else 0
      required_setback_ft = base_setback_ft + slope_adder_ft
      excluded_acres = round_half_up(required_setback_ft * water_frontage_ft / SQFT_PER_ACRE, 2)
      net_applicable_acres = round_half_up(total_acres - excluded_acres, 2)
    input_set: "the single Field row being written"
    constants:
      SETBACK_TILE_INLET_FT: 300
      SETBACK_NEAR_WATER_FT: 200
      SETBACK_BASE_FT: 100
      NEAR_WATER_FT: 200
      SETBACK_SLOPE_ADDER_FT: 100
      SETBACK_SLOPE_THRESHOLD_PCT: 6
      SQFT_PER_ACRE: 43560
    precision: "2 decimal places, round_half_up; the slope adder uses a strict > comparison, so slope_pct exactly 6 adds nothing"

  - name: soil_test_p_index
    trigger: "on POST /cafo/soil-tests; is_valid re-evaluated on read and on POST /cafo/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      p_index = round_half_up(soil_test_p_ppm * (1 + Field.slope_pct / 100.0), 2)
      p_index_category =
        VERY_HIGH when p_index >= P_INDEX_VERY_HIGH
        HIGH      when p_index >= P_INDEX_HIGH and p_index < P_INDEX_VERY_HIGH
        MEDIUM    when p_index >= P_INDEX_MEDIUM and p_index < P_INDEX_HIGH
        LOW       otherwise
      is_valid = logical_clock < sampled_on + SOIL_TEST_VALIDITY_YEARS
    input_set: "the SoilTest row being written joined to its parent Field via SoilTest.field_id for slope_pct"
    constants:
      P_INDEX_MEDIUM: 20
      P_INDEX_HIGH: 50
      P_INDEX_VERY_HIGH: 100
      SOIL_TEST_VALIDITY_YEARS: 4
    precision: "p_index to 2 decimal places, round_half_up; category boundaries are inclusive lower bounds, so p_index exactly 50.00 is HIGH"

  - name: budget_allowable_rate
    trigger: "on POST /cafo/field-budgets"
    algorithm: tiered_pricing
    formula: |
      # combinatorial formula, mode (a): >= 3 inputs with non-linear interaction through a
      # tier lookup, two independent limits and a min() selection. Evaluation order is fixed
      # 1 -> 9 and every step is persisted.
      group = DAIRY when Operation.animal_type == DAIRY_COW
              BEEF  when Operation.animal_type == BEEF_FEEDER
              SWINE when Operation.animal_type == SWINE_FINISHING
              LAYER when Operation.animal_type == LAYER_HEN

      1. crop_n_need_lbs      = round_half_up(CROP_N_PER_UNIT[crop] * yield_goal, 2)
      2. legume_credit_lbs    = LEGUME_CREDIT_LBS[previous_crop]            # 0 when absent
      3. adjusted_n_need_lbs  = max(0, round_half_up(crop_n_need_lbs - legume_credit_lbs, 2))
      4. crop_p_removal_lbs   = round_half_up(CROP_P_PER_UNIT[crop] * yield_goal, 2)
      5. p_allowance_lbs      = round_half_up(crop_p_removal_lbs * P_INDEX_MULTIPLIER[SoilTest.p_index_category], 2)
      6. available_n_per_1000gal = round_half_up(MANURE_N_LBS_PER_1000GAL[group] * N_AVAILABILITY[planned_application_method], 2)
         allowable_n_rate_gal_per_acre = floor_to_100(adjusted_n_need_lbs / available_n_per_1000gal * 1000)
      7. allowable_p_rate_gal_per_acre = floor_to_100(p_allowance_lbs / MANURE_P2O5_LBS_PER_1000GAL[group] * 1000)
      8. allowable_rate_gal_per_acre = min(allowable_n_rate_gal_per_acre, allowable_p_rate_gal_per_acre)
         binding_basis = NITROGEN when allowable_n_rate_gal_per_acre <= allowable_p_rate_gal_per_acre else PHOSPHORUS
      9. allowable_total_gallons = floor(allowable_rate_gal_per_acre * Field.net_applicable_acres)
         applied_gallons_to_date = 0
         remaining_gallons = allowable_total_gallons

      floor_to_100(x) = floor(x / 100) * 100
    input_set: |
      the FieldNutrientBudget row being written, joined to Field (net_applicable_acres) via field_id,
      to SoilTest (p_index_category) via soil_test_id, and to Operation (animal_type) via the owning
      plan's operation_id. Only the SoilTest named by soil_test_id participates; other soil tests on
      the same field are ignored.
    constants:
      CROP_N_PER_UNIT: { CORN_GRAIN: 1.1, SOYBEAN: 0, ALFALFA: 0, GRASS_HAY: 45 }
      CROP_P_PER_UNIT: { CORN_GRAIN: 0.37, SOYBEAN: 0.8, ALFALFA: 12, GRASS_HAY: 13 }
      LEGUME_CREDIT_LBS: { SOYBEAN: 40, ALFALFA: 100, CORN_GRAIN: 0, GRASS_HAY: 0, NONE: 0 }
      P_INDEX_MULTIPLIER: { LOW: 4.0, MEDIUM: 2.0, HIGH: 1.0, VERY_HIGH: 0.0 }
      MANURE_N_LBS_PER_1000GAL: { DAIRY: 24, BEEF: 32, SWINE: 40, LAYER: 60 }
      MANURE_P2O5_LBS_PER_1000GAL: { DAIRY: 10, BEEF: 16, SWINE: 28, LAYER: 45 }
      N_AVAILABILITY: { INJECTION: 0.65, INCORPORATED_24H: 0.55, SURFACE_BROADCAST: 0.40, IRRIGATION: 0.35 }
    precision: |
      lbs values to 2 decimal places, round_half_up. Rates are floored to the nearest 100 gallons
      per acre (never rounded up). allowable_total_gallons is floored to a whole gallon. When
      allowable_rate_gal_per_acre evaluates to 0 the budget is rejected with ERR_ZERO_ALLOWABLE_RATE.

  - name: application_event_nutrient_load
    trigger: "on POST /cafo/application-events (APPLICATION context) and on POST /cafo/manure-transfers (TRANSFER context)"
    algorithm: aggregation
    formula: |
      # combinatorial formula, mode (b): the rounding order is pinned to ROUND-PER-EVENT-THEN-SUM.
      # Each event's nutrient mass is rounded to 2 decimals and PERSISTED; every annual total is the
      # sum of those persisted values. Summing raw unrounded values and rounding once at the end is
      # explicitly NOT the pinned order and produces different totals.
      group = same mapping as calculations.budget_allowable_rate

      # APPLICATION context (LandApplicationEvent) - plant-available nitrogen
      rate_gal_per_acre = round_half_up(gallons_applied / acres_treated, 2)
      n_applied_lbs   = round_half_up(gallons_applied / 1000 * MANURE_N_LBS_PER_1000GAL[group] * N_AVAILABILITY[application_method], 2)
      p2o5_applied_lbs = round_half_up(gallons_applied / 1000 * MANURE_P2O5_LBS_PER_1000GAL[group], 2)

      # TRANSFER context (ManureTransfer) - TOTAL nitrogen, no availability factor, because the
      # receiving party makes its own availability assumption
      recipient_n_lbs    = round_half_up(gallons_transferred / 1000 * MANURE_N_LBS_PER_1000GAL[group], 2)
      recipient_p2o5_lbs = round_half_up(gallons_transferred / 1000 * MANURE_P2O5_LBS_PER_1000GAL[group], 2)

      # annual roll-up (AnnualReport.total_n_applied_lbs, total_p2o5_applied_lbs)
      total_n_applied_lbs = sum of the PERSISTED LandApplicationEvent.n_applied_lbs values
      total_p2o5_applied_lbs = sum of the PERSISTED LandApplicationEvent.p2o5_applied_lbs values
    input_set: |
      per-event: the single row being written, joined to Operation for animal_type.
      annual roll-up: LandApplicationEvent rows whose owning plan has operation_id == the report's
      operation_id, event_status IN {RECORDED, VERIFIED}, and calendar year (UTC) of applied_on ==
      report_year. VOIDED events are excluded from the roll-up.
    constants:
      MANURE_N_LBS_PER_1000GAL: { DAIRY: 24, BEEF: 32, SWINE: 40, LAYER: 60 }
      MANURE_P2O5_LBS_PER_1000GAL: { DAIRY: 10, BEEF: 16, SWINE: 28, LAYER: 45 }
      N_AVAILABILITY: { INJECTION: 0.65, INCORPORATED_24H: 0.55, SURFACE_BROADCAST: 0.40, IRRIGATION: 0.35 }
    precision: "2 decimal places, round_half_up, applied per event before any summation (round-then-sum)"

  - name: storage_capacity_and_freeboard
    trigger: "on POST /cafo/manure-storages, on POST /cafo/manure-storages/{id}/intake and on POST /cafo/storage-inspections"
    algorithm: aggregation
    formula: |
      design_capacity_gallons    = round_half_up(surface_area_sqft * (total_depth_in / 12) * GAL_PER_CUFT, 2)
      freeboard_reserve_gallons  = round_half_up(surface_area_sqft * (required_freeboard_in / 12) * GAL_PER_CUFT, 2)
      operating_capacity_gallons = round_half_up(design_capacity_gallons - freeboard_reserve_gallons, 2)

      current_volume_gallons     = round_half_up(cumulative_intake_gallons + precipitation_adjustment_gallons - cumulative_outflow_gallons, 2)
      available_capacity_gallons = round_half_up(operating_capacity_gallons - current_volume_gallons - committed_outflow_gallons, 2)

      # on POST /cafo/storage-inspections the measured freeboard is converted back to a volume and
      # the difference is absorbed by precipitation_adjustment_gallons, which keeps the storage
      # volume-balance invariant exact
      liquid_depth_in            = ManureStorage.total_depth_in - measured_freeboard_in
      measured_volume_gallons    = round_half_up(surface_area_sqft * (liquid_depth_in / 12) * GAL_PER_CUFT, 2)
      freeboard_deficit_in       = round_half_up(max(0, ManureStorage.required_freeboard_in - measured_freeboard_in), 2)
      precipitation_adjustment_gallons_new =
        round_half_up(measured_volume_gallons - cumulative_intake_gallons + cumulative_outflow_gallons, 2)
      alert_raised = (freeboard_deficit_in > 0) or (visual_condition != NORMAL)
    input_set: |
      the ManureStorage row, its own cumulative counters, and for an inspection the single
      StorageInspection row being written. cumulative_outflow_gallons counts LandApplicationEvent
      rows with event_status IN {RECORDED, VERIFIED} and ManureTransfer rows with transfer_status
      IN {ACKNOWLEDGED, COMPLETED}; committed_outflow_gallons counts ManureTransfer rows with
      transfer_status == INITIATED.
    constants:
      GAL_PER_CUFT: 7.4805
      OVERFLOW_FREEBOARD_IN: 6
    precision: "2 decimal places, round_half_up; the volume-balance invariant cumulative_intake_gallons + precipitation_adjustment_gallons - cumulative_outflow_gallons == current_volume_gallons must hold exactly after every write"

  - name: storage_days_of_capacity
    trigger: "on POST /cafo/manure-storages, on POST /cafo/manure-storages/{id}/intake, on POST /cafo/storage-inspections, on every ManureTransfer transition and on POST /cafo/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      seasonal_factor =
        WINTER_SEASONAL_FACTOR when structure_type IN {EARTHEN_LAGOON, STACKING_PAD}
                              and the logical clock's UTC month IN {11, 12, 1, 2, 3}
        1.0 otherwise
      effective_daily_gallons = round_half_up(Operation.daily_production_gallons * seasonal_factor, 4)

      # AVAILABLE_BASIS -> ManureStorage.days_of_storage_available
      days_of_storage_available = floor(max(0, available_capacity_gallons) / effective_daily_gallons)

      # DESIGN_BASIS -> Operation.design_storage_days
      design_storage_days = floor(
        (sum of operating_capacity_gallons over every ManureStorage with operation_id == this operation)
        / effective_daily_gallons)
    input_set: |
      AVAILABLE_BASIS reads one ManureStorage row's available_capacity_gallons, which nets out
      current volume and committed transfers. DESIGN_BASIS sums operating_capacity_gallons over all
      ManureStorage rows of the operation regardless of storage_status and ignores current volume
      and commitments entirely. Both read Operation.daily_production_gallons (DESIGN_BASIS variant
      of calculations.operation_manure_production) and the logical clock's month.
    constants:
      WINTER_SEASONAL_FACTOR: 1.35
      MIN_STORAGE_DAYS: 180
    precision: "floored to a whole day; AVAILABLE_BASIS is clamped at 0 and never negative"
    variants:
      - name: AVAILABLE_BASIS
        when: "GET /cafo/manure-storages/{id}/capacity-projection with basis=AVAILABLE_BASIS and the persisted ManureStorage.days_of_storage_available"
        difference: "divides the remaining headroom (operating capacity minus current volume minus committed transfers) by the seasonally adjusted daily production, so it shrinks as the structure fills and grows when a transfer is suspended or cancelled"
      - name: DESIGN_BASIS
        when: "GET /cafo/manure-storages/{id}/capacity-projection with basis=DESIGN_BASIS, the persisted Operation.design_storage_days, and the MIN_STORAGE_DAYS precondition of plan certification"
        difference: "divides the full operating capacity of every structure by the same denominator, ignoring current contents, so it is invariant to intake and outflow and moves only with herd size, structure geometry and the clock's month"

  - name: permit_renewal_fee
    trigger: "on POST /cafo/permits/{id}/initiate-renewal"
    algorithm: tiered_pricing
    formula: |
      # combinatorial formula, mode (c): the discount tier is keyed on gross_fee while the late
      # surcharge is keyed on net_fee, so the value is only well defined once the evaluation order
      # is pinned. The pinned order is exactly 1 -> 6 below; keying the surcharge on gross_fee
      # instead produces a different total_due and is wrong.
      1. gross_fee = round_half_up(BASE_FEE[Operation.size_class] + Operation.animal_units * PER_AU_FEE, 2)
      2. conservation_discount_pct =
           0.00 when Operation.has_conservation_plan == false
           0.00 when gross_fee <  CONSERVATION_TIER_1_FLOOR
           0.05 when gross_fee >= CONSERVATION_TIER_1_FLOOR and gross_fee < CONSERVATION_TIER_2_FLOOR
           0.10 when gross_fee >= CONSERVATION_TIER_2_FLOOR
      3. conservation_discount_amount = round_half_up(gross_fee * conservation_discount_pct, 2)
      4. net_fee = round_half_up(gross_fee - conservation_discount_amount, 2)
      5. late_surcharge_amount = round_half_up(net_fee * LATE_SURCHARGE_PCT, 2) when is_late_renewal else 0.00
      6. total_due = round_half_up(net_fee + late_surcharge_amount, 2)
    input_set: "the Permit row being renewed joined to its Operation via operation_id for size_class, animal_units and has_conservation_plan"
    constants:
      BASE_FEE: { SMALL: 150, MEDIUM: 400, LARGE: 900 }
      PER_AU_FEE: 0.45
      CONSERVATION_TIER_1_FLOOR: 500
      CONSERVATION_TIER_2_FLOOR: 1500
      LATE_SURCHARGE_PCT: 0.25
      COVERAGE_TERM_YEARS: 5
      RENEWAL_WINDOW_DAYS: 180
      RENEWAL_DUE_DAYS: 90
    precision: "2 decimal places, round_half_up at every one of the six steps; tier floors are inclusive lower bounds"

  - name: annual_report_mass_balance
    trigger: "on POST /cafo/annual-reports and re-run on POST /cafo/annual-reports/{id}/submit"
    algorithm: aggregation
    formula: |
      1. recorded_land_applied_gallons = sum of LandApplicationEvent.gallons_applied over events whose
         owning plan has operation_id == this report's operation_id, event_status IN {RECORDED, VERIFIED},
         and calendar year (UTC) of applied_on == report_year
      2. recorded_transferred_gallons = sum of ManureTransfer.gallons_transferred over transfers whose
         operation_id == this report's operation_id, transfer_status IN {ACKNOWLEDGED, COMPLETED},
         and calendar year (UTC) of transferred_on == report_year
      3. recorded_total_gallons = round_half_up(
           recorded_land_applied_gallons + recorded_transferred_gallons
           + (ending_storage_gallons - beginning_storage_gallons), 2)
      4. mass_balance_expected_gallons = Operation.design_annual_manure_gallons
      5. variance_pct = round_half_up(
           (recorded_total_gallons - mass_balance_expected_gallons) / mass_balance_expected_gallons * 100, 2)
      6. variance_classification =
           WITHIN_TOLERANCE  when abs(variance_pct) <= VARIANCE_TOLERANCE_PCT
           EXCEEDS_TOLERANCE otherwise
      7. total_n_applied_lbs and total_p2o5_applied_lbs are the round-then-sum roll-ups defined in
         calculations.application_event_nutrient_load over the same event set as step 1
    input_set: |
      step 1 includes only LandApplicationEvent rows with event_status IN {RECORDED, VERIFIED}
      (VOIDED excluded); step 2 includes only ManureTransfer rows with transfer_status IN
      {ACKNOWLEDGED, COMPLETED} (INITIATED, SUSPENDED, CANCELLED excluded). Both windows are the
      whole calendar year report_year, boundaries inclusive on both ends
      (applied_on >= Jan 1 00:00:00Z of report_year and applied_on < Jan 1 00:00:00Z of report_year + 1).
      Summation order does not affect the result because every addend is already rounded.
    constants:
      VARIANCE_TOLERANCE_PCT: 15.00
    precision: "2 decimal places, round_half_up; the tolerance comparison is inclusive, so a variance_pct of exactly 15.00 or -15.00 is WITHIN_TOLERANCE"

  - name: operation_compliance_posture
    trigger: "on every write that changes Inspection.inspection_status, Permit.compliance_status, ManureStorage.storage_status or IncidentReport.incident_status, and on POST /cafo/_clock/set_current_utc"
    algorithm: constraint_propagation
    formula: |
      open_finding_count = count of Inspection rows with operation_id == this operation
                           and inspection_status IN {NOV_ISSUED, RESPONSE_SUBMITTED}
      open_discharge_incident_count = count of IncidentReport rows with operation_id == this operation,
                           incident_type IN {DISCHARGE, SPILL}
                           and incident_status IN {OPEN, NOTIFIED, WRITTEN_SUBMITTED}

      compliance_posture =
        SUSPENDED  when open_discharge_incident_count >= 1
                   or any ManureStorage of this operation has storage_status == OVERFLOW_IMMINENT
        RESTRICTED when open_finding_count >= 1
                   or any ManureStorage of this operation has storage_status == FREEBOARD_ALERT
                   or any Permit of this operation has compliance_status IN {NOTICE_ISSUED, CORRECTIVE_ACTION}
        OPEN       otherwise

      # propagation, applied in this fixed order whenever the recomputed posture is RESTRICTED or SUSPENDED
      step 1: every NutrientManagementPlan of this operation with plan_status == APPROVED
              transitions APPROVED -> REVISION_REQUIRED (which locks its budgets)
      step 2: every ManureTransfer of this operation with transfer_status == INITIATED,
              processed in ascending created_at order, transitions INITIATED -> SUSPENDED
              (which releases its committed_outflow_gallons)
      # the recomputation is idempotent: a posture that is already RESTRICTED and stays RESTRICTED
      # re-runs steps 1 and 2 and finds no candidate rows, so nothing changes
    input_set: "all Inspection, IncidentReport, ManureStorage and Permit rows with operation_id == this operation, filtered by the status sets above"
    constants:
      RESTRICTING_COMPLIANCE_STATUSES: [NOTICE_ISSUED, CORRECTIVE_ACTION]
      OPEN_FINDING_STATUSES: [NOV_ISSUED, RESPONSE_SUBMITTED]
      OPEN_INCIDENT_STATUSES: [OPEN, NOTIFIED, WRITTEN_SUBMITTED]
    precision: "integer counts; SUSPENDED is evaluated before RESTRICTED so a SUSPENDED posture is never downgraded by a concurrent finding"

  - name: incident_notification_deadlines
    trigger: "on POST /cafo/incident-reports"
    algorithm: threshold
    formula: |
      mortality_threshold_head = max(MORTALITY_MIN_HEAD, ceil(MORTALITY_PCT * Operation.head_count))

      requires_oral_notification =
        (reached_water == true or released_gallons >= RELEASE_NOTIFICATION_GALLONS)
             when incident_type IN {DISCHARGE, SPILL}
        (mortality_head_count >= mortality_threshold_head)
             when incident_type == MORTALITY

      oral_notification_deadline_at = discovered_at + ORAL_NOTIFICATION_HOURS   # null when not required
      written_report_deadline_at    = discovered_at + WRITTEN_REPORT_DAYS       # null when not required
      notification_late             = oral_notified_at > oral_notification_deadline_at   # strict >
    input_set: "the IncidentReport row being written joined to Operation via operation_id for head_count"
    constants:
      MORTALITY_MIN_HEAD: 2
      MORTALITY_PCT: 0.01
      RELEASE_NOTIFICATION_GALLONS: 1000
      ORAL_NOTIFICATION_HOURS: 24
      WRITTEN_REPORT_DAYS: 5
    precision: "whole head counts, ceil applied to the percentage term; deadline comparison is strict, so an oral notification recorded at exactly oral_notification_deadline_at is on time"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when X-User-Role == Operator, X-User-ID equals the Operation.id that owns the target resource; when X-User-Role == Hauler, X-User-ID equals the ManureTransfer.hauler_id of the target transfer"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include Operator or Hauler and whose target resolves to an operation-owned or hauler-assigned resource"
  - priority: 4
    category: auth
    check: "X-User-ID differs from Inspection.inspector_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cafo/inspections/{id}/close"
  - priority: 5
    category: existence
    check: "every id in the request path resolves to an existing row, validated left to right"
    error_id: ERR_OPERATION_NOT_FOUND
    http_status: 404
    applies_to: "all path-templated endpoints; the entity-specific NOT_FOUND code of the failing segment is returned"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in declaration order of the entity's fields"
    error_id: ERR_FIELD_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints that accept foreign keys; the entity-specific NOT_FOUND code of the failing field is returned"
  - priority: 7
    category: business_constraint
    check: "request body contains every required input field, no unknown fields, values match declared types, enum members and range constraints, and the polymorphic subject rule of IncidentReport holds (subject_storage_id required and subject_field_id null for DISCHARGE and SPILL, subject_field_id required and subject_storage_id null for MORTALITY)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 8
    category: state
    check: "expected_operation_version equals the current Operation.version"
    error_id: ERR_STALE_OPERATION_VERSION
    http_status: 412
    applies_to: "POST /cafo/nutrient-plans"
  - priority: 9
    category: state
    check: "the Permit is in a coverage_status from which the requested coverage transition is declared"
    error_id: ERR_PERMIT_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/permits/{id}/submit, POST /cafo/permits/{id}/issue-coverage, POST /cafo/permits/{id}/initiate-renewal, POST /cafo/permits/{id}/complete-renewal"
  - priority: 10
    category: state
    check: "the NutrientManagementPlan is in a plan_status from which the requested transition is declared"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /cafo/nutrient-plans/{id}, POST /cafo/nutrient-plans/{id}/certify, POST /cafo/nutrient-plans/{id}/submit, POST /cafo/nutrient-plans/{id}/approve, POST /cafo/nutrient-plans/{id}/require-revision, POST /cafo/field-budgets"
  - priority: 11
    category: state
    check: "the ManureStorage is in a storage_status from which the requested transition is declared; return-to-service additionally requires the latest StorageInspection to show freeboard_deficit_in == 0 and visual_condition == NORMAL"
    error_id: ERR_STORAGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/manure-storages/{id}/return-to-service"
  - priority: 12
    category: state
    check: "the LandApplicationEvent is not already in the terminal VOIDED state"
    error_id: ERR_EVENT_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /cafo/application-events/{id}/verify, POST /cafo/application-events/{id}/void"
  - priority: 13
    category: state
    check: "the ManureTransfer is in a transfer_status from which the requested transition is declared"
    error_id: ERR_TRANSFER_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/manure-transfers/{id}/acknowledge, POST /cafo/manure-transfers/{id}/complete, POST /cafo/manure-transfers/{id}/cancel, POST /cafo/manure-transfers/{id}/resume"
  - priority: 14
    category: state
    check: "the IncidentReport is in an incident_status from which the requested transition is declared, and close from OPEN is only declared when requires_oral_notification == false"
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/incident-reports/{id}/record-oral-notification, POST /cafo/incident-reports/{id}/submit-written-report, POST /cafo/incident-reports/{id}/close"
  - priority: 15
    category: state
    check: "the Inspection is in an inspection_status from which the requested transition is declared, and close from CONDUCTED is only declared when findings_count == 0"
    error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/inspections/{id}/conduct, POST /cafo/inspections/{id}/issue-nov, POST /cafo/inspections/{id}/submit-response, POST /cafo/inspections/{id}/close"
  - priority: 16
    category: state
    check: "the AnnualReport is in a report_status from which the requested transition is declared"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /cafo/annual-reports/{id}/submit, POST /cafo/annual-reports/{id}/accept, POST /cafo/annual-reports/{id}/return"
  - priority: 17
    category: state
    check: "the referenced Permit has coverage_status IN {COVERED, RENEWAL_PENDING}"
    error_id: ERR_PERMIT_COVERAGE_REQUIRED
    http_status: 409
    applies_to: "POST /cafo/nutrient-plans/{id}/certify, POST /cafo/inspections/{id}/conduct"
  - priority: 18
    category: state
    check: "the operation's Permit has coverage_status != EXPIRED"
    error_id: ERR_PERMIT_COVERAGE_EXPIRED
    http_status: 409
    applies_to: "POST /cafo/application-events, POST /cafo/manure-transfers"
  - priority: 19
    category: state
    check: "the referenced NutrientManagementPlan has plan_status == APPROVED"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cafo/application-events, POST /cafo/application-events/{id}/verify"
  - priority: 20
    category: state
    check: "the referenced FieldNutrientBudget has budget_status == ACTIVE"
    error_id: ERR_BUDGET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cafo/application-events"
  - priority: 21
    category: state
    check: "Operation.compliance_posture != SUSPENDED"
    error_id: ERR_OPERATION_SUSPENDED
    http_status: 409
    applies_to: "POST /cafo/application-events, POST /cafo/manure-transfers, POST /cafo/manure-storages/{id}/intake, POST /cafo/permits/{id}/issue-coverage, POST /cafo/permits/{id}/complete-renewal, POST /cafo/nutrient-plans/{id}/approve"
  - priority: 22
    category: state
    check: "Operation.compliance_posture == OPEN"
    error_id: ERR_OPERATION_RESTRICTED
    http_status: 409
    applies_to: "POST /cafo/application-events, POST /cafo/manure-transfers, POST /cafo/manure-transfers/{id}/resume, POST /cafo/nutrient-plans/{id}/approve"
  - priority: 23
    category: business_safety
    check: "soil_condition != FROZEN"
    error_id: ERR_FROZEN_GROUND_APPLICATION
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 24
    category: business_safety
    check: "soil_condition != SATURATED"
    error_id: ERR_SATURATED_SOIL_APPLICATION
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 25
    category: business_safety
    check: "when the UTC month of applied_on IN {12, 1, 2} the owning plan has winter_application_allowed == true"
    error_id: ERR_WINTER_WINDOW_APPLICATION
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 26
    category: business_safety
    check: "precipitation_forecast_in_24h < PRECIPITATION_LIMIT_IN (0.50); a forecast of exactly 0.50 inches is rejected"
    error_id: ERR_PRECIPITATION_RISK
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 27
    category: business_safety
    check: "setback_maintained_ft >= Field.required_setback_ft * METHOD_SETBACK_MULTIPLIER[application_method], where the multiplier is SURFACE_BROADCAST 1.0, IRRIGATION 1.5, INCORPORATED_24H 0.5, INJECTION 0.25"
    error_id: ERR_SETBACK_VIOLATION
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 28
    category: business_temporal
    check: "applied_on, transferred_on, inspected_on, sampled_on and discovered_at are not after the logical clock"
    error_id: ERR_FUTURE_DATED_RECORD
    http_status: 422
    applies_to: "POST /cafo/application-events, POST /cafo/manure-transfers, POST /cafo/storage-inspections, POST /cafo/soil-tests, POST /cafo/incident-reports"
  - priority: 29
    category: business_temporal
    check: "no other Permit of the same operation with coverage_status IN {SUBMITTED, COVERED, RENEWAL_PENDING} has a half-open coverage interval [effective_on, expiration_on) intersecting this application's interval; intervals that merely touch at an endpoint do not intersect"
    error_id: ERR_PERMIT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /cafo/permits/{id}/submit"
  - priority: 30
    category: business_temporal
    check: "the logical clock is at or after Permit.renewal_window_opens_on"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /cafo/permits/{id}/initiate-renewal"
  - priority: 31
    category: business_temporal
    check: "abs(applied_on - Field.last_application_on) >= REAPPLICATION_INTERVAL_DAYS (21); the buffer is symmetric, so a back-dated application inside the window of a later record is rejected too, and a gap of exactly 21 days is accepted"
    error_id: ERR_REAPPLICATION_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /cafo/application-events"
  - priority: 32
    category: business_referential
    check: "the referenced Hauler has hauler_status == ACTIVE"
    error_id: ERR_HAULER_LICENSE_LAPSED
    http_status: 422
    applies_to: "POST /cafo/manure-transfers, POST /cafo/manure-transfers/{id}/acknowledge, POST /cafo/manure-transfers/{id}/resume"
  - priority: 33
    category: business_referential
    check: "application_method is a member of the owning plan's allowed_application_methods"
    error_id: ERR_APPLICATION_METHOD_NOT_IN_PLAN
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 34
    category: business_referential
    check: "the referenced SoilTest has is_valid == true and its field_id equals the budget's field_id"
    error_id: ERR_NO_VALID_SOIL_TEST
    http_status: 422
    applies_to: "POST /cafo/field-budgets"
  - priority: 35
    category: business_referential
    check: "nutrient_analysis_provided == true and recipient_name and recipient_address are non-empty"
    error_id: ERR_RECIPIENT_DOCUMENTATION_MISSING
    http_status: 422
    applies_to: "POST /cafo/manure-transfers/{id}/acknowledge"
  - priority: 36
    category: business_referential
    check: "no other AnnualReport exists for the same operation_id and report_year"
    error_id: ERR_REPORT_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /cafo/annual-reports"
  - priority: 37
    category: business_constraint
    check: "Inspection.findings_count >= 1"
    error_id: ERR_NOV_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /cafo/inspections/{id}/issue-nov"
  - priority: 38
    category: business_constraint
    check: "Operation.design_storage_days >= MIN_STORAGE_DAYS (180)"
    error_id: ERR_INSUFFICIENT_STORAGE_DAYS
    http_status: 422
    applies_to: "POST /cafo/nutrient-plans/{id}/certify"
  - priority: 39
    category: business_constraint
    check: "at least one FieldNutrientBudget exists with plan_id == the plan being certified"
    error_id: ERR_NO_FIELD_BUDGETS
    http_status: 422
    applies_to: "POST /cafo/nutrient-plans/{id}/certify"
  - priority: 40
    category: business_constraint
    check: "the computed allowable_rate_gal_per_acre is greater than 0"
    error_id: ERR_ZERO_ALLOWABLE_RATE
    http_status: 422
    applies_to: "POST /cafo/field-budgets"
  - priority: 41
    category: business_constraint
    check: "when variance_classification == EXCEEDS_TOLERANCE, variance_explanation is a non-empty string"
    error_id: ERR_VARIANCE_EXPLANATION_REQUIRED
    http_status: 422
    applies_to: "POST /cafo/annual-reports/{id}/submit"
  - priority: 42
    category: business_fiscal
    check: "acres_treated <= Field.net_applicable_acres"
    error_id: ERR_ACRES_EXCEED_NET_APPLICABLE
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 43
    category: business_fiscal
    check: "rate_gal_per_acre <= FieldNutrientBudget.allowable_rate_gal_per_acre"
    error_id: ERR_RATE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 44
    category: business_fiscal
    check: "gallons_applied <= FieldNutrientBudget.remaining_gallons"
    error_id: ERR_FIELD_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /cafo/application-events"
  - priority: 45
    category: business_fiscal
    check: "the requested volume is at most ManureStorage.current_volume_gallons - ManureStorage.committed_outflow_gallons"
    error_id: ERR_INSUFFICIENT_STORAGE_VOLUME
    http_status: 422
    applies_to: "POST /cafo/application-events, POST /cafo/manure-transfers, POST /cafo/manure-transfers/{id}/resume"
  - priority: 46
    category: business_fiscal
    check: "ManureStorage.current_volume_gallons + gallons <= ManureStorage.operating_capacity_gallons"
    error_id: ERR_STORAGE_OPERATING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /cafo/manure-storages/{id}/intake"

endpoints:
  # ---------- Operation ----------
  - method: POST
    path: "/cafo/operations"
    description: "Register a livestock operation and derive its animal units, size class and permit requirement."
    roles: [ComplianceAdmin]
    code: 201
    input: [name, county, animal_type, head_count, manure_handling, "open_lot_area_sqft?", discharge_potential, "has_conservation_plan?"]
    output: Operation
    side_effects:
      - "runs calculations.operation_animal_units_and_class and writes animal_units, size_class, permit_required"
      - "runs calculations.operation_manure_production DESIGN_BASIS and writes design_annual_manure_gallons and daily_production_gallons"
      - "sets recorded_annual_manure_gallons = 0, design_storage_days = 0, open_finding_count = 0, open_discharge_incident_count = 0"
      - "sets compliance_posture = OPEN"
  - method: PATCH
    path: "/cafo/operations/{id}"
    description: "Update herd size, handling system, lot area, discharge determination or conservation-plan flag."
    roles: [Operator, ComplianceAdmin]
    code: 200
    input: ["county?", "head_count?", "manure_handling?", "open_lot_area_sqft?", "discharge_potential?", "has_conservation_plan?"]
    output: Operation
    side_effects:
      - "re-runs calculations.operation_animal_units_and_class and calculations.operation_manure_production DESIGN_BASIS"
      - "re-runs calculations.storage_days_of_capacity DESIGN_BASIS and rewrites design_storage_days"
      - "re-runs calculations.storage_days_of_capacity AVAILABLE_BASIS on every ManureStorage of the operation"
      - "increments Operation.version by 1"
  - method: GET
    path: "/cafo/operations/{id}"
    description: "Read one operation with all derived fields."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: Operation
    side_effects: []
  - method: GET
    path: "/cafo/operations"
    description: "List operations with filtering and pagination."
    roles: [StateReviewer, ComplianceAdmin]
    code: 200
    input: ["county?", "size_class?", "compliance_posture?", "limit?", "offset?"]
    output: "Operation[]"
    side_effects: []
  - method: GET
    path: "/cafo/operations/{id}/nutrient-summary"
    description: "Computed read comparing the two variants of calculations.operation_manure_production for one calendar year."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["basis?", "year?"]
    output: { basis: string, year: integer, design_annual_manure_gallons: number, recorded_annual_manure_gallons: number, recorded_land_applied_gallons: number, recorded_transferred_gallons: number, total_n_applied_lbs: number, total_p2o5_applied_lbs: number, design_storage_days: integer, compliance_posture: string }
    side_effects: []
    note: "basis defaults to DESIGN_BASIS; year defaults to the calendar year of the logical clock"

  # ---------- Hauler ----------
  - method: POST
    path: "/cafo/haulers"
    description: "Register a third-party manure hauler."
    roles: [ComplianceAdmin]
    code: 201
    input: [business_name, license_number, license_expires_on, "certified_applicator?"]
    output: Hauler
    side_effects:
      - "sets hauler_status = ACTIVE when the logical clock <= license_expires_on, otherwise LAPSED"
  - method: GET
    path: "/cafo/haulers/{id}"
    description: "Read one hauler."
    roles: [Operator, StateReviewer, ComplianceAdmin, Hauler]
    code: 200
    input: []
    output: Hauler
    side_effects: []
  - method: GET
    path: "/cafo/haulers"
    description: "List haulers with filtering and pagination."
    roles: [Operator, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["hauler_status?", "limit?", "offset?"]
    output: "Hauler[]"
    side_effects: []

  # ---------- Permit ----------
  - method: POST
    path: "/cafo/permits"
    description: "Draft a permit coverage application for an operation."
    roles: [Operator]
    code: 201
    input: [operation_id, permit_type, effective_on]
    output: Permit
    side_effects:
      - "sets coverage_status = DRAFT_APPLICATION and compliance_status = IN_GOOD_STANDING"
  - method: POST
    path: "/cafo/permits/{id}/submit"
    description: "Submit the coverage application to the reviewing agency."
    roles: [Operator]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "transitions coverage_status DRAFT_APPLICATION -> SUBMITTED"
  - method: POST
    path: "/cafo/permits/{id}/issue-coverage"
    description: "Grant coverage and stamp the five-year term and renewal dates."
    roles: [StateReviewer]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "transitions coverage_status SUBMITTED -> COVERED"
      - "stamps expiration_on, renewal_window_opens_on and renewal_due_on"
  - method: POST
    path: "/cafo/permits/{id}/initiate-renewal"
    description: "File a renewal application and assess the renewal fee."
    roles: [Operator]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "transitions coverage_status COVERED -> RENEWAL_PENDING"
      - "runs calculations.permit_renewal_fee and writes gross_fee, conservation_discount_pct, conservation_discount_amount, net_fee, late_surcharge_amount, total_due"
      - "stamps renewal_submitted_at and is_late_renewal"
  - method: POST
    path: "/cafo/permits/{id}/complete-renewal"
    description: "Approve the renewal and roll the coverage term forward."
    roles: [StateReviewer]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "transitions coverage_status RENEWAL_PENDING -> COVERED"
      - "advances effective_on and expiration_on and recomputes the renewal dates"
  - method: GET
    path: "/cafo/permits/{id}"
    description: "Read one permit with both state dimensions and the fee breakdown."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/cafo/permits"
    description: "List permits, filterable by owning operation and by either state dimension."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "coverage_status?", "compliance_status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  # ---------- NutrientManagementPlan ----------
  - method: POST
    path: "/cafo/nutrient-plans"
    description: "Create a nutrient management plan against an operation, optionally superseding an earlier plan. Guarded by OCC on Operation.version."
    roles: [Operator, CertifiedPlanner]
    code: 201
    input: [operation_id, permit_id, plan_year, allowed_application_methods, "winter_application_allowed?", "supersedes_plan_id?", expected_operation_version]
    output: NutrientManagementPlan
    side_effects:
      - "sets plan_status = DRAFT and revision_count = 0"
      - "increments Operation.version by 1"
  - method: PATCH
    path: "/cafo/nutrient-plans/{id}"
    description: "Revise a draft or returned plan, returning it to DRAFT and clearing its certification."
    roles: [CertifiedPlanner]
    code: 200
    input: ["plan_year?", "allowed_application_methods?", "winter_application_allowed?"]
    output: NutrientManagementPlan
    side_effects:
      - "transitions plan_status REVISION_REQUIRED -> DRAFT when the plan was in REVISION_REQUIRED"
      - "clears certifying_planner_user_id and certified_at"
  - method: POST
    path: "/cafo/nutrient-plans/{id}/certify"
    description: "Certified planner attests the plan meets storage, budget and coverage requirements."
    roles: [CertifiedPlanner]
    code: 200
    input: []
    output: NutrientManagementPlan
    side_effects:
      - "transitions plan_status DRAFT -> CERTIFIED"
      - "stamps certifying_planner_user_id and certified_at"
  - method: POST
    path: "/cafo/nutrient-plans/{id}/submit"
    description: "Operator files the certified plan with the agency."
    roles: [Operator]
    code: 200
    input: []
    output: NutrientManagementPlan
    side_effects:
      - "transitions plan_status CERTIFIED -> SUBMITTED"
  - method: POST
    path: "/cafo/nutrient-plans/{id}/approve"
    description: "Agency approves the plan, activating its field budgets and superseding the prior plan."
    roles: [StateReviewer]
    code: 200
    input: []
    output: NutrientManagementPlan
    side_effects:
      - "transitions plan_status SUBMITTED -> APPROVED and stamps approved_at"
      - "sets budget_status = ACTIVE on every FieldNutrientBudget of the plan"
      - "transitions the plan referenced by supersedes_plan_id APPROVED -> SUPERSEDED and locks its budgets"
  - method: POST
    path: "/cafo/nutrient-plans/{id}/require-revision"
    description: "Agency returns a submitted plan for revision."
    roles: [StateReviewer]
    code: 200
    input: []
    output: NutrientManagementPlan
    side_effects:
      - "transitions plan_status SUBMITTED -> REVISION_REQUIRED and increments revision_count"
  - method: GET
    path: "/cafo/nutrient-plans/{id}"
    description: "Read one nutrient management plan."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: NutrientManagementPlan
    side_effects: []
  - method: GET
    path: "/cafo/nutrient-plans"
    description: "List plans, filterable by operation, permit, superseded predecessor and status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "permit_id?", "supersedes_plan_id?", "plan_status?", "plan_year?", "limit?", "offset?"]
    output: "NutrientManagementPlan[]"
    side_effects: []

  # ---------- Field ----------
  - method: POST
    path: "/cafo/fields"
    description: "Register a land application field and derive its setback and net applicable acres."
    roles: [Operator, CertifiedPlanner]
    code: 201
    input: [operation_id, field_name, total_acres, distance_to_water_ft, "has_tile_inlet?", slope_pct, water_frontage_ft]
    output: Field
    side_effects:
      - "runs calculations.field_setback_and_net_acres and writes required_setback_ft, excluded_acres, net_applicable_acres"
      - "sets last_application_on = null"
  - method: GET
    path: "/cafo/fields/{id}"
    description: "Read one field."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: Field
    side_effects: []
  - method: GET
    path: "/cafo/fields"
    description: "List fields of an operation."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "limit?", "offset?"]
    output: "Field[]"
    side_effects: []

  # ---------- SoilTest ----------
  - method: POST
    path: "/cafo/soil-tests"
    description: "Record an immutable soil test result and derive its phosphorus index category."
    roles: [Operator, CertifiedPlanner]
    code: 201
    input: [field_id, sampled_on, lab_name, soil_test_p_ppm, soil_test_k_ppm, organic_matter_pct]
    output: SoilTest
    side_effects:
      - "runs calculations.soil_test_p_index and writes p_index, p_index_category and is_valid"
  - method: GET
    path: "/cafo/soil-tests/{id}"
    description: "Read one soil test."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: SoilTest
    side_effects: []
  - method: GET
    path: "/cafo/soil-tests"
    description: "List soil tests of a field."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["field_id?", "limit?", "offset?"]
    output: "SoilTest[]"
    side_effects: []

  # ---------- FieldNutrientBudget ----------
  - method: POST
    path: "/cafo/field-budgets"
    description: "Add a per-field nutrient budget to a draft plan and derive the nitrogen and phosphorus based application limits."
    roles: [CertifiedPlanner]
    code: 201
    input: [plan_id, field_id, soil_test_id, crop, yield_goal, previous_crop, planned_application_method]
    output: FieldNutrientBudget
    side_effects:
      - "runs calculations.budget_allowable_rate and writes all nine derived steps"
      - "sets applied_gallons_to_date = 0, remaining_gallons = allowable_total_gallons and budget_status = LOCKED"
      - "the new budget is always born LOCKED, including when it is added to a plan that is already APPROVED; only POST /cafo/nutrient-plans/{id}/approve activates budgets, so a budget filed after approval stays LOCKED until the plan is revised and approved again"
  - method: GET
    path: "/cafo/field-budgets/{id}"
    description: "Read one field nutrient budget with its ledger."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: FieldNutrientBudget
    side_effects: []
  - method: GET
    path: "/cafo/field-budgets"
    description: "List field nutrient budgets by plan, field, soil test or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["plan_id?", "field_id?", "soil_test_id?", "budget_status?", "limit?", "offset?"]
    output: "FieldNutrientBudget[]"
    side_effects: []

  # ---------- ManureStorage ----------
  - method: POST
    path: "/cafo/manure-storages"
    description: "Register a manure storage structure and derive its design, freeboard and operating capacities."
    roles: [Operator]
    code: 201
    input: [operation_id, structure_name, structure_type, surface_area_sqft, total_depth_in, "required_freeboard_in?"]
    output: ManureStorage
    side_effects:
      - "runs calculations.storage_capacity_and_freeboard and writes design_capacity_gallons, freeboard_reserve_gallons, operating_capacity_gallons, current_volume_gallons = 0 and available_capacity_gallons"
      - "runs calculations.storage_days_of_capacity and writes days_of_storage_available on the structure and design_storage_days on the Operation"
      - "sets storage_status = IN_SERVICE"
  - method: POST
    path: "/cafo/manure-storages/{id}/intake"
    description: "Record manure entering the structure from the barn or lot."
    roles: [Operator]
    code: 200
    input: [gallons]
    output: ManureStorage
    side_effects:
      - "increases cumulative_intake_gallons by gallons and recomputes current_volume_gallons and available_capacity_gallons"
      - "recomputes days_of_storage_available"
  - method: POST
    path: "/cafo/manure-storages/{id}/return-to-service"
    description: "Clear a freeboard alert or overflow condition after remediation."
    roles: [Operator]
    code: 200
    input: []
    output: ManureStorage
    side_effects:
      - "transitions storage_status FREEBOARD_ALERT or OVERFLOW_IMMINENT -> IN_SERVICE"
      - "recomputes Operation.compliance_posture"
  - method: GET
    path: "/cafo/manure-storages/{id}"
    description: "Read one storage structure with its volume balance."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: ManureStorage
    side_effects: []
  - method: GET
    path: "/cafo/manure-storages"
    description: "List storage structures of an operation."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "storage_status?", "limit?", "offset?"]
    output: "ManureStorage[]"
    side_effects: []
  - method: GET
    path: "/cafo/manure-storages/{id}/capacity-projection"
    description: "Computed read returning both variants of calculations.storage_days_of_capacity for the current clock month."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["basis?"]
    output: { basis: string, seasonal_factor: number, effective_daily_gallons: number, operating_capacity_gallons: number, available_capacity_gallons: number, days_of_storage: integer, min_storage_days_met: boolean }
    side_effects: []
    note: "basis defaults to AVAILABLE_BASIS"

  # ---------- StorageInspection ----------
  - method: POST
    path: "/cafo/storage-inspections"
    description: "File an immutable freeboard and condition inspection record for a structure."
    roles: [Operator, ComplianceAdmin]
    code: 201
    input: [storage_id, inspected_on, inspector_name, measured_freeboard_in, visual_condition]
    output: StorageInspection
    side_effects:
      - "runs calculations.storage_capacity_and_freeboard and writes measured_volume_gallons, freeboard_deficit_in and alert_raised"
      - "reconciles ManureStorage.precipitation_adjustment_gallons so the storage volume balance is exact, then recomputes current_volume_gallons, available_capacity_gallons and days_of_storage_available"
      - "stamps ManureStorage.last_inspected_on"
      - "transitions ManureStorage IN_SERVICE -> FREEBOARD_ALERT when freeboard_deficit_in > 0 and measured_freeboard_in > 6, or -> OVERFLOW_IMMINENT when measured_freeboard_in <= 6, which cascades into Operation.compliance_posture"
  - method: GET
    path: "/cafo/storage-inspections/{id}"
    description: "Read one storage inspection record."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: StorageInspection
    side_effects: []
  - method: GET
    path: "/cafo/storage-inspections"
    description: "List storage inspection records for a structure."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["storage_id?", "limit?", "offset?"]
    output: "StorageInspection[]"
    side_effects: []

  # ---------- LandApplicationEvent ----------
  - method: POST
    path: "/cafo/application-events"
    description: "Record a land application with date, rate, field, method and weather conditions."
    roles: [Operator]
    code: 201
    input: [plan_id, budget_id, storage_id, applied_on, gallons_applied, acres_treated, application_method, setback_maintained_ft, soil_condition, "precipitation_forecast_in_24h?", applicator_name]
    output: LandApplicationEvent
    side_effects:
      - "runs calculations.application_event_nutrient_load APPLICATION context and writes rate_gal_per_acre, n_applied_lbs and p2o5_applied_lbs"
      - "sets event_status = RECORDED"
      - "increases FieldNutrientBudget.applied_gallons_to_date and decreases remaining_gallons by gallons_applied"
      - "increases ManureStorage.cumulative_outflow_gallons by gallons_applied and recomputes current_volume_gallons, available_capacity_gallons and days_of_storage_available"
      - "stamps Field.last_application_on = applied_on when it is later than the stored value"
      - "recomputes Operation.recorded_annual_manure_gallons"
  - method: POST
    path: "/cafo/application-events/{id}/verify"
    description: "Certified planner verifies the recorded application against the plan."
    roles: [CertifiedPlanner]
    code: 200
    input: []
    output: LandApplicationEvent
    side_effects:
      - "transitions event_status RECORDED -> VERIFIED with no change to either ledger"
  - method: POST
    path: "/cafo/application-events/{id}/void"
    description: "Void an erroneous application record and reverse both ledgers."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: LandApplicationEvent
    side_effects:
      - "transitions event_status RECORDED or VERIFIED -> VOIDED"
      - "decreases FieldNutrientBudget.applied_gallons_to_date and increases remaining_gallons by gallons_applied"
      - "decreases ManureStorage.cumulative_outflow_gallons by gallons_applied and recomputes current_volume_gallons, available_capacity_gallons and days_of_storage_available"
      - "recomputes Field.last_application_on and Operation.recorded_annual_manure_gallons"
  - method: GET
    path: "/cafo/application-events/{id}"
    description: "Read one land application record."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: LandApplicationEvent
    side_effects: []
  - method: GET
    path: "/cafo/application-events"
    description: "List land application records by plan, budget, structure or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["plan_id?", "budget_id?", "storage_id?", "event_status?", "limit?", "offset?"]
    output: "LandApplicationEvent[]"
    side_effects: []

  # ---------- ManureTransfer ----------
  - method: POST
    path: "/cafo/manure-transfers"
    description: "Initiate a third-party manure transfer and commit the volume against the structure."
    roles: [Operator]
    code: 201
    input: [operation_id, storage_id, hauler_id, recipient_name, recipient_address, transferred_on, gallons_transferred, "nutrient_analysis_provided?"]
    output: ManureTransfer
    side_effects:
      - "runs calculations.application_event_nutrient_load TRANSFER context and writes recipient_n_lbs and recipient_p2o5_lbs"
      - "sets transfer_status = INITIATED"
      - "increases ManureStorage.committed_outflow_gallons by gallons_transferred and recomputes available_capacity_gallons and days_of_storage_available"
  - method: POST
    path: "/cafo/manure-transfers/{id}/acknowledge"
    description: "Hauler records the recipient acknowledgement and nutrient analysis handover."
    roles: [Hauler]
    code: 200
    input: []
    output: ManureTransfer
    side_effects:
      - "transitions transfer_status INITIATED -> ACKNOWLEDGED and stamps recipient_ack_signed_at"
      - "moves gallons_transferred from ManureStorage.committed_outflow_gallons into cumulative_outflow_gallons and recomputes current_volume_gallons and available_capacity_gallons"
  - method: POST
    path: "/cafo/manure-transfers/{id}/complete"
    description: "Hauler closes out the delivery."
    roles: [Hauler]
    code: 200
    input: []
    output: ManureTransfer
    side_effects:
      - "transitions transfer_status ACKNOWLEDGED -> COMPLETED"
  - method: POST
    path: "/cafo/manure-transfers/{id}/cancel"
    description: "Cancel an initiated or suspended transfer."
    roles: [Operator]
    code: 200
    input: []
    output: ManureTransfer
    side_effects:
      - "transitions transfer_status INITIATED or SUSPENDED -> CANCELLED"
      - "releases ManureStorage.committed_outflow_gallons by gallons_transferred when the transfer was INITIATED, and leaves it untouched when the transfer was already SUSPENDED"
  - method: POST
    path: "/cafo/manure-transfers/{id}/resume"
    description: "Resume a transfer suspended by a compliance posture change."
    roles: [Operator]
    code: 200
    input: []
    output: ManureTransfer
    side_effects:
      - "transitions transfer_status SUSPENDED -> INITIATED"
      - "re-commits ManureStorage.committed_outflow_gallons by gallons_transferred and recomputes available_capacity_gallons and days_of_storage_available"
  - method: GET
    path: "/cafo/manure-transfers/{id}"
    description: "Read one manure transfer with recipient documentation fields."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin, Hauler]
    code: 200
    input: []
    output: ManureTransfer
    side_effects: []
  - method: GET
    path: "/cafo/manure-transfers"
    description: "List manure transfers by operation, structure, hauler or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin, Hauler]
    code: 200
    input: ["operation_id?", "storage_id?", "hauler_id?", "transfer_status?", "limit?", "offset?"]
    output: "ManureTransfer[]"
    side_effects: []

  # ---------- IncidentReport ----------
  - method: POST
    path: "/cafo/incident-reports"
    description: "File a mortality, discharge or spill incident report and derive its notification obligations."
    roles: [Operator]
    code: 201
    input: [operation_id, incident_type, "subject_storage_id?", "subject_field_id?", discovered_at, description, "mortality_head_count?", "disposal_method?", "released_gallons?", "reached_water?"]
    output: IncidentReport
    side_effects:
      - "runs calculations.incident_notification_deadlines and writes requires_oral_notification, oral_notification_deadline_at and written_report_deadline_at"
      - "sets incident_status = OPEN"
      - "recomputes Operation.open_discharge_incident_count and Operation.compliance_posture, which becomes SUSPENDED for a DISCHARGE or SPILL"
  - method: POST
    path: "/cafo/incident-reports/{id}/record-oral-notification"
    description: "Record that the agency was notified orally and evaluate lateness."
    roles: [Operator]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "transitions incident_status OPEN -> NOTIFIED"
      - "stamps oral_notified_at and sets notification_late"
  - method: POST
    path: "/cafo/incident-reports/{id}/submit-written-report"
    description: "File the written follow-up report."
    roles: [Operator]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "transitions incident_status NOTIFIED -> WRITTEN_SUBMITTED"
  - method: POST
    path: "/cafo/incident-reports/{id}/close"
    description: "Agency closes the incident."
    roles: [StateReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "transitions incident_status OPEN or WRITTEN_SUBMITTED -> CLOSED"
      - "recomputes Operation.open_discharge_incident_count and Operation.compliance_posture"
  - method: GET
    path: "/cafo/incident-reports/{id}"
    description: "Read one incident report."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/cafo/incident-reports"
    description: "List incident reports by operation, polymorphic subject, type or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "subject_storage_id?", "subject_field_id?", "incident_type?", "incident_status?", "limit?", "offset?"]
    output: "IncidentReport[]"
    side_effects: []

  # ---------- Inspection ----------
  - method: POST
    path: "/cafo/inspections"
    description: "Schedule a compliance inspection under a permit."
    roles: [StateReviewer]
    code: 201
    input: [operation_id, permit_id, scheduled_on, inspection_kind]
    output: Inspection
    side_effects:
      - "sets inspection_status = SCHEDULED and findings_count = 0"
  - method: POST
    path: "/cafo/inspections/{id}/conduct"
    description: "Conduct the inspection and record deficiencies."
    roles: [StateReviewer]
    code: 200
    input: [findings_count, "deficiency_categories?"]
    output: Inspection
    side_effects:
      - "transitions inspection_status SCHEDULED -> CONDUCTED"
      - "stamps inspector_user_id, conducted_on, findings_count and deficiency_categories"
  - method: POST
    path: "/cafo/inspections/{id}/issue-nov"
    description: "Issue a notice of violation, which puts the permit on notice and restricts the operation."
    roles: [StateReviewer]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "transitions inspection_status CONDUCTED -> NOV_ISSUED and stamps response_due_on"
      - "increments Operation.open_finding_count"
      - "transitions the Permit compliance dimension IN_GOOD_STANDING -> NOTICE_ISSUED, which recomputes Operation.compliance_posture to RESTRICTED, which revises the approved plan and locks its budgets, and suspends every INITIATED transfer releasing its committed volume"
  - method: POST
    path: "/cafo/inspections/{id}/submit-response"
    description: "Operator files the corrective action response to a notice of violation."
    roles: [Operator]
    code: 200
    input: [corrective_action_summary]
    output: Inspection
    side_effects:
      - "transitions inspection_status NOV_ISSUED -> RESPONSE_SUBMITTED"
      - "transitions the Permit compliance dimension NOTICE_ISSUED -> CORRECTIVE_ACTION"
  - method: POST
    path: "/cafo/inspections/{id}/close"
    description: "Close the inspection; the closing actor must differ from the inspecting actor."
    roles: [StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "transitions inspection_status CONDUCTED or RESPONSE_SUBMITTED -> CLOSED and stamps closed_by_user_id"
      - "decrements Operation.open_finding_count when the inspection was RESPONSE_SUBMITTED"
      - "transitions the Permit compliance dimension CORRECTIVE_ACTION -> IN_GOOD_STANDING and recomputes Operation.compliance_posture"
  - method: GET
    path: "/cafo/inspections/{id}"
    description: "Read one inspection."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/cafo/inspections"
    description: "List inspections by operation, permit or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "permit_id?", "inspection_status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  # ---------- AnnualReport ----------
  - method: POST
    path: "/cafo/annual-reports"
    description: "Open an annual report for a calendar year and run the manure mass balance."
    roles: [Operator]
    code: 201
    input: [operation_id, plan_id, report_year, beginning_storage_gallons, ending_storage_gallons, "variance_explanation?"]
    output: AnnualReport
    side_effects:
      - "runs calculations.annual_report_mass_balance and writes the recorded totals, expected volume, variance_pct, variance_classification, total_n_applied_lbs and total_p2o5_applied_lbs"
      - "sets report_status = DRAFT"
  - method: POST
    path: "/cafo/annual-reports/{id}/submit"
    description: "Submit or resubmit the annual report."
    roles: [Operator]
    code: 200
    input: []
    output: AnnualReport
    side_effects:
      - "re-runs calculations.annual_report_mass_balance over the current record set"
      - "transitions report_status DRAFT or RETURNED -> SUBMITTED and stamps submitted_at"
  - method: POST
    path: "/cafo/annual-reports/{id}/accept"
    description: "Agency accepts the annual report."
    roles: [StateReviewer]
    code: 200
    input: []
    output: AnnualReport
    side_effects:
      - "transitions report_status SUBMITTED -> ACCEPTED and stamps accepted_at"
  - method: POST
    path: "/cafo/annual-reports/{id}/return"
    description: "Agency returns the annual report for correction."
    roles: [StateReviewer]
    code: 200
    input: [return_reason]
    output: AnnualReport
    side_effects:
      - "transitions report_status SUBMITTED -> RETURNED and stores return_reason"
  - method: GET
    path: "/cafo/annual-reports/{id}"
    description: "Read one annual report with its mass balance."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: AnnualReport
    side_effects: []
  - method: GET
    path: "/cafo/annual-reports"
    description: "List annual reports by operation, plan, year or status."
    roles: [Operator, CertifiedPlanner, StateReviewer, ComplianceAdmin]
    code: 200
    input: ["operation_id?", "plan_id?", "report_year?", "report_status?", "limit?", "offset?"]
    output: "AnnualReport[]"
    side_effects: []

  # ---------- test-driving surface ----------
  - method: POST
    path: "/cafo/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to real wall-clock time. Advancing the clock runs the coverage-expiry, hauler-lapse, soil-test-validity and seasonal-factor checkpoints."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, permits_expired_count: integer, haulers_lapsed_count: integer, storages_recomputed_count: integer, operations_recomputed_count: integer }
    side_effects:
      - "transitions every Permit with coverage_status IN {COVERED, RENEWAL_PENDING} and expiration_on <= the new clock to EXPIRED"
      - "recomputes Hauler.hauler_status and SoilTest.is_valid"
      - "re-runs calculations.storage_days_of_capacity for both variants, applying the winter seasonal factor when the new clock's month IN {11, 12, 1, 2, 3}, and rewrites ManureStorage.days_of_storage_available and Operation.design_storage_days"
      - "recomputes Operation.recorded_annual_manure_gallons and Operation.compliance_posture"

errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an Operator acts on a resource belonging to a different Operation, or a Hauler acts on a transfer assigned to a different Hauler"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the actor closing an inspection is the same user who conducted it"
  # existence
  - id: ERR_OPERATION_NOT_FOUND
    http: 404
    condition: "no Operation with the given id"
  - id: ERR_HAULER_NOT_FOUND
    http: 404
    condition: "no Hauler with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no Permit with the given id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no NutrientManagementPlan with the given id, including an unresolvable supersedes_plan_id"
  - id: ERR_FIELD_NOT_FOUND
    http: 404
    condition: "no Field with the given id"
  - id: ERR_SOIL_TEST_NOT_FOUND
    http: 404
    condition: "no SoilTest with the given id"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "no FieldNutrientBudget with the given id"
  - id: ERR_STORAGE_NOT_FOUND
    http: 404
    condition: "no ManureStorage with the given id"
  - id: ERR_STORAGE_INSPECTION_NOT_FOUND
    http: 404
    condition: "no StorageInspection with the given id"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "no LandApplicationEvent with the given id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no ManureTransfer with the given id"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no IncidentReport with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no AnnualReport with the given id"
  # request shape and concurrency
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, type or enum violation, range violation, or a polymorphic IncidentReport subject that does not match incident_type"
  - id: ERR_STALE_OPERATION_VERSION
    http: 412
    condition: "expected_operation_version does not equal the current Operation.version on POST /cafo/nutrient-plans"
  # own-entity state
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "the requested coverage transition is not declared from the permit's current coverage_status"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the requested plan transition is not declared from the plan's current plan_status, including adding a budget to a plan that is not DRAFT"
  - id: ERR_STORAGE_STATE_INVALID
    http: 409
    condition: "return-to-service requested while storage_status == IN_SERVICE, or the latest inspection still shows a freeboard deficit or a non-NORMAL condition"
  - id: ERR_EVENT_ALREADY_TERMINAL
    http: 409
    condition: "verify or void requested on an event whose event_status is already VOIDED"
  - id: ERR_TRANSFER_STATE_INVALID
    http: 409
    condition: "the requested transfer transition is not declared from the transfer's current transfer_status"
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "the requested incident transition is not declared from the incident's current incident_status, including closing an OPEN incident that still requires oral notification"
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "the requested inspection transition is not declared from the inspection's current inspection_status, including closing a CONDUCTED inspection with findings_count >= 1"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "the requested report transition is not declared from the report's current report_status"
  # cross-entity state
  - id: ERR_PERMIT_COVERAGE_REQUIRED
    http: 409
    condition: "the referenced permit is not in coverage_status COVERED or RENEWAL_PENDING"
  - id: ERR_PERMIT_COVERAGE_EXPIRED
    http: 409
    condition: "the operation's permit has coverage_status EXPIRED"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "the referenced nutrient management plan is not in plan_status APPROVED"
  - id: ERR_BUDGET_NOT_ACTIVE
    http: 409
    condition: "the referenced field nutrient budget has budget_status LOCKED"
  - id: ERR_OPERATION_SUSPENDED
    http: 409
    condition: "Operation.compliance_posture == SUSPENDED"
  - id: ERR_OPERATION_RESTRICTED
    http: 409
    condition: "Operation.compliance_posture == RESTRICTED"
  # business safety
  - id: ERR_FROZEN_GROUND_APPLICATION
    http: 422
    condition: "soil_condition == FROZEN on a land application record"
  - id: ERR_SATURATED_SOIL_APPLICATION
    http: 422
    condition: "soil_condition == SATURATED on a land application record"
  - id: ERR_WINTER_WINDOW_APPLICATION
    http: 422
    condition: "applied_on falls in December, January or February and the plan does not allow winter application"
  - id: ERR_PRECIPITATION_RISK
    http: 422
    condition: "precipitation_forecast_in_24h >= 0.50 inches on a land application record"
  - id: ERR_SETBACK_VIOLATION
    http: 422
    condition: "setback_maintained_ft is less than the field's required setback scaled by the method multiplier"
  # business temporal
  - id: ERR_FUTURE_DATED_RECORD
    http: 422
    condition: "a record date is after the logical clock"
  - id: ERR_PERMIT_COVERAGE_OVERLAP
    http: 409
    condition: "the submitted application's half-open coverage interval intersects an existing active coverage interval of the same operation"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "renewal initiated before renewal_window_opens_on"
  - id: ERR_REAPPLICATION_INTERVAL_CONFLICT
    http: 409
    condition: "the application date is within 21 days of the field's most recent non-voided application, in either direction"
  # business referential
  - id: ERR_HAULER_LICENSE_LAPSED
    http: 422
    condition: "the referenced hauler has hauler_status LAPSED"
  - id: ERR_APPLICATION_METHOD_NOT_IN_PLAN
    http: 422
    condition: "application_method is not a member of the plan's allowed_application_methods"
  - id: ERR_NO_VALID_SOIL_TEST
    http: 422
    condition: "the referenced soil test is older than four years or belongs to a different field than the budget"
  - id: ERR_RECIPIENT_DOCUMENTATION_MISSING
    http: 422
    condition: "acknowledgement attempted without nutrient_analysis_provided or without recipient name and address"
  - id: ERR_REPORT_PERIOD_DUPLICATE
    http: 409
    condition: "an annual report already exists for the same operation and report_year"
  # business constraint
  - id: ERR_NOV_NOT_WARRANTED
    http: 422
    condition: "notice of violation requested on an inspection with findings_count == 0"
  - id: ERR_INSUFFICIENT_STORAGE_DAYS
    http: 422
    condition: "certification attempted while Operation.design_storage_days < 180"
  - id: ERR_NO_FIELD_BUDGETS
    http: 422
    condition: "certification attempted on a plan with no field nutrient budgets"
  - id: ERR_ZERO_ALLOWABLE_RATE
    http: 422
    condition: "the computed allowable application rate is zero, for example a VERY_HIGH phosphorus index or a legume crop with no nitrogen need"
  - id: ERR_VARIANCE_EXPLANATION_REQUIRED
    http: 422
    condition: "submission attempted with variance_classification EXCEEDS_TOLERANCE and no variance_explanation"
  # business fiscal
  - id: ERR_ACRES_EXCEED_NET_APPLICABLE
    http: 422
    condition: "acres_treated exceeds the field's net_applicable_acres"
  - id: ERR_RATE_EXCEEDS_LIMIT
    http: 422
    condition: "the per-acre rate exceeds the budget's allowable_rate_gal_per_acre"
  - id: ERR_FIELD_ALLOWANCE_EXCEEDED
    http: 422
    condition: "gallons_applied exceeds the budget's remaining_gallons"
  - id: ERR_INSUFFICIENT_STORAGE_VOLUME
    http: 422
    condition: "the requested volume exceeds the structure's uncommitted current volume"
  - id: ERR_STORAGE_OPERATING_CAPACITY_EXCEEDED
    http: 422
    condition: "an intake would push current_volume_gallons above operating_capacity_gallons"

roles:
  - name: Operator
    description: "the permitted livestock operation; owns records, files applications, renewals, applications, transfers, incidents and annual reports"
    identity: "entity_backed:Operation"
    exclusive_operations:
      - "POST /cafo/permits"
      - "POST /cafo/permits/{id}/submit"
      - "POST /cafo/permits/{id}/initiate-renewal"
      - "POST /cafo/nutrient-plans/{id}/submit"
      - "POST /cafo/manure-storages"
      - "POST /cafo/manure-storages/{id}/intake"
      - "POST /cafo/manure-storages/{id}/return-to-service"
      - "POST /cafo/application-events"
      - "POST /cafo/manure-transfers"
      - "POST /cafo/manure-transfers/{id}/cancel"
      - "POST /cafo/manure-transfers/{id}/resume"
      - "POST /cafo/incident-reports"
      - "POST /cafo/incident-reports/{id}/record-oral-notification"
      - "POST /cafo/incident-reports/{id}/submit-written-report"
      - "POST /cafo/inspections/{id}/submit-response"
      - "POST /cafo/annual-reports"
      - "POST /cafo/annual-reports/{id}/submit"
    shared_operations:
      - "PATCH /cafo/operations/{id}"
      - "POST /cafo/nutrient-plans"
      - "POST /cafo/fields"
      - "POST /cafo/soil-tests"
      - "POST /cafo/storage-inspections"
      - "all GET endpoints scoped to the acting operation"
  - name: CertifiedPlanner
    description: "licensed nutrient management planner who authors, certifies and verifies plan content"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /cafo/nutrient-plans/{id}"
      - "POST /cafo/nutrient-plans/{id}/certify"
      - "POST /cafo/field-budgets"
      - "POST /cafo/application-events/{id}/verify"
    shared_operations:
      - "POST /cafo/nutrient-plans"
      - "POST /cafo/fields"
      - "POST /cafo/soil-tests"
      - "all GET endpoints except GET /cafo/operations and GET /cafo/haulers"
  - name: StateReviewer
    description: "agency reviewer who grants coverage, approves plans, inspects operations and accepts reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /cafo/permits/{id}/issue-coverage"
      - "POST /cafo/permits/{id}/complete-renewal"
      - "POST /cafo/nutrient-plans/{id}/approve"
      - "POST /cafo/nutrient-plans/{id}/require-revision"
      - "POST /cafo/inspections"
      - "POST /cafo/inspections/{id}/conduct"
      - "POST /cafo/inspections/{id}/issue-nov"
      - "POST /cafo/incident-reports/{id}/close"
      - "POST /cafo/annual-reports/{id}/accept"
      - "POST /cafo/annual-reports/{id}/return"
    shared_operations:
      - "POST /cafo/inspections/{id}/close"
      - "GET /cafo/operations"
      - "all other GET endpoints"
  - name: Hauler
    description: "third-party manure hauler who acknowledges recipient documentation and closes out deliveries"
    identity: "entity_backed:Hauler"
    exclusive_operations:
      - "POST /cafo/manure-transfers/{id}/acknowledge"
      - "POST /cafo/manure-transfers/{id}/complete"
    shared_operations:
      - "GET /cafo/manure-transfers"
      - "GET /cafo/manure-transfers/{id}"
      - "GET /cafo/haulers/{id}"
  - name: ComplianceAdmin
    description: "platform compliance operator who registers operations and haulers, files structure inspections, voids erroneous records and advances the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /cafo/operations"
      - "POST /cafo/haulers"
      - "POST /cafo/application-events/{id}/void"
      - "POST /cafo/_clock/set_current_utc"
    shared_operations:
      - "PATCH /cafo/operations/{id}"
      - "POST /cafo/storage-inspections"
      - "POST /cafo/inspections/{id}/close"
      - "all GET endpoints"

