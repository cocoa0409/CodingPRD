      - name: segregation_of_duties_same_user_cannot_price_and_approve_or_notice_and_execute
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_8_ERR_SOD_ORIGINATOR_CANNOT_APPROVE
          - validations.priority_9_ERR_SOD_NOTICE_ISSUER_CANNOT_EXECUTE
          - entities.PremiumFinanceAgreement.originated_by_user_id
          - entities.CancellationNotice.issued_by_user_id
        distinguishing_aspect: |
          role_model is segregation_of_duties, and both rules are keyed on X-User-ID rather than on the
          role — which is exactly what makes them easy to no-op. An implementation that separates duties
          by comparing ROLES passes every other test in the suite and still never fires either rule,
          because the approving role (ComplianceOfficer) is already disjoint from the originating role
          (FinanceAnalyst) and the notice and the execution are both FinanceAnalyst operations. The
          violations here are therefore staged so the roles are always correct and only the identity
          collides: a compliance user whose X-User-ID happens to equal the frozen
          originated_by_user_id, and the very analyst who issued the notice-of-intent trying to exercise
          the power of attorney it created. Two further legs prove the rules are narrow rather than a
          blanket same-user ban: the originator may still submit and activate its own note, and the
          notice issuer may still take the borrower's money on the noticed account.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "note A is originated by X-User-ID 'analyst-origin' and left in DRAFT for the pricing-approval legs"
            - "note B is originated by 'analyst-origin', activated on the canonical 600000 policy, then swept delinquent on 2026-10-12"
