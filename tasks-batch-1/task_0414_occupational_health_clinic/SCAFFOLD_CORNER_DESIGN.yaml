  # ===========================================================================
  # SECTION 9 — CONSISTENCY MODEL (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_completion_visible_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Encounter.IN_PROGRESS_to_COMPLETED
          - entities.Worker.fields.hire_status
        distinguishing_aspect: "immediate consistency: completing a FIT PHYSICAL encounter returns billable_amount_cents in the same response, and the worker's hire_status is CLEARED on the immediately-following read (no lag)."
        test_recipe:
          setup:
            - "Employer ACTIVE; PHYSICAL@9000; worker OP; encounter checked in; FIT clearance issued."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Imm Cons Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Im Mcons", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/encounters/${enc_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { billable: $.data.billable_amount_cents, st: $.data.status }
            - call: "GET /clinic/workers/${wkr_id}"
              payload: {}
              as: ClinicAdmin
              captures: { hs: $.data.hire_status }
          assert:
            - "Encounter.${enc_id}.status == COMPLETED"
            - "Encounter.${enc_id}.billable_amount_cents == 9000"
            - "Worker.${wkr_id}.hire_status == CLEARED"
