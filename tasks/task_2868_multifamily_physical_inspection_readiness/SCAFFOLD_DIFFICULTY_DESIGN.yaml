            - "Inspection.${insp_b}.status == NOTIFIED"
            - "Inspection.${insp_a}.status == NOTIFIED"

      - name: inspection_window_rejected_when_expanded_buffers_touch_at_exactly_one_instant
        grounds:
          - validations[priority=52]
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
          - endpoints[POST /inspections]
        distinguishing_aspect: |
          The scheduling scan expands BOTH intervals by INSPECTION_COOLDOWN_BUFFER_HOURS (72) and
          then uses CLOSED-interval arithmetic, so the requested window is rejected even though the
          two literal inspection windows are six days apart and never overlap. The same request
          moved one millisecond later is accepted, which pins the touching-endpoint semantics: an
          implementation using strict `<`/`>` on the raw windows, or half-open comparison on the
          expanded ones, passes one of the two trigger calls and fails the other.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard; Property Cedar Walk (total_unit_count 1) with unit 101."
            - "Inspection X occupies [2026-09-10T09:00:00.000Z, 2026-09-10T17:00:00.000Z] in status SCHEDULED, so its expanded interval is [2026-09-07T09:00:00.000Z, 2026-09-13T17:00:00.000Z]."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_x: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-16T17:00:00.000Z", scheduled_end: "2026-09-17T09:00:00.000Z", inspection_kind: "SPECIAL" }
              as: HousingAgencyInspector
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-16T17:00:00.001Z", scheduled_end: "2026-09-17T09:00:00.000Z", inspection_kind: "SPECIAL" }
              as: HousingAgencyInspector
              captures: { insp_y: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_INSPECTION_WINDOW_CONFLICT because its expanded start 2026-09-13T17:00:00.000Z equals Inspection ${insp_x}'s expanded end"
            - "the second trigger call succeeds with HTTP 201 because its expanded start is 2026-09-13T17:00:00.001Z"
            - "Inspection.${insp_y}.scheduled_start == 2026-09-16T17:00:00.001Z"
            - "Inspection.${insp_y}.status == SCHEDULED"
            - "GET /inspections?property_id=${prop_id} has total_count == 2 and contains exactly ${insp_x} and ${insp_y}"

      - name: third_overlapping_sweep_rejected_by_aggregate_capacity_of_two
        grounds:
          - validations[priority=54]
          - errors[ERR_SWEEP_CAPACITY_EXCEEDED]
          - state_machines.SelfAssessmentSweep.PLANNED_to_IN_PROGRESS
        distinguishing_aspect: |
          No pair of sweeps is illegal here - the limit is an AGGREGATE one: at most two sweeps in
          {PLANNED, IN_PROGRESS} may cover any single instant, so the violation is only visible by
          counting concurrent cover at the requested instants rather than by pairwise comparison.
          The intervals are also half-open, so the fourth request, which begins exactly when the
          surviving sweep ends, shares no instant with anything and is accepted.
        test_recipe:
          setup:
            - "Property Cedar Walk with one unit."
            - "Sweep 1 covers [2026-08-02T00:00:00.000Z, 2026-08-20T00:00:00.000Z) and is started, so it is IN_PROGRESS."
            - "Sweep 2 covers [2026-08-10T00:00:00.000Z, 2026-08-25T00:00:00.000Z) and stays PLANNED."
            - "Both therefore cover 2026-08-15T00:00:00.000Z, exhausting SWEEP_OVERLAP_CAPACITY."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw1: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw1}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-10T00:00:00.000Z", window_end: "2026-08-25T00:00:00.000Z", planned_area_scope: "UNIT_ONLY" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw2: $.data.id }
          trigger:
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-14T00:00:00.000Z", window_end: "2026-08-16T00:00:00.000Z", planned_area_scope: "OUTSIDE_ONLY" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-25T00:00:00.000Z", window_end: "2026-08-30T00:00:00.000Z", planned_area_scope: "OUTSIDE_ONLY" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw4: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_SWEEP_CAPACITY_EXCEEDED"
            - "the second trigger call succeeds with HTTP 201 because [2026-08-25T00:00:00.000Z, ...) shares no instant with sweep ${sw2}'s half-open window"
            - "SelfAssessmentSweep.${sw4}.status == PLANNED"
            - "SelfAssessmentSweep.${sw1}.status == IN_PROGRESS and SelfAssessmentSweep.${sw2}.status == PLANNED"
            - "GET /self-assessment-sweeps?property_id=${prop_id} has total_count == 3"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_allocation_sum_invariant_holds_across_two_recompute_generations
        grounds:
          - calculations.capital_reserve_allocation
          - calculations.capital_need_recurrence_count
          - state_machines.CapitalNeedItem.ACTIVE_to_SUPERSEDED
          - entities.Property.fields.allocated_reserve_total_cents
          - concurrency_rules[capital-recompute-stale-property]
        distinguishing_aspect: |
          The invariant that must survive every recompute is
          sum(allocated_reserve_cents over ACTIVE CapitalNeedItem rows)
            == Property.allocated_reserve_total_cents == Property.capital_reserve_cents,
          and it has to hold even though the second generation redistributes the very same
          1000000 cents over a different rank order with a different remainder (1 cent under
          CALENDAR_SCOPED, 0 cents under INSPECTION_SCOPED). The superseding generation must also
          zero the old rows out: an implementation that leaves the superseded allocations in place
          doubles allocated_reserve_total_cents to 2000000 while every individual row still looks
          right, and an implementation that recomputes the total over ALL rows regardless of
          status shows the same drift.
        test_recipe:
          setup:
            - "The Birch Row fixture: ADOPTED standard with SEV_WINDOW / SEV_DOOR / MOD_FLOOR (base 8.00 each) plus LT_GAS, capital_reserve_cents exactly 1000000, one unit 201."
            - "Three injected CLOSED inspections finalized 2024-09-15, 2025-06-15 and 2026-03-15 as in capital_reserve_allocation_floor_then_remainder_walk."
            - "A first CALENDAR_SCOPED recompute produces generation 1 with recurrence 3 / 2 / 2, priority 48.00 / 32.00 / 16.00 and allocations 500001 / 333333 / 166666."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_window: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_DOOR", name: "Non-latching entry door", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
