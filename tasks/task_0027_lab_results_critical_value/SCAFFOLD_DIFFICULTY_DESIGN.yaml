  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: result_release_requires_specimen_accessioned
        grounds:
          - state_machines.Result.transitions.PROVISIONAL_to_RELEASED
          - entities.Specimen.fields.status
        distinguishing_aspect: |
          Result.PROVISIONAL→RELEASED preconditions include `Specimen.status == ACCESSIONED`.
          With Specimen.status == IN_TRANSIT (not yet ACCESSIONED), the release is rejected with
          ERR_INVALID_STATE. Entity pair: Result depends on Specimen — distinct from instance 2
          (Acknowledgement depends on CriticalNotification).
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "A LabOrder with one Specimen in IN_TRANSIT (NOT yet accessioned), one COMPLETED InstrumentRun against that specimen (created administratively — wait, the InstrumentRun requires specimen.status==ACCESSIONED at booking time per §1.4 priority 8 + per Result.PROVISIONAL→RELEASED precondition cross-reference)"
            - "Adjusted setup: specimen sp is ACCESSIONED at first (to allow InstrumentRun booking + completion + result creation), then reverted via REJECTED — but priority 6 forbids rejecting if released result exists. We avoid that by NOT releasing yet. Specimen sp ACCESSIONED → InstrumentRun completed → PROVISIONAL Result created. Then the test releases — but specimen is still ACCESSIONED, so it would succeed. To fail the release, we must put specimen in a non-ACCESSIONED state at release time. We REJECT sp BEFORE release. priority 6: rejection forbidden only if RELEASED result on sp; PROVISIONAL is fine. After sp REJECTED, the Result is implicitly INVALIDATED (declared in §1.2 Specimen reject side-effects). So we cannot release an INVALIDATED Result either."
            - "Practical realization: build a SECOND specimen sp2 that is INT_TRANSIT. Create a new Result row pointing at sp2 — but POST /results validation priority 9 requires specimen.lab_order_id matches. So sp2 must be on the same order. POST /results does not require specimen.status — just that specimen exists and the FK chain is consistent. Then release tries to fire; precondition specimen.status==ACCESSIONED fails → ERR_INVALID_STATE."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "7000000001", full_name: "Director C1", role_type: "LAB_DIRECTOR", phone_e164: "+12025551300" }
