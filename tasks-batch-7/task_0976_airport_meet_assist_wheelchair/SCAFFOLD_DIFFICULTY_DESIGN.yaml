              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/agents/${ag_id}/events"
              payload: { event_type: "SUSPEND", reason: "first" }
              as: OpsManager
            - call: "POST /maa/agents/${ag_id}/events"
              payload: { event_type: "REINSTATE" }
              as: OpsManager
          trigger:
            - call: "POST /maa/agents/${ag_id}/events"
              payload: { event_type: "SUSPEND", reason: "second" }
              as: OpsManager
          assert:
            - "Agent.${ag_id}.status == SUSPENDED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lockdown_cascade_airport_to_leg_to_assignment_to_chair_to_agent_count
        grounds:
          - state_machines.Airport.DEGRADED_to_LOCKDOWN
          - state_machines.ServiceLeg
          - state_machines.WheelchairAsset.CHECKED_OUT_to_AVAILABLE
          - entities.Agent.fields.active_assignment_count
        distinguishing_aspect: |
          Depth-4 transitive cascade: Airport posture → ServiceLeg CANCELLED → Assignment CANCELLED
          → WheelchairAsset CHECKED_OUT → AVAILABLE → Agent.active_assignment_count decremented.
          Each link is caused by the previous link, not by the original posture event.
        test_recipe:
          setup:
            - "Airport BOS NORMAL → DEGRADED with one DISPATCHED assignment (agent count == 1, chair CHECKED_OUT)"
            - "Then posture DEGRADED → LOCKDOWN"
          setup_api_calls:
