scenario: |
  Public Health Emergency Preparedness & POD: hazard/scenario plan, points-of-dispensing site & throughput model, staff/MRC volunteer roster & credential, countermeasure/SNS inventory & allocation, mass-vaccination/prophylaxis registration, after-action & drill, mutual-aid, situational reporting

domain_name: "public-health-pod-preparedness"
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers: [optimistic_concurrency, cascading_side_effects, rate_threshold_triggers, derived_field_reconciliation]

  entity_topology: graph
  # PODs, staff, countermeasures, inventory lots, allocation requests and dispensing
  # events cross-reference each other (AllocationRequest ties POD+Countermeasure+
  # partner-POD; DispensingEvent ties POD+Countermeasure+InventoryLot+StaffMember
  # twice); only HazardPlan->POD, HazardPlan->Drill/SituationReport are strict
  # parent/child. No single tree describes the whole system.

  state_machine_shape: cyclic
  # POD (OPERATIONAL<->RESTRICTED) and DispensingEvent (SCREENED<->DEFERRED) both
  # cycle; Drill additionally carries two independent parallel dimensions
  # (status x corrective_action_status) on the same row.

  relationship_patterns:
    - one_to_many        # HazardPlan -> POD, HazardPlan -> Drill/SituationReport
    - many_to_many        # ShiftAssignment is the StaffMember x POD/shift junction
    - cross_aggregate      # AllocationRequest and DispensingEvent span POD, Countermeasure, InventoryLot, StaffMember
    - polymorphic          # AllocationRequest.pod_id and .partner_pod_id both reference POD in different roles (requester vs lender)

  role_model: hierarchical_override
  # PublicHealthAdmin overrides all POD/HazardPlan/StaffMember/Drill operations;
  # LogisticsCoordinator, MutualAidPartner, ClinicalLead and Volunteer are peers
  # who each own a distinct slice of the operational surface.

  consistency_model: immediate
  # All derived fields (POD.operational_status, POD.risk_tier, POD.queue_backlog_count,
  # POD.committed_staff_hours, HazardPlan.readiness_score, InventoryLot.available_quantity,
  # AllocationRequest.reimbursement_cost_usd) are recomputed synchronously inside the
  # same request that triggers them; no background reconciliation.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: HazardPlan
    parent: null
    common_fields: true
    fields:
      - name: hazard_type
        type: enum
        source: input
        description: "Category of public-health emergency this plan addresses."
        constraints: "one of PANDEMIC_INFLUENZA, BIOTERRORISM_ANTHRAX, RADIOLOGICAL_INCIDENT, CHEMICAL_RELEASE, NATURAL_DISASTER, OUTBREAK_OTHER"
      - name: title
        type: string
        source: input
        description: "Human-readable plan name."
      - name: jurisdiction_code
        type: string
        source: input
        description: "County/jurisdiction code that owns this plan."
      - name: target_population
        type: integer
        source: input
        description: "Estimated population requiring dispensing under this plan."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the plan."
        default: DRAFT
        constraints: "one of DRAFT, ACTIVATED, STOOD_DOWN"
      - name: activated_at
        type: datetime
        source: system
        description: "Timestamp the plan was activated; null until activate."
        default: null
      - name: stood_down_at
        type: datetime
        source: system
        description: "Timestamp the plan was stood down; null until stand_down."
        default: null
      - name: readiness_score
        type: number
        source: computed
        description: "0-100. round(100 * count(Drill COMPLETED with corrective_action_status in {NONE,CLOSED}) / max(count(Drill for this plan),1), 0); recomputed synchronously on every Drill complete/close_corrective_action."
        default: 0

  - name: POD
    parent: HazardPlan
    common_fields: true
    fields:
      - name: hazard_plan_id
        type: string
        source: input
        description: "FK -> HazardPlan.id"
      - name: site_name
        type: string
        source: input
        description: "POD site display name."
      - name: site_type
        type: enum
        source: input
        description: "Physical format of the POD."
        constraints: "one of FIXED_POD, MOBILE_POD, DRIVE_THROUGH, CLOSED_POD"
      - name: address
        type: string
        source: input
        description: "Street address of the POD site."
      - name: staffing_capacity_lanes
        type: integer
        source: input
        description: "Maximum number of dispensing lanes this POD can run concurrently."
        constraints: "> 0"
      - name: lane_throughput_rate_per_hour
        type: integer
        source: input
        description: "Doses one staffed lane can dispense per hour."
        constraints: "> 0"
      - name: operational_status
        type: enum
        source: computed
        description: "Operational posture of the POD; gates dispensing and staffing actions."
        default: STAGING
        constraints: "one of STAGING, OPERATIONAL, RESTRICTED, CLOSED"
      - name: risk_tier
        type: enum
        source: computed
        description: "CRITICAL if operational_status == RESTRICTED; else ELEVATED if queue_backlog_count >= 20; else STANDARD. Recomputed synchronously whenever operational_status or queue_backlog_count changes; read (never recomputed inline) by the allocation_priority_score calculation."
        default: STANDARD
        constraints: "one of STANDARD, ELEVATED, CRITICAL"
      - name: queue_backlog_count
        type: integer
        source: computed
        description: "Count of this POD's DispensingEvent rows currently in {REGISTERED, SCREENED, DEFERRED}. Incremented on dispensing-event creation, decremented on refuse/dispense."
        default: 0
      - name: open_allocation_request_count
        type: integer
        source: computed
        description: "Count of this POD's AllocationRequest rows currently in status REQUESTED. Incremented on allocation-request creation, decremented on reserve/deny."
        default: 0
      - name: committed_staff_hours
        type: number
        source: computed
        description: "Sum of (end_time - start_time) in hours over this POD's ShiftAssignment rows with status in {CONFIRMED, CHECKED_IN, COMPLETED}. Incremented when a ShiftAssignment is confirmed, decremented by the same amount when a CONFIRMED assignment is cancelled (compensating-invariant pair)."
        default: 0

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer's full name."
      - name: email
        type: string
        source: input
        description: "Contact email."
        constraints: "unique across StaffMember"
      - name: primary_role
        type: enum
        source: input
        description: "Primary functional role this volunteer serves in."
        constraints: "one of CLINICAL_LEAD, SCREENER, VACCINATOR, RUNNER, TRAFFIC_CONTROL, GREETER"
      - name: mrc_unit
        type: string
        source: input
        description: "Medical Reserve Corps unit affiliation."
      - name: credential_type
        type: enum
        source: input
        description: "Type of the volunteer's primary professional/training credential."
        constraints: "one of RN_LICENSE, MD_LICENSE, EMT_CERT, NIMS_IS100_700, BACKGROUND_CHECK, PODS_TRAINING"
      - name: credential_expires_at
        type: datetime
        source: input
        description: "Expiration timestamp of the credential."
      - name: credential_status
        type: enum
        source: computed
        description: "Verification lifecycle of the credential."
        default: PENDING
        constraints: "one of PENDING, VERIFIED, REVOKED"

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: "FK -> POD.id"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id"
      - name: assigned_role
        type: enum
        source: input
        description: "Functional role this assignment covers."
        constraints: "one of CLINICAL_LEAD, SCREENER, VACCINATOR, RUNNER, TRAFFIC_CONTROL, GREETER"
      - name: start_time
        type: datetime
        source: input
        description: "Shift window start (UTC, ISO 8601)."
      - name: end_time
        type: datetime
        source: input
        description: "Shift window end (UTC, ISO 8601); must be strictly after start_time."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the assignment."
        default: PENDING
        constraints: "one of PENDING, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED"

  - name: Countermeasure
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Formulary display name, e.g. 'Influenza Vaccine' or 'Doxycycline PEP'."
      - name: countermeasure_type
        type: enum
        source: input
        description: "Category of countermeasure."
        constraints: "one of VACCINE, ANTIVIRAL, ANTIBIOTIC_PEP"
      - name: doses_required
        type: integer
        source: input
        description: "Number of doses that make up one complete regimen for a single registrant."
        constraints: "> 0"
      - name: dose_interval_days
        type: integer
        source: input
        description: "Days between doses in a multi-dose regimen; 0 for single-dose countermeasures."
        default: 0
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost, in whole US cents, of one complete regimen (all doses_required doses)."
        constraints: ">= 0"
      - name: reorder_point_quantity
        type: integer
        source: input
        description: "Formulary reorder threshold: a POD-scoped InventoryLot's available_quantity falling strictly below this value for this countermeasure triggers automatic POD restriction."
        constraints: ">= 0"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: countermeasure_id
        type: string
        source: input
        description: "FK -> Countermeasure.id"
      - name: pod_id
        type: string
        source: input
        description: "FK -> POD.id; null means this lot is the central SNS cache lot (not tied to a specific POD)."
        default: null
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer/distribution lot number."
      - name: on_hand_quantity
        type: integer
        source: input
        description: "Total physical dose count in this lot."
        constraints: ">= 0"
      - name: reserved_quantity
        type: integer
        source: computed
        description: "Doses reserved against this lot by RESERVED AllocationRequests; incremented on reserve, decremented on cancel/fulfill."
        default: 0
      - name: available_quantity
        type: integer
        source: computed
        description: "on_hand_quantity - reserved_quantity. Recomputed on every mutation to either input."
        default: 0
      - name: expiration_date
        type: datetime
        source: input
        description: "Lot expiration timestamp; must be strictly after current clock time at creation."

  - name: AllocationRequest
    parent: null
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: "FK -> POD.id (the requesting POD)"
      - name: countermeasure_id
        type: string
        source: input
        description: "FK -> Countermeasure.id"
      - name: source_type
        type: enum
        source: input
        description: "Where this request draws quantity from."
        default: SNS_CACHE
        constraints: "one of SNS_CACHE, MUTUAL_AID"
      - name: partner_pod_id
        type: string
        source: input
        description: "FK -> POD.id; the lending POD/jurisdiction. Required and must differ from pod_id when source_type == MUTUAL_AID; must be null when source_type == SNS_CACHE."
        default: null
      - name: requested_quantity
        type: integer
        source: input
        description: "Doses requested."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the request."
        default: REQUESTED
        constraints: "one of REQUESTED, RESERVED, FULFILLED, DENIED, CANCELLED"
      - name: reserved_quantity
        type: integer
        source: computed
        description: "Set to requested_quantity when reserved; reset to 0 on fulfill/cancel."
        default: 0
      - name: fulfilled_quantity
        type: integer
        source: computed
        description: "Set to reserved_quantity when fulfilled."
        default: 0
      - name: source_inventory_lot_id
        type: string
        source: computed
        description: "FK -> InventoryLot.id; the lot this request draws against. Null until reserve."
        default: null
      - name: priority_score
        type: number
        source: computed
        description: "Computed and stored at reserve time by the allocation_priority_score calculation."
        default: 0
      - name: reimbursement_cost_usd
        type: number
        source: computed
        description: "Only meaningful when source_type == MUTUAL_AID; set at fulfill time by the mutual_aid_reimbursement_cost calculation. 0 for SNS_CACHE requests."
        default: 0

  - name: DispensingEvent
    parent: null
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: "FK -> POD.id"
      - name: countermeasure_id
        type: string
        source: input
        description: "FK -> Countermeasure.id"
      - name: inventory_lot_id
        type: string
        source: computed
        description: "FK -> InventoryLot.id; set at dispense time."
        default: null
      - name: registrant_full_name
        type: string
        source: input
        description: "Name of the person being registered/dispensed to."
      - name: registrant_risk_group
        type: enum
        source: input
        description: "Risk/priority group of the registrant."
        constraints: "one of GENERAL_PUBLIC, HEALTHCARE_WORKER, FIRST_RESPONDER, HIGH_RISK_MEDICAL"
      - name: dose_count
        type: integer
        source: input
        description: "Number of doses this dispensing event covers."
        default: 1
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the registration/dispensing workflow."
        default: REGISTERED
        constraints: "one of REGISTERED, SCREENED, DEFERRED, REFUSED, DISPENSED"
      - name: screened_by_staff_member_id
        type: string
        source: computed
        description: "FK -> StaffMember.id; set at screen time."
        default: null
      - name: dispensed_by_staff_member_id
        type: string
        source: computed
        description: "FK -> StaffMember.id; set at dispense time."
        default: null
      - name: deferral_reason
        type: string
        source: input
        description: "Required when transitioning to DEFERRED; cleared on rescreen."
        default: null

  - name: Drill
    parent: HazardPlan
    common_fields: true
    fields:
      - name: hazard_plan_id
        type: string
        source: input
        description: "FK -> HazardPlan.id"
      - name: drill_type
        type: enum
        source: input
        description: "Exercise format."
        constraints: "one of TABLETOP, FUNCTIONAL, FULL_SCALE"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Planned exercise date/time."
      - name: status
        type: enum
        source: computed
        description: "Exercise lifecycle dimension."
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: finding
        type: string
        source: input
        description: "After-action finding recorded at completion; optional."
        default: null
      - name: corrective_action
        type: string
        source: input
        description: "Corrective action recorded at completion; optional."
        default: null
      - name: corrective_action_status
        type: enum
        source: computed
        description: "Independent parallel dimension tracking closure of corrective_action, evolving separately from status."
        default: NONE
        constraints: "one of NONE, OPEN, CLOSED"

  - name: SituationReport
    parent: HazardPlan
    common_fields: false
    fields:
      - name: hazard_plan_id
        type: string
        source: input
        description: "FK -> HazardPlan.id"
      - name: report_period_label
        type: string
        source: input
        description: "Operational period label, e.g. 'OPS_PERIOD_3'."
      - name: pods_operational_count
        type: integer
        source: computed
        description: "Snapshot count of this plan's POD rows with operational_status == OPERATIONAL, taken at creation."
      - name: pods_restricted_count
        type: integer
        source: computed
        description: "Snapshot count of this plan's POD rows with operational_status == RESTRICTED, taken at creation."
      - name: total_doses_dispensed
        type: integer
        source: computed
        description: "Snapshot sum of dose_count over this plan's DispensingEvent rows with status == DISPENSED, taken at creation."
      - name: total_on_hand_inventory
        type: integer
        source: computed
        description: "Snapshot sum of on_hand_quantity over InventoryLot rows whose pod_id belongs to this plan's PODs, taken at creation."
      - name: staffing_fill_rate_pct
        type: number
        source: computed
        description: "Snapshot: round(100 * count(ShiftAssignment for this plan's PODs with status in {CONFIRMED,CHECKED_IN,COMPLETED}) / count(ShiftAssignment for this plan's PODs), 1); 0 when the denominator is 0."
      - name: total_mutual_aid_reimbursement_usd
        type: number
        source: computed
        description: "Snapshot sum of AllocationRequest.reimbursement_cost_usd over this plan's PODs' FULFILLED, source_type == MUTUAL_AID requests, taken at creation. Each addend was already rounded to 2 decimals at its own fulfill time (round-per-line-then-sum)."
      - name: readiness_status
        type: enum
        source: computed
        description: "RED if pods_restricted_count >= 1 OR staffing_fill_rate_pct < RED_THRESHOLD; else YELLOW if staffing_fill_rate_pct < YELLOW_THRESHOLD; else GREEN."
        constraints: "one of GREEN, YELLOW, RED"
      - name: narrative
        type: string
        source: input
        description: "Free-text situational narrative."
        default: null

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: HazardPlan
    initial_state: DRAFT
    terminal_states: [STOOD_DOWN]
    transitions:
      - from: DRAFT
        to: ACTIVATED
        trigger: "POST /hazard-plans/{id}/activate"
        actor: PublicHealthAdmin
        preconditions: ["HazardPlan.status == DRAFT"]
        side_effects: ["sets activated_at = current clock time"]
      - from: ACTIVATED
        to: STOOD_DOWN
        trigger: "POST /hazard-plans/{id}/stand_down"
        actor: PublicHealthAdmin
        preconditions: ["HazardPlan.status == ACTIVATED", "every POD with this hazard_plan_id has operational_status == CLOSED"]
        side_effects: ["sets stood_down_at = current clock time"]
        note: "Cross-entity state dependency: HazardPlan<->POD pair (Rule 7 instance)."

  - entity: POD
    initial_state: STAGING
    terminal_states: [CLOSED]
    transitions:
      - from: STAGING
        to: OPERATIONAL
        trigger: "POST /pods/{id}/open"
        actor: PublicHealthAdmin
        preconditions: ["POD.operational_status == STAGING", "hazard_plan.status == ACTIVATED"]
        side_effects: ["operational_status = OPERATIONAL"]
      - from: OPERATIONAL
        to: RESTRICTED
        trigger: "POST /pods/{id}/restrict (manual) OR system cascade from POST /dispensing-events/{id}/dispense when the dispensed countermeasure's POD-scoped InventoryLot.available_quantity drops strictly below Countermeasure.reorder_point_quantity (Cascade A hop 2) OR system cascade from POST /staff-members/{id}/revoke-credential when the resulting confirmed coverage for an affected role at this POD drops below 1 (Cascade B hop 2)"
        actor: "PublicHealthAdmin | system"
        preconditions: ["POD.operational_status == OPERATIONAL"]
        side_effects: ["operational_status = RESTRICTED", "risk_tier recomputed (becomes CRITICAL)"]
        note: "Non-linear (cyclic) state machine instance on POD (Rule 3 instance 1). Also the second hop of both Cascade A and Cascade B (Rule 4)."
      - from: RESTRICTED
        to: OPERATIONAL
        trigger: "POST /pods/{id}/resume"
        actor: PublicHealthAdmin
        preconditions: ["POD.operational_status == RESTRICTED"]
        side_effects: ["operational_status = OPERATIONAL", "risk_tier recomputed"]
      - from: STAGING
        to: CLOSED
        trigger: "POST /pods/{id}/close"
        actor: PublicHealthAdmin
        preconditions: ["no ShiftAssignment with this pod_id has status == CHECKED_IN"]
        side_effects: ["operational_status = CLOSED", "cancels every ShiftAssignment with this pod_id in status {PENDING, CONFIRMED}"]
      - from: OPERATIONAL
        to: CLOSED
        trigger: "POST /pods/{id}/close"
        actor: PublicHealthAdmin
        preconditions: ["no ShiftAssignment with this pod_id has status == CHECKED_IN"]
        side_effects: ["operational_status = CLOSED", "cancels every ShiftAssignment with this pod_id in status {PENDING, CONFIRMED}"]
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /pods/{id}/close"
        actor: PublicHealthAdmin
        preconditions: ["no ShiftAssignment with this pod_id has status == CHECKED_IN"]
        side_effects: ["operational_status = CLOSED", "cancels every ShiftAssignment with this pod_id in status {PENDING, CONFIRMED}"]

  - entity: StaffMember
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /staff-members/{id}/verify-credential"
        actor: PublicHealthAdmin
        preconditions: ["StaffMember.credential_status == PENDING"]
        side_effects: ["credential_status = VERIFIED"]
      - from: PENDING
        to: REVOKED
        trigger: "POST /staff-members/{id}/revoke-credential"
        actor: PublicHealthAdmin
        preconditions: ["StaffMember.credential_status in {PENDING, VERIFIED}"]
        side_effects: ["credential_status = REVOKED", "cascades: every ShiftAssignment with this staff_member_id in status {PENDING, CONFIRMED} is auto-CANCELLED (Cascade B hop 1)", "if a cancelled assignment's POD had confirmed coverage for assigned_role drop below 1 and that POD.operational_status == OPERATIONAL, POD.operational_status auto-transitions to RESTRICTED (Cascade B hop 2)"]
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /staff-members/{id}/revoke-credential"
        actor: PublicHealthAdmin
        preconditions: ["StaffMember.credential_status in {PENDING, VERIFIED}"]
        side_effects: ["credential_status = REVOKED", "cascades: every ShiftAssignment with this staff_member_id in status {PENDING, CONFIRMED} is auto-CANCELLED (Cascade B hop 1)", "if a cancelled assignment's POD had confirmed coverage for assigned_role drop below 1 and that POD.operational_status == OPERATIONAL, POD.operational_status auto-transitions to RESTRICTED (Cascade B hop 2)"]
        note: "Trigger of Cascade B (Rule 4 instance 2, depth 2: StaffMember -> ShiftAssignment -> POD)."

  - entity: ShiftAssignment
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /shift-assignments/{id}/confirm"
        actor: "ClinicalLead | PublicHealthAdmin"
        preconditions:
          - "ShiftAssignment.status == PENDING"
          - "StaffMember.credential_status == VERIFIED (Rule 7 instance: ShiftAssignment<->StaffMember pair)"
          - "StaffMember.credential_expires_at > current clock time (strict; boundary-precision instance)"
          - "no other ShiftAssignment for the same staff_member_id in status {CONFIRMED, CHECKED_IN} has an overlapping [start_time, end_time) interval (Rule 8 instance 1: pairwise half-open overlap on StaffMember)"
          - "count of ShiftAssignment rows at this pod_id in status {CONFIRMED, CHECKED_IN} whose [start_time, end_time) interval overlaps this one, plus 1, does not exceed POD.staffing_capacity_lanes (Rule 8 instance 2: aggregate capacity on POD)"
        side_effects: ["status = CONFIRMED", "POD.committed_staff_hours += (end_time - start_time) in hours"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /shift-assignments/{id}/check_in"
        actor: "Volunteer | ClinicalLead"
        preconditions: ["ShiftAssignment.status == CONFIRMED", "POD.operational_status in {STAGING, OPERATIONAL, RESTRICTED}", "when actor is Volunteer, X-User-ID == staff_member_id"]
        side_effects: ["status = CHECKED_IN"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /shift-assignments/{id}/check_out"
        actor: ClinicalLead
        preconditions: ["ShiftAssignment.status == CHECKED_IN"]
        side_effects: ["status = COMPLETED"]
      - from: PENDING
        to: CANCELLED
        trigger: "POST /shift-assignments/{id}/cancel"
        actor: "Volunteer | PublicHealthAdmin | ClinicalLead | system"
        preconditions: ["ShiftAssignment.status == PENDING", "when actor is Volunteer, X-User-ID == staff_member_id"]
        side_effects: ["status = CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shift-assignments/{id}/cancel"
        actor: "Volunteer | PublicHealthAdmin | ClinicalLead | system"
        preconditions: ["ShiftAssignment.status == CONFIRMED", "when actor is Volunteer, X-User-ID == staff_member_id"]
        side_effects: ["status = CANCELLED", "POD.committed_staff_hours -= (end_time - start_time) in hours (restores the confirm side effect; compensating-invariant instance 2)"]

  - entity: AllocationRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /allocation-requests/{id}/reserve"
        actor: "LogisticsCoordinator | MutualAidPartner"
        preconditions:
          - "AllocationRequest.status == REQUESTED"
          - "hazard_plan.status == ACTIVATED, resolved via pod_id -> POD.hazard_plan_id (Rule 7 instance: AllocationRequest<->HazardPlan pair)"
          - "actor role matches source_type: LogisticsCoordinator only when source_type == SNS_CACHE, MutualAidPartner only when source_type == MUTUAL_AID"
          - "source InventoryLot (pod_id == null and countermeasure_id == countermeasure_id when SNS_CACHE; pod_id == partner_pod_id and countermeasure_id == countermeasure_id when MUTUAL_AID) has available_quantity >= requested_quantity (boundary-precision instance: zero-quantity edge)"
        side_effects:
          - "status = RESERVED"
          - "reserved_quantity = requested_quantity"
          - "source InventoryLot.reserved_quantity += requested_quantity"
          - "source InventoryLot.version += 1"
          - "source_inventory_lot_id = the source InventoryLot's id"
          - "priority_score computed and stored (allocation_priority_score calculation)"
          - "POD.open_allocation_request_count -= 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /allocation-requests/{id}/deny"
        actor: "LogisticsCoordinator | MutualAidPartner"
        preconditions: ["AllocationRequest.status == REQUESTED", "actor role matches source_type as in reserve"]
        side_effects: ["status = DENIED", "POD.open_allocation_request_count -= 1"]
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /allocation-requests/{id}/fulfill"
        actor: LogisticsCoordinator
        preconditions: ["AllocationRequest.status == RESERVED"]
        side_effects:
          - "status = FULFILLED"
          - "fulfilled_quantity = reserved_quantity"
          - "requesting POD's InventoryLot (pod_id == AllocationRequest.pod_id, countermeasure_id == countermeasure_id) on_hand_quantity += fulfilled_quantity; selector when more than one such lot exists: the one with the earliest created_at (never id); if none exists, create one first with on_hand_quantity=0, lot_number='AUTO-<AllocationRequest.id>', expiration_date = the source InventoryLot's own expiration_date"
          - "source InventoryLot.on_hand_quantity -= fulfilled_quantity"
          - "source InventoryLot.reserved_quantity -= fulfilled_quantity"
          - "when source_type == MUTUAL_AID, reimbursement_cost_usd computed and stored (mutual_aid_reimbursement_cost calculation)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /allocation-requests/{id}/cancel"
        actor: "LogisticsCoordinator | MutualAidPartner"
        preconditions: ["AllocationRequest.status == RESERVED"]
        side_effects: ["status = CANCELLED", "source InventoryLot.reserved_quantity -= reserved_quantity (compensating-invariant instance 1: reserved_quantity + available_quantity == on_hand_quantity restored)"]

  - entity: DispensingEvent
    initial_state: REGISTERED
    terminal_states: [DISPENSED, REFUSED]
    transitions:
      - from: REGISTERED
        to: SCREENED
        trigger: "POST /dispensing-events/{id}/screen"
        actor: ClinicalLead
        preconditions: ["DispensingEvent.status == REGISTERED"]
        side_effects: ["status = SCREENED", "screened_by_staff_member_id set"]
      - from: SCREENED
        to: DEFERRED
        trigger: "POST /dispensing-events/{id}/defer"
        actor: ClinicalLead
        preconditions: ["DispensingEvent.status == SCREENED", "deferral_reason non-empty in request body"]
        side_effects: ["status = DEFERRED", "deferral_reason stored"]
      - from: DEFERRED
        to: SCREENED
        trigger: "POST /dispensing-events/{id}/rescreen"
        actor: ClinicalLead
        preconditions: ["DispensingEvent.status == DEFERRED"]
        side_effects: ["status = SCREENED", "deferral_reason cleared"]
        note: "Non-linear (cyclic) state machine instance on DispensingEvent (Rule 3 instance 2), distinct entity from POD's cycle."
      - from: SCREENED
        to: REFUSED
        trigger: "POST /dispensing-events/{id}/refuse"
        actor: ClinicalLead
        preconditions: ["DispensingEvent.status == SCREENED"]
        side_effects: ["status = REFUSED", "POD.queue_backlog_count -= 1"]
      - from: SCREENED
        to: DISPENSED
        trigger: "POST /dispensing-events/{id}/dispense"
        actor: ClinicalLead
        preconditions:
          - "DispensingEvent.status == SCREENED"
          - "POD.operational_status in {OPERATIONAL, RESTRICTED} (Rule 7 instance: DispensingEvent<->POD pair)"
          - "a POD-scoped InventoryLot (pod_id == this POD, countermeasure_id == countermeasure_id) exists with available_quantity >= dose_count; when multiple such lots qualify, the selected lot is the one with the earliest expiration_date (first-expire-first-out), tie-broken by earliest created_at (never id)"
        side_effects:
          - "status = DISPENSED"
          - "dispensed_by_staff_member_id set"
          - "POD.queue_backlog_count -= 1"
          - "inventory_lot_id set to the selected POD-scoped InventoryLot's id (per the FEFO selector above)"
          - "InventoryLot.on_hand_quantity -= dose_count (Cascade A hop 1)"
          - "if the resulting InventoryLot.available_quantity < Countermeasure.reorder_point_quantity and POD.operational_status == OPERATIONAL, POD.operational_status auto-transitions to RESTRICTED (Cascade A hop 2)"
          - "if the POD auto-transitioned to RESTRICTED via the previous side effect, system auto-creates a new AllocationRequest (pod_id = this POD, countermeasure_id = countermeasure_id, source_type = SNS_CACHE, requested_quantity = Countermeasure.reorder_point_quantity, status = REQUESTED) and increments POD.open_allocation_request_count by 1 (Cascade A hop 3)"
        note: "Trigger of Cascade A (Rule 4 instance 1, depth 3: InventoryLot -> POD -> AllocationRequest)."

  - entity: Drill
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /drills/{id}/complete"
        actor: PublicHealthAdmin
        preconditions: ["Drill.status == SCHEDULED"]
        side_effects: ["status = COMPLETED", "if corrective_action provided in the request body, corrective_action_status transitions NONE -> OPEN (independent parallel dimension)", "HazardPlan.readiness_score recomputed"]
        note: "status and corrective_action_status are independent parallel dimensions on Drill; this transition only advances status."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /drills/{id}/cancel"
        actor: PublicHealthAdmin
        preconditions: ["Drill.status == SCHEDULED"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /drills/{id}/close_corrective_action"
        actor: PublicHealthAdmin
        preconditions: ["Drill.status == COMPLETED", "Drill.corrective_action_status == OPEN"]
        side_effects: ["corrective_action_status = CLOSED", "HazardPlan.readiness_score recomputed"]
        note: "Operates on the corrective_action_status dimension only; status remains COMPLETED throughout."

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-request-create-stale-pod
    parent_entity: POD
    write_endpoint: "POST /allocation-requests"
    occ_field: "expected_pod_version"
    description: |
      Creating an AllocationRequest against a POD whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the POD's operational posture (or open_allocation_request_count)
      changed between when the client last read POD state and when it submits
      the request, so the priority_score computed at reserve time never acts
      on a stale posture assumption.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-request-reserve-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /allocation-requests/{id}/reserve"
    occ_field: "expected_inventory_lot_version"
    description: |
      Reserving an AllocationRequest against a source InventoryLot whose
      version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just reserved (or
      cancelled a reservation) against the same lot, which legitimately
      changes reserved_quantity/available_quantity, and the current writer's
      view of the lot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pod_dose_throughput_capacity
    trigger: "GET /pods/{id}/operational-metrics?countermeasure_id=... — both variants below are computed and returned together in the same response"
    algorithm: threshold
    formula: |
      lanes_staffed_current =
        floor(
          count(ShiftAssignment where pod_id == POD.id
                and status == CHECKED_IN
                and start_time <= current_clock_time < end_time)
          / STAFF_PER_LANE
        )
      lanes_staffed_planned =
        floor(
          count(ShiftAssignment where pod_id == POD.id
                and status in {CONFIRMED, CHECKED_IN}
                and start_time <= current_clock_time < end_time)
          / STAFF_PER_LANE
        )
      # for each of lanes_staffed_current / lanes_staffed_planned:
      effective_lanes = min(lanes_staffed_<x>, POD.staffing_capacity_lanes)
      hourly_capacity_by_staff = effective_lanes * POD.lane_throughput_rate_per_hour
      hourly_capacity_by_inventory =
        floor(
          sum(InventoryLot.available_quantity where pod_id == POD.id
              and countermeasure_id == countermeasure_id param)
          / Countermeasure.doses_required
        )
      base_capacity = min(hourly_capacity_by_staff, hourly_capacity_by_inventory)
      throughput_capacity_per_hour_<x> =
        floor(base_capacity * SURGE_BONUS_MULTIPLIER) if effective_lanes >= SURGE_LANE_THRESHOLD
        else base_capacity
      # current_throughput_capacity_per_hour uses lanes_staffed_current;
      # planned_throughput_capacity_per_hour uses lanes_staffed_planned;
      # hourly_capacity_by_inventory is identical for both (same InventoryLot rows).
    input_set: "ShiftAssignment rows for this POD filtered by status per variant and by interval containment of current_clock_time; InventoryLot rows for this POD and countermeasure_id"
    constants:
      STAFF_PER_LANE: 2
      SURGE_LANE_THRESHOLD: 6
      SURGE_BONUS_MULTIPLIER: 1.15
    precision: "integer; floor at each min/floor step as written; no rounding beyond floor"
    variants:
      - name: current
        when: "always computed, returned as current_throughput_capacity_per_hour"
        difference: "counts only CHECKED_IN staff — chronological, actuals-based"
      - name: planned
        when: "always computed, returned as planned_throughput_capacity_per_hour"
        difference: "counts CONFIRMED and CHECKED_IN staff — forward-looking, includes staff not yet on site"

  - name: mutual_aid_demand_forecast
    trigger: "GET /pods/{id}/operational-metrics?countermeasure_id=... — both variants below are computed and returned together in the same response"
    algorithm: forward_looking
    formula: |
      pending_registrants = count(DispensingEvent where pod_id == POD.id
                                   and countermeasure_id == countermeasure_id param
                                   and status in {REGISTERED, SCREENED, DEFERRED})
      provisional_demand_doses = ceil(pending_registrants * (1 - NO_SHOW_RATE) * Countermeasure.doses_required)
      final_demand_doses = sum(DispensingEvent.dose_count where pod_id == POD.id
                                and countermeasure_id == countermeasure_id param
                                and status == DISPENSED)
    input_set: "DispensingEvent rows for this POD and countermeasure_id, filtered by status per variant"
    constants:
      NO_SHOW_RATE: 0.10
    precision: "integer; ceil for provisional_demand_doses, exact integer sum for final_demand_doses"
    variants:
      - name: provisional
        when: "always computed, returned as provisional_demand_doses"
        difference: "forward-looking estimate over not-yet-dispensed registrants, discounted by NO_SHOW_RATE"
      - name: final
        when: "always computed, returned as final_demand_doses"
        difference: "chronological actual — exact sum of doses already DISPENSED, no discount"

  - name: allocation_priority_score
    trigger: "POST /allocation-requests/{id}/reserve"
    algorithm: weighted_scoring
    formula: |
      RISK_TIER_WEIGHT = { STANDARD: 1, ELEVATED: 2, CRITICAL: 3 }
      priority_score = round(
        BASE_QTY_WEIGHT * min(AllocationRequest.requested_quantity, MAX_QTY_CAP)
        + RISK_TIER_WEIGHT[POD.risk_tier],
        2
      )
      # Evaluation-order pin (resolves the apparent circularity between
      # priority_score and risk_tier): POD.risk_tier is read as its
      # already-stored value at the moment this reserve request begins
      # executing. It is NEVER recomputed inline within the same request
      # that also reserves inventory against this AllocationRequest. The
      # next reserve request only sees an updated risk_tier after some
      # other request (open/restrict/resume/close, or a dispense cascade)
      # has actually recomputed it.
      # Tie-break when two AllocationRequests show equal priority_score in
      # a listing: order by created_at ascending; never by id.
    input_set: "the AllocationRequest being reserved and its POD's already-stored risk_tier field"
    constants:
      BASE_QTY_WEIGHT: 0.01
      MAX_QTY_CAP: 5000
    precision: "2 decimal places, round_half_up"

  - name: mutual_aid_reimbursement_cost
    trigger: "POST /allocation-requests/{id}/fulfill (only when source_type == MUTUAL_AID)"
    algorithm: aggregation
    formula: |
      cost_per_dose_cents = Countermeasure.unit_cost_cents / Countermeasure.doses_required
      reimbursement_cost_usd = round((cost_per_dose_cents * AllocationRequest.fulfilled_quantity) / 100, 2)
      # Pinned order: reimbursement_cost_usd is rounded to 2 decimals HERE,
      # per AllocationRequest, at fulfill time. SituationReport.
      # total_mutual_aid_reimbursement_usd (aggregation calculation, see
      # entities.SituationReport) later sums these ALREADY-ROUNDED values —
      # it never re-derives cost_per_dose_cents and sums raw, unrounded
      # products first. Summing raw products across N fulfilled requests
      # then rounding once at the report level can differ from this pinned
      # order by up to $0.01 x N when cost_per_dose_cents is a repeating
      # decimal (e.g. unit_cost_cents=1000, doses_required=3 gives
      # cost_per_dose_cents=333.3333...).
    input_set: "the AllocationRequest being fulfilled and its Countermeasure"
    constants: {}
    precision: "2 decimal places, round_half_up, rounded per AllocationRequest before any report-level summation"

  - name: situation_report_rollup
    trigger: "POST /situation-reports"
    algorithm: aggregation
    formula: |
      pods_operational_count = count(POD where hazard_plan_id == X and operational_status == OPERATIONAL)
      pods_restricted_count = count(POD where hazard_plan_id == X and operational_status == RESTRICTED)
      total_doses_dispensed = sum(DispensingEvent.dose_count where status == DISPENSED and pod.hazard_plan_id == X)
      total_on_hand_inventory = sum(InventoryLot.on_hand_quantity where pod_id in (PODs of X))
      denom = count(ShiftAssignment where pod.hazard_plan_id == X)
      staffing_fill_rate_pct =
        0 if denom == 0                                                        # boundary: empty-set edge
        else round(100 * count(ShiftAssignment where pod.hazard_plan_id == X
                                and status in {CONFIRMED, CHECKED_IN, COMPLETED}) / denom, 1)
      total_mutual_aid_reimbursement_usd = sum(AllocationRequest.reimbursement_cost_usd
                                                where pod.hazard_plan_id == X
                                                and source_type == MUTUAL_AID and status == FULFILLED)
      readiness_status =
        "RED" if (pods_restricted_count >= 1 or staffing_fill_rate_pct < RED_THRESHOLD)
        else ("YELLOW" if staffing_fill_rate_pct < YELLOW_THRESHOLD else "GREEN")
    input_set: "all POD, DispensingEvent, InventoryLot, ShiftAssignment, AllocationRequest rows whose (direct or POD-mediated) hazard_plan_id == the report's hazard_plan_id, snapshotted at creation"
    constants:
      RED_THRESHOLD: 50.0
      YELLOW_THRESHOLD: 80.0
    precision: "1 decimal place for staffing_fill_rate_pct (round_half_up); integers for counts; 2 decimal places for total_mutual_aid_reimbursement_usd (already-rounded addends, exact sum)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when the acting role is Volunteer on POST /shift-assignments, POST /shift-assignments/{id}/cancel, or POST /shift-assignments/{id}/check_in, X-User-ID equals the resource's staff_member_id (payload staff_member_id on create)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: ["POST /shift-assignments", "POST /shift-assignments/{id}/cancel", "POST /shift-assignments/{id}/check_in"]

  - priority: 4
    category: existence
    check: "every resource id in the path exists, validated left-to-right"
    error_id: "ERR_HAZARD_PLAN_NOT_FOUND | ERR_POD_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_SHIFT_ASSIGNMENT_NOT_FOUND | ERR_COUNTERMEASURE_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_ALLOCATION_REQUEST_NOT_FOUND | ERR_DISPENSING_EVENT_NOT_FOUND | ERR_DRILL_NOT_FOUND | ERR_SITUATION_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "every FK referenced in the request body (hazard_plan_id, pod_id, staff_member_id, countermeasure_id, partner_pod_id) references an existing resource"
    error_id: "ERR_HAZARD_PLAN_NOT_FOUND | ERR_POD_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_COUNTERMEASURE_NOT_FOUND"
    http_status: 404
    applies_to: "all create/action endpoints with body FK fields"

  - priority: 6
    category: state
    check: "the target resource is in a state from which this trigger has a declared transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "confirming a ShiftAssignment requires StaffMember.credential_status == VERIFIED and StaffMember.credential_expires_at strictly greater than current clock time"
    error_id: "ERR_CREDENTIAL_NOT_VERIFIED | ERR_CREDENTIAL_EXPIRED"
    http_status: 422
    applies_to: ["POST /shift-assignments/{id}/confirm"]

  - priority: 8
    category: business_temporal
    check: "ShiftAssignment.start_time is strictly before end_time"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: ["POST /shift-assignments"]

  - priority: 9
    category: business_temporal
    check: "confirming a ShiftAssignment must not overlap [start_time, end_time) with another CONFIRMED or CHECKED_IN ShiftAssignment for the same staff_member_id"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: ["POST /shift-assignments/{id}/confirm"]

  - priority: 10
    category: business_constraint
    check: "confirming a ShiftAssignment must not push the count of CONFIRMED/CHECKED_IN ShiftAssignment rows at that pod_id whose interval overlaps this one (including this one) above POD.staffing_capacity_lanes"
    error_id: ERR_POD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /shift-assignments/{id}/confirm"]

  - priority: 11
    category: business_referential
    check: "screening or dispensing requires POD.operational_status in {OPERATIONAL, RESTRICTED}"
    error_id: ERR_POD_NOT_OPERATIONAL
    http_status: 409
    applies_to: ["POST /dispensing-events/{id}/screen", "POST /dispensing-events/{id}/dispense"]

  - priority: 12
    category: business_referential
    check: "reserving or denying an AllocationRequest requires the POD resolved via pod_id -> hazard_plan_id to have HazardPlan.status == ACTIVATED"
    error_id: ERR_HAZARD_PLAN_NOT_ACTIVATED
    http_status: 409
    applies_to: ["POST /allocation-requests", "POST /allocation-requests/{id}/reserve"]

  - priority: 13
    category: business_referential
    check: "reserving or denying an AllocationRequest requires the acting role to match source_type: LogisticsCoordinator only for SNS_CACHE, MutualAidPartner only for MUTUAL_AID"
    error_id: ERR_SOURCE_ROLE_MISMATCH
    http_status: 403
    applies_to: ["POST /allocation-requests/{id}/reserve", "POST /allocation-requests/{id}/deny"]

  - priority: 14
    category: business_constraint
    check: "reserving an AllocationRequest requires the resolved source InventoryLot to have available_quantity >= requested_quantity"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: ["POST /allocation-requests/{id}/reserve"]

  - priority: 15
    category: business_constraint
    check: "creating an AllocationRequest with source_type == MUTUAL_AID requires partner_pod_id set and different from pod_id; source_type == SNS_CACHE requires partner_pod_id null"
    error_id: ERR_INVALID_SOURCE_CONFIGURATION
    http_status: 400
    applies_to: ["POST /allocation-requests"]

  - priority: 16
    category: business_constraint
    check: "dispensing a DispensingEvent requires a POD-scoped InventoryLot for its countermeasure_id with available_quantity >= dose_count"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: ["POST /dispensing-events/{id}/dispense"]

  - priority: 17
    category: state
    check: "standing down a HazardPlan requires every POD with that hazard_plan_id to have operational_status == CLOSED"
    error_id: ERR_POD_NOT_READY_FOR_STAND_DOWN
    http_status: 409
    applies_to: ["POST /hazard-plans/{id}/stand_down"]

  - priority: 18
    category: state
    check: "closing a POD requires no ShiftAssignment with that pod_id in status CHECKED_IN"
    error_id: ERR_POD_STAFF_ONSITE
    http_status: 409
    applies_to: ["POST /pods/{id}/close"]

  - priority: 19
    category: business_constraint
    check: "expected_pod_version in the request body equals POD.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /allocation-requests"]

  - priority: 20
    category: business_constraint
    check: "expected_inventory_lot_version in the request body equals the resolved source InventoryLot.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /allocation-requests/{id}/reserve"]

  - priority: 21
    category: business_constraint
    check: "InventoryLot.on_hand_quantity >= 0 and expiration_date strictly after current clock time at creation"
    error_id: ERR_INVALID_EXPIRATION
    http_status: 400
    applies_to: ["POST /inventory-lots"]

  - priority: 22
    category: business_constraint
    check: "deferring a DispensingEvent requires a non-empty deferral_reason in the request body"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: ["POST /dispensing-events/{id}/defer"]

  - priority: 23
    category: business_constraint
    check: "all other required fields are present and correctly typed; enum fields hold a declared value"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- HazardPlan ---
  - method: POST
    path: "/hazard-plans"
    description: "Create a hazard/scenario plan."
    roles: [PublicHealthAdmin]
    code: 201
    input: [hazard_type, title, jurisdiction_code, target_population]
    output: HazardPlan
    side_effects: ["creates HazardPlan with status=DRAFT, readiness_score=0"]

  - method: GET
    path: "/hazard-plans/{id}"
    description: "Fetch a hazard plan by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: []
    output: HazardPlan
    side_effects: []

  - method: GET
    path: "/hazard-plans"
    description: "List hazard plans."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HazardPlan[]
    side_effects: []

  - method: POST
    path: "/hazard-plans/{id}/activate"
    description: "Activate a DRAFT hazard plan."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: HazardPlan
    side_effects: ["status DRAFT->ACTIVATED", "sets activated_at"]

  - method: POST
    path: "/hazard-plans/{id}/stand_down"
    description: "Stand down an ACTIVATED hazard plan."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: HazardPlan
    side_effects: ["status ACTIVATED->STOOD_DOWN", "sets stood_down_at"]

  # --- POD ---
  - method: POST
    path: "/pods"
    description: "Stand up a new POD under a hazard plan."
    roles: [PublicHealthAdmin]
    code: 201
    input: [hazard_plan_id, site_name, site_type, address, staffing_capacity_lanes, lane_throughput_rate_per_hour]
    output: POD
    side_effects: ["creates POD with operational_status=STAGING"]

  - method: GET
    path: "/pods/{id}"
    description: "Fetch a POD by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: []
    output: POD
    side_effects: []

  - method: GET
    path: "/pods"
    description: "List PODs, optionally filtered by hazard plan or posture."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: ["hazard_plan_id?", "operational_status?", "limit?", "offset?"]
    output: POD[]
    side_effects: []

  - method: POST
    path: "/pods/{id}/open"
    description: "Open a STAGING POD for operations."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: POD
    side_effects: ["operational_status STAGING->OPERATIONAL"]

  - method: POST
    path: "/pods/{id}/restrict"
    description: "Manually restrict an OPERATIONAL POD."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: POD
    side_effects: ["operational_status OPERATIONAL->RESTRICTED", "risk_tier recomputed"]

  - method: POST
    path: "/pods/{id}/resume"
    description: "Resume a RESTRICTED POD to OPERATIONAL."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: POD
    side_effects: ["operational_status RESTRICTED->OPERATIONAL", "risk_tier recomputed"]

  - method: POST
    path: "/pods/{id}/close"
    description: "Close a POD."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: POD
    side_effects: ["operational_status ->CLOSED", "cancels PENDING/CONFIRMED ShiftAssignments at this POD"]

  - method: GET
    path: "/pods/{id}/operational-metrics"
    description: "Computed read exposing pod_dose_throughput_capacity and mutual_aid_demand_forecast for one countermeasure. Both variants of each calculation (current/planned throughput, provisional/final demand) are always computed and returned together in a single call."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead]
    code: 200
    input: [countermeasure_id]
    output: { current_throughput_capacity_per_hour: integer, planned_throughput_capacity_per_hour: integer, provisional_demand_doses: integer, final_demand_doses: integer }
    side_effects: []

  # --- StaffMember ---
  - method: POST
    path: "/staff-members"
    description: "Register an MRC volunteer with their primary credential."
    roles: [PublicHealthAdmin]
    code: 201
    input: [full_name, email, primary_role, mrc_unit, credential_type, credential_expires_at]
    output: StaffMember
    side_effects: ["creates StaffMember with credential_status=PENDING"]

  - method: GET
    path: "/staff-members"
    description: "List staff members."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead, Volunteer]
    code: 200
    input: ["mrc_unit?", "primary_role?", "credential_status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: POST
    path: "/staff-members/{id}/verify-credential"
    description: "Verify a volunteer's credential."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["credential_status PENDING->VERIFIED"]

  - method: POST
    path: "/staff-members/{id}/revoke-credential"
    description: "Revoke a volunteer's credential."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["credential_status ->REVOKED", "cascades to ShiftAssignment cancellation and possible POD restriction (Cascade B)"]

  # --- ShiftAssignment ---
  - method: POST
    path: "/shift-assignments"
    description: "Propose (self- or admin-created) a shift assignment."
    roles: [Volunteer, PublicHealthAdmin, ClinicalLead]
    code: 201
    input: [pod_id, staff_member_id, assigned_role, start_time, end_time]
    output: ShiftAssignment
    side_effects: ["creates ShiftAssignment with status=PENDING"]

  - method: GET
    path: "/shift-assignments/{id}"
    description: "Fetch a shift assignment by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []

  - method: GET
    path: "/shift-assignments"
    description: "List shift assignments, filtered by POD and/or staff member."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead, Volunteer]
    code: 200
    input: ["pod_id?", "staff_member_id?", "status?", "limit?", "offset?"]
    output: ShiftAssignment[]
    side_effects: []

  - method: POST
    path: "/shift-assignments/{id}/confirm"
    description: "Confirm a pending shift assignment."
    roles: [ClinicalLead, PublicHealthAdmin]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status PENDING->CONFIRMED", "POD.committed_staff_hours increases"]

  - method: POST
    path: "/shift-assignments/{id}/check_in"
    description: "Check a volunteer into their confirmed shift."
    roles: [Volunteer, ClinicalLead]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status CONFIRMED->CHECKED_IN"]

  - method: POST
    path: "/shift-assignments/{id}/check_out"
    description: "Check a volunteer out at end of shift."
    roles: [ClinicalLead]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status CHECKED_IN->COMPLETED"]

  - method: POST
    path: "/shift-assignments/{id}/cancel"
    description: "Cancel a pending or confirmed shift assignment."
    roles: [Volunteer, PublicHealthAdmin, ClinicalLead]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status ->CANCELLED", "if it was CONFIRMED, POD.committed_staff_hours decreases by the same amount it increased on confirm"]

  # --- Countermeasure ---
  - method: POST
    path: "/countermeasures"
    description: "Add a countermeasure to the formulary."
    roles: [PublicHealthAdmin]
    code: 201
    input: [name, countermeasure_type, doses_required, "dose_interval_days?", unit_cost_cents, reorder_point_quantity]
    output: Countermeasure
    side_effects: ["creates Countermeasure"]

  - method: GET
    path: "/countermeasures"
    description: "List formulary countermeasures."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: ["countermeasure_type?", "limit?", "offset?"]
    output: Countermeasure[]
    side_effects: []

  # --- InventoryLot ---
  - method: POST
    path: "/inventory-lots"
    description: "Receive a new inventory lot (central SNS cache when pod_id omitted, POD-scoped otherwise)."
    roles: [LogisticsCoordinator]
    code: 201
    input: [countermeasure_id, "pod_id?", lot_number, on_hand_quantity, expiration_date]
    output: InventoryLot
    side_effects: ["creates InventoryLot with reserved_quantity=0, available_quantity=on_hand_quantity"]

  - method: GET
    path: "/inventory-lots/{id}"
    description: "Fetch an inventory lot by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots, filtered by countermeasure and/or POD."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: ["countermeasure_id?", "pod_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  # --- AllocationRequest ---
  - method: POST
    path: "/allocation-requests"
    description: "Request a quantity of a countermeasure for a POD, from the central SNS cache or a mutual-aid partner POD."
    roles: [LogisticsCoordinator]
    code: 201
    input: [pod_id, countermeasure_id, "source_type?", "partner_pod_id?", requested_quantity, expected_pod_version]
    output: AllocationRequest
    side_effects: ["creates AllocationRequest with status=REQUESTED", "POD.open_allocation_request_count += 1", "POD.version += 1"]

  - method: GET
    path: "/allocation-requests/{id}"
    description: "Fetch an allocation request by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: []

  - method: GET
    path: "/allocation-requests"
    description: "List allocation requests, filtered by POD, countermeasure, partner POD, source lot or status."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: ["pod_id?", "countermeasure_id?", "partner_pod_id?", "source_inventory_lot_id?", "status?", "limit?", "offset?"]
    output: AllocationRequest[]
    side_effects: []

  - method: POST
    path: "/allocation-requests/{id}/reserve"
    description: "Reserve the requested quantity against the resolved source InventoryLot."
    roles: [LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: [expected_inventory_lot_version]
    output: AllocationRequest
    side_effects: ["status REQUESTED->RESERVED", "reserved_quantity set", "source InventoryLot.reserved_quantity increases and version += 1", "priority_score computed", "POD.open_allocation_request_count -= 1"]

  - method: POST
    path: "/allocation-requests/{id}/deny"
    description: "Deny a requested allocation."
    roles: [LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["status REQUESTED->DENIED", "POD.open_allocation_request_count -= 1"]

  - method: POST
    path: "/allocation-requests/{id}/fulfill"
    description: "Fulfill a reserved allocation, moving stock from the source lot to the requesting POD's lot."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["status RESERVED->FULFILLED", "fulfilled_quantity set", "requesting POD's InventoryLot.on_hand_quantity increases", "source InventoryLot.on_hand_quantity and reserved_quantity decrease", "reimbursement_cost_usd computed when source_type==MUTUAL_AID"]

  - method: POST
    path: "/allocation-requests/{id}/cancel"
    description: "Cancel a reserved allocation, releasing the reservation."
    roles: [LogisticsCoordinator, MutualAidPartner]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: ["status RESERVED->CANCELLED", "source InventoryLot.reserved_quantity decreases"]

  # --- DispensingEvent ---
  - method: POST
    path: "/dispensing-events"
    description: "Register a person for mass-vaccination/prophylaxis dispensing at a POD."
    roles: [Volunteer, ClinicalLead]
    code: 201
    input: [pod_id, countermeasure_id, registrant_full_name, registrant_risk_group, "dose_count?"]
    output: DispensingEvent
    side_effects: ["creates DispensingEvent with status=REGISTERED", "POD.queue_backlog_count += 1"]

  - method: GET
    path: "/dispensing-events/{id}"
    description: "Fetch a dispensing event by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead, Volunteer]
    code: 200
    input: []
    output: DispensingEvent
    side_effects: []

  - method: GET
    path: "/dispensing-events"
    description: "List dispensing events, filtered by POD, countermeasure, lot, screening/dispensing staff, or status."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead, Volunteer]
    code: 200
    input: ["pod_id?", "countermeasure_id?", "inventory_lot_id?", "screened_by_staff_member_id?", "dispensed_by_staff_member_id?", "status?", "limit?", "offset?"]
    output: DispensingEvent[]
    side_effects: []

  - method: POST
    path: "/dispensing-events/{id}/screen"
    description: "Clinically screen a registrant."
    roles: [ClinicalLead]
    code: 200
    input: [screened_by_staff_member_id]
    output: DispensingEvent
    side_effects: ["status REGISTERED->SCREENED", "screened_by_staff_member_id set"]

  - method: POST
    path: "/dispensing-events/{id}/defer"
    description: "Defer a screened registrant."
    roles: [ClinicalLead]
    code: 200
    input: [deferral_reason]
    output: DispensingEvent
    side_effects: ["status SCREENED->DEFERRED", "deferral_reason stored"]

  - method: POST
    path: "/dispensing-events/{id}/rescreen"
    description: "Return a deferred registrant to screened status."
    roles: [ClinicalLead]
    code: 200
    input: []
    output: DispensingEvent
    side_effects: ["status DEFERRED->SCREENED", "deferral_reason cleared"]

  - method: POST
    path: "/dispensing-events/{id}/refuse"
    description: "Record a registrant's refusal after screening."
    roles: [ClinicalLead]
    code: 200
    input: []
    output: DispensingEvent
    side_effects: ["status SCREENED->REFUSED", "POD.queue_backlog_count -= 1"]

  - method: POST
    path: "/dispensing-events/{id}/dispense"
    description: "Dispense the countermeasure to a screened registrant."
    roles: [ClinicalLead]
    code: 200
    input: [dispensed_by_staff_member_id]
    output: DispensingEvent
    side_effects: ["status SCREENED->DISPENSED", "POD.queue_backlog_count -= 1", "InventoryLot.on_hand_quantity decreases (Cascade A hop 1)", "possible POD auto-restrict (Cascade A hop 2)", "possible auto-created AllocationRequest (Cascade A hop 3)"]

  # --- Drill ---
  - method: POST
    path: "/drills"
    description: "Schedule a preparedness drill/exercise."
    roles: [PublicHealthAdmin]
    code: 201
    input: [hazard_plan_id, drill_type, scheduled_at]
    output: Drill
    side_effects: ["creates Drill with status=SCHEDULED, corrective_action_status=NONE"]

  - method: GET
    path: "/drills/{id}"
    description: "Fetch a drill by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead]
    code: 200
    input: []
    output: Drill
    side_effects: []

  - method: GET
    path: "/drills"
    description: "List drills, filtered by hazard plan."
    roles: [PublicHealthAdmin, LogisticsCoordinator, ClinicalLead]
    code: 200
    input: ["hazard_plan_id?", "status?", "limit?", "offset?"]
    output: Drill[]
    side_effects: []

  - method: POST
    path: "/drills/{id}/complete"
    description: "Complete a drill and record after-action finding/corrective action."
    roles: [PublicHealthAdmin]
    code: 200
    input: ["finding?", "corrective_action?"]
    output: Drill
    side_effects: ["status SCHEDULED->COMPLETED", "corrective_action_status NONE->OPEN if corrective_action provided", "HazardPlan.readiness_score recomputed"]

  - method: POST
    path: "/drills/{id}/cancel"
    description: "Cancel a scheduled drill."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: Drill
    side_effects: ["status SCHEDULED->CANCELLED"]

  - method: POST
    path: "/drills/{id}/close_corrective_action"
    description: "Close the corrective action recorded at drill completion."
    roles: [PublicHealthAdmin]
    code: 200
    input: []
    output: Drill
    side_effects: ["corrective_action_status OPEN->CLOSED", "HazardPlan.readiness_score recomputed"]

  # --- SituationReport ---
  - method: POST
    path: "/situation-reports"
    description: "Snapshot a situational report for a hazard plan's current operational period."
    roles: [PublicHealthAdmin, LogisticsCoordinator]
    code: 201
    input: [hazard_plan_id, report_period_label, "narrative?"]
    output: SituationReport
    side_effects: ["computes and stores pods_operational_count, pods_restricted_count, total_doses_dispensed, total_on_hand_inventory, staffing_fill_rate_pct, total_mutual_aid_reimbursement_usd, readiness_status as of creation time"]

  - method: GET
    path: "/situation-reports/{id}"
    description: "Fetch a situation report by id."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: []
    output: SituationReport
    side_effects: []

  - method: GET
    path: "/situation-reports"
    description: "List situation reports, filtered by hazard plan."
    roles: [PublicHealthAdmin, LogisticsCoordinator, MutualAidPartner, ClinicalLead, Volunteer]
    code: 200
    input: ["hazard_plan_id?", "limit?", "offset?"]
    output: SituationReport[]
    side_effects: []

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (outside the public business surface). Sets the server's logical clock, used by every datetime-dependent rule in this scaffold (credential expiry, lot expiration, shift overlap, throughput 'current' window). Default before any call is 2026-03-01T00:00:00Z."
    roles: [PublicHealthAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the server's logical current time to to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the acting role is not permitted to call this endpoint"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "acting Volunteer's X-User-ID does not equal the ShiftAssignment's staff_member_id"
  - id: ERR_HAZARD_PLAN_NOT_FOUND
    http: 404
    condition: "referenced HazardPlan id does not exist"
  - id: ERR_POD_NOT_FOUND
    http: 404
    condition: "referenced POD id does not exist"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "referenced StaffMember id does not exist"
  - id: ERR_SHIFT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "referenced ShiftAssignment id does not exist"
  - id: ERR_COUNTERMEASURE_NOT_FOUND
    http: 404
    condition: "referenced Countermeasure id does not exist"
  - id: ERR_INVENTORY_LOT_NOT_FOUND
    http: 404
    condition: "referenced InventoryLot id does not exist"
  - id: ERR_ALLOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced AllocationRequest id does not exist"
  - id: ERR_DISPENSING_EVENT_NOT_FOUND
    http: 404
    condition: "referenced DispensingEvent id does not exist"
  - id: ERR_DRILL_NOT_FOUND
    http: 404
    condition: "referenced Drill id does not exist"
  - id: ERR_SITUATION_REPORT_NOT_FOUND
    http: 404
    condition: "referenced SituationReport id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested trigger has a declared transition"
  - id: ERR_CREDENTIAL_EXPIRED
    http: 422
    condition: "StaffMember.credential_expires_at is not strictly after current clock time at ShiftAssignment confirm"
  - id: ERR_CREDENTIAL_NOT_VERIFIED
    http: 422
    condition: "StaffMember.credential_status is not VERIFIED at ShiftAssignment confirm"
  - id: ERR_INVALID_TIME_RANGE
    http: 400
    condition: "ShiftAssignment.start_time is not strictly before end_time"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "confirming would overlap [start_time,end_time) with another CONFIRMED/CHECKED_IN ShiftAssignment for the same staff member"
  - id: ERR_POD_CAPACITY_EXCEEDED
    http: 409
    condition: "confirming would push overlapping CONFIRMED/CHECKED_IN ShiftAssignment count at the POD above staffing_capacity_lanes"
  - id: ERR_POD_NOT_OPERATIONAL
    http: 409
    condition: "screen or dispense attempted while POD.operational_status is not in {OPERATIONAL, RESTRICTED}"
  - id: ERR_HAZARD_PLAN_NOT_ACTIVATED
    http: 409
    condition: "reserve/deny attempted while the POD's HazardPlan.status is not ACTIVATED"
  - id: ERR_SOURCE_ROLE_MISMATCH
    http: 403
    condition: "reserve/deny attempted by a role that does not match the AllocationRequest's source_type"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "the resolved InventoryLot's available_quantity is less than the quantity requested (AllocationRequest reserve) or dose_count (DispensingEvent dispense)"
  - id: ERR_INVALID_SOURCE_CONFIGURATION
    http: 400
    condition: "AllocationRequest.partner_pod_id/source_type combination is inconsistent with the declared constraint"
  - id: ERR_POD_NOT_READY_FOR_STAND_DOWN
    http: 409
    condition: "HazardPlan.stand_down attempted while a child POD is not CLOSED"
  - id: ERR_POD_STAFF_ONSITE
    http: 409
    condition: "POD.close attempted while a ShiftAssignment at that POD is CHECKED_IN"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_pod_version or expected_inventory_lot_version does not match the current stored version"
  - id: ERR_INVALID_EXPIRATION
    http: 400
    condition: "InventoryLot.on_hand_quantity is negative or expiration_date is not strictly after current clock time"
  - id: ERR_VALIDATION
    http: 400
    condition: "a required field is missing/mistyped, an enum field holds an undeclared value, or deferral_reason is empty on defer"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PublicHealthAdmin
    description: "Jurisdiction public-health administrator; owns hazard-plan lifecycle, POD lifecycle, staff roster/credentialing, formulary, drills."
    identity: opaque
    exclusive_operations:
      - "POST /hazard-plans"
      - "POST /hazard-plans/{id}/activate"
      - "POST /hazard-plans/{id}/stand_down"
      - "POST /pods"
      - "POST /pods/{id}/open"
      - "POST /pods/{id}/restrict"
      - "POST /pods/{id}/resume"
      - "POST /pods/{id}/close"
      - "POST /staff-members"
      - "POST /staff-members/{id}/verify-credential"
      - "POST /staff-members/{id}/revoke-credential"
      - "POST /countermeasures"
      - "POST /drills"
      - "POST /drills/{id}/complete"
      - "POST /drills/{id}/cancel"
      - "POST /drills/{id}/close_corrective_action"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /hazard-plans, GET /hazard-plans/{id}"
      - "GET /pods, GET /pods/{id}, GET /pods/{id}/operational-metrics"
      - "GET /staff-members"
      - "GET /countermeasures"
      - "GET /inventory-lots, GET /inventory-lots/{id}"
      - "GET /allocation-requests, GET /allocation-requests/{id}"
      - "GET /dispensing-events, GET /dispensing-events/{id}"
      - "GET /drills, GET /drills/{id}"
      - "POST /situation-reports"
      - "GET /situation-reports, GET /situation-reports/{id}"
      - "POST /shift-assignments"
      - "POST /shift-assignments/{id}/confirm"
      - "POST /shift-assignments/{id}/cancel"

  - name: LogisticsCoordinator
    description: "Manages countermeasure/SNS inventory and the allocation pipeline (both SNS-cache and mutual-aid requesting side)."
    identity: opaque
    exclusive_operations:
      - "POST /inventory-lots"
      - "POST /allocation-requests"
      - "POST /allocation-requests/{id}/fulfill"
    shared_operations:
      - "GET /hazard-plans, GET /hazard-plans/{id}"
      - "GET /pods, GET /pods/{id}, GET /pods/{id}/operational-metrics"
      - "GET /staff-members"
      - "GET /countermeasures"
      - "GET /inventory-lots, GET /inventory-lots/{id}"
      - "GET /allocation-requests, GET /allocation-requests/{id}"
      - "POST /allocation-requests/{id}/reserve"
      - "POST /allocation-requests/{id}/deny"
      - "POST /allocation-requests/{id}/cancel"
      - "GET /dispensing-events, GET /dispensing-events/{id}"
      - "GET /drills, GET /drills/{id}"
      - "POST /situation-reports"
      - "GET /situation-reports, GET /situation-reports/{id}"
      - "GET /shift-assignments, GET /shift-assignments/{id}"

  - name: MutualAidPartner
    description: "External jurisdiction liaison who responds to mutual-aid AllocationRequests directed at their POD."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /hazard-plans, GET /hazard-plans/{id}"
      - "GET /pods, GET /pods/{id}"
      - "GET /inventory-lots, GET /inventory-lots/{id}"
      - "GET /allocation-requests, GET /allocation-requests/{id}"
      - "POST /allocation-requests/{id}/reserve"
      - "POST /allocation-requests/{id}/deny"
      - "POST /allocation-requests/{id}/cancel"
      - "GET /countermeasures"
      - "GET /situation-reports, GET /situation-reports/{id}"

  - name: ClinicalLead
    description: "Supervises clinical operations at a POD: shift confirmation/check-in/check-out, screening and dispensing."
    identity: opaque
    exclusive_operations:
      - "POST /shift-assignments/{id}/check_out"
      - "POST /dispensing-events/{id}/screen"
      - "POST /dispensing-events/{id}/defer"
      - "POST /dispensing-events/{id}/rescreen"
      - "POST /dispensing-events/{id}/refuse"
      - "POST /dispensing-events/{id}/dispense"
    shared_operations:
      - "GET /hazard-plans, GET /hazard-plans/{id}"
      - "GET /pods, GET /pods/{id}, GET /pods/{id}/operational-metrics"
      - "GET /staff-members"
