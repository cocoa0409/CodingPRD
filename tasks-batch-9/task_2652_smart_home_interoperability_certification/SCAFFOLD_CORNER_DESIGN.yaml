              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-sessions/${sess_id}/complete"
              payload: {}
              as: TestLaboratory
              as_user_id: "${lab_id}"
            - call: "POST /submissions/${sub_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: true, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "SEC1"
            - call: "POST /submissions/${sub_id}/conformance-decision"
              payload: { decision: "APPROVE" }
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${sub_id}/issue-credential"
              payload: { dac_serial: "DAC-000001" }
              as: ProgramAdmin
            - call: "POST /listings"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /noncompliance-cases"
              payload: { listing_id: "${listing_id}", category: "SECURITY_DEFECT", evidence_summary: "Attestation key reuse across two production batches.", claimed_impact_units: 40 }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
              captures: { case_id: $.data.id }
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { err_under_investigation: $.data.error_id }
            - call: "POST /noncompliance-cases/${case_id}/advance"
              payload: { disposition: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
            - call: "POST /noncompliance-cases/${case_id}/advance"
              payload: { disposition: "ORDER_REMEDIATION" }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
              captures: { err_missing_days: $.data.error_id }
            - call: "POST /noncompliance-cases/${case_id}/advance"
              payload: { disposition: "ORDER_REMEDIATION", remediation_days: 400 }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
              captures: { err_days_range: $.data.error_id }
            - call: "POST /noncompliance-cases/${case_id}/advance"
              payload: { disposition: "ORDER_REMEDIATION", remediation_days: 30 }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: PublicViewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /noncompliance-cases/${case_id}/advance"
              payload: { disposition: "CONFIRM_REMEDIATION" }
              as: ComplianceOfficer
              as_user_id: "OFFICER1"
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: PublicViewer
            - call: "POST /listings/${listing_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /noncompliance-cases/${case_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "OFFICER2"
          assert:
            - "The case is priced at assessment_subtotal_cents == 20000, surcharge_cents == 7000 and penalty_total_cents == 27000 (40 units x 500 cents, SECURITY_DEFECT surcharge 0.35)"
            - "Publishing while compliance_status == \"UNDER_INVESTIGATION\" returns 409 ERR_INVALID_LISTING_STATE"
            - "ORDER_REMEDIATION without remediation_days returns 400 ERR_INVALID_REQUEST; remediation_days 400 returns 422 ERR_INVALID_DATE_RANGE (allowed range 1..365)"
            - "ORDER_REMEDIATION with remediation_days 30 returns 200 with case state == \"REMEDIATION_ORDERED\", remediation_days == 30 and remediation_deadline_at == \"2026-10-02T12:00:00Z\" (2026-09-02T12:00:00Z + 30 days)"
            - "That order also sets CertificationListing.${listing_id}.publication_status == \"SUPPRESSED\" while compliance_status stays \"UNDER_INVESTIGATION\""
            - "At exactly 2026-10-02T12:00:00Z, CONFIRM_REMEDIATION is accepted (the deadline bound is inclusive) and the case state becomes \"REMEDIATED\""
            - "The listing is then compliance_status == \"REMEDIATED\" but publication_status is STILL \"SUPPRESSED\" - remediation does not republish"
            - "The explicit publish returns 200 with publication_status == \"PUBLISHED\", published_at == \"2026-10-02T12:00:00Z\" and declared_features == [\"CORE_ONOFF\"]"
            - "OFFICER2 closing returns 200 with case state == \"CLOSED\"; CertificationSubmission.${sub_id}.dac_state is still \"ISSUED\" - the remediation path never revokes the credential"

      - name: submission_returns_for_info_and_resubmits_around_the_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.CertificationSubmission.transitions.IN_REVIEW_to_RETURNED_FOR_INFO
          - state_machines.CertificationSubmission.transitions.RETURNED_FOR_INFO_to_SUBMITTED
        excluded_because:
          difficulty_instance: submission_review_cycle_loops_twice_then_hits_the_revision_ceiling
          rationale: "The named §1.8 instance walks the IN_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED -> IN_REVIEW loop twice and asserts the revision_round ceiling and the no-double-escrow rule."

      - name: listing_publication_and_compliance_axes_are_independent
        claim_type: valid_transition
        grounds:
          - state_machines['CertificationListing#publication_status'].transitions
          - state_machines['CertificationListing#compliance_status'].transitions
        excluded_because:
          difficulty_instance: listing_publication_and_compliance_axes_walk_independently_then_lock
          rationale: "The named §1.8 instance drives both listing axes independently and asserts the terminal lock on publication_status."

      - name: ip_withdrawal_cascade_reaches_an_auto_opened_case
        claim_type: cascade_down
        grounds:
          - state_machines.Member.transitions.TOOLS_GRANTED_to_IP_WITHDRAWN
        excluded_because:
          difficulty_instance: ip_withdrawal_cascades_four_hops_into_an_auto_opened_case
          rationale: "All four hops (good_standing, listing suppression, credential revocation, auto-opened IP_WITHDRAWAL case) are asserted by the named §1.8 instance."

      - name: specification_deprecation_cascade_reaches_bench_minutes
        claim_type: cascade_down
        grounds:
          - state_machines.Specification.transitions.RATIFIED_to_DEPRECATED
        excluded_because:
          difficulty_instance: specification_deprecation_cascades_three_hops_into_bench_minutes
          rationale: "The three-hop chain plus the 180-day recertification fan-out is asserted by the named §1.8 instance."

      - name: submission_withdraw_releases_the_escrow
        claim_type: compensation
        grounds:
          - state_machines.CertificationSubmission.transitions.SUBMITTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: credit_escrow_round_trips_through_withdraw_reject_and_consumption
          rationale: "Escrow release on withdraw, on rejection and consumption on certification are all asserted against the ledger invariant by the named §1.8 instance."

      - name: session_cancel_restores_reserved_bench_minutes
        claim_type: compensation
        grounds:
          - state_machines.TestSession.transitions.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: bench_minutes_return_to_zero_after_every_cancel_and_completion
          rationale: "The named §1.8 instance asserts the exact create/cancel/complete round trip back to zero reserved minutes."

      - name: session_start_requires_an_authorized_laboratory
        claim_type: guarded_transition
        grounds:
          - state_machines.TestSession.transitions.SCHEDULED_to_IN_PROGRESS
        excluded_because:
          difficulty_instance: session_start_refused_while_its_laboratory_sits_suspended
          rationale: "The cross-entity guard on TestLaboratory.accreditation_status is the subject of the named §1.8 instance."

      - name: listing_publish_requires_an_issued_credential
        claim_type: guarded_transition
        grounds:
          - state_machines['CertificationListing#publication_status'].transitions.UNPUBLISHED_to_PUBLISHED
        excluded_because:
          difficulty_instance: listing_publish_refused_until_the_submission_holds_an_issued_credential
          rationale: "The cross-entity guard on CertificationSubmission.dac_state is the subject of the named §1.8 instance."

  - section: calculations
    instances:
      - name: plan_closure_needs_two_propagation_rounds_to_reach_its_fixed_point
        claim_type: correct_result
        grounds:
          - calculations.test_plan_case_counts
          - entities.TestPlan.fields.included_feature_set_ids
          - endpoints[POST /test-plans]
        distinguishing_aspect: >
          Declaring ONE optional code seeds B_OPT, which activates the CONDITIONAL C_COND in round 1,
          which in turn activates the CONDITIONAL D_COND in round 2. A single-pass implementation stops
          at 34 required cases (A+B+C); the fixed point is 39 (A 20 + B 8 + C 6 + D 5). Candidates of
          the other device type - including a THERMOSTAT feature set that reuses the code B_OPT - and
          the undeclared E_OPT never enter the closure.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification S. LIGHTING sets: A_CORE MANDATORY 20; B_OPT OPTIONAL 8; C_COND CONDITIONAL 6 depending on B_OPT; D_COND CONDITIONAL 5 depending on C_COND; E_OPT OPTIONAL 12 (undeclared, no dependents). THERMOSTAT sets: T_CORE MANDATORY 10; B_OPT OPTIONAL 9."
            - "Member M1 in good standing with 1000000 cents; a LIGHTING submission declaring exactly [A_CORE, B_OPT], moved to IN_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "A_CORE", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
              captures: { fs_a_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "B_OPT", obligation: "OPTIONAL", test_case_count: 8 }
              as: ProgramAdmin
              captures: { fs_b_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "C_COND", obligation: "CONDITIONAL", test_case_count: 6, depends_on_feature_set_id: "${fs_b_id}" }
              as: ProgramAdmin
              captures: { fs_c_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "D_COND", obligation: "CONDITIONAL", test_case_count: 5, depends_on_feature_set_id: "${fs_c_id}" }
              as: ProgramAdmin
              captures: { fs_d_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "E_OPT", obligation: "OPTIONAL", test_case_count: 12 }
              as: ProgramAdmin
              captures: { fs_e_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "T_CORE", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
              captures: { fs_t_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "THERMOSTAT", feature_code: "B_OPT", obligation: "OPTIONAL", test_case_count: 9 }
              as: ProgramAdmin
              captures: { fs_tb_id: $.data.id }
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 2, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["A_CORE", "B_OPT"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
              captures: { sub_v_in_review: $.data.version }
          trigger:
            - call: "POST /test-plans"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_v_in_review}" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "GET /test-plans/${plan_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "TestPlan.${plan_id}.included_feature_set_ids == [${fs_a_id}, ${fs_b_id}, ${fs_c_id}, ${fs_d_id}] - ordered by feature_code ASC (A_CORE, B_OPT, C_COND, D_COND)"
            - "TestPlan.${plan_id}.required_case_count == 39, mandatory_case_count == 31 (A 20 + C 6 + D 5, CONDITIONAL counts as mandatory) and optional_case_count == 8"
            - "required_case_count == mandatory_case_count + optional_case_count holds exactly"
            - "${fs_e_id} is absent from included_feature_set_ids - an undeclared OPTIONAL set never enters the closure"
            - "${fs_t_id} and ${fs_tb_id} are absent - THERMOSTAT candidates are excluded even though the declared code B_OPT also names a THERMOSTAT feature set"
            - "TestPlan.${plan_id}.specification_id == ${spec_id} and device_type == \"LIGHTING\" (copied from the submission), state == \"DRAFT\", voided_reason is null"
            - "CertificationSubmission.${sub_id}.certification_fee_cents == 150000 (LIGHTING 120000 + 2 declared x 15000 + SB1 0, ADOPTER 0.00, STANDARD 1.00) - unchanged by plan creation"

      - name: distinct_vendor_count_counts_members_not_participations
        claim_type: input_set_filtering
        grounds:
          - calculations.plugfest_distinct_vendor_count
          - validations[priority=42]
          - errors[ERR_INSUFFICIENT_DISTINCT_VENDORS]
        distinguishing_aspect: >
          Two devices entered by ONE member leave distinct_vendor_count at 1, so the lock gate refuses
          with ERR_INSUFFICIENT_DISTINCT_VENDORS; a single registration by a SECOND member lifts the
          count to 2 and the same lock call then succeeds. The gate is `<`, so exactly
          min_distinct_vendors is sufficient.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20); AUTHORIZED host laboratory."
            - "Member M1 in good standing owns two DRAFT submissions (AL-100, AL-200); Member M2 in good standing owns one (BL-300)."
            - "Plugfest PF: min_distinct_vendors 2, window 2026-10-05T09:00Z..17:00Z, registration_deadline 2026-10-01T00:00Z; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /test-laboratories/${lab_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 2, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-200", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:02" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Borea Labs", contact_email: "ops@borea.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m2_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 1, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /members/${m2_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m2_id}", specification_id: "${spec_id}", device_model: "BL-300", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "BB:00:00:03" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { sub3_id: $.data.id }
            - call: "POST /plugfests"
              payload: { host_laboratory_id: "${lab_id}", specification_id: "${spec_id}", window_start: "2026-10-05T09:00:00Z", window_end: "2026-10-05T17:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", min_distinct_vendors: 2 }
