        test_recipe:
          setup: ["Customer, STOCKED item list 1,000, branch stocked 19"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "QT-1", display_name: "QtyTier Co", credit_limit_cents: 1000000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
