              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/readouts"
              payload: { roadmap_decision_id: "${dec_id}", recommendation: "Rewrite the invite step", recommended_action: "SHIP_CHANGE", cited_finding_ids: ["${f1_id}"], expected_study_version: "${sv} + 1" }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/readouts"
              payload: { roadmap_decision_id: "${dec_id}", recommendation: "Rewrite the invite step", recommended_action: "SHIP_CHANGE", cited_finding_ids: ["${f1_id}"], expected_study_version: "${sv}" }
              as: Researcher
