        - call: GET /brands/${brand_id}/risk-index
          payload: {}
          as: BrandAdmin
          captures: {idx: $.data.brand_risk_index, tier: $.data.brand_risk_tier, openc: $.data.open_critical_action_count}
        assert:
        - ${v1_comp} == 93.50 with ${v1_grade} == 'PASS'; ${lvl0} == 0, ${agr0} == 'GOOD_STANDING', ${stand0} == 93.50, ${rep0} == 0 - one critical violation alone appends no escalation event
        - 'the first sweep escalates the overdue CRITICAL action: ${esc_a} == 1, ${lvl1} == 1, ${agr1} == ''NOTICE_OF_DEFAULT'', ${cure1} is null - level 1 does not open a cure period'
        - 'V2 pushes FS-1 to its second critical violation: ${v2_comp} == 93.50, ${rep2} == 1, ${lvl2} == 2, ${agr2} == ''CURE_PERIOD'', ${cure2} == ''2026-08-19T13:00:00Z'', and ${stand2} == 93.00 == ROUND_HALF_UP(93.50
          - 0.50 * 1, 2)'
        - 'the second sweep escalates V2''s CRITICAL action: ${esc_b} == 1, ${lvl3} == 3, ${agr3} == ''TERMINATION_RECOMMENDED'', ${open3} == 0'
        - ${f_term} == true and ${f_defaults} == 1 - crossing the top threshold propagates to the franchisee
        - 'the ledger holds exactly 3 rows in occurred_at order: ${ev0_type} == ''OVERDUE_CRITICAL'' / ${ev0_lvl} == 1, ${ev1_type} == ''REPEAT_CRITICAL'' / ${ev1_lvl} == 2, ${ev2_type} == ''OVERDUE_CRITICAL''
          / ${ev2_lvl} == 3, each with level_delta +1'
        - ${idx} == 26.20 == ROUND_HALF_UP(0.60 * 7.00, 2) + MIN(40.00, 6.00 * 2) + MIN(30.00, 10.00 * 1), ${tier} == 'BASELINE', and ${openc} == 2 - an ESCALATED action still counts as an open critical action
          even though it left the location's remediation pool
  - section: consistency_model
    instances:
    - name: every_cascaded_field_is_readable_in_the_response_that_caused_it
      claim_type: immediate
      grounds:
      - complexity_profile.consistency_model
      - endpoints.POST /audit-visits/{id}/finalize
      - calculations.location_standing_score
      - calculations.brand_risk_index
      distinguishing_aspect: 'Finalize is the widest write in the scenario - it touches the visit, three corrective actions, the auditor, the location, the franchisee and the brand - and under an immediate
        consistency model every one of those must already be settled when the 200 returns. The probe is that the follow-up reads add no information: the same values are visible in the finalize response itself
        and repeating the reads changes nothing.'
      test_recipe:
        setup:
        - Brand SKWR with PUBLISHED rubric RV-2026.1
        - Visit V1 scored 27/20/12/15/10/8 and SUBMITTED, with the clock at 2026-08-05T13:00:00Z
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-01T00:00:00Z'}
          as: BrandAdmin
        - call: POST /brands
          payload: {name: Skewer House, brand_code: SKWR, unannounced_min_ratio_pct: 40}
          as: BrandAdmin
          captures: {brand_id: $.data.id, brand_v: $.data.version}
        - call: POST /franchisees
          payload: {brand_id: '${brand_id}', legal_name: Northline Foods LLC, contact_email: ops@northline.test, agreement_signed_at: '2025-03-01T00:00:00Z'}
          as: BrandAdmin
          captures: {fr_id: $.data.id}
        - call: POST /locations
          payload: {brand_id: '${brand_id}', franchisee_id: '${fr_id}', store_number: SKWR-014, region_code: MIDWEST}
          as: BrandAdmin
          captures: {loc_id: $.data.id}
        - call: POST /auditors
          payload: {full_name: Dana Reyes, employee_code: AUD-101}
          as: BrandAdmin
          captures: {aud_id: $.data.id}
        - call: POST /auditors/${aud_id}/certify
          payload: {}
          as: BrandAdmin
        - call: POST /rubric-versions
          payload: {brand_id: '${brand_id}', version_label: RV-2026.1, effective_from: '2026-07-01T00:00:00Z', total_points: 100, expected_brand_version: '${brand_v}'}
          as: BrandAdmin
          captures: {rv_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-1, section: FOOD_SAFETY, max_points: 30, is_critical: true, display_order: 1}
          as: BrandAdmin
          captures: {fs1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FS-2, section: FOOD_SAFETY, max_points: 20, is_critical: true, display_order: 2}
          as: BrandAdmin
          captures: {fs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-1, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 3}
          as: BrandAdmin
          captures: {bs1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: BS-2, section: BRAND_STANDARDS, max_points: 15, is_critical: false, display_order: 4}
          as: BrandAdmin
          captures: {bs2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-1, section: FACILITY, max_points: 12, is_critical: false, display_order: 5}
          as: BrandAdmin
          captures: {fc1_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/rubric-items
          payload: {item_code: FC-2, section: FACILITY, max_points: 8, is_critical: false, display_order: 6}
          as: BrandAdmin
          captures: {fc2_id: $.data.id}
        - call: POST /rubric-versions/${rv_id}/publish
          payload: {}
          as: BrandAdmin
          captures: {rv_status: $.data.status}
        - call: POST /audit-visits
          payload: {location_id: '${loc_id}', auditor_id: '${aud_id}', rubric_version_id: '${rv_id}', visit_type: UNANNOUNCED, scheduled_start_at: '2026-08-05T09:00:00Z', scheduled_end_at: '2026-08-05T13:00:00Z'}
          as: BrandAdmin
          captures: {v1_id: $.data.id}
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-05T09:00:00Z'}
          as: BrandAdmin
        - call: POST /audit-visits/${v1_id}/start
          payload: {}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fs1_id}', points_awarded: 27}
          as: Auditor
          as_user_id: ${aud_id}
          captures: {si_fs1: $.data.id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fs2_id}', points_awarded: 20}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${bs1_id}', points_awarded: 12}
          as: Auditor
          as_user_id: ${aud_id}
          captures: {si_bs1: $.data.id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${bs2_id}', points_awarded: 15}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fc1_id}', points_awarded: 10}
          as: Auditor
          as_user_id: ${aud_id}
          captures: {si_fc1: $.data.id}
        - call: POST /audit-visits/${v1_id}/scored-items
          payload: {rubric_item_id: '${fc2_id}', points_awarded: 8}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /audit-visits/${v1_id}/submit
          payload: {}
          as: Auditor
          as_user_id: ${aud_id}
        - call: POST /_clock/set_current_utc
          payload: {to_iso8601: '2026-08-05T13:00:00Z'}
          as: BrandAdmin
        trigger:
        - call: POST /audit-visits/${v1_id}/finalize
          payload: {}
          as: BrandAdmin
          captures: {f_st: $.data.status, f_comp: $.data.composite_score, f_var: $.data.composite_variant, f_grade: $.data.grade, f_at: $.data.finalized_at}
        - call: GET /locations/${loc_id}
          payload: {}
          as: BrandAdmin
          captures: {l_stand: $.data.standing_score, l_grade: $.data.latest_grade, l_open: $.data.open_corrective_action_count}
        - call: GET /corrective-actions
          payload: {location_id: '${loc_id}', limit: 10, offset: 0}
          as: BrandAdmin
          captures: {ca_first: '$.data[0].status'}
        - call: GET /auditors/${aud_id}
          payload: {}
          as: BrandAdmin
          captures: {a_fin: $.data.finalized_visit_count}
        - call: GET /brands/${brand_id}/risk-index
          payload: {}
          as: BrandAdmin
          captures: {idx: $.data.brand_risk_index, rated: $.data.rated_location_count}
        - call: GET /locations/${loc_id}
          payload: {}
          as: BrandAdmin
          captures: {l_stand2: $.data.standing_score, l_open2: $.data.open_corrective_action_count}
        - call: GET /brands/${brand_id}/risk-index
          payload: {}
          as: BrandAdmin
          captures: {idx2: $.data.brand_risk_index}
        assert:
        - 'the finalize response itself is already final: ${f_st} == ''FINALIZED'', ${f_comp} == 90.70, ${f_var} == ''FINAL'', ${f_grade} == ''PASS'', ${f_at} == ''2026-08-05T13:00:00Z'''
        - 'the first read after the write already agrees: ${l_stand} == 90.70, ${l_grade} == ''PASS'', ${l_open} == 3 - no second call or retry is needed'
        - GET /corrective-actions?location_id=${loc_id} already returns total_count 3 with ${ca_first} == 'ASSIGNED'
        - ${a_fin} == 1 and ${idx} == 11.58 with ${rated} == 1 - the auditor counter and the brand aggregate are settled in the same instant
        - 'repeating the reads is inert: ${l_stand2} == ${l_stand}, ${l_open2} == ${l_open}, ${idx2} == ${idx} - reads never advance the state'
