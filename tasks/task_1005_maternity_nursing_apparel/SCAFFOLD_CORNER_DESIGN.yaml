scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_customer_success_defaults
        claim_type: creation
        grounds: [entities.Customer.fields.loyalty_points, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "POST /customers returns 201 with a server-minted id; loyalty_points default 0 and settled loyalty_tier BRONZE."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "new@x.com", full_name: "New Person", nursing_flag: true }
              as: Guest
              captures: { cust_id: "$.data.id" }
          assert:
            - "Customer.${cust_id}.loyalty_points == 0"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{unknown-uuid} returns 404 ERR_CUSTOMER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 404"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: create_order_missing_variant_id_returns_validation
        claim_type: required_fields
        grounds: ["entities.Order.fields.variant_id", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders omitting the required variant_id returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "mv@x.com", full_name: "MV" }
              as: Guest
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", order_type: "BUY", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_product_missing_category_returns_validation
        claim_type: required_fields
        grounds: ["entities.Product.fields.category", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products omitting the required category enum returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "No Category", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: system_fields_input_ignored_on_customer_create
        claim_type: system_fields
        grounds: [entities.Customer.fields.loyalty_points]
        distinguishing_aspect: "Client-supplied loyalty_points on POST /customers is ignored; the server keeps it 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "sys@x.com", full_name: "Sys", loyalty_points: 9999 }
              as: Guest
              captures: { cust_id: "$.data.id" }
          assert:
            - "Customer.${cust_id}.loyalty_points == 0"

  # =================================================================
  - section: state_machines
    instances:
      - name: fulfill_unpaid_order_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Order.UNFULFILLED_to_FULFILLED", "errors[ERR_ORDER_NOT_PAID]"]
        distinguishing_aspect: "Fulfilling an order whose payment_status is UNPAID returns 409 ERR_ORDER_NOT_PAID."
        test_recipe:
          setup: ["A BUY order that has been placed but not paid."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "fu@x.com", full_name: "FU" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Tee", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_PAID"

      - name: resume_active_subscription_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Subscription.PAUSED_to_ACTIVE", "errors[ERR_SUBSCRIPTION_NOT_PAUSED]"]
        distinguishing_aspect: "Resuming a subscription already ACTIVE returns 409 ERR_SUBSCRIPTION_NOT_PAUSED."
        test_recipe:
          setup: ["A customer with a fresh ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ra@x.com", full_name: "RA" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_SUBSCRIPTION_NOT_PAUSED"

      - name: pause_cancelled_subscription_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "errors[ERR_SUBSCRIPTION_TERMINAL]"]
        distinguishing_aspect: "Pausing a CANCELLED (terminal) subscription returns 409 ERR_SUBSCRIPTION_TERMINAL."
        test_recipe:
          setup: ["A subscription that has been cancelled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pc@x.com", full_name: "PC" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_SUBSCRIPTION_TERMINAL"

      - name: ship_already_shipped_capsule_rejected
        claim_type: idempotency
        grounds: ["state_machines.Capsule.PACKED_to_SHIPPED", "errors[ERR_CAPSULE_NOT_PACKED]"]
        distinguishing_aspect: "Shipping a capsule already SHIPPED returns 409 ERR_CAPSULE_NOT_PACKED (not idempotently re-shipped)."
        test_recipe:
          setup: ["An ACTIVE subscription with one capsule already shipped."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ss@x.com", full_name: "SS" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Cap Item", category: "CAPSULE", buy_price_cents: 4000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2] }
              as: PlatformAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}"], ship_date: "2026-08-01T00:00:00Z" }
              as: FulfillmentAgent
              captures: { capsule_id: "$.data.id" }
            - call: "POST /capsules/${capsule_id}/ship"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "POST /capsules/${capsule_id}/ship"
              payload: {}
              as: FulfillmentAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_CAPSULE_NOT_PACKED"

      - name: approve_rejected_return_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Return.REQUESTED_to_REJECTED", "state_machines.Return.REQUESTED_to_APPROVED", "errors[ERR_RETURN_NOT_REQUESTED]"]
        distinguishing_aspect: "Approving a return already REJECTED returns 409 ERR_RETURN_NOT_REQUESTED."
        test_recipe:
          setup: ["A COMPLETED order with a return that has been rejected."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ar@x.com", full_name: "AR" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Ret Item", category: "POSTPARTUM", buy_price_cents: 6000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [3], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /returns"
              payload: { order_id: "${order_id}", reason: "changed mind", return_type: "REFUND" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { return_id: "$.data.id" }
            - call: "POST /returns/${return_id}/reject"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_RETURN_NOT_REQUESTED"

      - name: return_on_uncompleted_order_rejected
        claim_type: invalid_transition
        grounds: ["entities.Return.fields.order_id", "errors[ERR_ORDER_NOT_RETURNABLE]"]
        distinguishing_aspect: "Requesting a return on an order that is not COMPLETED (still UNPAID/UNFULFILLED) returns 409 ERR_ORDER_NOT_RETURNABLE."
        test_recipe:
          setup: ["A placed but unpaid BUY order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ru@x.com", full_name: "RU" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Un Item", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_id}", reason: "x", return_type: "REFUND" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_RETURNABLE"

      - name: convert_reserved_rental_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Rental.ACTIVE_to_CONVERTED_TO_BUY", "errors[ERR_RENTAL_NOT_ACTIVE]"]
        distinguishing_aspect: "Converting a rental still in RESERVED (never activated) returns 409 ERR_RENTAL_NOT_ACTIVE."
        test_recipe:
          setup: ["A RENTAL order reserved but not activated."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cr@x.com", full_name: "CR", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Conv Gown", category: "MATERNITY", rentable: true, buy_price_cents: 12000, rental_weekly_cents: 2000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 2, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /rentals"
              payload: { order_id: "${order_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { rental_id: "$.data[0].id" }
          trigger:
            - call: "POST /rentals/${rental_id}/convert-to-buy"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_RENTAL_NOT_ACTIVE"

      - name: subscription_cancel_voids_packed_capsule
        claim_type: side_effect_execution
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, state_machines.Capsule.PACKED_to_VOIDED]
        distinguishing_aspect: "Cancelling a subscription cascades every PACKED capsule to VOIDED."
        test_recipe:
          setup: ["An ACTIVE subscription with one PACKED (unshipped) capsule."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cv2@x.com", full_name: "CV2" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "CAPSULE_BASIC", monthly_fee_cents: 3000, next_ship_date: "2026-08-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Void Item", category: "CAPSULE", buy_price_cents: 4000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2] }
              as: PlatformAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/capsules"
              payload: { item_variant_ids: ["${v1}"], ship_date: "2026-08-01T00:00:00Z" }
              as: FulfillmentAgent
              captures: { capsule_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "Capsule.${capsule_id}.status == VOIDED"

  # =================================================================
  - section: calculations
    instances:
      - name: free_ship_threshold_inclusive_at_8000
        claim_type: correct_result
        grounds: [calculations.order_grand_total, entities.Order.fields.shipping_cents]
        distinguishing_aspect: "A BRONZE BUY order with net_after_discount exactly 8000 gets shipping_cents 0 (FREE_SHIP_THRESHOLD is inclusive), grand_total 8000."
        test_recipe:
          setup: ["A BRONZE customer buying a single 8000-cent variant."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "fs@x.com", full_name: "FS" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Ship Coat", category: "MATERNITY", buy_price_cents: 8000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          assert:
            - "Order.${order_id}.shipping_cents == 0"
            - "Order.${order_id}.grand_total_cents == 8000"

      - name: fit_recommended_size_bust_boundary_94
        claim_type: correct_result
        grounds: [calculations.fit_recommended_size, entities.FitProfile.fields.recommended_size]
        distinguishing_aspect: "bust_cm exactly 94 with current_trimester < 2 yields recommended_size M (the S/M band boundary is lower-inclusive at 94)."
        test_recipe:
          setup: ["A customer with no due_date (current_trimester 0) creating a fit profile with bust_cm 94."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ft@x.com", full_name: "FT" }
              as: Guest
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /fit-profiles"
              payload: { customer_id: "${cust_id}", bust_cm: 94, waist_cm: 80, hip_cm: 100, pre_pregnancy_size: "M" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { fp_id: "$.data.id" }
          assert:
            - "FitProfile.${fp_id}.recommended_size == M"

      - name: fit_recommended_size_second_trimester_bump
        claim_type: correct_result
        grounds: [calculations.fit_recommended_size, calculations.current_trimester]
        distinguishing_aspect: "With clock 2026-07-01 and due_date 2026-10-01 (current_trimester 2), bust_cm 94 bumps one size from M to L."
        test_recipe:
          setup: ["Clock 2026-07-01; customer due 2026-10-01 (trimester 2) creating a fit profile with bust_cm 94."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "fb@x.com", full_name: "FB", due_date: "2026-10-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /fit-profiles"
              payload: { customer_id: "${cust_id}", bust_cm: 94, waist_cm: 82, hip_cm: 102, pre_pregnancy_size: "M" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { fp_id: "$.data.id" }
          assert:
            - "FitProfile.${fp_id}.recommended_size == L"

      - name: current_trimester_third_trimester
        claim_type: computed_fields
        grounds: [calculations.current_trimester, entities.Customer.fields.current_trimester]
        distinguishing_aspect: "With clock 2026-07-01 and due_date 2026-08-01, current_trimester computes to 3 (gestational age ~35.6 weeks)."
        test_recipe:
          setup: ["Clock 2026-07-01; customer due 2026-08-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "tri@x.com", full_name: "Tri", due_date: "2026-08-01T00:00:00Z" }
              as: Guest
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { tri: "$.data.current_trimester" }
          assert:
            - "tri == 3"

  # =================================================================
  - section: validations
    instances:
      - name: rental_order_missing_due_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUE_DATE_REQUIRED]"]
        distinguishing_aspect: "Placing a RENTAL order for a customer whose due_date is null returns 409 ERR_DUE_DATE_REQUIRED."
        test_recipe:
          setup: ["A customer WITHOUT a due_date; a rentable variant; clock 2026-07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nd@x.com", full_name: "ND" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "NoDue Gown", category: "MATERNITY", rentable: true, buy_price_cents: 10000, rental_weekly_cents: 1500 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], rental_units_total: 2 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "RENTAL", expected_variant_version: "${var_v}", rental_weeks: 2, rental_start: "2026-07-01T00:00:00Z" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_DUE_DATE_REQUIRED"

      - name: insufficient_stock_on_buy_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "A BUY quantity of 5 against a variant with inventory_on_hand 1 (ACTIVE product) returns 409 ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["An ACTIVE product variant with only 1 unit of stock."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "is@x.com", full_name: "IS" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Scarce Item", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 1 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 5 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: redemption_exceeds_limit_on_pay_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REDEMPTION_EXCEEDS_LIMIT]"]
        distinguishing_aspect: "Redeeming 6000 points (>= balance) on a 10000-cent order exceeds the floor(0.5*subtotal)=5000 cap and returns 409 ERR_REDEMPTION_EXCEEDS_LIMIT."
        test_recipe:
          setup: ["Customer with 6000 points; a placed BUY order for a 10000-cent variant."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rl@x.com", full_name: "RL" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 6000 }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Redeem Coat", category: "MATERNITY", buy_price_cents: 10000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [2], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 6000 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_REDEMPTION_EXCEEDS_LIMIT"

      - name: insufficient_points_on_pay_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Redeeming 100 points with a 0 balance returns 409 ERR_INSUFFICIENT_POINTS (balance check precedes the cap check)."
        test_recipe:
          setup: ["Customer with 0 points; a placed BUY order for a 5000-cent variant."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ip@x.com", full_name: "IP" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Point Tee", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 100 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"

      - name: return_window_expired_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_RETURN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Requesting a return 50 days after fulfillment (clock 2026-08-20 vs fulfill 2026-07-01) exceeds the 30-day window and returns 409 ERR_RETURN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["A COMPLETED order fulfilled at clock 2026-07-01; clock then advanced to 2026-08-20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "rw@x.com", full_name: "RW" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Late Return Item", category: "POSTPARTUM", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [3], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cv: "$.data.version" }
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cv}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_id}", reason: "too late", return_type: "REFUND" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 409"
            - "response.data.error_id == ERR_RETURN_WINDOW_EXPIRED"

