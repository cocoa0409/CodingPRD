            - "ReviewInvitation.${inv_v_id}.closed_reason == EDITOR_WITHDRAWN"
            - "Reviewer.${rv_v_id}.open_invitation_count == 0 after the withdraw (restored to the pre-invitation value)"
            - "Reviewer.${rv_v_id}.invited_count == 1 (audit counter NOT decremented)"
            - "Reviewer.${rv_v_id}.declined_count == 0"
            - "Reviewer.${rv_v_id}.submitted_count == 0"
            - "Reviewer.${rv_v_id}.reliability_score_rolling == 20.00 (one closed invitation with no delivery)"
            - "Reviewer.${rv_v_id}.status == ACTIVE (only 1 closed invitation, below PROBATION_MIN_CLOSED 3)"
            - "Manuscript.${m_id}.status == UNDER_REVIEW"
      - name: journal_apc_receivable_conserved_by_invoice_cancel
        grounds:
          - state_machines.APCInvoice.ISSUED_to_CANCELLED
          - entities.Journal.fields.apc_receivable_cents
          - entities.Journal.fields.apc_waived_cents
          - validations[priority=30]
          - concurrency_rules[apc-invoice-issue-stale-manuscript]
        distinguishing_aspect: |
          A different conserved quantity — the money ledger Journal.apc_receivable_cents: issuing an
          invoice for 180000 raises it to 180000 and CANCEL returns it to exactly 0 while
          apc_waived_cents stays 0, proving the cancel compensation touches the receivable ledger
          only and does not leak into the waiver ledger (a WAIVE would move 180000 into it).
        test_recipe:
          setup:
            - "One Journal with default apc_base_cents 180000, apc_receivable_cents 0 and apc_waived_cents 0."
            - "One Author with country_income_band HIGH and institutional_agreement false."
            - "One Manuscript in status SUBMITTED with oa_license CC_BY and NO ProductionJob, so a CANCEL settlement is permitted."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
