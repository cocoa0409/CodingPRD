              as: CONTRACTOR_PM
            - call: "POST /contracts/${ca}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${ca}/work-packages"
              payload: { name: "WP A", location: "L12", requires_outage: false }
              as: CONTRACTOR_PM
              captures: { wp_a: $.data.id }
            - call: "POST /work-packages/${wp_a}/transition"
              payload: { to: "MOBILIZED" }
              as: CONTRACTOR_PM
            - call: "POST /crews"
              payload: { crew_code: "CR-XC", crew_type: "OVERHEAD", base_rate_per_hour: 55.00 }
              as: CONTRACTOR_PM
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_code: "EQ-XC", kind: "BUCKET_TRUCK", daily_rate: 120.00 }
              as: CONTRACTOR_PM
              captures: { eq_id: $.data.id }
            - call: "POST /work-packages/${wp_a}/assignments"
              payload: { crew_id: "${crew_id}", equipment_id: "${eq_id}", start_date: "2026-08-03", end_date: "2026-08-07" }
              as: FOREMAN
            - call: "POST /work-packages/${wp_a}/transition"
              payload: { to: "IN_PROGRESS" }
              as: CONTRACTOR_PM
            - call: "POST /contracts"
              payload: { utility_name: "City Power", contract_number: "CV-5B", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cb: $.data.id }
            - call: "POST /contracts/${cb}/stock-items"
              payload: { material_code: "MAT-B", description: "B-owned stock", uom: "EACH", initial_on_hand: 10 }
              as: UTILITY_DISPATCHER
              captures: { stock_b: $.data.id }
          trigger:
            - call: "POST /work-packages/${wp_a}/material-issues"
              payload: { stock_item_id: "${stock_b}", quantity_issued: 1 }
              as: FOREMAN
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_CONTRACT_REFERENCE and http status == 409"
            - "StockItem.${stock_b}.on_hand remains 10"

      - name: duplicate_active_storm_activation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9d]
          - errors[ERR_DUPLICATE_ACTIVE_STANDBY]
        distinguishing_aspect: "A second ACTIVE storm activation for the same crew fails with ERR_DUPLICATE_ACTIVE_STANDBY."
        test_recipe:
          setup: ["Contract ACTIVE; crew CR-DS with one ACTIVE STANDBY activation"]
          setup_api_calls:
