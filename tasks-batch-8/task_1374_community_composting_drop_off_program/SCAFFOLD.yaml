# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, or enum value outside declared set" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist in the expected parent scope" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid from-state for the requested transition" }
  - { id: ERR_PROGRAM_NO_OPERATIONAL_SITE, http: 409, condition: "Program activation requires at least one OPERATIONAL site" }
  - { id: ERR_PROGRAM_NO_MATERIAL_CATEGORY, http: 409, condition: "Program activation requires at least one active MaterialCategory" }
  - { id: ERR_PROGRAM_HAS_OPERATIONAL_SITES, http: 409, condition: "Program close blocked while OPERATIONAL sites remain" }
  - { id: ERR_SITE_NO_ACTIVE_AGREEMENT, http: 409, condition: "Site commission requires an ACTIVE SiteHostAgreement covering the site" }
  - { id: ERR_SITE_NOT_EMPTY, http: 409, condition: "Decommission requires stored_kg == 0" }
  - { id: ERR_SITE_HAS_SCHEDULED_PICKUPS, http: 409, condition: "Decommission blocked by SCHEDULED RouteStops" }
  - { id: ERR_SITE_HAS_ACTIVE_GRANTS, http: 409, condition: "Decommission blocked by ACTIVE AccessGrants" }
  - { id: ERR_INVALID_TERM, http: 409, condition: "Agreement term_end must be after term_start" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Another ACTIVE agreement for the same site overlaps the requested term (touching boundaries allowed)" }
  - { id: ERR_AGREEMENT_ALREADY_EXPIRED, http: 409, condition: "Cannot activate an agreement whose term_end is in the past" }
  - { id: ERR_CURE_PERIOD_ELAPSED, http: 409, condition: "Cure attempted after breach_noticed_at + cure_period_days" }
  - { id: ERR_CURE_PERIOD_NOT_ELAPSED, http: 409, condition: "Termination from BREACH_NOTICED requires cure period to have elapsed" }
  - { id: ERR_INVALID_VERIFICATION_TOKEN, http: 400, condition: "Participant verification token mismatch" }
  - { id: ERR_PARTICIPANT_PERMANENTLY_DEACTIVATED, http: 409, condition: "Reinstate blocked: suspension_count >= 3" }
  - { id: ERR_PARTICIPANT_HAS_PENDING_ALLOCATIONS, http: 409, condition: "Deactivate blocked by REQUESTED DistributionAllocations" }
  - { id: ERR_BUCKETS_STILL_OUT, http: 409, condition: "Grant revoke blocked while buckets_checked_out > 0" }
  - { id: ERR_SITE_POSTURE_BLOCKS_DROP, http: 409, condition: "Site posture SUSPENDED/CLOSED rejects drops; WATCH rejects drops > 5 kg gross" }
  - { id: ERR_MATERIAL_NOT_ACCEPTED, http: 409, condition: "MaterialCategory inactive or outside its seasonal acceptance window" }
  - { id: ERR_ACCESS_GRANT_INVALID, http: 409, condition: "Access grant not ACTIVE, wrong participant/site, or bucket quota exhausted" }
  - { id: ERR_DROP_OUTSIDE_AGREEMENT_TERM, http: 409, condition: "occurred_at in the future or outside the site's host agreement term" }
  - { id: ERR_FEEDBACK_REQUIRES_DROP_LINK, http: 409, condition: "send-feedback requires the report to reference a DropEvent" }
  - { id: ERR_ROUTE_HAS_NO_STOPS, http: 409, condition: "Dispatch requires at least one SCHEDULED stop" }
  - { id: ERR_ROUTE_OVER_CAPACITY, http: 409, condition: "assigned_load_kg exceeds vehicle_capacity_kg" }
  - { id: ERR_PARTNER_INACTIVE, http: 409, condition: "Route's processing partner is inactive" }
  - { id: ERR_PARTNER_DOUBLE_BOOKED, http: 409, condition: "Another DISPATCHED route at the same partner overlaps the requested window (half-open; adjacency allowed)" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Stop collect/skip requires the parent route DISPATCHED" }
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "Direct stop cancel requires the parent route PLANNED" }
  - { id: ERR_ROUTE_STOPS_PENDING, http: 409, condition: "Route complete blocked while any stop remains SCHEDULED" }
  - { id: ERR_PICKUP_EXCEEDS_AVAILABLE, http: 409, condition: "actual_pickup_kg out of bounds relative to site stored + pending mass" }
  - { id: ERR_DISTRIBUTION_HAS_PENDING_REQUESTS, http: 409, condition: "Distribution close blocked by REQUESTED allocations" }
  - { id: ERR_DISTRIBUTION_POOL_EXHAUSTED, http: 409, condition: "Allocation would exceed distribution.total_pool_kg" }
  - { id: ERR_DISTRIBUTION_NO_REQUESTS, http: 409, condition: "Fair-share run with zero REQUESTED allocations" }
  - { id: ERR_INSUFFICIENT_BUCKET_CREDITS, http: 409, condition: "credits_redeemed exceeds participant.bucket_credit_balance" }
  - { id: ERR_COMPLAINT_REOPEN_LIMIT, http: 409, condition: "Complaint reopen_count already at 2" }
  - { id: ERR_COMPLAINT_NOT_STABLE, http: 409, condition: "Complaint close requires an intervening ops run after resolve" }
  - { id: ERR_SOD_SAME_USER, http: 403, condition: "DiversionReport certifier must differ from the report's creator" }
  - { id: ERR_REPORT_PERIOD_NOT_CLOSED, http: 409, condition: "Cannot certify a report whose period_end is after the current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register, verify, and file complaints"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{programId}/participants/register"
      - "POST /programs/{programId}/participants/{participantId}/verify"
      - "POST /programs/{programId}/sites/{siteId}/complaints"
    shared_operations: []

  - name: ProgramAdmin
    description: "City program operator; owns configuration, site lifecycle, agreements, participant discipline, feedback, distributions, ops runs"
    identity: opaque
    exclusive_operations:
      - "POST /programs and program lifecycle actions (activate/suspend/close/run_ops)"
      - "POST /_clock/set_current_utc"
      - "Site create/commission/decommission/archive"
      - "SiteHostAgreement create/activate/breach-notice/cure/terminate"
      - "MaterialCategory create/patch"
      - "Participant suspend/reinstate/deactivate"
      - "AccessGrant create/revoke"
      - "ContaminationReport send-feedback/resolve"
      - "CompostDistribution create/close/cancel; Allocation distribute/cancel"
      - "ComplaintTicket acknowledge/resolve/close"
    shared_operations:
      - "GET endpoints across the surface"

  - name: SiteHost
    description: "Host of a drop-off site; audits drops and accepts/rejects them"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{programId}/sites/{siteId}/drops/{dropId}/accept"
      - "POST /programs/{programId}/sites/{siteId}/drops/{dropId}/reject"
    shared_operations:
      - "GET sites, drops, contamination reports, complaints, materials"

  - name: Participant
    description: "Registered resident; records drops and requests compost allocations"
    identity: entity_backed:Participant
    exclusive_operations:
      - "POST /programs/{programId}/sites/{siteId}/drops"
      - "POST /programs/{programId}/distributions/{distributionId}/allocations"
    shared_operations:
      - "GET own participant record, own grants, sites, materials, distributions, allocations"

  - name: RouteOperator
    description: "Collection contractor; plans and executes routes"
    identity: opaque
    exclusive_operations:
      - "CollectionRoute create/dispatch/complete/cancel"
      - "RouteStop create/collect/skip/cancel"
    shared_operations:
      - "GET routes, partners, stops"

  - name: ProcessingPartner
    description: "Compost processor; closes batches with measured contamination"
    identity: entity_backed:ProcessingPartner
    exclusive_operations:
      - "POST /programs/{programId}/partners/{partnerId}/batches/{batchId}/close"
    shared_operations:
      - "GET batches, routes, partners"

  - name: MunicipalAuditor
    description: "City auditor; opens contamination reports, dismisses them, reopens complaints, generates and certifies diversion reports"
    identity: opaque
    exclusive_operations:
      - "POST /programs/{programId}/sites/{siteId}/contamination-reports"
      - "POST /programs/{programId}/sites/{siteId}/contamination-reports/{reportId}/dismiss"
      - "POST /programs/{programId}/sites/{siteId}/complaints/{complaintId}/reopen"
      - "POST /programs/{programId}/diversion-reports"
      - "POST /programs/{programId}/diversion-reports/{reportId}/certify"
    shared_operations:
      - "GET endpoints across the surface"
