      - name: shift_lock_cancels_reserved_seats_and_starts_construction
        claim_type: side_effect_execution
        grounds: ["state_machines.ConstructionShift.status.OPEN_to_LOCKED", "state_machines.ShiftAssignment.status.RESERVED_to_CANCELLED", "state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_UNDER_CONSTRUCTION", entities.ConstructionShift.fields.safety_briefing_completed, entities.VolunteerProfile.fields.assigned_hours_committed, calculations.volunteer_hour_capacity_invariant]
        distinguishing_aspect: "One lock fires a three-target side-effect set in a single request: it flips safety_briefing_completed, cancels only the still-RESERVED seat (leaving the CONFIRMED seat alone), refunds exactly that volunteer's 4.00 committed hours, and drags the parent BuildSite from READY_TO_BUILD to UNDER_CONSTRUCTION."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and an OPEN 4-hour shift (2026-08-05T08:00 to 12:00) offering 3 general seats, so the lock floor is ceil(0.60 * 3) == 2. Volunteers A and B have CONFIRMED their seats (confirmed_general_count 1 then 2) and volunteer C is still RESERVED; all three profiles therefore carry assigned_hours_committed 4.0, and the shift's version was re-read before each seat creation so no OCC precondition is stale."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
