            - "error.code != ERR_PASSTHROUGH_UNRECONCILED — the lower-priority fiscal rule is also violated but must not surface"
            - "GET /cpa/invoices?cycle_id=${cyc} returns data == [] — no Invoice row was created"
            - "ScheduleCycle.${cyc}.status == OPEN and ScheduleCycle.${cyc}.version == ${cyc_v} — a rejected request bumps no version"
            - "PassThroughClaim.${pt}.status == ACTUAL_SUBMITTED"

