        distinguishing_aspect: "The suspend action is not idempotent by design: SUSPENDED is terminal for TravelAgencyPartner, so the second suspend returns 409 ERR_INVALID_STATE_TRANSITION and leaves the first suspended_reason and the cascaded offer suspension_reason unchanged."
