              captures: { rec_code_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ImprovementRecord.${rec_code_id}.counted_in_cumulative == false"
            - "ImprovementRecord.${rec_code_id}.cost_usd == 150000.00"
            - "Structure.${struct_id}.anchor_record_id == ${rec_counted_id}"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 60000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 30.00"
            - "Structure.${struct_id}.substantial_status == NONE"

      - name: anchor_is_the_latest_event_date_regardless_of_creation_order
        claim_type: chronological_ordering
        grounds:
          - calculations.structure_improvement_aggregates
          - entities.Structure.fields.anchor_record_id
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          The back-dated 60000.00 record of 2026-01-01 is appended last, yet the anchor stays
          on the 20000.00 record of 2026-06-01 because the sort key is event_date DESC — so
          single_event_improvement_pct is 10.00 while cumulative_improvement_pct is 40.00.
          Anchoring on the most recently created row would have inverted both numbers.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure (market_value_usd 200000.00, cumulative_period_years 10)."
            - "First append the later-dated record: 20000.00 on 2026-06-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
