# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2382 — Fastener Cold Heading & Thread Rolling
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tool_life_budget_rated_derated_vs_conservative_observed
        grounds:
          - calculations.tool_effective_life
          - entities.HeadingTool.fields.rated_derated_life_pieces
          - entities.HeadingTool.fields.conservative_life_pieces
          - entities.HeadingTool.fields.observed_avg_cycle_pieces
          - entities.PartSpec.fields.qualification_program
          - validations[priority=17]
          - errors[ERR_TOOL_LIFE_EXHAUSTED]
        distinguishing_aspect: |
          One die set with one short completed cycle offers two different life budgets for the
          identical planned run of 20000 pieces: the rated_derated variant grants 34000 remaining
          pieces and admits the automotive lot, while the conservative_observed variant grants only
          10800 and rejects the aerospace lot with ERR_TOOL_LIFE_EXHAUSTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "Two part specs sharing blank_mass_g 2.0 and allowed_steel_grades [SAE_10B21]: SM-AUTO (AUTOMOTIVE_PPAP) and SM-AERO (AEROSPACE_NADCAP)."
            - "One VERIFIED steel heat of grade SAE_10B21 and one RELEASED wire lot of 200.0 kg drawn 8.00 -> 6.80 mm with PHOSPHATE coating 4.5 gsm."
            - "One heading tool DIE-4S-002 rated 40000 pieces that has completed exactly one cycle of 12000 pieces and been reground once, so regrind_count == 1, cycle_pieces_history == [12000], observed_avg_cycle_pieces == 12000.00, rated_derated_life_pieces == 34000, conservative_life_pieces == 10800, cumulative_pieces_current_cycle == 0, status MOUNTED on PRESS-3."
            - "Wire lot ledger after the burn-in lot: available_mass_kg 176.0, reserved_mass_kg 0.0, consumed_mass_kg 24.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "SM-AUTO", thread_designation: "M4x0.7", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 2.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_COUNT", nominal_pack_count: 1000, pieces_per_kg: 500.0, proof_load_kn: 12.0 }
              as: ProcessEngineer
              captures: { spec_auto_id: $.data.id }
            - call: "POST /part-specs"
              payload: { part_number: "SM-AERO", thread_designation: "M4x0.7", strength_class: "CLASS_12_9", qualification_program: "AEROSPACE_NADCAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 2.0, station_count_required: 4, thread_timing: "AFTER_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 366, max_core_hardness_hv: 414, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 1000, pieces_per_kg: 500.0, proof_load_kn: 45.0 }
              as: ProcessEngineer
              captures: { spec_aero_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 200.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 200.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-002", station_count: 4, rated_life_pieces: 40000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /production-lots"
              payload: { lot_code: "L-BURNIN", part_spec_id: "${spec_auto_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T08:00:00Z", planned_pieces: 12000, expected_wire_lot_version: "${wire_v1}" }
              as: ProcessEngineer
              captures: { lot_burnin_id: $.data.id }
            - call: "POST /production-lots/${lot_burnin_id}/complete-heading"
              payload: { headed_count: 11900, heading_scrap_count: 100 }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/condemn"
              payload: { reason: "CHIPPED_STATION_3" }
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "GET /wire-lots/${wire_id}"
              payload: {}
              as: ProcessEngineer
              captures: { wire_v2: $.data.version }
          trigger:
            - call: "POST /production-lots"
              payload: { lot_code: "L-AUTO-1", part_spec_id: "${spec_auto_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T09:00:00Z", press_window_end_at: "2026-09-01T12:00:00Z", planned_pieces: 20000, expected_wire_lot_version: "${wire_v2}" }
              as: ProcessEngineer
              captures: { lot_auto_id: $.data.id }
            - call: "GET /wire-lots/${wire_id}"
              payload: {}
              as: ProcessEngineer
              captures: { wire_v3: $.data.version }
            - call: "POST /production-lots"
              payload: { lot_code: "L-AERO-1", part_spec_id: "${spec_aero_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T13:00:00Z", press_window_end_at: "2026-09-01T16:00:00Z", planned_pieces: 20000, expected_wire_lot_version: "${wire_v3}" }
              as: ProcessEngineer
          assert:
            - "HeadingTool.${tool_id}.regrind_count == 1"
            - "HeadingTool.${tool_id}.cycle_pieces_history == [12000]"
            - "HeadingTool.${tool_id}.observed_avg_cycle_pieces == 12000.00"
            - "HeadingTool.${tool_id}.rated_derated_life_pieces == 34000"
            - "HeadingTool.${tool_id}.conservative_life_pieces == 10800"
            - "The L-AUTO-1 creation returns 201 and ProductionLot.${lot_auto_id}.wire_reserved_kg == 42.0"
            - "The L-AERO-1 creation returns 422 with error_id ERR_TOOL_LIFE_EXHAUSTED"
            - "WireLot.${wire_id}.available_mass_kg == 134.0 and reserved_mass_kg == 42.0 and consumed_mass_kg == 24.0"

      - name: sampling_plan_normal_accepts_where_tightened_rejects
        grounds:
          - calculations.lot_sampling_plan
          - calculations.lot_release_risk_score
          - entities.LotTest.fields.sample_size
          - entities.LotTest.fields.acceptance_number
          - entities.ProductionLot.fields.inspection_severity
          - state_machines.LotTest.PENDING_to_ACCEPT
          - state_machines.LotTest.PENDING_to_REJECT
        distinguishing_aspect: |
          Two lots of the same part with an identical measured failure count of 1 diverge purely on
          the variant selected by risk: the NORMAL plan draws 99 pieces with acceptance_number 1 and
          returns ACCEPT, while the TIGHTENED plan draws 149 pieces with acceptance_number 0 and
          returns REJECT.
          both lots reach 9740 available pieces before testing.
        test_recipe:
          setup:
            - "Part spec HX-M8-109 (CLASS_10_9, AUTOMOTIVE_PPAP, blank 20.0 g, ZINC_CLEAR, BEFORE_HEAT_TREAT, required ops THREAD_ROLL then POINT, hardness 304-361 HV, max decarb 0.150 mm, BY_WEIGHT 500 pcs at 62.5 pcs/kg)."
            - "VERIFIED heat H-77410, RELEASED wire lot of 500.0 kg, tool DIE-4S-001 rated 120000 mounted on PRESS-3, furnaces FCE-1 and FCE-2 of 400.0 kg."
            - "Lot L-2601 reaches BAKED with bake_delay_hours 3.0 and total_decarb_depth_mm 0.100, so risk_score_pre_test == 28.33 (severity NORMAL)."
            - "Lot L-2602 reaches BAKED with bake_delay_hours 3.5 and total_decarb_depth_mm 0.150, so risk_score_pre_test == 43.32 (severity TIGHTENED)."
            - "Both lots have available_count 9740 when their test is opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "HX-M8-109", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL", "POINT"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_WEIGHT", nominal_pack_count: 500, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /furnaces"
              payload: { furnace_code: "FCE-1", max_charge_mass_kg: 400.0 }
              as: ProcessEngineer
              captures: { furnace_a_id: $.data.id }
            - call: "POST /furnaces"
              payload: { furnace_code: "FCE-2", max_charge_mass_kg: 400.0 }
              as: ProcessEngineer
              captures: { furnace_b_id: $.data.id }
            - call: "POST /production-lots"
              payload: { lot_code: "L-2601", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T10:00:00Z", planned_pieces: 10000, expected_wire_lot_version: "${wire_v1}" }
              as: ProcessEngineer
              captures: { lot_a_id: $.data.id }
            - call: "GET /wire-lots/${wire_id}"
              payload: {}
              as: ProcessEngineer
              captures: { wire_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { lot_code: "L-2602", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T10:00:00Z", press_window_end_at: "2026-09-01T14:00:00Z", planned_pieces: 10000, expected_wire_lot_version: "${wire_v2}" }
              as: ProcessEngineer
              captures: { lot_b_id: $.data.id }
            - call: "POST /production-lots/${lot_a_id}/complete-heading"
              payload: { headed_count: 9800, heading_scrap_count: 150 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/complete-heading"
              payload: { headed_count: 9800, heading_scrap_count: 150 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a_id}/secondary-operations"
              payload: { op_type: "THREAD_ROLL", sequence_no: 1, machine_code: "TR-1" }
              as: ProcessEngineer
              captures: { op_a1_id: $.data.id }
            - call: "POST /secondary-operations/${op_a1_id}/complete"
              payload: { pieces_out: 9750 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a_id}/secondary-operations"
              payload: { op_type: "POINT", sequence_no: 2, machine_code: "PT-1" }
              as: ProcessEngineer
              captures: { op_a2_id: $.data.id }
            - call: "POST /secondary-operations/${op_a2_id}/complete"
              payload: { pieces_out: 9740 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/secondary-operations"
              payload: { op_type: "THREAD_ROLL", sequence_no: 1, machine_code: "TR-1" }
              as: ProcessEngineer
              captures: { op_b1_id: $.data.id }
            - call: "POST /secondary-operations/${op_b1_id}/complete"
              payload: { pieces_out: 9750 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b_id}/secondary-operations"
              payload: { op_type: "POINT", sequence_no: 2, machine_code: "PT-1" }
              as: ProcessEngineer
              captures: { op_b2_id: $.data.id }
            - call: "POST /secondary-operations/${op_b2_id}/complete"
              payload: { pieces_out: 9740 }
              as: ProcessEngineer
            - call: "POST /heat-treat-runs"
              payload: { production_lot_id: "${lot_a_id}", furnace_id: "${furnace_a_id}", window_start_at: "2026-09-01T18:00:00Z", window_end_at: "2026-09-01T23:00:00Z", austenitize_temp_c: 870.0, quench_medium: "OIL", temper_temp_c: 420.0, temper_time_min: 60, carbon_potential_pct: 0.42 }
              as: HeatTreatOperator
              captures: { ht_a_id: $.data.id }
            - call: "POST /heat-treat-runs"
              payload: { production_lot_id: "${lot_b_id}", furnace_id: "${furnace_b_id}", window_start_at: "2026-09-01T18:00:00Z", window_end_at: "2026-09-01T23:00:00Z", austenitize_temp_c: 870.0, quench_medium: "OIL", temper_temp_c: 420.0, temper_time_min: 60, carbon_potential_pct: 0.42 }
              as: HeatTreatOperator
              captures: { ht_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T19:00:00Z" }
              as: HeatTreatOperator
            - call: "POST /heat-treat-runs/${ht_a_id}/start"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /heat-treat-runs/${ht_b_id}/start"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T22:00:00Z" }
              as: HeatTreatOperator
            - call: "POST /heat-treat-runs/${ht_a_id}/results"
              payload: { core_hardness_hv: 330.0, surface_decarb_depth_mm: 0.100 }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /heat-treat-runs/${ht_b_id}/results"
              payload: { core_hardness_hv: 330.0, surface_decarb_depth_mm: 0.150 }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /plating-runs"
              payload: { production_lot_id: "${lot_a_id}", plating_spec: "ZINC_CLEAR", load_mass_kg: 194.8 }
              as: HeatTreatOperator
              captures: { plate_a_id: $.data.id }
            - call: "POST /plating-runs"
              payload: { production_lot_id: "${lot_b_id}", plating_spec: "ZINC_CLEAR", load_mass_kg: 194.8 }
              as: HeatTreatOperator
              captures: { plate_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T02:00:00Z" }
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_a_id}/complete-plating"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_b_id}/complete-plating"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T05:00:00Z" }
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_a_id}/start-bake"
              payload: { bake_temp_c: 210.0, bake_duration_min: 240 }
              as: HeatTreatOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T05:30:00Z" }
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_b_id}/start-bake"
              payload: { bake_temp_c: 210.0, bake_duration_min: 240 }
              as: HeatTreatOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T10:00:00Z" }
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_a_id}/complete-bake"
              payload: {}
              as: HeatTreatOperator
            - call: "POST /plating-runs/${plate_b_id}/complete-bake"
              payload: {}
              as: HeatTreatOperator
          trigger:
            - call: "POST /lot-tests"
              payload: { production_lot_id: "${lot_a_id}" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { test_a_id: $.data.id }
            - call: "POST /lot-tests"
              payload: { production_lot_id: "${lot_b_id}" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { test_b_id: $.data.id }
            - call: "POST /lot-tests/${test_a_id}/results"
              payload: { proof_load_failures: 0, tensile_failures: 1, min_measured_core_hardness_hv: 322.0 }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /lot-tests/${test_b_id}/results"
              payload: { proof_load_failures: 0, tensile_failures: 1, min_measured_core_hardness_hv: 322.0 }
              as: QualityInspector
              as_user_id: "insp-1"
          assert:
            - "ProductionLot.${lot_a_id}.risk_score_pre_test == 28.33"
            - "ProductionLot.${lot_b_id}.risk_score_pre_test == 43.32"
            - "LotTest.${test_a_id}.severity == NORMAL and LotTest.${test_a_id}.sample_size == 99 and LotTest.${test_a_id}.acceptance_number == 1"
            - "LotTest.${test_b_id}.severity == TIGHTENED and LotTest.${test_b_id}.sample_size == 149 and LotTest.${test_b_id}.acceptance_number == 0"
            - "LotTest.${test_a_id}.result == ACCEPT and LotTest.${test_a_id}.total_failures == 1"
            - "LotTest.${test_b_id}.result == REJECT and LotTest.${test_b_id}.total_failures == 1"
            - "ProductionLot.${lot_a_id}.process_state == TESTED and ProductionLot.${lot_a_id}.disposition == IN_PROCESS"
            - "ProductionLot.${lot_b_id}.process_state == TESTING and ProductionLot.${lot_b_id}.disposition == HOLD and ProductionLot.${lot_b_id}.hold_source == TEST_REJECT"

  - rule_id: combinatorial_formula
    instances:
      - name: pack_declared_count_rounds_per_pack_before_summing
        grounds:
          - calculations.pack_unit_count_reconciliation
          - entities.PackUnit.fields.declared_count
          - entities.ProductionLot.fields.packed_count
          - entities.PartSpec.fields.pieces_per_kg
          - state_machines.PackUnit.OPEN_to_SEALED
        distinguishing_aspect: |
          Mode (b) — operation order inside one formula: rounding each 8.008 kg pack to 501 pieces
          and then summing yields packed_count 1002, whereas summing 16.016 kg first and rounding
          once yields 1001; the scaffold pins the per-pack rounding order.
        test_recipe:
          setup:
            - "Lot L-2601 of part HX-M8-109 (BY_WEIGHT, 62.5 pcs/kg, nominal 500, count_tolerance_pct 0.02) is CERTIFIED under an ISSUED certificate."
            - "The lot has available_count 9641 after a destructive test of 99 pieces; packed_count 0."
            - "Logical clock at 2026-09-02T11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "HX-M8-109", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL", "POINT"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_WEIGHT", nominal_pack_count: 500, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
