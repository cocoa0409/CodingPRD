            - "${e_category} == ERR_SPECIES_CLASS_MISMATCH with HTTP 422 (BOXED_BEEF_CUTOUT requires a BOXED_BEEF window) and no MarketReport row is created"
            - "${e_lot_on_live} == ERR_LINE_ITEM_CLASS_MISMATCH with HTTP 422"
            - "${e_txn_on_boxed} == ERR_LINE_ITEM_CLASS_MISMATCH with HTTP 422 — the guard is symmetric"
            - "${e_not_auth} == ERR_WHOLESALE_NOT_AUTHORIZED with HTTP 409 (Plant.${plant_nb}.wholesale_reporting_required == false at boxed volume 0)"
            - "Submission.${sub_lv} and Submission.${sub_bb} remain DRAFT with all reported_* totals 0, and neither window's accepted_submission_count moves"

      - name: determination_prerequisites_rejected
