          setup: ["permit REJECTED while pinned to drawing revision 1; revision 1 since SUPERSEDED by approved revision 2"]
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
