  - rule_id: boundary_precision_check
    instances:
      - name: spill_threshold_inclusive_major
        grounds:
          - calculations.spill_classification
          - entities.SpillIncident.fields.classification
        distinguishing_aspect: |
          Metric: estimated activity in MBq on POST /spill-incidents. The >=
          boundary is inclusive: 37.000 == threshold classifies MAJOR while
          36.999 classifies MINOR. Different metric and endpoint from the sibling
          instance (dose rate in uSv/h on POST /patient-release-instructions).
        test_recipe:
          setup:
            - "Isotope with spill_major_threshold_mbq = 37; two rooms"
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-A", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { roomA: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-B", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { roomB: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${roomA}", isotope_product_id: "${iso}", estimated_activity_mbq: 37, occurred_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, as_user_id: "rp-1", captures: { s1: $.data.id, c1: $.data.classification } }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${roomB}", isotope_product_id: "${iso}", estimated_activity_mbq: 36.999, occurred_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, as_user_id: "rp-1", captures: { s2: $.data.id, c2: $.data.classification } }
          assert:
            - "SpillIncident.${s1}.classification == MAJOR (37.000 >= 37, inclusive boundary)"
            - "SpillIncident.${s2}.classification == MINOR (36.999 < 37)"

      - name: release_dose_rate_inclusive_limit
        grounds:
          - calculations.release_eligibility
          - entities.PatientReleaseInstruction.fields.releasable
        distinguishing_aspect: |
          Metric: measured 1-meter dose rate in uSv/h on POST
          /patient-release-instructions. The <= boundary is inclusive: exactly
          70.0 uSv/h is releasable while 70.001 would fail. Different metric and
          endpoint from the sibling instance (MBq on spill creation).
        test_recipe:
          setup:
            - "I-131 fixture: one order, vial calibrated 1100.000 at 08:30, administered at 09:00 (assayed 1098.024)"
          setup_api_calls:
