              as: Treasurer
              as_user_id: "tr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"

  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_date_strictly_after_due
        grounds:
          - calculations.delinquency_charges
          - state_machines.Installment.PENDING_to_DELINQUENT
          - endpoints["POST /property-tax/_clock/set_current_utc"]
        distinguishing_aspect: "Date-metric boundary: at clock 2026-09-15 (the due date itself) installment 2 stays PENDING with penalty 0; at 2026-09-16 (strictly after) it becomes DELINQUENT with penalty 10000 — the '>' boundary on due_date."
        test_recipe:
          setup:
            - "TaxBill net 400000; installment 1 paid; clock set to the due date 2026-09-15 (installment 2 still in grace)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D11", owner_name: "Bo Undary", situs_address: "11 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: Treasurer
          trigger:
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: Treasurer
          assert:
            - "Before trigger (clock 2026-09-15): Installment(sequence=2 of bill ${bill_id}).status == PENDING and penalty_cents == 0"
            - "After trigger (clock 2026-09-16): Installment(sequence=2 of bill ${bill_id}).status == DELINQUENT"
            - "After trigger: Installment(sequence=2 of bill ${bill_id}).penalty_cents == 10000"

      - name: referral_threshold_at_exact_floor
        grounds:
          - validations[priority=12]
          - entities.TaxBill.fields.delinquent_principal_cents
          - state_machines.TaxBill.NONE_to_IN_TAX_SALE
        distinguishing_aspect: "Money-metric boundary on a different endpoint (POST referrals): delinquent_principal exactly 50000 == LIEN_REFERRAL_THRESHOLD_CENTS satisfies the '>=' check and the referral is created (49999 would fail ERR_BELOW_REFERRAL_THRESHOLD)."
        test_recipe:
          setup:
            - "Parcel assessed 5000000; installment 1 (50000) paid; clock 2026-09-16 makes installment 2 delinquent with principal exactly 50000."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D12", owner_name: "Ex Act", situs_address: "12 Main St", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 50000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
          trigger:
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { ref_id: $.data.id }
          assert:
            - "TaxSaleReferral.${ref_id}.status == REFERRED"
            - "TaxSaleReferral.${ref_id}.delinquent_principal_at_referral_cents == 50000"
            - "TaxBill.${bill_id}.sale_status == IN_TAX_SALE"

  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_rejected_when_bill_paid
        grounds:
          - state_machines.Payment.POSTED_to_POSTED
          - entities.TaxBill.fields.collection_status
          - errors[ERR_BILL_ALREADY_PAID]
        distinguishing_aspect: "Payment.post is legal only while TaxBill.collection_status != PAID; a fully paid bill rejects a further payment with ERR_BILL_ALREADY_PAID — pair (Payment, TaxBill)."
        test_recipe:
          setup:
            - "TaxBill net 400000 paid in full (collection_status PAID)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D13", owner_name: "Paid Off", situs_address: "13 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 400000, tender_type: "ACH", source: "COUNTER" }
              as: Cashier
          trigger:
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 100, tender_type: "CASH", source: "COUNTER" }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BILL_ALREADY_PAID"
            - "HTTP status == 409"

      - name: referral_rejected_when_no_installment_delinquent
        grounds:
          - state_machines.Installment.PENDING_to_DELINQUENT
          - validations[priority=11]
          - errors[ERR_NOT_DELINQUENT]
        distinguishing_aspect: "TaxSaleReferral creation depends on an Installment being DELINQUENT; with all installments PENDING the referral is rejected with ERR_NOT_DELINQUENT — pair (TaxSaleReferral, Installment), distinct from (Payment, TaxBill)."
        test_recipe:
          setup:
            - "Parcel assessed 5000000; bill issued; clock at default 2026-05-01 so both installments are PENDING (none delinquent)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D14", owner_name: "Not Due", situs_address: "14 Main St", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill_v: $.data.version }
          trigger:
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill_id}", expected_bill_version: "${bill_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_DELINQUENT"
            - "HTTP status == 409"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: relief_effective_period_closed_overlap
        grounds:
          - validations[priority=9]
          - entities.TaxReliefApplication.fields.effective_from
          - state_machines.TaxReliefApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Closed-interval overlap: an approved exemption for [2025-01-01, 2025-12-31] blocks approving a second application for [2025-12-31, 2026-06-30] because the endpoints TOUCH at 2025-12-31 (closed interval => touching counts as overlap) — ERR_RELIEF_PERIOD_OVERLAP on the Parcel."
        test_recipe:
          setup:
            - "One EXEMPTION application on the parcel approved for [2025-01-01, 2025-12-31]; a second application submitted for [2025-12-31, 2026-06-30] and moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D15", owner_name: "Ov Erlap", situs_address: "15 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "EXEMPTION", relief_type: "HOMESTEAD", claimed_amount_cents: 50000, effective_from: "2025-01-01T00:00:00Z", effective_to: "2025-12-31T00:00:00Z" }
              as: Cashier
              captures: { app1_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app1_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications/${app1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
            - call: "POST /property-tax/relief-applications"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}", relief_class: "EXEMPTION", relief_type: "SENIOR", claimed_amount_cents: 40000, effective_from: "2025-12-31T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
              as: Cashier
              captures: { app2_id: $.data.id }
            - call: "POST /property-tax/relief-applications/${app2_id}/review"
              payload: {}
              as: ReliefOfficer
              as_user_id: "ro-1"
          trigger:
            - call: "POST /property-tax/relief-applications/${app2_id}/decide"
              payload: { decision: "APPROVE" }
              as: ReliefOfficer
              as_user_id: "ro-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RELIEF_PERIOD_OVERLAP"
            - "HTTP status == 409"
            - "TaxReliefApplication.${app2_id}.status == UNDER_REVIEW (unchanged)"

      - name: referral_window_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.TaxSaleReferral.fields.redemption_deadline
          - state_machines.TaxBill.NONE_to_IN_TAX_SALE
        distinguishing_aspect: "Half-open-interval overlap on a different resource (TaxSaleReferral): a referral for the parcel's 2024 bill opened 2026-01-01 (window [2026-01-01, 2027-01-01)) blocks a second referral opened 2026-09-16 for the 2025 bill because 2026-09-16 lies strictly inside the window — ERR_REFERRAL_WINDOW_OVERLAP (adjacency at the deadline would be allowed)."
        test_recipe:
          setup:
            - "Two tax years (2024 due 2025-06-15/2025-09-15; 2025 due 2026-06-15/2026-09-15) and one parcel assessed 5000000 with a bill in each year, both delinquent above threshold at their respective clocks; the 2024 bill referred at clock 2026-01-01 (still REFERRED)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2024, millage_rate: 20.0, first_installment_due_date: "2025-06-15T00:00:00Z", second_installment_due_date: "2025-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty24_id: $.data.id }
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty25_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D16", owner_name: "Two Yr", situs_address: "16 Main St", assessed_value_cents: 5000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty24_id}" }
              as: Treasurer
              captures: { bill24_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty25_id}" }
              as: Treasurer
              captures: { bill25_id: $.data.id }
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill24_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill24_v: $.data.version }
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill24_id}", expected_bill_version: "${bill24_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { ref24_id: $.data.id }
            - call: "POST /property-tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: CollectionsOfficer
            - call: "GET /property-tax/tax-bills/${bill25_id}"
              payload: {}
              as: CollectionsOfficer
              captures: { bill25_v: $.data.version }
          trigger:
            - call: "POST /property-tax/tax-sale-referrals"
              payload: { bill_id: "${bill25_id}", expected_bill_version: "${bill25_v}" }
              as: CollectionsOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERRAL_WINDOW_OVERLAP"
            - "HTTP status == 409"
            - "TaxBill.${bill25_id}.sale_status == NONE (unchanged)"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_balance_conservation_on_reverse
        grounds:
          - calculations.bill_balance
          - state_machines.Payment.POSTED_to_REVERSED
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = TaxBill.balance_cents == sum(LedgerEntry.amount_cents). A PAYMENT(-200000) followed by its REVERSAL(+200000) leaves balance at the original 400000 with zero drift."
        test_recipe:
          setup:
            - "TaxBill net 400000 (balance 400000); one 200000 payment posted (balance 200000)."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D17", owner_name: "Re Verse", situs_address: "17 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 200000, tender_type: "CHECK", source: "COUNTER" }
              as: Cashier
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /property-tax/payments/${pay_id}/reverse"
              payload: {}
              as: Treasurer
              as_user_id: "tr-1"
          assert:
            - "TaxBill.${bill_id}.balance_cents == 400000"
            - "sum(LedgerEntry.amount_cents for bill ${bill_id}) == 400000"
            - "Payment.${pay_id}.status == REVERSED"
            - "Installment(sequence=1 of bill ${bill_id}).status == PENDING"

      - name: cash_conservation_on_refund
        grounds:
          - entities.TaxBill.fields.total_applied_cents
          - state_machines.Refund.REQUESTED_to_APPROVED
          - calculations.refund_available
        distinguishing_aspect: "Conserved quantity = county-retained cash: total_applied_cents == total_charged_cents. Overpaying 500000 on a 400000 bill and refunding the 100000 overpayment leaves total_applied 400000 (== charges), overpayment 0 — a different conserved quantity than the ledger balance sum."
        test_recipe:
          setup:
            - "TaxBill net 400000 overpaid by 100000 (payment 500000); Refund for 100000 filed by tr-1."
          setup_api_calls:
            - call: "POST /property-tax/tax-years"
              payload: { year: 2025, millage_rate: 20.0, first_installment_due_date: "2026-06-15T00:00:00Z", second_installment_due_date: "2026-09-15T00:00:00Z" }
              as: Treasurer
              captures: { ty_id: $.data.id }
            - call: "POST /property-tax/parcels"
              payload: { parcel_number: "APN-D18", owner_name: "Re Fund", situs_address: "18 Main St", assessed_value_cents: 20000000, property_class: "RESIDENTIAL" }
              as: Cashier
              captures: { p_id: $.data.id }
            - call: "POST /property-tax/tax-bills"
              payload: { parcel_id: "${p_id}", tax_year_id: "${ty_id}" }
              as: Treasurer
              captures: { bill_id: $.data.id }
            - call: "POST /property-tax/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 500000, tender_type: "ACH", source: "COUNTER" }
              as: Cashier
            - call: "GET /property-tax/tax-bills/${bill_id}"
              payload: {}
              as: Treasurer
              captures: { bill_v: $.data.version }
            - call: "POST /property-tax/refunds"
              payload: { bill_id: "${bill_id}", amount_cents: 100000, mode: "GROSS_OVERPAYMENT", expected_bill_version: "${bill_v}" }
              as: Treasurer
              as_user_id: "tr-1"
              captures: { refund_id: $.data.id }
          trigger:
            - call: "POST /property-tax/refunds/${refund_id}/decide"
              payload: { decision: "APPROVE" }
              as: Treasurer
              as_user_id: "tr-2"
          assert:
            - "Refund.${refund_id}.approved_amount_cents == 100000"
            - "TaxBill.${bill_id}.total_applied_cents == 400000"
            - "TaxBill.${bill_id}.overpayment_cents == 0"
            - "TaxBill.${bill_id}.balance_cents == 0"
