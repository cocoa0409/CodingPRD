            - "INVOICING IS SHARED BY ACCOUNTANT AND VENUE — ${sr_i1_status} == ${sr_i2_status} == SUBMITTED, one papered by the TourAccountant and one by the VenueOperator, and both enter the ledger only on approval"
            - "APPROVAL IS SHARED BY ACCOUNTANT AND RISK — ${sr_i1_appr} == APPROVED with ${sr_i1_apprby} == u_sr_ta2 and ${sr_i2_appr} == APPROVED with ${sr_i2_apprby} == u_sr_risk1; L1 becomes ${sr_l1_actual} == 210000 with ${sr_l1_pct} == 5.00, ${sr_l1_vstatus} == WITHIN_TOLERANCE and ${sr_l1_exp} == 210000"
            - "THE VARIANCE DECISION IS SHARED BUT THE AUTHORITY IS NOT — L2 at ${sr_l2_pct} == 30.00 is ${sr_l2_vstatus} == PENDING_APPROVAL with ${sr_l2_role} == RISK_OFFICER and ${sr_l2_exp_a} == 100000 (budgeted); only the RiskOfficer may decide it, and after APPROVE cap 130000 ${sr_l2_vstatus_b} == APPROVED with ${sr_l2_exp_b} == 130000"
            - "THE ACCOUNTANT HALF OF THE SAME ENDPOINT WORKS ON ITS OWN BAND — L3 at ${sr_l3_pct} == 25.00 (exactly the escalation boundary) has ${sr_l3_role} == TOUR_ACCOUNTANT and ${sr_l3_exp_a} == 100000; the TourAccountant's APPROVE cap 125000 gives ${sr_l3_vstatus_b} == APPROVED, ${sr_l3_exp_b} == 125000 and ${sr_l3_decby} == u_sr_ta3"
            - "DISPUTING IS SHARED BY ACCOUNTANT AND VENUE — the VenueOperator's dispute gives ${sr_i4_status} == DISPUTED and the TourAccountant's gives ${sr_i5_status} == DISPUTED; the second one voids the verification, so ${sr_i5_verby} == u_sr_ta1 becomes ${sr_i5_verby_after} == null"
            - "A DISPUTED INVOICE IS INVISIBLE TO THE LEDGER — ${sr_l1_actual_after} == 210000, unchanged by the 50000 disputed invoice on the same line"
            - "CANCELLATION EVENTS ARE SHARED BY BUYER AND RISK — ${sr_e1_status} == ${sr_e2_status} == OPENED with ${sr_e1_kind} == CANCELLED (opened by the TalentBuyer) and ${sr_e2_kind} == POSTPONED (opened by the RiskOfficer)"
            - "EACH RELEASE OF A GUARANTEE IS VISIBLE IN THE MARKET LEDGER — committed falls from 200000 to ${sr_mk_committed_a} == 100000 after S1 dies and to ${sr_mk_committed_b} == 0 after S2 is postponed"

      - name: segregation_of_duties_blocks_the_same_user_from_both_halves_of_four_pairs
        claim_type: Segregation of duties
        grounds:
          - "complexity_profile.role_model=segregation_of_duties"
          - "validations[priority=19]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "endpoints[POST /vendor-invoices/{vendor_invoice_id}/approve]"
          - "endpoints[POST /settlements/{settlement_id}/pay]"
          - "endpoints[POST /settlements/{settlement_id}/reopen]"
          - "endpoints[POST /cancellation-events/{cancellation_event_id}/settle-claim]"
        distinguishing_aspect: "All four declared four-eyes pairs are exercised in one run, each as a matched negative/positive couple: the same X-User-ID is refused and a different X-User-ID of the SAME role immediately succeeds, which proves the check is on the user and not on the role. The pairs are deliberately different in shape — approve/verify compares against a field on the same row, reopen/calculate compares against a field the previous action wrote on the settlement, pay compares a TourAccountant's user id against a signature left by an ARTIST identity (so the two halves are performed by different roles and the comparison is purely on the id), and settle-claim compares against the filer on the cancellation event. The refusal must also leave nothing behind: a refused approval leaves the invoice VERIFIED and the budget line untouched, so the four-hop cascade cannot have run."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market SoD Market limit 5000000; Venue SoD Hall capacity 500, facility fee 0, ticket tax 0; Artists SoD Act One and SoD Act Two, both withholding 0."
