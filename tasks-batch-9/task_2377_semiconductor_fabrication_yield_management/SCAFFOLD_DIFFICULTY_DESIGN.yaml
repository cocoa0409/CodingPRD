        distinguishing_aspect: |
          Resource entity: Equipment — a different resource from Chamber. Interval semantics: the
          post-PM purge window is the CLOSED interval [pm_completed, purge_until]; a track-in at
          exactly purge_until (2026-08-03T00:00:00Z) is still refused, and one second later it is
