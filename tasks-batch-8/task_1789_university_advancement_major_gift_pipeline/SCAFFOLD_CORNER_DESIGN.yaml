              payload: { assessed_capacity_cents: 1000000, engagement_score: 50, philanthropy_score: 50, recency_score: 50, evidence_tier: "SELF_REPORTED" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { ab_id: $.data.id }
          trigger:
            - call: "GET /advancement/prospects/${pa_id}/assessments"
              payload: {}
              as: ProspectResearcher
              as_user_id: "res-1"
          assert:
            - "exactly 2 rows returned: ${a1_id} (SUPERSEDED) and ${a2_id} (APPROVED)"
            - "no row has id ${ab_id}  # other prospect's child excluded"
            - "total_count == 2"

