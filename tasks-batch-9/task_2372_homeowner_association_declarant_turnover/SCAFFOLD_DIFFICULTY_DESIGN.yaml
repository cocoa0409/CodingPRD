              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp1_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Entry Gate", category: "INFRASTRUCTURE", replacement_cost_cents: 250000, useful_life_years: 12, effective_age_years: 1, promised_completion_date: "2025-01-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp2_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp1_id}", vendor_name: "GreenScape LLC", developer_affiliated: true, annual_cost_cents: 240000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-12-31T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_a_id: $.data.id }
            - call: "POST /hoa/vendor-contracts"
              payload: { association_id: "${assoc_id}", component_id: "${comp2_id}", vendor_name: "GateTech Inc", developer_affiliated: true, annual_cost_cents: 120000, service_window_start: "2026-01-01T00:00:00Z", service_window_end: "2026-12-31T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { contract_b_id: $.data.id }
            - call: "POST /hoa/vendor-contracts/${contract_a_id}/actions"
              payload: { action: "REQUEST_ASSIGNMENT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/vendor-contracts/${contract_b_id}/actions"
              payload: { action: "REQUEST_ASSIGNMENT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "VENDOR_CONTRACTS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item1_id: $.data.id }
            - call: "POST /hoa/records-items"
              payload: { turnover_case_id: "${case_id}", category: "VENDOR_CONTRACTS", required: true }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { item2_id: $.data.id }
            - call: "POST /hoa/records-items/${item1_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/records-items/${item2_id}/transitions"
              payload: { action: "DELIVER" }
              as: Declarant
              as_user_id: "declarant-1"
          trigger:
            - call: "POST /hoa/vendor-contracts/${contract_b_id}/actions"
              payload: { action: "REFUSE_CONSENT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/vendor-contracts/${contract_a_id}/actions"
              payload: { action: "CONSENT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "after the REFUSE_CONSENT call: VendorContract.${contract_b_id}.assignment_status == CONSENT_REFUSED and status == TERMINATED_FOR_REFUSAL"
            - "after the REFUSE_CONSENT call: RecordsTransferItem.${item1_id}.status == DELIVERED and RecordsTransferItem.${item2_id}.status == DELIVERED"
            - "after the REFUSE_CONSENT call: TurnoverCase.${case_id}.records_transfer_completeness_pct == 0.00"
            - "after the REFUSE_CONSENT call: Association.${assoc_id}.budget_forecast_status == STALE"
            - "after the CONSENT call: VendorContract.${contract_a_id}.assignment_status == CONSENTED and status == ACTIVE, not TERMINATED_FOR_REFUSAL"
            - "after the CONSENT call: RecordsTransferItem.${item1_id}.status == ACCEPTED and RecordsTransferItem.${item2_id}.status == ACCEPTED"
            - "after the CONSENT call: TurnoverCase.${case_id}.records_transfer_completeness_pct == 100.00"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: certify_trigger_five_hop_cascade_to_superseded_draft_budget
        grounds:
          - state_machines.TurnoverCase.DECLARANT_CONTROL_to_ELECTION_CALLED
          - state_machines.Director.SEATED_to_RESIGNED
          - state_machines.VendorContract.ACTIVE_to_CANCELLABLE
          - state_machines.AssessmentSchedule.DRAFT_to_SUPERSEDED
          - entities.Association.fields.budget_forecast_status
          - entities.VendorContract.fields.cancellation_window_end
          - calculations.governance_seat_ledger
        distinguishing_aspect: |
          Depth-5 chain in which each hop is caused by the previous hop's write, not by the request:
          certify-trigger sets governance ELECTION_CALLED (A) -> that resigns the declarant-appointed
          Director (B) -> the empty declarant bench makes the developer-affiliated ACTIVE VendorContract
          CANCELLABLE with cancellation_window_end 2026-10-30T00:00:00Z (C) -> that new cancellable
          obligation stales Association.budget_forecast_status (D) -> the stale forecast supersedes the
          DRAFT AssessmentSchedule (E), while the separately ADOPTED schedule is left untouched, proving
          hop E is a conditional cascade over child state rather than a blanket sweep.
        test_recipe:
          setup:
            - "Association 'Harrowfield' with fixed_turnover_date 2026-07-01T00:00:00Z and reserve_pool_cents 1200000."
            - "TurnoverCase with total_seats 5, governance DECLARANT_CONTROL, financial AUDIT_IN_PROGRESS (already advanced), so mutations are still allowed."
            - "One SEATED DECLARANT_APPOINTED Director."
