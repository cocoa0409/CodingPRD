  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: composite_risk_score_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.composite_risk_score
        distinguishing_aspect: "Verify severity weights and tier multiplier are exactly as pinned: SEV_1 contributes 40, tier TIER_1 multiplies by 1.5. A SEV_1 incident on TIER_1 vendor with no other contributions yields 40*1.5=60.00, posture ESCALATED."
        test_recipe:
          setup: ["Vendor TIER_1 ACTIVE; one OPEN SEV_1 incident."]
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "ConstV", headquarters_region: "NA", service_category: "CLOUD_INFRA" }
              as: VendorRelationshipManager
              captures: { v_cv: $.data.id }
            - call: "GET /tprm/vendors/${v_cv}"
              payload: {}
              as: RiskOfficer
              captures: { v_cv_v: $.data.version }
            - call: "POST /tprm/vendors/${v_cv}/tier-change"
              payload: { to_tier: "TIER_1_CRITICAL", reason: "crit", expected_vendor_version: "${v_cv_v}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_cv}/engagements"
              payload: { engagement_code: "CV-E1", service_summary: "x", annual_spend_cents: 100, data_sensitivity: "REGULATED" }
              as: VendorRelationshipManager
              captures: { e_cv: $.data.id }
            - call: "POST /tprm/engagements/${e_cv}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_fj", security_reviewer_id: "u_sj", compliance_reviewer_id: "u_cj" }
              as: VendorRelationshipManager
              captures: { p_cv: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_cv}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_cv}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/engagements/${e_cv}"
              payload: {}
              as: RiskOfficer
              captures: { e_cv_v: $.data.version }
            - call: "POST /tprm/due-diligence-packages/${p_cv}/approve"
              payload: { expected_engagement_version: "${e_cv_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_cv}/contracts"
              payload: { contract_reference: "CV-C1", effective_date: "2026-05-01T00:00:00Z", expiry_date: "2027-05-01T00:00:00Z", has_right_to_audit_clause: true, has_sla_terms: true, has_exit_plan_section: true, sla_uptime_pct: 99.99, breach_cure_window_days: 30, renewal_notice_days: 60 }
              as: VendorRelationshipManager
              captures: { c_cv: $.data.id }
            - call: "GET /tprm/engagements/${e_cv}"
              payload: {}
              as: RiskOfficer
              captures: { e_cv_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_cv}/execute"
              payload: { expected_engagement_version: "${e_cv_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_cv}/activate"
              payload: {}
              as: RiskOfficer
          trigger:
            - call: "POST /tprm/engagements/${e_cv}/incidents"
              payload: { incident_type: "DATA_BREACH", severity: "SEV_1", detected_at: "2026-05-02T00:00:00Z" }
              as: BusinessUnitOwner
            - call: "GET /tprm/vendors/${v_cv}"
              payload: {}
              as: RiskOfficer
          assert:
            - "Vendor.${v_cv}.composite_risk_score == 60.00  # 40 * 1.5"
            - "Vendor.${v_cv}.tier_posture == ESCALATED  # 60 >= 40, < 70"

