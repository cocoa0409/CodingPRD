  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_capture_then_refund_restores_balance_due
        grounds:
          - state_machines.Deposit.PENDING_to_CAPTURED
          - state_machines.Deposit.CAPTURED_to_REFUNDED
          - calculations.balance_reconciliation
        distinguishing_aspect: |
          Conserved quantity = Project.balance_due_cents: capturing then refunding the SAME deposit leaves
          balance_due_cents identical to the pre-capture value (no monetary drift), pinned as
          balance_due == accepted_total - sum(CAPTURED deposits) - financed.
        test_recipe:
          setup:
            - "Project GARAGE, Quote total 71280 ACCEPTED, balance pre-deposit 71280"
            - "Deposit 17820 captured -> balance 53460, then refunded"
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "p14@x.com", full_name: "P14", zip_code: "50000" }
              as: Anonymous
              captures: { cust: $.data.id }
