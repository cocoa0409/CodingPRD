  # ===================================================================
  - section: rbac
    instances:

      - name: request_missing_x_user_role_header_returns_unauthenticated
        claim_type: Role Denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A referral create sent with no X-User-Role header (and with X-User-ID present) returns ERR_UNAUTHENTICATED (401) at priority 1, before any role, existence or schema rule runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              as_user_id: "rs-001"
              captures: { err: $.data.error_id }
          assert:
            - "The request is issued with the X-User-Role header omitted entirely"
            - "HTTP status is 401"
            - "err == ERR_UNAUTHENTICATED"
            - "GET /bereavement/referrals returns 0 rows"

      - name: referral_source_cannot_screen_a_referral_returns_forbidden_role
        claim_type: Role Denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.ReferralSource"]
        distinguishing_aspect: "ReferralSource may only create referrals; screening is exclusive to IntakeCoordinator, so a screen call as ReferralSource returns ERR_FORBIDDEN_ROLE (403) and the referral stays RECEIVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One RECEIVED Referral."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "Elin Roos", date_of_death: "2026-05-20", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Finn Roos", contact_email: "finn.roos@example.org" }
              as: ReferralSource
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /bereavement/referrals/${ref_id}/screen"
              payload: { eligibility_note: "self screening attempt" }
              as: ReferralSource
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "err == ERR_FORBIDDEN_ROLE"
            - "Referral.${ref_id}.status == RECEIVED"
            - "Referral.${ref_id}.screening_band is null"

      - name: grant_officer_cannot_create_a_funding_allocation_returns_forbidden_role
        claim_type: Role Denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]", "roles.GrantOfficer"]
        distinguishing_aspect: "GrantOfficer is a read-and-adjudicate role: it may return or accept reports but never writes programme money, so creating an allocation as GrantOfficer returns ERR_FORBIDDEN_ROLE (403) with the award untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A GrantAward with awarded_cents 5000000 allowing REMEMBRANCE_EVENT and one PLANNED RemembranceEvent."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Hall A", capacity: 60, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Hollis Foundation", award_reference: "HF-2026-RBAC", awarded_cents: 5000000, allowed_categories: ["REMEMBRANCE_EVENT"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "RBAC Vigil", meeting_space_id: "${sp_id}", event_date: "2026-10-05", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev_id}", expected_grant_award_version: "${g_v1}" }
              as: GrantOfficer
              as_user_id: "go-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "err == ERR_FORBIDDEN_ROLE"
            - "GrantAward.${g_id}.committed_cents == 0"
            - "GrantAward.${g_id}.version == 1"
            - "GET /bereavement/funding-allocations?grant_award_id=${g_id} returns 0 rows"

      - name: participant_cannot_confirm_another_participants_enrollment
        claim_type: Ownership Denial
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles.Participant"]
