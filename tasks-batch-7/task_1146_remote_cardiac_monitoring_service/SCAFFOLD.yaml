# =============================================================================
# Task 1146 — Remote Cardiac Monitoring Service (IDTF) scaffold
# =============================================================================

scenario: |
  1146. Remote Cardiac Monitoring Service (cardiac monitoring IDTF): device
  enrollment (Holter/event/implantable) & patient education, data transmission
  monitoring & connectivity troubleshooting, arrhythmia detection triage &
  notification protocol by severity, physician report generation & turnaround,
  billing period rules (30-day/technical vs professional), device return &
  inventory management, patient non-compliance follow-up, alarm fatigue &
  triage staffing

domain_name: remote-cardiac-monitoring
api_prefix: /v1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on MonitoringOrder.version for enrollment create-with-supersede
    - cascading_side_effects        # sweep/alert cascades spanning 3-4 entities
    - rate_threshold_triggers       # strikes, SLA deadlines, fatigue index, gap hours
    - derived_field_reconciliation  # transmission_count, open_alert_load, open_compliance_events, billed totals
  entity_topology: flat             # peer entities joined by FK references; sub-resource reads only for reverse lookup
  state_machine_shape: parallel     # MonitoringEpisode carries clinical_status x compliance_status; other machines cyclic/branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # NotificationAttempt.physician_id resolved through episode->enrollment->order chain
  role_model: segregation_of_duties # billing propose vs approve must differ; peer ownership for physician/technician
  consistency_model: immediate      # every side effect visible in the same request's response / subsequent read

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across patients", constraints: "unique" }
      - { name: phone, type: string, source: input, description: "Contact phone used for follow-up calls" }
      - { name: insurance_plan, type: enum, source: input, description: "MEDICARE | COMMERCIAL | SELF_PAY" }
      - { name: open_compliance_events, type: integer, source: computed, default: 0, description: "Count of ComplianceEvent with status OPEN across all episodes of this patient; recomputed on event create/resolve" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician name" }
      - { name: npi, type: string, source: input, description: "10-digit National Provider Identifier; unique", constraints: "unique, exactly 10 digits" }
      - { name: specialty, type: string, source: input, description: "e.g. CARDIOLOGY" }
      - { name: notification_preference, type: enum, source: input, default: PORTAL, description: "PHONE | PORTAL; channel used when a NotificationAttempt is created for this physician" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification_level, type: enum, source: input, description: "CCT | CRAT | RN" }
      - { name: shift_capacity, type: integer, source: input, description: "Max open alerts this tech may hold at once; positive integer" }
      - { name: on_shift, type: boolean, source: input, default: true, description: "Eligibility flag for alert acknowledgement" }
      - { name: open_alert_load, type: integer, source: computed, default: 0, description: "Count of ArrhythmiaAlert assigned to this tech in status ACKNOWLEDGED/TRIAGED/ESCALATED/NOTIFIED (not NEW, not CLOSED)" }
      - { name: alerts_acknowledged_total, type: integer, source: computed, default: 0, description: "Lifetime count of acknowledge actions performed by this tech; never decremented" }
      - { name: fatigue_index, type: number, source: computed, default: 0, description: "load_ratio variant: round_half_up(open_alert_load / shift_capacity, 2)" }
      - { name: throughput_index, type: number, source: computed, default: 0, description: "throughput variant: round_half_up((alerts_acknowledged_total + open_alert_load) / (shift_capacity * max(1, full days between created_at and now)), 2)" }
      - { name: fatigue_status, type: enum, source: computed, default: NORMAL, description: "NORMAL | AT_RISK | FATIGUED from fatigue_index thresholds 0.60 / 0.80" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique", constraints: "unique" }
      - { name: model, type: enum, source: input, description: "HOLTER | EVENT | IMPLANTABLE; must equal MonitoringOrder.monitor_type at enrollment" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | RESERVED | DEPLOYED | RETURN_IN_TRANSIT | REFURBISHING | LOST (see state machine)" }
      - { name: refurbishment_due_at, type: datetime, source: system, description: "Set when entering REFURBISHING: received_at + 48h; reservation eligible when IN_STOCK or (REFURBISHING and refurbishment_due_at <= now)" }

  - name: MonitoringOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient to be monitored" }
      - { name: ordering_physician_id, type: string, source: system, description: "FK -> Physician.id; taken from X-User-ID of the creating Physician" }
      - { name: monitor_type, type: enum, source: input, description: "HOLTER | EVENT | IMPLANTABLE" }
      - { name: prescribed_days, type: integer, source: input, description: "Monitoring length in days; 5..45 inclusive", constraints: "5 <= prescribed_days <= 45" }
      - { name: indication_codes, type: array, source: input, description: "Optional list of ICD-10 indication codes", default: [] }
      - { name: status, type: enum, source: system, description: "OPEN | IN_SERVICE | FULFILLED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> MonitoringOrder.id; from the enrollment-create path" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device reserved for this enrollment (replaced on retry)" }
      - { name: education_completed, type: boolean, source: system, default: false, description: "Set true by complete-education; retained across retry" }
      - { name: education_method, type: enum, source: input, description: "IN_PERSON | PHONE | VIDEO; recorded by complete-education" }
      - { name: status, type: enum, source: system, description: "INITIATED | EDUCATED | ACTIVATION_FAILED | ACTIVATED | ABORTED" }
      - { name: attempts_count, type: integer, source: system, default: 0, description: "Increments on each activation attempt that fails the baseline signal check" }
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; set on successful activation (null before)", default: null }

  - name: MonitoringEpisode
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; 1:1 with the activating enrollment" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the order for query isolation" }
      - { name: monitor_type, type: enum, source: system, description: "Copied from the order: HOLTER | EVENT | IMPLANTABLE" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock at activation" }
      - { name: scheduled_end_at, type: datetime, source: system, description: "started_at + prescribed_days" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion (null while monitoring)", default: null }
      - { name: clinical_status, type: enum, source: system, description: "MONITORING | COMPLETED | TERMINATED_EARLY (parallel dimension 1)" }
      - { name: compliance_status, type: enum, source: system, description: "COMPLIANT | WATCH | SUSPENDED (parallel dimension 2, driven by strikes)" }
      - { name: strike_count, type: integer, source: system, default: 0, description: "Increments on ComplianceEvent creation; reset to 0 on resume" }
      - { name: transmission_count, type: integer, source: computed, default: 0, description: "Count of Transmission in PROCESSED status for this episode" }
      - { name: unacknowledged_critical_count, type: integer, source: computed, default: 0, description: "Count of CRITICAL alerts on this episode not in CLOSED status" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "Sum of submitted_total_cents over BillingPeriods of this episode" }

  - name: SuspensionInterval
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id" }
      - { name: started_at, type: datetime, source: system, description: "Clock when compliance_status flipped to SUSPENDED" }
      - { name: ended_at, type: datetime, source: system, description: "Clock when resume closed the interval (null while suspended)", default: null }

  - name: Transmission
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; from the ingest path" }
      - { name: seq_no, type: integer, source: input, description: "Device sequence number; unique within the episode", constraints: "unique per episode_id" }
      - { name: bytes_received, type: integer, source: input, description: "Payload size; positive integer" }
      - { name: signal_quality, type: integer, source: input, description: "0..100; >= 30 processes, < 30 fails" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at ingest" }
      - { name: status, type: enum, source: system, description: "PROCESSED | FAILED" }

  - name: ArrhythmiaAlert
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; from the raise path" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | URGENT | ROUTINE; may be reclassified at triage" }
      - { name: arrhythmia_type, type: string, source: input, description: "e.g. AFIB, VTACH, PAUSE" }
      - { name: detected_at, type: datetime, source: system, description: "Logical clock at raise" }
      - { name: sla_deadline, type: datetime, source: computed, description: "BUSINESS_HOURS variant of notification_sla over (severity, detected_at)" }
      - { name: status, type: enum, source: system, description: "NEW | ACKNOWLEDGED | TRIAGED | ESCALATED | NOTIFIED | CLOSED" }
      - { name: assigned_technician_id, type: string, source: system, description: "FK -> Technician.id; set on acknowledge, cleared on release", default: null }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Clock at latest acknowledge" }
      - { name: closed_outcome, type: enum, source: system, default: null, description: "FALSE_POSITIVE | RESOLVED; set on close" }
      - { name: notification_attempt_count, type: integer, source: computed, default: 0, description: "Count of NotificationAttempt rows for this alert" }

  - name: NotificationAttempt
    parent: null
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: system, description: "FK -> ArrhythmiaAlert.id" }
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; ordering physician resolved via episode.enrollment.order.ordering_physician_id" }
      - { name: channel, type: enum, source: system, description: "PHONE | PORTAL from physician preference, or ESCALATION when created by an escalate transition" }
      - { name: attempted_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | ACKNOWLEDGED" }
      - { name: within_sla, type: boolean, source: computed, default: null, description: "Set at acknowledge: acknowledged_at <= alert.sla_deadline" }

  - name: DiagnosticReport
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; from the create path" }
      - { name: reading_physician_id, type: string, source: system, description: "FK -> Physician.id; from X-User-ID of the creating Physician" }
      - { name: report_type, type: enum, source: input, description: "INTERIM | FINAL" }
      - { name: findings_summary, type: string, source: input, description: "Free-text findings" }
      - { name: no_significant_findings, type: boolean, source: input, default: false, description: "Required true to finalize a FINAL report when episode transmission_count == 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | AMENDED (cyclic finalize/amend loop)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each amend" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Clock at latest finalize" }
      - { name: turnaround_hours, type: number, source: computed, default: null, description: "FINAL only: hours between episode.completed_at and finalized_at, 2dp round_half_up; null for INTERIM" }
      - { name: sla_met, type: boolean, source: computed, default: null, description: "FINAL only: finalized_at <= episode.completed_at + 72h; null for INTERIM" }

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; from the generate path" }
      - { name: period_index, type: integer, source: system, description: "0-based window index within the episode" }
      - { name: start_date, type: datetime, source: system, description: "Window start: episode.started_at + 30*period_index days (half-open, inclusive)" }
      - { name: end_date, type: datetime, source: system, description: "Window end (exclusive): min(start + 30 days, episode end); adjacency end==next.start is allowed" }
      - { name: window_days, type: integer, source: computed, description: "Whole days in [start_date, end_date)" }
      - { name: billable_days, type: integer, source: computed, default: null, description: "Set at READY: window_days minus whole-day overlap with SuspensionIntervals of the episode" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Set at generate: per-line rounded TC+PC at window_days (no suspension deduction)" }
      - { name: tc_amount_cents, type: integer, source: computed, default: null, description: "Set at READY: round_half_up(TC_FEE * billable_days / 30)" }
      - { name: pc_amount_cents, type: integer, source: computed, default: null, description: "Set at READY: round_half_up(PC_FEE * billable_days / 30)" }
      - { name: total_amount_cents, type: integer, source: computed, default: null, description: "Set at READY: tc_amount_cents + pc_amount_cents (sum of per-line rounded values)" }
      - { name: status, type: enum, source: system, description: "ACCRUING | READY | SUBMITTED | ADJUSTMENT_PROPOSED | ADJUSTED" }
      - { name: submitted_total_cents, type: integer, source: system, default: null, description: "Snapshot of total_amount_cents at submit" }
      - { name: proposed_delta_cents, type: integer, source: input, default: null, description: "Signed delta pending approval" }
      - { name: proposed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the proposer (segregation anchor)" }
      - { name: approved_adjustment_cents, type: integer, source: system, default: 0, description: "Sum of approved deltas" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the latest approver; must differ from proposed_by_user_id" }
      - { name: recognized_total_cents, type: integer, source: computed, default: null, description: "submitted_total_cents + approved_adjustment_cents (invariant anchor)" }

  - name: ReturnShipment
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id; from the create path" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; device deployed on the episode's enrollment" }
      - { name: label_created_at, type: datetime, source: system, description: "Clock at creation" }
      - { name: due_at, type: datetime, source: system, description: "label_created_at + 10 days; OVERDUE when now > due_at (strictly greater)" }
      - { name: received_at, type: datetime, source: system, default: null, description: "Clock at mark-received" }
      - { name: status, type: enum, source: system, description: "LABEL_CREATED | OVERDUE | RECEIVED | LOST; LOST when now > due_at + 20 days" }

  - name: ComplianceEvent
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> MonitoringEpisode.id" }
      - { name: event_type, type: enum, source: system, description: "TRANSMISSION_GAP | RETURN_OVERDUE" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolution_action, type: enum, source: input, default: null, description: "CONTACTED_PATIENT | DEVICE_REPLACED | PHYSICIAN_NOTIFIED; set on resolve" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Device
    field: status
    initial_state: IN_STOCK
    terminal_states: [LOST]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /v1/monitoring-orders/{order_id}/enrollments or POST /v1/enrollments/{id}/retry"
        actor: EnrollmentCoordinator
        preconditions:
          - "Device status IN_STOCK, or REFURBISHING with refurbishment_due_at <= now"
          - "device.model == order.monitor_type"
        side_effects: ["Device reserved for the enrollment"]
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /v1/enrollments/{id}/activate (baseline_signal_quality >= 40)"
        actor: EnrollmentCoordinator
        preconditions: ["Enrollment EDUCATED", "Device RESERVED for this enrollment"]
        side_effects: ["MonitoringEpisode created", "MonitoringOrder OPEN -> IN_SERVICE"]
      - from: RESERVED
        to: REFURBISHING
        trigger: "POST /v1/enrollments/{id}/activate (baseline_signal_quality < 40)"
        actor: EnrollmentCoordinator
        preconditions: ["Enrollment EDUCATED"]
        side_effects: ["refurbishment_due_at = now + 48h", "Enrollment -> ACTIVATION_FAILED", "attempts_count += 1"]
      - from: RESERVED
        to: IN_STOCK
        trigger: "POST /v1/enrollments/{id}/abort, or supersede on enrollment create, or order cancel cascade"
        actor: EnrollmentCoordinator | Physician
        preconditions: []
        side_effects: ["Device released back to stock"]
      - from: DEPLOYED
        to: RETURN_IN_TRANSIT
        trigger: "POST /v1/episodes/{episode_id}/return-shipments"
        actor: InventoryManager
        preconditions: ["Episode clinical_status in {COMPLETED, TERMINATED_EARLY}"]
        side_effects: ["ReturnShipment created with due_at = now + 10 days"]
      - from: RETURN_IN_TRANSIT
        to: REFURBISHING
        trigger: "POST /v1/return-shipments/{id}/mark-received"
        actor: InventoryManager
        preconditions: ["Shipment in LABEL_CREATED or OVERDUE"]
        side_effects: ["refurbishment_due_at = received_at + 48h"]
      - from: RETURN_IN_TRANSIT
        to: LOST
        trigger: "system (daily sweep: now > shipment.due_at + 20 days)"
        actor: system
        preconditions: ["Shipment OVERDUE in a prior sweep"]
        side_effects: ["Shipment OVERDUE -> LOST"]
      - from: REFURBISHING
        to: IN_STOCK
        trigger: "system (daily sweep: refurbishment_due_at <= now)"
        actor: system
        preconditions: []
        side_effects: ["Device reservable again"]

  - entity: MonitoringOrder
    field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_SERVICE
        trigger: "POST /v1/enrollments/{id}/activate"
        actor: EnrollmentCoordinator
        preconditions: []
        side_effects: ["Bumps order.version implicitly via mutation"]
      - from: IN_SERVICE
        to: FULFILLED
        trigger: "system (episode completion bubbles up)"
        actor: system
        preconditions: ["Linked episode clinical_status becomes COMPLETED or TERMINATED_EARLY"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /v1/monitoring-orders/{id}/cancel"
        actor: Physician
        preconditions: ["Caller is the ordering physician", "Order still OPEN (IN_SERVICE orders must complete the episode first)"]
        side_effects:
          - "All non-terminal Enrollments (INITIATED/EDUCATED/ACTIVATION_FAILED) -> ABORTED"
          - "Their RESERVED devices -> IN_STOCK"

  - entity: Enrollment
    field: status
    initial_state: INITIATED
    terminal_states: [ACTIVATED, ABORTED]
    transitions:
      - from: INITIATED
        to: EDUCATED
        trigger: "POST /v1/enrollments/{id}/complete-education"
        actor: EnrollmentCoordinator
        preconditions: []
        side_effects: ["education_completed = true"]
      - from: EDUCATED
        to: ACTIVATED
        trigger: "POST /v1/enrollments/{id}/activate (baseline_signal_quality >= 40)"
        actor: EnrollmentCoordinator
        preconditions:
          - "Device RESERVED for this enrollment"
          - "No other episode of the same patient in clinical_status MONITORING"
        side_effects:
          - "MonitoringEpisode created (started_at = now, scheduled_end_at = now + prescribed_days)"
          - "episode_id set on enrollment"
          - "Device -> DEPLOYED; Order -> IN_SERVICE"
      - from: EDUCATED
        to: ACTIVATION_FAILED
        trigger: "POST /v1/enrollments/{id}/activate (baseline_signal_quality < 40)"
        actor: EnrollmentCoordinator
        preconditions: ["Device RESERVED for this enrollment"]
        side_effects: ["Device -> REFURBISHING (due now + 48h)", "attempts_count += 1"]
      - from: ACTIVATION_FAILED
        to: INITIATED
        trigger: "POST /v1/enrollments/{id}/retry (new device_id)"
        actor: EnrollmentCoordinator
        preconditions: ["New device eligible (stock/buffer/category)"]
        side_effects: ["New device -> RESERVED", "education_completed retained"]
      - from: [INITIATED, EDUCATED, ACTIVATION_FAILED]
        to: ABORTED
        trigger: "POST /v1/enrollments/{id}/abort, order cancel cascade, or supersede by newer enrollment create"
        actor: EnrollmentCoordinator | Physician | system
        preconditions: []
        side_effects: ["RESERVED device -> IN_STOCK"]

  - entity: MonitoringEpisode
    field: clinical_status
    initial_state: MONITORING
    terminal_states: [COMPLETED, TERMINATED_EARLY]
    note: "Parallel dimension 1; evolves independently of compliance_status"
    transitions:
      - from: MONITORING
        to: COMPLETED
        trigger: "POST /v1/episodes/{id}/complete (reason=COMPLETED)"
        actor: EnrollmentCoordinator
        preconditions: ["Zero ComplianceEvent with status OPEN on this episode"]
        side_effects: ["completed_at = now", "Order IN_SERVICE -> FULFILLED"]
      - from: MONITORING
        to: TERMINATED_EARLY
        trigger: "POST /v1/episodes/{id}/complete (reason=TERMINATED_EARLY)"
        actor: EnrollmentCoordinator
        preconditions: ["Zero ComplianceEvent with status OPEN on this episode"]
        side_effects: ["completed_at = now", "Order IN_SERVICE -> FULFILLED"]

  - entity: MonitoringEpisode
    field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    note: "Parallel dimension 2; driven by strike_count thresholds; independent of clinical_status (including after clinical terminal, strikes may still record but mapping applies only while MONITORING)"
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "system (strike_count becomes 1 or 2 on ComplianceEvent creation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: SUSPENDED
        trigger: "system (strike_count >= 3)"
        actor: system
        preconditions: []
        side_effects: ["SuspensionInterval opened (started_at = now, ended_at null)"]
      - from: COMPLIANT
        to: SUSPENDED
        trigger: "system (strike_count jumps to >= 3)"
        actor: system
        preconditions: []
        side_effects: ["SuspensionInterval opened"]
      - from: SUSPENDED
        to: COMPLIANT
        trigger: "POST /v1/episodes/{id}/resume"
        actor: EnrollmentCoordinator
        preconditions: ["Zero ComplianceEvent with status OPEN on this episode"]
        side_effects: ["Open SuspensionInterval closed (ended_at = now)", "strike_count = 0"]
      - from: WATCH
        to: COMPLIANT
        trigger: "n/a (WATCH persists until suspension or episode terminal; only resume from SUSPENDED resets)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Documented no-op: WATCH never auto-decays"

  - entity: Transmission
    field: status
    initial_state: null
    terminal_states: [PROCESSED]
    note: "Status assigned at ingest by signal_quality; FAILED rows can be reprocessed (cycle FAILED -> PROCESSED)"
    transitions:
      - from: null
        to: PROCESSED
        trigger: "POST /v1/episodes/{id}/transmissions (signal_quality >= 30)"
        actor: DeviceGateway
        preconditions: ["Episode clinical_status MONITORING", "seq_no unique within episode"]
        side_effects: ["episode.transmission_count += 1"]
      - from: null
        to: FAILED
        trigger: "POST /v1/episodes/{id}/transmissions (signal_quality < 30)"
        actor: DeviceGateway
        preconditions: ["Episode clinical_status MONITORING", "seq_no unique within episode"]
        side_effects: []
      - from: FAILED
        to: PROCESSED
        trigger: "POST /v1/transmissions/{id}/reprocess (signal_quality >= 30)"
        actor: MonitoringTechnician
        preconditions: []
        side_effects: ["episode.transmission_count += 1"]

  - entity: ArrhythmiaAlert
    field: status
    initial_state: NEW
    terminal_states: [CLOSED]
    transitions:
      - from: NEW
        to: ACKNOWLEDGED
        trigger: "POST /v1/alerts/{id}/acknowledge"
        actor: MonitoringTechnician
        preconditions:
          - "Caller technician on_shift == true"
          - "open_alert_load < shift_capacity"
          - "fatigue_status != FATIGUED"
        side_effects:
          - "assigned_technician_id = caller; acknowledged_at = now"
          - "Technician.open_alert_load += 1 (cascade link 1)"
          - "Technician.fatigue_index recomputed; fatigue_status may flip NORMAL -> AT_RISK -> FATIGUED (cascade link 2)"
      - from: ACKNOWLEDGED
        to: NEW
        trigger: "POST /v1/alerts/{id}/release"
        actor: MonitoringTechnician
        preconditions: ["Caller == assigned_technician_id"]
        side_effects: ["Technician.open_alert_load -= 1", "assigned_technician_id = null", "fatigue_index recomputed"]
      - from: ACKNOWLEDGED
        to: TRIAGED
        trigger: "POST /v1/alerts/{id}/triage (optional severity_reclass)"
        actor: MonitoringTechnician
        preconditions: ["Caller == assigned_technician_id"]
        side_effects:
          - "If severity_reclass provided: severity updated, sla_deadline recomputed from detected_at with new severity"
          - "episode.unacknowledged_critical_count adjusted on CRITICAL reclass in/out"
      - from: TRIAGED
        to: NOTIFIED
        trigger: "POST /v1/alerts/{id}/notify"
        actor: MonitoringTechnician
        preconditions: ["Caller == assigned_technician_id"]
        side_effects: ["NotificationAttempt created (channel = physician.notification_preference, physician via episode->enrollment->order)", "notification_attempt_count += 1"]
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /v1/alerts/{id}/escalate or system (sweep: sla_deadline < now)"
        actor: MonitoringTechnician | system
        preconditions: []
        side_effects: ["NotificationAttempt created (channel ESCALATION)", "notification_attempt_count += 1"]
      - from: [NEW, ACKNOWLEDGED]
        to: ESCALATED
        trigger: "system (sweep: sla_deadline < now)"
        actor: system
        preconditions: []
        side_effects: ["NotificationAttempt created (channel ESCALATION)"]
      - from: ESCALATED
        to: NOTIFIED
        trigger: "POST /v1/alerts/{id}/notify"
        actor: MonitoringTechnician
        preconditions: []
        side_effects: ["NotificationAttempt created (channel = physician preference)"]
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /v1/alerts/{id}/close (outcome=FALSE_POSITIVE)"
        actor: MonitoringTechnician
        preconditions: ["Caller == assigned_technician_id"]
        side_effects: ["Technician.open_alert_load -= 1", "if CRITICAL: episode.unacknowledged_critical_count -= 1"]
      - from: NOTIFIED
        to: CLOSED
        trigger: "POST /v1/alerts/{id}/close (outcome=RESOLVED)"
        actor: MonitoringTechnician
        preconditions: ["At least one NotificationAttempt in ACKNOWLEDGED status for this alert"]
        side_effects: ["Technician.open_alert_load -= 1", "if CRITICAL: episode.unacknowledged_critical_count -= 1"]

  - entity: NotificationAttempt
    field: status
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /v1/notification-attempts/{id}/acknowledge"
        actor: Physician
        preconditions: ["Caller physician id == attempt.physician_id"]
        side_effects: ["within_sla computed (now <= alert.sla_deadline)"]

  - entity: DiagnosticReport
    field: status
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic: FINALIZED -> AMENDED -> FINALIZED ... revision_count tracks amendments"
    transitions:
      - from: [DRAFT, AMENDED]
        to: FINALIZED
        trigger: "POST /v1/reports/{id}/finalize"
        actor: Physician
        preconditions:
          - "Caller == reading_physician_id"
          - "SAFETY: zero CRITICAL alerts on the episode not in CLOSED status"
          - "REFERENTIAL: report_type FINAL requires episode clinical_status in {COMPLETED, TERMINATED_EARLY}"
          - "CONSTRAINT: FINAL with episode.transmission_count == 0 requires no_significant_findings == true"
        side_effects: ["finalized_at = now", "FINAL: turnaround_hours and sla_met computed"]
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /v1/reports/{id}/amend"
        actor: Physician
        preconditions: ["Caller == reading_physician_id"]
        side_effects: ["revision_count += 1"]

  - entity: BillingPeriod
    field: status
    initial_state: ACCRUING
    terminal_states: []
    note: "Cyclic adjustment loop: SUBMITTED -> ADJUSTMENT_PROPOSED -> ADJUSTED -> ADJUSTMENT_PROPOSED ..."
    transitions:
      - from: ACCRUING
        to: READY
        trigger: "system (sweep: end_date <= now)"
        actor: system
        preconditions: []
        side_effects: ["billable_days computed (window_days minus suspension overlap days)", "tc/pc/total amounts computed per-line rounded"]
      - from: READY
        to: SUBMITTED
        trigger: "POST /v1/billing-periods/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Episode has at least one DiagnosticReport in FINALIZED status"
          - "Episode compliance_status != SUSPENDED"
          - "billable_days >= 10"
        side_effects: ["submitted_total_cents = total_amount_cents", "episode.total_billed_cents += total_amount_cents", "recognized_total_cents = submitted_total_cents"]
      - from: [SUBMITTED, ADJUSTED]
        to: ADJUSTMENT_PROPOSED
        trigger: "POST /v1/billing-periods/{id}/propose-adjustment"
        actor: BillingSpecialist
        preconditions: ["abs(delta_cents) <= submitted_total_cents"]
        side_effects: ["proposed_by_user_id = caller X-User-ID", "proposed_delta_cents = delta_cents"]
      - from: ADJUSTMENT_PROPOSED
        to: ADJUSTED
        trigger: "POST /v1/billing-periods/{id}/approve-adjustment"
        actor: BillingSpecialist
        preconditions: ["Caller X-User-ID != proposed_by_user_id (segregation of duties)"]
        side_effects: ["approved_adjustment_cents += proposed_delta_cents", "recognized_total_cents = submitted_total_cents + approved_adjustment_cents", "approved_by_user_id = caller"]

  - entity: ReturnShipment
    field: status
    initial_state: LABEL_CREATED
    terminal_states: [RECEIVED, LOST]
    note: "Each sweep applies at most one transition per shipment (OVERDUE first, LOST on a later sweep)"
    transitions:
      - from: LABEL_CREATED
        to: OVERDUE
        trigger: "system (sweep: now > due_at, strictly greater)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(RETURN_OVERDUE) created (cascade link 1)"
          - "episode.strike_count += 1; compliance mapping re-evaluated while episode MONITORING (cascade link 2)"
          - "if strike_count crosses >= 3: compliance_status -> SUSPENDED and SuspensionInterval opened (cascade link 3)"
      - from: [LABEL_CREATED, OVERDUE]
        to: RECEIVED
        trigger: "POST /v1/return-shipments/{id}/mark-received"
        actor: InventoryManager
        preconditions: []
        side_effects: ["received_at = now", "Device RETURN_IN_TRANSIT -> REFURBISHING (due now + 48h)"]
      - from: OVERDUE
        to: LOST
        trigger: "system (sweep: now > due_at + 20 days)"
        actor: system
        preconditions: []
        side_effects: ["Device RETURN_IN_TRANSIT -> LOST"]

  - entity: ComplianceEvent
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /v1/compliance-events/{id}/resolve"
        actor: EnrollmentCoordinator
        preconditions: []
        side_effects: ["resolution_action recorded", "patient.open_compliance_events -= 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-order
    parent_entity: MonitoringOrder
    write_endpoint: "POST /v1/monitoring-orders/{order_id}/enrollments"
    occ_field: expected_order_version
    description: |
      Creating an Enrollment against a MonitoringOrder whose version has
      advanced since the client last observed it is rejected. Creating an
      enrollment legitimately supersedes any prior non-terminal enrollment of
      the same order (prior INITIATED/EDUCATED/ACTIVATION_FAILED -> ABORTED,
      their RESERVED devices released), so a writer holding a stale version
      would supersede a record it never saw; the stale version therefore fails
      with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billing_period_windows
    trigger: "POST /v1/episodes/{episode_id}/billing-periods/generate"
    algorithm: interval_merge
    formula: |
      end_of_service = episode.completed_at if set else episode.scheduled_end_at
      window i: start_i = started_at + 30*i days; end_i = min(start_i + 30 days, end_of_service)
      generate all windows with start_i < end_of_service; half-open [start, end):
      overlap(a,b) iff a.start < b.end AND b.start < a.end; adjacency (a.end == b.start) is NOT overlap
      rejected if any existing BillingPeriod of the episode in {ACCRUING, READY, SUBMITTED, ADJUSTMENT_PROPOSED} overlaps the range
    input_set: "All BillingPeriod rows of the episode in non-terminal statuses"
    precision: "whole days; datetimes exact"
    constants:
      WINDOW_DAYS: 30

  - name: billable_days
    trigger: "system sweep when BillingPeriod ACCRUING -> READY"
    algorithm: chronological
    formula: |
      billable_days = window_days - whole_days_overlap([start_date, end_date), union of SuspensionIntervals [started_at, ended_at or now))
      overlap measured in whole 24h days intersected with the window
    input_set: "SuspensionIntervals of the episode (open intervals use sweep now as provisional end)"
    precision: "integer days"

  - name: billing_amounts
    trigger: "generate (PROVISIONAL variant) and sweep READY transition (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      TC_line = round_half_up(TC_FEE_cents[monitor_type] * days / 30, 0 decimals)
      PC_line = round_half_up(PC_FEE_cents[monitor_type] * days / 30, 0 decimals)
      total   = TC_line + PC_line        # PINNED ORDER: round each line first, then sum
    input_set: "days = window_days (PROVISIONAL) or billable_days (FINAL)"
    constants:
      TC_FEE_EVENT: 54915
      PC_FEE_EVENT: 5205
      TC_FEE_HOLTER: 18075
      PC_FEE_HOLTER: 2425
      TC_FEE_IMPLANTABLE: 90000
      PC_FEE_IMPLANTABLE: 12000
      MIN_BILLABLE_DAYS: 10
    precision: "integer cents, round_half_up per line before summing"
    variants:
      - name: PROVISIONAL
        when: "at generate time"
        difference: "days = window_days, suspensions ignored; stored as provisional_total_cents"
      - name: FINAL
        when: "at READY transition"
        difference: "days = billable_days (suspension-adjusted); stored as tc/pc/total_amount_cents"

  - name: compliance_strike_mapping
    trigger: "ComplianceEvent creation and episode resume"
    algorithm: threshold
    formula: |
      strike_count == 0            -> COMPLIANT
      1 <= strike_count <= 2       -> WATCH
      strike_count >= 3            -> SUSPENDED (boundary: exactly 3 suspends)
      mapping applies only while clinical_status == MONITORING
    input_set: "ComplianceEvent creations of strike-bearing types TRANSMISSION_GAP and RETURN_OVERDUE"
    precision: "integer strikes"

  - name: notification_sla
    trigger: "alert raise and severity reclassification at triage"
    algorithm: threshold
    formula: |
      business hours: 08:00 <= t < 20:00 UTC, every day
      base_minutes: CRITICAL=15, URGENT=60, ROUTINE=1440
      CRITICAL: deadline = detected_at + 15min (always, hours-independent)
      URGENT:   in-hours -> detected_at + 60min; out-of-hours -> next 08:00 + 30min
      ROUTINE:  in-hours -> detected_at + 1440min; out-of-hours -> next 08:00 + 120min
    input_set: "severity, detected_at"
    precision: "minute granularity, ISO8601 UTC"
    variants:
      - name: BUSINESS_HOURS
        when: "system-pinned variant used for sla_deadline"
        difference: "applies business-hours adjustment as specified"
      - name: WALL_CLOCK
        when: "documented alternative interpretation"
        difference: "deadline = detected_at + base_minutes regardless of hour; NOT stored"

  - name: alarm_fatigue_index
    trigger: "acknowledge, release, close, escalate (any open_alert_load change) and on read"
    algorithm: weighted_scoring
    formula: |
      LOAD_RATIO  = round_half_up(open_alert_load / shift_capacity, 2)
      THROUGHPUT  = round_half_up((alerts_acknowledged_total + open_alert_load) / (shift_capacity * max(1, full_days_between(created_at, now))), 2)
      fatigue_status (LOAD_RATIO, pinned for gating):
        >= 0.80 FATIGUED; >= 0.60 AT_RISK; else NORMAL
      throughput_index stored for analytics only
    input_set: "Technician.open_alert_load, alerts_acknowledged_total, shift_capacity, created_at"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: LOAD_RATIO
        when: "gates acknowledge eligibility (FATIGUED blocks)"
        difference: "instantaneous open-load ratio"
      - name: THROUGHPUT
        when: "analytics field throughput_index"
        difference: "cumulative handled-per-capacity-day ratio; same row, different denominator"

  - name: report_turnaround
    trigger: "finalize of a FINAL DiagnosticReport"
    algorithm: threshold
    formula: |
      turnaround_hours = round_half_up((finalized_at - episode.completed_at) in hours, 2)
      sla_met = finalized_at <= episode.completed_at + 72h   (exactly 72h -> true)
    input_set: "FINAL reports only; INTERIM -> both fields null"
    constants:
      FINAL_SLA_HOURS: 72
    precision: "2 decimal places, round_half_up"

  - name: transmission_gap_detection
    trigger: "system sweep"
    algorithm: chronological
    formula: |
      for each episode with clinical_status == MONITORING:
        base = max(episode.started_at, last PROCESSED transmission.received_at, last TRANSMISSION_GAP ComplianceEvent.created_at) over existing rows (missing terms skipped)
        if (now - base) >= 48h AND no OPEN TRANSMISSION_GAP event exists for the episode:
          create ComplianceEvent(TRANSMISSION_GAP) -> strike cascade
    input_set: "MONITORING episodes, their PROCESSED transmissions and TRANSMISSION_GAP events"
    constants:
      GAP_HOURS: 48
    precision: "minute granularity; boundary >= 48h triggers, 47h59m does not"

  - name: inventory_availability
    trigger: "any Device status transition; surfaced on reads"
    algorithm: aggregation
    formula: |
      per model: total_units = count(rows); available = count(status IN_STOCK)
      pool conservation: count(IN_STOCK)+count(RESERVED)+count(DEPLOYED)+count(RETURN_IN_TRANSIT)+count(REFURBISHING)+count(LOST) == total registered (constant per registered fleet)
    input_set: "all Device rows"
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for endpoint; entity-backed ownership (order cancel/finalize/amend/notification-ack caller identity)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right", error_id: ERR_PATIENT_NOT_FOUND, http_status: 404, applies_to: "endpoints under /patients/{id}" }
  - { priority: 3, category: existence, check: "Device exists", error_id: ERR_DEVICE_NOT_FOUND, http_status: 404, applies_to: "device path/body references" }
  - { priority: 3, category: existence, check: "Order exists", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "order-scoped endpoints" }
  - { priority: 3, category: existence, check: "Episode exists", error_id: ERR_EPISODE_NOT_FOUND, http_status: 404, applies_to: "episode-scoped endpoints" }
  - { priority: 3, category: existence, check: "Alert exists", error_id: ERR_ALERT_NOT_FOUND, http_status: 404, applies_to: "alert-scoped endpoints" }
  - { priority: 3, category: existence, check: "Enrollment/report/billing-period/shipment/compliance-event/technician/notification/physician exists", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "remaining id-addressed endpoints" }
  - { priority: 4, category: existence, check: "Required input fields present; enums/ranges valid (prescribed_days 5..45, signal_quality 0..100, limit 1..100)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutating endpoints and list endpoints" }
  - { priority: 5, category: state, check: "State-machine from-state and preconditions hold (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Enrollment create/retry: device in RESERVED/DEPLOYED/RETURN_IN_TRANSIT/LOST when reservation attempted (REFURBISHING passes through to the temporal buffer check)", error_id: ERR_DEVICE_NOT_IN_STOCK, http_status: 409, applies_to: "POST /v1/monitoring-orders/{id}/enrollments, POST /v1/enrollments/{id}/retry" }
  - { priority: 5, category: state, check: "Activate requires EDUCATED", error_id: ERR_EDUCATION_INCOMPLETE, http_status: 422, applies_to: "POST /v1/enrollments/{id}/activate" }
  - { priority: 5, category: state, check: "OCC: expected_order_version matches current MonitoringOrder.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /v1/monitoring-orders/{id}/enrollments" }
  - { priority: 6, category: business_safety, check: "Finalize blocked while any CRITICAL alert on the episode is not CLOSED", error_id: ERR_CRITICAL_ALERTS_OPEN, http_status: 422, applies_to: "POST /v1/reports/{id}/finalize" }
  - { priority: 6, category: business_safety, check: "Acknowledge blocked when technician off-shift, at capacity, or FATIGUED", error_id: ERR_TECHNICIAN_UNAVAILABLE, http_status: 422, applies_to: "POST /v1/alerts/{id}/acknowledge" }
  - { priority: 7, category: business_temporal, check: "Activate: no other episode of same patient in MONITORING", error_id: ERR_ACTIVE_EPISODE_EXISTS, http_status: 409, applies_to: "POST /v1/enrollments/{id}/activate" }
  - { priority: 7, category: business_temporal, check: "Enrollment create/retry: REFURBISHING device whose 48h buffer has not elapsed", error_id: ERR_DEVICE_NOT_REFURBISHED, http_status: 409, applies_to: "POST /v1/monitoring-orders/{id}/enrollments, POST /v1/enrollments/{id}/retry" }
  - { priority: 7, category: business_temporal, check: "Billing generate: half-open window overlap with non-terminal periods", error_id: ERR_BILLING_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /v1/episodes/{id}/billing-periods/generate" }
  - { priority: 8, category: business_referential, check: "FINAL finalize requires episode clinical terminal", error_id: ERR_EPISODE_NOT_COMPLETED, http_status: 422, applies_to: "POST /v1/reports/{id}/finalize" }
  - { priority: 8, category: business_referential, check: "Billing submit requires a FINALIZED report on the episode", error_id: ERR_REPORT_NOT_FINALIZED, http_status: 422, applies_to: "POST /v1/billing-periods/{id}/submit" }
  - { priority: 8, category: business_referential, check: "Episode complete/resume requires zero OPEN compliance events", error_id: ERR_OPEN_COMPLIANCE_EVENTS, http_status: 422, applies_to: "POST /v1/episodes/{id}/complete, POST /v1/episodes/{id}/resume" }
  - { priority: 8, category: business_referential, check: "Close as RESOLVED requires an ACKNOWLEDGED notification attempt", error_id: ERR_NOTIFICATION_NOT_ACKNOWLEDGED, http_status: 422, applies_to: "POST /v1/alerts/{id}/close" }
  - { priority: 9, category: business_constraint, check: "mrn unique", error_id: ERR_DUPLICATE_MRN, http_status: 409, applies_to: "POST /v1/patients" }
  - { priority: 9, category: business_constraint, check: "npi unique", error_id: ERR_DUPLICATE_NPI, http_status: 409, applies_to: "POST /v1/physicians" }
  - { priority: 9, category: business_constraint, check: "serial_number unique", error_id: ERR_DUPLICATE_SERIAL, http_status: 409, applies_to: "POST /v1/devices" }
  - { priority: 9, category: business_constraint, check: "seq_no unique within episode", error_id: ERR_DUPLICATE_TRANSMISSION_SEQ, http_status: 409, applies_to: "POST /v1/episodes/{id}/transmissions" }
  - { priority: 9, category: business_constraint, check: "device.model == order.monitor_type", error_id: ERR_DEVICE_CATEGORY_MISMATCH, http_status: 422, applies_to: "POST /v1/monitoring-orders/{id}/enrollments, POST /v1/enrollments/{id}/retry" }
  - { priority: 9, category: business_constraint, check: "FINAL finalize with transmission_count == 0 requires no_significant_findings true", error_id: ERR_EMPTY_MONITORING_DATA, http_status: 422, applies_to: "POST /v1/reports/{id}/finalize" }
  - { priority: 10, category: business_fiscal, check: "Billing submit blocked while episode SUSPENDED", error_id: ERR_EPISODE_SUSPENDED, http_status: 422, applies_to: "POST /v1/billing-periods/{id}/submit" }
  - { priority: 10, category: business_fiscal, check: "billable_days >= 10 to submit", error_id: ERR_BELOW_MINIMUM_BILLABLE_DAYS, http_status: 422, applies_to: "POST /v1/billing-periods/{id}/submit" }
  - { priority: 10, category: business_fiscal, check: "abs(delta_cents) <= submitted_total_cents", error_id: ERR_ADJUSTMENT_EXCEEDS_BILLED, http_status: 422, applies_to: "POST /v1/billing-periods/{id}/propose-adjustment" }
  - { priority: 2, category: auth, check: "Segregation: approve caller != proposed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /v1/billing-periods/{id}/approve-adjustment" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/v1/patients", description: "Register a patient", roles: [EnrollmentCoordinator], code: 201, input: [full_name, date_of_birth, mrn, phone, insurance_plan], output: Patient, side_effects: ["open_compliance_events = 0"] }
  - { method: GET, path: "/v1/patients/{patient_id}", description: "Read patient incl. derived open_compliance_events", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: Patient, side_effects: [] }

  - { method: POST, path: "/v1/physicians", description: "Register a physician", roles: [PlatformAdmin], code: 201, input: [full_name, npi, specialty, "notification_preference?"], output: Physician, side_effects: [] }
  - { method: GET, path: "/v1/physicians/{physician_id}", description: "Read physician", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: Physician, side_effects: [] }

  - { method: POST, path: "/v1/technicians", description: "Register a triage technician", roles: [PlatformAdmin], code: 201, input: [full_name, certification_level, shift_capacity, "on_shift?"], output: Technician, side_effects: ["counters zeroed, fatigue_status NORMAL"] }
  - { method: GET, path: "/v1/technicians/{technician_id}", description: "Read technician incl. load/fatigue fields", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: Technician, side_effects: [] }

  - { method: POST, path: "/v1/devices", description: "Register a device into inventory", roles: [InventoryManager], code: 201, input: [serial_number, model], output: Device, side_effects: ["status IN_STOCK"] }
  - { method: GET, path: "/v1/devices/{device_id}", description: "Read device", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: Device, side_effects: [] }
  - { method: GET, path: "/v1/devices", description: "List devices (filters: status?, model?; pagination in meta)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["status?", "model?", "limit?", "offset?"], output: "Device[]", side_effects: [] }

  - { method: POST, path: "/v1/monitoring-orders", description: "Physician creates an order (ordering_physician_id from X-User-ID)", roles: [Physician], code: 201, input: [patient_id, monitor_type, prescribed_days, "indication_codes?"], output: MonitoringOrder, side_effects: ["status OPEN, version 1"] }
  - { method: GET, path: "/v1/monitoring-orders/{order_id}", description: "Read order", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: MonitoringOrder, side_effects: [] }
  - { method: GET, path: "/v1/monitoring-orders", description: "List orders (filters: patient_id?, ordering_physician_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["patient_id?", "ordering_physician_id?", "status?", "limit?", "offset?"], output: "MonitoringOrder[]", side_effects: [] }
  - { method: POST, path: "/v1/monitoring-orders/{order_id}/cancel", description: "Ordering physician cancels an OPEN order; cascades abort to non-terminal enrollments and releases RESERVED devices", roles: [Physician], code: 200, input: [], output: MonitoringOrder, side_effects: ["enrollments ABORTED", "devices IN_STOCK", "version += 1"] }

  - { method: POST, path: "/v1/monitoring-orders/{order_id}/enrollments", description: "Create enrollment, reserve device, supersede prior non-terminal enrollments (OCC on order version)", roles: [EnrollmentCoordinator], code: 201, input: [device_id, expected_order_version], output: Enrollment, side_effects: ["device -> RESERVED", "order.version += 1", "prior non-terminal enrollments -> ABORTED with device release"] }
  - { method: GET, path: "/v1/enrollments", description: "List enrollments (filters: order_id?, device_id?, episode_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["order_id?", "device_id?", "episode_id?", "status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/v1/enrollments/{enrollment_id}", description: "Read enrollment", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/v1/enrollments/{enrollment_id}/complete-education", description: "Record patient education", roles: [EnrollmentCoordinator], code: 200, input: [education_method], output: Enrollment, side_effects: ["status EDUCATED, education_completed true"] }
  - { method: POST, path: "/v1/enrollments/{enrollment_id}/activate", description: "Activate monitoring: baseline signal check, create episode, deploy device", roles: [EnrollmentCoordinator], code: 200, input: [baseline_signal_quality], output: Enrollment, side_effects: ["episode created with episode_id on enrollment", "device DEPLOYED or REFURBISHING", "order IN_SERVICE"] }
  - { method: POST, path: "/v1/enrollments/{enrollment_id}/retry", description: "Retry failed activation with a replacement device", roles: [EnrollmentCoordinator], code: 200, input: [device_id], output: Enrollment, side_effects: ["status INITIATED", "new device RESERVED"] }
  - { method: POST, path: "/v1/enrollments/{enrollment_id}/abort", description: "Abort a non-terminal enrollment; releases RESERVED device", roles: [EnrollmentCoordinator], code: 200, input: [], output: Enrollment, side_effects: ["status ABORTED", "device IN_STOCK if RESERVED"] }

  - { method: GET, path: "/v1/episodes", description: "List episodes (filters: enrollment_id?, patient_id?, clinical_status?, compliance_status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["enrollment_id?", "patient_id?", "clinical_status?", "compliance_status?", "limit?", "offset?"], output: "MonitoringEpisode[]", side_effects: [] }
  - { method: GET, path: "/v1/episodes/{episode_id}", description: "Read episode incl. derived counters", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: MonitoringEpisode, side_effects: [] }
  - { method: POST, path: "/v1/episodes/{episode_id}/complete", description: "Complete or terminate an episode (requires zero OPEN compliance events)", roles: [EnrollmentCoordinator], code: 200, input: [reason], output: MonitoringEpisode, side_effects: ["completed_at = now", "order IN_SERVICE -> FULFILLED"] }
  - { method: POST, path: "/v1/episodes/{episode_id}/resume", description: "Resume a SUSPENDED episode after follow-up (requires zero OPEN compliance events)", roles: [EnrollmentCoordinator], code: 200, input: [], output: MonitoringEpisode, side_effects: ["compliance_status COMPLIANT", "strike_count 0", "SuspensionInterval closed"] }
  - { method: GET, path: "/v1/episodes/{id}/suspension-intervals", description: "List suspension intervals of an episode", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "SuspensionInterval[]", side_effects: [] }

  - { method: POST, path: "/v1/episodes/{episode_id}/transmissions", description: "Device gateway ingests a transmission", roles: [DeviceGateway], code: 201, input: [seq_no, bytes_received, signal_quality], output: Transmission, side_effects: ["status PROCESSED if signal_quality >= 30 else FAILED", "transmission_count += 1 when PROCESSED"] }
  - { method: GET, path: "/v1/episodes/{id}/transmissions", description: "List transmissions of an episode", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin, DeviceGateway], code: 200, input: ["status?", "limit?", "offset?"], output: "Transmission[]", side_effects: [] }
  - { method: POST, path: "/v1/transmissions/{transmission_id}/reprocess", description: "Reprocess a FAILED transmission with an updated signal reading", roles: [MonitoringTechnician], code: 200, input: [signal_quality], output: Transmission, side_effects: ["FAILED -> PROCESSED when signal_quality >= 30", "transmission_count += 1"] }

  - { method: POST, path: "/v1/episodes/{episode_id}/alerts", description: "Detection engine raises an arrhythmia alert", roles: [DeviceGateway], code: 201, input: [severity, arrhythmia_type], output: ArrhythmiaAlert, side_effects: ["status NEW", "detected_at = now", "sla_deadline computed (BUSINESS_HOURS variant)", "CRITICAL: unacknowledged_critical_count += 1"] }
  - { method: GET, path: "/v1/alerts", description: "List alerts (filters: episode_id?, assigned_technician_id?, status?, severity?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["episode_id?", "assigned_technician_id?", "status?", "severity?", "limit?", "offset?"], output: "ArrhythmiaAlert[]", side_effects: [] }
  - { method: GET, path: "/v1/alerts/{alert_id}", description: "Read alert", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: ArrhythmiaAlert, side_effects: [] }
  - { method: POST, path: "/v1/alerts/{alert_id}/acknowledge", description: "Technician acknowledges a NEW alert (self-assign)", roles: [MonitoringTechnician], code: 200, input: [], output: ArrhythmiaAlert, side_effects: ["assigned to caller", "open_alert_load += 1", "fatigue recompute"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/release", description: "Assigned technician releases back to NEW", roles: [MonitoringTechnician], code: 200, input: [], output: ArrhythmiaAlert, side_effects: ["open_alert_load -= 1", "assigned_technician_id null"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/triage", description: "Triage an ACKNOWLEDGED alert; optional severity reclassification recomputes sla_deadline", roles: [MonitoringTechnician], code: 200, input: ["severity_reclass?"], output: ArrhythmiaAlert, side_effects: ["status TRIAGED", "sla recompute on reclass"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/notify", description: "Notify the ordering physician; creates NotificationAttempt", roles: [MonitoringTechnician], code: 201, input: [], output: NotificationAttempt, side_effects: ["alert TRIAGED/ESCALATED -> NOTIFIED", "attempt PENDING", "notification_attempt_count += 1"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/escalate", description: "Manually escalate a TRIAGED alert; creates ESCALATION-channel attempt", roles: [MonitoringTechnician], code: 200, input: [], output: ArrhythmiaAlert, side_effects: ["status ESCALATED", "ESCALATION NotificationAttempt created"] }
  - { method: POST, path: "/v1/alerts/{alert_id}/close", description: "Close alert as FALSE_POSITIVE (from ACKNOWLEDGED) or RESOLVED (from NOTIFIED with acknowledged attempt)", roles: [MonitoringTechnician], code: 200, input: [outcome], output: ArrhythmiaAlert, side_effects: ["open_alert_load -= 1", "CRITICAL count -= 1"] }

  - { method: GET, path: "/v1/notification-attempts", description: "List notification attempts (filters: alert_id?, physician_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["alert_id?", "physician_id?", "status?", "limit?", "offset?"], output: "NotificationAttempt[]", side_effects: [] }
  - { method: GET, path: "/v1/notification-attempts/{attempt_id}", description: "Read notification attempt", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: NotificationAttempt, side_effects: [] }
  - { method: POST, path: "/v1/notification-attempts/{attempt_id}/acknowledge", description: "Addressed physician acknowledges receipt", roles: [Physician], code: 200, input: [], output: NotificationAttempt, side_effects: ["status ACKNOWLEDGED", "within_sla computed"] }

  - { method: POST, path: "/v1/episodes/{episode_id}/reports", description: "Reading physician creates a report (reading_physician_id from X-User-ID)", roles: [Physician], code: 201, input: [report_type, findings_summary, "no_significant_findings?"], output: DiagnosticReport, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/v1/reports", description: "List reports (filters: episode_id?, reading_physician_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["episode_id?", "reading_physician_id?", "status?", "limit?", "offset?"], output: "DiagnosticReport[]", side_effects: [] }
  - { method: GET, path: "/v1/reports/{report_id}", description: "Read report", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: DiagnosticReport, side_effects: [] }
  - { method: POST, path: "/v1/reports/{report_id}/finalize", description: "Finalize a DRAFT/AMENDED report (safety, referential, constraint gates; FINAL computes turnaround)", roles: [Physician], code: 200, input: [], output: DiagnosticReport, side_effects: ["status FINALIZED", "finalized_at", "turnaround_hours/sla_met for FINAL"] }
  - { method: POST, path: "/v1/reports/{report_id}/amend", description: "Amend a FINALIZED report (cyclic)", roles: [Physician], code: 200, input: [findings_summary], output: DiagnosticReport, side_effects: ["status AMENDED", "revision_count += 1"] }

  - { method: POST, path: "/v1/episodes/{episode_id}/billing-periods/generate", description: "Generate 30-day half-open billing windows with provisional amounts", roles: [BillingSpecialist], code: 201, input: [], output: "BillingPeriod[]", side_effects: ["windows created ACCRUING", "provisional totals at window_days"] }
  - { method: GET, path: "/v1/billing-periods", description: "List billing periods (filters: episode_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["episode_id?", "status?", "limit?", "offset?"], output: "BillingPeriod[]", side_effects: [] }
  - { method: GET, path: "/v1/billing-periods/{period_id}", description: "Read billing period", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: BillingPeriod, side_effects: [] }
  - { method: POST, path: "/v1/billing-periods/{period_id}/submit", description: "Submit a READY period (report finalized, not suspended, billable_days >= 10)", roles: [BillingSpecialist], code: 200, input: [], output: BillingPeriod, side_effects: ["submitted_total_cents snapshot", "episode.total_billed_cents += total", "recognized = submitted"] }
  - { method: POST, path: "/v1/billing-periods/{period_id}/propose-adjustment", description: "Propose a signed adjustment delta", roles: [BillingSpecialist], code: 200, input: [delta_cents, reason], output: BillingPeriod, side_effects: ["status ADJUSTMENT_PROPOSED", "proposed_by_user_id = caller"] }
  - { method: POST, path: "/v1/billing-periods/{period_id}/approve-adjustment", description: "Approve a proposed adjustment; approver must differ from proposer", roles: [BillingSpecialist], code: 200, input: [], output: BillingPeriod, side_effects: ["status ADJUSTED", "approved_adjustment_cents += delta", "recognized recomputed"] }

  - { method: POST, path: "/v1/episodes/{episode_id}/return-shipments", description: "Create a device return shipment for a terminal episode", roles: [InventoryManager], code: 201, input: [], output: ReturnShipment, side_effects: ["device DEPLOYED -> RETURN_IN_TRANSIT", "due_at = now + 10 days"] }
  - { method: GET, path: "/v1/return-shipments", description: "List return shipments (filters: episode_id?, device_id?, status?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["episode_id?", "device_id?", "status?", "limit?", "offset?"], output: "ReturnShipment[]", side_effects: [] }
  - { method: GET, path: "/v1/return-shipments/{shipment_id}", description: "Read return shipment", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: ReturnShipment, side_effects: [] }
  - { method: POST, path: "/v1/return-shipments/{shipment_id}/mark-received", description: "Receive the returned device", roles: [InventoryManager], code: 200, input: [], output: ReturnShipment, side_effects: ["status RECEIVED", "device REFURBISHING due now + 48h"] }

  - { method: GET, path: "/v1/compliance-events", description: "List compliance events (filters: episode_id?, status?, event_type?)", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: ["episode_id?", "status?", "event_type?", "limit?", "offset?"], output: "ComplianceEvent[]", side_effects: [] }
  - { method: GET, path: "/v1/compliance-events/{event_id}", description: "Read compliance event", roles: [EnrollmentCoordinator, MonitoringTechnician, Physician, BillingSpecialist, InventoryManager, PlatformAdmin], code: 200, input: [], output: ComplianceEvent, side_effects: [] }
  - { method: POST, path: "/v1/compliance-events/{event_id}/resolve", description: "Record non-compliance follow-up resolution", roles: [EnrollmentCoordinator], code: 200, input: [resolution_action], output: ComplianceEvent, side_effects: ["status RESOLVED", "patient.open_compliance_events -= 1"] }

  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock (test-driving). Startup default: 2026-05-01T00:00:00Z; the clock never falls back to wall time", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/v1/_ops/run-daily-sweep", description: "Run the daily sweep in pinned order: (1) refurbishment completion, (2) shipment OVERDUE then LOST staging (max one transition per shipment per sweep), (3) alert SLA escalation, (4) transmission gap detection + strike cascade, (5) billing window READY transition", roles: [PlatformAdmin], code: 200, input: [], output: null, side_effects: ["all five sweep stages applied in order"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership mismatch (order cancel, report finalize/amend, notification acknowledge)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approve-adjustment caller equals proposed_by_user_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad enum, out-of-range value (prescribed_days 5..45, signal_quality 0..100, limit 1..100)" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "Device id does not exist (path or body reference)" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Monitoring order id does not exist" }
  - { id: ERR_EPISODE_NOT_FOUND, http: 404, condition: "Episode id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "Alert id does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Any other addressed resource (enrollment, physician, technician, transmission, notification attempt, report, billing period, shipment, compliance event) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (wrong from-state, terminal lockdown, second shipment open, IN_SERVICE order cancel, etc.)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current MonitoringOrder.version" }
  - { id: ERR_DEVICE_NOT_IN_STOCK, http: 409, condition: "Device RESERVED/DEPLOYED/RETURN_IN_TRANSIT/LOST when a reservation is attempted" }
  - { id: ERR_DEVICE_NOT_REFURBISHED, http: 409, condition: "Device REFURBISHING and refurbishment_due_at > now (48h buffer not elapsed)" }
  - { id: ERR_EDUCATION_INCOMPLETE, http: 422, condition: "activate attempted before complete-education" }
  - { id: ERR_ACTIVE_EPISODE_EXISTS, http: 409, condition: "Patient already has an episode in clinical_status MONITORING at activation" }
  - { id: ERR_BILLING_WINDOW_OVERLAP, http: 409, condition: "generate called while non-terminal billing periods overlap the episode range" }
  - { id: ERR_CRITICAL_ALERTS_OPEN, http: 422, condition: "Report finalize with a CRITICAL alert not CLOSED on the episode" }
  - { id: ERR_EPISODE_NOT_COMPLETED, http: 422, condition: "FINAL report finalize while episode clinical_status is MONITORING" }
  - { id: ERR_REPORT_NOT_FINALIZED, http: 422, condition: "Billing submit without any FINALIZED report on the episode" }
  - { id: ERR_OPEN_COMPLIANCE_EVENTS, http: 422, condition: "Episode complete/resume with OPEN compliance events" }
  - { id: ERR_NOTIFICATION_NOT_ACKNOWLEDGED, http: 422, condition: "Close outcome RESOLVED without an ACKNOWLEDGED notification attempt" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "mrn already registered" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "npi already registered" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already registered" }
  - { id: ERR_DUPLICATE_TRANSMISSION_SEQ, http: 409, condition: "seq_no already used within the episode" }
  - { id: ERR_DEVICE_CATEGORY_MISMATCH, http: 422, condition: "device.model != order.monitor_type" }
  - { id: ERR_EMPTY_MONITORING_DATA, http: 422, condition: "FINAL finalize with transmission_count == 0 and no_significant_findings != true" }
  - { id: ERR_EPISODE_SUSPENDED, http: 422, condition: "Billing submit while episode compliance_status == SUSPENDED" }
  - { id: ERR_BELOW_MINIMUM_BILLABLE_DAYS, http: 422, condition: "billable_days < 10 at submit" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_BILLED, http: 422, condition: "abs(delta_cents) > submitted_total_cents" }
  - { id: ERR_TECHNICIAN_UNAVAILABLE, http: 422, condition: "Acknowledge while off-shift, at shift_capacity, or FATIGUED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator who registers physicians/technicians and drives clock + sweep"
    identity: opaque
    exclusive_operations: ["POST /v1/physicians", "POST /v1/technicians", "POST /v1/_clock/set_current_utc", "POST /v1/_ops/run-daily-sweep"]
    shared_operations: ["all GET endpoints"]
  - name: EnrollmentCoordinator
    description: "IDTF staff: patient registration, enrollment, education, episode completion/resume, compliance follow-up"
    identity: opaque
    exclusive_operations: ["POST /v1/patients", "POST /v1/monitoring-orders/{id}/enrollments", "POST /v1/enrollments/{id}/complete-education", "POST /v1/enrollments/{id}/activate", "POST /v1/enrollments/{id}/retry", "POST /v1/enrollments/{id}/abort", "POST /v1/episodes/{id}/complete", "POST /v1/episodes/{id}/resume", "POST /v1/compliance-events/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: Physician
    description: "Ordering/reading physician; X-User-ID equals a Physician.id"
    identity: "entity_backed:Physician"
    exclusive_operations: ["POST /v1/monitoring-orders", "POST /v1/monitoring-orders/{id}/cancel (own orders)", "POST /v1/episodes/{id}/reports", "POST /v1/reports/{id}/finalize (own reports)", "POST /v1/reports/{id}/amend (own reports)", "POST /v1/notification-attempts/{id}/acknowledge (addressed to self)"]
    shared_operations: ["all GET endpoints"]
  - name: MonitoringTechnician
    description: "Triage technician (CCT); X-User-ID equals a Technician.id"
    identity: "entity_backed:Technician"
    exclusive_operations: ["POST /v1/alerts/{id}/acknowledge", "POST /v1/alerts/{id}/release", "POST /v1/alerts/{id}/triage", "POST /v1/alerts/{id}/notify", "POST /v1/alerts/{id}/escalate", "POST /v1/alerts/{id}/close", "POST /v1/transmissions/{id}/reprocess"]
    shared_operations: ["all GET endpoints"]
  - name: BillingSpecialist
    description: "Billing staff; propose/approve adjustments are segregated by X-User-ID"
    identity: opaque
    exclusive_operations: ["POST /v1/episodes/{id}/billing-periods/generate", "POST /v1/billing-periods/{id}/submit", "POST /v1/billing-periods/{id}/propose-adjustment", "POST /v1/billing-periods/{id}/approve-adjustment"]
    shared_operations: ["all GET endpoints"]
  - name: InventoryManager
    description: "Device inventory and returns"
    identity: opaque
    exclusive_operations: ["POST /v1/devices", "POST /v1/episodes/{id}/return-shipments", "POST /v1/return-shipments/{id}/mark-received"]
    shared_operations: ["all GET endpoints"]
  - name: DeviceGateway
    description: "Device data-plane identity pushing transmissions and detections"
    identity: opaque
    exclusive_operations: ["POST /v1/episodes/{id}/transmissions", "POST /v1/episodes/{id}/alerts"]
    shared_operations: ["GET /v1/episodes/{id}/transmissions"]
