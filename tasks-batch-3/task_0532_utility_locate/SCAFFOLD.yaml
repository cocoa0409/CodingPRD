# =============================================================================
# task_0532_utility_locate — 811 Call-Before-You-Dig & Utility Locate
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  811 Call-Before-You-Dig & Utility Locate: locate ticket intake & dig-site
  polygon, member-utility notification & routing, positive-response by facility
  owner, locate-tech dispatch & SLA clock, mark-out & re-mark/refresh, damage
  report & claim, emergency vs normal ticket, white-lining/meet request .

domain_name: utility-locate
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation      # every notified member utility must post a positive-response; ticket clears only on unanimous all-clear quorum
  secondary_archetype: temporal_windowing         # SLA due clock, mark-out validity/refresh window, legal dig window
  complexity_layers:
    - cascading_side_effects        # ticket transition fans notifications, which fan positive-responses, which bubble ticket posture
    - derived_field_reconciliation  # ticket.response_posture / open_notification_count kept consistent with children
    - rate_threshold_triggers       # SLA breach at exact due instant; damage-claim liability tier boundaries
    - optimistic_concurrency        # re-mark (refresh) supersedes prior mark-out via OCC on ticket.version
    - scheduled_deferred_actions    # logical clock drives SLA due, mark-out expiry, dig-window open/close

  entity_topology: flat             # peer entities linked by FK ids in bodies; no deep URL nesting
  state_machine_shape: compound     # LocateTicket posture is derived from the aggregate of its UtilityNotification / PositiveResponse children
  relationship_patterns:
    - one_to_many                   # ticket -> notifications, notification -> positive-responses/remarks
    - cross_aggregate               # DamageReport references a MarkOut and a MemberUtility across aggregates
  role_model: peer_roles            # Excavator, LocateTech, FacilityOwner each own distinct resource types; CallCenter/Admin operational
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration / registry entities ---
  - name: Excavator
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Excavation company name" }
      - { name: contact_email, type: string, source: input, description: "Contact email, unique among Excavators" }
      - { name: state_code, type: string, source: input, description: "Two-letter state the excavator operates in, e.g. CA" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED — SUSPENDED excavators cannot create tickets" }

  - name: MemberUtility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility-owner / member utility name" }
      - { name: facility_type, type: enum, source: input, description: "GAS | ELECTRIC | WATER | SEWER | TELECOM | OIL — GAS and OIL are HIGH_PRIORITY facility types" }
      - { name: service_polygon, type: object, source: input, description: "Axis-aligned service-area bounding box {min_x, min_y, max_x, max_y} in integer grid units. Routing predicate (open/interior overlap, both axes): a ticket routes to this member iff dig.min_x < service.max_x AND service.min_x < dig.max_x AND dig.min_y < service.max_y AND service.min_y < dig.max_y. Boxes that merely touch on an edge (e.g. service.min_x == dig.max_x) do NOT route." }
      - { name: emergency_contact_minutes, type: integer, source: input, default: 60, description: "Response window in minutes this member commits to for EMERGENCY tickets" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE — only ACTIVE members are routed notifications" }

  - name: LocateTech
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Locate technician name" }
      - { name: member_utility_id, type: string, source: input, description: "FK -> MemberUtility.id; the facility owner this tech performs mark-outs for" }
      - { name: certified_facility_types, type: array, source: input, description: "Enum list from {GAS,ELECTRIC,WATER,SEWER,TELECOM,OIL} this tech is certified to mark" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Read-only count of this tech's LocateAssignments in DISPATCHED or EN_ROUTE state" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OFF_DUTY — OFF_DUTY techs cannot be dispatched" }

  # --- Core ticket aggregate ---
  - name: LocateTicket
    parent: null
    common_fields: true
    fields:
      - { name: excavator_id, type: string, source: input, description: "FK -> Excavator.id; the excavator who filed the ticket" }
      - { name: ticket_type, type: enum, source: input, description: "NORMAL | EMERGENCY — drives SLA due computation and dig-window rules" }
      - { name: dig_polygon, type: object, source: input, description: "Axis-aligned dig-site bounding box {min_x, min_y, max_x, max_y} in integer grid units; max_x>min_x and max_y>min_y" }
      - { name: work_description, type: string, source: input, description: "Free-text description of the excavation" }
      - { name: is_white_lined, type: boolean, source: input, default: false, description: "True when excavator pre-marked (white-lined) the dig site; suppresses the mandatory meet request" }
      - { name: sla_due_at, type: datetime, source: computed, description: "Computed positive-response deadline (see calc sla_due_at); set when ticket is SUBMITTED" }
      - { name: dig_window_opens_at, type: datetime, source: computed, description: "Earliest legal dig start = sla_due_at (see calc dig_window)" }
      - { name: dig_window_expires_at, type: datetime, source: computed, description: "Latest legal dig start = markout_completed_at + MARKOUT_VALID_DAYS (see calc dig_window); null until marks complete" }
      - { name: notified_member_count, type: integer, source: computed, default: 0, description: "Read-only count of UtilityNotification rows created when the ticket was submitted" }
      - { name: open_response_count, type: integer, source: computed, default: 0, description: "Read-only count of UtilityNotification rows whose response_status is PENDING" }
      - { name: response_posture, type: enum, source: computed, default: INTAKE, description: "Derived aggregate: INTAKE | AWAITING_RESPONSES | ALL_CLEAR | CONFLICT | SLA_BREACHED (see calc response_posture)" }
      - { name: markout_completed_at, type: datetime, source: computed, description: "Timestamp the latest active MarkOut reached COMPLETE; null until first completion; reset when a re-mark supersedes" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE -> SUBMITTED -> RESPONSES_COMPLETE -> MARKED -> CLOSED / CANCELLED / EXPIRED" }

  # --- Notification / routing (join of ticket x member) ---
  - name: UtilityNotification
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; the ticket that generated this notification" }
      - { name: member_utility_id, type: string, source: input, description: "FK -> MemberUtility.id; the routed facility owner" }
      - { name: response_status, type: enum, source: system, default: PENDING, description: "PENDING -> CLEAR | CONFLICT | MARKED_BY_OWNER; set by the facility owner's PositiveResponse" }
      - { name: due_at, type: datetime, source: computed, description: "Per-member due instant copied from ticket.sla_due_at at creation" }
      - { name: is_high_priority, type: boolean, source: computed, description: "True when the member's facility_type is GAS or OIL; high-priority members drive stricter conflict handling" }

  - name: PositiveResponse
    parent: null
    common_fields: false   # append-only response record (immutable); id + created_at only
    fields:
      - { name: notification_id, type: string, source: input, description: "FK -> UtilityNotification.id; the notification being answered" }
      - { name: outcome, type: enum, source: input, description: "CLEAR | CONFLICT | MARKED_BY_OWNER — the facility owner's positive response" }
      - { name: comment, type: string, source: input, required: false, description: "Optional free-text note from the facility owner" }
      - { name: responded_at, type: datetime, source: computed, description: "Logical-clock instant the response was posted" }
      - { name: was_late, type: boolean, source: computed, description: "True when responded_at > notification.due_at at post time" }

  # --- Dispatch & SLA ---
  - name: LocateAssignment
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; the ticket being located" }
      - { name: notification_id, type: string, source: input, description: "FK -> UtilityNotification.id; the member notification this assignment services" }
      - { name: locate_tech_id, type: string, source: input, description: "FK -> LocateTech.id; the dispatched technician" }
      - { name: dispatched_at, type: datetime, source: computed, description: "Logical-clock instant of dispatch" }
      - { name: sla_deadline_at, type: datetime, source: computed, description: "Field-completion deadline = dispatched_at + tech-SLA minutes (see calc assignment_sla)" }
      - { name: completed_at, type: datetime, source: computed, description: "Instant the assignment reached COMPLETED; null until then" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "Read-only: true when marked complete after sla_deadline_at, or when force-breached by the clock" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "DISPATCHED -> EN_ROUTE -> COMPLETED / CANCELLED / BREACHED" }

  # --- Mark-out & re-mark/refresh ---
  - name: MarkOut
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> LocateAssignment.id; the assignment the tech performed" }
      - { name: ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; denormalized for reverse lookup" }
      - { name: marks_count, type: integer, source: input, description: "Number of paint/flag marks placed; must be >= 1" }
      - { name: is_refresh, type: boolean, source: computed, default: false, description: "True when this mark-out superseded a prior COMPLETE mark-out on the same ticket (re-mark)" }
      - { name: supersedes_markout_id, type: string, source: input, required: false, description: "FK -> MarkOut.id; the prior mark-out this refresh replaces; required for a refresh, null for the first mark-out" }
      - { name: valid_until, type: datetime, source: computed, description: "completed_at + MARKOUT_VALID_DAYS; the mark-out expiry instant" }
      - { name: status, type: enum, source: system, default: IN_PROGRESS, description: "IN_PROGRESS -> COMPLETE -> SUPERSEDED / EXPIRED" }

  # --- Meet request (white-lining / meet) ---
  - name: MeetRequest
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; the ticket needing a field meet" }
      - { name: member_utility_id, type: string, source: input, description: "FK -> MemberUtility.id; the facility owner asked to attend" }
      - { name: proposed_start_min, type: integer, source: input, description: "Proposed meet-window start, minutes-from-epoch integer on the shared grid" }
      - { name: proposed_end_min, type: integer, source: input, description: "Proposed meet-window end; must be > proposed_start_min" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> SCHEDULED -> COMPLETED / DECLINED" }

  # --- Damage report & claim ---
  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; the ticket the damage occurred under" }
      - { name: member_utility_id, type: string, source: input, description: "FK -> MemberUtility.id; the facility owner whose line was damaged" }
      - { name: markout_id, type: string, source: input, required: false, description: "FK -> MarkOut.id; the mark-out in force when damage occurred; null if no active mark-out existed" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Reported repair cost in cents; must be >= 0" }
      - { name: dug_within_marks, type: boolean, source: input, description: "True if excavation stayed inside the painted marks (excavator claim of care)" }
      - { name: excavator_liability_cents, type: integer, source: computed, description: "Computed excavator share of repair_cost_cents (see calc liability_apportionment)" }
      - { name: member_liability_cents, type: integer, source: computed, description: "Computed member share = repair_cost_cents - excavator_liability_cents" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED -> UNDER_REVIEW -> SETTLED / DISPUTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- LocateTicket: compound posture-bearing central aggregate ----
  - entity: LocateTicket
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED, EXPIRED]
    transitions:
      - from: INTAKE
        to: SUBMITTED
        trigger: "POST /locate-tickets/{ticketId}/submit"
        actor: Excavator
        preconditions:
          - "Ticket in INTAKE (ERR_TICKET_NOT_IN_INTAKE)"
          - "Excavator.status == ACTIVE (ERR_EXCAVATOR_SUSPENDED)"
          - "At least one ACTIVE MemberUtility whose service_polygon intersects dig_polygon (ERR_NO_MEMBERS_IN_AREA)"
          - "If ticket_type==NORMAL and is_white_lined==false, a MeetRequest in {REQUESTED,SCHEDULED,COMPLETED} must already exist for this ticket (ERR_MEET_REQUEST_REQUIRED)"
        side_effects:
          - "Compute sla_due_at (calc sla_due_at) from current clock and ticket_type"
          - "Set dig_window_opens_at = sla_due_at (calc dig_window)"
          - "Create one UtilityNotification per intersecting ACTIVE MemberUtility (response_status=PENDING, due_at=ticket.sla_due_at, is_high_priority per member facility_type)"
          - "Set notified_member_count = number of notifications created; open_response_count = same value"
          - "Recompute response_posture -> AWAITING_RESPONSES (calc response_posture)"
        note: "Fan-out create: one action directly creates N notifications; this is a fan-out (direct multi-target), not a transitive cascade."

      - from: SUBMITTED
        to: RESPONSES_COMPLETE
        trigger: "system (bubble-up when the last PENDING UtilityNotification is answered)"
        actor: system
        preconditions:
          - "open_response_count reaches 0 with no member in CONFLICT and clock <= sla_due_at"
        side_effects:
          - "Recompute response_posture -> ALL_CLEAR (calc response_posture)"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system, when advanced past sla_due_at with PENDING notifications remaining)"
        actor: system
        preconditions:
          - "clock > sla_due_at AND open_response_count > 0"
        side_effects:
          - "Recompute response_posture -> SLA_BREACHED (calc response_posture)"
          - "Each still-PENDING UtilityNotification: response_status stays PENDING but ticket is EXPIRED (no member may respond after expiry)"
        note: "Auto-transition fired by clock advance."

      - from: RESPONSES_COMPLETE
        to: MARKED
        trigger: "system (bubble-up when a MarkOut on this ticket reaches COMPLETE)"
        actor: system
        preconditions:
          - "response_posture == ALL_CLEAR"
          - "A MarkOut for this ticket has just reached COMPLETE"
        side_effects:
          - "Set markout_completed_at = clock at mark completion"
          - "Set dig_window_expires_at = markout_completed_at + MARKOUT_VALID_DAYS (calc dig_window)"

      - from: MARKED
        to: CLOSED
        trigger: "POST /locate-tickets/{ticketId}/close"
        actor: Excavator
        preconditions:
          - "Ticket in MARKED (ERR_TICKET_NOT_MARKED)"
          - "clock <= dig_window_expires_at (ERR_DIG_WINDOW_EXPIRED)"
        side_effects:
          - "Ticket -> CLOSED"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /locate-tickets/{ticketId}/cancel"
        actor: Excavator
        preconditions:
          - "Ticket in INTAKE or SUBMITTED (ERR_TICKET_NOT_CANCELLABLE)"
        side_effects:
          - "Ticket -> CANCELLED"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /locate-tickets/{ticketId}/cancel"
        actor: Excavator
        preconditions:
          - "Ticket in INTAKE or SUBMITTED (ERR_TICKET_NOT_CANCELLABLE)"
          - "No LocateAssignment for this ticket is in DISPATCHED or EN_ROUTE (ERR_ASSIGNMENT_ACTIVE)"
        side_effects:
          - "Cascade: every PENDING UtilityNotification for this ticket -> response_status stays PENDING but ticket CANCELLED; open MeetRequests (REQUESTED/SCHEDULED) -> DECLINED"

      - from: MARKED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system, when advanced past dig_window_expires_at)"
        actor: system
        preconditions:
          - "clock > dig_window_expires_at"
        side_effects:
          - "Ticket -> EXPIRED"
          - "The active MarkOut (status COMPLETE) -> EXPIRED (cascade)"
        note: "Auto-transition fired by clock advance."

  # ---- UtilityNotification: per-member response leg ----
  - entity: UtilityNotification
    initial_state: PENDING
    terminal_states: [CLEAR, CONFLICT, MARKED_BY_OWNER]
    transitions:
      - from: PENDING
        to: CLEAR
        trigger: "POST /positive-responses (outcome=CLEAR)"
        actor: FacilityOwner
        preconditions:
          - "Parent LocateTicket in SUBMITTED (ERR_TICKET_NOT_ACCEPTING_RESPONSES)"
          - "Notification in PENDING (ERR_NOTIFICATION_ALREADY_ANSWERED)"
          - "Acting FacilityOwner owns notification.member_utility_id (ERR_NOT_NOTIFICATION_OWNER)"
        side_effects:
          - "Create immutable PositiveResponse (was_late per due_at)"
          - "response_status -> CLEAR"
          - "Bubble-up: ticket.open_response_count -= 1; recompute ticket.response_posture; if now 0 and no CONFLICT -> ticket RESPONSES_COMPLETE"

      - from: PENDING
        to: CONFLICT
        trigger: "POST /positive-responses (outcome=CONFLICT)"
        actor: FacilityOwner
        preconditions:
          - "Parent LocateTicket in SUBMITTED (ERR_TICKET_NOT_ACCEPTING_RESPONSES)"
          - "Notification in PENDING (ERR_NOTIFICATION_ALREADY_ANSWERED)"
          - "Acting FacilityOwner owns notification.member_utility_id (ERR_NOT_NOTIFICATION_OWNER)"
        side_effects:
          - "Create immutable PositiveResponse"
          - "response_status -> CONFLICT"
          - "Bubble-up: ticket.open_response_count -= 1; recompute ticket.response_posture -> CONFLICT (a conflict blocks RESPONSES_COMPLETE even when count hits 0)"

      - from: PENDING
        to: MARKED_BY_OWNER
        trigger: "POST /positive-responses (outcome=MARKED_BY_OWNER)"
        actor: FacilityOwner
        preconditions:
          - "Parent LocateTicket in SUBMITTED (ERR_TICKET_NOT_ACCEPTING_RESPONSES)"
          - "Notification in PENDING (ERR_NOTIFICATION_ALREADY_ANSWERED)"
          - "Acting FacilityOwner owns notification.member_utility_id (ERR_NOT_NOTIFICATION_OWNER)"
        side_effects:
          - "Create immutable PositiveResponse"
          - "response_status -> MARKED_BY_OWNER (counts as cleared for quorum)"
          - "Bubble-up: ticket.open_response_count -= 1; recompute ticket.response_posture; if now 0 and no CONFLICT -> ticket RESPONSES_COMPLETE"

  # ---- LocateAssignment: dispatch + SLA clock ----
  - entity: LocateAssignment
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, CANCELLED, BREACHED]
    transitions:
      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "POST /locate-assignments/{assignmentId}/en-route"
        actor: LocateTech
        preconditions:
          - "Assignment in DISPATCHED (ERR_ASSIGNMENT_NOT_DISPATCHED)"
          - "Acting LocateTech owns the assignment (ERR_NOT_ASSIGNMENT_TECH)"
        side_effects:
          - "Assignment -> EN_ROUTE"

      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /locate-assignments/{assignmentId}/complete"
        actor: LocateTech
        preconditions:
          - "Assignment in EN_ROUTE (ERR_ASSIGNMENT_NOT_EN_ROUTE)"
          - "Acting LocateTech owns the assignment (ERR_NOT_ASSIGNMENT_TECH)"
          - "A MarkOut for this assignment is in COMPLETE (ERR_MARKOUT_NOT_COMPLETE)"
        side_effects:
          - "Set completed_at = clock"
          - "Set sla_breached = (completed_at > sla_deadline_at)"
          - "Assignment -> COMPLETED"
          - "Decrement tech.active_assignment_count by 1 (recompute)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /locate-assignments/{assignmentId}/cancel"
        actor: FacilityOwner
        preconditions:
          - "Assignment in DISPATCHED or EN_ROUTE (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Assignment -> CANCELLED"
          - "Decrement tech.active_assignment_count by 1 (recompute)"
          - "Cascade: any IN_PROGRESS MarkOut for this assignment -> EXPIRED"

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /locate-assignments/{assignmentId}/cancel"
        actor: FacilityOwner
        preconditions:
          - "Assignment in DISPATCHED or EN_ROUTE (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Assignment -> CANCELLED"
          - "Decrement tech.active_assignment_count by 1 (recompute)"
          - "Cascade: any IN_PROGRESS MarkOut for this assignment -> EXPIRED"

      - from: DISPATCHED
        to: BREACHED
        trigger: "POST /_clock/set_current_utc (system, when advanced past sla_deadline_at)"
        actor: system
        preconditions:
          - "clock > sla_deadline_at AND assignment in DISPATCHED or EN_ROUTE"
        side_effects:
          - "Assignment -> BREACHED"
          - "Set sla_breached = true"
          - "Decrement tech.active_assignment_count by 1 (recompute)"
        note: "Auto-transition on clock advance; applies from DISPATCHED and EN_ROUTE."

      - from: EN_ROUTE
        to: BREACHED
        trigger: "POST /_clock/set_current_utc (system, when advanced past sla_deadline_at)"
        actor: system
        preconditions:
          - "clock > sla_deadline_at AND assignment in DISPATCHED or EN_ROUTE"
        side_effects:
          - "Assignment -> BREACHED"
          - "Set sla_breached = true"
          - "Decrement tech.active_assignment_count by 1 (recompute)"

  # ---- MarkOut: cyclic re-mark / refresh loop ----
  - entity: MarkOut
    initial_state: IN_PROGRESS
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /mark-outs/{markOutId}/complete"
        actor: LocateTech
        preconditions:
          - "MarkOut in IN_PROGRESS (ERR_MARKOUT_NOT_IN_PROGRESS)"
          - "Parent ticket.response_posture == ALL_CLEAR (ERR_TICKET_NOT_ALL_CLEAR)"
          - "Acting LocateTech owns the parent assignment (ERR_NOT_ASSIGNMENT_TECH)"
        side_effects:
          - "Set completed_at = clock; set valid_until = completed_at + MARKOUT_VALID_DAYS (calc dig_window feeds MarkOut.valid_until)"
          - "Bubble-up: ticket.markout_completed_at set; ticket.dig_window_expires_at set; ticket RESPONSES_COMPLETE -> MARKED"

      - from: COMPLETE
        to: SUPERSEDED
        trigger: "POST /mark-outs (refresh: body supersedes_markout_id set, then complete) — system-marks the prior COMPLETE MarkOut SUPERSEDED"
        actor: system
        preconditions:
          - "A new MarkOut with supersedes_markout_id == this.id reached COMPLETE"
        side_effects:
          - "Prior MarkOut -> SUPERSEDED"
          - "ticket.markout_completed_at reset to the refresh's completed_at; dig_window_expires_at recomputed (cascade)"
        note: "Re-mark/refresh cycle: COMPLETE -> (new markout created & completed) -> old SUPERSEDED, ticket stays MARKED with a fresh window."

  # ---- MeetRequest: white-lining / meet ----
  - entity: MeetRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /meet-requests/{meetRequestId}/schedule"
        actor: FacilityOwner
        preconditions:
          - "MeetRequest in REQUESTED (ERR_MEET_NOT_REQUESTED)"
          - "Acting FacilityOwner owns member_utility_id (ERR_NOT_MEET_OWNER)"
          - "No SCHEDULED MeetRequest for the same member_utility_id whose [proposed_start_min, proposed_end_min) overlaps this one (ERR_MEET_WINDOW_OVERLAP)"
        side_effects:
          - "MeetRequest -> SCHEDULED"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /meet-requests/{meetRequestId}/complete"
        actor: FacilityOwner
        preconditions:
          - "MeetRequest in SCHEDULED (ERR_MEET_NOT_SCHEDULED)"
          - "Acting FacilityOwner owns member_utility_id (ERR_NOT_MEET_OWNER)"
        side_effects:
          - "MeetRequest -> COMPLETED"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /meet-requests/{meetRequestId}/decline"
        actor: FacilityOwner
        preconditions:
          - "MeetRequest in REQUESTED or SCHEDULED (ERR_MEET_NOT_DECLINABLE)"
        side_effects:
          - "MeetRequest -> DECLINED"

  # ---- DamageReport: claim ----
  - entity: DamageReport
    initial_state: FILED
    terminal_states: [SETTLED, DISPUTED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /damage-reports/{damageReportId}/review"
        actor: FacilityOwner
        preconditions:
          - "DamageReport in FILED (ERR_DAMAGE_NOT_FILED)"
          - "Acting FacilityOwner owns member_utility_id (ERR_NOT_DAMAGE_OWNER)"
        side_effects:
          - "Recompute excavator_liability_cents and member_liability_cents (calc liability_apportionment)"
          - "DamageReport -> UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /damage-reports/{damageReportId}/settle"
        actor: FacilityOwner
        preconditions:
          - "DamageReport in UNDER_REVIEW (ERR_DAMAGE_NOT_UNDER_REVIEW)"
          - "Acting FacilityOwner owns member_utility_id (ERR_NOT_DAMAGE_OWNER)"
        side_effects:
          - "DamageReport -> SETTLED"

      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /damage-reports/{damageReportId}/dispute"
        actor: Excavator
        preconditions:
          - "DamageReport in UNDER_REVIEW (ERR_DAMAGE_NOT_UNDER_REVIEW)"
          - "Acting Excavator owns the parent ticket.excavator_id (ERR_NOT_DAMAGE_EXCAVATOR)"
        side_effects:
          - "DamageReport -> DISPUTED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: markout-refresh-stale-ticket
    parent_entity: LocateTicket
    write_endpoint: "POST /mark-outs"
    occ_field: "expected_ticket_version"
    description: |
      Creating a refresh MarkOut (supersedes_markout_id set) against a
      LocateTicket whose version has advanced since the client last observed
      it is rejected. A refresh legitimately supersedes the prior COMPLETE
      mark-out and resets the ticket's dig window; if another writer has
      already posted a refresh (advancing ticket.version via its bubble-up
      cascade), the current writer's view of the ticket is stale and the
      supersede target no longer holds.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Dual-variant #1 (domain: LocateTicket time) ----
  - name: sla_due_at
    trigger: "LocateTicket INTAKE -> SUBMITTED (POST /locate-tickets/{ticketId}/submit)"
    algorithm: forward_looking
    formula: |
      base = clock_at_submit  (the logical clock instant of submit)
      if ticket_type == EMERGENCY:
        # EMERGENCY: flat wall-clock window; business hours ignored.
        sla_due_at = base + EMERGENCY_WINDOW_HOURS hours
      else:  # NORMAL
        # NORMAL: skip whole non-business days. Advance day-by-day from base,
        # counting only business days (Mon-Fri). Weekends (Sat=5, Sun=6 in
        # Python weekday()) add a calendar day WITHOUT decrementing the counter.
        remaining = NORMAL_WINDOW_BUSINESS_DAYS
        cursor = base
        while remaining > 0:
          cursor = cursor + 1 day (same time-of-day as base)
          if cursor.weekday() in {0,1,2,3,4}:  # Mon-Fri
            remaining -= 1
        sla_due_at = cursor
    input_set: "ticket_type and clock_at_submit only; does not depend on member responses"
    constants:
      EMERGENCY_WINDOW_HOURS: 2
      NORMAL_WINDOW_BUSINESS_DAYS: 2
    precision: "datetime at second granularity; time-of-day preserved from base"
    variants:
      - name: emergency_flat_window
        when: "ticket_type == EMERGENCY"
        difference: "adds a flat EMERGENCY_WINDOW_HOURS hours; weekends counted"
      - name: normal_business_day_skip
        when: "ticket_type == NORMAL"
        difference: "counts only Mon-Fri; weekend days advance the clock but not the business-day counter"

  # ---- Dual-variant #2 (domain: DamageReport money) ----
  - name: liability_apportionment
    trigger: "DamageReport FILED -> UNDER_REVIEW (POST /damage-reports/{damageReportId}/review)"
    algorithm: threshold
    formula: |
      # Two apportionment variants selected by whether an active mark-out existed.
      cost = repair_cost_cents
      if markout_id is null:
        # NO-MARKS variant: no valid mark-out was in force -> excavator dug blind.
        excavator_liability_cents = cost              # 100% excavator
      else:
        # MARKED variant: a mark-out was in force.
        if dug_within_marks == true:
          # Excavator exercised care -> facility owner bears the marking error.
          excavator_liability_cents = round_half_up(cost * WITHIN_MARKS_EXCAVATOR_PCT)
        else:
          # Excavator dug outside the marks -> excavator bears majority.
          excavator_liability_cents = round_half_up(cost * OUTSIDE_MARKS_EXCAVATOR_PCT)
      member_liability_cents = cost - excavator_liability_cents
    input_set: "single DamageReport; markout_id presence and dug_within_marks flag"
    constants:
      WITHIN_MARKS_EXCAVATOR_PCT: 0.25
      OUTSIDE_MARKS_EXCAVATOR_PCT: 0.75
    precision: "cents (integer); round_half_up on the percentage product before subtracting"
    variants:
      - name: no_marks_full_excavator
        when: "markout_id is null"
        difference: "excavator bears 100%; member bears 0"
      - name: marked_apportioned
        when: "markout_id present"
        difference: "split 25/75 or 75/25 by dug_within_marks; product rounded half-up before member share is taken as remainder"

  # ---- Combinatorial mode (a): non-linear multi-input formula ----
  - name: assignment_sla
    trigger: "LocateAssignment creation (POST /locate-assignments)"
    algorithm: threshold
    formula: |
      # SLA minutes depend on ticket_type, member facility priority, and the
      # tech's current load — a 3-input non-linear selection.
      if ticket.ticket_type == EMERGENCY:
        minutes = member.emergency_contact_minutes
      else:
        minutes = NORMAL_ASSIGNMENT_MINUTES
      # High-priority facility (GAS/OIL) tightens the window multiplicatively.
      if notification.is_high_priority == true:
        minutes = ceil(minutes * HIGH_PRIORITY_FACTOR)
      # A loaded tech (>= LOAD_THRESHOLD active assignments at dispatch) gets slack.
      if tech.active_assignment_count >= LOAD_THRESHOLD:
        minutes = minutes + LOAD_SLACK_MINUTES
      sla_deadline_at = dispatched_at + minutes minutes
    input_set: "ticket_type, notification.is_high_priority, tech.active_assignment_count (BEFORE this dispatch increments it)"
    constants:
      NORMAL_ASSIGNMENT_MINUTES: 240
      HIGH_PRIORITY_FACTOR: 0.5
      LOAD_THRESHOLD: 3
      LOAD_SLACK_MINUTES: 60
    precision: "integer minutes; ceil after the high-priority multiply, applied BEFORE the load-slack addition (order pinned)"

  # ---- Combinatorial mode (c): pinned evaluation order (dig window) ----
  - name: dig_window
    trigger: "ticket submit sets opens_at; markout complete sets expires_at"
    algorithm: interval_merge
    formula: |
      # opens_at and expires_at have a circular-looking dependency resolved by
      # a pinned evaluation order:
      #   1. At submit: dig_window_opens_at = sla_due_at (from calc sla_due_at).
      #   2. expires_at is UNDEFINED until a MarkOut completes.
      #   3. At MarkOut COMPLETE: markout_completed_at = clock;
      #      MarkOut.valid_until = markout_completed_at + MARKOUT_VALID_DAYS days;
      #      ticket.dig_window_expires_at = MarkOut.valid_until.
      #   4. On refresh (re-mark): markout_completed_at := refresh.completed_at;
      #      expires_at recomputed from the NEW completion (window slides forward).
      # Legal dig start requires: dig_window_opens_at <= clock <= dig_window_expires_at.
    input_set: "ticket.sla_due_at, the active (COMPLETE) MarkOut.completed_at"
    constants:
      MARKOUT_VALID_DAYS: 21
    precision: "datetime at second granularity"

  # ---- Compound derived posture (bubble-up aggregate) ----
  - name: response_posture
    trigger: "ticket submit; every UtilityNotification answer; clock advance past sla_due_at"
    algorithm: aggregation
    formula: |
      # Derived from the ticket's UtilityNotification children, evaluated in this
      # fixed precedence (first matching branch wins):
      let notes = UtilityNotifications for this ticket
      if ticket.status == INTAKE: posture = INTAKE
      elif clock > sla_due_at AND count(notes where response_status==PENDING) > 0:
             posture = SLA_BREACHED
      elif count(notes where response_status==CONFLICT) >= 1:
             posture = CONFLICT
      elif count(notes where response_status==PENDING) > 0:
             posture = AWAITING_RESPONSES
      else:  # all answered, none CONFLICT
             posture = ALL_CLEAR
      # open_response_count = count(notes where response_status==PENDING)
    input_set: "all UtilityNotification rows for the ticket; the logical clock"
    precision: "exact integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK body fields

  - priority: 4
    category: state
    check: "Target resource in correct state for the transition"
    error_id: "varies (ERR_TICKET_NOT_IN_INTAKE, ERR_NOTIFICATION_ALREADY_ANSWERED, ERR_ASSIGNMENT_NOT_DISPATCHED, etc.)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: business_referential
    check: "Acting FacilityOwner/LocateTech/Excavator owns the entity being mutated (X-User-ID matches the owning member/tech/excavator)"
    error_id: "varies (ERR_NOT_NOTIFICATION_OWNER, ERR_NOT_ASSIGNMENT_TECH, ERR_NOT_MEET_OWNER, ERR_NOT_DAMAGE_OWNER)"
    http_status: 403
    applies_to: "POST /positive-responses; assignment/meet/damage/markout transitions"

  - priority: 5.5
    category: state
    check: "On locate-assignment create, the dispatched LocateTech.status must be AVAILABLE (not OFF_DUTY)"
    error_id: ERR_TECH_OFF_DUTY
    http_status: 409
    applies_to: "POST /locate-assignments"

  - priority: 6
    category: business_safety
    check: "On locate-assignment create, tech.certified_facility_types must contain the notified member's facility_type"
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /locate-assignments"

  - priority: 7
    category: business_safety
    check: "MarkOut may complete only while parent ticket.response_posture == ALL_CLEAR (no unresolved CONFLICT)"
    error_id: ERR_TICKET_NOT_ALL_CLEAR
    http_status: 409
    applies_to: "POST /mark-outs/{markOutId}/complete"

  - priority: 8
    category: business_temporal
    check: "Meet-request scheduling: proposed [start,end) must not overlap another SCHEDULED meet for the same member_utility_id (half-open interval; touching endpoints allowed)"
    error_id: ERR_MEET_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /meet-requests/{meetRequestId}/schedule"

  - priority: 9
    category: business_temporal
    check: "A refresh MarkOut may only supersede a MarkOut currently in COMPLETE on the same ticket; the ticket's dig window must not yet be EXPIRED (clock <= current dig_window_expires_at)"
    error_id: ERR_MARKOUT_NOT_REFRESHABLE
    http_status: 409
    applies_to: "POST /mark-outs (refresh path)"

  - priority: 10
    category: business_constraint
    check: "dig_polygon must be a valid box (max_x>min_x and max_y>min_y); marks_count >= 1; repair_cost_cents >= 0; proposed_end_min > proposed_start_min"
    error_id: ERR_INVALID_GEOMETRY
    http_status: 422
    applies_to: "POST /locate-tickets; POST /mark-outs; POST /damage-reports; POST /meet-requests"

  - priority: 11
    category: state
    check: "OCC: refresh MarkOut create must carry expected_ticket_version matching current LocateTicket.version"
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
    applies_to: "POST /mark-outs (refresh path)"

