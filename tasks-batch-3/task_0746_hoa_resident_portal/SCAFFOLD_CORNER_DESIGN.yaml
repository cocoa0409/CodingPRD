              as: HOAManager
          trigger:
            - call: "POST /violations/${v_id}/appeal"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { st: $.data.status }
          assert:
            - "st == 'APPEALED'"

      - name: existence_check_left_to_right
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: "POST /amenity-reservations with a non-existent amenity_id returns ERR_FK_NOT_FOUND (404) — existence checks precede state and business checks."
        test_recipe:
