      - name: full_year_grandfathering_relief_drives_reaction_index_to_zero
        claim_type: weighted_scoring
        grounds:
          - calculations.member_reaction_index
          - calculations.member_reaction_index.constants.GRANDFATHER_RELIEF_POINTS
          - calculations.member_reaction_index.constants.EXPOSURE_POINTS_PER_MEMBER_BPS
        distinguishing_aspect: "Relief (30) exceeding the lead-time-weighted severity (EXPIRY_POLICY 20 at a 212-day notice, factor 10000) clamps the pre-exposure term at 0, so the exposure multiplier has nothing to scale and the index is exactly 0 - proving relief is subtracted BEFORE the exposure multiply, not after."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with two SILVER members so exposed_member_count is 2."
            - "One DRAFT EXPIRY_POLICY ProgramChangeNotice effective 2027-03-01T00:00:00Z with grandfather_until 2028-03-01T00:00:00Z (more than 365 days past effective_at)."
