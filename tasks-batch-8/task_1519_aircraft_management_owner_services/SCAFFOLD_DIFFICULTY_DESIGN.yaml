  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_check_precedes_staleness_check
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_STATEMENT_INVALID_STATE]
          - errors[ERR_STATEMENT_STALE]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the statement is
          already CERTIFIED (state violation, priority 5) AND a new POSTED
          expense makes its content stale (fiscal violation, priority 9); the
          state error ERR_STATEMENT_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Agreement ACTIVE; expense E1 FUEL 250000 (service 2026-08-05, paid 2026-08-07)"
            - "Statement for 2026-08 generated by AccountExecutive ae-1 and certified by FinanceController fc-1 (E1 now BILLED)"
            - "Expense E2 OTHER 90000 service_date 2026-08-20 posted afterwards (POSTED, unreflected)"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N110JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
              captures: { a_id: $.data.id }
            - call: "POST /agreements"
              payload: { owner_id: "${o_id}", aircraft_id: "${a_id}", monthly_management_fee_cents: 500000, variable_fee_pct: 0.10, charter_owner_share_pct: 0.85, tax_allocation_method: FLIGHT_HOURS }
              as: AccountExecutive
              captures: { ag_id: $.data.id }
            - call: "POST /agreements/${ag_id}/activate"
              as: AccountExecutive
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: FUEL, amount_cents: 250000, service_date: "2026-08-05", paid_date: "2026-08-07", vendor_name: "Meridian Fuel", tax_use: OWNER_USE }
              as: FinanceController
            - call: "POST /statements"
              payload: { aircraft_id: "${a_id}", period: "2026-08" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/certify"
              as: FinanceController
              as_user_id: "fc-1"
            - call: "POST /expenses"
              payload: { aircraft_id: "${a_id}", category: OTHER, amount_cents: 90000, service_date: "2026-08-20", vendor_name: "Late Catering", tax_use: OWNER_USE }
              as: FinanceController
          trigger:
            - call: "POST /statements/${stmt_id}/certify"
              as: FinanceController
              as_user_id: "fc-2"
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_STATEMENT_INVALID_STATE (not ERR_STATEMENT_STALE)"
            - "MonthlyStatement.${stmt_id}.status remains CERTIFIED"

      - name: crew_qualification_check_precedes_overlap_check
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CREW_NOT_QUALIFIED]
          - errors[ERR_CREW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          from the state vs fiscal pair): the crew member is INACTIVE (safety
          violation, priority 6) AND the requested duty window overlaps an
          existing COMPLETED duty window (temporal violation, priority 7); the
          safety error ERR_CREW_NOT_QUALIFIED must win.
        test_recipe:
          setup:
            - "Agreement ACTIVE; captain C1 QUALIFIED with a COMPLETED trip T1 whose PIC duty window was 2026-08-05T08:00 to 2026-08-05T12:00"
            - "C1 subsequently deactivated (status INACTIVE)"
            - "OWNER_USE trip T2 APPROVED"
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /aircraft"
              payload: { owner_id: "${o_id}", tail_number: "N120JX", model: "G650", home_base_icao: "KTEB" }
              as: AccountExecutive
