      - name: case_list_filter_by_status
        claim_type: standard_crud
        grounds: [entities.Case.fields.status]
        distinguishing_aspect: "Filtered list: GET /cases with status=CANCELLED returns only cancelled cases and excludes the INTAKE one."
        test_recipe:
          setup: ["Two cases exist; case 2 is cancelled"]
          setup_api_calls:
            - call: "POST /cases"
              payload: { client_name: "Vic Yell", client_address: "48 Filter Rd", client_phone: "555-0502" }
              as: IntakeCoordinator
              captures: { case1_id: $.data.id }
            - call: "POST /cases"
              payload: { client_name: "Wyn Zeff", client_address: "49 Filter Rd", client_phone: "555-0503" }
              as: IntakeCoordinator
              captures: { case2_id: $.data.id }
            - call: "POST /cases/${case2_id}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "GET /cases"
              payload: { status: "CANCELLED" }
              as: Any
          assert:
            - "Every returned item has status == CANCELLED"
            - "The returned set contains ${case2_id} and does not contain ${case1_id}"

      - name: inventory_units_filter_by_ramp_type
        claim_type: standard_crud
        grounds: [entities.InventoryUnit.fields.ramp_type]
        distinguishing_aspect: "Filtered list: GET /inventory-units with ramp_type=SUITCASE returns only SUITCASE units."
        test_recipe:
          setup: ["Two units exist: one MODULAR_ALUMINUM, one SUITCASE"]
          setup_api_calls:
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-F1", ramp_type: "MODULAR_ALUMINUM", length_feet: 10, width_inches: 36, weight_capacity_lbs: 700, monthly_rate_cents: 15000, purchase_price_cents: 300000 }
              as: LogisticsCoordinator
              captures: { unit_al: $.data.id }
            - call: "POST /inventory-units"
              payload: { unit_tag: "U-F2", ramp_type: "SUITCASE", length_feet: 5, width_inches: 30, weight_capacity_lbs: 500, monthly_rate_cents: 8000, purchase_price_cents: 120000 }
              as: LogisticsCoordinator
              captures: { unit_sc: $.data.id }
          trigger:
            - call: "GET /inventory-units"
              payload: { ramp_type: "SUITCASE" }
              as: Any
          assert:
            - "Every returned item has ramp_type == SUITCASE"
            - "The returned set contains ${unit_sc} and does not contain ${unit_al}"

      - name: client_dispute_sent_invoice_succeeds
        claim_type: action_endpoint
        grounds:
          - state_machines.Invoice.SENT_to_DISPUTED
        distinguishing_aspect: "The Client role's exclusive action: disputing a SENT invoice moves it to DISPUTED (positive RBAC + valid transition)."
        test_recipe:
          setup: ["Clock at 2026-05-01T00:00:00Z; case INTAKE; invoice SENT total 3000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cases"
              payload: { client_name: "Xan Abo", client_address: "50 Dispute Ave", client_phone: "555-0504" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { invoice_type: "SERVICE_CALL", due_date: "2026-06-01T00:00:00Z", expected_case_version: "${case_v1}" }
              as: BillingCoordinator
              captures: { inv_id: $.data.id }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/line-items"
              payload: { description: "Svc", quantity: 1, unit_price_cents: 3000, tax_rate_pct: 0.0 }
              as: BillingCoordinator
            - call: "GET /cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/invoices/${inv_id}/send"
              payload: { expected_case_version: "${case_v2}" }
              as: BillingCoordinator
          trigger:
            - call: "POST /cases/${case_id}/invoices/${inv_id}/dispute"
              payload: {}
              as: Client
          assert:
            - "HTTP status == 200"
            - "Invoice.${inv_id}.status == DISPUTED"

