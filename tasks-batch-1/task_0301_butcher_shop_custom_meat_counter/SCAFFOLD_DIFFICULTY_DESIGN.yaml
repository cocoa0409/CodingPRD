scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: orderline_estimate_vs_final_catch_weight_price
        grounds:
          - calculations.estimated_line_price
          - calculations.final_line_price
          - entities.OrderLine.fields.est_line_cents
          - entities.OrderLine.fields.final_line_cents
          - state_machines.OrderLine.PENDING_to_DRAWN
        distinguishing_aspect: |
          On the SAME OrderLine, the estimate variant prices ordered_weight_g with no shrink
          (8000c) while the final variant prices catch_weight_g reduced by shrink_pct_whole_cut
          (7680c); the two values must diverge and both persist on the line.
        test_recipe:
          setup:
            - "Active PricingPolicy (whole-cut shrink 0.04, bulk threshold 5000g)."
            - "RIBEYE CutType base_price_cents_per_kg 4000, not grind."
            - "STANDARD customer with a CONFIRMED order having one line ordered 2000g, est_line_cents 8000."
            - "An AVAILABLE RIBEYE lot of 5000g."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Stan Standard", phone: "555-0001" }
              as: CounterClerk
              captures: { cust_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${cust_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line_id: "$.data[0].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 5000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
          trigger:
            - call: "POST /order-lines/${line_id}/draw"
              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 2000, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
              captures: { final_cents: "$.data.final_line_cents" }
          assert:
            - "OrderLine.${line_id}.est_line_cents == 8000"
            - "OrderLine.${line_id}.final_line_cents == 7680"
            - "OrderLine.${line_id}.est_line_cents != OrderLine.${line_id}.final_line_cents"

      - name: sausage_batch_planned_vs_actual_yield
        grounds:
          - entities.SausageBatch.fields.planned_output_g
          - entities.SausageBatch.fields.actual_yield_g
          - calculations.final_line_price
          - state_machines.SausageBatch.RESERVED_to_PRODUCED
        distinguishing_aspect: |
          On the SausageBatch entity (a different domain from OrderLine pricing), planned_output_g
          is the operator's target (5000) while actual_yield_g is floor(sum(inputs) * (1 - shrink_pct_grind))
          = 4500; the planned figure and the shrink-derived actual figure diverge for identical inputs.
        test_recipe:
          setup:
            - "Active PricingPolicy with shrink_pct_grind 0.10."
            - "GROUND_BLEND grind CutType; two AVAILABLE lots 3000g and 2000g of a grind-eligible cut."
            - "A RESERVED batch whose two BatchInputs total 5000g, planned_output_g 5000."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "PORK_TRIM", species: "PORK", base_price_cents_per_kg: 800 }
              as: ShiftManager
              captures: { trim_id: "$.data.id" }
            - call: "POST /cut-types"
              payload: { code: "GROUND_BLEND", species: "PORK", base_price_cents_per_kg: 1200, is_grind: true }
              as: ShiftManager
              captures: { blend_id: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${trim_id}", received_weight_g: 3000 }
              as: Butcher
              captures: { lot_a: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${trim_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_b: "$.data.id" }
            - call: "POST /sausage-batches"
              payload: { recipe_name: "Breakfast", output_cut_type_id: "${blend_id}", planned_output_g: 5000 }
              as: Butcher
              captures: { batch_id: "$.data.id" }
            - call: "POST /sausage-batches/${batch_id}/inputs"
              payload: { inventory_lot_id: "${lot_a}", weight_g: 3000 }
              as: Butcher
            - call: "POST /sausage-batches/${batch_id}/inputs"
              payload: { inventory_lot_id: "${lot_b}", weight_g: 2000 }
              as: Butcher
            - call: "POST /sausage-batches/${batch_id}/reserve"
              payload: {}
              as: Butcher
          trigger:
            - call: "POST /sausage-batches/${batch_id}/produce"
              payload: {}
              as: Butcher
              captures: { yield_g: "$.data.actual_yield_g" }
          assert:
            - "SausageBatch.${batch_id}.planned_output_g == 5000"
            - "SausageBatch.${batch_id}.actual_yield_g == 4500"
            - "SausageBatch.${batch_id}.actual_yield_g != SausageBatch.${batch_id}.planned_output_g"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bulk_tier_nonlinear_wholesale_split
        grounds:
          - calculations.estimated_line_price
          - entities.PricingPolicy.fields.bulk_threshold_g
          - entities.PricingPolicy.fields.bulk_extra_discount_pct
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Mode (a): est_line_cents for an 8000g WHOLESALE line is a 3-input non-linear split —
          normal_g(5000)*rate*(1-0.20) + bulk_g(3000)*rate*(1-0.20)*(1-0.05) = 4800 + 2736 = 7536,
          NOT a flat per-gram product; the bulk discount stacks multiplicatively only on grams >= threshold.
        test_recipe:
          setup:
            - "Active PricingPolicy bulk_threshold_g 5000, bulk_extra_discount_pct 0.05, wholesale_discount_pct 0.20."
            - "GROUND_CHUCK CutType base 1200 (grind)."
            - "WHOLESALE customer placing a STANDARD order with one line ordered 8000g."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "GROUND_CHUCK", species: "BEEF", base_price_cents_per_kg: 1200, is_grind: true }
              as: ShiftManager
              captures: { gc_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Wanda Wholesale", phone: "555-0002", loyalty_tier: "WHOLESALE" }
              as: CounterClerk
              captures: { wc_id: "$.data.id" }
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${wc_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${gc_id}", ordered_weight_g: 8000 } ] }
              as: CounterClerk
              as_user_id: "${wc_id}"
              captures: { order_id: "$.data.id", est_total: "$.data.estimated_total_cents" }
          assert:
            - "CustomOrder.${order_id}.estimated_total_cents == 7536"

      - name: per_line_round_then_sum_ordering
        grounds:
          - calculations.estimated_line_price
          - entities.CustomOrder.fields.estimated_total_cents
          - entities.OrderLine.fields.est_line_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins ROUND-PER-LINE-THEN-SUM. Two lines each raw 200.5c round_half_up
          to 201c, summing to 402c; SUM-THEN-ROUND would give round(401.0)=401c. The order is fixed so
          estimated_total_cents == 402, distinguishing it from the 401 a sum-then-round implementation yields.
        test_recipe:
          setup:
            - "Active PricingPolicy; SPLIT_CUT CutType base 2005 c/kg, STANDARD tier (no discount)."
            - "STANDARD customer placing one STANDARD order with TWO lines each ordered 100g (raw 200.5c each)."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "SPLIT_CUT", species: "LAMB", base_price_cents_per_kg: 2005 }
              as: ShiftManager
              captures: { sc_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Sam Split", phone: "555-0003" }
              as: CounterClerk
              captures: { ss_id: "$.data.id" }
          trigger:
            - call: "POST /custom-orders"
              payload: { customer_id: "${ss_id}", order_kind: "STANDARD", lines: [ { cut_type_id: "${sc_id}", ordered_weight_g: 100 }, { cut_type_id: "${sc_id}", ordered_weight_g: 100 } ] }
              as: CounterClerk
              as_user_id: "${ss_id}"
              captures: { order_id: "$.data.id" }
          assert:
            - "CustomOrder.${order_id}.estimated_total_cents == 402"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_fork_filled_vs_short_filled_divergent_side_effects
        grounds:
          - state_machines.CustomOrder.CONFIRMED_to_FILLED
          - state_machines.CustomOrder.CONFIRMED_to_SHORT_FILLED
          - state_machines.OrderLine.PENDING_to_SHORTED
          - entities.CustomOrder.fields.final_total_cents
        distinguishing_aspect: |
          The CONFIRMED CustomOrder forks: the FILLED branch sums final_line_cents over all DRAWN lines,
          while the SHORT_FILLED branch (>=1 SHORTED + >=1 DRAWN) sums only DRAWN lines and triggers a
          deposit-overage refund — two divergent side-effect sets from one CONFIRMED state.
        test_recipe:
          setup:
            - "HOLIDAY order, 2 lines: RIBEYE 500g (est 2000c) drawn, RIBEYE 2000g (est 8000c) shorted; deposit 2500c."
            - "An AVAILABLE RIBEYE lot of 2000g, before cutoff."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "RIBEYE", species: "BEEF", base_price_cents_per_kg: 4000 }
              as: ShiftManager
              captures: { ribeye_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-19T00:00:00Z" }
              as: ShiftManager
            - call: "POST /holiday-windows"
              payload: { name: "THANKSGIVING_2026", pickup_date: "2026-11-26T00:00:00Z", capacity_g: 100000, cutoff_at: "2026-11-20T00:00:00Z" }
              as: ShiftManager
              captures: { win_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Holly Holiday", phone: "555-0004" }
              as: CounterClerk
              captures: { hh_id: "$.data.id" }
            - call: "POST /custom-orders"
              payload: { customer_id: "${hh_id}", order_kind: "HOLIDAY", holiday_window_id: "${win_id}", pickup_date: "2026-11-26T00:00:00Z", lines: [ { cut_type_id: "${ribeye_id}", ordered_weight_g: 500 }, { cut_type_id: "${ribeye_id}", ordered_weight_g: 2000 } ] }
              as: CounterClerk
              as_user_id: "${hh_id}"
              captures: { order_id: "$.data.id", dep: "$.data.deposit_cents" }
            - call: "GET /custom-orders/${order_id}/order-lines"
              payload: {}
              as: CounterClerk
              captures: { line0: "$.data[0].id", line1: "$.data[1].id" }
            - call: "POST /custom-orders/${order_id}/confirm"
              payload: {}
              as: CounterClerk
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${ribeye_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /order-lines/${line0}/draw"
              payload: { drawn_lot_id: "${lot_id}", catch_weight_g: 500, expected_inventory_lot_version: "${lot_v}" }
              as: Butcher
            - call: "POST /order-lines/${line1}/short"
              payload: {}
              as: Butcher
          trigger:
            - call: "POST /custom-orders/${order_id}/fill"
              payload: {}
              as: Butcher
              captures: { status: "$.data.order_status", final_total: "$.data.final_total_cents" }
          assert:
            - "CustomOrder.${order_id}.order_status == SHORT_FILLED"
            - "CustomOrder.${order_id}.final_total_cents == 1920"
            - "CustomOrder.${order_id}.deposit_cents == 2500"
            - "Customer.${hh_id}.store_credit_cents == 580"

      - name: animal_share_cyclic_open_fullyclaimed_open
        grounds:
          - state_machines.AnimalShare.OPEN_to_FULLY_CLAIMED
          - state_machines.AnimalShare.FULLY_CLAIMED_to_OPEN
          - state_machines.ShareClaim.ACTIVE_to_CANCELLED
          - entities.AnimalShare.fields.claimed_fraction_x4
        distinguishing_aspect: |
          AnimalShare cycles OPEN -> FULLY_CLAIMED -> OPEN: a HALF + HALF claim drives claimed_fraction_x4
          to 4 (FULLY_CLAIMED), then cancelling one HALF drops it to 2, bubbling the share back to OPEN —
          a non-linear cycle on a different entity than CustomOrder.
        test_recipe:
          setup:
            - "An OPEN AnimalShare, carcass 100000g, deposit_cents 8000, with two ACTIVE HALF claims (claimed_fraction_x4 == 4, FULLY_CLAIMED)."
          setup_api_calls:
            - call: "POST /animal-shares"
              payload: { species: "BEEF", carcass_weight_g: 100000, deposit_cents: 8000 }
              as: ShiftManager
              captures: { share_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Cathy Claim", phone: "555-0005" }
              as: CounterClerk
              captures: { c1_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Dan Claim", phone: "555-0006" }
              as: CounterClerk
              captures: { c2_id: "$.data.id" }
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c1_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c1_id}"
              captures: { claim1_id: "$.data.id" }
            - call: "POST /share-claims"
              payload: { animal_share_id: "${share_id}", customer_id: "${c2_id}", fraction: "HALF" }
              as: CounterClerk
              as_user_id: "${c2_id}"
              captures: { claim2_id: "$.data.id" }
          trigger:
            - call: "POST /share-claims/${claim2_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
            - call: "GET /animal-shares/${share_id}"
              payload: {}
              as: ShiftManager
              captures: { st: "$.data.share_status", x4: "$.data.claimed_fraction_x4" }
          assert:
            - "AnimalShare.${share_id}.share_status == OPEN"
            - "AnimalShare.${share_id}.claimed_fraction_x4 == 2"
            - "AnimalShare.${share_id}.remaining_carcass_g == 50000"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: temp_excursion_quarantine_holds_aging_lot_blocks_completion
        grounds:
          - state_machines.DryAgeLocker.OPERATIONAL_to_QUARANTINED
          - state_machines.InventoryLot.AGING_to_ON_HOLD
          - validations[priority=7]
          - entities.TempReading.fields.triggered_quarantine
        distinguishing_aspect: |
          Depth-3 cascade from one out-of-band TempReading: reading (A) flips DryAgeLocker
          OPERATIONAL -> QUARANTINED (B); that quarantine itself flips every AGING InventoryLot in the
          locker AGING -> ON_HOLD (C); the ON_HOLD lot then rejects complete-aging with ERR_LOCKER_QUARANTINED.
        test_recipe:
          setup:
            - "A DRY_RIBEYE cut (requires_dry_age); an OPERATIONAL locker band [0,4]C, capacity 20000g."
            - "An AGING DRY_RIBEYE lot of 5000g, aging_target_days 7, inside the locker."
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
              as: ShiftManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-A", capacity_g: 20000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShiftManager
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 5000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
            - call: "POST /dry-age-lockers/${locker_id}/temp-readings"
              payload: { temp_c: 9.5, reading_at: "2026-06-02T00:00:00Z" }
              as: SafetyOfficer
              captures: { tq: "$.data.triggered_quarantine" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: ShiftManager
          trigger:
            - call: "POST /inventory-lots/${lot_id}/complete-aging"
              payload: {}
              as: Butcher
              captures: { err: "$.data.error_id" }
          assert:
            - "TempReading.triggered_quarantine == true"
            - "DryAgeLocker.${locker_id}.locker_status == QUARANTINED"
            - "InventoryLot.${lot_id}.lot_status == ON_HOLD"
            - "complete-aging response error_id == ERR_LOCKER_QUARANTINED"

      - name: batch_cancel_reverts_draw_restores_lot
        grounds:
          - state_machines.SausageBatch.RESERVED_to_CANCELLED
          - state_machines.InventoryLot.AVAILABLE_to_DEPLETED
          - entities.LotDraw.fields.draw_status
          - entities.InventoryLot.fields.remaining_weight_g
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (batch cancel, not a temp reading): cancelling a RESERVED
          SausageBatch (A) flips its COMMITTED LotDraw to REVERTED (B); that reversal restores the input lot's
          remaining_weight_g and, when the lot had been DEPLETED, reverts it DEPLETED -> AVAILABLE.
        test_recipe:
          setup:
            - "A grind cut and an AVAILABLE input lot of exactly 2000g; a RESERVED batch consuming all 2000g (lot now DEPLETED)."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "PORK_TRIM", species: "PORK", base_price_cents_per_kg: 800 }
              as: ShiftManager
              captures: { trim_id: "$.data.id" }
            - call: "POST /cut-types"
              payload: { code: "GROUND_BLEND", species: "PORK", base_price_cents_per_kg: 1200, is_grind: true }
              as: ShiftManager
              captures: { blend_id: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${trim_id}", received_weight_g: 2000 }
              as: Butcher
              captures: { lot_id: "$.data.id" }
            - call: "POST /sausage-batches"
              payload: { recipe_name: "Chorizo", output_cut_type_id: "${blend_id}", planned_output_g: 1800 }
              as: Butcher
              captures: { batch_id: "$.data.id" }
            - call: "POST /sausage-batches/${batch_id}/inputs"
              payload: { inventory_lot_id: "${lot_id}", weight_g: 2000 }
              as: Butcher
            - call: "POST /sausage-batches/${batch_id}/reserve"
              payload: {}
              as: Butcher
          trigger:
            - call: "POST /sausage-batches/${batch_id}/cancel"
              payload: {}
              as: Butcher
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: Butcher
              captures: { st: "$.data.lot_status", rem: "$.data.remaining_weight_g" }
          assert:
            - "InventoryLot.${lot_id}.remaining_weight_g == 2000"
            - "InventoryLot.${lot_id}.lot_status == AVAILABLE"
            - "SausageBatch.${batch_id}.batch_status == CANCELLED"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lot_not_available_outranks_insufficient_weight
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - state_machines.OrderLine.PENDING_to_DRAWN
        distinguishing_aspect: |
          Error-category pair state (priority 6, ERR_LOT_NOT_AVAILABLE) vs business_constraint
          (priority 14, ERR_INSUFFICIENT_LOT_WEIGHT). A draw against an AGING lot for more grams than
          remain must return the higher-priority ERR_LOT_NOT_AVAILABLE, not ERR_INSUFFICIENT_LOT_WEIGHT.
        test_recipe:
          setup:
            - "A DRY_RIBEYE AGING lot of 1000g remaining inside an OPERATIONAL locker; a CONFIRMED order line for DRY_RIBEYE."
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { shrink_pct_whole_cut: 0.04, shrink_pct_grind: 0.10, preferred_discount_pct: 0.10, wholesale_discount_pct: 0.20, bulk_threshold_g: 5000, bulk_extra_discount_pct: 0.05 }
              as: ShiftManager
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
              as: ShiftManager
              captures: { dr_id: "$.data.id" }
            - call: "POST /dry-age-lockers"
              payload: { name: "LOCKER-B", capacity_g: 20000, min_temp_c: 0, max_temp_c: 4 }
              as: ShiftManager
              captures: { locker_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Pat Priority", phone: "555-0007" }
              as: CounterClerk
              captures: { pp_id: "$.data.id" }
            - call: "POST /inventory-lots"
              payload: { cut_type_id: "${dr_id}", received_weight_g: 1000, aging_target_days: 7 }
              as: Butcher
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /inventory-lots/${lot_id}/start-aging"
              payload: { locker_id: "${locker_id}" }
              as: Butcher
