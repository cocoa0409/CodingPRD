              payload: { kind: "INSURANCE_RIDER", coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-12-31T00:00:00Z", cost_cents: 500000 }
              as: WelfareOfficer
              captures: { rider_err: $.data.error_id }
