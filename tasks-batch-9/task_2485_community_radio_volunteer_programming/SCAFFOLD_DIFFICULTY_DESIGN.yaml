            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${proposal_id}", as: ProgramDirector, captures: { program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-SPRING", effective_from: "2026-01-05T00:00:00Z", effective_to: "2026-06-28T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_version: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_version}", program_id: "${program_id}", day_of_week: 1, start_minute: 1200, duration_minutes: 120 }, as: ProgramDirector, captures: { slot_id: "$.data.id" } }
            - { call: "POST /episodes", payload: { program_id: "${program_id}", slot_assignment_id: "${slot_id}", board_operator_volunteer_id: "${host_id}", scheduled_start_utc: "2026-01-05T20:00:00Z" }, as: ProgramDirector, captures: { episode_id: "$.data.id" } }
            - { call: "POST /episodes/${episode_id}/air-result", payload: { air_status: "AIRED" }, as: ProgramDirector }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 1, artist: "Half Cent", title: "Thirty A", duration_seconds: 30, play_source: "LIBRARY_CD" }, as: Volunteer, as_user_id: "${host_id}", captures: { entry1_id: "$.data.id" } }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 2, artist: "Half Cent", title: "Thirty B", duration_seconds: 30, play_source: "LIBRARY_VINYL" }, as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /episodes/${episode_id}/playlist-entries", payload: { sequence_number: 3, artist: "Half Cent", title: "Thirty C", duration_seconds: 30, play_source: "DIGITAL" }, as: Volunteer, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /episodes/${episode_id}/submit-log", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /episodes/${episode_id}/log-decision", payload: { decision: "CERTIFY" }, as: ComplianceOfficer, as_user_id: "officer-logs" }
          assert:
            - "Episode.featured_performance_count == 3, because 30 seconds is the inclusive FEATURED boundary"
            - "Episode.provisional_royalty_cents == 107 after submit-log (SURVEY sums first: 90 seconds is 97.50 cents, times 1.10 is 107.25, rounded half up)"
            - "Episode.final_royalty_cents == 99 after CERTIFY, NOT 98: each 32.5-cent spin rounds half up to 33 before the three are summed"
            - "GET /playlist-entries/${entry1_id} returns PlaylistEntry.royalty_class == FEATURED"
            - "GET /playlist-entries?episode_id=${episode_id} returns total_count == 3 with every royalty_class == FEATURED"

      - name: premium_waterfall_ranks_tier_threshold_before_fair_market_value
        grounds:
          - calculations.pledge_premium_allocation
          - entities.Pledge.fields.tax_deductible_cents
          - entities.Pledge.fields.premium_status
          - entities.PremiumItem.fields.reserved_qty
        distinguishing_aspect: |
          Mode (c), evaluation order: two premiums share the 10000-cent tier and differ only in fair market value while a third sits at the 5000-cent tier with the lowest value of all, so ranking by tier threshold before fair market value reserves MUG-01 and writes 10500 whereas the inverted order would reserve TOTE-03 and write 10800 - two different premium_item_id values and two different deductibles; the other combinatorial_formula instance is mode (b) and pins where a single rounding step sits inside a sum.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Three premiums in stock: MUG-01 (tier 10000, fmv 1500, 5 units), VINYL-02 (tier 10000, fmv 3500, 5 units), TOTE-03 (tier 5000, fmv 1200, 5 units)."
            - "One ACTIVE membership drive with four phone lines."
            - "Every premium has spare stock, so stock never decides the winner - only the ranking order does."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: DevelopmentCoordinator }
            - { call: "POST /premium-items", payload: { sku: "MUG-01", name: "Station Mug", tier_threshold_cents: 10000, fair_market_value_cents: 1500, units_received_qty: 5 }, as: DevelopmentCoordinator, captures: { mug_id: "$.data.id" } }
            - { call: "POST /premium-items", payload: { sku: "VINYL-02", name: "Benefit LP", tier_threshold_cents: 10000, fair_market_value_cents: 3500, units_received_qty: 5 }, as: DevelopmentCoordinator, captures: { vinyl_id: "$.data.id" } }
            - { call: "POST /premium-items", payload: { sku: "TOTE-03", name: "Canvas Tote", tier_threshold_cents: 5000, fair_market_value_cents: 1200, units_received_qty: 5 }, as: DevelopmentCoordinator, captures: { tote_id: "$.data.id" } }
            - { call: "POST /membership-drives", payload: { name: "Fall Drive", goal_cents: 5000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-14T23:59:00Z", phone_line_count: 4 }, as: DevelopmentCoordinator, captures: { drive_id: "$.data.id" } }
            - { call: "POST /membership-drives/${drive_id}/activate", as: DevelopmentCoordinator }
          trigger:
            - { call: "POST /pledges", payload: { drive_id: "${drive_id}", donor_name: "Marisol Vega", amount_cents: 12000, wants_premium: true }, as: DevelopmentCoordinator, captures: { pledge_id: "$.data.id", chosen_premium: "$.data.premium_item_id" } }
          assert:
            - "201 with Pledge.premium_item_id == ${mug_id}"
            - "Pledge.premium_status == RESERVED and Pledge.tax_deductible_cents == 10500 (12000 - 1500)"
            - "Pledge.tax_deductible_cents != 10800, the value the inverted ranking (fair market value before tier threshold) would produce by selecting TOTE-03"
            - "Pledge.tax_deductible_cents != 8500, the VINYL-02 answer"
            - "GET /premium-items/${mug_id} shows reserved_qty == 1, on_hand_qty == 5, shipped_qty == 0 and status == AVAILABLE"
            - "GET /premium-items/${tote_id} shows reserved_qty == 0 and GET /premium-items/${vinyl_id} shows reserved_qty == 0"
            - "GET /pledges?premium_item_id=${mug_id} returns total_count == 1"

  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_revision_cycle_re_enters_committee_then_hits_the_round_cap
        grounds:
          - state_machines.ProgramProposal.IN_COMMITTEE_to_REVISION_REQUESTED
          - state_machines.ProgramProposal.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.ProgramProposal.SUBMITTED_to_IN_COMMITTEE
          - state_machines.ProgramProposal.IN_COMMITTEE_to_DECLINED
          - calculations.proposal_composite_score
          - entities.ProgramProposal.fields.review_round
        distinguishing_aspect: |
          This instance drives a CYCLE on one state field - IN_COMMITTEE to REVISION_REQUESTED back through SUBMITTED to IN_COMMITTEE - and the second pass through numerically identical ballots produces DECLINED instead of REVISION_REQUESTED purely because the loop counter review_round advanced from 1 to 2; the other non_linear_state_machine instance drives two PARALLEL dimensions on a single Program that move independently and never re-enters any state.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Certified proposer Ada Reyes and three seated committee members."
            - "MUSIC proposal 'Night Ledger' is IN_COMMITTEE on review_round 1 with three uniform (3,4,3) REVISE ballots on file."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Night Ledger", format_code: "MUSIC", language_code: "EN", requested_daypart: "OVERNIGHT", requested_duration_minutes: 180 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Tighten the run of show." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Needs a co-host." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Revise the pitch." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { round1_version: "$.data.version" } }
          trigger:
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${round1_version}" }, as: ProgramDirector, captures: { round1_status: "$.data.status", round1_score: "$.data.composite_score" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}", captures: { resubmit_round: "$.data.review_round" } }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Still not there." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Same concerns." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 3, diversity_score: 4, quality_score: 3, recommendation: "REVISE", rationale: "Unchanged." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { round2_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${round2_version}" }, as: ProgramDirector, captures: { round2_status: "$.data.status", round2_score: "$.data.composite_score" } }
          assert:
            - "The first decide returns 200 with ProgramProposal.status == REVISION_REQUESTED, composite_score == 3.35 (0.40*3 + 0.35*4 + 0.25*3), decline_majority == false and review_round == 1"
            - "The re-submit returns 200 with ProgramProposal.status == SUBMITTED, review_round == 2 and composite_score == null - the round-1 tally is void"
            - "The second open-review returns 200 with ProgramProposal.status == IN_COMMITTEE, a state this proposal has already occupied once"
            - "All three round-2 ballots return 201: uniqueness is per member per round, so the round-1 ballots do not raise ERR_DUPLICATE_VOTE"
            - "GET /committee-votes?proposal_id=${proposal_id} returns total_count == 6, three with review_round == 1 and three with review_round == 2"
            - "The second decide returns 200 with ProgramProposal.composite_score == 3.35 again but ProgramProposal.status == DECLINED, because review_round reached the MAX_REVIEW_ROUNDS cap of 2"
            - "ProgramProposal.decline_majority == false on the declined proposal, proving the decline came from the round cap and not from the DECLINE-majority override"
            - "GET /programs?proposal_id=${proposal_id} returns total_count == 0"

      - name: program_compliance_standing_moves_independently_of_programming_status
        grounds:
          - entities.Program.fields.compliance_standing
          - entities.Program.fields.programming_status
          - state_machines.ComplianceIncident.OPEN_to_SUBSTANTIATED
          - state_machines.SlotAssignment.CONFIRMED_to_PREEMPTED
          - calculations.incident_penalty_points
        distinguishing_aspect: |
          This instance moves two PARALLEL, independent dimensions on one Program: the first substantiated incident takes compliance_standing from CLEAR to WATCH while programming_status stays ON_AIR_ACTIVE and no child row moves, and only the second crossing (6 points, the RESTRICTED threshold) reaches into the scheduling dimension's child rows while programming_status STILL reads ON_AIR_ACTIVE; the other non_linear_state_machine instance re-enters an earlier state on a single field in a counter-governed cycle.
