  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bench_half_open_windows_admit_adjacency_reject_overlap
        grounds:
          - calculations.bench_window_overlap_admission
          - entities.Bench.fields.parallel_slots
          - errors[ERR_BENCH_WINDOW_CONFLICT]
          - entities.BenchReservation.fields.window_start_at
        distinguishing_aspect: |
          Interval semantics 1, on the Bench resource: HALF-OPEN
          [window_start_at, window_end_at) with an aggregate parallel_slots
          capacity count. Exact adjacency (end == next start) is admitted
          because the intervals do not overlap, while a one-hour incursion on a
          single-slot bench is rejected with ERR_BENCH_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "A single-slot bench B-6 and three DRAFT orders that need bench time on 2026-09-05."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Northgate Mill", account_code: "NGM-014" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "CONV-04-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
