    path: "/equipment/{id}/deploy"
    description: "Deploy warehouse equipment to a polling place (-> OPERATIONAL)."
    roles: [ElectionAdmin]
    code: 200
    input: [polling_place_id]
    output: EquipmentUnit
    side_effects: ["set polling_place_id", "status IN_WAREHOUSE -> OPERATIONAL", "increments EquipmentUnit.version by 1"]

  - method: POST
    path: "/poll-workers"
    description: "Recruit a poll worker."
    roles: [ElectionAdmin]
    code: 201
    input: [full_name, email, "phone?"]
    output: PollWorker
    side_effects: []
  - method: GET
    path: "/poll-workers/{id}"
    description: "Fetch a poll worker with payroll accrual."
    roles: [ElectionAdmin, PrecinctCaptain, CustodyOfficer, SupportAgent, PollWorker]
    code: 200
    input: []
    output: PollWorker
    side_effects: []
