        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "calculations.allocation_selector", "errors[ERR_INSUFFICIENT_STAMPED_VOLUME]"]
        distinguishing_aspect: "Aggregate validation: the single eligible package (dry 5.0) is valid alone but the pool sums below the ordered 10 mbf."
