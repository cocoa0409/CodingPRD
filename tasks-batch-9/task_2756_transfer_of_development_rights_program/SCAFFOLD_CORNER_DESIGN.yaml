            - "parcel B severs 3 units -> certificate B (3 units), easement B with restricted_acres 12.00"
            - "both certificates are sold PRIVATE to the developer at the appraised reference and settled"
            - "ACTIVE RA-CORE (design_review_required false) and ACTIVE RA-NORTH whose eligible_sending_area_codes is exactly [SA-WEST]"
            - "a 2.50-acre application on RA-CORE requesting 20 units -> required_backing_units 2, backed by redemption A (1 unit from certificate A) and redemption B (2 units from certificate B)"
            - "a MAJOR_VIOLATION inspection covering all 4.00 restricted acres of easement A freezes certificate A and holds redemption A"
