    input: []
    output: Device
    side_effects: ["device.battery_pct updated per dock_charge_gain; device.dock_status -> UNDOCKED; battery_pct_at_dock/docked_at cleared; AuditLogEntry DEVICE_UNDOCKED"]

  - method: POST
    path: "/agencies/{agencyId}/devices/{deviceId}/retire"
