# ===========================================================================
# 1.9 Scaffold Corner Design - task 2783 Duty-Free Retail Operations
#
# Systematic claim-extraction sweep over SCAFFOLD.yaml SS1.1-SS1.7, following
# references/claim-extraction-guide.md section by section. Every instance is a
# corner that a plausible-but-wrong implementation would get wrong, and that is
# NOT already pinned by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners already fully
# covered by SS1.8 carry an `excluded_because:` stub instead of a test recipe.
#
# Logical clock: every recipe starts from the mandatory startup default
# 2026-08-01T00:00:00Z unless it advances the clock explicitly.
# ===========================================================================
scaffold_corner_design:

  # =====================================================================
  # SECTION 1 - From Table 1 (Entities)
  # =====================================================================
  - section: entities
    instances:
      - claim_type: system_fields_are_server_owned
        name: client_supplied_id_created_at_and_version_are_ignored_on_create
        grounds:
          - entities.Terminal
          - response_envelope
        distinguishing_aspect: |
          A POST body that smuggles id, created_at, updated_at or version MUST NOT be able to set them.
          A naive implementation that spreads the request body into the record lets a client pin its own
          id or freeze version at 0, which silently breaks every OCC guard downstream.
        test_recipe:
          setup:
            - "No entities exist"
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { iata_code: "NRT", name: "Narita Duty Free", country_code: "JP" }
              as: TerminalAdmin
              captures: { t_nrt: $.data.id }
            - call: "GET /terminals/${t_nrt}"
              as: TerminalAdmin
          assert:
            - "the create returns HTTP 201"
            - "Terminal.${t_nrt}.version == 1"
            - "Terminal.${t_nrt}.created_at == 2026-08-01T00:00:00Z"
            - "Terminal.${t_nrt}.updated_at == 2026-08-01T00:00:00Z"
            - "the response body has exactly the top-level keys data and error, with error null"
            - "GET /terminals/${t_nrt} returns the same id, created_at and version as the create response"

      - claim_type: defaults_applied
        name: terminal_defaults_sealed_bag_regime_liquid_limit_and_counters
        grounds:
          - entities.Terminal.fields.sealed_bag_regime
          - entities.Terminal.fields.liquid_limit_ml
          - entities.Terminal.fields.traveler_nationality_mix
          - entities.Terminal.fields.unaccounted_duty_liability_cents
        distinguishing_aspect: |
          Omitting the optional inputs MUST yield sealed_bag_regime ICAO_STEB and liquid_limit_ml 1000,
          and the derived counters MUST start at their zero values - traveler_nationality_mix as an EMPTY
          OBJECT, not null, and scanned_itinerary_count_30d / unaccounted_duty_liability_cents at 0.
          Implementations that leave omitted optional fields null make every later mix and liability
          computation crash or read as null.
        test_recipe:
          setup:
            - "No entities exist"
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { iata_code: "NRT", name: "Narita Duty Free", country_code: "JP" }
              as: TerminalAdmin
              captures: { t_nrt: $.data.id }
          assert:
            - "Terminal.${t_nrt}.sealed_bag_regime == ICAO_STEB"
            - "Terminal.${t_nrt}.liquid_limit_ml == 1000"
            - "Terminal.${t_nrt}.traveler_nationality_mix == {}"
            - "Terminal.${t_nrt}.scanned_itinerary_count_30d == 0"
            - "Terminal.${t_nrt}.unaccounted_duty_liability_cents == 0"

      - claim_type: defaults_applied
        name: product_and_sale_lifecycle_defaults_start_at_pending_cart_and_suspended
        grounds:
          - entities.Product.fields.assortment_status
          - entities.Product.fields.is_liquid
          - entities.Product.fields.required_nationality_share_bps
          - entities.Sale.fields.fulfillment_status
          - entities.Sale.fields.duty_status
        distinguishing_aspect: |
          A freshly created Product MUST be PENDING with is_liquid false, liquid_ml null and
          required_nationality_share_bps 1500 when omitted; a freshly created Sale MUST be CART on the
          till dimension AND SUSPENDED on the duty dimension at the same time. Implementations that
          default the Sale's duty dimension to null or to EXEMPT_CONFIRMED leak an unearned exemption.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one ACTIVE LIQUOR brand"
            - "A scanned itinerary SIN to AU departing 2026-08-25"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0101", nationality_code: "CN", boarding_pass_barcode: "BP-0101", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_101: $.data.id }
            - call: "POST /itineraries/${it_101}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0101" }
              as: SalesAssociate
          trigger:
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-RUM-700", category: "LIQUOR", unit_price_cents: 4000, duty_rate_bps: 1500, vat_rate_bps: 900, target_nationality_code: "CN" }
              as: TerminalAdmin
              captures: { p_rum: $.data.id }
            - call: "POST /sales"
              payload: { itinerary_id: "${it_101}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_101: $.data.id }
          assert:
            - "Product.${p_rum}.assortment_status == PENDING"
            - "Product.${p_rum}.is_liquid == false"
            - "Product.${p_rum}.liquid_ml == null"
            - "Product.${p_rum}.required_nationality_share_bps == 1500"
            - "Product.${p_rum}.listed_at == null"
            - "Sale.${sale_101}.fulfillment_status == CART"
            - "Sale.${sale_101}.duty_status == SUSPENDED"
            - "Sale.${sale_101}.gross_amount_cents == 0"
            - "Sale.${sale_101}.exempt_amount_cents == 0"
            - "Sale.${sale_101}.duty_liability_cents == 0"
            - "Sale.${sale_101}.eligibility_variant == null"
            - "Sale.${sale_101}.sealed_bag_required == false"
            - "Sale.${sale_101}.arrival_advisory == []"
            - "Sale.${sale_101}.terminal_id == ${t_sin}"

      - claim_type: computed_fields_ignore_client_input
        name: sale_and_stock_totals_cannot_be_set_from_the_request_body
        grounds:
          - entities.Sale.fields.gross_amount_cents
          - entities.BondedStockItem.fields.on_hand_qty
          - calculations.bonded_duty_suspended_value
        distinguishing_aspect: |
          gross_amount_cents, duty_liability_cents, on_hand_qty and duty_suspended_value_cents are
          COMPUTED. A create that supplies them MUST ignore the supplied values and derive them, so a
          brand-new BondedStockItem is 0/0/0 regardless of what the body says.
        test_recipe:
          setup:
            - "Terminal SIN in SG and one LISTED LIQUOR product"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
          trigger:
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
          assert:
            - "BondedStockItem.${si_whisky}.on_hand_qty == 0"
            - "BondedStockItem.${si_whisky}.reserved_qty == 0"
            - "BondedStockItem.${si_whisky}.available_qty == 0"
            - "BondedStockItem.${si_whisky}.duty_suspended_value_cents == 0"
            - "BondedStockItem.${si_whisky}.last_reconciled_at == null"
            - "BondedStockItem.${si_whisky}.version == 1"

      - claim_type: required_fields
        name: missing_required_inputs_are_rejected_with_invalid_request
        grounds:
          - validations[priority=45]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /products"]
        distinguishing_aspect: |
          Every field with source input and no default is REQUIRED: omitting it MUST return 422
          ERR_INVALID_REQUEST, and the rejection MUST happen at priority 45 - before any existence or
          business check, but after authentication and role checks.
        test_recipe:
          setup:
            - "One ACTIVE LIQUOR brand"
          setup_api_calls:
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-NOPRICE", category: "LIQUOR", duty_rate_bps: 1500, vat_rate_bps: 900, target_nationality_code: "CN" }
              as: TerminalAdmin
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free" }
              as: TerminalAdmin
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${b_aurora}", period_code: "2026-08" }
              as: TerminalAdmin
          assert:
            - "the product create returns HTTP 422 with error_id ERR_INVALID_REQUEST (unit_price_cents missing)"
            - "the terminal create returns HTTP 422 with error_id ERR_INVALID_REQUEST (country_code missing)"
            - "the agreement create returns HTTP 404 with error_id ERR_TERMINAL_NOT_FOUND, not 422 - the existence check at priority 30 outranks the schema check at priority 45 even though required body fields are also missing"
            - "no Product, Terminal or ConcessionAgreement is created by any of the three calls"

      - claim_type: type_constraints
        name: enum_and_numeric_range_violations_are_rejected_before_business_logic
        grounds:
          - validations[priority=45]
          - entities.Brand.fields.category
          - entities.PreOrder.fields.program
          - entities.SaleLine.fields.qty
        distinguishing_aspect: |
          Enum fields MUST reject unknown members and numeric fields MUST reject out-of-range values
          (qty >= 1, bps in [0, 10000], quantities non-negative) with 422 ERR_INVALID_REQUEST. A
          permissive implementation that stores an arbitrary category string produces a Product whose
          category can never match an AllowanceRule.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one ACTIVE LIQUOR brand, one LISTED LIQUOR product with 10 units, one scanned itinerary and a CART sale"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0102", nationality_code: "CN", boarding_pass_barcode: "BP-0102", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_102: $.data.id }
            - call: "POST /itineraries/${it_102}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0102" }
              as: SalesAssociate
            - call: "POST /sales"
              payload: { itinerary_id: "${it_102}", channel: "IN_STORE" }
              as: SalesAssociate
              captures: { sale_102: $.data.id, sale_102_v: $.data.version }
          trigger:
            - call: "POST /brands"
              payload: { name: "Bogus Brand", category: "PERFUMERY" }
              as: TerminalAdmin
            - call: "POST /sales/${sale_102}/lines"
              payload: { product_id: "${p_whisky}", qty: 0, expected_sale_version: "${sale_102_v}" }
              as: SalesAssociate
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "TELEPORT", qty_delta: 5 }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "${t_sin}", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 12000, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
          assert:
            - "the brand create returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "the line create returns HTTP 422 with error_id ERR_INVALID_REQUEST (qty must be >= 1)"
            - "the movement create returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "the agreement create returns HTTP 422 with error_id ERR_INVALID_REQUEST (rent_pct_bps must be <= 10000)"
            - "Sale.${sale_102}.version == ${sale_102_v} - a schema rejection does not consume the OCC version"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 10"

      - claim_type: not_found
        name: unknown_ids_return_the_entity_specific_not_found_error
        grounds:
          - validations[priority=30]
          - validations[priority=43]
          - errors.ERR_TERMINAL_NOT_FOUND
          - errors.ERR_AUDIT_NOT_FOUND
        distinguishing_aspect: |
          Each entity has its OWN 404 error_id; a single generic ERR_NOT_FOUND is wrong. The existence
          check MUST also fire for ids referenced in the BODY, not just the path, and MUST be reported
          with the id-specific error rather than as a schema failure.
        test_recipe:
          setup:
            - "Terminal SIN in SG exists so the well-formed calls differ only in the unknown id"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
          trigger:
            - call: "GET /terminals/00000000-0000-4000-8000-000000000001"
              as: TerminalAdmin
            - call: "GET /customs-audits/00000000-0000-4000-8000-000000000002"
              as: CustomsAuditor
            - call: "GET /sales/00000000-0000-4000-8000-000000000003"
              as: SalesAssociate
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "00000000-0000-4000-8000-000000000004" }
              as: StockController
            - call: "POST /concession-agreements"
              payload: { terminal_id: "00000000-0000-4000-8000-000000000005", period_code: "2026-08", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", rent_pct_bps: 1200, minimum_guarantee_cents: 10000 }
              as: TerminalAdmin
          assert:
            - "GET /terminals with the unknown id returns HTTP 404 with error_id ERR_TERMINAL_NOT_FOUND"
            - "GET /customs-audits with the unknown id returns HTTP 404 with error_id ERR_AUDIT_NOT_FOUND"
            - "GET /sales with the unknown id returns HTTP 404 with error_id ERR_SALE_NOT_FOUND"
            - "the stock item create returns HTTP 404 with error_id ERR_PRODUCT_NOT_FOUND"
            - "the agreement create returns HTTP 404 with error_id ERR_TERMINAL_NOT_FOUND"
            - "every error body carries a non-empty error_id and message and a null data field"

      - claim_type: immutability
        name: bonded_movement_is_append_only_with_no_version_field
        grounds:
          - entities.BondedMovement
          - state_machines.BondedMovement_append_only
        distinguishing_aspect: |
          BondedMovement declares common_fields false: rows carry id and created_at but NO updated_at
          and NO version, there is no update or delete endpoint, and correction happens only by
          appending a REVERSAL. The single mutable bit is the `reversed` flag flipped by its own
          reversal. Implementations that give the ledger a version field invite in-place edits that
          destroy the audit trail.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product, a stock item with a RECEIPT of 10"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
          trigger:
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
              captures: { mv_1: $.data.id }
            - call: "GET /bonded-movements/${mv_1}"
              as: StockController
          assert:
            - "the movement create returns HTTP 201"
            - "the BondedMovement response contains id and created_at"
            - "the BondedMovement response contains NO updated_at field and NO version field"
            - "BondedMovement.${mv_1}.reversed == false"
            - "BondedMovement.${mv_1}.reversal_of_movement_id == null"
            - "BondedMovement.${mv_1}.affects == ON_HAND"
            - "BondedMovement.${mv_1}.source_ref_type == MANUAL"
            - "BondedMovement.${mv_1}.posted_by_user_id equals the X-User-ID sent on the create"
            - "no PUT, PATCH or DELETE route exists for /bonded-movements/${mv_1}"

      - claim_type: flat_topology_foreign_key_integrity
        name: cross_reference_integrity_is_enforced_across_aggregates
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=70]
          - errors.ERR_TERMINAL_MISMATCH
          - errors.ERR_PRODUCT_CATEGORY_MISMATCH
        distinguishing_aspect: |
          The topology is FLAT, so the URLs carry no parent context and coherence must be checked
          explicitly: a Product's category MUST equal its Brand's category, and a pre-order's stock item
          MUST sit at the itinerary's departure terminal. Trusting the ids because they resolve is the
          classic flat-topology failure.
        test_recipe:
          setup:
            - "Two terminals SIN (SG) and HKG (HK)"
            - "One ACTIVE LIQUOR brand, one LISTED LIQUOR product stocked ONLY at HKG with 10 units"
            - "One itinerary departing from SIN on 2026-08-20"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /terminals"
              payload: { iata_code: "HKG", name: "Hong Kong Duty Free", country_code: "HK", sealed_bag_regime: "ICAO_STEB", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_hkg: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_hkg}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_hkg: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_hkg}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0103", nationality_code: "CN", boarding_pass_barcode: "BP-0103", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T00:00:00Z", destination_country: "AU", final_destination_country: "AU" }
              as: SalesAssociate
              captures: { it_103: $.data.id }
            - call: "GET /bonded-stock-items/${si_hkg}"
              as: StockController
              captures: { si_hkg_v: $.data.version }
          trigger:
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-CIGAR-01", category: "TOBACCO", unit_price_cents: 500, duty_rate_bps: 800, vat_rate_bps: 450, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_103}", stock_item_id: "${si_hkg}", qty: 2, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${si_hkg_v}" }
              as: Passenger
              as_user_id: "${it_103}"
          assert:
            - "the TOBACCO product create under a LIQUOR brand returns HTTP 422 with error_id ERR_PRODUCT_CATEGORY_MISMATCH"
            - "the pre-order create returns HTTP 409 with error_id ERR_TERMINAL_MISMATCH"
            - "BondedStockItem.${si_hkg}.reserved_qty == 0"
            - "BondedStockItem.${si_hkg}.version == ${si_hkg_v}"

      - claim_type: uniqueness
        name: scoped_uniqueness_keys_are_composite_not_global
        grounds:
          - validations[priority=46]
          - validations[priority=47]
          - validations[priority=48]
          - validations[priority=49]
          - validations[priority=50]
        distinguishing_aspect: |
          Each uniqueness rule has a specific SCOPE: Product.sku is unique per brand_id (so two brands
          may reuse a sku), BondedStockItem is unique per (terminal_id, product_id) (so the same product
          may be stocked at two terminals), ConcessionAgreement is unique per (terminal_id, period_code),
          and boarding_pass_barcode and seal_number are GLOBALLY unique. Implementations that make sku
          global, or the stock item key product-only, reject legitimate data.
        test_recipe:
          setup:
            - "Two terminals SIN and HKG, two ACTIVE LIQUOR brands, one product per brand sharing a sku"
          setup_api_calls:
            - call: "POST /terminals"
