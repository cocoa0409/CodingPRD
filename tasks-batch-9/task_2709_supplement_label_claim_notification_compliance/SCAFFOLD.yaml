    side_effects: ["sets notification_status = DRAFT", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/ndi-notifications/{id}"
    description: "Fetch one NDI notification including its computed waiting_period_end."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: NDINotification
    side_effects: []
  - method: GET
    path: "/supplement-compliance/ndi-notifications"
    description: "List NDI notifications, filterable by ingredient_id (FK reverse-reachability for NDINotification.ingredient_id) and notification_status."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: ["ingredient_id?", "notification_status?", "page?", "page_size?"]
    output: NDINotification[]
    side_effects: []
  - method: POST
    path: "/supplement-compliance/ndi-notifications/{id}/submit"
    description: "Submit the notification to the agency, opening the 75-day premarket waiting period on the ingredient."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: []
    output: NDINotification
    side_effects: ["sets notification_status = SUBMITTED", "sets submitted_at to the logical clock", "computes waiting_period_end = submitted_at + 75 days (calculations.ndi_waiting_period_end)", "cascades the notification's Ingredient NDI_REQUIRED -> NDI_PENDING", "increments NDINotification.version by 1"]
  - method: POST
    path: "/supplement-compliance/ndi-notifications/{id}/agency-response"
    description: "Record the agency's response to a submitted notification. response == ACKNOWLEDGE requires the 75-day waiting period to have elapsed; response == OBJECT may be recorded at any time."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: [response, "agency_objection_reason?"]
    output: NDINotification
    side_effects: ["sets notification_status = ACKNOWLEDGED | OBJECTED", "sets agency_response_at to the logical clock", "cascades the Ingredient NDI_PENDING -> NDI_ACKNOWLEDGED | NDI_OBJECTED", "on OBJECT: recomputes label_posture (calculations.product_label_posture) for every Product with an ACTIVE line on this ingredient, driving those products to FROZEN and superseding their VALIDATED/LOCKED panels", "increments NDINotification.version by 1"]
  # ---------- Product ----------
  - method: POST
    path: "/supplement-compliance/products"
    description: "Create a finished supplement product in DRAFT with label_posture OPEN and compliance_risk_index 10."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [brand_name, product_name, net_quantity_g, servings_per_container]
    output: Product
    side_effects: ["sets lifecycle_status = DRAFT", "sets label_posture = OPEN", "sets compliance_risk_index = 10 and all four risk counters to 0", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/products/{id}"
    description: "Fetch one product with its lifecycle_status, label_posture, risk counters and current version (the read a client uses to obtain expected_product_version)."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/supplement-compliance/products"
    description: "List products, filterable by lifecycle_status and label_posture."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: ["lifecycle_status?", "label_posture?", "page?", "page_size?"]
    output: Product[]
    side_effects: []
  - method: PATCH
    path: "/supplement-compliance/products/{id}"
    description: "Amend a DRAFT product's pack facts."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["brand_name?", "product_name?", "net_quantity_g?", "servings_per_container?"]
    output: Product
    side_effects: ["increments Product.version by 1"]
  - method: POST
    path: "/supplement-compliance/products/{id}/start-marketing"
    description: "Begin marketing a label-locked product, starting the 30-day post-market claim notification window for every APPROVED claim."
    roles: [ClaimApprovalOfficer]
    code: 200
    input: [marketing_start_date]
    output: Product
    side_effects: ["sets lifecycle_status = MARKETED", "sets marketing_start_date", "for every claim with substantiation_status == APPROVED and notification_status == NOT_DUE: sets notification_status = DUE and computes notification_due_date / notification_due_basis via calculations.claim_notification_due_date variant product_launch_basis", "increments Product.version by 1"]
  - method: GET
    path: "/supplement-compliance/products/{id}/risk-profile"
    description: "Computed read: the product's four risk counters, its compliance_risk_index, the escalation surcharge that produced it, its derived supplier set and its label_posture."
    roles: [RegulatoryAffairsSpecialist, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: Product
    side_effects: []
