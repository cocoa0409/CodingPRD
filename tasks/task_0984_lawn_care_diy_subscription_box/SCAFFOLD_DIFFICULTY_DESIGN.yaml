# =============================================================================
# Task 984 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every chain replays against §1.5.
# Catalog fixture shared by all instances (each instance creates its own):
#   FERT-01: FERTILIZER, list 1200, tiers 800/700/600, window 03-01..07-01,
#            conflicts [WEED], gap 14
#   WEED-01: WEED,       list 1500, tiers 1100/1000/900, window 04-01..08-01,
#            conflicts [FERTILIZER], gap 14
#   PEST-01: PEST,       list  900, tiers 500/500/500, addon flat 2500,
#            window 05-01..09-01, conflicts [], gap 14
#   SEED-A / SEED-B: SEED, tiers t1 333 / t1 555, window 03-01..07-01,
#            conflicts [], gap 14
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: plan_value_provisional_vs_committed
        grounds:
          - calculations.plan_value_calc
          - entities.PlanVersion.fields.provisional_value_cents
          - entities.PlanVersion.fields.committed_value_cents
        distinguishing_aspect: |
          PlanVersion domain: identical plan_lines yield 7800 cents under the
          provisional (list-price) variant and 7020 cents under the committed
          (ANNUAL-discount-locked) variant — two valid algorithms, different
          results on the same entity.
        test_recipe:
          setup:
            - "Catalog holds FERT-01 (list 1200) and WEED-01 (list 1500)"
            - "Customer with a 100 sqm lawn, ANALYZED soil test, and a PENDING_REVIEW plan with lines FERT-01 x4 + WEED-01 x2"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/catalog/products"
              payload: { sku: "WEED-01", name: "Weed control", category: WEED, list_price_cents: 1500, tier_t1_cents: 1100, tier_t2_cents: 1000, tier_t3_cents: 900, window_start_md: "04-01", window_end_md: "08-01", conflicting_categories: [FERTILIZER], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "pv@x.com", full_name: "PV", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 4, target_month: 4 }, { product_sku: "WEED-01", qty_units: 2, target_month: 5 } ] }
              as: Agronomist
              captures: { p_id: $.data.id, p_prov: $.data.provisional_value_cents }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${c_id}", plan_id: "${p_id}", billing_cycle: ANNUAL, auto_ship: false }
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /api/plans/${p_id}"
              as: PlatformAdmin
              captures: { p_commit: $.data.committed_value_cents, p_disc: $.data.discount_pct_locked }
          assert:
            - "plan provisional_value_cents at creation == 7800 (4x1200 + 2x1500)"
            - "captured ${p_prov} == 7800"
            - "after subscription creation: PlanVersion.${p_id}.committed_value_cents == 7020 (round_half_up(7800 x 0.90))"
            - "captured ${p_commit} == 7020 and ${p_disc} == 0.10"
            - "provisional 7800 != committed 7020 for identical plan_lines"

      - name: referral_credit_provisional_vs_qualified
        grounds:
          - calculations.referral_credit_calc
          - entities.Referral.fields.provisional_credit_cents
          - entities.Referral.fields.qualified_credit_cents
        distinguishing_aspect: |
          Referral domain (distinct from PlanVersion): the provisional variant is
          a flat 2000 cents while the qualified variant is 20% of the referee's
          first PAID invoice capped at 5000 — here 480 cents, a different result
          for the same referral.
        test_recipe:
          setup:
            - "Referrer registered (code captured); referee registered with referred_by_code"
            - "PENDING Referral exists with provisional_credit_cents 2000"
            - "Referee has an ACTIVE MONTHLY subscription and a box SHIPPED (invoice ISSUED, subtotal 2400: 3 x FERT-01 at t1 800, no early-season discount)"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "ref-r@x.com", full_name: "Referrer", climate_zone: COOL }
              as: Anonymous
              captures: { r_id: $.data.id, r_code: $.data.referral_code }
            - call: "POST /api/customers/register"
              payload: { email: "ref-e@x.com", full_name: "Referee", climate_zone: COOL, referred_by_code: "${r_code}" }
              as: Anonymous
              captures: { e_id: $.data.id }
            - call: "GET /api/referrals"
              payload: { referee_customer_id: "${e_id}" }
              as: PlatformAdmin
              captures: { ref_id: "$.data[0].id", ref_prov: "$.data[0].provisional_credit_cents"}
            - call: "POST /api/lawns"
              payload: { customer_id: "${e_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${e_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${e_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${e_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 3, target_month: 4 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${e_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${e_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${e_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { subscription_id: "${sub_id}", box_kind: SEASONAL, ship_date: "2026-06-10T00:00:00Z", delivery_window_start: "2026-06-10T00:00:00Z", delivery_window_end: "2026-06-17T00:00:00Z", lines: [ { product_sku: "FERT-01", qty_units: 3 } ] }
              as: FulfillmentOps
              captures: { box_id: $.data.id }
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: PICKING }
              as: FulfillmentOps
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: SHIPPED }
              as: FulfillmentOps
            - call: "GET /api/invoices"
              payload: { shipment_id: "${box_id}" }
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id", inv_total: "$.data[0].total_cents"}
          trigger:
            - call: "POST /api/invoices/${inv_id}/record-payment"
              payload: { outcome: SUCCEEDED }
              as: PlatformAdmin
            - call: "GET /api/referrals/${ref_id}"
              as: PlatformAdmin
              captures: { ref_status: $.data.status, ref_qual: $.data.qualified_credit_cents }
            - call: "GET /api/customers/${r_id}"
              as: PlatformAdmin
              captures: { r_balance: $.data.credit_balance_cents }
          assert:
            - "before payment: captured ${ref_prov} == 2000 (flat provisional variant)"
            - "invoice total == 2400 (captured ${inv_total})"
            - "after payment: Referral.${ref_id}.status == QUALIFIED"
            - "qualified_credit_cents == 480 (min(5000, round_half_up(0.20 x 2400))) — captured ${ref_qual}"
            - "480 != 2000: qualified variant diverges from provisional for identical referral"
            - "Referrer ${r_id}.credit_balance_cents == 480 (EARN_REFERRAL posted to referrer, not referee)"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: shipment_charge_tiered_with_discount_floor_and_addon
        grounds:
          - calculations.shipment_charge_calc
          - entities.ShipmentBox.fields.provisional_charge_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tiered rate keyed
          on lawn size (t3 at 2500 sqm), add-on flat stacking, conditional 10%
          early-season discount, nested min(25000)/max(1900) caps. Mode (a) is
          distinct from the rounding-order mode (b) of the invoice instance.
        test_recipe:
          setup:
            - "Catalog: FERT-01 t3 600, WEED-01 t3 900, PEST-01 addon flat 2500"
            - "ACTIVE subscription on a 2500 sqm (tier 3) lawn"
            - "One SCHEDULED box (lines FERT-01 x5 + WEED-01 x2, ship_date 2026-04-10 inside the early-season window)"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/catalog/products"
              payload: { sku: "WEED-01", name: "Weed control", category: WEED, list_price_cents: 1500, tier_t1_cents: 1100, tier_t2_cents: 1000, tier_t3_cents: 900, window_start_md: "04-01", window_end_md: "08-01", conflicting_categories: [FERTILIZER], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/catalog/products"
              payload: { sku: "PEST-01", name: "Grub control", category: PEST, list_price_cents: 900, tier_t1_cents: 500, tier_t2_cents: 500, tier_t3_cents: 500, add_on_flat_price_cents: 2500, window_start_md: "05-01", window_end_md: "09-01", conflicting_categories: [], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "sc@x.com", full_name: "SC", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Big", lawn_size_sqm: 2500, grass_type: MIXED, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.0, nitrogen_ppm: 18, phosphorus_ppm: 12, potassium_ppm: 70, organic_matter_pct: 2.5 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 5, target_month: 4 }, { product_sku: "WEED-01", qty_units: 2, target_month: 5 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${c_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { subscription_id: "${sub_id}", box_kind: SEASONAL, ship_date: "2026-04-10T00:00:00Z", delivery_window_start: "2026-04-10T00:00:00Z", delivery_window_end: "2026-04-17T00:00:00Z", lines: [ { product_sku: "FERT-01", qty_units: 5 }, { product_sku: "WEED-01", qty_units: 2 } ] }
              as: FulfillmentOps
              captures: { box_id: $.data.id, box_prov_before: $.data.provisional_charge_cents }
            - call: "POST /api/add-ons"
              payload: { subscription_id: "${sub_id}", add_on_sku: "PEST-01", qty_units: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ao_id: $.data.id }
          trigger:
            - call: "POST /api/add-ons/${ao_id}/confirm"
              as: Customer
              as_user_id: "${c_id}"
              captures: { ao_box: $.data.attached_shipment_id }
            - call: "GET /api/shipments/${box_id}"
              as: PlatformAdmin
              captures: { box_prov_after: $.data.provisional_charge_cents }
          assert:
            - "at creation: provisional_charge_cents == 4320 (round_half_up((5x600 + 2x900) x 0.90)) — captured ${box_prov_before}"
            - "add-on confirm attaches to the only SCHEDULED box: ${ao_box} == ${box_id}"
            - "after attach: provisional_charge_cents == 6570 (round_half_up((4800 + 2500) x 0.90)) — captured ${box_prov_after}"
            - "6570 is inside [min 1900, max 25000] so caps do not bind here"

      - name: invoice_total_per_line_rounding_order
        grounds:
          - calculations.invoice_total_calc
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-line-then-sum,
          which yields 800 cents here, whereas sum-then-round yields 799. Distinct
          mode from the tiered/threshold mode (a) of the shipment-charge instance.
        test_recipe:
          setup:
            - "Catalog: SEED-A t1 333, SEED-B t1 555 (both SEED, window 03-01..07-01, no conflicts)"
            - "ACTIVE subscription on a 100 sqm (tier 1) lawn, customer credit 0"
            - "Box lines SEED-A x1 + SEED-B x1, ship_date 2026-04-10 (early-season 10% per-line discount)"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "SEED-A", name: "Seed A", category: SEED, list_price_cents: 400, tier_t1_cents: 333, tier_t2_cents: 333, tier_t3_cents: 333, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/catalog/products"
              payload: { sku: "SEED-B", name: "Seed B", category: SEED, list_price_cents: 600, tier_t1_cents: 555, tier_t2_cents: 555, tier_t3_cents: 555, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "inv@x.com", full_name: "INV", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "SEED-A", qty_units: 1, target_month: 4 }, { product_sku: "SEED-B", qty_units: 1, target_month: 4 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${c_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { subscription_id: "${sub_id}", box_kind: SEASONAL, ship_date: "2026-04-10T00:00:00Z", delivery_window_start: "2026-04-10T00:00:00Z", delivery_window_end: "2026-04-17T00:00:00Z", lines: [ { product_sku: "SEED-A", qty_units: 1 }, { product_sku: "SEED-B", qty_units: 1 } ] }
              as: FulfillmentOps
              captures: { box_id: $.data.id }
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: PICKING }
              as: FulfillmentOps
          trigger:
            - call: "POST /api/shipments/${box_id}/advance-fulfillment"
              payload: { to_status: SHIPPED }
              as: FulfillmentOps
            - call: "GET /api/invoices"
              payload: { shipment_id: "${box_id}" }
              as: PlatformAdmin
              captures: { inv_sub: "$.data[0].subtotal_cents", inv_total: "$.data[0].total_cents", inv_credit: "$.data[0].credit_applied_cents"}
          assert:
            - "line SEED-A: round_half_up(1 x 333 x 0.90) = round_half_up(299.7) = 300"
            - "line SEED-B: round_half_up(1 x 555 x 0.90) = round_half_up(499.5) = 500"
            - "Invoice.subtotal_cents == 800 (per-line round then sum) — captured ${inv_sub}; sum-then-round would give 799"
            - "credit_applied_cents == 0 and total_cents == 800 (captured ${inv_credit}, ${inv_total})"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Subscription is cyclic: ACTIVE -> PAUSED -> ACTIVE -> PAUSED loops are
          legal and unlimited, and each loop iteration cascades HELD/SCHEDULED on
          the box — not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE subscription with one SCHEDULED box"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "pr@x.com", full_name: "PR", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 2, target_month: 4 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
            - call: "POST /api/plans/${p_id}/activate"
              payload: { expected_lawn_version: "${l_v}" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${c_id}", plan_id: "${p_id}", billing_cycle: MONTHLY, auto_ship: false }
              as: Customer
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/shipments"
              payload: { subscription_id: "${sub_id}", box_kind: SEASONAL, ship_date: "2026-06-03T00:00:00Z", delivery_window_start: "2026-06-03T00:00:00Z", delivery_window_end: "2026-06-10T00:00:00Z", lines: [ { product_sku: "FERT-01", qty_units: 2 } ] }
