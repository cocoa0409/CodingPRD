scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: local_vs_reconciled_requirement_evaluation
        grounds:
          - calculations.requirement_evaluation
          - entities.ImmunizationRecord.fields.source
        distinguishing_aspect: |
          Dual-variant divergence on the STUDENT entity domain: with one MANUAL VERIFIED
          dose and one REGISTRY_IMPORT VERIFIED dose against a 2-dose requirement, the
          LOCAL_RECORDS variant reports NOT_SATISFIED while the REGISTRY_RECONCILED variant
          reports SATISFIED for identical stored data.
        test_recipe:
          setup:
            - "Requirement MMR for grade K, doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027 (logical clock default 2026-08-01T00:00:00Z, academic year 2026-2027)"
            - "Student grade K, school SCH-A, DOB 2020-06-15, enrolled 2026-08-01"
            - "One MANUAL dose (dose_number 1, 2026-08-05) VERIFIED"
            - "One registry-side seeded dose (dose_number 2, 2026-08-06) not yet imported"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Riley Ann", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-A", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec1_id: $.data.id }
            - call: "POST /api/immunization-records/${rec1_id}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /_registry/seed-doses"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", dose_number: 2, administered_date: "2026-08-06T00:00:00Z" }
              as: RegistryCoordinator
          trigger:
            - call: "POST /api/registry-sync-runs"
              payload: { school_code: "SCH-A" }
              as: RegistryCoordinator
              captures: { imported: $.data.imported_count }
            - call: "GET /api/students/${stu_id}/compliance"
              as: DistrictHealthOfficer
              captures: { stu_status: $.data.student_status }
          assert:
            - "RegistrySyncRun.imported_count == 1"
            - "GET compliance requirements row for MMR: verified_local_doses == 1 and local_status == NOT_SATISFIED"
            - "same row: verified_reconciled_doses == 2 and reconciled_status == SATISFIED"
            - "Student.${stu_id}.status remains ENROLLED_PROVISIONAL (official transitions use LOCAL_RECORDS only)"

      - name: census_vs_ever_enrolled_rate
        grounds:
          - calculations.annual_compliance_rate
          - entities.ComplianceSnapshot.fields.rate_variant
        distinguishing_aspect: |
          Dual-variant divergence on the COMPLIANCE-SNAPSHOT reporting domain: with one
          WITHDRAWN student among three ever-enrolled, the CENSUS_DATE variant yields
          enrolled_count 2 / rate 50.0 while EVER_ENROLLED yields enrolled_count 3 /
          rate 33.3 for identical student data.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "School SCH-R grade K: student A compliant (verified dose), student B non-compliant (no doses), student C withdrawn"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Casey Abe", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-R", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /api/students/${a_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${a_v}" }
              as: HealthClerk
              captures: { a_rec: $.data.id }
            - call: "POST /api/immunization-records/${a_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students"
              payload: { legal_name: "Casey Bee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-R", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "Casey Cee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-R", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { c_id: $.data.id }
            - call: "POST /api/students/${c_id}/withdraw"
              payload: {}
              as: HealthClerk
          trigger:
            - call: "POST /api/compliance-snapshots/generate"
              payload: { school_year: "2026-2027", school_code: "SCH-R", grade: "K", census_date: "2026-10-01T00:00:00Z", rate_variant: "CENSUS_DATE" }
              as: RegistryCoordinator
              captures: { rate_census: $.data.compliance_rate, enrolled_census: $.data.enrolled_count }
            - call: "POST /api/compliance-snapshots/generate"
              payload: { school_year: "2026-2027", school_code: "SCH-R", grade: "K", census_date: "2026-10-01T00:00:00Z", rate_variant: "EVER_ENROLLED" }
              as: RegistryCoordinator
              captures: { rate_ever: $.data.compliance_rate, enrolled_ever: $.data.enrolled_count }
          assert:
            - "CENSUS_DATE snapshot: enrolled_count == 2, compliant_count == 1, compliance_rate == 50.0"
            - "EVER_ENROLLED snapshot: enrolled_count == 3, compliant_count == 1, compliance_rate == 33.3"
            - "the two variants disagree on identical underlying data (50.0 != 33.3)"

  - rule_id: combinatorial_formula
    instances:
      - name: next_dose_due_nested_max_with_outbreak_branch
        grounds:
          - calculations.next_dose_due_date
          - state_machines.ExemptionRequest.APPROVED_to_SUSPENDED_OUTBREAK
        distinguishing_aspect: |
          Combinatorial mode (a): >= 3 inputs (date_of_birth + min_age_months, enrollment_date,
          last dose + min_interval_days, current clock) interacting through nested max()/min()
          plus a conditional branch on exemption status (APPROVED -> null, SUSPENDED_OUTBREAK
          -> clamp to current clock).
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-O, DOB 2020-06-15, enrolled 2026-08-01; clock default 2026-08-01T00:00:00Z"
            - "One VERIFIED MMR dose administered 2026-08-10; then an APPROVED MMR exemption; then an ACTIVE MMR outbreak at SCH-O with clock at 2026-08-20"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Dana Oh", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-O", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "GET /api/students/${stu_id}/compliance"
              as: SchoolNurse
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-10T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec1: $.data.id }
            - call: "POST /api/immunization-records/${rec1}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://exm-1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-O", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
          trigger:
            - call: "GET /api/students/${stu_id}/compliance"
              as: SchoolNurse
              captures: { final_status: $.data.student_status }
          assert:
            - "before any dose: MMR row next_dose_due_date == 2026-08-01T00:00:00Z (max(DOB+12mo = 2021-06-15, enrollment = 2026-08-01))"
            - "after verified dose 2026-08-10: next_dose_due_date == 2026-09-07T00:00:00Z (max(base, 2026-08-10 + 28d))"
            - "after exemption APPROVED: next_dose_due_date == null"
            - "after outbreak declaration with clock 2026-08-20: exemption SUSPENDED_OUTBREAK, next_dose_due_date == 2026-08-20T00:00:00Z (min(2026-09-07, current clock)), student_status == EXCLUDED"

      - name: district_rollup_nested_rounding_order
        grounds:
          - calculations.annual_compliance_rate
        distinguishing_aspect: |
          Combinatorial mode (b): nested rounding order is pinned — each per-school rate is
          rounded to 1 decimal FIRST, then enrollment-weighted, then rounded again. With
          SCH-A 2/3 (66.7) and SCH-B 1/6 (16.7), the pinned order yields 33.4, whereas
          aggregating raw counts before rounding would yield 33.3.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027; clock default 2026-08-01"
            - "School SCH-A grade K: students a1, a2 compliant (verified dose), a3 not"
            - "School SCH-B grade K: student b1 compliant, b2..b6 not"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "A One", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-A", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /api/students/${a1_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${a1_v}" }
              as: HealthClerk
              captures: { a1_rec: $.data.id }
            - call: "POST /api/immunization-records/${a1_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students"
              payload: { legal_name: "A Two", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-A", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /api/students/${a2_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${a2_v}" }
              as: HealthClerk
              captures: { a2_rec: $.data.id }
            - call: "POST /api/immunization-records/${a2_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students"
              payload: { legal_name: "A Three", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-A", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "B One", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /api/students/${b1_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${b1_v}" }
              as: HealthClerk
              captures: { b1_rec: $.data.id }
            - call: "POST /api/immunization-records/${b1_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students"
              payload: { legal_name: "B Two", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "B Three", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "B Four", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "B Five", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "B Six", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
          trigger:
            - call: "POST /api/compliance-snapshots/district-rollup"
              payload: { school_year: "2026-2027", grade: "K" }
              as: DistrictHealthOfficer
              captures: { roll_rate: $.data.district_rate, roll_schools: $.data.schools_included, roll_enrolled: $.data.enrolled_total }
          assert:
            - "per-school rounded rates: SCH-A == 66.7 (2/3), SCH-B == 16.7 (1/6)"
            - "district_rate == 33.4 (round((66.7*3 + 16.7*6) / 9, 1) = round(33.3666..., 1))"
            - "schools_included == 2 and enrolled_total == 9"
            - "an implementation that aggregates raw counts first would report 33.3 and MUST fail this test"

  - rule_id: non_linear_state_machine
    instances:
      - name: exemption_deny_resubmit_cycle
        grounds:
          - state_machines.ExemptionRequest.DENIED_to_SUBMITTED
          - state_machines.ExemptionRequest.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Cyclic machine on ExemptionRequest: SUBMITTED -> UNDER_REVIEW -> DENIED ->
          SUBMITTED -> UNDER_REVIEW -> APPROVED completes a full revision loop, and the
          resubmit hop must clear reviewed_by_user_id / denial_reason while re-anchoring
          submitted_by_user_id.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-C, no doses; exemption submitted by nurse-1"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Em Cee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-C", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "RELIGIOUS", document_ref: "doc://exm-v1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/deny"
              payload: { denial_reason: "missing physician signature" }
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/resubmit"
              payload: { document_ref: "doc://exm-v2" }
              as: SchoolNurse
              as_user_id: "nurse-1"
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "GET /api/students/${stu_id}"
              as: SchoolNurse
              captures: { stu_status: $.data.status }
          assert:
            - "after resubmit: ExemptionRequest.status == SUBMITTED, reviewed_by_user_id == null, denial_reason == null, document_ref == doc://exm-v2"
            - "after second approve: ExemptionRequest.status == APPROVED"
            - "Student.${stu_id}.status == ENROLLED_COMPLIANT (APPROVED exemption satisfies the only requirement)"

      - name: student_exclusion_readmission_cycle
        grounds:
          - state_machines.Student.NON_COMPLIANT_to_EXCLUDED
          - state_machines.Student.EXCLUDED_to_ENROLLED_COMPLIANT
        distinguishing_aspect: |
          Cyclic machine on Student (different entity from the ExemptionRequest loop):
          ENROLLED_PROVISIONAL -> NON_COMPLIANT -> EXCLUDED -> ENROLLED_COMPLIANT via
          sweep-driven exclusion and dose-verify readmission, with the notice flipping
          ISSUED -> EXCLUSION_EFFECTIVE -> CURED along the way.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-D, enrolled 2026-08-01 (provisional_deadline 2026-08-31T00:00:00Z), no doses"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Gwen Dee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-D", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_v_mid: $.data.version, stu_status_mid: $.data.status }
          trigger:
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-09-15T00:00:00Z", expected_student_version: "${stu_v_mid}" }
              as: HealthClerk
              captures: { rec_id: $.data.id }
            - call: "POST /api/immunization-records/${rec_id}/verify"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_status_final: $.data.status }
            - call: "GET /api/students/${stu_id}/compliance-notices"
              as: DistrictHealthOfficer
              captures: { notice_status: "$.data[0].status" }
          assert:
            - "after first sweep: Student.status == NON_COMPLIANT and one INITIAL_NONCOMPLIANCE notice ISSUED with exclusion_date == 2026-09-15T00:00:00Z"
            - "after second sweep (clock == exclusion_date, inclusive boundary): Student.status == EXCLUDED and notice status == EXCLUSION_EFFECTIVE"
            - "after dose verify: Student.status == ENROLLED_COMPLIANT and notice status == CURED"

  - rule_id: transitive_cascade
    instances:
      - name: outbreak_declare_depth3_cascade
        grounds:
          - state_machines.ExemptionRequest.APPROVED_to_SUSPENDED_OUTBREAK
          - state_machines.Student.ENROLLED_COMPLIANT_to_EXCLUDED
        distinguishing_aspect: |
          Depth-3 cascade triggered by outbreak declaration: POST /api/outbreak-events
          suspends the matching APPROVED ExemptionRequest (hop 1); that suspension makes the
          student's requirement NOT_SATISFIED and flips the Student to EXCLUDED (hop 2);
          the student flip creates an OUTBREAK_EXCLUSION ComplianceNotice already in
          EXCLUSION_EFFECTIVE (hop 3). Each hop is caused by the previous mutation, not by
          the original request.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-X with an APPROVED MMR exemption (status ENROLLED_COMPLIANT)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Owen Ex", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-X", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://exm-x1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-X", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
              captures: { ob_id: $.data.id }
            - call: "GET /api/students/${stu_id}/exemption-requests"
              as: DistrictHealthOfficer
              captures: { exm_status: "$.data[0].status" }
            - call: "GET /api/students/${stu_id}"
              as: SchoolNurse
              captures: { stu_status: $.data.status }
            - call: "GET /api/students/${stu_id}/compliance-notices"
              as: DistrictHealthOfficer
              captures: { notice_status: "$.data[0].status", notice_date: "$.data[0].exclusion_date" }
          assert:
            - "hop 1: ExemptionRequest.${exm_id}.status == SUSPENDED_OUTBREAK"
            - "hop 2: Student.${stu_id}.status == EXCLUDED"
            - "hop 3: exactly one ComplianceNotice exists with notice_type == OUTBREAK_EXCLUSION, status == EXCLUSION_EFFECTIVE, and exclusion_date == issue_date (immediate exclusion)"

      - name: dose_verify_depth2_cascade
        grounds:
          - state_machines.ImmunizationRecord.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.ComplianceNotice.ISSUED_to_CURED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (dose verification, not outbreak
          declaration): verifying the record recomputes the student's evaluation and flips
          the Student NON_COMPLIANT -> ENROLLED_COMPLIANT (hop 1); the student flip cures
          the open INITIAL_NONCOMPLIANCE notice ISSUED -> CURED (hop 2).
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-E, enrolled 2026-08-01, no doses; clock advanced to 2026-09-01 and swept so student is NON_COMPLIANT with an ISSUED notice (exclusion_date 2026-09-15)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Nia Ell", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-E", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-09-01T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /api/immunization-records/${rec_id}/verify"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_status: $.data.status }
            - call: "GET /api/students/${stu_id}/compliance-notices"
              as: DistrictHealthOfficer
              captures: { notice_status: "$.data[0].status", notice_resolved: "$.data[0].resolved_at" }
          assert:
            - "hop 1: Student.${stu_id}.status == ENROLLED_COMPLIANT"
            - "hop 2: the ISSUED INITIAL_NONCOMPLIANCE notice is CURED with resolved_at == 2026-09-01T00:00:00Z (current logical clock)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_booking
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: booking into a SCHEDULED (not
          OPEN) session with a time interval that also overlaps the student's existing
          BOOKED appointment must return ERR_SESSION_NOT_OPEN, not
          ERR_APPOINTMENT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Student A school SCH-Y (no requirements configured)"
            - "Session1 school SCH-S1, 2026-09-01T09:00:00Z, 180 min, capacity 5, OPEN, with A booked 10:00-10:30"
            - "Session2 school SCH-S2, 2026-09-01T09:00:00Z, 180 min, capacity 5, left SCHEDULED (different school so the 7-day gap rule does not fire)"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Pat Why", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-S1", session_date: "2026-09-01T09:00:00Z", duration_minutes: 180, capacity: 5 }
              as: SchoolNurse
              captures: { s1_id: $.data.id }
            - call: "POST /api/clinic-sessions/${s1_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { s1_v: $.data.version }
            - call: "POST /api/clinic-sessions/${s1_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${s1_v}" }
              as: HealthClerk
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-S2", session_date: "2026-09-01T09:00:00Z", duration_minutes: 180, capacity: 5 }
              as: SchoolNurse
              captures: { s2_id: $.data.id, s2_v: $.data.version }
          trigger:
            - call: "POST /api/clinic-sessions/${s2_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:15:00Z", end_time: "2026-09-01T10:45:00Z", expected_clinic_session_version: "${s2_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_SESSION_NOT_OPEN"
            - "the equally-true temporal violation (10:15-10:45 overlaps A's 10:00-10:30 booking) is masked by the higher-priority state check"

      - name: safety_beats_constraint_on_dose_entry
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (different pair from
          the booking conflict): a dose that both violates the 28-day minimum interval AND
          duplicates an existing dose_number must return ERR_MIN_INTERVAL_VIOLATION, not
          ERR_DUPLICATE_DOSE.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-Z, DOB 2020-06-15, with MMR dose_number 1 administered 2026-08-05 already VERIFIED"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Sam Zee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Z", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec1: $.data.id }
            - call: "POST /api/immunization-records/${rec1}/verify"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_v2: $.data.version }
          trigger:
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-20T00:00:00Z", expected_student_version: "${stu_v2}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_MIN_INTERVAL_VIOLATION (2026-08-20 is 15 days after 2026-08-05, < 28)"
            - "the equally-true duplicate-dose violation (dose_number 1 already exists non-VOIDED) is masked by the higher-priority safety check"

  - rule_id: boundary_precision_check
    instances:
      - name: provisional_deadline_inclusive_boundary
        grounds:
          - calculations.timing_rules
          - state_machines.Student.ENROLLED_PROVISIONAL_to_NON_COMPLIANT
        distinguishing_aspect: |
          Boundary metric = elapsed-time threshold reached via POST /api/ops/compliance-sweep:
          the provisional window expires only when the clock is STRICTLY greater than
          provisional_deadline, so at exactly 2026-08-31T00:00:00Z the sweep is a no-op and
          at 2026-08-31T00:00:01Z it flips the student.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-B1, enrolled 2026-08-01T00:00:00Z (provisional_deadline 2026-08-31T00:00:00Z), no doses"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Uma Bee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-B1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
              captures: { expired_at_deadline: $.data.provisional_expired_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:01Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
              captures: { expired_after_deadline: $.data.provisional_expired_count }
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_status: $.data.status }
          assert:
            - "first sweep at exactly the deadline: provisional_expired_count == 0 and student remains ENROLLED_PROVISIONAL"
            - "second sweep one second later: provisional_expired_count == 1"
            - "Student.${stu_id}.status == NON_COMPLIANT with an INITIAL_NONCOMPLIANCE notice issued (exclusion_date == 2026-09-14T00:00:01Z)"

      - name: session_capacity_exact_boundary
        grounds:
          - validations[priority=9]
          - calculations.session_booked_count
        distinguishing_aspect: |
          Boundary metric = seat-count threshold reached via
          POST /api/clinic-sessions/{id}/appointments (different metric and endpoint from
          the provisional-deadline boundary): with capacity 1, booking at booked_count == 0
          (== capacity - 1) succeeds, and booking at booked_count == 1 (== capacity) is
          rejected with ERR_SESSION_FULL.
        test_recipe:
          setup:
            - "Session school SCH-C1, 2026-09-01T09:00:00Z, 120 min, capacity 1, OPEN"
            - "Students A and B, school SCH-Y, no requirements"
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C1", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 1 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/students"
              payload: { legal_name: "Ann A", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a_id: $.data.id }
            - call: "POST /api/students"
              payload: { legal_name: "Ben B", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${a_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { sess_v2: $.data.version, booked: $.data.booked_count }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${b_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:30:00Z", end_time: "2026-09-01T11:00:00Z", expected_clinic_session_version: "${sess_v2}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "first booking (booked_count 0 == capacity - 1) succeeds with 201"
            - "after first booking: ClinicSession.booked_count == 1"
            - "second booking (booked_count 1 == capacity) fails 409 with error_id == ERR_SESSION_FULL"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_requires_session_open
        grounds:
          - validations[priority=5]
          - state_machines.ClinicSession
        distinguishing_aspect: |
          Entity pair ClinicAppointment -> ClinicSession: the BOOKED creation transition on
          ClinicAppointment is guarded by the parent ClinicSession being in OPEN; a booking
          into a SCHEDULED session is rejected with ERR_SESSION_NOT_OPEN.
        test_recipe:
          setup:
            - "Session school SCH-C2, 2026-09-01T09:00:00Z, 120 min, capacity 5, left SCHEDULED"
            - "Student A school SCH-Y"
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C2", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /api/students"
              payload: { legal_name: "Cid Why", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_SESSION_NOT_OPEN"
            - "after POST /api/clinic-sessions/${sess_id}/open, the identical booking payload (with refreshed version) succeeds"

      - name: exemption_approve_blocked_by_active_outbreak
        grounds:
          - state_machines.ExemptionRequest.UNDER_REVIEW_to_APPROVED
          - errors[ERR_OUTBREAK_ACTIVE]
        distinguishing_aspect: |
          Entity pair ExemptionRequest -> OutbreakEvent (different pair from
          appointment/session): the UNDER_REVIEW -> APPROVED transition is guarded by the
          absence of an ACTIVE OutbreakEvent for the student's (school_code, vaccine_code);
          approving during an active outbreak is rejected with ERR_OUTBREAK_ACTIVE.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-X2 with an MMR exemption request UNDER_REVIEW"
            - "ACTIVE OutbreakEvent for (SCH-X2, MMR) — no APPROVED exemptions exist, so the declaration cascade touches nothing"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Ola Ex", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-X2", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "RELIGIOUS", document_ref: "doc://exm-x2" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-X2", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_OUTBREAK_ACTIVE"
            - "ExemptionRequest.${exm_id} remains UNDER_REVIEW"

  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_overlap_adjacency
        grounds:
          - validations[priority=7]
          - entities.ClinicAppointment.fields.start_time
        distinguishing_aspect: |
          Interval semantics = strict half-open overlap on the resource 'student appointment
          timeline': [10:00,10:30) and [10:30,11:00) touch but do NOT overlap (adjacency
          allowed), while [10:15,10:45) overlaps [10:00,10:30) and is rejected with
          ERR_APPOINTMENT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Session school SCH-C3, 2026-09-01T09:00:00Z, 240 min, capacity 10, OPEN"
            - "Student A school SCH-Y with a BOOKED appointment 10:00-10:30"
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C3", session_date: "2026-09-01T09:00:00Z", duration_minutes: 240, capacity: 10 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/students"
              payload: { legal_name: "Hal Why", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
          trigger:
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { v2: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:30:00Z", end_time: "2026-09-01T11:00:00Z", expected_clinic_session_version: "${v2}" }
              as: HealthClerk
              captures: { appt2: $.data.id }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { v3: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:15:00Z", end_time: "2026-09-01T10:45:00Z", expected_clinic_session_version: "${v3}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "adjacent booking 10:30-11:00 succeeds with 201 (end == start is not an overlap)"
            - "overlapping booking 10:15-10:45 fails 409 with error_id == ERR_APPOINTMENT_TIME_CONFLICT"
            - "ClinicSession.booked_count == 2 after the three attempts"

      - name: session_minimum_gap_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_SESSION_GAP_VIOLATION]
        distinguishing_aspect: |
          Different interval semantics on a different resource ('school session calendar'):
          not interval overlap but a minimum-gap buffer — two non-CANCELLED sessions for the
          same school_code must be >= 7 days apart, so 4 days apart is rejected
          (ERR_SESSION_GAP_VIOLATION) while exactly 7 days apart is accepted.
        test_recipe:
          setup:
            - "Existing session at SCH-C4 on 2026-09-01T09:00:00Z"
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C4", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C4", session_date: "2026-09-05T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { err: $.data.error_id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C4", session_date: "2026-09-08T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { s3: $.data.id }
          assert:
            - "session 4 days later: 409 with error_id == ERR_SESSION_GAP_VIOLATION"
            - "session exactly 7 days later: 201 created (gap of exactly MIN_SESSION_GAP_DAYS is allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: book_cancel_seat_conservation
        grounds:
          - calculations.session_booked_count
          - state_machines.ClinicAppointment.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = session seat occupancy: the forward action (book) paired with
          its compensating action (cancel) leaves ClinicSession.booked_count identical to its
          pre-pair value, and booked_count always equals the count of BOOKED appointments.
        test_recipe:
          setup:
            - "Session school SCH-C5, 2026-09-01T09:00:00Z, 120 min, capacity 3, OPEN, booked_count 0"
            - "Student A school SCH-Y"
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C5", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 3 }
              as: SchoolNurse
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/students"
              payload: { legal_name: "Ivy Why", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { booked_pre: $.data.booked_count, v_pre: $.data.version }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${v_pre}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { booked_mid: $.data.booked_count }
            - call: "POST /api/clinic-appointments/${appt_id}/cancel"
              payload: {}
              as: HealthClerk
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { booked_post: $.data.booked_count }
            - call: "GET /api/clinic-sessions/${sess_id}/appointments?status=BOOKED"
              as: SchoolNurse
          assert:
            - "booked_pre == 0, booked_mid == 1, booked_post == 0 (pair leaves the seat counter unchanged)"
            - "after cancel, GET appointments?status=BOOKED returns total_count == 0, i.e. booked_count == |BOOKED appointments| holds at every step"

      - name: exclude_readmit_roster_conservation
        grounds:
          - state_machines.Student.NON_COMPLIANT_to_EXCLUDED
          - state_machines.Student.EXCLUDED_to_ENROLLED_COMPLIANT
        distinguishing_aspect: |
          Different conserved quantity = school roster membership: the exclusion sweep paired
          with dose-verify readmission leaves count(Student where school_code == SCH-R2 and
          status != WITHDRAWN) unchanged at 2 — exclusion is a posture change, never a
          membership change.
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "School SCH-R2 grade K: student A deficient (no doses), student B compliant (verified dose)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Raj Ay", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-R2", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a_id: $.data.id }
            - call: "POST /api/students"
              payload: { legal_name: "Raj Bee", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-R2", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /api/students/${b_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${b_v}" }
              as: HealthClerk
              captures: { b_rec: $.data.id }
            - call: "POST /api/immunization-records/${b_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/students?school_code=SCH-R2"
              as: DistrictHealthOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
          trigger:
            - call: "GET /api/students?school_code=SCH-R2"
              as: DistrictHealthOfficer
            - call: "GET /api/students/${a_id}"
              as: HealthClerk
              captures: { a_status_mid: $.data.status, a_v_mid: $.data.version }
            - call: "POST /api/students/${a_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-09-15T00:00:00Z", expected_student_version: "${a_v_mid}" }
              as: HealthClerk
              captures: { a_rec: $.data.id }
            - call: "POST /api/immunization-records/${a_rec}/verify"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/students?school_code=SCH-R2"
              as: DistrictHealthOfficer
            - call: "GET /api/students/${a_id}"
              as: HealthClerk
              captures: { a_status_final: $.data.status }
          assert:
            - "baseline GET /api/students?school_code=SCH-R2 total_count == 2"
            - "after the two sweeps: A.status == EXCLUDED, B.status == ENROLLED_COMPLIANT, roster total_count still == 2"
            - "after A's dose verify (readmission): A.status == ENROLLED_COMPLIANT and roster total_count still == 2"
            - "invariant: |{s : s.school_code == SCH-R2 AND s.status != WITHDRAWN}| == 2 before, during, and after the exclude+readmit pair"
