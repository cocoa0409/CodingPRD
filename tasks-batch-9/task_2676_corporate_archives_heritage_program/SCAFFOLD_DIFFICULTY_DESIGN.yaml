  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exhibit_loan_half_open_window_plus_light_recovery_buffer_on_item
        grounds:
          - calculations.exhibit_loan_window_conflict
          - validations[priority=44]
          - errors.ERR_LOAN_WINDOW_CONFLICT
          - entities.ExhibitLoan.fields.recovery_until
        distinguishing_aspect: |
          Resource: the ArchivalItem. Interval semantics: HALF-OPEN
          [window_start, window_end) with an ASYMMETRIC 45-day light-recovery buffer
          appended to the end of every existing loan, and rejection is PAIRWISE — one
          collision is fatal. Three candidates pin the geometry: a window whose display
          dates are entirely after the incumbent's still collides because it falls inside
          the buffer; a window that ends exactly where the incumbent starts is accepted
          (half-open, no front buffer); a window starting exactly at
          recovery_until is accepted (strict <). The partner instance uses CLOSED
          intervals with aggregate counting on a StorageZone instead.
        test_recipe:
          setup:
            - "One ACCESSIONED ArchivalItem with unit_count 5 and condition_grade GOOD."
            - "Incumbent loan L1 on that item for 1 unit, window [2026-09-01T00:00:00Z, 2026-09-30T00:00:00Z), left in REQUESTED so it still occupies the item; recovery_until is 2026-09-30 + 45 days == 2026-11-14T00:00:00Z."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "OVL-01", retention_years: 16, disposition_action: "REVIEW", legal_citation: "Exhibit Loan Policy 8.2", min_appraisal_score_for_permanent: 67.00 }
