  - rule_id: transitive_cascade
    instances:
      - name: incident_suspension_cascade_depth4
        grounds:
          - state_machines.SafetyIncident.REPORTED_to_RESOLVED
          - state_machines.FixerProfile.ACTIVE_to_SUSPENDED
          - state_machines.FixerShift.CHECKED_IN_to_CANCELLED
          - state_machines.Station.OPEN_to_PAUSED
        distinguishing_aspect: |
          Trigger = incident resolve (SUSPENSION). Chain: incident RESOLVED mutates
          FixerProfile (hop 1: SUSPENDED); suspension itself cancels the fixer's
          CHECKED_IN shift (hop 2); that shift cancellation decrements the station seat
          count (hop 3); the count hitting 0 auto-pauses the Station (hop 4). Also the
          fixer's IN_REPAIR item returns to QUEUED. Each hop is caused by the previous
          hop, not by the resolve call directly.
        test_recipe:
          setup:
            - "Event INTAKE_OPEN; station OPEN; fixer F CHECKED_IN with item IN_REPAIR"
            - "HIGH incident reported by Coordinator against fixer F and the item"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Eta", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Drill sparks", weight_kg_estimated: 2.0 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 4, estimated_difficulty: 2, diagnosis: "brushes", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/repair-items/${it}/start-repair", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/safety-incidents", payload: { event_id: "${ev}", item_id: "${it}", fixer_id: "${fx}", severity: "HIGH", description: "shock from drill" }, as: Coordinator, as_user_id: "coord-1", captures: { inc: $.data.id } }
          trigger:
            - { call: "POST /api/safety-incidents/${inc}/resolve", payload: { resolution_action: "SUSPENSION" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /api/fixer-profiles/${fx}", as: Coordinator }
            - { call: "GET /api/fixer-shifts/${sh}", as: Coordinator }
            - { call: "GET /api/stations/${st}", as: Coordinator }
            - { call: "GET /api/repair-items/${it}", as: Coordinator }
          assert:
            - "FixerProfile.${fx}.status == SUSPENDED (hop 1)"
            - "FixerShift.${sh}.status == CANCELLED (hop 2)"
            - "Station.${st}.checked_in_fixer_count == 0 (hop 3) AND Station.${st}.status == PAUSED (hop 4, auto)"
            - "RepairItem.${it}.status == QUEUED with assigned_fixer_id == null (item cascade from the same suspension)"
      - name: event_cancel_cascade_depth3
        grounds:
          - state_machines.RepairEvent.INTAKE_OPEN_to_CANCELLED
          - state_machines.RepairItem.QUEUED_to_WITHDRAWN
          - state_machines.PartReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Different trigger from the incident cascade: event CANCEL mutates items (hop 1:
          non-terminal items WITHDRAWN); each item withdrawal itself releases its RESERVED
          PartReservations (hop 2); each release recomputes PartStock.quantity_reserved
          (hop 3). Reserved-then-released stock MUST return to its exact pre-reservation
          quantities.
        test_recipe:
          setup:
            - "Event INTAKE_OPEN; item ASSIGNED to fixer F; PartStock on_hand 5; reservation of 2 units RESERVED on the item"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Theta", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fx: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fx}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
            - { call: "POST /api/fixer-shifts", payload: { fixer_id: "${fx}", station_id: "${st}", event_id: "${ev}", start_time: "2026-06-01T08:00:00Z", end_time: "2026-06-01T12:00:00Z" }, as: Coordinator, captures: { sh: $.data.id } }
            - { call: "POST /api/repair-events/${ev}/publish", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/confirm", as: Coordinator }
            - { call: "POST /api/fixer-shifts/${sh}/check-in", as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/stations/${st}/open", as: Coordinator }
            - { call: "POST /api/repair-events/${ev}/open-intake", as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "Visitor One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { vs: $.data.id } }
            - { call: "POST /api/waivers", payload: { visitor_id: "${vs}", safety_clause_accepted: true }, as: IntakeVolunteer }
            - { call: "POST /api/repair-items", payload: { event_id: "${ev}", visitor_id: "${vs}", category: "ELECTRONICS", description: "Kettle", weight_kg_estimated: 1.5 }, as: IntakeVolunteer, captures: { it: $.data.id, itv: $.data.version } }
            - { call: "POST /api/repair-items/${it}/triage-records", payload: { severity: 3, estimated_difficulty: 2, diagnosis: "element", expected_item_version: "${itv}" }, as: Fixer, as_user_id: "${fx}" }
            - { call: "POST /api/repair-items/${it}/enqueue", as: Coordinator }
            - { call: "POST /api/repair-items/${it}/assign", payload: {}, as: Coordinator }
            - { call: "POST /api/part-stocks", payload: { sku: "ELT-2KW", name: "2kW element", category: "ELECTRONICS", unit_cost_cents: 900, quantity_on_hand: 5 }, as: Coordinator, captures: { stk: $.data.id } }
            - { call: "POST /api/part-reservations", payload: { part_stock_id: "${stk}", repair_item_id: "${it}", quantity: 2 }, as: Fixer, as_user_id: "${fx}", captures: { rs: $.data.id } }
          trigger:
            - { call: "POST /api/repair-events/${ev}/cancel", as: Coordinator }
            - { call: "GET /api/repair-items/${it}", as: Coordinator }
            - { call: "GET /api/part-reservations/${rs}", as: Coordinator }
            - { call: "GET /api/part-stocks/${stk}", as: Coordinator }
            - { call: "GET /api/stations/${st}", as: Coordinator }
            - { call: "GET /api/fixer-shifts/${sh}", as: Coordinator }
          assert:
            - "RepairItem.${it}.status == WITHDRAWN (hop 1)"
            - "PartReservation.${rs}.status == RELEASED (hop 2, caused by the withdrawal)"
            - "PartStock.${stk}.quantity_reserved == 0 AND quantity_on_hand == 5 (hop 3; reserve+release conserved on_hand)"
            - "Station.${st}.status == CLOSED and FixerShift.${sh}.status == CANCELLED (parallel branches of the same cascade)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: intake_state_beats_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair state-vs-business_safety: the intake request violates BOTH the
          event-phase state rule (event merely PUBLISHED) AND the waiver safety rule
          (hazard item, no waiver at all) — priority 4 state MUST win with
          ERR_EVENT_NOT_ACCEPTING_INTAKE.
        test_recipe:
          setup: ["Event PUBLISHED (intake never opened); visitor with NO waiver; hazard item intake attempted"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Iota", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T16:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator }
