              captures: { srb: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${srb}", name: "BIN-RB", vessel_kind: "BIN", capacity_tons: 50, material_name: "salt", reorder_point_pct: 30 }
              as: ServiceManager
