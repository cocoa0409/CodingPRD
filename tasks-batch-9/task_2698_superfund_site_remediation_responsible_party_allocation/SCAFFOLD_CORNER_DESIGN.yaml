        excluded_because:
          difficulty_instance: transitive_cascade / not_protective_five_year_review_cascades_three_hops_into_cost_posture
          rationale: "That instance completes construction, runs a review and asserts the re-chained due date alongside the cascade."

  - section: validations
    instances:

      - name: corner_allocation_weights_that_miss_10000_by_one_bp_return_4XX
        claim_type: violation_error
        grounds:
          - validations[priority=31]
          - errors[ERR_WEIGHTS_NOT_NORMALIZED]
          - endpoints[POST /sites/{id}/allocation-rounds]
        distinguishing_aspect: "The weight triple must total exactly 10000: 5000 + 3000 + 1999 is refused with 422 ERR_WEIGHTS_NOT_NORMALIZED at priority 31, ahead of the priority-32 no-basis rule that this party-less site would also violate."
        test_recipe:
          setup:
            - "Site LISTED with an RI/FS opened but no PRP rows at all, so the round would also have no allocation basis."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Kettle Bluff Landfill", epa_region: 7, hrs_score: 36.80 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-KBL-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 landfill gas and leachate", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 1999, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with $.data.error_id == ERR_WEIGHTS_NOT_NORMALIZED"
            - "$.data.error_id != ERR_NO_ALLOCATION_BASIS - priority 31 answers before priority 32"
            - "no AllocationRound row exists for ${site_id} and Site.${site_id}.version == ${site_v}"

      - name: corner_unknown_site_outranks_unknown_prp_returns_4XX
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_PRP_NOT_FOUND]
          - endpoints[POST /sites/{id}/waste-in-records]
        distinguishing_aspect: "Path-parameter existence (priority 4) is checked before payload-reference existence (priority 5): a waste-in create naming an unknown site AND an unknown prp_id reports ERR_SITE_NOT_FOUND, never ERR_PRP_NOT_FOUND."
        test_recipe:
          setup:
            - "One real LISTED site exists so the failure cannot be blamed on an empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-04T08:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Ivy Shoals Foundry", epa_region: 4, hrs_score: 44.00 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-ISF-0104" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          trigger:
            - call: "POST /sites/6b1f2c47-0000-4000-8000-000000000abc/waste-in-records"
              payload: { prp_id: "6b1f2c47-0000-4000-8000-000000000def", volume_tons: 50, toxicity_class: "III", evidence_grade: "C", disposal_year: 1981 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with $.data.error_id == ERR_SITE_NOT_FOUND"
            - "$.data.error_id != ERR_PRP_NOT_FOUND even though the prp_id is equally unknown"
            - "no WasteInRecord row was created and Site.${site_id}.verified_waste_volume_tons == 0"

