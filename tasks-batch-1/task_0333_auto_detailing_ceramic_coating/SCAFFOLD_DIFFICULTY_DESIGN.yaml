        distinguishing_aspect: >
          Category pair business_referential (priority 9, ERR_STALE_BAY_VERSION) vs business_temporal
          (priority 11, ERR_BAY_TIME_CONFLICT): a booking that is BOTH stale-versioned AND time-conflicting
          returns ERR_STALE_BAY_VERSION because 9 < 11.
        test_recipe:
          setup:
            - "Bay B7 (ceramic) with an existing CERAMIC appointment occupying 2026-06-15T08:00..2026-06-16T12:45."
            - "Bay version bumped (set-status) AFTER the client captured an older bay version."
