      - name: claim_approval_cascades_through_reserve_ledger_into_coverage_grace
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.ConnectedUnit.ACTIVE_to_GRACE
          - entities.ConnectedUnit.fields.reserve_balance_cents
          - entities.ConnectedUnit.fields.grace_expires_on
          - constants.GRACE_PERIOD_DAYS
        distinguishing_aspect: |
          A shorter, arithmetic-gated cascade on an entirely different aggregate from the listing
          cascade: the third hop fires only because the computed payout exactly EXHAUSTS the
          reserve (adjudicated_amount_cents 100000 == reserve_balance_cents 100000 -> balance 0),
          so coverage flips ACTIVE -> GRACE and stamps grace_expires_on = clock + 30 days. A payout
          one cent smaller would leave the unit ACTIVE, which is what makes this a conditional
          cascade rather than an unconditional one.
