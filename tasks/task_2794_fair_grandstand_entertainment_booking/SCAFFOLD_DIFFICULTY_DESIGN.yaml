          This dual variant lives in a different entity domain from the payout variant: it
          is a reputation score written onto Artist, not money written onto Settlement. Two
          editions with identical shows, identical 1800-of-2000 sell-through and identical
          settlements rescore the same base_draw_score 62.50 to 73.50 under
          ATTENDANCE_WEIGHTED but 32.74 under REVENUE_WEIGHTED.
