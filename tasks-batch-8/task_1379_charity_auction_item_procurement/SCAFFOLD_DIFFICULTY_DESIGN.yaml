            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Table", description: "Pine", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Furniture" }, as: CatalogManager, captures: { bd: "$.data.id" } }
          trigger:
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager, captures: { err_id: "$.data.error_id" } }
          assert:
            - "Item.${it}.status == RECEIVED at trigger time"
            - "error_id == ERR_ITEM_NOT_VALUED (Bundle attach gated on sibling Item state)"

      - name: reconcile_gated_on_open_invoices
        grounds:
          - state_machines.GalaEvent.SETTLEMENT_to_RECONCILED
          - errors[ERR_RECONCILE_BLOCKED]
        distinguishing_aspect: |
          Pair GalaEvent -> Invoice: the event's SETTLEMENT -> RECONCILED transition
          is blocked because a child Invoice is still UNPAID — the parent transition
          reads aggregate child state.
        test_recipe:
          setup:
            - "Event advanced to SETTLEMENT with one sold bundle whose invoice remains UNPAID (winning bid 50000 never paid)"
          setup_api_calls:
