            - "ConcussionCase.${case_id}.monitoring_status == ACTIVE_SYMPTOM_WATCH"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_case_state_error_precedes_stage_sequence_error
        grounds:
          - validations.priority_11_ERR_CASE_STAGE_FROZEN
          - validations.priority_32_ERR_STAGE_SEQUENCE_VIOLATION
          - errors.ERR_CASE_STAGE_FROZEN
          - errors.ERR_STAGE_SEQUENCE_VIOLATION
        distinguishing_aspect: |
          One call violates BOTH the priority-11 state rule (the case is STAGE_FROZEN because its club
          is SANCTIONED) and the priority-32 business_constraint rule (stage_index 3 while rtp_stage is
          1), and the response must be ERR_CASE_STAGE_FROZEN (409) - never
          ERR_STAGE_SEQUENCE_VIOLATION - pairing the state category against business_constraint.
        test_recipe:
          setup:
            - "The canonical case with stage 1 passed (rtp_stage 1, case_status RTP_IN_PROGRESS)"
            - "An audit FINDINGS_ISSUED for UNAUTHORIZED_SAME_GAME_RETURN + MISSING_INC_CLEARANCE, driving the club to compliance_score 55, TIER_3, SANCTIONED, which freezes the case"
            - "Logical clock 2026-09-17T12:00:00Z, so the stage-2 rest buffer has already elapsed and cannot be the reason for a rejection"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - &c_audit_open_sanction
              call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit_id: $.data.id }
            - &c_findings_sanction
              call: "POST /concussion-program/protocol-audits/${audit_id}/findings"
              payload: { violation_codes: ["UNAUTHORIZED_SAME_GAME_RETURN", "MISSING_INC_CLEARANCE"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - *c_clock_0917
          trigger:
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 3 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "response status 409 with error_id ERR_CASE_STAGE_FROZEN"
            - "the response error_id is NOT ERR_STAGE_SEQUENCE_VIOLATION and NOT ERR_CASE_STATE_INVALID"
            - "Club.${club_h_id}.status == SANCTIONED and Club.${club_h_id}.compliance_score == 55"
            - "ConcussionCase.${case_id}.case_status == STAGE_FROZEN and ConcussionCase.${case_id}.rtp_stage == 1"
            - "GET /concussion-program/return-steps?case_id=${case_id} still returns total_count 1"

      - name: findings_segregation_of_duties_error_precedes_fine_cap_error
        grounds:
          - validations.priority_18_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_46_ERR_CLUB_FINE_CAP_EXCEEDED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_CLUB_FINE_CAP_EXCEEDED
        distinguishing_aspect: |
          A single findings call violates the priority-18 business_safety rule (the issuing auditor is
          the auditor who opened the audit) and the priority-46 business_fiscal rule (30000000 on top of
          132142857 breaches the 150000000 season cap); the response must be
          ERR_SEGREGATION_OF_DUTIES, and re-issuing as a different auditor then proves the cap rule was
          genuinely live by returning ERR_CLUB_FINE_CAP_EXCEEDED - a business_safety vs business_fiscal
          pair, distinct from the state vs business_constraint pair.
        test_recipe:
          setup:
            - "One club, no case"
            - "A first audit FINDINGS_ISSUED for UNAUTHORIZED_SAME_GAME_RETURN with exposure_days 30, fine 132142857, leaving compliance_score 75, TIER_1, PROBATION"
            - "A second audit opened by auditor-a and still OPEN"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit1_id: $.data.id }
            - call: "POST /concussion-program/protocol-audits/${audit1_id}/findings"
              payload: { violation_codes: ["UNAUTHORIZED_SAME_GAME_RETURN"], exposure_days: 30 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
              captures: { audit2_id: $.data.id }
          trigger:
            - call: "POST /concussion-program/protocol-audits/${audit2_id}/findings"
              payload: { violation_codes: ["MISSING_INC_CLEARANCE"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-a"
            - call: "POST /concussion-program/protocol-audits/${audit2_id}/findings"
              payload: { violation_codes: ["MISSING_INC_CLEARANCE"], exposure_days: 0 }
              as: LeagueAuditor
              as_user_id: "auditor-b"
          assert:
            - "ProtocolAudit.${audit1_id}.assessed_fine_cents == 132142857"
            - "Club.${club_h_id}.compliance_score == 75 and Club.${club_h_id}.escalation_tier == TIER_1"
            - "first trigger: response status 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "first trigger: the response error_id is NOT ERR_CLUB_FINE_CAP_EXCEEDED"
            - "second trigger: response status 409 with error_id ERR_CLUB_FINE_CAP_EXCEEDED"
            - "after both triggers: ProtocolAudit.${audit2_id}.status == OPEN and assessed_fine_cents == 0"
            - "after both triggers: Club.${club_h_id}.outstanding_fine_cents == 132142857"

  - rule_id: boundary_precision_check
    instances:
      - name: stage_pass_symptom_score_at_recurrence_threshold_boundary
        grounds:
          - validations.priority_39_ERR_SYMPTOM_OUTCOME_MISMATCH
          - calculations.case_severity_index.constants.SYMPTOM_RECURRENCE_THRESHOLD
          - state_machines.ReturnStep.IN_PROGRESS_to_PASSED
          - endpoints.POST_return-steps_id_evaluate
        distinguishing_aspect: |
          On POST /return-steps/{id}/evaluate the integer metric symptom_score is checked against
          SYMPTOM_RECURRENCE_THRESHOLD = 4 with a strict-less-than for PASS: score 4 with outcome PASS
          is rejected, score 3 with outcome PASS succeeds, and score 3 with outcome SYMPTOM_RECURRENCE
          is also rejected, proving the boundary belongs to the recurrence side.
        test_recipe:
          setup:
            - "The canonical case with stage 1 IN_PROGRESS since 2026-09-15T12:00:00Z"
            - "Logical clock 2026-09-16T12:00:00Z so the 24-hour dwell is exactly satisfied and cannot mask the boundary"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
          trigger:
            - call: "POST /concussion-program/return-steps/${step1_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 4 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/return-steps/${step1_id}/evaluate"
              payload: { outcome: "SYMPTOM_RECURRENCE", symptom_score: 3 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/return-steps/${step1_id}/evaluate"
              payload: { outcome: "PASS", symptom_score: 3 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "trigger 1 (PASS with 4): response status 422 with error_id ERR_SYMPTOM_OUTCOME_MISMATCH"
            - "trigger 2 (SYMPTOM_RECURRENCE with 3): response status 422 with error_id ERR_SYMPTOM_OUTCOME_MISMATCH"
            - "after triggers 1 and 2: ReturnStep.${step1_id}.status == IN_PROGRESS and ConcussionCase.${case_id}.rtp_stage == 0"
            - "trigger 3 (PASS with 3): response status 200, ReturnStep.${step1_id}.status == PASSED, symptom_score_at_evaluation == 3"
            - "after trigger 3: ConcussionCase.${case_id}.rtp_stage == 1 and recurrence_count == 0"

      - name: inc_clearance_request_empty_versus_partial_step_collection
        grounds:
          - validations.priority_34_ERR_NO_RETURN_STEPS_RECORDED
          - validations.priority_35_ERR_RTP_STAGES_INCOMPLETE
          - concurrency_rules.inc-clearance-create-supersedes-pending
          - endpoints.POST_concussion-cases_id_inc-clearances
        distinguishing_aspect: |
          The metric here is collection cardinality, not a numeric score, and the endpoint is
          POST /concussion-cases/{id}/inc-clearances: exactly zero ReturnSteps yields
          ERR_NO_RETURN_STEPS_RECORDED while one-or-more-but-fewer-than-five yields
          ERR_RTP_STAGES_INCOMPLETE, so the empty collection is not silently folded into the
          partial-progress branch.
        test_recipe:
          setup:
            - "The canonical diagnosed case with zero ReturnSteps (case_status MANDATORY_REMOVAL)"
            - "The case version read back so the OCC token is a bound variable"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_get_case_v
          trigger:
            - call: "POST /concussion-program/concussion-cases/${case_id}/inc-clearances"
              payload: { inc_clinician_id: "${inc_id}", expected_case_version: "${case_v}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - call: "GET /concussion-program/concussion-cases/${case_id}"
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { case_v2: $.data.version }
            - call: "POST /concussion-program/concussion-cases/${case_id}/inc-clearances"
              payload: { inc_clinician_id: "${inc_id}", expected_case_version: "${case_v2}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "zero-step trigger: response status 422 with error_id ERR_NO_RETURN_STEPS_RECORDED"
            - "zero-step trigger: the response error_id is NOT ERR_RTP_STAGES_INCOMPLETE"
            - "one-step trigger: response status 422 with error_id ERR_RTP_STAGES_INCOMPLETE"
            - "after both triggers: no IncClearance rows exist for ${case_id} and ConcussionCase.${case_id}.case_status == RTP_IN_PROGRESS"
            - "after both triggers: ConcussionCase.${case_id}.rtp_stage == 1"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_stage_write_depends_on_club_sanction_posture
        grounds:
          - state_machines.ConcussionCase.RTP_IN_PROGRESS_to_STAGE_FROZEN
          - state_machines.ConcussionCase.STAGE_FROZEN_to_RTP_IN_PROGRESS
          - state_machines.Club.SANCTIONED_to_ACTIVE
          - validations.priority_11_ERR_CASE_STAGE_FROZEN
        distinguishing_aspect: |
          The ConcussionCase-Club pair: an identical, otherwise-legal stage-2 start is refused while
          the club is SANCTIONED and succeeds unchanged once the audit is closed DISMISSED and the club
          returns to ACTIVE, so the case's writability is a pure function of another entity's state.
        test_recipe:
          setup:
            - "The canonical case with stage 1 passed at 2026-09-16T12:00:00Z (rtp_stage 1)"
            - "An audit FINDINGS_ISSUED for UNAUTHORIZED_SAME_GAME_RETURN + MISSING_INC_CLEARANCE: compliance_score 55, SANCTIONED, case STAGE_FROZEN"
            - "Logical clock 2026-09-17T12:00:00Z, exactly the stage-2 min_start_at"
          setup_api_calls:
            - *c_clock_aug1
            - *c_club_h
            - *c_club_r
            - *c_doc_h
            - *c_obs
            - *c_inc
            - *c_player
            - *c_baseline
            - *c_game
            - *c_clock_kick
            - *c_game_live
            - *c_clock_1805
            - *c_eval
            - *c_screen
            - *c_clock_1810
            - *c_exam
            - *c_clock_1819
            - *c_diagnose
            - *c_clock_0915
            - *c_step1
            - *c_clock_0916
            - *c_pass1
            - *c_audit_open_sanction
            - *c_findings_sanction
            - *c_clock_0917
          trigger:
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 2 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
            - call: "POST /concussion-program/protocol-audits/${audit_id}/close"
              payload: { disposition: "DISMISSED", closing_note: "video review shows the removal was timely" }
              as: LeagueAuditor
              as_user_id: "auditor-c"
            - call: "POST /concussion-program/concussion-cases/${case_id}/return-steps"
              payload: { stage_index: 2 }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "trigger 1 (club SANCTIONED): response status 409 with error_id ERR_CASE_STAGE_FROZEN"
            - "after close DISMISSED: ProtocolAudit.${audit_id}.status == CLOSED_DISMISSED and assessed_fine_cents == 0"
            - "after close DISMISSED: Club.${club_h_id}.compliance_score == 100, escalation_tier == TIER_0, status == ACTIVE, outstanding_fine_cents == 0"
            - "after close DISMISSED: ConcussionCase.${case_id}.case_status == RTP_IN_PROGRESS, frozen_from_status == null, heightened_review_required == false"
            - "trigger 3 (club ACTIVE, identical payload): response status 201 with ReturnStep.stage_index == 2, status == IN_PROGRESS, started_at == 2026-09-17T12:00:00.000Z"
            - "trigger 3: ReturnStep.dwell_complete_at == 2026-09-18T12:00:00.000Z"

      - name: inc_decision_depends_on_consultant_suspension_state
        grounds:
          - state_machines.Clinician.ACTIVE_to_SUSPENDED
          - state_machines.IncClearance.PENDING_to_SUPERSEDED
          - validations.priority_9_ERR_CLINICIAN_SUSPENDED
          - state_machines.ConcussionCase.PENDING_INC_CLEARANCE_to_RTP_IN_PROGRESS
        distinguishing_aspect: |
          A different pair - IncClearance and Clinician: suspending the consultant supersedes his
          PENDING clearance and pushes the case back to RTP_IN_PROGRESS without touching any stage, and
          his subsequent APPROVED decision is refused with ERR_CLINICIAN_SUSPENDED (priority 9) rather
          than with the clearance-state error, since the actor check precedes the resource-state check.
        test_recipe:
