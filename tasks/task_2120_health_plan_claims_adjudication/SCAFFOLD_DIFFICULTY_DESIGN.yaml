            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_ded_after_finalize: "$.data[0].deductible_applied_cents", acc_oop_after_finalize: "$.data[0].oop_applied_cents", acc_count_after_finalize: "$.data[0].remitted_claim_count" }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/void"
              payload: { void_reason_code: "VOID_DUPLICATE_PAYMENT" }
              as: ClaimsExaminer
          assert:
            - "${acc_ded_base} == 12000 and ${acc_oop_base} == 15000"
            - "${c_ded} == 38000 and ${c_member} == 38400"
            - "${acc_ded_after_finalize} == 50000 and ${acc_oop_after_finalize} == 53400 and ${acc_count_after_finalize} == 1"
            - "BenefitAccumulator.${acc_id}.deductible_applied_cents == 12000 after the void"
            - "BenefitAccumulator.${acc_id}.oop_applied_cents == 15000 after the void"
            - "BenefitAccumulator.${acc_id}.remitted_claim_count == 0 after the void"

      - name: adjustment_cycle_conserves_authorization_units
        grounds:
          - state_machines.Claim.status.FINALIZED_to_ADJUSTED
          - state_machines.ClaimLine.line_status.PAID_to_REVERSED
          - entities.Authorization.fields.units_consumed
          - entities.Claim.fields.original_claim_id
        distinguishing_aspect: |
          Conserved quantity: AUTHORIZED SERVICE UNITS (a unit count, not dollars) — the invariant
          Authorization.units_consumed == SUM of ClaimLine.units over lines with line_status IN
          {PRICED, PAID} holds at 4 before the adjustment, 0 immediately after it, and 2 after the
          replacement claim is adjudicated.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "BenefitPlan INV-2 with deductible 0, oop_max 1000000 and coinsurance 0."
            - "IN_NETWORK provider Rho Imaging; fee schedule rate 73721 = 40000 cents per unit effective 2026-01-01."
            - "One AUTH_REQUIRED EditRule on 73721 with severity PEND and precedence_rank 30."
            - "Member M-INV-2 has one open-ended PRIMARY coverage segment from 2026-01-01."
            - "One Authorization for (member, provider, 73721) with authorized_units 6 covering 2026-01-01..2026-12-31."
            - "Claim CLM-INV-2 (one 73721 line, 4 units, billed 200000, service 2026-02-10) is FINALIZED with its line PAID, so units_consumed is 4 and the authorization is PARTIALLY_CONSUMED."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "INV-2", name: "Invariant Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "1000000017", name: "Rho Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-G", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-INV-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/authorizations"
              payload: { member_id: "${mem_id}", provider_id: "${prov_id}", procedure_code: "73721", authorized_units: 6, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: UtilizationReviewer
              captures: { auth_id: $.data.id }
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-INV-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 4, billed_amount_cents: 200000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c1_id: $.data.id }
            - call: "POST /adjudication/claims/${c1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /adjudication/claims/${c1_id}/finalize"
              payload: {}
              as: ClaimsExaminer
            - call: "GET /adjudication/authorizations/${auth_id}"
              payload: {}
              as: UtilizationReviewer
              captures: { units_before: $.data.units_consumed, status_before: $.data.status }
          trigger:
            - call: "POST /adjudication/claims/${c1_id}/adjustments"
              payload: { claim_number: "CLM-INV-2-A1", adjustment_reason_code: "ADJ_UNITS_CORRECTION", lines: [{ line_number: 1, procedure_code: "73721", units: 2, billed_amount_cents: 100000, service_date: "2026-02-10" }] }
              as: ClaimsExaminer
              captures: { c2_id: $.data.id, c2_orig: $.data.original_claim_id, c2_type: $.data.claim_type }
            - call: "GET /adjudication/authorizations/${auth_id}"
              payload: {}
              as: UtilizationReviewer
              captures: { units_mid: $.data.units_consumed, status_mid: $.data.status }
            - call: "POST /adjudication/claims/${c2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "${units_before} == 4 and ${status_before} == PARTIALLY_CONSUMED"
            - "${units_mid} == 0 and ${status_mid} == ACTIVE (the adjustment released every unit the original held)"
            - "${c2_type} == ADJUSTMENT and ${c2_orig} == ${c1_id}"
            - "Claim.${c1_id}.status == ADJUSTED and Claim.${c1_id}.payment_status == REVERSED"
            - "GET /adjudication/claim-lines?claim_id=${c1_id} returns one line with line_status == REVERSED"
            - "Authorization.${auth_id}.units_consumed == 2 and status == PARTIALLY_CONSUMED after the replacement claim is adjudicated"
            - "Claim.${c2_id}.total_allowed_cents == 80000"
