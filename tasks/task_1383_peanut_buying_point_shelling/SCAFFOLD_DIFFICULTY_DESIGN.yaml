            - "AflatoxinCertificate.${c2}.determination == SEGREGATE at exactly 50.00 (inclusive upper bound of the segregate band); load ${la2}.aflatoxin_status == SEGREGATED"
            - "AflatoxinCertificate.${c3}.determination == REJECT at 50.01; load ${la3}.aflatoxin_status == REJECTED and status == REJECTED (terminal)"

      - name: moisture_drying_threshold_exact_boundary
        grounds:
          - calculations.load_net_value
          - entities.FarmerStockLoad.fields.drying_status
          - errors[ERR_DRYING_REQUIRED]
        distinguishing_aspect: |
          Metric moisture_pct via grade finalize + store: 10.49 is INCLUSIVE
          NOT_REQUIRED (rule is strictly-greater), 10.50 flips to REQUIRED and
          blocks storage with ERR_DRYING_REQUIRED — different metric (moisture
          percent) and different endpoint (grade-sheets finalize) than the ppb
          instance.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000); grower G1; loads D1 and D2 each WEIGHED 20.0t"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
