          assert:
            - "The revise returns 200 with AllocationRun.${run_id}.status == DRAFT and version == 3"
            - "After the revise units_proposed == 0, unallocated_remainder_units == 0 and eligible_store_count == 0"
            - "GET /allocation/allocation-lines?run_id=${run_id} returns total_count == 0 - the three lines are DELETED, not left behind as zeroed rows"
            - "The revise did not touch the ledger: Receipt.${rcpt_id}.status is still ALLOCATING with units_committed 0 and units_unallocated 44"
            - "The second propose returns status == PROPOSED with version == 4, eligible_store_count == 3 and unallocated_remainder_units == 0"
            - "The new needs are 38 / 10 / 8 (0101 target 12 x 4 = 48 minus pipeline 6 + 4 = 10) for a total of 56 > 44, so the pool is prorated: AllocationLine.${l1_id}.units_proposed == 31, ${l3_id} == 7, ${l4_id} == 6"
            - "The floors alone give 29 / 7 / 6 = 42 and the 2 leftover units both go to 0101 on residual need, which is why 0101 lands on 31"
            - "The new size breakdowns are ${l1_id} [{S:6},{M:11},{L:10},{XL:4}], ${l3_id} [{S:1},{M:3},{L:2},{XL:1}] and ${l4_id} [{S:1},{M:3},{L:2},{XL:0}], each summing to its units_proposed"
            - "Every line is a NEW row: the three ids returned after the second propose differ from the three the first pass produced"
      - name: receipt_close_cascades_open_runs_and_spares_the_committed_one
        claim_type: cascade_down
        grounds:
          - state_machines[Receipt].transitions[ALLOCATING->CLOSED]
          - state_machines[AllocationRun].transitions[PROPOSED->CANCELLED]
          - entities.AllocationLine.fields.fulfillment_status
          - calculations.receipt_unit_ledger_invariant
          - endpoints.POST /allocation/receipts/{receiptId}/close
        distinguishing_aspect: |
          Closing a receipt is a parent change that must reach its children and stop: every DRAFT or
          PROPOSED run on it becomes CANCELLED and every line of those runs becomes RECALLED, while the
          COMMITTED run and its PENDING lines are left completely alone. The dataset puts both kinds of child
          on the same receipt at once - a 44-unit committed run and a 16-unit proposed run built from the
          remaining pool - so a cascade that is too greedy (touching the committed run) or too lazy (leaving
          the proposed run open) is both detectable, and the ledger must survive either way.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores 0101(A,13000,URBAN) 0102(B,10000,URBAN) 0103(C,12500,SUBURBAN) 0104(D,11000,SUBURBAN)"
            - "Shelf plans effective 2026-07-01 open-ended: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SizeProfile TOP-4SZ = S 2000 / M 3500 / L 3000 / XL 1500, core_size_min_share_bp 1500; SKU-1001 is SEASONAL so its resolved model is DEMAND_DRIVEN"
            - "Positions: 0101 on_hand 6 + on_order 4, forecast 9, trailing 30; 0102 on_hand 20, forecast 5, trailing 16; 0103 on_hand 2, forecast 3, trailing 6; 0104 on_hand 0, forecast 2, trailing 5"
            - "A 60-unit receipt ASN-8007 (S 12 / M 21 / L 18 / XL 9) is on the floor"
            - "Run 1 was proposed and COMMITTED with lines 26 / 10 / 8 = 44 units, so units_committed 44 and units_unallocated 16, and the receipt is ALLOCATING"
            - "Run 2 was then created on the same receipt against the refreshed version and PROPOSED; the 16-unit pool against unchanged needs 26 / 10 / 8 gives lines 11 / 3 / 2"
            - "Both runs therefore coexist: one COMMITTED with PENDING lines, one PROPOSED with unallocated lines"
          setup_api_calls:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
