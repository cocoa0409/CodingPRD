      - "GET /incentives/deliveries/{id}"
      - "GET /incentives/deliveries/{id}/eligible-programs"
      - "GET /incentives/claims"
      - "GET /incentives/claims/{id}"
      - "GET /incentives/claims/{id}/chargebacks"
      - "GET /incentives/payment-batches/{id}"
  - name: Dealer
    description: "The dealer system. Reports retail deliveries, submits incentive claims and protests assigned objectives. X-User-ID is the Dealer row's id, and every write is scoped to that dealer."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /incentives/deliveries"
      - "POST /incentives/claims"
      - "POST /incentives/objectives/{id}/protests"
    shared_operations:
      - "GET /incentives/programs/{id}"
      - "GET /incentives/programs/{id}/eligibility-rules"
      - "GET /incentives/objectives"
      - "GET /incentives/objectives/{id}"
      - "GET /incentives/objectives/{id}/protests"
      - "GET /incentives/dealers/{id}"
      - "GET /incentives/deliveries"
      - "GET /incentives/deliveries/{id}"
      - "GET /incentives/deliveries/{id}/eligible-programs"
      - "GET /incentives/claims"
      - "GET /incentives/claims/{id}"
      - "GET /incentives/claims/{id}/chargebacks"
