              payload: { publisher_id: "${e3_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { e3_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { e3_au_id: $.data.id }
            - call: "POST /funders"
              payload: { name: "Nordic Green Foundation", funder_code: "NGF", mandate_type: "GREEN_OA", max_embargo_months: 6, deposit_deadline_days: 90, license_required: "ANY", apc_allowable: false }
              as: AgreementAdmin
              captures: { e3_f_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${e3_f_id}", pi_author_id: "${e3_au_id}", grant_number: "NGF-2026-11", award_from: "2026-01-01", award_until: "2026-09-30", apc_budget_cents: 500000 }
              as: AgreementAdmin
              captures: { e3_g1_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${e3_f_id}", pi_author_id: "${e3_au_id}", grant_number: "NGF-2026-12", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 500000 }
              as: AgreementAdmin
              captures: { e3_g2_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${e3_p_id}", agreement_code: "TA-HALDEN-2026H2", effective_from: "2026-07-01", effective_until: "2026-09-01", article_quota: 5, discount_pct: 0.10, covered_oa_models: ["FULLY_OA"], expected_publisher_version: "${e3_p_v}" }
              as: AgreementAdmin
              captures: { e3_ta_id: $.data.id }
            - call: "POST /transformative-agreements/${e3_ta_id}/coverages"
