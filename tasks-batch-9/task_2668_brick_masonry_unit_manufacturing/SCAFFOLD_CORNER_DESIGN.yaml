      - name: formulation_supersession_is_self_referential_and_filterable
        claim_type: graph
        grounds:
          - entities.BodyFormulation.fields.supersedes_formulation_id
          - endpoints["GET /formulations"]
          - calculations.panel_dye_lot_equivalence
        distinguishing_aspect: "supersedes_formulation_id points at BodyFormulation itself, so the entity graph contains a self-referential edge; the filtered list must resolve the child of a given ancestor, and a formulation must never be its own ancestor."
        test_recipe:
          setup:
            - "Plant P1 ACTIVE with PIT-CLAY-A and PIT-SHALE-B"
            - "Formulation F1 QUALIFIED, then F2 created with supersedes_formulation_id F1, then F3 created with supersedes_formulation_id F2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1_super: "$.data.supersedes_formulation_id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F2", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20, supersedes_formulation_id: "${f1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f2: "$.data.id", f2_super: "$.data.supersedes_formulation_id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F3", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20, supersedes_formulation_id: "${f2}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f3: "$.data.id", f3_super: "$.data.supersedes_formulation_id" }
          trigger:
            - call: "GET /formulations"
              payload: { supersedes_formulation_id: "${f1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { child_of_f1: "$.data[0].id" }
            - call: "GET /formulations"
              payload: { supersedes_formulation_id: "${f2}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { child_of_f2: "$.data[0].id" }
            - call: "GET /formulations"
              payload: { supersedes_formulation_id: "${f3}" }
              as: BodyEngineer
              as_user_id: "body-001"
          assert:
            - "${f1_super} == null - the chain root supersedes nothing"
            - "${f2_super} == ${f1} and ${f3_super} == ${f2} - a two-edge self-referential chain F1 <- F2 <- F3"
            - "${child_of_f1} == ${f2} with total_count == 1, and ${child_of_f2} == ${f3} with total_count == 1"
            - "The third probe returns an empty array with total_count == 0 - F3 is a leaf and the chain is acyclic"
            - "No formulation lists itself in supersedes_formulation_id, so DYE_LOT_CLOSURE_MAX_HOPS 16 is a safety cap, not a live cycle guard"

