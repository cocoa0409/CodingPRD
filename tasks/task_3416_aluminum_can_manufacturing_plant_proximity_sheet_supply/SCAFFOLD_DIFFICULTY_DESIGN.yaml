              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /supply-agreements/${agr_id}/forecasts"
              payload: { period: "2026-06", forecast_qty: 0 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { fz_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/forecasts"
              payload: { period: "2026-07", forecast_qty: 5000 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { fn_id: $.data.id }
          trigger:
            - call: "POST /forecasts/${fz_id}/close"
              payload: { actual_qty: 0 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { acc_z: $.data.accuracy_pct, st_z: $.data.status }
            - call: "POST /forecasts/${fn_id}/close"
              payload: { actual_qty: 0 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { acc_n: $.data.accuracy_pct }
          assert:
            - "st_z == CLOSED and acc_z == 100.00 (pinned zero-zero boundary, no error, no NaN)"
            - "acc_n == 0.00 (1 - 5000/max(5000,0) = 0 via the max-denominator branch)"

