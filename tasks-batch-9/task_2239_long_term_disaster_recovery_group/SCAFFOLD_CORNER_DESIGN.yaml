              as_user_id: u_vc_1
            - call: GET /lodging-sites/{id}
              payload: {}
              as: VolunteerCoordinator
              as_user_id: u_vc_1
          assert:
            - "The unknown-site request returns HTTP 404 with data.error_id == 'ERR_LODGING_SITE_NOT_FOUND' and creates nothing."
            - "The valid link returns HTTP 201 with group_id ${gu42}, lodging_site_id ${lg42}, beds_requested 4 and status 'ACTIVE'."
            - "GET /housing-assignments?lodging_site_id=${lg42}: total_count 1 containing ${ha42}."
            - "GET the site: peak_committed_beds 4 and available_beds 6."
