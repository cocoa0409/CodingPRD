# =============================================================================
# Cross-cutting notes (not tables — recorded for downstream generators)
# =============================================================================
# - The logical clock default is 2026-09-01T00:00:00Z (see POST /_clock/set_current_utc).
# - Vocabulary ban honored: no concurrency rule is phrased in wall-clock-window or
#   tie-breaker terms; all three §1.2.1 rules reduce to an OCC version check that
#   two strictly sequential requests can exercise.
# - Listings created by POST /properties/{propertyId}/listings start DRAFT and become
#   research input only after POST /listings/{listingId}/publication; a published listing's
#   status never returns to DRAFT (DRAFT -> PUBLISHED -> WITHDRAWN/EXPIRED is linear).
# - GUARDRAIL: an OFFICE or INDUSTRIAL property may never be published with a rent above
#   500.00 dollars per square foot per month; any such publication is refused outright
#   regardless of who asks, who owns the listing or what the property's research status is.
#   This absolute cap is the counter-check on ERR_UNAUTHORIZED_REDISTRIBUTION and is never
#   relaxed by the acting role.
# - Ranking and tie-break inputs are always entity fields (occurred_at, created_at,
#   effective_rent_psf, renewal_due_at); no selector anywhere consumes a UUID or random id.
