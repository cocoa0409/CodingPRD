  - rule_id: resource_temporal_overlap
    instances:
      - name: charter_window_half_open_overlap_vs_adjacency
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_CHARTER_OVERLAP]"
          - entities.EquipmentCharter.fields.window_start
        distinguishing_aspect: |
          Interval semantics = EXCLUSIVE half-open [start, end) on resource
          EquipmentAsset: charter2 [05-15, 05-25) colliding with charter1
          [05-10, 05-20) is rejected; charter3 [05-20, 05-30) touching at the
          endpoint is ACCEPTED (adjacency allowed). Distinct semantics and
          resource from the storage-capacity instance.
        test_recipe:
          setup:
            - "Casualty with NCNP contract SIGNED; one TUG asset; charter1 BOOKED [2026-05-10, 2026-05-20)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 2000000, max_hs_meters: 3.00 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-20T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch1: $.data.id } }
          trigger:
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-15T00:00:00Z", window_end: "2026-05-25T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-20T00:00:00Z", window_end: "2026-05-30T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch3: $.data.id } }
          assert:
            - "Overlapping charter2: error_id == ERR_CHARTER_OVERLAP with HTTP 409 ([05-15,05-25) intersects [05-10,05-20))"
            - "Adjacent charter3 accepted: status == BOOKED (charter1.window_end == charter3.window_start — half-open adjacency is not a collision)"
            - "EquipmentAsset.${eq_id}.status == CHARTERED"

      - name: storage_site_aggregate_capacity_overlap
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_STORAGE_CAPACITY_EXCEEDED]"
          - state_machines.RecoveredProperty.SALVED_to_SECURED_ASHORE
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY on resource StorageSite:
          overlapping custody occupations are allowed while the tonnage sum
          stays <= capacity. 60t + 50t > 100t is rejected; replacing the 50t
          lot with a 40t lot lands exactly at 100t and passes (inclusive
          boundary). Distinct semantics (capacity sum, not exclusion) and
          distinct resource from the EquipmentAsset half-open rule.
        test_recipe:
          setup:
            - "Casualty with NCNP contract ACTIVE; storage site capacity_tonnes 100; lot1 (60t) already SECURED_ASHORE (allocated 60)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /storage-sites", payload: { name: "Yard D", capacity_tonnes: 100 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { site_id: $.data.id } }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: CARGO, quantity_tonnes: 60, declared_value_cents: 6000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot1: $.data.id } }
            - { call: "POST /properties/${lot1}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: BUNKERS, quantity_tonnes: 50, declared_value_cents: 500000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot2: $.data.id } }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: WRECK_DEBRIS, quantity_tonnes: 40, declared_value_cents: 100000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot3: $.data.id } }
          trigger:
            - { call: "POST /properties/${lot2}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
            - { call: "POST /properties/${lot3}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01" }
          assert:
            - "lot2 (50t): error_id == ERR_STORAGE_CAPACITY_EXCEEDED (60 + 50 > 100)"
            - "lot2 custody_status stays SALVED after rejection"
            - "lot3 (40t): custody_status == SECURED_ASHORE (60 + 40 == 100 — exact capacity passes)"
            - "StorageSite.${site_id}.allocated_tonnes == 100"

  - rule_id: compensating_invariant
    instances:
      - name: security_release_converses_lodged_total
        grounds:
          - calculations.security_conservation
          - state_machines.SecurityDeposit.LODGED_to_PARTIALLY_DISBURSED
          - state_machines.SecurityDeposit.PARTIALLY_DISBURSED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = MONEY: lodged_amount_cents ==
          held_cents + released_cents + applied_cents after every disburse.
          Lodge 20,000,000 then release 8,000,000 then 12,000,000 — forward and
          compensating transfers keep the sum pinned at 20,000,000 throughout.
          Distinct quantity from the property-mass invariant.
        test_recipe:
          setup:
            - "Casualty assessed+planned; FIXED_PRICE contract 50,000,000 SIGNED (security_required 15,000,000); deposit lodged 20,000,000; contract TERMINATED via MUTUAL (release-eligible)"
          setup_api_calls:
