            - "trigger call 2 returns HTTP 409 with ${err_branding} == ERR_ENTRY_TECH_HELD and VehicleEntry.${entry_held}.branding_slots_committed == 0"
            - "trigger call 3 differs from trigger call 1 only in featured_vehicle_entry_id and returns HTTP 201; ShowSegment.${seg_ok}.start_offset_minutes == 0 and end_offset_minutes == 20"
            - "trigger call 4 differs from trigger call 2 only in branded_vehicle_entry_id and returns HTTP 201; SponsorshipActivation.${act_ok}.state == PROPOSED"
