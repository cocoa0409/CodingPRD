      - name: contract_accept_requires_active_grower
        entity_pair: "GrapeContract depends on Grower"
        grounds:
          - validations.priority_31
          - validations.priority_29
          - state_machines.GrapeContract.OFFERED_to_ACTIVE
          - entities.Grower.fields.status
        distinguishing_aspect: |
          Pair 3: GrapeContract <- Grower, the third distinct pair, and the dependency is on a
          plain status flag on the counterparty rather than on a workflow state. An offer already
          extended cannot be accepted once the producer is suspended mid-negotiation; the contract
          stays in OFFERED and no caps or installments are materialised. A companion probe shows
          the same endpoint refusing an allocation-less contract with a different error, proving
          the two independent accept preconditions are both live.
