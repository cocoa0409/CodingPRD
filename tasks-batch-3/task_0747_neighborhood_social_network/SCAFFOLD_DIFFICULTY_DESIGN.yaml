              payload: { seller_resident_id: "${r6_id}", neighborhood_id: "${n1_id}", title: "chair", price_cents: 1000, kind: "FOR_SALE" }
              as: Resident
              as_user_id: "${r6_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 403"
            - "Response data.error_id == \"ERR_NOT_VERIFIED_IN_NEIGHBORHOOD\""
            - "It is NOT ERR_NEIGHBORHOOD_EMERGENCY_LOCKDOWN despite the posture being EMERGENCY"

      - name: invalid_time_window_beats_notice_overlap_on_civic_notice_create
        grounds:
          - validations[priority=120]
          - validations[priority=130]
          - errors[ERR_INVALID_TIME_WINDOW]
          - errors[ERR_NOTICE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair 2 (business_temporal vs business_constraint):
          ERR_INVALID_TIME_WINDOW (priority 120) beats ERR_NOTICE_WINDOW_OVERLAP
          (priority 130). Same request violates both — proposed CivicNotice
          with effective_until == effective_from AND a scheduled ACTIVE notice
          on the same (neighborhood_id, notice_kind) — returned error_id
          is ERR_INVALID_TIME_WINDOW (the ordering-invalid check wins).
        test_recipe:
          setup:
            - "Neighborhood N1 exists."
            - "AgencyOfficer OFF1 has an ACTIVE POLICE CivicNotice on N1 spanning 2026-06-05..2026-06-10."
            - "Logical clock 2026-06-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/civic-notices"
              payload: { neighborhood_id: "${n1_id}", title: "Roadwork", body: "Main St closed", notice_kind: "POLICE", effective_from: "2026-06-05T00:00:00Z", effective_until: "2026-06-10T00:00:00Z" }
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { cn1_id: "$.data.id" }
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /neighborhood/civic-notices"
              payload: { neighborhood_id: "${n1_id}", title: "Bad", body: "b", notice_kind: "POLICE", effective_from: "2026-06-08T00:00:00Z", effective_until: "2026-06-08T00:00:00Z" }
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 422"
            - "Response data.error_id == \"ERR_INVALID_TIME_WINDOW\""
            - "It is NOT ERR_NOTICE_WINDOW_OVERLAP despite the overlap"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: event_rsvp_admits_at_capacity_minus_one_and_rejects_at_capacity
        grounds:
          - calculations.event_capacity_reservation
          - entities.Event.fields.capacity
          - entities.Event.fields.rsvp_count
          - errors[ERR_EVENT_FULL]
        distinguishing_aspect: |
          Numeric threshold boundary on POST /event-rsvps: `rsvp_count >=
          capacity` uses `>=` — with capacity=3, the third RSVP (rsvp_count
          goes 2 -> 3) MUST succeed and the fourth (rsvp_count == capacity)
          MUST fail with ERR_EVENT_FULL. Metric is `rsvp_count`; endpoint
          is POST /event-rsvps. Structurally distinct from the empty-overlap
          boundary in the sibling instance.
        test_recipe:
          setup:
            - "Neighborhood N1; Verified Residents R1..R4; Moderator MOD."
            - "Group G1 by R1 in N1."
            - "Event E1 for G1 with capacity=3, state=SCHEDULED, starts_at=2026-06-10T00:00:00Z."
            - "Two EventRSVPs already exist for E1 (R2 and R3 with rsvp_status=YES), rsvp_count=2."
