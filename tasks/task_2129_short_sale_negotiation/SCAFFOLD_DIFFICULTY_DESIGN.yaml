  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: listing_half_open_window_overlap_rejected_on_case
        grounds:
          - calculations.listing_window_admission
          - validations[priority=48]
          - errors[ERR_LISTING_WINDOW_OVERLAP]
          - entities.Listing.fields.listed_at
          - entities.Listing.fields.ended_at
        distinguishing_aspect: |
          Resource entity ShortSaleCase, interval semantics HALF-OPEN
          [listed_at, ended_at) with no buffer: the second listing starts inside
          the first listing's still-open window and is refused, while a start
          instant exactly equal to a closed window's ended_at would be
          admissible because the left comparison is strict.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00Z."
            - "One GSE ShortSaleCase carrying one ACTIVE Listing with listed_at 2026-08-05T00:00:00Z and ended_at null, i.e. the window [2026-08-05, +infinity)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "150 Cottonwood Ter, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/listings"
              payload: { list_price_cents: 25900000, commission_pct: 0.06, listed_at: "2026-08-05T00:00:00Z" }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { listing1_id: $.data.id }
          trigger:
            - call: "POST /short-sale/cases/${case_id}/listings"
              payload: { list_price_cents: 24900000, commission_pct: 0.055, listed_at: "2026-08-20T00:00:00Z" }
              as: ListingAgent
              as_user_id: "la-200"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_LISTING_WINDOW_OVERLAP"
            - "GET /short-sale/cases/${case_id}/listings returns exactly 1 Listing"
            - "Listing.${listing1_id}.marketing_status == ACTIVE"
            - "Listing.${listing1_id}.ended_at == null"
            - "Listing.${listing1_id}.list_price_cents == 25900000"

      - name: vendor_buffered_slot_conflict_rejected_on_bpo_vendor
        grounds:
          - calculations.vendor_slot_admission
          - validations[priority=48]
          - errors[ERR_VENDOR_SCHEDULE_CONFLICT]
          - entities.Valuation.fields.inspection_start
          - entities.Valuation.fields.inspection_end
          - entities.BpoVendor.fields.daily_inspection_capacity
        distinguishing_aspect: |
          Resource entity BpoVendor - a different resource from the case's
          listing timeline - with different interval semantics: a CLOSED
          interval widened by VENDOR_INSPECTION_BUFFER_MINUTES on both sides and
          compared with strict inequalities, so a 30-minute gap collides while a
          gap of exactly 60 minutes does not. The collision also crosses case
          boundaries: the two inspections sit on different ShortSaleCases.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One BpoVendor with daily_inspection_capacity 2."
            - "Case A and Case B, both GSE and both in INTAKE."
            - "One Valuation on Case A holding the vendor's slot 2026-08-06T09:00:00Z to 2026-08-06T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/bpo-vendors"
              payload: { vendor_name: "Sierra Valuation Partners", license_state: "NV", daily_inspection_capacity: 2 }
              as: PlatformAdmin
              as_user_id: "adm-900"
              captures: { vendor_id: $.data.id }
            - call: "POST /short-sale/cases"
              payload: { property_address: "118 Larkspur Ln, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_a: $.data.id }
            - call: "POST /short-sale/cases"
              payload: { property_address: "6 Manzanita Ct, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 21500000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_b: $.data.id }
            - call: "POST /short-sale/cases/${case_a}/valuations"
              payload: { vendor_id: "${vendor_id}", valuation_type: "BPO_EXTERIOR", effective_date: "2026-08-06T00:00:00Z", inspection_start: "2026-08-06T09:00:00Z", inspection_end: "2026-08-06T10:00:00Z" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
              captures: { val_a: $.data.id }
          trigger:
            - call: "POST /short-sale/cases/${case_b}/valuations"
              payload: { vendor_id: "${vendor_id}", valuation_type: "BPO_INTERIOR", effective_date: "2026-08-06T00:00:00Z", inspection_start: "2026-08-06T10:30:00Z", inspection_end: "2026-08-06T11:30:00Z" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_VENDOR_SCHEDULE_CONFLICT"
            - "response data.error_id != ERR_VENDOR_DAILY_CAPACITY_EXCEEDED (capacity is 2 and only 1 slot is held)"
            - "GET /short-sale/valuations?vendor_id=${vendor_id} returns total_count == 1"
            - "Valuation.${val_a}.status == ORDERED"
            - "ShortSaleCase.${case_b}.final_value_cents == null"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: junior_contribution_ledger_restored_by_withdraw_approval
        grounds:
          - state_machines.JuniorLien.DEMAND_SENT_to_APPROVED
          - state_machines.JuniorLien.APPROVED_to_NEGOTIATING
          - entities.ShortSaleCase.fields.junior_contribution_total_cents
          - entities.JuniorLien.fields.approved_contribution_cents
        distinguishing_aspect: |
          Conserved quantity of type MONEY - the case's junior-contribution
          ledger, pinned as
          ShortSaleCase.junior_contribution_total_cents == SUM(
          JuniorLien.approved_contribution_cents WHERE JuniorLien.case_id ==
          case.id AND JuniorLien.status == APPROVED). The APPROVE / 
          WITHDRAW_APPROVAL pair returns it to exactly 0 with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One GSE ShortSaleCase."
            - "One JuniorLien at position 2, balance_cents 3500000, demand_cents 900000, status APPROVED with approved_contribution_cents 600000, so junior_contribution_total_cents is 600000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "205 Fern Gully, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/junior-liens"
              payload: { lien_position: 2, holder_name: "Truckee Credit Union", holder_user_id: "jlh-700", balance_cents: 3500000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { lien_id: $.data.id }
            - call: "POST /short-sale/junior-liens/${lien_id}/demand"
              payload: { demand_cents: 900000 }
              as: Negotiator
              as_user_id: "neg-001"
            - call: "POST /short-sale/junior-liens/${lien_id}/response"
              payload: { outcome: "APPROVE", contribution_cents: 600000 }
              as: JuniorLienHolder
              as_user_id: "jlh-700"
            - call: "GET /short-sale/cases/${case_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-001"
              captures: { total_before: $.data.junior_contribution_total_cents }
          trigger:
            - call: "POST /short-sale/junior-liens/${lien_id}/response"
              payload: { outcome: "WITHDRAW_APPROVAL" }
              as: JuniorLienHolder
              as_user_id: "jlh-700"
          assert:
            - "before the trigger, ShortSaleCase.${case_id}.junior_contribution_total_cents == 600000"
            - "after the trigger, ShortSaleCase.${case_id}.junior_contribution_total_cents == 0"
            - "JuniorLien.${lien_id}.approved_contribution_cents == 0"
            - "JuniorLien.${lien_id}.status == NEGOTIATING"
            - "JuniorLien.${lien_id}.demand_cents == 900000 (the demand is not compensated away)"
            - "JuniorLien.${lien_id}.balance_cents == 3500000"
            - "ShortSaleCase.${case_id}.junior_lien_count == 1"
            - "ShortSaleCase.${case_id}.junior_contribution_total_cents == SUM(approved_contribution_cents of APPROVED liens on the case) == 0"

      - name: package_document_counter_partition_restored_by_revoke
        grounds:
          - state_machines.SellerDocument.PENDING_to_VERIFIED
          - state_machines.SellerDocument.VERIFIED_to_PENDING
          - entities.HardshipPackage.fields.document_count
          - entities.HardshipPackage.fields.pending_document_count
          - entities.HardshipPackage.fields.verified_document_count
          - entities.HardshipPackage.fields.rejected_document_count
        distinguishing_aspect: |
          Conserved quantity of a different type - a COUNT PARTITION rather than
          a money ledger - pinned as HardshipPackage.pending_document_count +
          verified_document_count + rejected_document_count ==
          HardshipPackage.document_count == 4 at every point, with the VERIFY /
          REVOKE pair restoring each of the three buckets to its pre-VERIFY
          value (3 / 1 / 0) and leaving document_count untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One GSE ShortSaleCase with one DRAFT HardshipPackage."
            - "Four SellerDocuments on the package: HARDSHIP_LETTER, FINANCIAL_WORKSHEET and BANK_STATEMENT VERIFIED, AUTHORIZATION_FORM still PENDING."
            - "Package counters therefore read document_count 4, verified 3, pending 1, rejected 0; case documentation_status is DOC_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-900"
            - call: "POST /short-sale/cases"
              payload: { property_address: "3 Bitterbrush Ln, Reno NV", investor_type: "GSE", unpaid_principal_balance_cents: 26800000, servicer_name: "Cascade Servicing" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { case_id: $.data.id }
            - call: "POST /short-sale/cases/${case_id}/hardship-packages"
              payload: { hardship_reason: "DIVORCE", monthly_income_cents: 380000, monthly_expenses_cents: 512000, liquid_assets_cents: 640000 }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { pkg_id: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "HARDSHIP_LETTER", issued_on: "2026-07-20T00:00:00Z", reference_label: "HL-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_hl: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "FINANCIAL_WORKSHEET", issued_on: "2026-07-20T00:00:00Z", reference_label: "FW-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_fw: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "BANK_STATEMENT", issued_on: "2026-07-20T00:00:00Z", reference_label: "BS-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_bs: $.data.id }
            - call: "POST /short-sale/hardship-packages/${pkg_id}/documents"
              payload: { doc_type: "AUTHORIZATION_FORM", issued_on: "2026-07-20T00:00:00Z", reference_label: "AF-1" }
              as: Negotiator
              as_user_id: "neg-001"
              captures: { doc_af: $.data.id }
            - call: "POST /short-sale/documents/${doc_hl}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_fw}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "POST /short-sale/documents/${doc_bs}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
          trigger:
            - call: "POST /short-sale/documents/${doc_af}/review"
              payload: { outcome: "VERIFY" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
            - call: "GET /short-sale/hardship-packages/${pkg_id}"
              payload: {}
              as: ServicerAnalyst
              as_user_id: "sa-100"
              captures: { verified_mid: $.data.verified_document_count, pending_mid: $.data.pending_document_count }
            - call: "POST /short-sale/documents/${doc_af}/review"
              payload: { outcome: "REVOKE", note: "Signature page unsigned" }
              as: ServicerAnalyst
              as_user_id: "sa-100"
          assert:
            - "at the mid point, HardshipPackage.${pkg_id}.verified_document_count == 4 and pending_document_count == 0 and ShortSaleCase.${case_id}.documentation_status == DOC_COMPLETE"
            - "after the REVOKE, HardshipPackage.${pkg_id}.verified_document_count == 3"
            - "after the REVOKE, HardshipPackage.${pkg_id}.pending_document_count == 1"
            - "after the REVOKE, HardshipPackage.${pkg_id}.rejected_document_count == 0"
            - "after the REVOKE, HardshipPackage.${pkg_id}.document_count == 4"
            - "pending_document_count + verified_document_count + rejected_document_count == document_count == 4 both before and after the pair"
            - "SellerDocument.${doc_af}.status == PENDING"
            - "ShortSaleCase.${case_id}.documentation_status == DOC_PENDING"
