          assert:
            - "Member.${mb_id}.membership_state == SUSPENDED after reconcile (hop 1: period -> member)"
            - "Member.${mb_id}.mls_access_state == DISABLED"
            - "Office.${office_id}.status == SUSPENDED (hop 2: broker suspension suspends office)"
            - "activate rejected with error_id == ERR_MEMBER_SUSPENDED (hop 3: member state gates listing transition)"
            - "Listing.${listing_id}.status == DRAFT (unchanged by the rejected activation)"
      - name: late_status_change_cascades_citation_flag_then_payment_unflags
