        claim_type: role_exclusive_denied
        grounds: ["roles[CommitteeMember]", "endpoints[POST /surveillance/best-ex-reviews/{id}/transition]"]
        distinguishing_aspect: "Per-target role mapping on the shared transition endpoint: CommitteeMember may only RETURN (to_status=DRAFT); PUBLISHED is BestExAnalyst-only."
        test_recipe:
          setup: ["Venue + LOCKED snapshot; review IN_COMMITTEE"]
          setup_api_calls:
