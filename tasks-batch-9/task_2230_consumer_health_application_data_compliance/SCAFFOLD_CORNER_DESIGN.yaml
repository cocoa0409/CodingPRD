        distinguishing_aspect: "documented_gap_count 29 already lifts the raw multiplier to 2.015, which the cap clamps to 2.0, so 29 gaps and 40 gaps produce the identical score 100.00 and tier CRITICAL."
        test_recipe:
          setup: ["logical clock at 2026-08-01T00:00:00Z", "one AppProduct with no assessments yet"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
