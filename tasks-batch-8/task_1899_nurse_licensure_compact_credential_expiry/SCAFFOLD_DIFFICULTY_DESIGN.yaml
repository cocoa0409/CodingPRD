      - name: posture_evaluation_fixpoint_snapshot_order
        grounds:
          - calculations.credential_posture_evaluation
          - state_machines.ShiftAssignment.SCHEDULED_to_AUTO_CANCELLED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: posture depends on
          unit-required certs derived from the nurse's assignments, while assignments can only exist
          after posture was CLEAR. The unit requirement set is snapshotted BEFORE the cascade cancels
          future shifts, so the ACLS deficit that triggered the suspension still counts (no
          clear-then-suspend oscillation); only a later recompute after remediation clears the nurse.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement exists; unit ICU requires ACLS; nurse Pia is ACTIVE/CLEAR with ACTIVE AZ multistate license (expires 2027-06-30), ACTIVE BLS (2027-03-31), ACTIVE ACLS expiring 2026-08-31, CURRENT competency; she holds one SCHEDULED ICU shift on 2026-08-10 (12h). Clock then moves to 2026-09-01."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "ICU", required_cert_types: ["ACLS"] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Pia Fix", email: "pia.fix@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-PF1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "ACLS", issuing_body: "AHA", obtained_on: "2025-09-01", expires_on: "2026-08-31" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { acls_id: "$.data.id" } }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T07:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh_id: "$.data.id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/certifications/${acls_id}/renew", payload: { new_expires_on: "2027-08-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "Sweep summary: certifications_expired == 1, licenses_expired == 0, completions_lapsed == 0, postures_changed == 1, shifts_auto_cancelled == 1"
            - "Immediately after the sweep: Nurse.${n_id}.credential_posture == 'SCHEDULING_SUSPENDED' — the unit requirement snapshot (ACLS) was taken before the cascade cancelled the shift, so the deficit stands within this evaluation"
            - "ShiftAssignment.${sh_id}.status == 'AUTO_CANCELLED' with cancel_reason == 'POSTURE_SCHEDULING_SUSPENDED'; Unit.${unit_id}.scheduled_hours_total == 0.0"
            - "After the ACLS renew (second trigger call): Nurse.${n_id}.credential_posture == 'CLEAR' (fresh recompute; the unit requirement set is now empty)"
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: license_expiry_renewal_cycle
        grounds:
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
          - state_machines.StateLicense.EXPIRED_to_ACTIVE
          - calculations.psv_freshness
        distinguishing_aspect: |
          Cyclic shape on StateLicense: ACTIVE -> EXPIRED (sweep) -> ACTIVE (renew with fresh PSV).
          The loop edge distinguishes it from a linear pipeline, and the entity differs from the
          Nurse parallel-axes instance of this rule.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse exists (no activation needed); her AZ license (expires 2026-12-31) is ACTIVE after submit + PSV VERIFIED + attest. Clock then moves to 2027-01-01."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Lena Cycle", email: "lena.cycle@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-LC1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2026-12-31" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "BOARD_PORTAL" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv2_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv2_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/renew", payload: { new_expires_on: "2027-12-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "After the sweep: StateLicense.${lic_id}.status == 'EXPIRED' (2026-12-31 < 2027-01-01); sweep summary licenses_expired == 1"
            - "The second PSV (requested while EXPIRED) records VERIFIED with verified_on == '2027-01-01' and valid_through == '2027-06-30' and does NOT change license status (license remains EXPIRED until renew)"
            - "After renew: StateLicense.${lic_id}.status == 'ACTIVE' and expires_on == '2027-12-31' and version == 6 (create 1, submit 2, PSV-verified 3, attest 4, sweep-expire 5, renew 6) — the cycle closed"

      - name: nurse_parallel_status_posture_dimensions
        grounds:
          - state_machines.Nurse.ONBOARDING_to_ACTIVE
          - state_machines.DisciplinaryAction.UNDER_REVIEW_to_ADJUDICATED
          - state_machines.DisciplinaryAction.ADJUDICATED_to_RESOLVED
          - entities.Nurse.fields.credential_posture
        distinguishing_aspect: |
          Parallel state dimensions on Nurse: the lifecycle axis (status) stays ACTIVE throughout a
          PROBATION discipline cycle while the independent gating axis (credential_posture) cycles
          CLEAR -> PRACTICE_RESTRICTED -> CLEAR; termination then forces status TERMINATED with
          posture SCHEDULING_SUSPENDED. Different entity and different non-linear shape than the
          StateLicense renewal cycle.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; nurse Nora fully credentialed, ACTIVE and CLEAR (AZ multistate license 2027-06-30, BLS 2027-03-31, competency 2026-07-15)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Nora Parallel", email: "nora.parallel@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-NP1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "PRIVILEGE", action_type: "PROBATION", effective_on: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/acknowledge", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/adjudicate", payload: { outcome: "SUSTAINED" }, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/resolve", payload: { resolution_note: "probation terms completed" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /credentialing/nurses/${n_id}/terminate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "After adjudicate SUSTAINED: Nurse.${n_id}.status == 'ACTIVE' AND credential_posture == 'PRACTICE_RESTRICTED' — the lifecycle axis did not move while the posture axis flipped"
            - "After adjudicate: multistate_privilege_status == 'SINGLE_STATE_ONLY', practice_scope == ['AZ'], open_encumbrance_count == 1"
            - "After resolve at exactly 90 days (2026-08-01 + 90 = 2026-10-30, MIN_ACTIVE_DAYS[PROBATION] == 90, inclusive): status still 'ACTIVE', posture == 'CLEAR', privilege restored to 'ELIGIBLE_MULTISTATE', practice_scope == ['AZ','CO','FL','GA','MD','NC','TN','TX'], open_encumbrance_count == 0"
            - "After terminate: status == 'TERMINATED' AND credential_posture == 'SCHEDULING_SUSPENDED' (forced terminal snapshot) — axes settle independently to the end"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: sweep_license_expiry_cascade_depth4
        grounds:
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
          - state_machines.ShiftAssignment.SCHEDULED_to_AUTO_CANCELLED
          - entities.Unit.fields.scheduled_hours_total
          - calculations.credential_posture_evaluation
        distinguishing_aspect: |
          Originating trigger = expiry sweep (POST /credentialing/_ops/expiry-sweep). Depth-4 chain:
          license ACTIVE->EXPIRED (hop 1) causes posture recompute to SCHEDULING_SUSPENDED (hop 2)
          causes the future SCHEDULED shift -> AUTO_CANCELLED (hop 3) causes Unit scheduled-hours and
          assignment-count decrement (hop 4). Each hop is caused by the previous hop, not by the sweep
          directly (the BLS expiry in the same sweep only feeds hop 2's deficit set).
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED (no required certs); nurse Sara ACTIVE/CLEAR with AZ multistate license expiring 2027-06-30, BLS expiring 2027-03-31, competency CURRENT until 2027-07-15; one SCHEDULED 12h shift on 2026-08-10 keeps Unit.scheduled_hours_total == 12.0 and active_assignment_count == 1. Clock then moves to 2027-07-01."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Sara Sweep", email: "sara.sweep@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-SS1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T07:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh_id: "$.data.id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2027-07-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1" }
          assert:
            - "Sweep summary: licenses_expired == 1, certifications_expired == 1, completions_lapsed == 0 (competency valid through 2027-07-15), postures_changed == 1, shifts_auto_cancelled == 1, packets_voided == 0"
            - "StateLicense.${lic_id}.status == 'EXPIRED' (hop 1)"
            - "Nurse.${n_id}.credential_posture == 'SCHEDULING_SUSPENDED' (hop 2, caused by the license/cert mutations)"
            - "ShiftAssignment.${sh_id}.status == 'AUTO_CANCELLED' with cancel_reason == 'POSTURE_SCHEDULING_SUSPENDED' (hop 3, caused by the posture flip, not by the sweep directly)"
            - "Unit.${unit_id}.scheduled_hours_total == 0.0 and active_assignment_count == 0 (hop 4, caused by the shift cancellation)"

      - name: discipline_adjudication_privilege_revocation_cascade
        grounds:
          - state_machines.DisciplinaryAction.UNDER_REVIEW_to_ADJUDICATED
          - calculations.privilege_scope_determination
          - state_machines.CredentialPacket.APPROVED_to_VOIDED
          - state_machines.ShiftAssignment.SCHEDULED_to_AUTO_CANCELLED
        distinguishing_aspect: |
          Originating trigger = disciplinary adjudication (different transition than the sweep
          instance). Chain: SUSTAINED PRIVILEGE-scope SUSPENSION downgrades the nurse's compact
          privilege ELIGIBLE_MULTISTATE -> SINGLE_STATE_ONLY and appends a PrivilegeEvaluation
          (hop 1); the lost practice authority plus the open encumbrance flip posture to
          PRACTICE_RESTRICTED (hop 2); the posture flip auto-cancels the future shift AND voids the
          APPROVED travel packet (hop 3); the shift cancellation decrements the unit staffing
          counters (hop 4).
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED (no required certs); travel nurse Tara ACTIVE/CLEAR (AZ multistate license 2027-06-30, BLS 2027-03-31, competency CURRENT) with an APPROVED credential packet targeting MED and one SCHEDULED 12h shift on 2026-08-10 (Unit counters 12.0 / 1). A PRIVILEGE-scope SUSPENSION disciplinary action (effective 2026-08-01) is UNDER_REVIEW (created and acknowledged by co-1)."
