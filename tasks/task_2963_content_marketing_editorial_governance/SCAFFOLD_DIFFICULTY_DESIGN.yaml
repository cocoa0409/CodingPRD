            - "ContentItem.${item_id}.commit_points == 16"
            - "ContentItem.${item_id}.decay_pct == 91.67"
            - "ContentItem.${item_id}.last_audit_verdict == PRUNE"
            - "CalendarSlot.${slot_id}.committed_points == 0"
            - "CalendarSlot.${slot_id}.utilization_pct == 0.00"
            - "CalendarSlot.${slot_id}.status == OPEN"
            - "Campaign.${cmp_id}.committed_points_total == 0"
            - "AssetUsage.${usage_id}.usage_state == RELEASED"
            - "AssetUsage.${usage_id}.released_at == 2026-10-05T00:00:00.000Z"
            - "Asset.${asset_id}.active_use_count == 0"
            - "Asset.${asset_id}.remaining_licensed_uses == 2"
            - "every row of GET /editorial/content-items/${item_id}/distributions reads state RETRACTED"
            - "Campaign.${cmp_id}.governance_posture == OPEN"

      - name: retract_releases_asset_uses_but_keeps_the_calendar_commitment
        grounds:
          - endpoints[POST /editorial/content-items/{id}/retract]
          - state_machines.ContentItem.transitions[PUBLISHED->RETRACTED]
          - entities.CalendarSlot.fields.committed_points
          - entities.Campaign.fields.committed_points_total
          - entities.AssetUsage.fields.released_at
        distinguishing_aspect: |
          Retract is the deliberately partial compensation on the same shape of published item: the
          asset uses and distributions are unwound exactly as prune unwinds them, but the calendar
          ledger is untouched, so committed_points stays 16 at 40.00 percent and
          Campaign.committed_points_total stays 16. Restoring the slot points here - the intuitive
          symmetry with prune - is the failure this instance detects.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z for the whole recipe, so retracted_at and released_at both read that instant."
            - "Campaign CMP-COMP2 is ACTIVE with a DECISION CalendarSlot for week 2026-08-03 of capacity_points 40, so the 16-point item leaves the slot OPEN at 40.00 percent."
            - "The item has no Claim rows, all three gates are APPROVED, and it is published on OWNED and EMAIL with scheduled_at equal to the clock so both distributions are LIVE."
            - "Asset AST-COMP2 is STOCK licensed for OWNED and EMAIL with max_licensed_uses 2 and one ACTIVE usage on OWNED."
            - "No audit and no sweep runs, so the item is retracted straight out of PUBLISHED."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-COMP2", persona: "IT_BUYER", primary_funnel_stage: "DECISION", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/campaigns/${cmp_id}/calendar-slots"
              payload: { week_start_date: "2026-08-03", funnel_stage: "DECISION", capacity_points: 40 }
              as: ManagingEditor
              captures: { slot_id: $.data.id }
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "DECISION", search_intent: "COMMERCIAL", primary_keyword: "zero trust platform pricing", target_word_count: 1500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-04T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v}" }
              as: ManagingEditor
            - call: "POST /editorial/briefs/${brief_id}/approve"
              payload: {}
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "GET /editorial/campaigns/${cmp_id}"
              payload: {}
              as: ManagingEditor
              captures: { cmp_v: $.data.version }
            - call: "POST /editorial/content-items"
              payload: { brief_id: "${brief_id}", slot_id: "${slot_id}", title: "Zero trust platform pricing guide", planned_publish_at: "2026-08-05T09:00:00.000Z", expected_campaign_version: "${cmp_v}" }
              as: ManagingEditor
              as_user_id: "me-1"
              captures: { item_id: $.data.id }
            - call: "POST /editorial/assets"
              payload: { name: "Hero photography set D", asset_type: "STOCK", license_start: "2026-07-01T00:00:00.000Z", license_end: "2026-12-31T00:00:00.000Z", licensed_channels: ["OWNED", "EMAIL"], max_licensed_uses: 2 }
              as: ManagingEditor
              captures: { asset_id: $.data.id }
            - call: "POST /editorial/content-items/${item_id}/asset-usages"
              payload: { asset_id: "${asset_id}", channel: "OWNED" }
              as: ManagingEditor
              captures: { usage_id: $.data.id }
            - call: "POST /editorial/content-items/${item_id}/submit-for-review"
              payload: {}
              as: ManagingEditor
            - call: "GET /editorial/content-items/${item_id}/review-gates"
              payload: {}
              as: ManagingEditor
              captures: { g_sme: "$.data[0].id", g_brand: "$.data[1].id", g_a11y: "$.data[2].id" }
            - call: "POST /editorial/review-gates/${g_sme}/decide"
              payload: { decision: "APPROVED" }
              as: SubjectMatterExpertUser
              as_user_id: "${exp_id}"
            - call: "POST /editorial/review-gates/${g_brand}/decide"
              payload: { decision: "APPROVED" }
              as: BrandReviewer
              as_user_id: "brand-1"
            - call: "POST /editorial/review-gates/${g_a11y}/decide"
              payload: { decision: "APPROVED" }
              as: AccessibilityReviewer
              as_user_id: "a11y-1"
            - call: "POST /editorial/content-items/${item_id}/publish"
              payload: { scheduled_at: "2026-08-03T08:00:00.000Z", channels: ["OWNED", "EMAIL"], meta_description: "A practical buyer guide to zero trust platform pricing for security and procurement teams.", url_slug: "zero-trust-platform-pricing", tags: ["security", "pricing"] }
              as: ManagingEditor
              as_user_id: "me-2"
            - call: "GET /editorial/content-items/${item_id}/distributions"
              payload: {}
              as: ManagingEditor
              captures: { dist_owned: "$.data[0].id", dist_email: "$.data[1].id" }
          trigger:
            - call: "POST /editorial/content-items/${item_id}/retract"
              payload: { reason: "Rate card superseded, pricing table withdrawn." }
              as: ManagingEditor
          assert:
            - "immediately before the trigger the item reads workflow_state PUBLISHED, both distributions read state LIVE with went_live_at 2026-08-03T08:00:00.000Z, CalendarSlot.${slot_id}.committed_points 16 at utilization_pct 40.00 and Asset.${asset_id}.remaining_licensed_uses 1"
            - "the trigger call returns HTTP 200"
            - "ContentItem.${item_id}.workflow_state == RETRACTED"
            - "ContentItem.${item_id}.retracted_at == 2026-08-03T08:00:00.000Z"
            - "ContentItem.${item_id}.commit_points == 16"
            - "AssetUsage.${usage_id}.usage_state == RELEASED"
            - "AssetUsage.${usage_id}.released_at == 2026-08-03T08:00:00.000Z"
            - "Asset.${asset_id}.active_use_count == 0"
            - "Asset.${asset_id}.remaining_licensed_uses == 2"
            - "Distribution.${dist_owned}.state == RETRACTED"
            - "Distribution.${dist_email}.state == RETRACTED"
            - "CalendarSlot.${slot_id}.committed_points == 16"
            - "CalendarSlot.${slot_id}.utilization_pct == 40.00"
            - "CalendarSlot.${slot_id}.status == OPEN"
            - "Campaign.${cmp_id}.committed_points_total == 16"
            - "an implementation that reused the prune compensation for retract would report committed_points 0 and utilization_pct 0.00"
