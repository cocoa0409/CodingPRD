  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check — even on a well-formed POST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/buyers"
              payload: { name: "NoAuth", country_code: "US" }
              as: Anonymous
              captures: { na_err: "$.data.error_id" }
          assert:
            - "na_err == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER' (HTTP 400)"

      - name: ownership_scope_buyer_cannot_touch_other_buyers_sr
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_SCOPE_VIOLATION]"]
        distinguishing_aspect: "BuyerManager of buyer b2 reviewing a sample under b1's SourcingRequest fails with ERR_OWNERSHIP_SCOPE_VIOLATION (403) — entity-backed ownership scoping."
        test_recipe:
          setup: ["Buyers b1 and b2; agent a1; SR sr1 owned by b1; sample s1 SUBMITTED under sr1"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer Two", country_code: "US" }
              as: PlatformAdmin
              captures: { b2_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "S", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/samples"
              payload: { notes: "x" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: BuyerManager
              as_user_id: "${b2_id}"
              captures: { own_err: "$.data.error_id" }
          assert:
            - "own_err == 'ERR_OWNERSHIP_SCOPE_VIOLATION' (HTTP 403)"
            - "Sample.${s1_id}.status == 'SUBMITTED' (unchanged)"

