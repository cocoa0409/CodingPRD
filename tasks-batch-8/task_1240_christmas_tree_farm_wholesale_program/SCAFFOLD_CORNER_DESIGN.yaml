        grounds: ["calculations.crew_ticket_pay"]
        distinguishing_aspect: "piece 60000 (100*380 + 100*220) exactly equals floor 60000 (5*8*1500); the pinned tie rule resolves pay_basis to PIECE, not HOURLY_FLOOR."
        test_recipe:
          setup: ["season in HARVEST; block HARVESTABLE; lot with H_5_6=100 and H_8_9=100; order A (100x H_8_9) and order B (100x H_5_6) allocated; crew size 5"]
