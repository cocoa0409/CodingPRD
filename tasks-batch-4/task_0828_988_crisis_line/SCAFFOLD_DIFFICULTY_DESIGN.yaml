# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_vs_comprehensive_diverge
        grounds:
          - calculations.risk_screening_score
          - entities.RiskScreening.fields.risk_score
          - entities.RiskScreening.fields.risk_band
        distinguishing_aspect: "Identical raw screening inputs score 21/IMMINENT under PROVISIONAL but 17/HIGH under COMPREHENSIVE — the two variants operate on the RiskScreening/Contact domain and diverge in both score and band."
        test_recipe:
          setup:
            - "Two fresh INTAKE contacts, one to be screened PROVISIONAL and one COMPREHENSIVE, with identical raw inputs (ideation 2, plan 2, means true, prior 1, protective 2)."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "dvc-prov-01"}
              as: ClinicalSupervisor
              captures: {c_prov: "$.data.id"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "dvc-comp-01"}
              as: ClinicalSupervisor
              captures: {c_comp: "$.data.id"}
          trigger:
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_prov}", screening_type: "PROVISIONAL", suicidal_ideation: 2, plan_specificity: 2, means_access: true, prior_attempts: 1, protective_factors: 2}
              as: CrisisCounselor
              captures: {sc_prov: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_comp}", screening_type: "COMPREHENSIVE", suicidal_ideation: 2, plan_specificity: 2, means_access: true, prior_attempts: 1, protective_factors: 2}
              as: CrisisCounselor
              captures: {sc_comp: "$.data.id"}
          assert:
            - "RiskScreening.${sc_prov}.risk_score == 21"
            - "RiskScreening.${sc_prov}.risk_band == IMMINENT"
            - "RiskScreening.${sc_comp}.risk_score == 17"
            - "RiskScreening.${sc_comp}.risk_band == HIGH"

      - name: dispatch_priority_estimated_vs_reassessed_diverge
        grounds:
          - calculations.dispatch_priority_score
          - entities.MobileDispatch.fields.priority_score_estimated
          - entities.MobileDispatch.fields.priority_score_reassessed
        distinguishing_aspect: "The same MobileDispatch scores 68 ESTIMATED (wait 25min) but 80 REASSESSED (wait 55min) — dual-variant logic on the MobileDispatch domain, a different entity from the risk-screening dual variant."
        test_recipe:
          setup:
            - "A HIGH-band contact (band weight 60) in DISPATCH_PENDING created at clock 00:00; a team on shift; clock advanced to 00:25 before dispatch creation."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "dpr-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team A", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-03-01T00:25:00Z"}
              as: ClinicalSupervisor
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {d_id: "$.data.id"}
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "EN_ROUTE"}
              as: CrisisDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-03-01T00:55:00Z"}
              as: ClinicalSupervisor
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "ON_SCENE", on_scene_acuity: "HIGH"}
              as: CrisisDispatcher
          assert:
            - "MobileDispatch.${d_id}.priority_score_estimated == 68"
            - "MobileDispatch.${d_id}.priority_score_reassessed == 80"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_nonlinear_caps_and_conditional_means
        grounds:
          - calculations.risk_screening_score
          - entities.RiskScreening.fields.risk_score
        distinguishing_aspect: "Mode (a): risk_screening_score combines >=3 inputs with min() caps on ideation/prior/protective and a conditional means bonus; inputs 5/3/true/9/9 clamp to score 26 (not a linear sum)."
        test_recipe:
          setup:
            - "One INTAKE contact to receive a single COMPREHENSIVE screening with over-cap inputs."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "CHAT", caller_key: "cf-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
          trigger:
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 5, plan_specificity: 3, means_access: true, prior_attempts: 9, protective_factors: 9}
              as: CrisisCounselor
              captures: {sc_id: "$.data.id"}
          assert:
            - "RiskScreening.${sc_id}.risk_score == 26"
            - "RiskScreening.${sc_id}.risk_band == IMMINENT"

      - name: avg_time_to_disposition_rounds_per_contact_before_sum
        grounds:
          - calculations.avg_time_to_disposition
          - entities.Contact.fields.disposition_at
        distinguishing_aspect: "Mode (b): pinned rounding order — per-contact minutes rounded first (7.5->8, 4.333->4) then averaged to 6.0; the sum-then-round path yields 5.9, so the order is observable."
        test_recipe:
          setup:
            - "Two MODERATE contacts created at clock 00:00; C2 disposed DE_ESCALATION at 00:04:20, C1 disposed DE_ESCALATION at 00:07:30."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "att-c1"}
              as: ClinicalSupervisor
              captures: {c1: "$.data.id"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "att-c2"}
              as: ClinicalSupervisor
              captures: {c2: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c1}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c2}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-03-01T00:04:20Z"}
              as: ClinicalSupervisor
            - call: "POST /contacts/${c2}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-03-01T00:07:30Z"}
              as: ClinicalSupervisor
            - call: "POST /contacts/${c1}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
          trigger:
            - call: "GET /reports/operations"
              payload: {}
              as: ClinicalSupervisor
          assert:
            - "reports.operations.avg_time_to_disposition_minutes == 6.0"
            - "reports.operations.total_contacts == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: contact_screened_branches_to_emergency_with_divergent_side_effects
        grounds:
          - state_machines.Contact.SCREENED_to_EMERGENCY_911
          - entities.Contact.fields.emergency_status
          - entities.EmergencyCoordination.fields.contact_id
        distinguishing_aspect: "Contact forks at SCREENED; the EMERGENCY_911 branch creates an EmergencyCoordination and sets emergency_status=INITIATED — side effects the DE_ESCALATION and DISPATCH_PENDING branches do not produce."
        test_recipe:
          setup:
            - "One IMMINENT-band contact in SCREENED."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "TEXT", caller_key: "br-emg-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 3, plan_specificity: 3, means_access: true, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "EMERGENCY_911"}
              as: CrisisDispatcher
            - call: "GET /emergency-coordinations"
              payload: {contact_id: "${c_id}"}
              as: CrisisDispatcher
              captures: {ec_id: "$.data[0].id"}
          assert:
            - "Contact.${c_id}.status == EMERGENCY_911"
            - "Contact.${c_id}.emergency_status == INITIATED"
            - "GET /emergency-coordinations?contact_id=${c_id} returns exactly 1 record"
            - "EmergencyCoordination.${ec_id}.risk_band_at_escalation == IMMINENT"

      - name: followup_reschedule_cycle_returns_to_rescheduled
        grounds:
          - state_machines.FollowUpTask.RESCHEDULED_to_ATTEMPTED
          - state_machines.FollowUpTask.SCHEDULED_to_ATTEMPTED
          - entities.FollowUpTask.fields.attempt_count
        distinguishing_aspect: "FollowUpTask loops SCHEDULED->ATTEMPTED->RESCHEDULED->ATTEMPTED->RESCHEDULED: two NO_ANSWER attempts leave it back in RESCHEDULED with attempt_count 2 — a cycle, not a linear pipeline, on a different entity than Contact."
        test_recipe:
          setup:
            - "A resolved DE_ESCALATION contact with an ACTIVE safety plan whose RESOLVED transition scheduled one FollowUpTask (SCHEDULED)."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "fu-cyc-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
            - call: "POST /safety-plans"
              payload: {contact_id: "${c_id}", coping_strategies: ["breathe"], warning_signs: ["insomnia"]}
              as: CrisisCounselor
              captures: {sp_id: "$.data.id"}
            - call: "POST /safety-plans/${sp_id}/state"
              payload: {to_status: "ACTIVE"}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "RESOLVED"}
              as: CrisisCounselor
            - call: "GET /follow-up-tasks"
              payload: {contact_id: "${c_id}"}
              as: CrisisCounselor
              captures: {task_id: "$.data[0].id"}
          trigger:
            - call: "POST /follow-up-tasks/${task_id}/attempt"
              payload: {outcome: "NO_ANSWER", next_scheduled_at: "2026-03-02T00:00:00Z"}
              as: CrisisCounselor
            - call: "POST /follow-up-tasks/${task_id}/attempt"
              payload: {outcome: "NO_ANSWER", next_scheduled_at: "2026-03-03T00:00:00Z"}
              as: CrisisCounselor
          assert:
            - "FollowUpTask.${task_id}.status == RESCHEDULED"
            - "FollowUpTask.${task_id}.attempt_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: escalate_cancels_dispatch_voids_referral_decrements_center
        grounds:
          - state_machines.Contact.REFERRAL_PENDING_to_EMERGENCY_911
          - state_machines.MobileDispatch.REQUESTED_to_CANCELLED
          - state_machines.BedReferral.HELD_to_VOIDED
          - entities.CrisisCenter.fields.held_beds
        distinguishing_aspect: "Depth-3 chain from one trigger: contact escalate -> dispatch CANCELLED -> linked referral VOIDED -> center.held_beds decremented; each hop is caused by the previous, not by the escalate directly."
        test_recipe:
          setup:
            - "HIGH contact in REFERRAL_PENDING with an active REQUESTED dispatch and a HELD bed referral linked to that dispatch; center held_beds == 1."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "casc-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team C", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {d_id: "$.data.id"}
            - call: "POST /crisis-centers"
              payload: {name: "Center C", bed_capacity: 2, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", mobile_dispatch_id: "${d_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {r_id: "$.data.id"}
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "EMERGENCY_911"}
              as: CrisisDispatcher
          assert:
            - "Contact.${c_id}.status == EMERGENCY_911"
            - "MobileDispatch.${d_id}.status == CANCELLED"
            - "BedReferral.${r_id}.status == VOIDED"
            - "CrisisCenter.${center_id}.held_beds == 0"

      - name: center_divert_voids_referral_reverts_contact
        grounds:
          - state_machines.CrisisCenter.ONLINE_to_DIVERTED
          - state_machines.BedReferral.HELD_to_VOIDED
          - state_machines.Contact.REFERRAL_PENDING_to_DISPATCH_PENDING
        distinguishing_aspect: "Depth-2 chain from a different trigger: center DIVERTED -> HELD referral VOIDED -> its contact reverts REFERRAL_PENDING->DISPATCH_PENDING; the contact revert is caused by the referral void, not by the divert directly."
        test_recipe:
          setup:
            - "HIGH contact in REFERRAL_PENDING via a HELD referral (no dispatch link) on an ONLINE center with held_beds == 1."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "divert-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /crisis-centers"
              payload: {name: "Center D", bed_capacity: 1, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {r_id: "$.data.id"}
          trigger:
            - call: "POST /crisis-centers/${center_id}/state"
              payload: {to_status: "DIVERTED"}
              as: CrisisDispatcher
          assert:
            - "BedReferral.${r_id}.status == VOIDED"
            - "Contact.${c_id}.status == DISPATCH_PENDING"
            - "CrisisCenter.${center_id}.held_beds == 0"
            - "CrisisCenter.${center_id}.status == DIVERTED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_disposition_safety_on_contact_state
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Contact.SCREENED_to_DISPATCH_PENDING
        distinguishing_aspect: "A DE_ESCALATION contact with band MODERATE requests DISPATCH_PENDING: the state check (from must be SCREENED, priority 5) and the safety check (band must be HIGH, priority 7) both fail; ERR_INVALID_STATE wins. Pair: state x business_safety."
        test_recipe:
          setup:
            - "A contact disposed to DE_ESCALATION (band MODERATE), i.e. not in SCREENED and not HIGH."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "pc-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
          trigger:
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVALID_STATE"

      - name: referential_beats_capacity_on_bed_referral
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_ACUITY_NOT_ACCEPTED]
        distinguishing_aspect: "A referral with an unaccepted acuity into a center whose only bed-window is already full fails both the referential check (acuity, priority 8) and the temporal-capacity check (priority 9); ERR_ACUITY_NOT_ACCEPTED wins. Pair: business_referential x business_temporal."
        test_recipe:
          setup:
            - "Center accepts only [LOW], bed_capacity 1, with one HELD LOW referral occupying window [00:00,01:00); a second HIGH contact in DISPATCH_PENDING."
          setup_api_calls:
            - call: "POST /crisis-centers"
              payload: {name: "Center R", bed_capacity: 1, accepted_acuities: ["LOW"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "pc-b-fill"}
              as: ClinicalSupervisor
              captures: {c_fill: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_fill}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_fill}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_fill}", crisis_center_id: "${center_id}", acuity: "LOW", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-01T01:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "pc-b-trig"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "GET /crisis-centers/${center_id}"
              payload: {}
              as: CrisisDispatcher
              captures: {center_v2: "$.data.version"}
          trigger:
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T00:45:00Z", expected_crisis_center_version: "${center_v2}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_ACUITY_NOT_ACCEPTED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: risk_band_high_threshold_ge_boundary
        grounds:
          - calculations.risk_screening_score
          - entities.RiskScreening.fields.risk_band
        distinguishing_aspect: "risk_score exactly 12 bands HIGH (>= HIGH_THRESHOLD) while 11 bands MODERATE — the >= boundary on the risk_score metric, reached through POST /risk-screenings."
        test_recipe:
          setup:
            - "Two contacts: one screened to score 12, one to score 11 (COMPREHENSIVE, protective 0)."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "CHAT", caller_key: "bp-12"}
              as: ClinicalSupervisor
              captures: {c12: "$.data.id"}
            - call: "POST /contacts"
              payload: {channel: "CHAT", caller_key: "bp-11"}
              as: ClinicalSupervisor
              captures: {c11: "$.data.id"}
          trigger:
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c12}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
              captures: {sc12: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c11}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
              captures: {sc11: "$.data.id"}
          assert:
            - "RiskScreening.${sc12}.risk_score == 12"
            - "RiskScreening.${sc12}.risk_band == HIGH"
            - "RiskScreening.${sc11}.risk_score == 11"
            - "RiskScreening.${sc11}.risk_band == MODERATE"

      - name: followup_max_attempts_ge_boundary
        grounds:
          - state_machines.FollowUpTask.RESCHEDULED_to_ATTEMPTED
          - entities.FollowUpTask.fields.attempt_count
          - entities.FollowUpTask.fields.max_attempts
        distinguishing_aspect: "The 2nd NO_ANSWER leaves the task RESCHEDULED (attempt_count 2 < 3) but the 3rd flips it to ABANDONED (attempt_count 3 >= max_attempts) — the >= boundary on the attempt_count metric, reached through POST /follow-up-tasks/{id}/attempt (a different metric and endpoint than the risk-score boundary)."
        test_recipe:
          setup:
            - "A resolved contact with one SCHEDULED FollowUpTask (max_attempts 3)."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "bp-fu-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 1, plan_specificity: 2, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DE_ESCALATION"}
              as: CrisisCounselor
            - call: "POST /safety-plans"
              payload: {contact_id: "${c_id}", coping_strategies: ["breathe"], warning_signs: ["insomnia"]}
              as: CrisisCounselor
              captures: {sp_id: "$.data.id"}
            - call: "POST /safety-plans/${sp_id}/state"
              payload: {to_status: "ACTIVE"}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "RESOLVED"}
              as: CrisisCounselor
            - call: "GET /follow-up-tasks"
              payload: {contact_id: "${c_id}"}
              as: CrisisCounselor
              captures: {task_id: "$.data[0].id"}
            - call: "POST /follow-up-tasks/${task_id}/attempt"
              payload: {outcome: "NO_ANSWER", next_scheduled_at: "2026-03-02T00:00:00Z"}
              as: CrisisCounselor
            - call: "POST /follow-up-tasks/${task_id}/attempt"
              payload: {outcome: "NO_ANSWER", next_scheduled_at: "2026-03-03T00:00:00Z"}
              as: CrisisCounselor
          trigger:
            - call: "POST /follow-up-tasks/${task_id}/attempt"
              payload: {outcome: "NO_ANSWER"}
              as: CrisisCounselor
          assert:
            - "FollowUpTask.${task_id}.attempt_count == 3"
            - "FollowUpTask.${task_id}.status == ABANDONED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_create_requires_contact_dispatch_pending
        grounds:
          - validations[priority=8]
          - errors[ERR_CONTACT_NOT_DISPATCH_PENDING]
          - state_machines.Contact.SCREENED_to_DISPATCH_PENDING
        distinguishing_aspect: "Creating a MobileDispatch while its Contact is only SCREENED (not DISPATCH_PENDING) is rejected with ERR_CONTACT_NOT_DISPATCH_PENDING — the dispatch's legality depends on the Contact's state (pair MobileDispatch->Contact)."
        test_recipe:
          setup:
            - "A HIGH contact left in SCREENED (no disposition), plus an on-shift team."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "ce-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team E", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_CONTACT_NOT_DISPATCH_PENDING"

      - name: bed_referral_create_requires_center_online
        grounds:
          - validations[priority=8]
          - errors[ERR_CENTER_OFFLINE]
          - state_machines.CrisisCenter.ONLINE_to_DIVERTED
        distinguishing_aspect: "Creating a BedReferral against a DIVERTED center is rejected with ERR_CENTER_OFFLINE — the referral's legality depends on the CrisisCenter's state (pair BedReferral->CrisisCenter, a different entity pair than dispatch->contact)."
        test_recipe:
          setup:
            - "A HIGH contact in DISPATCH_PENDING and a center transitioned to DIVERTED (no HELD referrals to cascade)."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "ce-b-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /crisis-centers"
              payload: {name: "Center F", bed_capacity: 2, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id"}
            - call: "POST /crisis-centers/${center_id}/state"
              payload: {to_status: "DIVERTED"}
              as: CrisisDispatcher
              captures: {center_v: "$.data.version"}
          trigger:
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_CENTER_OFFLINE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: team_dispatch_window_buffer_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_TEAM_WINDOW_CONFLICT]
          - entities.MobileDispatch.fields.window_start
        distinguishing_aspect: "A second dispatch window [01:10,01:30) starts only 10min after a COMPLETED dispatch that ended at 01:00 — inside the 15min turnaround buffer — so it is rejected even though the team has a free concurrent slot. Single-capacity, buffer-separated interval semantics on MobileCrisisTeam."
        test_recipe:
          setup:
            - "One team (capacity 1) that completed dispatch D1 over [00:30,01:00); a second HIGH contact in DISPATCH_PENDING; clock at 01:05."
          setup_api_calls:
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team T", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "to-a-1"}
              as: ClinicalSupervisor
              captures: {c1: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c1}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c1}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c1}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {d1: "$.data.id"}
            - call: "POST /mobile-dispatches/${d1}/state"
              payload: {to_status: "EN_ROUTE"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches/${d1}/state"
              payload: {to_status: "ON_SCENE", on_scene_acuity: "HIGH"}
              as: CrisisDispatcher
            - call: "POST /mobile-dispatches/${d1}/state"
              payload: {to_status: "COMPLETED"}
              as: CrisisDispatcher
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "to-a-2"}
              as: ClinicalSupervisor
              captures: {c2: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c2}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c2}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "GET /mobile-crisis-teams/${team_id}"
              payload: {}
              as: CrisisDispatcher
              captures: {team_v2: "$.data.version"}
          trigger:
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c2}", team_id: "${team_id}", window_start: "2026-03-01T01:10:00Z", window_end: "2026-03-01T01:30:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v2}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_TEAM_WINDOW_CONFLICT"

      - name: bed_hold_window_aggregate_capacity_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_BED_WINDOW_CONFLICT]
          - entities.BedReferral.fields.window_start
        distinguishing_aspect: "A second HELD bed-window [00:30,01:30) overlapping an existing [00:00,01:00) hold makes concurrent holds 2 > bed_capacity 1, rejected with ERR_BED_WINDOW_CONFLICT. Aggregate-capacity, half-open interval semantics on CrisisCenter — distinct from the team's buffer semantics."
        test_recipe:
          setup:
            - "Center bed_capacity 1 accepts [HIGH] with one HELD referral over [00:00,01:00); a second HIGH contact in DISPATCH_PENDING."
          setup_api_calls:
            - call: "POST /crisis-centers"
              payload: {name: "Center B", bed_capacity: 1, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "to-b-1"}
              as: ClinicalSupervisor
              captures: {c1: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c1}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c1}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c1}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-01T01:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "to-b-2"}
              as: ClinicalSupervisor
              captures: {c2: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c2}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c2}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "GET /crisis-centers/${center_id}"
              payload: {}
              as: CrisisDispatcher
              captures: {center_v2: "$.data.version"}
          trigger:
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c2}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:30:00Z", expected_crisis_center_version: "${center_v2}"}
              as: CrisisDispatcher
              captures: {err: "$.data.error_id"}
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_BED_WINDOW_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: team_slot_conserved_on_dispatch_cancel
        grounds:
          - calculations.team_slot_ledger
          - state_machines.MobileDispatch.REQUESTED_to_CANCELLED
          - entities.MobileCrisisTeam.fields.active_dispatch_count
        distinguishing_aspect: "Create dispatch then cancel it: active_dispatch_count goes 0->1->0 and capacity stays 1, so available_slots + active_dispatch_count == capacity is preserved. Conserved quantity: team dispatch slots."
        test_recipe:
          setup:
            - "A HIGH contact in DISPATCH_PENDING and a capacity-1 team."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "ci-a-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /mobile-crisis-teams"
              payload: {name: "Team I", coverage_zone: "Z1", capacity: 1, shift_start: "2026-03-01T00:00:00Z", shift_end: "2026-03-01T12:00:00Z"}
              as: ClinicalSupervisor
              captures: {team_id: "$.data.id", team_v: "$.data.version"}
            - call: "POST /mobile-dispatches"
              payload: {contact_id: "${c_id}", team_id: "${team_id}", window_start: "2026-03-01T00:30:00Z", window_end: "2026-03-01T01:00:00Z", requested_acuity: "HIGH", expected_team_version: "${team_v}"}
              as: CrisisDispatcher
              captures: {d_id: "$.data.id"}
          trigger:
            - call: "POST /mobile-dispatches/${d_id}/state"
              payload: {to_status: "CANCELLED"}
              as: CrisisDispatcher
          assert:
            - "MobileCrisisTeam.${team_id}.active_dispatch_count == 0"
            - "MobileCrisisTeam.${team_id}.capacity == 1"
            - "MobileDispatch.${d_id}.status == CANCELLED"

      - name: center_bed_conserved_on_referral_void
        grounds:
          - calculations.center_bed_ledger
          - state_machines.BedReferral.HELD_to_VOIDED
          - entities.CrisisCenter.fields.held_beds
          - entities.CrisisCenter.fields.available_beds
        distinguishing_aspect: "Create referral then void it: held_beds goes 0->1->0 and available_beds 1->0->1 on a capacity-1 center, so held_beds + occupied_beds + available_beds == bed_capacity is preserved. Conserved quantity: crisis beds (distinct from team slots)."
        test_recipe:
          setup:
            - "A HIGH contact in DISPATCH_PENDING and a capacity-1 ONLINE center accepting [HIGH]."
          setup_api_calls:
            - call: "POST /contacts"
              payload: {channel: "PHONE", caller_key: "ci-b-01"}
              as: ClinicalSupervisor
              captures: {c_id: "$.data.id"}
            - call: "POST /risk-screenings"
              payload: {contact_id: "${c_id}", screening_type: "COMPREHENSIVE", suicidal_ideation: 0, plan_specificity: 3, means_access: false, prior_attempts: 0, protective_factors: 0}
              as: CrisisCounselor
            - call: "POST /contacts/${c_id}/state"
              payload: {to_status: "DISPATCH_PENDING"}
              as: CrisisDispatcher
            - call: "POST /crisis-centers"
              payload: {name: "Center I", bed_capacity: 1, accepted_acuities: ["HIGH"]}
              as: ClinicalSupervisor
              captures: {center_id: "$.data.id", center_v: "$.data.version"}
            - call: "POST /bed-referrals"
              payload: {contact_id: "${c_id}", crisis_center_id: "${center_id}", acuity: "HIGH", window_start: "2026-03-01T02:00:00Z", window_end: "2026-03-01T06:00:00Z", expected_crisis_center_version: "${center_v}"}
              as: CrisisDispatcher
              captures: {r_id: "$.data.id"}
          trigger:
            - call: "POST /bed-referrals/${r_id}/state"
              payload: {to_status: "VOIDED"}
              as: CrisisDispatcher
          assert:
            - "CrisisCenter.${center_id}.held_beds == 0"
            - "CrisisCenter.${center_id}.available_beds == 1"
            - "BedReferral.${r_id}.status == VOIDED"
