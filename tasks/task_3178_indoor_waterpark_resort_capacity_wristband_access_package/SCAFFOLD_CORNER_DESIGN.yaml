            - call: "POST /resorts/${rl4_id}/reservations"
              payload: { room_type_id: "${rtl4_id}", guest_count: 4, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { resl4_id: "$.data.id" }
            - call: "POST /resorts/${rl4_id}/reservations/${resl4_id}/check_in"
