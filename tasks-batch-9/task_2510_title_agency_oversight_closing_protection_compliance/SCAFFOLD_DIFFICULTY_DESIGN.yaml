          - state_machines.PolicyFile.remittance_status.UNREPORTED_to_REPORTED
          - state_machines.PolicyFile.transfer_status.NOT_REQUIRED_to_PENDING_TRANSFER
          - entities.PolicyFile.fields.issuance_status
          - entities.PolicyFile.fields.remittance_status
          - entities.PolicyFile.fields.transfer_status
