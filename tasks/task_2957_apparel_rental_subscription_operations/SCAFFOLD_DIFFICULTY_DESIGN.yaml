            - "the repair is signed off ACCEPTED by the second technician, the unit is photographed and restocked, so turn 1 closes with turns_completed 1"
            - "the clock is then moved to 2026-08-03T09:00:00Z and turn 2 (2026-08-10 to 2026-08-16) is completed clean: LIGHT soil, NONE damage, no claim"
            - "both receipts land exactly on requested_end_date + RETURN_GRACE_DAYS 2, so late_return_count stays 0"
            - "the clock is finally set to 2026-08-25T00:00:00Z, which is 14 months after the claim and 9 days after the second return"
