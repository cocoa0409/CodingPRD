              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/appointments"
              payload: { repository_id: "${repo_id}", project_id: "${project_id}", researcher_id: "${researcher_id}", start_utc: "2026-04-01T09:00:00Z", end_utc: "2026-04-01T10:00:00Z" }
              as: Researcher
              as_user_id: "${researcher_id}"
