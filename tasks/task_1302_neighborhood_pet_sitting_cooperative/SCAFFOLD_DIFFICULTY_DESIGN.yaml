              payload: { cancelled_reason: "Sitter conflict at 23h" }
              as: Member
              as_user_id: "${f2_id}"
          assert:
            - "Sit A (exactly 24.0h before start): no CANCELLATION_PENALTY ledger row for Member.${f2_id}; credit_balance_hours still 10.00; reliability_score still 50"
            - "Sit B (23.0h before start): CANCELLATION_PENALTY delta_hours == -1.00 (round_half_up(4.00 x 0.25)); credit_balance_hours == 9.00; reliability_score == 42"
            - "Both assignments CANCELLED_BY_SITTER and both requests CANCELLED; provisional_credit_hours == 0.00 after both reversals"

      - name: removal_incident_count_365d_inclusive
        grounds:
