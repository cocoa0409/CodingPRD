              payload: { to_iso8601: "2026-08-01T11:04:10Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /drive-thru/timer-loops/${l1_id}/depart"
              payload: {}
              as: ShiftLeader
              as_user_id: "${sl_id}"
          assert:
            - "Setup witness: ${award_reason_seen} == ALTERNATE (TIER_1 bias, no prior slot so no preferred lane) and MergeSlot.${slot_id}.sequence_index == 1"
            - "HTTP 200; TimerLoop.${l1_id}.timing_state == CLOSED and TimerLoop.${l1_id}.accuracy_state == VERIFIED"
            - "TimerLoop.${l1_id}.merge_wait_seconds == 0 and TimerLoop.${l1_id}.pull_forward_seconds == 60 and TimerLoop.${l1_id}.window_seconds == 130 and TimerLoop.${l1_id}.total_seconds == 250"
            - "TimerLoop.${l1_id}.breach_flags == [PULL_FORWARD, WINDOW]"
            - "CASCADE hop 1: MergeSlot.${slot_id}.slot_state == RELEASED"
            - "CASCADE hop 2: Restaurant.${r_id}.merge_slots_free == 1 (was 0 while the slot was COMMITTED)"
            - "CASCADE hop 3: Restaurant.${r_id}.cars_closed_trailing == 1, cars_per_hour_observed == 6.0, cars_per_hour_effective == 6.0, volume_tier == TIER_2"
            - "CASCADE hop 4: Restaurant.${r_id}.required_oot_count == 1 (TIER_2 min_oot_count 1; lane bump 0 because 6.0 < DUAL_PARALLEL_BUMP_CPH 12)"
            - "CASCADE hop 5: Restaurant.${r_id}.deployed_oot_count == 0 and Restaurant.${r_id}.service_posture == SURGE"

      - name: incident_cascade_pull_forward_forfeits_reserved_slot
        grounds:
          - state_machines.TimerLoop.PENDING_to_REMAKE_OPEN
          - state_machines.MergeSlot.RESERVED_to_FORFEITED
          - calculations.incident_severity_and_cost
          - calculations.restaurant_rollup_recompute
          - calculations.oot_requirement
          - entities.PullForwardOrder.fields.reason
        distinguishing_aspect: |
          Depth-4 chain fired by a DIFFERENT request from the depart cascade above
          (POST /drive-thru/accuracy-incidents): accuracy_state PENDING -> REMAKE_OPEN -> a
          PullForwardOrder with reason REMAKE_OPEN is auto-issued because the loop holds a RESERVED
          MergeSlot -> that slot becomes FORFEITED and merge_slots_free rises 1 -> 2 -> open_remake_count
          1 lifts required_oot_count 0 -> 1 and the posture OPEN -> SURGE; no MergeSlot is released
          here and no car is served, so the two cascades share no hop.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one DUAL_PARALLEL Restaurant with merge_slots_capacity 2 and labor_minutes_budget 300; one StaffMember; one ACTIVE LUNCH DaypartProfile (25/95/40/75)."
            - "One TimerLoop on LANE_A in timing_state ORDERED holding a RESERVED MergeSlot: create 11:00:00Z, greet 11:00:20Z, order-complete 11:01:00Z, merge-award."
            - "Before the trigger: Restaurant.merge_slots_free 1, open_remake_count 0, required_oot_count 0, service_posture OPEN, remake_cost_accrued_cents 0, and the loop has no PullForwardOrder."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, cars_per_hour_ceiling: 6, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
