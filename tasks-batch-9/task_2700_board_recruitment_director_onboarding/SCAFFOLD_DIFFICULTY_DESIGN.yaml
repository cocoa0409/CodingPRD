            - "A DRAFT slate for cycle 2026 with nominees added in the order A, B, C at ballot_order 1, 2, 3, giving fees 9625006 (TIER1), 11550006 (TIER1) and 6300005 (TIER2) for committed_fee_cents 27475017, retainer_credit_applied_cents 5000000 and net_payable_cents 22475017."
