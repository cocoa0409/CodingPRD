            - call: "POST /mro/carts/${cartA}/submit"
              as: CustomerBuyer
              as_user_id: "${custA}"
          trigger:
            - call: "POST /mro/orders"
              payload: { customer_id: "${custB}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", source_cart_id: "${cartA}" }
              as: DistributionAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CART_CUSTOMER_MISMATCH (cart belongs to A, order claims B)"

      - name: central_branch_type_rejected_for_fulfillment
        claim_type: violation_to_error
        grounds: ["errors[ERR_BRANCH_TYPE_REQUIRED]"]
        distinguishing_aspect: "fulfillment_branch_id pointing at a CENTRAL location fails order creation with ERR_BRANCH_TYPE_REQUIRED."
        test_recipe:
