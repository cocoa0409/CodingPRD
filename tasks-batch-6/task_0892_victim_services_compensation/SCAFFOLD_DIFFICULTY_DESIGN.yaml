          - entities.Award.fields.amount_paid_cents
          - entities.Program.fields.budget_disbursed_cents
        distinguishing_aspect: "One PAID transition mutates Disbursement -> recomputes Award.amount_paid_cents/payment_status (FULLY_PAID) -> increments Program.budget_disbursed_cents; each hop caused by the prior (origin distinct from appeal grant)."
        test_recipe:
          setup:
            - "ELIGIBLE case, APPROVED claim net=1,000,000, Award FINALIZED, disbursement 1,000,000 scheduled; program budget_disbursed=0."
          setup_api_calls:
            - call: "POST /compensation/programs"
              payload: { name: "VS Fund", fiscal_year: 2026, total_budget_cents: 10000000, overall_case_cap_cents: 5000000, medical_cap_cents: 3000000, lost_wage_cap_cents: 2000000, funeral_cap_cents: 1000000, mental_health_cap_cents: 1000000 }
