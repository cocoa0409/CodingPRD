          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ADOPTED 20,000,000-cent scenario with committed_cents 0 and uncommitted_cents 20,000,000."
            - "One BID_READY project on Maple St whose project_total_estimate_cents is 11,817,655, all four utilities CLEARED."
