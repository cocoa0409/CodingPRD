# =============================================================================
# Task 1859 — Physician Call Schedule & Locum Coverage
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml /
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1859. Physician Call Schedule & Locum Coverage (hospital medical staff scheduling):
  call rotation generation with fairness & equity rules, holiday/weekend distribution
  & swap marketplace, coverage gap detection & locum requisition, locum credentialing
  & onboarding timeline, call pay/stipend accounting & moonlighting rules,
  unavailability (vacation/CME) constraints, backup call activation, hospital
  coverage requirement compliance

domain_name: physician-call-schedule
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing      # call windows vs unavailability windows, cutoff/lead-time windows
  secondary_archetype: quota_allocation      # per-date coverage requirements + fairness point budgets
  complexity_layers:
    - optimistic_concurrency                 # OCC on CallProgram.version for regenerate
    - cascading_side_effects                 # credentialing auto-fill chain; unavailability approval cascade
    - dual_variant_calculation               # prospective vs actual fairness points; projected vs actual call pay
    - rate_threshold_triggers                # moonlighting 28-day hour cap; equity band; premium tier
  entity_topology: flat                      # peer entities joined by FK references; no nested URLs
  state_machine_shape: cyclic                # SwapRequest POSTED⇄CLAIMED, LocumRequisition OPEN⇄CREDENTIALING, CallSlot OPEN⇄ASSIGNED
  relationship_patterns:
    - one_to_many                            # CallProgram → CallSlot → CallAssignment
    - many_to_many                           # Physician ↔ CallSlot via CallAssignment junction
    - cross_aggregate                        # SwapRequest/LocumRequisition/PayEntry reference across aggregates
  role_model: peer_roles                     # SchedulerAdmin / ChiefOfStaff / Physician / CredentialingOfficer own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CallProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: service_line, type: string, source: input, description: "Specialty namespace; physicians/locums must match this specialty to be assigned" }
      - { name: period_start, type: string, source: input, description: "First scheduled date, ISO YYYY-MM-DD; closed interval start" }
      - { name: period_end, type: string, source: input, description: "Last scheduled date, ISO YYYY-MM-DD; closed interval end; must be >= period_start", constraints: "period_end >= period_start" }
      - { name: holiday_dates, type: array, source: input, default: [], description: "Array of ISO dates inside the period treated as HOLIDAY date_type (precedence over WEEKEND)" }
      - { name: weekday_primary_required, type: integer, source: input, default: 1, description: "PRIMARY call slots generated per WEEKDAY date", constraints: ">= 0" }
      - { name: weekend_primary_required, type: integer, source: input, default: 1, description: "PRIMARY call slots generated per WEEKEND date", constraints: ">= 0" }
      - { name: holiday_primary_required, type: integer, source: input, default: 1, description: "PRIMARY call slots generated per HOLIDAY date", constraints: ">= 0" }
      - { name: weekday_backup_required, type: integer, source: input, default: 0, description: "BACKUP call slots generated per WEEKDAY date", constraints: ">= 0" }
      - { name: weekend_backup_required, type: integer, source: input, default: 0, description: "BACKUP call slots generated per WEEKEND date", constraints: ">= 0" }
      - { name: holiday_backup_required, type: integer, source: input, default: 0, description: "BACKUP call slots generated per HOLIDAY date", constraints: ">= 0; at least one of the six required counts must be > 0" }
      - { name: swap_cutoff_hours, type: integer, source: input, default: 48, description: "Swap claims require slot.window_start - now >= swap_cutoff_hours (equality allowed)" }
      - { name: credentialing_lead_hours, type: integer, source: input, default: 120, description: "CredentialingCase.clear_by = slot.window_start - credentialing_lead_hours" }
      - { name: equity_band_points, type: number, source: input, default: 4.0, description: "Swap approval rejects when claimant's post-swap prospective total_points > post-swap mean + equity_band_points (equality allowed)" }
      - { name: payroll_budget_cents, type: integer, source: input, description: "Cap on payroll_reserved_cents (projected pay of SCHEDULED+ACTIVATED assignments); reserve check uses <= semantics", constraints: "> 0" }
      - { name: primary_rate_cents, type: integer, source: input, default: 50000, description: "Base stipend per PRIMARY call" }
      - { name: backup_rate_cents, type: integer, source: input, default: 20000, description: "Base stipend per BACKUP call" }
      - { name: weekend_multiplier, type: number, source: input, default: 1.25, description: "Pay multiplier on WEEKEND dates" }
      - { name: holiday_multiplier, type: number, source: input, default: 1.5, description: "Pay multiplier on HOLIDAY dates" }
      - { name: backup_activation_multiplier, type: number, source: input, default: 2.0, description: "Pay multiplier applied when a BACKUP assignment is ACTIVATED before being served" }
      - { name: moonlight_premium_multiplier, type: number, source: input, default: 1.15, description: "Pay multiplier for STAFF physicians whose rolling served hours before the slot date reach moonlight_premium_threshold_hours" }
      - { name: moonlight_premium_threshold_hours, type: integer, source: input, default: 40, description: "Rolling-hours threshold that triggers the moonlight premium (>= semantics)" }
      - { name: weekday_call_points, type: number, source: input, default: 1.0, description: "Fairness points per PRIMARY WEEKDAY call" }
      - { name: weekend_call_points, type: number, source: input, default: 2.0, description: "Fairness points per PRIMARY WEEKEND call" }
      - { name: holiday_call_points, type: number, source: input, default: 3.0, description: "Fairness points per PRIMARY HOLIDAY call" }
      - { name: backup_point_multiplier, type: number, source: input, default: 0.5, description: "Fairness point multiplier for BACKUP slots (applied per slot, rounded per slot)" }
      - { name: payroll_reserved_cents, type: integer, source: computed, description: "Sum of projected_pay_cents over assignments in {SCHEDULED, ACTIVATED} in this program; updated on every assignment create/cancel/swap/serve", default: 0 }
      - { name: payroll_accrued_cents, type: integer, source: computed, description: "Sum of PayEntry.amount_cents over PayEntries in {ACCRUED, FINALIZED} in this program; per-entry rounding pinned by calculation program_payroll_total", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | GENERATED | PUBLISHED | RECONCILED" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician display name" }
      - { name: specialty, type: string, source: input, description: "Specialty; must equal CallProgram.service_line for assignment/claim/candidacy" }
      - { name: employment_type, type: enum, source: input, description: "STAFF | LOCUM; LOCUM physicians are exempt from moonlight caps/premiums and may only be placed via the requisition flow", constraints: "STAFF | LOCUM" }
      - { name: moonlight_cap_hours, type: integer, source: input, default: 96, description: "Rolling 28-day cap on committed call hours for STAFF physicians; assignment allowed when resulting total <= cap (equality allowed)", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: UnavailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; owner of the vacation/CME window" }
      - { name: start_date, type: string, source: input, description: "ISO date; CLOSED interval start" }
      - { name: end_date, type: string, source: input, description: "ISO date; CLOSED interval end; end_date >= start_date", constraints: "end_date >= start_date" }
      - { name: kind, type: enum, source: input, default: "VACATION", description: "VACATION | CME | PERSONAL", constraints: "VACATION | CME | PERSONAL" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | CANCELLED" }

  - name: CallSlot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; owning program" }
      - { name: date, type: string, source: system, description: "ISO date of the call day" }
      - { name: call_type, type: enum, source: system, description: "PRIMARY | BACKUP", constraints: "PRIMARY | BACKUP" }
      - { name: position_index, type: integer, source: system, description: "1-based index among same-date same-call_type slots" }
      - { name: date_type, type: enum, source: computed, description: "HOLIDAY if date in program.holiday_dates, else WEEKEND if Saturday/Sunday, else WEEKDAY; HOLIDAY takes precedence over WEEKEND", constraints: "WEEKDAY | WEEKEND | HOLIDAY" }
      - { name: window_start, type: datetime, source: computed, description: "dateT07:00:00Z; half-open call window start" }
      - { name: window_end, type: datetime, source: computed, description: "(date+1)T07:00:00Z; half-open call window end; call_hours = 24" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED | COVERED | UNCOVERED" }

  - name: CallAssignment
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> CallSlot.id; slot being covered (system-set for GENERATED/SWAP/LOCUM_FILL origins)" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; covering physician (system-set for GENERATED/SWAP/LOCUM_FILL origins)" }
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; denormalized from slot for filtering" }
      - { name: origin, type: enum, source: system, description: "GENERATED | MANUAL | SWAP | LOCUM_FILL", constraints: "GENERATED | MANUAL | SWAP | LOCUM_FILL" }
      - { name: source_swap_id, type: string, source: system, description: "FK -> SwapRequest.id; set only when origin == SWAP, else null" }
      - { name: source_requisition_id, type: string, source: system, description: "FK -> LocumRequisition.id; set only when origin == LOCUM_FILL, else null" }
      - { name: call_hours, type: integer, source: computed, description: "Committed hours of the assignment; always 24 (window 07:00 to next-day 07:00)", default: 24 }
      - { name: projected_pay_cents, type: integer, source: computed, description: "Projected pay variant computed at creation: base rate x date multiplier x premium (activation assumed false); feeds payroll_reserved_cents" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVATED | SERVED | SWAPPED | CANCELLED" }
      - { name: activated_at, type: datetime, source: system, description: "Set when a BACKUP assignment is activated; null otherwise" }
      - { name: served_at, type: datetime, source: system, description: "Set on mark-served; null otherwise" }

  - name: SwapRequest
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; denormalized from the offered assignment" }
      - { name: assignment_id, type: string, source: input, description: "FK -> CallAssignment.id; the SCHEDULED assignment being offered" }
      - { name: offerer_physician_id, type: string, source: system, description: "FK -> Physician.id; copied from assignment.physician_id at posting" }
      - { name: claimant_physician_id, type: string, source: system, description: "FK -> Physician.id; set on claim, cleared on decline" }
      - { name: decline_reason, type: string, source: input, description: "Optional reason recorded by ChiefOfStaff on decline" }
      - { name: status, type: enum, source: system, description: "POSTED | CLAIMED | APPROVED | EXECUTED | CANCELLED" }

  - name: CoverageGap
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; owning program" }
      - { name: slot_id, type: string, source: system, description: "FK -> CallSlot.id; uncovered slot" }
      - { name: reason, type: enum, source: system, description: "GENERATION_SHORTFALL | ASSIGNMENT_CANCELLED | PHYSICIAN_DEACTIVATED", constraints: "GENERATION_SHORTFALL | ASSIGNMENT_CANCELLED | PHYSICIAN_DEACTIVATED" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock timestamp when the gap was detected" }
      - { name: resolved_by_assignment_id, type: string, source: system, description: "FK -> CallAssignment.id; assignment that resolved the gap; null while unresolved" }
      - { name: status, type: enum, source: system, description: "OPEN | REQUISITIONED | RESOLVED" }

  - name: LocumRequisition
    parent: null
    common_fields: true
    fields:
      - { name: gap_id, type: string, source: input, description: "FK -> CoverageGap.id; gap this requisition sources a locum for" }
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; denormalized from gap" }
      - { name: candidate_physician_id, type: string, source: input, description: "FK -> Physician.id; LOCUM candidate; null until proposed, cleared when the requisition re-opens" }
      - { name: status, type: enum, source: system, description: "OPEN | SOURCED | CREDENTIALING | READY | FILLED | CANCELLED" }

  - name: CredentialingCase
    parent: null
    common_fields: true
    fields:
      - { name: requisition_id, type: string, source: system, description: "FK -> LocumRequisition.id; parent requisition" }
      - { name: locum_physician_id, type: string, source: system, description: "FK -> Physician.id; candidate being credentialed" }
      - { name: clear_by, type: datetime, source: computed, description: "slot.window_start - program.credentialing_lead_hours; complete-item requires now <= clear_by (equality allowed)" }
      - { name: items, type: object, source: system, description: "Five checklist items each holding completed_at or null: license_verification, malpractice_verification, privileges_granting, health_screening, orientation; privileges_granting requires license_verification completed first" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_PROGRESS | CLEARED | FAILED | EXPIRED | CANCELLED" }

  - name: PayEntry
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> CallAssignment.id; served assignment this entry pays for" }
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; payee" }
      - { name: program_id, type: string, source: system, description: "FK -> CallProgram.id; denormalized for payroll queries" }
      - { name: slot_date, type: string, source: system, description: "ISO date of the served call" }
      - { name: call_type, type: enum, source: system, description: "PRIMARY | BACKUP copied from slot", constraints: "PRIMARY | BACKUP" }
      - { name: date_type, type: enum, source: system, description: "WEEKDAY | WEEKEND | HOLIDAY copied from slot", constraints: "WEEKDAY | WEEKEND | HOLIDAY" }
      - { name: base_rate_cents, type: integer, source: system, description: "Program base rate snapshot at serve time" }
      - { name: activation_applied, type: boolean, source: system, description: "True when the assignment was ACTIVATED before serving (backup_activation_multiplier applied)" }
      - { name: premium_applied, type: boolean, source: system, description: "True when the STAFF physician's rolling served hours before slot_date reached moonlight_premium_threshold_hours" }
      - { name: amount_cents, type: integer, source: computed, description: "Actual pay variant: round_half_up(base x date_multiplier x activation x premium) to whole cents, computed once at mark-served" }
      - { name: status, type: enum, source: system, description: "ACCRUED | FINALIZED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CallProgram
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: POST /api/call-programs/{id}/generate
        actor: SchedulerAdmin
        preconditions:
          - "Program is DRAFT (ERR_PROGRAM_NOT_DRAFT otherwise)"
        side_effects:
          - "Creates CallSlots for every date in [period_start, period_end] (closed) per the six required-count fields; date_type HOLIDAY > WEEKEND > WEEKDAY precedence"
          - "Runs rotation_auto_assignment: PRIMARY slots in (date ASC, position_index ASC), then BACKUP slots in (date ASC, position_index ASC); each filled slot -> CallAssignment(origin GENERATED, SCHEDULED) and slot -> ASSIGNED"
          - "Each slot with an empty eligible pool stays OPEN and gets a CoverageGap(reason GENERATION_SHORTFALL, OPEN)"
          - "payroll_reserved_cents updated from projected_pay_cents of new SCHEDULED assignments; program.version increments"

      - from: GENERATED
        to: GENERATED
        trigger: POST /api/call-programs/{id}/regenerate
        actor: SchedulerAdmin
        preconditions:
          - "Program is GENERATED (ERR_PROGRAM_NOT_GENERATED otherwise)"
          - "No assignment in the program is ACTIVATED or SERVED (ERR_REGENERATE_HAS_PROGRESS otherwise)"
          - "expected_call_program_version equals current version (ERR_STALE_VERSION otherwise, 412)"
        side_effects:
          - "Deletes all existing CallSlots, CallAssignments and CoverageGaps of the program (only GENERATED-origin SCHEDULED assignments can exist pre-publish)"
          - "Re-runs slot creation + rotation_auto_assignment exactly as DRAFT->GENERATED"
          - "payroll_reserved_cents recomputed from the new assignments; program.version increments"
        note: "Self-loop with full replacement; guarded by OCC on CallProgram.version"

      - from: GENERATED
        to: PUBLISHED
        trigger: POST /api/call-programs/{id}/publish
        actor: SchedulerAdmin
        preconditions:
          - "Program is GENERATED (ERR_PROGRAM_NOT_GENERATED otherwise)"
        side_effects:
          - "status -> PUBLISHED; swaps and manual assignments become possible; program.version increments"

      - from: PUBLISHED
        to: RECONCILED
        trigger: POST /api/call-programs/{id}/reconcile
        actor: SchedulerAdmin
        preconditions:
          - "Program is PUBLISHED (ERR_PROGRAM_NOT_PUBLISHED otherwise)"
          - "Every CallAssignment in the program is terminal (SERVED, SWAPPED or CANCELLED) (ERR_UNRESOLVED_ASSIGNMENTS_EXIST otherwise)"
          - "now >= (period_end + 1 day)T00:00:00Z (ERR_PERIOD_NOT_ENDED otherwise)"
        side_effects:
          - "All PayEntries ACCRUED -> FINALIZED"
          - "All slots still OPEN -> UNCOVERED"
          - "status -> RECONCILED; program.version increments"

  - entity: Physician
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: POST /api/physicians/{id}/deactivate
        actor: SchedulerAdmin
        preconditions:
          - "Physician is ACTIVE (ERR_PHYSICIAN_INACTIVE otherwise)"
        side_effects:
          - "Every SCHEDULED CallAssignment of this physician whose slot.window_end > now -> CANCELLED (hop 1)"
          - "Each such cancellation: its slot ASSIGNED -> OPEN, a CoverageGap(reason PHYSICIAN_DEACTIVATED, OPEN) is created, payroll_reserved_cents releases that assignment's projected_pay_cents (hop 2)"
          - "Any SwapRequest in {POSTED, CLAIMED, APPROVED} referencing a cancelled assignment -> CANCELLED (hop 2)"
          - "Any SwapRequest in {POSTED, CLAIMED, APPROVED} whose claimant is this physician -> CANCELLED (hop 2)"

  - entity: UnavailabilityWindow
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /api/unavailability-windows/{id}/approve
        actor: SchedulerAdmin
        preconditions:
          - "Window is REQUESTED (ERR_WINDOW_NOT_REQUESTED otherwise)"
          - "No other APPROVED window of the same physician overlaps [start_date, end_date] under CLOSED-interval semantics (ERR_WINDOW_OVERLAP otherwise)"
          - "No assignment of this physician in {ACTIVATED, SERVED} has its slot.date inside the window (ERR_WINDOW_COVERS_SERVED_ASSIGNMENT otherwise)"
        side_effects:
          - "Every SCHEDULED CallAssignment of this physician whose slot.date is inside the closed window -> CANCELLED (hop 1)"
          - "Each such cancellation: its slot ASSIGNED -> OPEN, a CoverageGap(reason ASSIGNMENT_CANCELLED, OPEN) is created, payroll_reserved_cents releases projected_pay_cents, and any non-terminal SwapRequest referencing it -> CANCELLED (hop 2)"

      - from: REQUESTED
        to: CANCELLED
        trigger: POST /api/unavailability-windows/{id}/cancel
        actor: "Physician (own window) or SchedulerAdmin"
        preconditions:
          - "Window is REQUESTED or APPROVED (ERR_WINDOW_NOT_CANCELLABLE otherwise)"
        side_effects: []
        note: "Cancelling an APPROVED window does NOT restore assignments cancelled at approval"

      - from: APPROVED
        to: CANCELLED
        trigger: POST /api/unavailability-windows/{id}/cancel
        actor: "Physician (own window) or SchedulerAdmin"
        preconditions:
          - "Window is REQUESTED or APPROVED (ERR_WINDOW_NOT_CANCELLABLE otherwise)"
        side_effects: []

  - entity: CallSlot
    initial_state: OPEN
    terminal_states: [COVERED, UNCOVERED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "system (CallAssignment created: POST /api/call-assignments, rotation generation, swap execute, or credentialing auto-fill)"
        actor: system
        preconditions:
          - "Slot is OPEN (ERR_SLOT_NOT_OPEN otherwise for the manual-create path)"
        side_effects:
          - "If a CoverageGap for this slot is OPEN or REQUISITIONED, it -> RESOLVED with resolved_by_assignment_id set (hop 2 of the assignment-creation cascade)"
          - "If that gap was REQUISITIONED by a LocumRequisition in {OPEN, SOURCED, CREDENTIALING}, the requisition -> CANCELLED and its active CredentialingCase -> CANCELLED (hop 3)"

      - from: ASSIGNED
        to: OPEN
        trigger: "system (assignment cancelled directly, via unavailability approval, or via physician deactivation)"
        actor: system
        preconditions: []
        side_effects:
          - "CoverageGap created (reason ASSIGNMENT_CANCELLED or PHYSICIAN_DEACTIVATED)"
        note: "OPEN -> ASSIGNED -> OPEN cycle; a slot may be reassigned any number of times before COVERED"

      - from: ASSIGNED
        to: COVERED
        trigger: "system (assignment mark-served)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: UNCOVERED
        trigger: "system (program reconcile: slots still OPEN become UNCOVERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CallAssignment
    initial_state: SCHEDULED
    terminal_states: [SERVED, SWAPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVATED
        trigger: POST /api/call-assignments/{id}/activate-backup
        actor: "Physician (the assignee) or SchedulerAdmin"
        preconditions:
          - "Assignment is SCHEDULED (ERR_ASSIGNMENT_NOT_ACTIVATABLE otherwise)"
          - "slot.call_type == BACKUP (ERR_ACTIVATION_REQUIRES_BACKUP_SLOT otherwise)"
          - "now is inside [slot.window_start, slot.window_end + 2 hours], both bounds inclusive (ERR_ACTIVATION_WINDOW_CLOSED otherwise)"
        side_effects:
          - "activated_at = now; pay will use the activated variant at mark-served"

      - from: SCHEDULED
        to: SERVED
        trigger: POST /api/call-assignments/{id}/mark-served
        actor: SchedulerAdmin
        preconditions:
          - "Assignment is SCHEDULED or ACTIVATED (ERR_ASSIGNMENT_NOT_SERVABLE otherwise)"
          - "now >= slot.window_end (ERR_SERVE_BEFORE_WINDOW_END otherwise)"
        side_effects:
          - "served_at = now; slot ASSIGNED -> COVERED (hop 1)"
          - "PayEntry created (ACCRUED) via call_pay actual variant (hop 2); payroll_accrued_cents increases by amount_cents"
          - "payroll_reserved_cents releases this assignment's projected_pay_cents (hop 2); program.version increments"

      - from: ACTIVATED
        to: SERVED
        trigger: POST /api/call-assignments/{id}/mark-served
        actor: SchedulerAdmin
        preconditions:
          - "Assignment is SCHEDULED or ACTIVATED (ERR_ASSIGNMENT_NOT_SERVABLE otherwise)"
          - "now >= slot.window_end (ERR_SERVE_BEFORE_WINDOW_END otherwise)"
        side_effects:
          - "Same as SCHEDULED -> SERVED; PayEntry.activation_applied = true"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/call-assignments/{id}/cancel, or cascade from unavailability approval / physician deactivation"
        actor: "SchedulerAdmin or system"
        preconditions:
          - "Assignment is SCHEDULED (ERR_ASSIGNMENT_NOT_SCHEDULED otherwise; ACTIVATED assignments cannot be cancelled)"
        side_effects:
          - "slot ASSIGNED -> OPEN (hop 1)"
          - "CoverageGap created (reason ASSIGNMENT_CANCELLED or PHYSICIAN_DEACTIVATED) (hop 2)"
          - "payroll_reserved_cents releases projected_pay_cents (hop 2)"
          - "Any SwapRequest in {POSTED, CLAIMED, APPROVED} referencing this assignment -> CANCELLED (hop 2)"

      - from: SCHEDULED
        to: SWAPPED
        trigger: "system (swap execute: POST /api/swap-requests/{id}/execute on an APPROVED swap referencing this assignment)"
        actor: system
        preconditions: []
        side_effects:
          - "A replacement CallAssignment is created for the swap claimant (origin SWAP, source_swap_id set, SCHEDULED, projected_pay_cents computed for the claimant) (hop 1 of the swap cascade)"
          - "payroll_reserved_cents adjusts by (replacement projected_pay_cents - this assignment's projected_pay_cents) (hop 2)"
          - "The slot remains ASSIGNED throughout; fairness point ownership moves from offerer to claimant via the status-filtered point sets (hop 2)"

  - entity: SwapRequest
    initial_state: POSTED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: POSTED
        to: CLAIMED
        trigger: POST /api/swap-requests/{id}/claim
        actor: "Physician (claimant, != offerer)"
        preconditions:
          - "Swap is POSTED (ERR_SWAP_NOT_POSTED otherwise)"
          - "Claimant employment_type STAFF (ERR_SWAP_CLAIMANT_INELIGIBLE otherwise) and status ACTIVE (ERR_PHYSICIAN_INACTIVE otherwise)"
          - "Claimant != offerer (ERR_SELF_SWAP otherwise)"
          - "claimant.specialty == program.service_line (ERR_SPECIALTY_MISMATCH otherwise)"
          - "No APPROVED UnavailabilityWindow of claimant covers slot.date (ERR_UNAVAILABILITY_CONFLICT otherwise)"
          - "No half-open window overlap with claimant's assignments in {SCHEDULED, ACTIVATED, SERVED} (ERR_ASSIGNMENT_OVERLAP otherwise)"
          - "Claimant projected rolling hours + 24 <= moonlight_cap_hours (ERR_MOONLIGHT_CAP_EXCEEDED otherwise)"
          - "slot.window_start - now >= program.swap_cutoff_hours, equality allowed (ERR_SWAP_CUTOFF_VIOLATION otherwise)"
        side_effects:
          - "claimant_physician_id = X-User-ID"

      - from: CLAIMED
        to: APPROVED
        trigger: POST /api/swap-requests/{id}/approve
        actor: ChiefOfStaff
        preconditions:
          - "Swap is CLAIMED (ERR_SWAP_NOT_CLAIMED otherwise)"
          - "Referenced assignment is SCHEDULED (ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED otherwise)"
          - "Program is PUBLISHED (ERR_PROGRAM_NOT_PUBLISHED otherwise)"
          - "Equity: claimant post-swap prospective total_points <= post-swap mean prospective points + equity_band_points, equality allowed (ERR_SWAP_EQUITY_BREACH otherwise)"
        side_effects: []

      - from: CLAIMED
        to: POSTED
        trigger: POST /api/swap-requests/{id}/decline
        actor: ChiefOfStaff
        preconditions:
          - "Swap is CLAIMED (ERR_SWAP_NOT_CLAIMED otherwise)"
        side_effects:
          - "claimant_physician_id cleared to null; decline_reason recorded"
        note: "POSTED -> CLAIMED -> POSTED cycle; a swap may be claimed and declined repeatedly"

      - from: APPROVED
        to: EXECUTED
        trigger: POST /api/swap-requests/{id}/execute
        actor: SchedulerAdmin
        preconditions:
          - "Swap is APPROVED (ERR_SWAP_NOT_APPROVED otherwise)"
          - "Referenced assignment is SCHEDULED (ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED otherwise)"
          - "slot.window_start > now (ERR_SLOT_WINDOW_PASSED otherwise)"
          - "Claimant eligibility re-checked: no APPROVED window covering slot.date (ERR_UNAVAILABILITY_CONFLICT), no overlap (ERR_ASSIGNMENT_OVERLAP), moonlight cap (ERR_MOONLIGHT_CAP_EXCEEDED)"
        side_effects:
          - "Referenced assignment SCHEDULED -> SWAPPED (hop 1)"
          - "Replacement CallAssignment created for claimant (origin SWAP, SCHEDULED) (hop 2); slot stays ASSIGNED; payroll_reserved_cents adjusts; fairness ownership transfers (hop 3)"

      - from: POSTED
        to: CANCELLED
        trigger: POST /api/swap-requests/{id}/cancel
        actor: "Physician (the offerer)"
        preconditions:
          - "Swap is POSTED (ERR_SWAP_NOT_POSTED otherwise); a CLAIMED swap must be declined by ChiefOfStaff first"
        side_effects: []

      - from: POSTED
        to: CANCELLED
        trigger: "system (cascade: referenced assignment cancelled or swapped away, or offerer deactivated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLAIMED
        to: CANCELLED
        trigger: "system (cascade: referenced assignment cancelled, or offerer/claimant deactivated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "system (cascade: referenced assignment cancelled, or offerer/claimant deactivated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CoverageGap
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: REQUISITIONED
        trigger: "system (POST /api/locum-requisitions creates a requisition for this gap)"
        actor: system
        preconditions:
          - "Gap is OPEN (ERR_GAP_NOT_OPEN otherwise)"
        side_effects: []

      - from: REQUISITIONED
        to: OPEN
        trigger: "system (the requisition was cancelled, or its credentialing case failed/expired and the requisition re-opened but remains attached)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Only a requisition CANCEL returns the gap to OPEN; case FAILED/EXPIRED re-opens the requisition while the gap stays REQUISITIONED"

      - from: OPEN
        to: RESOLVED
        trigger: "system (a CallAssignment is created for this slot: manual backfill, regeneration, or locum fill)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_by_assignment_id set to the new assignment"

      - from: REQUISITIONED
        to: RESOLVED
        trigger: "system (locum auto-fill completes, or a manual assignment backfills the slot and cancels the requisition)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_by_assignment_id set to the new assignment"

  - entity: LocumRequisition
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: SOURCED
        trigger: POST /api/locum-requisitions/{id}/propose-candidate
        actor: SchedulerAdmin
        preconditions:
          - "Requisition is OPEN (ERR_REQUISITION_NOT_OPEN otherwise)"
          - "Candidate employment_type == LOCUM (ERR_CANDIDATE_NOT_LOCUM otherwise) and status ACTIVE (ERR_PHYSICIAN_INACTIVE otherwise)"
          - "candidate.specialty == program.service_line (ERR_SPECIALTY_MISMATCH otherwise)"
          - "No APPROVED window of candidate covers slot.date (ERR_UNAVAILABILITY_CONFLICT otherwise)"
          - "No half-open window overlap with candidate's assignments in {SCHEDULED, ACTIVATED, SERVED} (ERR_ASSIGNMENT_OVERLAP otherwise)"
        side_effects:
          - "candidate_physician_id set"

      - from: SOURCED
        to: CREDENTIALING
        trigger: POST /api/locum-requisitions/{id}/begin-credentialing
        actor: CredentialingOfficer
        preconditions:
          - "Requisition is SOURCED (ERR_REQUISITION_NOT_SOURCED otherwise)"
          - "now < slot.window_start - program.credentialing_lead_hours (ERR_CREDENTIALING_INFEASIBLE otherwise)"
        side_effects:
          - "CredentialingCase created (INITIATED, all five items null, clear_by = slot.window_start - credentialing_lead_hours)"

      - from: CREDENTIALING
        to: READY
        trigger: "system (final checklist item completed on the CredentialingCase: case -> CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "Immediately advances to FILLED in the same cascade (see CREDENTIALING -> READY -> FILLED chain)"
        note: "READY is transient within the auto-fill cascade"

      - from: READY
        to: FILLED
        trigger: "system (auto-fill on case CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "CallAssignment created for the candidate (origin LOCUM_FILL, source_requisition_id set, SCHEDULED, projected_pay_cents computed) (hop 3 of the credentialing cascade)"
          - "Slot OPEN -> ASSIGNED (hop 4); CoverageGap -> RESOLVED with resolved_by_assignment_id (hop 5); payroll_reserved_cents increases by projected_pay_cents (hop 5)"

      - from: CREDENTIALING
        to: OPEN
        trigger: "system (CredentialingCase FAILED via fail, or EXPIRED via expire)"
        actor: system
        preconditions: []
        side_effects:
          - "candidate_physician_id cleared to null; the gap stays REQUISITIONED"
        note: "OPEN -> SOURCED -> CREDENTIALING -> OPEN re-open cycle; a requisition may cycle through multiple candidates"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/locum-requisitions/{id}/cancel, or system (manual backfill resolved the gap)"
        actor: "SchedulerAdmin or system"
        preconditions:
          - "Requisition is OPEN, SOURCED or CREDENTIALING (ERR_REQUISITION_NOT_CANCELLABLE otherwise)"
        side_effects:
          - "If CREDENTIALING, the active CredentialingCase -> CANCELLED"
          - "Gap REQUISITIONED -> OPEN (unless the trigger was a backfill resolution, which sets the gap RESOLVED instead)"

      - from: SOURCED
        to: CANCELLED
        trigger: POST /api/locum-requisitions/{id}/cancel
        actor: SchedulerAdmin
        preconditions:
          - "Requisition is OPEN, SOURCED or CREDENTIALING (ERR_REQUISITION_NOT_CANCELLABLE otherwise)"
        side_effects:
          - "Gap REQUISITIONED -> OPEN; candidate_physician_id cleared"

      - from: CREDENTIALING
        to: CANCELLED
        trigger: POST /api/locum-requisitions/{id}/cancel
        actor: SchedulerAdmin
        preconditions:
          - "Requisition is OPEN, SOURCED or CREDENTIALING (ERR_REQUISITION_NOT_CANCELLABLE otherwise)"
        side_effects:
          - "Active CredentialingCase -> CANCELLED; gap REQUISITIONED -> OPEN; candidate_physician_id cleared"

  - entity: CredentialingCase
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, EXPIRED, CANCELLED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: POST /api/credentialing-cases/{id}/complete-item (first item)
        actor: CredentialingOfficer
        preconditions:
          - "Case is INITIATED or IN_PROGRESS (ERR_CASE_NOT_ACTIVE otherwise)"
          - "now <= clear_by, equality allowed (ERR_CREDENTIALING_DEADLINE_PASSED otherwise)"
          - "item privileges_granting requires license_verification already completed (ERR_PREREQUISITE_ITEM_INCOMPLETE otherwise)"
          - "item not already completed (ERR_ITEM_ALREADY_COMPLETED otherwise)"
        side_effects:
          - "items.<item>.completed_at = now"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: POST /api/credentialing-cases/{id}/complete-item (subsequent items)
        actor: CredentialingOfficer
        preconditions:
          - "Same four preconditions as INITIATED -> IN_PROGRESS"
        side_effects:
          - "items.<item>.completed_at = now"

      - from: IN_PROGRESS
        to: CLEARED
        trigger: POST /api/credentialing-cases/{id}/complete-item (fifth and final item)
        actor: CredentialingOfficer
        preconditions:
          - "Same four preconditions as INITIATED -> IN_PROGRESS"
        side_effects:
          - "items.<item>.completed_at = now; case -> CLEARED (hop 1)"
          - "LocumRequisition CREDENTIALING -> READY -> FILLED (hop 2)"
          - "Auto-fill: CallAssignment(origin LOCUM_FILL) created, slot -> ASSIGNED, gap -> RESOLVED, payroll_reserved_cents updated (hops 3-5)"

      - from: INITIATED
        to: FAILED
        trigger: POST /api/credentialing-cases/{id}/fail
        actor: CredentialingOfficer
        preconditions:
          - "Case is INITIATED or IN_PROGRESS (ERR_CASE_NOT_ACTIVE otherwise)"
        side_effects:
          - "LocumRequisition CREDENTIALING -> OPEN; candidate cleared"

      - from: IN_PROGRESS
        to: FAILED
        trigger: POST /api/credentialing-cases/{id}/fail
        actor: CredentialingOfficer
        preconditions:
          - "Case is INITIATED or IN_PROGRESS (ERR_CASE_NOT_ACTIVE otherwise)"
        side_effects:
          - "LocumRequisition CREDENTIALING -> OPEN; candidate cleared"

      - from: INITIATED
        to: EXPIRED
        trigger: POST /api/credentialing-cases/{id}/expire
        actor: CredentialingOfficer
        preconditions:
          - "Case is INITIATED or IN_PROGRESS (ERR_CASE_NOT_ACTIVE otherwise)"
          - "now > clear_by (ERR_CREDENTIALING_NOT_EXPIRED otherwise)"
        side_effects:
          - "LocumRequisition CREDENTIALING -> OPEN; candidate cleared"

      - from: IN_PROGRESS
        to: EXPIRED
        trigger: POST /api/credentialing-cases/{id}/expire
        actor: CredentialingOfficer
        preconditions:
          - "Case is INITIATED or IN_PROGRESS (ERR_CASE_NOT_ACTIVE otherwise)"
          - "now > clear_by (ERR_CREDENTIALING_NOT_EXPIRED otherwise)"
        side_effects:
          - "LocumRequisition CREDENTIALING -> OPEN; candidate cleared"

      - from: INITIATED
        to: CANCELLED
        trigger: "system (parent requisition cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (parent requisition cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayEntry
    initial_state: ACCRUED
    terminal_states: [FINALIZED]
    transitions:
      - from: ACCRUED
        to: FINALIZED
        trigger: "system (program reconcile finalizes all ACCRUED entries)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-regenerate-stale-version
    parent_entity: CallProgram
    write_endpoint: POST /api/call-programs/{id}/regenerate
    occ_field: expected_call_program_version
    description: |
      Regenerating a rotation against a CallProgram whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where another writer has just regenerated (which legitimately
      supersedes the prior slot/assignment set) and the current writer's view
      of the program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: slot_generation_plan
    trigger: "POST /api/call-programs/{id}/generate and /regenerate"
    algorithm: interval_enumeration
    formula: |
      for each date d in [period_start, period_end] (CLOSED interval, both ends inclusive):
        date_type(d) = HOLIDAY if d in holiday_dates
                       else WEEKEND if weekday(d) in {Saturday, Sunday}
                       else WEEKDAY          # HOLIDAY precedence over WEEKEND is pinned
        create <date_type>_primary_required slots { call_type: PRIMARY, position_index 1..N }
        create <date_type>_backup_required  slots { call_type: BACKUP,  position_index 1..N }
      every slot: window_start = dateT07:00:00Z, window_end = (date+1)T07:00:00Z (half-open; call_hours = 24)
    input_set: "CallProgram config fields; holiday_dates membership decides HOLIDAY before the Saturday/Sunday check"
    constants:
      CALL_WINDOW_START_HOUR: 7
      CALL_HOURS: 24

  - name: rotation_auto_assignment
    trigger: "slot generation (generate / regenerate)"
    algorithm: weighted_scoring
    formula: |
      Process PRIMARY slots in (date ASC, position_index ASC), then BACKUP slots in (date ASC, position_index ASC).
      For each slot, build the eligible pool over Physician:
        employment_type == STAFF AND status == ACTIVE AND specialty == program.service_line
        AND no APPROVED UnavailabilityWindow with start_date <= slot.date <= end_date (closed containment)
        AND no CallAssignment in {SCHEDULED, ACTIVATED, SERVED} (including tentative ones created earlier
            in this run) whose half-open window overlaps the slot window
        AND projected rolling hours at slot.date (see moonlight_rolling_hours, projected variant,
            including tentative assignments of this run) + 24 <= physician.moonlight_cap_hours
      Ranking: (1) lowest prospective total_points including tentative assignments made earlier in this run;
               (2) tie-break: lowest prospective undesirable_points (= weekend + holiday points);
               (3) tie-break: earliest physician created_at. UUIDs are never decision inputs.
      Empty pool -> slot stays OPEN, CoverageGap(reason GENERATION_SHORTFALL) created.
      Each tentative assignment immediately counts toward later slots' ranking within the same run.
    input_set: "All ACTIVE STAFF physicians matching specialty; assignments in {SCHEDULED, ACTIVATED, SERVED} plus this run's tentative assignments"
    note: "Deterministic selector: eligibility filter, ranking expression, tie-break and empty-pool fallback all pinned"

  - name: fairness_points
    trigger: "fairness-report read; rotation_auto_assignment ranking; swap-approve equity check; swap execute (ownership transfer via status filtering)"
    algorithm: aggregation
    formula: |
      slot_points(s) = call_points(s.date_type)                      # weekday_call_points | weekend_call_points | holiday_call_points
                       * (s.call_type == BACKUP ? backup_point_multiplier : 1)
      Round each slot_points to 2 decimals round_half_up PER SLOT, then sum (pinned rounding order).
      Physician totals within a program:
        prospective_points(P) = sum over P's assignments with status in {SCHEDULED, ACTIVATED, SERVED}
        actual_points(P)      = sum over P's assignments with status in {SERVED}
      Report population: physicians with >= 1 assignment in {SCHEDULED, ACTIVATED, SERVED} in the program.
      mean = total_prospective / population_size (2 decimals round_half_up); same for actual.
      Equity breach at swap approve: claimant_prospective_after > mean_after + equity_band_points (strictly greater).
    input_set: "CallAssignments of the program filtered by the variant's status set; SWAPPED and CANCELLED excluded from both variants"
    precision: "2 decimal places per slot, round_half_up; report means 2 decimal places round_half_up"
    variants:
      - name: prospective
        when: "generation ranking, swap equity check, fairness-report prospective column"
        difference: "includes SCHEDULED and ACTIVATED commitments in addition to SERVED"
      - name: actual
        when: "fairness-report actual column; end-of-period equity review"
        difference: "counts only SERVED assignments, so identical data yields lower-or-equal totals than prospective"

  - name: moonlight_rolling_hours
    trigger: "manual assignment create; swap claim; swap execute re-check; candidate proposal is exempt (LOCUM); generation eligibility; call_pay premium tier"
    algorithm: threshold
    formula: |
      Rolling window for slot date D = closed date interval [D - 27 days, D].
      projected_hours(P, D) = sum of call_hours (24 each) over P's assignments in
                              {SCHEDULED, ACTIVATED, SERVED} with slot date in [D-27, D]
      Cap check (STAFF only): projected_hours + 24 <= P.moonlight_cap_hours  (equality allowed; > rejected)
      Premium tier (STAFF only, used by call_pay):
        served_hours_before(P, D) = sum over P's SERVED assignments with slot date in [D-27, D-1]  (strictly before D)
        premium applies when served_hours_before >= moonlight_premium_threshold_hours  (>= semantics)
      LOCUM physicians: both checks skipped.
    input_set: "Physician's own assignments; status set per variant; dates inside the closed 28-date window [D-27, D]"
    constants:
      ROLLING_WINDOW_DAYS: 28
      CALL_HOURS: 24
    variants:
      - name: projected
        when: "assignment create / swap claim / generation"
        difference: "statuses {SCHEDULED, ACTIVATED, SERVED} — forward commitments count"
      - name: served_only
        when: "call_pay premium tier at mark-served"
        difference: "only SERVED assignments strictly before slot date count"

  - name: call_pay
    trigger: "projected variant at CallAssignment creation (writes projected_pay_cents and payroll_reserved_cents); actual variant at mark-served (creates PayEntry.amount_cents)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (single rounding at the end):
        base      = slot.call_type == PRIMARY ? primary_rate_cents : backup_rate_cents
        date_mult = date_type == HOLIDAY ? holiday_multiplier : (date_type == WEEKEND ? weekend_multiplier : 1.0)
        act_mult  = (assignment was ACTIVATED when served) ? backup_activation_multiplier : 1.0
        prem_mult = (STAFF physician AND premium tier reached per moonlight_rolling_hours) ? moonlight_premium_multiplier : 1.0
        amount_cents = round_half_up(base * date_mult * act_mult * prem_mult) to integer cents
      Projected variant: computed at assignment creation with act_mult fixed to 1.0 and the
      premium tier evaluated on the projected hour set; written to CallAssignment.projected_pay_cents.
      Actual variant: computed once at mark-served with the true activation flag and the served-only
      hour set; written to PayEntry.amount_cents (immutable afterwards).
    input_set: "CallAssignment + its CallSlot + program rate config + physician rolling hours"
    precision: "integer cents, round_half_up, exactly one rounding step after all multipliers"
    variants:
      - name: projected
        when: "assignment creation (any origin)"
        difference: "activation assumed false; premium tier from projected hours — a backup later ACTIVATED pays more than its projection"
      - name: actual
        when: "mark-served"
        difference: "true activation flag and served-only premium hours — diverges from projected for activated backups and for physicians whose premium tier changed"

  - name: program_payroll_total
    trigger: "payroll_accrued_cents recompute on PayEntry creation and reconcile; payroll_reserved_cents recompute on assignment create/cancel/serve/swap"
    algorithm: aggregation
    formula: |
      payroll_accrued_cents  = SUM(PayEntry.amount_cents) over PayEntries in {ACCRUED, FINALIZED} of the program
      payroll_reserved_cents = SUM(CallAssignment.projected_pay_cents) over assignments in {SCHEDULED, ACTIVATED}
      ROUNDING ORDER PINNED: each PayEntry.amount_cents is rounded to whole cents at serve time
      (see call_pay); the program total sums the already-rounded integers. The alternative order
      (sum unrounded products, then round) yields different cents and is forbidden.
      Fiscal gate on any assignment creation (including swap/locum replacements):
        payroll_reserved_cents + new projected_pay_cents <= payroll_budget_cents  (equality allowed)
        else ERR_PAYROLL_BUDGET_EXCEEDED
    input_set: "PayEntries in {ACCRUED, FINALIZED}; CallAssignments in {SCHEDULED, ACTIVATED}"
    precision: "integer cents; per-entry rounding then integer sum"

  - name: coverage_compliance
    trigger: "GET /api/call-programs/{id}/coverage-report"
    algorithm: aggregation
    formula: |
      For each date d in [period_start, period_end] (closed):
        required_primary = <date_type(d)>_primary_required; required_backup likewise
        covered_primary = count of PRIMARY slots of d whose status in {ASSIGNED, COVERED}
        covered_backup  = count of BACKUP  slots of d whose status in {ASSIGNED, COVERED}
        shortfall_primary = max(0, required_primary - covered_primary); same for backup
        date is COMPLIANT when covered_primary >= required_primary AND covered_backup >= required_backup
        (>= semantics: exact coverage counts as compliant; equality boundary pinned)
      Report totals: compliant_date_count, noncompliant_date_count, open_gap_count (gaps in {OPEN, REQUISITIONED}).
    input_set: "Slots of the program with status in {OPEN, ASSIGNED, COVERED, UNCOVERED}; config required counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership for entity-backed Physician role: physician_id (window create/cancel) equals X-User-ID; swap POST assignment belongs to X-User-ID; activate-backup assignee equals X-User-ID; swap cancel caller is the offerer"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /api/unavailability-windows, POST /api/unavailability-windows/{id}/cancel, POST /api/swap-requests, POST /api/swap-requests/{id}/cancel, POST /api/call-assignments/{id}/activate-backup"

  - priority: 4
    category: existence
    check: "Request shape: required fields present, types valid, enum members valid, end_date >= start_date, period_end >= period_start, counts >= 0, at least one required slot count > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "Path ids exist, validated left-to-right; then body-referenced ids in declared input order (e.g. POST /api/call-assignments validates slot_id before physician_id)"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SWAP_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_GAP_NOT_FOUND | ERR_REQUISITION_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_PAY_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 6
    category: state
    check: "Target entity state preconditions per §1.2 (program phase, slot OPEN, assignment SCHEDULED, swap POSTED/CLAIMED/APPROVED, window REQUESTED, gap OPEN, requisition OPEN/SOURCED, case active, physician ACTIVE for deactivate)"
    error_id: "ERR_PROGRAM_NOT_DRAFT | ERR_PROGRAM_NOT_GENERATED | ERR_PROGRAM_NOT_PUBLISHED | ERR_SLOT_NOT_OPEN | ERR_ASSIGNMENT_NOT_SCHEDULED | ERR_ASSIGNMENT_NOT_ACTIVATABLE | ERR_ASSIGNMENT_NOT_SERVABLE | ERR_SWAP_NOT_POSTED | ERR_SWAP_NOT_CLAIMED | ERR_SWAP_NOT_APPROVED | ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED | ERR_WINDOW_NOT_REQUESTED | ERR_WINDOW_NOT_CANCELLABLE | ERR_GAP_NOT_OPEN | ERR_REQUISITION_NOT_OPEN | ERR_REQUISITION_NOT_SOURCED | ERR_REQUISITION_NOT_CANCELLABLE | ERR_CASE_NOT_ACTIVE | ERR_PHYSICIAN_INACTIVE(deactivate) | ERR_UNRESOLVED_ASSIGNMENTS_EXIST | ERR_REGENERATE_HAS_PROGRESS"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_call_program_version equals CallProgram.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/call-programs/{id}/regenerate"

  - priority: 8
    category: business_safety
    check: "Physician ACTIVE for new commitments (ERR_PHYSICIAN_INACTIVE); no APPROVED unavailability covering the slot date (ERR_UNAVAILABILITY_CONFLICT); moonlight cap with <= semantics (ERR_MOONLIGHT_CAP_EXCEEDED); window approval must not cover ACTIVATED/SERVED assignments (ERR_WINDOW_COVERS_SERVED_ASSIGNMENT); privileges_granting item requires license_verification (ERR_PREREQUISITE_ITEM_INCOMPLETE)"
    error_id: "ERR_PHYSICIAN_INACTIVE | ERR_UNAVAILABILITY_CONFLICT | ERR_MOONLIGHT_CAP_EXCEEDED | ERR_WINDOW_COVERS_SERVED_ASSIGNMENT | ERR_PREREQUISITE_ITEM_INCOMPLETE"
    http_status: 409
    applies_to: "POST /api/call-assignments, POST /api/swap-requests/{id}/claim, POST /api/swap-requests/{id}/execute, POST /api/locum-requisitions/{id}/propose-candidate, POST /api/unavailability-windows/{id}/approve, POST /api/credentialing-cases/{id}/complete-item"

  - priority: 9
    category: business_temporal
    check: "Closed-interval window overlap on approve (ERR_WINDOW_OVERLAP); half-open assignment overlap (ERR_ASSIGNMENT_OVERLAP); swap cutoff >= swap_cutoff_hours, equality allowed (ERR_SWAP_CUTOFF_VIOLATION); mark-served requires now >= window_end (ERR_SERVE_BEFORE_WINDOW_END); activation within [window_start, window_end + 2h] inclusive (ERR_ACTIVATION_WINDOW_CLOSED); no new commitments once slot window passed (ERR_SLOT_WINDOW_PASSED); credentialing deadlines (ERR_CREDENTIALING_DEADLINE_PASSED | ERR_CREDENTIALING_NOT_EXPIRED | ERR_CREDENTIALING_INFEASIBLE); reconcile requires period ended (ERR_PERIOD_NOT_ENDED)"
    error_id: "ERR_WINDOW_OVERLAP | ERR_ASSIGNMENT_OVERLAP | ERR_SWAP_CUTOFF_VIOLATION | ERR_SERVE_BEFORE_WINDOW_END | ERR_ACTIVATION_WINDOW_CLOSED | ERR_SLOT_WINDOW_PASSED | ERR_CREDENTIALING_DEADLINE_PASSED | ERR_CREDENTIALING_NOT_EXPIRED | ERR_CREDENTIALING_INFEASIBLE | ERR_PERIOD_NOT_ENDED"
    http_status: 409
    applies_to: "temporal-rule endpoints per §1.2"

  - priority: 10
    category: business_constraint
    check: "Specialty equals program.service_line (ERR_SPECIALTY_MISMATCH); manual assignment is STAFF-only (ERR_MANUAL_ASSIGNMENT_STAFF_ONLY); swap claimant STAFF (ERR_SWAP_CLAIMANT_INELIGIBLE); requisition candidate LOCUM (ERR_CANDIDATE_NOT_LOCUM); claimant != offerer (ERR_SELF_SWAP); one non-terminal swap per assignment (ERR_DUPLICATE_ACTIVE_SWAP); checklist item not repeated (ERR_ITEM_ALREADY_COMPLETED); swap equity band (ERR_SWAP_EQUITY_BREACH); backup activation only on BACKUP slots (ERR_ACTIVATION_REQUIRES_BACKUP_SLOT)"
    error_id: "ERR_SPECIALTY_MISMATCH | ERR_MANUAL_ASSIGNMENT_STAFF_ONLY | ERR_SWAP_CLAIMANT_INELIGIBLE | ERR_CANDIDATE_NOT_LOCUM | ERR_SELF_SWAP | ERR_DUPLICATE_ACTIVE_SWAP | ERR_ITEM_ALREADY_COMPLETED | ERR_SWAP_EQUITY_BREACH | ERR_ACTIVATION_REQUIRES_BACKUP_SLOT"
    http_status: 409
    applies_to: "business-rule endpoints per §1.2"

  - priority: 11
    category: business_fiscal
    check: "payroll_reserved_cents + new projected_pay_cents <= payroll_budget_cents (equality allowed)"
    error_id: ERR_PAYROLL_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/call-assignments, POST /api/swap-requests/{id}/execute, credentialing auto-fill cascade"

# =============================================================================
# §1.5 API Endpoint Table (50 endpoints)
# =============================================================================
endpoints:
  # --- CallProgram lifecycle ---
  - method: POST
    path: "/api/call-programs"
    description: "Create a call program (DRAFT). At least one of the six required slot counts must be > 0."
    roles: [SchedulerAdmin]
    code: 201
    input: [name, service_line, period_start, period_end, payroll_budget_cents, "holiday_dates?", "weekday_primary_required?", "weekend_primary_required?", "holiday_primary_required?", "weekday_backup_required?", "weekend_backup_required?", "holiday_backup_required?", "swap_cutoff_hours?", "credentialing_lead_hours?", "equity_band_points?", "primary_rate_cents?", "backup_rate_cents?", "weekend_multiplier?", "holiday_multiplier?", "backup_activation_multiplier?", "moonlight_premium_multiplier?", "moonlight_premium_threshold_hours?", "weekday_call_points?", "weekend_call_points?", "holiday_call_points?", "backup_point_multiplier?"]
    output: CallProgram
    side_effects: ["status DRAFT; payroll_reserved_cents 0; payroll_accrued_cents 0; version 1"]

  - method: GET
    path: "/api/call-programs"
    description: "List call programs"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "service_line?"]
    output: CallProgram[]
    side_effects: []

  - method: GET
    path: "/api/call-programs/{id}"
    description: "Get a call program"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: CallProgram
    side_effects: []

  - method: POST
    path: "/api/call-programs/{id}/generate"
    description: "Generate slots and run rotation_auto_assignment (DRAFT -> GENERATED)"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: CallProgram
    side_effects: ["slot_generation_plan", "rotation_auto_assignment", "shortfall CoverageGaps", "payroll_reserved_cents recompute", "version +1"]

  - method: POST
    path: "/api/call-programs/{id}/regenerate"
    description: "Regenerate the rotation, superseding the current generated set; OCC-guarded (GENERATED -> GENERATED)"
    roles: [SchedulerAdmin]
    code: 200
    input: [expected_call_program_version]
    output: CallProgram
    side_effects: ["wipes and rebuilds slots/assignments/gaps", "increments CallProgram.version by 1", "payroll_reserved_cents recompute"]

  - method: POST
    path: "/api/call-programs/{id}/publish"
    description: "Publish the generated rotation (GENERATED -> PUBLISHED)"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: CallProgram
    side_effects: ["status -> PUBLISHED; version +1"]

  - method: POST
    path: "/api/call-programs/{id}/reconcile"
    description: "Reconcile after period end (PUBLISHED -> RECONCILED); finalizes pay"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: CallProgram
    side_effects: ["PayEntries ACCRUED -> FINALIZED", "OPEN slots -> UNCOVERED", "status -> RECONCILED; version +1"]

  - method: GET
    path: "/api/call-programs/{id}/fairness-report"
    description: "Computed fairness report: per-physician prospective and actual points, means, equity band"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: "{ program_id: string, population_size: integer, total_prospective_points: number, total_actual_points: number, mean_prospective_points: number, mean_actual_points: number, equity_band_points: number, entries: array }"
    side_effects: []

  - method: GET
    path: "/api/call-programs/{id}/coverage-report"
    description: "Computed coverage compliance report per coverage_compliance calculation"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: "{ program_id: string, compliant_date_count: integer, noncompliant_date_count: integer, open_gap_count: integer, dates: array }"
    side_effects: []

  # --- Physician registry ---
  - method: POST
    path: "/api/physicians"
    description: "Register a physician (STAFF or LOCUM), ACTIVE"
    roles: [SchedulerAdmin]
    code: 201
    input: [full_name, specialty, employment_type, "moonlight_cap_hours?"]
    output: Physician
    side_effects: ["status ACTIVE; moonlight_cap_hours defaults to 96"]

  - method: GET
    path: "/api/physicians"
    description: "List physicians"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "employment_type?", "status?", "specialty?"]
    output: Physician[]
    side_effects: []

  - method: GET
    path: "/api/physicians/{id}"
    description: "Get a physician"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: Physician
    side_effects: []

  - method: POST
    path: "/api/physicians/{id}/deactivate"
    description: "Deactivate a physician; cascades cancel future SCHEDULED assignments and related swaps, opening gaps"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: Physician
    side_effects: ["SCHEDULED assignments with slot.window_end > now -> CANCELLED", "slots -> OPEN", "CoverageGaps (PHYSICIAN_DEACTIVATED)", "non-terminal swaps referencing them or claimed by them -> CANCELLED", "reserve release"]

  # --- Unavailability windows ---
  - method: POST
    path: "/api/unavailability-windows"
    description: "Request an unavailability window (REQUESTED). Physician role may only create for self."
    roles: [Physician, SchedulerAdmin]
    code: 201
    input: [physician_id, start_date, end_date, "kind?"]
    output: UnavailabilityWindow
    side_effects: []

  - method: GET
    path: "/api/unavailability-windows"
    description: "List unavailability windows"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "physician_id?", "status?"]
    output: UnavailabilityWindow[]
    side_effects: []

  - method: GET
    path: "/api/unavailability-windows/{id}"
    description: "Get an unavailability window"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: UnavailabilityWindow
    side_effects: []

  - method: POST
    path: "/api/unavailability-windows/{id}/approve"
    description: "Approve a window; closed-interval overlap check; cascade-cancels conflicting SCHEDULED assignments"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: UnavailabilityWindow
    side_effects: ["conflicting SCHEDULED assignments -> CANCELLED", "slots -> OPEN", "CoverageGaps (ASSIGNMENT_CANCELLED)", "reserve release", "referencing non-terminal swaps -> CANCELLED"]

  - method: POST
    path: "/api/unavailability-windows/{id}/cancel"
    description: "Cancel a REQUESTED or APPROVED window; does not restore previously cancelled assignments"
    roles: [Physician, SchedulerAdmin]
    code: 200
    input: []
    output: UnavailabilityWindow
    side_effects: []

  # --- Call slots (read-only; created by generation) ---
  - method: GET
    path: "/api/call-slots"
    description: "List call slots; sort order pinned: date ASC, then call_type ASC (BACKUP before PRIMARY), then position_index ASC"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "date?", "call_type?", "date_type?", "status?"]
    output: CallSlot[]
    side_effects: []

  - method: GET
    path: "/api/call-slots/{id}"
    description: "Get a call slot"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: CallSlot
    side_effects: []

  # --- Call assignments ---
  - method: POST
    path: "/api/call-assignments"
    description: "Manually assign a STAFF physician to an OPEN slot of a PUBLISHED program (origin MANUAL)"
    roles: [SchedulerAdmin]
    code: 201
    input: [slot_id, physician_id]
    output: CallAssignment
    side_effects: ["slot OPEN -> ASSIGNED", "OPEN/REQUISITIONED gap for slot -> RESOLVED (a live requisition is cancelled)", "projected_pay_cents computed (projected variant)", "payroll_reserved_cents increases; program version +1"]

  - method: GET
    path: "/api/call-assignments"
    description: "List call assignments"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "slot_id?", "physician_id?", "status?", "origin?", "source_swap_id?", "source_requisition_id?"]
    output: CallAssignment[]
    side_effects: []

  - method: GET
    path: "/api/call-assignments/{id}"
    description: "Get a call assignment"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: CallAssignment
    side_effects: []

  - method: POST
    path: "/api/call-assignments/{id}/cancel"
    description: "Cancel a SCHEDULED assignment; opens a coverage gap"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: CallAssignment
    side_effects: ["slot ASSIGNED -> OPEN", "CoverageGap (ASSIGNMENT_CANCELLED) created", "referencing non-terminal swaps -> CANCELLED", "reserve release; program version +1"]

  - method: POST
    path: "/api/call-assignments/{id}/mark-served"
    description: "Sign off a completed call (SCHEDULED/ACTIVATED -> SERVED); creates the PayEntry"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: CallAssignment
    side_effects: ["slot -> COVERED", "PayEntry ACCRUED created via call_pay actual variant", "reserve release + accrual; program version +1"]

  - method: POST
    path: "/api/call-assignments/{id}/activate-backup"
    description: "Activate a BACKUP assignment inside its activation window"
    roles: [Physician, SchedulerAdmin]
    code: 200
    input: [reason]
    output: CallAssignment
    side_effects: ["status -> ACTIVATED; activated_at = now"]

  # --- Swap marketplace ---
  - method: POST
    path: "/api/swap-requests"
    description: "Offer one of the caller's SCHEDULED assignments for swap (POSTED)"
    roles: [Physician]
    code: 201
    input: [assignment_id]
    output: SwapRequest
    side_effects: ["offerer_physician_id copied from assignment", "program_id denormalized"]

  - method: GET
    path: "/api/swap-requests"
    description: "List swap requests"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "assignment_id?", "offerer_physician_id?", "claimant_physician_id?", "status?"]
    output: SwapRequest[]
    side_effects: []

  - method: GET
    path: "/api/swap-requests/{id}"
    description: "Get a swap request"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: SwapRequest
    side_effects: []

  - method: POST
    path: "/api/swap-requests/{id}/claim"
    description: "Claim a POSTED swap; full claimant eligibility check incl. cutoff"
    roles: [Physician]
    code: 200
    input: []
    output: SwapRequest
    side_effects: ["claimant_physician_id = X-User-ID; status -> CLAIMED"]

  - method: POST
    path: "/api/swap-requests/{id}/approve"
    description: "Chief-of-staff approval; re-validates assignment state and equity band"
    roles: [ChiefOfStaff]
    code: 200
    input: []
    output: SwapRequest
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/api/swap-requests/{id}/decline"
    description: "Chief-of-staff decline; swap returns to POSTED with claimant cleared (cycle)"
    roles: [ChiefOfStaff]
    code: 200
    input: ["decline_reason?"]
    output: SwapRequest
    side_effects: ["status -> POSTED; claimant_physician_id = null"]

  - method: POST
    path: "/api/swap-requests/{id}/execute"
    description: "Execute an APPROVED swap; re-checks claimant eligibility; transfers the assignment"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: SwapRequest
    side_effects: ["original assignment -> SWAPPED", "replacement CallAssignment (origin SWAP) created for claimant", "reserve delta + fairness transfer; program version +1"]

  - method: POST
    path: "/api/swap-requests/{id}/cancel"
    description: "Offerer cancels a POSTED swap"
    roles: [Physician]
    code: 200
    input: []
    output: SwapRequest
    side_effects: ["status -> CANCELLED"]

  # --- Coverage gaps (read-only; created by cascades) ---
  - method: GET
    path: "/api/coverage-gaps"
    description: "List coverage gaps"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "slot_id?", "status?", "reason?", "resolved_by_assignment_id?"]
    output: CoverageGap[]
    side_effects: []

  - method: GET
    path: "/api/coverage-gaps/{id}"
    description: "Get a coverage gap"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: CoverageGap
    side_effects: []

  # --- Locum requisitions ---
  - method: POST
    path: "/api/locum-requisitions"
    description: "Open a locum requisition for an OPEN gap; requires the credentialing window to be feasible"
    roles: [SchedulerAdmin]
    code: 201
    input: [gap_id]
    output: LocumRequisition
    side_effects: ["gap OPEN -> REQUISITIONED", "program_id denormalized"]

  - method: GET
    path: "/api/locum-requisitions"
    description: "List locum requisitions"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "gap_id?", "program_id?", "candidate_physician_id?", "status?"]
    output: LocumRequisition[]
    side_effects: []

  - method: GET
    path: "/api/locum-requisitions/{id}"
    description: "Get a locum requisition"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: LocumRequisition
    side_effects: []

  - method: POST
    path: "/api/locum-requisitions/{id}/propose-candidate"
    description: "Propose a LOCUM candidate (OPEN -> SOURCED)"
    roles: [SchedulerAdmin]
    code: 200
    input: [candidate_physician_id]
    output: LocumRequisition
    side_effects: ["candidate_physician_id set"]

  - method: POST
    path: "/api/locum-requisitions/{id}/begin-credentialing"
    description: "Open a CredentialingCase for the sourced candidate (SOURCED -> CREDENTIALING)"
    roles: [CredentialingOfficer]
    code: 200
    input: []
    output: LocumRequisition
    side_effects: ["CredentialingCase created (INITIATED, clear_by = slot.window_start - credentialing_lead_hours)"]

  - method: POST
    path: "/api/locum-requisitions/{id}/cancel"
    description: "Cancel an OPEN/SOURCED/CREDENTIALING requisition; gap re-opens"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: LocumRequisition
    side_effects: ["active CredentialingCase -> CANCELLED", "gap REQUISITIONED -> OPEN", "candidate cleared"]

  # --- Credentialing cases ---
  - method: GET
    path: "/api/credentialing-cases"
    description: "List credentialing cases"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "requisition_id?", "locum_physician_id?", "status?"]
    output: CredentialingCase[]
    side_effects: []

  - method: GET
    path: "/api/credentialing-cases/{id}"
    description: "Get a credentialing case"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: CredentialingCase
    side_effects: []

  - method: POST
    path: "/api/credentialing-cases/{id}/complete-item"
    description: "Complete one checklist item; completing the fifth clears the case and auto-fills the gap"
    roles: [CredentialingOfficer]
    code: 200
    input: [item]
    output: CredentialingCase
    side_effects: ["items.<item>.completed_at = now", "first item: INITIATED -> IN_PROGRESS", "fifth item: -> CLEARED with locum auto-fill cascade (requisition READY -> FILLED, assignment created, slot ASSIGNED, gap RESOLVED, reserve update)"]

  - method: POST
    path: "/api/credentialing-cases/{id}/fail"
    description: "Fail an active case; requisition re-opens"
    roles: [CredentialingOfficer]
    code: 200
    input: [reason]
    output: CredentialingCase
    side_effects: ["status -> FAILED", "requisition CREDENTIALING -> OPEN; candidate cleared"]

  - method: POST
    path: "/api/credentialing-cases/{id}/expire"
    description: "Expire an active case whose clear_by has passed; requisition re-opens"
    roles: [CredentialingOfficer]
    code: 200
    input: []
    output: CredentialingCase
    side_effects: ["status -> EXPIRED", "requisition CREDENTIALING -> OPEN; candidate cleared"]

  # --- Pay entries (read-only; created at mark-served) ---
  - method: GET
    path: "/api/pay-entries"
    description: "List pay entries"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: ["limit?", "offset?", "program_id?", "assignment_id?", "physician_id?", "status?"]
    output: PayEntry[]
    side_effects: []

  - method: GET
    path: "/api/pay-entries/{id}"
    description: "Get a pay entry"
    roles: [SchedulerAdmin, ChiefOfStaff, Physician, CredentialingOfficer]
    code: 200
    input: []
    output: PayEntry
    side_effects: []

  # --- Test-driving logical clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. All deadline/window rules read this clock."
    roles: [SchedulerAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed Physician identity does not own the target resource (window, swap offer/cancel, backup activation)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type/enum/range violation, end before start, or all six required slot counts zero" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "CallProgram id does not exist" }
  - { id: ERR_PHYSICIAN_NOT_FOUND, http: 404, condition: "Physician id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "CallSlot id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "CallAssignment id does not exist" }
  - { id: ERR_SWAP_NOT_FOUND, http: 404, condition: "SwapRequest id does not exist" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "UnavailabilityWindow id does not exist" }
  - { id: ERR_GAP_NOT_FOUND, http: 404, condition: "CoverageGap id does not exist" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "LocumRequisition id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "CredentialingCase id does not exist" }
  - { id: ERR_PAY_ENTRY_NOT_FOUND, http: 404, condition: "PayEntry id does not exist" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "generate requires the program in DRAFT" }
  - { id: ERR_PROGRAM_NOT_GENERATED, http: 409, condition: "publish/regenerate require the program in GENERATED" }
  - { id: ERR_PROGRAM_NOT_PUBLISHED, http: 409, condition: "Operation requires the program in PUBLISHED (manual assignment, swap posting, swap approval, reconcile precondition)" }
  - { id: ERR_REGENERATE_HAS_PROGRESS, http: 409, condition: "regenerate blocked because an assignment is ACTIVATED or SERVED" }
  - { id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST, http: 409, condition: "reconcile requires every assignment terminal (SERVED/SWAPPED/CANCELLED)" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "reconcile requires now >= (period_end + 1 day)T00:00:00Z" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Manual assignment requires the slot OPEN" }
  - { id: ERR_SLOT_WINDOW_PASSED, http: 409, condition: "Slot window has ended (now >= window_end) — no new assignment/swap/execute; also requisition creation when now >= window_start - credentialing_lead_hours uses ERR_CREDENTIALING_INFEASIBLE" }
  - { id: ERR_ASSIGNMENT_NOT_SCHEDULED, http: 409, condition: "cancel requires the assignment SCHEDULED" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVATABLE, http: 409, condition: "activate-backup requires the assignment SCHEDULED" }
  - { id: ERR_ASSIGNMENT_NOT_SERVABLE, http: 409, condition: "mark-served requires the assignment SCHEDULED or ACTIVATED" }
  - { id: ERR_ACTIVATION_REQUIRES_BACKUP_SLOT, http: 409, condition: "activate-backup on an assignment whose slot is PRIMARY" }
  - { id: ERR_SWAP_NOT_POSTED, http: 409, condition: "claim/offerer-cancel require the swap POSTED" }
  - { id: ERR_SWAP_NOT_CLAIMED, http: 409, condition: "approve/decline require the swap CLAIMED" }
  - { id: ERR_SWAP_NOT_APPROVED, http: 409, condition: "execute requires the swap APPROVED" }
  - { id: ERR_SWAP_ASSIGNMENT_NOT_SCHEDULED, http: 409, condition: "approve/execute require the referenced assignment still SCHEDULED" }
  - { id: ERR_WINDOW_NOT_REQUESTED, http: 409, condition: "approve requires the window REQUESTED" }
  - { id: ERR_WINDOW_NOT_CANCELLABLE, http: 409, condition: "cancel requires the window REQUESTED or APPROVED" }
  - { id: ERR_GAP_NOT_OPEN, http: 409, condition: "Locum requisition creation requires the gap OPEN" }
  - { id: ERR_REQUISITION_NOT_OPEN, http: 409, condition: "propose-candidate requires the requisition OPEN" }
  - { id: ERR_REQUISITION_NOT_SOURCED, http: 409, condition: "begin-credentialing requires the requisition SOURCED" }
  - { id: ERR_REQUISITION_NOT_CANCELLABLE, http: 409, condition: "cancel requires the requisition OPEN, SOURCED or CREDENTIALING" }
  - { id: ERR_CASE_NOT_ACTIVE, http: 409, condition: "complete-item/fail/expire require the case INITIATED or IN_PROGRESS" }
  - { id: ERR_PHYSICIAN_INACTIVE, http: 409, condition: "Physician is INACTIVE (deactivate idempotency) or an INACTIVE physician is being given a new commitment" }
  - { id: ERR_UNAVAILABILITY_CONFLICT, http: 409, condition: "An APPROVED unavailability window of the physician covers the slot date (closed containment)" }
  - { id: ERR_MOONLIGHT_CAP_EXCEEDED, http: 409, condition: "STAFF physician's projected rolling 28-day hours + 24 > moonlight_cap_hours (equality is allowed)" }
  - { id: ERR_WINDOW_COVERS_SERVED_ASSIGNMENT, http: 409, condition: "Window approval would cover an ACTIVATED or SERVED assignment of the physician" }
  - { id: ERR_PREREQUISITE_ITEM_INCOMPLETE, http: 409, condition: "privileges_granting completed before license_verification" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Another APPROVED window of the same physician overlaps under closed-interval semantics (touching dates overlap)" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Physician already holds an assignment in {SCHEDULED, ACTIVATED, SERVED} whose half-open window overlaps (adjacent windows allowed)" }
  - { id: ERR_SWAP_CUTOFF_VIOLATION, http: 409, condition: "Claim later than swap_cutoff_hours before slot.window_start (equality allowed)" }
  - { id: ERR_SERVE_BEFORE_WINDOW_END, http: 409, condition: "mark-served before slot.window_end" }
  - { id: ERR_ACTIVATION_WINDOW_CLOSED, http: 409, condition: "Backup activation outside [window_start, window_end + 2h] (both bounds inclusive)" }
  - { id: ERR_CREDENTIALING_DEADLINE_PASSED, http: 409, condition: "complete-item after clear_by (equality allowed)" }
  - { id: ERR_CREDENTIALING_NOT_EXPIRED, http: 409, condition: "expire called while now <= clear_by" }
  - { id: ERR_CREDENTIALING_INFEASIBLE, http: 409, condition: "Requisition creation or begin-credentialing when now >= slot.window_start - credentialing_lead_hours" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 409, condition: "Physician specialty != program.service_line (assignment, claim, candidate)" }
  - { id: ERR_MANUAL_ASSIGNMENT_STAFF_ONLY, http: 409, condition: "Manual assignment of a LOCUM physician; locums are placed only via the requisition flow" }
  - { id: ERR_SWAP_CLAIMANT_INELIGIBLE, http: 409, condition: "Swap claimant is not a STAFF physician" }
  - { id: ERR_CANDIDATE_NOT_LOCUM, http: 409, condition: "propose-candidate with a STAFF physician" }
  - { id: ERR_SELF_SWAP, http: 409, condition: "Claimant equals the offerer" }
  - { id: ERR_DUPLICATE_ACTIVE_SWAP, http: 409, condition: "The assignment already has a swap in {POSTED, CLAIMED, APPROVED}" }
  - { id: ERR_ITEM_ALREADY_COMPLETED, http: 409, condition: "Credentialing checklist item already completed" }
  - { id: ERR_SWAP_EQUITY_BREACH, http: 409, condition: "Approval would push the claimant's prospective total beyond mean + equity_band_points" }
  - { id: ERR_PAYROLL_BUDGET_EXCEEDED, http: 402, condition: "payroll_reserved_cents + new projected pay > payroll_budget_cents (equality allowed)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_call_program_version does not match the program's current version (OCC on regenerate)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchedulerAdmin
    description: "Medical staff office scheduler; owns program lifecycle, physician registry, window approvals, assignments, serve sign-off, swap execution, requisitions, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/call-programs, generate, regenerate, publish, reconcile"
      - "POST /api/physicians, POST /api/physicians/{id}/deactivate"
      - "POST /api/unavailability-windows/{id}/approve"
      - "POST /api/call-assignments, cancel, mark-served"
      - "POST /api/swap-requests/{id}/execute"
      - "POST /api/locum-requisitions, propose-candidate, cancel"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/unavailability-windows and /cancel (any physician)"
      - "POST /api/call-assignments/{id}/activate-backup"

  - name: ChiefOfStaff
    description: "Chief of staff; approves or declines claimed swaps with equity oversight"
    identity: opaque
    exclusive_operations:
      - "POST /api/swap-requests/{id}/approve"
      - "POST /api/swap-requests/{id}/decline"
    shared_operations:
      - "All GET endpoints"

  - name: Physician
    description: "Staff or locum physician acting as self; manages own unavailability, swap offers/claims, and own backup activation"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /api/swap-requests (offer own assignment)"
      - "POST /api/swap-requests/{id}/claim"
      - "POST /api/swap-requests/{id}/cancel (own offer, POSTED only)"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/unavailability-windows and /cancel (own only; ownership enforced via X-User-ID == physician_id)"
      - "POST /api/call-assignments/{id}/activate-backup (own assignment only)"

  - name: CredentialingOfficer
    description: "Medical staff credentialing officer; runs locum credentialing cases"
    identity: opaque
    exclusive_operations:
      - "POST /api/locum-requisitions/{id}/begin-credentialing"
      - "POST /api/credentialing-cases/{id}/complete-item"
      - "POST /api/credentialing-cases/{id}/fail"
      - "POST /api/credentialing-cases/{id}/expire"
    shared_operations:
      - "All GET endpoints"
