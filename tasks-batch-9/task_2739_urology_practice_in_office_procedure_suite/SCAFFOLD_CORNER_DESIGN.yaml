  # ==========================================================================
  # Table 6 asks one question: is every error in the catalog triggerable? The
  # instances below cover the ids that no §1.8 instance and no earlier §1.9
  # section already triggers. Already triggered elsewhere and therefore not
  # repeated here: ERR_INVALID_REQUEST, ERR_PATIENT_NOT_FOUND,
  # ERR_SCOPE_NOT_FOUND, ERR_DUPLICATE_MRN, ERR_INVALID_CASE_TRANSITION,
  # ERR_INVALID_RECALL_TRANSITION, ERR_SOURCE_CASE_NOT_COMPLETED,
  # ERR_PREP_INCOMPLETE, ERR_PREP_CODE_NOT_REQUIRED,
  # ERR_PROPHYLAXIS_WINDOW_MISSED, ERR_NO_SHOW_GRACE_NOT_ELAPSED,
  # ERR_CONSIGNMENT_RETURN_EXCEEDS_AVAILABLE (this file); ERR_CASE_NOT_CLEARED,
  # ERR_ROOM_ACCREDITATION_LAPSED, ERR_PROVIDER_ACCREDITATION_LAPSED,
  # ERR_ANTIBIOTIC_NOT_ADMINISTERED, ERR_SCOPE_NOT_READY,
  # ERR_ROOM_WINDOW_CONFLICT, ERR_PROVIDER_DOUBLE_BOOKED,
  # ERR_CHECKIN_TOO_EARLY, ERR_LOT_EXPIRED, ERR_DEVICE_SKU_MISMATCH,
  # ERR_CONSIGNMENT_INSUFFICIENT (SCAFFOLD_DIFFICULTY_DESIGN.yaml). The four
  # ERR_STALE_*_VERSION ids are triggered in the cross_cutting_complexity_layers
  # section below, and the four auth ids in the rbac section.
  - section: errors
    instances:

      - name: err_not_found_catalog_every_path_parameter
        claim_type: violation_to_error
        grounds:
          - validations[priority 8]
          - validations[priority 10]
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_PROCEDURE_TYPE_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_REPROCESSING_LOG_NOT_FOUND]
          - errors[ERR_ANTIBIOTIC_ORDER_NOT_FOUND]
          - errors[ERR_SPECIMEN_NOT_FOUND]
          - errors[ERR_RECALL_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: "Each entity owns its own 404 id, so ten single-resource reads against unknown ids must produce ten different error_ids; and when a body carries two unresolvable foreign keys the id returned is the one for the field declared first in §1.5's input list (patient_id before procedure_type_id), not whichever lookup the implementation happens to run first."
        test_recipe:
          setup:
            - "one scheduler provider so the POST probe has a legal actor; nothing else exists"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "GET /urology/providers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PracticeAdmin
              captures: { e_provider: $.data.error_id }
            - call: "GET /urology/procedure-rooms/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PracticeAdmin
              captures: { e_room: $.data.error_id }
            - call: "GET /urology/procedure-types/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PracticeAdmin
              captures: { e_type: $.data.error_id }
            - call: "GET /urology/procedure-cases/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PracticeAdmin
              captures: { e_case: $.data.error_id }
            - call: "GET /urology/reprocessing-logs/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PracticeAdmin
              captures: { e_log: $.data.error_id }
            - call: "GET /urology/antibiotic-orders/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PracticeAdmin
              captures: { e_order: $.data.error_id }
            - call: "GET /urology/specimens/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: PracticeAdmin
              captures: { e_specimen: $.data.error_id }
            - call: "GET /urology/surveillance-recalls/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PracticeAdmin
              captures: { e_recall: $.data.error_id }
            - call: "GET /urology/pelvic-health-referrals/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PracticeAdmin
              captures: { e_referral: $.data.error_id }
            - call: "GET /urology/consignment-lots/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PracticeAdmin
              captures: { e_lot: $.data.error_id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "00000000-0000-4000-8000-0000000000b1", procedure_type_id: "00000000-0000-4000-8000-0000000000b2", room_id: "00000000-0000-4000-8000-0000000000b3", primary_provider_id: "00000000-0000-4000-8000-0000000000b4", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { e_body_fk: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with response_type == \"error\""
            - "${e_provider} == \"ERR_PROVIDER_NOT_FOUND\", ${e_room} == \"ERR_ROOM_NOT_FOUND\", ${e_type} == \"ERR_PROCEDURE_TYPE_NOT_FOUND\", ${e_case} == \"ERR_CASE_NOT_FOUND\""
            - "${e_log} == \"ERR_REPROCESSING_LOG_NOT_FOUND\", ${e_order} == \"ERR_ANTIBIOTIC_ORDER_NOT_FOUND\", ${e_specimen} == \"ERR_SPECIMEN_NOT_FOUND\""
            - "${e_recall} == \"ERR_RECALL_NOT_FOUND\", ${e_referral} == \"ERR_REFERRAL_NOT_FOUND\", ${e_lot} == \"ERR_LOT_NOT_FOUND\""
            - "${e_body_fk} == \"ERR_PATIENT_NOT_FOUND\" — all four body foreign keys are unresolvable, and priority 10 fixes the answer to the first declared field"

      - name: err_duplicate_natural_keys_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 18]
          - errors[ERR_DUPLICATE_PROCEDURE_TYPE_CODE]
          - errors[ERR_DUPLICATE_ROOM_NAME]
          - errors[ERR_DUPLICATE_SCOPE_SERIAL]
        distinguishing_aspect: "Three practice-wide natural keys, three distinct 409 ids, each fired by a second create whose other fields all differ; and every rejection leaves exactly one row behind."
        test_recipe:
          setup:
            - "one tech (to create scopes); one room Cysto A; one type CYSTOSCOPY; one scope SN-9001"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Omar Diaz", npi: "1000000004", role_type: "TECH" }
              as: PracticeAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
