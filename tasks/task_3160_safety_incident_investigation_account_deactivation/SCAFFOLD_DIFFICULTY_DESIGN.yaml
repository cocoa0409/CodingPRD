            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4 and appeal_window_days 30."
            - "One OPEN device cluster dc-epsilon in R1 and one ACTIVE driver member linked to it."
            - "One S4 PHYSICAL_ASSAULT incident on the member, with the pre-hold risk score captured immediately after intake."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-epsilon", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_id: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Zara Nasser", contact_email: "zara.nasser@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${clust_id}", fingerprint_hash: "fp-epsilon-1" }
              as: SafetyInvestigator
              captures: { link_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { score_pre_hold: $.data.risk_score }
            - call: "GET /safety/device-clusters/${clust_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { clust_pre_hold: $.data.aggregate_cluster_risk }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { e1: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "RATINGS_HISTORY", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { e2: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${e1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${e2}", accepted: true }
              as: SafetyInvestigator
          trigger:
            - call: "POST /safety/incidents/${inc_id}/hold/release"
              payload: {}
              as: SafetyInvestigator
              captures: { released_status: $.data.incident_status }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { score_post_release: $.data.risk_score }
            - call: "GET /safety/device-clusters/${clust_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { clust_post_release: $.data.aggregate_cluster_risk }
          assert:
            - "the release returns the incident to incident_status == \"OPEN\", which is the state it held when score_pre_hold was captured"
            - "Account.${acct_id}.risk_score after the release == score_pre_hold exactly, so the interim hold leaves the propagated risk score at its pre-hold value"
            - "the equality is not a coincidence of a zero score: score_pre_hold is at least the S4 base of 260.0"
            - "aggregate_cluster_risk is identical before the hold and after the release, so the cluster term contributing to the score is unchanged on both sides of the hold-release pair"
