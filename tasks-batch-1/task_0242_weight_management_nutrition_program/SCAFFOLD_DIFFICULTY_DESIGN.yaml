            - "RxAuthorization.${rx_id}.qualifying_bmi == 30.1"

      - name: graduation_zero_counted_weighins_empty_set_blocks
        grounds:
          - calculations.graduation_eligibility
          - validations[priority=20]
          - entities.Enrollment.fields.graduation_eligible
        distinguishing_aspect: |
          Empty-set / count boundary on a DIFFERENT metric (counted-weigh-in COUNT) at a DIFFERENT endpoint
          (graduate): even with a PRIMARY goal ACHIEVED, an enrollment with exactly 1 counted weigh-in
          (< MIN_COUNTED_WEIGHINS 3) is not graduation_eligible and graduate fails ERR_GRADUATION_CRITERIA_NOT_MET.
        test_recipe:
          setup:
            - "ACTIVE enrollment baseline 95kg, PRIMARY goal target 90 ACHIEVED via a single counted weigh-in at 90 (count==1 < 3)."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m12@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin, captures: { enr_v0: $.data.version } }
            - { call: "POST /wm/goals", payload: { enrollment_id: "${enr_id}", kind: "PRIMARY", target_weight_kg: 90 }, as: ProgramAdmin, captures: { goal_id: $.data.id } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr_id}", weight_kg: 90, counts: true, expected_enrollment_version: "${enr_v0}" }, as: Coach }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/graduate", payload: {}, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "Goal.${goal_id}.status == ACHIEVED"
            - "Enrollment.${enr_id}.graduation_eligible == false"
            - "response error_id == ERR_GRADUATION_CRITERIA_NOT_MET"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_activate_requires_intake_approved
        grounds:
          - state_machines.Enrollment.PENDING_CLINICAL_to_ACTIVE
          - state_machines.IntakeAssessment.UNDER_REVIEW_to_APPROVED
          - validations[priority=12]
        distinguishing_aspect: |
          Pair Enrollment<-IntakeAssessment: activating an enrollment whose IntakeAssessment is only
          UNDER_REVIEW (not APPROVED) fails ERR_INTAKE_NOT_APPROVED — Enrollment's transition gated on
          another entity's state.
        test_recipe:
          setup:
            - "Enrollment PENDING_CLINICAL; its IntakeAssessment left in UNDER_REVIEW (not approved)."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
