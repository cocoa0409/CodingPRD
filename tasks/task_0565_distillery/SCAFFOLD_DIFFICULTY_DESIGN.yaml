            - { call: "POST /dsp/tour-bookings", payload: { customer_id: "${c2}", distillery_id: "${d2}", start_time: "2026-06-01T10:00:00Z", end_time: "2026-06-01T11:00:00Z", party_size: 21 }, as: TastingRoomStaff, captures: { t21: $.data.id } }
          trigger:
            - { call: "POST /dsp/tour-bookings/${t20}/confirm", payload: {}, as: TastingRoomStaff, captures: { st20: $.data.status } }
            - { call: "POST /dsp/tour-bookings/${t21}/confirm", payload: {}, as: TastingRoomStaff, captures: { err21: $.data.error_id } }
          assert:
            - "TourBooking.${t20}.status == CONFIRMED"
            - "confirm of ${t21} returns error_id == ERR_TOUR_CAPACITY with HTTP 409"

