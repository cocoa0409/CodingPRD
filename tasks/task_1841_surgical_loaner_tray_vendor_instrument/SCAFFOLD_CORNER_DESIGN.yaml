  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "No X-User-ID/X-User-Role headers -> 400 before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler }
          trigger:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme", vendor_code: "ACME", late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000 }, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400); no vendor persisted"

      - name: body_shape_precedes_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=1b]", "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Malformed body (missing tray_code) AND bogus request id: priority 1b shape check wins over priority 3 existence — ERR_VALIDATION, not ERR_REQUEST_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler }
          trigger:
            - { call: "POST /vendor-office/requests/00000000-0000-0000-0000-000000000000/trays", payload: { declared_instrument_count: 5, replacement_value_cents: 1000 }, as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION (400), NOT ERR_REQUEST_NOT_FOUND (404)"

      - name: existence_check_valid_path_bogus_id_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "Valid body + bogus request id -> ERR_REQUEST_NOT_FOUND (existence passes only when the id exists)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1" }, as: ORScheduler }
          trigger:
            - { call: "POST /vendor-office/requests/00000000-0000-0000-0000-000000000000/trays", payload: { tray_code: "TK-1", declared_instrument_count: 5, replacement_value_cents: 1000 }, as: ORScheduler, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_REQUEST_NOT_FOUND (404)"

      - name: role_forbidden_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "VendorRep invoking VendorCoordinator-only endpoint -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
