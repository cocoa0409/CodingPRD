      - name: corner_drought_closure_cascade_walked_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: drought_closure_five_hop_cascade
          rationale: "That §1.8 instance already walks the deepest cascade in the scaffold at depth 5 from POST /closure-orders: stocking_adjustment_pct 0.3000 forces effective_capacity_aums to floor(1200 x 0.70) == 840, which re-authorizes the ISSUED AOI from 300 to floor(300 x 0.70) == 210 while authorized_aums_at_issue stays 300, which supersedes the unpaid 54100-cent bill with a 36120-cent REVISED_USE bill carrying superseded_bill_id, which recomputes Permittee.outstanding_balance_cents to 36120 and leaves account_status CURRENT, with allocated_aums 210 and open_aums 630. Repeating a closure cascade here would only restate those hops; corner_cancellation_decision_cascades_permit_aoi_bill_and_ledger covers the one multi-hop chain that instance does not reach."

      - name: corner_appeal_reversal_unwinds_the_cascade
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: appeal_reversal_restoration_cascade
          rationale: "The compensating direction of the same layer is already covered: a REVERSE outcome on POST /appeal-cases/{appealId}/decide vacates the EFFECTIVE decision, restores Allotment.stocking_adjustment_pct from pre_decision_adjustment_pct, and re-runs emergency_reduction_reallocation forward again through AOI authorized_aums, bill supersession and permittee balance. A second unwind recipe here would duplicate that chain hop for hop."

      - name: corner_use_bill_variants_diverge_on_one_aoi
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: preliminary_vs_final_use_bill_divergence
          rationale: "That §1.8 instance already runs calculations.use_bill_amount twice over ONE AOI and reports both variants plus their delta: the PRELIMINARY variant bills integer authorized_aums 300 for 51600 + 2500 admin == 54100 cents, the FINAL variant bills the 2-decimal actual_aums_total 153.34 for 26374 + 0 admin, the delta is -27726 cents, the two land in different administrative-fee tiers, the preliminary bill goes VOIDED and the final one carries superseded_bill_id. Both variants and the delta are exactly what this row asks for."

      - name: corner_stocking_variant_selector_is_the_monitoring_method
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: stocking_recommendation_variant_divergence
          rationale: "The second dual-variant calculation is already covered in a different entity domain: two assessments with byte-identical sub-scores (composite_score 52.95, determination MEETING_WITH_PROBLEMS) yield recommended_reduction_pct 0.2000 under the PROPORTIONAL_STANDARDS variant, which ignores observed_utilization_pct, and 0.3590 under the UTILIZATION_BASED variant, which ignores standards_not_met and causal_factor_is_livestock — selected by monitoring_method, with both values asserted side by side."

      - name: corner_cumulative_and_instantaneous_thresholds_and_their_reset
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: nonuse_run_ceiling_boundary_on_renewal
          rationale: "The cumulative limb is already covered: consecutive_nonuse_years is a running count compared against MAX_CONSECUTIVE_NONUSE_YEARS == 3 at POST /grazing-permits/{permitId}/renew, and that instance asserts both sides of the boundary — a run of exactly 2 renews with 201 while a run of exactly 3 is refused with 409 ERR_NONUSE_LIMIT_EXCEEDED, the failed renewal leaving the permit ISSUED with no successor. The instantaneous limb is covered by minimum_billable_fraction_floor_boundary (74.67 below the 75-AUM floor bills at the floor, 75.00 at it, 75.33 above it bills as reported) and by closure_order_closed_interval_with_forward_buffer for the 7-day spacing boundary, and the RESET limb — a DROUGHT non-use year that does not extend the permittee-elected run — is covered by the §1.9 calculations instance corner_drought_nonuse_breaks_the_consecutive_run."

  # ---------------------------------------------------------------------------
  # §1.9 consistency_model — complexity_profile.consistency_model is `immediate`:
  # every derived field, ledger recomputation, bill and status change caused by a
  # request is already applied when that request responds, and a refused request
  # applies nothing at all. There is no denormalised field that reconciles later
  # and no compensating second step to wait for.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:

      - name: corner_every_derived_change_is_visible_in_the_same_request
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AnnualOperatingInstruction.ISSUED_to_USE_REPORTED
          - state_machines.AnnualOperatingInstruction.USE_REPORTED_to_BILLED
          - state_machines.AnnualOperatingInstruction.BILLED_to_CLOSED
          - calculations.aum_allocation_ledger
          - calculations.permittee_outstanding_balance
          - validations.priority_32
          - errors.ERR_OVERPAYMENT
        distinguishing_aspect: "Three separate proofs that the model is `immediate` rather than eventual. (1) The AOI issue response itself already carries authorized_aums_at_issue and billable_aums, and the ledger, the bill and the permittee balance it caused are readable by the very next call with nothing in between. (2) POST /annual-operating-instructions/{aoiId}/accept-use-report performs BOTH declared hops inside one request and returns aoi_status BILLED — an implementation that leaves the AOI in the intermediate USE_REPORTED state for a later reconciliation pass is observably wrong, because USE_REPORTED is never a response state of any endpoint. (3) A refused write reconciles nothing later either: the rejected overpayment leaves amount_paid_cents and the permittee balance exactly as they were."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "Allotment ${c_a72_id} (200 permitted AUMs, rotation requirement 1) with one 200-AUM pasture ${c_p37_id}"
            - "Permittee ${c_m57_id} with a 200-AUM LAND base property and an ISSUED 200-AUM permit ${c_g43_id}"
            - "A DRAFT 2026 AOI ${c_aoi39_id} for 150 AUMs with one 150-AUM use record ${c_ur24_id}"
