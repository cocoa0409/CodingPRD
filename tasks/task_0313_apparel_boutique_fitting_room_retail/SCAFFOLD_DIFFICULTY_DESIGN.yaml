# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Apparel Boutique & Fitting-Room Retail — Expert band
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: markdown_provisional_vs_final_price_diverges_on_style
        grounds:
          - calculations.markdown_pricing
          - state_machines.MarkdownSchedule.SCHEDULED_to_ACTIVE
          - entities.MarkdownSchedule.fields.projected_price_cents
          - entities.MarkdownSchedule.fields.applied_price_cents
        distinguishing_aspect: "Domain = Style pricing: a CLEARANCE schedule scheduled while list price is live (projected basis 10000) yields projected_price_cents 6000, but a SEASONAL markdown going ACTIVE first makes the final activation basis 7000, so applied_price_cents = 4200 — same schedule, two different numbers."
        test_recipe:
          setup:
            - "Boutique tax 875 bps; Style list_price_cents=10000; one SkuVariant on_hand=5."
            - "Clearance schedule C (40% off) scheduled at list-basis -> projected 6000; then a separate SEASONAL schedule S (30%) activated -> Style.current_price_cents=7000; then C activated -> applied 4200."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique A", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-100", name: "Wool Coat", category: "OUTERWEAR", season: "WINTER", list_price_cents: 10000 }
              as: Merchandiser
              captures: { st: $.data.id, st_v0: $.data.version }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Camel", on_hand: 5 }
              as: Merchandiser
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "CLEARANCE", markdown_pct: 40, effective_date: 0, expected_style_version: "${st_v0}" }
              as: Merchandiser
              captures: { md_c: $.data.id, st_v1: $.data.version }
            - call: "POST /markdown-schedules/${md_c}/schedule"
              payload: {}
              as: Merchandiser
              captures: { proj_c: $.data.projected_price_cents }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 30, effective_date: 0, expected_style_version: "${st_v1}" }
              as: Merchandiser
              captures: { md_s: $.data.id }
            - call: "POST /markdown-schedules/${md_s}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /markdown-schedules/${md_s}/activate"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules/${md_c}/activate"
              payload: {}
              as: Merchandiser
              captures: { applied_c: $.data.applied_price_cents }
          assert:
            - "MarkdownSchedule.${md_c}.projected_price_cents == 6000"
            - "MarkdownSchedule.${md_c}.applied_price_cents == 4200"
            - "Style.${st}.current_price_cents == 4200"

      - name: loyalty_tier_projected_vs_actual_diverges_on_customer
        grounds:
          - calculations.loyalty_tier_eval
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.captured_spend_cents
        distinguishing_aspect: "Domain = Customer loyalty: actual tier from captured_spend_cents=40000 is STANDARD, while projected tier adds an AUTHORIZED-but-uncaptured order's total (15438) to reach basis 55438 >= 50000 = SILVER — different subject than markdown pricing."
        test_recipe:
          setup:
            - "Customer granted enough captured spend to sit at 40000 via one captured order; a second order authorized (total 15438) but not captured."
            - "captured order: style list 40000, single line qty1; STANDARD tier so disc 0; but to reach exactly captured_spend 40000 we use a style priced 40000 with tax separate (captured_spend tracks net captured cash = total_cents)."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique B", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Pat Lee", email: "pat@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-A", name: "Tee", category: "TOPS", season: "SUMMER", list_price_cents: 40000 }
              as: Merchandiser
              captures: { st_a: $.data.id }
            - call: "POST /styles/${st_a}/sku-variants"
              payload: { size: "M", color: "White", on_hand: 10 }
              as: Merchandiser
              captures: { sv_a: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so1: $.data.id }
            - call: "POST /sales-orders/${so1}/lines"
              payload: { sku_variant_id: "${sv_a}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so1}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so1}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-B", name: "Hat", category: "ACCESSORIES", season: "SUMMER", list_price_cents: 15438 }
              as: Merchandiser
              captures: { st_b: $.data.id }
            - call: "POST /styles/${st_b}/sku-variants"
              payload: { size: "M", color: "Black", on_hand: 10 }
              as: Merchandiser
              captures: { sv_b: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so2: $.data.id }
            - call: "POST /sales-orders/${so2}/lines"
              payload: { sku_variant_id: "${sv_b}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so2}/authorize"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "GET /customers/${cu}/tier-projection"
              payload: {}
              as: StoreAssociate
              captures: { act: $.data.actual_tier, proj: $.data.projected_tier }
          assert:
            - "Customer.${cu}.captured_spend_cents == 40000"
            - "tier-projection.actual_tier == STANDARD"
            - "tier-projection.projected_tier == SILVER"
            - "tier-projection.projected_basis_cents == 55438"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_round_per_line_then_sum_mode_b
        grounds:
          - calculations.order_pricing
          - state_machines.SalesOrder.UNPAID_to_AUTHORIZED
          - entities.SalesOrder.fields.subtotal_cents
          - entities.SalesOrder.fields.tax_cents
        distinguishing_aspect: "Mode (b) nested rounding order: line products are exact integers (7000, 6000) summed to subtotal 13000, and tax is rounded ONCE over the summed taxable base (13000*875/10000=1137.5 -> 1138), NOT per line — pinning per-line-then-sum."
        test_recipe:
          setup:
            - "Boutique tax 875 bps; Customer STANDARD; two styles priced 7000 and 3000; order with line1 qty1 @7000 and line2 qty2 @3000."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique C", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Sam Roe", email: "sam@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-7", name: "Blouse", category: "TOPS", season: "SPRING", list_price_cents: 7000 }
              as: Merchandiser
              captures: { st7: $.data.id }
            - call: "POST /styles/${st7}/sku-variants"
              payload: { size: "S", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv7: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-3", name: "Scarf", category: "ACCESSORIES", season: "SPRING", list_price_cents: 3000 }
              as: Merchandiser
              captures: { st3: $.data.id }
            - call: "POST /styles/${st3}/sku-variants"
              payload: { size: "M", color: "Red", on_hand: 5 }
              as: Merchandiser
              captures: { sv3: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv7}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv3}", qty: 2 }
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
              captures: { sub: $.data.subtotal_cents, tax: $.data.tax_cents }
          assert:
            - "SalesOrder.${so}.subtotal_cents == 13000"
            - "SalesOrder.${so}.tax_cents == 1138"
            - "SalesOrder.${so}.loyalty_discount_cents == 0"

      - name: loyalty_accrual_evaluation_order_breaks_cycle_mode_c
        grounds:
          - calculations.loyalty_accrual
          - calculations.order_pricing
          - state_machines.SalesOrder.AUTHORIZED_to_CAPTURED
          - entities.SalesOrder.fields.points_earned
        distinguishing_aspect: "Mode (c) circular-looking dependency: points depend on net cash (total_cents), which depends on store_credit_applied, which depends on total — evaluation order is pinned so store_credit_applied resolves first; with 5000 credit applied, total=9138 and points=floor(9138/100)=91, NOT floor(14138/100)=141."
        test_recipe:
          setup:
            - "Same two-style order as mode_b (subtotal 13000, tax 1138, total-before-credit 14138); Customer pre-granted 5000 store credit; capture redeems 5000."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique D", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Dee Fox", email: "dee@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /customers/${cu}/store-credit-grants"
              payload: { amount_cents: 5000 }
              as: StoreManager
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-7", name: "Blouse", category: "TOPS", season: "SPRING", list_price_cents: 7000 }
              as: Merchandiser
              captures: { st7: $.data.id }
            - call: "POST /styles/${st7}/sku-variants"
              payload: { size: "S", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv7: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-3", name: "Scarf", category: "ACCESSORIES", season: "SPRING", list_price_cents: 3000 }
              as: Merchandiser
              captures: { st3: $.data.id }
            - call: "POST /styles/${st3}/sku-variants"
              payload: { size: "M", color: "Red", on_hand: 5 }
              as: Merchandiser
              captures: { sv3: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv7}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv3}", qty: 2 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/capture"
              payload: { redeem_store_credit: 5000 }
              as: StoreAssociate
              captures: { tot: $.data.total_cents, pts: $.data.points_earned }
          assert:
            - "SalesOrder.${so}.store_credit_applied_cents == 5000"
            - "SalesOrder.${so}.total_cents == 9138"
            - "SalesOrder.${so}.points_earned == 91"
            - "Customer.${cu}.store_credit_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sales_order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.SalesOrder.UNPAID_to_AUTHORIZED
          - state_machines.SalesOrder.OPEN_to_COMPLETED
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: "Parallel state dimensions on SalesOrder: payment_status advances UNPAID->AUTHORIZED->CAPTURED independently of fulfillment_status OPEN->COMPLETED; after capture+complete the row reads payment_status=CAPTURED AND fulfillment_status=COMPLETED as two independent axes."
        test_recipe:
          setup:
            - "One captured-and-completed simple order: style list 5000, single line qty1; tax 875 bps; STANDARD customer."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique E", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Lee Kim", email: "lee@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-5", name: "Dress", category: "DRESSES", season: "SUMMER", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Green", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/complete"
              payload: {}
              as: StoreAssociate
              captures: { ps: $.data.payment_status, fs: $.data.fulfillment_status }
          assert:
            - "SalesOrder.${so}.payment_status == CAPTURED"
            - "SalesOrder.${so}.fulfillment_status == COMPLETED"

      - name: return_request_fork_approve_vs_reject_divergent_effects
        grounds:
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - state_machines.ReturnRequest.REQUESTED_to_REJECTED
          - entities.ReturnRequest.fields.status
          - entities.ReturnRequest.fields.refund_cents
        distinguishing_aspect: "Branching fork on ReturnRequest (different entity than SalesOrder): from REQUESTED, approve grants refund_cents and restocks while reject grants nothing — the two branches produce disjoint side-effect sets; here the reject branch leaves store_credit at 0."
        test_recipe:
          setup:
            - "Captured+completed simple order (style 5000, line qty1) within window; a REFUND return filed and then REJECTED."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique F", state_code: "OR", tax_rate_bps: 0, return_window_days: 30 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Ivy Cole", email: "ivy@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-5", name: "Skirt", category: "BOTTOMS", season: "FALL", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Navy", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
              captures: { ol: $.data.id }
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/complete"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { sales_order_id: "${so}", order_line_id: "${ol}", resolution: "REFUND" }
              as: StoreAssociate
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /returns/${rr}/reject"
              payload: {}
              as: StoreManager
              captures: { rs: $.data.status }
          assert:
            - "ReturnRequest.${rr}.status == REJECTED"
            - "ReturnRequest.${rr}.refund_cents == 0"
            - "Customer.${cu}.store_credit_cents == 0"
            - "OrderLine.${ol}.status == SOLD"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_approve_cascade_depth4_line_sku_style
        grounds:
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
          - entities.OrderLine.fields.status
          - entities.SkuVariant.fields.on_hand
          - entities.Style.fields.total_available
        distinguishing_aspect: "Depth-4 cascade triggered by return approve: ReturnRequest->APPROVED (A) sets OrderLine.status=RETURNED (B); that line change restocks SkuVariant.on_hand +1 and recomputes available (C); the available change bubbles up to Style.total_available (D) — each hop caused by the previous."
        test_recipe:
          setup:
            - "Captured+completed simple order (style 5000, sku on_hand started 5, capture left on_hand 4, available 4); REFUND return filed; approving restocks back to on_hand 5 / available 5 / total_available 5."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique G", state_code: "OR", tax_rate_bps: 0, return_window_days: 30 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Max Yu", email: "max@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-5", name: "Jacket", category: "OUTERWEAR", season: "FALL", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "L", color: "Tan", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
              captures: { ol: $.data.id }
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/complete"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { sales_order_id: "${so}", order_line_id: "${ol}", resolution: "REFUND" }
              as: StoreAssociate
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /returns/${rr}/approve"
              payload: {}
              as: StoreAssociate
          assert:
            - "OrderLine.${ol}.status == RETURNED"
            - "SkuVariant.${sv}.on_hand == 5"
            - "SkuVariant.${sv}.available == 5"
            - "Style.${st}.total_available == 5"

      - name: markdown_activate_cascade_depth3_style_price_to_hold
        grounds:
          - state_machines.MarkdownSchedule.SCHEDULED_to_ACTIVE
          - entities.Style.fields.current_price_cents
          - entities.FittingRoomHold.fields.held_price_cents
        distinguishing_aspect: "Depth-3 cascade from a different trigger (markdown activate, not return): MarkdownSchedule->ACTIVE (A) writes Style.current_price_cents=7000 (B); that price change refreshes the live FittingRoomHold.held_price_cents from 10000 to 7000 (C) — distinct propagation pattern from the return cascade."
        test_recipe:
          setup:
            - "Style list 10000, sku on_hand 5; an ACTIVE hold snapshots held_price 10000; SEASONAL 30% schedule scheduled, then activated."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique H", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Ada Min", email: "ada@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "SK-10", name: "Gown", category: "DRESSES", season: "WINTER", list_price_cents: 10000 }
              as: Merchandiser
              captures: { st: $.data.id, st_v0: $.data.version }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Black", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { boutique_id: "${bq}", label: "Room 1" }
              as: StoreAssociate
              captures: { fr: $.data.id }
            - call: "POST /fitting-room-holds"
              payload: { fitting_room_id: "${fr}", customer_id: "${cu}", sku_variant_id: "${sv}", start_minute: 600, end_minute: 660 }
              as: StoreAssociate
              captures: { hold: $.data.id }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 30, effective_date: 0, expected_style_version: "${st_v0}" }
              as: Merchandiser
              captures: { md: $.data.id }
            - call: "POST /markdown-schedules/${md}/schedule"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules/${md}/activate"
              payload: {}
              as: Merchandiser
          assert:
            - "Style.${st}.current_price_cents == 7000"
            - "FittingRoomHold.${hold}.held_price_cents == 7000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: return_state_beats_temporal_window
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_ORDER_NOT_RETURNABLE_STATE]
          - errors[ERR_RETURN_WINDOW_CLOSED]
        distinguishing_aspect: "Pair = state (priority 8) vs business_temporal (priority 9): an order still OPEN (never completed) AND past the would-be window returns ERR_ORDER_NOT_RETURNABLE_STATE, proving state outranks the temporal window check."
        test_recipe:
          setup:
            - "Captured-but-NOT-completed order (fulfillment OPEN); clock advanced far past 30 days; a REFUND return filed; approve attempted."
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Boutique I", state_code: "OR", tax_rate_bps: 0, return_window_days: 30 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "Ron Vex", email: "ron@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
