scaffold_corner_design:
  - section: entities
    instances:
      - name: furnace_create_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Furnace
          - endpoints.POST_/glass-plant/furnaces
          - response_envelope.success
        distinguishing_aspect: |
          A furnace create returns 201 with every declared field present and the four computed fields
          seeded to their declared defaults: current_color FLINT, refractory_consumed_units 0.00,
          refractory_remaining_pct 100.00, posture OPERATING, reserved_pull_tons 0.00, campaign_count 0.
        test_recipe:
          setup:
            - "Empty database, logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E1", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { f: "$.data.id" }
          assert:
            - "HTTP 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "Furnace.${f}.code == FUR-E1"
            - "Furnace.${f}.design_pull_tpd == 300.00"
            - "Furnace.${f}.refractory_life_total_units == 100000.00"
            - "Furnace.${f}.current_color == FLINT"
            - "Furnace.${f}.refractory_consumed_units == 0.00"
            - "Furnace.${f}.refractory_remaining_pct == 100.00"
            - "Furnace.${f}.posture == OPERATING"
            - "Furnace.${f}.reserved_pull_tons == 0.00"
            - "Furnace.${f}.campaign_count == 0"
            - "Furnace.${f}.version == 1 and id, created_at, updated_at are all present"

      - name: furnace_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - endpoints.GET_/glass-plant/furnaces/{furnace_id}
          - entities.Furnace.fields.campaign_count
        distinguishing_aspect: |
          GET /glass-plant/furnaces/{furnace_id} echoes the stored row for a reader role and shows
          campaign_count 1 and version 2 after one campaign create, proving the read is not a cached
          copy of the create response.
        test_recipe:
          setup:
            - "Furnace FUR-E2 (design_pull_tpd 300.00, refractory_life_total_units 100000.00)"
            - "One PLANNED Campaign created against it, which increments campaign_count and Furnace.version"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E2", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-E2", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
          trigger:
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: QualityEngineer
          assert:
            - "HTTP 200"
            - "Furnace.${f}.code == FUR-E2 and design_pull_tpd == 300.00"
            - "Furnace.${f}.campaign_count == 1"
            - "Furnace.${f}.version == 2"
            - "Furnace.${f}.posture == OPERATING and refractory_remaining_pct == 100.00"
            - "Campaign.${cmp}.status == PLANNED"

      - name: bottle_design_listing_filters_by_customer_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/glass-plant/bottle-designs
          - response_envelope.pagination_fields
          - entities.BottleDesign.fields.customer_id
        distinguishing_aspect: |
          Listing designs with customer_id and limit 2 returns exactly 2 rows with total_count 3 and
          has_more true, and the fourth design belonging to the other customer never appears in either page.
        test_recipe:
          setup:
            - "Customer CUST-A with three DRAFT designs BD-A1, BD-A2, BD-A3"
            - "Customer CUST-B with one DRAFT design BD-B1"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-A", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { ca: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Beta Filling", account_code: "CUST-B", palletization_standard: "GMA_1200x1000", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { cb: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${ca}", code: "BD-A1", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d1: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${ca}", code: "BD-A2", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d2: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${ca}", code: "BD-A3", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d3: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${cb}", code: "BD-B1", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d4: "$.data.id" }
          trigger:
            - call: "GET /glass-plant/bottle-designs"
              payload: { customer_id: "${ca}", limit: 2, offset: 0 }
              as: PlantScheduler
          assert:
            - "HTTP 200 and response_type == array"
            - "meta/pagination reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "exactly 2 rows are returned and every returned row has customer_id == ${ca}"
            - "design ${d4} is absent from the page"
            - "the same call with offset 2 returns 1 row, total_count 3, has_more == false"

      - name: mold_set_detail_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/glass-plant/mold-sets/{mold_set_id}
          - validations.priority_5
          - errors.ERR_MOLD_SET_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown mold-set id returns 404 ERR_MOLD_SET_NOT_FOUND, not 400 and
          not an empty 200 body.
        test_recipe:
          setup:
            - "One unrelated MoldSet exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-E4", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-E4", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-E4", cavity_count: 8, mold_family: "NNPB", owner: "CUSTOMER", condition_score: 90 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
          trigger:
            - call: "GET /glass-plant/mold-sets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MoldEngineer
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_MOLD_SET_NOT_FOUND"
            - "response_type == error"
            - "GET /glass-plant/mold-sets/${ms} still returns 200 with status AVAILABLE"

      - name: furnace_create_missing_design_pull_tpd_rejected
        claim_type: required_fields
        grounds:
          - entities.Furnace.fields.design_pull_tpd
          - validations.priority_4
          - errors.ERR_VALIDATION
        distinguishing_aspect: |
          design_pull_tpd is source input with no default, so omitting it returns 400 ERR_VALIDATION and
          persists no furnace; supplying it on the retry returns 201.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E5", refractory_life_total_units: 100000.00 }
              as: PlantManager
          assert:
            - "HTTP 400 and data.error_id == ERR_VALIDATION"
            - "GET /glass-plant/furnaces reports total_count == 0"
            - "retrying with { code: FUR-E5, design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 } returns 201 and code FUR-E5 is accepted (the failed attempt reserved no code)"

      - name: forming_machine_changeover_buffer_defaults_to_forty_five
        claim_type: defaults
        grounds:
          - entities.FormingMachine.fields.changeover_buffer_minutes
          - entities.FormingMachine.fields.status
          - entities.FormingMachine.fields.mounted_cavities
        distinguishing_aspect: |
          Omitting changeover_buffer_minutes yields exactly 45, while an explicit 0 is preserved as 0 -
          the default is applied on absence only, never as a floor on a supplied value.
        test_recipe:
          setup:
            - "Furnace FUR-E6 exists"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E6", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-E6A", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB" }
              as: PlantManager
              captures: { m1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "FormingMachine.${m1}.changeover_buffer_minutes == 45"
            - "FormingMachine.${m1}.status == IDLE and mounted_cavities == 0"
            - "a second create with code IS-E6B and changeover_buffer_minutes 0 returns 201 with changeover_buffer_minutes == 0"

      - name: pack_lot_computed_fields_are_derived_at_job_close
        claim_type: computed_fields
        grounds:
          - entities.PackLot.fields.lot_code
          - entities.PackLot.fields.packed_units
          - entities.PackLot.fields.unit_weight_g
          - entities.PackLot.fields.provisional_yield_pct
          - entities.PackLot.fields.palletization_standard
          - state_machines.ProductionJob.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          Every PackLot field is source computed and none is client-supplied: closing PJ-E7 with
          produced_units 3000000 mints lot_code PJ-E7-L1, packed_units 3000000, unit_weight_g 190.00,
          provisional_yield_pct 95.00 and palletization_standard EURO_1200x800 snapshotted from the customer.
        test_recipe:
          setup:
            - "Furnace FUR-E7 (design_pull_tpd 300.00, refractory_life_total_units 100000.00, current_color FLINT)"
            - "Campaign CMP-E7 ACTIVE, target_pull_tpd 300.00, window 2026-08-01 to 2026-08-11 (pull pool 3000.00 t)"
            - "Approved FLINT recipe (cullet_ratio_pct 40.00 so cullet_stress_factor is 0.0000) and APPROVED design (190.00 g, EURO customer)"
            - "ProductionJob PJ-E7 over a 2-day window at 300.00 tpd, so reserved_melt_tons is 600.00"
            - "Logical clock left at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E7", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-E7", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-E7", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-E7", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-E7", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-E7", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-E7", cavity_count: 8, mold_family: "NNPB", owner: "CUSTOMER", condition_score: 90 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-E7", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
          trigger:
            - call: "POST /glass-plant/production-jobs/${j}/close"
              payload: { outcome: "COMPLETED", produced_units: 3000000 }
              as: PlantScheduler
          assert:
            - "HTTP 200 and ProductionJob.${j}.status == COMPLETED"
            - "GET /glass-plant/pack-lots?production_job_id=${j} returns total_count == 1"
            - "the lot's lot_code == PJ-E7-L1"
            - "the lot's packed_units == 3000000 and unit_weight_g == 190.00"
            - "the lot's reject_units == 0, net_packed_units == 3000000, major_ppm == 0.0, minor_ppm == 0.0"
            - "the lot's provisional_yield_pct == 95.00 and final_yield_pct == 0.00"
            - "the lot's palletization_standard == EURO_1200x800 and pallet_count == 0"
            - "the lot's aged_until_at == 2026-08-04T00:00:00.000Z"
            - "the lot's quality_status == PENDING_INSPECTION and logistics_status == IN_AGING and shipped_at is null"
            - "the lot's production_job_id == ${j}, campaign_id == ${cmp}, bottle_design_id == ${d}, customer_id == ${c}"

      - name: inspection_result_records_actor_from_user_id_header
        claim_type: system_fields
        grounds:
          - entities.InspectionResult.fields.recorded_by_user_id
          - endpoints.POST_/glass-plant/pack-lots/{pack_lot_id}/inspection-results
        distinguishing_aspect: |
          recorded_by_user_id is source system: it is stamped from the X-User-ID of the recording quality
          engineer (qe-7) and cannot be supplied in the body, which carries only defect_class,
          defect_code, rejected_units and inspected_at.
        test_recipe:
          setup:
            - "The PJ-E8 chain of pack_lot_computed_fields_are_derived_at_job_close, closed with produced_units 3000000, leaving one PENDING_INSPECTION lot of 3000000 units"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E8", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-E8", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-E8", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-E8", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Alpha Filling", account_code: "CUST-E8", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-E8", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-E8", cavity_count: 8, mold_family: "NNPB", owner: "CUSTOMER", condition_score: 90 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-E8", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
            - call: "POST /glass-plant/production-jobs/${j}/close"
              payload: { outcome: "COMPLETED", produced_units: 3000000 }
              as: PlantScheduler
            - call: "GET /glass-plant/pack-lots"
              payload: { production_job_id: "${j}" }
              as: QualityEngineer
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /glass-plant/pack-lots/${lot}/inspection-results"
              payload: { defect_class: "MINOR", defect_code: "CHECK_CRACK", rejected_units: 100, inspected_at: "2026-08-01T00:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-7"
              captures: { ir: "$.data.id" }
          assert:
            - "HTTP 201"
            - "InspectionResult.${ir}.recorded_by_user_id == qe-7"
            - "InspectionResult.${ir}.pack_lot_id == ${lot} and defect_class == MINOR and rejected_units == 100"
            - "PackLot.${lot}.reject_units == 100 and net_packed_units == 2999900"
            - "PackLot.${lot}.minor_ppm == 33.3 and major_ppm == 0.0"

      - name: inspection_result_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.InspectionResult
          - endpoints.POST_/glass-plant/pack-lots/{pack_lot_id}/inspection-results
          - endpoints.GET_/glass-plant/pack-lots/{id}/inspection-results
        distinguishing_aspect: |
          InspectionResult is the scaffold's only common_fields false entity: its response carries no
          version field, §1.5 declares no update or delete endpoint for it, and a correction is expressed
          as a second append-only row rather than a mutation of the first.
        test_recipe:
          setup:
            - "The PJ-E9 chain leaving one PENDING_INSPECTION lot of 3000000 units"
            - "One MINOR reading of 100 units already recorded by qe-1"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-E9", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-E9", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-E9", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
