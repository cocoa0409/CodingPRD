              captures: { v_class_after_patch: $.data.transferability, v_version_b: $.data.version }
            - call: "POST /digital-assets/${a_vault_id}/transferability-reviews"
              payload: { review_note: "provider licence now terminates at death" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { v_class1: $.data.transferability, v_reason1: $.data.transferability_reason, v_appraised1: $.data.appraised_value_cents, v_access1: $.data.access_status, v_version_c: $.data.version }
            - call: "POST /digital-assets/${a_pts_id}/transferability-reviews"
              payload: { review_note: "loyalty programme re-checked" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { pts_class1: $.data.transferability, pts_reason1: $.data.transferability_reason }
            - call: "PATCH /platforms/${p_cloud_id}"
