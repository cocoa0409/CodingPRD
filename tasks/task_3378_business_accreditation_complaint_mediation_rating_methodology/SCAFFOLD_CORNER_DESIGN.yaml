              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ADVERSE_COMPLAINT_HISTORY (complaints_unresolved_36m == 1)"
            - "AccreditationApplication.${app_id}.status remains SUBMITTED and dues_invoice_id is null"

      - name: approve_blocked_by_void_invoice_outstanding_balance
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_OUTSTANDING_DUES_BALANCE
        distinguishing_aspect: "With advertising clean, a prior VOID invoice carrying balance_cents 40375 (voided within 365 days) blocks a new APPROVE with 422 ERR_OUTSTANDING_DUES_BALANCE — the fiscal gate in isolation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE fee 0; MICRO business founded 2020-01-01."
            - "app1 approved (invoice 40375, due 2026-10-01), never paid; sweep at 2026-10-17 VOIDs the invoice and EXPIRES app1; app2 created and SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Lapsed Dues Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - *k_app_prepaid
            - *k_app_submit
            - *k_app_approve
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: BureauAdmin
            - *k_sweep
            - call: "POST /businesses/${biz_id}/accreditation-applications"
              payload: { billing_plan: "ANNUAL_PREPAID", license_number: "LIC-L-2" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /accreditation-applications/${app2_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /accreditation-applications/${app2_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OUTSTANDING_DUES_BALANCE"
            - "GET /businesses/${biz_id}/dues-invoices still returns exactly 1 invoice (VOID with balance 40375)"

      - name: mediation_create_after_14_day_window_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_MEDIATION_WINDOW_EXPIRED
        distinguishing_aspect: "Mediation must be offered within 14 days of last_unresolved_at: at day 15 the create is a 409 ERR_MEDIATION_WINDOW_EXPIRED even though the complaint is still UNRESOLVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; c1 UNRESOLVED with last_unresolved_at 2026-09-01T00:00:00Z; clock advanced to 2026-09-16T00:00:00Z (day 15)."
