  # ===========================================================================
  - section: endpoints
    instances:

      - name: bulk_import_reports_created_and_skipped_rows
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/advisors/bulk-import
          - errors.ERR_BRANCH_NOT_FOUND
          - response_envelope.success
        distinguishing_aspect: "A bulk import of three advisor rows where one names an unknown branch returns 200 with created_count 2 and skipped_count 1, so the accepted rows survive the rejected one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 exists; no advisor has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /advisors/bulk-import"
              payload: { advisors: [{ advisor_code: "A-2001", crd_number: "7000001", full_name: "Ada Reyes", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true }, { advisor_code: "A-2002", crd_number: "7000002", full_name: "Ben Ortiz", affiliation_model: "HYBRID", primary_branch_code: "GHOST-9", ingested_book_total_cents: 100000000, book_transferred_cents: 80000000, protocol_eligible: false }, { advisor_code: "A-2003", crd_number: "7000003", full_name: "Cara Lund", affiliation_model: "EMPLOYEE", primary_branch_code: "SUP-1", ingested_book_total_cents: 200000000, book_transferred_cents: 160000000, protocol_eligible: true }] }
              as: AdvisorOps
              captures: { created: $.data.created_count, skipped: $.data.skipped_count }
          assert:
            - "the response status is 200 and created_count == 2 and skipped_count == 1"
            - "GET /advisors returns 2 rows and not 0 or 3, so the accepted rows were not rolled back"
            - "GET /advisors?primary_branch_code=SUP-1 returns both accepted advisors"
            - "all three advisors were parsed as PROSPECT records, so the import did not affiliate them"

      - name: crd_change_endpoint_requires_the_current_advisor_version
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/advisors/{id}/crd-change
          - validations[priority=6]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The registration-number correction requires the current advisor version, so a stale value is refused with 412 while the freshly read version succeeds and increments the version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 with advisor A-2004 created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /advisors"
              payload: { advisor_code: "A-2004", crd_number: "7000010", full_name: "Dana Whitfield", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
          trigger:
            - call: "POST /advisors/${a_id}/crd-change"
              payload: { crd_number: "7000099", expected_advisor_version: "${a_v} - 1" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /advisors/${a_id}/crd-change"
              payload: { crd_number: "7000099", expected_advisor_version: "${a_v}" }
              as: ComplianceOfficer
              captures: { v_after: $.data.version }
          assert:
            - "the first call returns 412 and error_id == ERR_STALE_VERSION"
            - "the second call returns 200 and the advisor's crd_number reads 7000099"
            - "the advisor's version reads ${a_v} + 1 after the successful correction"
            - "a third call reusing expected_advisor_version ${a_v} is refused with ERR_STALE_VERSION again, so the version advanced"