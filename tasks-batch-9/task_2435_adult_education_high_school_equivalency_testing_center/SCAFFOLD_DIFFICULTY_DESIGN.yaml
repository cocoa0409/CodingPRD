            - "the post-CLOSED enrollment attempt returns 409 with data.error_id == ERR_SECTION_NOT_ACCEPTING_ENROLLMENT"

      - name: outcome_certification_requires_open_funding_period
        entity_pair: [OutcomeRecord, FundingPeriod]
        grounds:
          - validations[priority=43]
          - errors[ERR_FUNDING_PERIOD_CLOSED]
          - state_machines[FundingPeriod].transitions[OPEN->CLOSED]
        distinguishing_aspect: |
          A third entity pair where the parent state freezes several different child operations at
          once: once the period is CLOSED, certifying an existing RECORDED outcome, recording a new
          outcome and running allocation are all refused with the same error, while the already
          CERTIFIED and COMMITTED figures stay readable and unchanged.
        test_recipe:
          setup:
            - "FundingPeriod PY2026 OPEN, rate 10000, total 100000."
            - "Two RECORDED EMPLOYMENT_Q2 outcomes by coord-1 for two students; the first is CERTIFIED by state-1 and allocated (committed 12500)."
