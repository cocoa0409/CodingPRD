# =============================================================================
# PRD Benchmark Scaffold — task_3064_credit_score_model_versioning_lender_score_migration
# Domain: consumer credit-risk scoring bureau. Score model versioning, lender
# score migration, industry score variants, bureau licensing/pricing, regulatory
# documentation, cross-bureau reconciliation and fair-lending validation.
# =============================================================================

scenario: |
  Credit Score Model Versioning & Lender Score Migration (FICO): score model
  development on bureau archive samples with segmentation and reason-code
  design, version release and parallel availability of older versions still
  used by lenders, lender migration planning with score distribution shift
  analysis and cutoff recalibration, industry-specific score variants for auto,
  bankcard and mortgage with different odds-to-score relationships, regulatory
  model documentation and adverse action reason-code mapping, bureau licensing
  and per-score pricing with volume tiers, score consistency across the three
  bureaus and reconciliation of discrepancies, validation studies and fair
  lending disparate impact testing

domain_name: credit-score-model-versioning
api_prefix: "/"

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - dual_variant_calculation
    - pagination_with_filtering
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:

  # --- configuration / reference -------------------------------------------
  - name: Bureau
    parent: null
    common_fields: true
    fields:
      - { name: bureau_code, type: enum, source: input, description: "TUC | EXP | EQF — the three national consumer reporting agencies", constraints: "enum {TUC, EXP, EQF}; unique across Bureaus; immutable after creation" }
      - { name: display_name, type: string, source: input, description: "Human-readable bureau name" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether scores may still be contributed for this bureau" }

  - name: ScoreModel
    parent: null
    common_fields: true
    fields:
      - { name: family_code, type: enum, source: input, description: "Scoring family this version belongs to", constraints: "enum {FICO_CORE, VANTAGE_STYLE}" }
      - { name: version_label, type: string, source: input, description: "Version identifier within the family (e.g. \"CREDIT-DUAL-V1\")", constraints: "unique per (family_code, version_label)" }
      - { name: predecessor_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the same-family version this one supersedes; null for a family's first version", constraints: "must reference a ScoreModel with the same family_code whose status is not RETIRED" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "enum {DEVELOPMENT, RELEASED, DEPRECATED, RETIRED, SUPERSEDED}" }
      - { name: released_at, type: datetime, source: system, description: "Set when the model transitions to RELEASED; refreshed when a DEPRECATED model is reopened" }
      - { name: retired_at, type: datetime, source: system, description: "Set when the model transitions to RETIRED or SUPERSEDED" }
      - { name: min_input_count, type: integer, source: input, description: "Minimum tradeline rows an archive sample must carry before a study may run against this version", constraints: ">= 1" }
      - { name: score_floor, type: integer, source: input, default: 300, description: "Lowest score this model may emit" }
      - { name: score_ceiling, type: integer, source: input, default: 850, description: "Highest score this model may emit" }
      - { name: active_variant_count, type: integer, source: computed, default: 0, description: "Count of ScoreVariants under this version whose status is RELEASED" }
      - { name: cascade_depth, type: integer, source: computed, default: 0, description: "Number of predecessor_model_id hops from the family's first version down to this version; 0 for a root" }

  - name: ScoreVariant
    parent: null
    common_fields: true
    fields:
      - { name: score_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the model version this industry variant belongs to" }
      - { name: industry, type: enum, source: input, description: "Industry score variant", constraints: "enum {AUTO, BANKCARD, MORTGAGE, PERSONAL_LOAN}; unique per (score_model_id, industry)" }
      - { name: ref_score, type: integer, source: input, description: "Score anchor of this variant's odds-to-score relationship" }
      - { name: base_odds, type: number, source: input, description: "Good:bad odds at ref_score — the numerator of the odds-to-score relationship", constraints: "> 0" }
      - { name: double_odds_points, type: integer, source: input, description: "Points of score required for the odds to double", constraints: ">= 1" }
      - { name: segment_width, type: integer, source: input, description: "Score points per segment band above ref_score, used to select the segment offset", constraints: ">= 1" }
      - { name: segment_offsets, type: array, source: input, description: "Exactly three integers; band 0 is the offset at or below ref_score + segment_width, band 1 the next band, band 2 everything above", constraints: "length == 3; -40 <= each element <= 40" }
      - { name: rounding_penalty_pct, type: number, source: input, description: "Fraction of the provisional score deducted as a rounding penalty", constraints: "0 <= rounding_penalty_pct <= 0.05" }
      - { name: aggregate_weight_pct, type: number, source: input, description: "Share this variant contributes to a bureau-weighted composite", constraints: "0 < aggregate_weight_pct <= 1" }
      - { name: elongation_points, type: integer, source: input, description: "Additive term of the cutoff-odds companion expression", constraints: ">= 0" }
      - { name: cutoff_baseline, type: integer, source: input, description: "Published cut-off anchor used when no migration anchor governs the posting", constraints: "300 <= cutoff_baseline <= 850" }
      - { name: status, type: enum, source: system, description: "Variant lifecycle state", constraints: "enum {DRAFT, RELEASED, RECALLED}" }
      - { name: distribution_shift_points, type: number, source: computed, default: 0, description: "Mean scored median of this variant's model minus the predecessor model's same-industry median, in points; 0 for a first version" }
      - { name: validated_at, type: datetime, source: system, description: "Set by the first validation study on this variant's model to reach VALIDATION_COMPLETE" }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: consumer_ref, type: string, source: input, description: "Pseudonymous archive key for the consumer", constraints: "unique across Consumers" }
      - { name: age_years, type: integer, source: input, description: "Age in whole years", constraints: "18 <= age_years <= 120" }
      - { name: is_protected_class, type: boolean, source: input, default: false, description: "Protected-class membership flag consumed by disparate-impact testing" }
      - { name: model_undecided_count, type: integer, source: computed, default: 0, description: "Count of this consumer's ScoreResults whose decision is UNDECIDED" }
      - { name: latest_uploaded_at, type: datetime, source: computed, description: "created_at of this consumer's most recent ScoreResult, taking the greatest created_at and breaking ties by the ascending ScoreResult creator identifier" }

  # --- archive samples and studies ------------------------------------------
  - name: ArchiveSample
    parent: ScoreModel
    common_fields: true
    fields:
      - { name: score_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the model version this draw was stratified for" }
      - { name: sample_ref, type: string, source: input, description: "Archive draw identifier", constraints: "unique per score_model_id" }
      - { name: record_count, type: integer, source: input, description: "Number of archive records in the draw", constraints: ">= 1" }
      - { name: segment_name, type: enum, source: input, description: "Development segment the draw was stratified on", constraints: "enum {PRIME, NEAR_PRIME, SUBPRIME, THIN_FILE}" }
      - { name: sample_kind, type: enum, source: input, description: "DEVELOPMENT draws may run protected-class studies; CROSS_BUREAU studies require VALIDATION", constraints: "enum {DEVELOPMENT, VALIDATION}" }
      - { name: window_start_month, type: string, source: input, description: "First month of the observation window as YYYY-MM, interpreted as UTC calendar months", constraints: ">= \"2015-01\"; window_start_month < window_end_month" }
      - { name: window_end_month, type: string, source: input, description: "Exclusive end month of the observation window as YYYY-MM; the window occupies [window_start_month, window_end_month) whichever layout the same sample_ref reused", constraints: "> window_start_month; window_end_month <= \"2026-09\"" }
      - { name: observation_window_months, type: integer, source: input, description: "Performance window length in months", constraints: ">= 6" }

  - name: ValidationStudy
    parent: ScoreModel
    common_fields: true
    fields:
      - { name: score_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the model version under study" }
      - { name: sample_id, type: string, source: input, description: "FK -> ArchiveSample.id; the archive sample this study scores" }
      - { name: study_path, type: enum, source: input, description: "Analysis path executed by the study", constraints: "enum {PROTECTED_CLASS, CROSS_BUREAU}" }
      - { name: status, type: enum, source: system, description: "Study lifecycle state", constraints: "enum {SCHEDULED, VALIDATION_COMPLETE, BLOCKED, COMPENSATED}" }
      - { name: touched_model_ids, type: array, source: system, description: "Append-only replay log: ordered ScoreModel ids whose variant distribution_shift_points this study has already recomputed, prefixed with this study's own score_model_id" }
      - { name: disparate_impact_ratio_ppm, type: integer, source: computed, description: "p25 positive-outcome rate over p75 positive-outcome rate in parts-per-million; PROTECTED_CLASS path only, null otherwise" }
      - { name: reconciliation_variance, type: number, source: computed, description: "Absolute difference between the median bureau-weighted composite and the median unweighted composite across the three bureaus; CROSS_BUREAU path only, null otherwise" }
      - { name: performed_by, type: string, source: input, description: "X-User-ID of the analyst who scheduled the study" }
      - { name: finalized_by, type: string, source: input, description: "X-User-ID recorded at acknowledgement; must differ from performed_by" }
      - { name: evidence_ref, type: string, source: input, description: "Supporting evidence reference recorded at acknowledgement" }
      - { name: model_doc_id, type: string, source: system, description: "FK -> ModelDocumentation.id; the risk report produced by this study's documentation gate, null until produced" }
      - { name: required_reason_codes, type: array, source: computed, description: "Composite reason codes that must each appear on at least one non-VOIDED ScoreResult before acknowledgement; PROTECTED_CLASS path: [CREDIT-DUAL-DECISION-V1-SEGMENT_ZERO-STUDY-PRIMARY, CREDIT-DUAL-DECISION-V1-UNDECIDED-ESCALATED-SECONDARY]; CROSS_BUREAU path: [CREDIT-DUAL-DECISION-V1-BUREAU_DISAGREEMENT-TERTIARY, CREDIT-DUAL-DECISION-V1-RECONCILIATION_SPREAD-STUDY-PRIMARY]" }

  - name: ReferenceSet
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; the consumer whose profile this reference set compiles" }
      - { name: score_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the model version the reference set was compiled against" }
      - { name: reason_code_id, type: string, source: system, description: "FK -> ReasonCode.id; the catalogue member attached by the attach action, null until BOUND and cleared again on detach/reconcile" }
      - { name: status, type: enum, source: system, description: "Reference-set lifecycle state", constraints: "enum {COMPILED, BOUND, RECONCILED}" }

  # --- scoring postings -----------------------------------------------------
  - name: ScoreResult
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; the consumer this score was posted for" }
      - { name: score_variant_id, type: string, source: input, description: "FK -> ScoreVariant.id; the industry variant that produced the score" }
      - { name: bureau_id, type: string, source: input, description: "FK -> Bureau.id; the bureau the score was pulled from" }
      - { name: reference_set_id, type: string, source: system, description: "FK -> ReferenceSet.id; the reference set this result was posted against" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; the license covering the requesting lender at post time" }
      - { name: raw_posted_score, type: integer, source: input, description: "Score as received from the bureau, before adjustment", constraints: "300 <= raw_posted_score <= 850" }
      - { name: effective_score, type: integer, source: computed, description: "raw_posted_score adjusted by the effective variant's segment offsets and rounding penalty" }
      - { name: odds_at_posted_score, type: number, source: computed, description: "Good:bad odds implied by the effective variant's odds-to-score relationship at raw_posted_score, 4 decimal places" }
      - { name: decision, type: enum, source: system, description: "Decision from the lender's approved cutoff snapshot; null until evaluated", constraints: "enum {APPROVE, DECLINE, UNDECIDED}" }
      - { name: decision_reason_code_id, type: string, source: system, description: "FK -> ReasonCode.id; the principal reason code justifying a DECLINE, null while UNDECIDED" }
      - { name: migration_event_id, type: string, source: input, description: "FK -> MigrationEvent.id; the migration step this posting anchors to, null for an ordinary pull. The next posting by the same lender_code for the same consumer in the same family consumes the earliest unconsumed eligible event by created_at ascending" }

  # --- reason-code catalogue (self-referential) -----------------------------
  - name: ReasonCode
    parent: null
    common_fields: true
    fields:
      - { name: score_variant_id, type: string, source: input, description: "FK -> ScoreVariant.id; the variant this catalogue entry was authored on" }
      - { name: depth_tier, type: enum, source: input, description: "Adverse-action tier", constraints: "enum {PRIMARY, SECONDARY, TERTIARY}" }
      - { name: trigger_feature_code, type: string, source: input, description: "Model feature whose contribution this code explains" }
      - { name: code_label, type: string, source: input, description: "Catalogue-local label; the composite code is minted by the system", constraints: "unique per (score_variant_id, code_label)" }
      - { name: composite_code, type: string, source: computed, description: "\"<variant version_label>-<industry>-<trigger_feature_code>-<depth_tier>\"; the stable identity used by adverse-action mapping", constraints: "unique per score_variant_id among non-ARCHIVED codes" }
      - { name: weight_pct, type: number, source: input, description: "Share of the adverse-action explanation this code carries", constraints: "0 < weight_pct <= 1" }
      - { name: weight_received_pct, type: number, source: computed, default: 0, description: "Bubble-up share routed from ARCHIVED descendants whose weight_pct < 0.05" }
      - { name: weight_effective_pct, type: number, source: computed, description: "weight_pct + weight_received_pct, rounded to 4 decimal places" }
      - { name: parent_reason_code_id, type: string, source: input, description: "FK -> ReasonCode.id; tree parent inside the same variant catalogue, null for a root", constraints: "parent must belong to the same score_variant_id" }
      - { name: status, type: enum, source: system, description: "Catalogue lifecycle state", constraints: "enum {ACTIVE, ARCHIVED}" }
      - { name: bind_count, type: integer, source: computed, default: 0, description: "Number of reference-set attach actions that have bound this code" }
      - { name: archived_consumed_entitlement_snapshot, type: integer, source: system, default: 0, description: "Invariant B anchor: count of non-VOIDED score results accruing fees under licenses for this code's variant at the instant this code was archived" }

  # --- licensing and pricing ------------------------------------------------
  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: lender_name, type: string, source: input, description: "Licensed lender legal name" }
      - { name: lender_code, type: string, source: input, description: "Short lender handle stamped onto every score settled under this license", constraints: "unique per (lender_code, score_variant_id) while status is ACTIVE" }
      - { name: score_variant_id, type: string, source: input, description: "FK -> ScoreVariant.id; the licensed score" }
      - { name: volume_tier, type: enum, source: input, description: "Tier label used for reporting; the charged rate is always drawn from the marginal tier schedule, never from this label", constraints: "enum {VOLUME_TIER_1, VOLUME_TIER_2, VOLUME_TIER_3}" }
      - { name: entitled_count, type: integer, source: input, description: "Largest cumulative score count this license settles without renegotiation", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "License lifecycle state", constraints: "enum {PENDING, ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: entitlement_status, type: enum, source: system, default: NOT_SET, description: "Independent entitlement axis, recomputed on every termination", constraints: "enum {NOT_SET, WITHIN_ENTITLEMENT, OVER_ENTITLED}" }
      - { name: cumulative_score_count, type: integer, source: computed, default: 0, description: "Count of non-VOIDED ScoreResults settled under this license (invariant A left-hand quantity)" }
      - { name: cumulative_fee_cents, type: integer, source: computed, default: 0, description: "Sum of fee deltas on this license's FeeLedgerEntries (invariant A right-hand quantity)" }
      - { name: window_start_month, type: string, source: input, description: "First month of the license term as YYYY-MM; the term occupies [window_start_month, window_end_month)", constraints: ">= \"2015-01\"; window_start_month < window_end_month" }
      - { name: window_end_month, type: string, source: input, description: "Exclusive end month of the license term as YYYY-MM", constraints: "> window_start_month; window_end_month <= \"2032-12\"" }
      - { name: window_credited_delta_bps, type: integer, source: computed, default: 0, description: "Sum of credited_delta_bps over the migration anchors this license has consumed and not voided; tolerant half of invariant B" }
      - { name: window_outcome_mixture_ratio_ppm, type: integer, source: computed, default: 0, description: "Round-half-up of sum(effective_score over this license non-VOIDED postings) * 1000000 / (1000 * cumulative_score_count); 0 when cumulative_score_count is 0" }

  - name: FeeLedgerEntry
    parent: License
    common_fields: false
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; the license this accrual belongs to" }
      - { name: score_result_id, type: string, source: system, description: "FK -> ScoreResult.id; the posting that produced this accrual, null for a settlement-level adjustment" }
      - { name: kind, type: enum, source: system, description: "Ledger entry kind", constraints: "enum {MARGINAL_PRICING, VOID_REVERSAL}" }
      - { name: cumulative_count_before, type: integer, source: system, description: "License.cumulative_score_count immediately before this entry was written" }
      - { name: fee_cents, type: integer, source: system, description: "Fee delta in cents; negative on VOID_REVERSAL" }
      - { name: ledger_description, type: string, source: system, description: "Audit prose describing the accrual" }

  # --- regulatory documentation ---------------------------------------------
  - name: ModelDocumentation
    parent: null
    common_fields: true
    fields:
      - { name: score_model_id, type: string, source: input, description: "FK -> ScoreModel.id; the version this document attests to" }
      - { name: study_id, type: string, source: input, description: "FK -> ValidationStudy.id; the study that required this document, null for voluntary filings" }
      - { name: doc_type, type: enum, source: input, description: "Regulatory document class", constraints: "enum {MODEL_RISK_REPORT, FAIR_LENDING_REPORT, ADVERSE_ACTION_MAP, BUREAU_DISCREPANCY_REPORT}" }
      - { name: required_version_label, type: string, source: input, description: "Version label this document must attest to" }
      - { name: status, type: enum, source: system, description: "Document lifecycle state", constraints: "enum {DRAFT, FILED, SUPPLEMENTED}" }
      - { name: filed_at, type: datetime, source: system, description: "Set when the document transitions to FILED" }
      - { name: checksum, type: string, source: computed, description: "Deterministic digest over (score_model_id, required_version_label, doc_type, status) recomputed on every content mutation" }

  # --- audit trails ---------------------------------------------------------
  - name: MigrationEvent
    parent: null
    common_fields: false
    fields:
      - { name: lender_code, type: string, source: input, description: "Lender whose migration step this event records" }
      - { name: from_score_variant_id, type: string, source: input, description: "FK -> ScoreVariant.id; the variant the lender migrated away from" }
      - { name: to_score_variant_id, type: string, source: input, description: "FK -> ScoreVariant.id; the variant the lender migrated to" }
      - { name: event_type, type: enum, source: input, description: "Migration step kind", constraints: "enum {RECALIBRATED, SNAPSHOT_COMPILED, MIGRATED}" }
      - { name: evidence_ref, type: string, source: input, description: "Reference to the migration-plan artifact or recalibration worksheet" }
      - { name: carried_decision_reason_code_id, type: string, source: input, description: "FK -> ReasonCode.id; the catalogue code the migration plan maps for adverse action when this event is the anchor of a posting; must belong to a variant of the same model family as to_score_variant_id (ERR_REASON_CODE_VARIANT_MISMATCH)" }
      - { name: credited_delta_bps, type: integer, source: system, default: 0, description: "Basis points this event adds to the consuming license window_outcome_mixture_ratio_ppm; the void compensating action subtracts exactly this value. Derivable from target.ref_score minus source.ref_score" }
      - { name: voided_at, type: datetime, source: system, description: "Set when the migration event is voided" }

  - name: ScoreDiscoveryRequest
    parent: null
    common_fields: true
    fields:
      - { name: tag, type: string, source: input, description: "Free-form discovery tag supplied by the requester", constraints: "unique per (tag, status) while status is REGISTERED" }
      - { name: requested_at, type: datetime, source: system, description: "Set when the discovery request is registered" }
      - { name: status, type: enum, source: system, description: "Discovery-slot lifecycle state", constraints: "enum {REGISTERED, CONSUMED, EXPIRED}" }
      - { name: consumed_score_result_id, type: string, source: system, description: "FK -> ScoreResult.id; the posting that consumed this discovery slot, null until CONSUMED" }
# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:

  # ---- cyclic revision loop: a deprecation can be reversed -----------------
  - entity: ScoreModel
    initial_state: DEVELOPMENT
    terminal_states: [RETIRED]
    transitions:
      - from: DEVELOPMENT
        to: RELEASED
        trigger: "POST /score-models/{modelId}/release"
        actor: ModelDeveloper
        preconditions:
          - "a ModelDocumentation with doc_type MODEL_RISK_REPORT and required_version_label equal to this model's version_label exists in status FILED or SUPPLEMENTED (ERR_MODEL_DOC_REQUIRED)"
          - "the model has at least one ScoreVariant in status RELEASED (ERR_NO_RELEASED_VARIANT)"
          - "predecessor_model_id is null, or the predecessor ScoreModel's status is RELEASED or DEPRECATED (ERR_INVALID_STATE_MACHINE_EDGE)"
        side_effects:
          - "released_at is stamped from the logical clock"
          - "hop 1 of cascade C7: if predecessor_model_id is non-null, the predecessor ScoreModel moves to SUPERSEDED with retired_at stamped from the logical clock, and every ScoreModel that names that predecessor moves to SUPERSEDED the same way"
          - "hop 2 of C7: every License whose score_variant belongs to a superseded model moves ACTIVE → SUSPENDED"
          - "hop 3 of C7: every ReferenceSet whose score_model_id is a superseded model moves COMPILED|BOUND → RECONCILED"
          - "active_variant_count and cascade_depth are recomputed for this model"

      - from: RELEASED
        to: DEPRECATED
        trigger: "POST /score-models/{modelId}/deprecate"
        actor: ComplianceOfficer
        preconditions:
          - "no License on any ScoreVariant of this model is in status ACTIVE (ERR_DEPRECATION_BLOCKED)"
        side_effects:
          - "the version stays selectable by existing lenders; creating a new License on its variants is rejected with ERR_MODEL_DEPRECATED"
          - "created_at ordering is preserved so the deprecated version still appears ahead of its successor in the family listing"

      - from: DEPRECATED
        to: RELEASED
        trigger: "POST /score-models/{modelId}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "a ModelDocumentation with doc_type MODEL_RISK_REPORT and required_version_label equal to this model's version_label exists in status FILED or SUPPLEMENTED (ERR_MODEL_DOC_REQUIRED)"
        side_effects:
          - "released_at is refreshed from the logical clock — the reopening is itself a release event"
          - "every ValidationStudy on this model in status BLOCKED returns to SCHEDULED"

      - from: DEPRECATED
        to: RETIRED
        trigger: "POST /score-models/{modelId}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "no ReferenceSet whose score_model_id is this model sits outside status RECONCILED (ERR_RETIREMENT_BLOCKED)"
        side_effects:
          - "retired_at is stamped from the logical clock"

      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (automatic when a same-family successor names this model as predecessor and reaches RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "retired_at is stamped from the logical clock"
          - "hop 2 of C7: every License whose score_variant belongs to this model moves ACTIVE → SUSPENDED"
          - "hop 3 of C7: every ReferenceSet whose score_model_id is this model moves COMPILED|BOUND → RECONCILED"

      - from: DEPRECATED
        to: SUPERSEDED
        trigger: "system (automatic when a same-family successor names this model as predecessor and reaches RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "retired_at is stamped from the logical clock"
          - "hop 2 of C7: every License whose score_variant belongs to this model moves ACTIVE → SUSPENDED"
          - "hop 3 of C7: every ReferenceSet whose score_model_id is this model moves COMPILED|BOUND → RECONCILED"

  # ---- linear-with-revert lifecycle for industry variants ------------------
  - entity: ScoreVariant
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /score-variants/{scoreVariantId}/release"
        actor: ModelDeveloper
        preconditions:
          - "the parent ScoreModel.status is DEVELOPMENT or RELEASED (ERR_INVALID_STATE_MACHINE_EDGE)"
        side_effects:
          - "recompute ScoreModel.active_variant_count"

      - from: RELEASED
        to: RECALLED
        trigger: "POST /score-variants/{scoreVariantId}/recall"
        actor: ModelDeveloper
        preconditions: []
        side_effects:
          - "recompute ScoreModel.active_variant_count"
          - "when the parent model's active_variant_count reaches 0, every ValidationStudy on that model in status SCHEDULED moves to BLOCKED"

      - from: RECALLED
        to: RELEASED
        trigger: "POST /score-variants/{scoreVariantId}/release"
        actor: ModelDeveloper
        preconditions:
          - "the parent ScoreModel.status is DEVELOPMENT or RELEASED (ERR_INVALID_STATE_MACHINE_EDGE)"
        side_effects:
          - "recompute ScoreModel.active_variant_count; this does not by itself return BLOCKED studies to SCHEDULED"

  # ---- cyclic revision loop: a completed study can be reverted and re-run --
  - entity: ValidationStudy
    initial_state: SCHEDULED
    terminal_states: [COMPENSATED]
    transitions:
      - from: SCHEDULED
        to: VALIDATION_COMPLETE
        trigger: "POST /validation-studies/{studyId}/run"
        actor: ValidationAnalyst
        preconditions:
          - "the linked ArchiveSample.record_count is >= the model's min_input_count (ERR_SAMPLE_TOO_SMALL)"
          - "PROTECTED_CLASS path: at least one ReasonCode belonging to a ScoreVariant of this model is in status ACTIVE (ERR_REASON_CODE_MISSING)"
          - "CROSS_BUREAU path: the linked ArchiveSample.sample_kind must be VALIDATION (ERR_SAMPLE_KIND_MISMATCH)"
        side_effects:
          - "status moves to VALIDATION_COMPLETE"
          - "disparate_impact_ratio_ppm (PROTECTED_CLASS) is computed by §1.3 disparate_impact_ratio"
          - "the CROSS_BUREAU path computes weighted_composite and unweighted_composite by §1.3 composite_score and stores their absolute difference as reconciliation_variance"
          - "hop 1 of cascade C8: distribution_shift_points is recomputed for every RELEASED ScoreVariant belonging to each model listed in touched_model_ids, processed in touched_model_ids order"
          - "if no non-COMPENSATED study on this model has previously reached VALIDATION_COMPLETE, validated_at is stamped on every RELEASED ScoreVariant of the model"
          - "hop 2 of C8: if no ModelDocumentation with doc_type MODEL_RISK_REPORT and required_version_label equal to the model's version_label exists, one is created in status DRAFT and model_doc_id is bound to it"

      - from: SCHEDULED
        to: BLOCKED
        trigger: "system (automatic when the model's active_variant_count reaches 0 while the study is still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /score-models/{modelId}/reopen"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "every ValidationStudy on this model in status BLOCKED returns to SCHEDULED"

      - from: VALIDATION_COMPLETE
        to: SCHEDULED
        trigger: "POST /validation-studies/{studyId}/revert"
        actor: ValidationAnalyst
        preconditions:
          - "the study has not been acknowledged; finalized_by is still null (ERR_STUDY_ALREADY_FINALIZED)"
        side_effects:
          - "disparate_impact_ratio_ppm and reconciliation_variance are cleared to null"
          - "hop 1 of cascade C9: distribution_shift_points is re-derived in touched_model_ids order for every RELEASED ScoreVariant of each listed model; values are left unchanged by this replay"
          - "hop 2 of C9: for every ModelDocumentation attesting a model in touched_model_ids, status moves DRAFT|FILED → SUPPLEMENTED and checksum is recomputed"

      - from: VALIDATION_COMPLETE
        to: VALIDATION_COMPLETE
        trigger: "POST /validation-studies/{studyId}/acknowledge"
        actor: FairLendingOfficer
        preconditions:
          - "finalized_by differs from performed_by (ERR_SEGREGATION_OF_DUTIES)"
          - "for every composite code in required_reason_codes, at least one non-VOIDED ScoreResult exists whose decision_reason_code_id resolves to a ReasonCode carrying that composite_code (ERR_REASON_CODE_VIOLATION)"
        side_effects:
          - "finalized_by and evidence_ref are recorded"
          - "hop 3 of C8: a ModelDocumentation with doc_type FAIR_LENDING_REPORT and the same required_version_label moves DRAFT|FILED → SUPPLEMENTED with checksum recomputed"

      - from: VALIDATION_COMPLETE
        to: COMPENSATED
        trigger: "POST /validation-studies/{studyId}/compensate"
        actor: FairLendingOfficer
        preconditions:
          - "the study was acknowledged; finalized_by is non-null (ERR_STUDY_NOT_FINALIZED)"
        side_effects:
          - "disparate_impact_ratio_ppm and reconciliation_variance are cleared to null"
          - "every ScoreResult referencing this study's model keeps its effective_score, odds_at_posted_score and decision — the compensating action conserves the scoring ledger"

  # ---- parallel state dimensions on one row: status x entitlement_status ---
  - entity: License
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /licenses/{licenseId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "the licensed ScoreVariant's ScoreModel status must be RELEASED or DEPRECATED (ERR_MODEL_SUPERSEDED when SUPERSEDED, ERR_MODEL_RETIRED when RETIRED)"
        side_effects:
          - "cumulative_score_count and cumulative_fee_cents are recomputed from this license's FeeLedgerEntries"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when the licensed variant's model version reaches SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "further posting under this license is rejected with ERR_LICENSE_SUSPENDED"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a posting carries cumulative_score_count past entitled_count)"
        actor: system
        preconditions: []
        side_effects:
          - "the posting that crossed the limit still succeeds and carries the fixed overage surcharge"
          - "further posting under this license is rejected with ERR_LICENSE_SUSPENDED until a reactivation"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licenses/{licenseId}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "cumulative_score_count is strictly greater than entitled_count (ERR_ENTITLEMENT_WITHIN_LIMIT)"
        side_effects:
          - "further posting under this license is rejected with ERR_LICENSE_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{licenseId}/reactivate"
        actor: ComplianceOfficer
        preconditions:
          - "the licensed ScoreVariant's ScoreModel status is RELEASED or DEPRECATED (ERR_MODEL_SUPERSEDED / ERR_MODEL_RETIRED)"
        side_effects:
          - "entitlement_status is left unchanged — the entitlement axis is independent of the license axis"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licenses/{licenseId}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "a ModelDocumentation with required_version_label equal to the licensed model's version_label exists in status FILED or SUPPLEMENTED (ERR_LICENSE_DOC_MISSING)"
        side_effects:
          - "entitlement_status is recomputed: WITHIN_ENTITLEMENT when cumulative_score_count <= entitled_count, otherwise OVER_ENTITLED"
          - "cumulative_fee_cents is recomputed as the sum of fee_cents over this license's FeeLedgerEntries"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /licenses/{licenseId}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "a ModelDocumentation with required_version_label equal to the licensed model's version_label exists in status FILED or SUPPLEMENTED (ERR_LICENSE_DOC_MISSING)"
        side_effects:
          - "entitlement_status is recomputed: WITHIN_ENTITLEMENT when cumulative_score_count <= entitled_count, otherwise OVER_ENTITLED"

      - from: TERMINATED
        to: TERMINATED
        trigger: "POST /licenses/{licenseId}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "the license already carries entitlement_status OVER_ENTITLED or WITHIN_ENTITLEMENT"
        side_effects:
          - "entitlement_status is recomputed from the current cumulative_score_count — the self-loop is the partial reversal that returns an overstated entitlement flag to its correct value"
          - "a FeeLedgerEntry of kind VOID_REVERSAL with score_result_id null and fee_cents 0 is appended for the settlement audit trail"

  # ---- fork / rejoin on a monotonic ladder --------------------------------
  - entity: ReferenceSet
    initial_state: COMPILED
    terminal_states: [RECONCILED]
    transitions:
      - from: COMPILED
        to: BOUND
        trigger: "POST /reference-sets/{referenceSetId}/attach-reason-code"
        actor: FairLendingOfficer
        preconditions:
          - "the score_model_id's status must be DEPRECATED or RELEASED (ERR_INVALID_STATE_MACHINE_EDGE otherwise)"
          - "the attached ReasonCode.status must be ACTIVE (ERR_REASON_CODE_ARCHIVED)"
          - "the attached ReasonCode.score_variant_id must belong to this reference set's score_model_id (ERR_REASON_CODE_VARIANT_MISMATCH)"
        side_effects:
          - "reason_code_id is recorded; the reason code's bind_count increments"
          - "hop 1 of cascade C10: every ScoreResult whose reference_set_id is this reference set re-derives effective_score and odds_at_posted_score against its effective variant, and the §1.3 bureau_discrepancy_scan inputs are invalidated for those postings"

      - from: BOUND
        to: RECONCILED
        trigger: "POST /reference-sets/{referenceSetId}/reconcile"
        actor: FairLendingOfficer
        preconditions:
          - "the bound ReasonCode.status must be ARCHIVED (ERR_REASON_CODE_ACTIVE)"
        side_effects:
          - "reason_code_id is cleared to null"
          - "hop 2 of C10: decision is reset to UNDECIDED on every ScoreResult of this reference set"

      - from: BOUND
        to: COMPILED
        trigger: "POST /reference-sets/{referenceSetId}/detach-reason-code"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "reason_code_id is cleared to null"
          - "hop 2 of C10: decision is reset to UNDECIDED on every ScoreResult of this reference set"

  # ---- cyclic catalogue: archive reversals, self-referential bubble-up -----
  - entity: ReasonCode
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /reason-codes/{reasonCodeId}/archive"
        actor: ReasonCodeAdministrator
        preconditions:
          - "no child ReasonCode of this node is in status ACTIVE (ERR_REASON_CODE_ARCHIVED)"
          - "bind_count is less than 2 (ERR_REASON_CODE_REUSE_LIMIT)"
        side_effects:
          - "archived_consumed_entitlement_snapshot is set to the count of non-VOIDED ScoreResults accruing fees under licenses whose licensed variant is this code's score_variant_id — invariant B's left-hand quantity"
          - "hop 1 of cascade C10: every ReferenceSet whose reason_code_id is this code and whose status is BOUND moves to RECONCILED"
          - "hop 2 of C10: decision is reset to UNDECIDED on every ScoreResult of each such reference set"
          - "hop 3 of C10: model_undecided_count is recomputed for every affected Consumer"
          - "hop 4 of C10: for every Consumer whose model_undecided_count is now >= 3, each of that consumer's ScoreResults still at decision UNDECIDED moves to DECLINE"
          - "hop 5 of C10: for each ScoreResult moved to DECLINE, decision_reason_code_id is set to the ACTIVE PRIMARY ReasonCode on its effective variant carrying the lexicographically lowest composite_code"
          - "hop 1 of cascade C11: each of those ScoreResults re-derives effective_score and odds_at_posted_score against its effective variant, leaving effective_score numerically unchanged"

      - from: ARCHIVED
        to: ACTIVE
        trigger: "POST /reason-codes/{reasonCodeId}/restore"
        actor: ReasonCodeAdministrator
        preconditions:
          - "no other ReasonCode on the same ScoreVariant carries the same composite_code in status ACTIVE (ERR_COMPOSITE_CODE_DUPLICATE)"
          - "parent_reason_code_id is null, or the parent ReasonCode.status is ACTIVE (ERR_REASON_CODE_ARCHIVED)"
        side_effects:
          - "weight_received_pct is re-derived as the sum of weight_pct over this node's ARCHIVED descendants whose weight_pct is below 0.05"
          - "hop 2 of C11: the compensating action re-consumes the archived snapshot — the count of non-VOIDED ScoreResults accruing fees under licenses for this variant is compared against archived_consumed_entitlement_snapshot, and a FeeLedgerEntry of kind VOID_REVERSAL is appended on every license whose cumulative_score_count differs from its snapshot share"

  # ---- terminal log: registration cannot be reversed ----------------------
  - entity: ScoreDiscoveryRequest
    initial_state: REGISTERED
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: REGISTERED
        to: CONSUMED
        trigger: "POST /score-results carrying a registered discovery tag"
        actor: ScoreConsumer
        preconditions:
          - "the posting must carry exactly the tag of this discovery request (ERR_DISCOVERY_TAG_UNKNOWN)"
        side_effects:
          - "consumed_score_result_id is bound to the posting; the slot is terminal and can no longer be consumed"

      - from: REGISTERED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (sweep of discovery slots older than 720 logical hours)"
        actor: system
        preconditions: []
        side_effects: []
# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:

  - name: cutoff_recalibration
    trigger: "POST /migration-events with event_type RECALIBRATED; the result is echoed for the reviewer and is NOT applied to any stored score"
    algorithm: threshold
    input_set: "one source ScoreVariant (the variant the lender is leaving) paired with one target ScoreVariant (the variant the lender is adopting); both must belong to the same industry"
    formula: |
      # VARIANT_A — score-preserving recalibration: hold the RANK of the old
      # cutoff, ignore both variants' odds curves.
      new_cutoff_score_preserving = clamp(old_cutoff_score + (target.ref_score - source.ref_score),
                                          target_model.score_floor, target_model.score_ceiling)

      # VARIANT_B — odds-preserving recalibration: hold the BREAKEVEN ODDS, let
      # the score move. The old cutoff is first re-expressed as odds under the
      # SOURCE curve, then inverted under the TARGET curve.
      odds_at_old_cutoff = source.base_odds * 2 ** ((old_cutoff_score - source.ref_score) / source.double_odds_points)
      implied_point_shift = target.double_odds_points * log2(odds_at_old_cutoff / target.base_odds)
      new_cutoff_odds_preserving = clamp(round_half_up(target.ref_score + implied_point_shift, 0),
                                         target_model.score_floor, target_model.score_ceiling)

      # VARIANT_C — reported only, never a rejection reason: the disagreement
      # between the two recalibrations.
      cutoff_disagreement_points = new_cutoff_score_preserving - new_cutoff_odds_preserving
    constants:
      LOG_BASE: 2
    precision: "cutoffs are whole score points, round_half_up; cutoff_disagreement_points is an integer"
    variants:
      - name: shift_equal
        when: "the two variants carry identical ref_score, base_odds and double_odds_points"
        difference: "VARIANT_A and VARIANT_B produce the same integer cutoff, so cutoff_disagreement_points is exactly 0"
      - name: shift_divergent
        when: "target.double_odds_points > source.double_odds_points"
        difference: "VARIANT_B lands above VARIANT_A, so cutoff_disagreement_points is positive and the two recalibrations disagree"

  - name: composite_score
    trigger: "POST /validation-studies/{studyId}/run with study_path CROSS_BUREAU; also recomputed by every mutation of a ScoreResult that belongs to the study's reference set"
    algorithm: weighted_scoring
    input_set: "the non-VOIDED ScoreResults whose score_variant belongs to the study's score_model_id, across every bureau; each contributing ScoreResult's weight is its own ScoreVariant.aggregate_weight_pct, read at evaluation time"
    formula: |
      # VARIANT_A — bureau-weighted composite.
      weighted_composite = sum(score_result.effective_score * score_result.variant_weight_pct
                               for score_result in captured set)
      # The per-posting product is ROUNDED TO 2 DECIMALS BEFORE SUMMING.
      weighted_composite = round_half_up(weighted_composite, 2)

      # VARIANT_B — unweighted bureau mean.
      # The mean is formed at full precision, THEN truncated toward zero to a
      # whole-hundredth increment, THEN rounded half-up to 2 decimals:
      unweighted_composite = round_half_up(floor( (sum(score_result.effective_score) / count) * 100 ) / 100, 2)

      # Reported diagnostic for both variants:
      reconciliation_variance = abs(weighted_composite - unweighted_composite)
    precision: "2 decimal places, round_half_up, after the per-variant truncation step described above"
    variants:
      - name: weighted
        when: "study_path CROSS_BUREAU and study_path is stored; this is the variant a CROSS_BUREAU study publishes"
        difference: "varies with the member weights, so a set holding heavy high-scoring members departs from the unweighted mean"
      - name: unweighted
        when: "same evidence set, used to expose the calibration difference between bureaus"
        difference: "ignores aggregate_weight_pct entirely; the two variants differ by reconciliation_variance"
      - name: empty_set
        when: "the captured reference set yields zero non-VOIDED postings"
        difference: "both variants return 0.0000 and reconciliation_variance is exactly 0.00 — the empty-set boundary is pinned, not left to a divide-by-zero"

  - name: score_effective_and_odds
    trigger: "POST /score-results and every re-derivation cascade (reference-set attach, reason-code archive)"
    algorithm: threshold
    input_set: "one ScoreResult carrying raw_posted_score, one effective ScoreVariant, one ScoreModel supplying score_floor and score_ceiling"
    formula: |
      # Evaluation order is pinned; the band index is resolved BEFORE the
      # penalty is computed, and the clamp is applied BEFORE the penalty.
      band = min(max(floor((raw_posted_score - variant.ref_score) / variant.segment_width), 0), 2)
      provisional_score = clamp(raw_posted_score + variant.segment_offsets[band],
                                model.score_floor, model.score_ceiling)
      rounding_penalty = ceil(provisional_score * variant.rounding_penalty_pct)
      effective_score = provisional_score - rounding_penalty

      odds_at_effective = variant.base_odds * 2 ** ((effective_score - variant.ref_score) / variant.double_odds_points)
      cutoff_odds = 1.0 + (variant.elongation_points / effective_score)
      odds_at_posted_score = round_half_up(odds_at_effective + cutoff_odds, 4)
    precision: "odds_at_posted_score carries 4 decimal places, round_half_up; effective_score is an integer"
    variants:
      - name: penalty_before_clamp
        when: "a target ScoreModel whose score_floor is reached by raw_posted_score + segment_offset"
        difference: "the alternative order — applying the rounding penalty to the raw score and clamping afterwards — produces a score one or more points higher at the floor, because the clamp absorbs the penalty differently"
      - name: penalty_after_clamp
        when: "the pinned order above; this is the variant the system stores"
        difference: "the penalty is taken from the already-clamped provisional score, so a score sitting exactly on the floor still loses its rounding penalty"

  - name: composite_reason_code
    trigger: "POST /reason-codes (mint) and POST /reason-codes/{reasonCodeId}/archive (bubble-up re-derivation)"
    algorithm: aggregation
    input_set: "the ReasonCodes of one ScoreVariant whose parent_reason_code_id is null, plus their direct children"
    formula: |
      composite_code = f"{variant_model.version_label}-{variant.industry}-{trigger_feature_code}-{depth_tier}"
      weight_effective_pct = round_half_up(weight_pct + weight_received_pct, 4)
      # Bubble-up: a child whose weight_pct < BUBBLE_UP_FLOOR routes its whole
      # weight to its parent_reason_code_id, and that parent's
      # weight_received_pct becomes the sum of all such children.
      # Children whose weight_pct >= BUBBLE_UP_FLOOR route nothing.
      # If both a parent and its grandparent qualify, only the immediate parent
      # receives the share; routing is one hop.
    constants:
      BUBBLE_UP_FLOOR: 0.05
    precision: "4 decimal places, round_half_up"
    variants:
      - name: single_hop
        when: "one archived child below the floor under one parent"
        difference: "the parent's weight_received_pct equals exactly that child's weight_pct"
      - name: sibling_accumulation
        when: "two archived children below the floor under the same parent"
        difference: "the parent's weight_received_pct is the sum of both children's weight_pct, while a grandparent receives nothing"

  - name: license_marginal_fee
    trigger: "POST /score-results (settle one marginal fee); also the basis for POST /score-results/{scoreResultId}/void reversal"
    algorithm: tiered_pricing
    input_set: "one License; the marginal schedule is applied to the license's own cumulative_score_count, never to a month-to-date or tenant-wide figure"
    formula: |
      volume_tier_boundaries = [0, 10000, 50000]
      volume_tier_rates_cents = [18, 14, 9]
      FIXED_OVERAGE_FEE_CENTS = 250

      def fee_through(n):
          total = 0
          for i in range(len(volume_tier_boundaries)):
              lower = volume_tier_boundaries[i]
              upper = volume_tier_boundaries[i + 1] if i + 1 < len(volume_tier_boundaries) else infinity
              if n > lower:
                  total += (min(n, upper) - lower) * volume_tier_rates_cents[i]
          return total

      # The marginal charge for the posting that carries cumulative_score_count
      # from cb to cb+1:
      marginal_fee_cents = fee_through(cb + 1) - fee_through(cb)
      if cb + 1 > license.entitled_count:
          marginal_fee_cents = marginal_fee_cents + FIXED_OVERAGE_FEE_CENTS
      # VOID_REVERSAL restores the SAME formula at the posting's captured
      # cumulative_count_before, so the reversal cancels the charge exactly.
    constants:
      TIER_1_RATE_CENTS: 18
      TIER_2_RATE_CENTS: 14
      TIER_3_RATE_CENTS: 9
      TIER_1_UPPER_BOUND: 10000
      TIER_2_UPPER_BOUND: 50000
      FIXED_OVERAGE_FEE_CENTS: 250
    precision: "integer cents; no rounding step"
    variants:
      - name: marginal
        when: "stored on the fee ledger entry; this is the variant the system settles"
        difference: "crosses a tier boundary by charging the old tier's rate on the units below the boundary and the new tier's rate only on the units at or above it"
      - name: blended
        when: "reported as the license's effective unit rate for the period; never the settled amount"
        difference: "charges the highest tier reached against every unit and therefore overstates a boundary-crossing settlement"

  - name: bureau_discrepancy_scan
    trigger: "GET /score-results/{scoreResultId}/bureau-discrepancies; also recomputed by POST /reference-sets/{referenceSetId}/attach-reason-code as part of hop 1"
    algorithm: aggregation
    input_set: "the ScoreResults of one Consumer, non-VOIDED, restricted to the poster's own score model version and excluding the poster itself; negative-scoring results are included"
    formula: |
      peer_spread = max(peer.effective_score) - min(peer.effective_score) over the peer set
      flagged_peers = [peer for peer in peer_set
                       if abs(peer.effective_score - poster.effective_score) >= DISCREPANCY_POINTS]
      # peers are returned ordered by bureau.bureau_code ascending, then
      # score_result.created_at ascending
    constants:
      DISCREPANCY_POINTS: 15
    precision: "integer points"
    variants:
      - name: spread_reported
        when: "the poster belongs to the peer set's model version"
        difference: "reports peer_spread even when flagged_peers is empty, so a quiet bureau set still yields a spread"
      - name: empty_peer_set
        when: "the poster is the only posting for its consumer on its model version"
        difference: "peer_spread is 0 and flagged_peers is empty"

  - name: migration_window_ratio
    trigger: "POST /score-results that consumes a MigrationEvent; reversals are applied by POST /migration-events/{migrationEventId}/void"
    algorithm: projection
    input_set: "one License; the licence's whole non-VOIDED posting history is replayed; the window is not nested under any parent window"
    formula: |
      # Ordering note: this window is a LEAF quantity. It is replayed on
      # evaluation: the licence-derived term is recomputed from the licence's
      # current non-VOIDED postings on every evaluation, while the migration
      # credit term is never recomputed — it is the running sum of the
      # credited_delta_bps of the anchors this licence still holds.
      window_score_sum = sum(effective_score for posting in licence.nonVOIDEDPostings)
      window_outcome_mixture_ratio_ppm = round_half_up(window_score_sum * MIXTURE_SCALE
                                                      / (MILLI * licence.cumulative_score_count), 0)
      window_credited_delta_bps = sum(anchor.credited_delta_bps
                                      for anchor in licence.consumedAnchors if anchor.voided_at is null)
      # A MigrationEvent void subtracts exactly the anchor's credited_delta_bps,
      # which restores the pre-event ratio whenever the anchor's posting is
      # itself voided or untouched. Value 0 is reported rather than a
      # divide-by-zero when cumulative_score_count is 0.
    constants:
      MIXTURE_SCALE: 1000000
      MILLI: 1000
    precision: "whole parts-per-billion, round_half_up"
    variants:
      - name: anchor_consumed
        when: "the licence has consumed at least one unvoided anchor"
        difference: "window_credited_delta_bps is the sum of the surviving anchors' credited_delta_bps and the void of any anchor removes exactly its own contribution"
      - name: no_anchor
        when: "the licence has consumed no anchor, or every consumed anchor has been voided"
        difference: "window_credited_delta_bps is 0 and the ratio depends only on the licence's own non-VOIDED postings"

  - name: invariant_bookkeeping
    trigger: "evaluated on every compensating-action assert; computes the conserved-quantity ledger for the two §0.5 Rule 9 invariants"
    algorithm: aggregation
    input_set: "one License, plus the MigrationEvent anchors it has consumed; entries of kind VOID_REVERSAL with score_result_id null are settlement-level adjustments and carry a fee delta of 0"
    formula: |
      # Invariant A (exact) — per-license fee conservation under one void.
      # B(owner, posting) = license.cumulative_fee_cents immediately BEFORE the posting settled
      # P(owner, posting) = license.cumulative_fee_cents immediately AFTER the posting settled
      # lambda            = license.cumulative_fee_cents immediately after the void
      # Invariant: for every license  lambda * (P - B) == 0
      FEE_LEDGER_REVERSAL_CENTS = lambda_value * (P_value - B_value)

      # Invariant B (tolerant) — migration-anchor re-consumption.
      # xor 0 is 0, so the product collapses to 0 only when the re-consumed
      # anchor restores the window ratio exactly. A non-zero difference makes
      # the product non-zero no matter what the companion factor is.
      SHARED_POOL_REVERSAL_CENTS = xor(abs(ratio_before_anchor - ratio_after_void), 0)

      # Reported alongside: the archived-count snapshot comparison used by
      # the reason-code restore ledger.
      archived_snapshot_delta = current_fee_accruing_score_count - code.archived_consumed_entitlement_snapshot
    constants:
      SHARED_POOL: 0
      MILLI: 1000
      MIXTURE_SCALE: 1000000
    precision: "integer cents for FEE_LEDGER_REVERSAL_CENTS and SHARED_POOL_REVERSAL_CENTS; integer counts for archived_snapshot_delta"
    variants:
      - name: exact_invariant
        when: "a void reverses one posting on a license whose fee ledger records a MARGINAL_PRICING entry for that posting"
        difference: "the product collapses to 0 because P - B is cancelled exactly; the marginal schedule's tier arithmetic is irrelevant to the cancellation"
      - name: tolerant_invariant
        when: "a migration-event void re-consumes a credited basis-point delta"
        difference: "the ratio is a rounded integer, so the invariant is stated as a product-with-xor rather than a difference"

  - name: model_cascade_depth
    trigger: "POST /score-models (create) and POST /score-models/{modelId}/release"
    algorithm: topological
    input_set: "the predecessor chain reachable from predecessor_model_id within the same family_code"
    formula: |
      depth(node) = 0 if node.predecessor_model_id is null
                    else 1 + depth(predecessor)
      # A chain that re-enters a node already on the current path is rejected
      # at creation with ERR_INVALID_REQUEST; the scaffold never stores a cycle.
    precision: "integer"
    variants:
      - name: root
        when: "predecessor_model_id is null"
        difference: "depth is 0 and active_variant_count is recomputed from the model's own variants only"
      - name: successor
        when: "predecessor_model_id is non-null"
        difference: "depth is one greater than the predecessor's, and releasing the version supersedes every model that names it as predecessor"

  - name: disparate_impact_ratio
    trigger: "POST /validation-studies/{studyId}/run with study_path PROTECTED_CLASS"
    algorithm: aggregation
    input_set: "the approvals across the study's captured postings; a posting is a positive outcome when decision == APPROVE and a negative outcome when decision == DECLINE; postings still at decision UNDECIDED are excluded from BOTH the numerator and the denominator"
    formula: |
      rate(group) = approve_count(group) / (approve_count(group) + decline_count(group))
      p25 = rate(is_protected_class == true)
      p75 = rate(is_protected_class == false)
      disparate_impact_ratio_ppm = round_half_up((p25 / p75) * 1000000, 0)
      # A group with zero decided postings contributes rate 0; if p75 is 0 the
      # ratio is 0 and the study stores 0 rather than a divide-by-zero.
    constants:
      PPM_SCALE: 1000000
      THRESHOLD_PPM: 800000
    precision: "whole parts-per-million, round_half_up"
    variants:
      - name: ratio_only
        when: "both groups carry at least one decided posting"
        difference: "reports the ratio; values below THRESHOLD_PPM flag the study for a fair-lending review but do not by themselves block acknowledgement"
      - name: undecided_excluded
        when: "one group's postings are all still UNDECIDED"
        difference: "the undecided postings leave both the numerator and the denominator, so the ratio reflects only decided outcomes"

  # ===========================================================================
  # Table 4: Validation Rules Table (§1.4) — ordered by priority
  # ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "role-identity binding: when the acting role is entity_backed, X-User-ID must equal the id of an existing instance of the backing entity; for ScoreConsumer the backing entity is the License that will cover the write"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every resource id on the path resolves, validated left to right; the entity-specific not-found error is raised"
    error_id: "ERR_BUREAU_NOT_FOUND / ERR_SCORE_MODEL_NOT_FOUND / ERR_SCORE_VARIANT_NOT_FOUND / ERR_CONSUMER_NOT_FOUND / ERR_ARCHIVE_SAMPLE_NOT_FOUND / ERR_VALIDATION_STUDY_NOT_FOUND / ERR_REFERENCE_SET_NOT_FOUND / ERR_SCORE_RESULT_NOT_FOUND / ERR_REASON_CODE_NOT_FOUND / ERR_LICENSE_NOT_FOUND / ERR_MODEL_DOCUMENTATION_NOT_FOUND / ERR_MIGRATION_EVENT_NOT_FOUND / ERR_DISCOVERY_REQUEST_NOT_FOUND / ERR_FEE_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing instance"
    error_id: "ERR_SCORE_MODEL_NOT_FOUND / ERR_SCORE_VARIANT_NOT_FOUND / ERR_CONSUMER_NOT_FOUND / ERR_ARCHIVE_SAMPLE_NOT_FOUND / ERR_REFERENCE_SET_NOT_FOUND / ERR_BUREAU_NOT_FOUND / ERR_LICENSE_NOT_FOUND / ERR_REASON_CODE_NOT_FOUND / ERR_VALIDATION_STUDY_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints"

  - priority: 6
    category: state
    check: "the target resource must occupy the state named by the transition's from: clause, and the transition must exist on that entity"
    error_id: ERR_INVALID_STATE_MACHINE_EDGE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "a posting, an activation or a reactivation against a SUPERSEDED or RETIRED model version is refused, and creating a license on a DEPRECATED model version is refused"
    error_id: "ERR_MODEL_SUPERSEDED / ERR_MODEL_RETIRED / ERR_MODEL_DEPRECATED"
    http_status: 409
    applies_to: "POST /licenses, POST /licenses/{licenseId}/activate, POST /licenses/{licenseId}/reactivate, POST /score-results"

  - priority: 8
    category: business_temporal
    check: "a discovery tag, when supplied on a posting, must match a ScoreDiscoveryRequest whose status is REGISTERED, and the tag must be unique among REGISTERED requests"
    error_id: "ERR_DISCOVERY_TAG_UNKNOWN / ERR_DUPLICATE_DISCOVERY_TAG"
    http_status: "404 / 409"
    applies_to: "POST /score-results, POST /score-discovery-requests"

  - priority: 9
    category: business_referential
    check: "the named license's score_variant_id must equal the posting's score_variant_id; the named license's id must equal the acting ScoreConsumer's X-User-ID; the named archive sample must belong to the study's model; the named reference set must belong to the posting's consumer"
    error_id: "ERR_LICENSE_VARIANT_MISMATCH / ERR_LICENSE_NOT_OWNED / ERR_SAMPLE_MODEL_MISMATCH / ERR_REFERENCE_SET_CONSUMER_MISMATCH"
    http_status: "409 / 403 / 409 / 409"
    applies_to: "POST /score-results, POST /validation-studies, POST /reference-sets/{referenceSetId}/attach-reason-code"

  - priority: 10
    category: business_safety
    check: "no scoring posting or reference-set binding under a RETIRED model version"
    error_id: ERR_MODEL_RETIRED
    http_status: 409
    applies_to: "POST /score-results"

  - priority: 11
    category: business_referential
    check: "an attached or authored reason code must belong to the same variant catalogue as the reference set or feature it maps"
    error_id: ERR_REASON_CODE_VARIANT_MISMATCH
    http_status: 409
    applies_to: "POST /reference-sets/{referenceSetId}/attach-reason-code, POST /reason-codes"

  - priority: 12
    category: business_constraint
    check: "uniqueness: bureau_code; consumer_ref; (family_code, version_label); (score_model_id, industry); (tag, status REGISTERED); (score_variant_id, code_label); (score_variant_id, composite_code) among non-ARCHIVED codes"
    error_id: "ERR_DUPLICATE_BUREAU_CODE / ERR_DUPLICATE_CONSUMER_REF / ERR_DUPLICATE_VERSION_LABEL / ERR_DUPLICATE_VARIANT_INDUSTRY / ERR_DUPLICATE_DISCOVERY_TAG / ERR_DUPLICATE_CODE_LABEL / ERR_COMPOSITE_CODE_DUPLICATE"
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 13
    category: business_temporal
    check: "archive-sample windows overlap the containment-tolerant way (a window fully contained in another is allowed); license terms overlap the half-open way (adjacency is allowed, any positive overlap is not)"
    error_id: "ERR_SAMPLE_WINDOW_OVERLAP / ERR_LICENSE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /archive-samples, POST /licenses"

  - priority: 14
    category: business_constraint
    check: "magnitude and format bounds: 300 <= raw_posted_score <= 850; 18 <= age_years <= 120; record_count >= 1; observation_window_months >= 6; double_odds_points >= 1; 0 < weight_pct <= 1; 0 <= rounding_penalty_pct <= 0.05"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "creation endpoints"

  - priority: 15
    category: business_fiscal
    check: "an attach must not carry a reason code's bind_count to 2 or more. Crossing entitled_count is NOT rejected here: it is a soft trigger that adds the fixed overage surcharge to the marginal fee and drives the license ACTIVE → SUSPENDED as a side effect of the same posting"
    error_id: ERR_REASON_CODE_REUSE_LIMIT
    http_status: 409
    applies_to: "POST /reference-sets/{referenceSetId}/attach-reason-code"

  - priority: 16
    category: business_constraint
    check: "segregation of duties: ValidationStudy.finalized_by must differ from ValidationStudy.performed_by at acknowledgement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /validation-studies/{studyId}/acknowledge"

  - priority: 17
    category: business_constraint
    check: "documentation gates: a FILED or SUPPLEMENTED MODEL_RISK_REPORT is required to release or reopen a version; a FILED or SUPPLEMENTED document whose required_version_label equals the licensed model's version_label is required to terminate a license; every composite code in required_reason_codes must appear on a non-VOIDED posting before acknowledgement"
    error_id: "ERR_MODEL_DOC_REQUIRED / ERR_LICENSE_DOC_MISSING / ERR_REASON_CODE_VIOLATION"
    http_status: 409
    applies_to: "POST /score-models/{modelId}/release, POST /score-models/{modelId}/reopen, POST /licenses/{licenseId}/terminate, POST /validation-studies/{studyId}/acknowledge"

  - priority: 18
    category: business_constraint
    check: "dependent-write eligibility: no ACTIVE license may sit on a variant of a model being deprecated; no reference set outside RECONCILED may point at a model being retired; no ACTIVE child node may sit under a reason code being archived; a reference set may only reconcile against an ARCHIVED reason code; a model may only be released with a RELEASED variant"
    error_id: "ERR_DEPRECATION_BLOCKED / ERR_RETIREMENT_BLOCKED / ERR_REASON_CODE_ARCHIVED / ERR_REASON_CODE_ACTIVE / ERR_NO_RELEASED_VARIANT"
    http_status: 409
    applies_to: "POST /score-models/{modelId}/deprecate, POST /score-models/{modelId}/retire, POST /reason-codes/{reasonCodeId}/archive, POST /reference-sets/{referenceSetId}/reconcile, POST /score-models/{modelId}/release"

  - priority: 19
    category: business_constraint
    check: "metric eligibility: the study's sample must carry at least the model's min_input_count records; a CROSS_BUREAU study requires a VALIDATION-kind sample; a PROTECTED_CLASS study requires at least one ACTIVE reason code on the model"
    error_id: "ERR_SAMPLE_TOO_SMALL / ERR_SAMPLE_KIND_MISMATCH / ERR_REASON_CODE_MISSING"
    http_status: 409
    applies_to: "POST /validation-studies/{studyId}/run"

  - priority: 20
    category: business_constraint
    check: "optimistic concurrency: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT, PATCH, and every endpoint whose input carries an expected_*_version field"

  - priority: 21
    category: business_constraint
    check: "study acknowledgement is permitted only while the study is unfinalized; compensation is permitted only after acknowledgement"
    error_id: "ERR_STUDY_ALREADY_FINALIZED / ERR_STUDY_NOT_FINALIZED"
    http_status: 409
    applies_to: "POST /validation-studies/{studyId}/revert, POST /validation-studies/{studyId}/compensate"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, resolved by OCC on the parent
# =============================================================================
concurrency_rules:
  - rule_id: score-post-stale-license
    parent_entity: License
    write_endpoint: "POST /score-results"
    occ_field: "expected_license_version"
    description: |
      Posting a score against a License whose version has advanced since the
      client last read it is rejected. A settlement appends a fee-ledger entry
      and advances the license's cumulative counters, so a client holding an
      older view of the license is writing against stale entitlement data.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: score-void-stale-license
    parent_entity: License
    write_endpoint: "POST /score-results/{scoreResultId}/void"
    occ_field: "expected_license_version"
    description: |
      Voiding a score against a License whose version has advanced since the
      client last read it is rejected. The reversal is priced from the posting's
      captured cumulative_count_before, and the license may have settled
      further postings since that read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-activate-stale-license
    parent_entity: License
    write_endpoint: "POST /licenses/{licenseId}/activate"
    occ_field: "expected_license_version"
    description: |
      Activating a License whose version has advanced since the client last read
      it is rejected; the caller's view of the license no longer reflects the
      terms it is activating.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-suspend-stale-license
    parent_entity: License
    write_endpoint: "POST /licenses/{licenseId}/suspend"
    occ_field: "expected_license_version"
    description: |
      Suspending a License whose version has advanced since the client last read
      it is rejected; the entitlement comparison is made against a version the
      caller no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-reactivate-stale-license
    parent_entity: License
    write_endpoint: "POST /licenses/{licenseId}/reactivate"
    occ_field: "expected_license_version"
    description: |
      Reactivating a License whose version has advanced since the client last
      read it is rejected; the version-state gate must be evaluated against the
      license as it now stands.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-terminate-stale-license
    parent_entity: License
    write_endpoint: "POST /licenses/{licenseId}/terminate"
    occ_field: "expected_license_version"
    description: |
      Terminating a License whose version has advanced since the client last read
      it is rejected; the entitlement snapshot written at termination must be
      taken from the version the caller observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: model-release-stale-model
    parent_entity: ScoreModel
    write_endpoint: "POST /score-models/{modelId}/release"
    occ_field: "expected_model_version"
    description: |
      Releasing a version whose record has advanced since the client last read it
      is rejected; the release cascade re-derives variant counters, so a stale
      view would supersede a predecessor the caller has not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: model-deprecate-stale-model
    parent_entity: ScoreModel
    write_endpoint: "POST /score-models/{modelId}/deprecate"
    occ_field: "expected_model_version"
    description: |
      Deprecating a version whose record has advanced since the client last read
      it is rejected; the ACTIVE-license gate must be evaluated against the
      current variant set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: model-reopen-stale-model
    parent_entity: ScoreModel
    write_endpoint: "POST /score-models/{modelId}/reopen"
    occ_field: "expected_model_version"
    description: |
      Reopening a deprecated version whose record has advanced since the client
      last read it is rejected; the documentation gate is evaluated against the
      current document set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: model-retire-stale-model
    parent_entity: ScoreModel
    write_endpoint: "POST /score-models/{modelId}/retire"
    occ_field: "expected_model_version"
    description: |
      Retiring a version whose record has advanced since the client last read it
      is rejected; the reference-set drain gate must be evaluated against the
      current set of live reference sets.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: documentation-file-stale-documentation
    parent_entity: ModelDocumentation
    write_endpoint: "POST /model-documentation/{documentationId}/file"
    occ_field: "expected_documentation_version"
    description: |
      Filing a regulatory document whose record has advanced since the client
      last read it is rejected; the checksum the caller reviewed is no longer the
      checksum the document carries.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:

  # --- Bureau ---------------------------------------------------------------
  - method: POST
    path: "/bureaus"
    description: "Register one of the three national bureaus"
    roles: [BureauAdministrator]
    code: 201
    input:
      - bureau_code
      - display_name
      - is_active?
    output: Bureau
    side_effects: ["status-free configuration row; bureau_code immutable after creation"]

  - method: GET
    path: "/bureaus/{bureauId}"
    description: "Get a bureau"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input: []
    output: Bureau
    side_effects: []

  - method: GET
    path: "/bureaus"
    description: "List bureaus with pagination and filtering"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input:
      - "bureau_code?"
      - "is_active?"
      - "limit?"
      - "offset?"
    output: Bureau[]
    side_effects: []

  # --- ScoreModel -----------------------------------------------------------
  - method: POST
    path: "/score-models"
    description: "Create a score model version in DEVELOPMENT; rejects a predecessor chain that re-enters a version"
    roles: [ModelDeveloper]
    code: 201
    input:
      - family_code
      - version_label
      - predecessor_model_id?
      - min_input_count
      - score_floor?
      - score_ceiling?
    output: ScoreModel
    side_effects: ["status=DEVELOPMENT", "cascade_depth and active_variant_count are computed"]

  - method: GET
    path: "/score-models/{modelId}"
    description: "Get a score model version"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input: []
    output: ScoreModel
    side_effects: []

  - method: GET
    path: "/score-models"
    description: "List model versions, filterable by family, status and predecessor"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input:
      - "family_code?"
      - "status?"
      - "predecessor_model_id?"
      - "limit?"
      - "offset?"
    output: ScoreModel[]
    side_effects: []

  - method: POST
    path: "/score-models/{modelId}/variants"
    description: "Author an industry score variant under a version"
    roles: [ModelDeveloper]
    code: 201
    input: [industry, ref_score, base_odds, double_odds_points, segment_width, segment_offsets, rounding_penalty_pct, aggregate_weight_pct, elongation_points, cutoff_baseline]
    output: ScoreVariant
    side_effects: ["status=DRAFT", "recompute ScoreModel.active_variant_count"]

  - method: POST
    path: "/score-models/{modelId}/release"
    description: "Release a version; supersedes its designated predecessor and cascades C7"
    roles: [ModelDeveloper]
    code: 200
    input: [expected_model_version]
    output: ScoreModel
    side_effects:
      - "status → RELEASED, released_at stamped"
      - "hop 1 of C7: designated predecessor and its successors → SUPERSEDED"
      - "hop 2 of C7: licenses on superseded variants → SUSPENDED"
      - "hop 3 of C7: reference sets on superseded versions → RECONCILED"
      - "increments ScoreModel.version by 1"

  - method: POST
    path: "/score-models/{modelId}/deprecate"
    description: "Deprecate a released version so no new licenses attach"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_model_version]
    output: ScoreModel
    side_effects: ["status → DEPRECATED", "increments ScoreModel.version by 1"]

  - method: POST
    path: "/score-models/{modelId}/reopen"
    description: "Reverse a deprecation and return blocked studies to SCHEDULED"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_model_version]
    output: ScoreModel
    side_effects:
      - "status → RELEASED, released_at refreshed"
      - "ValidationStudy on this model in status BLOCKED → SCHEDULED"
      - "increments ScoreModel.version by 1"

  - method: POST
    path: "/score-models/{modelId}/retire"
    description: "Retire a deprecated version after every reference set drains"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_model_version]
    output: ScoreModel
    side_effects: ["status → RETIRED, retired_at stamped", "increments ScoreModel.version by 1"]

  # --- ScoreVariant ---------------------------------------------------------
  - method: GET
    path: "/score-variants/{scoreVariantId}"
    description: "Get an industry score variant"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input: []
    output: ScoreVariant
    side_effects: []

  - method: GET
    path: "/score-variants"
    description: "List variants, filterable by model, industry and status"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input:
      - "score_model_id?"
      - "industry?"
      - "status?"
      - "limit?"
      - "offset?"
    output: ScoreVariant[]
    side_effects: []

  - method: POST
    path: "/score-variants/{scoreVariantId}/release"
    description: "Release a draft variant"
    roles: [ModelDeveloper]
    code: 200
    input: []
    output: ScoreVariant
    side_effects: ["status → RELEASED", "recompute ScoreModel.active_variant_count"]

  - method: POST
    path: "/score-variants/{scoreVariantId}/recall"
    description: "Recall a released variant; when the parent model's last active variant is recalled its scheduled studies block"
    roles: [ModelDeveloper]
    code: 200
    input: []
    output: ScoreVariant
    side_effects:
      - "status RELEASED → RECALLED"
      - "recompute ScoreModel.active_variant_count"
      - "when the parent model's active_variant_count reaches 0, every ValidationStudy on that model in status SCHEDULED → BLOCKED"

  # --- Consumer -------------------------------------------------------------
  - method: POST
    path: "/consumers"
    description: "Register a pseudonymous archive consumer"
    roles: [ModelDeveloper, ValidationAnalyst, FairLendingOfficer, ReasonCodeAdministrator]
    code: 201
    input:
      - consumer_ref
      - age_years
      - is_protected_class?
    output: Consumer
    side_effects: ["model_undecided_count starts at 0"]

  - method: GET
    path: "/consumers/{consumerId}"
    description: "Get a consumer"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  - method: GET
    path: "/consumers"
    description: "List consumers with pagination and filtering"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ReasonCodeAdministrator, ScoreConsumer]
    code: 200
    input:
      - "consumer_ref?"
      - "is_protected_class?"
      - "limit?"
      - "offset?"
    output: Consumer[]
    side_effects: []

  # --- ArchiveSample --------------------------------------------------------
  - method: POST
    path: "/archive-samples"
    description: "Draw an archive sample for a model version"
    roles: [ModelDeveloper, ValidationAnalyst]
    code: 201
    input: [score_model_id, sample_ref, record_count, segment_name, sample_kind, observation_window_months, window_start_month, window_end_month]
    output: ArchiveSample
    side_effects: ["record_count validated against the model's min_input_count at study run time"]

  - method: GET
    path: "/archive-samples/{archiveSampleId}"
    description: "Get an archive sample"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer]
    code: 200
    input: []
    output: ArchiveSample
    side_effects: []

  - method: GET
    path: "/archive-samples"
    description: "List archive samples, filterable by model"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer]
    code: 200
    input:
      - "score_model_id?"
      - "sample_kind?"
      - "limit?"
      - "offset?"
    output: ArchiveSample[]
    side_effects: []

  # --- ValidationStudy ------------------------------------------------------
  - method: POST
    path: "/validation-studies"
    description: "Schedule a validation or disparate-impact study"
    roles: [ValidationAnalyst]
    code: 201
    input: [score_model_id, sample_id, study_path, performed_by]
    output: ValidationStudy
    side_effects:
      - "status=SCHEDULED"
      - "touched_model_ids is seeded with the model's id"
      - "required_reason_codes is derived from study_path"

  - method: GET
    path: "/validation-studies/{studyId}"
    description: "Get a validation study"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer]
    code: 200
    input: []
    output: ValidationStudy
    side_effects: []

  - method: GET
    path: "/validation-studies"
    description: "List studies, filterable by model, sample and model document"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer]
    code: 200
    input:
      - "score_model_id?"
      - "sample_id?"
      - "model_doc_id?"
      - "study_path?"
      - "status?"
      - "limit?"
      - "offset?"
    output: ValidationStudy[]
    side_effects: []

  - method: POST
    path: "/validation-studies/{studyId}/run"
    description: "Run the study; recomputes distribution shift and cascades C8"
    roles: [ValidationAnalyst]
    code: 200
    input: [expected_study_version]
    output: "{ study_id: string, status: string, disparate_impact_ratio_ppm: integer, reconciliation_variance: number, weighted_composite: number, unweighted_composite: number }"
    side_effects:
      - "status → VALIDATION_COMPLETE"
      - "disparate_impact_ratio_ppm or reconciliation_variance is computed"
      - "hop 1 of C8: distribution_shift_points recomputed for each model in touched_model_ids order"
      - "hop 2 of C8: a DRAFT MODEL_RISK_REPORT is created when none exists, model_doc_id bound, model → DEPRECATED when RELEASED"
      - "increments ValidationStudy.version by 1"

  - method: POST
    path: "/validation-studies/{studyId}/acknowledge"
    description: "Acknowledge a completed study under segregation of duties"
    roles: [FairLendingOfficer]
    code: 200
    input: [finalized_by, evidence_ref, expected_study_version]
    output: ValidationStudy
    side_effects:
      - "finalized_by and evidence_ref recorded"
      - "hop 3 of C8: FAIR_LENDING_REPORT for the same required_version_label → SUPPLEMENTED with checksum recomputed"
      - "increments ValidationStudy.version by 1"

  - method: POST
    path: "/validation-studies/{studyId}/revert"
    description: "Revert a completed study so it can be re-run; replays cascade C9"
    roles: [ValidationAnalyst]
    code: 200
    input: [expected_study_version]
    output: ValidationStudy
    side_effects:
      - "status → SCHEDULED; disparate_impact_ratio_ppm and reconciliation_variance cleared"
      - "hop 1 of C9: distribution_shift_points re-derived in touched_model_ids order"
      - "hop 2 of C9: attestating model documents → SUPPLEMENTED with checksum recomputed"
      - "increments ValidationStudy.version by 1"

  - method: POST
    path: "/validation-studies/{studyId}/compensate"
    description: "Compensate an acknowledged study, conserving the scoring ledger"
    roles: [FairLendingOfficer]
    code: 200
    input: [expected_study_version]
    output: ValidationStudy
    side_effects:
      - "status → COMPENSATED; disparate_impact_ratio_ppm and reconciliation_variance cleared"
      - "effective_score, odds_at_posted_score and decision of every posting under the study's model are left unchanged"
      - "increments ValidationStudy.version by 1"

  # --- ReferenceSet ---------------------------------------------------------
  - method: POST
    path: "/reference-sets"
    description: "Compile a reference set for a consumer against a model version; an optional posted score is re-anchored to it"
    roles: [FairLendingOfficer]
    code: 201
