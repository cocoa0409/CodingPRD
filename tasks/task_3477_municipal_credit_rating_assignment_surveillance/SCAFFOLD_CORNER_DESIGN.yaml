# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3477_municipal_credit_rating_assignment_surveillance
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Corners already exercised by §1.8 appear as excluded_because stubs.
# Anchors (&c_default, &mk_issuer, ...) are local to THIS document.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: issuer_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Issuer
          - endpoints.POST_/muni/issuers
        distinguishing_aspect: "A minimally-specified issuer POST returns 201 with system-minted id/created_at/updated_at, version 1, and computed defaults credit_balance_cents 0 and delinquent_flag false — none of them client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_default
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &mk_issuer
              call: "POST /muni/issuers"
              payload: { legal_name: "City of Example", state_code: "CA", issuer_type: "GENERAL_GOVERNMENT", fiscal_year_end: "06-30", population: 500000 }
              as: PlatformAdmin
              captures: { iss: $.data.id, iss_v: $.data.version }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "Issuer.${iss}.legal_name == \"City of Example\" and state_code == \"CA\" and fiscal_year_end == \"06-30\""
            - "Issuer.${iss}.version == 1 and credit_balance_cents == 0 and delinquent_flag == false"
            - "id, created_at, updated_at are non-null; created_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"

      - name: underwriter_create_then_get_round_trips
        claim_type: Retrieval
        grounds:
          - entities.Underwriter
          - endpoints.GET_/muni/underwriters/{id}
        distinguishing_aspect: "Every underwriter field round-trips through GET exactly as posted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One underwriter registered."
          setup_api_calls:
            - *c_default
            - &mk_uw
              call: "POST /muni/underwriters"
              payload: { firm_name: "Meridian Capital Markets", license_number: "MW-4481" }
              as: PlatformAdmin
              captures: { uw: $.data.id }
          trigger:
            - call: "GET /muni/underwriters/${uw}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw}"
              captures: { uw_name: $.data.firm_name, uw_lic: $.data.license_number }
          assert:
            - "response status 200; firm_name == \"Meridian Capital Markets\" and license_number == \"MW-4481\""
            - "version == 1; created_at == 2026-09-01T00:00:00Z"

      - name: engagements_list_filters_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/muni/engagements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two engagements on issuer A and one on issuer B, issuer_id=${iss} with limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuers A and B; three SOLICITED GO engagements (two on A, one on B), all still REQUESTED."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - &mk_issuer_b
              call: "POST /muni/issuers"
              payload: { legal_name: "County of Example", state_code: "CA", issuer_type: "GENERAL_GOVERNMENT", fiscal_year_end: "06-30", population: 120000 }
              as: PlatformAdmin
              captures: { iss_b: $.data.id }
            - &mk_eng_go
              call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_go: $.data.id }
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss_b}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss_b}"
          trigger:
            - call: "GET /muni/engagements"
              payload: { issuer_id: "${iss}", limit: 1, offset: 0 }
              as: PlatformAdmin
            - call: "GET /muni/engagements"
              payload: { issuer_id: "${iss}", limit: 1, offset: 1 }
              as: PlatformAdmin
          assert:
            - "first page: 1 row, total_count == 2, has_more == true"
            - "second page: 1 row, total_count == 2, has_more == false"
            - "both pages' rows carry issuer_id == ${iss} (filter excludes issuer B's engagement)"

      - name: issuer_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ISSUER_NOT_FOUND]
          - endpoints.GET_/muni/issuers/{id}
        distinguishing_aspect: "GET with a well-formed but unknown issuer UUID returns 404 ERR_ISSUER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_default
          trigger:
            - call: "GET /muni/issuers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "response status 404 and error_id == ERR_ISSUER_NOT_FOUND"
            - "error envelope carries meta block and response_type == error"

      - name: engagement_create_missing_credit_type_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/muni/engagements
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field credit_type from engagement creation is rejected 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer."
          setup_api_calls:
            - *c_default
            - *mk_issuer
          trigger:
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { req_err: "$.data.error_id" }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /muni/engagements?issuer_id=${iss} returns total_count 0"

      - name: unsolicited_engagement_fee_waived_and_initial_state
        claim_type: Defaults
        grounds:
          - entities.RatingEngagement.fields.fee_cents
          - state_machines.RatingEngagement
          - calculations.engagement_fee_and_refund
        distinguishing_aspect: "An UNSOLICITED engagement created by a LeadAnalyst starts directly in INFORMATION_GATHERING (not REQUESTED) with fee_cents 0, fee_paid true, and required_document_codes == [PUBLIC_FILING_FY] — the unsolicited path skips engagement terms."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One issuer."
          setup_api_calls:
            - *c_default
            - *mk_issuer
          trigger:
            - &mk_eng_unsol
              call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "UNSOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: LeadAnalyst
              as_user_id: "analyst-9"
              captures: { eng_u: $.data.id, eng_u_status: $.data.status, eng_u_fee: $.data.fee_cents, eng_u_paid: $.data.fee_paid }
          assert:
            - "status == INFORMATION_GATHERING (no accept-terms step on the unsolicited path)"
            - "fee_cents == 0 and fee_paid == true (agency-initiated, fee waived)"
            - "required_document_codes == [\"PUBLIC_FILING_FY\"] regardless of credit_type"

      - name: scorecard_weighted_score_and_indicative_notch_server_computed
        claim_type: Computed Fields
        grounds:
          - entities.AnalyticalScorecard.fields.weighted_score
          - calculations.weighted_scorecard
        distinguishing_aspect: "weighted_score, anchor_notch, capped, and indicative_notch are computed server-side: perfect scores (5,5,5,5,5,5) under GO weights yield exactly 5.0000 -> AAA with capped false."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at ANALYSIS (fee accepted, 4 documents received)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - &mk_cv_go
              call: "POST /muni/criteria-versions"
              payload: { jurisdiction_code: "US-CA", credit_type: "GENERAL_OBLIGATION", version_label: "GO-2026.1", w_economy: 0.20, w_management: 0.20, w_budgetary_performance: 0.20, w_flexibility: 0.15, w_liquidity: 0.10, w_debt_profile: 0.15 }
              as: SurveillanceOfficer
              captures: { cv_go: $.data.id }
            - &act_cv_go
              call: "POST /muni/criteria-versions/${cv_go}/activate"
              payload: {}
              as: SurveillanceOfficer
            - *mk_eng_go
            - &accept_go
              call: "POST /muni/engagements/${eng_go}/accept-terms"
              payload: { fee_payment_cents: 4500000, apply_credit_cents: 0 }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_audit
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_budget
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "ADOPTED_BUDGET" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_tax
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "TAX_BASE_REPORT" }
              as: Issuer
              as_user_id: "${iss}"
            - &doc_debt
              call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "DEBT_STATEMENT" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_go_v: $.data.version }
          trigger:
            - call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 5, score_management: 5, score_budgetary_performance: 5, score_flexibility: 5, score_liquidity: 5, score_debt_profile: 5, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { sc_ws: $.data.weighted_score, sc_anchor: $.data.anchor_notch, sc_cap: $.data.capped, sc_ind: $.data.indicative_notch, sc_cv: $.data.criteria_version_id }
          assert:
            - "weighted_score == 5.0 and anchor_notch == AAA and capped == false and indicative_notch == AAA"
            - "criteria_version_id == ${cv_go} (the ACTIVE version's weights were applied)"
            - "engagement status == COMMITTEE_READY and assigned_analyst_id == \"analyst-1\""

      - name: committee_vote_immutable_common_fields_absent
        claim_type: Immutability
        grounds:
          - entities.CommitteeVote
          - endpoints.POST_/muni/committee-sessions/{id}/votes
        distinguishing_aspect: "CommitteeVote is declared common_fields: false — its creation response carries id and created_at but NO version and NO updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY (indicative A); session opened at 2026-09-02T10:30:00Z."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - &score_a
              call: "POST /muni/engagements/${eng_go}/scorecard"
              payload: { score_economy: 4, score_management: 4, score_budgetary_performance: 3, score_flexibility: 4, score_liquidity: 4, score_debt_profile: 2, expected_engagement_version: "${eng_go_v}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
            - &sched_std
              call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess: $.data.id }
            - &c_open
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:30:00Z" }
              as: PlatformAdmin
            - &open_std
              call: "POST /muni/committee-sessions/${sess}/open"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
          trigger:
            - call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-1"
              captures: { vote_id: $.data.id, vote_kind: $.data.kind }
          assert:
            - "response status 201; kind == VOTE and notch_vote == A"
            - "the vote object has id and created_at but no version field and no updated_at field (common_fields: false)"
            - "a second POST with the same voter_id is the only mutation path and is rejected (no PUT/PATCH/DELETE endpoint exists for votes)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: engagement_solicited_initial_state_requested
        claim_type: Initial State
        grounds:
          - state_machines.RatingEngagement
        distinguishing_aspect: "A SOLICITED GO engagement starts in REQUESTED (not ENGAGED) with fee_paid false, fee_cents 4500000, and the four GO required document codes — the solicited path's initial state complements the unsolicited INFORMATION_GATHERING start."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One issuer."
          setup_api_calls:
            - *c_default
            - *mk_issuer
          trigger:
            - call: "POST /muni/engagements"
              payload: { issuer_id: "${iss}", solicitation: "SOLICITED", credit_type: "GENERAL_OBLIGATION", jurisdiction_code: "US-CA" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { eng_s: $.data.id, eng_s_status: $.data.status, eng_s_fee: $.data.fee_cents }
          assert:
            - "status == REQUESTED and fee_paid == false and fee_cents == 4500000"
            - "required_document_codes == [\"AUDIT_FY\", \"ADOPTED_BUDGET\", \"TAX_BASE_REPORT\", \"DEBT_STATEMENT\"] and received_document_codes == []"

      - name: documents_before_accept_terms_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RatingEngagement
          - errors[ERR_ENGAGEMENT_STATE_INVALID]
        distinguishing_aspect: "Posting a document while the engagement is still REQUESTED (terms not accepted) is rejected 409 ERR_ENGAGEMENT_STATE_INVALID; documents are only accepted from ENGAGED onward."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. SOLICITED GO engagement in REQUESTED."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_eng_go
          trigger:
            - call: "POST /muni/engagements/${eng_go}/documents"
              payload: { document_code: "AUDIT_FY" }
              as: Issuer
              as_user_id: "${iss}"
              captures: { doc_err: "$.data.error_id" }
          assert:
            - "response status 409 and error_id == ERR_ENGAGEMENT_STATE_INVALID"
            - "engagement remains REQUESTED with received_document_codes == []"

      - name: withdraw_after_rating_assigned_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RatingEngagement
          - errors[ERR_WITHDRAWAL_NOT_PERMITTED]
        distinguishing_aspect: "Withdrawal from RATING_ASSIGNED is rejected 409 ERR_WITHDRAWAL_NOT_PERMITTED — once the committee has assigned a rating, the pre-publication remedy is the appeal process, not withdrawal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement at RATING_ASSIGNED (committee completed 2026-09-02T10:30:00Z, outcome A)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - &votes_aab
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-1", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-1"
            - &vote_a2
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-2", notch_vote: "A" }
              as: CommitteeMember
              as_user_id: "voter-2"
            - &vote_bbb3
              call: "POST /muni/committee-sessions/${sess}/votes"
              payload: { voter_id: "voter-3", notch_vote: "BBB" }
              as: CommitteeMember
              as_user_id: "voter-3"
            - &close_std
              call: "POST /muni/committee-sessions/${sess}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
          trigger:
            - call: "POST /muni/engagements/${eng_go}/withdraw"
              payload: {}
              as: Issuer
              as_user_id: "${iss}"
              captures: { wd_err: "$.data.error_id" }
          assert:
            - "response status 409 and error_id == ERR_WITHDRAWAL_NOT_PERMITTED"
            - "engagement remains RATING_ASSIGNED and issuer credit_balance_cents stays 0 (no refund fired)"

      - name: withdraw_unsolicited_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RatingEngagement
          - errors[ERR_WITHDRAWAL_NOT_PERMITTED]
        distinguishing_aspect: "An UNSOLICITED engagement cannot be withdrawn by the issuer at all (the rating is the agency's initiative): withdraw from INFORMATION_GATHERING on an unsolicited engagement is rejected 409 ERR_WITHDRAWAL_NOT_PERMITTED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. UNSOLICITED GO engagement on the issuer, sitting in INFORMATION_GATHERING."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_eng_unsol
          trigger:
            - call: "POST /muni/engagements/${eng_u}/withdraw"
              payload: {}
              as: Issuer
              as_user_id: "${iss}"
              captures: { wd_err: "$.data.error_id" }
          assert:
            - "response status 409 and error_id == ERR_WITHDRAWAL_NOT_PERMITTED (solicitation gate, not a state gate)"
            - "engagement remains INFORMATION_GATHERING"

      - name: session_close_from_scheduled_adjourns_without_votes
        claim_type: Valid Transition
        grounds:
          - state_machines.CommitteeSession.SCHEDULED_to_ADJOURNED
        distinguishing_aspect: "Closing a session that was never opened is legal and lands in ADJOURNED with adjourn_reason QUORUM_NOT_MET (zero votes recorded) — the chair-cancel path."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY; session scheduled 2026-09-02T10:00-12:00Z, never opened."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
          trigger:
            - *close_std
            - call: "GET /muni/ratings"
              payload: { engagement_id: "${eng_go}" }
              as: CommitteeChair
              as_user_id: "chair-1"
          assert:
            - "session status == ADJOURNED and adjourn_reason == QUORUM_NOT_MET and outcome_notch is null"
            - "no Rating exists for the engagement (ratings list for ${eng_go} is empty)"
            - "engagement remains COMMITTEE_READY"

      - name: session_open_window_half_open_enforcement
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CommitteeSession.SCHEDULED_to_IN_SESSION
          - errors[ERR_SESSION_NOT_OPENABLE]
        distinguishing_aspect: "The open window [start_at, end_at) is half-open at second precision: open one second before start_at is rejected, and open exactly at end_at is rejected (clock >= end_at fails)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO engagement COMMITTEE_READY; session window [2026-09-02T10:00:00Z, 2026-09-02T10:01:00Z)."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - call: "POST /muni/engagements/${eng_go}/committee-sessions"
              payload: { start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T10:01:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { sess_tight: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:59:59Z" }
              as: PlatformAdmin
            - call: "POST /muni/committee-sessions/${sess_tight}/open"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { early_err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:01:00Z" }
              as: PlatformAdmin
            - call: "POST /muni/committee-sessions/${sess_tight}/open"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { late_err: "$.data.error_id" }
          assert:
            - "open at 09:59:59 (one second before start_at) -> 409 ERR_SESSION_NOT_OPENABLE"
            - "open at exactly 10:01:00 (== end_at) -> 409 ERR_SESSION_NOT_OPENABLE (end is exclusive)"
            - "session remains SCHEDULED after both rejections"

      - name: appeal_decide_twice_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Appeal
          - errors[ERR_APPEAL_STATE_INVALID]
        distinguishing_aspect: "A DENIED appeal is terminal: a second decide call is rejected 409 ERR_APPEAL_STATE_INVALID and the rating stays ASSIGNED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Rating ASSIGNED at 2026-09-02T10:30:00Z; appeal filed with new code PENSION_VALUATION, then DENIED."
          setup_api_calls:
            - *c_default
            - *mk_issuer
            - *mk_cv_go
            - *act_cv_go
            - *mk_eng_go
            - *accept_go
            - *doc_audit
            - *doc_budget
            - *doc_tax
            - *doc_debt
            - *score_a
            - *sched_std
            - *c_open
            - *open_std
            - *votes_aab
            - *vote_a2
            - *vote_bbb3
            - *close_std
            - &get_rating
              call: "GET /muni/ratings"
              payload: { engagement_id: "${eng_go}" }
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { rating_id: "$.data[0].id", rating_v: "$.data[0].version" }
