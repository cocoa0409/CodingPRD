  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: corner_layer_occ_offer_publish_stale_season_version
        claim_type: Stale expected_<parent>_version → rule's error_id (412); correct version → success; version increments on every write
        grounds:
          - concurrency_rules.offer-publish-stale-season
          - errors[ERR_STALE_SEASON_VERSION]
          - endpoints["POST /offers/{offer_id}/publish"]
        distinguishing_aspect: |
          Publishing with a season version captured before an intervening episode release returns
          ERR_STALE_SEASON_VERSION (412) and leaves the offer OFFLINE; re-reading the season and
          publishing with the fresh version returns 200 and bumps the season version once more.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE; Episode 1 SCHEDULED for 2026-08-02."
            - "Offer OCC_PACK (BUNDLE, list 900, declared 1200) is APPROVED and OFFLINE."
            - "The season version is captured before the episode release, which bumps it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
