              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Pediatrics POCT", department_code: "DEPT-170", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr Nils Haas", role_title: "PHYSICIAN", hire_date: "2026-01-15" }
              as: ProgramAdmin
              captures: { op_dir_id: $.data.id }
            - call: "POST /poct/operators/${op_dir_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_dir_id}" }
              as: ProgramAdmin
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "NationalPT" }
              as: QualityCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_id}", shipment_number: 1, due_date: "2026-08-10" }
              as: QualityCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /poct/pt-events/${ev_id}/score"
              payload: { score_pct: 60.00, graded_on: "2026-08-01" }
              as: QualityCoordinator
              captures: { first_status: $.data.status, first_outcome: $.data.outcome }
            - call: "POST /poct/pt-events/${ev_id}/investigation"
              payload: { root_cause: "Control material stored above 8 C", corrective_action: "Relocated controls to the monitored fridge" }
              as: QualityCoordinator
            - call: "POST /poct/pt-events/${ev_id}/investigation-decision"
              payload: { decision: "REJECT", note: "Root cause does not explain the analytic bias" }
              as: LabDirector
              as_user_id: "${op_dir_id}"
              captures: { cycle_status: $.data.status, cycle_round: $.data.investigation_round }
            - call: "POST /poct/pt-events/${ev_id}/investigation"
