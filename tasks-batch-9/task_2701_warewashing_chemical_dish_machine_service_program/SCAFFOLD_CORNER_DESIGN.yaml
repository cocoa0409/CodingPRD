              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-C01", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Rico Vance", region_code: "NW", certification_level: "L2" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warewashing/service-tickets"
              payload: { placement_id: "${pl_id}", reported_symptom: "MACHINE_DOWN" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { tk_id: $.data.id, score: $.data.priority_score, deadline: $.data.response_deadline_at, tk_status: $.data.status }
            - call: "GET /warewashing/machine-placements/${pl_id}"
              payload: {}
              as: AccountManager
              captures: { health: $.data.operational_status, open_alerts: $.data.open_alert_count }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { posture: $.data.service_posture, open_tk: $.data.open_ticket_count }
            - call: "GET /warewashing/service-tickets/${tk_id}"
              payload: {}
              as: AccountManager
              captures: { score_read: $.data.priority_score, deadline_read: $.data.response_deadline_at }
          assert:
            - "${score} == 400 - base 400 for MACHINE_DOWN with the machine still UP at scoring time, no posture bonus yet"
            - "${deadline} == 2026-08-01T16:00:00Z - the 240-minute band for a score in [400, 700) measured from the clock"
            - "${tk_status} == QUEUED, ${open_alerts} == 0 and the site's ${open_tk} == 1 immediately"
            - "${health} == DOWN in the very next read - the health axis moved inside the ticket write"
            - "${posture} == ELEVATED in the very next read - the site aggregate is recomputed synchronously"
            - "${score_read} == ${score} and ${deadline_read} == ${deadline} - re-reading returns the same stamped values, never a recomputation"
