            - "error_id == ERR_STALE_VERSION, http 412"
            - "only one advance exists; outstanding_cushion_cents == 1000"

      - name: stale_member_version_on_evaluation_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[evaluation-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Member.version: a second BATCH evaluation carrying the pre-first-evaluation member version is rejected with ERR_STALE_VERSION because the first evaluation legitimately superseded the profile."
        test_recipe:
          setup: ["member c30 with 2 settled qualifying deposits; version v_pre read; first BATCH evaluation succeeds"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c30", full_name: "C Thirty", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c30: $.data.id, c30_v0: $.data.version }
            - call: "POST /banking/members/${c30}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c30a: $.data.id }
            - call: "POST /banking/accounts/${c30a}/deposits"
              payload: { originator_id: "EMPC30", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c30-t1" }
              as: SponsorBankOps
              captures: { c30d1: $.data.id }
            - call: "POST /banking/accounts/${c30a}/deposits"
              payload: { originator_id: "EMPC30", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c30-t2" }
              as: SponsorBankOps
              captures: { c30d2: $.data.id }
            - call: "POST /banking/deposits/${c30d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c30d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c30}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c30_v0}" }
              as: ProgramOps
          trigger:
            - call: "POST /banking/members/${c30}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c30_v0}" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION, http 412"
            - "exactly one BATCH profile is CURRENT for the member"

      - name: stale_run_version_on_resolve_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[run-resolve-stale-run]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ReconciliationRun.version: resolving twice — the second resolve carries the pre-resolution version and is rejected, preventing duplicate ADJUSTMENT entries."
        test_recipe:
          setup: ["member c31 with settled deposit 10000; DISCREPANCY run (bank_reported -9000); first resolve succeeds"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c31", full_name: "C ThirtyOne", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c31: $.data.id }
            - call: "POST /banking/members/${c31}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c31a: $.data.id }
            - call: "POST /banking/accounts/${c31a}/deposits"
              payload: { originator_id: "EMPC31", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c31-t1" }
              as: SponsorBankOps
              captures: { c31d1: $.data.id }
            - call: "POST /banking/deposits/${c31d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/reconciliation-runs"
              payload: { sponsor_bank_code: "SB-2", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", bank_reported_net_cents: -9000 }
              as: SponsorBankOps
              captures: { c31run: $.data.id, c31run_v: $.data.version }
            - call: "POST /banking/reconciliation-runs/${c31run}/resolve"
              payload: { expected_run_version: "${c31run_v}", resolution_note: "first resolution" }
              as: ProgramOps
          trigger:
            - call: "POST /banking/reconciliation-runs/${c31run}/resolve"
              payload: { expected_run_version: "${c31run_v}", resolution_note: "duplicate resolution" }
              as: ProgramOps
              captures: { err: $.data.error_id }
          assert:
            - "second resolve fails — with ERR_STALE_VERSION (412) if the OCC check precedes the state check, or ERR_INVALID_STATE (409) if the run is already RESOLVED; per §1.4 priority 6 (OCC) beats priority 7 (state), so error_id == ERR_STALE_VERSION"
            - "exactly one ADJUSTMENT LedgerEntry exists for the run"

      - name: idempotent_replay_returns_same_advance
        claim_type: idempotency
        grounds: ["validations[priority=5]"]
        distinguishing_aspect: "Replaying the same idempotency_key with the SAME payload returns the original advance (no new row, no version bump) — the positive half of the idempotency layer."
        test_recipe:
          setup: ["member c32 ELIGIBLE limit 2000; advance created with key c32-k1; account version re-read after creation"]
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "c32", full_name: "C ThirtyTwo", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { c32: $.data.id, c32_v0: $.data.version }
            - call: "POST /banking/members/${c32}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { c32a: $.data.id }
            - call: "POST /banking/accounts/${c32a}/deposits"
              payload: { originator_id: "EMPC32", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "c32-t1" }
              as: SponsorBankOps
              captures: { c32d1: $.data.id }
            - call: "POST /banking/accounts/${c32a}/deposits"
              payload: { originator_id: "EMPC32", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "c32-t2" }
              as: SponsorBankOps
              captures: { c32d2: $.data.id }
            - call: "POST /banking/deposits/${c32d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${c32d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${c32}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${c32_v0}" }
              as: ProgramOps
            - call: "GET /banking/accounts/${c32a}"
              payload: {}
              as: ProgramOps
              captures: { c32a_v1: $.data.version }
            - call: "POST /banking/accounts/${c32a}/advances"
              payload: { amount_cents: 700, idempotency_key: "c32-k1", expected_account_version: "${c32a_v1}" }
              as: Member
              as_user_id: "${c32}"
              captures: { c32adv: $.data.id }
            - call: "GET /banking/accounts/${c32a}"
              payload: {}
              as: ProgramOps
              captures: { c32a_v2: $.data.version }
          trigger:
            - call: "POST /banking/accounts/${c32a}/advances"
              payload: { amount_cents: 700, idempotency_key: "c32-k1", expected_account_version: "${c32a_v2}" }
              as: Member
              as_user_id: "${c32}"
              captures: { c32adv2: $.data.id }
          assert:
            - "the replay returns the SAME advance id (idempotent replay, not a new row)"
            - "exactly one advance exists; outstanding_cushion_cents == 700"

