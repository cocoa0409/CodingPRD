            - { call: "GET /pilot-training/qualifications/${q1}", payload: {}, as: CrewScheduler, captures: { q_os: $.data.operating_state } }
            - { call: "GET /pilot-training/training-events/${ev1}", payload: {}, as: TrainingCoordinator, captures: { ev_status: $.data.status } }
