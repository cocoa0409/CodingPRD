            - "InnovationProject.${cp_p_id}.recycle_count == 0, because clearing is not a recycle"
            - "BusinessCase.${cp_bc_id}.status == LOCKED, locked by the conditional close and not by the clear"
            - "GateReview.${cp_gr3_id}.status == IN_SESSION with deliverable_completeness_pct == 100.00"
            - "GateReview.${cp_gr3_id}.readiness_index == 55.00, being 0.30 * 100.00 plus 0.25 * 100.00 hurdle at CATEGORY_FACTOR SNACK 1.00"

