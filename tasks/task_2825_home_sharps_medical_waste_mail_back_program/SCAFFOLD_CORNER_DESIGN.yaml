          setup:
            - "Clock at 2026-08-01T00:00:00Z. CA rule caps containers at 7.6 L; TX rule caps them at 0.5 L (below the smallest catalogue size, 0.9 L)."
            - "Program NW-TIGHT: 500000-cent ceiling but only a 2000-cent per-kit allowance."
            - "Dana (CA, INSULIN_PEN_NEEDLES, 20/week, 30-day cadence) has required_units = ceil(20*1*30*115/700) = 99, so her candidate set is exactly {ONE_QUART (100 units, 0.9 L), TWO_GALLON (800 units, 7.6 L)}."
            - "Tom is identical except that he lives under the TX rule, so his candidate set is empty."
