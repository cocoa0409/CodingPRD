            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-05-01T13:00:00Z", shift_end: "2026-05-01T15:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/fleet-dispatches/${d1}/checkout", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T13:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/fleet-dispatches/${d2}/checkout", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FLEET_UNAVAILABLE with http 409"
            - "d2 remains BOOKED; d1 remains OVERDUE (12:00 passed while checked out)"

      - name: activate_with_insufficient_wallet_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_FUNDS]", "validations[priority=10]"]
        distinguishing_aspect: "Pure fiscal trigger: every other gate passes (DRAFT, PASSED inspection, ACTIVE insurance, ELIGIBLE, GOOD_STANDING) but wallet 18999 < 19000 -> ERR_INSUFFICIENT_FUNDS 402; one cent short fails."
