  # ---------------------------------------------------------------------------
  # section: errors — the catalog audit. Error ids already triggered by an
  # instance in an earlier section of THIS file are not re-instanced here:
  #   ERR_INVALID_REQUEST, ERR_TOPIC_NOT_FOUND, ERR_PLAN_ITEM_NOT_FOUND,
  #   ERR_PARENT_TOPIC_MISMATCH        -> section entities
  #   ERR_SIGNOFF_ALREADY_DECIDED, ERR_DOC_SET_NOT_DRAFT,
  #   ERR_TERM_ALREADY_RETIRED, ERR_DOC_SET_NOT_PUBLISHED,
  #   ERR_SUPPORT_END_DATE_NOT_REACHED -> section state_machines
  #   ERR_NOTICE_PERIOD_TOO_SHORT, ERR_LOCALIZATION_SLA_BREACH,
  #   ERR_FEEDBACK_TOPIC_NOT_PUBLISHED, ERR_EDITORIAL_SOD_VIOLATION,
  #   ERR_LOCALIZATION_BUDGET_EXCEEDED, ERR_DOC_FREEZE_POSTURE_BLOCKED
  #                                    -> section validations
  #   ERR_TRAIN_NOT_GA                 -> section endpoints
  #   ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROLE_IDENTITY_MISMATCH,
  #   ERR_SIGNOFF_NOT_OWNED            -> section rbac
  #   ERR_STALE_RELEASE_TRAIN_VERSION, ERR_STALE_DOC_SET_VERSION
  #                                    -> section cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: every_addressable_resource_reports_its_own_not_found_id
        claim_type: error_triggerable
        grounds: ["errors.ERR_RELEASE_TRAIN_NOT_FOUND", "errors.ERR_WRITER_NOT_FOUND", "errors.ERR_REVIEWER_NOT_FOUND", "errors.ERR_SIGNOFF_NOT_FOUND", "errors.ERR_DOC_SET_VERSION_NOT_FOUND", "errors.ERR_CHANGE_RECORD_NOT_FOUND", "errors.ERR_RELEASE_NOTE_NOT_FOUND", "errors.ERR_LOCALE_PROFILE_NOT_FOUND", "errors.ERR_LOCALIZATION_JOB_NOT_FOUND", "errors.ERR_TERM_NOT_FOUND", "errors.ERR_DEPRECATION_NOTICE_NOT_FOUND", "errors.ERR_PARENT_TOPIC_NOT_FOUND", "validations.priority_6"]
        distinguishing_aspect: "Each resource family must report its OWN not-found id rather than a shared generic one, and the parent-topic case must report ERR_PARENT_TOPIC_NOT_FOUND (not ERR_TOPIC_NOT_FOUND) even though the addressed topic in the path exists — the distinction is between the path resource and a body reference."
        test_recipe:
          setup:
            - "An empty database plus one train, one writer and one plan item assigned to that writer, so the POST /topics call fails only on its parent_topic_id."
            - "Every unknown id below is the literal UUID 3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f, which is never minted by any call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
            - call: "POST /writers"
              payload: { person_key: "w-anna", full_name: "Anna Reyes", seniority_tier: "SENIOR", capacity_points: 40.0 }
              as: DocsLead
              captures: { w_id: "$.data.id" }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "feature-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_id: "$.data.id" }
            - call: "POST /plan-items/${pi_id}/assign"
              payload: { writer_id: "${w_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-17" }
              as: DocsLead
          trigger:
            - call: "GET /release-trains/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_train: "$.data.error_id" }
            - call: "GET /writers/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_writer: "$.data.error_id" }
            - call: "GET /reviewers/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_reviewer: "$.data.error_id" }
            - call: "GET /sign-offs/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_signoff: "$.data.error_id" }
            - call: "GET /doc-set-versions/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_docset: "$.data.error_id" }
            - call: "GET /change-records/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_change: "$.data.error_id" }
            - call: "GET /release-notes/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_note: "$.data.error_id" }
            - call: "GET /locale-profiles/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_locale: "$.data.error_id" }
            - call: "GET /localization-jobs/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_job: "$.data.error_id" }
            - call: "GET /terminology-terms/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_term: "$.data.error_id" }
            - call: "GET /deprecation-notices/3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f"
              payload: {}
              as: DocsLead
              captures: { e_depr: "$.data.error_id" }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-orphan-child", title: "Child of nothing", parent_topic_id: "3f1c9d4e-0b2a-4c6d-8e7f-1a2b3c4d5e6f" }
              as: Writer
              as_user_id: "${w_id}"
              captures: { e_parent: "$.data.error_id" }
          assert:
            - "${e_train} == ERR_RELEASE_TRAIN_NOT_FOUND, ${e_writer} == ERR_WRITER_NOT_FOUND, ${e_reviewer} == ERR_REVIEWER_NOT_FOUND, ${e_signoff} == ERR_SIGNOFF_NOT_FOUND, each with HTTP 404"
            - "${e_docset} == ERR_DOC_SET_VERSION_NOT_FOUND, ${e_change} == ERR_CHANGE_RECORD_NOT_FOUND, ${e_note} == ERR_RELEASE_NOTE_NOT_FOUND, each with HTTP 404"
            - "${e_locale} == ERR_LOCALE_PROFILE_NOT_FOUND, ${e_job} == ERR_LOCALIZATION_JOB_NOT_FOUND, ${e_term} == ERR_TERM_NOT_FOUND, ${e_depr} == ERR_DEPRECATION_NOTICE_NOT_FOUND, each with HTTP 404"
            - "${e_parent} == ERR_PARENT_TOPIC_NOT_FOUND with HTTP 404 — NOT ERR_TOPIC_NOT_FOUND, and no topic with slug atlas-orphan-child exists afterwards"
            - "every response body carries exactly the two error keys error_id and message inside data, plus meta.api_request_id and meta.api_request_timestamp"

      - name: request_level_input_rejections_for_clock_pagination_and_windows
        claim_type: error_triggerable
        grounds: ["errors.ERR_CLOCK_BACKWARD", "errors.ERR_INVALID_PAGINATION", "errors.ERR_INVALID_DATE_WINDOW", "validations.priority_5", "validations.priority_45"]
        distinguishing_aspect: "Three request-level rejections that must be distinguished from one another and from ERR_INVALID_REQUEST: a backwards clock (the value is a well-formed instant), limit 0 (a well-formed integer outside 1..100), and a train whose doc_freeze_date 2026-09-20 is after its ga_date 2026-09-01 (all three dates well-formed)."
        test_recipe:
          setup:
            - "The logical clock parked at 2026-08-01T00:00:00Z and one existing release train, so the paginated list has something to page over."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "12.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: DocsLead
              captures: { e_clock: "$.data.error_id" }
            - call: "GET /release-trains"
              payload: { limit: 0 }
              as: DocsLead
              captures: { e_page: "$.data.error_id" }
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "13.0", doc_freeze_date: "2026-09-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { e_window: "$.data.error_id" }
          assert:
            - "${e_clock} == ERR_CLOCK_BACKWARD with HTTP 409, and a subsequent GET /release-trains/${rt_id} still shows the clock's effects at 2026-08-01T00:00:00Z (created_at unchanged)"
            - "${e_page} == ERR_INVALID_PAGINATION with HTTP 400 — limit 0 is below the minimum of 1, distinct from ERR_INVALID_REQUEST"
            - "${e_window} == ERR_INVALID_DATE_WINDOW with HTTP 400 because doc_freeze_date > ga_date"
            - "GET /release-trains returns total_count == 1 — neither rejected write created a row"

      - name: uniqueness_rejections_across_all_five_scoped_keys
        claim_type: error_triggerable
        grounds: ["errors.ERR_DUPLICATE_VERSION_LABEL", "errors.ERR_DUPLICATE_PERSON_KEY", "errors.ERR_DUPLICATE_TOPIC_SLUG", "errors.ERR_DUPLICATE_LOCALE_CODE", "errors.ERR_DUPLICATE_TERM", "validations.priority_50"]
