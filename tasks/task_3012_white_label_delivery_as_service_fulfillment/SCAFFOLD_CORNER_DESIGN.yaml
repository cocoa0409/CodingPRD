              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/start-transit"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o2}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o2}/start-transit"
