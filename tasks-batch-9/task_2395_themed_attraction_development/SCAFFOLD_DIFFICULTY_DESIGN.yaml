          Entity pair = VEBallot depends on ValueEngineeringItem. A ballot is refused while the item is still PROPOSED
          even though the caller's role and declared party_role are both legitimate, and the identical request is
          accepted once the owner opens review — the gate is the parent's state, not the ballot's own payload.
