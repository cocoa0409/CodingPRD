          setup:
            - "One ACTIVE lease, MONTHLY, CUMULATIVE_YTD, ARTIFICIAL breakpoint 40000000, rate 600, reporting_deadline_days 10."
            - "LeaseYear 1 has an ACCEPTED September report at 30,000,000 gross and a PENDING October report."
            - "The clock reads 2026-11-12, past the October due date of 2026-11-11, and the October report has been estimate-billed to 33,000,000 with an ISSUED ESTIMATE charge of 1,380,000."
