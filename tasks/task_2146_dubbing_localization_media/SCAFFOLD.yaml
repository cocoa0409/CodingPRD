scenario: "desgin task harder than expert level.!!!!2146. Dubbing & Localization for Media (media localization vendor): script translation & adaptation for lip sync, voice casting & talent availability across languages, recording session scheduling & studio booking, mix & M&E stem handling, quality review by native reviewer & retake cycle, deliverable spec per platform & metadata localization, talent payment & usage rights by territory, versioning across cuts"
domain_name: dubbing-localization-media
api_prefix: ""   # flat topology: every entity is its own top-level collection (/titles, /cuts, /localization-orders, ...)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Cut is self-referential (derived_from_cut_id), CastingAssignment is a 3-way junction
  # (LocalizationOrder x Character x VoiceTalent), RecordingSession is a 3-way junction
  # (LocalizationOrder x Studio x CastingAssignment), RetakeItem bridges QualityReview x
  # CastingAssignment. No nesting in URL paths - every entity is a top-level collection
  # linked by declared foreign keys.

  state_machine_shape: cyclic
  # LocalizationOrder cycles QC -> RECORDING -> MIXING -> QC on every retake round and
  # DELIVERED -> RECALLED -> MIXING on recall; ScriptAdaptation cycles
  # ADAPTED -> IN_REVIEW -> REVISION_REQUESTED -> ADAPTED; QualityReview cycles
  # FAILED_RETAKE -> IN_REVIEW; MixJob cycles CONFORMED -> STEM_CHECKED; CastingAssignment
  # carries two independent state dimensions (casting_status x payment_status);
  # RecordingSession forks CONFIRMED -> {IN_PROGRESS, NO_SHOW} with divergent side effects.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The X-User-ID that adapted a script may not review it; the X-User-ID that reviewed a
  # ScriptAdaptation may not sign the QualityReview for the same order.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: title_code
        type: string
        source: input
        description: "Vendor-side catalogue code for the property"
        constraints: "non-empty, unique across Title"
      - name: source_language
        type: string
        source: input
        description: "BCP-47 language tag of the original audio"
        constraints: "non-empty"
      - name: runtime_seconds
        type: integer
        source: input
        description: "Reference runtime of the original master"
        constraints: ">= 1"
      - name: content_rating
        type: enum
        source: input
        description: "Ratings band that drives reviewer eligibility"
        default: "GENERAL"
        constraints: "one of {GENERAL, TEEN, MATURE}"
      - name: cut_count
        type: integer
        source: computed
        description: "Count of Cut rows whose title_id == this Title.id (all statuses)"
        default: 0

  - name: Cut
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the property this cut belongs to"
      - name: derived_from_cut_id
        type: string
        source: input
        description: "FK -> Cut.id; self-referential lineage pointer, null for a root cut"
        default: null
      - name: cut_code
        type: string
        source: input
        description: "Cut label such as THEATRICAL, STREAMING, AIRLINE"
        constraints: "non-empty, unique per title_id"
      - name: loop_count
        type: integer
        source: input
        description: "Number of dialogue loops in this cut; the denominator of every coverage ratio"
        constraints: ">= 1"
      - name: runtime_seconds
        type: integer
        source: input
        description: "Runtime of this cut"
        constraints: ">= 1"
      - name: conform_delta_seconds
        type: integer
        source: computed
        description: "runtime_seconds minus derived_from_cut.runtime_seconds; 0 for a root cut"
        default: 0
      - name: lineage_depth
        type: integer
        source: computed
        description: "0 for a root cut, else derived_from_cut.lineage_depth + 1"
        default: 0
      - name: derived_cut_count
        type: integer
        source: computed
        description: "Count of Cut rows whose derived_from_cut_id == this Cut.id"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while conform data may still change, LOCKED once orders may be raised"
        default: "OPEN"
        constraints: "one of {OPEN, LOCKED}"

  - name: Character
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the property this character appears in"
      - name: character_code
        type: string
        source: input
        description: "Character label used on the dubbing sheet"
        constraints: "non-empty, unique per title_id"
      - name: loop_count
        type: integer
        source: input
        description: "Dialogue loops attributed to this character"
        constraints: ">= 0"
      - name: is_principal
        type: boolean
        source: input
        description: "True for principal cast; principals require a UNION-eligible rate check"
        default: false
      - name: screen_time_seconds
        type: integer
        source: input
        description: "On-screen seconds for this character"
        constraints: ">= 0"

  - name: PlatformSpec
    parent: null
    common_fields: true
    fields:
      - name: platform_code
        type: string
        source: input
        description: "Delivery platform identifier"
        constraints: "non-empty, unique across PlatformSpec"
      - name: loudness_target_lufs
        type: number
        source: input
        description: "Integrated loudness target the final mix must hit"
        constraints: "between -40.0 and 0.0"
      - name: stem_layout
        type: enum
        source: input
        description: "Required music-and-effects stem layout"
        constraints: "one of {STEREO_ME, FIVE_ONE_ME}"
      - name: max_lipsync_deviation_ms
        type: integer
        source: input
        description: "Per-loop lip-sync deviation tolerance used by final_fidelity_score"
        constraints: ">= 1"
      - name: min_fidelity_score
        type: number
        source: input
        description: "Minimum final_fidelity_score a ScriptAdaptation must reach to be approvable"
        constraints: "between 0.0 and 1.0"
      - name: qc_pass_threshold
        type: number
        source: input
        description: "Minimum QualityReview.pass_rate for a PASS decision (inclusive comparison)"
        constraints: "between 0.0 and 1.0"
      - name: metadata_fields_required
        type: array
        source: input
        description: "Metadata keys that must be present and non-empty in the localized metadata at delivery"
        constraints: "array of non-empty strings, may be empty"

  - name: VoiceTalent
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Talent display name"
        constraints: "non-empty"
      - name: language_code
        type: string
        source: input
        description: "BCP-47 tag of the language this talent records in"
        constraints: "non-empty"
      - name: union_status
        type: enum
        source: input
        description: "Union membership; drives the union uplift line of session_cost_cents"
        default: "NON_UNION"
        constraints: "one of {UNION, NON_UNION}"
      - name: base_rate_cents_per_hour
        type: integer
        source: input
        description: "List rate in cents per hour; the floor for any agreed casting rate"
        constraints: ">= 1"
      - name: licensed_territories
        type: array
        source: input
        description: "Territory codes this talent may legally be exploited in"
        constraints: "non-empty array drawn from {US, CA, UK, DE, FR, JP, BR, AU, ROW}"
      - name: max_daily_recorded_minutes
        type: integer
        source: input
        description: "Aggregate per-UTC-day minute cap across all sessions of this talent"
        default: 300
        constraints: ">= 1"
      - name: held_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over RecordingSession rows of this talent in {SCHEDULED, CONFIRMED, IN_PROGRESS}"
        default: 0
      - name: recorded_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over RecordingSession rows of this talent in {COMPLETED}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE talents may be cast; SUSPENDED talents may not"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Studio
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Studio room name"
        constraints: "non-empty"
      - name: territory
        type: string
        source: input
        description: "Territory code the room sits in"
        constraints: "one of {US, CA, UK, DE, FR, JP, BR, AU, ROW}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Room rate in cents per hour, billed in whole 30-minute blocks"
        constraints: ">= 1"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: "Mandatory clean-down gap appended after every booking on this room"
        default: 30
        constraints: ">= 0"
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: "Aggregate per-UTC-day booked-minute ceiling for this room"
        default: 600
        constraints: ">= 1"
      - name: booked_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over RecordingSession rows on this room in {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED}"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE rooms accept bookings; MAINTENANCE rooms do not"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, MAINTENANCE}"

  - name: LocalizationOrder
    parent: null
    common_fields: true
    fields:
      - name: cut_id
        type: string
        source: input
        description: "FK -> Cut.id; the exact cut being localized"
      - name: platform_spec_id
        type: string
        source: input
        description: "FK -> PlatformSpec.id; the deliverable spec this order must satisfy"
      - name: target_language
        type: string
        source: input
        description: "BCP-47 tag of the dub language"
        constraints: "non-empty, must differ from Title.source_language"
      - name: territory
        type: string
        source: input
        description: "Territory the dub is licensed for; every cast talent must license it"
        constraints: "one of {US, CA, UK, DE, FR, JP, BR, AU, ROW}"
      - name: priority_tier
        type: enum
        source: input
        description: "Drives the rush surcharge and the fidelity tier weight"
        default: "STANDARD"
        constraints: "one of {STANDARD, EXPEDITED, RUSH}"
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Hard ceiling on committed_cents; a completion that would push past it is refused"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Order stage; advanced almost entirely by cascades from child entities"
        default: "DRAFT"
        constraints: "one of {DRAFT, SCRIPT_IN_PROGRESS, CASTING, RECORDING, MIXING, QC, DELIVERED, RECALLED, CANCELLED}"
      - name: committed_cents
        type: integer
        source: computed
        description: "Money currently standing against the order: sum of session_cost_cents over its COMPLETED RecordingSession rows minus every amount already moved to released_cents"
        default: 0
      - name: released_cents
        type: integer
        source: computed
        description: "Money withdrawn from committed_cents by a compensating action (retake void or recall void); never decreases"
        default: 0
      - name: gross_accrued_cents
        type: integer
        source: computed
        description: "Conserved money quantity: every accrual ever booked on this order. Invariant gross_accrued_cents == committed_cents + released_cents holds after every request"
        default: 0
      - name: retake_cycles
        type: integer
        source: computed
        description: "Number of times a QualityReview FAIL has pushed this order back from QC to RECORDING"
        default: 0
      - name: metadata_locale_fields
        type: object
        source: system
        description: "Localized metadata map captured at delivery; empty object until the order is delivered"
        default: {}
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DELIVERED transition; null before first delivery"
        default: null

  - name: ScriptAdaptation
    parent: LocalizationOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LocalizationOrder.id; the order whose script this adapts"
      - name: status
        type: enum
        source: system
        description: "Adaptation stage; cycles through revision rounds"
        default: "DRAFT"
        constraints: "one of {DRAFT, TRANSLATED, ADAPTED, IN_REVIEW, REVISION_REQUESTED, APPROVED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Starts at 1; incremented on every REVISION_REQUESTED -> ADAPTED transition"
        default: 1
      - name: adapted_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Adaptor who performed the most recent ADAPT; segregation-of-duties compares the reviewer against this value"
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the NativeReviewer who issued the most recent review decision"
        default: null
      - name: declared_loop_count
        type: integer
        source: input
        description: "Loops the adaptor claims to have written; supplied on ADAPT"
        default: 0
        constraints: ">= 0"
      - name: measured_sync_deviation_ms_total
        type: integer
        source: input
        description: "Sum of absolute per-loop sync deviations measured by the sync pass; supplied on SUBMIT_REVIEW"
        default: 0
        constraints: ">= 0"
      - name: lines_over_deviation
        type: integer
        source: input
        description: "Count of loops whose measured deviation exceeded the platform tolerance; supplied on SUBMIT_REVIEW"
        default: 0
        constraints: ">= 0"
      - name: provisional_fidelity_score
        type: number
        source: computed
        description: "Declared-count variant of the lip-sync fidelity score, stamped on ADAPT"
        default: null
      - name: final_fidelity_score
        type: number
        source: computed
        description: "Measured-deviation variant of the lip-sync fidelity score, stamped on SUBMIT_REVIEW"
        default: null

  - name: CastingAssignment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LocalizationOrder.id; the order this casting belongs to"
      - name: character_id
        type: string
        source: input
        description: "FK -> Character.id; the role being voiced"
      - name: talent_id
        type: string
        source: input
        description: "FK -> VoiceTalent.id; the talent voicing the role"
      - name: casting_status
        type: enum
        source: system
        description: "First independent state dimension: booking track of the assignment"
        default: "PROPOSED"
        constraints: "one of {PROPOSED, HOLD_REQUESTED, HELD, CONFIRMED, RECORDED, DECLINED, RELEASED}"
      - name: payment_status
        type: enum
        source: computed
        description: "Second independent state dimension: status of this assignment's newest TalentPayment row, or UNBILLED when it has none"
        default: "UNBILLED"
        constraints: "one of {UNBILLED, ACCRUED, SETTLED, VOIDED}"
      - name: usage_variant
        type: enum
        source: input
        description: "Which talent_usage_fee_cents variant this deal uses"
        constraints: "one of {BUYOUT, RESIDUAL}"
      - name: agreed_rate_cents_per_hour
        type: integer
        source: input
        description: "Negotiated hourly rate in cents; must be >= the talent's base_rate_cents_per_hour"
        constraints: ">= 1"
      - name: superseded_by_id
        type: string
        source: system
        description: "FK -> CastingAssignment.id; set on the older row when the same character is re-cast on the same order"
        default: null
      - name: recorded_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over this assignment's COMPLETED, non-retake RecordingSession rows"
        default: 0
      - name: retake_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over this assignment's COMPLETED RecordingSession rows with is_retake == true"
        default: 0

  - name: RecordingSession
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LocalizationOrder.id; the order being recorded"
      - name: studio_id
        type: string
        source: input
        description: "FK -> Studio.id; the room booked"
      - name: casting_assignment_id
        type: string
        source: input
        description: "FK -> CastingAssignment.id; the talent/character pair recording in this slot"
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle including the waitlist entry state"
        default: "SCHEDULED"
        constraints: "one of {WAITLISTED, SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}"
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start of the booked interval"
      - name: end_utc
        type: datetime
        source: input
        description: "Exclusive end of the booked interval for studio arithmetic; inclusive for talent arithmetic"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes between start_utc and end_utc"
        default: 0
      - name: is_retake
        type: boolean
        source: input
        description: "True when this slot re-records loops flagged by a QualityReview"
        default: false
      - name: session_cost_cents
        type: integer
        source: computed
        description: "Per-line-rounded booking cost; provisional at create, restamped on COMPLETE"
        default: 0
      - name: waitlisted_reason
        type: enum
        source: system
        description: "Why the booking landed on the waitlist instead of the calendar"
        default: null
        constraints: "one of {STUDIO_SLOT_CONFLICT, STUDIO_DAILY_CAPACITY} or null"

  - name: MixJob
    parent: LocalizationOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LocalizationOrder.id; the order being mixed"
      - name: status
        type: enum
        source: system
        description: "Mix stage; cycles back to STEM_CHECKED whenever QC fails"
        default: "QUEUED"
        constraints: "one of {QUEUED, STEM_CHECKED, MIXED, CONFORMED, SUPERSEDED}"
      - name: stem_layout
        type: enum
        source: input
        description: "Layout of the delivered M&E stem; must equal the platform spec layout to score any stem points"
        constraints: "one of {STEREO_ME, FIVE_ONE_ME}"
      - name: me_stem_present
        type: boolean
        source: input
        description: "Whether a separated music-and-effects stem was supplied with the mix"
        default: false
      - name: loudness_lufs
        type: number
        source: input
        description: "Measured integrated loudness of the mix; supplied on the MIX step"
        default: null
      - name: mix_round
        type: integer
        source: computed
        description: "Starts at 1; incremented on every CONFORMED -> STEM_CHECKED regression"
        default: 1
      - name: conformance_index
        type: number
        source: computed
        description: "Weighted loudness/stem/cast-coverage score stamped on the MIX step"
        default: null

  - name: QualityReview
    parent: LocalizationOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LocalizationOrder.id; the order under review"
      - name: mix_job_id
        type: string
        source: input
        description: "FK -> MixJob.id; the conformed mix this review inspects"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle; FAILED_RETAKE can re-enter IN_REVIEW once retakes close"
        default: "PENDING"
        constraints: "one of {PENDING, IN_REVIEW, PASSED, FAILED_RETAKE}"
      - name: round_number
        type: integer
        source: computed
        description: "Starts at 1; incremented on every FAILED_RETAKE -> IN_REVIEW transition"
        default: 1
      - name: reviewer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the NativeReviewer who started the review"
        default: null
      - name: sampled_loop_count
        type: integer
        source: input
        description: "Loops sampled in the current round; supplied on START"
        default: 0
        constraints: ">= 0"
      - name: defect_count
        type: integer
        source: input
        description: "Defective loops found in the current round; supplied on DECIDE"
        default: 0
        constraints: ">= 0"
      - name: pass_rate
        type: number
        source: computed
        description: "1 - defect_count / sampled_loop_count, four decimals; stamped on DECIDE"
        default: null
      - name: decision
        type: enum
        source: system
        description: "Latest decision recorded on this review"
        default: null
        constraints: "one of {PASS, FAIL} or null"

  - name: RetakeItem
    parent: QualityReview
    common_fields: true
    fields:
      - name: quality_review_id
        type: string
        source: input
        description: "FK -> QualityReview.id; the failing review that raised this retake"
      - name: casting_assignment_id
        type: string
        source: input
        description: "FK -> CastingAssignment.id; whose performance must be re-recorded"
      - name: loop_ref
        type: string
        source: input
        description: "Loop identifier on the dubbing sheet"
        constraints: "non-empty"
      - name: defect_category
        type: enum
        source: input
        description: "Defect classification driving which downstream step must repeat"
        constraints: "one of {LIPSYNC, PERFORMANCE, AUDIO, TRANSLATION}"
      - name: estimated_minutes
        type: integer
        source: input
        description: "Booth minutes the reviewer estimates the retake needs"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "OPEN until a retake session covers it or a reviewer waives it"
        default: "OPEN"
        constraints: "one of {OPEN, RECORDED, WAIVED}"

  - name: TalentPayment
    parent: CastingAssignment
    common_fields: true
    fields:
      - name: casting_assignment_id
        type: string
        source: input
        description: "FK -> CastingAssignment.id; the deal being paid"
      - name: talent_id
        type: string
        source: input
        description: "FK -> VoiceTalent.id; denormalized payee for territory checks"
      - name: variant
        type: enum
        source: computed
        description: "Copied from the assignment's usage_variant at accrual time"
        constraints: "one of {BUYOUT, RESIDUAL}"
      - name: territory_scope
        type: array
        source: input
        description: "Territory codes this payment licenses; must be a subset of the talent's licensed_territories and must contain the order's territory"
        constraints: "non-empty array drawn from {US, CA, UK, DE, FR, JP, BR, AU, ROW}"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Per-session-rounded sum of the assignment's non-retake COMPLETED session talent lines"
        default: 0
      - name: usage_fee_cents
        type: integer
        source: computed
        description: "Territory usage fee under the BUYOUT or RESIDUAL variant"
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: "base_fee_cents + usage_fee_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle; a VOIDED payment can be re-accrued after a retake round"
        default: "ACCRUED"
        constraints: "one of {ACCRUED, SETTLED, VOIDED}"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement; null until SETTLED"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Cut
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /cuts/{cutId}/lock"
        actor: ProductionCoordinator
        preconditions:
          - "Cut.status == OPEN"
          - "if Cut.derived_from_cut_id is not null, the parent Cut.status == LOCKED"
        side_effects:
          - "sets Cut.status = LOCKED"
          - "increments Cut.version by 1"
        note: "A LocalizationOrder may only be raised against a LOCKED cut, so locking is the gate that freezes conform data for every downstream order."

  - entity: Studio
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /studios/{studioId}/set-status with to_status = MAINTENANCE"
        actor: ProductionCoordinator
        preconditions:
          - "Studio.status == ACTIVE"
          - "no RecordingSession on this studio has status IN_PROGRESS"
        side_effects:
          - "sets Studio.status = MAINTENANCE"
          - "increments Studio.version by 1"
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /studios/{studioId}/set-status with to_status = ACTIVE"
        actor: ProductionCoordinator
        preconditions:
          - "Studio.status == MAINTENANCE"
        side_effects:
          - "sets Studio.status = ACTIVE"
          - "increments Studio.version by 1"

  - entity: VoiceTalent
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /voice-talents/{talentId}/set-status with to_status = SUSPENDED"
        actor: CastingDirector
        preconditions:
          - "VoiceTalent.status == ACTIVE"
        side_effects:
          - "sets VoiceTalent.status = SUSPENDED"
          - "increments VoiceTalent.version by 1"
        note: "Suspension does not disturb existing bookings; it only blocks new CastingAssignment creation."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /voice-talents/{talentId}/set-status with to_status = ACTIVE"
        actor: CastingDirector
        preconditions:
          - "VoiceTalent.status == SUSPENDED"
        side_effects:
          - "sets VoiceTalent.status = ACTIVE"
          - "increments VoiceTalent.version by 1"

  - entity: LocalizationOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: SCRIPT_IN_PROGRESS
        trigger: "system event: a ScriptAdaptation row is created for this order (POST /script-adaptations)"
        actor: system
        preconditions:
          - "LocalizationOrder.status == DRAFT"
          - "the order has no existing ScriptAdaptation row"
        side_effects:
          - "sets LocalizationOrder.status = SCRIPT_IN_PROGRESS"
          - "increments LocalizationOrder.version by 1"
      - from: SCRIPT_IN_PROGRESS
        to: CASTING
        trigger: "system event: this order's ScriptAdaptation reaches IN_REVIEW for the first time (POST /script-adaptations/{adaptationId}/submit-review)"
        actor: system
        preconditions:
          - "LocalizationOrder.status == SCRIPT_IN_PROGRESS"
        side_effects:
          - "sets LocalizationOrder.status = CASTING"
          - "increments LocalizationOrder.version by 1"
      - from: CASTING
        to: RECORDING
        trigger: "system event: the first RecordingSession of this order enters SCHEDULED (either by direct booking or by waitlist promotion)"
        actor: system
        preconditions:
          - "LocalizationOrder.status == CASTING"
        side_effects:
          - "sets LocalizationOrder.status = RECORDING"
          - "increments LocalizationOrder.version by 1"
      - from: RECORDING
        to: MIXING
        trigger: "system event: this order's newest MixJob enters MIXED"
        actor: system
        preconditions:
          - "LocalizationOrder.status == RECORDING"
        side_effects:
          - "sets LocalizationOrder.status = MIXING"
          - "increments LocalizationOrder.version by 1"
      - from: RECALLED
        to: MIXING
        trigger: "system event: this order's newest MixJob enters MIXED"
        actor: system
        preconditions:
          - "LocalizationOrder.status == RECALLED"
        side_effects:
          - "sets LocalizationOrder.status = MIXING"
          - "increments LocalizationOrder.version by 1"
      - from: MIXING
        to: QC
        trigger: "system event: this order's newest MixJob enters CONFORMED"
        actor: system
        preconditions:
          - "LocalizationOrder.status == MIXING"
        side_effects:
          - "sets LocalizationOrder.status = QC"
          - "increments LocalizationOrder.version by 1"
      - from: QC
        to: RECORDING
        trigger: "cascade link 3 of the QC-failure chain: this order's newest MixJob regresses CONFORMED -> STEM_CHECKED"
        actor: system
        preconditions:
          - "LocalizationOrder.status == QC"
        side_effects:
          - "sets LocalizationOrder.status = RECORDING"
          - "increments LocalizationOrder.retake_cycles by 1"
          - "increments LocalizationOrder.version by 1"
          - "triggers cascade link 4: every CastingAssignment named by an OPEN RetakeItem of the failing review regresses RECORDED -> CONFIRMED"
      - from: QC
        to: DELIVERED
        trigger: "POST /localization-orders/{orderId}/deliver"
        actor: ProductionCoordinator
        preconditions:
          - "LocalizationOrder.status == QC"
          - "the order's newest QualityReview.status == PASSED"
          - "every key listed in PlatformSpec.metadata_fields_required is present and non-empty in the request's metadata_locale_fields"
        side_effects:
          - "sets LocalizationOrder.status = DELIVERED"
          - "stores the supplied map in LocalizationOrder.metadata_locale_fields"
          - "sets LocalizationOrder.delivered_at to the current logical clock instant"
          - "increments LocalizationOrder.version by 1"
      - from: DELIVERED
        to: RECALLED
        trigger: "POST /localization-orders/{orderId}/recall"
        actor: ProductionCoordinator
        preconditions:
          - "LocalizationOrder.status == DELIVERED"
        side_effects:
          - "sets LocalizationOrder.status = RECALLED"
          - "moves the whole of LocalizationOrder.committed_cents into LocalizationOrder.released_cents, leaving gross_accrued_cents untouched"
          - "sets the order's newest MixJob status to SUPERSEDED"
          - "increments LocalizationOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /localization-orders/{orderId}/cancel"
        actor: ProductionCoordinator
        preconditions:
          - "LocalizationOrder.status IN {DRAFT, SCRIPT_IN_PROGRESS, CASTING, RECORDING, MIXING, QC}"
        side_effects:
          - "sets LocalizationOrder.status = CANCELLED"
          - "releases every RecordingSession of this order in {WAITLISTED, SCHEDULED, CONFIRMED} to CANCELLED, each returning its duration_minutes to Studio.booked_minutes and VoiceTalent.held_minutes"
          - "moves the whole of LocalizationOrder.committed_cents into LocalizationOrder.released_cents"
          - "increments LocalizationOrder.version by 1"
        note: "Identical cancel transitions exist from SCRIPT_IN_PROGRESS, CASTING, RECORDING, MIXING and QC; DELIVERED, RECALLED and CANCELLED reject the cancel trigger with ERR_ORDER_LOCKED."

  - entity: ScriptAdaptation
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: TRANSLATED
        trigger: "POST /script-adaptations/{adaptationId}/translate"
        actor: Adaptor
        preconditions:
          - "ScriptAdaptation.status == DRAFT"
          - "LocalizationOrder.status IN {SCRIPT_IN_PROGRESS, CASTING, RECORDING}"
        side_effects:
          - "sets ScriptAdaptation.status = TRANSLATED"
          - "increments ScriptAdaptation.version by 1"
      - from: TRANSLATED
        to: ADAPTED
        trigger: "POST /script-adaptations/{adaptationId}/adapt"
        actor: Adaptor
        preconditions:
          - "ScriptAdaptation.status IN {TRANSLATED, REVISION_REQUESTED}"
          - "LocalizationOrder.status IN {SCRIPT_IN_PROGRESS, CASTING, RECORDING}"
        side_effects:
          - "stores declared_loop_count from the request"
          - "sets ScriptAdaptation.adapted_by_user_id = the acting X-User-ID"
          - "recomputes ScriptAdaptation.provisional_fidelity_score per calculations.adaptation_fidelity_score variant provisional_declared"
          - "sets ScriptAdaptation.status = ADAPTED"
          - "increments ScriptAdaptation.version by 1"
      - from: REVISION_REQUESTED
        to: ADAPTED
        trigger: "POST /script-adaptations/{adaptationId}/adapt (revision loop)"
        actor: Adaptor
        preconditions:
          - "ScriptAdaptation.status == REVISION_REQUESTED"
          - "LocalizationOrder.status IN {SCRIPT_IN_PROGRESS, CASTING, RECORDING}"
        side_effects:
          - "increments ScriptAdaptation.revision_round by 1"
          - "stores declared_loop_count from the request"
          - "sets ScriptAdaptation.adapted_by_user_id = the acting X-User-ID"
          - "recomputes ScriptAdaptation.provisional_fidelity_score per calculations.adaptation_fidelity_score variant provisional_declared"
          - "sets ScriptAdaptation.status = ADAPTED"
          - "increments ScriptAdaptation.version by 1"
        note: "This edge closes the ADAPTED -> IN_REVIEW -> REVISION_REQUESTED -> ADAPTED cycle."
      - from: ADAPTED
        to: IN_REVIEW
        trigger: "POST /script-adaptations/{adaptationId}/submit-review"
        actor: Adaptor
        preconditions:
          - "ScriptAdaptation.status == ADAPTED"
          - "ScriptAdaptation.declared_loop_count >= 1"
        side_effects:
          - "stores measured_sync_deviation_ms_total and lines_over_deviation from the request"
          - "recomputes ScriptAdaptation.final_fidelity_score per calculations.adaptation_fidelity_score variant final_measured"
          - "sets ScriptAdaptation.status = IN_REVIEW"
          - "if LocalizationOrder.status == SCRIPT_IN_PROGRESS, cascades it to CASTING (first submission only)"
          - "increments ScriptAdaptation.version by 1"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /script-adaptations/{adaptationId}/review with decision = APPROVE"
        actor: NativeReviewer
        preconditions:
          - "ScriptAdaptation.status == IN_REVIEW"
          - "the acting X-User-ID != ScriptAdaptation.adapted_by_user_id (segregation of duties)"
          - "ScriptAdaptation.final_fidelity_score >= PlatformSpec.min_fidelity_score of the order's spec (inclusive)"
        side_effects:
          - "sets ScriptAdaptation.reviewed_by_user_id = the acting X-User-ID"
          - "sets ScriptAdaptation.status = APPROVED"
          - "increments ScriptAdaptation.version by 1"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /script-adaptations/{adaptationId}/review with decision = REQUEST_REVISION"
        actor: NativeReviewer
        preconditions:
          - "ScriptAdaptation.status == IN_REVIEW"
          - "the acting X-User-ID != ScriptAdaptation.adapted_by_user_id (segregation of duties)"
        side_effects:
          - "sets ScriptAdaptation.reviewed_by_user_id = the acting X-User-ID"
          - "sets ScriptAdaptation.status = REVISION_REQUESTED"
          - "increments ScriptAdaptation.version by 1"

  - entity: CastingAssignment
    dimension: casting_status
    initial_state: PROPOSED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: PROPOSED
        to: HOLD_REQUESTED
        trigger: "POST /casting-assignments/{assignmentId}/request-hold"
        actor: CastingDirector
        preconditions:
          - "CastingAssignment.casting_status == PROPOSED"
          - "LocalizationOrder.status IN {CASTING, RECORDING}"
        side_effects:
          - "sets CastingAssignment.casting_status = HOLD_REQUESTED"
          - "increments CastingAssignment.version by 1"
      - from: HOLD_REQUESTED
        to: HELD
        trigger: "POST /casting-assignments/{assignmentId}/respond-hold with response = ACCEPT"
        actor: VoiceTalentUser
        preconditions:
          - "CastingAssignment.casting_status == HOLD_REQUESTED"
          - "the acting X-User-ID == CastingAssignment.talent_id"
        side_effects:
          - "sets CastingAssignment.casting_status = HELD"
          - "increments CastingAssignment.version by 1"
      - from: HOLD_REQUESTED
        to: DECLINED
        trigger: "POST /casting-assignments/{assignmentId}/respond-hold with response = DECLINE"
        actor: VoiceTalentUser
        preconditions:
          - "CastingAssignment.casting_status == HOLD_REQUESTED"
          - "the acting X-User-ID == CastingAssignment.talent_id"
        side_effects:
          - "sets CastingAssignment.casting_status = DECLINED"
          - "increments CastingAssignment.version by 1"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /casting-assignments/{assignmentId}/confirm"
        actor: CastingDirector
        preconditions:
          - "CastingAssignment.casting_status == HELD"
          - "LocalizationOrder.status IN {CASTING, RECORDING}"
          - "CastingAssignment.superseded_by_id is null"
        side_effects:
          - "sets CastingAssignment.casting_status = CONFIRMED"
          - "increments CastingAssignment.version by 1"
      - from: CONFIRMED
        to: RECORDED
        trigger: "system event: a RecordingSession of this assignment with is_retake == false enters COMPLETED"
        actor: system
        preconditions:
          - "CastingAssignment.casting_status == CONFIRMED"
        side_effects:
          - "sets CastingAssignment.casting_status = RECORDED"
          - "recomputes CastingAssignment.recorded_minutes"
          - "increments CastingAssignment.version by 1"
      - from: RECORDED
        to: CONFIRMED
        trigger: "cascade link 4 of the QC-failure chain: the order regressed QC -> RECORDING and this assignment is named by an OPEN RetakeItem of the failing review"
        actor: system
        preconditions:
          - "CastingAssignment.casting_status == RECORDED"
        side_effects:
          - "sets CastingAssignment.casting_status = CONFIRMED"
          - "if CastingAssignment.payment_status == ACCRUED, voids this assignment's newest TalentPayment (payment dimension ACCRUED -> VOIDED) and moves void_cents = sum(session_cost_cents over this assignment's COMPLETED is_retake==false sessions) from LocalizationOrder.committed_cents to LocalizationOrder.released_cents"
          - "if CastingAssignment.payment_status is anything other than ACCRUED, void_cents is 0 and no money moves - this keeps the compensation idempotent across repeated retake rounds"
          - "increments CastingAssignment.version by 1"
        note: "Closes the RECORDED -> CONFIRMED -> RECORDED cycle on the casting dimension."
      - from: HELD
        to: RELEASED
        trigger: "POST /casting-assignments/{assignmentId}/release, or system supersede when a newer CastingAssignment is created for the same (order_id, character_id)"
        actor: CastingDirector
        preconditions:
          - "CastingAssignment.casting_status IN {PROPOSED, HOLD_REQUESTED, HELD, CONFIRMED}"
          - "the assignment has no RecordingSession in {SCHEDULED, CONFIRMED, IN_PROGRESS}"
        side_effects:
          - "sets CastingAssignment.casting_status = RELEASED"
          - "on the supersede path, also sets the older row's superseded_by_id to the new assignment id"
          - "increments CastingAssignment.version by 1"
        note: "The same edge exists from PROPOSED, HOLD_REQUESTED and CONFIRMED."

  - entity: CastingAssignment
    dimension: payment_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: ACCRUED
        trigger: "system event: a TalentPayment row is created for this assignment (POST /talent-payments)"
        actor: system
        preconditions:
          - "CastingAssignment.payment_status IN {UNBILLED, VOIDED}"
          - "CastingAssignment.casting_status == RECORDED"
        side_effects:
          - "sets CastingAssignment.payment_status = ACCRUED"
          - "increments CastingAssignment.version by 1"
      - from: VOIDED
        to: ACCRUED
        trigger: "system event: a replacement TalentPayment row is created after a retake round (POST /talent-payments)"
        actor: system
        preconditions:
          - "CastingAssignment.payment_status == VOIDED"
          - "CastingAssignment.casting_status == RECORDED"
        side_effects:
          - "sets CastingAssignment.payment_status = ACCRUED"
          - "increments CastingAssignment.version by 1"
      - from: ACCRUED
        to: SETTLED
        trigger: "system event: this assignment's newest TalentPayment reaches SETTLED (POST /talent-payments/{paymentId}/settle)"
        actor: system
        preconditions:
          - "CastingAssignment.payment_status == ACCRUED"
        side_effects:
          - "sets CastingAssignment.payment_status = SETTLED"
          - "increments CastingAssignment.version by 1"
      - from: ACCRUED
        to: VOIDED
        trigger: "cascade link 4 of the QC-failure chain"
        actor: system
        preconditions:
          - "CastingAssignment.payment_status == ACCRUED"
        side_effects:
          - "sets CastingAssignment.payment_status = VOIDED"
          - "sets the assignment's newest TalentPayment.status = VOIDED"
          - "increments CastingAssignment.version by 1"
        note: "The payment dimension advances on its own trigger set; a CONFIRMED assignment can be UNBILLED, and a RECORDED assignment can be UNBILLED, ACCRUED, SETTLED or VOIDED. The two dimensions never share a trigger except cascade link 4, which moves each dimension along its own edge."

  - entity: RecordingSession
    initial_state: SCHEDULED
    alternate_initial_state: WAITLISTED
    initial_state_rule: "POST /recording-sessions lands the row in SCHEDULED when the buffered studio interval is clear and the room's day still has capacity; it lands in WAITLISTED (with waitlisted_reason set) when on_conflict == WAITLIST and either the buffered interval collides or the day's capacity is short. on_conflict == REJECT (the default) raises ERR_STUDIO_SLOT_CONFLICT or ERR_STUDIO_DAILY_CAPACITY instead of creating a row."
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: WAITLISTED
        to: SCHEDULED
        trigger: "cascade link 2 of the cancellation chain: booth time was returned to Studio.booked_minutes, so the waitlist selector runs on that studio"
        actor: system
        preconditions:
          - "RecordingSession.status == WAITLISTED"
          - "this row is the single winner of calculations.waitlist_promotion_selector for its studio"
        side_effects:
          - "sets RecordingSession.status = SCHEDULED and RecordingSession.waitlisted_reason = null"
          - "adds duration_minutes to Studio.booked_minutes"
          - "adds duration_minutes to VoiceTalent.held_minutes of the assignment's talent"
          - "triggers cascade link 3: if the promoted session's LocalizationOrder.status == CASTING it advances to RECORDING"
          - "increments RecordingSession.version by 1"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /recording-sessions/{sessionId}/confirm"
        actor: ProductionCoordinator
        preconditions:
          - "RecordingSession.status == SCHEDULED"
          - "the order's ScriptAdaptation.status == APPROVED"
          - "CastingAssignment.casting_status IN {CONFIRMED, RECORDED}"
          - "Studio.status == ACTIVE"
        side_effects:
          - "sets RecordingSession.status = CONFIRMED"
          - "increments RecordingSession.version by 1"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /recording-sessions/{sessionId}/start"
        actor: ProductionCoordinator
        preconditions:
          - "RecordingSession.status == CONFIRMED"
          - "the logical clock is at or after RecordingSession.start_utc"
        side_effects:
          - "sets RecordingSession.status = IN_PROGRESS"
          - "increments RecordingSession.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /recording-sessions/{sessionId}/no-show"
        actor: ProductionCoordinator
        preconditions:
          - "RecordingSession.status == CONFIRMED"
          - "the logical clock is at or after RecordingSession.start_utc"
        side_effects:
          - "sets RecordingSession.status = NO_SHOW"
          - "subtracts duration_minutes from Studio.booked_minutes"
          - "subtracts duration_minutes from VoiceTalent.held_minutes"
          - "books NO money: LocalizationOrder.committed_cents and gross_accrued_cents are untouched"
          - "leaves CastingAssignment.casting_status unchanged"
          - "runs calculations.waitlist_promotion_selector on this studio and promotes at most one WAITLISTED row"
          - "increments RecordingSession.version by 1"
        note: "The NO_SHOW branch of the CONFIRMED fork differs from the IN_PROGRESS branch in exactly three ways: booth minutes are returned rather than converted, no accrual is booked, and the assignment does not advance."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /recording-sessions/{sessionId}/complete"
        actor: ProductionCoordinator
        preconditions:
          - "RecordingSession.status == IN_PROGRESS"
          - "LocalizationOrder.status IN {RECORDING}"
          - "LocalizationOrder.committed_cents + the restamped session_cost_cents <= LocalizationOrder.budget_cap_cents"
        side_effects:
          - "restamps RecordingSession.session_cost_cents per calculations.session_cost_cents"
          - "sets RecordingSession.status = COMPLETED"
          - "moves duration_minutes from VoiceTalent.held_minutes to VoiceTalent.recorded_minutes; Studio.booked_minutes is unchanged because COMPLETED still occupies the room"
          - "adds session_cost_cents to LocalizationOrder.committed_cents and to LocalizationOrder.gross_accrued_cents"
          - "if is_retake == false, advances CastingAssignment CONFIRMED -> RECORDED"
          - "if is_retake == true, sets every OPEN RetakeItem whose casting_assignment_id == this session's assignment to RECORDED, then advances CastingAssignment CONFIRMED -> RECORDED"
          - "increments RecordingSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /recording-sessions/{sessionId}/cancel"
        actor: ProductionCoordinator
        preconditions:
          - "RecordingSession.status IN {WAITLISTED, SCHEDULED, CONFIRMED}"
        side_effects:
          - "sets RecordingSession.status = CANCELLED"
          - "if the row was not WAITLISTED, subtracts duration_minutes from Studio.booked_minutes and from VoiceTalent.held_minutes (cascade link 1)"
          - "triggers cascade link 2: calculations.waitlist_promotion_selector runs on this studio and promotes at most one WAITLISTED row"
          - "increments RecordingSession.version by 1"
        note: "The same edge exists from WAITLISTED and CONFIRMED; a WAITLISTED cancel returns no minutes because it never held any, and therefore does not trigger the promotion selector."

  - entity: MixJob
    initial_state: QUEUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: QUEUED
        to: STEM_CHECKED
        trigger: "POST /mix-jobs/{mixJobId}/stem-check"
        actor: MixEngineer
        preconditions:
          - "MixJob.status == QUEUED"
          - "MixJob.me_stem_present == true"
          - "MixJob.stem_layout == PlatformSpec.stem_layout of the order's spec"
        side_effects:
          - "sets MixJob.status = STEM_CHECKED"
          - "increments MixJob.version by 1"
      - from: STEM_CHECKED
        to: MIXED
        trigger: "POST /mix-jobs/{mixJobId}/mix"
        actor: MixEngineer
        preconditions:
          - "MixJob.status == STEM_CHECKED"
          - "every non-superseded CastingAssignment of the order in {PROPOSED, HOLD_REQUESTED, HELD, CONFIRMED, RECORDED} has casting_status == RECORDED"
        side_effects:
          - "stores loudness_lufs from the request"
          - "recomputes MixJob.conformance_index per calculations.mix_conformance_index"
          - "sets MixJob.status = MIXED"
          - "cascades LocalizationOrder RECORDING -> MIXING or RECALLED -> MIXING"
          - "increments MixJob.version by 1"
      - from: MIXED
        to: CONFORMED
        trigger: "POST /mix-jobs/{mixJobId}/conform"
        actor: MixEngineer
        preconditions:
          - "MixJob.status == MIXED"
          - "MixJob.conformance_index >= MIN_CONFORMANCE_INDEX (0.80, inclusive)"
        side_effects:
          - "sets MixJob.status = CONFORMED"
          - "cascades LocalizationOrder MIXING -> QC"
          - "increments MixJob.version by 1"
      - from: CONFORMED
        to: STEM_CHECKED
        trigger: "cascade link 2 of the QC-failure chain: the order's newest QualityReview entered FAILED_RETAKE"
        actor: system
        preconditions:
          - "MixJob.status == CONFORMED"
        side_effects:
          - "increments MixJob.mix_round by 1"
          - "clears MixJob.conformance_index to null"
          - "sets MixJob.status = STEM_CHECKED"
          - "triggers cascade link 3: LocalizationOrder QC -> RECORDING"
          - "increments MixJob.version by 1"
        note: "Closes the STEM_CHECKED -> MIXED -> CONFORMED -> STEM_CHECKED cycle."
      - from: CONFORMED
        to: SUPERSEDED
        trigger: "system event: the order was recalled (POST /localization-orders/{orderId}/recall)"
        actor: system
        preconditions:
          - "MixJob.status == CONFORMED"
        side_effects:
          - "sets MixJob.status = SUPERSEDED"
          - "increments MixJob.version by 1"

  - entity: QualityReview
    initial_state: PENDING
    terminal_states: [PASSED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /quality-reviews/{reviewId}/start"
        actor: NativeReviewer
        preconditions:
          - "QualityReview.status == PENDING"
          - "LocalizationOrder.status == QC"
          - "the request's sampled_loop_count >= 1"
          - "the acting X-User-ID != the order's ScriptAdaptation.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "stores sampled_loop_count from the request"
          - "sets QualityReview.reviewer_user_id = the acting X-User-ID"
          - "sets QualityReview.status = IN_REVIEW"
          - "increments QualityReview.version by 1"
      - from: FAILED_RETAKE
        to: IN_REVIEW
        trigger: "POST /quality-reviews/{reviewId}/start (next round)"
        actor: NativeReviewer
        preconditions:
          - "QualityReview.status == FAILED_RETAKE"
          - "every RetakeItem of this review has status IN {RECORDED, WAIVED}"
          - "the request's sampled_loop_count >= 1"
          - "the acting X-User-ID != the order's ScriptAdaptation.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "increments QualityReview.round_number by 1"
          - "stores sampled_loop_count from the request"
          - "sets QualityReview.reviewer_user_id = the acting X-User-ID"
          - "sets QualityReview.status = IN_REVIEW"
          - "increments QualityReview.version by 1"
        note: "Closes the IN_REVIEW -> FAILED_RETAKE -> IN_REVIEW cycle."
      - from: IN_REVIEW
        to: PASSED
        trigger: "POST /quality-reviews/{reviewId}/decide with decision = PASS"
        actor: NativeReviewer
        preconditions:
          - "QualityReview.status == IN_REVIEW"
          - "the acting X-User-ID == QualityReview.reviewer_user_id"
          - "calculations.qc_pass_rate result >= PlatformSpec.qc_pass_threshold (inclusive)"
        side_effects:
          - "stores defect_count from the request and stamps QualityReview.pass_rate"
          - "sets QualityReview.decision = PASS and QualityReview.status = PASSED"
          - "increments QualityReview.version by 1"
      - from: IN_REVIEW
        to: FAILED_RETAKE
        trigger: "POST /quality-reviews/{reviewId}/decide with decision = FAIL"
        actor: NativeReviewer
        preconditions:
          - "QualityReview.status == IN_REVIEW"
          - "the acting X-User-ID == QualityReview.reviewer_user_id"
          - "the request carries at least one defect entry"
          - "LocalizationOrder.retake_cycles < MAX_RETAKE_CYCLES (2)"
        side_effects:
          - "stores defect_count from the request and stamps QualityReview.pass_rate"
          - "sets QualityReview.decision = FAIL and QualityReview.status = FAILED_RETAKE"
          - "creates one RetakeItem per defect entry, each in status OPEN (cascade link 1)"
          - "triggers cascade link 2: the order's newest MixJob regresses CONFORMED -> STEM_CHECKED"
          - "increments QualityReview.version by 1"

  - entity: RetakeItem
    initial_state: OPEN
    terminal_states: [RECORDED, WAIVED]
    transitions:
      - from: OPEN
        to: RECORDED
        trigger: "system event: a RecordingSession with is_retake == true for this item's casting_assignment_id enters COMPLETED"
        actor: system
        preconditions:
          - "RetakeItem.status == OPEN"
        side_effects:
          - "sets RetakeItem.status = RECORDED"
          - "increments RetakeItem.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /retake-items/{retakeItemId}/waive"
        actor: NativeReviewer
        preconditions:
          - "RetakeItem.status == OPEN"
          - "the acting X-User-ID == the parent QualityReview.reviewer_user_id"
          - "RetakeItem.defect_category != LIPSYNC"
        side_effects:
          - "sets RetakeItem.status = WAIVED"
          - "increments RetakeItem.version by 1"
        note: "LIPSYNC defects can never be waived; they must be re-recorded."

  - entity: TalentPayment
    initial_state: ACCRUED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: ACCRUED
        to: SETTLED
        trigger: "POST /talent-payments/{paymentId}/settle"
        actor: PlatformAdmin
        preconditions:
          - "TalentPayment.status == ACCRUED"
          - "the parent CastingAssignment.casting_status == RECORDED"
          - "the order's newest QualityReview.status == PASSED"
        side_effects:
          - "sets TalentPayment.status = SETTLED and TalentPayment.settled_at to the logical clock instant"
          - "advances CastingAssignment payment dimension ACCRUED -> SETTLED"
          - "increments TalentPayment.version by 1"
      - from: ACCRUED
        to: VOIDED
        trigger: "cascade link 4 of the QC-failure chain"
        actor: system
        preconditions:
          - "TalentPayment.status == ACCRUED"
        side_effects:
          - "sets TalentPayment.status = VOIDED"
          - "advances CastingAssignment payment dimension ACCRUED -> VOIDED"
          - "increments TalentPayment.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: casting-create-stale-order
    parent_entity: LocalizationOrder
    write_endpoint: "POST /casting-assignments"
    occ_field: "expected_order_version"
    description: |
      Creating a CastingAssignment against a LocalizationOrder whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A re-cast of the same character legitimately supersedes the previous
      assignment, so a writer holding an outdated view of the order would otherwise
      release a row it never saw.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: derive-cut-stale-parent
    parent_entity: Cut
    write_endpoint: "POST /cuts/{cutId}/derive"
    occ_field: "expected_parent_cut_version"
    description: |
      Deriving a new Cut from a parent Cut whose version has advanced since the
      client last observed it is rejected with a stale-version error. Multiple
      derived cuts may legitimately hang off the same parent, so the check is the
      only thing that stops a client from branching off conform data it has not seen.
    error_id: ERR_STALE_CUT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: session_cost_cents
    trigger: "stamped provisionally when a RecordingSession row is created (POST /recording-sessions) and restamped on the IN_PROGRESS -> COMPLETED transition (POST /recording-sessions/{sessionId}/complete)"
    algorithm: tiered_pricing
    formula: |
      duration_minutes    = whole minutes between start_utc and end_utc
      billable_blocks     = ceil(duration_minutes / BLOCK_MINUTES)
      billable_minutes    = billable_blocks * BLOCK_MINUTES

      # ROUNDING ORDER IS PINNED: each of the four line items below is rounded to a
      # whole cent FIRST, independently, from its own UNROUNDED raw value, and only
      # then are the rounded line items summed. Summing the raw values and rounding
      # once at the end is NOT the declared behaviour and produces a different cent
      # figure whenever two or more lines carry a fractional part.
      studio_line_cents   = round_half_up(Studio.hourly_rate_cents * billable_minutes / 60)
      talent_line_cents   = round_half_up(CastingAssignment.agreed_rate_cents_per_hour * duration_minutes / 60)
      union_uplift_cents  = round_half_up(UNION_UPLIFT_PCT * CastingAssignment.agreed_rate_cents_per_hour * duration_minutes / 60)
                              if VoiceTalent.union_status == UNION else 0
      retake_credit_cents = round_half_up(RETAKE_CREDIT_PCT * CastingAssignment.agreed_rate_cents_per_hour * duration_minutes / 60)
                              if RecordingSession.is_retake == true else 0

      session_cost_cents  = studio_line_cents + talent_line_cents + union_uplift_cents - retake_credit_cents
    input_set: "Exactly one RecordingSession row joined to its Studio, its CastingAssignment and that assignment's VoiceTalent. No other session participates."
    constants:
      BLOCK_MINUTES: 30
      UNION_UPLIFT_PCT: 0.125
      RETAKE_CREDIT_PCT: 0.40
    precision: "whole cents, round_half_up applied per line item before summation"
    variants: []
    note: "Worked reference: Studio.hourly_rate_cents=21501, duration 25 minutes, agreed_rate_cents_per_hour=19506, UNION, is_retake=false. billable_blocks=1 -> billable_minutes=30. studio_line=round_half_up(10750.5)=10751; talent_line=round_half_up(8127.5)=8128; union_uplift=round_half_up(1015.9375)=1016. session_cost_cents=19895. Summing raw values first would yield round_half_up(19893.9375)=19894 - one cent lower and WRONG."

  - name: order_invoice_total_cents
    trigger: "computed on demand by GET /localization-orders/{orderId}/invoice"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The surcharge is keyed on the bare subtotal, the
      # volume-discount tier is keyed on the POST-surcharge, PRE-discount total, and the
      # discount is applied last. The dependency looks circular (the discount tier depends
      # on a total that already carries the surcharge, and the surcharge percentage is
      # itself chosen from the order tier) - these five steps resolve it.
      step 1: recorded_subtotal_cents  = sum(RecordingSession.session_cost_cents
                                             over sessions of this order with status == COMPLETED)
      step 2: rush_surcharge_cents     = round_half_up(recorded_subtotal_cents * RUSH_PCT[LocalizationOrder.priority_tier])
      step 3: pre_discount_total_cents = recorded_subtotal_cents + rush_surcharge_cents
      step 4: volume_discount_pct      = 0.08 if pre_discount_total_cents >= DISCOUNT_TIER_2_CENTS
                                         else 0.05 if pre_discount_total_cents >= DISCOUNT_TIER_1_CENTS
                                         else 0.00
      step 5: volume_discount_cents    = round_half_up(pre_discount_total_cents * volume_discount_pct)
              invoice_total_cents      = pre_discount_total_cents - volume_discount_cents
    input_set: "RecordingSession rows of this order with status == COMPLETED only. WAITLISTED, SCHEDULED, CONFIRMED, CANCELLED, NO_SHOW and IN_PROGRESS sessions are excluded; retake sessions ARE included at their credited cost."
    constants:
      RUSH_PCT: { STANDARD: 0.00, EXPEDITED: 0.10, RUSH: 0.22 }
      DISCOUNT_TIER_1_CENTS: 200000
      DISCOUNT_TIER_2_CENTS: 500000
    precision: "whole cents, round_half_up at steps 2 and 5 only"
    variants: []
    note: "Worked reference: two COMPLETED sessions costing 120000 and 70000 on an EXPEDITED order. subtotal=190000; surcharge=round_half_up(19000.0)=19000; pre_discount_total=209000; 209000 >= 200000 so pct=0.05; discount=round_half_up(10450.0)=10450; invoice_total=198550. Keying the tier on the bare 190000 subtotal instead would select pct=0.00 and yield 209000 - WRONG."

  - name: adaptation_fidelity_score
    trigger: "the provisional_declared variant is stamped on every ScriptAdaptation ADAPT transition; the final_measured variant is stamped on every SUBMIT_REVIEW transition"
    algorithm: weighted_scoring
    formula: |
      tier_weight = TIER_WEIGHT[LocalizationOrder.priority_tier]

      # variant provisional_declared - uses only what the adaptor declared
      coverage        = min(1.0, ScriptAdaptation.declared_loop_count / Cut.loop_count)
      density_penalty = max(0.0, (ScriptAdaptation.declared_loop_count - Cut.loop_count) / Cut.loop_count)
      provisional_fidelity_score = round_half_up(
            (0.60 * coverage + 0.40 * (1 - min(1.0, density_penalty))) * tier_weight, 4)

      # variant final_measured - uses only what the sync pass measured
      avg_dev_ms  = ScriptAdaptation.measured_sync_deviation_ms_total / max(1, ScriptAdaptation.declared_loop_count)
      dev_ratio   = min(1.0, avg_dev_ms / PlatformSpec.max_lipsync_deviation_ms)
      over_ratio  = min(1.0, ScriptAdaptation.lines_over_deviation / max(1, ScriptAdaptation.declared_loop_count))
      final_fidelity_score = round_half_up(
            (0.55 * (1 - dev_ratio) + 0.45 * (1 - over_ratio)) * tier_weight, 4)
    input_set: "One ScriptAdaptation row joined to its LocalizationOrder, that order's Cut (for loop_count) and that order's PlatformSpec (for max_lipsync_deviation_ms). Only the current revision_round's declared and measured inputs participate."
    constants:
      TIER_WEIGHT: { STANDARD: 1.00, EXPEDITED: 0.97, RUSH: 0.94 }
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_declared
        when: "stamped into provisional_fidelity_score at the ADAPT transition, before any sync measurement exists"
        difference: "Scores loop coverage and over-writing density against Cut.loop_count only; it never reads measured_sync_deviation_ms_total or lines_over_deviation, so a perfectly-covered but badly-synced adaptation scores high here."
      - name: final_measured
        when: "stamped into final_fidelity_score at the SUBMIT_REVIEW transition and it is the ONLY variant the APPROVE gate compares against PlatformSpec.min_fidelity_score"
        difference: "Scores average sync deviation against PlatformSpec.max_lipsync_deviation_ms and the share of loops over tolerance; it never reads Cut.loop_count coverage, so the same adaptation row carries two different numbers at once."
    note: "Worked reference: Cut.loop_count=400, declared_loop_count=380, priority_tier=EXPEDITED (tier_weight 0.97), measured_sync_deviation_ms_total=22800, lines_over_deviation=38, PlatformSpec.max_lipsync_deviation_ms=120. provisional=(0.60*0.95+0.40*1.0)*0.97=0.9409; final=(0.55*0.5+0.45*0.9)*0.97=0.6596."

  - name: talent_usage_fee_cents
    trigger: "computed when a TalentPayment row is created (POST /talent-payments)"
    algorithm: waterfall_allocation
    formula: |
      base_fee_cents = sum over the assignment's RecordingSession rows with status == COMPLETED
                       and is_retake == false of
                           round_half_up(CastingAssignment.agreed_rate_cents_per_hour
                                         * RecordingSession.duration_minutes / 60)
                       (per-session rounding, then summed - retake sessions never enter the base)

      # variant BUYOUT
      usage_fee_cents = round_half_up(base_fee_cents * BUYOUT_MULTIPLIER)

      # variant RESIDUAL - waterfall over the territory scope
      ordered = TalentPayment.territory_scope sorted ascending by index in TERRITORY_ORDER
      band_pct_total = sum over i, 0-based position of each territory in `ordered`, of
                       RESIDUAL_BANDS[i] if i < 3 else RESIDUAL_TAIL_PCT
      usage_fee_cents = round_half_up(base_fee_cents * min(RESIDUAL_CAP_PCT, band_pct_total))   # a 7-territory scope reaches 1.21 and is therefore clipped to 1.20

      total_fee_cents = base_fee_cents + usage_fee_cents
    input_set: "The CastingAssignment's own RecordingSession rows with status == COMPLETED and is_retake == false. Sessions in any other status, and every retake session, are excluded. Ordering of the waterfall is by TERRITORY_ORDER index only - never by row id."
    constants:
      BUYOUT_MULTIPLIER: 1.75
      RESIDUAL_BANDS: [0.45, 0.30, 0.18]
      RESIDUAL_TAIL_PCT: 0.07
      RESIDUAL_CAP_PCT: 1.20
      TERRITORY_ORDER: [US, CA, UK, DE, FR, JP, BR, AU, ROW]
    precision: "whole cents, round_half_up once on usage_fee_cents"
    variants:
      - name: BUYOUT
        when: "CastingAssignment.usage_variant == BUYOUT - a single flat multiplier buys every territory at once"
        difference: "Ignores territory_scope entirely: the fee is base_fee_cents * 1.75 whether the scope names one territory or nine."
      - name: RESIDUAL
        when: "CastingAssignment.usage_variant == RESIDUAL - the fee is banded per territory in TERRITORY_ORDER position"
        difference: "Reads territory_scope and pays a declining band per territory (0.45/0.30/0.18/0.07-each) capped at 1.20, so a three-territory scope pays 0.93 * base while BUYOUT pays 1.75 * base on identical session data."
    note: "Worked reference: base_fee_cents=72000 (one 120-minute COMPLETED non-retake session at 36000 cents/hour). BUYOUT -> usage 126000, total 198000. RESIDUAL with territory_scope [US, DE, JP] -> bands 0.45+0.30+0.18=0.93 -> usage 66960, total 138960."

  - name: qc_pass_rate
    trigger: "stamped on every QualityReview DECIDE transition (POST /quality-reviews/{reviewId}/decide), both PASS and FAIL"
    algorithm: threshold
    formula: |
      pass_rate = round_half_up(1 - (QualityReview.defect_count / QualityReview.sampled_loop_count), 4)
      PASS is permitted only when pass_rate >= PlatformSpec.qc_pass_threshold   # INCLUSIVE
      FAIL is permitted only when the request carries at least one defect entry
    input_set: "The single QualityReview row's own sampled_loop_count (stored at START) and the defect_count supplied on DECIDE. sampled_loop_count == 0 is impossible because START refuses it."
    constants:
      MAX_RETAKE_CYCLES: 2
    precision: "4 decimal places, round_half_up"
    variants: []
    note: "Boundary reference: sampled_loop_count=200 with defect_count=20 gives pass_rate 0.9000, which PASSES a qc_pass_threshold of 0.9000 because the comparison is >=. defect_count=21 gives 0.8950 and must be refused with ERR_QC_BELOW_THRESHOLD."

  - name: mix_conformance_index
    trigger: "stamped on the MixJob STEM_CHECKED -> MIXED transition (POST /mix-jobs/{mixJobId}/mix) and cleared to null on the CONFORMED -> STEM_CHECKED regression"
    algorithm: weighted_scoring
    formula: |
      loudness_delta  = abs(MixJob.loudness_lufs - PlatformSpec.loudness_target_lufs)
      loudness_score  = max(0.0, 1 - loudness_delta / LOUDNESS_TOLERANCE_LU)
      stem_score      = 1.0 if (MixJob.me_stem_present == true
                                and MixJob.stem_layout == PlatformSpec.stem_layout) else 0.0
      character_count = count of Character rows whose title_id == the order's Cut.title_id
      recorded_count  = count of CastingAssignment rows of this order with
                        casting_status == RECORDED and superseded_by_id is null
      cast_coverage   = 0.0 if character_count == 0
                        else min(1.0, recorded_count / character_count)
      conformance_index = round_half_up(0.40 * loudness_score + 0.35 * stem_score
                                        + 0.25 * cast_coverage, 4)
      CONFORM is permitted only when conformance_index >= MIN_CONFORMANCE_INDEX   # INCLUSIVE
    input_set: "One MixJob joined to its LocalizationOrder, that order's PlatformSpec, the Character rows of the order's Cut.title_id, and the order's non-superseded CastingAssignment rows in casting_status == RECORDED."
    constants:
      LOUDNESS_TOLERANCE_LU: 2.0
      MIN_CONFORMANCE_INDEX: 0.80
    precision: "4 decimal places, round_half_up"
    variants: []
    note: "Worked reference: loudness_target -24.0, measured -24.8 -> loudness_score 0.6; me_stem_present true with matching layout -> stem_score 1.0; 2 of 2 characters RECORDED -> cast_coverage 1.0. conformance_index = 0.8400, which clears 0.80."

  - name: waitlist_promotion_selector
    trigger: "runs as cascade link 2 whenever booth time is returned to a Studio, i.e. on RecordingSession CANCELLED (from SCHEDULED or CONFIRMED) and on NO_SHOW"
    algorithm: constraint_propagation
    formula: |
      eligibility_filter (candidate set):
        RecordingSession rows R with R.studio_id == the studio that just freed time
        AND R.status == WAITLISTED
        AND R.order.status IN {CASTING, RECORDING}
        AND the studio interval [R.start_utc, R.end_utc + Studio.turnaround_buffer_minutes)
            does not intersect the interval of any session S on the same studio with
            S.status IN {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED}
        AND the talent interval [R.start_utc, R.end_utc] does not intersect the closed
            interval of any session T of the same VoiceTalent with
            T.status IN {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED}
        AND Studio.booked_minutes + R.duration_minutes <= Studio.daily_capacity_minutes
            counted over R's UTC calendar day only
      ranking_expression (ascending, first key first):
        1. PRIORITY_RANK[R.order.priority_tier]   # RUSH=0, EXPEDITED=1, STANDARD=2
        2. R.start_utc ascending
      tie_break: R.created_at ascending (never R.id)
      selection: exactly one row - the single first row after ranking - is promoted per freeing event
      empty_candidate_set_fallback: no promotion occurs; the studio simply keeps the freed minutes
                                    and no error is raised
    input_set: "WAITLISTED RecordingSession rows on the freeing studio only. Rows on other studios, rows whose order is CANCELLED/DRAFT/SCRIPT_IN_PROGRESS/MIXING/QC/DELIVERED/RECALLED, and rows that still collide are excluded."
    constants:
      PRIORITY_RANK: { RUSH: 0, EXPEDITED: 1, STANDARD: 2 }
    precision: "not applicable - selection rule"
    variants: []

  - name: order_money_conservation
    trigger: "re-asserted after every request that touches LocalizationOrder money: session COMPLETE, QC-failure cascade link 4, order RECALL and order CANCEL"
    algorithm: aggregation
    formula: |
      gross_accrued_cents == committed_cents + released_cents            # holds after EVERY request
      forward action  (RecordingSession IN_PROGRESS -> COMPLETED):
          committed_cents     += session_cost_cents
          gross_accrued_cents += session_cost_cents
          released_cents       unchanged
      compensating action (QC-failure cascade link 4 on a CastingAssignment A):
          void_cents = sum(session_cost_cents over A's RecordingSession rows with
                           status == COMPLETED and is_retake == false)
                       IF A.payment_status == ACCRUED, otherwise void_cents = 0
          committed_cents     -= void_cents
          released_cents      += void_cents
          gross_accrued_cents  unchanged
    input_set: "One LocalizationOrder and its RecordingSession rows with status == COMPLETED, partitioned by their CastingAssignment."
    constants: {}
    precision: "whole cents; no rounding occurs here - only integer movement between two buckets"
    variants: []
    note: "The conserved quantity is MONEY. A cascade that runs end to end must leave gross_accrued_cents at exactly the value it held before the compensating action."

  - name: booth_minute_conservation
    trigger: "re-asserted after every request that creates, promotes, cancels, no-shows or completes a RecordingSession"
    algorithm: aggregation
    formula: |
      Studio.booked_minutes == sum(duration_minutes over RecordingSession rows on this studio
                                   with status IN {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED})
      VoiceTalent.held_minutes == sum(duration_minutes over that talent's sessions
                                   with status IN {SCHEDULED, CONFIRMED, IN_PROGRESS})
      VoiceTalent.recorded_minutes == sum(duration_minutes over that talent's sessions
                                   with status == COMPLETED)
      forward action  (POST /recording-sessions landing SCHEDULED):
          Studio.booked_minutes += duration_minutes; VoiceTalent.held_minutes += duration_minutes
      compensating action (POST /recording-sessions/{sessionId}/cancel from SCHEDULED or CONFIRMED):
          Studio.booked_minutes -= duration_minutes; VoiceTalent.held_minutes -= duration_minutes
      => a create followed by its cancel restores BOTH counters to their exact pre-create values,
         even when the cancel additionally promotes a waitlisted row (the promotion adds the
         promoted row's own duration_minutes, never the cancelled row's).
    input_set: "One Studio and one VoiceTalent with all of their RecordingSession rows in the listed statuses. WAITLISTED, CANCELLED and NO_SHOW rows contribute zero to every counter."
    constants: {}
    precision: "whole minutes; no rounding"
    variants: []
    note: "The conserved quantity is BOOTH TIME (minutes of resource occupancy), a different kind of quantity from the money conserved by order_money_conservation."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first failing rule determines the response and no later rule runs)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the acting role is listed in the endpoint's roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "when the acting role is VoiceTalentUser, the acting X-User-ID equals CastingAssignment.talent_id of the targeted assignment"
    error_id: ERR_TALENT_NOT_OWNER
    http_status: 403
    applies_to: "POST /casting-assignments/{assignmentId}/respond-hold"
  - priority: 5
    category: auth
    check: "when deciding a QualityReview, the acting X-User-ID equals QualityReview.reviewer_user_id stamped at START"
    error_id: ERR_REVIEWER_MISMATCH
    http_status: 403
    applies_to: "POST /quality-reviews/{reviewId}/decide"
  - priority: 6
    category: existence
    check: "every id in the URL path resolves to a stored row, validated left to right"
    error_id: "ERR_TITLE_NOT_FOUND | ERR_CUT_NOT_FOUND | ERR_CHARACTER_NOT_FOUND | ERR_PLATFORM_SPEC_NOT_FOUND | ERR_TALENT_NOT_FOUND | ERR_STUDIO_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ADAPTATION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_MIX_JOB_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_RETAKE_ITEM_NOT_FOUND | ERR_PAYMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row, validated in the order the endpoint's input list declares them"
    error_id: "ERR_TITLE_NOT_FOUND | ERR_CUT_NOT_FOUND | ERR_CHARACTER_NOT_FOUND | ERR_PLATFORM_SPEC_NOT_FOUND | ERR_TALENT_NOT_FOUND | ERR_STUDIO_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_MIX_JOB_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints that accept a foreign key in the body"
  - priority: 8
    category: business_constraint
    check: "every required body field is present, every value matches its declared type, and every enum value is a declared member; numeric ranges (>= 1, >= 0, 0.0-1.0) hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 9
    category: business_constraint
    check: "pagination limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 10
    category: state
    check: "the LocalizationOrder that owns the target row is not in {DELIVERED, RECALLED, CANCELLED} for any operation that mutates script, casting, sessions or payments"
    error_id: ERR_ORDER_LOCKED
    http_status: 409
    applies_to: "POST /script-adaptations, all /script-adaptations/{id}/* actions, POST /casting-assignments, all /casting-assignments/{id}/* actions, POST /recording-sessions, all /recording-sessions/{id}/* actions, POST /mix-jobs, POST /talent-payments"
  - priority: 11
    category: state
    check: "the target row is in a state from which this transition is declared in the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 12
    category: state
    check: "expected_order_version equals LocalizationOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /casting-assignments"
  - priority: 13
    category: state
    check: "expected_parent_cut_version equals the parent Cut.version"
    error_id: ERR_STALE_CUT_VERSION
    http_status: 412
    applies_to: "POST /cuts/{cutId}/derive"
  - priority: 14
    category: business_safety
    check: "the acting X-User-ID differs from ScriptAdaptation.adapted_by_user_id when reviewing a script, and differs from ScriptAdaptation.reviewed_by_user_id when starting a QualityReview on the same order"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /script-adaptations/{adaptationId}/review, POST /quality-reviews/{reviewId}/start"
  - priority: 15
    category: business_safety
    check: "the VoiceTalent's licensed_territories contains the LocalizationOrder.territory, and for a TalentPayment the supplied territory_scope is a subset of licensed_territories and contains the order's territory"
    error_id: ERR_TERRITORY_NOT_LICENSED
    http_status: 422
    applies_to: "POST /casting-assignments, POST /talent-payments"
  - priority: 16
    category: business_safety
    check: "the VoiceTalent.status == ACTIVE when a new CastingAssignment is created"
    error_id: ERR_TALENT_SUSPENDED
    http_status: 409
    applies_to: "POST /casting-assignments"
  - priority: 17
    category: business_safety
    check: "the VoiceTalent.language_code equals LocalizationOrder.target_language"
    error_id: ERR_TALENT_LANGUAGE_MISMATCH
    http_status: 422
    applies_to: "POST /casting-assignments"
  - priority: 18
    category: business_referential
    check: "LocalizationOrder.target_language differs from the Title.source_language reached through the order's Cut"
    error_id: ERR_SAME_LANGUAGE
    http_status: 422
    applies_to: "POST /localization-orders"
  - priority: 19
    category: business_referential
    check: "the Character.title_id equals the Cut.title_id of the order's cut"
    error_id: ERR_CHARACTER_TITLE_MISMATCH
    http_status: 422
    applies_to: "POST /casting-assignments"
  - priority: 20
    category: business_referential
    check: "the RecordingSession's casting_assignment_id belongs to the same LocalizationOrder as its order_id, and the MixJob's / QualityReview's mix_job_id belongs to the same order"
    error_id: ERR_CROSS_ORDER_REFERENCE
    http_status: 422
    applies_to: "POST /recording-sessions, POST /quality-reviews"
  - priority: 21
    category: business_referential
    check: "MixJob.stem_layout equals PlatformSpec.stem_layout and MixJob.me_stem_present is true"
    error_id: ERR_STEM_LAYOUT_MISMATCH
    http_status: 422
    applies_to: "POST /mix-jobs/{mixJobId}/stem-check"
  - priority: 22
    category: business_constraint
    check: "the Cut named by a new LocalizationOrder has status == LOCKED"
    error_id: ERR_CUT_NOT_LOCKED
    http_status: 409
    applies_to: "POST /localization-orders"
  - priority: 23
    category: business_constraint
    check: "the parent Cut of a derive call has lineage_depth < MAX_LINEAGE_DEPTH (3)"
    error_id: ERR_LINEAGE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /cuts/{cutId}/derive"
  - priority: 24
    category: business_constraint
    check: "CastingAssignment.agreed_rate_cents_per_hour >= VoiceTalent.base_rate_cents_per_hour"
    error_id: ERR_RATE_BELOW_TALENT_FLOOR
    http_status: 422
    applies_to: "POST /casting-assignments"
  - priority: 25
    category: business_constraint
    check: "no other non-superseded CastingAssignment of this order in {PROPOSED, HOLD_REQUESTED, HELD, CONFIRMED, RECORDED} already names the same talent_id for a different character on an overlapping order"
    error_id: ERR_DUPLICATE_CASTING
    http_status: 409
    applies_to: "POST /casting-assignments"
  - priority: 26
    category: business_constraint
    check: "the order's ScriptAdaptation exists and has status == APPROVED before a RecordingSession may be confirmed"
    error_id: ERR_ADAPTATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /recording-sessions/{sessionId}/confirm"
  - priority: 27
    category: business_constraint
    check: "the order has at least one non-superseded CastingAssignment in casting_status == RECORDED before a MixJob may be created"
    error_id: ERR_NO_RECORDED_CAST
    http_status: 409
    applies_to: "POST /mix-jobs"
  - priority: 28
    category: business_constraint
    check: "every non-superseded CastingAssignment of the order in {PROPOSED, HOLD_REQUESTED, HELD, CONFIRMED, RECORDED} has casting_status == RECORDED before the mix may be printed"
    error_id: ERR_CAST_NOT_FULLY_RECORDED
    http_status: 409
    applies_to: "POST /mix-jobs/{mixJobId}/mix"
  - priority: 29
    category: business_constraint
    check: "ScriptAdaptation.final_fidelity_score >= PlatformSpec.min_fidelity_score (inclusive) when the review decision is APPROVE"
    error_id: ERR_FIDELITY_BELOW_SPEC
    http_status: 409
    applies_to: "POST /script-adaptations/{adaptationId}/review"
  - priority: 30
    category: business_constraint
    check: "MixJob.conformance_index >= 0.80 (inclusive) when conforming"
    error_id: ERR_CONFORMANCE_BELOW_MIN
    http_status: 409
    applies_to: "POST /mix-jobs/{mixJobId}/conform"
  - priority: 31
    category: business_constraint
    check: "QualityReview.sampled_loop_count supplied on START is >= 1"
    error_id: ERR_EMPTY_QC_SAMPLE
    http_status: 422
    applies_to: "POST /quality-reviews/{reviewId}/start"
  - priority: 32
    category: business_constraint
    check: "calculations.qc_pass_rate result >= PlatformSpec.qc_pass_threshold (inclusive) when the decision is PASS; and defects[] is non-empty when the decision is FAIL"
    error_id: ERR_QC_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /quality-reviews/{reviewId}/decide"
  - priority: 33
    category: business_constraint
    check: "RetakeItem.defect_category != LIPSYNC when a reviewer waives it"
    error_id: ERR_RETAKE_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /retake-items/{retakeItemId}/waive"
  - priority: 34
    category: business_constraint
    check: "every RetakeItem of the review has status IN {RECORDED, WAIVED} before the review may re-enter IN_REVIEW"
    error_id: ERR_OPEN_RETAKES
    http_status: 409
    applies_to: "POST /quality-reviews/{reviewId}/start"
  - priority: 35
    category: business_constraint
    check: "LocalizationOrder.retake_cycles < MAX_RETAKE_CYCLES (2) when a QualityReview decision is FAIL"
    error_id: ERR_RETAKE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /quality-reviews/{reviewId}/decide"
  - priority: 36
    category: business_constraint
    check: "every key in PlatformSpec.metadata_fields_required is present and non-empty in the supplied metadata_locale_fields"
    error_id: ERR_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /localization-orders/{orderId}/deliver"
  - priority: 37
    category: business_temporal
    check: "the Studio.status == ACTIVE when a session is booked on it or confirmed"
    error_id: ERR_STUDIO_UNAVAILABLE
    http_status: 409
    applies_to: "POST /recording-sessions, POST /recording-sessions/{sessionId}/confirm"
  - priority: 38
    category: business_temporal
    check: "RecordingSession.start_utc is strictly before end_utc, both are whole-minute aligned, and start_utc is at or after the current logical clock"
    error_id: ERR_SESSION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /recording-sessions"
  - priority: 39
    category: business_temporal
    check: "the studio interval [start_utc, end_utc + Studio.turnaround_buffer_minutes) does not intersect the same-buffered interval of any session on that studio in {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED} (half-open, trailing buffer)"
    error_id: ERR_STUDIO_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /recording-sessions when on_conflict == REJECT"
  - priority: 40
    category: business_temporal
    check: "Studio.booked_minutes for the requested UTC calendar day plus the new duration_minutes <= Studio.daily_capacity_minutes"
    error_id: ERR_STUDIO_DAILY_CAPACITY
    http_status: 409
    applies_to: "POST /recording-sessions when on_conflict == REJECT"
  - priority: 41
    category: business_temporal
    check: "the talent interval [start_utc, end_utc] does not intersect the CLOSED interval of any other session of the same VoiceTalent in {SCHEDULED, CONFIRMED, IN_PROGRESS, COMPLETED}; touching endpoints DO collide"
    error_id: ERR_TALENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /recording-sessions (regardless of on_conflict)"
  - priority: 42
    category: business_temporal
    check: "the talent's recorded plus held minutes on the requested UTC calendar day plus the new duration_minutes <= VoiceTalent.max_daily_recorded_minutes"
    error_id: ERR_TALENT_DAILY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /recording-sessions (regardless of on_conflict)"
  - priority: 43
    category: business_fiscal
    check: "LocalizationOrder.committed_cents + the restamped session_cost_cents <= LocalizationOrder.budget_cap_cents (equality is allowed)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /recording-sessions/{sessionId}/complete"
  - priority: 44
    category: business_fiscal
    check: "the TalentPayment is in status ACCRUED and has not already been settled"
    error_id: ERR_PAYMENT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /talent-payments/{paymentId}/settle"
  - priority: 45
    category: business_fiscal
    check: "the CastingAssignment has no ACCRUED TalentPayment when a new payment is created"
    error_id: ERR_PAYMENT_ALREADY_ACCRUED
    http_status: 409
    applies_to: "POST /talent-payments"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/titles"
    description: "Register a property in the vendor catalogue"
    roles: [ProductionCoordinator]
    code: 201
    input: ["title_code", "source_language", "runtime_seconds", "content_rating?"]
    output: Title
    side_effects: ["creates Title with cut_count = 0"]
  - method: GET
    path: "/titles/{titleId}"
    description: "Read one title"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: POST
    path: "/cuts"
    description: "Create a root cut of a title (no lineage parent)"
    roles: [ProductionCoordinator]
    code: 201
    input: ["title_id", "cut_code", "loop_count", "runtime_seconds"]
    output: Cut
    side_effects:
      - "creates Cut with status = OPEN, derived_from_cut_id = null, lineage_depth = 0, conform_delta_seconds = 0"
      - "increments Title.cut_count by 1"
  - method: POST
    path: "/cuts/{cutId}/derive"
    description: "Branch a new cut off an existing cut, carrying its lineage"
    roles: [ProductionCoordinator]
    code: 201
    input: ["cut_code", "loop_count", "runtime_seconds", "expected_parent_cut_version"]
    output: Cut
    side_effects:
      - "creates Cut with derived_from_cut_id = the path cut, lineage_depth = parent.lineage_depth + 1, conform_delta_seconds = runtime_seconds - parent.runtime_seconds, status = OPEN"
      - "increments the parent Cut.derived_cut_count by 1"
      - "increments Cut.version by 1 on the parent cut"
      - "increments Title.cut_count by 1"
  - method: POST
    path: "/cuts/{cutId}/lock"
    description: "Freeze a cut's conform data so orders may be raised against it"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: Cut
    side_effects: ["Cut OPEN -> LOCKED", "increments Cut.version by 1"]
  - method: GET
    path: "/cuts/{cutId}"
    description: "Read one cut"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Cut
    side_effects: []
  - method: GET
    path: "/cuts"
    description: "List cuts, filterable by title and by lineage parent"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["title_id?", "derived_from_cut_id?", "status?", "limit?", "offset?"]
    output: Cut[]
    side_effects: []

  - method: POST
    path: "/characters"
    description: "Register a character of a title"
    roles: [ProductionCoordinator]
    code: 201
    input: ["title_id", "character_code", "loop_count", "screen_time_seconds", "is_principal?"]
    output: Character
    side_effects: ["creates Character"]
  - method: GET
    path: "/characters/{characterId}"
    description: "Read one character"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Character
    side_effects: []
  - method: GET
    path: "/characters"
    description: "List characters, filterable by title"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["title_id?", "limit?", "offset?"]
    output: Character[]
    side_effects: []

  - method: POST
    path: "/platform-specs"
    description: "Register a delivery specification for a platform"
    roles: [ProductionCoordinator]
    code: 201
    input: ["platform_code", "loudness_target_lufs", "stem_layout", "max_lipsync_deviation_ms", "min_fidelity_score", "qc_pass_threshold", "metadata_fields_required"]
    output: PlatformSpec
    side_effects: ["creates PlatformSpec"]
  - method: GET
    path: "/platform-specs/{platformSpecId}"
    description: "Read one platform spec"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: PlatformSpec
    side_effects: []

  - method: POST
    path: "/voice-talents"
    description: "Register a voice talent with language and territory rights"
    roles: [CastingDirector]
    code: 201
    input: ["full_name", "language_code", "base_rate_cents_per_hour", "licensed_territories", "union_status?", "max_daily_recorded_minutes?"]
    output: VoiceTalent
    side_effects: ["creates VoiceTalent with status = ACTIVE, held_minutes = 0, recorded_minutes = 0"]
  - method: GET
    path: "/voice-talents/{talentId}"
    description: "Read one voice talent including live booth-minute counters"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: VoiceTalent
    side_effects: []
  - method: POST
    path: "/voice-talents/{talentId}/set-status"
    description: "Suspend or reinstate a talent"
    roles: [CastingDirector]
    code: 200
    input: ["to_status"]
    output: VoiceTalent
    side_effects: ["VoiceTalent ACTIVE <-> SUSPENDED", "increments VoiceTalent.version by 1"]

  - method: POST
    path: "/studios"
    description: "Register a recording room"
    roles: [ProductionCoordinator]
    code: 201
    input: ["name", "territory", "hourly_rate_cents", "turnaround_buffer_minutes?", "daily_capacity_minutes?"]
    output: Studio
    side_effects: ["creates Studio with status = ACTIVE, booked_minutes = 0"]
  - method: GET
    path: "/studios/{studioId}"
    description: "Read one studio including its live booked_minutes counter"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Studio
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/set-status"
    description: "Take a room in or out of maintenance"
    roles: [ProductionCoordinator]
    code: 200
    input: ["to_status"]
    output: Studio
    side_effects: ["Studio ACTIVE <-> MAINTENANCE", "increments Studio.version by 1"]

  - method: POST
    path: "/localization-orders"
    description: "Raise a localization order for one cut into one target language and territory"
    roles: [ProductionCoordinator]
    code: 201
    input: ["cut_id", "platform_spec_id", "target_language", "territory", "budget_cap_cents", "priority_tier?"]
    output: LocalizationOrder
    side_effects: ["creates LocalizationOrder in status DRAFT with committed_cents = 0, released_cents = 0, gross_accrued_cents = 0, retake_cycles = 0"]
  - method: GET
    path: "/localization-orders/{orderId}"
    description: "Read one order including its money counters and version"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: LocalizationOrder
    side_effects: []
  - method: GET
    path: "/localization-orders"
    description: "List orders, filterable by cut and platform spec"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["cut_id?", "platform_spec_id?", "status?", "limit?", "offset?"]
    output: LocalizationOrder[]
    side_effects: []
  - method: GET
    path: "/localization-orders/{orderId}/invoice"
    description: "Computed read of calculations.order_invoice_total_cents for this order"
    roles: [ProductionCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: "{ order_id: string, recorded_subtotal_cents: integer, rush_surcharge_cents: integer, pre_discount_total_cents: integer, volume_discount_pct: number, volume_discount_cents: integer, invoice_total_cents: integer }"
    side_effects: []
  - method: POST
    path: "/localization-orders/{orderId}/deliver"
    description: "Deliver the passed order with its localized metadata"
    roles: [ProductionCoordinator]
    code: 200
    input: ["metadata_locale_fields"]
    output: LocalizationOrder
    side_effects: ["LocalizationOrder QC -> DELIVERED", "stores metadata_locale_fields", "stamps delivered_at", "increments LocalizationOrder.version by 1"]
  - method: POST
    path: "/localization-orders/{orderId}/recall"
    description: "Recall a delivered order for re-mix"
    roles: [ProductionCoordinator]
    code: 200
    input: ["reason?"]
    output: LocalizationOrder
    side_effects:
      - "LocalizationOrder DELIVERED -> RECALLED"
      - "moves committed_cents into released_cents, gross_accrued_cents unchanged"
      - "sets the newest MixJob CONFORMED -> SUPERSEDED"
      - "increments LocalizationOrder.version by 1"
  - method: POST
    path: "/localization-orders/{orderId}/cancel"
    description: "Cancel a non-delivered order and release everything it holds"
    roles: [ProductionCoordinator]
    code: 200
    input: ["reason?"]
    output: LocalizationOrder
    side_effects:
      - "LocalizationOrder -> CANCELLED"
      - "cancels every WAITLISTED/SCHEDULED/CONFIRMED RecordingSession of the order and returns their minutes to Studio.booked_minutes and VoiceTalent.held_minutes"
      - "moves committed_cents into released_cents"
      - "increments LocalizationOrder.version by 1"

  - method: POST
    path: "/script-adaptations"
    description: "Open the script workstream for a DRAFT order"
    roles: [Adaptor]
    code: 201
    input: ["order_id"]
    output: ScriptAdaptation
    side_effects: ["creates ScriptAdaptation in status DRAFT with revision_round = 1", "cascades LocalizationOrder DRAFT -> SCRIPT_IN_PROGRESS"]
  - method: GET
    path: "/script-adaptations/{adaptationId}"
    description: "Read one adaptation including both fidelity scores"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ScriptAdaptation
    side_effects: []
  - method: GET
    path: "/script-adaptations"
    description: "List adaptations, filterable by order"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: ScriptAdaptation[]
    side_effects: []
  - method: POST
    path: "/script-adaptations/{adaptationId}/translate"
    description: "Record the raw translation pass"
    roles: [Adaptor]
    code: 200
    input: []
    output: ScriptAdaptation
    side_effects: ["ScriptAdaptation DRAFT -> TRANSLATED", "increments ScriptAdaptation.version by 1"]
  - method: POST
    path: "/script-adaptations/{adaptationId}/adapt"
    description: "Record the lip-sync adaptation pass and stamp the provisional fidelity score"
    roles: [Adaptor]
    code: 200
    input: ["declared_loop_count"]
    output: ScriptAdaptation
    side_effects:
      - "ScriptAdaptation TRANSLATED -> ADAPTED, or REVISION_REQUESTED -> ADAPTED with revision_round incremented"
      - "stamps adapted_by_user_id with the acting X-User-ID"
      - "recomputes provisional_fidelity_score per calculations.adaptation_fidelity_score"
      - "increments ScriptAdaptation.version by 1"
  - method: POST
    path: "/script-adaptations/{adaptationId}/submit-review"
    description: "Attach the measured sync data and hand the adaptation to a native reviewer"
    roles: [Adaptor]
    code: 200
    input: ["measured_sync_deviation_ms_total", "lines_over_deviation"]
    output: ScriptAdaptation
    side_effects:
      - "ScriptAdaptation ADAPTED -> IN_REVIEW"
      - "recomputes final_fidelity_score per calculations.adaptation_fidelity_score"
      - "cascades LocalizationOrder SCRIPT_IN_PROGRESS -> CASTING on the first submission"
      - "increments ScriptAdaptation.version by 1"
  - method: POST
    path: "/script-adaptations/{adaptationId}/review"
    description: "Native reviewer approves the adaptation or sends it back for revision"
    roles: [NativeReviewer]
    code: 200
    input: ["decision", "notes?"]
    output: ScriptAdaptation
    side_effects:
      - "ScriptAdaptation IN_REVIEW -> APPROVED or IN_REVIEW -> REVISION_REQUESTED"
      - "stamps reviewed_by_user_id with the acting X-User-ID"
      - "increments ScriptAdaptation.version by 1"

  - method: POST
    path: "/casting-assignments"
    description: "Cast a talent into a character on an order; re-casting the same character supersedes the previous assignment"
    roles: [CastingDirector]
    code: 201
    input: ["order_id", "character_id", "talent_id", "usage_variant", "agreed_rate_cents_per_hour", "expected_order_version"]
    output: CastingAssignment
    side_effects:
      - "creates CastingAssignment with casting_status = PROPOSED and payment_status = UNBILLED"
      - "if a non-superseded assignment already exists for the same (order_id, character_id), sets that row's superseded_by_id and moves its casting_status to RELEASED"
      - "increments LocalizationOrder.version by 1"
  - method: GET
    path: "/casting-assignments/{assignmentId}"
    description: "Read one casting assignment with both state dimensions"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: CastingAssignment
    side_effects: []
  - method: GET
    path: "/casting-assignments"
    description: "List casting assignments, filterable by order, character, talent and supersede pointer"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["order_id?", "character_id?", "talent_id?", "superseded_by_id?", "casting_status?", "payment_status?", "limit?", "offset?"]
    output: CastingAssignment[]
    side_effects: []
  - method: POST
    path: "/casting-assignments/{assignmentId}/request-hold"
    description: "Ask the talent to hold dates for this role"
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingAssignment
    side_effects: ["CastingAssignment PROPOSED -> HOLD_REQUESTED", "increments CastingAssignment.version by 1"]
  - method: POST
    path: "/casting-assignments/{assignmentId}/respond-hold"
    description: "Talent accepts or declines the hold"
    roles: [VoiceTalentUser]
    code: 200
    input: ["response"]
    output: CastingAssignment
    side_effects: ["CastingAssignment HOLD_REQUESTED -> HELD or HOLD_REQUESTED -> DECLINED", "increments CastingAssignment.version by 1"]
  - method: POST
    path: "/casting-assignments/{assignmentId}/confirm"
    description: "Confirm the deal so the talent can be booked into sessions"
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingAssignment
    side_effects: ["CastingAssignment HELD -> CONFIRMED", "increments CastingAssignment.version by 1"]
  - method: POST
    path: "/casting-assignments/{assignmentId}/release"
    description: "Drop a casting assignment that has no live bookings"
    roles: [CastingDirector]
    code: 200
    input: []
    output: CastingAssignment
    side_effects: ["CastingAssignment -> RELEASED", "increments CastingAssignment.version by 1"]

  - method: POST
    path: "/recording-sessions"
    description: "Book a booth slot; on_conflict decides whether a studio collision is rejected or waitlisted (default REJECT)"
    roles: [ProductionCoordinator]
    code: 201
    input: ["order_id", "studio_id", "casting_assignment_id", "start_utc", "end_utc", "is_retake?", "on_conflict?"]
    output: RecordingSession
    side_effects:
      - "creates RecordingSession in status SCHEDULED when the studio interval is clear, otherwise in WAITLISTED with waitlisted_reason set when on_conflict == WAITLIST"
      - "a SCHEDULED row adds duration_minutes to Studio.booked_minutes and VoiceTalent.held_minutes; a WAITLISTED row adds nothing"
      - "stamps the provisional session_cost_cents"
      - "if the row is SCHEDULED and the order is CASTING, cascades LocalizationOrder CASTING -> RECORDING"
  - method: GET
    path: "/recording-sessions/{sessionId}"
    description: "Read one session"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: RecordingSession
    side_effects: []
  - method: GET
    path: "/recording-sessions"
    description: "List sessions, filterable by order, studio and casting assignment"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["order_id?", "studio_id?", "casting_assignment_id?", "status?", "limit?", "offset?"]
    output: RecordingSession[]
    side_effects: []
  - method: POST
    path: "/recording-sessions/{sessionId}/confirm"
    description: "Lock the booth slot once the script is approved and the deal is confirmed"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: RecordingSession
    side_effects: ["RecordingSession SCHEDULED -> CONFIRMED", "increments RecordingSession.version by 1"]
  - method: POST
    path: "/recording-sessions/{sessionId}/start"
    description: "Open the booth; only valid once the logical clock reaches start_utc"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: RecordingSession
    side_effects: ["RecordingSession CONFIRMED -> IN_PROGRESS", "increments RecordingSession.version by 1"]
  - method: POST
    path: "/recording-sessions/{sessionId}/complete"
    description: "Close the booth, restamp the cost, accrue money and advance the assignment"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: RecordingSession
    side_effects:
      - "RecordingSession IN_PROGRESS -> COMPLETED"
      - "restamps session_cost_cents per calculations.session_cost_cents"
      - "adds session_cost_cents to LocalizationOrder.committed_cents and gross_accrued_cents"
      - "moves duration_minutes from VoiceTalent.held_minutes to VoiceTalent.recorded_minutes"
      - "advances CastingAssignment CONFIRMED -> RECORDED and closes matching OPEN RetakeItems when is_retake is true"
      - "increments RecordingSession.version by 1"
  - method: POST
    path: "/recording-sessions/{sessionId}/cancel"
    description: "Release a booth slot and run the waitlist promotion selector"
    roles: [ProductionCoordinator]
    code: 200
    input: ["reason?"]
    output: RecordingSession
    side_effects:
      - "RecordingSession WAITLISTED/SCHEDULED/CONFIRMED -> CANCELLED"
      - "returns duration_minutes to Studio.booked_minutes and VoiceTalent.held_minutes unless the row was WAITLISTED"
      - "runs calculations.waitlist_promotion_selector and promotes at most one WAITLISTED row on that studio"
      - "increments RecordingSession.version by 1"
  - method: POST
    path: "/recording-sessions/{sessionId}/no-show"
    description: "Mark a confirmed slot as a talent no-show: minutes return, no money accrues"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: RecordingSession
    side_effects:
      - "RecordingSession CONFIRMED -> NO_SHOW"
      - "returns duration_minutes to Studio.booked_minutes and VoiceTalent.held_minutes"
      - "books no money and leaves the CastingAssignment untouched"
      - "runs calculations.waitlist_promotion_selector on that studio"
      - "increments RecordingSession.version by 1"

  - method: POST
    path: "/mix-jobs"
    description: "Open a mix and M&E stem job for an order whose cast is recorded"
    roles: [MixEngineer]
    code: 201
    input: ["order_id", "stem_layout", "me_stem_present"]
    output: MixJob
    side_effects: ["creates MixJob in status QUEUED with mix_round = 1"]
  - method: GET
    path: "/mix-jobs/{mixJobId}"
    description: "Read one mix job including its conformance index"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: MixJob
    side_effects: []
  - method: GET
    path: "/mix-jobs"
    description: "List mix jobs, filterable by order"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: MixJob[]
    side_effects: []
  - method: POST
    path: "/mix-jobs/{mixJobId}/stem-check"
    description: "Verify the supplied M&E stem against the platform spec layout"
    roles: [MixEngineer]
    code: 200
    input: []
    output: MixJob
    side_effects: ["MixJob QUEUED -> STEM_CHECKED", "increments MixJob.version by 1"]
  - method: POST
    path: "/mix-jobs/{mixJobId}/mix"
    description: "Deliver the mix measurement and stamp the conformance index"
    roles: [MixEngineer]
    code: 200
    input: ["loudness_lufs"]
    output: MixJob
    side_effects:
      - "MixJob STEM_CHECKED -> MIXED"
      - "recomputes conformance_index per calculations.mix_conformance_index"
      - "cascades LocalizationOrder RECORDING -> MIXING or RECALLED -> MIXING"
      - "increments MixJob.version by 1"
  - method: POST
    path: "/mix-jobs/{mixJobId}/conform"
    description: "Conform the mix to the deliverable spec and hand the order to QC"
    roles: [MixEngineer]
    code: 200
    input: []
    output: MixJob
    side_effects: ["MixJob MIXED -> CONFORMED", "cascades LocalizationOrder MIXING -> QC", "increments MixJob.version by 1"]

  - method: POST
    path: "/quality-reviews"
    description: "Open a native-reviewer QC pass over a conformed mix"
    roles: [NativeReviewer]
    code: 201
    input: ["order_id", "mix_job_id"]
    output: QualityReview
    side_effects: ["creates QualityReview in status PENDING with round_number = 1"]
  - method: GET
    path: "/quality-reviews/{reviewId}"
    description: "Read one quality review including its pass rate"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: QualityReview
    side_effects: []
  - method: GET
    path: "/quality-reviews"
    description: "List quality reviews, filterable by order and mix job"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["order_id?", "mix_job_id?", "status?", "limit?", "offset?"]
    output: QualityReview[]
    side_effects: []
  - method: POST
    path: "/quality-reviews/{reviewId}/start"
    description: "Start (or restart, after retakes) a review round with a sample size"
    roles: [NativeReviewer]
    code: 200
    input: ["sampled_loop_count"]
    output: QualityReview
    side_effects: ["QualityReview PENDING -> IN_REVIEW, or FAILED_RETAKE -> IN_REVIEW with round_number incremented", "stamps reviewer_user_id", "increments QualityReview.version by 1"]
  - method: POST
    path: "/quality-reviews/{reviewId}/decide"
    description: "Record the round's defect count and pass or fail the mix; FAIL raises retake items and drives the four-link regression cascade"
    roles: [NativeReviewer]
    code: 200
    input: ["decision", "defect_count", "defects?"]
    output: QualityReview
    side_effects:
      - "stamps pass_rate per calculations.qc_pass_rate"
      - "QualityReview IN_REVIEW -> PASSED or IN_REVIEW -> FAILED_RETAKE"
      - "on FAIL creates one RetakeItem per defects[] entry in status OPEN (link 1), regresses the newest MixJob CONFORMED -> STEM_CHECKED (link 2), regresses LocalizationOrder QC -> RECORDING with retake_cycles incremented (link 3), and regresses every named CastingAssignment RECORDED -> CONFIRMED, voiding its TalentPayment and moving its money from committed_cents to released_cents only when that payment_status is ACCRUED (link 4)"
      - "increments QualityReview.version by 1"

  - method: GET
    path: "/retake-items/{retakeItemId}"
    description: "Read one retake item"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: RetakeItem
    side_effects: []
  - method: GET
    path: "/retake-items"
    description: "List retake items, filterable by review and by casting assignment; the only discovery channel for cascade-created retakes"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["quality_review_id?", "casting_assignment_id?", "status?", "limit?", "offset?"]
    output: RetakeItem[]
    side_effects: []
  - method: POST
    path: "/retake-items/{retakeItemId}/waive"
    description: "Reviewer waives a non-lipsync retake item"
    roles: [NativeReviewer]
    code: 200
    input: []
    output: RetakeItem
    side_effects: ["RetakeItem OPEN -> WAIVED", "increments RetakeItem.version by 1"]

  - method: POST
    path: "/talent-payments"
    description: "Accrue the talent fee for a recorded assignment under its usage variant and territory scope"
    roles: [PlatformAdmin]
    code: 201
    input: ["casting_assignment_id", "territory_scope"]
    output: TalentPayment
    side_effects:
      - "creates TalentPayment in status ACCRUED with variant copied from CastingAssignment.usage_variant"
      - "computes base_fee_cents, usage_fee_cents and total_fee_cents per calculations.talent_usage_fee_cents"
      - "advances the CastingAssignment payment dimension UNBILLED -> ACCRUED or VOIDED -> ACCRUED"
  - method: GET
    path: "/talent-payments/{paymentId}"
    description: "Read one talent payment"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: TalentPayment
    side_effects: []
  - method: GET
    path: "/talent-payments"
    description: "List talent payments, filterable by casting assignment and by talent"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: ["casting_assignment_id?", "talent_id?", "status?", "limit?", "offset?"]
    output: TalentPayment[]
    side_effects: []
  - method: POST
    path: "/talent-payments/{paymentId}/settle"
    description: "Settle an accrued talent payment once the order's newest review passed"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TalentPayment
    side_effects: ["TalentPayment ACCRUED -> SETTLED", "stamps settled_at", "advances the CastingAssignment payment dimension ACCRUED -> SETTLED", "increments TalentPayment.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock; no entity is mutated and no scheduled action fires on its own"]
  - method: GET
    path: "/_clock"
    description: "Test-driving endpoint: read the server's logical clock (default 2026-08-01T00:00:00Z)"
    roles: [ProductionCoordinator, Adaptor, NativeReviewer, CastingDirector, VoiceTalentUser, MixEngineer, PlatformAdmin]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or the role is not one of the seven declared roles"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_TALENT_NOT_OWNER
    http: 403
    condition: "A VoiceTalentUser responds to a hold on a CastingAssignment whose talent_id is not the acting X-User-ID"
  - id: ERR_REVIEWER_MISMATCH
    http: 403
    condition: "A NativeReviewer decides a QualityReview started by a different reviewer_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewer of a ScriptAdaptation is the same X-User-ID that adapted it, or the QC reviewer is the same X-User-ID that reviewed the script"
  - id: ERR_TITLE_NOT_FOUND
    http: 404
    condition: "title_id in path or body names no stored Title"
  - id: ERR_CUT_NOT_FOUND
    http: 404
    condition: "cutId in path or cut_id in body names no stored Cut"
  - id: ERR_CHARACTER_NOT_FOUND
    http: 404
    condition: "characterId in path or character_id in body names no stored Character"
  - id: ERR_PLATFORM_SPEC_NOT_FOUND
    http: 404
    condition: "platformSpecId in path or platform_spec_id in body names no stored PlatformSpec"
  - id: ERR_TALENT_NOT_FOUND
    http: 404
    condition: "talentId in path or talent_id in body names no stored VoiceTalent"
  - id: ERR_STUDIO_NOT_FOUND
    http: 404
    condition: "studioId in path or studio_id in body names no stored Studio"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "orderId in path or order_id in body names no stored LocalizationOrder"
  - id: ERR_ADAPTATION_NOT_FOUND
    http: 404
    condition: "adaptationId in path names no stored ScriptAdaptation"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId in path or casting_assignment_id in body names no stored CastingAssignment"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "sessionId in path names no stored RecordingSession"
  - id: ERR_MIX_JOB_NOT_FOUND
    http: 404
    condition: "mixJobId in path or mix_job_id in body names no stored MixJob"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "reviewId in path names no stored QualityReview"
  - id: ERR_RETAKE_ITEM_NOT_FOUND
    http: 404
    condition: "retakeItemId in path names no stored RetakeItem"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "paymentId in path names no stored TalentPayment"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required body field is missing, has the wrong type, carries an undeclared enum member, or violates a declared numeric range"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint"
  - id: ERR_ORDER_LOCKED
    http: 409
    condition: "The owning LocalizationOrder is DELIVERED, RECALLED or CANCELLED and the request would mutate its script, casting, sessions, mix or payments"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a state from which the requested transition is declared"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the current LocalizationOrder.version on POST /casting-assignments"
  - id: ERR_STALE_CUT_VERSION
    http: 412
    condition: "expected_parent_cut_version does not equal the current parent Cut.version on POST /cuts/{cutId}/derive"
  - id: ERR_TERRITORY_NOT_LICENSED
    http: 422
    condition: "The talent does not license the order's territory, or a payment's territory_scope escapes the talent's licensed_territories or omits the order's territory"
  - id: ERR_TALENT_SUSPENDED
    http: 409
    condition: "A CastingAssignment is created for a VoiceTalent whose status is SUSPENDED"
  - id: ERR_TALENT_LANGUAGE_MISMATCH
    http: 422
    condition: "VoiceTalent.language_code does not equal LocalizationOrder.target_language"
  - id: ERR_SAME_LANGUAGE
    http: 422
    condition: "An order's target_language equals the source_language of the Title behind its Cut"
  - id: ERR_CHARACTER_TITLE_MISMATCH
    http: 422
    condition: "The Character belongs to a different Title than the order's Cut"
  - id: ERR_CROSS_ORDER_REFERENCE
    http: 422
    condition: "A session's casting_assignment_id, or a review's mix_job_id, belongs to a different LocalizationOrder than the one named in the request"
  - id: ERR_STEM_LAYOUT_MISMATCH
    http: 422
    condition: "MixJob.me_stem_present is false, or MixJob.stem_layout differs from the PlatformSpec.stem_layout, at stem-check time"
  - id: ERR_CUT_NOT_LOCKED
    http: 409
    condition: "An order is raised against a Cut whose status is still OPEN"
  - id: ERR_LINEAGE_DEPTH_EXCEEDED
    http: 422
    condition: "A derive call would produce a Cut with lineage_depth above MAX_LINEAGE_DEPTH (3)"
  - id: ERR_RATE_BELOW_TALENT_FLOOR
    http: 422
    condition: "agreed_rate_cents_per_hour is below the talent's base_rate_cents_per_hour"
  - id: ERR_DUPLICATE_CASTING
    http: 409
    condition: "The same talent already holds a live non-superseded assignment for a different character on the same order"
  - id: ERR_ADAPTATION_NOT_APPROVED
    http: 409
    condition: "A session is confirmed while the order's ScriptAdaptation is missing or not APPROVED"
  - id: ERR_NO_RECORDED_CAST
    http: 409
    condition: "A MixJob is opened on an order with zero non-superseded CastingAssignment rows in casting_status RECORDED"
  - id: ERR_CAST_NOT_FULLY_RECORDED
    http: 409
    condition: "The mix is printed while at least one live non-superseded CastingAssignment of the order is not yet RECORDED"
  - id: ERR_FIDELITY_BELOW_SPEC
    http: 409
    condition: "APPROVE is attempted while final_fidelity_score is strictly below PlatformSpec.min_fidelity_score"
  - id: ERR_CONFORMANCE_BELOW_MIN
    http: 409
    condition: "CONFORM is attempted while conformance_index is strictly below 0.80"
  - id: ERR_EMPTY_QC_SAMPLE
    http: 422
    condition: "A QualityReview round is started with sampled_loop_count of 0"
  - id: ERR_QC_BELOW_THRESHOLD
    http: 409
    condition: "PASS is attempted while pass_rate is strictly below PlatformSpec.qc_pass_threshold, or FAIL is attempted with an empty defects list"
  - id: ERR_RETAKE_NOT_WAIVABLE
    http: 409
    condition: "A reviewer waives a RetakeItem whose defect_category is LIPSYNC"
  - id: ERR_OPEN_RETAKES
    http: 409
    condition: "A FAILED_RETAKE review is restarted while at least one of its RetakeItem rows is still OPEN"
  - id: ERR_RETAKE_LIMIT_EXCEEDED
    http: 409
    condition: "A FAIL decision is attempted while LocalizationOrder.retake_cycles has already reached MAX_RETAKE_CYCLES (2)"
  - id: ERR_METADATA_INCOMPLETE
    http: 422
    condition: "Delivery metadata omits or blanks a key listed in PlatformSpec.metadata_fields_required"
  - id: ERR_STUDIO_UNAVAILABLE
    http: 409
    condition: "The Studio is in MAINTENANCE when a session is booked on it or confirmed"
  - id: ERR_SESSION_WINDOW_INVALID
    http: 422
    condition: "start_utc is not strictly before end_utc, either endpoint is not whole-minute aligned, or start_utc is before the current logical clock"
  - id: ERR_STUDIO_SLOT_CONFLICT
    http: 409
    condition: "The buffered half-open studio interval collides with an existing booking on the same room and on_conflict is REJECT"
  - id: ERR_STUDIO_DAILY_CAPACITY
    http: 409
    condition: "The room's booked minutes for that UTC day would exceed daily_capacity_minutes and on_conflict is REJECT"
  - id: ERR_TALENT_DOUBLE_BOOKED
    http: 409
    condition: "The closed talent interval touches or overlaps another live session of the same talent"
  - id: ERR_TALENT_DAILY_CAP_EXCEEDED
    http: 422
    condition: "The talent's held plus recorded minutes for that UTC day would exceed max_daily_recorded_minutes"
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "Completing the session would push committed_cents strictly above budget_cap_cents"
  - id: ERR_PAYMENT_ALREADY_SETTLED
    http: 409
    condition: "A TalentPayment that is not ACCRUED is settled again"
  - id: ERR_PAYMENT_ALREADY_ACCRUED
    http: 409
    condition: "A second TalentPayment is created while the assignment already carries an ACCRUED one"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProductionCoordinator
    description: "Owns the catalogue, the calendar and the order lifecycle: titles, cuts, characters, platform specs, studios, orders, bookings and delivery"
    identity: "opaque"
    exclusive_operations:
      - "POST /titles"
      - "POST /cuts"
      - "POST /cuts/{cutId}/derive"
      - "POST /cuts/{cutId}/lock"
      - "POST /characters"
      - "POST /platform-specs"
      - "POST /studios"
      - "POST /studios/{studioId}/set-status"
      - "POST /localization-orders"
      - "POST /localization-orders/{orderId}/deliver"
      - "POST /localization-orders/{orderId}/recall"
      - "POST /localization-orders/{orderId}/cancel"
      - "POST /recording-sessions"
      - "POST /recording-sessions/{sessionId}/confirm"
      - "POST /recording-sessions/{sessionId}/start"
      - "POST /recording-sessions/{sessionId}/complete"
      - "POST /recording-sessions/{sessionId}/cancel"
      - "POST /recording-sessions/{sessionId}/no-show"
    shared_operations:
      - "GET /localization-orders/{orderId}/invoice (shared with PlatformAdmin)"
      - "all GET reads"

  - name: Adaptor
    description: "Translates and lip-sync adapts the script; may never review their own work"
    identity: "opaque"
    exclusive_operations:
      - "POST /script-adaptations"
      - "POST /script-adaptations/{adaptationId}/translate"
      - "POST /script-adaptations/{adaptationId}/adapt"
      - "POST /script-adaptations/{adaptationId}/submit-review"
    shared_operations:
      - "all GET reads"

  - name: NativeReviewer
    description: "Native-language reviewer: signs off scripts, runs QC rounds, raises and waives retakes. Segregation of duties bars the script reviewer from also running QC on the same order."
    identity: "opaque"
    exclusive_operations:
      - "POST /script-adaptations/{adaptationId}/review"
      - "POST /quality-reviews"
      - "POST /quality-reviews/{reviewId}/start"
      - "POST /quality-reviews/{reviewId}/decide"
      - "POST /retake-items/{retakeItemId}/waive"
    shared_operations:
      - "all GET reads"

  - name: CastingDirector
    description: "Owns the talent pool and casting deals"
    identity: "opaque"
    exclusive_operations:
      - "POST /voice-talents"
      - "POST /voice-talents/{talentId}/set-status"
      - "POST /casting-assignments"
      - "POST /casting-assignments/{assignmentId}/request-hold"
      - "POST /casting-assignments/{assignmentId}/confirm"
      - "POST /casting-assignments/{assignmentId}/release"
    shared_operations:
      - "all GET reads"

  - name: VoiceTalentUser
    description: "A voice talent acting on their own holds; X-User-ID is the VoiceTalent row id"
    identity: "entity_backed:VoiceTalent"
    exclusive_operations:
      - "POST /casting-assignments/{assignmentId}/respond-hold"
    shared_operations:
      - "all GET reads"

  - name: MixEngineer
    description: "Owns mix and M&E stem handling"
    identity: "opaque"
    exclusive_operations:
      - "POST /mix-jobs"
      - "POST /mix-jobs/{mixJobId}/stem-check"
      - "POST /mix-jobs/{mixJobId}/mix"
      - "POST /mix-jobs/{mixJobId}/conform"
    shared_operations:
      - "all GET reads"

  - name: PlatformAdmin
    description: "Operational back office: talent money and the test-driving logical clock. Deliberately NOT a superset - it cannot cast, book, mix or review."
    identity: "opaque"
    exclusive_operations:
      - "POST /talent-payments"
      - "POST /talent-payments/{paymentId}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /localization-orders/{orderId}/invoice (shared with ProductionCoordinator)"
      - "all GET reads"
