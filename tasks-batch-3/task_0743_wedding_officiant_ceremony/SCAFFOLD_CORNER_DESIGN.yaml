      - name: create_booking_unknown_officiant_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_OFFICIANT_NOT_FOUND]"
        distinguishing_aspect: "POST /bookings with an unknown officiant_id returns ERR_OFFICIANT_NOT_FOUND (404) (existence validated left-to-right)."
        test_recipe:
