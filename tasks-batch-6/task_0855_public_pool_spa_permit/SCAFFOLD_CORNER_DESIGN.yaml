            - "Permit.${permit_id}.fee_variant == FULL_TERM and classification_at_issue == CLASS_A_COMPETITION"
            - "Facility.${fac_id}.max_bather_load == 100 and lifeguard_required == true"
            - "Operator.${op_id}.fee_balance_cents == 77500"

