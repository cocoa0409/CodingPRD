              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 2000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
