            - call: "POST /accreditation/visits/${visit_0}/assignments"
              payload: { reviewer_id: "${rev_a}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/visits/${visit_0}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_b}", starts_on: "2027-03-05T00:00:00Z", ends_on: "2027-03-07T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_adj: $.data.id }
            - call: "POST /accreditation/visits/${visit_adj}/assignments"
              payload: { reviewer_id: "${rev_b}", role_on_team: "CHAIR" }
              as: AccreditationOfficer
            - call: "POST /accreditation/terms/${term_id}/visits"
              payload: { campus_id: "${campus_id}", lead_reviewer_id: "${rev_c}", starts_on: "2027-03-04T00:00:00Z", ends_on: "2027-03-06T00:00:00Z" }
              as: AccreditationOfficer
              captures: { visit_over: $.data.id }
