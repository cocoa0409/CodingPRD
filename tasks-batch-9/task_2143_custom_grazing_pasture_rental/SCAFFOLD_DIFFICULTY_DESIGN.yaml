            - "Pasture.${p1}.effective_assessment_id == ${a1}"
            - "Pasture.${p1}.rated_head_days == 20769"
            - "Pasture.${p1}.grazing_posture == OPEN"

      - name: contract_submit_capacity_equality_passes_and_one_head_day_over_fails
        grounds:
          - validations[priority=27]
          - errors[ERR_CAPACITY_EXCEEDED]
