scaffold_corner_design:
  # -------------------------------------------------------------------------
  # Entities
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_catalog_item_success
        claim_type: Creation
        grounds: ["entities.CatalogItem", "endpoints"]
        distinguishing_aspect: "POST /catalog with all required fields returns 201 and echoes isbn13/edition plus server-minted id and version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000100", edition: 2, title: "Algo", author: "CLRS", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "CatalogItem.${cat_id}.edition == 2"
            - "CatalogItem.${cat_id}.version == 1"

      - name: get_order_nonexistent_returns_404
        claim_type: Not Found
        grounds: ["entities.Order", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown-uuid} returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CatalogAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_order_missing_fulfillment_type_returns_400
        claim_type: Required Fields
        grounds: ["entities.Order.fields.fulfillment_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /orders without the required fulfillment_type is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A catalog item and a customer exist."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000101", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "mf@x.com", full_name: "MF" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", rental_term_days: 90 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: customer_wallet_credit_cents_computed
        claim_type: Computed Fields
        grounds: ["entities.Customer.fields.wallet_credit_cents", "calculations.wallet_balance"]
        distinguishing_aspect: "wallet_credit_cents is the exact sum of ledger rows: a single +5000 TOP_UP yields wallet_credit_cents == 5000."
        test_recipe:
          setup: ["A customer with one +5000 wallet adjustment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "wc@x.com", full_name: "WC" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 5000, kind: "TOP_UP" }
              as: CatalogAdmin
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: CatalogAdmin
              captures: { bal: "$.data.wallet_credit_cents" }
          assert:
            - "Customer.${cust_id}.wallet_credit_cents == 5000"

      - name: catalog_duplicate_edition_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_EDITION]"]
        distinguishing_aspect: "A second POST /catalog with the same (isbn13, edition) is rejected with ERR_DUPLICATE_EDITION (409)."
        test_recipe:
          setup: ["A catalog item (isbn13 9780000000102, edition 1) already exists."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000102", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000102", edition: 1, title: "T", author: "A", list_price_cents: 9900, rental_base_cents: 5000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EDITION"

      - name: order_invalid_term_for_rent_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_TERM]"]
        distinguishing_aspect: "A RENT order with rental_term_days=45 (not in {30,60,90,120}) is rejected with ERR_INVALID_TERM (422)."
        test_recipe:
          setup: ["A rentable catalog item and a customer exist."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000103", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "it@x.com", full_name: "IT" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 45 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_TERM"

  # -------------------------------------------------------------------------
  # State Machines
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: pay_already_paid_order_returns_409
        claim_type: Idempotency
        grounds: ["state_machines.Order.payment_status_UNPAID_to_PAID", "errors[ERR_ORDER_NOT_PAYABLE]"]
        distinguishing_aspect: "A second POST /orders/{id}/pay on an already-PAID order is rejected with ERR_ORDER_NOT_PAYABLE (409)."
        test_recipe:
          setup: ["A funded customer has an EBOOK order already paid (payment_status=PAID)."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000104", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000, ebook_available: true }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "pp@x.com", full_name: "PP" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "EBOOK", rental_term_days: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_PAYABLE"

      - name: cancel_confirmed_order_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.Order.fulfillment_status_PENDING_to_CANCELLED", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel is rejected once fulfillment_status has left PENDING: a CONFIRMED order returns ERR_ORDER_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["A paid RENT order has been confirmed (fulfillment_status=CONFIRMED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000105", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "cc@x.com", full_name: "CC" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: extend_closed_rental_returns_409
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Rental.ACTIVE_to_ACTIVE", "errors[ERR_RENTAL_NOT_ACTIVE]"]
        distinguishing_aspect: "Extending a rental that has closed (CLOSED_RETURNED) is rejected with ERR_RENTAL_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A rental has been returned and inspected GOOD on time (status CLOSED_RETURNED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000106", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "ec@x.com", full_name: "EC" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
          trigger:
            - call: "POST /rentals/${rental_id}/extend"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RENTAL_NOT_ACTIVE"

      - name: return_twice_returns_409
        claim_type: Invalid Transitions
        grounds: ["state_machines.Rental.ACTIVE_to_RETURN_INITIATED", "errors[ERR_RETURN_ALREADY_OPEN]"]
        distinguishing_aspect: "A second POST /rentals/{id}/return while a LABEL_ISSUED shipment is open is rejected with ERR_RETURN_ALREADY_OPEN (409)."
        test_recipe:
          setup: ["An ACTIVE rental already has one open ReturnShipment (LABEL_ISSUED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000107", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "rt@x.com", full_name: "RT" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RETURN_ALREADY_OPEN"

      - name: inspect_return_not_open_returns_409
        claim_type: Idempotency
        grounds: ["state_machines.ReturnShipment.LABEL_ISSUED_to_CLOSED_GOOD", "errors[ERR_RETURN_NOT_OPEN]"]
        distinguishing_aspect: "A second inspect on an already-terminal (CLOSED_GOOD) ReturnShipment is rejected with ERR_RETURN_NOT_OPEN (409)."
        test_recipe:
          setup: ["A ReturnShipment has already been inspected GOOD (CLOSED_GOOD)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog"
              payload: { isbn13: "9780000000108", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /inventory-units"
              payload: { catalog_item_id: "${cat_id}", condition_grade: "GOOD", acquisition_cost_cents: 5000 }
              as: CatalogAdmin
            - call: "POST /customers"
              payload: { email: "ir@x.com", full_name: "IR" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 50000, kind: "TOP_UP" }
              as: CatalogAdmin
            - call: "POST /orders"
              payload: { catalog_item_id: "${cat_id}", fulfillment_type: "RENT", rental_term_days: 90, desired_start_date: "2026-03-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: WarehouseAgent
            - call: "GET /rentals?order_id=${order_id}"
              payload: {}
              as: WarehouseAgent
              captures: { rental_id: "$.data[0].id" }
            - call: "POST /rentals/${rental_id}/return"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rs_id: "$.data.id" }
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
          trigger:
            - call: "POST /return-shipments/${rs_id}/inspect"
              payload: { reported_condition: "GOOD", highlight_pct_reported: 0, is_lost: false }
              as: WarehouseAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RETURN_NOT_OPEN"

      - name: accept_non_quoted_buyback_returns_409
        claim_type: Idempotency
        grounds: ["state_machines.BuybackQuote.QUOTED_to_ACCEPTED", "errors[ERR_QUOTE_NOT_OPEN]"]
        distinguishing_aspect: "Accepting a quote that is already ACCEPTED returns ERR_QUOTE_NOT_OPEN (409)."
        test_recipe:
          setup: ["A buyback quote is already ACCEPTED."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000109", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "an@x.com", full_name: "AN" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "GOOD", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /buyback-quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /buyback-quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_NOT_OPEN"

      - name: inspect_buyback_not_accepted_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.BuybackQuote.ACCEPTED_to_PAID", "errors[ERR_QUOTE_NOT_ACCEPTED]"]
        distinguishing_aspect: "Inspecting a quote still in QUOTED (not ACCEPTED) returns ERR_QUOTE_NOT_ACCEPTED (409)."
        test_recipe:
          setup: ["A buyback quote sits in QUOTED (not yet accepted)."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000110", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "ib@x.com", full_name: "IB" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "GOOD", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: "$.data.id" }
          trigger:
            - call: "POST /buyback-quotes/${q_id}/inspect"
              payload: { assessed_condition: "GOOD" }
              as: WarehouseAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_NOT_ACCEPTED"

      - name: respond_revision_not_revised_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.BuybackQuote.REVISED_to_DECLINED", "errors[ERR_QUOTE_NOT_REVISED]"]
        distinguishing_aspect: "respond-revision on an ACCEPTED (not REVISED) quote returns ERR_QUOTE_NOT_REVISED (409)."
        test_recipe:
          setup: ["A buyback quote is ACCEPTED (never revised)."]
          setup_api_calls:
            - call: "POST /catalog"
              payload: { isbn13: "9780000000111", edition: 1, title: "T", author: "A", list_price_cents: 12000, rental_base_cents: 6000, ebook_price_cents: 4000, buyback_base_cents: 3000, replacement_fee_cents: 10000 }
              as: CatalogAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "rr@x.com", full_name: "RR" }
              as: CatalogAdmin
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /buyback-quotes"
              payload: { catalog_item_id: "${cat_id}", declared_condition: "GOOD", expected_customer_version: "${cust_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: "$.data.id" }
            - call: "POST /buyback-quotes/${q_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /buyback-quotes/${q_id}/respond-revision"
              payload: { action: "ACCEPT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_NOT_REVISED"

      - name: cancel_subscription_twice_returns_409
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "errors[ERR_SUBSCRIPTION_NOT_ACTIVE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED subscription returns ERR_SUBSCRIPTION_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A subscription has already been cancelled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /subscription-plans"
