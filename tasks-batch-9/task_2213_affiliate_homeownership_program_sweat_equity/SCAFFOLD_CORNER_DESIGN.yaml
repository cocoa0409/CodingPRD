            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_1: $.data.id } }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Omar Vance", birth_date: "1991-02-02T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_2: $.data.id } }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Pilar Sosa", birth_date: "1987-07-07T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z", trade_certifications: [{ trade: "PLUMBING", expires_on: "2027-12-31T00:00:00.000Z" }] }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_p: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 3, required_trade_slots: 1, required_trade: "PLUMBING" }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { sv1: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv1}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_1}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_1: $.data.id } }
            - { call: "POST /homeownership/shift-assignments/${asg_1}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_1}" }
            - { call: "GET /homeownership/construction-shifts/${shift_id}", as: ConstructionManager, as_user_id: "cm-1", captures: { sv2: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv2}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_2}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_2: $.data.id } }
            - { call: "POST /homeownership/shift-assignments/${asg_2}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_2}" }
          trigger:
