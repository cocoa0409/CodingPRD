            - "the second trigger call returns HTTP 200 with signer == dir-lakeside and status == SIGNED_OFF"
            - "actual == 300, from started_at_utc 2026-09-10T04:00:00Z to completed_at_utc 2026-09-10T09:00:00Z, and overrun == 0 because 300 is far below the 1215-minute window"
            - "Venue.${venue_id}.changeover_debt_minutes == 0 after sign-off"

      - name: an_anchor_tenant_rep_cannot_act_for_another_tenant
