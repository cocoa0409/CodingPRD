  - name: winding_the_clock_backwards_is_refused
    claim_type: violation_to_error
    grounds: validations.clock_monotonic (priority 98); errors[ERR_CLOCK_NOT_MONOTONIC]
    distinguishing_aspect: 'The clock endpoint is exempt from the auth rules but not from this one: an
      earlier timestamp is refused so that sweep-driven transitions can never be un-fired, while re-setting
      the same timestamp is not earlier and is accepted.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-09-01T00:00:00Z'
      trigger:
      - call: POST /_clock/set_current_utc
        as: BillingAdministrator
        payload:
          current_utc: '2026-08-31T23:59:59Z'
      asserts:
      - the trigger returns 422 with error_id == ERR_CLOCK_NOT_MONOTONIC
      - GET /_clock as AgencyPrincipal still returns current_utc == 2026-09-01T00:00:00Z
