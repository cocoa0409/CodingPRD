# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >=2 instances. All chains replay against SCAFFOLD.yaml §1.5.
# Clock default 2026-08-01T00:00:00Z unless a setup call moves it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: package_refund_provisional_vs_final
        grounds:
          - calculations.credit_refund_value
          - calculations.package_pricing
          - entities.Package.fields.per_credit_value_cents
          - entities.Package.fields.refund_cents
        distinguishing_aspect: |
          Package-domain dual variant: PROVISIONAL (credits_remaining x rounded
          per_credit_value_cents = 147672) and FINAL (price_paid minus consumed
          credits re-priced at unit_gross_cents = 142900) produce different
          values for identical package data because FINAL claws the sibling
          discount back on consumed credits.
        test_recipe:
          setup:
            - "Family with TWO clients (sibling discount applies) and one ACTIVE WEEKLY plan for client 1"
            - "16-credit INDIVIDUAL package: unit_gross 13500, subtotal 216000, x0.9 = 194400, +2500 fee => price_paid 196900, per_credit_value round(196900/16)=12306"
            - "Four sessions completed => credits_consumed 4, credits_remaining 12"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam DV", primary_email: "dv@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid One", date_of_birth: "2014-05-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl1_id: "$.data.id", cl1_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid Two", date_of_birth: "2016-03-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach Cert", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl1_id}/intakes", payload: { presenting_concerns: "focus", baseline_score: 55 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 16 }, as: PracticeAdmin, captures: { pk_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl1_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl1_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G1", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-03T15:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-08T15:00:00Z", scheduled_end: "2026-08-08T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-13T15:00:00Z", scheduled_end: "2026-08-13T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s3_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-18T15:00:00Z", scheduled_end: "2026-08-18T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s4_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s1_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s2_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s3_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s4_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}" }
          trigger:
            - { call: "GET /api/packages/${pk_id}", as: PracticeAdmin, captures: { pk_pcv: "$.data.per_credit_value_cents", pk_rem: "$.data.credits_remaining", pk_paid: "$.data.price_paid_cents" } }
            - { call: "POST /api/packages/${pk_id}/refund", payload: {}, as: PracticeAdmin, captures: { pk_refund: "$.data.refund_cents", pk_status: "$.data.status" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_refunded: "$.data.total_refunded_cents" } }
          assert:
            - "pk_paid == 196900"
            - "pk_pcv == 12306"
            - "pk_rem == 12"
            - "PROVISIONAL refund would be 12 x 12306 == 147672, which MUST NOT equal the FINAL refund"
            - "pk_refund == 142900"
            - "pk_status == REFUNDED"
            - "fam_refunded == 142900"

      - name: progress_index_rolling_vs_cumulative
        grounds:
          - calculations.progress_index
          - entities.Client.fields.rolling_progress_index
          - entities.ProgressSnapshot.fields.cumulative_index
        distinguishing_aspect: |
          Client-domain dual variant (different entity domain than Package):
          identical goal/check-in history yields rolling_index 100 (only in-window
          events counted) versus cumulative_index 50 (all events under the ACTIVE
          plan counted) because the dropped goal and late check-in fall outside
          the 28-day rolling window.
        test_recipe:
          setup:
            - "One ACTIVE WEEKLY plan (activated at clock 2026-08-01T00:00:00Z) with goals gA, gB"
            - "gB DROPPED at 2026-08-01 (outside rolling window of a 2026-09-05 snapshot); check-in c2 resolved SUBMITTED_LATE at 2026-08-03 (outside window)"
            - "gA ACHIEVED at 2026-08-20 (inside window [2026-08-08, 2026-09-05]); check-in c1 submitted on time at 2026-08-24 (inside window)"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam PI", primary_email: "pi@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid P", date_of_birth: "2013-04-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach C", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "planning", baseline_score: 60 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "Goal A", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}", captures: { ga_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "Goal B", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}", captures: { gb_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/goals/${gb_id}/transition", payload: { to_state: "DROPPED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/checkins", payload: { due_at: "2026-08-02T00:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { c2_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/checkins/${c2_id}/submit", payload: {}, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/goals/${ga_id}/transition", payload: { to_state: "ACHIEVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/checkins", payload: { due_at: "2026-08-25T00:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/checkins/${c1_id}/submit", payload: {}, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/clients/${cl_id}/progress-snapshots", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { snap_rolling: "$.data.rolling_index", snap_cum: "$.data.cumulative_index", snap_gc: "$.data.goals_considered", snap_cc: "$.data.checkins_considered" } }
          assert:
            - "snap_gc == 1 (only gA resolved inside [2026-08-08, 2026-09-05])"
            - "snap_cc == 1 (only c1 resolved inside the window)"
            - "snap_rolling == 100"
            - "snap_cum == 50"
            - "snap_rolling != snap_cum (same underlying rows, two variants, different values)"

  - rule_id: combinatorial_formula
    instances:
      - name: package_pricing_tier_track_sibling_interplay
        grounds:
          - calculations.package_pricing
          - entities.Package.fields.price_paid_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: three inputs (credits_total tier, track
          multiplier, sibling-count discount) interact non-linearly — the GROUP
          multiplier applies to the tier rate before rounding, the sibling
          discount applies to the post-track subtotal, and the materials fee is
          added last undiscounted; identical credits_total yields 146500 (GROUP,
          1 client) vs 218500 (INDIVIDUAL, 2 clients).
        test_recipe:
          setup:
            - "Family X with ONE client buys GROUP package of 20 credits: unit round(12000x0.60)=7200, subtotal 144000, no sibling discount, +2500 => 146500"
            - "Family Y with TWO clients buys INDIVIDUAL package of 20 credits: unit 12000, subtotal 240000, x0.9 = 216000, +2500 => 218500"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam X", primary_email: "x@x.com" }, as: PracticeAdmin, captures: { famx_id: "$.data.id" } }
            - { call: "POST /api/families/${famx_id}/clients", payload: { full_name: "Kid X", date_of_birth: "2015-01-01", track: "GROUP" }, as: PracticeAdmin }
            - { call: "POST /api/families/${famx_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/families", payload: { account_name: "Fam Y", primary_email: "y@x.com" }, as: PracticeAdmin, captures: { famy_id: "$.data.id" } }
            - { call: "POST /api/families/${famy_id}/clients", payload: { full_name: "Kid Y1", date_of_birth: "2014-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${famy_id}/clients", payload: { full_name: "Kid Y2", date_of_birth: "2016-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${famy_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/families/${famx_id}/packages", payload: { track: "GROUP", credits_total: 20 }, as: PracticeAdmin, captures: { x_paid: "$.data.price_paid_cents", x_pcv: "$.data.per_credit_value_cents", x_gross: "$.data.unit_gross_cents" } }
            - { call: "POST /api/families/${famy_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 20 }, as: PracticeAdmin, captures: { y_paid: "$.data.price_paid_cents", y_pcv: "$.data.per_credit_value_cents", y_gross: "$.data.unit_gross_cents" } }
          assert:
            - "x_gross == 7200"
            - "x_paid == 146500"
            - "x_pcv == 7325"
            - "y_gross == 12000"
            - "y_paid == 218500"
            - "y_pcv == 10925"

      - name: cancellation_fee_nested_rounding
        grounds:
          - calculations.cancellation_charge
          - calculations.credit_refund_value
          - entities.Session.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-credit value is rounded half-up at
          purchase (110500/8 = 13812.5 -> 13813), then the 50% fee rounds half-up
          AGAIN (0.5 x 13813 = 6906.5 -> 6907); an implementation that rounds in
          the other order or mode (round(0.5 x 13812.5) = 6906, or half-even
          6906) lands on a different cent value.
        test_recipe:
          setup:
            - "Family with TWO clients (sibling discount); 8-credit INDIVIDUAL package: subtotal 120000, x0.9 = 108000, +2500 => price_paid 110500, per_credit_value round_half_up(110500/8) = 13813"
            - "ACTIVE WEEKLY plan; session at 2026-08-10T15:00:00Z; cancel at exactly 2026-08-09T16:00:00Z => notice 23h => HALF tier"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam NR", primary_email: "nr@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid N1", date_of_birth: "2014-02-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid N2", date_of_birth: "2017-02-01", track: "INDIVIDUAL" }, as: PracticeAdmin }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach N", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "routines", baseline_score: 50 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 8 }, as: PracticeAdmin, captures: { pk_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-10T15:00:00Z", scheduled_end: "2026-08-10T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T16:00:00Z" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /api/sessions/${s_id}/cancel", payload: {}, as: FamilyMember, as_user_id: "${fam_id}", captures: { s_fee: "$.data.cancellation_fee_cents", s_att: "$.data.attendance_state", s_bill: "$.data.billing_state" } }
            - { call: "GET /api/packages/${pk_id}", as: PracticeAdmin, captures: { pk_forfeit: "$.data.credits_forfeited", pk_rem: "$.data.credits_remaining" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_charged: "$.data.total_charged_cents", fam_status: "$.data.status" } }
          assert:
            - "s_att == CANCELLED_LATE"
            - "s_bill == FORFEITED"
            - "s_fee == 6907"
            - "pk_forfeit == 1"
            - "pk_rem == 7"
            - "fam_charged == 117407"
            - "fam_status == SUSPENDED (fee event pushed outstanding 117407 over the 20000 threshold)"

      - name: supervision_deficit_pinned_evaluation_order
        grounds:
          - calculations.supervision_requirement
          - state_machines.Coach.AVAILABLE_to_SUPERVISION_DEFICIT
          - entities.Coach.fields.required_supervision_hours
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          caseload (2) -> required hours floor(2/2)=1 -> deficit (verified 0 < 1)
          -> deficit gates only the NEXT acceptance, so acceptance #2 succeeds
          and acceptance #3 is rejected; after 1 verified hour the deficit
          clears and #3 succeeds at caseload 3 with required floor(3/2)=1.
        test_recipe:
          setup:
            - "One ASSOCIATE coach A (divisor 2), one SUPERVISOR coach S; three clients of one family, each with APPROVED intake"
            - "Plans p1, p2 for coach A accepted => active_caseload 2, required 1, verified 0 => SUPERVISION_DEFICIT (set post-acceptance)"
            - "Plan p3 drafted and proposed for client 3"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam SD", primary_email: "sd@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid S1", date_of_birth: "2013-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl1_id: "$.data.id", cl1_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid S2", date_of_birth: "2014-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl2_id: "$.data.id", cl2_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid S3", date_of_birth: "2015-01-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl3_id: "$.data.id", cl3_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach Assoc", credential_level: "ASSOCIATE" }, as: PracticeAdmin, captures: { coa_id: "$.data.id" } }
            - { call: "POST /api/coaches", payload: { full_name: "Coach Sup", credential_level: "SUPERVISOR" }, as: PracticeAdmin, captures: { cos_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl1_id}/intakes", payload: { presenting_concerns: "c1", baseline_score: 50 }, as: PracticeAdmin, captures: { in1_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in1_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in1_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${cos_id}" }
            - { call: "POST /api/intakes/${in1_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${cos_id}" }
            - { call: "POST /api/clients/${cl2_id}/intakes", payload: { presenting_concerns: "c2", baseline_score: 52 }, as: PracticeAdmin, captures: { in2_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in2_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in2_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${cos_id}" }
            - { call: "POST /api/intakes/${in2_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${cos_id}" }
            - { call: "POST /api/clients/${cl3_id}/intakes", payload: { presenting_concerns: "c3", baseline_score: 54 }, as: PracticeAdmin, captures: { in3_id: "$.data.id" } }
