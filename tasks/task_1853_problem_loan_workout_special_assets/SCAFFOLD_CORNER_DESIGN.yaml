        claim_type: derived_field_reconciliation
        grounds: [entities.Loan, state_machines.WorkoutCase.NEGOTIATION_to_LEGAL]
        distinguishing_aspect: "Loan.nonaccrual is derived: false at 30 days past due; creating a legal referral flips it true even though days_past_due stays 30 (case-state-derived component)."
        test_recipe:
          setup: ["Case in NEGOTIATION on a loan with days_past_due 30 (nonaccrual false)"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Derived Co", tax_id: "55-0000030", naics_code: "541722", internal_risk_rating: 7 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-O03", original_principal_cents: 2400000, contractual_rate_bps: 800, days_past_due: 30 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "COVENANT_DEFAULT", risk_rating_at_entry: 7, case_officer_id: "officer-o3" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans"
              payload: { plan_text: "Legal flip", target_resolution_date: "2027-03-05T00:00:00Z", milestone_count: 1, expected_case_version: "${case_v}" }
              as: WorkoutOfficer
              as_user_id: "officer-o3"
              captures: { plan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/submit"
              payload: {}
              as: WorkoutOfficer
              as_user_id: "officer-o3"
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/action-plans/${plan_id}/approve"
              payload: {}
              as: SpecialAssetsManager
              as_user_id: "mgr-o3"
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/legal-referrals"
              payload: { referral_kind: "NOTE_SALE_PREP", demand_amount_cents: 0, statute_deadline: "2028-01-01T00:00:00Z", decision_rationale: "Prep" }
              as: WorkoutOfficer
              as_user_id: "officer-o3"
          assert:
            - "Before referral: Loan.nonaccrual == false (30 < 90)"
            - "After referral: Loan.nonaccrual == true (case in LEGAL forces it) and Loan.days_past_due still == 30"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_chargeoff_visible_in_same_response_and_reads
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, endpoints]
        distinguishing_aspect: "Consistency model is immediate: the charge-off response, a subsequent GET /loans/{id}, and GET /workout-cases/{caseId} all reflect the new balances without any delay or recompute endpoint."
        test_recipe:
          setup: ["Case open on loan with current principal 8,000,000"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Immediate Co", tax_id: "55-0000031", naics_code: "541723", internal_risk_rating: 8 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-I01", original_principal_cents: 8000000, contractual_rate_bps: 800, days_past_due: 70 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 8, case_officer_id: "officer-i2" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/workout-cases/${case_id}/charge-offs"
              payload: { amount_cents: 3000000, reason_code: "PARTIAL_IMPAIRMENT" }
              as: LoanAccounting
              as_user_id: "acct-i2"
              captures: { co_id: $.data.id }
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: LoanAccounting
              captures: { cur: $.data.current_principal_cents, co: $.data.charged_off_principal_cents }
            - call: "GET /loans/${loan_id}/workout-cases/${case_id}"
              payload: {}
              as: LoanAccounting
              captures: { lgd: $.data.loss_given_default_cents }
          assert:
            - "GET loan immediately after: current_principal_cents == 5000000 and charged_off_principal_cents == 3000000"
            - "GET case immediately after: loss_given_default_cents == 5000000 (no collateral)"
            - "updated_at on Loan and WorkoutCase both refreshed (mutations including cascaded side effects)"

  # ===========================================================================
  # Excluded stubs — already covered by §1.8 difficulty instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: liquidation_value_rounding_trap_excluded
        claim_type: correct_result
        grounds: [calculations.liquidation_value]
        excluded_because:
          difficulty_instance: appraisal_supersede_lgd_reconciliation_invariant
          rationale: "Liquidation arithmetic (×80% haircut → 64,000,000 and 40,000,000) is asserted inside the named §1.8 invariant instance; the 28,000,000 haircut value is asserted in the §1.8 staleness instance."

      - name: recovery_allocation_excess_bucket_excluded
        claim_type: correct_result
        grounds: [calculations.recovery_allocation]
        excluded_because:
          difficulty_instance: recovery_allocation_chronological_vs_waterfall_divergence
          rationale: "Bucket order, costs-tier rounding, and post-allocation balances are pinned in the named §1.8 dual-variant instance and the waterfall nested-rounding combinatorial instance."

  - section: state_machines
    instances:
      - name: collateral_under_revaluation_roundtrip_excluded
        claim_type: side_effect_execution
        grounds: [state_machines.CollateralItem.PLEDGED_to_UNDER_REVALUATION, state_machines.CollateralItem.UNDER_REVALUATION_to_PLEDGED]
        excluded_because:
          difficulty_instance: appraisal_staleness_window_boundary
          rationale: "The PLEDGED → UNDER_REVALUATION → PLEDGED roundtrip with value recompute is exercised by the staleness boundary instance's setup and trigger chains."

      - name: tdr_flag_computation_excluded
        claim_type: side_effect_execution
        grounds: [entities.RestructureProposal.fields.tdr_flag]
        excluded_because:
          difficulty_instance: consummate_forgiveness_cascade_depth3
          rationale: "tdr_flag == true (concession + difficulty) and TDR_CONFIRMED propagation are asserted in the named cascade instance; TDR_REJECTED path is asserted in the impairment-gating §1.8 instance."
