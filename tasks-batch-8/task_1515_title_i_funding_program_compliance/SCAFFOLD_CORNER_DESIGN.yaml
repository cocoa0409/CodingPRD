            - { call: "POST /title-i/grants/${g}/finalize-allocations", payload: {}, as: FederalProgramsDirector }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s1}" }, as: FederalProgramsDirector, captures: { a1: "$.data[0].id" } }
            - { call: "GET /title-i/school-allocations", payload: { grant_id: "${g}", school_id: "${s2}" }, as: FederalProgramsDirector, captures: { a2: "$.data[0].id" } }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: FederalProgramsDirector, captures: { gv_obs: "$.data.version" } }
          trigger:
            - { call: "POST /title-i/budget-amendments", payload: { grant_id: "${g}", expected_grant_version: "${gv_obs}", lines: [ { target_type: "SCHOOL_ALLOCATION", target_id: "${a1}", new_amount_cents: 5300000 }, { target_type: "SCHOOL_ALLOCATION", target_id: "${a2}", new_amount_cents: 3700000 } ] }, as: ComplianceAnalyst, as_user_id: "analyst-1", captures: { ba1: "$.data.id" } }
            - call: "POST /title-i/budget-amendments"
              payload: { grant_id: "${g}", expected_grant_version: "${gv_obs}", lines: [ { target_type: "SCHOOL_ALLOCATION", target_id: "${a1}", new_amount_cents: 5200000 }, { target_type: "SCHOOL_ALLOCATION", target_id: "${a2}", new_amount_cents: 3800000 } ] }
              as: ComplianceAnalyst
              captures: { err: "$.data.error_id" }
            - { call: "GET /title-i/grants/${g}", payload: {}, as: FederalProgramsDirector, captures: { gv_now: "$.data.version" } }
          assert:
            - "first create succeeds (201) and advances DistrictGrant.version"
            - "second create replaying the same observed version: 412 error_id == ERR_STALE_GRANT_VERSION"
            - "final grant version == gv_obs + 1 (only the successful create bumped it)"

      - name: occ_stale_snapshot_certify_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[snapshot-certify-stale-grant]
        distinguishing_aspect: "Certify of snapshot N2 carrying the grant version observed before N1's certification is rejected 412 ERR_STALE_GRANT_VERSION — N1's certify already re-baselined the grant."
        test_recipe:
          setup: ["grant SETUP with certified snapshot N1; second snapshot N2 DRAFT; client holds the stale pre-N1 version"]
          setup_api_calls:
            - { call: "POST /title-i/schools", payload: { name: "OCC Snap School", nces_id: "100634", grade_span_low: 0, grade_span_high: 12 }, as: ComplianceAnalyst, captures: { s: "$.data.id" } }
            - { call: "POST /title-i/grants", payload: { fiscal_year: 2104, total_allocation_cents: 5000000, poverty_measure: "CENSUS_SAIPE" }, as: FederalProgramsDirector, captures: { g: "$.data.id", gv_stale: "$.data.version" } }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 50, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { n1: "$.data.id" } }
            - { call: "POST /title-i/poverty-snapshots/${n1}/certify", payload: { expected_grant_version: "${gv_stale}" }, as: FederalProgramsDirector }
            - { call: "POST /title-i/poverty-snapshots", payload: { grant_id: "${g}", measure: "CENSUS_SAIPE", entries: [ { school_id: "${s}", low_income_student_count: 55, total_student_count: 100 } ] }, as: ComplianceAnalyst, captures: { n2: "$.data.id" } }
          trigger:
