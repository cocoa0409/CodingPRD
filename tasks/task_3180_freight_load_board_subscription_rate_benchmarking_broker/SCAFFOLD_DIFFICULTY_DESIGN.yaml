            - "BrokerOrg.${broker_r_id}.credit_score == 35 (raw 0, confidence 0.5, round_half_up(70 - 35) = 35) and credit_badge == CRITICAL"
            - "BrokerOrg.${broker_r_id}.status == SUSPENDED (score<40 auto-suspension fires on dispute-resolution recompute)"
