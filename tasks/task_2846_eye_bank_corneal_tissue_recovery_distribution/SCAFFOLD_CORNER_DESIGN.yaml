      - name: a_third_dispatch_of_a_twice_returned_tissue_yields_err_reissue_limit_reached
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_43
          - "errors[ERR_REISSUE_LIMIT_REACHED]"
          - entities.CorneaTissue.fields.reissue_generation
