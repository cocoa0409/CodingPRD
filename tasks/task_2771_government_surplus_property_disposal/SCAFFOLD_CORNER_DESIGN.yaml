              captures: { b1: "$.data.id" }
            - call: "POST /bidders/${b1}/status"
              payload: { status: "REGISTERED" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 1" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "FURNITURE", description: "Guest chair set 1", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 2" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti2: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti2}", category: "FURNITURE", description: "Guest chair set 2", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 3" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti3: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti3}", category: "FURNITURE", description: "Guest chair set 3", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag}"
          trigger:
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:30:00Z" }
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /turn-ins/${ti2}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:45:15Z" }
              as: Bidder
