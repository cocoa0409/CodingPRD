          A single system sweep with no request body walks Asset -> AssetUsage -> Distribution ->
          ContentItem -> Campaign in one transaction, and its counters expose the internal step order:
          distributions_suppressed is 1 while distributions_activated is 0 even though the OWNED row was
          SCHEDULED with scheduled_at already in the past, because step 2 suppresses it before step 5
          can activate it.
