              payload: { federal_share_awarded_cents: 2300000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id, award_v1: $.data.version }
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
