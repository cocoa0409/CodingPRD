  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (two DIFFERENT error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_pair_on_financing_commit
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_FINANCING_INVALID_STATE]
          - errors[ERR_DSCR_BELOW_MINIMUM]
        distinguishing_aspect: |
          Priority conflict across the STATE vs BUSINESS_FISCAL category pair:
          a commit attempted on a WITHDRAWN application that would ALSO fail
          DSCR must return ERR_FINANCING_INVALID_STATE (state, priority 5),
          never ERR_DSCR_BELOW_MINIMUM (fiscal, priority 17). State beats fiscal.
        test_recipe:
          setup:
            - "Deal -> PSA_EXECUTED; financing application withdrawn from SUBMITTED"
            - "Loan terms chosen so DSCR would be below 1.25 IF the state check were skipped (noi 1190000 from single lease 1400000 cons; loan 13000000 @ 10% IO -> DS 1300000 -> dscr 0.915)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "PriorityDeal1", deal_type: "SINGLE_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 250000, purchase_price_cents: 20000000 }
              as: AcquisitionsAnalyst
