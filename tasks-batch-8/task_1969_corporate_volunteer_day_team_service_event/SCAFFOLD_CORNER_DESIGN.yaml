        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_GUARDIAN_SIGNATURE_REQUIRED]"]
        distinguishing_aspect: "A minor (age 15 at event start) signing with signer_relation SELF is rejected with ERR_GUARDIAN_SIGNATURE_REQUIRED; waiver stays WAIVER_PENDING."
