# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  (SKILL.md §1.9)
#
# Task 2474 - Environmental Justice Screening & Permit Review
# Breadth probe over the claim-extraction-guide's nine sections against this
# scaffold's SCAFFOLD.yaml §1.1-§1.7 surface. Depth (9 hard rules x 2) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there appear here as
# `excluded_because:` stubs naming the covering §1.8 instance.
#
# Conventions shared with §1.8:
#   * logical clock is set explicitly as the first setup call (default
#     2026-08-01T00:00:00Z) via POST /_clock/set_current_utc as ProgramAdmin.
#   * user ids: admin-1 (ProgramAdmin), analyst-1 (EJAnalyst), qa-1 (QAReviewer),
#     mgr-1 (PermitManager), liaison-1 (CommunityLiaison), insp-1 / insp-2
#     (Inspector), resident-* (PublicCommenter). ApplicantRepresentative is
#     entity_backed:Facility, so its as_user_id is always the Facility id.
#   * AREA_A fixture (BG-06-101, limited_english_pct 12.5, baseline_load_tpy
#     400.00) with PM25 85/62, DIESEL_PM 90/70, ASTHMA_ED_RATE 80/55,
#     POVERTY_RATE 88/65 scores 74.03 statewide / 39.68 county -> OVERBURDENED,
#     translation_required true.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: screening_area_creation_applies_computed_defaults_and_envelope
        claim_type: creation
        grounds:
          - entities.ScreeningArea.fields.designation
          - entities.ScreeningArea.fields.data_status
          - entities.ScreeningArea.fields.required_translation_languages
          - entities.ScreeningArea.fields.active_indicator_count
          - calculations.designation
        distinguishing_aspect: "A brand-new ScreeningArea created with no indicators returns 201 with the success envelope and every computed field at its declared default: designation UNDESIGNATED, both scores 0.00, active_indicator_count 0, data_status CURRENT, permitted_load_tpy 0.00, open_plan_count 0, version 1."
        test_recipe:
          setup:
            - "Empty DB; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-901", county: "Madera", population: 900, limited_english_pct: 5.0, baseline_load_tpy: 100.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_new_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are both present"
            - "ScreeningArea.${area_new_id}.designation == UNDESIGNATED"
            - "ScreeningArea.${area_new_id}.data_status == CURRENT"
            - "ScreeningArea.${area_new_id}.ej_screen_score_statewide == 0.00"
            - "ScreeningArea.${area_new_id}.ej_screen_score_county == 0.00"
            - "ScreeningArea.${area_new_id}.active_indicator_count == 0"
            - "ScreeningArea.${area_new_id}.enforcement_burden_points == 0"
            - "ScreeningArea.${area_new_id}.permitted_load_tpy == 0.00"
            - "ScreeningArea.${area_new_id}.open_plan_count == 0"
            - "ScreeningArea.${area_new_id}.open_complaint_count == 0"
            - "ScreeningArea.${area_new_id}.translation_required == false"
            - "ScreeningArea.${area_new_id}.required_translation_languages == []"
            - "ScreeningArea.${area_new_id}.version == 1"

      - name: venue_status_defaults_to_active_when_omitted
        claim_type: defaults
        grounds:
          - entities.Venue.fields.status
          - entities.Venue.fields.booked_meeting_count
        distinguishing_aspect: "Omitting the optional status input on POST /ej/venues yields status ACTIVE and booked_meeting_count 0 rather than a null or DECOMMISSIONED value."
        test_recipe:
          setup:
            - "Empty DB; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ej/venues"
              payload: { name: "Madera Library Meeting Room", address: "45 Yosemite Ave, Madera CA", capacity: 60, transit_accessible: true, ada_accessible: true, interpretation_capable: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { venue_def_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Venue.${venue_def_id}.status == ACTIVE"
            - "Venue.${venue_def_id}.booked_meeting_count == 0"
            - "Venue.${venue_def_id}.interpretation_capable == false"

      - name: screening_area_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SCREENING_AREA_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A GET on an areaId that resolves to no row returns 404 ERR_SCREENING_AREA_NOT_FOUND rather than an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty DB; logical clock 2026-08-01T00:00:00Z; no ScreeningArea rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /ej/screening-areas/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { err_area_404: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_area_404} == ERR_SCREENING_AREA_NOT_FOUND"
            - "response_type == error"

      - name: facility_create_with_unknown_screening_area_rejected
        claim_type: parent_relationships
        grounds:
          - errors[ERR_SCREENING_AREA_NOT_FOUND]
          - validations[priority=6]
          - entities.Facility.fields.screening_area_id
        distinguishing_aspect: "A body foreign key that resolves to no ScreeningArea makes POST /ej/facilities fail with 404 ERR_SCREENING_AREA_NOT_FOUND and no Facility row is written."
        test_recipe:
          setup:
            - "Empty DB; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "22222222-2222-2222-2222-222222222222", name: "Ghost Plant", facility_type: "MINOR_SOURCE", distance_to_area_centroid_m: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_fac_parent: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_fac_parent} == ERR_SCREENING_AREA_NOT_FOUND"

      - name: burden_indicator_missing_county_percentile_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
          - entities.BurdenIndicator.fields.county_percentile
        distinguishing_aspect: "county_percentile is a required input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and the area's active_indicator_count stays 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ScreeningArea AREA_H with no indicators."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-902", county: "Madera", population: 1100, limited_english_pct: 3.0, required_translation_languages: [], baseline_load_tpy: 120.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_h_id: $.data.id, area_h_v0: $.data.version }
          trigger:
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_h_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 10.00, statewide_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_h_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { err_missing_field: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err_missing_field} == ERR_INVALID_REQUEST"
            - "ScreeningArea.${area_h_id}.active_indicator_count == 0"
            - "ScreeningArea.${area_h_id}.version == 1"

      - name: burden_indicator_percentile_above_range_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_PERCENTILE_OUT_OF_RANGE]
          - validations[priority=13]
          - entities.BurdenIndicator.fields.statewide_percentile
        distinguishing_aspect: "statewide_percentile is constrained to [0.00, 100.00], so 105.00 returns 422 ERR_PERCENTILE_OUT_OF_RANGE and no indicator row is created."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ScreeningArea AREA_H with no indicators."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-902", county: "Madera", population: 1100, limited_english_pct: 3.0, required_translation_languages: [], baseline_load_tpy: 120.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_h_id: $.data.id, area_h_v0: $.data.version }
          trigger:
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_h_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 10.00, statewide_percentile: 105.00, county_percentile: 60.00, vintage_year: 2024, expected_screening_area_version: "${area_h_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { err_pct_range: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_pct_range} == ERR_PERCENTILE_OUT_OF_RANGE"
            - "ScreeningArea.${area_h_id}.active_indicator_count == 0"
            - "GET /ej/screening-areas/${area_h_id}/burden-indicators returns data == [] with total_count == 0"

      - name: burden_indicator_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints["GET /ej/screening-areas/{id}/burden-indicators"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With four ACTIVE indicators on AREA_A, limit 2 offset 0 returns exactly 2 rows with total_count 4 and has_more true, while offset 2 returns the remaining 2 rows with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_A with its four ACTIVE indicators (PM25, DIESEL_PM, ASTHMA_ED_RATE, POVERTY_RATE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
          trigger:
            - call: "GET /ej/screening-areas/${area_a_id}/burden-indicators"
              payload: { status: "ACTIVE", limit: 2, offset: 0 }
              as: EJAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ej/screening-areas/${area_a_id}/burden-indicators"
              payload: { status: "ACTIVE", limit: 2, offset: 2 }
              as: EJAnalyst
              as_user_id: "analyst-1"
          assert:
            - "First trigger call: HTTP status == 200, response_type == array, data has 2 rows, total_count == 4, has_more == true"
            - "Second trigger call: data has 2 rows, total_count == 4, has_more == false"
            - "ScreeningArea.${area_a_id}.active_indicator_count == 4"
            - "ScreeningArea.${area_a_id}.ej_screen_score_statewide == 74.03"

      - name: public_comment_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.PublicComment.fields.in_required_language
          - entities.ParticipationPlan.fields.comment_count
          - endpoints["POST /ej/public-comments"]
        distinguishing_aspect: "PublicComment is declared common_fields false, so its create response exposes only the seven declared fields - no id, version, created_at or updated_at - and §1.5 declares no PATCH or DELETE for it; the filing still increments ParticipationPlan.comment_count to 1."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_A OVERBURDENED (74.03); APP_A (80.00 tpy) screened ENHANCED; plan translated into es and OPEN with comment_start_date 2026-08-01 and comment_end_date 2026-09-29."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-101", county: "Kern", population: 4200, limited_english_pct: 12.5, required_translation_languages: ["es"], baseline_load_tpy: 400.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_a_id: $.data.id, area_a_v0: $.data.version }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "PM25", category: "POLLUTION", raw_value: 12.40, statewide_percentile: 85.00, county_percentile: 62.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v0}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v1: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "DIESEL_PM", category: "POLLUTION", raw_value: 4.80, statewide_percentile: 90.00, county_percentile: 70.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v1}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v2: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "ASTHMA_ED_RATE", category: "HEALTH", raw_value: 62.00, statewide_percentile: 80.00, county_percentile: 55.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v2}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v3: $.data.area_version_after }
            - call: "POST /ej/burden-indicators"
              payload: { screening_area_id: "${area_a_id}", indicator_code: "POVERTY_RATE", category: "DEMOGRAPHIC", raw_value: 31.50, statewide_percentile: 88.00, county_percentile: 65.00, vintage_year: 2024, expected_screening_area_version: "${area_a_v3}" }
              as: EJAnalyst
              as_user_id: "analyst-1"
              captures: { area_a_v4: $.data.area_version_after }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_a_id}", name: "Kern Rendering Plant", facility_type: "MAJOR_SOURCE", distance_to_area_centroid_m: 450 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_a_id: $.data.id }
            - call: "POST /ej/permit-applications"
              payload: { facility_id: "${fac_a_id}", permit_type: "NEW_SOURCE", proposed_emissions_tpy: 80.00, proposed_operating_hours_per_year: 8000 }
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /ej/permit-applications/${app_a_id}/submit"
              payload: {}
              as: ApplicantRepresentative
              as_user_id: "${fac_a_id}"
            - call: "POST /ej/permit-applications/${app_a_id}/screen"
              payload: {}
              as: EJAnalyst
              as_user_id: "analyst-1"
            - call: "GET /ej/permit-applications/${app_a_id}/participation-plans"
              payload: {}
              as: CommunityLiaison
              as_user_id: "liaison-1"
              captures: { plan_a_id: "$.data[0].id" }
            - call: "PATCH /ej/participation-plans/${plan_a_id}"
              payload: { translated_languages: ["es"], materials_translated: true }
              as: CommunityLiaison
              as_user_id: "liaison-1"
            - call: "POST /ej/participation-plans/${plan_a_id}/open"
              payload: { comment_start_date: "2026-08-01" }
              as: CommunityLiaison
              as_user_id: "liaison-1"
          trigger:
            - call: "POST /ej/public-comments"
              payload: { participation_plan_id: "${plan_a_id}", submitter_name: "Rosa Delgado", language: "es", body: "El olor de la planta afecta a la escuela primaria." }
              as: PublicCommenter
              as_user_id: "resident-6"
          assert:
            - "HTTP status == 201"
            - "The response data object has exactly the keys participation_plan_id, submitter_name, language, body, requires_response, in_required_language"
            - "The response data object contains no id, version, created_at or updated_at key"
            - "data.in_required_language == true"
            - "data.requires_response == false"
            - "ParticipationPlan.${plan_a_id}.comment_count == 1"
            - "§1.5 declares no PATCH or DELETE endpoint whose path targets a PublicComment"

  - section: state_machines
    instances:
      - name: application_starts_in_draft_with_zeroed_review_fields
        claim_type: initial_state
        grounds:
          - state_machines.PermitApplication.initial_state
          - entities.PermitApplication.fields.revision_round
          - entities.PermitApplication.fields.screening_stale_flag
        distinguishing_aspect: "A newly created PermitApplication is in DRAFT with revision_round 0, screening_stale_flag false and pre_mitigation_index, residual_impact_index, total_mitigation_credit_tpy and approved_net_emissions_tpy all 0.00 - no screening has run yet."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_G (BG-06-903, no indicators, UNDESIGNATED) with FAC_G (MINOR_SOURCE, 1500 m)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-903", county: "Madera", population: 1500, limited_english_pct: 2.0, required_translation_languages: [], baseline_load_tpy: 200.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_g_id: $.data.id }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_g_id}", name: "Madera Cabinet Shop", facility_type: "MINOR_SOURCE", distance_to_area_centroid_m: 1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { fac_g_id: $.data.id }
          trigger:
            - call: "POST /ej/permit-applications"
              payload: { facility_id: "${fac_g_id}", permit_type: "MODIFICATION", proposed_emissions_tpy: 10.00, proposed_operating_hours_per_year: 3000 }
              as: ApplicantRepresentative
              as_user_id: "${fac_g_id}"
              captures: { app_g_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PermitApplication.${app_g_id}.status == DRAFT"
            - "PermitApplication.${app_g_id}.revision_round == 0"
            - "PermitApplication.${app_g_id}.screening_stale_flag == false"
            - "PermitApplication.${app_g_id}.pre_mitigation_index == 0.00"
            - "PermitApplication.${app_g_id}.residual_impact_index == 0.00"
            - "PermitApplication.${app_g_id}.total_mitigation_credit_tpy == 0.00"
            - "PermitApplication.${app_g_id}.approved_net_emissions_tpy == 0.00"
            - "PermitApplication.${app_g_id}.version == 1"

      - name: submit_on_already_submitted_application_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - validations[priority=9]
          - errors[ERR_INVALID_APPLICATION_STATE]
        distinguishing_aspect: "SUBMITTED is not a declared from-state for the submit trigger, so a second submit returns 409 ERR_INVALID_APPLICATION_STATE and leaves the application in SUBMITTED with version unchanged."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; AREA_G with FAC_G; APP_G created and submitted once (status SUBMITTED, version 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ej/screening-areas"
              payload: { area_code: "BG-06-903", county: "Madera", population: 1500, limited_english_pct: 2.0, required_translation_languages: [], baseline_load_tpy: 200.00 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { area_g_id: $.data.id }
            - call: "POST /ej/facilities"
              payload: { screening_area_id: "${area_g_id}", name: "Madera Cabinet Shop", facility_type: "MINOR_SOURCE", distance_to_area_centroid_m: 1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
