  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_lease_version_on_offer_renewal
        claim_type: optimistic_concurrency
        grounds: [state_machines.Lease.ACTIVE_to_RENEWAL_OFFERED, "validations[priority=6]", entities.Lease.fields.version]
        distinguishing_aspect: "offer-renewal with a stale expected_lease_version (one less than current after a prior offer/retract bumped version) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Signed ACTIVE lease; one offer-renewal then retract advances version; replay an older version."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own25", email: "own25@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr25", state_code: "TX", address: "Ad25" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U25c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Occ", email: "oc@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
              captures: { v_signed: $.data.version }
            - call: "POST /leases/${lease_id}/offer-renewal"
              payload: { expected_lease_version: "${v_signed}" }
              as: PropertyManager
              captures: { v_offered: $.data.version }
          trigger:
            - call: "POST /leases/${lease_id}/offer-renewal"
              payload: { expected_lease_version: "${v_signed}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: derived_distributable_reconciles_after_maintenance_debit
        claim_type: derived_field_reconciliation
        grounds: [calculations.property_distributable, entities.Property.fields.distributable_cents, entities.Property.fields.trust_balance_cents]
        distinguishing_aspect: "After a manual 500000 trust funding and a completed owner-charged work order of 120000, trust_balance == 380000 and distributable == max(0, 380000 - reserve_floor 100000) == 280000."
        test_recipe:
          setup: ["Property reserve_floor 100000; manual trust funding 500000; one ASSIGNED owner-charged work order costing 120000."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own26", email: "own26@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr26", state_code: "TX", address: "Ad26", reserve_floor_cents: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/trust-deposits"
              payload: { amount_cents: 500000 }
              as: PropertyManager
              captures: { d_after_fund: $.data.distributable_cents }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U26c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /work-orders"
              payload: { unit_id: "${unit_id}", category: "APPLIANCE", description: "Fridge", charge_to_owner: true }
              as: PropertyManager
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/assign"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 120000, completed_date: "2026-06-15" }
              as: PropertyManager
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyManager
              captures: { tb: $.data.trust_balance_cents, dist: $.data.distributable_cents }
          assert:
            - "Property.${prop_id}.trust_balance_cents == 380000"
            - "Property.${prop_id}.distributable_cents == 280000"

      - name: occ_stale_prior_lease_version_on_renewal_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[renewal-lease-create-stale-lease]", entities.Lease.fields.version, "validations[priority=6]"]
        distinguishing_aspect: |
          True race resolved by OCC on the prior Lease.version: a first renewal create
          against prior lease (expected_lease_version = signed version) succeeds and bumps
          the prior lease version; a second renewal create still carrying the original
          (now stale) expected_lease_version -> ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["Signed ACTIVE lease1 on a unit; observe lease1.version; one renewal already created against it (bumping lease1.version)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own28", email: "own28@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr28", state_code: "TX", address: "Ad28" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U28c", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ren", email: "re@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease1: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease1}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease1}/sign"
              payload: {}
              as: PropertyManager
              captures: { v_signed: $.data.version }
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", start_date: "2027-06-01", end_date: "2028-06-01", monthly_rent_cents: 210000, renewed_from_lease_id: "${lease1}", expected_lease_version: "${v_signed}" }
              as: PropertyManager
              captures: { renewal_a: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", start_date: "2027-06-01", end_date: "2028-06-01", monthly_rent_cents: 210000, renewed_from_lease_id: "${lease1}", expected_lease_version: "${v_signed}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_property_version_on_distribute
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[distribute-statement-stale-property]", entities.Property.fields.version, "validations[priority=6]"]
        distinguishing_aspect: |
          True race resolved by OCC on Property.version: a first distribution succeeds and
          bumps Property.version; a second distribution (of another finalized statement)
          carrying the pre-first-distribution version -> ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["Property with trust funded 500000; two finalized CASH statements; observe property version before any distribution; first statement distributed (bumps version)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own29", email: "own29@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Pr29", state_code: "TX", address: "Ad29", reserve_floor_cents: 0 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/trust-deposits"
              payload: { amount_cents: 500000 }
              as: PropertyManager
            - call: "POST /owner-statements"
              payload: { property_id: "${prop_id}", period_label: "2026-05", basis: "ACCRUAL" }
              as: PropertyManager
              captures: { stmt1: $.data.id }
            - call: "POST /owner-statements"
              payload: { property_id: "${prop_id}", period_label: "2026-06", basis: "ACCRUAL" }
              as: PropertyManager
              captures: { stmt2: $.data.id }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyManager
              captures: { v_pre: $.data.version }
            - call: "POST /owner-statements/${stmt1}/finalize"
              payload: {}
              as: PropertyManager
            - call: "POST /owner-statements/${stmt2}/finalize"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /owner-statements/${stmt1}/distribute"
              payload: { expected_property_version: "${v_pre}" }
              as: PropertyManager
              captures: { d1: $.data.status }
            - call: "POST /owner-statements/${stmt2}/distribute"
              payload: { expected_property_version: "${v_pre}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "OwnerStatement.${stmt1}.status == DISTRIBUTED"
            - "second distribute response status == 412"
            - "data.error_id == ERR_STALE_VERSION"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_invalid_state_already_covered_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / forbidden_beats_invalid_state_on_enforce
          rationale: "ERR_INVALID_STATE is the lower-priority state check in the named §1.8 priority-conflict instance (enforce on a NOTICE_SERVED case); it is also actively triggered by the §1.9 screen_already_screened and terminal-lockdown corners."
      - name: error_screening_failed_already_covered_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_SCREENING_FAILED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_unavailable_beats_screening_failed_on_decide
          rationale: "ERR_SCREENING_FAILED is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_unit_not_available_already_covered_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_UNIT_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lease_sign_requires_unit_vacant_ready
          rationale: "ERR_UNIT_NOT_AVAILABLE is asserted as the failure path of the named §1.8 instance."

