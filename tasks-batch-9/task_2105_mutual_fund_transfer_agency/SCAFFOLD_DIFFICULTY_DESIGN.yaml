  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_account_state_error_outranks_blue_sky_capacity_error
        grounds:
          - "validations[priority=80]"
          - "validations[priority=140]"
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_BLUE_SKY_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The colliding pair is category state (priority 80, ERR_ACCOUNT_NOT_ACTIVE) against category
          business_fiscal (priority 140, ERR_BLUE_SKY_CAPACITY_EXCEEDED): a 60000.00 purchase on a CLOSED
          account against a registration holding only 50000.00 violates both, and the state error must win.
        test_recipe:
          setup:
            - "Class A with an NV registration of exactly 50000.00 registered."
            - "Account C is DIRECT/NV, was activated, holds nothing, and has been closed."
            - "NAV 2026-08-03 exists at the 10.0000 seed and is FINAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "NV", registered_amount: 50000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_nv: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "NV", tax_id: "505-05-0505", primary_owner_name: "Clara Closed", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_c: $.data.id }
            - call: "POST /shareholder-accounts/${acc_c}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts/${acc_c}/close"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_c}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "the error envelope carries error_id ERR_ACCOUNT_NOT_ACTIVE"
            - "the error envelope does NOT carry ERR_BLUE_SKY_CAPACITY_EXCEEDED"
            - "BlueSkyRegistration.${bs_nv}.reserved_amount == 0.00 and remaining_amount == 50000.00 (the rejected capture reserved nothing)"
            - "no Trade row exists for account ${acc_c}"

