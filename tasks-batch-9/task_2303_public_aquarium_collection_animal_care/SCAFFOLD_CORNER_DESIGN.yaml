      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
        captures: {ex_vc: $.data.version}
      - call: POST /aquarium/specimens/${s3_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_vc}'}
        as: AquaristTechnician
        captures: {err: $.data.error_id}
      - call: POST /aquarium/specimens/${s3_id}/exhibit-placements
        payload: {exhibit_id: '${ex_id}', expected_exhibit_version: '${ex_vc}', restricted_posture_override: true}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'after the first placement: occupied_bioload_units == 12.00, bioload_utilization_pct == 50.00, posture == OPEN'
      - 'second placement: HTTP 200 — 12.00 + 12.00 == 24 is NOT > 24'
      - 'after the second placement: occupied_bioload_units == 24.00, bioload_utilization_pct == 100.00, posture == RESTRICTED, last_posture_reason == BIOLOAD_PRESSURE'
      - 'third placement without the override: HTTP 409 and data.error_id == ERR_RESTRICTED_POSTURE_OVERRIDE_REQUIRED (priority 16 fires first)'
      - 'third placement with restricted_posture_override true: HTTP 409 and data.error_id == ERR_BIOLOAD_CAPACITY_EXCEEDED (24.00 + 12.00 > 24)'
      - 'final ledger unchanged: occupied_bioload_units == 24.00, Specimen.${s3_id}.disposition_status == CLEARED with exhibit_id == null'
  - name: validation_invalid_state_masks_the_bioload_capacity_rule
    claim_type: Priority conflict
    grounds:
    - §1.4 priority 10 (ERR_INVALID_STATE)
    - §1.4 priority 45 (ERR_BIOLOAD_CAPACITY_EXCEEDED)
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / priority_pair_a_invalid_state_masks_bioload_capacity
      rationale: That §1.8 instance violates both rules in one placement and pins the priority 10 answer.
  - name: validation_exhibit_closed_masks_the_missing_plan_entry_rule
    claim_type: Priority conflict
    grounds:
    - §1.4 priority 15 (ERR_EXHIBIT_CLOSED)
    - §1.4 priority 24 (ERR_NO_APPROVED_PLAN_ENTRY)
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / priority_pair_b_exhibit_closed_masks_missing_plan_entry
      rationale: That §1.8 instance builds a CLOSED exhibit with no approved line for the species and pins the priority 15 answer.
  - name: validation_session_in_past_masks_the_guest_capacity_rule
    claim_type: Priority conflict
    grounds:
    - §1.4 priority 32 (ERR_SESSION_IN_PAST)
    - §1.4 priority 38 (ERR_GUEST_CAPACITY_EXCEEDED)
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / priority_pair_c_session_in_past_masks_guest_capacity
      rationale: That §1.8 instance books a past session that also oversells its guest cap and pins the priority 32 answer.
  - name: validation_quarantine_clearance_requires_an_issued_import_permit
    claim_type: Cascading validation
    grounds:
    - §1.4 priority 26 (ERR_PERMIT_NOT_ISSUED)
    - §1.2 QuarantineCase ACTIVE -> CLEARED
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / cross_entity_clearance_blocked_until_import_permit_issued
      rationale: That §1.8 instance shows the clearance blocked until the IMPORT permit reaches ISSUED, which is the cascading check-A-requires-check-B claim for this rule.
- section: endpoints
  instances:
  - name: endpoint_species_create_read_and_filtered_list_paginate_independently
    claim_type: Standard CRUD
    grounds:
    - §1.5 POST /aquarium/species
    - §1.5 GET /aquarium/species/{id}
    - §1.5 GET /aquarium/species (taxon_group / protection_status / limit / offset)
    - §1.0 response_envelope (response_type, total_count, has_more, meta)
    distinguishing_aspect: 'The list filters compose with pagination independently: a taxon_group filter narrows three rows to two, and limit 1 over that filtered set reports total_count 2 with has_more true — the count describes the FILTERED population, not the whole table, and not the page.'
    test_recipe:
      setup:
      - 'Three species: two TELEOST rows (one UNLISTED, one CITES_APPENDIX_II) and one INVERTEBRATE row.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp1_id: $.data.id, sp1_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Cheilinus undulatus, common_name: humphead wrasse, taxon_group: TELEOST, protection_status: CITES_APPENDIX_II, sustainability_rating: YELLOW, bioload_units_per_specimen: 20, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp2_id: $.data.id, sp2_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Metridium senile, common_name: plumose anemone, taxon_group: INVERTEBRATE, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 1, base_quarantine_days: 14, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp3_id: $.data.id, sp3_v1: $.data.version}
      trigger:
      - call: GET /aquarium/species/${sp2_id}
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {taxon_group: TELEOST, limit: 1}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {taxon_group: TELEOST, limit: 1, offset: 1}
        as: CuratorOfCollections
      - call: GET /aquarium/species
        payload: {protection_status: CITES_APPENDIX_II}
        as: CuratorOfCollections
      assert:
      - the single read returns HTTP 200 with response_type == "object", scientific_name == "Cheilinus undulatus", permit_required == true and version == 1
      - 'first filtered page: response_type == "array", one element, total_count == 2, has_more == true'
      - 'second filtered page (offset 1): one element, total_count == 2, has_more == false'
      - the protection_status filter returns total_count == 1 and data[0].id == ${sp2_id}
      - every response carries meta.api_request_id and meta.logical_clock_utc == 2026-08-01T00:00:00Z
  - name: endpoint_institution_patch_touches_only_the_supplied_fields
    claim_type: Standard CRUD
    grounds:
    - §1.5 PATCH /aquarium/institutions/{id} (every input optional)
    - §1.1 Institution.version / updated_at
    - §1.3 derived_flag_reconciliation Institution.is_receiving_eligible
    distinguishing_aspect: A PATCH carrying only last_audit_at leaves accreditation_status, welfare_audit_score and is_receiving_eligible untouched while still bumping version and updated_at — and because eligibility does not flip, the institution-ineligibility cascade does not run.
    test_recipe:
      setup:
      - One ACCREDITED institution with welfare_audit_score 88.00 and last_audit_at 2026-05-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      trigger:
      - call: PATCH /aquarium/institutions/${inst_id}
        payload: {last_audit_at: '2026-07-15T00:00:00Z'}
        as: ComplianceDirector
      - call: GET /aquarium/institutions/${inst_id}
        payload: {}
        as: ComplianceDirector
      assert:
      - HTTP 200 on the PATCH
      - Institution.last_audit_at == 2026-07-15T00:00:00Z
      - accreditation_status == ACCREDITED and welfare_audit_score == 88.00 are unchanged
      - is_receiving_eligible == true (recomputed, same value)
      - version == 2 and updated_at == 2026-08-01T00:00:00Z
      - GET /aquarium/transfer-requests returns total_count == 0 — no cascade ran
  - name: endpoint_session_transition_action_returns_the_updated_session_not_an_empty_body
    claim_type: Action endpoint
    grounds:
    - §1.5 POST /aquarium/interaction-sessions/{id}/transitions (output InteractionSession, success_code 200)
    - §1.2 InteractionSession SCHEDULED -> ACTIVE
    - §1.2 InteractionSession ACTIVE -> COMPLETED
    - §1.1 InteractionSession.status / version
    distinguishing_aspect: The action endpoint answers 200 with the full mutated InteractionSession on every step, so the caller never needs a follow-up GET; version advances 1 -> 2 -> 3 across the two transitions and COMPLETED is terminal.
    test_recipe:
      setup:
      - One SCHEDULED FEEDING_ENCOUNTER on an interaction-enabled exhibit served by a NORMAL plant, booked for 2026-08-02 10:00-11:00. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_id}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {sess_id: $.data.id}
      trigger:
      - call: POST /aquarium/interaction-sessions/${sess_id}/transitions
        payload: {action: ACTIVATE}
        as: AquaristTechnician
      - call: POST /aquarium/interaction-sessions/${sess_id}/transitions
        payload: {action: COMPLETE}
        as: AquaristTechnician
      - call: GET /aquarium/interaction-sessions/${sess_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'ACTIVATE: HTTP 200, response_type == "object", data.status == ACTIVE and data.version == 2'
      - 'COMPLETE: HTTP 200, data.status == COMPLETED and data.version == 3'
      - the response bodies are full InteractionSession objects carrying exhibit_id, program_type, starts_at, ends_at, max_guests and guest_count
      - the follow-up GET agrees with the last action response
      - Exhibit.suspended_session_count == 0
  - name: endpoint_request_permits_link_returns_only_that_requests_permits
    claim_type: Cross-reference link
    grounds:
    - §1.5 GET /aquarium/acquisition-requests/{id}/permits (output Permit[], status and permit_type filters)
    - §1.1 Permit.acquisition_request_id
    - §1.5 POST /aquarium/permits
    distinguishing_aspect: Two sibling requests each own one IMPORT permit; the sub-resource link returns exactly one row per parent, and the status filter distinguishes the DRAFT dossier from the SUBMITTED one — proving the link is scoped by acquisition_request_id rather than returning the global permit table.
    test_recipe:
      setup:
      - 'Two WILD_COLLECTION requests in PENDING_PERMIT beneath the same plan line, each with one IMPORT permit: request A''s permit is SUBMITTED, request B''s is still DRAFT.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 8}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 4, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_a: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_a}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_a}', permit_type: IMPORT, authority_reference: NMFS-2026-1177, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm_a: $.data.id}
      - call: POST /aquarium/permits/${pm_a}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}'}
        as: CuratorOfCollections
        captures: {ar_b: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_b}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/permits
        payload: {acquisition_request_id: '${ar_b}', permit_type: IMPORT, authority_reference: NMFS-2026-1188, document_codes: [HEALTH_CERTIFICATE, ORIGIN_DECLARATION, IMPORT_LICENSE]}
        as: PermitOfficer
        captures: {pm_b: $.data.id}
      trigger:
      - call: GET /aquarium/acquisition-requests/${ar_a}/permits
        payload: {}
        as: PermitOfficer
      - call: GET /aquarium/acquisition-requests/${ar_b}/permits
        payload: {status: DRAFT}
        as: PermitOfficer
      - call: GET /aquarium/acquisition-requests/${ar_a}/permits
        payload: {status: DRAFT}
        as: PermitOfficer
      - call: GET /aquarium/acquisition-requests/${ar_a}/permits
        payload: {permit_type: TRANSPORT}
        as: PermitOfficer
      assert:
      - 'request A''s link: total_count == 1 and data[0].id == ${pm_a} with status SUBMITTED and submission_round 1'
      - 'request B''s DRAFT-filtered link: total_count == 1 and data[0].id == ${pm_b}'
      - 'request A''s DRAFT-filtered link: total_count == 0 and has_more == false — B''s DRAFT permit does NOT leak into A''s link'
      - 'request A''s TRANSPORT-filtered link: total_count == 0'
      - both permits report permit_required == true on their parent request
  - name: endpoint_exhibit_list_filters_on_the_computed_posture_field
    claim_type: Computed read
    grounds:
    - §1.5 GET /aquarium/exhibits (posture and life_support_system_id filters)
    - §1.5 GET /aquarium/life-support-systems/{id}/exhibits
    - §1.3 exhibit_posture
    - §1.3 exhibit_bioload_ledger
    - §1.1 Exhibit.posture / occupied_bioload_units / bioload_utilization_pct
    distinguishing_aspect: 'posture is a DERIVED field yet it is a first-class list filter: after one plant goes to WARNING, posture=RESTRICTED returns only the two exhibits it serves, and the list payload carries the computed ledger fields, so no per-row GET is needed.'
    test_recipe:
      setup:
      - A COLD_MARINE plant serving two exhibits and a second COLD_MARINE plant serving a third exhibit. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-2, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss2_id: $.data.id}
