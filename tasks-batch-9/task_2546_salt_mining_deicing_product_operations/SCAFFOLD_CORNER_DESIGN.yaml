              captures: { lot_id: "$.data[0].id", lot_purity: "$.data[0].purity_pct_nacl" }
          assert:
            - "HTTP 201 and ${pur} == 99.900 (not 102.100)"
            - "${yld} == 410.00"
            - "Panel.${panel_id}.recoverable_tons == 50000.00 (grade tier 1.00, no insolubles penalty at 0.50 %)"
            - "the PASS succeeds because 99.900 >= the FOOD_GRADE minimum 99.6"
