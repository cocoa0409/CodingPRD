            - { call: "GET /dairy/distributors/${d1}", as: Any }
          assert:
            - "Error response: response_type == error, data.error_id == ERR_STORE_NOT_FOUND, data.message non-empty, meta.api_request_id present"
            - "Success response: response_type == object, meta.api_request_id and meta.api_request_timestamp present, data holds the Distributor"

      - name: wrong_state_sweep_store_period_return
        claim_type: invalid_transition
        grounds: ["errors[ERR_STORE_NOT_ACTIVE]", "errors[ERR_PERIOD_CLOSED]", "errors[ERR_RETURN_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Deactivating an INACTIVE store, closing a CLOSED period (or publishing into it), and approving a CREDITED return each hit their state-gate error with no side effects."
        test_recipe:
          setup: ["Distributor, ACTIVE route, store S1, driver, product PL 250; pricing period 2026-08 with FINAL announcement then CLOSED; delivered order O1 with its return R1 already approved (CREDITED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T04:30:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
