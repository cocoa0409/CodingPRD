              captures: { plan_v1: $.data.version }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 3, priority_class: "STANDARD" }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots/${lot1}/release"
              payload: { expected_plan_version: "${plan_v1}" }
