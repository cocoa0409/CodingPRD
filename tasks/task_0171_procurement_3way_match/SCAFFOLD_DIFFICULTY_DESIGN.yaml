            - call: "POST /procurement/rfqs/${rfq3_id}/award"
              payload: { awarded_quote_id: "${quote3_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req3_id}", source_quote_id: "${quote3_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po3_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po3_id}", received_lines: [ { sku: "A", received_qty: 1 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr3_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po3_id}", goods_receipt_id: "${gr3_id}", invoice_number: "INV-PR-3", lines: [ { sku: "A", billed_qty: 1, billed_unit_price_cents: 2000 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv3_id: $.data.id }
          trigger:
            - call: "POST /procurement/invoices/${inv3_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
            - call: "GET /procurement/vendors/${v_id}"
              payload: {}
              as: ProcurementAdmin
              captures: { v_status: $.data.status, v_count: $.data.exception_count }
          assert:
            - "Invoice.${inv3_id}.match_status == EXCEPTION"
            - "each of the three matches opened exactly one OPEN MatchException with reason == PRICE_OVER_TOLERANCE attributed to ${v_id}"
            - "Vendor.${v_id}.exception_count == 3"
            - "Vendor.${v_id}.status == PROBATION (exception_count 3 exceeds VENDOR_PROBATION_THRESHOLD)"

  # ===========================================================================
  # RULE 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: segregation_beats_state_on_self_approve_of_draft_requisition
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          PAIR (auth/segregation priority 5) vs (state priority 6): the requester tries to
          approve their OWN requisition while it is still DRAFT (not PENDING_APPROVAL). Both
          the segregation-of-duties check and the state check would fail; priority 5 < 6 so
          ERR_SEGREGATION_OF_DUTIES (403) wins over ERR_INVALID_STATE (409). A different
          category pair than the existence-vs-business_temporal instance.
        test_recipe:
          setup:
            - "Buyer B1 created a DRAFT requisition (requester_id = B1, never submitted)."
            - "B1 also holds the Approver role for the approve call but is the requester, so segregation triggers."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-9" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE9", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Glue", lines: [ { sku: "A", description: "Glue", quantity: 2, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (priority 5 beats priority-6 ERR_INVALID_STATE)"

      - name: existence_beats_temporal_on_quote_with_missing_rfq_and_bad_window
        grounds:
          - validations[priority=3]
          - validations[priority=9]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_QUOTE_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          PAIR (existence priority 3) vs (business_temporal priority 9): a quote is posted with a
          non-existent rfq_id AND a submitted_at outside any window. Priority 3 < 9 so
          ERR_NOT_FOUND (404) wins over ERR_QUOTE_OUTSIDE_WINDOW (409). A different error-category
          pair than the segregation-vs-state instance.
        test_recipe:
          setup:
            - "A Vendor exists; no RFQ with the supplied id exists."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-10" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "00000000-0000-4000-8000-000000000000", vendor_id: "${v_id}", submitted_at: "1999-01-01T00:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND (priority 3 beats priority-9 ERR_QUOTE_OUTSIDE_WINDOW)"

  # ===========================================================================
  # RULE 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: price_tolerance_at_floor_ceiling_passes_one_cent_over_fails
        grounds:
          - calculations.three_way_match
          - validations[priority=16]
          - state_machines.Invoice.transitions.UNMATCHED_to_MATCHED
          - state_machines.Invoice.transitions.UNMATCHED_to_EXCEPTION
        distinguishing_aspect: |
          NUMERIC THRESHOLD CROSSING on POST /invoices/{id}/match: billed_unit_price_cents exactly
          at floor(1000*1.05)=1050 PASSES price_ok (<=), and 1051 FAILS with PRICE_OVER_TOLERANCE.
          A distinct metric and endpoint from the empty-collection on-time boundary.
        test_recipe:
          setup:
            - "A fully-received STANDARD PO with sku=A ordered qty=4 unit_price_cents=1000."
            - "Two invoices on the same PO/receipt: one billed_unit_price_cents=1050 (boundary), one =1051 (one over)."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-11" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE11", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Discs", lines: [ { sku: "A", description: "Disc", quantity: 4, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 4 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po_id}", goods_receipt_id: "${gr_id}", invoice_number: "INV-BND-OK", lines: [ { sku: "A", billed_qty: 4, billed_unit_price_cents: 1050 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv_ok_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po_id}", goods_receipt_id: "${gr_id}", invoice_number: "INV-BND-OVER", lines: [ { sku: "A", billed_qty: 4, billed_unit_price_cents: 1051 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv_over_id: $.data.id }
          trigger:
            - call: "POST /procurement/invoices/${inv_ok_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
              captures: { ms_ok: $.data.match_status }
            - call: "POST /procurement/invoices/${inv_over_id}/match"
