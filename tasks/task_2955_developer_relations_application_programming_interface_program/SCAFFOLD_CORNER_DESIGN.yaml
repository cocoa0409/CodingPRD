      - name: version_creation_under_unknown_product_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ApiVersion.fields.api_product_id
          - endpoints.POST /api-products/{id}/versions
          - validations.priority_6_path_id_existence
          - errors.ERR_API_PRODUCT_NOT_FOUND
        distinguishing_aspect: >-
          The child is addressed through its parent's path segment, so an unminted parent id
          must yield ERR_API_PRODUCT_NOT_FOUND before any body validation runs — even when the
          body itself is well formed — and no orphan version may be persisted.
        test_recipe:
          setup:
            - "one real ApiProduct exists, so the failure cannot be an empty-table artefact"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /api-products/00000000-0000-4000-8000-000000000000/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "HTTP 404 with data.error_id == ERR_API_PRODUCT_NOT_FOUND"
            - "GET /api-products/${p1_id}/versions returns total_count == 0"

