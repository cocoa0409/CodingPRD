    - state_machines.LifecycleCommitment.REQUESTED_to_GRANTED
    - entities.AcceleratorProduct.fields.lifecycle_min_remaining_days
    - entities.AcceleratorProduct.fields.lifecycle_stage
    distinguishing_aspect: 'The floor is derived from the REQUESTED horizon first and only then

      clamped by lifecycle stage, so the same embedded commitment reads 1825

      days while the SKU sits at GENERAL_AVAILABILITY and 2555 days once the

      SKU reaches MATURE — reversing steps 1 and 2 would leave the stage gate

      with nothing to clamp, pinning mode (c).

