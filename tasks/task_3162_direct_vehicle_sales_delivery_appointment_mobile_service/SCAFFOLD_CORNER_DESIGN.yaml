              as: TradeInSpecialist
              captures: { apr_exp_id: $.data.id }
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_exp_id}/appraise"
              payload: {}
              as: TradeInSpecialist
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_exp_id}/offer"
              payload: {}
              as: TradeInSpecialist
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/orders/${ord_id}/trade-in-appraisals/${apr_exp_id}/accept"
              payload: {}
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_APPRAISAL_OFFER_EXPIRED"
            - "TradeInAppraisal.${apr_exp_id}.status == EXPIRED"
            - "GET /v1/orders/${ord_id}/fee-ledger-entries shows the +950000 TRADE_IN_CREDIT entry and its -950000 reversal, summing to 0"

      - name: keyword_filter_is_applied_on_the_listing_endpoint
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=3]
          - endpoints.GET_/v1/orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered listing honours both a status filter and the pagination envelope: status=DRAFT returns only the unplaced order and reports total_count 2 with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two orders for one buyer, one placed and one left DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
