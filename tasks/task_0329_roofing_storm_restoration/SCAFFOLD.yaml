    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- Job ----
