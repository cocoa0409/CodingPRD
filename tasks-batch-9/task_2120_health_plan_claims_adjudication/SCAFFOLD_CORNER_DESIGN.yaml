            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 1 has copay_cents == 2500, deductible_applied_cents == 0, coinsurance_cents == 1500, member_liability_cents == 4000, plan_paid_cents == 6000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} line_number 2 has copay_cents == 0, deductible_applied_cents == 40000, coinsurance_cents == 0, member_liability_cents == 40000, plan_paid_cents == 0"

