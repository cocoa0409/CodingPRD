              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGEN_WASH_REQUIRED with HTTP 422 ([MILK] not a subset of [])"
            - "ProductionRun.${run_id}.status remains PLANNED"

      - name: schedule_conflict_error_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LINE_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / line_runs_half_open_adjacency
          rationale: "ERR_LINE_SCHEDULE_CONFLICT is asserted (with half-open adjacency semantics) by the named difficulty instance."

      - name: window_overlap_error_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / window_ship_intervals_closed_overlap
          rationale: "ERR_WINDOW_OVERLAP is asserted (with closed-interval touching semantics) by the named difficulty instance."

      - name: line_not_available_error_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LINE_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_start_requires_available_line
          rationale: "ERR_LINE_NOT_AVAILABLE on run start during CHANGEOVER is asserted by the named difficulty instance."

      - name: insufficient_component_lots_error_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_COMPONENT_LOTS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / gift_complete_requires_active_component_lots
          rationale: "ERR_INSUFFICIENT_COMPONENT_LOTS with a fully BLOCKED FEFO pool is asserted by the named difficulty instance."

  # ==================================================================
  # Section: rbac
  # ==================================================================
  - section: rbac
    instances:
      - name: window_publish_by_operator_forbidden
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "publish is exclusive to PlantManager; LineOperator gets 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup:
            - "A DRAFT window exists"
          setup_api_calls:
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 1000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403"
            - "SeasonalWindow.${win_id}.status remains DRAFT"

      - name: changeover_swab_by_planner_forbidden
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "swab is exclusive to SanitationLead; ProductionPlanner gets 403 ERR_UNAUTHORIZED_ROLE even though planners created the line."
        test_recipe:
          setup:
            - "LINE-1 exists with an open changeover (PENDING_SWAB)"
          setup_api_calls:
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /changeovers/${ch_id}/swab"
              payload: { swab_passed: true }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with HTTP 403"
            - "Changeover.${ch_id}.status remains PENDING_SWAB"

  # ==================================================================
  # Section: complexity_layers (cross-cutting)
  # ==================================================================
  - section: complexity_layers
    instances:
      - name: run_create_stale_window_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[run-create-stale-window]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SeasonalWindow.version: the client observed version 1 (at DRAFT), publish advanced it to 2, so the create carrying expected_window_version 1 fails with 412."
        test_recipe:
          setup:
            - "HOLIDAY window created (version 1) then published (version 2); product/recipe/line exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 100000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "HOLIDAY", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 10000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id, win_v_draft: $.data.version }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v_draft}" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (expected ${win_v_draft} is stale after publish)"
            - "no run persisted: GET /production-runs returns an empty list"

      - name: changeover_create_stale_line_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[changeover-create-stale-line]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ProductionLine.version: after a first changeover cycle advanced the line to version 3, a second create carrying the creation-time version 1 fails with 412."
        test_recipe:
          setup:
            - "LINE-1 (version captured at creation) has completed one SHAPE_ONLY changeover cycle"
          setup_api_calls:
            - call: "POST /molds"
              payload: { shape_code: "STAR", cavity_count: 60 }
              as: ProductionPlanner
              captures: { mold_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "SHAPE_ONLY", to_mold_id: "${mold_id}", expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { ch_1: $.data.id }
            - call: "POST /changeovers/${ch_1}/swab"
              payload: { swab_passed: true }
              as: SanitationLead
              as_user_id: "san-1"
            - call: "POST /changeovers/${ch_1}/release"
              payload: {}
              as: QualityManager
              as_user_id: "qm-1"
          trigger:
            - call: "POST /production-lines/${line_id}/changeovers"
              payload: { changeover_type: "ALLERGEN_WASH", target_allergens: ["MILK"], expected_line_version: "${line_v}" }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (line version advanced past ${line_v} during the first changeover cycle)"
            - "ProductionLine.${line_id}.status remains AVAILABLE (no second changeover opened)"

      - name: deviation_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / run_deviation_cascades_to_lot_hold_and_window
          rationale: "The depth-4 deviation cascade (run -> lot -> hold -> lot -> window) is asserted end-to-end by the named difficulty instance."

  # ==================================================================
  # Section: consistency_model
  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_reservation_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile, calculations.packaging_requirement]
        distinguishing_aspect: "Immediate consistency: the run-create response already shows packaging_reserved_qty 50, and a follow-up read of the component shows qty_reserved 50 with no delay or reconciliation lag."
        test_recipe:
          setup:
            - "BASE window PUBLISHED; product/recipe/line exist; component upc 10 on_hand 1000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "NOVELTY", name: "Novelty", product_type: "STANDARD", brand: "OWN", base_price_cents: 800, unit_weight_grams: 100, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { prod_id: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${prod_id}", name: "Novelty mass", shape_code: "STAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: [], standard_yield_pct: 0.95 }
              as: ProductionPlanner
              captures: { rec_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "LINE-1" }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /seasonal-windows"
              payload: { season_code: "BASE", build_start: "2026-09-01T00:00:00Z", build_end: "2026-10-15T00:00:00Z", ship_start: "2026-11-01T00:00:00Z", ship_end: "2026-12-26T00:00:00Z", target_units: 5000, markdown_tiers: [] }
              as: ProductionPlanner
              captures: { win_id: $.data.id }
            - call: "POST /seasonal-windows/${win_id}/publish"
              payload: {}
              as: PlantManager
              captures: { win_v: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "STANDARD", planned_units: 500, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T16:00:00Z", expected_window_version: "${win_v}" }
              as: ProductionPlanner
              captures: { run_rsv: $.data.packaging_reserved_qty }
            - call: "GET /packaging-components"
              payload: {}
              as: ProductionPlanner
              captures: { comp_rsv: "$.data[0].qty_reserved", comp_avail: "$.data[0].qty_available" }
          assert:
            - "create response packaging_reserved_qty == 50"
            - "immediate read: component qty_reserved == 50 and qty_available == 950 (no eventual-consistency lag)"
