              as: StaffingCoordinator
              captures: { rel_below: $.data.reliability_score, season_below: $.data.season_reliability_score, status_below: $.data.status, pool_below: $.data.in_backfill_pool, reason_below: $.data.last_status_reason }
          assert:
            - "${rel_start} == 100 and ${season_start} == 100 with status ACTIVE and no assignment history"
            - "${rel_1} == 75 (one NO_SHOW alone) and ${status_1} == 'ACTIVE'"
            - "${a2_late} == true - check-in at 14:06 is past shift_start + LATE_GRACE_MINUTES(5)"
            - "${a2_worked} == 54 (14:06 to 15:00) - the late check-in shortens the shift but the score penalty is what matters here"
            - "${rel_after_2} == 70 (window {late COMPLETED, NO_SHOW}: 100 - 25 - 8 + 3) and ${status_2} == 'ACTIVE'"
            - "${rel_at_floor} == 65 exactly (window {late COMPLETED, late COMPLETED, NO_SHOW}: 100 - 25 - 16 + 6), ${status_at_floor} == 'ACTIVE' and ${pool_at_floor} == true - the floor is a strict less-than, so equality does NOT demote"
