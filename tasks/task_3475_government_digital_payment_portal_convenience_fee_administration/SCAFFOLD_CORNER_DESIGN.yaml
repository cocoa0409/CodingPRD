              payload: { full_name: "Patrick Parker II", email: "pat@example.com", billing_zip: "73103" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_DUPLICATE_PAYER_EMAIL"

      - name: err_duplicate_service_code_reuse_after_deactivate
        claim_type: violation_to_error
        grounds:
          - errors.ERR_DUPLICATE_SERVICE_CODE
          - entities.ServiceCatalogItem.fields.service_code
        distinguishing_aspect: "service_code uniqueness is scoped to non-DEACTIVATED services of one agency: a live duplicate is 409, but after deactivating the first service the same code creates cleanly."
        test_recipe:
          setup:
            - "CF agency exists; one DRAFT service with code DL-RENEW."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_service
          trigger:
            - call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW", name: "Duplicate", fee_model: "ABSORBED", allowed_methods: ["CARD"], min_amount_cents: 1, max_amount_cents: 100, gl_code: "9" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/services/${svc_id}/deactivate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW", name: "Replacement", fee_model: "ABSORBED", allowed_methods: ["CARD"], min_amount_cents: 1, max_amount_cents: 100, gl_code: "9" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { svc_new: $.data.id }
          assert:
            - "the duplicate create returns 409 and err_id == ERR_DUPLICATE_SERVICE_CODE"
            - "after deactivate, the same code returns 201 with a new id ${svc_new} != ${svc_id}"

      - name: err_batch_already_open
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BATCH_ALREADY_OPEN
