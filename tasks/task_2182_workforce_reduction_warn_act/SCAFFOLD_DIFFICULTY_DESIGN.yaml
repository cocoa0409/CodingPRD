              as_user_id: "u-admin-1"
            - call: "POST /warn-rules"
              payload: { jurisdiction: "STATE", state_code: "NY", rule_code: "NY-MINI-WARN", min_loss_count: 2, min_percent: 25.0, absolute_count: 10, notice_days: 90, window_days: 30, counts_part_time: true, min_service_days: 0, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE", "UNION_NOTICE", "JOB_TITLES_AFFECTED"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /sites"
              payload: { name: "NY HQ", state_code: "NY", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", ben_id: "$.data.employee_ids[1]", carla_id: "$.data.employee_ids[2]" }
            - call: "POST /reduction-plans"
              payload: { name: "2026 Q4 NY Restructuring", decisional_unit_name: "NY HQ Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /selections"
              payload: { plan_id: "${plan_id}", employee_id: "${alice_id}", proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { sel_alice: $.data.id }
            - call: "POST /selections/${sel_alice}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { plan_v1: $.data.version }
            - call: "POST /adverse-impact-analyses"
              payload: { plan_id: "${plan_id}", method: "IMPACT_RATIO", expected_plan_version: "${plan_v1}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { analysis_id: $.data.id }
            - call: "POST /adverse-impact-analyses/${analysis_id}/clear"
              payload: { justification: "Single-incumbent role elimination; business necessity documented." }
              as: EmploymentCounsel
