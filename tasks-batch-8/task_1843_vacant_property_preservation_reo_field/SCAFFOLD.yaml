    input: ["reason?"]
    output: Invoice
    side_effects: ["Property.ytd_investor_approved_cents -= approved_amount_cents; review flag re-evaluated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role value not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not listed on endpoint, or entity-backed ownership violated (wrong servicer, wrong crew)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum value, negative amount, quantity < 1, zero or multiple subject FKs on photo evidence, estimate missing when personal property present, new_valid_to not after current end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure on a transition endpoint (wrong from-state, terminal lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PROPERTY_NOT_ACTIVE, http: 409, condition: "Operation requires Property.status == ACTIVE but property is CONVEYED" }
  - { id: ERR_POSTURE_BLOCKS_ORDER, http: 409, condition: "GRASS_CUT or SNOW_REMOVAL work order creation while Property.compliance_posture == NON_COMPLIANT" }
  - { id: ERR_OPEN_WORK_ORDERS, http: 409, condition: "Property convey attempted with work orders in ISSUED/ASSIGNED/IN_PROGRESS/SUBMITTED" }
  - { id: ERR_PROPERTY_OCCUPIED, http: 409, condition: "Securing/winterization/debris/personal-property work or plan resume while occupancy_status == OCCUPIED" }
  - { id: ERR_NOT_ASSIGNED_CREW, http: 409, condition: "FieldCrew X-User-ID does not equal the work order's assigned_crew_id on start/submit" }
  - { id: ERR_NOT_BID_OWNER, http: 409, condition: "FieldCrew X-User-ID does not equal bid's submitted_by_crew_id on submit/revise/withdraw" }
  - { id: ERR_PHOTO_INCOMPLETE, http: 409, condition: "photo_completeness minimums for the order type not met by unflagged photos at submit" }
  - { id: ERR_PHOTO_FLAGGED_OPEN, http: 409, condition: "Submit or approve while any linked photo remains flagged and uncleared" }
  - { id: ERR_SOD_FLAG_CLEAR, http: 409, condition: "QualityReviewer attempts to clear a flag they themselves set (segregation of duties)" }
  - { id: ERR_CREW_DAY_CAPACITY, http: 409, condition: "Assign/reassign would put crew at or above daily_capacity_jobs for the scheduled_date" }
  - { id: ERR_BID_REQUIRED_OVER_CAP, http: 409, condition: "submitted_cost_cents strictly greater than requires_bid_over_cents and no APPROVED bid linked" }
  - { id: ERR_ALLOWABLE_NOT_FOUND, http: 409, condition: "No InvestorAllowable row matches (property.investor_type, mapped item_code) effective at clock date" }
  - { id: ERR_REGISTRATION_REQUIRED, http: 409, condition: "start-cure requires an ACTIVE MunicipalRegistration covering the property's municipality" }
  - { id: ERR_REGISTRATION_OVERLAP, http: 409, condition: "Activation would overlap an ACTIVE registration's half-open window for the same property+municipality" }
  - { id: ERR_REGISTRATION_NUMBER_NOT_UNIQUE, http: 409, condition: "registration_number already used in the municipality" }
  - { id: ERR_CITATION_NOT_UNIQUE, http: 409, condition: "citation_number already used in the property's municipality" }
  - { id: ERR_CURE_DEADLINE_PASSED, http: 409, condition: "start-cure with clock_date strictly after cure_deadline" }
  - { id: ERR_CURE_WORK_INCOMPLETE, http: 409, condition: "submit-cure while linked cure work order is not COMPLETED" }
  - { id: ERR_SEASON_WINDOW_CLOSED, http: 409, condition: "Plan resume while clock date is outside the plan's inclusive season window" }
  - { id: ERR_HOLD_PERIOD_ACTIVE, http: 409, condition: "authorize-disposal while disposition is still IN_HOLD (clock before hold_until_date)" }
  - { id: ERR_DISPOSAL_AUTHORITY_LIMIT, http: 409, condition: "VendorAdmin authorizing disposal of items valued >= 50000 cents; requires Servicer" }
  - { id: ERR_INVOICE_NO_LINES, http: 409, condition: "Invoice submit with zero expense lines" }
  - { id: ERR_FINANCIAL_REVIEW_REQUIRED, http: 409, condition: "Invoice submit while property.financial_review_required is true" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 409, condition: "Appeal attempted with appeal_round already 1" }
  - { id: ERR_DAMAGE_NOT_ACCEPTING_BIDS, http: 409, condition: "Bid create/submit/approve while damage report is not in BID_REQUESTED" }
  - { id: ERR_OPEN_BIDS, http: 409, condition: "Damage close while bids in DRAFT/SUBMITTED/COUNTERED exist" }
  - { id: ERR_REPAIR_NOT_COMPLETED, http: 409, condition: "Damage close with outcome CLOSED while the approved repair work order is not COMPLETED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Servicer
    description: "Mortgage servicer client: issues and cancels work orders, conveys properties, reviews/approves/counters/rejects bids, approves/denies/pays/voids invoices"
    identity: "entity_backed:Servicer"
    exclusive_operations:
      - "POST /preservation/work-orders — issue work order"
      - "POST /preservation/work-orders/{id}/cancel — cancel work order"
      - "POST /preservation/properties/{id}/convey — convey property"
      - "POST /preservation/bids/{id}/approve — approve bid"
      - "POST /preservation/bids/{id}/counter — counter bid"
      - "POST /preservation/bids/{id}/reject — reject bid"
      - "POST /preservation/invoices/{id}/approve — approve invoice"
      - "POST /preservation/invoices/{id}/deny — deny invoice"
      - "POST /preservation/invoices/{id}/mark-paid — mark invoice paid"
      - "POST /preservation/invoices/{id}/void — void invoice approval"
    shared_operations:
      - "POST /preservation/properties — create property (own servicer_id only)"
      - "POST /preservation/inspections — schedule inspection"
      - "POST /preservation/personal-property-dispositions/{id}/authorize-disposal — required authorizer for valuation >= 50000"
      - "All GET endpoints"

  - name: VendorAdmin
    description: "Field services vendor operations administrator: master data, dispatch support, municipal and violation handling, invoice assembly and appeal, sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/_clock/set_current_utc — set logical clock"
      - "POST /preservation/servicers — create servicer"
      - "POST /preservation/crews — create crew"
      - "POST /preservation/investor-allowables / PATCH — manage allowable schedule"
      - "POST /preservation/ops/run-daily-sweep — run daily sweep"
      - "POST /preservation/recurring-plans{,/suspend,/resume,/end} — manage plans"
      - "POST /preservation/registrations{,/activate,/renew,/release} — manage registrations"
      - "POST /preservation/code-violations{,/start-cure,/verify,/reject-cure} — manage violations"
      - "POST /preservation/damage-reports/{id}/triage — triage damage"
      - "POST /preservation/damage-reports/{id}/request-bids — open bidding"
      - "POST /preservation/damage-reports/{id}/close — close/monitor damage"
      - "POST /preservation/invoices/{id}/lines — add expense line"
      - "POST /preservation/invoices/{id}/submit — submit invoice"
      - "POST /preservation/invoices/{id}/appeal — appeal invoice"
      - "POST /preservation/properties/{id}/clear-financial-review — clear review flag"
      - "POST /preservation/personal-property-dispositions/{id}/dispose — record disposal outcome"
    shared_operations:
      - "POST /preservation/properties — create property"
      - "POST /preservation/inspections — schedule inspection"
      - "POST /preservation/personal-property-dispositions — document items"
      - "POST /preservation/personal-property-dispositions/{id}/authorize-disposal — only when valuation < 50000"
      - "All GET endpoints"

  - name: Dispatcher
    description: "Vendor dispatcher: assigns and reassigns crews to work orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/work-orders/{id}/assign — assign crew"
      - "POST /preservation/work-orders/{id}/reassign — reassign crew (OCC)"
    shared_operations:
      - "All GET endpoints"

  - name: FieldCrew
    description: "Field crew member: starts and submits assigned work, records inspections, reports damage, bids on repairs, uploads photos"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /preservation/work-orders/{id}/start — start assigned order"
      - "POST /preservation/work-orders/{id}/submit — submit assigned order"
      - "POST /preservation/inspections/{id}/record — record inspection findings"
      - "POST /preservation/inspections/{id}/verify — verify occupancy"
      - "POST /preservation/damage-reports — report damage"
      - "POST /preservation/damage-reports/{id}/bids — create bid"
      - "POST /preservation/bids/{id}/submit — submit own bid"
      - "POST /preservation/bids/{id}/revise — revise own bid"
      - "POST /preservation/bids/{id}/withdraw — withdraw own bid"
      - "POST /preservation/photo-evidence — upload photo"
      - "POST /preservation/code-violations/{id}/submit-cure — submit cure to municipality"
    shared_operations:
      - "POST /preservation/personal-property-dispositions — document items"
      - "All GET endpoints"

  - name: QualityReviewer
    description: "Vendor QA reviewer: approves/rejects work order submissions and flags deficient photo evidence; flagger may not clear own flag (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /preservation/work-orders/{id}/approve — QA approve"
      - "POST /preservation/work-orders/{id}/reject — QA reject to rework"
      - "POST /preservation/work-orders/{id}/complete — complete order, spawns invoice"
      - "POST /preservation/photo-evidence/{id}/flag — flag photo"
      - "POST /preservation/photo-evidence/{id}/clear-flag — clear another reviewer's flag"
    shared_operations:
      - "All GET endpoints"
