              as: Nurse
              as_user_id: "${nurse3_id}"
              captures: { slot_c: $.data.id }
          trigger:
            - call: "POST /otp/dose-dispenses"
              payload: { dose_order_id: "${o_a}", dose_date: "2026-12-21", scheduled_datetime: "2026-12-21T10:00:00Z", source_type: "OBSERVED_CLINIC", inventory_lot_id: "${mesa_lot_id}" }
              as: Nurse
              as_user_id: "${nurse3_id}"
              captures: { err_slots: $.data.error_id }
          assert:
            - "the first three schedulings each returned 201"
            - "GET /otp/dose-dispenses?program_id=${prog3_id}&dose_date=2026-12-21 returns exactly 3 rows"
            - "the fourth returns 409 and err_slots == ERR_NO_DOSE_CAPACITY"
            - "err_slots != ERR_DUPLICATE_ACTIVE_DOSE, so the rejection is the day-capacity bucket and not the per-patient permit"
            - "the fourth request used patient ${p_a} who already holds a dose that day, yet the capacity error won"

      - name: daily_dose_permit_uses_equality_forbidden_semantics_per_patient
        grounds:
          - validations[priority=13]
          - entities.DoseDispense.fields.dose_date
          - errors[ERR_DUPLICATE_ACTIVE_DOSE]
          - endpoints.POST_/otp/dose-dispenses
        distinguishing_aspect: "Interval semantics B is exact equality for a per-patient daily permit: two doses for the same patient whose intervals merely touch on the same dose_date collide and are rejected even though the shared day bucket still has spare capacity, so the semantics are equality-forbidden rather than count-based."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. A CA program with max_daily_dose_slots 20 so capacity cannot be the cause, one lot, one Physician, one Nurse and one ACTIVE patient on a 60 mg METHADONE order."
          setup_api_calls:
            - *k_clock
            - call: "POST /otp/programs"
