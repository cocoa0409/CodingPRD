            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 42, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
