        claim_type: peer_roles
        grounds:
          - roles.BillingAdmin
          - roles.CustomerService
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /rate-schedules is a BillingAdmin exclusive op; CustomerService attempting it returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /rate-schedules"
              payload: { code: "RES-RB1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
