            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Reviser", email: "r@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_r: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_r}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_r}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_r: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_r}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_r}/notify"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_r}/revision-requests"
              payload: { reason: "APPEAL_AMOUNT" }
