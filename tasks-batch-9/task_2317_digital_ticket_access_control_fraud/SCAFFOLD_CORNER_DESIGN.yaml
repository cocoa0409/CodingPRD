            - "${ids} has exactly 3 elements, in ascending scanned_at order"
            - "GET /scan-events?scan_session_id=${s1_id}&source=OFFLINE_BATCH has total_count == 3 with results ADMITTED, DENIED_DUPLICATE, ADMITTED"
            - "Every one of those ScanEvents has recorded_at 2026-09-12T18:10:00Z (the logical clock) while scanned_at keeps the client instant — the epoch-18 barcodes were accepted because each item is judged against its own scanned_at"
            - "${s_status} == SYNCING, ${s_up} == 3, ${s_dup} == 1 and ${s_online} == 0"
            - "${live} == 0 and ${peak} == 0 and AccessZone.${z_id}.occupancy_count == 0 — GATE_LIVE excludes OFFLINE_BATCH entirely"
            - "Ticket.${t_ada_id}.admission_status == INSIDE and Ticket.${t_bob_id}.admission_status == INSIDE"
            - "Patron.${p_ada_id}.strike_count == 1 and fraud_risk_score == 20 — the duplicate item opened a DUPLICATE incident against Ada"
            - "${err_sync} == ERR_SESSION_NOT_OPEN with HTTP 409 — the gate is still SCANNING, so priority 15 decides and not priority 11"

      - name: device_binding_release_and_rebinding_accumulate_churn_points
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /tickets/{id}/device-binding].side_effects
          - endpoints[POST /tickets/{id}/device-binding/release].side_effects
          - entities.Patron.fields.device_rebind_count
          - calculations.patron_fraud_risk_score
        distinguishing_aspect: |
          The first bind is free: device_rebind_count stays 0 because there was no previous
          binding. Only rebinds count, and churn is DEVICE_CHURN_WEIGHT * (count - 1), so the
          first rebind leaves the score at 0 and the second rebind is the first to cost
          anything — exactly 4 points. Release nulls the fingerprint but leaves the status
          RELEASED rather than UNBOUND, which is a distinct state the device check treats as
          unbound.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone GA1; Ada verified holding a PAID ticket that has never been bound."
