# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2720 - Supermarket Refrigerant Management & Leak Compliance
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# 1.1-1.7 surface. Every instance drives an empty database with 1.5 calls only;
# the logical clock default is 2026-08-01T00:00:00Z and is set explicitly in
# every chain. Corners already asserted by a 1.8 instance are emitted as
# excluded_because stubs naming that instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: system_create_applies_leak_rate_method_default_and_derived_fields
        claim_type: defaults
        grounds:
          - entities.RefrigerantSystem.fields.leak_rate_method
          - entities.RefrigerantSystem.fields.applicability
          - entities.RefrigerantSystem.fields.threshold_pct
          - entities.RefrigerantSystem.fields.required_certification_type
        distinguishing_aspect: "Omitting the optional leak_rate_method must yield ROLLING_AVERAGE, and the four derived fields must be computed from full_charge_lbs, system_category and the refrigerant's pressure_class rather than accepted from input."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A (HIGH, HFC)."
            - "POST /systems omits leak_rate_method entirely."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys_id: $.data.id, sys_method: $.data.leak_rate_method }
          assert:
            - "HTTP 201"
            - "RefrigerantSystem.${sys_id}.leak_rate_method == ROLLING_AVERAGE"
            - "RefrigerantSystem.${sys_id}.applicability == REGULATED and threshold_pct == 20.0"
            - "RefrigerantSystem.${sys_id}.required_certification_type == TYPE_II"
            - "RefrigerantSystem.${sys_id}.current_charge_lbs == 80.0, leak_rate_pct == 0.0, exceedance_count_12mo == 0"
            - "RefrigerantSystem.${sys_id}.leak_rate_baseline_at == 2025-01-15T00:00:00Z"
            - "RefrigerantSystem.${sys_id}.operational_status == ACTIVE, compliance_state == COMPLIANT, retrofit_due_on == null, version == 1"

      - name: system_applicability_and_certification_class_derived_from_charge_and_pressure
        claim_type: computed_fields
        grounds:
          - entities.RefrigerantSystem.fields.applicability
          - entities.RefrigerantSystem.fields.required_certification_type
          - entities.RefrigerantSystem.fields.threshold_pct
        distinguishing_aspect: "Three systems on one store separate the three derivations: 30.0 lbs is EXEMPT, 4.0 lbs demands TYPE_I, and a LOW-pressure chemistry demands TYPE_III; COMFORT_COOLING carries threshold 10.0 while INDUSTRIAL_PROCESS_REFRIGERATION carries 30.0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, two chemistries: R-404A (HIGH, HFC) and R-123 (LOW, HCFC)."
            - "Three systems: EXEMPT 30.0 lb comfort-cooling on R-404A, 4.0 lb appliance on R-404A, 120.0 lb industrial on R-123."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-123", gwp: 79, pressure_class: "LOW", ods_class: "HCFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt123_id: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMFORT_COOLING", full_charge_lbs: 30.0, initial_charge_lbs: 10.0, installed_on: "2025-04-01T00:00:00Z" }
              as: ComplianceManager
              captures: { sys_exempt_id: $.data.id, sys_exempt_app: $.data.applicability }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 4.0, initial_charge_lbs: 2.0, installed_on: "2025-04-02T00:00:00Z" }
              as: ComplianceManager
              captures: { sys_small_id: $.data.id, sys_small_cert: $.data.required_certification_type }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt123_id}", system_category: "INDUSTRIAL_PROCESS_REFRIGERATION", full_charge_lbs: 120.0, initial_charge_lbs: 100.0, installed_on: "2025-04-03T00:00:00Z" }
              as: ComplianceManager
              captures: { sys_ind_id: $.data.id, sys_ind_cert: $.data.required_certification_type }
          assert:
            - "RefrigerantSystem.${sys_exempt_id}.applicability == EXEMPT, threshold_pct == 10.0, required_certification_type == TYPE_II"
            - "RefrigerantSystem.${sys_small_id}.applicability == EXEMPT, required_certification_type == TYPE_I, threshold_pct == 20.0"
            - "RefrigerantSystem.${sys_ind_id}.applicability == REGULATED, threshold_pct == 30.0, required_certification_type == TYPE_III"
            - "Store.${store_id}.regulated_system_count == 1 and total_regulated_charge_lbs == 120.0"

      - name: store_get_with_unknown_id_returns_store_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_STORE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no Store row must produce ERR_STORE_NOT_FOUND with HTTP 404, not an empty 200 body and not a 500."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One store exists so the collection is non-empty, but the requested id is a different, unused UUID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_STORE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: service_record_missing_expected_system_version_is_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - concurrency_rules[service-record-create-stale-system]
        distinguishing_aspect: "expected_system_version is a required input, so omitting it is a 400 ERR_INVALID_REQUEST at priority 3 - it must not be silently defaulted to the current version, which would disable the whole optimistic-concurrency rule."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 TYPE_II, EQ1 certified HIGH, CYL1 with 40.0 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60 }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and version == 1"
            - "GET /service-records?system_id returns total_count 0"

      - name: system_create_with_invalid_enum_category_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.RefrigerantSystem.fields.system_category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "system_category accepts exactly the three declared values; a plausible but undeclared value such as WALK_IN_COOLER must be rejected at priority 3 rather than stored or coerced to a default category (which would silently pick a leak threshold)."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "WALK_IN_COOLER", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /systems?store_id returns total_count 0"

      - name: repair_attempt_is_immutable_with_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.RepairAttempt.fields.outcome
          - entities.VerificationTest.fields.result
        distinguishing_aspect: "RepairAttempt and VerificationTest are declared common_fields: false, so each row exposes only id and created_at - no version, no updated_at - and 1.5 declares no PATCH/PUT/DELETE for either; outcome changes only as a side effect of a later sibling row, never by direct edit."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z then 2026-08-08T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 repairs, T2 verifies, EQ1, CYL1."
            - "A 20.0 lb ADD_REFRIGERANT record on 2026-08-01 opens LeakEvent E1; RepairAttempt A1 is filed at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 20.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 120, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "GET /leak-events"
              payload: { system_id: "${sys1_id}" }
              as: ComplianceManager
              captures: { event_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair-attempts"
              payload: { leak_event_id: "${event_id}", system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", repair_method_code: "BRAZE_JOINT", repair_completed_at: "2026-08-05T09:00:00Z" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { attempt1_id: $.data.id }
          trigger:
            - call: "GET /repair-attempts/${attempt1_id}"
              payload: {}
              as: ComplianceManager
              captures: { a1_outcome: $.data.outcome, a1_created: $.data.created_at }
          assert:
            - "the response body carries id and created_at but no version and no updated_at key"
            - "RepairAttempt.${attempt1_id}.outcome == AWAITING_VERIFICATION, attempt_number == 1, was_late == false"
            - "1.5 declares no update or delete route for /repair-attempts/{id} or /verification-tests/{id}"
            - "RepairAttempt.${attempt1_id}.repair_completed_at == 2026-08-05T09:00:00Z (as filed, not the clock)"

      - name: system_create_with_unknown_store_returns_store_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_STORE_NOT_FOUND]
          - entities.RefrigerantSystem.fields.store_id
        distinguishing_aspect: "The store_id foreign key in the body is resolved at priority 5, before any business rule, so an unused UUID yields 404 ERR_STORE_NOT_FOUND and no orphan system row - flat-topology FK integrity, not a nested-route 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. R-404A exists; no store with the requested id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "00000000-0000-4000-8000-000000000000", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_STORE_NOT_FOUND"
            - "GET /systems returns total_count 0"

      - name: service_record_system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ServiceRecord.fields.retention_until
          - entities.ServiceRecord.fields.system_charge_after_lbs
          - entities.ServiceRecord.fields.occupies_until
        distinguishing_aspect: "id, created_at and every computed field are server-minted: supplying id, retention_until, system_charge_after_lbs and occupies_until in the request body must leave the stored row exactly as the formulas compute it (retention 2029-08-01, charge 90.0, occupies_until 01:00), and the supplied id must not become the row id."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0), T1 TYPE_II, EQ1 certified HIGH, CYL1 with 40.0 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}", id: "11111111-1111-4111-8111-111111111111", retention_until: "2026-09-01T00:00:00Z", system_charge_after_lbs: 999.9, occupies_until: "2026-08-01T23:59:00Z", voided: true }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { rec_id: $.data.id, rec_retention: $.data.retention_until }
          assert:
            - "HTTP 201"
            - "the created row id != 11111111-1111-4111-8111-111111111111 (server-minted UUID)"
            - "ServiceRecord.${rec_id}.retention_until == 2029-08-01T00:00:00Z"
            - "ServiceRecord.${rec_id}.system_charge_after_lbs == 90.0 and leak_rate_pct_after == 10.0"
            - "ServiceRecord.${rec_id}.occupies_until == 2026-08-01T01:00:00Z and equipment_released_at == 2026-08-01T02:00:00Z"
            - "ServiceRecord.${rec_id}.voided == false"

      - name: leak_event_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - entities.LeakEvent.fields.status
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three leak events on three systems of one store, ordered created_at ASC: limit 2 offset 0 returns the first two rows with total_count 3 and has_more true; limit 2 offset 2 returns exactly one row with has_more false; a status filter narrows total_count to the matching subset. Ordering never consults id."
        test_recipe:
          setup:
