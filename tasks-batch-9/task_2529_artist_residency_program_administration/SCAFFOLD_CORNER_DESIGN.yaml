          assert:
            - "the second application in the same cycle is refused: 409 ERR_DUPLICATE_ASSOCIATION, and GET /applications?cycle_id=${cyc_a}&applicant_id=${art} still returns total_count == 1"
            - "the pair is the key, not the artist: the same POST against cycle ${cyc_b} with discipline ${disc_b} returns 201, so one artist legitimately holds one application per cycle"
            - "a different artist in the same cycle is unaffected: a second applicant's application against ${cyc_a} / ${disc_a} returns 201"
            - "changing discipline inside the cycle is an update, not a new row: PATCH /applications/${app_a} with a second discipline of ${cyc_a} returns 200, while a fresh POST naming that discipline still returns 409"
            - "the existing row's status does not open a second slot: after the application is REJECTED by a screening decision, a fresh POST for the same (cycle, applicant) pair still returns 409 ERR_DUPLICATE_ASSOCIATION"
            - "the review leg of the same code behaves the same way: a second POST /panel-assignments for an (application_id, panelist_id) pair that already has an assignment returns 409, while the same panelist on another application and another panelist on the same application both return 201"
            - "existence outranks uniqueness here too: POST /applications with an unknown applicant_id returns 404 ERR_APPLICANT_NOT_FOUND rather than the 409"

      - name: only_the_trainings_the_discipline_actually_requires_can_be_recorded
        claim_type: error_triggerable
        grounds: ["errors[ERR_TRAINING_TYPE_NOT_REQUIRED]", "validations[priority 33]", "entities.Residency.required_training_types", "entities.Discipline.required_capability_tags"]
        distinguishing_aspect: "The accepted training vocabulary is DERIVED per residency, not fixed: it is SAFETY_ORIENTATION plus one EQUIPMENT_<TAG> per discipline capability tag plus HAZMAT_HANDLING only when the discipline requires a hazmat review AND the source application declared hazardous materials. So HAZMAT_HANDLING is a perfectly valid enum member that is nonetheless refused on this residency, which no static enum check can distinguish."
        test_recipe:
          setup: ["An OPEN cycle whose SCULPT discipline has required_capability_tags ['WELDING'] and requires_hazmat_review false, and one invited residency in it scheduled 2026-11-02 for 8 weeks - so required_training_types is exactly ['EQUIPMENT_WELDING', 'SAFETY_ORIENTATION']."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
