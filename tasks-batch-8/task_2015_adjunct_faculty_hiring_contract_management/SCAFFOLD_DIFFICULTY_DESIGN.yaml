              as_user_id: "hr_reviewer_1"
              captures: { cred_tr: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "STA-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 30, min_enrollment: 5 }
              as: DepartmentChair
              captures: { section_id: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fv: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${section_id}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fv}" }
              as: DepartmentChair
              captures: { contract_id: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: HRAdmin }
            # all four periods exist before P1 closes so the 4-period DAYS_WEIGHTED schedule applies
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P1", start_date: "2026-08-24", end_date: "2026-09-20" }
              as: PayrollOfficer
              captures: { p1: $.data.id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P2", start_date: "2026-09-21", end_date: "2026-10-18" }
              as: PayrollOfficer
              captures: { p2: $.data.id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P3", start_date: "2026-10-19", end_date: "2026-11-15" }
              as: PayrollOfficer
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P4", start_date: "2026-11-16", end_date: "2026-12-13" }
              as: PayrollOfficer
            # P1 close posts ACCRUAL round_half_up(9000000 * 28/110) = 2290909
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/lock", payload: {}, as: PayrollOfficer }
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/close", payload: {}, as: PayrollOfficer }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T09:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "POST /adjunct-hr/sections/${section_id}/cancel"
              payload: { cancellation_reason: "ADMINISTRATIVE" }
              as: DepartmentChair
            - call: "GET /adjunct-hr/contracts/${contract_id}/payroll-entries"
              payload: {}
              as: PayrollOfficer
              captures: { first_amt: "$.data[0].amount_cents" }
            - call: "GET /adjunct-hr/contracts/${contract_id}"
              payload: {}
              as: HRAdmin
              captures: { payable: $.data.payable_cents }
          assert:
            - "Contract.${contract_id}.payable_cents == 2250000 (late-tier floor at early census boundary)"
            - "SUM(PayrollEntry.amount_cents for contract ${contract_id}) == 2250000 == payable_cents (2290909 ACCRUAL + (-40909) CLAWBACK)"
            - "exactly one CLAWBACK entry exists and its reversal_of_entry_id names the P1 ACCRUAL entry"
            - "invariant holds with zero drift: no cent created or destroyed by the accrual+clawback pair"

      - name: faculty_load_conserved_across_activation_and_completion
        grounds:
          - calculations.term_load_units
          - state_machines.Contract.ACTIVE_to_COMPLETED
          - entities.AdjunctFaculty.fields.current_term_load_units
        distinguishing_aspect: |
          Different conserved quantity = faculty completed_terms paired against
          load units: completing a section moves each ACTIVE contract to
          COMPLETED (load drops out of the ACTUAL aggregation) while
          completed_terms increments by exactly the number of contracts
          completed. Invariant: completed_terms_after - completed_terms_before
          == count(contracts flipped ACTIVE->COMPLETED), and
          current_term_load_units after == sum over remaining ACTIVE contracts
          only. With one contract of load 3.00: load goes 3.00 -> 0.00 while
          completed_terms goes 0 -> 1.
        test_recipe:
          setup:
            - "Faculty COMPLIANT with exactly one ACTIVE contract (load 3.00) on a RUNNING section"
            - "Clock advanced past term end (2026-12-12)"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "MUSC", name: "Music", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_COURSE", base_rate_cents: 450000, longevity_step_cents: 0, longevity_step_cap: 0, effective_start_date: "2026-08-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Music Pool", min_education_tier: "MASTERS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Ned Adjunct", applicant_email: "ned@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-t-ned", verified_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-b-ned" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_b: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-ned" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "MUS-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 20, min_enrollment: 5 }
              as: DepartmentChair
              captures: { section_id: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fv: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${section_id}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fv}" }
              as: DepartmentChair
              captures: { contract_id: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: HRAdmin }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { load_before: $.data.current_term_load_units, terms_before: $.data.completed_terms }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T00:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "POST /adjunct-hr/sections/${section_id}/complete"
              payload: {}
              as: DepartmentChair
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { load_after: $.data.current_term_load_units, terms_after: $.data.completed_terms }
            - call: "GET /adjunct-hr/contracts/${contract_id}"
              payload: {}
              as: HRAdmin
              captures: { con_status: $.data.contract_status, con_payable: $.data.payable_cents }
          assert:
            - "before completion: current_term_load_units == 3.00 and completed_terms == 0"
            - "Contract.${contract_id}.contract_status == COMPLETED and payable_cents == 450000 (PER_COURSE gross, full completion)"
            - "after completion: current_term_load_units == 0.00 (load released) and completed_terms == 1"
            - "conservation: (completed_terms_after - completed_terms_before) == 1 == count of contracts flipped ACTIVE->COMPLETED, and load delta -3.00 == -(load_units of the completed contract)"
