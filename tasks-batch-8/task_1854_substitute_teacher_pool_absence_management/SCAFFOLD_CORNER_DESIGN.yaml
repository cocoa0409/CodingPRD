          setup: ["School NONE tier; sub rate 20000 ACTIVE qualified; two teachers T1/T2; absence A starts Mon 2026-08-03, absence B (T2) starts Thu 2026-08-06"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { absA: $.data.id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-06", end_date: "2026-08-06", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t2}", captures: { absB: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { absence_id: "${absA}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asgA: $.data.id, premA: $.data.premium_multiplier_snapshot, provA: $.data.provisional_pay_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments", payload: { absence_id: "${absB}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asgB: $.data.id, premB: $.data.premium_multiplier_snapshot, provB: $.data.provisional_pay_cents } }
          assert:
            - "Absence A (lead exactly 24h): premium_multiplier_snapshot == 1.1 and provisional_pay_cents == 22000 (moderate 0.10, NOT short 0.25)"
            - "Absence B (lead exactly 72h): premium_multiplier_snapshot == 1.0 and provisional_pay_cents == 20000"

      - name: coverage_compensation_rate_snapshot_at_confirm_worked
        claim_type: constants_applied
        grounds:
          - calculations.coverage_compensation
        distinguishing_aspect: "The per-period rate is read at confirm-worked time, not at proposal: a district config change between approval and confirmation means 4 periods compensate at the new 3000 rate (12000), not the old 2500."
        test_recipe:
          setup: ["UNFILLED absence Mon 2026-08-03 (empty pool); coverage of 4 periods APPROVED while rate is 2500"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-08-04" }, as: DistrictAdmin }
            - { call: "POST /internal-coverages", payload: { absence_id: "${abs1}", staff_member_id: "${t2}", coverage_date: "2026-08-03", periods: 4 }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { cov: $.data.id } }
            - { call: "POST /internal-coverages/${cov}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
            - { call: "GET /districts/${dist}", payload: {}, as: DistrictAdmin, captures: { dv: $.data.version } }
            - { call: "PUT /districts/${dist}", payload: { expected_district_version: "${dv}", period_comp_rate_cents: 3000 }, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /internal-coverages/${cov}/confirm-worked", payload: {}, as: SchoolCoordinator, as_user_id: "${coord}", captures: { comp: $.data.compensation_cents, st: $.data.status } }
          assert:
            - "InternalCoverage.${cov}.status == WORKED and compensation_cents == 12000 (4 x 3000, the rate live at confirm-worked)"

  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_AUTH_CONTEXT]
        distinguishing_aspect: "Any call without X-User-ID/X-User-Role fails at priority 1 with ERR_MISSING_OR_INVALID_AUTH_CONTEXT before role or existence checks."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /districts", payload: { name: "D1" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_AUTH_CONTEXT (http 400)"

      - name: rbac_denials_across_roles
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Role-layer denials are uniform: Teacher cannot create substitutes, PayrollClerk cannot create districts, Substitute cannot run dispatch batches — all ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["District, school, teacher, ACTIVE substitute exist"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
          trigger:
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 100 }, as: Teacher, as_user_id: "${t1}", captures: { err1: $.data.error_id } }
            - { call: "POST /districts", payload: { name: "D2" }, as: PayrollClerk, captures: { err2: $.data.error_id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}" }, as: Substitute, as_user_id: "${subA}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN_ROLE, err2 == ERR_FORBIDDEN_ROLE, err3 == ERR_FORBIDDEN_ROLE (all 403)"

      - name: ownership_violations_for_teacher_and_substitute
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_RESOURCE_OWNERSHIP_VIOLATION]
        distinguishing_aspect: "Entity-backed ownership is enforced separately from role: teacher T2 cancelling T1's absence and substitute B responding to A's offer both yield ERR_RESOURCE_OWNERSHIP_VIOLATION (403), not a state error."
        test_recipe:
          setup: ["Two teachers T1/T2 and two ACTIVE qualified subs A/B; absence of T1 with an offer to A"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach Two", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t2: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA1: $.data.id } }
            - { call: "POST /clearances/${clrA1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA2: $.data.id } }
            - { call: "POST /clearances/${clrA2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 18000 }, as: DistrictAdmin, captures: { subB: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
          trigger:
            - { call: "POST /absences/${abs1}/cancel", payload: {}, as: Teacher, as_user_id: "${t2}", captures: { err1: $.data.error_id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subB}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_RESOURCE_OWNERSHIP_VIOLATION (T2 does not own T1's absence)"
            - "err2 == ERR_RESOURCE_OWNERSHIP_VIOLATION (B is not the offered substitute)"

      - name: absence_overlap_same_teacher_adjacency_allowed
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_ABSENCE_DATE_OVERLAP]
        distinguishing_aspect: "Two absences of the same teacher sharing one calendar day conflict (08-03..08-05 vs 08-05..08-07 -> ERR_ABSENCE_DATE_OVERLAP); a fully adjacent absence (08-06..08-07) is accepted."
        test_recipe:
          setup: ["Teacher T1; clock 2026-07-29; T1's first absence Mon 2026-08-03..Wed 2026-08-05 exists"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
          trigger:
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-05", end_date: "2026-08-07", absence_type: "PERSONAL", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { err: $.data.error_id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-06", end_date: "2026-08-07", absence_type: "PERSONAL", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs3: $.data.id, td3: $.data.total_days } }
          assert:
            - "Overlapping second absence: error_id == ERR_ABSENCE_DATE_OVERLAP (409)"
            - "Adjacent absence ${abs3} created with total_days == 2"

      - name: invalid_date_range_variants
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_DATE_RANGE]
        distinguishing_aspect: "end before start and a weekend-only range (Sat 2026-08-01..Sun 2026-08-02 contains zero weekdays) both fail with ERR_INVALID_DATE_RANGE (422)."
        test_recipe:
          setup: ["Teacher T1; clock 2026-07-29"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-05", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { err1: $.data.error_id } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-01", end_date: "2026-08-02", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_DATE_RANGE (end before start)"
            - "err2 == ERR_INVALID_DATE_RANGE (zero weekdays in range)"

      - name: uniqueness_constraints_across_entities
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_QUALIFICATION]
          - errors[ERR_DUPLICATE_TIMESHEET]
        distinguishing_aspect: "Duplicate Qualification for the same (substitute, subject, grade_band) and a second timesheet for the same (assignment, work_date) both fail 409 with their specific error ids."
