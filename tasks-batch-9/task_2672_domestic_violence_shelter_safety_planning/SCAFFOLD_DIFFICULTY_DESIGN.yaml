          assert:
            - "${fee1} == 40000 and ${fee2} == 59000 and ${accrued_mid} == 99000 and ${committed_mid} == 2"
            - "HousingReferral.${ref2}.status == SUBMITTED and withdraw_count == 1"
            - "HousingReferral.${ref2}.incentive_fee_cents == null and incentive_tier_applied == null"
            - "HousingReferral.${ref1}.status == MATCHED and incentive_fee_cents == 40000 (untouched by the withdrawal)"
            - "LandlordPartner.${lp_id}.units_committed == 1 and units_available == 3"
            - "Invariant holds exactly: ${pledged} == LandlordPartner.${lp_id}.units_committed + units_available, i.e. 4 == 1 + 3"
            - "LandlordPartner.${lp_id}.incentive_accrued_cents == 40000, equal to SUM(incentive_fee_cents) over the partner's MATCHED and LEASED referrals with no residue from the withdrawn 59000"
            - "LandlordPartner.${lp_id}.engagement_score == 25.0 and incentive_tier == SILVER (restored to its pre-second-match values)"
