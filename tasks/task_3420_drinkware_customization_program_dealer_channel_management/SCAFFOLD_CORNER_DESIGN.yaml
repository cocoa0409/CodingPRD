            - "err_rounds == ERR_PROOF_ROUND_EXHAUSTED (422)"
            - "cancel still succeeds from PROOF_EXHAUSTED: order_state == CANCELLED, cancellation_fee_cents == 0, payment_status == REFUNDED"

