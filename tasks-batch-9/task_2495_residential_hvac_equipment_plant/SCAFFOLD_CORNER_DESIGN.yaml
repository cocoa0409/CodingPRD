          - validations.platform-state-gate
          - errors.ERR_INVALID_PLATFORM_STATE
        distinguishing_aspect: "RETIRED is terminal: neither a fresh engineering-review submission nor a second retire is admitted, and the retired platform keeps salable_region_count 0 forever."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One RELEASED A1 platform with no build orders and no distributor orders, then retired by the plant administrator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
