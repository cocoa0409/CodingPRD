# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage index for
# task_2591_malt_hops_brewing_ingredient_distribution
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by an instance
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# test_recipe. Every logical clock is pinned with POST /_clock/set_current_utc
# so every date-derived literal below is deterministic.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: brewer_creation_echoes_input_and_seeds_the_computed_credit_ledger
        claim_type: Creation
        grounds:
          - endpoints[POST /brewers]
          - entities.Brewer
          - calculations.brewer_credit_posture
          - calculations.freight_program_tier
        distinguishing_aspect: "A newly created Brewer must arrive with its whole computed ledger already populated from an empty history — zeros for money, and a freight tier derived from the seeded legacy_trailing_lbs rather than the TIER_1 default."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Empty database; no brewer holds licence BR-1001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brewers"
              payload: { name: "Corner Creation Brewing", brewery_license_no: "BR-1001", credit_terms_days: 45, credit_limit_cents: 2500000, cold_chain_certified: true, legacy_trailing_lbs: 60000 }
              as: CreditManager
              captures: { c1_id: $.data.id, c1_version: $.data.version, c1_created: $.data.created_at }
          assert:
            - "HTTP 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: 'object', data: { ... } }"
            - "Brewer.${c1_id}.name == 'Corner Creation Brewing', brewery_license_no == 'BR-1001', credit_terms_days == 45, credit_limit_cents == 2500000 and cold_chain_certified == true"
            - "Brewer.${c1_id}.ar_balance_cents == 0, open_order_exposure_cents == 0, credit_exposure_cents == 0, credit_utilization_pct == 0.00 and credit_status == GOOD_STANDING"
            - "Brewer.${c1_id}.legacy_trailing_lbs == 60000 and trailing_12mo_volume_lbs == 60000 — the seed counts immediately even with no DELIVERED orders"
            - "Brewer.${c1_id}.freight_program_tier == TIER_2 — 60000 lbs clears TIER_2_MIN_LBS 40000 and falls short of TIER_3_MIN_LBS 120000, so the tier is NOT the TIER_1 field default"
            - "${c1_version} == 1 and ${c1_created} == 2026-08-01T00:00:00Z"

      - name: hop_variety_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /hop-varieties/{id}]
          - entities.HopVariety
        distinguishing_aspect: "A read-back must reproduce every stored field with the same scale — 12.50 and 51.00 keep two decimal places rather than collapsing to 12.5 / 51 — and must not advance version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One HopVariety created with an explicit spot price and floor inventory."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { cv_id: $.data.id }
          trigger:
            - call: "GET /hop-varieties/${cv_id}"
              payload: {}
              as: Brewer
              as_user_id: "any-brewer-id"
              captures: { read_version: $.data.version }
          assert:
            - "HTTP 200 and response_type == 'object'"
            - "HopVariety.${cv_id}.variety_code == 'CITRA', name == 'Citra', substitution_group == 'AROMA_HIGH_ALPHA', alpha_acid_target_pct == 12.50, spot_price_cents_per_lb == 51.00, available_spot_lbs == 20000"
            - "HopVariety.${cv_id}.cold_storage_required == true, pallet_quantity_lbs == 880 and min_order_lbs == 44"
            - "${read_version} == 1 — a GET is not a mutation"
            - "GET /hop-varieties/{id} is open to all five roles, so the same read by an AllocationManager, CreditManager, WarehouseOperator or PlatformAdmin returns the identical body"

      - name: sales_order_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /sales-orders]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Pagination is exercised with three orders and limit 2 so the first page must report has_more true while total_count stays at the unpaged 3, and the second page must return the remainder with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer with three DRAFT orders, created in a known order so created_at ASC is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Pagination Brewing", brewery_license_no: "BR-1002", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { p_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${p_id}", requested_ship_date: "2026-09-01T00:00:00Z", purchase_order_ref: "PO-P1" }
              as: Brewer
              as_user_id: "${p_id}"
              captures: { po1_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${p_id}", requested_ship_date: "2026-09-02T00:00:00Z", purchase_order_ref: "PO-P2" }
              as: Brewer
              as_user_id: "${p_id}"
              captures: { po2_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${p_id}", requested_ship_date: "2026-09-03T00:00:00Z", purchase_order_ref: "PO-P3" }
              as: Brewer
              as_user_id: "${p_id}"
              captures: { po3_id: $.data.id }
          trigger:
            - call: "GET /sales-orders?brewer_id=${p_id}&limit=2&offset=0"
              payload: {}
              as: AllocationManager
              captures: { first_page_id: "$.data[0].id" }
            - call: "GET /sales-orders?brewer_id=${p_id}&limit=2&offset=2"
              payload: {}
              as: AllocationManager
              captures: { second_page_id: "$.data[0].id" }
            - call: "GET /sales-orders?brewer_id=${p_id}"
              payload: {}
              as: AllocationManager
          assert:
            - "first page: HTTP 200, response_type == 'array', total_count == 3, limit == 2, offset == 0, has_more == true and exactly 2 rows are returned"
            - "${first_page_id} == ${po1_id} — created_at ASC ordering, never id ordering"
            - "second page: total_count == 3, limit == 2, offset == 2, has_more == false and exactly 1 row is returned with ${second_page_id} == ${po3_id}"
            - "unpaged call: limit == 10 and offset == 0 are applied as the declared defaults, total_count == 3, has_more == false, 3 rows returned"
            - "every returned row has brewer_id == ${p_id}; ${po2_id} appears on the first page and on no other page"

      - name: malt_lot_fetch_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /malt-lots/{id}]
          - validations[priority=5]
          - errors.ERR_MALT_LOT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unused UUID must produce the segment-specific 404 code, not a generic error and not an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "No MaltLot exists with id 00000000-0000-4000-8000-000000000404."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /malt-lots/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: WarehouseOperator
              captures: { nf_err: $.data.error_id, nf_msg: $.data.message }
          assert:
            - "HTTP 404, response_type == 'error' and ${nf_err} == ERR_MALT_LOT_NOT_FOUND"
            - "${nf_msg} is a non-empty human-readable string"
            - "no MaltLot row is created as a side effect: GET /malt-lots returns total_count 0"

      - name: brewer_create_missing_licence_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /brewers]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "brewery_license_no has source input with no default, so it is required; omitting it must fail at priority 4 before any uniqueness or ledger work happens."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Empty Brewer table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brewers"
              payload: { name: "No Licence Brewing", credit_terms_days: 30 }
              as: CreditManager
              captures: { req_err: $.data.error_id }
          assert:
            - "HTTP 400 and ${req_err} == ERR_INVALID_REQUEST"
            - "GET /brewers/{id} for any id returns 404 — the failed create persisted nothing"
            - "the same omission of `name` produces the identical ERR_INVALID_REQUEST, and omitting an optional field such as credit_limit_cents does NOT"

      - name: brewer_defaults_applied_when_optional_inputs_are_omitted
        claim_type: Defaults
        grounds:
          - entities.Brewer.fields.credit_terms_days
          - entities.Brewer.fields.credit_limit_cents
          - entities.Brewer.fields.cold_chain_certified
          - entities.Brewer.fields.legacy_trailing_lbs
        distinguishing_aspect: "Every declared default must materialise from a two-field payload: 30 day terms, a 500000 cent limit, no cold-chain certification and a zero volume seed that lands the brewer in TIER_1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Empty Brewer table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brewers"
              payload: { name: "Default Values Brewing", brewery_license_no: "BR-1003" }
              as: CreditManager
              captures: { d_id: $.data.id }
          assert:
            - "HTTP 201 and Brewer.${d_id}.credit_terms_days == 30"
            - "Brewer.${d_id}.credit_limit_cents == 500000"
            - "Brewer.${d_id}.cold_chain_certified == false"
            - "Brewer.${d_id}.legacy_trailing_lbs == 0, trailing_12mo_volume_lbs == 0 and freight_program_tier == TIER_1"
            - "Brewer.${d_id}.credit_status == GOOD_STANDING and credit_utilization_pct == 0.00"

      - name: contract_line_unit_price_is_computed_and_supplied_value_is_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.extended_cents
          - entities.OrderLine.fields.pallet_break
          - entities.OrderLine.fields.cold_chain_required
          - calculations.order_subtotal_rollup
        distinguishing_aspect: "unit_price_cents is accepted in the payload but is authoritative only for lines with no contract behind them; on a CONTRACT hop line the contract's own price must win, so a 1.00 cent client value must not reach extended_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer, OPEN crop-year program 2026, Citra variety (pallet 880 lbs, cold storage required)."
            - "HopContract for 5000 lbs at 285.50 cents/lb with delivery window 2026-09-01 to 2026-12-31."
            - "DRAFT order for the same brewer with requested_ship_date 2026-09-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Computed Price Brewing", brewery_license_no: "BR-1004", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { cp_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { cp_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { cp_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${cp_id}", variety_id: "${cp_citra_id}", crop_year_program_id: "${cp_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cp_k_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${cp_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-CP" }
              as: Brewer
              as_user_id: "${cp_id}"
              captures: { cp_o_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${cp_o_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "CONTRACT", hop_contract_id: "${cp_k_id}", unit_price_cents: 1.00 }
              as: Brewer
              as_user_id: "${cp_id}"
              captures: { cp_l_id: $.data.id }
          assert:
            - "HTTP 201 and OrderLine.${cp_l_id}.unit_price_cents == 285.50 — the contract price, not the supplied 1.00"
            - "OrderLine.${cp_l_id}.extended_cents == 251240 (880 x 285.50 rounded half-up), not 880"
            - "OrderLine.${cp_l_id}.pallet_break == false — 880 is an exact multiple of pallet_quantity_lbs 880"
            - "OrderLine.${cp_l_id}.cold_chain_required == true, inherited from HopVariety.cold_storage_required"
            - "OrderLine.${cp_l_id}.trimmed_lbs == 0 and status == OPEN"
            - "SalesOrder.${cp_o_id}.line_count == 1, requires_cold_chain == true, and subtotal_cents is still 0 because rollup runs at confirm"

      - name: order_system_fields_are_server_minted_and_client_values_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.credit_status
          - entities.SalesOrder.fields.purchase_order_ref
          - validations[priority=4]
        distinguishing_aspect: "POST /sales-orders declares only three input fields, so status and identity keys smuggled into the body must be discarded rather than honoured or rejected — the created order still starts DRAFT / PENDING_REVIEW at version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "System Field Brewing", brewery_license_no: "BR-1005", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { sf_id: $.data.id }
          trigger:
            - call: "POST /sales-orders"
              payload: { brewer_id: "${sf_id}", requested_ship_date: "2026-09-15T00:00:00Z", purchase_order_ref: "PO-SF", id: "11111111-1111-4111-8111-111111111111", version: 99, fulfillment_status: "DELIVERED", credit_status: "APPROVED", total_cents: 123456 }
              as: Brewer
              as_user_id: "${sf_id}"
              captures: { sf_o_id: $.data.id, sf_o_version: $.data.version, sf_o_created: $.data.created_at }
          assert:
            - "HTTP 201 and ${sf_o_id} != '11111111-1111-4111-8111-111111111111' — the id is a freshly minted server UUID with no type prefix"
            - "${sf_o_version} == 1, not 99"
            - "SalesOrder.${sf_o_id}.fulfillment_status == DRAFT and credit_status == PENDING_REVIEW — the smuggled statuses are ignored"
            - "SalesOrder.${sf_o_id}.total_cents == 0, subtotal_cents == 0, line_count == 0 and fee_variant == null"
            - "${sf_o_created} == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "SalesOrder.${sf_o_id}.purchase_order_ref == 'PO-SF' — a declared input field IS honoured, proving the rejection is selective"

      - name: yeast_strain_invalid_enum_fermentation_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.YeastStrain.fields.fermentation_type
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "fermentation_type admits only ALE and LAGER because it selects the pitch-rate constant; a plausible third style must be refused at priority 4 rather than silently defaulting to ALE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Empty YeastStrain table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP650", name: "Brettanomyces Bruxellensis", fermentation_type: "WILD", propagation_lead_time_days: 14, list_price_cents_per_l: 1500.00 }
              as: WarehouseOperator
              captures: { enum_err: $.data.error_id }
          assert:
            - "HTTP 400 and ${enum_err} == ERR_INVALID_REQUEST"
            - "no row is persisted: GET /yeast-strains/{id} for any id returns ERR_YEAST_STRAIN_NOT_FOUND"
            - "a negative propagation_lead_time_days and a list_price_cents_per_l of 1500.005 (three decimal places) each produce the same ERR_INVALID_REQUEST at priority 4"
            - "the same payload with fermentation_type 'LAGER' returns 201, viability_pct_at_ship 92.0, cells_per_ml_slurry_billion 1.2, min_batch_l 20.0 and vessel_max_l 2000.0 from defaults"

      - name: temperature_reading_is_immutable_with_no_version_and_no_writer
        claim_type: Immutability
        grounds:
          - entities.TemperatureReading
          - endpoints[GET /cold-chain-shipments/{id}/readings]
          - calculations.cold_chain_excursion_assessment
        distinguishing_aspect: "TemperatureReading is the only entity declared common_fields: false — it must expose id and created_at but no version and no updated_at, and §1.5 must offer no endpoint that edits or deletes one; correction happens only by appending another reading."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer certified for cold chain with a 5000000 cent limit; Citra variety requiring reefer."
            - "Zone Z1, capacity 10, setpoint 2.0, tolerance 2.0."
            - "Order with one 880 lb SPOT Citra line, CONFIRMED, credit APPROVED, PICKED; shipment staged and departed so it is IN_TRANSIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Immutable Reading Brewing", brewery_license_no: "BR-1006", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { ir_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { ir_citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { ir_zone_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${ir_id}", requested_ship_date: "2026-09-12T00:00:00Z", purchase_order_ref: "PO-IR" }
              as: Brewer
              as_user_id: "${ir_id}"
              captures: { ir_o_id: $.data.id }
            - call: "POST /sales-orders/${ir_o_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${ir_citra_id}" }
              as: Brewer
              as_user_id: "${ir_id}"
            - call: "POST /sales-orders/${ir_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${ir_id}"
            - call: "POST /sales-orders/${ir_o_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "within limit" }
              as: CreditManager
            - call: "POST /sales-orders/${ir_o_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "GET /sales-orders/${ir_o_id}"
              payload: {}
              as: WarehouseOperator
              captures: { ir_o_v: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${ir_o_id}", cold_storage_zone_id: "${ir_zone_id}", expected_sales_order_version: "${ir_o_v}", pallet_count: 1, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { ir_s_id: $.data.id }
            - call: "POST /cold-chain-shipments/${ir_s_id}/depart"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /cold-chain-shipments/${ir_s_id}/readings"
              payload: { temp_c: 2.0, recorded_at: "2026-08-01T10:00:00Z" }
              as: WarehouseOperator
              captures: { ir_r_id: $.data.id, ir_r_created: $.data.created_at }
            - call: "GET /cold-chain-shipments/${ir_s_id}/readings"
              payload: {}
              as: Brewer
              as_user_id: "${ir_id}"
              captures: { first_reading_id: "$.data[0].id" }
          assert:
            - "HTTP 201; the reading body carries id, created_at, cold_chain_shipment_id, temp_c, recorded_at, interval_minutes, in_violation and cumulative_excursion_minutes"
            - "the reading body carries NO version and NO updated_at field — common_fields is false for TemperatureReading"
            - "TemperatureReading.${ir_r_id}.interval_minutes == 0 (first reading), in_violation == false (2.0 sits inside the [0.0, 4.0] band) and cumulative_excursion_minutes == 0"
            - "${ir_r_created} == 2026-08-01T00:00:00Z, the logical clock, while recorded_at == 2026-08-01T10:00:00Z, the reported instant — the two are independent"
            - "${first_reading_id} == ${ir_r_id} and the list reports total_count 1"
            - "§1.5 declares no PUT, PATCH or DELETE on /cold-chain-shipments/{id}/readings — a correction can only be appended as a new row"
            - "ColdChainShipment.${ir_s_id}.reading_count == 1, last_reading_at == 2026-08-01T10:00:00Z and excursion_minutes == 0"

      - name: order_line_create_under_unknown_parent_order_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints[POST /sales-orders/{id}/lines]
          - validations[priority=5]
          - errors.ERR_SALES_ORDER_NOT_FOUND
        distinguishing_aspect: "The line endpoint is nested under the order, so a bad path id must be reported at priority 5 as ERR_SALES_ORDER_NOT_FOUND — before priority 7 gets a chance to complain about the body's hop_variety_id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "No SalesOrder exists with id 00000000-0000-4000-8000-0000000005a1, and no HopVariety exists with id 00000000-0000-4000-8000-0000000005b2 either."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sales-orders/00000000-0000-4000-8000-0000000005a1/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "00000000-0000-4000-8000-0000000005b2" }
              as: AllocationManager
              captures: { parent_err: $.data.error_id }
          assert:
            - "HTTP 404 and ${parent_err} == ERR_SALES_ORDER_NOT_FOUND, not ERR_HOP_VARIETY_NOT_FOUND — the path id is checked at priority 5, the body id only at priority 7"
            - "GET /order-lines returns total_count 0"

      - name: recipe_create_with_a_yeast_id_in_the_malt_product_slot_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - endpoints[POST /brewer-recipes]
          - validations[priority=7]
          - errors.ERR_MALT_PRODUCT_NOT_FOUND
        distinguishing_aspect: "The topology is flat, so integrity rests entirely on typed foreign keys: a real id belonging to the wrong entity must be treated as absent per slot, and the error must name the slot that failed rather than the entity the id really belongs to."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer, one malt product and one yeast strain, all created successfully."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Flat Topology Brewing", brewery_license_no: "BR-1007", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { ft_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { ft_malt_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { ft_yeast_id: $.data.id }
          trigger:
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${ft_id}", malt_product_id: "${ft_yeast_id}", yeast_strain_id: "${ft_yeast_id}", name: "Cross Wired Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${ft_id}"
              captures: { fk_err: $.data.error_id }
          assert:
            - "HTTP 404 and ${fk_err} == ERR_MALT_PRODUCT_NOT_FOUND — the yeast id is real but wrong for the malt_product_id slot"
            - "GET /brewer-recipes?brewer_id=${ft_id} returns total_count 0"
            - "the same payload with malt_product_id ${ft_malt_id} returns 201 with adjunct_pct 0.0, proving the id itself was the only defect"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: malt_lot_is_born_received_with_no_analysis_on_file
        claim_type: Initial State
        grounds:
          - state_machines.MaltLot.initial_state
          - entities.MaltLot.fields.status
          - entities.MaltLot.fields.analysis_count
          - entities.MaltLot.fields.available_lbs
        distinguishing_aspect: "A freshly received lot must sit in RECEIVED with analysis_count 0, all five measurement fields null and available_lbs equal to the full received quantity — not PASSED, and not partially available."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Malt product PALE-ALE, BASE class, max_moisture_pct 5.0, min_diastatic_power 60.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { ml_prod_id: $.data.id }
          trigger:
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${ml_prod_id}", lot_code: "LOT-INIT-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { ml_lot_id: $.data.id, ml_received: $.data.received_at }
          assert:
            - "HTTP 201 and MaltLot.${ml_lot_id}.status == RECEIVED"
            - "MaltLot.${ml_lot_id}.analysis_count == 0, analyzed_by_user_id == null, released_by_user_id == null and quarantine_reason == null"
            - "MaltLot.${ml_lot_id}.color_lovibond, extract_pct, moisture_pct, protein_pct and diastatic_power are all null"
            - "MaltLot.${ml_lot_id}.quantity_lbs == 5000, committed_lbs == 0 and available_lbs == 5000"
            - "${ml_received} == 2026-08-01T00:00:00Z — received_at defaults to the logical clock"
            - "MaltLot.${ml_lot_id}.version == 1"

      - name: malt_lot_analysis_passes_and_a_second_operator_releases_it
        claim_type: Valid Transition
        grounds:
          - state_machines.MaltLot.transitions[RECEIVED->PASSED]
          - state_machines.MaltLot.transitions[PASSED->RELEASED]
          - validations[priority=20]
        distinguishing_aspect: "The happy path is two hops, not one: a conforming analysis moves RECEIVED to PASSED and records the analyst, and only a DIFFERENT user id can then move PASSED to RELEASED, stamping released_by_user_id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Malt product PALE-ALE (BASE, max moisture 5.0, min diastatic power 60.0) with a 5000 lb lot in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { vt_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${vt_prod_id}", lot_code: "LOT-VT-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { vt_lot_id: $.data.id }
          trigger:
            - call: "POST /malt-lots/${vt_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { vt_status_after_analysis: $.data.status }
            - call: "POST /malt-lots/${vt_lot_id}/release"
              payload: { release_note: "COA reviewed and filed" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
              captures: { vt_status_after_release: $.data.status }
          assert:
            - "${vt_status_after_analysis} == PASSED and ${vt_status_after_release} == RELEASED"
            - "MaltLot.${vt_lot_id}.color_lovibond == 2.60, extract_pct == 79.90, moisture_pct == 4.20, protein_pct == 11.10 and diastatic_power == 95.0"
            - "MaltLot.${vt_lot_id}.analysis_count == 1, analyzed_by_user_id == 'qa-analyst-1' and released_by_user_id == 'qa-analyst-2'"
            - "MaltLot.${vt_lot_id}.quarantine_reason == null"
            - "MaltLot.${vt_lot_id}.version == 3 — one bump per transition on top of creation"
            - "MaltLot.${vt_lot_id}.available_lbs == 5000; release is a quality gate, not a commitment"

      - name: releasing_an_unanalysed_lot_returns_invalid_lot_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MaltLot.transitions[PASSED->RELEASED].preconditions
          - validations[priority=14]
          - errors.ERR_INVALID_LOT_STATE
        distinguishing_aspect: "Release is declared only from PASSED, so a lot still in RECEIVED must be refused at priority 14 — the segregation-of-duties check at priority 20 never runs, and released_by_user_id stays null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A 5000 lb lot in RECEIVED with no analysis posted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { pe_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${pe_prod_id}", lot_code: "LOT-PE-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { pe_lot_id: $.data.id }
          trigger:
            - call: "POST /malt-lots/${pe_lot_id}/release"
              payload: { release_note: "trying to skip QA" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
              captures: { pe_err: $.data.error_id }
          assert:
            - "HTTP 409 and ${pe_err} == ERR_INVALID_LOT_STATE"
            - "MaltLot.${pe_lot_id}.status == RECEIVED, released_by_user_id == null and version == 1 — the refused call had no side effects"
            - "the error is ERR_INVALID_LOT_STATE and not ERR_SEGREGATION_OF_DUTIES, even though analyzed_by_user_id is null and could never equal the caller"

      - name: quarantine_reason_reports_moisture_first_when_both_gates_fail
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MaltLot.transitions[RECEIVED->QUARANTINED].side_effects
          - entities.MaltLot.fields.quarantine_reason
        distinguishing_aspect: "The transition declares moisture as the first-evaluated gate, so a lot that is BOTH too wet and too low in diastatic power must be stamped MOISTURE_ABOVE_MAX; the measurements are still written and analysis_count still advances even though the lot failed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "BASE malt product with max_moisture_pct 5.0 and min_diastatic_power 60.0, and a 5000 lb lot in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { se_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${se_prod_id}", lot_code: "LOT-SE-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { se_lot_id: $.data.id }
          trigger:
            - call: "POST /malt-lots/${se_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 5.40, protein_pct: 11.10, diastatic_power: 55.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { se_status: $.data.status, se_reason: $.data.quarantine_reason }
          assert:
            - "HTTP 200 and ${se_status} == QUARANTINED"
            - "${se_reason} == MOISTURE_ABOVE_MAX, not DIASTATIC_POWER_BELOW_MIN — moisture is evaluated first even though both gates failed"
            - "MaltLot.${se_lot_id}.moisture_pct == 5.40 and diastatic_power == 55.0 — the failing measurements are still persisted"
            - "MaltLot.${se_lot_id}.analysis_count == 1 and analyzed_by_user_id == 'qa-analyst-1'"
            - "a SPECIALTY product with the same 55.0 diastatic power and a compliant 4.20 moisture reaches PASSED, because the diastatic floor applies only to BASE malts"

      - name: malt_lot_retest_loop_returns_a_quarantined_lot_to_receiving
        claim_type: cyclic
        grounds:
          - state_machines.MaltLot.transitions[QUARANTINED->RECEIVED]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / malt_lot_quarantine_retest_cycle_preserves_analysis_count
          rationale: "The retest cycle, its analysis_count preservation and the re-entry into RECEIVED are asserted end-to-end by the named §1.8 instance."

      - name: rejecting_a_passed_lot_is_not_a_declared_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MaltLot.transitions[QUARANTINED->REJECTED]
          - validations[priority=14]
          - errors.ERR_INVALID_LOT_STATE
        distinguishing_aspect: "Reject is declared only from QUARANTINED. A PASSED lot must therefore be unrejectable — the only way to condemn conforming malt is to quarantine it first, which no endpoint permits."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A 5000 lb lot analysed conforming, so it sits in PASSED and has not been released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { it_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${it_prod_id}", lot_code: "LOT-IT-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { it_lot_id: $.data.id }
            - call: "POST /malt-lots/${it_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
          trigger:
            - call: "POST /malt-lots/${it_lot_id}/reject"
              payload: { reject_reason: "customer changed the recipe" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { it_err: $.data.error_id }
            - call: "POST /malt-lots/${it_lot_id}/retest"
              payload: { retest_reason: "second opinion" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { it_err2: $.data.error_id }
          assert:
            - "reject from PASSED: HTTP 409 with ${it_err} == ERR_INVALID_LOT_STATE"
            - "retest from PASSED: HTTP 409 with ${it_err2} == ERR_INVALID_LOT_STATE — retest is declared only from QUARANTINED"
            - "MaltLot.${it_lot_id}.status == PASSED and version == 2 — neither refused trigger mutated the lot"
            - "a second analysis on the same PASSED lot is likewise refused with ERR_INVALID_LOT_STATE, because analysis is declared only from RECEIVED"

      - name: released_lot_is_locked_down_against_every_quality_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MaltLot.terminal_states
          - validations[priority=14]
          - errors.ERR_INVALID_LOT_STATE
        distinguishing_aspect: "RELEASED is terminal, so all four quality endpoints must refuse it. This is the lockdown claim rather than the idempotency claim: it covers triggers that were never valid from RELEASED as well as the release that was."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A 5000 lb lot analysed by qa-analyst-1 and released by qa-analyst-2, so it is RELEASED at version 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { tl_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${tl_prod_id}", lot_code: "LOT-TL-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { tl_lot_id: $.data.id }
            - call: "POST /malt-lots/${tl_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${tl_lot_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
          trigger:
            - call: "POST /malt-lots/${tl_lot_id}/retest"
              payload: { retest_reason: "post-release doubt" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { tl_err_retest: $.data.error_id }
            - call: "POST /malt-lots/${tl_lot_id}/reject"
              payload: { reject_reason: "post-release doubt" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { tl_err_reject: $.data.error_id }
            - call: "POST /malt-lots/${tl_lot_id}/analysis"
              payload: { color_lovibond: 3.00, extract_pct: 79.00, moisture_pct: 4.50, protein_pct: 11.50, diastatic_power: 90.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { tl_err_analysis: $.data.error_id }
          assert:
            - "${tl_err_retest} == ERR_INVALID_LOT_STATE with HTTP 409"
            - "${tl_err_reject} == ERR_INVALID_LOT_STATE with HTTP 409"
            - "${tl_err_analysis} == ERR_INVALID_LOT_STATE with HTTP 409"
            - "MaltLot.${tl_lot_id}.status == RELEASED, version == 3, color_lovibond == 2.60 and analysis_count == 1 — the second analysis body was discarded"
            - "MaltLot.${tl_lot_id}.released_by_user_id == 'qa-analyst-2' is unchanged"

      - name: second_release_of_the_same_lot_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.MaltLot.transitions[PASSED->RELEASED].preconditions
          - validations[priority=14]
          - errors.ERR_INVALID_LOT_STATE
        distinguishing_aspect: "Replaying a successful trigger must fail rather than silently return the prior result: the lot has left PASSED, so the second release is a state error and released_by_user_id must keep the FIRST releaser's id."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A lot in PASSED, analysed by qa-analyst-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { id_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${id_prod_id}", lot_code: "LOT-ID-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { id_lot_id: $.data.id }
            - call: "POST /malt-lots/${id_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
          trigger:
            - call: "POST /malt-lots/${id_lot_id}/release"
              payload: { release_note: "first release" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
              captures: { id_status_1: $.data.status }
            - call: "POST /malt-lots/${id_lot_id}/release"
              payload: { release_note: "replayed release" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-3"
              captures: { id_err: $.data.error_id }
          assert:
            - "first release: HTTP 200 and ${id_status_1} == RELEASED"
            - "second release: HTTP 409 and ${id_err} == ERR_INVALID_LOT_STATE"
            - "MaltLot.${id_lot_id}.released_by_user_id == 'qa-analyst-2' — the replay must not overwrite it with 'qa-analyst-3'"
            - "MaltLot.${id_lot_id}.version == 3, unchanged by the replay"

      - name: propagation_start_dates_readiness_from_the_strain_lead_time
        claim_type: Side Effect Execution
        grounds:
          - state_machines.YeastPropagationJob.transitions[REQUESTED->PROPAGATING].side_effects
          - state_machines.YeastPropagationJob.transitions[PROPAGATING->READY].side_effects
          - entities.YeastPropagationJob.fields.ready_at
          - calculations.yeast_pitch_advisory
        distinguishing_aspect: "ready_at is written by the start transition from the CURRENT clock plus the strain lead time — not from pitch_date and not at creation — and a later completion with outcome READY must clear failure_reason without touching ready_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer in GOOD_STANDING with credit_limit_cents 5000000."
            - "Strain WLP001, ALE, propagation_lead_time_days 7, viability_pct_at_ship 92.0, cells_per_ml_slurry_billion 1.2, min_batch_l 20.0, vessel_max_l 2000.0."
            - "Recipe 'House Ale' on WLP001: 30.0 bbl at 12.50 degrees Plato, requested pitch rate 0.75."
            - "One job requested for pitch_date 2026-08-20, which is 19 whole days out and clears the 7-day lead time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Propagation Timing Brewing", brewery_license_no: "BR-1008", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { pt_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { pt_malt_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { pt_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${pt_id}", malt_product_id: "${pt_malt_id}", yeast_strain_id: "${pt_strain_id}", name: "House Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${pt_id}"
              captures: { pt_recipe_id: $.data.id }
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${pt_id}", recipe_id: "${pt_recipe_id}", yeast_strain_id: "${pt_strain_id}", pitch_date: "2026-08-20T00:00:00Z" }
              as: Brewer
              as_user_id: "${pt_id}"
              captures: { pt_job_id: $.data.id, pt_ready_at_creation: $.data.ready_at }
          trigger:
            - call: "POST /yeast-propagation-jobs/${pt_job_id}/start"
              payload: {}
              as: WarehouseOperator
              captures: { pt_status_started: $.data.status, pt_ready_at: $.data.ready_at }
            - call: "POST /yeast-propagation-jobs/${pt_job_id}/complete"
              payload: { outcome: "READY" }
              as: WarehouseOperator
              captures: { pt_status_ready: $.data.status }
          assert:
            - "at creation: ${pt_ready_at_creation} == null and YeastPropagationJob.${pt_job_id}.status == REQUESTED"
            - "at creation the advisory is already computed: recommended_pitch_rate_million_cells_per_ml_per_plato == 0.75, required_cells_billion == 33004.13, recommended_slurry_l == 50.932 (viability clamped to 0.54 after 19 days of decay) and propagation_volume_l == 58.572"
            - "at creation: pitch_rate_advice == OPTIMAL — the requested 0.75 equals the recommendation"
            - "after start: ${pt_status_started} == PROPAGATING and ${pt_ready_at} == 2026-08-08T00:00:00Z, which is the clock plus 7 days and NOT pitch_date"
            - "after complete READY: ${pt_status_ready} == READY, failure_reason == null and ready_at is still 2026-08-08T00:00:00Z"
            - "YeastPropagationJob.${pt_job_id}.version == 3 and pitch_date == 2026-08-20T00:00:00Z throughout"

      - name: a_newer_substitution_offer_supersedes_the_open_one
        claim_type: Cross-entity
        grounds:
          - state_machines.SubstitutionOffer.transitions[OPEN->SUPERSEDED]
          - endpoints[POST /hop-contracts/{id}/substitution-offers]
          - concurrency_rules.substitution-offer-create-stale-contract
        distinguishing_aspect: "Creating one entity retires another: the second offer on the same contract must flip the first to SUPERSEDED — a terminal state — while leaving the contract's own status, allocated_lbs and substitution_covered_lbs untouched, because nothing is drawn until a brewer responds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000."
            - "OPEN crop-year program 2026."
            - "Citra (AROMA_HIGH_ALPHA, alpha 12.50, spot 51.00, 20000 lbs on the floor) and Mosaic (same group, alpha 12.00, spot 450.00, 20000 lbs) — Mosaic is the only peer."
            - "A 5000 lb FIXED_CROP_YEAR Citra contract; the program reports an 80.00 percent harvest so the contract is SHORTFALL_ADJUSTED with allocated_lbs 4000 and shortfall_lbs 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Supersede Offer Brewing", brewery_license_no: "BR-1009", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { so_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { so_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { so_citra_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "MOSAIC", name: "Mosaic", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.00, spot_price_cents_per_lb: 450.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { so_mosaic_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${so_id}", variety_id: "${so_citra_id}", crop_year_program_id: "${so_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { so_k_id: $.data.id }
            - call: "POST /crop-year-programs/${so_prog_id}/report-harvest"
              payload: { harvest_yield_pct: 80.00, reported_note: "crop down a fifth" }
              as: AllocationManager
            - call: "GET /hop-contracts/${so_k_id}"
              payload: {}
              as: AllocationManager
              captures: { so_v1: $.data.version }
          trigger:
            - call: "POST /hop-contracts/${so_k_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${so_v1}", selection_mode: "AUTO_RANKED", offered_lbs: 600 }
              as: AllocationManager
              captures: { so_offer1_id: $.data.id }
            - call: "GET /hop-contracts/${so_k_id}"
              payload: {}
              as: AllocationManager
              captures: { so_v2: $.data.version }
            - call: "POST /hop-contracts/${so_k_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${so_v2}", selection_mode: "EXPLICIT", offered_lbs: 1000, substitute_variety_id: "${so_mosaic_id}", offered_price_cents_per_lb: 430.00 }
              as: AllocationManager
              captures: { so_offer2_id: $.data.id }
          assert:
            - "first offer: HTTP 201, SubstitutionOffer.${so_offer1_id}.status == OPEN, selection_mode == AUTO_RANKED, substitute_variety_id == ${so_mosaic_id}, offered_lbs == 600, offered_price_cents_per_lb == 450.00 and alpha_acid_delta_pct == 0.50"
            - "second offer: HTTP 201, SubstitutionOffer.${so_offer2_id}.status == OPEN, selection_mode == EXPLICIT, offered_price_cents_per_lb == 430.00 (the caller's price, no ranking) and alpha_acid_delta_pct == 0.50 (still computed)"
            - "SubstitutionOffer.${so_offer1_id}.status == SUPERSEDED with responded_at == null and created_contract_id == null — superseding is not a response"
            - "HopVariety.${so_mosaic_id}.available_spot_lbs == 20000 — no poundage moves until a brewer accepts"
            - "HopContract.${so_k_id}.status == SHORTFALL_ADJUSTED, allocated_lbs == 4000, shortfall_lbs == 1000 and substitution_covered_lbs == 0"
            - "GET /substitution-offers?hop_contract_id=${so_k_id} returns total_count 2, and filtering &status=OPEN returns total_count 1 with ${so_offer2_id}"

      - name: accepting_an_offer_mints_a_contract_and_draws_the_substitute_pool
        claim_type: Ledger sync
        grounds:
          - state_machines.SubstitutionOffer.transitions[OPEN->ACCEPTED].side_effects
          - entities.SubstitutionOffer.fields.created_contract_id
          - entities.HopContract.fields.substitution_covered_lbs
          - calculations.contract_allocation_ledger
        distinguishing_aspect: "Acceptance reconciles three ledgers at once — a brand-new SPOT_HOLD contract for the substitute, a drawdown of the substitute variety's floor stock, and substitution_covered_lbs on the shorted contract — while deliberately leaving the shorted contract's shortfall_lbs intact, because the shortfall was covered, not erased."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Same fixture as a_newer_substitution_offer_supersedes_the_open_one up to the first offer: SHORTFALL_ADJUSTED Citra contract with shortfall_lbs 1000, one OPEN AUTO_RANKED offer of 1000 lbs on Mosaic at 450.00, Mosaic floor stock 20000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Accept Offer Brewing", brewery_license_no: "BR-1010", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { ao_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { ao_prog_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { ao_citra_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "MOSAIC", name: "Mosaic", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.00, spot_price_cents_per_lb: 450.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { ao_mosaic_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${ao_id}", variety_id: "${ao_citra_id}", crop_year_program_id: "${ao_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { ao_k_id: $.data.id }
            - call: "POST /crop-year-programs/${ao_prog_id}/report-harvest"
              payload: { harvest_yield_pct: 80.00, reported_note: "crop down a fifth" }
              as: AllocationManager
            - call: "GET /hop-contracts/${ao_k_id}"
              payload: {}
              as: AllocationManager
              captures: { ao_v1: $.data.version }
            - call: "POST /hop-contracts/${ao_k_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${ao_v1}", selection_mode: "AUTO_RANKED", offered_lbs: 1000 }
              as: AllocationManager
              captures: { ao_offer_id: $.data.id }
          trigger:
            - call: "POST /substitution-offers/${ao_offer_id}/respond"
              payload: { decision: "ACCEPT", response_note: "Mosaic works for this brew" }
              as: Brewer
              as_user_id: "${ao_id}"
              captures: { ao_status: $.data.status, ao_new_k: $.data.created_contract_id, ao_responded: $.data.responded_at }
          assert:
            - "HTTP 200, ${ao_status} == ACCEPTED and ${ao_responded} == 2026-08-01T00:00:00Z"
            - "${ao_new_k} is a newly minted HopContract with variety_id == ${ao_mosaic_id}, contract_type == SPOT_HOLD, contracted_lbs == 1000, price_per_lb_cents == 450.00, crop_year_program_id == ${ao_prog_id} and status == ACTIVE"
            - "HopContract.${ao_new_k}.allocated_lbs == 1000, committed_lbs == 0 and remaining_lbs == 1000"
            - "HopVariety.${ao_mosaic_id}.available_spot_lbs == 19000 — exactly offered_lbs was drawn"
            - "HopContract.${ao_k_id}.substitution_covered_lbs == 1000 while shortfall_lbs stays 1000 and allocated_lbs stays 4000 — coverage is recorded separately from the shortfall it answers"
            - "HopContract.${ao_k_id}.status == SHORTFALL_ADJUSTED (acceptance is not a state change on the shorted contract)"
            - "GET /hop-contracts?brewer_id=${ao_id} returns total_count 2"
            - "a second respond on the same offer returns HTTP 409 with ERR_INVALID_OFFER_STATE, and HopVariety.${ao_mosaic_id}.available_spot_lbs is still 19000 — the draw does not repeat"

      - name: sales_order_credit_and_fulfillment_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.SalesOrder[dimension=credit_status]
          - state_machines.SalesOrder[dimension=fulfillment_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / sales_order_parallel_credit_and_fulfillment_dimensions
          rationale: "Independent movement of the two dimensions and the legality of every observed combination are asserted by the named §1.8 instance."

      - name: program_settlement_is_guarded_by_undecided_carry_forward_requests
        claim_type: guarded transitions
        grounds:
          - state_machines.CropYearProgram.transitions[HARVEST_REPORTED->SETTLED].preconditions
          - validations[priority=13]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / program_settlement_gated_on_pending_carry_forward_contract
          rationale: "The cross-entity guard, its ERR_INVALID_PROGRAM_STATE rejection and the unblocking decision are asserted by the named §1.8 instance."

      - name: harvest_shortfall_cascades_down_into_confirmed_order_lines
        claim_type: Cascade down
        grounds:
          - state_machines.CropYearProgram.transitions[OPEN->HARVEST_REPORTED].side_effects
          - state_machines.OrderLine.transitions[OPEN->TRIMMED]
        excluded_because:
          difficulty_instance: transitive_cascade / report_harvest_shortfall_trims_lines_reprices_order_and_moves_credit
          rationale: "The five-link cascade including line trimming and the immunity of PICKED and later orders is asserted by the named §1.8 instance."

      - name: excursion_quarantines_only_cold_chain_hop_lines
        claim_type: Conditional cascade
        grounds:
          - state_machines.OrderLine.transitions[OPEN->QUARANTINED].preconditions
          - state_machines.ColdChainShipment.transitions[IN_TRANSIT->EXCURSION_FLAGGED].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / temperature_excursion_fails_yeast_quarantines_hops_and_mints_replacement_job
          rationale: "The conditional fan-out — cold-chain HOP lines quarantined, READY yeast jobs failed, a replacement job minted — is asserted by the named §1.8 instance."

      - name: order_cancel_compensates_every_commitment_it_made
        claim_type: Compensation
        grounds:
          - state_machines.SalesOrder[dimension=fulfillment_status].transitions[CONFIRMED->CANCELLED].side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / contract_poundage_conserved_across_commit_and_release
          rationale: "Full reversal of the confirm-time commitments with no drift in allocated_lbs is asserted by the named §1.8 instance; the monetary half is asserted by brewer_ar_balance_conserved_across_invoice_and_credit_memo."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: spec_match_score_of_a_conforming_lot_grades_acceptable
        claim_type: Correct Result
        grounds:
          - calculations.malt_spec_match_score
          - endpoints[GET /malt-lots/{id}/spec-match]
        distinguishing_aspect: "Three small deviations must be weighted 0.40 / 0.35 / 0.25 against their own tolerances and rounded once at the end to 90.71 — a lot that is close on every attribute lands in ACCEPTABLE, not EXACT, because the 95.00 gate is strict."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer, and BASE malt product PALE-ALE with max_moisture_pct 5.0 and min_diastatic_power 60.0."
            - "Lot analysed at colour 2.60, extract 79.90, moisture 4.20, protein 11.10, diastatic power 95.0 — so it is PASSED and clears both hard fails."
            - "Recipe 'House Ale' targeting colour 2.50, extract 80.00, protein 11.00 with adjunct_pct 0.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Spec Match Brewing", brewery_license_no: "BR-1011", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { sm_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { sm_prod_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { sm_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${sm_id}", malt_product_id: "${sm_prod_id}", yeast_strain_id: "${sm_strain_id}", name: "House Ale", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${sm_id}"
              captures: { sm_recipe_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${sm_prod_id}", lot_code: "LOT-SM-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { sm_lot_id: $.data.id }
            - call: "POST /malt-lots/${sm_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
          trigger:
            - call: "GET /malt-lots/${sm_lot_id}/spec-match"
              payload: { recipe_id: "${sm_recipe_id}" }
              as: Brewer
              as_user_id: "${sm_id}"
              captures: { sm_score: $.data.match_score, sm_grade: $.data.match_grade, sm_dc: $.data.deviation_color, sm_de: $.data.deviation_extract, sm_dp: $.data.deviation_protein, sm_floor: $.data.applicable_diastatic_power_floor, sm_fail: $.data.hard_fail_reason }
          assert:
            - "HTTP 200, ${sm_dc} == 0.0667, ${sm_de} == 0.1000 and ${sm_dp} == 0.1250"
            - "${sm_score} == 90.71 — 100 * (1 - (0.0667*0.40 + 0.1000*0.35 + 0.1250*0.25)) = 90.707 rounded half-up once at the end"
            - "${sm_grade} == ACCEPTABLE — 90.71 clears GRADE_ACCEPTABLE_MIN 80.00 but not GRADE_EXACT_MIN 95.00"
            - "${sm_floor} == 60.0 and ${sm_fail} == null"
            - "a hypothetical lot at exactly the targets returns match_score 100.00 and match_grade EXACT, because the three weights sum to 1.00"
            - "the read is side-effect free: MaltLot.${sm_lot_id}.version is unchanged and status is still PASSED"

      - name: spec_match_caps_each_deviation_individually_before_weighting
        claim_type: weighted_scoring
        grounds:
          - calculations.malt_spec_match_score
          - calculations.malt_spec_match_score.constants.WEIGHT_COLOR
        distinguishing_aspect: "A wildly off-spec colour must cost at most WEIGHT_COLOR of the score: deviation_color reports the capped 1.0000 rather than the raw 2.3333, so the score floors at 53.38 instead of going far lower or negative."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Same fixture as spec_match_score_of_a_conforming_lot_grades_acceptable, except the analysed lot's colour is 6.00 Lovibond — 3.5 above the 2.50 target, which is 2.3333 tolerance widths."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Capped Deviation Brewing", brewery_license_no: "BR-1012", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { cd_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { cd_prod_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { cd_strain_id: $.data.id }
            - call: "POST /brewer-recipes"
