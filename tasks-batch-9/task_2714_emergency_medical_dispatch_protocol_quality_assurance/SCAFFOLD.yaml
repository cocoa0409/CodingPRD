      - "GET /reviews/{id}/high-risk-reviews"
      - "GET /coaching-plans/{id}"
      - "GET /coaching-plans"
      - "GET /coaching-plans/{id}/retraining-sessions"

  - name: QaSupervisor
    description: "QA unit supervisor: opens and closes sampling periods, draws samples, adjudicates rebuttals, finalizes and voids reviews, and manages coaching plans and retraining sessions. May not score a case and may not finalize a sheet they submitted."
    identity: opaque
    exclusive_operations:
      - "POST /audit-programs/{id}/sampling-periods"
      - "POST /sampling-periods/{id}/draw-random-sample"
      - "POST /sampling-periods/{id}/close"
      - "POST /rebuttals/{id}/decide"
      - "POST /reviews/{id}/finalize"
      - "POST /reviews/{id}/void"
      - "POST /coaching-plans"
      - "POST /coaching-plans/{id}/retraining-sessions"
      - "POST /retraining-sessions/{id}/complete"
      - "POST /retraining-sessions/{id}/cancel"
    shared_operations:
      - "POST /sampling-periods/{id}/target-review"
      - "GET /audit-programs/{id}"
      - "GET /audit-programs/{id}/protocol-versions"
      - "GET /audit-programs/{id}/sampling-periods"
      - "GET /audit-programs/{id}/accreditation-reports"
      - "GET /protocol-versions/{id}"
      - "GET /protocol-versions/{id}/rollouts"
      - "GET /protocol-versions/{id}/retraining-sessions"
      - "GET /dispatchers/{id}"
      - "GET /dispatchers"
      - "GET /dispatchers/{id}/call-records"
      - "GET /reviews/{id}"
      - "GET /reviews"
      - "GET /reviews/{id}/score-sheets"
      - "GET /reviews/{id}/rebuttals"
      - "GET /reviews/{id}/high-risk-reviews"
      - "GET /coaching-plans/{id}"
      - "GET /coaching-plans"
      - "GET /coaching-plans/{id}/retraining-sessions"

  - name: QaReviewer
    description: "Protocol compliance reviewer: scores sampled cases, opens high-risk clinical records and scores DA-CPR performance. Cannot finalize, adjudicate, or create coaching plans."
    identity: opaque
    exclusive_operations:
      - "POST /reviews/{id}/scores"
      - "POST /reviews/{id}/high-risk-reviews"
      - "POST /high-risk-reviews/{id}/score-dacpr"
    shared_operations:
      - "POST /sampling-periods/{id}/target-review"
      - "GET /audit-programs/{id}"
      - "GET /audit-programs/{id}/protocol-versions"
      - "GET /audit-programs/{id}/sampling-periods"
      - "GET /protocol-versions/{id}"
      - "GET /dispatchers/{id}"
      - "GET /dispatchers"
      - "GET /dispatchers/{id}/call-records"
      - "GET /reviews/{id}"
      - "GET /reviews"
      - "GET /reviews/{id}/score-sheets"
      - "GET /reviews/{id}/rebuttals"
      - "GET /reviews/{id}/high-risk-reviews"
      - "GET /coaching-plans/{id}"
      - "GET /coaching-plans"
      - "GET /coaching-plans/{id}/retraining-sessions"

  - name: MedicalDirector
    description: "EMS medical director: approves protocol versions and signs off high-risk cases as sentinel events or coaching-only. Holds no scoring or finalization authority."
    identity: opaque
    exclusive_operations:
      - "POST /protocol-versions/{id}/approve"
      - "POST /high-risk-reviews/{id}/sign-off"
