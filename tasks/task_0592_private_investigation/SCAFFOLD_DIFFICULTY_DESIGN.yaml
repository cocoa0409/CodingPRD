  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: investigator_session_half_open_adjacency_accepted_overlap_rejected
        grounds:
          - validations[priority=15]
          - errors[ERR_SESSION_OVERLAP]
          - entities.SurveillanceSession.fields.start_at
          - entities.SurveillanceSession.fields.end_at
        distinguishing_aspect: |
          Resource entity = Investigator; interval semantics = HALF-OPEN [start_at, end_at) with NO
          buffer, so a session starting exactly when another ends (11:00 == 11:00) is ACCEPTED, while
          any strictly positive intersection is rejected with 409 ERR_SESSION_OVERLAP.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer, LEAD-assigned CA-licensed investigator."
            - "One PLANNED session occupying 2026-06-02T09:00:00Z - 11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /investigators/${inv1_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-1001", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SURVEILLANCE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /cases/${case_id}/retainer"
              payload: { amount_cents: 500000 }
              as: CaseManager
            - call: "POST /assignments"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", role_on_case: "LEAD" }
              as: CaseManager
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T09:00:00Z", end_at: "2026-06-02T11:00:00Z", location: "Post A" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T11:00:00Z", end_at: "2026-06-02T12:00:00Z", location: "Post B" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /surveillance-sessions"
              payload: { case_id: "${case_id}", investigator_id: "${inv1_id}", start_at: "2026-06-02T10:30:00Z", end_at: "2026-06-02T11:30:00Z", location: "Post C" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent session create returns HTTP 201 and SurveillanceSession.${s2_id}.status == PLANNED"
            - "the overlapping session create returns HTTP 409"
            - "${err} == ERR_SESSION_OVERLAP"
            - "GET /surveillance-sessions?investigator_id=${inv1_id} returns exactly 2 rows"

      - name: testimony_closed_interval_120_minute_buffer_on_case
        grounds:
          - validations[priority=15]
          - errors[ERR_TESTIMONY_BUFFER_CONFLICT]
          - state_machines.CourtTestimony.REQUESTED_to_SCHEDULED
          - entities.CourtTestimony.fields.scheduled_start
        distinguishing_aspect: |
          DIFFERENT interval semantics and a DIFFERENT resource entity from the session rule: the
          resource is the Case, the intervals are CLOSED [scheduled_start, scheduled_end], and a
          mandatory 120-minute travel buffer applies — a gap of exactly 120 minutes is REJECTED with
          409 ERR_TESTIMONY_BUFFER_CONFLICT while 121 minutes is accepted, whereas the session rule
          accepts a gap of exactly 0.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer; CA-licensed investigator assigned as LEAD."
            - "Testimony T1 SCHEDULED for 2026-07-01T09:00:00Z - 11:00:00Z; testimony T2 still REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
