      - name: stage_revision_loop_recomputes_slip_instead_of_accumulating_it
        grounds:
          - state_machines.ProductionStage.DELIVERED_to_KICKED_BACK
          - state_machines.ProductionStage.KICKED_BACK_to_IN_PROGRESS
          - calculations.stage_slip_days
          - calculations.schedule_health_posture
          - entities.ProductionStage.fields.kickback_count
          - entities.Issue.fields.total_slip_days
