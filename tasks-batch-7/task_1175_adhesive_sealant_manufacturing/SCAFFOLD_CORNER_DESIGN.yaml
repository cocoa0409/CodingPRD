      - name: draft_report_superseded_by_new_create
        claim_type: valid_transition
        grounds: [state_machines.ConsumptionReport.DRAFT_to_VOID, "endpoints.POST /api/consignment-agreements/{agreementId}/consumption-reports"]
        distinguishing_aspect: "Creating a report for a period whose existing report is still DRAFT legitimately supersedes it: the old DRAFT transitions to VOID, the new one is DRAFT."
        test_recipe:
          setup: ["ACTIVE agreement; report R1 for 2026-06 in DRAFT"]
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "PU-SUP", name: "PU Sup", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/distributors"
              payload: { name: "Dist SUP", credit_limit_cents: 1000000, contact_email: "s@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 900000, reorder_threshold_units: 0, reorder_qty_units: 100 }
              as: CommercialManager
              captures: { ag_id: $.data.id }
            - { call: "POST /api/consignment-agreements/${ag_id}/activate", payload: {}, as: CommercialManager, captures: { ag_v: $.data.version } }
            - call: "POST /api/consignment-agreements/${ag_id}/consumption-reports"
              payload: { period: "2026-06", consumed_units: 5, expected_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep1: $.data.id }
            - { call: "GET /api/consignment-agreements/${ag_id}", payload: {}, as: CommercialManager, captures: { ag_v2: $.data.version } }
          trigger:
            - call: "POST /api/consignment-agreements/${ag_id}/consumption-reports"
              payload: { period: "2026-06", consumed_units: 7, expected_agreement_version: "${ag_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep2: $.data.id }
          assert:
            - "http 201; ConsumptionReport.${rep2}.status == DRAFT AND consumed_units == 7"
            - "ConsumptionReport.${rep1}.status == VOID (superseded by the new DRAFT for the same period)"

      - name: agreement_suspend_resume_cycle
        claim_type: valid_transition
        grounds: [state_machines.ConsignmentAgreement.ACTIVE_to_SUSPENDED, state_machines.ConsignmentAgreement.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "The ACTIVE -> SUSPENDED -> ACTIVE cycle is legal and re-runs the credit check on resume."
        test_recipe:
          setup: ["ACTIVE agreement (max_consigned 500000, distributor credit 1000000)"]
          setup_api_calls:
