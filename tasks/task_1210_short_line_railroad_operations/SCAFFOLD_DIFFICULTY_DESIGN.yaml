  - rule_id: cross_entity_state_dependency
    instances:
      - name: crew_call_requires_available_member
        grounds:
          - validations[priority=4]
          - state_machines.CrewMember
          - errors[ERR_MEMBER_NOT_AVAILABLE]
        distinguishing_aspect: |
          Pair (CrewCall, CrewMember): a new CrewCall is only creatable while the CrewMember is
          AVAILABLE; after a full duty the member is RESTING and the create fails with
          ERR_MEMBER_NOT_AVAILABLE — the call's valid creation depends on a different entity's state.
        test_recipe:
          setup:
            - "crew member driven AVAILABLE -> ON_DUTY -> RESTING by a complete call lifecycle"
            - "a movement exists as the target for the second call"
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "I. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 60-64", milepost_start: 60, milepost_end: 64, fra_class: CLASS_3 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/train-movements"
              payload: { symbol: "GW-601", route_segment_ids: ["${seg_id}"] }
              as: Dispatcher
              captures: { mov_id: $.data.id }
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-02T06:00:00Z", scheduled_end_at: "2026-05-02T12:00:00Z" }
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /rail/crew-calls/${call_id}/respond"
              payload: { response: "ACCEPTED" }
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/crew-calls/${call_id}/report-on-duty"
              payload: {}
              as: Conductor
              as_user_id: "${mem_id}"
            - call: "POST /rail/crew-calls/${call_id}/relieve"
              payload: {}
              as: CrewCaller
          trigger:
            - call: "POST /rail/crew-calls"
              payload: { crew_member_id: "${mem_id}", movement_id: "${mov_id}", scheduled_start_at: "2026-05-05T06:00:00Z", scheduled_end_at: "2026-05-05T12:00:00Z" }
              as: CrewCaller
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_MEMBER_NOT_AVAILABLE"
            - "CrewMember.${mem_id}.status == RESTING at the time of the rejected call"

      - name: movement_ready_requires_segments_in_service
        grounds:
          - validations[priority=5]
          - state_machines.TrainMovement.PLANNED_to_READY
