  # --- WorkOrder ---
  - method: POST
    path: "/om/work-orders"
    description: "Create a work order on an outage (execution CREATED, verification PENDING_VERIFY)"
    roles: [Dispatcher]
    code: 201
    input: [outage_id, work_type, required_crew_type, requires_switching_order]
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/om/work-orders/{id}"
    description: "Get one work order"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/om/work-orders"
    description: "List work orders, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["outage_id?", "assigned_crew_id?", "assigned_mutual_aid_crew_id?", "switching_order_id?", "execution_status?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: POST
    path: "/om/work-orders/{id}/ready"
    description: "CREATED -> READY; non-ASSESSMENT work requires an ACCEPTED damage assessment on the outage"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments version"]
  - method: POST
    path: "/om/work-orders/{id}/assign"
    description: "READY -> DISPATCHED to exactly one internal or mutual-aid crew"
    roles: [Dispatcher]
    code: 200
    input: ["crew_id?", "mutual_aid_crew_id?"]
    output: WorkOrder
    side_effects: ["sets assignee", "internal crew AVAILABLE -> EN_ROUTE", "fatigue/window/type checks per state machine", "increments version"]
  - method: POST
    path: "/om/work-orders/{id}/arrive"
    description: "Mark the assigned crew on site; internal crew EN_ROUTE -> ON_SITE"
    roles: [FieldCrewLead, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["crew EN_ROUTE -> ON_SITE", "sets arrived_at", "increments version"]
  - method: POST
    path: "/om/work-orders/{id}/start"
    description: "DISPATCHED -> IN_PROGRESS; internal crew must be ON_SITE; switching-gated orders need an EXECUTED switching order"
    roles: [FieldCrewLead, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["first IN_PROGRESS work order bubbles outage ASSESSED -> WORKING", "increments version"]
  - method: POST
    path: "/om/work-orders/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; crew ON_SITE -> AVAILABLE; posts LABOR_INTERNAL for internal crews; a VERIFY_FAILED order re-completes back to PENDING_VERIFY"
    roles: [FieldCrewLead, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["sets completed_at", "crew release + worked-minute accrual", "labor ledger posting (internal only)", "event cost rollup recompute", "VERIFY_FAILED -> PENDING_VERIFY on re-completion", "increments version"]
  - method: POST
    path: "/om/work-orders/{id}/verify"
    description: "verification PENDING_VERIFY -> VERIFY_PASSED | VERIFY_FAILED (FAILED reopens execution IN_PROGRESS and forces a 180-minute ETR revision)"
    roles: [Dispatcher]
    code: 200
    input: [outcome]
    output: WorkOrder
    side_effects: ["on FAILED: execution COMPLETED -> IN_PROGRESS, completed_at cleared, system EtrRevision VERIFICATION_FAILED (now + 180 min), outage version increment", "increments version"]
  - method: POST
    path: "/om/work-orders/{id}/cancel"
    description: "CREATED/READY/DISPATCHED -> CANCELLED; releases EN_ROUTE crew and cancels non-terminal requisitions (STAGED releases reservation)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["crew release", "requisition cancellation cascade with reservation release", "increments version"]

  # --- SwitchingOrder ---
  - method: POST
    path: "/om/switching-orders"
    description: "Create a DRAFT switching order for a work order; issuer_user_id = X-User-ID; sets the work order's switching_order_id"
    roles: [SystemOperator]
    code: 201
    input: [work_order_id, switching_steps]
    output: SwitchingOrder
    side_effects: ["work order.switching_order_id set", "work order must be non-terminal (else ERR_INVALID_STATE_TRANSITION)"]
  - method: GET
    path: "/om/switching-orders/{id}"
    description: "Get one switching order"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: []
    output: SwitchingOrder
    side_effects: []
  - method: GET
    path: "/om/switching-orders"
    description: "List switching orders, filterable"
    roles: [EmergencyDirector, Dispatcher, TelemetryGateway, FieldCrewLead, SystemOperator, MutualAidCoordinator, MaterialsManager, ClaimsOfficer, Regulator]
    code: 200
    input: ["work_order_id?", "so_status?", "limit?", "offset?"]
    output: "SwitchingOrder[]"
    side_effects: []
  - method: POST
    path: "/om/switching-orders/{id}/issue"
    description: "DRAFT -> ISSUED; only the issuer may issue"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SwitchingOrder
    side_effects: ["increments version"]
  - method: POST
    path: "/om/switching-orders/{id}/approve"
    description: "ISSUED -> APPROVED; approver MUST differ from issuer (segregation of duties)"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SwitchingOrder
    side_effects: ["sets approver_user_id", "increments version"]
  - method: POST
    path: "/om/switching-orders/{id}/execute"
    description: "APPROVED -> EXECUTED; work order non-terminal and event ACTIVE"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SwitchingOrder
    side_effects: ["increments version"]
  - method: POST
    path: "/om/switching-orders/{id}/abort"
    description: "DRAFT/ISSUED/APPROVED -> ABORTED; clears the work order's switching_order_id"
    roles: [SystemOperator]
    code: 200
    input: []
    output: SwitchingOrder
    side_effects: ["clears work order.switching_order_id", "increments version"]

