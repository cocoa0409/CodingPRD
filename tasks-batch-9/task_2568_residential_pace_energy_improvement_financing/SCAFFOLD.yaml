    http_status: 422
    condition: "estimated_annual_savings_cents > EligibleProduct.max_annual_savings_cents"
    applies_to: ["POST /pace/applications/{id}/measures"]
  - id: ERR_NO_ELIGIBLE_MEASURES
    http_status: 422
    condition: "The application has no PROPOSED measure at submit/cure, or no measure survives the per-measure SIR gate at underwrite"
    applies_to: ["POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/cure", "POST /pace/applications/{id}/underwrite"]
  - id: ERR_TERM_EXCEEDS_USEFUL_LIFE
    http_status: 422
    condition: "term_years is outside {10, 15, 18, 20, 25} or exceeds the cost-weighted useful life of the measure set"
    applies_to: ["POST /pace/applications/{id}/submit", "POST /pace/financing-agreements"]
  - id: ERR_MEASURE_ALREADY_CERTIFIED
    http_status: 409
    condition: "A live certificate (CONTRACTOR_ATTESTED / HOMEOWNER_SIGNED / VERIFIED) of the same application already covers one of the measure_ids"
    applies_to: ["POST /pace/completion-certificates"]
  - id: ERR_CERTIFICATE_ALREADY_DISBURSED
    http_status: 409
    condition: "The live draws (REQUESTED / HELD / RELEASED) already referencing the certificate sum to its certified_cost_cents, i.e. the certificate is fully drawn (a REVERSED draw does not restore headroom)"
    applies_to: ["POST /pace/disbursements"]
  - id: ERR_CLTV_LIMIT_EXCEEDED
    http_status: 422
    condition: "combined_lien_to_value_ratio > 9700 bps on the applied valuation basis"
    applies_to: ["POST /pace/applications/{id}/underwrite"]
  - id: ERR_PTV_LIMIT_EXCEEDED
    http_status: 422
    condition: "requested_principal_cents / assessed_value_cents > 1500 bps"
    applies_to: ["POST /pace/applications/{id}/underwrite"]
  - id: ERR_EQUITY_FLOOR_NOT_MET
    http_status: 422
    condition: "Property equity_ratio_bps < 1000"
    applies_to: ["POST /pace/applications/{id}/underwrite"]
  - id: ERR_SIR_FLOOR_NOT_MET
    http_status: 422
    condition: "portfolio_sir_bps < 10000"
    applies_to: ["POST /pace/applications/{id}/underwrite"]
  - id: ERR_CERTIFIED_COST_EXCEEDS_MEASURES
    http_status: 422
    condition: "certified_cost_cents > sum(installed_cost_cents) over the referenced measures"
    applies_to: ["POST /pace/completion-certificates"]
  - id: ERR_AMOUNT_EXCEEDS_CERTIFICATE
    http_status: 422
    condition: "amount_cents > CompletionCertificate.certified_cost_cents"
    applies_to: ["POST /pace/disbursements"]
  - id: ERR_DISBURSEMENT_EXCEEDS_PAYABLE
    http_status: 422
    condition: "Cumulative REQUESTED+HELD+RELEASED amounts would exceed FinancingAgreement.contractor_payable_cents"
    applies_to: ["POST /pace/disbursements", "POST /pace/disbursements/{id}/release"]
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    condition: "amount_cents != total_due_cents (BILLED) or != total_due_cents + penalty_cents (DELINQUENT)"
    applies_to: ["POST /pace/assessments/{id}/installments/{installmentId}/payments"]
  - id: ERR_PREPAYMENT_AMOUNT_MISMATCH
    http_status: 422
    condition: "amount_cents != the payoff_total_cents computed as of the request date"
    applies_to: ["POST /pace/assessments/{id}/prepayments"]

# =============================================================================
# Table 7: RBAC Permission Matrix (§1.7) — role_model: segregation_of_duties.
#   Two roles are entity_backed (their X-User-ID IS the id of a §1.1 row); the
#   other five are opaque program staff whose X-User-ID is only ever compared
#   against a previously recorded actor id.
# =============================================================================
roles:
  - name: PropertyOwner
    description: "The record owner of a parcel. Files applications, adds measures, signs and rescinds the financing agreement, countersigns completion certificates and files workmanship complaints."
    identity: "entity_backed:Property"
    exclusive_operations:
      - "POST /pace/applications"
      - "POST /pace/applications/{id}/measures"
      - "POST /pace/applications/{id}/submit"
      - "POST /pace/applications/{id}/cure"
      - "POST /pace/financing-agreements/{id}/sign"
      - "POST /pace/financing-agreements/{id}/rescind"
      - "POST /pace/completion-certificates/{id}/sign"
      - "POST /pace/complaints"
    shared_operations:
      - "every GET, including GET /pace/applications/{id}/eligibility-report"
  - name: Contractor
    description: "An enrolled installation contractor. Attests completion of the measures it installed and is the subject of workmanship recourse."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /pace/completion-certificates"
    shared_operations:
      - "every GET except GET /pace/applications/{id}/eligibility-report"
  - name: UnderwritingAnalyst
    description: "Program underwriter. Runs the eligibility gates and issues the financing agreement. Recorded in Application.underwriter_user_id and therefore barred from approving the same application."
    identity: opaque
    exclusive_operations:
      - "POST /pace/applications/{id}/underwrite"
      - "POST /pace/financing-agreements"
    shared_operations:
      - "every GET, including GET /pace/applications/{id}/eligibility-report"
  - name: ComplianceOfficer
    description: "Consumer-protection and lender-consent officer. Records mortgage-holder consent responses, approves applications, runs the oral confirmation call, adjudicates complaints and orders clawbacks."
    identity: opaque
    exclusive_operations:
      - "POST /pace/mortgage-liens/{id}/consent-response"
      - "POST /pace/applications/{id}/approve"
      - "POST /pace/financing-agreements/{id}/oral-confirmation"
      - "POST /pace/complaints/{id}/adjudicate"
      - "POST /pace/disbursements/{id}/reverse"
    shared_operations:
      - "POST /pace/mortgage-liens (with ProgramAdmin)"
      - "every GET, including GET /pace/applications/{id}/eligibility-report"
  - name: FundingOfficer
    description: "Treasury officer. Verifies completion certificates and moves money. The verifier of a certificate may never be the releaser of its disbursement."
    identity: opaque
    exclusive_operations:
      - "POST /pace/completion-certificates/{id}/verify"
      - "POST /pace/disbursements"
      - "POST /pace/disbursements/{id}/release"
    shared_operations:
      - "every GET except GET /pace/applications/{id}/eligibility-report"
  - name: CountyOfficer
    description: "County tax-collector staff. Records the assessment onto the roll, runs the annual roll, collects installments and administers payoffs and transfers at sale."
    identity: opaque
    exclusive_operations:
      - "POST /pace/assessments"
      - "POST /pace/assessments/{id}/installments/{installmentId}/payments"
      - "POST /pace/assessments/{id}/prepayments"
      - "POST /pace/assessment-transfers"
      - "POST /pace/assessment-transfers/{id}/record"
      - "POST /pace/counties/{countyCode}/roll-runs"
    shared_operations:
      - "POST /pace/properties and PATCH /pace/properties/{id}/valuation (with ProgramAdmin)"
      - "every GET except GET /pace/applications/{id}/eligibility-report"
  - name: ProgramAdmin
    description: "Program administrator. Owns the reference data (parcels, liens, product catalog, contractor enrollment) and the logical clock. Has no authority over underwriting, consent, money or the tax roll."
    identity: opaque
    exclusive_operations:
      - "POST /pace/products"
      - "PATCH /pace/products/{id}"
      - "POST /pace/contractors"
      - "POST /pace/contractors/{id}/enroll"
      - "POST /pace/contractors/{id}/reinstate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /pace/properties and PATCH /pace/properties/{id}/valuation (with CountyOfficer)"
      - "POST /pace/mortgage-liens (with ComplianceOfficer)"
      - "every GET, including GET /pace/applications/{id}/eligibility-report"

segregation_of_duties:
  - rule: "underwriter != approver"
    fields: ["Application.underwriter_user_id", "Application.approver_user_id"]
    enforced_at: "POST /pace/applications/{id}/approve"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule: "certificate verifier != disbursement releaser"
    fields: ["CompletionCertificate.verified_by_user_id", "Disbursement.released_by_user_id"]
    enforced_at: "POST /pace/disbursements/{id}/release"
    error_id: ERR_SEGREGATION_OF_DUTIES
