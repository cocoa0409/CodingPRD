        payload: {exhibit_id: '${ex_id}', species_id: '${sp_b}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v9}'}
        as: CuratorOfCollections
        captures: {cpe_c: $.data.id}
      - call: GET /aquarium/species/${sp_a}
        payload: {}
        as: ComplianceDirector
      assert:
      - 'the plan-line create on the stale exhibit token: HTTP 412 and data.error_id == ERR_STALE_EXHIBIT_VERSION (the first plan line''s creation already advanced Exhibit.version past ${ex_v1})'
      - 'the clearance on the stale species token: HTTP 412 and data.error_id == ERR_STALE_SPECIES_VERSION (the first clearance''s quota reservation advanced Species.version past ${spa_v2})'
      - no CollectionPlanEntry for species B exists after the 412
      - AcquisitionRequest.${ar_b}.status == PENDING_PERMIT
      - 'the re-read plan-line create: HTTP 201'
      - Species.${sp_a}.wild_take_quota_reserved == 1 — the refused clearance reserved nothing
  - name: layer_breach_counter_resets_on_a_single_normal_reading
    claim_type: rate_threshold_triggers
    grounds:
    - §1.1 LifeSupportSystem.consecutive_breach_readings / consecutive_normal_readings
    - §1.2 LifeSupportSystem NORMAL -> WARNING, WARNING -> WARNING (both directions), WARNING -> NORMAL (ALARM_CLEAR_NORMAL_READINGS 3)
    - §1.3 water_quality_index (WARNING severity band)
    - §1.3 exhibit_posture (LSS_WARNING driver)
    distinguishing_aspect: 'The two counters are strictly mutually exclusive: each WARNING reading zeroes consecutive_normal_readings and each NORMAL reading zeroes consecutive_breach_readings, so a single NORMAL sample inserted mid-run discards two accumulated breaches and the recovery still needs three fresh NORMAL readings.'
    test_recipe:
      setup:
      - A COLD_MARINE plant serving one exhibit, alarm_state NORMAL with both counters at 0. Clock at 2026-08-05T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-05T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-02T00:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-03T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-04T00:00:00Z', temperature_c: 13.6, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-05T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'after the two WARNING readings: alarm_state == WARNING, consecutive_breach_readings == 2, consecutive_normal_readings == 0 and Exhibit.posture == RESTRICTED with last_posture_reason == LSS_WARNING'
      - 'after the single NORMAL reading: consecutive_breach_readings == 0 and consecutive_normal_readings == 1, but alarm_state is still WARNING because 1 < ALARM_CLEAR_NORMAL_READINGS (3)'
      - 'after the fourth reading (WARNING again): consecutive_breach_readings == 1 and consecutive_normal_readings == 0 — the accumulated normal run is discarded'
      - 'after the fifth reading (NORMAL): consecutive_normal_readings == 1, alarm_state still WARNING'
      - 'the exhibit never returned to OPEN: posture == RESTRICTED with last_posture_reason == LSS_WARNING'
      - water_quality_index == 100.00 after the last NORMAL reading
  - name: layer_permit_required_is_derived_from_two_independent_sources
    claim_type: derived_field_reconciliation
    grounds:
    - §1.3 derived_flag_reconciliation (Species.permit_required = protection_status != UNLISTED; AcquisitionRequest.permit_required = species.permit_required or source_type == WILD_COLLECTION)
    - §1.1 Species.permit_required / AcquisitionRequest.permit_required / permit_deadline_at
    - §1.2 AcquisitionRequest DRAFT -> PENDING_PERMIT and DRAFT -> READY_FOR_CLEARANCE
    distinguishing_aspect: 'The flag is a DISJUNCTION over two unrelated inputs, so three of four combinations demand a permit: only a CAPTIVE_BRED request for an UNLISTED species routes straight to READY_FOR_CLEARANCE with permit_deadline_at null. The submission target proves the derivation rather than merely echoing it.'
    test_recipe:
      setup:
      - Two exhibits and two species — one UNLISTED, one CITES_APPENDIX_II — each with an APPROVED ANY_WITH_JUSTIFICATION plan line, plus four DRAFT requests covering every (protection_status, source_type) combination. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_a: $.data.id, exa_v1: $.data.version}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-2, name: Kelp Forest, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_b: $.data.id, exb_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 8}
        as: CuratorOfCollections
        captures: {sp_un: $.data.id, spun_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Cheilinus undulatus, common_name: humphead wrasse, taxon_group: TELEOST, protection_status: CITES_APPENDIX_II, sustainability_rating: YELLOW, bioload_units_per_specimen: 20, base_quarantine_days: 30, wild_take_quota_annual: 8}
        as: CuratorOfCollections
        captures: {sp_cites: $.data.id, spcites_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_a}', species_id: '${sp_un}', planned_count: 4, sustainability_requirement: ANY_WITH_JUSTIFICATION, expected_exhibit_version: '${exa_v1}'}
        as: CuratorOfCollections
        captures: {cpe_un: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_un}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_b}', species_id: '${sp_cites}', planned_count: 4, sustainability_requirement: ANY_WITH_JUSTIFICATION, expected_exhibit_version: '${exb_v1}'}
        as: CuratorOfCollections
        captures: {cpe_cites: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_cites}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {inst_id: $.data.id}
      trigger:
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_un}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_1: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_un}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}', justification: range-state quota allocation}
        as: CuratorOfCollections
        captures: {ar_2: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_cites}', source_type: CAPTIVE_BRED, requested_count: 1, justification: F2 captive stock from a partner institution}
        as: CuratorOfCollections
        captures: {ar_3: $.data.id}
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_cites}', source_type: WILD_COLLECTION, requested_count: 1, source_institution_id: '${inst_id}', justification: CITES-managed range-state collection}
        as: CuratorOfCollections
        captures: {ar_4: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_1}/submission
        payload: {justification: founder stock for the regional SSP}
        as: CuratorOfCollections
      - call: POST /aquarium/acquisition-requests/${ar_2}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/acquisition-requests/${ar_3}/submission
        payload: {}
        as: CuratorOfCollections
      - call: POST /aquarium/acquisition-requests/${ar_4}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/acquisition-requests
        payload: {status: PENDING_PERMIT, limit: 10}
        as: CuratorOfCollections
      assert:
      - Species.${sp_un}.permit_required == false and Species.${sp_cites}.permit_required == true
      - AcquisitionRequest.${ar_1}.permit_required == false; ${ar_2}, ${ar_3} and ${ar_4} all report true
      - ${ar_1} submits to READY_FOR_CLEARANCE with permit_deadline_at == null
      - ${ar_2}, ${ar_3} and ${ar_4} each submit to PENDING_PERMIT with a non-null permit_deadline_at
      - the PENDING_PERMIT list returns total_count == 3
      - ${ar_3} needs a permit purely because of the species, and ${ar_2} purely because of the source type — neither input alone is necessary
  - name: layer_cascading_side_effects_fan_out_three_links_deep
    claim_type: cascading_side_effects
    grounds:
    - §1.2 LifeSupportSystem NORMAL -> CRITICAL (CASCADE A links 1-5)
    - §1.2 Specimen.disposition_status -> DECEASED (CASCADE B)
    - §1.2.2 the clock-driven permit expiry cascade (CASCADE D)
    excluded_because:
      difficulty_instance: transitive_cascade / cascade_a_critical_reading_closes_exhibit_and_auto_disables_programme
      rationale: §1.8's transitive_cascade rule carries three instances that walk CASCADE A, CASCADE B and CASCADE D link by link, which is exactly this layer's claim; repeating a cascade here would duplicate them.
  - name: layer_dual_variant_calculations_diverge_on_identical_inputs
    claim_type: dual_variant_calculation
    grounds:
    - §1.3 sustainability_score variants PROVISIONAL and FINAL
    - §1.3 welfare_score variants ROLLING and AUDIT_SNAPSHOT
    excluded_because:
      difficulty_instance: dual_variant_calc / dual_variant_sustainability_provisional_then_final_after_receiver_downgrade
      rationale: §1.8's dual_variant_calc rule covers both declared dual-variant calculations, including the variant stamped on the entity and the divergence on identical inputs.
- section: consistency_model
  instances:
  - name: consistency_a_single_reading_is_immediately_visible_on_every_dependent_read
    claim_type: immediate
    grounds:
    - '§1.0 complexity_profile consistency_model: immediate'
    - §1.2 LifeSupportSystem NORMAL -> CRITICAL (CASCADE A links 1-5)
    - §1.3 water_quality_index / latest_reading_selector / exhibit_posture
    - §1.5 GET /aquarium/life-support-systems/{id}, GET /aquarium/exhibits/{id}, GET /aquarium/exhibits (posture filter), GET /aquarium/exhibits/{id}/interaction-sessions
    distinguishing_aspect: ONE write settles the plant, both served exhibits, two suspended sessions, the auto-disable flag and every list projection before the next request is issued — there is no queue, no polling and no eventual-consistency window anywhere in the fan-out.
    test_recipe:
      setup:
      - A COLD_MARINE plant serving two interaction-enabled exhibits; two SCHEDULED sessions on the first exhibit (2026-08-02 10:00-11:00 and 2026-08-02 11:30-12:30) and one on the second. The plant is NORMAL. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_a: $.data.id, exa_v1: $.data.version}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-2, name: Kelp Forest, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100, interaction_program_enabled: true}
        as: CuratorOfCollections
        captures: {ex_b: $.data.id, exb_v1: $.data.version}
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.01, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_a}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {sess_a1: $.data.id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_a}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T11:30:00Z', ends_at: '2026-08-02T12:30:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {sess_a2: $.data.id}
      - call: POST /aquarium/interaction-sessions
        payload: {exhibit_id: '${ex_b}', program_type: FEEDING_ENCOUNTER, starts_at: '2026-08-02T10:00:00Z', ends_at: '2026-08-02T11:00:00Z', max_guests: 6, guest_count: 4, safety_briefing_confirmed: true}
        as: AquaristTechnician
        captures: {sess_b1: $.data.id}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/water-quality-readings
        payload: {taken_at: '2026-08-01T00:00:00Z', temperature_c: 12.0, salinity_ppt: 33.0, ph: 8.1, dissolved_oxygen_mg_l: 7.4, ammonia_mg_l: 0.06, nitrite_mg_l: 0.02}
        as: AquaristTechnician
      - call: GET /aquarium/life-support-systems/${lss_id}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_a}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_b}
        payload: {}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits
        payload: {posture: CLOSED, limit: 10}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_a}/interaction-sessions
        payload: {status: SUSPENDED, limit: 10}
        as: AquaristTechnician
      - call: GET /aquarium/interaction-sessions/${sess_b1}
        payload: {}
        as: AquaristTechnician
      assert:
      - the CRITICAL reading returns HTTP 201 with severity CRITICAL
      - the very next read shows LifeSupportSystem.alarm_state == CRITICAL with consecutive_breach_readings == 1 and consecutive_normal_readings == 0
      - both exhibits already report posture == CLOSED with last_posture_reason == LSS_CRITICAL
      - ${ex_a} already reports suspended_session_count == 2 and interaction_program_enabled == false (CASCADE A link 5 fired in the same request); ${ex_b} reports suspended_session_count == 1 and interaction_program_enabled == true
      - the posture-filtered exhibit list already returns total_count == 2
      - the SUSPENDED session list for ${ex_a} returns total_count == 2 with suspension_reason == EXHIBIT_CLOSED on both, ordered by created_at ASC
      - ${sess_b1}.status == SUSPENDED as well — no dependent projection lags behind the write
