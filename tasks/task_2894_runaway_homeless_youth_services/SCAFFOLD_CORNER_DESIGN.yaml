            - "GovernanceProposal.${gov_prop_id}.support_ratio_bp == 10000"
            - "GovernanceProposal.${gov_prop_id}.support_vote_count == 1"
            - "GovernanceProposal.${gov_prop_id}.adopted_at == null"
            - "GovernanceVote.${gov_vote_id}.status == COUNTED"

      - name: reunification_mediation_loop_is_bounded_by_max_rounds
        claim_type: valid_transition
        grounds:
          - state_machines.ReunificationCase.MEDIATION_HELD_to_MEDIATION_SCHEDULED
          - validations[priority=36]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: reunification_case_mediation_cycle_bounded_at_three_rounds
          rationale: "The MEDIATION_HELD -> MEDIATION_SCHEDULED -> MEDIATION_HELD loop and its max_mediation_rounds ceiling (ERR_MEDIATION_ROUNDS_EXHAUSTED) are already driven end to end by that difficulty instance, which walks all three rounds and then asserts the fourth scheduling attempt is refused. A corner test would only repeat the same call sequence with fewer rounds."

      - name: tlp_tenancy_and_compliance_dimensions_are_independent
        claim_type: valid_transition
        grounds:
          - state_machines.TlpPlacement.transitions
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: tlp_placement_parallel_tenancy_and_compliance_dimensions_move_independently
          rationale: "That difficulty instance already moves compliance_status across IN_COMPLIANCE / SAVINGS_DEFICIENT / PROBATION while tenancy_status stays PLACED, and then shows the single documented coupling (two consecutive PROBATION reviews give notice) without the reverse coupling. Any corner test of the parallel dimensions would be a strict subset of it."

      - name: discharge_cascade_promotes_a_waitlisted_admission
        claim_type: side_effect_execution
        grounds:
          - state_machines.Admission.ACTIVE_to_DISCHARGED
          - state_machines.Admission.WAITLISTED_to_ACTIVE
          - calculations.program_posture
        excluded_because:
          difficulty_instance: discharge_releases_bed_then_promotes_waitlist_then_creates_notification
          rationale: "The five-hop discharge cascade - bed released, posture recomputed, selector-chosen waitlisted admission promoted, its GuardianNotification created, that youth's risk_posture flipped to RESTRICTED - is asserted hop by hop in that difficulty instance, including the selector's priority_score DESC ordering. A corner instance cannot add an independent observation."

      - name: reunification_approval_cascade_waives_and_schedules_discharge
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReunificationCase.HOME_ASSESSMENT_to_APPROVED
          - state_machines.Admission.ACTIVE_to_DISCHARGE_SCHEDULED
          - state_machines.GuardianNotification.PENDING_to_WAIVED
        excluded_because:
          difficulty_instance: reunification_approval_waives_notification_then_schedules_discharge
          rationale: "The four-hop approval cascade (aftercare due stamp, Youth -> REUNIFIED_PENDING, Admission -> DISCHARGE_SCHEDULED, GuardianNotification -> WAIVED with reason COURT_ORDER and the resulting program posture recompute) is fully asserted by that difficulty instance, which also pins the DECLINE branch as the no-cascade contrast."

  - section: calculations
    instances:
      - name: youth_age_years_counts_the_birthday_itself
        claim_type: precision
        grounds:
          - calculations.youth_age_years
          - entities.Youth.fields.age_years
        distinguishing_aspect: "youth_age_years uses >= on the (month, day) pair, so at clock 2026-08-01 a youth born 2010-08-01 is already 16 while a youth born 2010-08-02 is still 15 - the birthday itself counts as the new age."
        test_recipe:
          setup:
            - "the logical clock is at its default 2026-08-01T00:00:00Z"
            - "one youth born exactly on the clock's month and day (2010-08-01)"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "OnBirthday", legal_last_name: "Case", date_of_birth: "2010-08-01", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { age_on_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "DayAfter", legal_last_name: "Case", date_of_birth: "2010-08-02", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { age_after_id: $.data.id }
          assert:
            - "the request returns HTTP 201"
            - "Youth.${age_on_id}.age_years == 16"
            - "Youth.${age_after_id}.age_years == 15"

      - name: program_posture_turns_restricted_on_a_single_overdue_notification
