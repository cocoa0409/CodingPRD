            - "GET /peds/service-lines filtered by encounter_id ${enc_id} returns 0 rows"

      - name: corner_parent_reading_another_household_returns_not_resource_owner
        claim_type: role denial
        grounds:
          - validations[priority=19]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Parent
        distinguishing_aspect: "Parent identity is entity_backed on Family, so X-User-ID must equal the Family.id reached from the resource: a Parent whose X-User-ID is family F2 reading a child of family F1 gets ERR_NOT_RESOURCE_OWNER 403, while reading their own child succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "Family F1 with child A and family F2 with child B"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
