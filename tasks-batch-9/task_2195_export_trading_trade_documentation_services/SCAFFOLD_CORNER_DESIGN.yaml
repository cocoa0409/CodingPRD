              payload: { expected_letter_of_credit_version: "${lc_v}" }
              captures: { review_id: "$.data.id", review_status: "$.data.status", reviewer: "$.data.reviewer_user_id" }
          assert:
            - "captured_by == \"u_dual_dana\" — the capturing user id is stamped on the credit at creation"
            - "err_self_review == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 409: the role was permitted, the version was current, and only the user identity is objectionable"
            - "the second call returns HTTP 201 with review_status == \"DRAFTING\" and reviewer == \"u_rev_bob\", and the credit moves RECEIVED to UNDER_REVIEW"
            - "exactly one LCTermsReview row exists for the credit — neither rejected attempt created one"
      - name: corner_no_document_preparer_may_examine_a_presentation_that_carries_its_own_paper
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_17
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.TradeDocument.fields.generated_by_user_id
          - entities.PresentationDocumentLink.fields.link_status
          - state_machines.DocumentPresentation.transitions.PRESENTED_to_COMPLIED
        distinguishing_aspect: "The examine gate walks every ACTIVE PresentationDocumentLink to its TradeDocument.generated_by_user_id, so a tender assembled by two different preparers bars BOTH of them; the untainted reviewer passes even though that same reviewer authored the credit's terms review, because priority 17 says nothing about review authorship."
